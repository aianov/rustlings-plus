[workspace]
resolver = "3"
members = ["src/crates/*", "tools/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
contracts = { path = "src/crates/contracts" }
social-core = { path = "src/crates/social-core" }
test-support = { path = "src/crates/test-support" }
service-runtime = { path = "src/crates/service-runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"

[profile.release]
lto = true
codegen-units = 1
