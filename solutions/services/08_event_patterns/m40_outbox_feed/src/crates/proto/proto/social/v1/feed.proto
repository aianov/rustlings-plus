syntax = "proto3";

package social.v1;

import "social/v1/posts.proto";

// Сервис ленты: своя проекция авторов, подписок и постов, собранная из событий
// stream SOCIAL_EVENTS. Читатель приходит в метаданных x-user-id.
service Feeds {
  // Посты тех, на кого подписан читатель (кроме скрытых), и его собственные;
  // новые первыми. Имя автора на момент чтения: отображаемое имя, если оно есть.
  // Проекция догоняет события с небольшой задержкой: только что созданный пост
  // может появиться в ленте не сразу.
  rpc Page(FeedRequest) returns (FeedReply);
}
