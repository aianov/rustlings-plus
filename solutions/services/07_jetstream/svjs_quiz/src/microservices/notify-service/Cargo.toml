[package]
name = "notify-service"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
nats-engine = { path = "../../crates/nats-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[dev-dependencies]
async-nats = "=0.36.0"
futures = "0.3"
tokio = { version = "1", features = ["full", "test-util"] }
