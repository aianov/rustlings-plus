syntax = "proto3";

package social.v1;

// Личные сообщения. Отправитель приходит в метаданных x-user-id. Доставку на устройства
// делает не этот сервис: сообщение уходит в stream чата, шлюзы получают его оттуда.
service Chat {
  // Собеседника нет в Users: NOT_FOUND, пустое, длинное или себе: FAILED_PRECONDITION.
  rpc Send(SendRequest) returns (Message);
  // Последние limit сообщений диалога с peer_id, старые первыми.
  rpc History(HistoryRequest) returns (HistoryReply);
  // «x-user-id печатает» для peer_id: не чаще раза в 3 секунды на пару, без хранения.
  // sent = false, если пара уже писала недавно. Собеседника нет: NOT_FOUND, себе: FAILED_PRECONDITION.
  rpc Typing(TypingRequest) returns (TypingReply);
}

message SendRequest {
  uint64 peer_id = 1;
  string text = 2;
}

message Message {
  uint64 from_id = 1;
  uint64 to_id = 2;
  string text = 3;
}

message HistoryRequest {
  uint64 peer_id = 1;
  uint32 limit = 2;
}

message HistoryReply {
  repeated Message messages = 1;
}

message TypingRequest {
  uint64 peer_id = 1;
}

message TypingReply {
  bool sent = 1;
}
