[package]
name = "files"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bytes = "1"
futures = "0.3"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "rt", "macros", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
