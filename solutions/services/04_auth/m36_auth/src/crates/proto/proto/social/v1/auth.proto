syntax = "proto3";

package social.v1;

// Сервис учётных записей. Регистрация, вход и выход живут в его HTTP,
// по gRPC другие сервисы только проверяют токены и узнают владельцев.
service Auth {
  // Чей это токен. Подпись, срок, издатель, аудитория и список отозванных проверяет
  // auth-service. Просроченный: UNAUTHENTICATED с x-error-code expired, остальное:
  // UNAUTHENTICATED с unauthorized.
  rpc ValidateToken(ValidateTokenRequest) returns (Account);
  // Учётная запись по id. Нет такой: NOT_FOUND.
  rpc GetAccount(GetAccountRequest) returns (Account);
}

message ValidateTokenRequest {
  string token = 1;
}

message GetAccountRequest {
  uint64 user_id = 1;
}

message Account {
  uint64 user_id = 1;
  string username = 2;
  // guest, user, moderator или admin; незнакомая строка это guest.
  string role = 3;
}
