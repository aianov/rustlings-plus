syntax = "proto3";

package social.v1;

// Личные сообщения. Отправитель приходит в метаданных x-user-id. Доставку на устройства
// делает не этот сервис: сообщение уходит в stream чата, шлюзы получают его оттуда.
service Chat {
  // Собеседника нет в Users: NOT_FOUND, пустое, длинное или себе: FAILED_PRECONDITION.
  rpc Send(SendRequest) returns (Message);
  // Последние limit сообщений диалога с peer_id, старые первыми.
  rpc History(HistoryRequest) returns (HistoryReply);
  // «x-user-id печатает» для peer_id: не чаще раза в 3 секунды на пару, без хранения.
  // sent = false, если пара уже писала недавно. Собеседника нет: NOT_FOUND, себе: FAILED_PRECONDITION.
  rpc Typing(TypingRequest) returns (TypingReply);
  // Чаты вызывающего, самые свежие первыми.
  rpc Chats(ChatsRequest) returns (ChatsReply);
  // Вся переписка с peer_id потоком, новые первыми.
  rpc ExportChat(HistoryRequest) returns (stream Message);
  // Правка своего сообщения: поздняя старая правка не затирает новую.
  rpc EditMessage(EditMessageRequest) returns (EditReply);
  // Всё в диалоге с peer_id прочитано.
  rpc MarkRead(PeerRequest) returns (EditReply);
}

message SendRequest {
  uint64 peer_id = 1;
  string text = 2;
  // Исчезающее сообщение: живёт столько секунд; 0 значит навсегда.
  uint32 ttl_seconds = 3;
}

message Message {
  uint64 from_id = 1;
  uint64 to_id = 2;
  string text = 3;
  // timeuuid сообщения; пусто без Scylla.
  string id = 4;
  bool edited = 5;
}

message HistoryRequest {
  uint64 peer_id = 1;
  uint32 limit = 2;
  // Непрозрачный курсор из HistoryReply.next: страница старше прошлой, новые первыми.
  string cursor = 3;
}

message HistoryReply {
  repeated Message messages = 1;
  // Курсор следующей, более старой страницы; пусто, если дальше нет или хранилище без страниц.
  string next = 2;
}

message TypingRequest {
  uint64 peer_id = 1;
}

message TypingReply {
  bool sent = 1;
}

message ChatsRequest {
  uint32 limit = 1;
}

message ChatSummary {
  uint64 peer_id = 1;
  uint64 last_at = 2;
  string preview = 3;
  // Непрочитанные, не больше 100: 100 значит «99+».
  uint32 unread = 4;
}

message ChatsReply {
  repeated ChatSummary chats = 1;
}

message EditMessageRequest {
  uint64 peer_id = 1;
  string message_id = 2;
  string text = 3;
}

message PeerRequest {
  uint64 peer_id = 1;
}

message EditReply {
  bool changed = 1;
}
