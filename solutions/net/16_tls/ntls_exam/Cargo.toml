[package]
name = "metricsd"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
tonic = { version = "=0.14.6", features = ["tls-ring"] }
tonic-prost = "=0.14.6"
tonic-health = "=0.14.6"
prost = "=0.14.4"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }

[build-dependencies]
tonic-prost-build = "=0.14.6"

[dev-dependencies]
rcgen = { version = "=0.13.2", default-features = false, features = ["ring", "pem"] }
