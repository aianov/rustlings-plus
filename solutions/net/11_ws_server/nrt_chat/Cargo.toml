[package]
name = "chat-gateway"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
serde_json = "1"
http-engine = { path = "websocket-engine/http-engine" }
websocket-engine = { path = "websocket-engine" }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
