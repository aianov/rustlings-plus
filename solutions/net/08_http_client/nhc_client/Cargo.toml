[package]
name = "http-client"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "fetch"
path = "src/bin/fetch.rs"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
