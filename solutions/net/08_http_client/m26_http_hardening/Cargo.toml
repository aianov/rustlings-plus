[workspace]
resolver = "3"
members = ["src/crates/*", "src/microservices/*", "tools/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
contracts = { path = "src/crates/contracts" }
social-core = { path = "src/crates/social-core" }
test-support = { path = "src/crates/test-support" }
framing = { path = "src/crates/framing" }
http-engine = { path = "src/crates/http-engine" }
http-client = { path = "src/crates/http-client" }
minifuzz = { path = "src/crates/minifuzz" }
getrandom = "0.3"
social-cli = { path = "tools/social-cli" }
bytes = "1"
service-runtime = { path = "src/crates/service-runtime" }
futures = { version = "0.3", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "io-util", "fs", "net", "signal"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"

[profile.release]
lto = true
codegen-units = 1
