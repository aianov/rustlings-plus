[package]
name = "ntx-tower-layer"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
tonic = "=0.14.6"
tonic-prost = "=0.14.6"
prost = "=0.14.4"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
tower = { version = "0.5", default-features = false }
http = "1"

[build-dependencies]
tonic-prost-build = "=0.14.6"
