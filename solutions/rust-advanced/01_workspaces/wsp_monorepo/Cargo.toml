[workspace]
resolver = "3"
members = ["src/crates/*", "src/microservices/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
serde_json = "1"
contracts = { path = "src/crates/contracts" }
text-engine = { path = "src/crates/text-engine" }
store-engine = { path = "src/crates/store-engine" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
