[workspace]
resolver = "3"
members = ["crates/model", "crates/store", "tools/dump"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
model = { path = "crates/model" }
store = { path = "crates/store" }

[workspace.lints.rust]
unsafe_code = "forbid"
