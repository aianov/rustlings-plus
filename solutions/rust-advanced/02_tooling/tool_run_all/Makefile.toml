[config]
default_to_workspace = false

[env]
SERVICE_SLEEP_MS = "3000"

[tasks.build-all]
command = "cargo"
args = ["build", "--workspace"]

[tasks.api]
command = "cargo"
args = ["run", "--quiet", "-p", "api"]

[tasks.auth]
command = "cargo"
args = ["run", "--quiet", "-p", "auth"]

[tasks.worker]
command = "cargo"
args = ["run", "--quiet", "-p", "worker"]

[tasks.run-all]
dependencies = ["build-all"]
run_task = { name = ["api", "auth", "worker"], parallel = true }
