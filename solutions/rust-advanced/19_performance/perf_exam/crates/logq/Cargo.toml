[package]
name = "logq"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["json"]
json = ["dep:serde", "dep:serde_json"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[lints.rust]
unsafe_code = "deny"
