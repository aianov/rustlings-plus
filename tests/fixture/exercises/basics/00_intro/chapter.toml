[[exercises]]
name = "q_order"
kind = "question"
question.en = """What does this print?
```rust
println!("{}", 1 + 1);
```"""
question.ru = """Что напечатает программа?
```rust
println!("{}", 1 + 1);
```"""
options = ["1", "2", "11"]
answer = [1]
explain.en = "Integers add up, so it prints 2."
explain.ru = "Целые числа складываются, поэтому будет 2."

[[exercises]]
name = "q_multi"
kind = "question"
question = "Which of these are integer types?"
options = ["i32", "f64", "u8"]
answer = [0, 2]
explain = "i32 and u8 are integers, f64 is a float."

