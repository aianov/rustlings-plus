[chapter]
title.en = "Realtime delivery across gateways"
title.ru = "Доставка в реальном времени через несколько шлюзов"

[[chapter.visuals]]
file = "visuals/realtime_delivery.html"
title.ru = "От события до устройств: подписка на пользователя на каждом шлюзе"

[[chapter.visuals]]
file = "visuals/reconnect_gap.html"
title.ru = "Догон после обрыва: подписка, история, склейка по номерам"

[[exercises]]
name = "svrt1"
style = "todo"
hint.ru = '''Нужна вложенная карта: пользователь, а внутри неё номер соединения и отправитель канала. Номер выдаёт реестр, один счётчик на весь реестр, а не по пользователю. Отправка возвращает число тех, кому `send` не вернул ошибку.'''
why.ru = '''Реестр отвечает на один вопрос: куда доставить сообщение пользователю. Устройств у него может быть сколько угодно, поэтому ключ внутри пользователя это номер соединения, а не сам пользователь. Номера общие на весь реестр, чтобы закрытие одного соединения никогда не закрыло чужое. Результат отправки это число принявших: по нему шлюз знает, что пользователь на самом деле недоступен.'''

[[exercises]]
name = "svrt2"
style = "bughunt"
hint.ru = [
  '''Где реестр узнаёт, что соединение умерло? Тот, кто закрыл приложение, ничего не сообщил. А ещё посмотри на пользователя, у которого соединений не осталось: что от него хранится?''',
  '''Узнать о смерти получателя можно в момент отправки: канал отвечает ошибкой. Значит, отправке нужно право убирать: пройдись по соединениям пользователя с `retain`, а пустого пользователя убери совсем. То же с `unregister`. Чтобы убирать, отправке понадобится `&mut self`: тесты это выдержат.''',
]
why.ru = '''Мёртвые соединения не сообщают о смерти, поэтому реестр должен замечать их сам, там, где с ними всё равно приходится работать: при отправке. Запись о пользователе без соединений тоже мусор, она же ломает «в сети»: онлайн это «есть хотя бы одно живое соединение», а не «ключ есть в карте». Утечка здесь медленная и потому опасная: тесты на малой нагрузке проходят, а процесс неделю спустя упирается в память.'''

[[exercises]]
name = "svrt3"
style = "todo"
requires = ["nats"]
hint.ru = [
  '''Три действия в `connect`: проверить ник, подписаться, убедиться, что брокер подписку принял. Для последнего у тебя уже есть `settle`. Что получится, если пропустить его на медленной сети?''',
  '''Пересылку делай отдельной задачей и остановку передавай через `oneshot`. В `disconnect` недостаточно сказать «стоп»: дождись конца задачи, отпиши подписку (`unsubscribe`) и сделай круг до брокера, иначе брокер ещё какое-то время считает шлюз подписчиком.''',
]
why.ru = '''Тема пользователя строится из его ника, поэтому ник проверяется до подписки: звёздочка в нике превращает подписку в пылесос, который собирает события всех. Возврат из connect должен значить «брокер уже знает про подписку», иначе первое же событие после подключения теряется на медленной связи. Отписка проверяется тем же приёмом, что и подписка: после disconnect в брокере подписчика уже нет, а не «скоро не будет».'''

[[exercises]]
name = "svrt4"
style = "fix"
requires = ["nats"]
hint.ru = [
  '''Сколько подписок создаётся для пользователя с тремя устройствами? И сколько копий одного события получает шлюз? Сравни с тем, сколько должно быть.''',
  '''Подписка принадлежит пользователю на этом шлюзе, а не соединению: храни её по нику вместе со счётчиком устройств. Первое соединение создаёт, последнее снимает. Следи, чтобы два одновременных первых подключения не создали по подписке (держи блокировку на всё время подписки).''',
]
why.ru = '''Подписка в брокере стоит ресурсов и на брокере, и на шлюзе, а количество устройств у пользователя ничем не ограничено. Счётчик ссылок («первый создаёт, последний снимает») делает цену подписки равной числу пользователей на шлюзе, а не числу соединений. Одновременные подключения это место, где счётчик ссылок обычно ломается: проверка «есть ли подписка» и её создание должны идти под одной блокировкой, иначе обе вкладки откроют по подписке.'''

[[exercises]]
name = "svrt_q1"
kind = "question"
question.ru = '''Шлюз реализован так: на каждое WebSocket-соединение своя подписка на тему пользователя, и каждая подписка рассылает событие всем соединениям пользователя. Бобу пишут один раз. У Боба открыты 3 вкладки на этом шлюзе. Сколько копий получит каждая вкладка?'''
options.ru = [
  '''одну: брокер доставляет событие один раз на пользователя''',
  '''три: подписок три, и каждая рассылает событие всем трём вкладкам''',
  '''девять: по одной копии от каждой подписки для каждой пары вкладок''',
  '''ни одной: при нескольких подписках брокер отбрасывает события как дубль''',
]
answer = [1]
explain.ru = '''Брокер доставляет копию каждой подписке, а их три. Каждая подписка отправляет полученное всем трём вкладкам, поэтому каждая вкладка видит три копии (всего девять доставок, но на одну вкладку приходится три). Лечится счётчиком: одна подписка на пользователя на шлюз, пока есть хотя бы одна вкладка.'''
hint.ru = '''Сколько копий события создаёт брокер для шлюза и что шлюз делает с каждой?'''

[[exercises]]
name = "svrt5"
style = "scratch"
hint.ru = [
  '''В карте нужно хранить время последнего сигнала для каждого устройства каждого пользователя. Живо ли устройство, решает сравнение со временем сейчас и ttl. На какой стороне границы оказывается момент ровно через ttl?''',
  '''Новый сигнал не должен сокращать жизнь: бери большее из старого и нового времени. Выбрасывая устройство, не оставляй пустую запись пользователя: `purge` должен возвращать память к нулю.''',
]
why.ru = '''Присутствие нельзя строить на явных «зашёл» и «вышел»: «вышел» не приходит, когда телефон сел в метро или процесс упал. Поэтому живость задаётся сроком: устройство в сети, пока сигнал свежий, и пропадает само. В продакшене это ключ в KV с TTL, и закон тот же. Границу выбирают явно (в момент now = last + ttl уже не жив), а запоздавший сигнал, пришедший в обратном порядке, не должен сокращать жизнь.'''

[[exercises]]
name = "svrt6"
style = "bughunt"
hint.ru = [
  '''Что делает шлюз после `connect`, чтобы пользователь оставался в сети? И чем отличаются устройства Алисы на разных шлюзах, если у обоих первое соединение имеет номер 1?''',
  '''Идентификатор устройства в присутствии должен быть уникален на всю систему: подойдёт пара «шлюз и соединение». `tick` проходит по открытым соединениям и шлёт сигнал за каждое. Закрытие убирает одно устройство, а не пользователя.''',
]
why.ru = '''Присутствие хранится в общем месте, а пишут в него все шлюзы, поэтому идентификатор устройства обязан быть уникальным для всей системы, а не для процесса: номера соединений на двух шлюзах совпадают, и без префикса шлюз перезаписывает чужие устройства. Сигнал шлёт тот, кто знает, что соединение живо, и шлёт регулярно, иначе пользователь исчезнет сам через ttl. А шлюз, который упал, молчит, и этого достаточно: ничьё «до свидания» не нужно.'''

[[exercises]]
name = "svrt_q2"
kind = "question"
question.ru = '''ttl присутствия 30 секунд. Шлюз присылает сигнал «я жив» за каждое соединение раз в N секунд. Нужно, чтобы одна потерянная пачка сигналов не выбрасывала пользователя из сети. Какое N разумно?'''
options.ru = [
  '''30: сигнал ровно на границе ttl, так проще считать''',
  '''10: за ttl успевают три сигнала, одна потеря ничего не ломает''',
  '''1: чем чаще, тем надёжнее, нагрузка не в счёт''',
  '''60: реже, чтобы разгрузить хранилище; пользователь пусть чуть мигает''',
]
answer = [1]
explain.ru = '''Сигнал с периодом, равным ttl, живёт на границе: любая задержка роняет пользователя в офлайн. Период в треть ttl даёт запас на один потерянный сигнал (два подряд уже уронят пользователя, для этого берут четверть). Слишком частые сигналы нагружают хранилище зря (тысячи соединений умножаются на частоту), а период длиннее ttl гарантирует мигание. Про запас по числу сигналов стоит думать с самого начала.'''
hint.ru = '''Сколько сигналов должно пройти внутри ttl, чтобы потеря одного не стала заметна?'''

[[exercises]]
name = "svrt7"
style = "scratch"
requires = ["nats"]
hint.ru = [
  '''Сообщения в stream пронумерованы. Нужен читатель, который начинает с нужного номера и смотрит только тему этого пользователя: подумай, как это задать в настройках consumer.''',
  '''`DeliverPolicy::ByStartSequence { start_sequence }` с номером на единицу больше последнего виденного и `filter_subject` с темой пользователя. Номер сообщения в ответе берётся из `message.info()?.stream_sequence`. Не забудь удалить consumer после чтения. Конец истории определяй по `num_pending` из `consumer.info()`, а не по таймауту.''',
]
why.ru = '''Догон это просто запрос «дай всё после номера N» к журналу, а журнал уже есть. Номер, который клиент называет, это номер в stream, поэтому и в ответе нужны они же, а не позиции в списке: по ним клиент потом склеивает историю с живым потоком. Читатель на запрос временный, и его надо убирать за собой, иначе каждый догон оставляет запись в брокере, а догонов тысячи в минуту. Постраничность через limit и последний номер страницы делает догон ограниченным по памяти.'''

[[exercises]]
name = "svrt8"
style = "fix"
hint.ru = [
  '''Выпиши по шагам, что видит шлюз, и отметь, когда можно сообщению №8 пройти мимо: после чтения истории, но до подписки. Кто его поймает в этой щели?''',
  '''Поменяй порядок: подписка раньше истории. Теперь одно и то же сообщение может оказаться и в истории, и в живом потоке: сортируй по номеру и выбрасывай всё, что не больше уже отданного. После истории забери из живого потока всё накопившееся.''',
]
why.ru = '''Между «прочитал историю» и «подписался» всегда есть щель, и в неё кто-нибудь да пишет. Закрывается она только порядком: сначала подписка (она копит живое, пока мы читаем историю), потом история, потом склейка. Цена порядка это дубли, и лекарство от них бесплатное, потому что у каждого сообщения есть номер: отбрасываем всё, что не больше уже отданного. Именно так «ровно один раз» получается из «хотя бы раз» с номерами.'''

[[exercises]]
name = "svrt_q3"
kind = "question"
question.ru = '''Счётчик непрочитанных на значке приложения при возвращении онлайн собирается так: запросить из базы число непрочитанных, затем подписаться на новые события и увеличивать счётчик на каждое. Иногда после возвращения значок показывает на единицу меньше настоящего. Почему и как исправить?'''
options.ru = [
  '''база отвечает с задержкой; надо ждать ответ дольше и только потом подписываться''',
  '''событие, пришедшее между запросом и подпиской, потеряно; сначала подписаться, потом запросить число, учесть пришедшее''',
  '''подписка слишком медленная; достаточно повторять запрос числа каждую секунду''',
  '''событие посчитано дважды; достаточно вычитать единицу после каждого запроса к базе''',
]
answer = [1]
explain.ru = '''Это та же щель, что при догоне истории: событие, пришедшее между чтением и началом подписки, не видит ни запрос, ни подписка. Порядок «подписка, запрос, склейка» её закрывает. При склейке придётся различать события, уже учтённые в числе из базы, и новые: нужен номер последнего события, учтённого в базе. Периодический опрос и поправки на единицу прячут симптом, но не причину.'''
hint.ru = '''Кто увидит событие, которое пришло после запроса к базе, но до начала подписки?'''

[[exercises]]
name = "svrt9"
style = "fix"
requires = ["nats"]
hint.ru = [
  '''Кто, кроме шлюза, где нажали «выйти», должен узнать об отзыве? Через что им сообщить? Подумай и о том, что шлюз должен слышать отзывы с момента, как `start` вернулся.''',
  '''Шлюз подписывается на тему отзывов при старте (с кругом до брокера) и закрывает соединения по каждому сообщению. `logout` сам закрывает свои соединения сразу и публикует отзыв всем остальным, включая себя: повтор безвреден. Запоминай отозванные сессии (ограниченно), чтобы отвергать новые попытки.''',
]
why.ru = '''Выход должен действовать везде, а соединения живут на разных шлюзах, поэтому отзыв это событие: шлюзы подписаны и закрывают у себя. Локально закрываем сразу, не дожидаясь сети: пользователь нажал «выйти» и ждёт результата. Отзыв хранится в памяти шлюза ограниченное время, чтобы не пустить сессию обратно, пока токен ещё не истёк сам; память ограничена, потому что отзывов бывает много. Как и везде, `start` возвращается после круга до брокера: иначе отзыв, пришедший сразу, пролетит мимо.'''

[[exercises]]
name = "svrt10"
style = "todo"
requires = ["nats"]
hint.ru = [
  '''Два канала с разной ценой потери. Сообщение идёт через JetStream: подтверждение записи нужно и оно же возвращает номер. «Печатает» идёт обычной публикацией. Какая из тем должна совпадать с тем, что ловит stream, а какая нет?''',
  '''Идентификатор сообщения клиента кладётся в заголовок `Nats-Msg-Id` (константа `async_nats::header::NATS_MESSAGE_ID`), номер берётся из подтверждения (`sequence`). Для «печатает» запоминай время последней публикации по паре комната и пользователь и сравнивай с `TYPING_GAP_MS`.''',
]
why.ru = '''Не всё нужно хранить, и выбор канала по цене потери спасает и диск, и нервы. «Печатает» бессмысленно через секунду, поэтому идёт мимо журнала и с ограничением частоты: сотня нажатий клавиш это не сотня событий. Сообщение терять нельзя: JetStream с подтверждением, а идентификатор клиента в Nats-Msg-Id делает повтор отправки (потерялся ответ) безопасным. Разные темы для этих двух видов, чтобы stream никогда не поймал эфемерное.'''

[[exercises]]
name = "svrt_q4"
kind = "question"
question.ru = '''Какие из трёх возможностей чата стоит отправлять эфемерно (обычной публикацией, без хранения): (а) «Боб печатает…», (б) «у вас новое сообщение», от которого клиент увеличивает значок на единицу, (в) «Алиса прочитала сообщения до №120»?'''
options.ru = [
  '''только (а): всё остальное должно переживать перезапуск''',
  '''(а) и (б): оба устаревают сразу, потеря уведомления никому не заметна''',
  '''все три: чат всё равно сохраняет сообщения, остальное восстановится''',
  '''ни одну: любое событие чата должно быть надёжным''',
]
answer = [0]
explain.ru = '''«Печатает» теряет смысл через секунду, его не жалко потерять и вредно хранить. Уведомление, от которого значок растёт на единицу, накапливается: потерянное даёт неверное число навсегда, пока клиент не пересчитает всё по базе, поэтому ему нужен надёжный канал. Отметка «прочитано до №120» это состояние, которое должно пережить перезапуск и дойти до собеседника. Эфемерное это то, что устаревает быстрее, чем его стоило бы хранить.'''
hint.ru = '''Что случится, если событие потеряется, и что, если его сохранить на сутки?'''

[[exercises]]
name = "svrt_quiz"
kind = "project"
quiz = true
style = "scratch"
locked = ["src/microservices/api-gateway/tests/acceptance.rs"]
hint.ru = [
  '''Начни с `ChatService`: он короткий и даёт тестам сообщения. Потом в шлюзе `connect` без догона, `disconnect` и `pump`: подписка на пользователя по счётчику устройств, доставка всем устройствам. Догон, присутствие и отзыв добавляй после.''',
  '''В `connect` с `resume_from` порядок такой: подписка (она уже есть или создаётся), регистрация соединения «в догоне» (живое копится в `held`), история, затем всё накопившееся через проверку номера. Номер последнего отданного соединению хранится в самом соединении.''',
  '''`close` (одно соединение) используй и в `disconnect`, и при отзыве: он убирает запись о соединении, присутствие и ссылку на подписку, а при нуле ссылок снимает подписку. `logout` закрывает локально сразу и публикует отзыв, остальные шлюзы узнают в `pump`.''',
]
why.ru = '''Здесь собирается всё из главы: подписка на пользователя считается устройствами (одна на шлюз), доставка идёт через реестр, присутствие живёт на сигналах и не зависит от упавших шлюзов, догон подписывается раньше, чем читает историю, и склеивает по номерам, отзыв сессии летит по шине ко всем шлюзам. Эфемерное («печатает») идёт мимо журнала, надёжное с номерами. Каждая гарантия держится на своём приёме, и тесты проверяют их по отдельности, чтобы поломка одной не пряталась за другой.'''

[[exercises]]
name = "m41_multi_gateway"
kind = "milestone"
journey = "backend"
quiz = true
