test_command = ["cargo", "make", "check"]
requires = ["nats"]
hint.ru = [
"""Начни с nats-engine: `republish` в `StreamSpec` и `live()`. Убедись, что живое сообщение приходит с номером: заголовок
`Nats-Sequence` у async-nats стандартный, искать его надо константой `async_nats::header::NATS_SEQUENCE`, строкой он
не найдётся. История это обычный pull-читатель с `DeliverPolicy::ByStartSequence` и `AckPolicy::None`: возьми из
`cached_info()` его имя и `num_pending`, прочитай не больше нужного и удали читателя.""",
"""chat-service повторяет m40: строка журнала с outbox, релей с `Nats-Msg-Id` из строки. Только тема другая,
`topics.chat(агрегат)`, и stream свой, с повтором `<корень>.chat.>` в `<корень>.live.>`. Хаб и Subscribe удаляются
целиком: доставка теперь не забота chat-service.""",
"""В шлюзе счётчик подписок держи под `tokio::sync::Mutex`: открытие подписки ждёт круга до брокера, а проверка
«подписки нет» и её создание должны идти под одной блокировкой. Закрытие соединения синхронное (Drop), поэтому уход
устройства запускает задачу, которая уменьшит счёт, снимет подписку и удалит ключ присутствия.""",
"""Догон делай курсором в очереди соединения: `hold(after)` до регистрации, потом подписка, потом история с ожиданием
места в очереди (`send().await`, иначе длинная история переполнит очередь и отключит клиента), потом `release()`.
Отзыв приходит с идентификаторами сессий: у соединения в реестре лежит сессия из `ValidateToken`.""",
]
story.ru = """Шлюзов два, и соцсеть этого не замечает: сообщение приходит на все устройства на любом шлюзе ровно один
раз, «в сети» видно отовсюду и гаснет само, если шлюз упал, выход закрывает сессию везде, а вернувшийся из тоннеля
телефон получает всё пропущенное по порядку. «Печатает…» мелькает и нигде не хранится."""
