file = "visuals/lease_timeline.html"
title.ru = "Аренда: захват, продление, истечение и номер против двойного исполнения"

[[exercises]]
name = "svjob1"
style = "todo"
hint.ru = '''Ответ уходит сразу, значит, письмо должно жить дольше самого вызова `signup`. Какая функция запускает работу «на потом», и что она требует от захваченных значений? Подсказка про `Arc` и про владение: в задачу уходят копии, а не ссылки на аргументы.'''
why.ru = '''Фоновая работа не может держать ссылки на аргументы вызова: вызов закончится раньше неё, поэтому в задачу уходят клоны `Arc` и собственные строки. Регистрировать её в `Background` нужно, чтобы остановка сервиса могла дождаться отправок: иначе деплой молча убьёт письма, которые ещё в пути. Ошибку письма фон проглатывает осознанно: регистрация уже состоялась, а повтор письма это дело следующих задач главы (очередь с повторами).'''

[[exercises]]
name = "svjob_q1"
kind = "question"
question.ru = '''Сервис принимает заказы. После оплаты обработчик кладёт задачу «прислать чек» в `tokio::sync::mpsc::channel(1000)`, а отдельный воркер читает канал. В 14:00 в канале ждут 300 задач, и процесс убивают (OOM-killer). Контейнер поднимается заново через десять секунд. Что с задачами?'''
options.ru = [
  '''все 300 выполнятся после перезапуска''',
  '''все 300 пропадут, и та, что воркер делал в эту секунду, тоже''',
  '''пропадут только те, что воркер не успел начать''',
  '''выполнятся, потому что канал ограничен 1000 сообщений''',
]
answer = [1]
explain.ru = '''Канал живёт в памяти процесса, и вместе с процессом исчезает всё, что в нём лежало, а недоделанная текущая работа обрывается там, где была. Никто не узнает ни о потерянных задачах, ни о том, какие заказы остались без чека. Поэтому то, что нельзя потерять, ставят в очередь вне процесса: брокер помнит выданное и неподтверждённое и отдаст его снова.'''
hint.ru = '''Где физически лежат сообщения канала и что происходит с этой памятью при убийстве процесса?'''

[[exercises]]
name = "svjob2"
style = "scratch"
requires = ["nats"]
hint.ru = [
  '''Три функции. `ensure_queue` это настройки stream (у задач особое правило хранения). `enqueue` это публикация с ожиданием ответа брокера и заголовком, который не даёт записать одну задачу дважды. `work_once` это один круг воркера.''',
  '''В `work_once` порядок такой: достать одно сообщение (`fetch` на одно с коротким ожиданием), разобрать конверт, выполнить, и только потом ответить брокеру. Ответ зависит от исхода: подтвердить, вернуть, или «не возвращать» для того, что не разобралось.''',
  '''Для `enqueue`: `publish_with_headers`, заголовок `Nats-Msg-Id` равен номеру задачи, и ждать нужно оба `await`: отправку и подтверждение записи. Для ответов брокеру: `ack_with(AckKind::Ack | Nak(None) | Term)`.''',
]
why.ru = '''Подтверждение после работы даёт «хотя бы один раз»: упали посреди дела, и задача вернётся. Номер задачи в `Nats-Msg-Id` делает постановку идемпотентной внутри окна дубликатов, поэтому ретрай клиента не плодит копий. Нечитаемый конверт получает `Term`, потому что повтор его не починит, а `Nak` крутил бы мусор по кругу. WorkQueue хранит запись только до подтверждения: история выполненного в очереди не нужна.'''

[[exercises]]
name = "svjob3"
style = "bughunt"
hint.ru = [
  '''Выпиши по шагам, что происходит в `create_post` и в какой момент задача становится видна воркеру. А что видит воркер в базе в этот момент?''',
  '''Задача должна появиться в очереди только после коммита. Но и «коммит, потом постановка» ненадёжно: процесс может упасть между ними. В файле уже есть таблица задач в базе (`add_job`) и курьер `flush_outbox`.''',
  '''Положи задачу в таблицу в той же транзакции, что и пост (`tx.add_job`), закоммить, а потом вызови курьера. Не удалось поставить сейчас, доставит следующий проход курьера. Дубли гасит номер задачи.''',
]
why.ru = '''Транзакция и очередь это два разных хранилища, и атомарно записать в оба нельзя. Поэтому в базе, в той же транзакции, остаётся запись «задачу надо поставить», а ставит её уже отдельный шаг, который можно повторять до успеха. Из этого вытекают два условия: курьер вычёркивает строку только после подтверждения очереди, а очередь гасит дубли по номеру задачи: курьер имеет право доставить задачу дважды.'''

[[exercises]]
name = "svjob4"
style = "todo"
hint.ru = [
  '''Две функции. Пауза это степень двойки, умноженная на секунду, с потолком. Что произойдёт при номере попытки 100?''',
  '''Ограничь показатель степени до сдвига (потолок минуты наступает уже на седьмой попытке, дальше показатель расти незачем). Номера попыток начинаются с 1, поэтому первая пауза это ровно секунда. `decide` это `match` по результату; временную ошибку на последней попытке разбери раньше обычной временной.''',
]
why.ru = '''Пауза считается с ограничением показателя до сдвига, а не после: `1000 << 100` уже переполнилось, и `min` потом ничего не исправит. `decide` чистая функция без времени и очередей, поэтому её легко проверять и менять политику в одном месте. У исчерпанных попыток в причине остаются и число, и исходная ошибка: дежурный должен понять по записи, что произошло, не открывая логи.'''

[[exercises]]
name = "svjob_q2"
kind = "question"
question.ru = '''Воркер получил задачу «списать 5 бонусов у пользователя», списал их в базе (транзакция зафиксирована) и упал до `ack`. Выбери все верные утверждения.'''
options.ru = [
  '''после `ack_wait` брокер выдаст задачу снова''',
  '''если подтверждать до списания, то падение между подтверждением и списанием потеряет задачу''',
  '''если подтверждать после списания, двойное списание невозможно''',
  '''ключ повтора у операции списания (например, номер задачи) делает повторную выдачу безвредной''',
]
answer = [0, 1, 3]
explain.ru = '''Подтверждение после работы даёт «хотя бы один раз»: падение между действием и `ack` порождает повтор, поэтому утверждение про невозможность двойного списания неверно. Подтверждение до работы дало бы «не более одного раза»: потеря задачи вместо дубля. Рабочая схема соединяет подтверждение после работы с идемпотентным действием: операция запоминает ключ (номер задачи) и второй раз ничего не делает.'''
hint.ru = '''Что видит брокер в момент падения: ack был или нет?'''

[[exercises]]
name = "svjob5"
style = "bughunt"
hint.ru = [
  '''Запусти тесты и посмотри, сколько раз вызывается обработчик для удалённого пользователя и что лежит в мёртвой очереди после исчерпания попыток. Ошибок в воркере две, и они в разных местах.''',
  '''Первая в `classify`: что должно быть временным, а что нет? Таймаут и недоступность сервиса могут пройти сами, отсутствие пользователя и кривой конверт нет. Вторая в `tick`: что делает ветка `Dead`?''',
  '''Безнадёжным ошибкам нужен `JobError::Permanent`. А ветка `Dead` должна не подтверждать задачу, а передавать её в мёртвую очередь вместе с причиной (`term`).''',
]
why.ru = '''Классификация ошибок это часть логики задачи, и ошибаются в обе стороны: временную объявили постоянной, и письма теряются при каждой моргнувшей сети; постоянную объявили временной, и очередь вечно гоняет мусор. Вторая беда тише: если исчерпавшую попытки задачу подтвердить, она исчезнет без следа, и узнают об этом по жалобам пользователей. Мёртвая очередь существует, чтобы неудача была видна и разбирала её не машина, а человек.'''

[[exercises]]
name = "svjob6"
style = "scratch"
hint.ru = [
  '''Два случая внутри `tick`: срок ещё не пришёл и срок пришёл. Когда обработчик вызывать нельзя вообще?''',
  '''Если срок не наступил, задачу нужно вернуть в очередь так, чтобы она снова стала доступна ровно в `run_at`. Для этого очереди хватает одного `nak` с нужной паузой. Спать внутри нельзя: пока воркер ждёт одну задачу, остальные стоят.''',
  '''Пауза равна `run_at - now`. Обработчик не вызывается, функция возвращает `true` (что-то сделано). Дальше всё как в обычной ветке: `decide` по результату, `ack`, `nak` с паузой или `term`.''',
]
why.ru = '''Ожидание срока это возврат в очередь, а не сон в обработчике: воркер остаётся свободным, и готовые задачи не ждут отложенных. Один `nak` на всё оставшееся время важен из-за счётчика доставок: каждый возврат это ещё одна доставка, и опрос раз в секунду к моменту срока исчерпал бы попытки. Для сроков в недели и месяцы очередь не лучшее место, их держат в базе и ставят в очередь, когда срок близко.'''

[[exercises]]
name = "svjob_q3"
kind = "question"
question.ru = '''Consumer настроен с `max_deliver = 5`. Задача «закрыть неоплаченный заказ» должна выполниться через сутки. Воркер, получив её раньше срока, делает `nak` с паузой 30 секунд и так повторяет, пока не придёт время. Что в итоге случится с задачей?'''
options.ru = [
  '''выполнится через сутки, как задумано''',
  '''после пятой выдачи, примерно через две с половиной минуты, брокер перестанет её присылать, и задача не выполнится''',
  '''брокер сам поднимет `max_deliver`, когда увидит возвраты с паузой''',
  '''возвраты через `nak` в счётчик доставок не входят''',
]
answer = [1]
explain.ru = '''Каждая выдача сообщения, в том числе после `nak`, увеличивает счётчик доставок, а `max_deliver` ограничивает именно его. Опрос раз в 30 секунд исчерпает пять попыток за две с половиной минуты, и задача окажется потерянной тихо, без ошибки. Далёкий срок нельзя ждать возвратами: либо один `nak` на оставшееся время (если оно разумно), либо хранить задачу в базе до подхода срока.'''
hint.ru = '''Что именно считает `max_deliver`?'''

[[exercises]]
name = "svjob7"
style = "fix"
hint.ru = [
  '''Запусти тесты и сравни: что возвращает `due` после долгой паузы и что делает `new` с началом отсчёта? Это две разные поломки.''',
  '''`due`: пропущенные срабатывания не догоняют. Срабатывание одно, а следующий срок надо вынести вперёд на целое число периодов, чтобы он остался на прежней сетке и оказался строго после `now`. `new`: в файле уже есть функция, дающая устойчивый сдвиг по имени экземпляра.''',
  '''Сколько периодов пропущено: `(now - next) / every + 1`. Следующий срок: `next + пропущено * every`. В `new` прибавь к `now` значение `spread(instance, every)`.''',
]
why.ru = '''Периодическая задача не копит долг: чистить пять раз подряд или слать пять дайджестов нет смысла, срабатывание одно, а график остаётся на сетке, чтобы разброс по времени не плыл. Начало отсчёта привязывают к имени экземпляра, а не к случайному числу: после перезапуска сдвиг тот же, а у десяти экземпляров он разный, так что нагрузка размазана по периоду, а не приходит одним ударом на границе минуты.'''

[[exercises]]
name = "svjob_q4"
kind = "question"
question.ru = '''Чистка истёкших сессий запущена на трёх экземплярах auth-service. Каждый запускает её раз в 10 минут по своему таймеру, общей аренды нет. Сколько раз в час, когда все три экземпляра работают без сбоев, выполнится чистка?'''
options.ru = [
  '''6''',
  '''18''',
  '''3''',
  '''30''',
]
answer = [1]
explain.ru = '''У каждого экземпляра свой таймер, и все три честно срабатывают каждые 10 минут: 6 срабатываний в час на экземпляр, 18 на кластер. Чистка идемпотентна, поэтому поломки не будет, но база получает втрое больше запросов, чем нужно, а для рассылки это было бы втрое больше писем. Один исполнитель на период обеспечивает аренда.'''
hint.ru = '''Сколько независимых таймеров запущено, и что объединяет их работу?'''

[[exercises]]
name = "svjob8"
style = "todo"
requires = ["nats"]
hint.ru = [
  '''Аренда это ключ в KV. Какая операция создаёт ключ только если его ещё нет? Что произойдёт, если вместо неё вызвать обычную запись (`put`)?''',
  '''`acquire`: `create`, ошибка «уже существует» значит «занято» (это не сбой). Номером аренды служит ревизия, которую вернул `create`. `renew`: `update` с ревизией, которую владелец помнит; отказ значит, что аренда потеряна. Не забудь запомнить новую ревизию.''',
  '''`release` удаляет ключ только если ревизия совпадает (`delete_expect_revision`): опоздавший владелец не должен снять аренду нового. Ошибки удаления чужой аренды игнорируются.''',
]
why.ru = '''Всё держится на том, что `create` атомарен: из восьми одновременных претендентов выигрывает ровно один, без блокировок на нашей стороне. Ревизия записи растёт с каждой записью в бакет, поэтому служит и номером аренды, и условием продления: перехваченный ключ имеет другую ревизию, и `update` отказывает. Освобождение тоже условное, иначе владелец, которого уже сменили, снимал бы аренду своего преемника. Срок жизни обеспечивает сам бакет (`max_age`), владельцу отдельный таймер не нужен.'''

[[exercises]]
name = "svjob9"
style = "fix"
requires = ["nats"]
hint.ru = [
  '''Сколько живёт аренда и сколько длится работа? Что происходит с ключом, пока никто его не трогает?''',
  '''Пока работа идёт, рядом должно идти продление, заметно чаще срока аренды (хватит трети). Удобно соединить работу и таймер в `tokio::select!`: будущее работы закрепи через `tokio::pin!`, чтобы его можно было опрашивать в цикле.''',
  '''Если `renew` вернул `false`, выйди из функции с ошибкой: будущее работы при этом уничтожается и работа прекращается. Когда работа закончилась сама, отдай аренду через `release` и верни результат.''',
]
why.ru = '''Аренда без продления защищает только от коротких задач: работа дольше срока рано или поздно оказывается в параллельном исполнении, то есть ровно в том, ради чего аренда придумана. Продление с проверкой результата обязательно: узнав, что ключ перехвачен, владелец останавливает работу сразу, а не «доделывает по инерции». Номер аренды передаётся работе, чтобы подписывать им записи во внешний ресурс (fencing): продление ловит потерю с задержкой до трети срока, номер защищает данные и в эту щель.'''

[[exercises]]
name = "svjob_q5"
kind = "question"
question.ru = '''Владелец A держит аренду с номером 12 и вдруг засыпает на 5 секунд (TTL аренды 2 секунды). Пока он спит, экземпляр B берёт аренду с номером 14 и записывает в таблицу «последняя чистка: 14». Таблица принимает запись только с номером не меньше уже сохранённого. A просыпается и сразу, не проверяя аренду, пишет «последняя чистка: 12». Какое значение останется в таблице?'''
options.ru = [
  '''14''',
  '''12''',
  '''оба, как две строки''',
  '''то, которое пришло позже по времени''',
]
answer = [0]
explain.ru = '''Таблица помнит наибольший виденный номер аренды (14) и отклоняет записи с меньшим: запись A отвергнута. Это и есть fencing: аренда сообщает «ты работаешь», но владелец узнаёт о потере с задержкой, и только номер защищает данные от опоздавшего. Без этой проверки результат определялся бы тем, кто был позже по часам, то есть случайностью.'''
hint.ru = '''Что делает таблица с записью, у которой номер меньше сохранённого?'''

[[exercises]]
name = "svjob10"
style = "scratch"
hint.ru = [
  '''Цикл «взять пачку id, удалить её, повторить, пока пусто». Откуда брать следующую пачку, если предыдущую уже удалили? Нужен ли тебе курсор?''',
  '''Удалённое исчезло, поэтому каждый раз достаточно просить первые `batch` id автора: смещения не нужны. Остановка когда страница пуста. Между пачками отдай управление исполнителю (`tokio::task::yield_now`), иначе длинная задача занимает поток.''',
  '''Результат: сумма значений, которые вернул `delete_batch`. Ошибка пачки сразу выходит наружу (`?`): уже удалённое остаётся удалённым, а повторный запуск продолжит с остатка.''',
]
why.ru = '''Пачки ограничивают и блокировки, и размер журнала, и память: никогда не грузят «все id автора». Каждая пачка это отдельная операция, поэтому сбой на середине не откатывает сделанное, а повтор естественно продолжает: удалённое уже не попадёт в следующую страницу, и никакая контрольная точка не нужна. Она понадобится там, где результат работы не исчезает сам (следующая задача). `yield_now` между пачками нужен, чтобы долгое удаление не вытесняло остальные задачи с того же потока.'''

[[exercises]]
name = "svjob11"
style = "fix"
hint.ru = [
  '''Сначала пойми, что происходит при повторном запуске: откуда он начинает и что известно о прошлом запуске? А теперь про щель: письмо ушло, а точку записать не успели.''',
  '''Нужны две вещи сразу. Контрольная точка (последний обработанный пользователь задания) не даёт гонять отправленное заново; ключ повтора в самой отправке (задание плюс пользователь) защищает от единственной неопределённой отправки в щели между письмом и точкой.''',
  '''Прочитай точку в начале и пропускай пользователей не больше неё (список упорядочен). Для каждого оставшегося: отправка с ключом `<job_id>:<user>`, потом запись точки. Ошибка любого шага выходит наружу.''',
]
why.ru = '''Точка и ключ решают разные задачи. Точка экономит работу: не перебирать заново полмиллиона уже обработанных. Ключ даёт корректность: между «письмо ушло» и «точка записана» есть щель, и падение в ней при одной лишь точке даёт двойное письмо, а при одном лишь ключе, наоборот, весь повтор начинается с первого пользователя. Точка идёт по значению (id пользователя), не по смещению: смещение сломается, как только набор изменится. Точка и ключ привязаны к заданию: завтрашний дайджест это другое задание и начинается с первого.'''

[[exercises]]
name = "svjob12"
style = "bughunt"
requires = ["nats"]
hint.ru = [
  '''Что происходит с задачей, которую воркер делал в момент `abort`, и с теми, что `fetch` уже выдал, но воркер ещё не начал? Что видит брокер?''',
  '''Нужны два изменения. Воркеру нужен сигнал остановки, который можно ждать (`tokio::sync::watch`), а `stop` отправляет сигнал и дожидается конца задачи воркера. А внутри цикла работа над сообщением и сигнал ждутся вместе (`select!`).''',
  '''При остановке верни текущее сообщение в очередь без паузы (`Nak(None)`), а остальные из уже выданной пачки дочитай из потока и тоже верни, не запуская. Перед каждым новым `fetch` проверяй, не остановлен ли воркер.''',
]
why.ru = '''Для брокера «воркер пропал» и «воркер вежливо ушёл» выглядят одинаково, пока воркер не скажет. Без `nak` задача висит «в работе» до `ack_wait`, то есть деплой каждый раз замораживает несколько задач на полминуты, а при долгом `ack_wait` на минуты. Пачка делает это хуже: выданные, но не начатые сообщения тоже числятся за остановившимся воркером. Поэтому остановка это три действия: не брать новое, вернуть текущее, вернуть всё взятое и не начатое.'''

[[exercises]]
name = "svjob_quiz"
kind = "project"
quiz = true
style = "scratch"
locked = ["src/crates/jobs/tests/acceptance.rs"]
hint.ru = [
  '''Начни с `policy.rs`: она короткая и нужна воркеру. Потом `Worker::tick`, затем `shutdown`, `Periodic`, `LeaseStore`, `run_checkpointed` и в конце `leader_tick`, который соединяет `Periodic` и `LeaseStore`.''',
  '''`tick`: сначала наполни буфер до `prefetch` задач из очереди (`take`), потом бери первую из буфера. Для отложенной один `nak` на оставшееся время. `shutdown` возвращает буфер через `nak` с нулевой паузой. В `LeaseStore` срок хранится как момент истечения; граница `now == expires` уже значит «истекла».''',
  '''`leader_tick`: период пронумерован как `now / every`, и имя аренды включает этот номер: тогда аренда держится на период и срабатывание другого экземпляра в том же периоде её не получит. Аренду не отпускай: она сама станет ненужной с наступлением следующего периода. В `run_checkpointed` ключ повтора передаётся отправке первым аргументом.''',
]
why.ru = '''Это то место, где глава превращается в один слой: политика повторов отделена от воркера, воркер не знает про часы (время приходит аргументом), аренда не знает про задачи, расписание соединяет период и аренду, а долгая работа возобновляется с контрольной точки и защищена ключом повтора. Одна чистка на период при трёх экземплярах получается из двух простых вещей: у каждого экземпляра свой сдвиг, а право исполнить период берёт аренда с номером периода в имени.'''

