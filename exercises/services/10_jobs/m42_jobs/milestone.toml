test_command = ["cargo", "make", "check"]
requires = ["nats"]
hint.ru = [
"""Начни с nats-engine: `work_queue()` в `StreamSpec`, `puller` и `Taken` с `ack`, `nak`, `progress`, `bury`, и три
операции `Bucket` для аренды: `create` у KV падает с `AlreadyExists`, `update` и `delete_expect_revision` падают с
`WrongLastRevision`, их и превращай в `None` и `false`. Потом крейт jobs по порядку главы: policy, worker, periodic,
lease, checkpoint, saga.""",
"""Попытку не храни в задаче: её номер это `delivered` из сведений сообщения. Отложенная задача приходит раньше срока
ровно один раз, а время записи в брокер (`published`) говорит, было ли такое: если `run_at` позже записи, вычти одну
выдачу. При остановке не бросай fetch на середине: сообщения, которые брокер уже выдал этому fetch, иначе пролежат до
`ack_wait`.""",
"""Аренду лидера называй по периоду (`<имя>.<now / every>`) и не отпускай после работы: экземпляр со своим сдвигом
придёт в тот же период позже и должен увидеть, что работа сделана. Срок записи в бакете бери с запасом на сдвиг,
например два периода.""",
"""Сага удаления: обратимые шаги сначала (заморозка, скрытие профиля), необратимые потом (посты, профиль, учётка).
Шагу постов нужен x-user-id и роль user: post-service проверяет, что удаляет автор. Ответ на `POST /auth/delete-account`
сразу 202, а вся работа в воркере.""",
]
story.ru = """У соцсети появилась работа в фоне: истёкшие сессии чистит один экземпляр на период, раз в сутки
приходит сводка непрочитанного, а удаление аккаунта честно проходит по всем сервисам сагой и не оставляет ни постов,
ни профиля, ни входа. Упавший посреди работы воркер ничего не теряет: задача вернётся, а рассылка и удаление
продолжатся с контрольной точки."""
