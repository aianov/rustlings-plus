<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Аренда: захват, продление, истечение и номер</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1c2330; --muted: #5d6879; --line: #c9d0db;
  --box: #eef1f6; --boxline: #aeb8c8; --ok: #1f8a4c; --bad: #c92a2a; --warn: #d9820f; --accent: #2f6fe0;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14181f; --panel: #1b212b; --ink: #e6ebf3; --muted: #9aa6b8; --line: #384152;
    --box: #232b38; --boxline: #4a566b; --ok: #51cf66; --bad: #ff6b6b; --warn: #ffa94d; --accent: #6ea4ff;
  }
}
:root[data-theme="dark"] {
  --bg: #14181f; --panel: #1b212b; --ink: #e6ebf3; --muted: #9aa6b8; --line: #384152;
  --box: #232b38; --boxline: #4a566b; --ok: #51cf66; --bad: #ff6b6b; --warn: #ffa94d; --accent: #6ea4ff;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1000px; margin: 0 auto; padding: 16px; }
h1 { font-size: 20px; margin: 0 0 4px; }
p.sub { margin: 0 0 12px; color: var(--muted); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
button, select { font: inherit; color: var(--ink); background: var(--box); border: 1px solid var(--boxline); border-radius: 6px; padding: 5px 12px; cursor: pointer; }
button:hover:enabled { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
.spacer { flex: 1; }
svg { width: 100%; height: auto; display: block; }
svg text { fill: var(--ink); font-size: 13px; }
svg .muted { fill: var(--muted); font-size: 12px; }
#caption { margin-top: 12px; min-height: 84px; }
.step { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>Аренда: захват, продление, истечение и номер</h1>
  <p class="sub">Один исполнитель на кластер держится на KV с TTL; номер аренды защищает данные от опоздавшего владельца.</p>
  <div class="panel">
    <div class="bar">
      <label>Случай <select id="scenario"></select></label>
      <span class="spacer"></span>
      <button id="reset">Сброс</button>
      <button id="prev">Назад</button>
      <button id="next">Шаг</button>
      <button id="play">Играть</button>
      <button id="theme">Тема</button>
    </div>
    <svg viewBox="0 0 960 480" role="img" aria-label="Аренда: захват, продление, истечение и номер"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs><g id="scene"></g></svg>
    <div id="caption" aria-live="polite"></div>
  </div>
</main>
<script>
"use strict";
const NS = "http://www.w3.org/2000/svg";
function el(name, attrs, parent, text) {
  const e = document.createElementNS(NS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}
const NODES = [{"id": "a", "x": 10, "y": 40, "w": 200, "h": 130, "label": "экземпляр A", "sub": "владелец аренды"}, {"id": "kv", "x": 280, "y": 150, "w": 400, "h": 130, "label": "KV: ключ cleanup", "sub": "TTL = 2 с, номер = ревизия"}, {"id": "b", "x": 750, "y": 40, "w": 200, "h": 130, "label": "экземпляр B", "sub": "ждёт"}, {"id": "res", "x": 280, "y": 320, "w": 400, "h": 120, "label": "ресурс (таблица)", "sub": "принимает записи с номером"}];
const SCEN = {"renew": {"title": "живой владелец продлевает", "intro": "Работа идёт дольше TTL, но владелец жив.", "steps": [{"text": "A создаёт ключ cleanup. Создание удаётся, только если ключа нет. Ревизия 12 становится номером аренды.", "hl": ["a", "kv"], "arrows": [["a", "kv", "create", "ok"]], "tokens": {"kv": [["владелец A, номер 12", "ok"]], "a": [["работает", "n"]]}}, {"text": "B пытается создать тот же ключ и получает «уже есть». B ждёт и пробует позже.", "hl": ["b", "kv"], "arrows": [["b", "kv", "create", "bad"]], "tokens": {"kv": [["владелец A, номер 12", "ok"]], "b": [["аренда занята", "warn"]]}}, {"text": "Через треть TTL A продлевает: update с ревизией 12. Срок отсчитывается заново, ревизия записи теперь 13, а номер аренды остаётся 12.", "hl": ["a", "kv"], "arrows": [["a", "kv", "update(rev 12)", "ok"]], "tokens": {"kv": [["владелец A, номер 12 (срок заново)", "ok"]]}}, {"text": "Так A держит аренду сколько нужно. Если продление не удалось, A обязан остановить работу немедленно.", "hl": ["a"], "tokens": {"a": [["продление ok, работа идёт", "ok"]], "kv": [["владелец A, номер 12", "ok"]]}}]}, "expire": {"title": "владелец завис", "intro": "Сеть пропала или процесс на паузе. Аренда истекает сама.", "steps": [{"text": "A владеет арендой с номером 12 и работает.", "hl": ["a", "kv"], "tokens": {"kv": [["владелец A, номер 12", "ok"]], "a": [["работает", "n"]]}}, {"text": "A зависает (пауза сборщика мусора, потеря сети). Продлений нет.", "hl": ["a"], "tokens": {"a": [["завис", "bad"]], "kv": [["владелец A, номер 12", "warn"]]}}, {"text": "TTL истёк, ключ исчез из бакета. Для KV это обычное удаление записи по возрасту.", "hl": ["kv"], "tokens": {"kv": [["ключа нет", "warn"]], "a": [["завис", "bad"]]}}, {"text": "B делает create и получает ревизию 14. Новый номер аренды: 14. Теперь работает B.", "hl": ["b", "kv"], "arrows": [["b", "kv", "create", "ok"]], "tokens": {"kv": [["владелец B, номер 14", "ok"]], "b": [["работает", "n"]]}}]}, "fence": {"title": "зомби просыпается", "intro": "Продление здесь не поможет: A узнает о потере, только когда проснётся. Нужен номер.", "steps": [{"text": "A проснулся и думает, что аренда ещё его. У него в памяти номер 12.", "hl": ["a"], "tokens": {"a": [["помнит номер 12", "warn"]], "kv": [["владелец B, номер 14", "ok"]], "b": [["работает, номер 14", "ok"]]}}, {"text": "A пробует продлить (update с ревизией 13) и получает отказ: ревизия не совпала. Хорошо, A узнал и останавливается.", "hl": ["a", "kv"], "arrows": [["a", "kv", "update(rev 13)", "bad"]], "tokens": {"a": [["отказ: аренда потеряна", "bad"]]}}, {"text": "А если A успел записать в ресурс до проверки продлением? Каждая запись несёт номер аренды. Ресурс помнит максимальный виденный номер (14) и отвергает меньшие.", "hl": ["a", "res"], "arrows": [["a", "res", "запись, номер 12", "bad"]], "tokens": {"res": [["видел номер 14: номер 12 отклонён", "ok"]]}}, {"text": "Это и есть fencing: аренда даёт право работать, а номер защищает данные от опоздавшего владельца, даже если он ещё не знает, что опоздал.", "hl": ["b", "res"], "arrows": [["b", "res", "запись, номер 14", "ok"]], "tokens": {"res": [["принято от номера 14", "ok"]]}}]}};
const COLOR = { ok: "var(--ok)", bad: "var(--bad)", warn: "var(--warn)", n: "var(--accent)" };
const scene = document.getElementById("scene"), cap = document.getElementById("caption");
const sel = document.getElementById("scenario");
const btn = id => document.getElementById(id);
let idx = -1, timer = null;
Object.keys(SCEN).forEach(k => { const o = document.createElement("option"); o.value = k; o.textContent = SCEN[k].title; sel.appendChild(o); });
function center(id) { const n = NODES.find(n => n.id === id); return { x: n.x + n.w / 2, y: n.y + n.h / 2, n }; }
function render() {
  scene.textContent = "";
  const sc = SCEN[sel.value];
  const step = idx >= 0 ? sc.steps[idx] : null;
  NODES.forEach(n => {
    const hot = step && (step.hl || []).includes(n.id);
    el("rect", { x: n.x, y: n.y, width: n.w, height: n.h, rx: 10, fill: "var(--box)", stroke: hot ? "var(--accent)" : "var(--boxline)", "stroke-width": hot ? 3 : 1.2 }, scene);
    el("text", { x: n.x + 10, y: n.y + 20, "font-weight": "600" }, scene, n.label);
    if (n.sub) el("text", { x: n.x + 10, y: n.y + 36, class: "muted" }, scene, n.sub);
  });
  if (step) {
    (step.arrows || []).forEach(a => {
      const f = center(a[0]), t = center(a[1]);
      const dx = t.x - f.x, dy = t.y - f.y, len = Math.hypot(dx, dy) || 1;
      const x1 = f.x + (dx > 0 ? f.n.w / 2 : dx < 0 ? -f.n.w / 2 : 0), y1 = f.y + (Math.abs(dx) < 4 ? (dy > 0 ? f.n.h / 2 : -f.n.h / 2) : 0);
      const x2 = t.x - (dx > 0 ? t.n.w / 2 : dx < 0 ? -t.n.w / 2 : 0), y2 = t.y - (Math.abs(dx) < 4 ? (dy > 0 ? t.n.h / 2 : -t.n.h / 2) : 0);
      const c = COLOR[a[3] || "n"];
      el("line", { x1, y1, x2, y2, stroke: c, "stroke-width": 2.2, "marker-end": "url(#arr)", "stroke-dasharray": a[3] === "bad" ? "6 4" : "" }, scene);
      el("text", { x: (x1 + x2) / 2, y: (y1 + y2) / 2 - 6, "text-anchor": "middle", fill: c, style: "fill:" + c + ";font-size:12px" }, scene, a[2]);
    });
    Object.keys(step.tokens || {}).forEach(id => {
      const n = NODES.find(n => n.id === id);
      step.tokens[id].forEach((t, i) => {
        const y = n.y + 48 + i * 26;
        const c = COLOR[t[1] || "n"];
        el("rect", { x: n.x + 10, y, width: n.w - 20, height: 21, rx: 10, fill: "none", stroke: c, "stroke-width": 1.6 }, scene);
        el("text", { x: n.x + 18, y: y + 15, style: "fill:" + c + ";font-size:12px" }, scene, t[0]);
      });
    });
  }
  const sub = idx < 0 ? sc.intro : sc.steps[idx].text;
  cap.innerHTML = "";
  const s = document.createElement("div"); s.className = "step"; s.textContent = idx < 0 ? "Начало" : "Шаг " + (idx + 1) + " из " + sc.steps.length; cap.appendChild(s);
  const p = document.createElement("div"); p.textContent = sub; cap.appendChild(p);
  btn("prev").disabled = idx < 0; btn("next").disabled = idx >= sc.steps.length - 1;
}
function stop() { if (timer) { clearInterval(timer); timer = null; btn("play").textContent = "Играть"; } }
btn("next").onclick = () => { stop(); if (idx < SCEN[sel.value].steps.length - 1) { idx++; render(); } };
btn("prev").onclick = () => { stop(); if (idx >= 0) { idx--; render(); } };
btn("reset").onclick = () => { stop(); idx = -1; render(); };
sel.onchange = () => { stop(); idx = -1; render(); };
btn("play").onclick = () => {
  if (timer) { stop(); return; }
  if (idx >= SCEN[sel.value].steps.length - 1) idx = -1;
  btn("play").textContent = "Пауза";
  timer = setInterval(() => { if (idx < SCEN[sel.value].steps.length - 1) { idx++; render(); } else stop(); }, 1800);
  if (idx < 0) { idx = 0; render(); }
};
btn("theme").onclick = () => {
  const r = document.documentElement, cur = r.getAttribute("data-theme");
  const dark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.setAttribute("data-theme", dark ? "light" : "dark");
};
render();
</script>
</body>
</html>
