[[exercises]]
name = "svarch1"
style = "todo"
hint.ru = """Правило ника нужно вынести из `handle_line` в `validate_username` почти дословно. Порядок проверок: сначала длина в символах (`chars().count()`, не `len()`), потом допустимые символы."""
why.ru = """Правило стало обычной функцией от строки к результату, и его проверяет `#[test]` без списка пользователей и без команды. `handle_line` теперь только разбирает вход и переводит ошибку в текст ответа. Ошибка везде одна и та же ситуация: когда придёт gRPC, он вызовет ту же функцию и переведёт `UsernameError` в свой статус."""

[[exercises]]
name = "svarch2"
style = "todo"
hint.ru = [
  """Service не должен возвращать строки вида "201 alice": он отдаёт `Ok(имя)` или ошибку-значение. Тексты ответов рождаются только в controller.""",
  """В service: `trim`, `to_lowercase`, пустой ник это `Empty`, `store.contains` это `Taken`, иначе `store.insert` и вернуть имя. В controller: `strip_prefix("register ")`, потом `match` на результат service.""",
  """Контроллер получает `&mut UserService` и не импортирует `repository`. Если тебе понадобилось `use super::repository`, значит, часть логики оказалась не там.""",
]
why.ru = """Стрелки идут только вниз: controller видит service, service видит repository, и ни один слой не видит верхний. Поэтому service тестируется без текста ответов, а controller можно переписать под другой формат, не трогая правила. Обрати внимание: ник нормализуется в service, а не в controller, иначе второй вход забыл бы это сделать."""

[[exercises]]
name = "svarch_q1"
kind = "question"
question.ru = """В сервисе есть папки `controller`, `service`, `repository`, `bootstrap`, `common`. Ровно одна из этих строк `use` нарушает направление зависимостей. Какая?
```rust
// 1. service/post.rs
use crate::repository::PostRepository;
// 2. controller/post.rs
use crate::repository::InMemoryPosts;
// 3. bootstrap/mod.rs
use crate::repository::InMemoryPosts;
use crate::service::PostService;
// 4. controller/post.rs
use crate::service::PostService;
use crate::dto::CreatePostDto;
// 5. service/post.rs
use crate::common::Post;
```"""
options.ru = ["строка 1", "строка 2", "строка 3", "строка 4", "строка 5"]
answer = [1]
explain.ru = """Строка 2: контроллер лезет в хранилище в обход service, и правило «автор должен существовать» перестаёт работать: пост сохранится без проверки. Остальные правильные. Service пользуется портом репозитория (1) и доменным типом из common (5), это стрелки вниз. Bootstrap (3) существует затем, чтобы знать всех и собирать сервис. Контроллер знает и service, и свои DTO (4). Для сравнения, нарушениями были бы ещё `use crate::dto::...` внутри service (правило привязалось бы к формату JSON) и `use crate::service::...` внутри repository (хранилище узнало бы о правилах, и получился бы цикл)."""
hint.ru = """Стрелка вниз разрешена: controller → service → repository. Исключение только bootstrap: он видит всех. Найди слой, который перепрыгнул через соседа."""

[[exercises]]
name = "svarch3"
style = "todo"
hint.ru = """`insert` берёт замок, увеличивает `last_id`, создаёт `User` с этим номером и кладёт копию в `users`. Всё это под одним `lock()`, одним куском кода."""
why.ru = """Методы берут `&self`, а изменяемость спрятана в `Mutex`: репозиторий общий, и `Arc<InMemoryUsers>` можно раздать потокам. Выдача id и вставка идут под одним замком, поэтому два потока никогда не получат один номер. Тест с восемью потоками именно это проверяет."""

[[exercises]]
name = "svarch4"
style = "scratch"
hint.ru = [
  """Порядок в `create`: сначала обрезать, потом проверить пустоту, потом длину, и только в конце звать репозиторий.""",
  """Длина считается так: `text.chars().count() > MAX_POST_CHARS`. В русском тексте байтов вдвое больше, чем символов.""",
  """В `follow` сначала `follower == target` (репозиторий не трогаем), потом `repo.add(...)`: `true` это успех, `false` значит, что такая подписка уже есть.""",
]
why.ru = """Service проверяет правила до того, как позвать репозиторий: отклонённый запрос не стоит ничего и не оставляет следов. Репозиторий приходит дженериком, поэтому в тесте на его месте счётчик вызовов, и мы доказываем, что репозиторий не вызван. Для подписки «уже подписан» решает репозиторий (он видит все пары), а service только переводит `false` в доменную ошибку."""

[[exercises]]
name = "svarch5"
style = "fix"
hint.ru = [
  """`async fn` в трейте возвращает анонимный тип, и `dyn` не знает его размера. Нужен возвращаемый тип, который известен заранее: `BoxFuture<'_, Option<User>>`.""",
  """В реализации: `Box::pin(async move { ... })`. Если компилятор пишет, что future не `Send`, ищи `MutexGuard`, который живёт через `.await`.""",
  """В `SlowUsers` сейчас замок берётся ДО `sleep`. Сначала поспи, потом возьми замок и сразу клонируй результат: тогда guard не переживает `.await`.""",
]
why.ru = """Трейт-объекту нужен один известный тип результата, поэтому future кладут в коробку: `BoxFuture` это `Pin<Box<dyn Future + Send>>`. Бонус даром: `Send` уже внутри псевдонима, и компилятор сам находит future, который нельзя отправить в другой поток. Самая частая причина такой ошибки: `std::sync::MutexGuard` пережил `.await`. Замок берут на самое короткое время и не держат через ожидание."""

[[exercises]]
name = "svarch_q2"
kind = "question"
question.ru = """При старте сервис читает переменную `STORAGE`: `memory` или `postgres`. Какой из двух вариантов соберётся?
```rust
trait PostRepository: Send + Sync { /* ... */ }
struct Memory;
struct Pg;
impl PostRepository for Memory { /* ... */ }
impl PostRepository for Pg { /* ... */ }

// вариант А
struct PostService<R: PostRepository> { repo: R }
// вариант Б
struct PostService { repo: Arc<dyn PostRepository> }

let service = if std::env::var("STORAGE").as_deref() == Ok("pg") {
    PostService::new(Pg)            // для варианта Б: PostService::new(Arc::new(Pg))
} else {
    PostService::new(Memory)        // для варианта Б: PostService::new(Arc::new(Memory))
};
```"""
options.ru = [
  "только вариант А",
  "только вариант Б",
  "оба варианта",
  "ни один: нужен enum",
]
answer = [1]
explain.ru = """В варианте А `PostService<Pg>` и `PostService<Memory>` это два разных типа, а у `let service = if ... else ...` тип обязан быть один: компилятор ответит, что ветки `if` и `else` несовместимы. В варианте Б обе ветки дают один тип `PostService`, а различие спрятано в `Arc<dyn PostRepository>`. Поэтому выбор реализации по конфигу во время работы требует `dyn` (или enum, но тогда придётся перечислять все реализации в одном месте, и это отдельный вариант, которого в списке нет). Цена `dyn` один косвенный вызов, на фоне похода в базу её не видно."""
hint.ru = """Посмотри на типы двух веток `if`. Что в них общего у каждого из вариантов?"""

[[exercises]]
name = "svarch6"
style = "fix"
hint.ru = [
  """Сначала поменяй сигнатуру `PostService::create` на `(author: UserId, text: &str) -> Result<Post, PostError>`: что осталось внутри, это и есть правило.""",
  """Всё про `serde_json`, статус-коды и коды ошибок уезжает в `controller::create`. Разбор тела через `serde_json::from_str::<CreatePostDto>`, битый JSON это 400.""",
  """На границе: `PostDto::from(post)` и `match` по `PostError` в статус 422 с кодом. Реализуй `From<Post> for PostDto`, он пригодится.""",
]
why.ru = """Service теперь принимает и возвращает доменные типы и не знает слов «JSON» и «422». Правило проверяется без HTTP, а второй вход (gRPC) вызовет те же `create` и сам решит, как показать `PostError`. Заметь, что отклонённый пост не тратит id: номер выдаётся только после всех проверок."""

[[exercises]]
name = "svarch7"
style = "todo"
hint.ru = [
  """`parse_id`: `raw.parse::<u64>()`, а ошибку разбора превращаем в `ApiError { status: 400, code: "bad_id" }` через `map_err`.""",
  """`get_user` в три строки: `parse_id(raw_id)?`, `service.get(id)?`, `.into()`. Знак вопроса сам вызовет твой `From<UserError> for ApiError`.""",
  """`render`: на `Ok` сериализуй значение (`serde_json::to_string`), на `Err` собери `{"error": код}` через `serde_json::json!`.""",
]
why.ru = """Контроллер читается за десять секунд: разобрал, позвал, собрал. Все ошибки идут как значения, `?` переводит доменную ошибку в `ApiError` через `From`, а `render` один на все ручки, поэтому формат ошибок везде одинаков. Если в контроллере начинают расти `match` и `if` по правилам, значит, правила просятся в service."""

[[exercises]]
name = "svarch8"
style = "bughunt"
hint.ru = [
  """Посмотри на `static USERS` в `repository`. Сколько раз он существует в процессе? Сколько должно быть хранилищ?""",
  """Перенеси множество внутрь структуры: `InMemoryUsers { names: Mutex<HashSet<String>> }` с `Default`. `static` удали.""",
  """В `bootstrap::build` теперь создавай свежий `InMemoryUsers::default()` при каждой сборке.""",
]
why.ru = """Глобальное состояние делает все копии сервиса одним целым: тесты идут параллельно в одном процессе и мешают друг другу, поэтому падают то один, то другой, и только при общем запуске. Данные должны жить в значениях, а значения создаёт bootstrap и раздаёт в конструкторы. Это ещё и условие для двух экземпляров сервиса в одном процессе."""

[[exercises]]
name = "svarch9"
style = "scratch"
hint.ru = [
  """Проверка «такого ника нет» и запись должны произойти в одном обращении к хранилищу. Посмотри на метод `Store::with`: что происходит с замком между двумя его вызовами?""",
  """Всё в одном `store.with(|state| { ... })`: проверь, что ника нет, увеличь `last_id`, запиши. Счётчик увеличивай только после того, как убедился, что конфликта нет.""",
  """В `register`: нормализуй ник, отсеки пустой, вызови `create_if_absent` и переведи `Conflict` в `Taken` через `map_err`.""",
]
why.ru = """«Создай, если нет» это одна операция репозитория, потому что только он видит все данные сразу. Один вызов `with` делает проверку и запись неделимыми: тест ставит барьер после каждого обращения к хранилищу, и решение «проверил, отпустил, записал» получает дубликаты каждый раз, а не по везению. В Postgres то же самое сделает `UNIQUE` индекс. Id выдаётся только при успехе: пропуски в нумерации из-за отказов выглядят мелочью, пока не начнёшь их объяснять."""

[[exercises]]
name = "svarch_q3"
kind = "question"
question.ru = """Два запроса с ником `bob` приходят одновременно в два экземпляра сервиса. Что возможно?
```rust
async fn register(&self, name: &str) -> Result<User, Error> {
    if self.repo.find_by_name(name).await.is_some() {
        return Err(Error::Taken);
    }
    Ok(self.repo.insert(name).await)
}
```"""
options.ru = [
  "один создан, второй получит Taken: проверка защищает",
  "оба создадут пользователя bob: оба видели «никого нет» до чужой вставки",
  "один получит панику: репозиторий не поддерживает два запроса",
  "поведение зависит только от того, in-memory репозиторий или нет",
]
answer = [1]
explain.ru = """Между `find_by_name` и `insert` есть щель: запрос A проверил и ушёл вставлять, а запрос B за это время тоже проверил и тоже ничего не нашёл. В итоге два `bob`. Это не зависит от типа хранилища, замок в service не поможет, когда экземпляров два. Чинить нужно там, где живут данные: одной операцией репозитория `create_if_absent` (в базе это уникальный индекс)."""
hint.ru = """Между двумя `await` в этом коде другие задачи не останавливаются."""

[[exercises]]
name = "svarch10"
style = "bughunt"
hint.ru = [
  """Тест ставит всех участников на барьер после `find_by_name`: в этой точке все уже решили, что ника нет. Нужна операция, где отказ решает сам репозиторий. В трейте она уже объявлена, но не написана.""",
  """Реализуй `create_if_absent` асинхронно: `Box::pin(async move { ... })` и один вызов `self.store.with(...)`. Внутри `with` нет `.await`, поэтому замок не переживает ожидание.""",
  """В service замени пару `find_by_name` + `insert` на `create_if_absent` и переведи `RepoError::Conflict` в `RegisterError::Taken`.""",
]
why.ru = """Каждый шаг по отдельности правильный, ошибка живёт в паузе между ними. Чинить её в service нельзя: замок в service не работает, когда экземпляров два. Единственный, кто видит все записи сразу, это хранилище, поэтому «проверь и запиши» становится одной операцией. Здесь две проверки: service-уровень (барьер между поиском и вставкой) и сам репозиторий (барьер после каждого `with`), так что нельзя спрятаться ни за одним из слоёв."""

[[exercises]]
name = "svarch11"
style = "fix"
hint.ru = [
  """`PostService` должен хранить `Arc<dyn UserDirectory>` вместо чужой таблицы. Тесты передают заглушку в `new`.""",
  """Три исхода вопроса к соседу: `Ok(true)` продолжаем, `Ok(false)` это `AuthorNotFound`, `Err(_)` это `AuthorCheckUnavailable`.""",
  """Порядок: сначала `trim` и проверка на пустоту, и только потом `exists(...).await`. Замок на `posts` не держи через `.await`.""",
]
why.ru = """Данные пользователей принадлежат user-service, а post-service спрашивает про них через порт, у которого в тестах заглушка, а в проде gRPC-клиент. «Нет такого автора» и «не смогли спросить» разные факты: смешав их, при падении соседа мы сказали бы всем, что их не существует. Дешёвые проверки у себя идут раньше дорогого похода по сети."""

[[exercises]]
name = "svarch_layout"
kind = "project"
style = "todo"
locked = ["src/microservices/post-service/tests/acceptance.rs"]
hint.ru = [
  """Начни с `src/lib.rs`: объяви модули `bootstrap`, `controller`, `dto`, `service`, `repository`, `common`. Потом разнеси по ним код из `main.rs`, начиная с нижнего слоя.""",
  """Каждый слой это папка с `mod.rs`. Внутри всех слоёв одинаково: либо файлы, либо папки, `x.rs` рядом с `x/` быть не должно. `main.rs` остаётся тонким: вызвал `bootstrap::build()` и всё.""",
]
why.ru = """Раскладка проверяется тестами, потому что договорённость, которую не проверяют, живёт неделю. Бинарь тонкий, вся работа в библиотеке: так интеграционные тесты могут вызвать сервис, а bootstrap остаётся единственным местом, которое знает все слои."""

[[exercises]]
name = "svarch_quiz"
kind = "project"
quiz = true
style = "scratch"
locked = ["src/microservices/post-service/tests/acceptance.rs"]
hint.ru = [
  """Раскладка та же, что в `svarch_layout`. Контракты (`UserId`, `PostId`) и `store-kit` уже лежат в `src/crates`.""",
  """Для гонок: дубликат (автор, текст) отклоняется операцией репозитория `create_if_absent`, которая делает проверку и запись в одном `store.with(...)`. Порт к соседу объявляй в service, слой repository его не знает.""",
]
why.ru = """Задача собирает всё: слои, порт к соседу, атомарную вставку и тесты на гонки. Правила живут в service, репозитории за трейтами, сборка в bootstrap. Приёмочные тесты читают исходники слоёв: так архитектура проверяется, а не принимается на слово."""

[[exercises]]
name = "m33_layers"
kind = "milestone"
journey = "backend"
quiz = true
