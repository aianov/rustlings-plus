message.ru = "Не хватает файла из дерева вехи. Ядра social-core больше нет: правила соцсети живут в сервисах. Каждый сервис в src/microservices разложен по слоям: main.rs, lib.rs, bootstrap/ (сборка и запуск), controller/ (вход gRPC или HTTP), dto/ (перевод транспортных типов), service/ (правила и порты к соседям), repository/ (хранение за трейтами, mod.rs и memory.rs), client/ (клиенты соседей), common/ (конфиг, ошибки, доменные типы). У шлюза вместо service и repository есть routes/ (таблица WS-методов). Журнал NDJSON живёт в src/crates/journal (file/, error/), отчёт об ошибке в service-runtime/src/report, замер ленты в post-service/examples/feed_bench.rs. Остальное дерево прежнее: contracts, proto, grpc-kit, certgen, tls-edge, свои движки, framing, minifuzz, http-client, service-runtime, tools/xtask и tools/social-cli."

[[rules]]
kind = "allowed_children"
dirs = ["src"]
allowed = ["crates", "microservices"]
message.ru = "В src/ корня только две папки: crates/ для библиотек и microservices/ для сервисов."

[[rules]]
kind = "absent"
globs = ["tests/*.rs"]
message.ru = "В корне воркспейса нет пакета, поэтому tests/*.rs там никто не скомпилирует, и тесты молча перестанут работать. Тесты прошлых вех живут в tests/ своих пакетов."

[[rules]]
kind = "not_contains"
globs = ["Cargo.toml"]
regex = '^\[package\]'
message.ru = "Корневой Cargo.toml виртуальный: в нём [workspace] и общие таблицы, а [package] нет. Пакеты это src/crates/* и tools/*."

[[rules]]
kind = "contains"
globs = ["Cargo.toml"]
regex = 'resolver = "3"'
message.ru = "В виртуальном корне нужна строка `resolver = \"3\"` в [workspace]: у корня нет edition, и без неё cargo молча возьмёт старый резолвер."

[[rules]]
kind = "workspace_members"
members = [
  "src/crates/contracts",
  "src/crates/service-runtime",
  "tools/xtask",
  "src/crates/framing",
  "src/microservices/api-gateway",
  "tools/social-cli",
  "src/crates/http-engine",
  "src/crates/minifuzz",
  "src/crates/http-client",
  "src/crates/websocket-engine",
  "src/crates/proto",
  "src/microservices/user-service",
  "src/microservices/post-service",
  "src/microservices/auth-service",
  "src/crates/grpc-kit",
  "src/microservices/chat-service",
  "src/crates/certgen",
  "src/crates/tls-edge",
  "src/crates/journal",
]
message.ru = "В [workspace] members не попадают все пакеты. Удобнее всего три маски: \"src/crates/*\", \"src/microservices/*\" и \"tools/*\"."

[[rules]]
kind = "contains"
globs = ["Cargo.toml"]
regex = '^\[workspace.package\]'
message.ru = "Общие поля пакетов (version, edition, rust-version, publish) живут в [workspace.package] корня."

[[rules]]
kind = "contains"
globs = [
  "src/crates/*/Cargo.toml",
  "tools/xtask/Cargo.toml",
  "src/microservices/*/Cargo.toml",
]
regex = '^version.workspace = true'
message.ru = "Версию пакет наследует из корня: `version.workspace = true`. Тогда версия у всех одна и правится в одном месте."

[[rules]]
kind = "contains"
globs = [
  "src/crates/*/Cargo.toml",
  "tools/xtask/Cargo.toml",
  "src/microservices/*/Cargo.toml",
]
regex = '^edition.workspace = true'
message.ru = "Edition пакет наследует из корня: `edition.workspace = true`."

[[rules]]
kind = "workspace_deps"
packages = [
  "src/crates/*",
  "src/microservices/*",
  "tools/xtask",
]
message.ru = "Зависимость объявлена в пакете напрямую. Все зависимости, и внутренние крейты тоже, описываются в [workspace.dependencies] корня, а в пакете `имя.workspace = true`."

[[rules]]
kind = "deps"
package = "src/crates/contracts"
allow_only = ["serde", "serde_json"]
message.ru = "contracts это нижний слой: типы, ники, команды и контракт провода. Из чужого ему нужны только serde и serde_json, а ядро и терминал зависят от него. Стрелки идут только вниз."

[[rules]]
kind = "contains"
globs = ["Cargo.toml"]
regex = '^\[workspace.lints'
message.ru = "Правила проверок общие для всех: [workspace.lints.rust] и [workspace.lints.clippy] в корне."

[[rules]]
kind = "contains"
globs = ["Cargo.toml"]
regex = 'unsafe_code = "forbid"'
message.ru = "В [workspace.lints.rust] нужен `unsafe_code = \"forbid\"`: соцсети unsafe не нужен, и пусть компилятор это гарантирует."

[[rules]]
kind = "contains"
globs = ["Cargo.toml"]
regex = 'unwrap_used = "deny"'
message.ru = "В [workspace.lints.clippy] нужен `unwrap_used = \"deny\"`: договорённость «без unwrap» теперь проверяет clippy, в том числе в тестах (там вместо него expect с объяснением)."

[[rules]]
kind = "contains"
globs = [
  "src/crates/contracts/Cargo.toml",
  "src/crates/service-runtime/Cargo.toml",
  "tools/xtask/Cargo.toml",
  "src/crates/framing/Cargo.toml",
  "src/microservices/*/Cargo.toml",
]
regex = '^workspace = true'
message.ru = "Пакет не подключил общие правила. Без `[lints]` и строки `workspace = true` под ней правила корня на него не действуют, и никто этого не заметит. Исключение одно, test-support: ему нужен unsafe для счётчика аллокаций, и правила он пишет себе сам."

[[rules]]
kind = "contains"
globs = ["Cargo.toml"]
regex = '^\[profile.release\]'
message.ru = "Профиль релизной сборки задаётся в корне воркспейса: [profile.release] в пакетах cargo игнорирует."

[[rules]]
kind = "uniform_modules"
roots = [
  "src/crates/contracts/src",
  "src/crates/service-runtime/src",
  "tools/xtask/src",
  "src/crates/framing/src",
  "src/microservices/api-gateway/src",
  "src/crates/http-engine/src",
  "src/crates/minifuzz/src",
  "src/crates/http-client/src",
  "src/crates/websocket-engine/src",
  "src/crates/proto/src",
  "src/microservices/user-service/src",
  "src/microservices/post-service/src",
  "src/microservices/auth-service/src",
  "src/crates/grpc-kit/src",
  "src/microservices/chat-service/src",
  "src/crates/certgen/src",
  "src/crates/tls-edge/src",
]
message.ru = "В одной папке смешаны файлы-модули и папки-модули. Рядом с lib.rs лежат только папки-модули, внутри папок только файлы .rs."

[[rules]]
kind = "not_contains"
globs = ["src/crates/*/src/lib.rs", "src/microservices/*/src/lib.rs"]
regex = 'struct '
message.ru = "lib.rs крейта и сервиса это фасад: только `mod ...;` и `pub use ...;`. Структуры живут в модулях."

[[rules]]
kind = "not_contains"
globs = ["src/crates/*/src/lib.rs", "src/microservices/*/src/lib.rs"]
regex = 'enum '
message.ru = "lib.rs крейта и сервиса это фасад: только `mod ...;` и `pub use ...;`. Перечисления живут в модулях."

[[rules]]
kind = "not_contains"
globs = ["src/crates/*/src/lib.rs", "src/microservices/*/src/lib.rs"]
regex = 'impl[ <]'
message.ru = "lib.rs крейта и сервиса это фасад: только `mod ...;` и `pub use ...;`. Методы пишутся рядом со своими типами."

[[rules]]
kind = "absent"
globs = ["**/utils.rs", "**/helpers.rs"]
message.ru = "Файлы-свалки utils.rs и helpers.rs не заводим: положи функцию в модуль, которому она принадлежит."

[[rules]]
kind = "not_contains"
globs = ["src/**/*.rs", "tools/**/*.rs"]
regex = 'allow\(dead_code\)'
message.ru = "Глушилка `allow(dead_code)` не нужна: пусть компилятор подсказывает про забытый код."

[[rules]]
kind = "not_contains"
globs = [
  "src/crates/*/src/**/*.rs",
  "tools/*/src/**/*.rs",
  "tools/*/build.rs",
]
regex = '\.unwrap\(\)'
message.ru = "В коде нашёлся `.unwrap()`. Верни `Result` или `Option` и пробрось ошибку через `?`."

[[rules]]
kind = "not_contains"
globs = [
  "src/crates/*/src/**/*.rs",
  "tools/*/src/**/*.rs",
  "tools/*/build.rs",
]
regex = 'panic!'
message.ru = "В коде нашёлся `panic!`. Правила соцсети нарушаются каждый день, это не повод падать: верни ошибку."

[[rules]]
kind = "not_contains"
globs = ["src/crates/contracts/src/**/*.rs"]
regex = 'std::sync::[^A]'
message.ru = "Network, индексы, тренды, комментарии, переписка, синхронная шина событий, вызовы с провода, ошибки и contracts остаются однопоточными. Замки, атомики и каналы живут только в app/, shards/, notify/, events/bus.rs и в памяти-адаптере storage/mem. Общие неизменяемые данные в Arc можно везде: `use std::sync::Arc;`."

[[rules]]
kind = "not_contains"
globs = ["src/**/*.rs", "tools/**/*.rs"]
regex = 'static mut'
message.ru = "`static mut` это общая память без всякой защиты. Общее состояние живёт в Arc<Mutex<...>>."

[[rules]]
kind = "contains"
globs = ["Makefile"]
regex = '^\.PHONY:'
message.ru = "В Makefile нет .PHONY. Цели build, run, test, fmt, lint, check это команды, а не файлы: без .PHONY одноимённая папка или файл молча выключит цель."

[[rules]]
kind = "contains"
globs = ["Makefile"]
regex = '^SERVICE \?= '
message.ru = "Сервис для `make run` задаётся через `SERVICE ?= api-gateway`: так его можно переопределить и аргументом make, и переменной окружения."

[[rules]]
kind = "contains"
globs = ["Makefile.toml"]
regex = '^\[tasks.check\]'
message.ru = "В Makefile.toml нет задачи [tasks.check]: с этой вехи курс проверяет соцсеть командой `cargo make check`."

[[rules]]
kind = "contains"
globs = ["Makefile.toml"]
regex = 'default_to_workspace = false'
message.ru = "В [config] Makefile.toml нужен `default_to_workspace = false`, иначе cargo-make выполнит каждую задачу в каждом члене воркспейса."

[[rules]]
kind = "contains"
globs = ["Makefile.toml"]
regex = 'defaults_only = true'
message.ru = ".env подключается через env_files с `defaults_only = true`: файл дополняет окружение, но переменная из оболочки сильнее."

[[rules]]
kind = "contains"
globs = ["rust-toolchain.toml"]
regex = 'channel = "\d+\.\d+\.\d+"'
message.ru = "rust-toolchain.toml закрепляет точную версию компилятора (например, \"1.88.0\"). `stable` плывёт, и закрепление ничего не закрепляет."

[[rules]]
kind = "contains"
globs = ["rustfmt.toml"]
regex = 'use_field_init_shorthand = true'
message.ru = "В rustfmt.toml нужен `use_field_init_shorthand = true`: `Point { x: x }` пишем как `Point { x }`."

[[rules]]
kind = "contains"
globs = ["clippy.toml"]
regex = 'disallowed-methods'
message.ru = "clippy.toml должен запрещать хотя бы std::process::exit через disallowed-methods: из main возвращаем ExitCode."

[[rules]]
kind = "not_contains"
globs = ["src/crates/contracts/src/**/*.rs"]
regex = '_ =>'
message.ru = "В contracts нашлась ветка `_ =>`. Она молча проглотит новый вариант enum или новую форму команды. Назови каждую ветку, а для неизвестного имени команды привяжи его: `(other, _) =>`."

[[rules]]
kind = "contains"
globs = ["src/crates/contracts/src/chat/mod.rs"]
regex = 'let .+ else \{'
message.ru = "Ранний выход в разборе команд сессии пишется через let-else: `let Some(name) = first.strip_prefix('/') else { ... };`."

[[rules]]
kind = "contains"
globs = ["src/crates/contracts/src/chat/mod.rs"]
regex = '@ \.\.'
message.ru = "Слова команды разбираются срезовыми образцами, а текст сообщения это хвост среза: `[to, text @ ..]`."

[[rules]]
kind = "not_contains"
globs = ["src/crates/**/*.rs", "tools/**/*.rs"]
regex = 'Rc<'
message.ru = "Нашёлся `Rc<`. Обработчики и уведомители живут в сети, которую делят потоки, а Rc не Send. Общий владелец между потоками это Arc."

[[rules]]
kind = "contains"
globs = ["src/crates/contracts/src/envelope/mod.rs"]
regex = 'Value'
message.ru = "Разбор идёт в два этапа: сначала конверт, где data это serde_json::Value, потом метод выбирает тип данных. Envelope<T = Value>."

[[rules]]
kind = "not_contains"
globs = ["src/crates/contracts/src/envelope/**/*.rs", "src/crates/contracts/src/api/**/*.rs"]
regex = '\.clone\(\)'
message.ru = "В разборе конверта нашёлся `.clone()`. Данные читаются из дерева по ссылке: `T::deserialize(&envelope.data)`, &Value сам умеет быть Deserializer."

[[rules]]
kind = "contains"
globs = [
  "src/crates/contracts/src/error/mod.rs",
  "src/microservices/api-gateway/src/common/error.rs",
  "src/microservices/user-service/src/common/error.rs",
  "src/microservices/post-service/src/common/error.rs",
  "src/microservices/auth-service/src/common/error.rs",
  "src/microservices/chat-service/src/common/error.rs",
]
regex = 'pub type Result<T>'
message.ru = "У каждого крейта свой Error и свой алиас `pub type Result<T> = std::result::Result<T, Error>;` в его error/mod.rs: по сигнатуре видно, чья это неудача."

[[rules]]
kind = "contains"
globs = [
  "src/microservices/api-gateway/src/common/error.rs",
  "src/microservices/*/src/error/mod.rs",
]
regex = 'fn source'
message.ru = "Ошибка, которая оборачивает причину, отдаёт её через `source`. Без этого метода причина молча пропадёт из всех отчётов."

[[rules]]
kind = "not_contains"
globs = ["src/crates/*/src/**/*.rs"]
regex = 'Box<dyn .*Error'
message.ru = "В крейте нашёлся `Box<dyn Error>`. Библиотека отдаёт типизированные ошибки, по которым можно принять решение; коробка нужна только самому верхнему слою, main терминала."

[[rules]]
kind = "not_contains"
globs = ["src/microservices/*/src/main.rs"]
regex = 'fn main\(\) -> Result'
message.ru = "main не возвращает Result: тогда Rust сам напечатает ошибку через Debug (`Error: Custom { .. }`). Верни ExitCode, а ошибку напечатай сам: `ошибка: <цепочка причин>`."

[[rules]]
kind = "max_lines"
globs = ["src/crates/*/src/**/*.rs"]
max = 300
message.ru = "Файл длиннее 300 строк. Разложи его по смыслу: операции с постами Network живут в network/posts.rs, с комментариями в network/comments.rs, индексы в своих файлах, отрисовка строк рядом с командами."

[[rules]]
kind = "not_contains"
globs = ["src/crates/contracts/src/username/**/*.rs"]
regex = 'to_lowercase'
message.ru = "Ник переводится в нижний регистр через to_ascii_lowercase. Юникодный to_lowercase трогает не только ASCII: \"İ\" превращается в два символа, и длина и смещения уезжают."

[[rules]]
kind = "not_contains"
globs = ["src/crates/contracts/src/username/**/*.rs"]
regex = 'is_alpha'
message.ru = "Символы ника проверяются ASCII-методами (is_ascii_lowercase, is_ascii_digit). is_alphabetic и is_alphanumeric пропустят кириллицу, и «аlice» с русской «а» станет двойником alice."

[[rules]]
kind = "absent"
globs = ["**/tests/common.rs"]
message.ru = "tests/common.rs cargo считает отдельным тестом (running 0 tests), а помощники в нём другим файлам не видны. Общий модуль тестов живёт в tests/common/mod.rs."

[[rules]]
kind = "contains"
globs = [
  "src/crates/contracts/src/username/mod.rs",
  "src/crates/contracts/src/ids/mod.rs",
  "src/crates/contracts/src/cursor/mod.rs",
  "src/crates/contracts/src/envelope/mod.rs",
  "src/crates/contracts/src/clock/mod.rs",
]
regex = '^\s*/// ```'
message.ru = "У публичного API contracts нет примера. Над ником, id, курсором, конвертом и часами нужен doc-тест (`/// ```` с кодом): `cargo test` его компилирует и запускает, поэтому пример не врёт."

[[rules]]
kind = "not_contains"
globs = ["src/crates/contracts/src/**/*.rs"]
regex = '```ignore'
message.ru = "Doc-тест с ignore не запускается и молча устаревает. Пример должен собираться и проходить."

[[rules]]
kind = "contains"
globs = ["tools/xtask/src/bench.rs"]
regex = 'feed_bench'
message.ru = "`cargo xtask bench` запускает пример feed_bench ядра: `cargo run --release -p social-core --example feed_bench`."

[[rules]]
kind = "absent"
globs = ["src/crates/worker-pool"]
message.ru = "Пул потоков и SharedNetwork ушли: их работу делают задачи tokio, а ручкой ядра стал App в app/. Удали src/crates/worker-pool и social-core/src/shared."

[[rules]]
kind = "not_contains"
globs = ["src/crates/**/*.rs"]
regex = 'thread::sleep'
message.ru = "Нашёлся thread::sleep. В async-коде он держит воркер рантайма, и соседние задачи стоят; в тестах время двигает tokio::time (sleep, advance, start_paused), а работа ждёт сигнала, а не паузы."

[[rules]]
kind = "not_contains"
globs = ["src/crates/*/src/**/*.rs"]
regex = 'tokio::main'
message.ru = "#[tokio::main] ставит только бинарник: библиотечные крейты рантайм не создают, им его дают."

[[rules]]
kind = "not_contains"
globs = ["src/crates/**/*.rs", "tools/**/*.rs"]
regex = 'unbounded_channel'
message.ru = "Нашёлся unbounded_channel. Медленный потребитель, и очередь растёт, пока не кончится память. Канал с ёмкостью (mpsc::channel(n)) заставляет отправителя ждать места: это и есть backpressure."

[[rules]]
kind = "deps"
package = "src/crates/service-runtime"
allow_only = ["tokio"]
message.ru = "service-runtime это кирпич под всеми сервисами: только tokio. Ни tokio-util, ни крейтов соцсети, свой токен и учёт задач пишутся в пару экранов."

[[rules]]
kind = "deps"
package = "src/crates/service-runtime"
forbid = ["tokio-util"]
message.ru = "Готовые CancellationToken и TaskTracker из tokio-util не берём: в этой вехе их пишем сами."

[[rules]]
kind = "no_comments"
globs = ["src/crates/service-runtime/**/*.rs"]
message.ru = "В крейте service-runtime нет комментариев: имена должны говорить сами."

[[rules]]
kind = "contains"
globs = ["src/crates/service-runtime/src/token/mod.rs"]
regex = 'watch::'
message.ru = "Токен отмены стоит на tokio::sync::watch: у watch есть текущее значение, и слушатель, пришедший после отмены, не зависнет."

[[rules]]
kind = "contains"
globs = ["src/crates/service-runtime/src/token/mod.rs"]
regex = 'send_replace'
message.ru = "Отмена пишется через send_replace: обычный send без получателей ничего не запишет, и сигнал потеряется."

[[rules]]
kind = "contains"
globs = ["src/crates/service-runtime/src/supervisor/mod.rs"]
regex = 'impl<T> Drop for'
message.ru = "Ребёнок не должен пережить супервизора: держи его JoinHandle в обёртке, которая в Drop делает abort."

[[rules]]
kind = "contains"
globs = ["src/crates/service-runtime/src/shutdown/mod.rs"]
regex = 'timeout_at'
message.ru = "У всей остановки один дедлайн: каждая стадия ждёт через timeout_at до общего срока, а не свой отдельный таймаут."

[[rules]]
kind = "absent"
globs = ["src/crates/*/tests/m??_*.rs", "tools/*/tests/m??_*.rs"]
message.ru = "Тесты вех живут в tests/journey/ своего пакета (один тестовый бинарник на пакет, mod на каждую веху в tests/journey/main.rs). Старые tests/mNN_*.rs удали: их новые версии уже лежат в tests/journey/."

[[rules]]
kind = "contains"
globs = ["src/crates/contracts/src/visibility/mod.rs"]
regex = 'enum Visibility'
message.ru = "Видимость поста теперь часть формата журнала: Visibility объявлен в contracts/src/visibility, ядро его реэкспортирует."

[[rules]]
kind = "contains"
globs = ["src/crates/contracts/src/journal/mod.rs"]
regex = 'tag = "event"'
message.ru = "Запись журнала в JSON помечена полем event: #[serde(tag = \"event\", rename_all = \"snake_case\")]."

[[rules]]
kind = "not_contains"
globs = ["src/microservices/api-gateway/src/**/*.rs"]
regex = 'futures::future::BoxFuture'
message.ru = "BoxFuture уже есть в ports/repo.rs, второй из futures не нужен."

[[rules]]
kind = "not_contains"
globs = ["src/microservices/api-gateway/src/**/*.rs"]
regex = 'futures::executor'
message.ru = "У futures свой block_on, но рантайм у нас tokio: граница sync и async проходится через Runtime терминала, второй исполнитель запутает таймеры и задачи."

[[rules]]
kind = "contains"
globs = ["src/crates/service-runtime/src/console/traced.rs"]
regex = 'Future for Traced'
message.ru = "Traced это свой Future: на каждом poll он отмечает состояние, число poll и время, а в Drop снимает задачу с учёта."

[[rules]]
kind = "contains"
globs = ["src/crates/service-runtime/src/console/traced.rs"]
regex = 'impl<F> Drop for Traced'
message.ru = "Задача уходит из живых в Drop обёртки: так консоль видит и завершённые, и брошенные (abort, дроп JoinSet), и упавшие задачи."

[[rules]]
kind = "contains"
globs = ["src/crates/service-runtime/src/shutdown/mod.rs"]
regex = 'pub fn spawn'
message.ru = "Stage::spawn(имя, задача) запускает задачу стадии через консоль: трекер стадии и консоль видят одно и то же."

[[rules]]
kind = "absent"
globs = ["tools/repl"]
message.ru = "Терминал tools/repl ушёл: с соцсетью теперь говорят по сети через api-gateway, а клиент курса живёт в tools/social-cli."

[[rules]]
kind = "deps"
package = "src/crates/framing"
allow_only = ["tokio", "bytes"]
message.ru = "framing это только байты и сокеты: ему хватает tokio и bytes, ни JSON, ни ядро ему не нужны."

[[rules]]
kind = "no_comments"
globs = ["src/crates/framing/**/*.rs"]
message.ru = "Код framing говорит сам за себя: комментариев в нём нет."

[[rules]]
kind = "contains"
globs = ["src/crates/framing/src/codec/mod.rs"]
regex = 'trait Decoder'
message.ru = "Декодер это трейт: trait Decoder с decode и decode_eof."

[[rules]]
kind = "contains"
globs = ["src/crates/framing/src/codec/mod.rs"]
regex = 'trait Encoder<'
message.ru = "Кодер обобщён по типу сообщения: trait Encoder<Item>."

[[rules]]
kind = "not_contains"
globs = [
  "src/crates/framing/src/lines/**/*.rs",
  "src/crates/framing/src/length/**/*.rs",
  "src/crates/framing/src/codec/**/*.rs",
]
regex = 'AsyncRead'
message.ru = "Кодек не делает ввод-вывод: он режет байты в буфере. Читать и писать сокет умеет только Framed."

[[rules]]
kind = "contains"
globs = ["src/microservices/*/src/main.rs"]
regex = 'TcpListener::bind'
message.ru = "Каждый сервис занимает порт прямо в main.rs: TcpListener::bind по адресу из окружения, а lib.rs получает готовый слушатель в run."

[[rules]]
kind = "deps"
package = "src/microservices/api-gateway"
forbid = ["social-core"]
message.ru = "Шлюз больше не держит ни строчки ядра: личные сообщения уехали в chat-service, остальное давно в сервисах."

[[rules]]
kind = "deps"
package = "src/microservices/api-gateway"
allow_only = [
  "contracts",
  "grpc-kit",
  "service-runtime",
  "tokio",
  "http-engine",
  "websocket-engine",
  "proto",
  "tonic",
  "tls-edge",
  "certgen",
  "social-cli",
  "http-client",
  "auth-service",
  "user-service",
  "post-service",
  "chat-service",
  "tokio-stream",
  "tonic-health",
]
message.ru = "Шлюзу хватает contracts, grpc-kit, proto, tonic, service-runtime, http-engine, websocket-engine и tokio: ядра соцсети в нём больше нет. Сервисы, tonic-health, tokio-stream, клиент курса и http-client нужны только тестам."

[[rules]]
kind = "not_contains"
globs = ["src/microservices/api-gateway/src/**/*.rs"]
regex = 'serde_json'
message.ru = "JSON пишет и читает только contracts: шлюз собирает Response и Push типами contracts и кодирует через contracts::encode."

[[rules]]
kind = "not_contains"
globs = ["src/microservices/api-gateway/src/**/*.rs"]
regex = 'read_line'
message.ru = "read_line на чужом вводе растёт без предела: сообщения шлюза читает WsStream с лимитом max_message."

[[rules]]
kind = "not_contains"
globs = ["src/microservices/api-gateway/src/**/*.rs"]
regex = 'unbounded_channel'
message.ru = "Очереди шлюза ограничены: медленный клиент не должен съесть память. Нужен mpsc::channel(n)."

[[rules]]
kind = "contains"
globs = ["src/microservices/api-gateway/src/common/registry.rs"]
regex = 'pub fn deliver'
message.ru = "Push-события теперь шлёт сам шлюз после успешного вызова сервиса: Registry::deliver раздаёт их во все соединения пользователя."

[[rules]]
kind = "contains"
globs = ["src/microservices/api-gateway/src/common/registry.rs"]
regex = 'impl Drop for Registration'
message.ru = "Соединение уходит из реестра само: Drop у Registration, тогда ни обрыв, ни паника, ни abort не оставят мёртвых очередей."

[[rules]]
kind = "no_comments"
globs = [
  "src/microservices/*/src/**/*.rs",
  "src/crates/proto/src/**/*.rs",
  "src/crates/proto/build.rs",
  "src/crates/grpc-kit/src/**/*.rs",
  "src/crates/certgen/src/**/*.rs",
  "src/crates/tls-edge/src/**/*.rs",
]
message.ru = "Код сервисов говорит сам за себя: комментариев в нём нет. Пояснения к контракту живут в .proto."

[[rules]]
kind = "max_lines"
globs = ["src/microservices/*/src/**/*.rs"]
max = 300
message.ru = "Файл шлюза длиннее 300 строк. Разложи его по смыслу: accept в server/, соединение в connection/, разбор конверта в protocol/."

[[rules]]
kind = "contains"
globs = ["Makefile.toml"]
regex = '\[tasks\.demo\]'
message.ru = "В Makefile.toml есть задача demo: шлюз в фоне и клиент курса в терминале."

[[rules]]
kind = "contains"
globs = ["Makefile"]
regex = '^demo:'
message.ru = "В Makefile есть цель demo: шлюз в фоне и клиент курса в терминале."

[[rules]]
kind = "deps"
package = "src/crates/http-engine"
forbid = [
  "hyper",
  "axum",
  "httparse",
  "tokio-util",
]
message.ru = "HTTP пишем сами: ни hyper, ни axum, ни httparse, ни tokio-util движку не нужны."

[[rules]]
kind = "deps"
package = "src/crates/http-engine"
allow_only = [
  "tokio",
  "bytes",
  "serde",
  "serde_json",
  "minifuzz",
]
message.ru = "http-engine стоит на tokio и serde (JSON-хелперы); minifuzz нужен только его тестам, в [dev-dependencies]."

[[rules]]
kind = "deps"
package = "src/crates/minifuzz"
allow_only = []
message.ru = "minifuzz обходится без зависимостей: генератор, мутатор и сжатие это несколько десятков строк."

[[rules]]
kind = "no_comments"
globs = ["src/crates/http-engine/**/*.rs"]
message.ru = "Код http-engine говорит сам за себя: комментариев в нём нет."

[[rules]]
kind = "no_comments"
globs = ["src/crates/minifuzz/**/*.rs"]
message.ru = "Код minifuzz говорит сам за себя: комментариев в нём нет."

[[rules]]
kind = "contains"
globs = ["src/crates/http-engine/src/parse/mod.rs"]
regex = 'Partial'
message.ru = "Парсер инкрементальный: пока запрос не пришёл целиком, он отвечает Parsed::Partial, а не ждёт и не падает."

[[rules]]
kind = "contains"
globs = ["src/crates/http-engine/src/parse/mod.rs"]
regex = 'Smuggling'
message.ru = "Content-Length вместе с Transfer-Encoding или два разных Content-Length это контрабанда запросов: ParseError::Smuggling."

[[rules]]
kind = "contains"
globs = ["src/crates/http-engine/src/router/mod.rs"]
regex = '"Allow"'
message.ru = "Путь есть, а метода нет: 405 и заголовок Allow со списком методов."

[[rules]]
kind = "contains"
globs = ["src/crates/http-engine/src/router/mod.rs"]
regex = 'dyn Fn\(Request\)'
message.ru = "Async-обработчики живут в одной таблице: Arc<dyn Fn(Request) -> BoxFuture<Response> + Send + Sync>."

[[rules]]
kind = "not_contains"
globs = ["src/crates/http-engine/src/**/*.rs", "src/crates/minifuzz/src/**/*.rs"]
regex = 'tokio::main'
message.ru = "Библиотека не создаёт рантайм: #[tokio::main] ставит только бинарник."

[[rules]]
kind = "contains"
globs = ["src/crates/minifuzz/src/rng/mod.rs"]
regex = '0x9E37_79B9_7F4A_7C15'
message.ru = "Генератор фаззера это splitmix64: повторяемая случайность по seed без крейтов."

[[rules]]
kind = "contains"
globs = ["src/crates/minifuzz/src/fuzz/mod.rs"]
regex = 'catch_unwind'
message.ru = "Фаззер ловит панику цели через catch_unwind и отдаёт вход, на котором она случилась."

[[rules]]
kind = "contains"
globs = ["src/microservices/auth-service/src/repository/tokens.rs"]
regex = 'getrandom::'
message.ru = "Токен сессии берётся из криптостойкого генератора ОС: getrandom в tokens/ auth-service."

[[rules]]
kind = "not_contains"
globs = ["src/microservices/auth-service/src/**/*.rs"]
regex = 'SystemTime'
message.ru = "Токен из часов предсказуем: его можно угадать по времени входа."

[[rules]]
kind = "not_contains"
globs = ["src/microservices/auth-service/src/**/*.rs"]
regex = 'RandomState'
message.ru = "RandomState это сид для хеш-таблиц, а не генератор секретов: токен из него не криптостойкий."

[[rules]]
kind = "not_contains"
globs = ["src/microservices/*/src/**/*.rs"]
regex = 'minifuzz'
message.ru = "Свой splitmix64 годится фаззеру, но не секретам: токены берутся из getrandom."

[[rules]]
kind = "not_contains"
globs = ["src/microservices/api-gateway/src/**/*.rs"]
regex = '"/auth/'
message.ru = "В шлюзе больше нет /auth/*: регистрация и вход ушли в auth-service, шлюз только проверяет токены через его gRPC."

[[rules]]
kind = "contains"
globs = ["src/microservices/auth-service/src/controller/http.rs"]
regex = '/auth/login'
message.ru = "Вход по HTTP живёт в auth-service: POST /auth/register, /auth/login и /auth/logout в его http/mod.rs."

[[rules]]
kind = "contains"
globs = ["src/microservices/api-gateway/src/controller/http.rs"]
regex = '/users/:username'
message.ru = "Профиль по ссылке: GET /users/:username."

[[rules]]
kind = "contains"
globs = ["src/microservices/api-gateway/src/controller/http.rs"]
regex = '/posts/:id'
message.ru = "Пост по ссылке: GET /posts/:id."

[[rules]]
kind = "contains"
globs = [
  "src/microservices/api-gateway/src/controller/http.rs",
  "src/microservices/auth-service/src/controller/http.rs",
]
regex = '/health'
message.ru = "Проверка живости: GET /health."

[[rules]]
kind = "deps"
package = "src/crates/http-client"
forbid = [
  "hyper",
  "reqwest",
  "httparse",
]
message.ru = "Клиент HTTP пишем сами: ни hyper, ни reqwest, ни httparse ему не нужны."

[[rules]]
kind = "deps"
package = "src/crates/http-client"
allow_only = [
  "tokio",
  "bytes",
  "serde",
  "serde_json",
  "http-engine",
]
message.ru = "http-client стоит на tokio и serde (JSON-хелперы); http-engine ему можно, если захочешь взять оттуда типы."

[[rules]]
kind = "no_comments"
globs = ["src/crates/http-client/**/*.rs"]
message.ru = "Код http-client говорит сам за себя: комментариев в нём нет."

[[rules]]
kind = "contains"
globs = ["src/crates/http-engine/src/server/mod.rs"]
regex = 'sleep_until'
message.ru = "Медленный клиент шлёт заголовки по байту, и таймаут на каждый read его не остановит: нужен общий дедлайн на голову запроса (head_timeout) и sleep_until."

[[rules]]
kind = "contains"
globs = ["src/crates/http-engine/src/server/mod.rs"]
regex = 'head_timeout'
message.ru = "Дедлайны сервера настраиваются: idle_timeout, head_timeout и body_timeout в ServerConfig."

[[rules]]
kind = "contains"
globs = ["src/crates/http-engine/src/server/mod.rs"]
regex = '100 Continue'
message.ru = "Expect: 100-continue: сервер отвечает HTTP/1.1 100 Continue, прежде чем ждать тело."

[[rules]]
kind = "contains"
globs = ["src/crates/http-engine/src/server/mod.rs"]
regex = 'Semaphore'
message.ru = "Лимит соединений сервера держит Semaphore, как в шлюзе."

[[rules]]
kind = "contains"
globs = ["src/crates/http-engine/src/middleware/mod.rs"]
regex = 'pub fn apply'
message.ru = "Middleware это луковица: apply надевает слои на обработчик, первый слой самый внешний."

[[rules]]
kind = "contains"
globs = ["src/crates/http-engine/src/middleware/mod.rs"]
regex = 'WWW-Authenticate'
message.ru = "Отказ без токена это 401 с заголовком WWW-Authenticate: Bearer."

[[rules]]
kind = "contains"
globs = ["src/crates/http-engine/src/middleware/mod.rs"]
regex = 'remove\("x-user"\)'
message.ru = "X-User, пришедший от клиента, затирается до проверки токена, иначе любой назовётся кем угодно."

[[rules]]
kind = "contains"
globs = ["src/crates/http-client/src/pool/mod.rs"]
regex = 'struct Pool'
message.ru = "Пул клиента держит keep-alive соединения по (хост, порт) и выбрасывает протухшие."

[[rules]]
kind = "contains"
globs = ["src/crates/http-client/src/client/mod.rs"]
regex = 'is_idempotent'
message.ru = "Повторять на протухшем соединении можно только идемпотентный запрос: POST второй раз создаст второй заказ."

[[rules]]
kind = "contains"
globs = ["src/crates/http-client/src/client/mod.rs"]
regex = '"authorization"'
message.ru = "Authorization и Cookie не уезжают на чужой хост вслед за редиректом."

[[rules]]
kind = "contains"
globs = ["src/microservices/api-gateway/src/controller/http.rs"]
regex = 'bearer_auth'
message.ru = "/users/me закрыт Bearer-токеном: шлюз надевает bearer_auth на свои маршруты."

[[rules]]
kind = "contains"
globs = ["src/microservices/api-gateway/src/controller/http.rs"]
regex = 'access_log'
message.ru = "Журнал запросов со временем: access_log в слоях шлюза."

[[rules]]
kind = "contains"
globs = ["src/microservices/api-gateway/tests/http_api.rs"]
regex = 'http_client'
message.ru = "Свои интеграционные тесты HTTP-API шлюза ходят в него своим клиентом: http_client в tests/http_api.rs."

[[rules]]
kind = "contains"
globs = ["src/crates/http-engine/src/cors/mod.rs"]
regex = '"Vary"'
message.ru = "Ответ, который зависит от Origin, должен сказать об этом кешам: Vary: Origin."

[[rules]]
kind = "contains"
globs = ["src/crates/http-engine/src/cors/mod.rs"]
regex = 'access-control-request-method'
message.ru = "Предзапрос OPTIONS с Access-Control-Request-Method отвечает слой CORS, обработчик его не видит."

[[rules]]
kind = "contains"
globs = ["src/crates/http-engine/src/cookie/mod.rs"]
regex = 'HttpOnly'
message.ru = "Set-Cookie собирается со всеми атрибутами: Max-Age, Path, HttpOnly, Secure, SameSite."

[[rules]]
kind = "contains"
globs = ["src/crates/http-engine/src/cookie/mod.rs"]
regex = 'NoneNeedsSecure'
message.ru = "SameSite=None без Secure браузер отвергнет: to_header возвращает ошибку."

[[rules]]
kind = "contains"
globs = ["src/crates/http-engine/src/conditional/mod.rs"]
regex = '416'
message.ru = "Диапазон за концом файла это 416 с Content-Range: bytes */длина."

[[rules]]
kind = "contains"
globs = ["src/crates/http-engine/src/conditional/mod.rs"]
regex = 'if-none-match'
message.ru = "Условие If-None-Match проверяется раньше диапазона: свежей копии хватит и 304."

[[rules]]
kind = "contains"
globs = ["src/crates/http-engine/src/body/mod.rs"]
regex = 'struct BodyReader'
message.ru = "Тело запроса можно читать кусками с лимитом: BodyReader для Content-Length и chunked."

[[rules]]
kind = "contains"
globs = [
  "src/microservices/api-gateway/src/controller/http.rs",
  "src/microservices/auth-service/src/controller/http.rs",
]
regex = 'vec!\[cors\('
message.ru = "CORS стоит снаружи всех слоёв шлюза, иначе предзапрос без токена получит 401: первым в списке идёт cors(..)."

[[rules]]
kind = "contains"
globs = [
  "src/microservices/api-gateway/src/controller/http.rs",
  "src/microservices/auth-service/src/controller/http.rs",
]
regex = 'token_from_cookie'
message.ru = "Браузер носит токен в cookie: token_from_cookie превращает её в Bearer до проверки."

[[rules]]
kind = "contains"
globs = ["src/microservices/auth-service/src/controller/handlers.rs"]
regex = 'http_only: true'
message.ru = "Cookie сессии недоступна скриптам страницы: http_only: true."

[[rules]]
kind = "contains"
globs = ["src/microservices/auth-service/src/controller/handlers.rs"]
regex = 'SameSite::Lax'
message.ru = "Cookie сессии SameSite=Lax: чужой сайт не отправит её в POST-запросе."

[[rules]]
kind = "contains"
globs = ["src/microservices/auth-service/src/controller/handlers.rs"]
regex = 'SetCookie::delete'
message.ru = "Выход стирает cookie: SetCookie::delete с тем же Path."

[[rules]]
kind = "contains"
globs = ["src/microservices/api-gateway/src/controller/avatars.rs"]
regex = 'serve_bytes'
message.ru = "Аватар отдаётся с ETag, 304 и Range через serve_bytes движка."

[[rules]]
kind = "contains"
globs = ["src/microservices/api-gateway/src/common/config.rs"]
regex = 'GATEWAY_CORS_ORIGINS'
message.ru = "Белый список origin приходит из окружения: GATEWAY_CORS_ORIGINS в config/mod.rs."

[[rules]]
kind = "not_contains"
globs = ["src/microservices/api-gateway/src/controller/**/*.rs"]
regex = '"\*"'
message.ru = "\"*\" в белом списке вместе с cookie браузер не примет, а разрешать всем отвечать с чужими cookie опасно: перечисли origin явно."

[[rules]]
kind = "absent"
globs = [
  "src/microservices/api-gateway/src/server",
  "src/microservices/api-gateway/src/connection",
]
message.ru = "NDJSON-порт ушёл: конверты ходят текстовыми фреймами WebSocket по GET /ws на HTTP-порту, поэтому цикла accept и построчного соединения в шлюзе больше нет."

[[rules]]
kind = "not_contains"
globs = ["src/microservices/api-gateway/src/**/*.rs"]
regex = 'LinesCodec'
message.ru = "Шлюз больше не режет строки: каждое сообщение WebSocket это один конверт."

[[rules]]
kind = "deps"
package = "src/crates/websocket-engine"
forbid = [
  "tungstenite",
  "tokio-tungstenite",
  "base64",
  "tokio-util",
]
message.ru = "WebSocket пишем сами: ни tungstenite, ни tokio-tungstenite, ни base64, ни tokio-util движку не нужны."

[[rules]]
kind = "deps"
package = "src/crates/websocket-engine"
allow_only = [
  "tokio",
  "bytes",
  "sha1",
  "http-engine",
  "minifuzz",
]
message.ru = "websocket-engine стоит на tokio, bytes, sha1 (для Accept) и http-engine (Upgrade); minifuzz нужен только его тестам."

[[rules]]
kind = "no_comments"
globs = ["src/crates/websocket-engine/**/*.rs"]
message.ru = "Код websocket-engine говорит сам за себя: комментариев в нём нет."

[[rules]]
kind = "contains"
globs = ["src/crates/websocket-engine/src/handshake/mod.rs"]
regex = '258EAFA5-E914-47DA-95CA-C5AB0DC85B11'
message.ru = "Sec-WebSocket-Accept это SHA-1 от ключа клиента и GUID из RFC 6455, в base64."

[[rules]]
kind = "contains"
globs = ["src/crates/websocket-engine/src/handshake/mod.rs"]
regex = 'allowed_origins'
message.ru = "Проверка Origin при рукопожатии: чужая страница не откроет сокет с cookie пользователя."

[[rules]]
kind = "contains"
globs = ["src/crates/websocket-engine/src/frame/mod.rs"]
regex = 'MaskRequired'
message.ru = "Фрейм клиента без маски это нарушение протокола: ProtoError::MaskRequired."

[[rules]]
kind = "contains"
globs = ["src/crates/websocket-engine/src/frame/mod.rs"]
regex = '1009'
message.ru = "Сообщение больше лимита закрывается кодом 1009."

[[rules]]
kind = "contains"
globs = ["src/crates/websocket-engine/src/assembler/mod.rs"]
regex = 'InvalidUtf8'
message.ru = "Текст проверяется на UTF-8 по мере сборки фрагментов: битый байт это 1007 сразу."

[[rules]]
kind = "contains"
globs = ["src/crates/websocket-engine/src/stream/mod.rs"]
regex = 'Opcode::Pong'
message.ru = "На ping отвечает сам WsStream: pong уходит, пока приложение ждёт в recv."

[[rules]]
kind = "contains"
globs = ["src/crates/http-engine/src/upgrade/mod.rs"]
regex = 'pub rest'
message.ru = "Upgrade поверх http-engine: ответ 101 с крючком on_upgrade получает сокет вместе с уже прочитанными байтами."

[[rules]]
kind = "contains"
globs = ["src/crates/http-engine/src/server/mod.rs"]
regex = '101'
message.ru = "Сервер передаёт сокет крючку сразу после ответа 101."

[[rules]]
kind = "contains"
globs = ["src/microservices/api-gateway/src/controller/http.rs"]
regex = '"/ws"'
message.ru = "WebSocket шлюза живёт на том же HTTP-порту: маршрут GET /ws."

[[rules]]
kind = "contains"
globs = ["src/microservices/api-gateway/src/controller/ws.rs"]
regex = 'check_upgrade'
message.ru = "Рукопожатие проверяется до того, как сессия займёт место: check_upgrade раньше ожидания слота."

[[rules]]
kind = "contains"
globs = ["src/microservices/api-gateway/src/controller/ws.rs"]
regex = 'acquire_owned'
message.ru = "Число сессий ограничено Semaphore: лишний клиент ждёт ответа 101, пока не освободится место."

[[rules]]
kind = "contains"
globs = ["src/microservices/api-gateway/src/controller/conn.rs"]
regex = 'idle_for'
message.ru = "Молчание клиента меряется по последней вести от него: ws.idle_for() против idle_timeout, а pong на ping тоже весть."

[[rules]]
kind = "contains"
globs = ["src/microservices/api-gateway/src/controller/ws.rs"]
regex = '1001'
message.ru = "При остановке шлюз закрывает сокеты кодом 1001 (going away)."

[[rules]]
kind = "exists"
paths = [
  "src/microservices/api-gateway/src/routes/mod.rs",
  "src/microservices/api-gateway/src/common/registry.rs",
]
message.ru = "Шлюз реального времени держит реестр соединений в registry/ и таблицу методов в routes/."

[[rules]]
kind = "absent"
globs = [
  "src/microservices/api-gateway/src/session",
  "src/microservices/api-gateway/src/hub",
  "src/crates/contracts/src/session",
]
message.ru = "Автомата сессии и хаба больше нет: сокет представлен с рукопожатия, соединения живут в registry/, а session.hello и session.bye ушли из контракта."

[[rules]]
kind = "contains"
globs = ["src/microservices/api-gateway/src/routes/mod.rs"]
regex = '\.route_authed\('
message.ru = "Таблица методов: открытые маршруты через .route, действия от имени пользователя через .route_authed."

[[rules]]
kind = "contains"
globs = ["src/microservices/api-gateway/src/routes/mod.rs"]
regex = 'act_as'
message.ru = "Пользователь приходит в обработчик из сокета, а не из data: act_as в маршрутах route_authed."

[[rules]]
kind = "contains"
globs = ["src/microservices/api-gateway/src/client/auth.rs"]
regex = 'validate_token'
message.ru = "Токен проверяет auth-service: шлюз зовёт ValidateToken, а UNAUTHENTICATED отличает от недоступного сервиса."

[[rules]]
kind = "contains"
globs = ["src/microservices/api-gateway/src/controller/ws.rs"]
regex = 'auth\.check'
message.ru = "Токен проверяется до 101 через трейт: без токена или с чужим токеном клиент получает 401 обычным ответом, а не сокет."

[[rules]]
kind = "contains"
globs = ["src/microservices/api-gateway/src/common/registry.rs"]
regex = '1008'
message.ru = "Очередь соединения ограничена и держит место под Close: переполнение это отключение с 1008."

[[rules]]
kind = "contains"
globs = ["src/microservices/api-gateway/src/controller/conn.rs"]
regex = 'kicked\(\)'
message.ru = "Запись в сокет, застрявшая на медленном клиенте, прерывается сигналом отключения."

[[rules]]
kind = "contains"
globs = ["src/microservices/api-gateway/src/controller/conn.rs"]
regex = 'interval_at'
message.ru = "Heartbeat: сервер сам шлёт ping по interval."

[[rules]]
kind = "contains"
globs = ["src/microservices/api-gateway/src/controller/conn.rs"]
regex = 'max_in_flight'
message.ru = "Запросы одного соединения идут параллельно в JoinSet, но не больше max_in_flight."

[[rules]]
kind = "contains"
globs = ["src/microservices/api-gateway/src/controller/conn.rs"]
regex = 'JoinSet'
message.ru = "Запросы одного соединения идут параллельно в JoinSet, но не больше max_in_flight."

[[rules]]
kind = "contains"
globs = ["src/crates/contracts/src/push/mod.rs"]
regex = 'tag = "event", content = "data"'
message.ru = "Push это событие {event, data}: тег event и поля в data, без id."

[[rules]]
kind = "contains"
globs = ["src/crates/websocket-engine/src/stream/mod.rs"]
regex = 'pub fn idle_for'
message.ru = "WsStream помнит, когда в последний раз слышал собеседника: idle_for."

[[rules]]
kind = "contains"
globs = ["src/crates/proto/build.rs"]
regex = 'tonic_prost_build'
