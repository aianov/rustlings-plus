globs = ["src/microservices/auth-service/src/repository/mod.rs"]
regex = 'fn create_if_absent'
message.ru = "Учётная запись создаётся атомарно: create_if_absent в репозитории auth-service."

[[rules]]
kind = "contains"
globs = ["src/microservices/post-service/src/service/directory.rs"]
regex = 'pub trait UserDirectory'
message.ru = "Сосед это порт на стороне потребителя: трейт UserDirectory в service/ post-service."

[[rules]]
kind = "contains"
globs = ["src/microservices/post-service/src/client/users.rs"]
regex = 'impl UserDirectory for GrpcUsers'
message.ru = "За портом UserDirectory стоит gRPC-клиент в client/."

[[rules]]
kind = "contains"
globs = ["src/microservices/post-service/src/service/mod.rs"]
regex = 'users\.author\('
message.ru = "Пост пишется только от существующего автора: service спрашивает порт users.author."

[[rules]]
kind = "contains"
globs = ["src/microservices/post-service/src/service/mod.rs"]
regex = '\.graph\(viewer\)'
message.ru = "Подписки и скрытия читателя приходят через порт: users.graph перед лентой."

[[rules]]
kind = "contains"
globs = ["src/microservices/chat-service/src/service/directory.rs"]
regex = 'pub trait UserDirectory'
message.ru = "chat-service спрашивает про собеседника через свой порт UserDirectory."

[[rules]]
kind = "contains"
globs = ["src/microservices/chat-service/src/service/mod.rs"]
regex = 'MessageTooLong'
message.ru = "Правила сообщений (себе, пустое, длинное) живут в service chat-service."

[[rules]]
kind = "contains"
globs = ["src/microservices/auth-service/src/service/directory.rs"]
regex = 'pub trait ProfileDirectory'
message.ru = "auth-service создаёт профиль через порт ProfileDirectory, а не вызовом gRPC из обработчика."

[[rules]]
kind = "contains"
globs = ["src/microservices/user-service/src/service/mod.rs"]
regex = 'SelfFollow'
message.ru = "Нельзя подписаться на себя: это правило в service user-service."

[[rules]]
kind = "contains"
globs = ["src/microservices/post-service/src/service/mod.rs"]
regex = 'EmptyPost'
message.ru = "Пустой пост отсекается в service, до похода к соседу."

[[rules]]
kind = "contains"
globs = [
  "src/microservices/user-service/src/repository/memory.rs",
  "src/microservices/post-service/src/repository/memory.rs",
  "src/microservices/chat-service/src/repository/memory.rs",
  "src/microservices/auth-service/src/repository/accounts.rs",
]
regex = 'Journal<'
message.ru = "In-memory репозитории пишут журнал крейта journal."

[[rules]]
kind = "deps"
package = "src/crates/journal"
allow_only = [
  "serde",
  "serde_json",
  "tokio",
]
message.ru = "journal это NDJSON на диске: serde, serde_json и tokio, больше ничего."

[[rules]]
kind = "no_comments"
globs = ["src/crates/journal/src/**/*.rs"]
message.ru = "Код журнала говорит сам за себя."

[[rules]]
kind = "contains"
globs = ["tools/xtask/src/bench.rs"]
regex = '"post-service"'
message.ru = "Замер ленты переехал вместе с лентой: cargo xtask bench запускает пример post-service."

[[rules]]
kind = "contains"
globs = ["src/crates/service-runtime/src/report/mod.rs"]
regex = 'pub fn report'
message.ru = "Отчёт об ошибке с цепочкой причин общий для всех сервисов: service_runtime::report."
