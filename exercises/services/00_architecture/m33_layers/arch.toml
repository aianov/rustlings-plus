[[rules]]
kind = "deps"
package = "src/microservices/post-service"
allow_only = [
  "contracts",
  "grpc-kit",
  "journal",
  "proto",
  "serde",
  "service-runtime",
  "tokio",
  "tokio-stream",
  "tonic",
  "tonic-health",
  "user-service",
