[[exercises]]
name = "svres1"
style = "scratch"
hint.ru = [
  '''Остаток срока это разность между моментом срока и «сейчас», а «сейчас» берётся с часов tokio (`tokio::time::Instant`): тогда в тестах время управляется. Разность не должна паниковать, когда срок уже прошёл.''',
  '''Заголовок хранит целые миллисекунды остатка. Округляй вниз: лишняя миллисекунда это обещание, которое мы не вправе давать. При разборе число сначала проверяется как положительное целое, потом ограничивается потолком.''',
  '''Для `run_with` нужны два шага: проверить срок до того, как future вообще тронута, и обернуть её в ограничение по моменту (не по длительности). Обрати внимание, что обычный таймаут опрашивает future хотя бы раз.''',
]
why.ru = '''Срок хранится моментом, а не длительностью: оставшееся время всегда считается по часам, и пересылать срок вниз можно в любой точке цепочки. Проверка «вышел ли срок» до первого опроса важна: таймаут нулевой длины всё равно опрашивает future, и работа успеет начаться, а мы хотели её не начинать. Мусор в заголовке даёт `None`, а не ноль, потому что «нет срока» и «срок уже вышел» разные ситуации, и потолок защищает от клиента, который просит себе десять минут.'''

[[exercises]]
name = "svres2"
style = "fix"
hint.ru = [
  '''Выпиши, где в этой цепочке есть ожидание и кто его ограничивает. Шлюз ограничивает своё ожидание. А кто ограничивает работу сервисов, которые он вызвал, если шлюз ушёл?''',
  '''Срок должен родиться у шлюза и поехать вниз внутри запроса. Каждый сервис обязан, во-первых, не начинать шаг после срока, а во-вторых, прерывать начатый шаг в срок. Для обоих действий у тебя уже есть `run_with`.''',
  '''Обёртка, которая принимает необязательный срок, получится маленькой: есть срок, тогда `run_with`, нет срока, тогда как раньше. Не забудь про вложенный вызов: user-service получает тот же срок, что получил post-service, а не новый.''',
]
why.ru = '''Таймаут у шлюза останавливает только ожидание шлюза. Сервис на другой машине об этом не знает, поэтому срок обязан ехать в самом запросе и проверяться на каждом шаге сервиса. Обрати внимание на вложенность: каждый сервис передаёт дальше полученный срок, а не придумывает свой, иначе цепочка ждёт сумму таймаутов. Прерывание шага тоже входит в смысл: без него сервис дожидается конца начатого шага, и «призрак» живёт столько, сколько длится самый длинный шаг.'''

[[exercises]]
name = "svres_q5"
kind = "question"
question.ru = '''Клиент готов ждать 2 секунды. Шлюз делает до трёх попыток к сервису, у каждой попытки свой таймаут в одну секунду, пауз нет. Сервис отвечает всегда через 5 секунд. Что происходит?'''
options.ru = [
  '''шлюз отвечает клиенту ошибкой через 1 секунду''',
  '''шлюз работает 3 секунды, а клиент ушёл на второй секунде, и две последние секунды работы бесполезны''',
  '''шлюз отвечает ошибкой ровно через 2 секунды и останавливается''',
  '''шлюз ждёт 5 секунд, пока сервис не ответит''',
]
answer = [1]
explain.ru = '''Три попытки по секунде дают три секунды работы, потому что ограничение стоит на каждой попытке, а не на запросе в целом. Клиент уходит через две секунды, но шлюз об этом не знает и делает третью попытку впустую. Общий срок запроса (с учётом уже потраченного) решает проблему: на третьей попытке шлюз увидел бы, что остаток нулевой, и не начал бы её.'''
hint.ru = '''Сложи таймауты попыток и сравни с терпением клиента. Кто сообщает шлюзу, что клиент уже ушёл?'''

[[exercises]]
name = "svres3"
style = "todo"
hint.ru = [
  '''Сначала общее условие про время: если после паузы времени не остаётся, не повторяем ничего, при любом коде. Дальше `match` по коду.''',
  '''Подумай, что значит каждый код для того, кто повторяет. «Недоступен» говорит, что до сервера не дошло. Остальные «неоднозначные» (внутренняя ошибка, таймаут, неизвестная, прерванная операция) говорят, что сервер, возможно, уже что-то сделал.''',
  '''Три группы: всегда (недоступен), только для идемпотентных (четыре кода) и никогда (всё остальное, включая перегрузку: тому, кто просит притормозить, повтор не поможет).''',
]
why.ru = '''Решение «повторять или нет» зависит от трёх вещей, и ни одну нельзя выбросить. Код ошибки говорит, поможет ли повтор. Идемпотентность говорит, безопасен ли он. Остаток срока говорит, успеет ли он. «Перегружен» не повторяют, потому что сервер как раз просит снизить нагрузку, а повтор делает обратное. Отдельный разговор про `DeadlineExceeded`: для идемпотентного запроса повтор разумен, но только если общий срок ещё не вышел, поэтому условие про время стоит первым.'''

[[exercises]]
name = "svres4"
style = "scratch"
hint.ru = [
  '''Две функции. Потолок: базовая пауза, умноженная на два в степени номера попытки, но не больше `cap`. Сама пауза: случайная доля потолка.''',
  '''Степень двойки переполнится быстро: на попытке 40 уже. Номер ограничь сверху (31 хватит), а умножение длительности на число делай насыщающим (`saturating_mul`).''',
  '''Случайность приходит снаружи как число из [0, 1). Для полного джиттера это доля потолка: умножь его на это число (`mul_f64`).''',
]
why.ru = '''Полный джиттер нужен именно «от нуля»: тогда толпа клиентов, упавших одновременно, размазывается по всему окну, а не по его верхней половине. Случайность приходит снаружи через типаж, поэтому тесты точны (подставили 0.5, получили половину потолка), а настоящий код подставит генератор. Переполнение степени классическая засада: сервис живёт неделю, у какого-то клиента накопилось 70 попыток, и вычисление паузы роняет весь процесс.'''

[[exercises]]
name = "svres5"
style = "fix"
hint.ru = [
  '''Посчитай: сколько раз база получит обращение от одного запроса, если каждый из трёх слоёв повторяет три раза? Какое число должно получиться?''',
  '''Повторять должен один слой, остальные только передают ошибку вверх. Какой слой лучший кандидат: тот, что знает общий срок запроса, или тот, что ближе всех к сбою? Подойдёт любой, но выбери осознанно.''',
  '''Убери вызов с повторами из двух слоёв и оставь в одном. Проверь, что короткий сбой из двух неудач подряд по-прежнему переживается, а лежащая база получает ровно столько обращений, сколько у одного слоя попыток.''',
]
why.ru = '''Повторы множатся: три слоя по три попытки дают 27 обращений на один запрос. Правило «один слой отвечает за повторы» тривиально звучит и постоянно нарушается, потому что каждый слой пишут по отдельности и каждому разумно перестраховаться. Выбор слоя дело вкуса: на краю (у шлюза) хорошо, потому что он знает общий срок и бюджет повторов; у самой зависимости хорошо, потому что повтор не перезапускает работу вышележащих слоёв. Главное, чтобы повторяющий слой был ровно один.'''

[[exercises]]
name = "svres_q1"
kind = "question"
question.ru = '''Приложение пробует запрос до 3 раз, шлюз до 3 раз, сервис заказов до 2 раз, и ещё драйвер базы данных до 2 раз. База недоступна. Сколько обращений к базе может породить один клик пользователя?'''
options.ru = [
  '''10, по числу попыток в сумме''',
  '''12, по максимальному слою''',
  '''36, по произведению попыток всех слоёв''',
  '''9, три слоя по три''',
]
answer = [2]
explain.ru = '''Каждая попытка верхнего слоя запускает всю цепочку ниже заново, поэтому попытки перемножаются: 3 × 3 × 2 × 2 = 36. Глубина цепочки превращает «небольшой запас на повтор» в лавину. Это и есть шторм повторов, и именно поэтому повторяет один слой, а остальные возвращают ошибку наверх.'''
hint.ru = '''Каждая попытка верхнего слоя запускает что именно ниже?'''

[[exercises]]
name = "svres6"
style = "scratch"
hint.ru = [
  '''Это счёт: сколько повторов можно позволить себе сейчас. Одно число, которое растёт и убывает.''',
  '''Запрос приносит маленькую долю (параметр `ratio`), повтор тратит единицу. Копить без предела нельзя, иначе после тихой недели кредит выльется в первую же секунду аварии. Потолок накопления равен резерву.''',
  '''Старт с полным резервом: холодный сервис может позволить себе несколько первых повторов. Повтор разрешён, если на счёте не меньше единицы. Дробные числа сравнивай осторожно: десять раз по 0.1 не всегда ровно единица.''',
]
why.ru = '''Бюджет повторов превращает «сколько раз повторять один запрос» в «сколько повторов позволяет себе сервис в целом». Это то, что надо, когда сервис болен: при полном отказе поток повторов ограничен десятой долей потока запросов, а не удвоением его. Потолок накопления защищает от обратной стороны: длинная тишина не должна давать права на лавину. Резерв нужен, чтобы единичный сбой на холодном старте не остался без повтора вообще.'''

[[exercises]]
name = "svres7"
style = "scratch"
hint.ru = [
  '''Что нужно помнить для каждого ключа? Результат (id созданного поста), момент создания (чтобы ключ устаревал) и то, с каким телом запроса он пришёл.''',
  '''Ключ принадлежит пользователю: ищи по паре (пользователь, ключ). Если запись найдена и свежая, ответь по ней: то же тело даёт сохранённый результат, другое тело это ошибка клиента.''',
  '''Запись создаётся только после успешного создания поста. Тогда неудавшийся запрос не занимает ключ, и исправленный запрос с тем же ключом проходит.''',
]
why.ru = '''Ключ идемпотентности связывает намерение клиента с результатом. Поэтому ответ хранится вместе с телом запроса: тот же ключ и другое тело значит, что клиент перепутал ключи, и молча вернуть чужой результат было бы багом. Ключи привязаны к пользователю, иначе один пользователь мог бы получить чужой пост, угадав ключ. Срок жизни нужен, потому что таблица ключей растёт, а повторы поздно позже суток не приходят.'''

[[exercises]]
name = "svres_q2"
kind = "question"
question.ru = '''Клиент отправил `POST /orders` с ключом `Idempotency-Key: K`. Соединение оборвалось до получения ответа. Клиент повторил запрос с тем же ключом. Какое из утверждений верно?'''
options.ru = [
  '''заказа точно не было, и повтор его создаст''',
  '''в любом случае после повтора создан ровно один заказ, а ответ клиент получит один и тот же''',
  '''если сервер медленный, ключ можно не слать''',
  '''повтор без ключа равноценен, если тело то же''',
]
answer = [1]
explain.ru = '''Клиент не знает, дошёл ли первый запрос. С ключом оба исхода хороши: если не дошёл, повтор создаст заказ и сохранит ответ, если дошёл, сервер найдёт ключ и вернёт сохранённый ответ. Без ключа сервер не отличит повтор от нового заказа с тем же содержимым (человек и правда мог заказать две одинаковые пиццы), поэтому «то же тело» не доказательство.'''
hint.ru = '''Что в обоих исходах (запрос дошёл, не дошёл) происходит у сервера при втором запросе с ключом?'''

[[exercises]]
name = "svres8"
style = "bughunt"
hint.ru = [
  '''Нарисуй временную линию двух запросов с одним ключом. Когда первый записывает свой результат? Что видит второй, проверив ключ раньше этого момента?''',
  '''Занимать ключ нужно до начала работы, под той же блокировкой, где проверяется его наличие. Запись в таблице получает два состояния: «в работе» и «готово». Блокировку нельзя держать на время записи в базу, иначе разные ключи встанут в очередь друг за другом.''',
  '''Второй запрос, увидев «в работе», ждёт сигнала от первого и затем смотрит на ключ ещё раз. Сигнал нужен и при успехе, и при ошибке, и при отмене создателя. Для отмены удобен объект с `Drop`, который освобождает ключ.''',
]
why.ru = '''Проверка и занятие должны быть одной неделимой операцией, иначе между ними всегда есть окно. «В работе» решает гонку, а ожидание результата вместо повторной работы даёт нужную семантику: клиент получает ответ первого. Три пути выхода создателя (успех, ошибка, отмена) должны освобождать ключ, поэтому освобождение сидит в `Drop`: забытая ветка оставила бы ключ занятым навсегда, а каждый последующий запрос с ним ждал бы призрака.'''

[[exercises]]
name = "svres9"
style = "scratch"
hint.ru = [
  '''Состояние это три значения, но «открыт, пауза прошла» и «полуоткрыт» связаны временем. Проще хранить момент, до которого предохранитель открыт, и выводить состояние при каждом обращении.''',
  '''Окно последних результатов хранится очередью фиксированной длины. После каждого результата в закрытом состоянии: добавь, обрежь лишнее, проверь условие (достаточно вызовов и доля неудач не меньше порога). Открылся: очисти окно.''',
  '''Выданное разрешение должно уметь сообщить результат и обязано считаться неудачей, если его выбросили без ответа (`Drop`). Для пробы запомни в разрешении, что оно пробное: результат пробы закрывает или снова открывает предохранитель.''',
]
why.ru = '''Окно по количеству вызовов, а не по времени, делает поведение предсказуемым в тестах и не требует таймеров. `min_calls` защищает от решений по трём вызовам: одна неудача из двух это 50%, но это ничего не значит. Проба нужна, потому что вслепую открыть шлюз нельзя: нужно доказательство выздоровления. Выброшенный permit считается неудачей по той же причине, по которой считается медленный ответ: вызов, который не дал ответа, тоже свидетельство болезни.'''

[[exercises]]
name = "svres_q3"
kind = "question"
question.ru = '''Предохранитель открывается, когда в окне не меньше 6 вызовов и доля неудач не меньше 50%. Результаты идут подряд: успех, неудача, успех, неудача, неудача, успех. Потом приходит седьмой вызов. Что с ним?'''
options.ru = [
  '''пройдёт: неудач три из шести, и порог ещё не достигнут''',
  '''будет отвергнут сразу: на шестом результате доля стала ровно 50%, а порог «не меньше»''',
  '''пройдёт как проба''',
  '''будет отвергнут, потому что две неудачи подряд''',
]
answer = [1]
explain.ru = '''Шесть вызовов набралось (условие min_calls выполнено), неудач три из шести, то есть ровно половина, а порог звучит «не меньше». Предохранитель открылся сразу после шестого результата. Серия подряд для него не важна: он смотрит на долю в окне, поэтому и перемежающиеся сбои вроде «через раз» его открывают.'''
hint.ru = '''Проверь оба условия открытия после каждого из шести результатов. На каком шаге они впервые выполнились?'''

[[exercises]]
name = "svres10"
style = "bughunt"
hint.ru = [
  '''Что делает предохранитель, когда пауза прошла и одновременно пришло двадцать запросов? Сколько из них он пропустит, и что получит оживающий сервис?''',
  '''Проба одна. Нужен признак «проба уже в пути», и пока он поднят, остальные запросы получают отказ. Признак опускается, когда проба сообщила результат (любой) или её выбросили.''',
  '''Вторая проблема в обработке результатов: результат вызова, начатого до открытия, не должен менять состояние. Различать вызовы можно по тому, пробный ли он: только результат пробы закрывает или снова открывает предохранитель.''',
]
why.ru = '''Предохранитель, который пускает толпу в полуоткрытом состоянии, воспроизводит ту самую аварию, от которой защищает: больной сервис получает всю накопившуюся нагрузку сразу. Один пробный запрос это единственный способ проверить выздоровление дёшево. Запоздавшие ответы старых вызовов отдельная ловушка: они отражают прошлое состояние зависимости и не имеют права ни закрывать предохранитель, ни продлевать его паузу.'''

[[exercises]]
name = "svres_q6"
kind = "question"
question.ru = '''user-service отвечает без ошибок, но на каждый вызов тратит 30 секунд. Предохранитель в шлюзе считает только ответы с ошибкой, и у вызова нет собственного срока. Что произойдёт и что поможет?'''
options.ru = [
  '''предохранитель откроется, потому что вызовы долгие''',
  '''ошибок нет, предохранитель не откроется; вызовы копятся и съедают воркеров; помогут срок вызова (с учётом таймаута как неудачи) и переборка на зависимость''',
  '''помогут повторы: второй вызов окажется быстрым''',
  '''ничего не произойдёт, медленные ответы безвредны''',
]
answer = [1]
explain.ru = '''Медленный успех для такого предохранителя не отличим от быстрого. Вызовы копятся: каждый держит воркера и соединение на полминуты, пока места не кончатся. Нужны два приёма вместе: срок на вызов (его срабатывание считается неудачей, и тогда предохранитель замечает болезнь) и переборка, которая ограничивает число зависших вызовов, чтобы они не отняли места у остальных зависимостей.'''
hint.ru = '''Что видит предохранитель в этой ситуации и сколько вызовов будет висеть одновременно?'''

[[exercises]]
name = "svres11"
style = "fix"
hint.ru = [
  '''Сколько мест у зависимости «user» и у зависимости «post» на самом деле? Кто занимает место, когда вызов к «user» висит?''',
  '''Для каждой зависимости нужен свой счётчик свободных мест (семафор). Вызов берёт место у своей зависимости, а не у общего пула. Незнакомое имя зависимости это ошибка настроек, а не место из общего пула.''',
  '''Место нужно взять без ожидания: нет места, значит, отказ сразу. Освобождение отдай объекту, который живёт, пока живёт вызов: тогда и отмена вызова вернёт место сама.''',
]
why.ru = '''Общий пул отдаёт места тому, кто успел первым, а значит, самому медленному: он держит место дольше всех. Переборки закрепляют места за зависимостью, и ущерб от одной больной ограничивается её долей. Отказ без ожидания принципиален: очередь перед переборкой, это те же заблокированные ожидающие, только на другом этаже. А возврат места через `Drop` гарантирует, что отменённый вызов не потеряет место навсегда.'''

[[exercises]]
name = "svres12"
style = "scratch"
hint.ru = [
  '''Хранить нужно число жетонов (дробное!) и момент последнего пополнения. Пополнение считается лениво, при обращении, а не таймером.''',
  '''При каждом обращении: прошедшее время умножить на скорость, добавить к жетонам, обрезать до размера ведра, запомнить текущий момент. Только после этого решать, хватает ли жетона.''',
  '''Если жетона не хватает, ничего не списывай и посчитай, через сколько он появится: недостающая доля жетона делённая на скорость. Дробную часть жетона не выбрасывай.''',
]
why.ru = '''Ленивое пополнение (по времени между обращениями) не требует фоновых задач и таймеров: ведро просто знает, сколько прошло. Дробные жетоны принципиальны: если округлять вниз при каждом обращении, клиент, который приходит чаще, чем капает жетон, не получит ничего никогда. Подсказка `retry_after` делает отказ полезным: клиент знает, когда приходить, и не долбит повторами.'''

[[exercises]]
name = "svres_q4"
kind = "question"
question.ru = '''Ведро: 5 жетонов в секунду, размер 10, на старте полное. Клиент шлёт ровно 20 запросов в секунду, равномерно, в течение 3 секунд (первый в момент нуля). Сколько запросов пройдёт?'''
options.ru = [
  '''около 15, по 5 в секунду''',
  '''около 25: 10 из начального запаса и около 15 от пополнения''',
  '''около 35''',
  '''все 60''',
]
answer = [1]
explain.ru = '''В начале ведро полное: первые десять запросов проходят из запаса. Потом проходит столько запросов, сколько капнуло жетонов: за три секунды около пятнадцати. Всего около 25. Запас не «бесплатный» в долгой перспективе: он даёт один всплеск, а средняя скорость всё равно равна 5 в секунду. Поэтому запас называют burst, а не квотой.'''
hint.ru = '''Откуда берутся жетоны: сколько их было в начале и сколько добавится за три секунды?'''

[[exercises]]
name = "svres13"
style = "bughunt"
hint.ru = [
  '''Что остаётся в карте после того, как адрес сделал один запрос и ушёл навсегда? Как отличить ведро, которое можно выбросить без последствий, от того, которое забывать нельзя?''',
  '''Выбросить без последствий можно ведро, которое успело наполниться до краёв: оно неотличимо от нового. Опустошённое ведро нарушителя выбрасывать нельзя, иначе он получит свежий всплеск.''',
  '''Обходить всю карту на каждом запросе слишком дорого. Достаточно чистки раз в время полного наполнения ведра: за такой период любое ведро, к которому не обращались, гарантированно полное. Запомни момент последней чистки.''',
]
why.ru = '''Утечка памяти в лимитере особенно коварна: растёт она ровно пропорционально числу уникальных клиентов, то есть атакующий сам управляет скоростью. Выбрасывать можно только то, что неотличимо от нового, а тест с опустошённым ведром ловит наивные решения («очищать всё раз в минуту», «удалять старые записи»). Чистка раз в период наполнения даёт амортизированную стоимость O(1) на запрос, а полный обход на каждом вызове сделал бы лимитер уязвимостью сам.'''

[[exercises]]
name = "svres14"
style = "scratch"
hint.ru = [
  '''Три части. Счётчик мест, ответ 503 и цикл приёма соединений. Начни со счётчика: он должен быть безопасным для гонки, то есть проверка и увеличение одним атомарным действием.''',
  '''Место (`Admit`) освобождается в `Drop`, поэтому его достаточно просто унести вместе с задачей обработки. Для ответа важны формат (`\r\n` в конце каждой строки, пустая строка после заголовков) и округление `Retry-After` вверх.''',
  '''В цикле приёма отказ не должен задерживать приём следующих соединений: запись ответа отправь в отдельную задачу и сразу иди ждать нового клиента. Под отказанное соединение не создавай ни обработчик, ни буфер.''',
]
why.ru = '''Отказывать нужно на самом входе и как можно дешевле. Атомарное «проверил и занял» (`fetch_update`) исключает ситуацию, когда два потока одновременно видят одно свободное место. Запись ответа в отдельной задаче важна: медленный клиент, который не читает свой 503, иначе заблокирует приём всех остальных. Округление `Retry-After` вверх и минимум в секунду нужны потому, что заголовок целочисленный: `0` значил бы «приходи немедленно» и сводил на нет смысл отказа.'''

[[exercises]]
name = "svres15"
style = "fix"
hint.ru = [
  '''Что происходит с запросом, у которого клиент уже потерял терпение, но который стоит в очереди перед воркерами? Кто тратит на него время?''',
  '''Нужно ограничить число запросов в системе (в очереди и в работе вместе) и отказывать сверх этого сразу. Подумай, чему равно допустимое число. Клиент ждёт 300 мс, воркер тратит 20 мс на запрос, воркеров четыре.''',
  '''Занимай место до постановки в очередь (без ожидания, отказ сразу) и привяжи его к самому заданию: оно освободится, когда воркер закончит или задание выбросят. Проверь на нормальной нагрузке, что отказов нет.''',
]
why.ru = '''Без ограничения очередь растёт, ожидание превышает терпение клиента, и воркеры занимаются мёртвыми запросами: пропускная способность есть, а полезная работа около нуля. Ограничение очереди выбирается не «побольше на всякий случай», а из терпения клиента: запрос, принятый в систему, должен успеть. Примерная длина: воркеры, умноженные на (терпение клиента, делённое на время обслуживания), с запасом. Слишком маленький лимит ломает нормальную нагрузку, поэтому тест проверяет и её.'''

[[exercises]]
name = "svres16"
style = "fix"
hint.ru = [
  '''Выпиши, что сейчас происходит с запросом, когда user-service недоступен, и что в итоге видит пользователь. Какие данные у нас уже есть?''',
  '''Лестница из четырёх ступеней: свежий кэш, живой вызов (с ограничением по времени), устаревший кэш в пределах срока годности, заглушка. На каждой ступени решается, нужно ли идти ниже. Ограничение по времени для зависшего сервиса не забудь.''',
  '''Недоступность и «нет такого» различай: первая спускает по лестнице, вторая возвращается как есть и вычёркивает запись из кэша. Результат несёт пометки «устаревший» и «заглушка», а лента помечается, если хоть один из профилей деградировал.''',
]
why.ru = '''Деградация это договорённость о том, что показывать, когда идеала нет. Пометки обязательны: клиент должен знать, что данные могли устареть, а не принимать их за свежие. Срок годности устаревшего кэша тоже нужен: имя, которому неделя, может оказаться чужим. Ошибка «не найдено» это настоящий ответ, подменять её кэшем нельзя: пользователь, удалённый час назад, вернулся бы в ленту. Ограничение по времени вызова превращает «завис» в «недоступен» и приводит к тому же пути.'''

[[exercises]]
name = "svres_quiz"
kind = "project"
quiz = true
style = "todo"
locked = ["src/crates/guard/tests/gateway.rs"]
hint.ru = [
  '''Кирпичи (срок, повторы с бюджетом, предохранитель, ограничитель входа) готовы и лежат в своих модулях. Тебе нужно соединить их в `Gateway::call`. Порядок защиты написан в комментарии над функцией, и он важен.''',
  '''Тело `call`: место на входе, место у зависимости, срок, потом цикл попыток. В цикле: разрешение у предохранителя, вызов под сроком, исход разрешения (успех или неудача зависимости, а ошибки клиента не вина зависимости), решение о повторе (`should_retry`, пауза с джиттером, бюджет), сон и снова.''',
  '''Для `create_post` нужен ключ, один на запрос и разный у разных. Счётчик в шлюзе уже есть. Не забудь, что ключ делает запрос идемпотентным, поэтому `call` вызывается с соответствующим признаком.''',
]
why.ru = '''Здесь собран весь набор. Порядок защит осмысленный: отказ на входе дешевле всего и идёт первым, переборка ограничивает ущерб до обращения к предохранителю, предохранитель до самого вызова, срок охватывает вызов, повторы живут внутри срока. Каждая попытка берёт разрешение заново, потому что состояние предохранителя может измениться между попытками. Ошибки клиента не должны открывать предохранитель, иначе один любитель запрашивать несуществующее отключит здоровую зависимость для всех. Ключ идемпотентности один на запрос, а не на попытку: иначе повтор после потерянного ответа создал бы второй пост.'''

