test_command = ["cargo", "make", "check"]
requires = ["nats"]
hint.ru = [
"""Начни с service-runtime: каждый приём проверяется отдельно на времени, поставленном на паузу (`start_paused`,
`advance`). Предохранитель держи под `Mutex` со всем состоянием сразу: переход Open → HalfOpen и выдача единственной
пробы должны случиться под одним замком, иначе две задачи обе решат, что они проба.""",
"""Бюджет повторов это ведро: каждый вызов кладёт долю жетона, каждый повтор забирает целый. Когда сосед лежит,
повторы быстро съедают бюджет, и дальше идут только первые попытки: шторма нет.""",
"""Ключ идемпотентности: `tokio::sync::OnceCell::get_or_try_init` сам заставит второй одновременный запрос ждать
первого. Ошибку не запоминай: после отказа повтор с тем же ключом должен попробовать снова.""",
"""Ведро адреса и сброс нагрузки не должны трогать `/health`: иначе проверка готовности стенда сама съест жетоны
и упрётся в 503.""",
]
story.ru = """Соцсеть больше не падает вместе с соседом: лента открывается без user-service с пометкой про устаревшие
профили, повторы не устраивают шторм на поднимающийся сервис, один шумный пользователь не съедает шлюз, при перегрузке
шлюз сразу честно отвечает 503 с Retry-After, а дважды отправленный пост остаётся одним постом."""
