<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PATCH в три состояния</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1c2330; --muted: #5d6879; --line: #c9d0db;
  --box: #eef1f6; --boxline: #aeb8c8; --ok: #1f8a4c; --bad: #c92a2a; --warn: #d9820f; --accent: #2f6fe0; --track: #e3e8f0;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14181f; --panel: #1b212b; --ink: #e6ebf3; --muted: #9aa6b8; --line: #384152;
    --box: #232b38; --boxline: #4a566b; --ok: #51cf66; --bad: #ff6b6b; --warn: #ffa94d; --accent: #6ea4ff; --track: #2a3342;
  }
}
:root[data-theme="dark"] {
  --bg: #14181f; --panel: #1b212b; --ink: #e6ebf3; --muted: #9aa6b8; --line: #384152;
  --box: #232b38; --boxline: #4a566b; --ok: #51cf66; --bad: #ff6b6b; --warn: #ffa94d; --accent: #6ea4ff; --track: #2a3342;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 980px; margin: 0 auto; padding: 16px; }
h1 { font-size: 20px; margin: 0 0 4px; }
p.sub { margin: 0 0 12px; color: var(--muted); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
button, select { font: inherit; color: var(--ink); background: var(--box); border: 1px solid var(--boxline); border-radius: 6px; padding: 5px 12px; cursor: pointer; }
button:hover:enabled { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
.spacer { flex: 1; }
svg { width: 100%; height: auto; display: block; }
svg text { fill: var(--ink); font-size: 13px; }
svg .muted { fill: var(--muted); font-size: 12px; }
#caption { margin-top: 12px; min-height: 84px; }
.step { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>PATCH: три состояния поля</h1>
  <p class="sub">У каждого поля три состояния. Выбери тело запроса и смотри, что происходит с профилем.</p>
  <div class="panel">
    <div class="bar">
      <label>Сценарий <select id="scenario"></select></label>
      <span class="spacer"></span>
      <button id="reset">Сброс</button>
      <button id="prev">Назад</button>
      <button id="next">Шаг</button>
      <button id="play">Играть</button>
      <button id="theme">Тема</button>
    </div>
    <svg viewBox="0 0 940 400" role="img" aria-label="PATCH">
      <g id="scene"></g>
    </svg>
    <div id="caption" aria-live="polite"></div>
  </div>
</main>
<script>
"use strict";
const NS = "http://www.w3.org/2000/svg";
function el(name, attrs, parent, text) {
  const e = document.createElementNS(NS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}
const BEFORE = { displayName: "Alice", bio: "люблю Rust", birthYear: "1999" };
const FIELDS = ["displayName", "bio", "birthYear"];
const SCEN = {
  bio: { title: "{\"bio\": \"новое\"}", body: '{"bio":"новое"}', mode: "tri", states: ["Missing", "Value", "Missing"],
    after: ["Alice", "новое", "1999"], note: "Прислано одно поле. Остальные не тронуты." },
  nul: { title: "{\"bio\": null}", body: '{"bio":null}', mode: "tri", states: ["Missing", "Null", "Missing"],
    after: ["Alice", "(пусто)", "1999"], note: "null очищает bio, остальные не тронуты." },
  bad: { title: "{\"displayName\": null}", body: '{"displayName":null,"bio":"ok"}', mode: "tri", states: ["Null", "Value", "Missing"],
    after: ["Alice", "люблю Rust", "1999"], error: "displayName: null_not_allowed", note: "Имя очищать нельзя: ошибка, и профиль не меняется вовсе (даже bio)." },
  opt: { title: "наивный Option: имя и год стёрлись", body: '{"bio":"новое"}', mode: "opt", states: ["None", "Some", "None"],
    after: ["(пусто)", "новое", "(пусто)"], note: "Option не различает «нет поля» и null: отсутствующие поля стёрлись." }
};
const ACTION = { Missing: "не трогаем", Null: "очищаем", Value: "ставим значение", None: "None: стереть?", Some: "ставим значение" };
const scene = document.getElementById("scene");
function render() {
  scene.textContent = "";
  const sc = SCEN[sel.value];
  const stage = idx < 0 ? 0 : idx + 1;
  el("rect", { x: 20, y: 20, width: 420, height: 70, rx: 8, fill: "var(--box)", stroke: "var(--boxline)" }, scene);
  el("text", { x: 36, y: 46, class: "muted" }, scene, "тело запроса PATCH:");
  el("text", { x: 36, y: 72, style: "font-family:ui-monospace,Menlo,monospace;font-size:15px" }, scene, sc.body);
  el("text", { x: 470, y: 46, class: "muted" }, scene, "профиль до:");
  el("text", { x: 470, y: 72, style: "font-family:ui-monospace,Menlo,monospace;font-size:14px" }, scene,
    BEFORE.displayName + " | " + BEFORE.bio + " | " + BEFORE.birthYear);
  FIELDS.forEach((f, i) => {
    const y = 130 + i * 70;
    el("rect", { x: 20, y: y, width: 900, height: 56, rx: 8, fill: "var(--panel)", stroke: "var(--boxline)" }, scene);
    el("text", { x: 36, y: y + 34, style: "font-weight:700" }, scene, f);
    if (stage >= 2) {
      const st = sc.states[i];
      const warn = sc.mode === "opt" && st === "None";
      el("rect", { x: 230, y: y + 12, width: 120, height: 32, rx: 16, fill: "var(--" + (warn ? "bad" : st === "Value" || st === "Some" ? "ok" : st === "Null" ? "warn" : "boxline") + ")" }, scene);
      el("text", { x: 290, y: y + 33, "text-anchor": "middle", style: "fill:#fff;font-weight:700" }, scene, st);
    }
    if (stage >= 3) el("text", { x: 380, y: y + 34 }, scene, ACTION[sc.states[i]]);
    if (stage >= 4) {
      const wrong = sc.mode === "opt" && sc.states[i] === "None";
      el("text", { x: 620, y: y + 34, style: "font-family:ui-monospace,Menlo,monospace;fill:var(--" + (sc.error ? "muted" : wrong ? "bad" : "ink") + ")" }, scene, "после: " + (sc.error ? BEFORE[f] : sc.after[i]));
    }
  });
  if (stage >= 4 && sc.error) el("text", { x: 20, y: 360, style: "fill:var(--bad);font-weight:700" }, scene, "422: " + sc.error);
  const texts = [
    "Клиент прислал PATCH. Сервер должен понять, что именно он хочет сделать с каждым полем.",
    "serde разбирает тело: для каждого поля определяется состояние. Отсутствующее поле не передаётся в deserialize вообще, это Default.",
    "По состоянию понятно действие: Missing значит «не трогай», Null значит «очисти», Value значит «проверь и поставь».",
    "Изменения применяются на копии профиля и записываются, только если ошибок нет. " + sc.note
  ];
  caption.innerHTML = idx < 0
    ? '<span class="step">Шаг 0 из 4</span><br>Выбери тело запроса и нажми «Шаг».'
    : '<span class="step">Шаг ' + (idx + 1) + ' из 4</span><br>' + texts[idx];
  finish();
}
const caption = document.getElementById("caption");
const sel = document.getElementById("scenario");
const btnPrev = document.getElementById("prev"), btnNext = document.getElementById("next");
const btnPlay = document.getElementById("play"), btnReset = document.getElementById("reset");
let idx = -1, timer = null;
for (const k in SCEN) { const o = document.createElement("option"); o.value = k; o.textContent = SCEN[k].title; sel.appendChild(o); }
function steps() { return [0, 1, 2, 3]; }
function stop() { if (timer) { clearInterval(timer); timer = null; } btnPlay.textContent = "Играть"; }
function next() { if (idx < steps().length - 1) { idx++; render(); } }
btnNext.onclick = () => { stop(); next(); };
btnPrev.onclick = () => { stop(); if (idx >= 0) { idx--; render(); } };
btnReset.onclick = () => { stop(); idx = -1; render(); };
btnPlay.onclick = () => {
  if (timer) { stop(); return; }
  if (idx >= steps().length - 1) idx = -1;
  btnPlay.textContent = "Пауза";
  next();
  timer = setInterval(next, 2600);
};
sel.onchange = () => { stop(); idx = -1; render(); };
document.getElementById("theme").onclick = () => {
  const root = document.documentElement;
  const dark = getComputedStyle(root).getPropertyValue("--bg").trim() === "#14181f";
  root.setAttribute("data-theme", dark ? "light" : "dark");
};
function finish() {
  btnPrev.disabled = idx < 0;
  btnNext.disabled = idx >= steps().length - 1;
  if (idx >= steps().length - 1) stop();
}


render();
</script>
</body>
</html>
