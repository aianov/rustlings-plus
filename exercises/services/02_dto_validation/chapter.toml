[chapter]
title.en = "DTOs and a hand-written validator"
title.ru = "DTO и свой валидатор"

[[chapter.visuals]]
file = "visuals/validation_pipeline.html"
title.ru = "Путь входных данных: serde, нормализация, правила, доменный тип"

[[chapter.visuals]]
file = "visuals/patch_tristate.html"
title.ru = "PATCH: поле не пришло, пришло null, пришло значение"

[[exercises]]
name = "svdto1"
style = "todo"
hint.ru = """Имена полей в JSON задаются атрибутом serde на структуре (`rename_all`), а умолчание для отсутствующего поля атрибутом на самом поле (`default`). `Option` необязательное поле делает сам."""
why.ru = """DTO описывает внешний формат: клиенту удобен camelCase, а Rust-коду snake_case, и их разводит один атрибут, а не переименование полей. `Option<T>` в serde означает «можно не присылать», а `#[serde(default)]` подставляет умолчание. Неверный тип (год строкой) остаётся ошибкой разбора, а не молчаливым преобразованием."""

[[exercises]]
name = "svdto2"
style = "todo"
hint.ru = """Один из двух DTO должен ругаться на неизвестные поля, а другой терпеть. В serde для этого есть атрибут на структуре; для терпимого не нужно ничего."""
why.ru = """Строгий разбор подходит там, где клиент и сервер договариваются о каждом поле (вход, смена пароля): лишнее поле тут либо опечатка, либо попытка протащить своё. Терпимый нужен там, где формат будет расти без твоего ведома (параметры поиска, события внешних систем): падать на новом поле значит ломать клиентов при каждом релизе."""

[[exercises]]
name = "svdto_q1"
kind = "question"
question.ru = """Платёжный провайдер присылает на твой webhook события. Договор: поля, которые ты читаешь (`id`, `status`, `amount`), не меняются, но провайдер время от времени добавляет в событие новые поля. Какой разбор у DTO webhook правильный?
```rust
#[derive(Deserialize)]
struct PaymentEvent { id: String, status: String, amount: u64 }
```"""
options.ru = [
  "добавить `#[serde(deny_unknown_fields)]`: так мы заметим любые изменения формата",
  "оставить как есть: лишние поля игнорируются, а нужные при этом проверяются",
  "разбирать в `serde_json::Value` и проверять вручную: так надёжнее",
  "добавить `#[serde(default)]` на всю структуру",
]
answer = [1]
explain.ru = """Строгий разбор на webhook превратит каждое новое поле провайдера в отказ обрабатывать платежи, причём у всех клиентов провайдера одновременно. Строгим DTO место там, где формат под твоим контролем. Здесь важнее другое: нужные поля обязательны (без `id` разбор провалится), а остальное можно спокойно пропустить. `default` на всей структуре сделал бы поля необязательными, а это вредно: событие без `amount` не должно считаться событием."""
hint.ru = """Кто решает, какие поля бывают в событии: ты или провайдер?"""

[[exercises]]
name = "svdto3"
style = "bughunt"
hint.ru = [
  """Посмотри, во что разбирается тело запроса. Если это структура, в которой есть `role` и `id`, клиент может задать их тоже.""",
  """Нужен отдельный тип только для того, что клиенту можно менять: `displayName` и `bio`. Отказ на лишние поля даёт атрибут serde на структуре.""",
  """Применяй к пользователю поля из этого узкого DTO, а не из структуры домена. Ошибка разбора должна называть поле: serde делает это сам.""",
]
why.ru = """Mass assignment: разбор запроса в доменную структуру делает любое её поле доступным клиенту, в том числе `role` и `id`. Входной DTO описывает только то, что клиенту разрешено менять, а лишнее поле отклоняется с понятной ошибкой, а не молча игнорируется (молчание скрывает и опечатки клиента, и попытки взлома). Домен и DTO это разные типы именно из-за этого."""

[[exercises]]
name = "svdto4"
style = "bughunt"
hint.ru = [
  """Сейчас каждая проверка заканчивается `return Err(...)`. Что должно происходить вместо этого?""",
  """Заведи `Vec<FieldError>`, добавляй в него по ошибке на каждую неудачную проверку и в конце смотри, пуст ли он. Порядок проверок задаёт порядок ошибок.""",
]
why.ru = """Форма с пятью ошибками, которая показывает по одной за отправку, раздражает сильнее любой ошибки. Валидатор собирает все: каждая проверка независима и добавляет запись, а решение «прошло или нет» принимается в конце. Машинный код (`too_short`) нужен клиенту для перевода и подсветки поля, сообщение для человека, поле для привязки к форме."""

[[exercises]]
name = "svdto5"
style = "scratch"
hint.ru = [
  """Длина в символах это `chars().count()`, а не `len()`. Пробелы по краям уберёт `trim`, но до подсчёта.""",
  """В `check_len` сначала посчитай длину один раз, потом сравни с минимумом и максимумом, а в сообщении назови реальную длину.""",
]
why.ru = """`len()` считает байты: десять русских букв это двадцать байт, а смайлик четыре. Человек считает видимые символы, поэтому лимит должен считаться по `chars()`. Пробелы по краям обрезаются до подсчёта, иначе «  ab  » пройдёт как шесть символов. Составные символы (буква плюс диакритика) в курсе считаются по частям: полноценный подсчёт графем требует внешней таблицы Unicode, и для лимитов поля этого обычно не нужно."""

[[exercises]]
name = "svdto6"
style = "bughunt"
hint.ru = [
  """В коде три места, где строка рассматривается как набор байтов. Найди их: подсчёт длины, обрезка по краям, срез `[..n]`.""",
  """Срез `&name[..n]` берёт байты и паникует, если граница попала внутрь символа. Собирай префикс из символов: `chars().take(n).collect::<String>()`.""",
]
why.ru = """Все три жалобы это одна ошибка: смешение байтов и символов. `len()` завышает кириллицу, отсутствие `trim` пропускает пробелы, а срез по байтам падает с паникой на первой же русской букве. Паника в обработчике это отказ в обслуживании: достаточно прислать правильно подобранное имя."""

[[exercises]]
name = "svdto7"
style = "scratch"
hint.ru = [
  """Умолчания применяй первыми (`unwrap_or`), а потом проверяй получившиеся значения. Ошибки складывай в вектор, не прерываясь.""",
  """Для тегов заведи список уже виденных (в нижнем регистре) и проверяй каждый обрезанный тег: пустой, длинный, повтор. Путь ошибки `tags[i]` собери через `format!`.""",
]
why.ru = """Ограничения размеров защищают сервис: без предела на `limit` один запрос положит базу, без предела на число тегов один запрос съест память. Значения проверяются после применения умолчаний, а ошибки собираются все. Повторы тегов сравниваются без учёта регистра: «Rust» и «rust» это один тег."""

[[exercises]]
name = "svdto8"
style = "scratch"
hint.ru = [
  """Ник: сначала длина в символах, потом первый символ (строчная латинская буква), потом остальные (буква, цифра или `_`).""",
  """Почта: `split('@')` должен дать ровно две части. Домен делится по точке на метки, и все метки непустые, а меток хотя бы две.""",
]
why.ru = """Проверка почты по настоящему стандарту огромна и всё равно не говорит, существует ли ящик: это знает только письмо с подтверждением. Поэтому проверяем «похоже на адрес» и не отказываем из-за экзотики вроде `+tag`. Лишняя строгость превращается в потерянных пользователей, а лишняя мягкость в мусор в базе, который отсечёт подтверждение."""

[[exercises]]
name = "svdto9"
style = "scratch"
hint.ru = [
  """Разбор делится на элементы: каждый это «что сопоставляем» (символ, любой, класс) плюс границы повтора `min` и `max`. Квантификатор относится к последнему элементу.""",
  """Сопоставление рекурсивное: для элемента попробуй взять максимум повторов, потом меньше, пока остаток шаблона не сойдётся с остатком строки. Совпадение целое, когда шаблон и строка закончились вместе.""",
  """Чтобы восемь `a*` не перебирали все варианты, запоминай пары «номер элемента, позиция», из которых совпасть уже не вышло (`HashSet`), и сразу отвечай «нет» при повторе.""",
]
why.ru = """Такой мини-шаблон это регулярка без чудес: символы, классы и повторы. Жадный повтор должен уметь отдавать символы обратно (иначе `a*ab` не совпадёт с `aaab`), а это откат, и без запоминания неудачных состояний он экспоненциален. Запомненная пара (элемент, позиция) превращает перебор в полиномиальный. Именно из-за таких откатов регулярные выражения на пользовательском вводе опасны, и в своём шаблоне ты видишь, откуда берётся ReDoS."""

[[exercises]]
name = "svdto10"
style = "todo"
hint.ru = [
  """Путь строится из частей: имя поля, точка для вложенности, `[i]` для элемента списка. Для вложенных структур передавай префикс вниз.""",
  """Порядок ошибок идёт по порядку полей структуры: text, author, links, poll. Внутри списка по индексам.""",
]
why.ru = """Ошибка без места бесполезна: «слишком длинное» где? Путь вида `links[2].url` позволяет клиенту подсветить именно ту ссылку. Он строится рекурсивно из префикса, и тот же приём работает на любую глубину. Ошибка самого списка (`links`, слишком много) и ошибки его элементов (`links[1].url`) различаются путём."""

[[exercises]]
name = "svdto11"
style = "scratch"
hint.ru = [
  """Ник и почта: `trim` и `to_lowercase` (он понимает Unicode, в том числе кириллицу).""",
  """Для отображаемого имени сначала выбрось невидимые символы (`\\u{200B}`, `\\u{200C}`, `\\u{200D}`, `\\u{2060}`, `\\u{FEFF}`), потом `split_whitespace` и `join(" ")` схлопнут пробелы.""",
]
why.ru = """Нормализация приводит значение к единому виду до проверок и сохранения, и всё остальное (уникальность, длина, формат) становится проще. Невидимые символы это ловушка: «Bob» и «Bob» с нулевым пробелом внутри выглядят одинаково, а различаются как строки, и ими пользуются для подделки имён. Нормализация идемпотентна: повторное применение ничего не меняет, это и есть проверка, что она сделана правильно."""

[[exercises]]
name = "svdto_q2"
kind = "question"
question.ru = """Магазин регистрирует покупателей по почте. Покупатель вводит `  Maria@Mail.RU `, а в базе уже лежит `maria@mail.ru`. В каком порядке обрабатывать значение?"""
options.ru = [
  "проверить формат, проверить уникальность по введённому значению, сохранить введённое",
  "обрезать и привести к нижнему регистру, проверить формат, атомарно вставить с проверкой уникальности по нормализованному значению",
  "сохранить как есть, а при поиске всегда сравнивать без учёта регистра",
  "проверить уникальность по введённому значению, потом нормализовать и сохранить",
]
answer = [1]
explain.ru = """Нормализация идёт первой: все дальнейшие шаги работают с единым видом значения. Тогда `  Maria@Mail.RU ` и `maria@mail.ru` совпадают при проверке уникальности, и в базе лежит только нормальный вид. Вариант «сохранить как есть» перекладывает проблему на каждый будущий запрос, а варианты, где уникальность проверяется до нормализации, пропустят двойника. Атомарность вставки (из прошлой главы) нужна по-прежнему: нормализация не отменяет гонку."""
hint.ru = """Какое значение должно участвовать в сравнении на уникальность?"""

[[exercises]]
name = "svdto12"
style = "bughunt"
hint.ru = [
  """Проследи путь значения `Alice` по функции: в какой момент оно приводится к нижнему регистру и с чем сравнивается до этого?""",
  """Приведи ник и почту к нормальному виду первым делом, и дальше работай только с нормализованными значениями: проверка формата, уникальность, сохранение.""",
]
why.ru = """Проверки были правильными, но выполнялись над сырым вводом: «Alice» проходила проверку уникальности, потому что в базе лежала «alice». Нормализуй первым шагом, и дальше все правила работают с единым видом, а в хранилище попадает только он. Этот баг ловят тестом с вариантами написания: регистром, пробелами, соседними полями (почтой)."""

[[exercises]]
name = "svdto13"
style = "scratch"
hint.ru = [
  """Поле newtype приватное, поэтому создать его можно только внутри модуля, в `try_from`. Нормализацию и проверку делай именно там.""",
  """В `Registration::try_from` посчитай оба результата, прежде чем возвращаться, и собери ошибки обоих в порядке полей.""",
]
why.ru = """«Parse, don't validate»: проверка превращается в преобразование типа. Всякий код, принявший `Username`, знает, что значение уже нормализовано и допустимо, и перепроверять его не нужно. Конструктора без проверки нет, потому что поле приватное: нельзя случайно создать «ник» из мусора. Ошибки обоих полей собираются вместе, как и раньше."""

[[exercises]]
name = "svdto14"
style = "bughunt"
hint.ru = [
  """Тесты передают в `rename` значение типа `Username`. Сейчас сервис принимает `String`.""",
  """Поменяй тип параметра сервиса на `Username`, и компилятор сам укажет все места, где непроверенная строка пыталась пройти. Разбор сырого ввода перенеси в контроллер.""",
]
why.ru = """Проверка внутри сервиса «на всякий случай» держится на дисциплине: следующий разработчик добавит новый путь и забудет её. Тип держится на компиляторе: `rename(id, Username)` просто нельзя вызвать с сырой строкой. Граница (контроллер) превращает ввод в тип и сообщает об ошибке, а сервис работает только с проверенными значениями."""

[[exercises]]
name = "svdto15"
style = "scratch"
hint.ru = [
  """`Option<T>` сам по себе различает только «нет» и «есть». Если десериализовать в `Option<T>` внутри метода `deserialize`, то `null` даст `None`, а значение `Some`. А «поля вообще нет» метод `deserialize` не увидит: его не вызовут.""",
  """Значит, состояние `Missing` приходит от `Default`, а в структуре нужен атрибут serde, который берёт `Default` для отсутствующего поля.""",
]
why.ru = """serde вызывает `deserialize` только для присланных полей: у отсутствующего метод не вызывается вообще, поэтому `Missing` это `Default`, а «прислали `null`» и «прислали значение» различает внутренний `Option<T>`. Вся тонкость в этом разделении ролей. Один раз написанный `Patch<T>` работает для любого типа, и PATCH перестаёт быть угадайкой."""

[[exercises]]
name = "svdto_q3"
kind = "question"
question.ru = """Каталог магазина обновляет товар через PATCH. DTO такой:
```rust
#[derive(Deserialize)]
struct ProductPatch {
    description: Option<String>,
}
```
Клиент шлёт `{}`, затем `{"description": null}`, затем `{"description": ""}`. Какие значения получит поле `description` в трёх случаях?"""
options.ru = [
  "None, None, Some(\"\")",
  "None, Some(null), Some(\"\")",
  "None, None, None",
  "ошибка разбора на втором теле",
]
answer = [0]
explain.ru = """serde сливает отсутствие поля и `null` в `None`: у `Option` нет способа сохранить различие. Поэтому по такому DTO нельзя понять, хотел клиент оставить описание как есть или очистить его. Пустая строка это значение, она даёт `Some("")`. Чтобы различать «не трогать» и «очистить», нужен тип с тремя состояниями (`Missing`, `Null`, `Value`)."""
hint.ru = """Что serde делает с `null` для `Option`, и вызывается ли разбор поля, которого нет в теле?"""

[[exercises]]
name = "svdto16"
style = "bughunt"
hint.ru = [
  """Тип `Option<String>` для поля PATCH не различает «не прислано» и `null`. Для этого в файле лежит `Patch<T>`.""",
  """Разбирай в структуру с `Patch<...>` (с `#[serde(default)]` на полях) и применяй по состояниям: `Missing` пропусти, `Null` очисти (для `displayName` это ошибка), `Value` проверь и поставь.""",
  """Чтобы при любой ошибке профиль не менялся вообще, готовь изменения на копии (`profile.clone()`) и записывай её обратно только если ошибок нет.""",
]
why.ru = """PATCH это три состояния на каждое поле, и каждое что-то значит: не прислано (не трогай), `null` (очисти, если можно), значение (проверь и поставь). Изменения готовятся на копии и применяются целиком или никак: частично применённый PATCH хуже отказа, потому что клиент не знает, что из присланного сработало."""

[[exercises]]
name = "svdto_validator"
kind = "project"
style = "scratch"
locked = ["src/crates/validation/tests/acceptance.rs"]
hint.ru = [
  """Начни с `Pattern` (задача svdto9) и `FieldError`: остальное опирается на них. Потом `Validator` с путями, потом правила.""",
  """Правила это значения (`CharLen`, `Range`, `Matches`, `MaxItems`...) с общим трейтом `Rule<T>`: `check` возвращает `Option<(&'static str, String)>` (код и сообщение). `Validator::check` останавливается на первой упавшей проверке поля.""",
]
why.ru = """Крейт validation собирает всё из главы в одну библиотеку: комбинаторы правил, сбор ошибок по путям, мини-шаблон и типизированные конструкторы. Правила это значения с общим трейтом, а не макросы: их можно хранить, комбинировать и проверять по отдельности. Путь складывается из областей (`scope`) и индексов, поэтому вложенность любой глубины даёт честные пути."""

[[exercises]]
name = "svdto_grpc"
kind = "project"
style = "fix"
locked = ["src/microservices/profile-service/tests/acceptance.rs"]
hint.ru = [
  """В proto3 у скалярного поля нет «не прислано»: пустая строка и отсутствие одно и то же. Различие даёт `optional`.""",
  """Для `optional string bio` prost генерирует `Option<String>`. Из `None` делай `Patch::Missing`, из `Some(\"\")` значение. Очистка в gRPC выражается отдельным флагом, а не `null`.""",
]
why.ru = """В proto3 пустая строка и «поле не пришло» неразличимы, пока поле не помечено `optional`: тогда prost отдаёт `Option`, и PATCH получает свои три состояния. Контроллер превращает proto в DTO, DTO в домен, а ошибки проверки в `Status::invalid_argument` с перечнем полей: клиент видит не «неверный запрос», а какое поле исправить."""

