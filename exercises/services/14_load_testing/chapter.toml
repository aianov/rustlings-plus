title.en = "Load testing"
title.ru = "Нагрузочное тестирование"

[[chapter.visuals]]
file = "visuals/coordinated_omission.html"
title.ru = "Скоординированное упущение: что видят закрытый и открытый генераторы"

[[chapter.visuals]]
file = "visuals/littles_law.html"
title.ru = "Закон Литтла и насыщение: запросы в системе и время ответа у потолка"

[[exercises]]
name = "svload1"
style = "todo"
hint.ru = '''Отсортируй копию выборки и возьми элемент с номером `ceil(q * n)`, считая с единицы. Следи за краями: пустая выборка, `q` равное нулю и `q` больше единицы не должны выходить за границы массива.'''
why.ru = '''Перцентиль по ближайшему рангу возвращает реальное измеренное значение, а не придуманное между двумя. Пустая выборка и единственный замер это нормальные частные случаи, а не повод паниковать: генератор запускают и на нулевое время. Входную выборку не меняют, иначе вызывающий неожиданно получит отсортированный список. И главное для всей главы: среднее 110 мс и p99 в 5 секунд живут в одном и том же прогоне, поэтому отчёт всегда несёт перцентили и максимум рядом со средним.'''

[[exercises]]
name = "svload2"
style = "scratch"
hint.ru = [
  '''Вероятность того, что все `n` независимых вызовов быстрые, это произведение вероятностей. А что тогда «хотя бы один медленный»?''',
  '''Вторая функция обращает первую: надо найти долю `q`, чтобы `q` в степени `n` дало заданную долю быстрых целого. Степень с дробным показателем здесь, корень `n`-й степени.''',
  '''Третья собирает первые две с перцентилем: квантиль целого `q` у одного сервиса это квантиль `q^(1/n)`, и его уже можно взять по выборке готовой функцией `percentile`.''',
]
why.ru = '''Вероятности независимых событий перемножаются, и у веера из `n` вызовов хвост одного сервиса становится нормой для целого. Отсюда обратная формула `q^(1/n)`: чтобы p99 целого был в порядке, у каждого из десяти нужен p99.9. Это единственное место в главе, где достаточно арифметики, и именно поэтому ей стоит верить больше, чем ощущению «каждый сервис быстрый». Независимость допущение: если сервисы тормозят вместе (общая база), картина хуже.'''

[[exercises]]
name = "svload_q1"
kind = "question"
question.ru = '''Запрос профиля вызывает пять сервисов параллельно и ждёт всех. У каждого сервиса p99 равен 100 мс. Какая доля запросов профиля, грубо, будет медленнее 100 мс (считая сервисы независимыми)?'''
options.ru = [
  '''около 1%: хвост каждого сервиса один процент''',
  '''около 5%: хвосты пяти сервисов складываются''',
  '''около 0.05%: нужно, чтобы замедлились все пять''',
  '''нельзя оценить без средних значений''',
]
answer = [1]
explain.ru = '''Запрос быстрый, только если быстры все пять: `0.99^5 ≈ 0.951`. Медленным окажется каждый двадцатый (около 5%). Это не противоречит p99 каждого: у них у всех хвост по 1%, но хвосты разные запросы задевают в разные моменты. Чем шире веер, тем больше целое унаследует от хвоста частей.'''
hint.ru = '''Запрос быстрый, если быстры все. Чему равна вероятность этого?'''

[[exercises]]
name = "svload_q2"
kind = "question"
question.ru = '''У первого воркера 1000 замеров, и все они по 10 мс. У второго 10 замеров, и все они по 2000 мс. Каким будет p99 по всему прогону?'''
options.ru = [
  '''примерно 1005 мс: среднее двух''',
  '''10 мс''',
  '''2000 мс''',
  '''505 мс: среднее двух p99 с учётом весов''',
]
answer = [1]
explain.ru = '''Всего 1010 замеров, а 99-му перцентилю по правилу ближайшего ранга соответствует `ceil(0.99 · 1010) = 1000`-й по возрастанию. Первые тысячу заняли быстрые замеры первого воркера, поэтому p99 равен 10 мс, а двадцать секунд простоя второго воркера видны только в максимуме и в p99.9. Среднее перцентилей воркеров (1005 мс) соврало бы в 100 раз, потому что не учитывает, сколько замеров стоит за каждым числом.'''
hint.ru = '''Отсортируй все замеры вместе и найди 1000-й по счёту.'''

[[exercises]]
name = "svload3"
style = "fix"
hint.ru = [
  '''Подставь числа: один воркер сделал 990 быстрых замеров, другой десять медленных. Чему равен p99 «по всем» и что показывает среднее двух p99?''',
  '''Перцентили не усредняются: чтобы получить перцентиль целого, нужны сами замеры (или гистограммы), собранные вместе. Из воркеров достаточно взять их списки замеров и объединить.''',
  '''Ошибки складываются, максимум берётся от всех замеров сразу. Воркер без замеров просто ничего не вносит в общий список, а не добавляет ноль.''',
]
why.ru = '''Среднее из перцентилей даёт один и тот же вес воркеру с десятью замерами и воркеру с миллионом, поэтому оно бессмысленно, и оно ошибается в обе стороны (вверх, если медленные замеры достались маленькому воркеру, вниз в противном случае). Перцентиль определён для выборки, и объединение выборок это единственный законный способ получить перцентиль целого. По той же причине гистограммы (следующая задача) умеют складываться: сложение корзин и есть объединение выборок.'''

[[exercises]]
name = "svload4"
style = "scratch"
hint.ru = [
  '''Сначала придумай, в какую корзину попадает число. Малые значения (меньше `2^bits`) пусть лежат по одному на корзину, а для остальных важен номер старшего бита: от него зависит, в каком «диапазоне от степени двойки» лежит значение.''',
  '''Внутри диапазона от `2^k` до `2^(k+1)` лежит `2^bits` равных корзин шириной `2^(k - bits)`. Номер корзины считается сдвигом вправо на `k - bits`: после него остаются старшие `bits + 1` бит, из которых отбрасывается единица в старшем разряде. Номера диапазонов идут друг за другом блоками по `2^bits`.''',
  '''Для квантиля идёшь по корзинам, копишь счёт и останавливаешься на первой, где накопленное не меньше ранга. Верни наибольшее значение, которое в эту корзину попадает, но не больше настоящего максимума. Слияние это поэлементное сложение, а минимум и максимум хранятся отдельно и точно.''',
]
why.ru = '''Гистограмма с логарифмическими корзинами делает размен «точность на память»: ошибка относительная (не больше `1/2^bits` от значения), а память постоянная. Относительная точность это то, что нужно для задержек: при 5 мс ошибка в 40 микросекунд неважна, при 5 секунд ошибка в 40 миллисекунд тоже. Слияние складывает счётчики корзин и поэтому не теряет точность и не зависит от порядка: воркеры могут вести гистограммы независимо и объединять их в конце без общих замков.'''

[[exercises]]
name = "svload5"
style = "scratch"
hint.ru = [
  '''Каждый воркер это отдельная задача: подключился, потом цикл «пока не вышел срок: отправил запрос и замерил». Срок считается от одного общего момента старта, чтобы воркеры заканчивали вместе.''',
  '''Замеры и счётчики ошибок воркер возвращает из задачи, а не пишет в общую переменную. Неудавшееся подключение считается ошибкой, и воркер просто заканчивается: остальным он не мешает.''',
  '''Итог собирается из того, что вернули воркеры: замеры склеиваются, ошибки и соединения складываются. Длительность прогона берётся от старта до возврата последнего воркера.''',
]
why.ru = '''Закрытый цикл самый простой и самый честный ответ на вопрос «сколько отдаёт сервис при N одновременных клиентах». Подключение один раз на воркера (keep-alive) отличает нагрузку от соединения-на-запрос, которое тестирует совсем другое. Ошибки не должны попадать в задержки: быстрый отказ иначе улучшает медиану. Начатый запрос дожидается ответа: оборвать его на сроке значило бы потерять самый интересный замер, самый медленный.'''

[[exercises]]
name = "svload6"
style = "bughunt"
hint.ru = [
  '''Посчитай, сколько раз за прогон воркеры обращаются к общим данным. Для 8 воркеров и 8000 запросов это сколько обращений, и сколько вообще нужно, чтобы выдать итог?''',
  '''Общее состояние должно браться один раз на воркера, в конце. Пока воркер работает, он копит замеры в своём списке, а не в общем.''',
  '''Печать в общий вывод это тоже общее состояние (замок на выход). Вместо строки на каждый запрос нужна одна итоговая строка после завершения всех воркеров.''',
]
why.ru = '''Замок, который берут на каждом запросе, превращает параллельный генератор в очередь: воркеры ждут друг друга, и измеряется уже не сервис, а замок. Лечение всегда одно: локальное накопление и слияние в конце, как у гистограмм. Вывод в терминал тоже общий ресурс (и медленный). В отчётах о нагрузке пишут итог, а не журнал каждого запроса; журнал, если нужен, ведут в буфер воркера.'''

[[exercises]]
name = "svload7"
style = "scratch"
hint.ru = [
  '''Расписание строится от момента старта: запрос с номером `i` назначен на `старт + i / rate`. Генератор ждёт этого момента и запускает запрос отдельной задачей, не дожидаясь результата.''',
  '''Соединения лежат в общем наборе свободных. Запросу нужно взять свободное или, если набор пуст, открыть новое, а после ответа вернуть соединение в набор. Задержка считается от назначенного момента до конца ответа, включая подключение.''',
  '''Число запросов не зависит от сервера и равно `rate * длительность`. Ожидание ответов в конце собирает исходы задач: успешные идут в замеры, остальные в ошибки.''',
]
why.ru = '''Открытая модель описывает мир, где поток пользователей не зависит от состояния сервера. Расписание берёт время старта и номер запроса, а не «предыдущее время плюс интервал», чтобы ошибки не накапливались. Запрос в отдельной задаче не ждёт ответа на предыдущие, и поэтому при простое сервера параллельных запросов растёт: это и есть измерение. Подключение в задержке нужно потому, что пользователь ждёт от нажатия до ответа, а не от готового соединения.'''

[[exercises]]
name = "svload_q3"
kind = "question"
question.ru = '''Закрытый генератор шлёт запросы по одному (дождался ответа, послал следующий). За десять минут прогона сервер один раз замер на 30 секунд, всё остальное время отвечал за 10 мс. Что покажет p99 в отчёте?'''
options.ru = [
  '''около 30 секунд: простой обязан быть виден''',
  '''около 10 мс: простой это один замер среди примерно шестидесяти тысяч''',
  '''около 15 секунд: среднее между 10 мс и 30 с''',
  '''генератор сообщит об ошибке: простой не может пройти незамеченным''',
]
answer = [1]
explain.ru = '''Пока сервер молчал, генератор ждал единственный ответ. Он сделал один замер на 30 секунд, а те три тысячи запросов, которые за это время ушли бы при штатной работе, не отправил и не измерил. Остаётся шестьдесят тысяч быстрых замеров и один медленный: p99 около 10 мс, «всё прекрасно». Это скоординированное упущение. Открытый генератор или закрытый с расписанием и отсчётом от назначенного момента показал бы всех, кто ждал.'''
hint.ru = '''Сколько запросов успел отправить генератор за те 30 секунд?'''

[[exercises]]
name = "svload8"
style = "bughunt"
hint.ru = [
  '''Представь, что сервер замер на секунду. Сколько запросов отправил генератор за это время и сколько должен был по расписанию? Чему равна задержка запроса, который ушёл сразу после простоя, если считать от момента отправки?''',
  '''Ошибок две: пауза после каждого запроса (поэтому прогон идёт медленнее расписания) и отсчёт задержки от момента отправки. Нужно заранее знать назначенный момент каждого запроса.''',
  '''Запрос `i` назначен на `старт + i / rate`. Генератор спит до этого момента (если уже поздно, не спит вовсе и догоняет), а задержка считается от этого момента до ответа.''',
]
why.ru = '''Скоординированное упущение возникает, когда измеритель подстраивает свою скорость под измеряемого. Лекарство одно: расписание не зависит от ответов, а задержка отсчитывается от назначенного момента (это называют ещё «временем ответа», в отличие от «времени обслуживания»). Опоздавший генератор не спит и догоняет, поэтому все запросы расписания будут отправлены и измерены. Только так простой сервера попадает в p99 в той мере, в какой он задел бы настоящих пользователей.'''

[[exercises]]
name = "svload9"
style = "scratch"
hint.ru = [
  '''Все шесть функций это одна-две арифметические операции. Основа закон Литтла: среднее число в системе равно скорости, умноженной на время пребывания.''',
  '''Занятость соединения это доля времени, когда оно выполняет запрос. Чтобы занятость была не выше заданной, соединений нужно в это число раз больше, чем среднее число запросов в работе. Округляй вверх.''',
  '''Время пребывания в простой очереди равно времени обслуживания, делённому на единицу минус загрузка. При загрузке от единицы ответа нет, а допустимая загрузка для заданного замедления получается обращением формулы.''',
]
why.ru = '''Закон Литтла работает без предположений о распределениях и поэтому годится как проверка здравого смысла для любого теста: цифры, которые ему противоречат (скорость выше потолка соединений), значит ошибка измерения. Формула очереди показывает главное свойство насыщения: время растёт не линейно, а гиперболой. Поэтому рабочую нагрузку выбирают по допустимому замедлению, а не по максимальной скорости.'''

[[exercises]]
name = "svload_q4"
kind = "question"
question.ru = '''Сервис отвечает за 50 мс. Нужно создать нагрузку в 2000 запросов в секунду. Какое наименьшее число соединений (на каждом одновременно идёт один запрос) для этого необходимо?'''
options.ru = [
  '''40''',
  '''100''',
  '''400''',
  '''2000''',
]
answer = [1]
explain.ru = '''Закон Литтла: среднее число запросов в работе равно скорости, умноженной на время: `2000 · 0.05 = 100`. Меньше ста соединений не хватит, потому что каждое занято на 50 мс и успевает обслужить не более 20 запросов в секунду. Это нижняя граница при полной занятости; на практике берут запас (с занятостью 70% нужно около 143).'''
hint.ru = '''Сколько запросов успевает обслужить одно соединение за секунду?'''

[[exercises]]
name = "svload_q5"
kind = "question"
question.ru = '''Время обслуживания запроса 10 мс. Загрузка сервиса выросла с 50% до 90%. Во сколько раз, грубо, выросло среднее время ответа?'''
options.ru = [
  '''в 1.8 раза, как и загрузка''',
  '''в 5 раз''',
  '''в 9 раз''',
  '''в 45 раз''',
]
answer = [1]
explain.ru = '''Время пребывания равно времени обслуживания, делённому на `1 − загрузка`: при 50% это 20 мс, при 90% это 100 мс. Рост в пять раз при росте загрузки в 1.8. Зависимость гиперболическая, и именно поэтому следующие десять процентов загрузки (до 99%) обходятся ещё в десять раз.'''
hint.ru = '''Подставь обе загрузки в формулу «время обслуживания, делённое на единицу минус загрузка».'''

[[exercises]]
name = "svload10"
style = "fix"
hint.ru = [
  '''Найди в отчёте все места, где ошибки и таймауты смешиваются с успехами. Скорость и задержки должны считаться по какому множеству?''',
  '''Скорость это число успешных ответов в секунду, задержки только успешных, а ошибки и таймауты уходят в отдельную долю. Тогда быстрые отказы не улучшают ни медиану, ни скорость.''',
  '''Поиск предела идёт по ступеням в порядке роста нагрузки и останавливается на первой, которая нарушила порог p99 или долю ошибок. Ответ это нагрузка последней годной ступени, а не лучшая по скорости.''',
]
why.ru = '''Скорость, в которую вошли ошибки, измеряет, как быстро сервис отказывает, а не как быстро он работает. Быстрые отказы вдобавок делают медиану красивой. Поэтому отчёт разделяет три вещи и каждая считается по своему множеству. Предел ищут до первого нарушения, а не по лучшей скорости: сервис, начавший отбрасывать запросы, на следующей ступени может «случайно» выглядеть здоровым, и такая ступень не доказательство.'''

[[exercises]]
name = "svload11"
style = "bughunt"
hint.ru = [
  '''Посчитай время рассылки на тысячу получателей по миллисекунде каждому и один зависший. Сколько ждёт последний здоровый? Сколько ждёт его очередь за зависшим?''',
  '''Все отправки должны идти одновременно, каждая со своим сроком. Отправки удобно собирать в набор задач и читать исходы по мере готовности.''',
  '''Для каждого получателя запоминается, чем кончилось: доставлено, ошибка или срок вышел. Время до последнего считается как наибольший момент среди успешных, от общего старта.''',
]
why.ru = '''Последовательная рассылка делает время до последнего получателя суммой задержек всех получателей, а медленный получатель задерживает всех за собой на весь свой таймаут. Одновременные отправки со своим сроком у каждой ограничивают ущерб одним сроком, а не «сроком на каждого зависшего». Отчёт разделяет «упал» и «не успел»: это разные причины, и чинятся они в разных местах. Задержка рассылки меряется до последнего получателя: тому, кто в конце списка, безразлична скорость начала.'''

[[exercises]]
name = "svload_quiz"
kind = "project"
quiz = true
style = "scratch"
locked = ['src/crates/loadgen/tests/units.rs', 'src/crates/loadgen/tests/tcp.rs']
hint.ru = [
  '''Порядок по зависимостям: гистограмма (на неё опираются остальные), потом `to_line`, `from_line`, `compare`, потом `run_closed` и `run_open`, потом `run_steps`, в конце `HttpTarget`. Тесты `units.rs` не требуют сети и идут под остановленными часами, поэтому цифры в них точные.''',
  '''Закрытый и открытый циклы почти повторяют `svload5` и `svload7`, только вместо списка замеров у каждого воркера своя гистограмма, а в конце они сливаются. Для открытого цикла задержка идёт от назначенного момента, и подключение в неё входит.''',
  '''HTTP-клиент читает в цикле, пока в накопленных байтах нет конца заголовка, потом дочитывает тело до длины из `Content-Length`. Имя заголовка сравнивается без учёта регистра. Соединение после ответа возвращается на место, а при любой ошибке теряется: следующий запрос на нём это ошибка, а не зависание.''',
]
why.ru = '''Хороший генератор нагрузки держится на тех же четырёх решениях, что и главы выше. Расписание не зависит от сервера (открытая модель), задержка считается от назначенного момента, замеры лежат в гистограммах воркеров и сливаются в конце, а отчёт различает успехи и ошибки. Всё остальное, от ступеней до сравнения с прошлым прогоном, строится на отчёте. Настоящий HTTP проверяет то, что подмены не видят: keep-alive, большие тела и заголовок, пришедший по кускам.'''
