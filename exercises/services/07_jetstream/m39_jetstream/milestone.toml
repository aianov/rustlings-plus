test_command = ["cargo", "make", "check"]
requires = ["nats"]
hint.ru = [
"""Начни с модуля `js` из проекта svjs_quiz: перенеси его в `nats-engine/src/js/` тремя файлами и сделай политику
читателя полями `FeedSpec` (`max_deliver`, `backoff`, `parallel`), а не константами. `Bus` отдаёт клиента только
внутри крейта (`pub(crate) fn client`), сервисы о async-nats по-прежнему не знают.""",
"""Мёртвое письмо пишется в тот же stream, что и события. Если скопировать в него `Nats-Msg-Id` исходного события, брокер
внутри окна дубликатов примет копию за повтор и не запишет её, а `Term` уже уйдёт. Собирай заголовки копии заново из
`Meta` и трёх своих.""",
"""Пачку читай целиком (`fetch().max_messages(..).expires(..)`), а обрабатывай через
`for_each_concurrent(parallel, ..)`: каждое сообщение само подтверждает себя. Внутри обработки `select!` между будущим
обработчика и таймером на треть `ack_wait`, который шлёт `AckKind::Progress`.""",
"""В notify-service уйдут `mpsc`, `try_send` и `subscribe_group`: давление держит pull. Вердикт выбирай по ошибке:
недоступный user-service вернётся сам (`Retry`), а «нет такого пользователя» не исправится повтором (`Poison`). Тесты
каждый раз заводят свой корень тем, поэтому в конце удаляют свой stream через async-nats.""",
]
story.ru = """События соцсети живут в JetStream: публикация подтверждена и защищена от дублей, notify-service после
перезапуска догоняет пропущенное, повторяет при сбое соседа и откладывает мусор в мёртвую тему. Колокольчик больше не
молчит из-за минутного рестарта."""
