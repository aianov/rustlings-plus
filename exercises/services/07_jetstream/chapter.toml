[chapter]
title.en = "JetStream: delivery without loss"
title.ru = "JetStream: доставка без потерь"

[[chapter.visuals]]
file = "visuals/jetstream_ack.html"
title.ru = "Подтверждения: ack, nak, term, in_progress и истёкший ack_wait"

[[chapter.visuals]]
file = "visuals/durable_fanout.html"
title.ru = "Durable consumers: два сервиса, два экземпляра, рестарт"

[[exercises]]
name = "svjs1"
style = "todo"
requires = ["nats"]
hint.ru = '''Stream создаётся через `js.create_stream(Config { name, subjects, ..Default::default() })`. Публикация возвращает подтверждение в две стадии: сначала `publish(...).await?` (ушло), потом `.await?` на том, что вернулось (записано), и в нём лежит `sequence`.'''
why.ru = '''Подтверждение публикации приходит в два шага, и именно второй говорит, что событие лежит на диске брокера. Если остановиться на первом, ошибки вида «тему не ловит ни один stream» теряются молча, а это самая частая опечатка. Номер в stream (sequence) пригодится дальше: по нему событие можно найти, сравнить и пометить обработанным.'''

[[exercises]]
name = "svjs2"
style = "scratch"
requires = ["nats"]
hint.ru = [
  '''Три вида различаются настройкой `retention` и лимитами. Журнал остаётся `Limits`, и ему нужны `max_messages` (из вида) и `max_age` в 7 суток.''',
  '''`RetentionPolicy::Interest` и `RetentionPolicy::WorkQueue`. Все стримы хранятся на диске (`StorageType::File`). Проверь себя тестами: они ведут себя как настоящий брокер, и неверный retention виден по числу сообщений.''',
]
why.ru = '''Retention выбирает судьбу записи, и ошибиться в нём можно незаметно: stream с лимитами вместо очереди заданий отдаст одно задание всем исполнителям, `Interest` без читателей молча выбросит всё, а журнал без потолка однажды съест диск. Поэтому настройки каждого вида живут в одной функции, а поведение проверяется на настоящем брокере, а не чтением полей.'''

[[exercises]]
name = "svjs3"
style = "fix"
requires = ["nats"]
hint.ru = [
  '''Что ты теряешь, удаляя stream? Всё его содержимое и закладки всех consumer'ов. Брокер умеет сам сказать «такой уже есть»: посмотри на `get_or_create_stream`.''',
  '''Если stream уже есть и темы не совпали, нужен `update_stream`: записи при этом остаются. Результат `get_or_create_stream` уже содержит настройки существующего stream, их можно сравнить с желаемыми. Ошибку брокера (например, смена вида retention) не глотай.''',
]
why.ru = '''Подготовка stream при запуске должна быть идемпотентной и безопасной: ничего не стирать, обновлять только то, что брокер разрешает менять, а при конфликте остановиться и сказать об этом. «Удалить и создать» работает в тестовом окружении и стирает продакшен при первом же деплое. Поэтому в коде сервисов нет `delete_stream`, и это можно проверить поиском по исходникам.'''

[[exercises]]
name = "svjs4"
style = "todo"
requires = ["nats"]
hint.ru = [
  '''Идентификатор кладётся в заголовок `Nats-Msg-Id` через `HeaderMap` и `publish_with_headers`. Подтверждение содержит поле `duplicate`.''',
  '''Имя события собирается из вида, агрегата и версии. Не из тела: два разных события с одним текстом не должны склеиваться, а одно событие должно всегда получать одно и то же имя.''',
]
why.ru = '''Дедупликация брокера работает только если идентификатор стабилен: он называет логическое событие и не зависит от попытки или тела. Версия агрегата в имени делает так, что настоящее второе событие («пост лайкнули ещё раз» уже с другой версией) не принимают за повтор. И последнее предупреждение: окно дубликатов конечно, оно защищает от повторов при ретраях, а не от того, что читатель получит событие дважды.'''

[[exercises]]
name = "svjs5"
style = "fix"
requires = ["nats"]
hint.ru = [
  '''Одна публикация и три попытки: сколько идентификаторов должно быть? Посмотри, где в коде создаётся значение для заголовка.''',
  '''Идентификатор рождается один раз до цикла и копируется во все попытки. Случайное значение подойдёт, а хеш тела нет: две настоящие публикации с одинаковым текстом тогда склеятся брокером в одну.''',
]
why.ru = '''Повтор после таймаута безопасен только если брокер может узнать повтор. Для этого все попытки одной публикации несут один идентификатор, а разные публикации разные. Случайный идентификатор создаётся на уровне «намерения опубликовать», а не на уровне сетевой попытки. Хеш тела выглядит хитро и ломается на первом же событии «лайк» от того же пользователя дважды.'''

[[exercises]]
name = "svjs6"
style = "scratch"
requires = ["nats"]
hint.ru = [
  '''Consumer создаётся с явными подтверждениями и именем: `get_or_create_consumer(имя, pull::Config { durable_name: Some(..), ack_policy: AckPolicy::Explicit, ack_wait, .. })`. Именно get_or_create, чтобы повторный вызов не сбрасывал позицию.''',
  '''`consumer.fetch().max_messages(n).expires(срок).messages().await?` даёт поток сообщений. Номер записи в stream лежит в `message.info()?.stream_sequence`. Подтверждай каждое сообщение после того, как собрал его данные.''',
]
why.ru = '''Durable consumer хранит закладку на брокере, и вся надёжность строится на двух вещах: имя постоянное и подтверждение явное. Подтверждение в этой задаче простое («собрали, подтвердили»), в реальных обработчиках оно идёт после работы, и об этом следующие задачи. `get_or_create` важен: `create` с тем же именем и другими настройками падает, а пересоздание сбросило бы позицию.'''

[[exercises]]
name = "svjs7"
style = "todo"
requires = ["nats"]
hint.ru = [
  '''Имя consumer'а совпадает с именем сервиса: так экземпляры одного сервиса делят закладку, а разные сервисы читают независимо. Создавай через `get_or_create_consumer`.''',
  '''Цикл: проверить сигнал остановки, взять пачку (`fetch`), для каждого сообщения отправить в `sink` пару (номер экземпляра, `stream_sequence`) и подтвердить. Остановка не обрывает начатую пачку: проверяй сигнал между пачками.''',
]
why.ru = '''Масштабирование и независимость решаются именем: одно имя означает общую закладку и общую работу, разные имена означают отдельные копии потока. Остановка между пачками, а не посередине, не оставляет неподтверждённых сообщений: иначе их пришлось бы ждать ещё ack_wait. При этом порядок между экземплярами не гарантирован, и тест проверяет только «ровно по разу».'''

[[exercises]]
name = "svjs8"
style = "bughunt"
requires = ["nats"]
hint.ru = [
  '''Посмотри, как формируется имя consumer'а. Что произойдёт при втором запуске с точки зрения брокера? Он видит нового читателя с новой закладкой.''',
  '''Имя постоянное и принадлежит сервису. Для создания подойдёт `get_or_create_consumer`: при рестарте он найдёт существующего и продолжит с его позиции.''',
]
why.ru = '''Случайный суффикс в имени consumer'а добавляют «чтобы не было конфликтов» и получают две беды: каждый рестарт читает историю с начала (пользователи получают старые уведомления заново), а на брокере копятся consumer'ы, каждый из которых держит записи. Конфликта же не бывает: два экземпляра с одним именем это не ошибка, а штатный способ делить работу.'''

[[exercises]]
name = "svjs9"
style = "todo"
requires = ["nats"]
hint.ru = [
  '''Ответов три, и брокер знает каждый: `AckKind::Ack`, `AckKind::Nak(Some(пауза))` и `AckKind::Term`. Отправляются они через `message.ack_with(...)`.''',
  '''Для повтора без паузы подойдёт `Nak(None)`; с паузой `Nak(Some(пауза))`, и сообщение вернётся не раньше, чем через неё.''',
]
why.ru = '''Разные ошибки требуют разных ответов, и это единственное место, где обработчик говорит брокеру, что делать дальше. Повтор без паузы подходит, когда ошибка случайная и отпустит сама, пауза нужна, когда зависимость недоступна, и частые попытки только мешают ей подняться. `Term` для сообщения, которое не обработается никогда: повторять его значит тратить силы и держать в голове очередь мусора.'''

[[exercises]]
name = "svjs10"
style = "bughunt"
requires = ["nats"]
hint.ru = [
  '''Когда брокер перестаёт считать сообщение своим? В момент ack. А что идёт после ack в этом коде? Обработка. Что останется, если она упадёт?''',
  '''Подтверждай только после успешной обработки. На ошибке отправь `Nak(Some(100 мс))`, тогда сообщение вернётся, и обработка повторится.''',
]
why.ru = '''«Подтвердить сразу, чтобы не потерять место» превращает любую ошибку обработки в тихую потерю события: брокер уверен, что дело сделано. Подтверждение после работы даёт гарантию «не меньше одного раза» ценой возможного повтора, и это правильный размен, потому что повтор можно сделать безвредным (идемпотентность), а потерю нельзя вернуть. Краткая пауза в `nak` не даёт повтору мгновенно упереться в ту же недоступную базу.'''

[[exercises]]
name = "svjs11"
style = "fix"
requires = ["nats"]
hint.ru = [
  '''Что видит брокер, пока ты тридцать секунд делаешь тяжёлую работу? Тишину. А что он делает с тишиной? Возвращает сообщение.''',
  '''Пока работа идёт, раз в треть `ack_wait` отправляй `AckKind::Progress`: таймер брокера начинается заново. Удобно сделать это в `tokio::select!` между самой работой и таймером (`tokio::time::interval`); будущее работы закрепи через `tokio::pin!`, чтобы `select!` в цикле не пересоздавал его на каждом витке.''',
]
why.ru = '''`ack_wait` это срок «молчания», а не срок работы. Поднимать его до часа нельзя, тогда настоящий сбой заметят через час. Правильно держать маленьким и сообщать о жизни: `Progress` каждую треть срока. Так сбой обнаруживается быстро, а честная долгая работа не дублируется. Не забудь про ошибку работы: она тоже должна вернуть сообщение, а не оставить его висеть до истечения срока.'''

[[exercises]]
name = "svjs12"
style = "fix"
requires = ["nats"]
hint.ru = [
  '''Три вещи вместе: потолок доставок (`max_deliver`), паузы между ними (`backoff`) и дальнейшая судьба сообщения после последней попытки. Что произойдёт после последней доставки, если ты ничего не сделал сам? Брокер просто перестанет его присылать, и оно исчезнет из твоего поля зрения.''',
  '''`max_deliver` должен быть больше длины `backoff`. Паузы по `backoff` применяются, когда сообщение осталось неподтверждённым; `Nak(None)` их обходит, так что на ошибке либо не отвечай, либо отправляй `Nak(Some(..))` сам. В последней попытке сначала опубликуй копию в мёртвую тему (с заголовками: откуда, сколько попыток, причина), потом `Term`.''',
]
why.ru = '''Три приёма закрывают три разных дыры. Потолок доставок останавливает бесконечный цикл на уровне брокера, даже если обработчик зависает или падает и ничего не отвечает. Паузы не дают мусору загрузить процессор. Мёртвая тема сохраняет само сообщение с причиной: после последней доставки брокер забывает про него, и если сервис ничего не опубликовал, расследовать нечего. Копия публикуется до `Term`: если публикация не удалась, сообщение лучше вернуть, чем потерять.'''

[[exercises]]
name = "svjs13"
style = "bughunt"
requires = ["nats"]
hint.ru = [
  '''Что делает цикл с записью №3 и что с №4 и №5, которые уже выданы? И что делает брокер, пока №3 ждёт своей паузы?''',
  '''Порядок можно получить на стороне брокера: у consumer'а есть предел числа выданных, но ещё не подтверждённых записей. Подумай, какое значение предела не даёт выдать следующую, пока предыдущая в повторе, и что ты за это платишь.''',
]
why.ru = '''Порядок в stream не равен порядку обработки: повторы переставляют записи, потому что неудавшаяся возвращается позже, а соседи уже обработаны. `max_ack_pending = 1` включает порядок на стороне брокера, ценой параллельности. Это сознательный выбор: там, где порядок критичен и записей немного (профиль пользователя), он дешёвый, а там, где нужна пропускная способность, порядок переносят в данные (версия события) и устаревшие отбрасывают.'''

[[exercises]]
name = "svjs14"
style = "scratch"
requires = ["nats"]
hint.ru = [
  '''`js.create_key_value(kv::Config { bucket, history: 1, max_age: ttl, .. })`. Запись `kv.put(ключ, значение)` возвращает ревизию, чтение `kv.get(ключ)` отдаёт `Option<Bytes>`, удаление `kv.delete(ключ)`.''',
  '''Осторожно с `watch_all`: он показывает только то, что изменится после подписки. Чтобы получить ещё и текущие значения по последнему на ключ, нужен `watch_with_history(">")`. Тип операции записи (`Operation::Put` или `Delete`) говорит, было ли это удаление.''',
]
why.ru = '''KV устроен как stream, и поэтому у него те же свойства: ревизии (номера записей), история, TTL через `max_age` и поток изменений. TTL решает целый класс задач без cron: «онлайн» сам пропадает, если сервис перестал его продлевать. Ловушка watch: подписка «на всё» без истории не показывает уже существующее, и новый экземпляр сервиса, подписавшись, видит пустой мир, пока что-нибудь не изменится.'''

[[exercises]]
name = "svjs15"
style = "bughunt"
requires = ["nats"]
hint.ru = [
  '''Между чтением и записью проходит время, и за это время пишет другой экземпляр. Как записать «только если с момента чтения ничего не менялось»?''',
  '''У `kv.entry(ключ)` есть ревизия, а `kv.update(ключ, значение, ревизия)` записывает только при совпадении. Ключа ещё нет: тогда `kv.create`, он тоже не затирает чужое. Конфликт не ошибка, а повод прочитать заново и повторить.''',
]
why.ru = '''Чтение-изменение-запись без проверки версии теряет обновления: оба экземпляра видят 41, оба пишут 42. Проверка по ревизии превращает гонку в повтор: проигравший читает свежее значение и пробует снова, ничего не теряется. Предел числа попыток нужен, чтобы вечная борьба не стала вечным циклом. Мьютекс в процессе не лечит: экземпляров несколько, и тест это проверяет двумя соединениями.'''

[[exercises]]
name = "svjs_q1"
kind = "question"
question.ru = '''Stream с `retention: Interest` ловит `parcels.>`. Издатель публикует 100 событий, а ни одного consumer'а у stream пока нет. Через час создаётся первый durable consumer. Сколько из этих 100 событий он получит?'''
options.ru = [
  '''все 100, потому что stream хранит всё, что ему опубликовали''',
  '''ни одного, потому что на момент публикации читателей не было''',
  '''последние 100, но не больше значения `max_messages`''',
  '''столько, сколько позволяет `ack_wait` consumer'а''',
]
answer = [1]
explain.ru = '''Интерес означает «хранить, пока кто-то ещё должен прочитать». Когда читателей нет, запись никому не нужна и не сохраняется вовсе. Для истории, которую можно перечитать и которой могут начать пользоваться позже, нужен `Limits`. `ack_wait` относится к доставке, а не к хранению.'''
hint.ru = '''Кого ждёт запись, когда читателей нет?'''

[[exercises]]
name = "svjs_q2"
kind = "question"
question.ru = '''Издатель публикует событие с `Nats-Msg-Id: parcel-481:delivered:1`; окно дубликатов stream две минуты. Ответ потерялся, издатель повторил через секунду и получил `duplicate: true`. Потом процесс перезапустили, и через десять минут он по ошибке публикует то же событие с тем же идентификатором. Что произойдёт?'''
options.ru = [
  '''брокер ответит `duplicate: true`''',
  '''брокер откажет с ошибкой «идентификатор уже использован»''',
  '''событие запишется как новое''',
  '''запишется только если изменилось тело''',
]
answer = [2]
explain.ru = '''Брокер помнит идентификаторы только внутри окна дубликатов. Через десять минут про старый он уже ничего не знает и запишет событие как новое. Защита брокера нужна против ретраев, а не как вечная гарантия уникальности: читатель всё равно должен справляться с повторами (идемпотентность, следующая глава).'''
hint.ru = '''Сколько живёт память брокера об идентификаторах?'''

[[exercises]]
name = "svjs_q3"
kind = "question"
question.ru = '''В stream 30 сообщений о новых лайках. Три экземпляра sms-сервиса запускаются как `sms-1`, `sms-2` и `sms-3`, и каждый создаёт consumer'а под своим именем. Сколько SMS уйдёт пользователям, если все дочитают до конца?'''
options.ru = [
  '''30''',
  '''60''',
  '''90''',
  '''10''',
]
answer = [2]
explain.ru = '''Делятся только экземпляры, которые назвали consumer'а одинаково. С тремя разными именами это три независимых consumer'а, и каждый получает полный поток: 90 SMS на 30 лайков. Исправляется общим именем сервиса на все экземпляры.'''
hint.ru = '''Что определяет, делят ли экземпляры работу?'''

[[exercises]]
name = "svjs_q4"
kind = "question"
question.ru = '''Обработчик события сначала записывает уведомление в базу, а потом отправляет `ack`. Процесс убили ровно между этими двумя шагами. Что произойдёт после перезапуска?'''
options.ru = [
  '''ничего: запись в базе уже есть, событие считается обработанным''',
  '''событие потеряно: брокер не получил подтверждения и забыл его''',
  '''через `ack_wait` брокер вернёт событие, и уведомление может быть записано во второй раз''',
  '''брокер сам откатит запись в базе''',
]
answer = [2]
explain.ru = '''Подтверждение после обработки даёт «не меньше одного раза»: между записью и ack есть окно, в котором падение приводит к повтору. Потери нет, но эффект может случиться дважды. Поэтому читатель должен быть идемпотентным: например, не заводить второе непрочитанное уведомление с теми же видом, автором и постом, как в notify-service.'''
hint.ru = '''Что знает брокер в момент падения: обработано или нет?'''

[[exercises]]
name = "svjs_q5"
kind = "question"
question.ru = '''В бакете три ключа, значения записаны давно. Потом сервис вызывает `kv.watch_all()` и читает первое изменение из потока. Ничего больше в бакет не пишут. Что он получит?'''
options.ru = [
  '''сразу текущие значения трёх ключей''',
  '''ошибку, потому что поток пуст''',
  '''ничего: поток покажет только изменения, которые произойдут после подписки''',
  '''историю всех изменений с самого начала''',
]
answer = [2]
explain.ru = '''`watch_all` подписывается на новые изменения. Чтобы получить ещё и текущее состояние, нужно запрашивать историю (`watch_with_history`): тогда сначала придёт последнее значение каждого ключа, а потом новые изменения. Забыть об этом значит начать работать с пустым миром, пока кто-нибудь что-нибудь не изменит.'''
hint.ru = '''Показывает ли подписка на изменения то, что уже лежит?'''

[[exercises]]
name = "svjs_quiz"
kind = "project"
quiz = true
style = "scratch"
requires = ["nats"]
locked = ["src/crates/nats-engine/tests/js_acceptance.rs", "src/microservices/notify-service/tests/acceptance.rs"]
hint.ru = [
  '''Модуль `js.rs` в крейте `nats-engine` собирает задачи главы: `ensure_stream` это svjs3, `publish_event` это svjs4 и svjs5, `open_feed` это svjs6 и дальше до svjs12. Начни с `ensure_stream` и `publish_event`, их тесты короткие.''',
  '''В `open_feed` consumer создаётся через `get_or_create_consumer` с постоянным именем, `max_deliver = MAX_DELIVER` и явными подтверждениями. Паузы между повторами лучше задавать самим через `Nak(Some(..))` по `backoff()`: тогда `ack_wait` остаётся настоящим сроком молчания. Цикл: `fetch`, для каждого сообщения разобрать конверт, вызвать обработчик с `Progress` по таймеру, ответить по вердикту.''',
  '''Вердикт `Retry` на последней попытке (`delivered >= MAX_DELIVER`) и вердикт `Poison` ведут в мёртвую тему и `Term`. Если копию в мёртвую тему опубликовать не удалось, сообщение возвращают через `Nak`, а не `Term`. Мусор вместо JSON не доходит до обработчика: сразу в мёртвую тему.''',
]
why.ru = '''Это место, где вся глава превращается в один слой, а сервисы (notify-service сегодня, feed-service и другие дальше) работают только с ним: stream при запуске без стирания, публикация с подтверждением и стабильным идентификатором, durable consumer с постоянным именем, подтверждение после обработки, Progress на долгой работе, паузы и потолок повторов, мёртвая тема с причиной. notify-service в проекте уже готов и использует этот слой, поэтому его тесты проверяют твой слой в сборе: рестарт без потерь и повторов, дубли публикаций, ядовитые события, два экземпляра, медленная доставка.'''

