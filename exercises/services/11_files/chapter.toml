[chapter]
title.en = "Files"
title.ru = "Файлы"

[[chapter.visuals]]
file = "visuals/upload_pipeline.html"
title.ru = "Путь загрузки: лимит, сигнатура, хеш, временный файл, rename, привязка в базе"

[[exercises]]
name = "svfile1"
style = "todo"
hint.ru = [
  '''Три метода. `put` читает тело кусок за куском и пишет в файл, `get` читает файл порциями, `delete` не считает отсутствие файла ошибкой. Какой вид ошибки (`ErrorKind`) приходит, когда файла нет?''',
  '''Для `put` сначала нужен каталог (`create_dir_all`), потом цикл `while let Some(chunk) = body.next().await`. Для `get` удобен `futures::stream::unfold`: файл лежит в состоянии, на каждом шаге читается буфер в `CHUNK` байт, ноль прочитанных значит конец. `NotFound` переводится в `None` и `false`.''',
]
why.ru = '''Сервис знает только ключи, путь собирает `FsStore`: завтра на его место встанет S3 или другой диск, а остальной код не заметит. Тело ходит потоком кусков, поэтому один гигантский файл не съедает память, а число одновременных загрузок не умножает её на размер файла. «Нет файла» это нормальный ответ (`None`, `false`), а не авария: так вызывающий код не ловит ошибки там, где ему нужен обычный `if`.'''

[[exercises]]
name = "svfile_q1"
kind = "question"
question.ru = '''Сервис принимает видео до 200 МБ. Обработчик делает так: `let bytes = body.collect().await?; store.put(key, bytes).await`. Пятьдесят человек грузят видео одновременно. Что произойдёт и что нужно поменять?'''
options.ru = [
  '''ничего страшного: 50 по 200 МБ это просто пиковая нагрузка на диск''',
  '''в памяти одновременно окажется до 10 ГБ тел, процесс убьёт OOM-killer; хранилищу нужно отдавать тело потоком кусков''',
  '''память не вырастет: `await` отпускает поток, и данные не накапливаются''',
  '''достаточно поднять лимит памяти контейнера до 16 ГБ''',
]
answer = [1]
explain.ru = '''`collect` держит весь файл в памяти, пока он не дочитан, а `await` ничего не освобождает: данные лежат в `bytes`. Пятьдесят одновременных загрузок это пятьдесят полных копий. Лимит памяти побольше только сдвигает проблему: достаточно ста загрузок, и всё повторится, причём в самый неудобный момент. Лечится это потоком: кусок пришёл, ушёл дальше на диск и забыт.'''
hint.ru = '''Где лежат байты тела между `collect` и `put`, и сколько таких мест одновременно?'''

[[exercises]]
name = "svfile2"
style = "todo"
hint.ru = [
  '''Читатель не должен видеть недописанного, значит, итоговое имя нельзя трогать, пока данные не готовы. Где тогда писать и каким одним действием имя становится видимым?''',
  '''Пиши во временный файл рядом с итоговым (в том же каталоге: переименование между каталогами или дисками не обязано быть атомарным). Что нужно сделать с временным файлом до переименования, чтобы после сбоя питания там лежали данные, а не пустота? И что делать с ним при любой ошибке?''',
  '''Порядок такой: создать временный, дописать все куски, подтвердить на диск, переименовать. Ошибка любого шага возвращается наружу, но сначала временный файл убирается. Имя временного собирай из имени итогового и `nonce`, чтобы два писателя одного ключа не делили файл.''',
]
why.ru = '''Атомарно в файловой системе только переименование: имя указывает либо на старый файл, либо на новый, середины нет. Поэтому запись идёт в сторону, а имя переключается в самом конце. `sync` перед переименованием нужен из-за питания: без него система может сохранить имя раньше данных и после перезагрузки показать пустой файл под новым именем. Временный файл лежит в том же каталоге ради атомарности переименования, а уникальное имя нужно для конкурентных писателей.'''

[[exercises]]
name = "svfile_q2"
kind = "question"
question.ru = '''Сервис пишет файл во временный `.tmp`, закрывает его и делает `rename` на итоговое имя, но без `sync_all`. Через секунду после переименования пропало питание. Выбери верные утверждения.'''
options.ru = [
  '''после перезагрузки итоговое имя может существовать, а файл под ним оказаться пустым или обрезанным''',
  '''пока машина работает, другой процесс видит либо старый файл целиком, либо новый целиком''',
  '''если вызвать `sync_all` уже после `rename`, ситуация исправится задним числом''',
  '''`sync_all` перед `rename` обеспечивает, что данные дошли до диска раньше, чем новое имя стало надёжным''',
]
answer = [0, 1, 3]
explain.ru = '''Переименование атомарно для читателей на работающей машине, но порядок попадания на диск данных и записи об имени система не обещает: имя может сохраниться раньше содержимого. Поэтому `sync_all` нужен до переименования, а после он уже ничего не меняет в том, что случилось при сбое.'''
hint.ru = '''Атомарность для процессов и сохранность после отключения питания это два разных обещания. Какое из них даёт `rename`?'''

[[exercises]]
name = "svfile3"
style = "bughunt"
hint.ru = [
  '''Выпиши по шагам, какой файл лежит на диске в каждый момент загрузки и что делает `File::create` с уже существующим файлом.''',
  '''Загрузку надо вести в файл с другим именем, а под настоящим именем файл должен появиться одним действием, когда всё готово (прошлая задача). Где лежать временному файлу, чтобы это действие осталось атомарным?''',
  '''Создавай временный в том же каталоге, что и итоговый, с уникальным именем (счётчик подойдёт). После последнего куска сбрось буфер, подтверди на диск, закрой файл и переименуй. Ошибку тела возвращай как есть: до переименования дело не дойдёт, и итоговый файл не пострадает.''',
]
why.ru = '''Пока писали прямо в итоговый путь, любой читатель видел половину, а `File::create` при замене ещё и обнуляла старое содержимое в первую же миллисекунду: оборванная загрузка стоила пользователю прежнего аватара. Запись в сторону и переименование в конце превращают загрузку в «всё или ничего». Мусор от упавшей загрузки теперь лежит под временным именем и читателю не виден, а убирать его будем в следующей починке: тут важно, что настоящее имя остаётся целым.'''

[[exercises]]
name = "svfile4"
style = "scratch"
hint.ru = [
  '''Нужен адаптер над потоком, который сам вперёд ничего не читает, а на каждый кусок прибавляет его длину к счётчику. Что должно лежать в его состоянии, кроме счётчика, чтобы после ошибки поток закончился?''',
  '''Подойдёт `futures::stream::unfold` с состоянием из исходного тела, числа прошедших байт и флага «уже сломались». Заявленный размер проверяется ещё до создания потока и тело не трогает. Кусок, который выводит за предел, не отдаётся, вместо него ошибка.''',
]
why.ru = '''Лимит считается по ходу, потому что заголовку `Content-Length` верить нельзя: он может быть мал, велик или отсутствовать (потоковая отправка). Заявленный размер даёт дешёвый ранний отказ, но настоящая защита это счётчик на самих байтах. Поток после ошибки заканчивается, чтобы читатель не тянул остаток тела зря, а границу «ровно max ещё можно» легко перепутать на одну единицу: тест её проверяет.'''

[[exercises]]
name = "svfile5"
style = "bughunt"
hint.ru = [
  '''`?` в цикле просто выходит из функции, а при отмене задачи (`abort`, закрытое клиентом соединение) не выполняется ни одной строки после `.await`, на котором её остановили. Что в Rust срабатывает всегда, когда значение уходит из области видимости?''',
  '''Нужен «страж»: структура с путём, у которой в `Drop` временный файл удаляется. В `Drop` нельзя ждать (`.await`), значит, удалять придётся синхронным `std::fs::remove_file`.''',
  '''Страж создаётся сразу после выбора имени временного файла, до его создания (создание тоже может оборваться на полпути). После успешного переименования его разоружают: путь уже занят итоговым файлом, и чужого удалять нельзя.''',
]
why.ru = '''Уборка в ветке ошибки закрывает только ошибки: при отмене будущее просто перестаёт опрашиваться и уничтожается, а код после точки ожидания не выполняется. В async-коде надёжно работает только `Drop`. Это и есть RAII: ресурс освобождается деструктором, что бы ни случилось с потоком управления. Разоружение после успеха нужно, чтобы страж не пытался удалить уже переименованное.'''

[[exercises]]
name = "svfile6"
style = "todo"
hint.ru = [
  '''Каждый формат начинается со своей сигнатуры. PNG: восемь фиксированных байт. JPEG: три. WebP живёт внутри контейнера RIFF, и одного слова RIFF мало: что стоит на смещении 8?''',
  '''Сравнивай через `starts_with` и срезы с проверкой длины, чтобы короткий вход не вызывал панику. Имя файла и заявленный тип в решении вообще не участвуют.''',
]
why.ru = '''Имя и `Content-Type` пишет клиент, значит, это пожелания, а не факты. Факт один: что лежит в первых байтах. Поэтому решение принимается по сигнатуре, а и тип, и расширение потом берутся у распознанного вида. Короткие входы это обычный случай (пустая загрузка, обрыв), и срез без проверки длины превращает его в панику, то есть в способ положить обработчик одним запросом.'''

[[exercises]]
name = "svfile_q3"
kind = "question"
question.ru = '''Загруженный файл прошёл проверку: первые восемь байт совпали с сигнатурой PNG. Что из этого следует?'''
options.ru = [
  '''его теперь безопасно целиком отдавать любому декодеру картинок без ограничений''',
  '''это начинается как PNG, но внутри может быть что угодно: гигантские размеры в заголовке, хвост с HTML после конца картинки, битые блоки''',
  '''имя файла от клиента теперь можно использовать как путь на диске''',
  '''размер файла в пределах лимита''',
]
answer = [1]
explain.ru = '''Сигнатура отвечает только на вопрос «как это начинается». Остальное надо проверять отдельно: размеры в заголовке (бомба), общий размер файла, а при раздаче не полагаться на то, что браузер увидит картинку (хвост с HTML, «полиглоты»). Клиентскому имени сигнатура доверия не прибавляет.'''
hint.ru = '''Сколько байт ты проверил, и сколько их в файле?'''

[[exercises]]
name = "svfile7"
style = "bughunt"
hint.ru = [
  '''Размер картинки лежит в начале файла, и декодировать её для этого не нужно. PNG: после сигнатуры идёт блок IHDR, в нём ширина и высота. Считай смещения по байтам: длина блока (4), имя (4), дальше поля.''',
  '''JPEG устроен сегментами: маркер `FF xx`, потом длина (она включает свои два байта), потом данные. Размеры лежат в сегменте SOF (маркеры от `C0` до `CF`, кроме `C4`, `C8`, `CC`). Искать байты `FF C0` по всему файлу нельзя: они встречаются внутри данных других сегментов, поэтому переступай сегменты по их длине.''',
  '''Произведение сторон считай в `u64`: в `u32` оно переполняется. Любое чтение за пределами среза должно давать `Truncated`, а не панику (`get(..)` вместо индексов).''',
]
why.ru = '''Размер файла говорит о картинке мало: сжатие превращает килобайт в миллиарды пикселей. Поэтому читаем размеры из заголовка, не декодируя, и сразу отсекаем сторону, площадь и нули. Два места, где обычно ошибаются: поиск маркера как подстроки (сработает на чужих данных) и умножение в `u32` (65536 на 65536 даёт ноль и проходит любой лимит). Чужой файл читают осторожно: каждое обращение по индексу это потенциальная паника.'''

[[exercises]]
name = "svfile8"
style = "scratch"
hint.ru = [
  '''Ключ известен только в конце, а писать надо с первого куска. Значит, пишем под временным ключом и считаем хеш по пути, а настоящее имя даём потом. Как «подсмотреть» каждый кусок, не собирая тело?''',
  '''У потока есть адаптер, который вызывает замыкание на каждом элементе и пропускает элемент дальше без изменений. Состояние хеша общее для замыкания и твоей функции, поэтому нужен общий владелец, например `Arc<Mutex<..>>`.''',
  '''Когда `put` закончился, у тебя есть хеш и размер. Ключ-хеш уже есть в хранилище? Тогда временный надо удалить. Нет? Переименовать. Если `put` упал, временный тоже убрать.''',
]
why.ru = '''Хеш считается по ходу, поэтому файл никогда не лежит в памяти целиком, а ключ зависит только от байтов (нарезка на куски ничего не меняет). Временный ключ нужен потому, что имя узнаётся в конце. Одинаковые файлы схлопываются в один: это экономит диск и даёт бесплатную проверку целостности. Цена в том, что удалять такой файл надо осторожно: на него могут ссылаться многие.'''

[[exercises]]
name = "svfile_q4"
kind = "question"
question.ru = '''Файлы хранятся по хешу содержимого, и две разные учётки ссылаются на одну и ту же картинку. Первый пользователь меняет аватар, и обработчик, как раньше, удаляет «его» старый файл. Что с аватаром второго?'''
options.ru = [
  '''ничего: у каждого своя копия''',
  '''аватар второго пропал: файл один на двоих, и удалять его можно, только когда на него никто не ссылается''',
  '''второй увидит новый аватар первого''',
  '''удаление не получится: система защитит файл, на который есть две ссылки''',
]
answer = [1]
explain.ru = '''Дедупликация делает файл общим, а общее нельзя удалять по желанию одного владельца. Нужен счётчик ссылок на ключ (удаляем при нуле) или уборка по расписанию, которая сверяет файлы со ссылками в базе. Система файлов тут не защитит: для неё это просто имя.'''
hint.ru = '''Сколько владельцев у файла с ключом-хешем?'''

[[exercises]]
name = "svfile9"
style = "bughunt"
hint.ru = [
  '''Что получится из `root.join("/etc/x")`? А из `root.join("../../x")`? И попробуй «вычистить» опасное: `replace("../", "")` превращает `....//` обратно в `../`.''',
  '''Чистить имя бесполезно: путь не должен зависеть от клиентского имени вообще. Ключ выбирает сервер, из числа, которое он выдал сам. Имя от клиента нужно только для показа.''',
  '''Для показа возьми последнюю часть (разделителями считай и `/`, и `\`), выкинь управляющие символы и точки в начале, обрежь до ста символов; если ничего не осталось, подставь запасное имя.''',
]
why.ru = '''Запретные подстроки обходятся (двойные точки, обратные слеши, кодирование, абсолютный путь вместо относительного), а список обходов бесконечен. Надёжно только одно: данные клиента никогда не становятся частью пути. Ключ строит сервер, в подкаталог из его первых символов. Имя файла остаётся строкой для показа, и даже её чистят, потому что она попадёт в заголовки и интерфейс.'''

[[exercises]]
name = "svfile10"
style = "scratch"
hint.ru = [
  '''Подпись HMAC считается от того, что нельзя менять. Что именно должно войти в неё, чтобы нельзя было ни продлить ссылку, ни подставить другой файл?''',
  '''Подписываемую строку собирай однозначно: между полями символ, которого в них быть не может. В `verify` порядок такой: разбор формата, допустимые символы ключа, подпись, и только потом срок.''',
  '''Подпись сравнивай готовой `ct_eq`, а не `==`. Срок строго «до»: при `now == exp` ссылка уже просрочена.''',
]
why.ru = '''Подписанная ссылка заменяет вход в аккаунт: любой, у кого она есть, скачает файл, а сервер не хранит про неё ничего, ему хватает секрета. Срок входит в подпись, иначе его можно было бы переписать. Подпись проверяется раньше срока, чтобы подделка не узнала, просрочена она или нет, а сравнение идёт за постоянное время, чтобы нельзя было подбирать подпись по задержкам ответа.'''

[[exercises]]
name = "svfile_q5"
kind = "question"
question.ru = '''Ссылка на скачивание подписана на сутки. Пользователь выложил её в публичный канал, и ссылки на этот файл надо отозвать немедленно, не трогая остальные файлы. Что подойдёт?'''
options.ru = [
  '''сменить секрет подписи на сервере''',
  '''подождать, пока сутки истекут''',
  '''включить в подпись версию файла из базы (число) и увеличить её: старые ссылки на этот файл перестанут проходить проверку, остальные файлы не пострадают''',
  '''удалить файл из хранилища''',
]
answer = [2]
explain.ru = '''Смена секрета отзывает все ссылки сразу, у всех файлов: слишком грубо. Ожидание оставляет дыру на сутки. Удаление файла ломает его для законных владельцев. Версия в подписи даёт точечный отзыв: ссылки старой версии не проходят проверку, а новые выдаются как обычно. Цена этого в том, что при проверке надо один раз сходить в базу за версией.'''
hint.ru = '''Что в проверке ссылки можно изменить так, чтобы это затронуло только один файл?'''

[[exercises]]
name = "svfile11"
style = "bughunt"
hint.ru = [
  '''Проверь сам: возьми честную ссылку, поменяй в URL число срока и открой. Что скажет `verify`? Что именно покрывает `mac`?''',
  '''В подпись должны войти все параметры, от которых зависит поведение: ключ, срок, имя. Но склейка без разделителя даёт одну и ту же строку для разных наборов: `ab` + `12` + `3x` и `ab` + `123` + `x`.''',
  '''Разделитель выбери из символов, которых в полях быть не может (поля уже проверены на допустимые).''',
]
why.ru = '''Подпись защищает ровно то, что в неё вошло: всё остальное в ссылке пользователь вправе править. Каждый параметр, влияющий на поведение (срок, имя для скачивания), должен быть внутри. Вторая тонкость: собирая строку из нескольких полей, нужен однозначный формат, иначе граница между полями «плывёт», и разные наборы дают один и тот же результат. Сложение без разделителя это классическая дыра.'''

[[exercises]]
name = "svfile12"
style = "bughunt"
hint.ru = [
  '''Между «положил файл» и «записал ссылку» может случиться что угодно, в том числе смерть процесса, после которой никакой код за собой уже не уберёт. Что должно лежать в базе заранее, чтобы уборщик потом узнал, что файл ничей?''',
  '''Две фазы. Фаза 1: запись «ожидает» с ключом и временем до первого байта. Фаза 2: ссылка записана, «ожидает» снята, старый файл удалён. Уборщик: запись «ожидает» старше `GRACE` значит, загрузка до конца не дошла, файл под удаление.''',
  '''Старый файл удаляй только после успешной записи новой ссылки, иначе при отказе базы профиль останется без картинки. Свежие записи «ожидает» уборщик пропускает: загрузка может ещё идти.''',
]
why.ru = '''Файловое хранилище и база это две системы, одной транзакции на них нет. Запись «ожидает» превращает неизвестное в известное: если процесс умер, в базе остался след, по которому фоновая чистка найдёт сироту. Окно `GRACE` защищает идущие загрузки: без него уборщик удалил бы файл, который ещё пишется. Порядок «сначала новое, потом убрать старое» оставляет пользователя с рабочим аватаром при любом сбое.'''

[[exercises]]
name = "svfile13"
style = "bughunt"
hint.ru = [
  '''Кому верить: клиенту, который сам выбрал `Content-Type` и имя, или содержимому? В браузере показывать безопасно только то, что ты сам распознал как картинку. Что делать со всем остальным?''',
  '''Тип и режим (`inline` или `attachment`) выбирай по сигнатуре, а `nosniff` и политику ставь всегда. Потом имя: оно попадает в заголовок, и управляющие символы надо вычистить раньше, чем что-то с ним делать.''',
  '''В `filename=` оставь только безопасные ASCII-символы, остальное замени на `_`. В `filename*=UTF-8''` закодируй каждый небезопасный байт как `%XX` заглавными hex-цифрами.''',
]
why.ru = '''Браузер выполняет то, что считает страницей. Если сервер отдал HTML или SVG как картинку и без `nosniff`, чужой скрипт запустится на нашем домене. Поэтому тип выбираем сами по сигнатуре, всё нераспознанное отдаём как скачивание, а `nosniff` и CSP закрывают оставшиеся лазейки. Имя файла в заголовке это ещё один вход для атаки: перевод строки в нём дописывает чужие заголовки, а кавычка закрывает значение. Отсюда две формы имени: безопасная ASCII и закодированная настоящая.'''

[[exercises]]
name = "svfile_q6"
kind = "question"
question.ru = '''Приложение живёт на `example.com`, а загруженные файлы раздаются с `files.example-usercontent.com`. Сигнатуры уже проверяются, `nosniff` ставится. Зачем ещё отдельный домен?'''
options.ru = [
  '''cookie сессии приложения не уходят на домен с файлами, и даже скрипт, который каким-то образом выполнится в загруженном файле, не получит доступа к сессии''',
  '''чтобы CDN работал быстрее''',
  '''иначе браузер откажется показывать картинки с того же домена''',
  '''это лишнее: `nosniff` закрывает все атаки через загруженные файлы''',
]
answer = [0]
explain.ru = '''Защита бывает глубокой: сигнатуры и `nosniff` уменьшают вероятность, что чужой код выполнится, но браузеры и форматы удивляют. Отдельный домен ограничивает ущерб, если это всё-таки случилось: у него другое происхождение (origin), чужие cookie и хранилище недоступны. Слой не заменяет другой.'''
hint.ru = '''Что браузер отправляет на домен вместе с запросом, и чьи данные доступны скрипту, выполнившемуся на этом домене?'''

[[exercises]]
name = "svfile_quiz"
kind = "project"
quiz = true
style = "scratch"
locked = ["src/microservices/api-gateway/tests/acceptance.rs"]
hint.ru = [
  '''Начни с крейта `files`: `limit`, `sniff` с `dimensions`, `Signer`, `put_content` (каждая из этих частей это задача главы). Потом `FsStore`, потом `AvatarService` в user-service и в конце шлюз.''',
  '''В `AvatarService::set_avatar` порядок такой: сначала проверки (размер, сигнатура и размеры картинки: аватар небольшой, его можно собрать в память под лимитом), потом запись «ожидает», потом файл по хешу, потом ссылка и удаление прежнего. В шлюзе поток тела сначала оборачивается в `limit`.''',
  '''Ссылку на скачивание шлюз выдаёт и проверяет через `Signer`. В ответе при раздаче всё по правилам из `serve`: тип по сигнатуре, `nosniff`, имя только в безопасной форме. Удаляя прежний файл, учти, что на него могут ссылаться другие.''',
]
why.ru = '''В проекте те же приёмы, что в главе, но каждый на своём месте: шлюз ограничивает размер на лету и не знает про картинки, user-service решает, что такое аватар (сигнатура, размеры, ключ по содержимому, двухфазная запись), крейт `files` ничего не знает про пользователей. Подписанная ссылка и безопасная раздача замыкают круг: файл попадает на диск проверенным и уходит наружу так, что браузер не получает повода его исполнять.'''

