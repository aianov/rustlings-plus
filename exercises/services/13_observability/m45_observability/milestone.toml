test_command = ["cargo", "make", "check"]
requires = ["nats"]
hint.ru = [
"""Начни с service-runtime: `propagation` и `metrics` не зависят ни от чего, а `JsonLayer` проверяется тестом без
сервисов через `tracing::subscriber::with_default`. Поля span'а храни в его расширениях: `span.extensions_mut().insert(..)`
в `on_new_span`, дописывай в `on_record`, а в `on_event` проходи `ctx.event_scope(event)` от корня.""",
"""Трейс между задачами одного запроса держи в `tokio::task_local!`: глобальная переменная смешает запросы, а guard
от `.enter()` переживёт `.await` и приклеит span к чужой работе. Оборачивай будущее: `with_trace(trace, work).instrument(span)`.""",
"""Метка пути в RED это шаблон маршрута, а не путь: `/users/alice` и `/users/bob` должны попасть в один ряд
`/users/:username`, иначе каждый ник создаст новый временной ряд. Шаблон знает только Router, поэтому замер встраивается в него.""",
"""Стенд шлюза в тесте ставит своего подписчика через `set_default` в однопоточном рантайме: все сервисы стенда
работают в той же нити, и их события попадут в один перехватчик. Строку доступа user-service включает `LogSink::stderr()`.""",
]
story.ru = """Теперь у каждого запроса есть след: клиент видит request-id ответа, а по нему и по общему trace_id в
логах шлюза, user-service и notify-service видно, куда запрос ходил и сколько там провёл. Каждый сервис отдаёт метрики
Prometheus, RED по маршрутам и методам показывает, что и как часто падает, а токены и пароли в логи больше не попадают."""
