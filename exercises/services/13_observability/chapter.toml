[[exercises]]
name = "svobs1"
style = "fix"
hint.ru = '''Данные идут в макрос перед текстом: поле без `= значение` берёт переменную с тем же именем, а для поля, у которого переменной нет, значение пишется явно. Не забудь, что текст сообщения теперь не должен менять слов от запроса к запросу.'''
why.ru = '''Поля нужны для поиска и подсчёта: «все отказы автора 7», «сколько слишком длинных постов за час». Склеенная строка это умеет только регулярками, и они ломаются при первой правке слов. Текст сообщения постоянный, чтобы события группировались; уровень тоже несёт смысл (WARN для запроса, который сервис отклонил правильно). Тексты пользователей в логи не пишут: там бывают пароли, чужие данные и просто лишний объём.'''

[[exercises]]
name = "svobs2"
style = "todo"
hint.ru = [
  '''Span создаётся один раз на запрос, и поле `status` в нём нужно объявить сразу, но заполнить позже: для этого есть специальное «пустое» значение поля. Значения полей span записываются при создании, а не при каждом событии.''',
  '''Чтобы span стал текущим только на время самой работы, а не на время всей функции, к future подклеивают span (трейт `Instrument`). Тогда каждый `poll` входит в span, а после возврата выходит из него, и два запроса в одном потоке не видят друг друга.''',
  '''Когда future завершилась, у тебя в руках всё ещё есть копия span: через неё можно записать значение в заранее объявленное поле. Для этого span клонируют до того, как отдать его future.''',
]
why.ru = '''`Instrument` это правильный способ нести контекст через `await`: span входит в работу при каждом опросе future и выходит при возврате, поэтому несколько запросов в одном потоке не путаются. Поле `status` объявляется как `Empty` и заполняется, когда ответ известен: span закрывается один раз, и в нём всё сразу (вход, выход, итог). Копия span (`clone` дёшев: это счётчик ссылок) нужна, чтобы записать итог после того, как исходный отдан future.'''

[[exercises]]
name = "svobs_q1"
kind = "question"
question.ru = '''Два запроса обрабатываются одновременно в одном потоке (`tokio::join!`). Функция такая:
```rust
async fn handle(id: u64) {
    let _guard = info_span!("req", id).enter();
    load_user().await;
    info!("готово");
}
```
Запрос 1 дошёл до `load_user().await` и уснул, запрос 2 вошёл в свой span и тоже уснул. Потом проснулся запрос 1 и написал «готово». С каким `id` оно записано?'''
options.ru = [
  '''с `id = 1`: это его собственная функция''',
  '''с `id = 2`: span второго запроса сейчас считается текущим''',
  '''без span: при `await` span закрывается''',
  '''программа паникует: два `enter` одновременно запрещены''',
]
answer = [1]
explain.ru = '''Guard `enter` привязывает span к потоку, а не к future: он живёт, пока жива переменная, а переменная живёт в состоянии future и переживает `await`. Запрос 2 вошёл в свой span поверх первого, поэтому у проснувшегося запроса 1 «текущий» span второго. Паники нет, span не закрывается: тихая подмена контекста, которая выглядит как правдоподобный лог. Лечится `Instrument`.'''
hint.ru = '''Кто знает, в какой поток вернётся span при пробуждении?'''

[[exercises]]
name = "svobs3"
style = "fix"
hint.ru = [
  '''Выпиши по порядку, что делают два одновременных запроса в одном потоке. Первый вошёл в span и зевнул на `await`; кто сейчас считается «внутри span»?''',
  '''Охрана `enter()` привязывает span к потоку, а не к future. Для async-кода span подклеивается к future целиком (`Instrument`), а не держится в руках. А что происходит с `tokio::spawn`: новая задача знает, из какого span её запустили?''',
  '''Всю работу функции надо обернуть в `async`-блок с `.instrument(span)`. Для запущенной внутри задачи есть готовый способ взять текущий span и подклеить его к чужой future.''',
]
why.ru = '''`span.enter()` делает span текущим для потока и держит его, пока жив guard. В синхронном коде это то, что нужно, а в async guard переживает `await`, и пока одна задача спит, другая в том же потоке пишет в её контекст. `Instrument` входит в span на время каждого опроса и выходит, поэтому такой ошибки не возникает. Запущенная через `tokio::spawn` задача не наследует контекст (это другая future на другом потоке), и его переносят явно, подклеивая текущий span.'''

[[exercises]]
name = "svobs4"
style = "scratch"
hint.ru = [
  '''У `EnvFilter` два конструктора: один терпит опечатки молча, другой возвращает ошибку. Что тебе нужно знать об опечатке, чтобы сообщить о ней оператору?''',
  '''Порядок такой: взять значение, пустое или из пробелов считать отсутствующим, иначе пробовать разобрать. Не разобралось: вернуть режим по умолчанию и описание проблемы с исходным значением и текстом ошибки.''',
  '''Режим по умолчанию это одна строка директив в том же формате, что и `RUST_LOG`, поэтому строится тем же конструктором, но уже без ошибки.''',
]
why.ru = '''Переменная окружения это ввод оператора, а ввод бывает с опечатками. «Упасть при запуске» плохо: это простой, который можно было избежать. «Тихо отключить логи» хуже: сервис работает, но слепой. Правильный компромисс: безопасный режим по умолчанию и громкое сообщение о причине, записанное, когда логирование уже настроено. Шумных соседей (`hyper`, `h2`, `tower`) глушим по умолчанию, но не мешаем оператору включить их явно.'''

[[exercises]]
name = "svobs_q2"
kind = "question"
question.ru = '''Оператор запустил сервис с `RUST_LOG=warn,social::posts=debug`. Какие из этих событий попадут в лог?'''
options.ru = [
  '''`debug` из `social::posts`''',
  '''`debug` из `social::posts::cache`''',
  '''`info` из `social::feed`''',
  '''`warn` из `hyper::client`''',
  '''`error` из `social::feed`''',
]
answer = [0, 1, 3, 4]
explain.ru = '''Директива `цель=уровень` действует на цель и на все её вложенные модули по префиксу пути, поэтому `social::posts::cache` тоже получает `debug`. Всё остальное идёт по общему уровню `warn`: `info` из `social::feed` не проходит, а `warn` и `error` проходят. Более длинная и точная директива побеждает более общую.'''
hint.ru = '''Директива с модулем действует и на его вложенные модули. Что тогда с остальными?'''

[[exercises]]
name = "svobs5"
style = "todo"
hint.ru = [
  '''Слой вызывается на каждое событие, и поля события он видит только через посетителя (`Visit`). Какие методы посетителя сработают для текста, для чисел и для значения, обёрнутого в `%`/`?`?''',
  '''Сообщение события это обычное поле с именем `message`. Текст приходит двумя путями (как `&str` и как отладочное значение): если оформить оба одинаково, кавычек не будет. Ошибки приходят отдельным методом, который по умолчанию печатает дамп.''',
  '''Порядок уровней в tracing «наоборот»: чем подробнее, тем больше. Поэтому условие «WARN или ERROR» записывается через сравнение «не больше WARN».''',
]
why.ru = '''Свой слой это способ получить события в коде: для страницы сбоев, для счётчиков ошибок, для теста. Посетитель (`Visit`) вызывается по методу на каждый тип значения, и важно покрыть те, которые меняют вид: строки без кавычек, ошибки текстом, а не структурой. Уровни в tracing упорядочены от ERROR (меньший) к TRACE (больший), и это сбивает: «не подробнее WARN» пишется как `<= WARN`.'''

[[exercises]]
name = "svobs6"
style = "fix"
hint.ru = [
  '''Что разбирает агрегатор: JSON. Открой в голове то, что получается из сообщения с кавычкой, обратной чертой и переводом строки, и найди, где строка перестаёт быть JSON.''',
  '''Склеивать JSON из кусков руками опасно: каждый новый символ это новое правило. Готовые средства есть: карты и значения `serde_json`, которые знают все правила экранирования и умеют оформить число, булево и `null`.''',
  '''Для span нужно хранить поля при создании (и обновлять при записи в них позже), чтобы в момент события они лежали в расширениях span. Обход span вокруг события идёт от внутреннего к внешнему, а в строку они идут наоборот.''',
]
why.ru = '''Лог это данные для машины, и единственный способ не сломать их данными пользователя это формировать JSON структурой, а не склейкой строк. Экранирование не ограничивается кавычкой: обратная черта, управляющие символы и даже `NaN` у числа (его в JSON нет). Span в строке нужны, чтобы по одной записи было видно, к какому запросу она относится; при этом поля, записанные в span позже создания, тоже должны попасть в строку.'''

[[exercises]]
name = "svobs7"
style = "scratch"
hint.ru = [
  '''Заголовок это четыре поля через дефис фиксированной длины в шестнадцатеричной записи. Проверь по очереди: количество частей, длины, допустимые символы, запрещённые значения.''',
  '''Строгий разбор отвергает всё лишнее: заглавные буквы, пробелы по краям, нулевые идентификаторы и версию `ff`. Но версии выше `00` читаются по известному началу, а хвост игнорируется (для `00` хвост недопустим).''',
  '''Новый идентификатор перехода просят у генератора, пока он не вернёт то, что годится: не ноль и не номер родителя. Для начала нового трейса нужны два числа подряд, из них собирается широкий идентификатор.''',
]
why.ru = '''`traceparent` это договор между сервисами на разных языках, поэтому разбор строгий: сервис, который принимает лишнее, однажды склеит чужие трейсы или упадёт на мусоре. Каждый переход получает новый `span_id` и запоминает родителя: именно так из логов собирается дерево. Решение о выборке (`sampled`) принимает тот, кто начал трейс, остальные передают его дальше. Случайность подаётся снаружи, чтобы тест мог проверить граничные случаи (ноль, повтор родителя).'''

[[exercises]]
name = "svobs8"
style = "bughunt"
hint.ru = [
  '''Пройди глазами путь события и выпиши, где в каждом переходе рождается контекст: откуда он берётся и куда уходит дальше. Где путь обрывается?''',
  '''Разрывов несколько и они одинаковые по природе: у издателя событие уходит без заголовка, у потребителя заголовок не читается, и дальше по gRPC потребитель отправляет пустые metadata. Контекст надо и положить, и взять, и передать следующему.''',
  '''Важно, чей именно контекст кладётся в заголовок: контекст перехода, который публикует, а не тот, что пришёл ему на вход. Иначе родитель следующего перехода будет указывать мимо.''',
]
why.ru = '''Трейс рвётся не в одном месте, а в каждом переходе, где контекст не передали явно: он не переходит границу процесса сам. Поэтому пара «вложить в исходящее» и «достать из входящего» нужна на каждом транспорте (HTTP, gRPC metadata, заголовки NATS), и в заголовок кладётся контекст того перехода, который отправляет. Потребитель с чужим или пропавшим заголовком не должен падать: сообщения без трейса (старый издатель) нормальная жизнь, для них просто начинается новый.'''

[[exercises]]
name = "svobs_q3"
kind = "question"
question.ru = '''Потребитель получил из NATS сообщение с `traceparent` издателя и обработал его, но подтверждение потерялось, и брокер доставил то же сообщение ещё раз. Как должны соотноситься два перехода «обработка сообщения» в трейсе?'''
options.ru = [
  '''одинаковые `span_id`: это одна и та же обработка''',
  '''один `trace_id` и один родитель (переход издателя), но у каждой обработки свой `span_id`''',
  '''второй раз начинается новый трейс, потому что это новая попытка''',
  '''второй раз заголовок игнорируется, чтобы не дублировать записи''',
]
answer = [1]
explain.ru = '''Две обработки это два разных события в жизни системы: у каждой своя длительность и своя судьба, и `span_id` у них разные. Принадлежат они одному запросу, поэтому `trace_id` общий, а родитель у обоих один: переход издателя. В трейсе это видно как повторную ветку, и по ней же находятся доставки «хотя бы раз». Склеивать их в один `span_id` или начинать трейс заново значит потерять причину.'''
hint.ru = '''Что отличает одну обработку от другой, а что у них общего?'''

[[exercises]]
name = "svobs9"
style = "scratch"
hint.ru = [
  '''Раздели задачу на три. Первая: собрать дерево из плоского списка, в котором строки идут как попало. Вторая: посчитать собственное время узла. Третья: обойти дерево и выбрать максимум.''',
  '''Собственное время это длительность минус время, которое покрыто детьми. Если дети работали параллельно, их интервалы перекрываются, и вычитать сумму нельзя: считай длину объединения интервалов, обрезанную рамками родителя.''',
  '''Строки, чей родитель не пришёл, не выбрасывай: они становятся корнями. Для объединения интервалов отсортируй детей по началу и веди «до куда уже покрыто». Для устойчивого порядка и ничьих сравнивай пары (время начала, номер).''',
]
why.ru = '''Распределённый трейс это набор строк из разных логов, и дерево приходится собирать самому: порядок прихода случаен, части теряются, дети бывают параллельны. Поэтому потерянные родители делают корни, а не удаляют поддерево, а собственное время считается по объединению интервалов (иначе два параллельных вызова по 50 мс «вычитаются» как 100). «Самый медленный переход» это не самый длинный span (он включает чужую работу), а тот, где ушло больше всего собственного времени.'''

[[exercises]]
name = "svobs10"
style = "scratch"
hint.ru = [
  '''Счётчик и gauge это одно число, которое трогают из многих потоков. Подумай, какая операция над числом безопасна без замка и какой порядок доступа (`Ordering`) здесь достаточен.''',
  '''Реестр это карта «имя → метрика» под замком. Повторный запрос того же имени возвращает ту же метрику (внутри общий `Arc` с числом), а запрос того же имени другого вида это ошибка программиста.''',
  '''Вывод строится по порядку имён карты. HELP-текст нужно экранировать, иначе перевод строки в нём ломает формат. Допустимое имя начинается с буквы, подчёркивания или двоеточия.''',
]
why.ru = '''Метрики читает Prometheus по тексту, и формат строг: у каждой метрики `# HELP`, `# TYPE` и значения. Числа в метриках увеличивают из любых потоков, и атомарная операция делает это без замка и без потерь (порядок доступа `Relaxed` достаточен, потому что важна сумма, а не порядок). Ошибки именования ловятся паникой при регистрации: при запуске они дёшевы, а в 3 часа ночи через сломанный формат дороги.'''

[[exercises]]
name = "svobs11"
style = "scratch"
hint.ru = [
  '''Гистограмма это массив счётчиков по бакетам плюс сумма. Решение, в какой бакет упало значение, одно: первая граница, не меньшая значения.''',
  '''Prometheus хранит бакеты накопительно: строка `le="0.5"` включает всё, что не больше 0.5, в том числе то, что уже попало в меньшие. Внутри можно хранить и по отдельности, но при выводе нужен бегущий итог.''',
  '''Последняя строка бакетов, `+Inf`, равна общему числу наблюдений и совпадает с `_count`. Некорректные значения не должны портить сумму.''',
]
why.ru = '''Накопительные бакеты нужны, чтобы бакеты можно было складывать между экземплярами и считать перцентили на сервере метрик (`histogram_quantile`). Граница включена («меньше или равно»), поэтому значение ровно 0.5 уже в бакете 0.5. NaN игнорируется, иначе он навсегда сломает сумму. Границы проверяются при создании: перепутанный порядок даёт молчаливый мусор на графике.'''

[[exercises]]
name = "svobs_q4"
kind = "question"
question.ru = '''Накопительные бакеты гистограммы времени ответа (в секундах): `le=0.05` → 700, `le=0.1` → 900, `le=0.25` → 950, `le=0.5` → 985, `le=1` → 998, `le=+Inf` → 1000. Где лежит p99?'''
options.ru = [
  '''около 0.05 с: почти все ответы быстрые''',
  '''между 0.25 и 0.5 с''',
  '''между 0.5 и 1 с''',
  '''оценить нельзя: нужны все значения''',
]
answer = [2]
explain.ru = '''p99 это значение, ниже которого лежат 99% наблюдений, то есть 990 из 1000. До 0.5 с их накоплено 985, до 1 с уже 998, поэтому 990-е наблюдение лежит в бакете от 0.5 до 1 с. Prometheus оценит его линейной интерполяцией внутри бакета (около 0.69 с). Точное значение узнать нельзя, и в этом цена гистограммы: ответ получается с точностью до бакета, поэтому границы подбирают вокруг тех значений, которые важны.'''
hint.ru = '''Найди 990-е наблюдение: в каком бакете накопленное число впервые достигает 990?'''

[[exercises]]
name = "svobs12"
style = "bughunt"
hint.ru = [
  '''Прикинь по условию: сколько секунд длится самый медленный запрос, какие значения лежат в бакетах и какие из них вообще используются. Сравни единицы: в чём считает записывающий код и в чём называются границы.''',
  '''Перцентиль оценивается внутри бакета, поэтому бакеты должны покрывать весь реальный диапазон, от долей миллисекунды до десятков секунд, с постоянным шагом в разах (а не в штуках). Стандартное соглашение Prometheus: время в секундах, имя заканчивается на `_seconds`.''',
  '''Исправлений три: единицы измерения записи (дробные секунды, а не целые миллисекунды), набор границ (порядка десятка, от 1 мс до 10 с, с шагом примерно в 2.5 раза) и имя метрики.''',
]
why.ru = '''Гистограмма честна только в своих границах: всё, что вылезло за последний бакет, становится «больше последней границы», и перцентиль упирается в неё, как в потолок. Единицы тоже часть договора: Prometheus ждёт секунды, и панели на чужих дашбордах будут считать, что у тебя секунды. Целые миллисекунды теряют всё, что быстрее миллисекунды. Бакетов должно быть не слишком мало (грубая оценка) и не слишком много (каждый бакет это отдельный ряд).'''

[[exercises]]
name = "svobs13"
style = "fix"
hint.ru = [
  '''Посчитай, сколько рядов даёт одна метка, если значения в ней присылает клиент. Сколько значений у `method`, у `status`, у `route`? У какой метки их число зависит не от нас?''',
  '''Все три метки, пришедшие от клиента, надо привести к конечному набору. Для пути такой набор даёт сам маршрутизатор: шаблон, под который путь подошёл. Если не подошёл ни один, нужно одно общее значение.''',
  '''Метод проверяется по списку известных. Шаблон маршрута спрашивается у готового `matched`; про запрос в нём (`?`), решётку и косую черту на конце заботиться не надо, это уже сделано.''',
]
why.ru = '''Каждая комбинация значений меток это отдельный ряд во времени, и Prometheus хранит их все в памяти. Всё, что присылает клиент (путь, метод, имя в заголовке), бесконечно, поэтому в метку идёт только то, что мы сами перечислили заранее: шаблон маршрута, известные методы, коды ответа. Чужое сворачивается в одно значение («unmatched», «OTHER»). Сам путь можно вынести в логи: логи дешёвые, а ряды нет.'''

[[exercises]]
name = "svobs_q5"
kind = "question"
question.ru = '''Post-service считает `posts_created_total`. Какие метки можно добавить без риска для Prometheus?'''
options.ru = [
  '''`kind` (текст, фото, опрос)''',
  '''`author_id`''',
  '''`client_ip`''',
  '''`region` (двенадцать регионов)''',
  '''`post_id`''',
]
answer = [0, 3]
explain.ru = '''Ряд создаётся для каждой комбинации значений меток, и безопасны только метки с небольшим конечным набором значений, который задан сервисом: тип поста и регион. `author_id`, `client_ip` и `post_id` растут вместе с пользователями и трафиком и выедают память Prometheus (взрыв кардинальности). Информацию «кто именно» сохраняют в логах и трейсах, они для этого и созданы.'''
hint.ru = '''Сколько разных значений у метки может появиться за год, и кто их выбирает?'''

[[exercises]]
name = "svobs14"
style = "bughunt"
hint.ru = [
  '''Найди в обёртке места, где функция может завершиться раньше, чем дойдёт до учёта. Сколько таких выходов: ошибка, отмена клиентом? Что должно сработать в каждом?''',
  '''Учёт должен быть при любом исходе работы: результат (успех или ошибка) превращается в код ответа, а потом уже учитывается. Ошибка при этом возвращается наружу целой.''',
  '''Счётчик «в работе» надо уменьшать не после работы, а при уничтожении охранника: он сработает и при ранней ошибке, и когда future просто бросили. Ошибки сервера это только коды от 500.''',
]
why.ru = '''Оператор `?` и отмена future выходят из функции раньше, чем доходит до строк учёта, и именно эти случаи самые интересные для дашборда: ошибки и зависания. Поэтому результат сначала сохраняется, потом превращается в код и учитывается, и только потом возвращается. Счётчик «в работе» делается через `Drop`: он надёжнее любого явного вызова после работы. 4xx считаются запросами, но не ошибками сервера: иначе любой сканер «ломает» сервис на графике.'''

[[exercises]]
name = "svobs15"
style = "scratch"
hint.ru = [
  '''Начни с доли хороших запросов: пустое окно считается идеальным (деление ноль на ноль даст NaN). Скорость сгорания это доля плохих, делённая на разрешённую долю плохих.''',
  '''Граничные случаи ломают формулы: окно без запросов, SLO ровно 100% (бюджета нет вовсе), число хороших больше общего. Реши заранее, что вернёт каждая функция в таких случаях.''',
  '''Доля быстрых берётся из накопительного бакета, граница которого равна порогу: промежуточных значений гистограмма не хранит, поэтому порог внутри бакета это ошибка, а не оценка.''',
]
why.ru = '''SLO превращает «вроде работает» в число, а бюджет ошибок в ресурс, которым можно управлять. Скорость сгорания 1 значит, что бюджет закончится ровно к концу периода, 14.4 значит, что 2% месячного бюджета уходит за час. Два окна нужны, потому что каждое врёт по-своему: короткое ловит всплески (в том числе давно закончившиеся), длинное медленно реагирует. Будить стоит, когда горят оба. Порог внутри бакета честно оценить нельзя, и функция так и отвечает.'''

[[exercises]]
name = "svobs_q6"
kind = "question"
question.ru = '''Сервис обещает 99.9% доступности за 30 дней. Сколько минут полного простоя бюджет ошибок допускает за этот период (если все запросы идут равномерно)?'''
options.ru = [
  '''около 4 минут''',
  '''около 43 минут''',
  '''около 7 часов''',
  '''около 72 часов''',
]
answer = [1]
explain.ru = '''В 30 днях 43 200 минут, а бюджет это 0.1% от них: 43.2 минуты. Это и есть цена трёх девяток: меньше часа простоя в месяц, вместе с плановыми работами. Поэтому SLO ставят честно: четыре девятки оставили бы 4.3 минуты, а 99% целых 7.2 часа. Бюджет расходуется и на частичные сбои: полный простой тут просто единица измерения.'''
hint.ru = '''Сколько минут в 30 днях, и чему равна одна тысячная от них?'''

[[exercises]]
name = "svobs16"
style = "fix"
hint.ru = [
  '''Куда попадают данные клиента при выводе в лог? Выпиши все места: адрес, параметры запроса, заголовки. Что из этого секрет, а что просто данные, которым нельзя доверять?''',
  '''Секретные параметры определяются по имени после раскодирования процентной записи и без учёта регистра. Прячется значение, а имя остаётся: так видно, что параметр был. Заголовки сравниваются по имени тоже без учёта регистра.''',
  '''Отдельная защита нужна от данных, которые могут поддельно завершить запись: перевод строки, возврат каретки, кавычка и прочие управляющие символы заменяются видимыми последовательностями.''',
]
why.ru = '''Секреты попадают в логи самым скучным способом: адрес `?token=` напечатали «как есть». Два правила: лучше список секретных имён, чем список «безопасных» (иначе новое поле утечёт при первом добавлении), и фильтр сравнивает уже раскодированное имя без учёта регистра, иначе `%74oken` его обойдёт. Отдельная беда: данные клиента с переводом строки подделывают записи лога, поэтому всё, что идёт от клиента, печатается экранированным.'''

[[exercises]]
name = "svobs_quiz"
kind = "project"
quiz = true
style = "scratch"
locked = ['src/crates/obs/tests/units.rs', 'src/crates/social/tests/flow.rs']
hint.ru = [
  '''Начни с `obs`: `trace` (разбор и новые идентификаторы), потом `metrics` и `red`, потом `redact`. На них опираются сервисы. Каждую часть можно проверять тестами `units.rs` отдельно от остального.''',
  '''Три сервиса устроены одинаково: достать заголовок, продолжить трейс (`enter`), открыть span `hop` (`hop_span`), внутри написать событие, всё завернуть в `Red::track` и подклеить span через `Instrument`. Шлюз добавляет маршруты и строку доступа, сервис постов публикует событие в шину.''',
  '''В шину и в metadata кладётся заголовок контекста того перехода, который отправляет (`entered.ctx.header()`), а не того, что пришёл на вход. Для `/metrics` шлюз возвращает ответ до открытия span и до учёта в RED.''',
]
why.ru = '''Наблюдаемость это сквозная вещь, и её лучше проверять сквозным тестом: трейс одного запроса собирается из логов трёх сервисов, а не из их внутренностей. Поэтому каждый переход открывает span, пишет внутри событие и кладёт контекст дальше. RED обёрнут один раз и общий для всех сервисов, а метки берутся из шаблона маршрута, а не из пути клиента. Секреты скрываются в одном месте (`access_line`), чтобы их нельзя было забыть в новом обработчике.'''

