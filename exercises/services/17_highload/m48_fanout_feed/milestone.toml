hint.ru = [
"""Ленту читателя держи упорядоченным множеством ключей `(время, id)`: вставка и обрезка до N это `insert` и
`pop_first`, а страница после курсора это `range(..курсор).rev()`. Тогда курсор это просто последний ключ страницы.""",
"""Знаменитость определяй по числу подписчиков в момент события. Её посты лежат в списке автора, и чтение ленты
подмешивает их из подписок читателя; повтор поста, который успел разложиться до того, как автор стал знаменитым,
убирает `dedup` по id после сортировки.""",
"""Лайк: счётчик и множество лайкнувших меняй сразу, а запись в журнал откладывай. Чтобы порядок событий не
нарушился, сбрасывай накопленное перед любой другой записью и перед выборкой релея.""",
"""Кэш профилей: инвалидация поднимает эпоху ключа, а запрос запоминает эпоху на старте. Ответ, пришедший после
инвалидации, отдаётся вызвавшему, но в кэш не кладётся: иначе старое имя вернётся до следующего события.""",
]
story.ru = """Лента выдерживает нагрузку: пост раскладывается по лентам подписчиков при записи, знаменитость не
устраивает раскладку на миллион, бесконечная лента листается курсором, авторы страницы приходят одним вызовом из
кэша, который узнаёт о переименовании на всех шлюзах, а лайки пишутся пачкой. p99 ленты под нагрузкой проверяется."""
