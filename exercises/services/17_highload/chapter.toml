[[exercises]]
name = "svhl1"
style = "todo"
hint.ru = '''Кэш хранит значение вместе с моментом записи. Живое значение то, что младше срока жизни. Ошибка загрузчика выходит наружу через `?` до того, как что-нибудь попадёт в кэш.'''
why.ru = '''Cache-aside это три шага: посмотреть, при промахе загрузить, положить. Срок жизни хранится как момент записи, а не как таймер: просроченную запись достаточно не отдавать, при чтении она сама перестанет быть живой. Ошибку загрузки не запоминаем сознательно: следующий вызов должен получить шанс на успех, иначе один сбой базы превратится в минуту вечных ошибок. Замок держим только на время доступа к карте, а не на время загрузки: иначе все остальные ключи будут ждать одну загрузку.'''

[[exercises]]
name = "svhl2"
style = "fix"
hint.ru = [
  '''Что делает «выбросить давнее всех использованное» в простейшем виде? Как он ищет, кого выбрасывать, и сколько это стоит при 50 000 записей?''',
  '''Нужны две структуры сразу: карта «ключ в узел» для быстрого поиска и список узлов в порядке недавности для быстрого вытеснения. Двусвязный список в Rust проще всего держать в `Vec`, а ссылки на соседей делать индексами.''',
  '''Чтение и запись перекладывают узел в голову списка, вытеснение берёт хвост. Освободившиеся ячейки `Vec` пускай переиспользуются, иначе вектор растёт. Отдельно разбери ёмкость ноль и перезапись существующего ключа: свежесть обновляется, размер не растёт.''',
]
why.ru = '''LRU за O(1) это карта плюс двусвязный список, и никаких обходов. Индексы в `Vec` вместо ссылок избавляют от борьбы с владением и держат узлы в одном месте памяти, что ещё и быстрее. Тест на 200 000 операций специально ловит версию с `Vec` и поиском по нему: она проходит все функциональные проверки и всё равно убивает сервис на большом кэше. Ёмкость ноль и перезапись это два места, где реализации ломаются первыми.'''

[[exercises]]
name = "svhl3"
style = "scratch"
hint.ru = [
  '''Нужен реестр «ключ → то, что сейчас считается». Первый вызов по ключу запускает загрузчик, остальные присоединяются к тому, что уже идёт. В tokio для «выполнить один раз, остальные ждут» есть готовый тип.''',
  '''У `tokio::sync::OnceCell` есть метод `get_or_init`: первый вызывающий выполняет асинхронную инициализацию, остальные ждут её. Если инициализирующего отменили, ячейка остаётся пустой, и инициализацию берёт следующий ждущий. Положи по ячейке на ключ в карту под обычным замком.''',
  '''Не забудь убрать ключ из карты после завершения, иначе реестр превратится в вечный кэш. Но убирай только свою ячейку: пока ты завершался, под тем же ключом уже мог начаться новый полёт. Сравни указатели (`Arc::ptr_eq`).''',
]
why.ru = '''Single-flight это не кэш: он живёт ровно столько, сколько длится загрузка. Поэтому ключ уходит из карты сразу после завершения, а новый промах начинает новый полёт. Проверка на ту же самую ячейку нужна на случай, когда ключ уже занят следующим полётом. `OnceCell` даёт безопасность при отмене бесплатно: если выполняющего бросили, один из ждущих становится новым и не зависает никто. Ручная версия на канале и флаге обычно ломается именно на отмене.'''

[[exercises]]
name = "svhl_q1"
kind = "question"
question.ru = '''Популярный ключ читают 2000 раз в секунду. Загрузка из базы занимает 100 мс. Срок жизни записи вышел. Защиты от стаи нет. Примерно сколько одинаковых запросов дойдёт до базы, пока первый промах ещё в пути?'''
options.ru = [
  '''один, остальные получат ответ от первого''',
  '''около 20''',
  '''около 200''',
  '''около 2000''',
]
answer = [2]
explain.ru = '''Пока первый запрос в пути (100 мс = 0,1 с), приходит 2000 × 0,1 = 200 запросов, и все они видят пустой кэш и идут в базу. Это число растёт, если база от такой нагрузки замедляется: окно промаха удлиняется, запросов набегает больше. Single-flight сводит двести вызовов к одному.'''
hint.ru = '''Умножь скорость запросов на длительность окна, в котором кэш пуст.'''

[[exercises]]
name = "svhl4"
style = "fix"
hint.ru = [
  '''Когда протухнут записи, положенные в одну секунду с одним сроком? Что нужно сделать со сроком, чтобы они протухали в разные моменты, не потеряв воспроизводимости?''',
  '''Срок записи вычисляется из ключа: базовый срок умножается на число из диапазона от 0,9 до 1,1, которое получено хешем ключа. Один ключ даёт один срок, разные ключи разные.''',
  '''Хеш должен быть приличным: у ключей `user:1`, `user:2` простой хеш по последнему байту даёт близкие значения, и распределение выйдет неровным. После обычного хеша добавь перемешивание битов. Из старших 53 бит получается число от 0 до 1.''',
]
why.ru = '''Разброс срока превращает общий обрыв в пологий спуск: вместо тысячи промахов в одну секунду получается ровный поток. Детерминированность по ключу даёт воспроизводимое поведение и тесты без случайности. Заметь, что тест проверяет не только диапазон, но и ровность по окнам: хеш без перемешивания даёт кучки, и «разброс» формально есть, а будильник на месте.'''

[[exercises]]
name = "svhl5"
style = "scratch"
hint.ru = [
  '''Что должен сделать экземпляр, получив событие про один профиль? А если события пропущены, потому что подписчик отстал? Посмотри на варианты, которые может вернуть приём из канала `broadcast`.''',
  '''Три исхода приёма: пришло событие (убрать запись), канал переполнился и часть событий потеряна (кэшу верить нельзя), канал закрыт (пора завершаться).''',
  '''При потере событий очищается весь кэш: ты не знаешь, какие профили изменились. Это дороже, но единственный честный ответ.''',
]
why.ru = '''Шина с ограниченной очередью защищает отправителя от медленных читателей ценой потери событий для отстающих. Сообщение об этом, `Lagged`, обязательно надо обрабатывать: проигнорированное, оно оставляет кэш с неизвестным числом устаревших записей, и узнать об этом нельзя. Очистка всего кэша выглядит расточительно, но она редка и безопасна. Завершение по закрытию канала нужно, чтобы остановка сервиса не оставляла висящих задач.'''

[[exercises]]
name = "svhl6"
style = "bughunt"
hint.ru = [
  '''Выпиши по шагам историю читателя и события. Где читатель получил значение, где пришло событие, где читатель положил значение в кэш? Что должен был знать экземпляр на последнем шаге?''',
  '''Экземпляру нужна память о последней известной версии профиля, даже если записи в кэше нет. Событие запоминает версию, и положить в кэш можно только значение не старее запомненной.''',
  '''Версия прочитанного значения приходит вместе со значением. События могут прийти не по порядку: известной считается наибольшая версия, а событие с меньшей версией не должно выбрасывать более свежую запись.''',
]
why.ru = '''Инвалидация без версий открывает окно, в котором старое значение побеждает: событие уже обработано, а запоздавшая запись его перекрывает. Версия делает запись и событие сравнимыми: кэш принимает только то, что не старее известного. Запоминать версию надо отдельно от записи, потому что именно в этот момент записи в кэше нет. Порядок событий не гарантирован, поэтому берётся максимум, а не последнее пришедшее.'''

[[exercises]]
name = "svhl_q2"
kind = "question"
question.ru = '''Обновление профиля делается так: 1) очистить запись в кэше, 2) записать новое значение в базу. Между шагами 1 и 2 приходит читатель. Что окажется в кэше после обоих шагов?'''
options.ru = [
  '''новое значение: кэш чистый, читатель получил свежее''',
  '''старое значение: читатель промахнулся, прочитал старое из базы и положил в кэш, а шаг 2 кэш уже не трогает''',
  '''ничего''',
  '''зависит от размера кэша''',
]
answer = [1]
explain.ru = '''Между очисткой и записью в базе читатель видит пустой кэш, читает из базы ещё не обновлённое значение и кладёт его в кэш. Шаг 2 на кэш не влияет, и старое живёт до конца срока. Порядок «сначала записать, потом очистить» сужает окно, но не закрывает его полностью (запоздавший читатель всё ещё возможен), поэтому полное решение это версии в записях и событиях.'''
hint.ru = '''Расставь по времени: очистка, чтение читателем, запись в базу. Кто положил значение в кэш последним?'''

[[exercises]]
name = "svhl7"
style = "scratch"
hint.ru = [
  '''В карте запись должна различать «найден» и «не найден». Остальное та же логика cache-aside, только у отсутствия свой, более короткий срок.''',
  '''Следи за размером: записи об отсутствии должны считаться отдельно, и при достижении предела их нужно выбросить, но не трогая настоящие профили.''',
  '''Явная инвалидация должна работать и для записи об отсутствии: на событие «пользователь зарегистрировался» ждать конца короткого срока не нужно.''',
]
why.ru = '''Помнить отсутствие дёшево и спасает базу от перебора. Короткий срок нужен, потому что «нет» может превратиться в «есть» в любой момент. Предел записей об отсутствии нужен, потому что иначе перебор миллиона идентификаторов превратит защиту в способ забить память. Отдельный учёт предотвращает вытеснение настоящих профилей мусором: поэтому тест проверяет, что профиль, положенный до перебора, пережил его.'''

[[exercises]]
name = "svhl8"
style = "scratch"
hint.ru = [
  '''Номер собирается сдвигами: время сдвигается на 22 бита, узел на 12, счётчик занимает младшие 12. Разбор делается обратными сдвигами и масками.''',
  '''Если новая миллисекунда, счётчик начинается с нуля, если та же, увеличивается. Что делать, когда счётчик достигает 4096?''',
  '''Исчерпанный счётчик нужно дождаться следующей миллисекунды: читай часы, пока они не перейдут последнюю использованную. Не пытайся сразу «занять» следующую миллисекунду: часы могут её ещё не показывать.''',
]
why.ru = '''Составной номер сортируется как число, а значит, как время: старшие биты это время, поэтому раньше выданный номер всегда меньше. Узел во втором поле гарантирует отсутствие пересечений между узлами без всякой координации. Счётчик на 4096 значений в миллисекунду это четыре миллиона номеров в секунду на узел, и если он всё-таки исчерпан, честное ожидание лучше, чем выдача повторов.'''

[[exercises]]
name = "svhl_q3"
kind = "question"
question.ru = '''В двух узлах по ошибке в конфиге прописан один и тот же номер узла 5 (генератор: время, узел, счётчик). Когда появятся одинаковые номера?'''
options.ru = [
  '''никогда: время разное''',
  '''только если два узла выдают номер в одну и ту же миллисекунду с одинаковым значением счётчика''',
  '''сразу, при первом запуске''',
  '''только после переполнения счётчика''',
]
answer = [1]
explain.ru = '''Номер определяют три поля. Различаться должно хотя бы одно. При одинаковом узле остаются время и счётчик. Узлы друг про друга не знают, поэтому в одну миллисекунду оба начнут счётчик с нуля и выдадут одинаковые номера. Именно поэтому коллизию так трудно заметить: на малой нагрузке её почти нет, а на пиковой взрывается.'''
hint.ru = '''Какие поля номера всё ещё различаются у двух узлов, если номер узла одинаков?'''

[[exercises]]
name = "svhl9"
style = "bughunt"
hint.ru = [
  '''Воспроизведи на бумаге: часы показали 1000, генератор выдал три номера, часы показали 997. Что генератор делает со счётчиком, и что случится, когда часы вернутся к 1000?''',
  '''Генератору нужно помнить последнюю использованную миллисекунду и никогда не использовать меньшую. Считать надо от большего из двух: показаний часов и последней использованной.''',
  '''Если часы впереди, берём их и обнуляем счётчик. Иначе остаёмся в последней миллисекунде и увеличиваем счётчик. А если счётчик закончился, а часы всё ещё отстают, ждать нельзя: займи следующую миллисекунду логически.''',
]
why.ru = '''Часы не монотонны, и генератор не имеет права им верить. Логическое время `max(часы, последнее)` монотонно по построению, а номера, построенные из него, строго растут. При большом откате номера «живут в будущем» относительно часов, пока те не догонят, и это нормально: порядок и уникальность важнее точности метки. Тест на час отката проверяет, что генератор не падает и не зависает в ожидании.'''

[[exercises]]
name = "svhl10"
style = "scratch"
hint.ru = [
  '''Курсор это значения полей, склеенные в строку фиксированной ширины. Контрольная сумма считается по ним и дописывается в конец. Разбор проверяет длину, алфавит, сумму.''',
  '''Страница это отбор постов строго «меньше курсора» по паре (время, номер), первые `limit`, ограниченные от 1 до 100. Чтобы понять, нужен ли курсор следующей страницы, достаточно посмотреть, есть ли ещё хотя бы один пост после взятых.''',
  '''Курсор следующей страницы строится из последнего возвращённого поста. Пустая лента и ровно заполненная последняя страница не должны выдавать курсор.''',
]
why.ru = '''Пара (время, номер) делает порядок полным: посты с одинаковым временем различаются номером, и ни один не теряется на границе страницы. Курсор строится из реального поста, а не из позиции, поэтому вставки сверху ничего не сдвигают. Контрольная сумма ловит опечатки и обрезки, а не злонамеренную подделку: для неё нужна подпись. Длина и алфавит проверяются до разбора, потому что `from_str_radix` принимает знак плюс и другие неожиданности.'''

[[exercises]]
name = "svhl_q4"
kind = "question"
question.ru = '''Лента отсортирована по времени создания (в миллисекундах). Курсор следующей страницы содержит только время последнего показанного поста, и следующая страница это «все посты старше этого времени». Что может пойти не так?'''
options.ru = [
  '''ничего, время уникально''',
  '''посты с тем же временем, что у последнего показанного, но не поместившиеся на страницу, будут пропущены''',
  '''страницы станут дублироваться, если автор удалит пост''',
  '''курсор станет длиннее''',
]
answer = [1]
explain.ru = '''Время создания не уникально: два поста легко появляются в одну миллисекунду. Если страница обрывается между ними, «старше последнего показанного» исключает и второй, и он теряется навсегда. Курсор должен задавать полный порядок: пара (время, идентификатор), где идентификатор разрешает ничьи.'''
hint.ru = '''Что происходит с постом, у которого время такое же, как у последнего показанного на странице?'''

[[exercises]]
name = "svhl11"
style = "fix"
hint.ru = [
  '''Что значит «пропустить пять» для ленты, которая только что выросла сверху на четыре поста? Где теперь находится то, что ты показывал на первой странице?''',
  '''Курсор должен указывать на элемент, а не на позицию. Формат курсора и функции его разбора и сборки уже есть в файле.''',
  '''Вместо пропуска «n штук» отбирай посты строго старше элемента из курсора. Курсор следующей страницы строй из последнего возвращённого поста, и только если после него что-то осталось.''',
]
why.ru = '''Позиция в живом списке нестабильна: каждая вставка сверху сдвигает всё вниз, и страница начинается с уже виденного. Ключ элемента стабилен: пост старше конкретной пары (время, номер) остаётся старше при любых вставках. Поэтому keyset-пагинация (так называют этот приём) не показывает дублей и не пропускает данных, даже если посты добавляют между запросами страниц. Цена: нельзя перейти «сразу на страницу 17», только вперёд.'''

[[exercises]]
name = "svhl12"
style = "scratch"
hint.ru = [
  '''Две структуры: кто на кого подписан и личные ленты. Публикация обходит подписчиков автора и дописывает в голову каждой ленты.''',
  '''Лента обрезается после дописывания. Перед записью проверь, нет ли уже такого поста в ленте: события доставляются хотя бы раз, и дубль не должен попадать в ленту и в счётчик записей.''',
  '''Подписка не должна дублироваться при повторном вызове. Чтение это первые `limit` элементов ленты, она уже хранится от новых к старым.''',
]
why.ru = '''Раскладка при записи переносит работу с чтения на запись: читают чаще, чем пишут, поэтому выигрыш большой. Ограничение длины ленты держит память под контролем: никто не листает дальше нескольких сотен постов. Проверка на повтор делает публикацию идемпотентной: шины дают «хотя бы раз», и без неё повторное событие дублирует пост в тысячах лент.'''

[[exercises]]
name = "svhl13"
style = "scratch"
hint.ru = [
  '''Какие данные нужны, чтобы при чтении знать, на каких знаменитостей подписан читатель? Заведи обратный список подписок.''',
  '''Публикация сначала решает, знаменитость ли автор (число подписчиков не меньше порога). Знаменитость пишет один раз в общее хранилище с обрезкой, остальные раскладываются по лентам.''',
  '''Чтение собирает номера из личной ленты и хранилищ знаменитостей, на которых подписан читатель, убирает повторы, сортирует по убыванию и обрезает по `limit`. Автор, перешедший порог, оставляет старые посты в личных лентах, а новые в хранилище, и читатель видит всё вместе.''',
]
why.ru = '''Гибрид выбирает самое дешёвое для каждого автора: у обычного писать дёшево, у знаменитости читать (слияние с одним-двумя списками) дешевле, чем писать миллионам. Номера постов растут со временем, поэтому слияние это обычная сортировка номеров. Переход автора через порог не нуждается в миграции: старые посты уже лежат в личных лентах, новые будут в общем хранилище, и чтение просто читает оба источника.'''

[[exercises]]
name = "svhl_q5"
kind = "question"
question.ru = '''Автор А: 300 подписчиков, один пост в день. Автор Б: 5 миллионов подписчиков, 20 постов в день. Каждый подписчик открывает свою ленту примерно 50 раз в день. Какое сочетание разумно?'''
options.ru = [
  '''А и Б раскладывать при записи''',
  '''А раскладывать при записи, посты Б подмешивать при чтении''',
  '''А подмешивать при чтении, Б раскладывать при записи''',
  '''оба подмешивать при чтении''',
]
answer = [1]
explain.ru = '''Для А раскладка это 300 записей в день против 15 000 открытий лент: запись окупается сразу. Для Б раскладка это 100 миллионов записей в день, и огромная их часть уйдёт в ленты, которые в этот день никто не откроет. Подмешивание при чтении добавляет к каждому открытию ленты одно слияние с коротким списком, что намного дешевле. Это и есть гибрид.'''
hint.ru = '''Сравни, сколько записей стоит раскладка за день, с тем, сколько чтений ленты в этот день приходится на автора.'''

[[exercises]]
name = "svhl14"
style = "fix"
hint.ru = [
  '''Кто ждёт, пока сто тысяч лент получат пост? Что должен вернуть обработчик «опубликовать» автору и в какой момент?''',
  '''Раскладка выносится в фоновую задачу, а обработчик возвращается сразу. Каждая публикация получает свою задачу, поэтому большая не блокирует маленькую.''',
  '''Одной отпущенной задачи мало: при остановке она потеряется. Задачи нужно где-то держать (набор задач) и при остановке ждать их завершения.''',
]
why.ru = '''Ожидание конца раскладки не нужно никому из тех, кто опубликовал, поэтому её уносят в фон. Но фон без владельца это потерянная работа: сервис остановили, а часть подписчиков навсегда без поста. Набор задач с ожиданием в `close` делает фоновое честным: «ответили сразу» не означает «забыли». Пачки с паузой между ними дают другим задачам шанс работать, и поэтому первые подписчики видят пост через десять миллисекунд, а не после конца.'''

[[exercises]]
name = "svhl15"
style = "fix"
hint.ru = [
  '''Сколько вызовов ты делаешь для ленты из 50 постов 8 авторов? А сколько было бы достаточно?''',
  '''Собери уникальные идентификаторы авторов в порядке появления и запроси их пачками. Пачка ограничена сверху: подумай, как нарезать список.''',
  '''Ответ пачки это карта «автор → имя». Для каждого поста по своему автору возьми имя из карты, а для отсутствующих подставь вопросительный знак. Порядок постов не меняй.''',
]
why.ru = '''N+1 это не только про SQL, а про любой удалённый вызов в цикле. Уникальные идентификаторы сокращают пачку, пакетный метод убирает задержку на каждый вызов, а лимит размера пачки нужен, потому что настоящий сервис откажет на слишком длинном списке. Порядок постов определяется исходным списком, а не ответом: пачка не обязана вернуть авторов в том же порядке и не обязана вернуть неизвестных.'''

[[exercises]]
name = "svhl16"
style = "fix"
hint.ru = [
  '''Сколько записей в базу происходит на десять тысяч лайков и что случится с теми, что ещё в пути, когда процесс останавливают?''',
  '''Лайки складываются в карту «пост → накопленная сумма» в памяти. Отдельная задача раз в интервал забирает накопленное и пишет по одной сумме на пост. Забирай карту целиком и подставляй пустую: так лайки, пришедшие во время записи, попадут уже в следующую пачку.''',
  '''Остановка делает три вещи: говорит задаче сброса остановиться, дожидается её и сбрасывает всё, что накопилось с момента последнего сброса. Ждать очередного срока при этом не нужно.''',
]
why.ru = '''Десять тысяч записей по одной строке это десять тысяч блокировок на одну строку, а сумма за интервал это одна запись. Цена: счётчик отстаёт на интервал, и для лайков это приемлемо. Точность в итоге обеспечивают две вещи: подмена накопителя (никаких «забрал, записал, очистил», в середине которых может прийти лайк) и сброс при остановке. Для совсем горячего поста накопитель дробят на части по потокам, чтобы лайки не толкались на одной блокировке.'''

[[exercises]]
name = "svhl17"
style = "scratch"
hint.ru = [
  '''Хеш из стандартной библиотеки здесь не годится: он случайный от запуска к запуску. Нужен хеш, который одинаков везде, и в условии он назван.''',
  '''FNV-1a: начни с заданного значения, для каждого байта ключа сначала XOR, потом умножение (с переполнением). Результат делится по модулю на число шардов.''',
  '''Количество переехавших ключей это сколько ключей из списка получают разный шард при разном числе шардов. Прикинь заранее: при переходе с 10 на 11 ожидай около десяти из одиннадцати.''',
]
why.ru = '''Задача показывает цифрами, почему шардирование по модулю плохо переносит смену числа узлов: переезжает примерно N из N+1 ключей. Стабильный хеш это условие всей схемы: если два узла считают разные шарды для одного ключа, они не договорятся, кто хозяин. Тест на значение хеша для строки «a» ловит случайные хеши и любые «почти FNV».'''

[[exercises]]
name = "svhl_q6"
kind = "question"
question.ru = '''Кольцо согласованного хеширования из трёх узлов, у каждого одна точка на окружности. Через месяц выяснилось, что один из узлов получает в три раза больше ключей, чем другой. Почему и что делать?'''
options.ru = [
  '''хеш плохой, надо сменить алгоритм''',
  '''дуги между тремя случайными точками неравны по длине; дать каждому узлу много виртуальных точек''',
  '''ключей слишком мало''',
  '''надо перейти на хеш по модулю''',
]
answer = [1]
explain.ru = '''Три случайные точки делят окружность на три дуги случайной длины, и разница в три раза обычна. Чем больше точек у каждого узла, тем ближе его суммарная доля к среднему (закон больших чисел). Поэтому узлу дают сотни виртуальных точек. Хеш по модулю даст равномерную нагрузку, но заставит переезжать почти все ключи при смене числа узлов, то есть вернёт исходную проблему.'''
hint.ru = '''Из чего складывается доля узла на кольце и как её сделать менее случайной?'''

[[exercises]]
name = "svhl18"
style = "fix"
hint.ru = [
  '''Что в текущем коде определяет узел для ключа? Почему при добавлении узла ответ меняется почти для всех ключей?''',
  '''Нужна отсортированная по хешу структура точек: хеш точки хозяин. Для поиска хозяина ключа нужна первая точка с хешем не меньше хеша ключа, а если такой нет, первая точка вообще.''',
  '''Каждый узел вносит `vnodes` точек с хешами от строк вида `узел#номер`. Удаление узла убирает все его точки. Порядок добавления узлов не должен влиять на результат.''',
]
why.ru = '''Кольцо переносит вопрос с «сколько узлов» на «кто ближе по часовой стрелке»: добавление узла затрагивает только дугу перед ним, остальные ключи остаются на месте. Виртуальные узлы нужны для баланса. Отсортированная карта даёт поиск за логарифм. Тест «ключи переезжают только на новый узел» важнее, чем доля переехавших: именно он отличает кольцо от хитрой перестановки модуля.'''

[[exercises]]
name = "svhl_quiz"
kind = "project"
quiz = true
style = "todo"
locked = ["src/crates/feedsvc/tests/feed.rs"]
hint.ru = [
  '''Кирпичи лежат в соседних модулях и уже работают. Тебе нужны четыре функции в `service.rs`. Начни с `Profiles::names`: на нём держатся остальные проверки (пачки, общий вызов, кэш).''',
  '''`names`: сначала пройди по кэшу и собери живые, потом всё недостающее (без повторов, в стабильном порядке) отдай `SingleFlight::run` с ключом, построенным из этого набора, и в нём нарежь на пачки по 100. Одинаковый набор даёт одинаковый ключ, поэтому одинаковые запросы делят вызов. Результат положи в кэш со сроком `ttl_for`.''',
  '''`publish` решает по числу подписчиков, `feed` собирает кандидатов из двух источников, применяет курсор и лимит, берёт на один пост больше лимита, чтобы узнать, есть ли продолжение, и только потом идёт за именами. Блокировку состояния нельзя держать через `.await`: сначала вытащи нужное из-под неё в локальные значения.''',
]
why.ru = '''Здесь сходятся почти все приёмы главы: раскладка и гибрид решают, где платить за ленту, курсор делает страницы стабильными, пачка убирает N+1, single-flight на наборе идентификаторов превращает толпу одинаковых холодных запросов в один вызов, LRU и разброс срока держат кэш ограниченным и без будильников. Тест против простой модели (все посты в одном списке) дёшево находит ошибки слияния, курсоров и границ страниц, которые трудно придумать по одной, а проверка p99 на подмене с задержкой доказывает пользу общего вызова.'''

