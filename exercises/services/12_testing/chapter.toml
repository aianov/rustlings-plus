[chapter]
title.en = "Testing services"
title.ru = "Тестирование сервисов"

[[exercises]]
name = "svtest1"
style = "todo"
hint.ru = [
  '''Счётчик номеров должен быть общим для всех построителей и безопасным при параллельных тестах: подойдёт `static` с атомарным числом. Из номера выводятся и `id`, и почта, чтобы уникальной была и она.''',
  '''Каждый метод цепочки берёт `self` по значению, меняет поле и возвращает построитель дальше. Подписчикам тоже нужны номера из того же счётчика: тогда они не совпадут ни друг с другом, ни с самим пользователем.''',
]
why.ru = '''Построитель прячет подробности: появилось десятое поле, правится одно место, а не сорок тестов. Умолчания должны быть правдоподобными (иначе на каждом тесте срабатывает особый случай вроде «несовершеннолетний» или «заблокирован») и уникальными (иначе тесты в одной базе натыкаются на уникальный индекс друг друга). Счётчик атомарный, потому что тесты идут в разных потоках. Тест при этом называет только важное: `.banned()` читается как условие, а не как восьмая строка из девяти.'''

[[exercises]]
name = "svtest2"
style = "todo"
hint.ru = [
  '''Порт 0 просит систему выбрать свободный, а настоящий адрес узнаётся у самого слушателя. Почему слушающий сокет надо создавать до возврата из `start`, а не внутри фоновой задачи?''',
  '''Для остановки нужен сигнал, который видят все задачи (канал `watch` уже в заготовке), и учёт задач: приём соединений и каждый обработчик. `JoinSet` собирает обработчиков, и после остановки приёма его надо вычерпать до дна.''',
  '''Задача приёма в цикле ждёт сразу двух событий (`select!`): сигнал остановки или новое соединение. Вышел из цикла: закрой слушателя, чтобы порт освободился, потом дождись всех обработчиков. А `stop` дожидается задачи приёма.''',
]
why.ru = '''Тест, который поднял сервис и не убрал его, оставляет за собой порты и задачи, а на следующем тесте это превращается в странные падения. Порт 0 снимает конфликты между параллельными тестами, а занятый до возврата слушатель делает «подключился сразу» правдой. `stop`, который ждёт всех, даёт гарантию «после меня ничего не осталось»: именно её проверяют счётчики живых обработчиков. Молчащий клиент не должен задерживать остановку, поэтому обработчик слушает сигнал вместе с чтением.'''

[[exercises]]
name = "svtest_q1"
kind = "question"
question.ru = '''Интеграционные тесты user-service зашили порт 8080. На CI тесты идут параллельно, и через раз один из них падает с `Address already in use`. Что поменять?'''
options.ru = [
  '''запускать тесты по одному (`--test-threads=1`)''',
  '''просить порт 0 и читать настоящий адрес у слушателя''',
  '''добавить повтор: если порт занят, подождать и занять снова''',
  '''выбирать порт случайно из диапазона 20000..30000''',
]
answer = [1]
explain.ru = '''Последовательный запуск лечит симптом и замедляет все тесты. Повтор и случайный порт только уменьшают вероятность столкновения, но не убирают его (и порт может занять любой другой процесс на машине). Порт 0 отдаёт выбор системе, которая знает, какие порты свободны прямо сейчас, и тест получает адрес от самого слушателя.'''
hint.ru = '''Кто лучше всех знает, какие порты в эту секунду свободны?'''

[[exercises]]
name = "svtest3"
style = "bughunt"
hint.ru = [
  '''Выпиши хронологию: когда `start` возвращает адрес и когда по этому адресу реально начинают слушать. Что происходит с клиентом в промежутке?''',
  '''Пока подготовка не закончилась, сервис не готов, и `start` не имеет права вернуться. Подготовку можно просто дождаться прямо в `start`, без фоновой задачи.''',
  '''Порядок такой: подготовка (её ошибка и есть ошибка запуска), потом занять порт и взять адрес у слушателя, и только потом фоновая задача обслуживания. Угадывать порт заранее («занял и отпустил») само по себе гонка.''',
]
why.ru = '''Возврат из `start` это обещание «можно подключаться». Если оно дано раньше, чем сервис готов, любой тест вынужден гадать, и появляется `sleep`. Поэтому всё медленное (подготовка, bind) делается до возврата, а не после. Ошибка подготовки должна быть ошибкой запуска: иначе тест получит адрес и будет бесконечно ждать ответ от сервиса, которого нет. И адрес берётся у уже занятого слушателя: «сначала узнать свободный порт, потом занять» оставляет окно, в которое влезает другой тест.'''

[[exercises]]
name = "svtest4"
style = "todo"
hint.ru = [
  '''Цикл такой: проба, при неудаче запомнить причину, проверить время, поспать. Что значит спать «не дольше оставшегося времени», и зачем это нужно?''',
  '''Пауза `min(every, осталось)` даёт последнюю проверку точно в срок, а не на попытку раньше. Время бери из `tokio::time::Instant`: оно честное и в тестах с остановленными часами.''',
]
why.ru = '''Опрос с таймаутом это единственный способ проверить то, что сервис делает сам и без хуков: письмо дошло, строка появилась в базе, событие дошло до чужого сервиса. Он быстр, когда эффект быстр (проверка сразу, потом короткие паузы), и ограничен, когда эффекта нет (срок вышел, в сообщении последняя причина, а не безликое «таймаут»). Последняя проверка в срок нужна, чтобы условие, наступившее в последний момент, не считалось пропущенным; а считать по времени, а не по числу попыток, нужно потому, что сама проба тоже занимает время.'''

[[exercises]]
name = "svtest5"
style = "bughunt"
hint.ru = [
  '''Ожидание «на глаз» всегда либо слишком короткое, либо слишком длинное. Мы владеем `Mailer`, так что пусть он сам сообщает, когда доставил. Какой примитив tokio хранит число и будит ждущих, когда оно меняется?''',
  '''`tokio::sync::watch` хранит значение и умеет ждать, пока оно подойдёт под условие. Увеличивай счётчик после того, как письмо попало в ящик, иначе ожидающий проснётся, а ящик ещё пуст.''',
  '''Подписку оформляй внутри `wait_delivered`: получатель сначала видит текущее значение, поэтому доставка, случившаяся до подписки, не теряется.''',
]
why.ru = '''Если код под твоим контролем, не опрашивай его, а дай ему сказать, что случилось: тогда ожидание ровно такое, какая задержка, ни миллисекундой больше, и никаких «подожду на всякий случай». Опрос (`eventually`) оставляй для чужого: сети, базы, других сервисов. `watch` подходит потому, что хранит последнее значение: подписавшийся позже всё равно видит, сколько уже доставлено, и пропущенного пробуждения не бывает. Эту же ошибку делают с `Notify`, когда проверяют условие и подписываются в два шага.'''

[[exercises]]
name = "svtest_q2"
kind = "question"
question.ru = '''Нужно дождаться, пока что-то случится в тесте. В каких из этих ситуаций правильнее опрашивать условие с таймаутом (`eventually`), а не ждать сигнала от самого кода?'''
options.ru = [
  '''дождаться, что чужой сервис по сети обновил своё состояние после нашего запроса''',
  '''дождаться доставки из очереди, которую мы пишем сами, и в код очереди можно добавить `Notify`''',
  '''дождаться строки в базе данных, которую вставит другой процесс''',
  '''дождаться завершения нашей собственной задачи, у которой есть `JoinHandle`''',
]
answer = [0, 2]
explain.ru = '''Сигнал возможен там, где ты контролируешь код: хук в своей очереди, `JoinHandle` своей задачи. Чужой сервис по сети и база данных не умеют сообщить тебе напрямую, поэтому остаётся опрос с разумным шагом и общим сроком. Выбор простой: если можно получить сигнал, используй его, это точнее и быстрее; если нельзя, `eventually`.'''
hint.ru = '''В каких случаях ты можешь поправить код, на который ждёшь?'''

[[exercises]]
name = "svtest6"
style = "bughunt"
requires = ["nats"]
hint.ru = [
  '''Выпиши все имена, которые тест делит с другими: stream, тема, читатель. Что у двух параллельных тестов должно отличаться?''',
  '''У `Scope` есть методы, строящие имена с уникальным префиксом (`name`, `subject`). Созданный тестом stream надо записать (`track`), чтобы он убрался, когда тест закончится.''',
]
why.ru = '''Брокер общий для всех тестов, и всё, что у него можно назвать, надо называть уникально: темы, stream'ы, читатели, ключи KV. Один забытый общий элемент даёт самый неприятный вид падений: тест зелёный в одиночку, красный в наборе и разный от запуска к запуску. Уборка за собой нужна не ради чистоты: оставшийся stream мешает следующему запуску и копит сообщения, которые чужой тест прочитает как свои.'''

[[exercises]]
name = "svtest_q3"
kind = "question"
question.ru = '''Тест подписывается обычной подпиской (core NATS, без JetStream) на тему `post.created` и проверяет, что пришло ровно одно сообщение. Параллельный тест публикует в `post.created`. Хватит ли того, что у каждого теста свой уникальный stream?'''
options.ru = [
  '''хватит: у каждого свой stream, значит, и сообщения разные''',
  '''нет: обычная подписка stream'ом не пользуется, она слышит всё, что опубликовано в общую тему; уникальный префикс нужен у самой темы''',
  '''хватит: core NATS доставляет сообщение только одному подписчику''',
  '''хватит, если запускать тесты по очереди''',
]
answer = [1]
explain.ru = '''Stream это хранилище JetStream, а обычная публикация и подписка идут мимо него: подписчик слышит любую публикацию в свою тему, чья бы она ни была. Поэтому изоляция строится на именах тем, а stream и читатели получают свои имена сверху. Запуск по очереди прячет проблему, но она вернётся, когда тесты станут параллельными, а они станут.'''
hint.ru = '''Кто доставляет сообщение обычной подписке: stream или сам брокер по совпадению темы?'''

[[exercises]]
name = "svtest7"
style = "todo"
hint.ru = [
  '''Сначала приведи обе стороны к одному виду: окончания строк и пустые строки в конце. Сравнивай построчно, чтобы знать, где именно разошлось.''',
  '''Режим обновления это отдельная ветка: записать образец (создав каталоги) и вернуть успех. Обычная проверка ничего не пишет: иначе первый прогон сам себя одобрит.''',
  '''Имя образца входит в путь, так что допускай только безопасные символы и проверяй имя до любого обращения к диску.''',
]
why.ru = '''Золотой файл превращает «формат события не менялся» в проверку, которая ломается при любой правке формата, даже случайной. Три детали делают приём пригодным к жизни. Сообщение называет строку и обе версии, иначе разбираться приходится глазами. Обновление выполняется только явным флагом, а отсутствие образца без флага это ошибка: тест, который сам себе создаёт образец, ничего не проверяет. Нормализация окончаний строк нужна, потому что файлы в репозитории живут на разных системах.'''

[[exercises]]
name = "svtest8"
style = "bughunt"
hint.ru = [
  '''Пути вроде `author.name` и `tags[]` надо разбирать по частям и идти по значению шаг за шагом. Что делать с `null`, и что с путём, который упёрся в строку там, где ждали объект?''',
  '''Это обход в глубину: на каждом шаге либо ключ объекта, либо элементы массива (`[]`), а в конце проверка типа. Нарушения складывай в общий список и не останавливайся на первом.''',
]
why.ru = '''Контракт принадлежит потребителю: он записывает, что ему нужно от события, а производитель в своих тестах прогоняет настоящие события через эти ожидания. Тогда переименование поля ломает тест производителя в тот же день, а не на проде у потребителя. Проверка должна быть настоящей (типы, вложенность, массивы), иначе она зеленеет там, где потребитель уже сломан. Лишние поля контракт допускает: добавление нового поля это совместимое изменение, а контракт говорит только о том, что потребителю нужно.'''

[[exercises]]
name = "svtest_q4"
kind = "question"
question.ru = '''Производитель добавил в событие новое необязательное поле `edited_at`. Потом другая команда по ошибке убрала из события `text`. Контракт feed-service (его ожидания) требует `id`, `author.name` и `text`. Что скажет проверка контракта в тестах производителя?'''
options.ru = [
  '''упадёт на обеих правках: поле, которого нет в контракте, тоже нарушение''',
  '''пропустит добавление `edited_at` и поймает пропажу `text`''',
  '''пропустит обе правки: контракт про имя автора, а не про остальное''',
  '''упадёт на добавлении `edited_at`, а пропажу `text` пропустит''',
]
answer = [1]
explain.ru = '''Контракт со стороны потребителя перечисляет то, на что тот опирается. Новое поле его не касается, и производитель может добавлять сколько угодно (так формат развивается без согласований). Пропажа поля, которое потребитель читает, ломает потребителя, и проверка обязана это поймать. Обратное правило (запрещать лишнее) душило бы развитие формата.'''
hint.ru = '''Что перечислено в ожиданиях потребителя, и что в них не перечислено?'''

[[exercises]]
name = "svtest9"
style = "scratch"
hint.ru = [
  '''Состояние обёртки: счётчик вызовов, номера, которые надо уронить, флаг «всё лежит», пауза. Что из этого меняется из многих задач сразу и должно быть атомарным или под замком?''',
  '''Номер вызова бери одной атомарной операцией в самом начале. Сначала пауза, потом решение об отказе: настоящая поломка тоже обнаруживается не сразу. Упавший вызов в настоящий сервис не идёт.''',
]
why.ru = '''Сервис, который никогда не ломается, не проверит ни повторы, ни таймауты, ни деградацию. Обёртка над портом ломает его по команде теста, и поэтому тест может сказать «третий вызов падает» и увидеть, что клиент справился. Три тонкости: счёт с единицы и одной атомарной операцией (иначе при параллельных вызовах номера повторятся и упадёт не тот), задержка у падающего вызова тоже (настоящая беда приходит с таймаутом), и упавшие вызовы не доходят до настоящего сервиса, иначе тест считает лишнее.'''

[[exercises]]
name = "svtest10"
style = "bughunt"
hint.ru = [
  '''Разбей работу на два шага. Первый: генератор. Чтобы баг был достижим, мир должен быть тесным (четыре пользователя, три темы), тогда повторы встречаются часто. Зерно задаёт `StdRng::seed_from_u64`.''',
  '''Когда тест против модели упадёт, он покажет минимальную последовательность. Прочитай её как сценарий: какая структура данных лежит в `Registry`, и что она делает с повторной подпиской?''',
  '''Подписчики темы это множество, а не список: повторная подписка не должна ничего менять, а отписка должна убирать пользователя целиком. Пустую тему лучше убирать.''',
]
why.ru = '''Примеры из головы описывают то, о чём ты догадался, а баги живут в том, о чём нет. Модель (простая, заведомо верная реализация) и случайные последовательности ищут расхождения сами, а `shrink` сводит найденное к самой короткой последовательности, на которую можно смотреть глазами. Генератор делают тесным: баг «подписался дважды, отписался раз» в мире на тысячу пользователей случится раз в миллион прогонов. И проверяй сам генератор: зелёный тест против модели с плохим генератором ничего не доказывает.'''

[[exercises]]
name = "svtest_q5"
kind = "question"
question.ru = '''Тест против модели прошёл 10 000 случайных последовательностей, расхождений нет. Что из этого следует?'''
options.ru = [
  '''ошибок в реестре нет: 10 000 прогонов достаточно''',
  '''только то, что генератор не нашёл расхождений; если он не производит повторные подписки, баг на них прогоны обходят''',
  '''надо прогнать миллион, тогда будет точно''',
  '''ошибок нет, потому что модель простая''',
]
answer = [1]
explain.ru = '''Количество прогонов ничего не значит, пока не ясно, какие ситуации они покрывают. Тест против модели ищет только те расхождения, которые умеет породить генератор. Поэтому в тесте проверяют и сам генератор (есть ли повторные подписки, отписки без подписки, воскрешения), а пространство делают тесным, чтобы редкое стало частым.'''
hint.ru = '''Что именно перебирает генератор, и встречается ли среди этого интересное?'''

[[exercises]]
name = "svtest_e2e"
kind = "project"
quiz = true
style = "scratch"
requires = ["nats"]
locked = ["src/crates/testkit/tests/units.rs", "tests/e2e/tests/scenario.rs"]
hint.ru = [
  '''Начни с `testkit`: `unique_prefix` и `eventually` короткие, а все сценарии на них опираются. Потом `Service::stop`, потом `gateway::start`, в конце `Stack::start` и `Stack::stop`.''',
  '''`gateway::start` это то же, что `TestServer` из главы: порт 0 занимается до возврата, задача приёма ждёт сигнал остановки и новые соединения, обработчики лежат в `JoinSet`, после остановки сначала закрывается слушатель, потом ждут обработчиков. Сервисы готовы к возврату `start`: они сами делают круг до брокера.''',
  '''`Stack::start` поднимает сервисы по очереди (auth первым, шлюз последним), а `stop` идёт в обратном порядке: сначала закрывается вход, потом то, на что он опирается. Не забывай, что шлюз возвращает ещё и адрес.''',
]
why.ru = '''Тест на весь стек держится на тех же приёмах, что и маленькие тесты главы, только их много сразу. Порт 0 и готовность к возврату из `start` убирают гонки старта. Уникальный префикс даёт параллельным тестам разные темы, поэтому два стека не слышат друг друга. `eventually` ждёт асинхронный эффект (счётчик непрочитанных) без `sleep`. А `stop`, который дожидается всех задач, закрывает порт и снимает подписки, гарантирует, что один тест не оставит мусора следующему. Если стек поднимается за секунды и не флапает, его запускают на каждый коммит.'''

