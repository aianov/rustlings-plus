[chapter]
title.en = "API errors"
title.ru = "Ошибки API"

[[chapter.visuals]]
file = "visuals/error_mapping.html"
title.ru = "Путь ошибки: репозиторий, сервис, контроллер, HTTP и gRPC, лог и клиент"

[[exercises]]
name = "sverr1"
style = "todo"
hint.ru = """Спроси про каждый случай: кто должен что-то исправить, клиент или мы? И поможет ли повтор без изменений? 401 это «кто ты», 403 это «тебе нельзя», 404 «этого нет». Открой таблицу в README и пройди по строкам: она почти один в один и есть решение. Числа gRPC-кодов проверяются приведением `as i32`."""
why.ru = """Таблица живёт в одном месте, и все остальные слои берут статус отсюда, а не придумывают сами. Граница 4xx и 5xx нужна не для красоты: по ней мониторинг решает, будить ли дежурного. Если ошибки клиентов считать нашими, алерты шумят всю неделю, а если наши считать клиентскими, настоящая поломка прячется среди 404. Повторять имеет смысл только то, что может пройти позже без правок: перегрузку, недоступную зависимость, таймаут."""

[[exercises]]
name = "sverr_q1"
kind = "question"
question.ru = """Сервис платежей идёт в Postgres, но пул соединений исчерпан: из-за всплеска нагрузки у всех клиентов разом новые запросы ждут две секунды и получают `PoolTimedOut`. Что отдать клиенту, чьего запроса это коснулось?"""
options.ru = [
  "500: это сбой на нашей стороне, подробности пишем в лог и повторять не предлагаем",
  "503 с `Retry-After`: сервис временно не справляется, тот же запрос позже может пройти",
  "429: клиент слишком часто шлёт запросы, пусть сбавит темп и подождёт немного",
  "400: клиент прислал запрос неправильно и должен сначала исправить его"
]
answer = [1]
explain.ru = """Вина не клиентская, так что 4xx мимо: 429 говорит про лимит этого клиента, а тут перегружены все. 500 верен по вине, но не говорит, что беда временная: клиент не знает, стоит ли повторять запрос, и мониторинг не отличит перегрузку от бага. 503 с паузой прямо говорит «подожди и повтори», и клиенты с умной логикой повторов разгружают сервис сами."""
hint.ru = """Спроси себя, повторение того же запроса через секунду может сработать или нет?"""

[[exercises]]
name = "sverr2"
style = "scratch"
hint.ru = [
  """Обёртка `error` это отдельная структура с одним полем. Пустой список в JSON не нужен: у serde есть атрибуты поля `skip_serializing_if` (не писать, если условие верно) и `default` (подставить умолчание, если поля нет).""",
  """Если поле `code` в конверте сделать самим enum `Code`, разбор ответа от более нового сервера упадёт на незнакомой строке. Что тогда хранить в конверте, а где превращать строку в `Code`?""",
]
why.ru = """Конверт хранит код строкой, а enum `Code` только знает известные: тогда новый сервер с новым кодом не ломает старого клиента, а строка остаётся в логах. Имена кодов это публичный контракт, как и поля JSON: переименовать значит сломать чужой код, поэтому тест фиксирует их литералами. Пустые `details` не пишут в JSON, чтобы формат не разрастался шумом."""

[[exercises]]
name = "sverr3"
style = "todo"
hint.ru = """`Display` отвечает на вопрос «что сказать человеку», а `source()` на вопрос «что на самом деле сломалось». Для варианта с причиной нужно переопределить `source`, по умолчанию он возвращает `None`. Из `Box<dyn Error + Send + Sync>` ссылку на `dyn Error` даёт `as_ref()`."""
why.ru = """Свой enum вместо строк даёт две вещи: верхний слой выбирает поведение через `match`, а не через разбор текста, и причина не теряется (`source()` строит цепочку для логов). `Display` у внутренней ошибки намеренно короткий: если он содержал бы текст причины, любое место, которое печатает ошибку, раздавало бы подробности. Ограничение `Send + Sync` нужно, чтобы ошибка свободно пересекала границы задач и потоков."""

[[exercises]]
name = "sverr4"
style = "todo"
hint.ru = [
  """Сейчас всё превращается во «внутреннюю». У `RepoError::UniqueViolation` есть имя ограничения: именно по нему видно, какое правило нарушено. А `match` по строке в Rust пишется через `as_str()`.""",
  """Для ошибок, которые остаются внутренними, не делай `to_string()`: положи в `Box` сам `RepoError`, тогда `source()` и `downcast_ref` увидят исходный тип. Ограничение, которое ты не узнал, не должно превращаться ни в «имя занято», ни в «почта занята».""",
]
why.ru = """`From` перевод с языка хранилища на язык предметной области: сервис остаётся простым (`repo.insert(..)?`), а правила перевода живут в одном месте. Ограничение по имени надёжнее текста сообщения базы, а незнакомое ограничение честно считается нашей ошибкой: если молча назвать его «имя занято», клиент будет менять имя, которое не виновато. Причина кладётся в `Internal` как есть, чтобы разбирать её могли и логи, и тесты."""

[[exercises]]
name = "sverr5"
style = "bughunt"
hint.ru = [
  """Пройди по трём путям ошибки: репозиторий отвечает таймаутом на чтении, репозиторий отвечает дублем на записи, контроллер получает не `NotFound`. Тесты перечисляют, какой статус нужен в каждом случае, и сразу видно, где ответ не тот.""",
  """Два дефекта в сервисе: `.ok()` на результате чтения стирает причину, а `is_err()` на записи считает любую ошибку дублем. Третий в `to_response`: подстановочная ветка `_` съедает всё, что не `NotFound`.""",
  """Заведи одну функцию перевода `RepoError` в `ServiceError` (она знает `id`) и используй её в обоих местах через `?` или `map_err`. В `to_response` разверни `_` в явные варианты, тогда компилятор подскажет, когда появится новая ошибка.""",
]
why.ru = """Ошибка, которую превратили в «ничего» (`ok()`), хуже ошибки с неверным статусом: она пропадает совсем, а клиент действует по ложной информации. Ветка `_ =>` в маппинге похожа на аккуратность, но она отключает проверку полноты: новая ошибка молча становится 500. Явные ветки заставляют компилятор требовать решения для каждого нового варианта."""

[[exercises]]
name = "sverr_q2"
kind = "question"
question.ru = """Ревью кода: что здесь опасно?
```rust
fn to_response(err: &ServiceError) -> (u16, String) {
    match err {
        ServiceError::NotFound(id) => (404, format!("пост {id} не найден")),
        ServiceError::Validation(fields) => (422, format!("{fields:?}")),
        other => (500, other.to_string()),
    }
}
```
В `ServiceError` есть и вариант `Storage(sqlx::Error)`, текст которого содержит адрес и имя базы."""
options.ru = [
  "ничего страшного: 500 с текстом ошибки как раз помогает клиенту разобраться в сбое",
  "ветка `other` отдаёт клиенту текст любой ошибки без названия, и новый вариант enum заметят не раньше утечки адреса базы",
  "422 для ошибки валидации неверно: правильный статус для неё только 400 без вариантов",
  "`format!(\"{fields:?}\")` безопаснее, чем `to_string()`, потому что Debug обычно показывает меньше"
]
answer = [1]
explain.ru = """Ветка `other` ломает сразу два правила. Текст внутренней ошибки идёт клиенту, а не в лог. И `_`-образная ветка отключает проверку полноты: новый вариант ошибки молча получит 500 с собственным текстом, и никто не решит, как его показывать. Debug-вид `fields` тоже плох, но по другой причине: формат ответа привязан к внутренним типам, а Debug обычно показывает больше, а не меньше."""
hint.ru = """Представь, что в enum завтра добавили вариант, а функцию не трогали. Что получит клиент?"""

[[exercises]]
name = "sverr6"
style = "fix"
hint.ru = [
  """Различи два вопроса: «я не знаю, кто ты» и «я знаю, кто ты, но тебе нельзя». У них разные статусы и разное поведение клиента. Для 429 и 401 в HTTP есть свои заголовки, ищи их по смыслу: «когда повторить» и «как войти».""",
  """Тело собирай через `serde_json::json!` и `to_string()`: так экранирование кавычек в сообщении не ломает JSON. Код ошибки бери из каталога, а не из имени варианта.""",
]
why.ru = """401 и 403 различаются поведением клиента: на 401 имеет смысл обновить токен, на 403 нет, и перепутанная пара превращается в бесконечный цикл входа. `Retry-After` превращает 429 из тупика в расписание: клиенты не долбят сервер вслепую. Тело строится из данных, а не из `{:?}`: Debug-вид это внутреннее устройство, и меняя имя варианта, ты бы ломал клиентов."""

[[exercises]]
name = "sverr7"
style = "scratch"
hint.ru = [
  """У `std::error::Error` есть метод `source()`, он возвращает причину, у причины тоже можно спросить `source()`. Это цикл, пока не вернётся `None`.""",
  """Две ветки: для клиентской ошибки лог на уровне `Info` и тело из её же полей; для внутренней лог на уровне `Error` с цепочкой, а тело собирается из констант и `request_id`, ничего из `cause` в него не попадает.""",
]
why.ru = """Два адресата получают разное по смыслу: лог нужен инженеру, и в нём должно быть всё, включая цепочку причин и номер запроса. Клиенту нужен только номер: он связывает жалобу с записью в логе, не раскрывая устройства системы. Уровень лога тоже решение: 4xx это штатная работа, и если писать их на уровне ошибок, то настоящие сбои тонут в шуме."""

[[exercises]]
name = "sverr8"
style = "bughunt"
hint.ru = [
  """Утечек несколько, и не все в теле ответа. Выпиши, откуда берутся строки, попадающие к клиенту: сообщение, заголовки, `details`. Тест просматривает ответ целиком, и «починить сообщение» недостаточно.""",
  """Для внутренних ошибок текст сообщения должен быть константой, а не `Display` ошибки. Для проверки полей клиенту нужны имя поля и код, а само значение возвращать не нужно. Лишний заголовок лучше убрать совсем.""",
]
why.ru = """Правило простое: клиент получает только то, что собрано из безопасных кусочков (код, имя поля, константа), а не отформатировано из внутренней ошибки. Утечки обычно прячутся не в теле, а в заголовках «для отладки», в `details` и в эхе введённого значения (пароль, оказавшийся в тексте ошибки, потом попадает ещё и в логи прокси). Одинаковый ответ на любые внутренние сбои тоже защита: по различиям атакующий понял бы, что у нас сломалось."""

[[exercises]]
name = "sverr9"
style = "fix"
hint.ru = [
  """В `futures::FutureExt` есть `catch_unwind`: он превращает панику внутри future в `Err`. Но проверь, где именно паникует обработчик: он может упасть и до того, как вернёт future, тогда `catch_unwind` на future ничего не увидит.""",
  """Нужны два уровня: `std::panic::catch_unwind` вокруг самого вызова обработчика и `AssertUnwindSafe(future).catch_unwind().await` вокруг ожидания. Оба берут `AssertUnwindSafe`, иначе компилятор не пропустит замыкания с общими ссылками. Содержимое паники это `Box<dyn Any + Send>`: текст достаётся через `downcast_ref` на `&str` и на `String`.""",
  """Лог тоже под мьютексом, и паника в другом потоке могла его отравить. Не бери `lock().unwrap()` на пути обработки паники: `unwrap_or_else(|p| p.into_inner())` берёт данные даже из отравленного мьютекса.""",
]
why.ru = """Паника в обработчике это ошибка программиста, но клиенту нужен ответ, а соседним запросам нужна жизнь. Ловят её на границе сервера, один раз, и превращают в обычную внутреннюю ошибку: статус 500, номер запроса, подробности в лог. Ловить надо и вызов обработчика, и ожидание его future: паниковать он может в обоих местах. `AssertUnwindSafe` здесь осознанное обещание, что после паники мы не будем читать наполовину изменённое состояние обработчика."""

[[exercises]]
name = "sverr_q4"
kind = "question"
question.ru = """Сервер ловит панику обработчика через `catch_unwind` и отвечает 500. Что получит клиент вторым запросом?
```rust
static HITS: std::sync::Mutex<u32> = std::sync::Mutex::new(0);

fn handle(path: &str) -> String {
    let mut hits = HITS.lock().unwrap();
    *hits += 1;
    if path == "/boom" {
        panic!("boom");
    }
    format!("запросов: {hits}")
}
```
Сначала приходит `/boom`, потом `/ok`."""
options.ru = [
  "200 «запросов: 2»",
  "200 «запросов: 1»: счётчик откатился",
  "500: мьютекс отравлен паникой, `lock().unwrap()` паникует снова, и так на каждый следующий запрос",
  "запрос зависнет навсегда: мьютекс остался захвачен",
]
answer = [2]
explain.ru = """Защитник мьютекса освобождается при раскрутке стека, но мьютекс при этом помечается отравленным: `lock()` возвращает `Err`, а `unwrap()` паникует. Сервер продолжает жить и отвечать 500 на всё, что трогает этот мьютекс. Лечится это тем, что не держат блокировку в коде, который может паниковать, берут данные из отравленного мьютекса через `unwrap_or_else(|p| p.into_inner())` или используют блокировку, которая отравление не знает (`tokio::sync::Mutex`, `parking_lot`)."""
hint.ru = """Что делает std::sync::Mutex с блокировкой, если поток, державший её, запаниковал?"""

[[exercises]]
name = "sverr10"
style = "scratch"
hint.ru = [
  """У `serde_json::Error` есть метод `classify()`: он говорит, что случилось, с синтаксисом (не JSON), с концом ввода (обрыв) или с данными (JSON есть, но тип или набор полей не тот). Этого хватает, чтобы выбрать 400 или 422.""",
  """Текст самой ошибки serde (`to_string()`) для клиента не годится: в нём бывают присланные значения. Бери собственные константные сообщения. Нарушения значений уже собирает `validate`: если список пуст, всё хорошо, иначе 422 с этим списком целиком.""",
]
why.ru = """400 и 422 говорят клиенту разное: «твой запрос нельзя прочитать» и «я прочитал, но так нельзя». Первое чинится обновлением приложения, второе подсказкой пользователю. Ошибки `serde` удобны разработчику, но цитируют входные данные, поэтому клиенту уходит собственный текст. Все нарушения за один ответ экономят пользователю круги «исправил, получил следующую ошибку»."""

[[exercises]]
name = "sverr11"
style = "scratch"
hint.ru = [
  """Для каждого кода от соседа спроси: что это значит для нашего клиента? «Автора нет» относится к полю его запроса. «Недоступен» и «не успел» временные. А «нет прав» и «не вошёл» при вызове сервис-к-сервису значат, что сломалась наша настройка, и клиент тут бессилен.""",
  """Три функции независимы. `from_user_service` собирает наш `PostError`, а текст соседа кладёт только в `Internal`, для логов. `to_status` наружу даёт собственные фразы. `gateway_http` берёт статус из gRPC-кода, а код ошибки из `app_code`, но только если пара (код, gRPC-код) есть в `PUBLIC_CODES`.""",
]
why.ru = """Ошибка соседа описывает вызов между сервисами, а не запрос клиента. «Не найдено» от user-service значит «автора нет», а не «нет ресурса, который просил клиент», и по смыслу это ошибка в запросе. «Нет прав» при служебном вызове значит неверный токен самого сервиса: отдать это клиенту как 403 значит сказать ему неправду и спрятать настоящую поломку. Каждый сервис переводит ошибки соседа на свой язык, а тексты соседа остаются в логах."""

[[exercises]]
name = "sverr_q3"
kind = "question"
question.ru = """Шлюз вызывает post-service от имени пользователя Alice, у которой права на публикацию проверены и в порядке. Post-service вызывает user-service и получает `PermissionDenied`, потому что у post-service устарел служебный токен. Что шлюз должен ответить клиенту?"""
options.ru = [
  "403: нам сказали «нет прав», значит, нет",
  "401: пусть войдёт заново, это поможет",
  "500: сломана наша внутренняя настройка, клиент ни в чём не виноват",
  "404: так надёжнее скрыть, что у нас что-то не так",
]
answer = [2]
explain.ru = """Права пользователя проверены и в порядке: отказ касается отношений между сервисами, а не пользователя. 403 соврал бы клиенту, что он делает что-то не так, и скрыл бы настоящую поломку; 401 отправил бы его обновлять токен, а это не поможет; 404 тоже ложь. Честный ответ 500 с общим текстом и номером запроса, а в логе шлюза остаётся, что именно ответил сосед, чтобы дежурный нашёл протухший токен."""
hint.ru = """Чей токен отвергнут: пользователя или самого сервиса?"""

[[exercises]]
name = "sverr12"
style = "bughunt"
hint.ru = [
  """В ответе клиенту сразу три чужих куска: сообщение, код и номер запроса. Для каждого спроси: можно ли это показать наружу и откуда должно браться правильное значение?""",
  """Код соседа принимается, только если он есть в списке публичных И его gRPC-код тот, что в списке рядом с ним; иначе используется код по умолчанию для типа gRPC-ошибки. `PermissionDenied` и `Unauthenticated` от соседа клиенту не отдаются как 403 и 401. Сообщение берётся из `public_message(code)`. Всё, что сосед написал сам, и его номер запроса идут в одну запись лога вместе с нашим номером.""",
  """Заголовок `retry-after` нужен только там, где повтор имеет смысл: 429 и 503. Остальные статусы заголовка не получают, даже если сосед его прислал.""",
]
why.ru = """Шлюз единственный, кто разговаривает с клиентом, поэтому он отвечает за каждое слово в ответе. Коды соседа проверяются по каталогу: новый внутренний код не должен утекать, а клиенты не должны получать коды, которых нет в документации. Свой `request_id` в ответе, а чужой в логе: тогда обращение в поддержку приводит к одной записи шлюза, из которой видна и запись соседа."""

[[exercises]]
name = "sverr_grpc"
kind = "project"
style = "todo"
locked = ["src/microservices/post-service/tests/acceptance.rs"]
hint.ru = [
  """Прикладной код ошибки едет не в `message`, а в метаданных ответа: `status.metadata_mut().insert(ключ, значение)`. Значение собирается из `&str` через `MetadataValue::try_from`: пользовательский номер запроса может быть любым, и паниковать на нём нельзя.""",
  """Решение «повторять или нет» на клиенте принимается по gRPC-коду, а не по строке кода: статус, придуманный прокси, метаданных не несёт. `x-error-details` разбирай построчно: `split(',')`, потом `split_once(':')`.""",
]
why.ru = """Машинный код в метаданных делает ошибку проверяемой: клиент выбирает поведение по коду, а не по тексту, который можно переводить и править. Клиентская сторона не доверяет присланному: прокси и балансировщики отвечают статусами без наших метаданных, поэтому есть запасной путь по gRPC-коду. Внутренняя ошибка уходит с общим текстом: её подробности остаются в логе сервера, а клиенту хватает номера запроса."""

