syntax = "proto3";

package post.v1;

message GetPostRequest {
  uint64 id = 1;
}

message CreatePostRequest {
  uint64 author_id = 1;
  string text = 2;
}

message Post {
  uint64 id = 1;
  uint64 author_id = 2;
  string text = 3;
}

service Posts {
  rpc GetPost(GetPostRequest) returns (Post);
  rpc CreatePost(CreatePostRequest) returns (Post);
}
