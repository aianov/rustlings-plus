test_command = ["cargo", "make", "check"]
requires = []
hint.ru = [
"""Начни с `src/crates/validation/Cargo.toml` и строки в `[workspace.dependencies]`: тесты крейта уже лежат в его папке.
Шаблон и валидатор почти целиком из svdto_validator; новое только `finish_with` и правила `NoControl`, `Unique`, `HttpUrl`.
Потом contracts: каталог `ErrorCode`, конверт с `details` и `request_id` (оба `skip_serializing_if`, иначе сломаешь старых
клиентов), `parse_body` на `classify()`.""",
"""Поля ошибки по gRPC не влезут в обычные метаданные: там только ASCII, а сообщения русские. Ключ с суффиксом `-bin`
принимает байты (`MetadataValue::from_bytes` и `insert_bin`), а формат строк внутри придумай сам: например
`поле\tкод\tсообщение` по строке на ошибку.""",
"""DTO это функции в `dto/`: сырое из proto или JSON на входе, доменный тип или `Invalid` на выходе. Service после
этого получает `Username`, `Draft`, `MessageText` и ничего не проверяет повторно, поэтому сигнатуры `register`, `create`
и `send` меняются, а с ними тесты m33. PATCH применяй под замком репозитория (`update(id, change)`), иначе два
одновременных PATCH (имя и «о себе») затрут друг друга.""",
"""В шлюзе один слой сразу за CORS решает две задачи: ставит свежий `x-request-id` в запрос и ответ и переписывает
любое тело ошибки в конверт. Тело `{"error": "текст"}` от роутера или проверки токена разбери как карту строк, код
возьми из `ErrorCode::for_status`, а у серверных кодов текст замени публичным.""",
]
story.ru = """У соцсети появился контракт: вход проверяется на границе каждого сервиса, ошибки называют все поля сразу,
а наружу уходит один конверт со стабильным кодом и номером запроса, по которому поддержка найдёт запись в логе."""
