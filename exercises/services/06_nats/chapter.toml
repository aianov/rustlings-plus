[[exercises]]
name = "svnats1"
style = "scratch"
hint.ru = [
  '''Сначала найди первый `\r\n`. Пока его нет, ответ `Ok(None)`, но не вечно: если уже накопилось больше `MAX_LINE` байт и конца строки нет, это `Err`. Строку управления разбирай по словам, первое слово это глагол.''',
  '''У `MSG` последнее число это длина тела, у `HMSG` последнее число это длина всего (заголовки плюс тело), а число перед ним это длина заголовков. Тело лежит сразу за `\r\n` строки управления, а после него идёт ещё `\r\n`. Целиком операция занимает `голова + длина + 2` байта: если в буфере их меньше, отвечай `Ok(None)`.''',
  '''Числа из сети нельзя принимать на веру: слишком большая длина (`MAX_BODY`) отвергается сразу, не дожидаясь байтов, а сложение `голова + длина + 2` не должно переполняться. Если после тела стоит не `\r\n`, это `Err`. Не забудь про необязательный `reply-to`: слов в строке то три, то четыре.''',
]
why.ru = '''Разбор потока это всегда три ответа: «целое, вот сколько заняло», «пока мало» и «это не тот протокол». Если смешать второе с ошибкой, соединение будет рваться на каждом TCP-сегменте, который резанул сообщение посередине. Если ждать конца строки без предела, злой клиент пришлёт гигабайт без перевода строки и съест память. Длина тела читается из строки управления и проверяется до того, как под неё выделят память или будут ждать байты. Тело берётся по длине, а не до `\r\n`: это единственное, что делает протокол пригодным для бинарных данных.'''

[[exercises]]
name = "svnats2"
style = "todo"
requires = ["nats"]
hint.ru = [
  '''Нужны три шага рукопожатия: прочитать `INFO`, отправить `CONNECT {...}` и убедиться, что сервер его принял. Принятие видно по ответу на `PING`, который ты отправишь следом: пока `PONG` не пришёл, сервер мог ещё отвергнуть `CONNECT` ошибкой.''',
  '''Общее место, где читаются операции, одно: цикл «разобрать буфер, при нехватке байтов дочитать из сокета». Сверху над ним `PING` от сервера отвечается `PONG`, `-ERR` становится ошибкой, а сообщения откладываются в очередь `pending`: они могут прийти между твоим `SUB` и `PONG`, и терять их нельзя.''',
  '''`subscribe` отправляет `SUB тема sid`, затем `PING` и читает операции, пока не придёт `PONG`; всё, что пришло по дороге, уходит в `pending`. `publish` пишет одну команду целиком: заголовок с длиной тела, тело, `\r\n`. `next_message` сначала берёт из `pending`, потом читает дальше.''',
]
why.ru = '''Клиент NATS это три десятка строк, и стоит один раз написать его руками, чтобы дальше не бояться того, что делает async-nats. Главная мысль: подтверждения подписки в протоколе нет, поэтому «подписка зарегистрирована» узнаётся только круговым рейсом `PING`/`PONG` (сервер обрабатывает команды в порядке получения). Сообщения, которые пришли раньше `PONG`, принадлежат подписке и не выбрасываются. Ответ на `PING` сервера это не вежливость: не ответивший клиент отключается.'''

[[exercises]]
name = "svnats_q1"
kind = "question"
question.ru = '''Клиент отправляет брокеру такие байты:

```
PUB orders.new 5\r\nhi\r\nxyz\r\n
```

(он думал, что тело это «hi», а дальше пойдёт следующая команда). Что произойдёт?'''
options.ru = [
  '''сообщение «hi» будет опубликовано, а `xyz` брокер молча отбросит как мусор после тела''',
  '''тело окажется из пяти байт «hi\r\nx», а на «yz» брокер ответит `-ERR` и закроет соединение''',
  '''брокер вернёт `-ERR`, пропустит всё до ближайшего `\r\n` и оставит соединение открытым''',
  '''будет опубликовано два сообщения, «hi» и «xyz», потому что `\r\n` их разделяет''',
]
answer = [1]
explain.ru = '''Брокер доверяет заявленной длине. После `PUB ... 5` он берёт ровно пять байт тела, то есть `hi\r\nx`, ждёт `\r\n` и находит `yz`. Протокол сломан, и сервер закрывает соединение (я проверил это на брокере курса). Длина в строке управления это договор: ошибиться в ней значит разорвать поток, а не обрезать сообщение. Поэтому клиент считает длину по байтам тела, а не по символам, и никогда не собирает команду конкатенацией строк из чужого ввода.'''
hint.ru = '''Брокер читает по длине или до перевода строки?'''

[[exercises]]
name = "svnats3"
style = "bughunt"
hint.ru = [
  '''Что читает `read_line` на второй строке? Всё до первого `\n`. А где на самом деле заканчивается тело, если в нём есть переводы строк? Ответ уже лежит в длине, которую ты разобрал выше.''',
  '''Тело нужно читать ровно `len` байт (`read_exact` в буфер нужного размера), а после него ещё два байта: они обязаны быть `\r\n`, иначе длина не сошлась с данными и это `InvalidData`. Оборванный поток даст `UnexpectedEof` сам собой.''',
]
why.ru = '''Построчное чтение выглядит естественно и ломается на первом сообщении с абзацем или картинкой. Хуже всего, что оно ломается тихо: первое сообщение возвращается обрезанным, а остаток тела разбирается как следующая команда, и дальше поток разъезжается. Тело читается по длине. Проверка двух байт после тела дёшева и превращает «молчаливую порчу» в понятную ошибку на ближайшем сообщении.'''

[[exercises]]
name = "svnats4"
style = "todo"
hint.ru = [
  '''Шаблон и тему удобно разрезать по точкам и идти по двум спискам слов одновременно. Сначала проверь формы: пустые слова, пробелы и управляющие символы не годятся ни там, ни там; звёздочка и скобка в теме для публикации тоже недопустимы.''',
  '''Шаги такие: слово шаблона `>` совпадает со всем остатком, но только если в теме ещё есть хотя бы одно слово; `*` берёт ровно одно слово; обычное слово должно совпасть точно; обе стороны должны кончиться одновременно. `>` допустим в шаблоне только последним словом.''',
]
why.ru = '''Сопоставление тем короткая функция, но в ней четыре граничных случая, которые почти всегда пишут неверно: `>` без хвоста, `*` на ноль слов, пустое слово между точками, `>` не в конце. Свой matcher нужен не для замены брокера, а чтобы тестировать маршрутизацию без сети и проверять в шлюзе шаблоны, которые пришли от клиента. Негодные шаблоны не совпадают ни с чем: так функция не открывает лишнего даже при ошибке вызывающего.'''

[[exercises]]
name = "svnats5"
style = "scratch"
hint.ru = [
  '''Начни с `token`: пустое, слишком длинное и недопустимый символ это три разных ошибки. Ошибку про символ возвращай с первым плохим символом. Каждый конструктор темы проверяет ник через `token`, прежде чем склеить строку.''',
  '''Шаблоны это строки без ввода (`feed_pattern`, `audit_pattern`) и строка с ником (`inbox_pattern`). Для «всё про alice» нужны звёздочки на сущность и событие и ник в конце: `social.*.*.alice`. Подумай, почему ник в конце темы, а не в середине.''',
]
why.ru = '''Схема тем это контракт: если названия размазаны по коду форматированием строк, поменять их нельзя, а ошибка в одном месте видна только по поведению. Конструкторы с проверкой слова делают неправильную тему невозможной, а не маловероятной. Ник стоит в конце темы по причине: фильтр «всё про одного пользователя» выражается одним шаблоном `social.*.*.alice`, и он не цепляет `alicex`, потому что слова сравниваются целиком.'''

[[exercises]]
name = "svnats_q2"
kind = "question"
question.ru = '''События соцсети идут на темы вида `social.<сущность>.<событие>.<ник>`. Какой шаблон получит `social.post.liked.alice`, но НЕ получит ни `social.post.liked`, ни `social.post.liked.alice.extra`?'''
options.ru = [
  '''`social.post.liked.>`''',
  '''`social.>`''',
  '''`social.*.*.*`''',
  '''`social.post.*`''',
]
answer = [2]
explain.ru = '''Нужен шаблон ровно из четырёх слов. `social.post.liked.>` берёт любой хвост, в том числе `.alice.extra`. `social.>` берёт всё подряд. `social.post.*` состоит из трёх слов и поэтому цепляет `social.post.liked` (а `social.post.liked.alice` не цепляет). Только `social.*.*.*` требует ровно четыре слова. Если «хвост» тебе нужен, `>` годится; если нужна фиксированная форма, считай слова.'''
hint.ru = '''Сколько слов в каждой теме и что сколько слов берёт каждый шаблон?'''

[[exercises]]
name = "svnats6"
style = "fix"
hint.ru = [
  '''Три вещи приходят от клиента: что смотреть, чьё смотреть и (из токена, это надёжно) кто смотрит. Что произойдёт, если `kind` будет `*.*`, а `target` будет `>`? Что произойдёт при `post.liked` и чужом нике?''',
  '''Вид события сверяй с закрытым списком (одно публичное и три личных), а не подставляй. Ник проверяй узким правилом: 1..=32 символа `A-Za-z0-9_-`. Права проверяй после этого: личное только про себя.''',
]
why.ru = '''Это инъекция, в точности как в SQL: данные становятся частью управляющей строки. Запретительный список («выбросим `*` и `>`») всегда дырявый: останутся `bob.>`, пробелы, переводы строки, юникод. Разрешительный (узкий алфавит, закрытый список видов) дырок не оставляет по построению. Права проверяются отдельно и после: правильная форма темы ещё не значит, что её владельцу можно смотреть чужие лайки.'''

[[exercises]]
name = "svnats7"
style = "todo"
requires = ["nats"]
hint.ru = [
  '''`serde_json::to_vec` даёт байты, `client.publish(тема, байты.into())` отправляет. Ошибки обоих шагов превращай в строку.''',
  '''Подписчик это Stream, у него есть `next()` из `futures::StreamExt`. Срок ожидания один на весь вызов: заведи момент окончания (`Instant::now() + wait`) и ограничивай каждый `next()` через `timeout_at`. Сообщение, которое не разобралось, пропускай и читай следующее.''',
]
why.ru = '''Подписка это Stream, и все привычные приёмы работают: `next`, `timeout`, `select!`. Срок ожидания считается на весь вызов, а не на сообщение: иначе поток мусора каждые 25 мс удерживал бы вызов вечно, хотя «подходящего» события так и нет. Битое сообщение это событие внешнего мира, а не причина падения: подписчик, который умирает от одного плохого пакета, сносится первым же отладочным скриптом.'''

[[exercises]]
name = "svnats8"
style = "bughunt"
requires = ["nats"]
hint.ru = [
  '''Две разные жалобы, две разные причины. В первой слушатель подписывается уже после того, как функция вернулась. Во второй процесс завершается раньше, чем клиент успел записать буфер в сокет.''',
  '''Подключение и подписку нужно делать в самой функции (до `spawn`), и вернуться только когда брокер точно знает про подписку. `flush` для этого мало: он не ждёт сервера. Нужен круговой рейс: подпишись на `client.new_inbox()`, опубликуй туда пустое сообщение и дождись его. Для публикующей утилиты хватает `flush`.''',
]
why.ru = '''`subscribe` и `publish` возвращаются, когда команда поставлена в очередь клиента, а не когда брокер её обработал. Поэтому появилось два разных лекарства. Для «процесс выходит» нужен `flush`: он дописывает буфер в сокет. Для «подписался и сразу вернул управление» нужен круговой рейс до сервера, потому что команды одного соединения обрабатываются строго по порядку, и ответ на последнюю доказывает обработку первой. `sleep` вместо этого лечит только быстрое соединение: тест нарочно замедляет связь.'''

[[exercises]]
name = "svnats_q3"
kind = "question"
question.ru = '''Сервис A подписывается на `orders.created`. `subscribe().await` вернул `Ok`, сервис пишет в лог «готов». Сервис B по этому сигналу публикует событие через собственное соединение, но A его не получает, хотя брокер и сеть в порядке. Что объясняет это лучше всего?'''
options.ru = [
  '''брокер хранит сообщения для подписчика только секунду, и событие просто не дожило до него''',
  '''событие дошло до брокера раньше, чем `SUB` соединения A, ведь `subscribe` вернулся после очереди клиента''',
  '''на стороне A забыли `flush`: после него брокер уже точно знает про подписку и ждёт событие''',
  '''и подписчику, и издателю нужно одно общее соединение, иначе доставка не гарантируется никак''',
]
answer = [1]
explain.ru = '''`subscribe` возвращается, как только команда ушла в очередь клиента. У разных соединений нет общего порядка, поэтому публикация B может прийти на брокер раньше, чем `SUB` соединения A. Core NATS не хранит сообщения для тех, кого пока нет. `flush` тут не спасает: он лишь дописывает буфер в сокет, а не ждёт обработки брокером. Нужен круговой рейс через собственный inbox. Одно соединение на двоих тоже не вариант: сервисы живут в разных процессах.'''
hint.ru = '''Что именно значит «вернулся Ok» для подписки? Кто, кроме тебя, участвует в порядке команд?'''

[[exercises]]
name = "svnats9"
style = "scratch"
requires = ["nats"]
hint.ru = [
  '''Ответчик это цикл по подписке на шаблон `<корень>.unread.*`. Ник берётся из последнего слова темы запроса, адрес ответа лежит в `request.reply` (его может не быть). Счётчики читай в момент запроса, а не копируй заранее.''',
  '''Подпишись, затем убедись, что брокер знает про подписку, и только потом возвращай управление: запросы от шлюза начнутся сразу. `ask_unread` собирает тему из проверенного ника (негодный отвергай, не отправляя запрос) и делает `client.request`. Ответ разбирай как число.''',
]
why.ru = '''Запрос-ответ в NATS это обычная публикация с адресом ответа, и вся магия умещается в двух строках: ответчик читает `reply`, спрашивающий слушает временный адрес. Ответчик должен пережить публикацию без `reply` и мусор: служебный цикл, который падает от чужого сообщения, роняет сервис целиком. Ник проверяется до отправки: иначе `*` в нём превратился бы в вопрос всем сразу.'''

[[exercises]]
name = "svnats10"
style = "fix"
requires = ["nats"]
hint.ru = [
  '''Что делает `client.request`, если срок не задан? Берёт срок из настроек клиента, а там десять секунд. И как можно отличить «слушателей нет» от «слушатель молчит», если оба случая завернуты в одну и ту же ошибку?''',
  '''Свой срок ставится на вызове: внешним `tokio::time::timeout` или через `Request::new().timeout(...)` и `send_request`. Ошибку запроса разбирай через `error.kind()`: у `RequestErrorKind` есть `NoResponders` и `TimedOut`.''',
]
why.ru = '''Три исхода запроса требуют трёх реакций: «ответ» отдаём пользователю, «нет слушателей» означает мёртвый сервис, звать дежурного и не заставлять пользователя ждать (брокер сообщает об этом сразу), «таймаут» означает перегруженный сервис, можно повторить позже. Один общий таймаут клиента на десять секунд превращает все три в «страница висит». Срок ставится на вызове, потому что он зависит от того, кто спрашивает: профиль ждёт 300 мс, фоновая сверка может ждать минуту.'''

[[exercises]]
name = "svnats11"
style = "todo"
requires = ["nats"]
hint.ru = [
  '''Нужна подписка с группой: `client.queue_subscribe(тема, группа)`. Аудит подписывается обычным `subscribe`. Помни, что функция возвращает управление, когда брокер уже в курсе подписки.''',
  '''`stop` не должен терять уже полученное. Порядок такой: сказать брокеру `unsubscribe` (новые события пойдут другим участникам), дообработать то, что лежит в буфере подписки, выйти. Сигнал остановки удобно передать в задачу через `oneshot` и ловить в `select!`.''',
]
why.ru = '''Группа даёт горизонтальное масштабирование: добавить экземпляр значит добавить участника, а издатель ничего не знает. У группы три нюанса. Группа есть у подписки, а не у сообщения, поэтому аудит без группы по-прежнему видит всё. Брокер выбирает участника случайно, поэтому порядок между экземплярами не гарантирован. И остановка экземпляра это `unsubscribe` с дочитыванием, а не `abort`: иначе всё, что уже сидело в буфере подписки, пропадает.'''

[[exercises]]
name = "svnats12"
style = "fix"
requires = ["nats"]
hint.ru = [
  '''Чем отличается подписка, на которую каждый экземпляр получает копию, от подписки, где экземпляры делят поток? Какая строка в `start_instance` определяет это?''',
  '''Нужна группа, но какое имя ей дать? Если дать всем сервисам одну и ту же строку, notify и feed окажутся в одной группе и начнут отнимать друг у друга события. Группа принадлежит сервису, а не системе.''',
]
why.ru = '''Две ошибки живут в одной строке подписки. Без группы два экземпляра дублируют работу (два уведомления на лайк). С одной общей константой вместо имени сервиса соседи делят один поток на всех и каждый видит только часть. Верное правило: имя группы равно имени сервиса. Тогда масштабирование (больше экземпляров) и независимость (больше сервисов) не мешают друг другу.'''

[[exercises]]
name = "svnats_q4"
kind = "question"
question.ru = '''Темы `social.post.liked.*` слушают: три экземпляра notify-service в группе `notify`, два экземпляра feed-service в группе `feed` и один аудит-журнал без группы. Публикуют 30 лайков. Сколько всего обработок событий произойдёт?'''
options.ru = [
  '''30, потому что каждое событие обрабатывается ровно один раз''',
  '''60: по 30 у notify и feed, а у аудита нет''',
  '''90: 30 у notify, 30 у feed и 30 у аудита''',
  '''210: каждая из шести подписок обрабатывает каждое событие''',
]
answer = [2]
explain.ru = '''Брокер выбирает по одному участнику внутри каждой группы, а подписка без группы получает всё сама по себе. Поэтому notify получает свои 30 (разделённые между тремя), feed свои 30 (между двумя) и аудит тоже 30. Всего 90. Ошибка «30» забывает про независимые группы, «210» путает группу с отдельными подписками.'''
hint.ru = '''Сколько независимых «потребителей» получается: группы считаются за один, а одиночные подписки?'''

[[exercises]]
name = "svnats13"
style = "todo"
requires = ["nats"]
hint.ru = [
  '''Заголовки кладёт `HeaderMap::insert(имя, значение)`, отправляет `publish_with_headers`. Читаются они из `message.headers`. Обе стороны проверяют идентификаторы одним и тем же правилом.''',
  '''Внимание: `insert` не проверяет значение на перевод строки. Идентификатор `r1\r\nX-Admin: true` дойдёт до получателя как два заголовка. Поэтому проверка идёт до вставки (на отправке негодный отвергается) и после чтения (негодный считается отсутствующим).''',
  '''`forward` читает контекст входящего. Если он есть и целиком годен, пересылает с ним. Если нет или хоть одно значение негодно, заводит оба идентификатора заново и возвращает их. Тело переправляется как есть.''',
]
why.ru = '''Идентификаторы запроса нужны, чтобы жалобу пользователя можно было проследить через шлюз, user-service и notify-service одним поиском в логах. Едут они в заголовках, а не в теле, чтобы не менять контракты событий. Источник идентификатора это внешний мир, поэтому он проверяется на отправке (иначе подделаем чужой заголовок) и на получении (иначе не доверяем чужому сервису или клиенту). Если контекста нет или он негоден, лучше завести свежий и продолжить, чем терять трассировку или падать.'''

[[exercises]]
name = "svnats14"
style = "scratch"
requires = ["nats"]
hint.ru = [
  '''`ConnectOptions::new().subscription_capacity(n).event_callback(...)`: колбэк получает `Event`, нужная тебе ветка это `Event::SlowConsumer(_)`. Счётчик общий с вызывающим, поэтому `Arc<AtomicUsize>`.''',
  '''`missing_ranges`: заведи таблицу «пришло ли n» длиной `total` и пройди по ней один раз, собирая подряд идущие «нет» в диапазоны. Номера за пределами `total` и повторы игнорируй.''',
]
why.ru = '''Core NATS при переполнении буфера подписки молча выбрасывает новые сообщения. Узнать об этом можно двумя способами, и они дополняют друг друга. Событие `SlowConsumer` говорит «где-то потеряно», но не сколько. Нумерация у издателя и поиск дыр говорят точно что, но пропавший хвост в полученном не виден: чтобы заметить его, нужно знать общее число. Поэтому в реальных системах рядом с событием идёт счётчик «отправлено» или номер последнего, а на стороне получателя сверяют полученное.'''

[[exercises]]
name = "svnats15"
style = "fix"
requires = ["nats"]
hint.ru = [
  '''Что делает цикл приёма, пока одна доставка занимает 20 мс? Не читает из подписки, а буфер подписки в это время копится. Что должен делать цикл приёма вместо доставки?''',
  '''Разведи приём и работу: цикл приёма только кладёт задание в ограниченный `mpsc::channel`, а `workers` задач берут из него по одному. Очередь одна, получателей несколько: `tokio::sync::Mutex` вокруг `Receiver`. Блокировку держи только на время `recv`, не на время обработки.''',
  '''Лишнее не ждёт: `try_send`, а при ошибке `dropped += 1`. Если вместо этого сделать `send().await`, цикл приёма встанет на полной очереди, и потеря вернётся, только уже молчаливая.''',
]
why.ru = '''Пока цикл приёма занят обработкой, он не читает подписку, и буфер подписки копится: потеря происходит в клиенте, молча. Правильная схема разводит роли: приём быстрый и ничего не делает, очередь ограничена, воркеров ровно столько, сколько разрешено, а переполнение это явное событие с счётчиком. `send().await` вместо `try_send` выглядит заботливо, но переносит узкое место в цикл приёма и возвращает ту же потерю. Безразмерный `spawn` на каждое сообщение положил бы базу данных всплеском.'''

[[exercises]]
name = "svnats_q5"
kind = "question"
question.ru = '''Подписчик с буфером на 100 сообщений обрабатывает по 20 мс на сообщение. За 100 мс подряд прилетает 1000 сообщений, обработчик всё это время читает подписку. Какие сообщения потеряются?'''
options.ru = [
  '''самые старые: сначала вытесняются те, что лежат в буфере дольше всех''',
  '''те, что пришли при полном буфере: начало потока цело, а пропадает хвост всплеска, кроме редких счастливчиков''',
  '''случайные: клиент выкидывает любое сообщение, когда не успевает''',
  '''никакие: брокер хранит сообщения и отдаст их, когда подписчик освободится''',
]
answer = [1]
explain.ru = '''Клиент NATS не вытесняет старое и не хранит лишнее: если в буфере нет места, новое сообщение отбрасывается, а клиент присылает `SlowConsumer`. Обработчик освобождает по одному месту раз в 20 мс, поэтому немногие сообщения из середины всплеска успевают занять освободившееся место, но основная масса хвоста пропадает. Хранение и повторную доставку даёт JetStream, а не core NATS.'''
hint.ru = '''Что клиент делает с новым сообщением, когда буфер полон?'''

[[exercises]]
name = "svnats16"
style = "fix"
requires = ["nats"]
hint.ru = [
  '''Что должен говорить `ready()`, если соединение с брокером потеряно? Где в клиенте можно спросить о состоянии?''',
  '''У `Client` есть `connection_state()`. `ready()` равна «состояние `Connected`». `publish` при неготовности сразу отказывает ошибкой `Unavailable`, не обращаясь к клиенту: иначе сообщение окажется в скрытом буфере.''',
]
why.ru = '''Скрытый буфер переподключения это услуга для коротких обрывов, но для сервиса она опасна: `Ok` от `publish` означает «поставлено в очередь», а не «ушло», и после долгого обрыва события выплеснутся с опозданием на минуты, когда пользователь давно повторил действие. Честная обёртка делает две вещи: готовность следует состоянию соединения (балансировщик перестаёт слать трафик), а публикация без связи сразу отказывает. Вызывающий сам решает: повторить, показать ошибку или положить событие в outbox, чтобы отправить позже.'''

[[exercises]]
name = "svnats_engine"
kind = "project"
style = "scratch"
requires = ["nats"]
locked = ["src/crates/nats-engine/tests/acceptance.rs"]
hint.ru = [
  '''Собирай снизу вверх: сначала `subject.rs` (слова, `Subject`, `Pattern`), потом `meta.rs` (идентификаторы и заголовки), потом `bus.rs`. Каждый кусок почти повторяет задачу главы: проверка слова это svnats5, сопоставление шаблона это svnats4, заголовки это svnats13.''',
  '''В `bus.rs` сначала `connect` (параметры из `BusConfig`, счётчик `SlowConsumer` в `event_callback`), `ready`, `sync` (круговой рейс), потом `publish` и `subscribe`. Каждая подписка и каждый ответчик вызывает `sync` до возврата. `publish` и `request` без связи сразу возвращают `Unavailable`.''',
  '''`serve` это цикл с `select!` по подписке и сигналу остановки: прочитать, разобрать тело, вызвать обработчик, ответить в `reply` значением `Reply::Ok` или `Reply::Err`, заголовки с идентификаторами вернуть в ответ. Мусор в теле получает `Reply::Err`, а не молчание. `request` разбирает ошибку через `error.kind()`.''',
]
why.ru = '''Крейт `nats-engine` это место, где вся глава превращается в кирпич для сервисов: безопасные темы вместо форматирования строк, идентификаторы запроса в заголовках, подписка, которая готова к возврату, запрос с тремя исходами, ответчик, переживающий мусор, честная готовность и счётчик потерь. Сервисы дальше (notify-service, а в следующих главах feed-service и другие) используют только этот крейт, а `async_nats::` в их коде не встречается: так любая ловушка, найденная в этой главе, закрыта в одном месте.'''

[[exercises]]
name = "svnats_quiz"
kind = "project"
quiz = true
style = "scratch"
requires = ["nats"]
locked = ["src/microservices/notify-service/tests/acceptance.rs"]
hint.ru = [
  '''Начни с `dto.rs` и `service.rs`: они чистые и проверяются без сети. `decode` сначала определяет вид события по теме (только `post.liked`, `post.commented`, `user.followed` это уведомления), потом проверяет тело. `record` делает «есть ли такое непрочитанное» и «вставить» в одной транзакции хранилища.''',
  '''В `controller::start`: подписка с группой на `<корень>.*.*.*`, ограниченная очередь `mpsc` на `queue`, `workers` работников с общим `Receiver` за `tokio::sync::Mutex`, цикл приёма с `try_send`. Два ответчика на `unread` и `read` в той же группе. Каждое полученное событие попадает ровно в один счётчик.''',
  '''`stop`: сначала закрыть приём (сигнал и `unsubscribe`), затем снять ответчиков, затем дождаться работников (очередь закроется, когда будет уничтожен отправитель), и только потом вернуться. Тест на остановку проверяет, что доставлено всё, что уже было в очереди.''',
]
why.ru = '''notify-service это сумма главы в одном месте: события со схемой тем, группа вместо дублей, запрос «сколько непрочитанных» с понятными исходами, приём отдельно от тяжёлой работы, ограниченная очередь с явным учётом потерь, готовность по состоянию связи и остановка без брошенных заданий. Обрати внимание на инвариант `received = ignored + rejected + queued + dropped`: если он держится, ни одно событие не исчезло без следа, и по счётчикам видно, что именно происходит при перегрузке.'''

