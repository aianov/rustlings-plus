test_command = ["cargo", "make", "check"]
requires = ["nats"]
hint.ru = [
"""Начни с того, что уже сдал: перенеси крейт из проекта svnats_engine в `src/crates/nats-engine`, разложи файлы по папкам
(`bus/`, `subject/`, `meta/`, `config/`, `error/`) и подключи его через `[workspace.dependencies]`. Потом три правки:
`Bus` клонируется, `Meta::follow` берёт номер запроса или заводит свежий, а `serve` ждёт асинхронный обработчик:
`handler(envelope).await` внутри цикла ответчика.""",
"""Схему тем держи в contracts, а не в сервисах: `Topics::event` отдаёт слова `[корень, "events", сущность, действие,
владелец]`, проверяет их `Subject::new` в адаптере. Владелец события это тот, о ком факт: цель подписки или автор
поста. `read_event` сравнивает id с его каноническим видом (`u_02` это не `u_2`), иначе две темы назовут одного
пользователя.""",
"""В user-service и post-service событие публикует service через порт `Events`, а не контроллер: только service знает,
изменилось ли что-то. Номер запроса туда приносит `Origin`, который контроллер строит из `Stamp::follow`. Адаптер в
`client/events.rs` не возвращает ошибку: подписка уже записана, потерянное событие пишется в лог.""",
"""notify-service это проект svnats_quiz по слоям. Правило «своё действие не уведомление» живёт в `dto::decode`
(приём отбрасывает его до очереди), веер нового поста в service через порт `Audience`, отправка уведомления через
порт `Courier`. Проверка «такое непрочитанное уже есть» и вставка должны идти под одним замком хранилища, иначе
работники задвоят уведомление.""",
"""В шлюзе убери все `ctx.push` из маршрутов и подпишись на `<корень>.notices.*` в bootstrap до того, как начнёшь
принимать соединения: `subscribe` возвращается после круга до брокера, значит первое уведомление не потеряется. Тестовый
`support.rs` поднимает notify-service через `notify_service::start`, который тоже возвращается после подписки.""",
]
story.ru = """Соцсеть заговорила фактами: user-service и post-service объявляют в NATS, что случилось, notify-service в группе
копит уведомления и отвечает колокольчику, а шлюз только пушит пришедшее. Подписка работает и без брокера, а
notify-service без него честно не готов."""
