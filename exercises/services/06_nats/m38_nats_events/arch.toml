[[rules]]
kind = "contains"
globs = ["src/microservices/api-gateway/src/controller/notices.rs"]
regex = 'read_notice'
message.ru = "Шлюз подписан на уведомления и проверяет, что тема и адресат совпадают."

[[rules]]
kind = "contains"
globs = ["src/microservices/api-gateway/src/client/notify.rs"]
regex = 'BusError::NoService'
message.ru = "Колокольчик шлюза: «никто не слушает» это unavailable, а не зависание."

[[rules]]
kind = "contains"
globs = ["src/microservices/api-gateway/src/routes/mod.rs"]
regex = '"notify\.unread"'
message.ru = "Методы колокольчика и комментария в таблице маршрутов."

[[rules]]
kind = "contains"
globs = ["src/crates/certgen/src/issue/mod.rs"]
regex = '"notify-service"'
message.ru = "У notify-service свой сертификат: он ходит в user-service по взаимному TLS."

[[rules]]
kind = "contains"
globs = [".env.example"]
regex = '^NATS_URL='
message.ru = "Адрес брокера и корень тем в .env.example."

[[rules]]
kind = "contains"
globs = ["Makefile.toml"]
regex = '-p", "notify-service"'
message.ru = "notify-service запускается вместе со стеком."
