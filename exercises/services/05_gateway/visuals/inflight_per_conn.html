<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Запросы одного соединения</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1c2330; --muted: #5d6879; --line: #c9d0db;
  --box: #eef1f6; --boxline: #aeb8c8; --ok: #1f8a4c; --bad: #c92a2a; --warn: #d9820f; --accent: #2f6fe0;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14181f; --panel: #1b212b; --ink: #e6ebf3; --muted: #9aa6b8; --line: #384152;
    --box: #232b38; --boxline: #4a566b; --ok: #51cf66; --bad: #ff6b6b; --warn: #ffa94d; --accent: #6ea4ff;
  }
}
:root[data-theme="dark"] {
  --bg: #14181f; --panel: #1b212b; --ink: #e6ebf3; --muted: #9aa6b8; --line: #384152;
  --box: #232b38; --boxline: #4a566b; --ok: #51cf66; --bad: #ff6b6b; --warn: #ffa94d; --accent: #6ea4ff;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1000px; margin: 0 auto; padding: 16px; }
h1 { font-size: 20px; margin: 0 0 4px; }
p.sub { margin: 0 0 12px; color: var(--muted); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
button, select { font: inherit; color: var(--ink); background: var(--box); border: 1px solid var(--boxline); border-radius: 6px; padding: 5px 12px; cursor: pointer; }
button:hover:enabled { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
.spacer { flex: 1; }
svg { width: 100%; height: auto; display: block; }
svg text { fill: var(--ink); font-size: 13px; }
svg .muted { fill: var(--muted); font-size: 12px; }
svg .mono { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
#caption { margin-top: 12px; min-height: 90px; }
.step { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>Запросы одного соединения в полёте</h1>
  <p class="sub">Параллельная обработка: ответы по готовности и лимит запросов в работе.</p>
  <div class="panel">
    <div class="bar">
      <label>Случай <select id="scenario"></select></label>
      <span class="spacer"></span>
      <button id="reset">Сброс</button>
      <button id="prev">Назад</button>
      <button id="next">Шаг</button>
      <button id="play">Играть</button>
      <button id="theme">Тема</button>
    </div>
    <svg viewBox="0 0 960 420" role="img" aria-label="Запросы одного соединения в полёте">
      <g id="scene"></g>
    </svg>
    <div id="caption" aria-live="polite"></div>
  </div>
</main>
<script>
"use strict";
const NS = "http://www.w3.org/2000/svg";
function el(name, attrs, parent, text) {
  const e = document.createElementNS(NS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}
const scene = document.getElementById("scene");

const SCEN = {
  parallel: { title: "параллельно, без лимита", limit: 99, reqs: [[1, 200], [2, 10], [3, 120], [4, 60]],
    steps: [
      { t: 0, text: "Четыре кадра пришли по одному соединению почти одновременно. Каждый обрабатывается в своей задаче." },
      { t: 10, text: "Через 10 мс готов запрос 2: его ответ уходит первым, хотя пришёл вторым. Клиент найдёт его по id." },
      { t: 60, text: "Запрос 4 тоже ответил. Остальные ещё в работе." },
      { t: 200, text: "Всё заняло 200 мс, а не 10+200+120+60: время самого медленного, а не сумма." }
    ] },
  limit: { title: "лимит 3 в полёте", limit: 3, reqs: [[1, 100], [2, 100], [3, 100], [4, 100], [5, 100], [6, 100]],
    steps: [
      { t: 0, text: "Шесть кадров разом, а лимит три. Первые три получили разрешения, остальные три получают отказ сразу, без очереди." },
      { t: 50, text: "Три запроса идут. Отказавшие уже получили resource_exhausted, и клиент может сбавить темп." },
      { t: 100, text: "Три готовы, разрешения вернулись. Следующий кадр снова пройдёт." }
    ] }
};
function render() {
  scene.textContent = "";
  const sc = SCEN[sel.value];
  const t = idx < 0 ? -1 : sc.steps[idx].t;
  const x0 = 120, scale = 800 / Math.max(...sc.reqs.map(r => r[1]));
  el("text", { x: 10, y: 22, class: "muted" }, scene, "запрос");
  el("text", { x: x0, y: 22, class: "muted" }, scene, "время →");
  let granted = 0;
  sc.reqs.forEach((r, i) => {
    const y = 40 + i * 44;
    const refused = granted >= sc.limit;
    if (!refused) granted++;
    el("text", { x: 10, y: y + 20, style: "font-weight:700" }, scene, "#" + r[0]);
    el("rect", { x: x0, y, width: r[1] * scale, height: 28, rx: 6, fill: "none", stroke: "var(--boxline)", "stroke-dasharray": "3 3" }, scene);
    if (t >= 0) {
      if (refused) {
        el("rect", { x: x0, y, width: 60, height: 28, rx: 6, fill: "var(--bad)" }, scene);
        el("text", { x: x0 + 70, y: y + 19, style: "fill:var(--bad);font-size:12px" }, scene, "resource_exhausted: отказ сразу, ответ в t=0");
      } else {
        const done = t >= r[1];
        el("rect", { x: x0, y, width: Math.max(2, Math.min(t, r[1]) * scale), height: 28, rx: 6, fill: done ? "var(--ok)" : "var(--accent)" }, scene);
        if (done) el("text", { x: x0 + r[1] * scale + 8, y: y + 19, style: "font-size:12px" }, scene, "ответ #" + r[0] + " (t=" + r[1] + " мс)");
      }
    }
  });
  if (t >= 0) {
    const lx = x0 + t * scale;
    el("line", { x1: lx, y1: 30, x2: lx, y2: 40 + sc.reqs.length * 44, stroke: "var(--warn)", "stroke-width": 2 }, scene);
    el("text", { x: lx + 4, y: 392, style: "fill:var(--warn)" }, scene, "t = " + t + " мс");
  }
  caption.innerHTML = idx < 0
    ? '<span class="step">Шаг 0 из ' + sc.steps.length + '</span><br>Выбери случай и нажми «Шаг»: время будет идти вперёд.'
    : '<span class="step">Шаг ' + (idx + 1) + ' из ' + sc.steps.length + '</span><br>' + sc.steps[idx].text;
  finish();
}

const caption = document.getElementById("caption");
const sel = document.getElementById("scenario");
const btnPrev = document.getElementById("prev"), btnNext = document.getElementById("next");
const btnPlay = document.getElementById("play"), btnReset = document.getElementById("reset");
let idx = -1, timer = null;
for (const k in SCEN) { const o = document.createElement("option"); o.value = k; o.textContent = SCEN[k].title; sel.appendChild(o); }
function total() { return SCEN[sel.value].steps.length; }
function stop() { if (timer) { clearInterval(timer); timer = null; } btnPlay.textContent = "Играть"; }
function next() { if (idx < total() - 1) { idx++; render(); } else stop(); }
btnNext.onclick = () => { stop(); next(); };
btnPrev.onclick = () => { stop(); if (idx >= 0) { idx--; render(); } };
btnReset.onclick = () => { stop(); idx = -1; render(); };
btnPlay.onclick = () => {
  if (timer) { stop(); return; }
  if (idx >= total() - 1) idx = -1;
  btnPlay.textContent = "Пауза";
  next();
  timer = setInterval(next, 2800);
};
sel.onchange = () => { stop(); idx = -1; render(); };
document.getElementById("theme").onclick = () => {
  const root = document.documentElement;
  const dark = getComputedStyle(root).getPropertyValue("--bg").trim() === "#14181f";
  root.setAttribute("data-theme", dark ? "light" : "dark");
};
function finish() { btnPrev.disabled = idx < 0; btnNext.disabled = idx >= total() - 1; }
render();
</script>
</body>
</html>
