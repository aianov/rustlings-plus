hint.ru = [
"""Начни снизу: `contracts` (код `exhausted`, `meta`, `request_id` в ответе, `read_data`), `proto` (`expires_at`,
`AuthorPosts`), потом `grpc-kit` (`Stamp::pass`) и `post-service`. Старые тесты подскажут, что сломалось: в новой
версии `support.rs` регистрация и вход идут через шлюз, а `Services` знает `auth_http`.""",
"""Типизированный маршрут это замыкание над `Fn(Ctx, Req) -> Fut`, которое разбирает `data` через `read_data`,
вызывает обработчик синхронно (так ему не нужен клон `Arc`) и упаковывает только future ответа. В `route_authed`
сначала `Visitor::Member`, потом `act_as`, и только потом разбор: гость получает `unauthorized`, даже если прислал
мусор. Повтор имени не вставляй, а запомни: ошибка `build` должна назвать все пары сразу.""",
"""Работу соединения вынеси в `controller/work.rs`: `JoinSet<Answer>`, `HashMap<task::Id, Owner>` и семафор.
`try_acquire_owned` до `spawn`, разрешение живёт внутри задачи. Ответ берётся из `join_next_with_id`: у упавшей
задачи есть `JoinError::id()`, по нему находится id кадра. Цикл соединения читает всегда, лимит это отказ, а не пауза
чтения.""",
"""Срок токена переведи в `Instant` один раз при подключении (`Principal::left`), дальше часы стены не нужны:
`sleep_until(deadline)` в `select!` и сравнение на каждом кадре. После выхода из цикла сначала `settle`: дочитать
очередь и дождаться начатых задач не дольше `GRACE`, отвечая, если сокет жив; уведомление `expired` и код 4001 в
самом конце.""",
"""В прокси сначала то, что решается без апстрима (путь, размер тела), потом чистка заголовков: собери имена из
`Connection` и выброси их вместе со списком hop-by-hop, клиентские `X-Forwarded-*` и внутренние `x-user*`, затем
добавь свои. `http-client` получает `relay` (без редиректов) и TLS: шлюз ходит в auth-service по взаимному TLS с
именем `auth-service`, а адрес клиента под своим TLS-краем приходит строкой PROXY.""",
]
story.ru = """У соцсети одна дверь: вход и регистрация идут через шлюз, маршруты типизированы и защищены на уровне таблицы,
токен сверяется на каждом кадре и закрывает сокет по сроку, жадный клиент получает отказ, а не очередь, metadata
сервисам строит только шлюз, карточка профиля собирается параллельно и не ждёт зависшего соседа."""
