title.en = "Gateway"
title.ru = "Шлюз"

[[chapter.visuals]]
file = "visuals/gateway_flow.html"
title.ru = "Кадр клиента: таблица маршрутов, Principal, gRPC с metadata, ответ с тем же id"

[[chapter.visuals]]
file = "visuals/inflight_per_conn.html"
title.ru = "Запросы одного соединения в полёте: лимит и ответы не по порядку"

[[exercises]]
name = "svgw1"
style = "todo"
hint.ru = [
  """Разбор идёт слоями: сначала весь текст как `Value` (иначе `bad_frame`), потом поля по одному. `id` нужен, чтобы ответить, но он сам может быть испорчен: тогда в ответе `null`.""",
  """`frame.get("id")` даёт `Option<&Value>`, проверка типа это `is_string() || is_number()`. Ключ таблицы это пара `(String, String)`. Результат обработчика превращай в ответ через `ok_reply` и `err_reply` с одним и тем же `id`.""",
]
why.ru = """`id` связывает запрос и ответ, когда они идут вперемешку по одному соединению, поэтому он возвращается в том же виде (число числом), и его судьба не зависит от остального кадра: если он есть и корректен, ответ несёт его даже при ошибке. Ошибка разбора и ошибка маршрута это разные коды, чтобы клиент отличал «я прислал мусор» от «такого метода нет»."""

[[exercises]]
name = "svgw2"
style = "scratch"
hint.ru = [
  """У каждого `async`-блока свой анонимный тип, и в `HashMap` нужен один. Стирание типа это `Box<dyn ...>`, а для future в крейте `futures` есть метод `.boxed()` у `FutureExt`: он делает `BoxFuture`.""",
  """Положи в таблицу замыкание `move |data| handler(data).boxed()`: оно принимает данные и возвращает уже упакованный future. Ограничения `Send + Sync + 'static` на `F` и `Send + 'static` на `Fut` нужны, чтобы таблицу можно было делить между задачами.""",
]
why.ru = """Таблица обработчиков это граница, на которой типы приходится стирать: пока тип известен, компилятор генерирует отдельный код для каждого обработчика, а в таблице нужна одна форма. Цена стирания это одна упаковка в `Box` на вызов, и она ничтожна рядом с сетевым ожиданием. Метод `call` берёт `&self`, поэтому таблицу можно делить через `Arc`, и параллельные вызовы идут одновременно."""

[[exercises]]
name = "svgw3"
style = "scratch"
hint.ru = [
  """`route` не должен знать про таблицу: он оборачивает типизированный обработчик в обычный `Value -> future` и отдаёт `add`. Внутри обёртки: `serde_json::from_value::<Req>(data)`, потом вызов, потом `serde_json::to_value`.""",
  """Две ветки возвращают разные future, а `add` ждёт один тип. Либо упакуй обе через `.boxed()`, либо используй `FutureExt::left_future` и `right_future`, они объединяют два future в `Either`. Текст ошибки `serde` в ответ не бери: он цитирует значения.""",
]
why.ru = """Обёртка делает работу, которую иначе дублировали бы все обработчики: разбор данных, единая ошибка `invalid_argument` и сериализация ответа. Обработчик видит только свои типы, а опечатка в имени поля превращается из ошибки в рантайме в ошибку компиляции. Сообщения об ошибке разбора нарочно общие: `serde` цитирует присланное значение, и пароль, оказавшийся не в том поле, не должен улетать обратно клиенту и в логи прокси."""

[[exercises]]
name = "svgw4"
style = "bughunt"
hint.ru = [
  """`HashMap::insert` молча заменяет старое значение. Роутер собирается в билдере, значит, и дубликат нужно заметить в билдере, а сообщить о нём при `build`. Второй дефект видно по коду ошибки в ветке неудачного разбора.""",
  """Заведи в билдере список дубликатов: при `add` проверь, что ключ уже есть, и в таком случае запомни `service.method` (один раз) и не заменяй обработчик. `build` возвращает `Err(duplicates)`, если список не пуст.""",
]
why.ru = """Ошибки конфигурации должны падать при старте, а не жить в проде: затёртый обработчик не виден ни в тестах, ни в логах, пока кто-то не заметит странное поведение. Билдер, который собирает все дубликаты разом, избавляет от цикла «исправил один, запустил, получил следующий». Код ошибки несёт смысл для мониторинга: `invalid_argument` это клиент, `internal` это мы, и путать их значит будить людей зря."""

[[exercises]]
name = "svgw5"
style = "scratch"
hint.ru = [
  """Сначала определись, откуда взять токен: заголовок разбирается по первому пробелу (схема и токен), в строке запроса ищется параметр `token=`. Только после этого решай, что с ним делать: нет токена это аноним, есть это проверка.""",
  """Проверка вызывается один раз, результат (пара `Principal` и срок) кладётся в соединение. Ошибки проверки переводи в коды клиента: `Expired` и `Invalid` разные, потому что клиент реагирует на них по-разному. Неоднозначный запрос отклоняй до обращения к проверке.""",
]
why.ru = """Токен проверяется на границе соединения один раз, потому что кадров будут тысячи, а проверка стоит сетевого вызова. Срок токена сохраняется вместе с пользователем: он понадобится на каждом кадре (см. дальше), иначе соединение переживёт токен. Коды ошибок подключения различают просроченный и неверный токен: первое лечится обменом refresh и новым подключением, второе означает, что нужен новый вход. Два токена сразу не пытаемся угадывать: неоднозначность лучше отказа, чем выбора наугад."""

[[exercises]]
name = "svgw6"
style = "bughunt"
hint.ru = [
  """Что делает `unwrap_or_default()` с `None`, и что после этого видит обработчик? Защищённый маршрут не должен иметь ветки «а если пользователя нет»: её решает шлюз.""",
  """Достань `principal` из контекста первым действием, в `None` верни ошибку `unauthenticated` без разбора данных и без вызова обработчика. Только потом `decode` и вызов обработчика уже с настоящим `Principal`.""",
]
why.ru = """Тип `Option<Principal>` в обработчике это приглашение забыть про `None`, и рано или поздно кто-то забудет. Вынос проверки в шлюз превращает правило в свойство типов: обработчик `route_authed` получает `Principal` и вообще не может быть вызван без него. Порядок «сначала кто ты, потом что ты прислал» не даёт анониму получать подробные ошибки схемы защищённых методов."""

[[exercises]]
name = "svgw7"
style = "bughunt"
hint.ru = [
  """Сколько раз за жизнь соединения проверяется срок токена? Срок уже лежит в контексте, нужны только часы. Проверка должна стоять там, через которую проходят все вызовы.""",
  """В `call` до поиска маршрута: если соединение уже закрыто, ответ `closed`; иначе, если у соединения есть `exp` и `now >= exp`, пометь его закрытым и ответь `token_expired`. Порядок важен: у закрытого соединения срок не пересчитывается.""",
]
why.ru = """Проверка один раз при подключении защищает вход, но не время. Долгое соединение это «токен на несколько часов», и срок надо сверять на каждом вызове; иначе отзыв доступа вступит в силу только после того, как пользователь сам отключится. Закрытое остаётся закрытым: это состояние, а не вычисление от часов (которые, например, ушли назад после синхронизации). Клиенту отвечают понятным кодом, чтобы он обновил токен и подключился снова."""

[[exercises]]
name = "svgw_q2"
kind = "question"
question.ru = """Шлюз проверяет токен при подключении и на каждом кадре сверяет срок (`now >= exp`). Модератор заблокировал пользователя, его токены внесены в список отозванных, а WebSocket-соединение пользователя открыто. Что произойдёт?"""
options.ru = [
  "соединение закроется сразу, потому что токен отозван",
  "соединение продолжит работать до срока токена; чтобы отозвать его раньше, шлюзу нужен отдельный механизм (проверка списка отозванных на кадрах или сигнал закрыть соединения пользователя)",
  "соединение продолжит работать, пока клиент сам не отключится, срок токена на него не влияет",
  "шлюз закроет соединение при ближайшем кадре, потому что подпись токена перестанет сходиться",
]
answer = [1]
explain.ru = """Шлюз знает срок из контекста соединения, а списка отозванных не видит: подпись токена остаётся верной, ведь токен никто не менял. Срок при этом закрывает соединение в худшем случае через время жизни токена. Если отзыв должен действовать быстрее (бан), шлюзу нужен второй канал: проверять список на кадрах (дорого) или получать сигнал «закрой соединения пользователя X» и закрывать их сам."""
hint.ru = """Что именно шлюз сверяет на каждом кадре: срок или список отозванных?"""

[[exercises]]
name = "svgw8"
style = "scratch"
hint.ru = [
  """Пока ты ждёшь ответа на один кадр, следующий лежит в канале и ждёт. Каждый кадр нужен в своей задаче: `JoinSet` собирает такие задачи и позволяет дождаться их все.""",
  """В цикле одновременно слушай два события: пришёл новый кадр (запусти задачу) и закончилась какая-то задача (отправь её ответ). Это `tokio::select!` с `incoming.recv()` и `tasks.join_next_with_id()` (`JoinError::id()` даёт id упавшей задачи, а словарь `task::Id -> id кадра` превращает его в ответ). После закрытия входа досчитай оставшиеся задачи. Задача, упавшая с паникой, возвращает `JoinError` без результата: поэтому `id` кадра нужно вытащить заранее.""",
]
why.ru = """Один клиент на одном соединении шлёт запросы, которые не зависят друг от друга, и шлюз не должен выстраивать их в очередь: ответ быстрого запроса приходит первым, а `id` помогает клиенту разложить ответы по местам. Закрытие входа не обрывает работу, которая уже идёт: иначе отключившийся клиент оставил бы потерянные ответы и недоделанные побочные эффекты. Паника в обработчике превращается в ответ именно потому, что `id` был вытащен до запуска задачи."""

[[exercises]]
name = "svgw_q1"
kind = "question"
question.ru = """Клиент по одному соединению шлёт подряд два кадра: `{"id": 1, "method": "feed"}` (сервис отвечает за 200 мс) и `{"id": 2, "method": "counter"}` (за 10 мс). Шлюз обрабатывает кадры параллельно. В каком порядке придут ответы и что должен делать клиент?"""
options.ru = [
  "сначала ответ на id 2 (через 10 мс), потом на id 1; клиент находит свой запрос по `id` и порядка не предполагает",
  "сначала ответ на id 1, потом на id 2: порядок ответов всегда равен порядку запросов, иначе протокол нарушен",
  "ответы придут одним кадром через 200 мс, чтобы клиенту было проще",
  "порядок случайный, поэтому клиент обязан ждать оба ответа, а `id` нужен только для логов",
]
answer = [0]
explain.ru = """Параллельная обработка отвечает по готовности: счётчик не должен ждать ленту. Именно поэтому в кадре есть `id`: по нему клиент раскладывает ответы по ожидающим запросам. Порядок в протоколе не гарантируется, и клиент, который его предполагает, ломается при первом же медленном запросе. «Случайный» порядок ложная формулировка: он определяется временем ответа, и `id` нужен для работы, а не для логов."""
hint.ru = """Кто быстрее готов, тот первым и отвечает. Что тогда связывает ответ с вопросом?"""

[[exercises]]
name = "svgw9"
style = "bughunt"
hint.ru = [
  """Сколько задач может висеть в `JoinSet` одновременно? Тут нет ничего, что бы это ограничивало. Нужен счётчик свободных мест, и он должен быть общим для всех задач соединения.""",
  """`Semaphore::try_acquire_owned` не ждёт: если места нет, возвращает ошибку. Это нужно, чтобы отказать сразу, а не встать в очередь. Разрешение переезжает внутрь задачи и освобождается её завершением (в том числе при панике, потому что `Drop` сработает при раскрутке).""",
]
why.ru = """Без лимита один клиент превращает общую память шлюза в свою. Очередь вместо отказа не лечит, а прячет проблему: растёт задержка и память, а клиент ждёт ответа, который уже никому не нужен. Мгновенный отказ `resource_exhausted` позволяет клиенту сбавить темп. Разрешение держится охранником внутри задачи, поэтому возвращается всегда: и при успехе, и при панике, и при отмене."""

[[exercises]]
name = "svgw10"
style = "bughunt"
hint.ru = [
  """Где хранить уже открытое соединение, и кто решает, что его ещё нет? Если проверять и открывать «без замка», десять одновременных вызовов увидят «нет» и откроют десять соединений. Если держать общий замок на время открытия, медленный адрес заблокирует быстрый.""",
  """Общей картой управляет короткий замок, а открытие происходит в отдельной ячейке на адрес: `tokio::sync::OnceCell`. Метод `get_or_try_init` запускает открытие один раз, остальные одновременные вызовы ждут его же, а ошибка не запоминается (ячейка остаётся пустой).""",
]
why.ru = """Рукопожатие дороже самого запроса, поэтому соединение переиспользуют, а HTTP/2 и gRPC позволяют пускать по одному соединению много запросов сразу. Тонкости три. Первое открытие должно произойти один раз при любой гонке (ячейка `OnceCell` на адрес). Ошибка открытия не запоминается, иначе одна неудача на старте сломает адрес навсегда. А замок на карте держится только на время поиска ячейки, не на время открытия: иначе медленный сервис тормозил бы вызовы к быстрым."""

[[exercises]]
name = "svgw_q3"
kind = "question"
question.ru = """Кэш каналов к сервисам написан так:
```rust
let mut map = self.map.lock().await;      // tokio::sync::Mutex<HashMap<..>>
if let Some(channel) = map.get(addr) {
    return Ok(channel.clone());
}
let channel = dial(addr).await?;          // открытие занимает до секунды
map.insert(addr.to_string(), channel.clone());
Ok(channel)
```
Дублирующих соединений тут не будет. Что всё же плохо?"""
options.ru = [
  "ничего: tokio Mutex специально создан для удержания через `.await`",
  "пока открывается соединение к одному медленному сервису, замок держится, и вызовы ко всем остальным адресам, в том числе уже открытым, стоят в очереди за ним",
  "`clone()` канала копирует соединение, поэтому память растёт на каждый вызов",
  "`lock().await` нельзя использовать в обработчиках, нужен `try_lock`",
]
answer = [1]
explain.ru = """Замок на всю карту удерживается на время открытия, а открытие это сетевое ожидание. Один зависший сервис останавливает вызовы ко всем, даже к тем, чьё соединение уже есть. Лечится ячейкой на адрес: замок карты берётся на мгновение, чтобы достать `Arc<OnceCell>`, а дорогое открытие идёт в ячейке и не блокирует соседей. `clone()` у канала дешёвый, он копирует ссылку на то же соединение."""
hint.ru = """Сколько времени замок держится в худшем случае, и кто ждёт его в это время?"""

[[exercises]]
name = "svgw11"
style = "scratch"
hint.ru = [
  """Номер запроса берётся из кадра, только если он прошёл проверку на безопасность: он окажется в заголовках и логах других сервисов, а значит, в нём нельзя ни пробелов, ни переводов строки. Иначе шлюз выдаёт свой из атомарного счётчика.""",
  """`user-id` и роль берутся только из `Principal` (его мы проверили), поэтому для анонима этих ключей нет вообще, а не пустое значение. Ответ клиенту получает `request_id` отдельным полем, существующие поля остаются.""",
]
why.ru = """Сквозной номер запроса превращает три журнала в один рассказ: поддержка берёт номер из ответа клиенту и находит записи всех сервисов. Клиентский номер полезен (связывает действие в приложении с серверной цепочкой), но приходит из недоверенного источника, поэтому проходит проверку алфавита и длины, иначе в заголовки и логи попадут переводы строк. Пользователь передаётся в metadata готовым, и сервисы позади шлюза доверяют ему, а не разбирают токен заново."""

[[exercises]]
name = "svgw12"
style = "bughunt"
hint.ru = [
  """Чьим словам верят сервисы позади шлюза, читая `x-user-id`? Если клиент может положить туда любое значение и оно доедет, то никакой проверки токена на самом деле нет. Порядок записи в metadata не спасает: сервис может прочитать первое значение, а может последнее.""",
  """Внутренние ключи строй только из `Trusted`. Клиентские metadata пропускай по белому списку: приведи ключ к нижнему регистру, сверь со списком, проверь, что значение строка, не длиннее 128 байт и без управляющих символов.""",
]
why.ru = """Metadata между шлюзом и сервисами это «доверенный» канал: сервисы читают из него `x-user-id` без проверки. Значит, граница доверия проходит по шлюзу, и всё, что клиент мог положить туда сам, нужно срезать. Белый список надёжнее чёрного: новый внутренний ключ, добавленный через год, не станет подделываемым, потому что клиентские ключи не расширяются по умолчанию. Перевод строки в значении это классическая вставка заголовков, поэтому управляющие символы отвергаются."""

[[exercises]]
name = "svgw13"
style = "bughunt"
hint.ru = [
  """Три запроса не зависят друг от друга, значит, нет причины ждать один перед другим. Проблема «упала одна часть, пропал весь ответ» сидит в знаке вопроса после `await`: он превращает ошибку необязательной части в ошибку всей функции.""",
  """`tokio::join!` ждёт все три сразу. Необязательные части оберни в `tokio::time::timeout` с бюджетом и превращай и таймаут, и ошибку в `None`. Результат пользователя разбирай уже после `join!`, чтобы его ошибка не отменила остальные.""",
]
why.ru = """Параллельные независимые запросы стоят время самого медленного, а не сумму. Но параллельность без решения «что обязательно» даёт только половину пользы: экран с именем и без счётчиков лучше пустого экрана с ошибкой. Бюджет времени на необязательные части нужен, иначе зависший соседний сервис задержит ответ, ради которого пользователь и пришёл. Обязательную часть бюджет не режет: без неё ответа нет, и ждать её приходится."""

[[exercises]]
name = "svgw14"
style = "scratch"
hint.ru = [
  """Сначала решения, не требующие апстрима: чужой путь это 404, большое тело это 413. Только потом строится запрос. Заголовки соединения (`connection` и прочие) принадлежат одному участку пути, и прокси ими не делится.""",
  """Значение заголовка `connection` само перечисляет имена других заголовков, которые тоже надо убрать. Сравнивай имена без учёта регистра. Ожидание апстрима оберни в `tokio::time::timeout`: у `Err` таймаута и у `Err` самого апстрима разные статусы, 504 и 502.""",
]
why.ru = """Заголовки уровня соединения описывают договорённости между двумя соседними узлами: если передать `Connection: upgrade` или `Transfer-Encoding` дальше, апстрим получит инструкции, которые относятся не к нему (и это классический путь к смуглингу запросов). Проверки, не требующие апстрима (маршрут, размер), идут первыми и защищают его. 502 и 504 различают «апстрим сломан» и «апстрим медленный», а тела этих ошибок пишет шлюз, чтобы не показывать клиенту устройство внутренней сети."""

[[exercises]]
name = "svgw15"
style = "bughunt"
hint.ru = [
  """Откуда апстрим берёт «первый элемент» `x-forwarded-for`, и кто этот элемент написал? Дописывание в конец списка уместно, когда перед тобой стоит свой доверенный прокси. А здесь перед шлюзом только интернет.""",
  """Выбрось все присланные клиентом заголовки про адрес, схему и хост (сравнение без учёта регистра, повторы тоже), затем добавь свои значения из TCP-соединения. Остальные заголовки и их порядок не трогай.""",
]
why.ru = """Заголовки про адрес клиента ничего не стоят, пока не известно, кто их написал. На границе сети единственный надёжный адрес это адрес TCP-соединения, и шлюз сам становится источником этой правды. Дописывание к клиентскому списку (поведение прокси, стоящего за другим прокси) на краю делает подделку первым элементом, а именно его берут лимитеры. Лимит попыток входа по подделываемому адресу не лимит вовсе."""

[[exercises]]
name = "svgw_q4"
kind = "question"
question.ru = """Шлюз переехал за облачный балансировщик, который сам дописывает адрес клиента в конец `X-Forwarded-For`. Клиент прислал `X-Forwarded-For: 6.6.6.6`, до шлюза запрос дошёл с заголовком `6.6.6.6, 198.51.100.7`, где второй адрес добавил балансировщик (его адрес шлюзу известен как доверенный). Как определить адрес клиента для лимита попыток?"""
options.ru = [
  "как на границе сети: выбросить заголовок и взять адрес TCP-соединения",
  "взять первый элемент списка: он самый старый, значит, самый ранний, значит, настоящий",
  "идти справа налево, пропустить адреса доверенных прокси и взять первый адрес, который к ним не относится: левее него писал уже не доверенный",
  "не использовать IP вообще: он всё равно подделывается",
]
answer = [2]
explain.ru = """Адрес TCP-соединения теперь адрес балансировщика, а не клиента, так что вариант «как на границе» превращает всех клиентов в одного и ломает лимит. Первый элемент пишет сам клиент, и подделать его проще всего. Правило такое: доверять можно только тому, что дописал свой прокси, поэтому список разбирается справа, и первый недоверенный адрес справа это и есть клиент. Отказываться от IP не нужно: для лимитов он остаётся полезным сигналом, просто не единственным."""
hint.ru = """Кому из авторов элементов списка ты можешь доверять?"""

[[exercises]]
name = "svgw_grpc"
kind = "project"
style = "todo"
locked = ["src/microservices/api-gateway/tests/acceptance.rs"]
hint.ru = [
  """Канал tonic это дешёвый клонируемый дескриптор одного HTTP/2-соединения. `Endpoint::connect_lazy` не открывает соединение сразу, а откроет его при первом вызове и дальше переиспользует. Клиента `UsersClient::new(channel.clone())` на каждый вызов создавать нормально.""",
  """Дедлайн ставится на запросе: `request.set_timeout(...)` кладёт заголовок `grpc-timeout`, и tonic сам прервёт вызов. Данные проверяй до обращения к сети: `data.get("id").and_then(Value::as_u64)`. Для metadata используй `MetadataValue::try_from(&str)`: строка может оказаться не ASCII.""",
]
why.ru = """Общий канал убирает рукопожатие из каждого вызова и позволяет пускать запросы по одному соединению параллельно. Дедлайн на самом вызове означает, что зависший сервис стоит ровно отведённое время, а не вечность. Перевод `Status` в ошибки шлюза делает то же, что в главе про ошибки: клиент получает собственные тексты и коды, а `PermissionDenied` при служебном вызове это поломка на нашей стороне, а не 403 для пользователя."""

[[exercises]]
name = "svgw_quiz"
kind = "project"
quiz = true
style = "scratch"
locked = ["src/microservices/api-gateway/tests/acceptance.rs"]
hint.ru = [
  """Собирай снизу вверх: `router`, `session`, `metadata`, `profile`, `proxy`, и только потом `gateway`. Каждый модуль почти повторяет задачу главы, тесты это подтвердят. В `Gateway::new` регистрируются три маршрута, и ошибка `build` с дубликатами пробрасывается наружу.""",
  """В `serve` заведи `JoinSet`, словарь `task::Id -> id кадра` и семафор на `max_in_flight`. На каждый кадр: разобрать, проверить срок сессии (при отказе ответ и выход из цикла), взять разрешение (`try_acquire_owned`, при отказе мгновенный `resource_exhausted`), запустить задачу. Ответы забирай из `join_next_with_id`: так и упавшая задача находит свой id.""",
]
why.ru = """Шлюз это место, где соединяются все решения главы: проверка токена один раз и срока на каждом кадре, типизированные маршруты с защитой на уровне регистрации, параллельная обработка с лимитом, доверенные metadata, агрегация с необязательными частями и обратный прокси с чисткой заголовков. Ни одно из них не выглядит сложным по отдельности, а ошибка в любом открывает шлюз: поэтому каждое закреплено тестом, который ловит именно ленивое решение (последовательность, отсутствие лимита, копирование клиентских заголовков)."""

