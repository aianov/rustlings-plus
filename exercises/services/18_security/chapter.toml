[chapter]
title.en = "Security"
title.ru = "Безопасность"

[[chapter.visuals]]
file = "visuals/ssrf_flow.html"
title.ru = "SSRF в превью ссылок: правильная проверка и три обхода"

[[exercises]]
name = "svsec1"
style = "fix"
hint.ru = '''Сколько разных ответов сейчас у входа и у восстановления пароля? Сделай так, чтобы наблюдателю снаружи нельзя было отличить случаи «аккаунт есть» и «аккаунта нет». Подумай и про текст, и про тип ошибки.'''
why.ru = '''Атакующему достаточно любого различия: слова в тексте, код ответа, тип ошибки, порядок полей. Поэтому проще всего иметь одну ошибку, одну формулировку и одно сообщение для всего неуспешного. Подробности «что именно не так» остаются в журнале сервера, а не в ответе. Регистрация («имя занято») тоже выдаёт, кто есть, но это отдельный компромисс между удобством и безопасностью, и здесь его не решаем.'''

[[exercises]]
name = "svsec2"
style = "fix"
hint.ru = [
  '''Тексты ответов уже одинаковы. Чем тогда отличаются два случая для наблюдателя со стороны, у которого нет доступа к коду, а есть только часы?''',
  '''Время выдаёт различие в объёме работы. Значит, объём работы должен быть одинаковым: пароль проверяется один раз и тогда, когда имя неизвестно.''',
  '''Для неизвестного имени нужна заготовка, с которой можно сравнить. Хеш заготовки готовь заранее, в конструкторе, тем же способом, что и настоящие. Результат такой проверки выбрасывай, вход для неизвестного имени не удаётся никогда, как бы ни совпал пароль.''',
]
why.ru = '''Случайная пауза не помогает: усреднив много замеров, атакующий вычитает шум. Помогает только одинаковая работа. Фиктивный хеш должен быть создан тем же алгоритмом с теми же параметрами, иначе дешёвый фиктивный хеш снова даст разницу во времени. Результат фиктивной проверки игнорируется принципиально: иначе пароль, случайно совпавший с заготовкой, впускал бы несуществующего пользователя. Тест считает вызовы проверки, потому что секундомер в тестах недостоверен.'''

[[exercises]]
name = "svsec_q1"
kind = "question"
question.ru = '''Адрес счёта в API выглядит так: `GET /invoices/5f1c2a2e-7b3d-4c1e-9a55-0c9a6a3e2b1d`, идентификатор это случайный UUID, который невозможно угадать. Нужно ли проверять, что счёт принадлежит вошедшему пользователю?'''
options.ru = [
  '''нет: UUID случайный, угадать его нельзя''',
  '''да: случайный идентификатор не авторизация, он может попасть в журнал, письмо, историю браузера или заголовок Referer''',
  '''да, но только для счетов с суммой больше порога''',
  '''нет, если соединение защищено TLS''',
]
answer = [1]
explain.ru = '''Секретность идентификатора это защита по неизвестности. Идентификатор не секрет: он есть в ссылках, которыми делятся, в журналах прокси, в письмах, в истории браузера, в заголовке Referer. Кто увидел его один раз, получает доступ навсегда. Право доступа должно проверяться по данным о владельце на каждом запросе. TLS защищает канал, но не решает, чей это счёт.'''
hint.ru = '''Где ещё кроме ответа сервера может оказаться идентификатор?'''

[[exercises]]
name = "svsec3"
style = "scratch"
hint.ru = [
  '''Две таблицы счётчиков: по паре (аккаунт, адрес) и по адресу. У каждого счётчика есть число неудач и момент, до которого нужно ждать. Формула задержки в условии, вынеси её в отдельную функцию.''',
  '''Каждая неудача увеличивает оба счётчика и пересчитывает «ждать до». Успех сбрасывает только пару, потому что общий счёт адреса копит и чужие неудачи с других аккаунтов. Проверка ничего не меняет и берёт самую позднюю из двух отметок.''',
  '''Показатель степени ограничь сверху (двадцати хватит) до возведения в степень, иначе при тысячах неудач сдвиг переполнится.''',
]
why.ru = '''Цена неудачи экспоненциальная и с потолком: первые ошибки (опечатки) бесплатны, потом задержка растёт, но не превращается в вечную блокировку. Два счётчика закрывают два сценария: подбор пароля к одному аккаунту и перебор многих аккаунтов с одного адреса. Успех сбрасывает только пару: иначе атакующий, у которого есть один рабочий аккаунт, обнулял бы общий счёт адреса при каждом удачном входе. Проверка не меняет состояние, иначе повторные проверки накручивали бы счётчик.'''

[[exercises]]
name = "svsec4"
style = "fix"
hint.ru = [
  '''Кто платит, когда пять неверных паролей посылает чужой человек? Представь себе, что ты хозяин аккаунта в этот момент.''',
  '''Цена неудач должна ложиться на того, кто их делает. Ключом счётчика должен быть не аккаунт, а пара «аккаунт, адрес», плюс отдельный счётчик адреса, чтобы перебор по разным аккаунтам тоже тормозил.''',
  '''Интерфейс остаётся прежним. Замени структуру счётчиков, формулу задержки (растущую и с потолком) и сброс по успеху (только пара).''',
]
why.ru = '''Блокировка по аккаунту превращает защиту в средство атаки: чтобы запереть хозяина, достаточно послать пять неверных паролей. Пара «аккаунт, адрес» разделяет хозяина и атакующего, а счётчик адреса останавливает того, кто перебирает разные аккаунты. Остаётся распределённый подбор с тысяч адресов: его блокировкой не победить, и там нужны другие меры (проверка по базам утечек, подтверждение входа с нового устройства).'''

[[exercises]]
name = "svsec5"
style = "fix"
hint.ru = [
  '''Для каждой из двух функций выпиши, кто имеет право и как это узнать по данным. Какие ответы допустимы для остальных?''',
  '''Комментарий удаляет его автор или автор поста под ним; черновик читает только его автор. Ответ «запрещено» подтверждает существование объекта, поэтому для секретного объекта он недопустим.''',
  '''Сначала вход (иначе `Unauthorized`), потом поиск объекта, потом права. Для черновика чужого пользователя ответ должен совпасть с ответом про несуществующий пост.''',
]
why.ru = '''Проверка «вошёл ли пользователь» отвечает на вопрос «кто ты», а не «что тебе можно». Права берутся из данных (автор комментария, автор поста), а не из запроса. Для секретных объектов отказ маскируется под «не найдено»: разный ответ для чужого и несуществующего объекта сам становится утечкой. Комментарии открытые, поэтому там честное «запрещено» допустимо и полезно клиенту.'''

[[exercises]]
name = "svsec_q2"
kind = "question"
question.ru = '''Вход отвечает одинаковым текстом, но на несуществующее имя за 1 мс, а на существующее с неверным паролем за 60 мс (медленное хеширование). Что надёжно устранит утечку?'''
options.ru = [
  '''добавить к каждому ответу случайную паузу от 0 до 100 мс''',
  '''для неизвестного имени выполнять такую же проверку пароля по заготовленному фиктивному хешу''',
  '''возвращать разные коды для разных случаев, чтобы клиент мог их различать честно''',
  '''скрыть время ответа в заголовках''',
]
answer = [1]
explain.ru = '''Случайная пауза только размывает: атакующий делает много запросов и усредняет, а разница в 60 мс остаётся различимой в среднем. Надёжно уравнивает только одинаковая работа. Разные коды ответа ухудшают дело (это ровно та утечка, от которой защищаемся). Заголовки со временем здесь вообще ни при чём: сервер его не пишет, атакующий меряет сам.'''
hint.ru = '''Что останется неизменным, если много раз повторить замер со случайной паузой?'''

[[exercises]]
name = "svsec6"
style = "fix"
hint.ru = [
  '''Что произойдёт, если значение содержит `\r\n`? Как ответ будет разобран клиентом и промежуточным сервером?''',
  '''Значение заголовка может содержать любые символы, кроме управляющих (разрешена табуляция). Имя заголовка ещё уже: латинские буквы, цифры и несколько знаков. Любой выход за пределы это отказ, а не «починка».''',
  '''Одиночные `\r` и `\n` и нулевой байт тоже опасны: не все разборщики требуют полную пару. Проверяй по символам, а не по подстроке `\r\n`.''',
]
why.ru = '''Внедрение в заголовки работает потому, что протокол текстовый: структура задаётся символами в самих данных. Проверка на «\r\n» подстрокой пропускает одиночный «\n», который многие реализации считают концом строки. Отказ лучше «очистки»: вычищенное значение молча меняет данные и прячет атаку, а отказ виден в журнале и тестах. Для имён заголовков разрешён узкий алфавит, и не только ради безопасности: любое отклонение это уже не HTTP.'''

[[exercises]]
name = "svsec7"
style = "fix"
hint.ru = [
  '''Что произойдёт с журналом, если в нике есть перевод строки? Сколько физических строк и сколько записей получится?''',
  '''Значения нужно закодировать так, чтобы запись всегда была одной строкой, а разбор возвращал исходное значение. Для этого экранируют сам знак экранирования (обратную черту), кавычку и управляющие символы.''',
  '''Порядок важен: обратную черту экранируй как отдельный случай в том же проходе, а не заменой по строке до остальных, иначе получишь двойное экранирование. Остальные управляющие символы запиши в виде `\u{код}`.''',
]
why.ru = '''Экранирование должно быть однозначным: разные значения дают разные записи. Если и перевод строки, и текст «\n» превращаются в одну и ту же строку, записи различить нельзя, а журнал это улика. Поэтому обратная черта экранируется тоже. Кавычки вокруг значений нужны, чтобы граница значения была видна и пробелы внутри не путали разбор. Одна запись это одна физическая строка: большинство инструментов (grep, агрегаторы) на это опираются.'''

[[exercises]]
name = "svsec8"
style = "scratch"
hint.ru = [
  '''Разбор адреса по частям: схема, всё до первой косой или вопроса (это «authority»), потом путь. В authority не должно быть `@`. Порт по умолчанию зависит от схемы, разрешены только 80 и 443.''',
  '''Имя, которое не является IP-адресом, должно выглядеть как имя: из букв, цифр, дефиса, точки, и последняя его часть содержит букву (иначе `2130706433` и `0x7f000001` пройдут как «имя»). Дальше имя уходит в резолвер.''',
  '''Каждый из полученных адресов проверь отдельно: IPv4-отображённые IPv6 (`::ffff:127.0.0.1`) надо проверять как встроенный IPv4. Не забудь про служебные диапазоны: 100.64/10, 169.254/16, 192.0.0.0/24, 198.18/15, 240/4, широковещательный и документационные, у IPv6 уникальные локальные fc00::/7, link-local fe80::/10.''',
]
why.ru = '''Проверка списком запрещённых слов обречена: адрес можно записать десятком способов. Правильная проверка идёт по результату, то есть по IP, с которым будет соединение, и применяется ко ВСЕМ адресам, в которые превращается имя (достаточно одного частного, чтобы отказать). Правило про число на конце имени закрывает целый класс записей, которые библиотека соединения понимает, а твой разбор нет. Возвращаемый `Target` содержит IP не для красоты: соединяться надо именно с ним (следующая задача).'''

[[exercises]]
name = "svsec_q3"
kind = "question"
question.ru = '''Сервис превью проверил имя `news.example.org`: DNS ответил `93.184.216.34`, адрес публичный, проверка пройдена. После этого HTTP-клиент соединяется с адресом по имени (сам снова спрашивает DNS). Что может пойти не так?'''
options.ru = [
  '''ничего: проверка уже пройдена''',
  '''атакующий владеет доменом и DNS-сервером: второй ответ может быть 127.0.0.1, и соединение пойдёт во внутреннюю сеть''',
  '''клиент может не поддерживать IPv6''',
  '''ответ может быть слишком большим''',
]
answer = [1]
explain.ru = '''Это DNS rebinding: ответ DNS не обязан быть одним и тем же при двух запросах (TTL 0), и тот, кто контролирует зону, подсовывает разные адреса. Проверка и соединение должны видеть одно и то же, поэтому DNS спрашивают один раз, проверяют полученные адреса, а соединяются с проверенным IP, оставляя имя только для заголовка `Host` и TLS.'''
hint.ru = '''Что отличает первый DNS-запрос (проверка) от второго (соединение) и кто может на это повлиять?'''

[[exercises]]
name = "svsec9"
style = "fix"
hint.ru = [
  '''Выпиши, сколько раз код спрашивает DNS и кто принимает решение о безопасности каждый раз. Что происходит после ответа 3xx?''',
  '''Готовая функция проверки адреса уже есть. Её результат содержит IP: соединяйся с ним, а не с именем. На каждом редиректе проверка начинается заново, а число переходов ограничено.''',
  '''Относительный `Location` остаётся на проверенном хосте и не требует новой проверки DNS. Абсолютный идёт через ту же проверку, что и исходная ссылка. Не забудь про статус ответа (принимаем только 200) и про размер тела.''',
]
why.ru = '''Каждое звено цепочки «разобрать, разрешить, проверить, соединиться» должно получать результат предыдущего, а не повторять его своими силами: стоит повторить DNS, и проверенное перестаёт быть тем, к чему идёт соединение. Редирект это новая ссылка, поэтому она проходит весь путь заново, а предел числа переходов защищает от циклов. Лимит размера и проверка статуса не про SSRF, но превью без них становится способом занять сервис.'''

[[exercises]]
name = "svsec10"
style = "fix"
hint.ru = [
  '''Что браузер делает с куки при открытии WebSocket с чужого сайта и что в этот момент знает сервер, кроме куки? Как проверить, откуда пришёл скрипт?''',
  '''Origin сравнивается с белым списком целиком и после нормализации: схема и имя без учёта регистра, стандартный порт можно не писать. Любые лишние части (путь, `user@`, пробелы, обратная косая) это уже не Origin.''',
  '''Правило про отсутствие заголовка зависит от способа входа: при куки браузер всегда шлёт Origin, поэтому его отсутствие подозрительно. Клиенты с токеном в заголовке (не браузеры) его могут не слать.''',
]
why.ru = '''Политика same-origin не распространяется на рукопожатие WebSocket, поэтому единственная защита это проверка Origin на сервере. Подстрока не годится, потому что имя, начинающееся или заканчивающееся нужной строкой, может принадлежать кому угодно. Нормализация нужна, чтобы законный `HTTPS://APP.EXAMPLE.COM:443` не отваливался, но она не должна делать чужие значения «похожими на наши». Отдельная ветка для клиентов без куки сохраняет работу приложений и скриптов, но присутствующий Origin проверяется всегда.'''

[[exercises]]
name = "svsec_q4"
kind = "question"
question.ru = '''При запросе с credentials браузер отвергает ответ с `Access-Control-Allow-Origin: *`. Разработчик «исправил» это тем, что сервер теперь подставляет в этот заголовок значение пришедшего `Origin` и добавляет `Access-Control-Allow-Credentials: true`. Что получилось?'''
options.ru = [
  '''всё исправлено: это стандартный приём''',
  '''любой сайт теперь может запрашивать API от имени вошедшего пользователя и читать ответы''',
  '''ничего не изменилось, браузер всё равно блокирует''',
  '''безопасно, если включён TLS''',
]
answer = [1]
explain.ru = '''Отражение любого Origin вместе с credentials эквивалентно «разрешить всем»: браузер видит совпадение и позволяет чужой странице читать ответ. Ошибка про `*` как раз защищала от этого. Правильное исправление это белый список точных значений и `Vary: Origin`, чтобы кэш не раздавал ответ одного сайта другому.'''
hint.ru = '''Что именно браузер сравнивает при проверке CORS-заголовков и кто управляет значением?'''

[[exercises]]
name = "svsec11"
style = "fix"
hint.ru = [
  '''Что получит страница на `evil.com`, если сервер отражает любой Origin вместе с `Access-Control-Allow-Credentials: true`? Что должно отличаться для сайтов вне списка?''',
  '''Для сайтов вне белого списка разрешающих заголовков нет вообще: не `false`, не пустое значение, а отсутствие. Сравнение со списком точное, и значение `null` в список не входит.''',
  '''Preflight проверяет три вещи: Origin, метод и каждый запрошенный заголовок. Одного лишнего заголовка достаточно для отказа. Не забудь `Vary`.''',
]
why.ru = '''CORS не защищает сервер, а ослабляет защиту браузера для избранных. Поэтому всё, что не разрешено явно, остаётся запрещённым, и ответ для чужих выглядит так, будто CORS нет. `Vary: Origin` нужен для кэшей: без него ответ, сформированный для одного сайта, достаётся другому. Списки методов и заголовков в preflight конечные и точные: `*` вместе с credentials не работает и не должно.'''

[[exercises]]
name = "svsec12"
style = "fix"
hint.ru = [
  '''Что в запросе с чужой страницы ты не можешь подделать, а что можешь? Какое свойство запроса отличает «наш фронтенд» от формы на сайте атакующего?''',
  '''Первое: атрибуты куки (`HttpOnly`, `Secure`, `SameSite=Strict`, узкий `Path`) не отправляют её с чужих сайтов и прячут от скриптов. Второе: свой заголовок, который чужая страница не добавит без разрешения CORS.''',
  '''Третье: если браузер прислал `Sec-Fetch-Site` или `Origin`, они не должны указывать на чужой сайт. Но их отсутствие не повод отказывать: старые браузеры их не шлют, а свой заголовок их заменяет.''',
]
why.ru = '''Защита от CSRF многослойна, потому что каждый слой покрывает чужой пробел. `SameSite` не работает в старых браузерах и не защищает от подделки внутри одного сайта (поддомены). Свой заголовок надёжен в любом браузере, потому что без CORS его добавить может только страница с нашего Origin. Метаданные запроса (`Origin`, `Sec-Fetch-Site`) сообщает сам браузер, и они не подделываются скриптом. Обновление токена методом GET было бы дырой: у `Lax` куки отправляются при переходе по ссылке.'''

[[exercises]]
name = "svsec_q5"
kind = "question"
question.ru = '''Кука сессии выставлена с `SameSite=Lax`. Эндпоинт `GET /account/delete-all-posts` удаляет посты по куки. На чужом сайте есть ссылка «Посмотреть котиков», ведущая на этот адрес. Что случится при клике вошедшего пользователя?'''
options.ru = [
  '''ничего: Lax запрещает отправку куки с чужих сайтов''',
  '''посты удалятся: при переходе по ссылке верхнего уровня методом GET куки с Lax отправляются''',
  '''браузер покажет предупреждение''',
  '''запрос будет отклонён из-за CORS''',
]
answer = [1]
explain.ru = '''`SameSite=Lax` отправляет куки при переходах верхнего уровня безопасными методами (прежде всего GET), потому что иначе ссылки на твой сайт приходили бы с разлогиненным пользователем. CORS тут ни при чём: это обычная навигация, а не запрос скрипта. Правило: GET ничего не меняет, а изменяющие запросы идут методами POST, PUT, DELETE и защищаются отдельно.'''
hint.ru = '''Какие запросы разрешает Lax отправлять с куки с другого сайта?'''

[[exercises]]
name = "svsec13"
style = "fix"
hint.ru = [
  '''Что делает первая строка `read_body`, когда объявленная длина огромна? Сколько памяти потребляет тысяча таких соединений?''',
  '''Предел проверяется до выделения: число из сети нельзя использовать как размер буфера, пока оно не проверено. Читать нужно не больше объявленной длины, но и не заранее выделять её целиком, если предел не мал.''',
  '''В `parse_post` предел размера тела проверяй до разбора (иначе миллион тегов уже разобран к моменту, когда ты считаешь их), а количество и длину тегов после. Длину тега считай в символах, а не в байтах.''',
]
why.ru = '''Любое число из сети недоверенное. Предел до выделения означает, что атакующий не может заставить тебя тратить память, не потратив собственного трафика. Проверка размера тела до разбора отсекает класс атак на сам парсер, а количество и длины элементов защищают то, что выросло после разбора. Глубокая вложенность останавливается ограничением глубины в `serde_json`: она возвращает ошибку, а не падает со стеком.'''

[[exercises]]
name = "svsec_q6"
kind = "question"
question.ru = '''Сервис читает первые четыре байта как длину сообщения и выделяет под тело буфер ровно этой длины. Атакующий открывает тысячу соединений, в каждом присылает длину 50 000 000 и больше ничего не отправляет. Что произойдёт?'''
options.ru = [
  '''ничего: тела нет, нечего обрабатывать''',
  '''сервис выделит около 50 ГБ памяти под пустые буферы и, скорее всего, упадёт''',
  '''соединения закроются по таймауту без последствий''',
  '''всё зависит от количества ядер''',
]
answer = [1]
explain.ru = '''Атакующий платит четырьмя байтами за каждое соединение, а сервис выделяет по 50 МБ. Тысяча соединений это 50 ГБ. Лечится проверкой длины до выделения (предел известен заранее) и чтением по мере поступления данных, а не резервированием под заявленное. Таймаут тоже нужен, но уже после: до его срабатывания память занята.'''
hint.ru = '''Сколько байт отправил атакующий и сколько памяти выделил сервис?'''

[[exercises]]
name = "svsec14"
style = "fix"
hint.ru = [
  '''Почему число шагов растёт так быстро? Что делает рекурсия на каждой звёздочке и сколько раз она пересчитывает одно и то же?''',
  '''Звёздочке не нужно перебирать все варианты. Достаточно запомнить место последней звёздочки и, если дальше не сошлось, сдвинуть её на один символ. Раньше последней звёздочки возвращаться не нужно.''',
  '''Идёшь по шаблону и тексту двумя указателями. Совпал символ или `?`, двигаешь оба. Звёздочка: запомни её позицию и позицию в тексте, шаблон двигай дальше. Не сошлось: вернись к запомненной звёздочке и пусть она поглотит ещё один символ. В конце проверь, что в шаблоне остались только звёздочки.''',
]
why.ru = '''Рекурсия с возвратом пересчитывает одно и то же состояние (позиция шаблона, позиция текста) экспоненциальное число раз. Жадный алгоритм с возвратом лишь к последней звёздочке корректен благодаря тому, что звёздочка поглощает любое: если с последней звёздочкой не сошлось, предыдущие уже ничем не помогут, потому что ту же работу сделала бы последняя. Время получается не больше произведения длин. Тест гоняет вход в отдельном потоке с таймаутом, потому что зависшее решение иначе зависило бы вместе с тестом.'''

[[exercises]]
name = "svsec_audit"
kind = "project"
quiz = true
style = "fix"
locked = ["src/crates/socialsec/tests/audit.rs"]
hint.ru = [
  '''Прогони тесты и посмотри, какие падают: каждое имя говорит, что должно быть невозможно. Закрывай по одному и после каждого прогоняй весь набор, в нём есть тест, который проверяет, что обычная работа не сломалась.''',
  '''Все дыры лежат в `api.rs`, а кирпичи для их закрытия (`check_url`, `Throttle`, типажи `Net` и `Hasher`) уже подключены. Для вывода в HTML и в журнал тебе понадобятся свои функции экранирования; в журнале экранирование должно быть однозначным.''',
  '''Порядок защит имеет значение. Вход: сначала задержка после неудач, потом проверка пароля (одинаковая работа для известного и неизвестного имени), потом реакция. Превью: разобрать, спросить DNS один раз, проверить все адреса, соединиться с проверенным, проверить статус и размер. Остальное разбирай по тестам.''',
]
why.ru = '''Аудит это обход всех границ по одной и вопрос к каждой: что будет, если вход окажется самым неудобным. Здесь почти каждая дыра имеет один и тот же корень: код доверяет данным, пришедшим снаружи (имя, путь, заголовок, число, адрес) или принимает решение по неподходящему признаку (вошёл, а не владелец; строка, а не IP). Тесты-эксплойты закрепляют каждую поломку, а тест обычной работы страхует от лечения хуже болезни. Чем раньше в цепочке стоит проверка, тем дешевле отказ.'''

