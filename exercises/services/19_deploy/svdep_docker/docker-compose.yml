services:
  nats:
    image: nats:2.10
    ports:
      - "4222:4222"
  post-service:
    build: .
    ports:
      - "8081:8080"
    environment:
      DATABASE_PASSWORD: hunter2
      NATS_URL: nats://nats:4222
    depends_on:
      - nats
  api-gateway:
    build: .
    ports:
      - "8080:8080"
    environment:
      NATS_URL: nats://nats:4222
    depends_on:
      - post-service
