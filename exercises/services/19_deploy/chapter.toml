[[exercises]]
name = "svdep1"
style = "todo"
hint.ru = [
  '''Процесс пишет в два потока. Что случится с процессом, если ты читаешь только один из них, а он много пишет во второй?''',
  '''Оба потока нужно сделать `piped` и читать одновременно: два читателя, которые построчно пишут в общий приёмник со своей меткой. Код выхода берётся у процесса после того, как оба потока дочитаны до конца.''',
  '''Читатель строит строки через `BufReader::lines()` или `read_line`: тогда последняя строка без перевода тоже приходит. Два читателя запускаются через `tokio::join!`, у убитого сигналом процесса `code()` равен `None`.''',
]
why.ru = '''Канал между процессами маленький, поэтому последовательное чтение (сначала stdout до конца, потом stderr) зависает на болтливом stderr: ребёнок стоит на записи, а ты ждёшь конца stdout. Два одновременных читателя снимают эту проблему. Метки разные для stdout и stderr, чтобы ошибки было видно в общем потоке. `kill_on_drop(true)` страхует от сирот, если лаунчер бросит ожидание.'''

[[exercises]]
name = "svdep2"
style = "fix"
hint.ru = [
  '''Пауза угадывает время старта. Что на самом деле означает «можно запускать следующего»?''',
  '''Сервис запускается, когда готовы все его зависимости, а готовность это ответ `ready`, а не прошедшее время. До запуска проверь граф: неизвестная зависимость и цикл это ошибка без единого запуска. Независимые сервисы стартуют одновременно.''',
  '''Заведи у каждого сервиса `watch`-канал «готов». Задача сервиса ждёт `wait_for` у каналов зависимостей, запускает свой, опрашивает готовность до срока и отправляет `true`. Все задачи собираются в `try_join_all`, тогда первая `NotReady` обрывает остальных.''',
]
why.ru = '''Ожидание по графу запускает связку так быстро, как позволяют зависимости, и никогда раньше. Проверка графа до запуска нужна, чтобы цикл или опечатка не превратились в вечное ожидание после старта половины сервисов. `watch` хранит последнее значение, поэтому зависимый, который подписался позже, чем сервис стал готов, не пропускает событие. Срок готовности превращает «висим» в понятную ошибку с именем виновника.'''

[[exercises]]
name = "svdep3"
style = "todo"
hint.ru = [
  '''Кого безопасно остановить первым: того, от кого зависят другие, или того, от кого не зависит никто?''',
  '''Сервис останавливается, когда остановлены все сервисы, которые от него зависят. Независимые ветки останавливаются одновременно. Каждый получает SIGTERM, а если не вышел за `grace`, его добивают SIGKILL.''',
  '''Тот же приём с `watch`-каналами, что при запуске, только стрелки наоборот: ждать надо каналы зависимых. После `term` опрашивай `exited` с короткой паузой до срока, по сроку `kill` и запись в `killed`. Порядок в отчёт пиши в момент отправки SIGTERM.''',
]
why.ru = '''Обратный порядок даёт зависимым время дослать то, что им нужно отправить через ещё живые сервисы. Срок grace обязателен: без него один зависший процесс держит остановку всей связки. SIGTERM, а не SIGKILL сразу, потому что сервису нужно закрыть соединения и сбросить буферы. Независимые ветки идут параллельно, иначе остановка длится сумму всех grace.'''

[[exercises]]
name = "svdep4"
style = "fix"
hint.ru = [
  '''Что происходит с дочерними процессами, когда родитель завершается? И что с их собственными детьми?''',
  '''Уборка нужна в `Drop` лаунчера: он выполняется и при панике. Убить надо не только детей, но и всё, что они породили, а значит, детей стоит запускать в собственной группе процессов.''',
  '''`CommandExt::process_group(0)` делает ребёнка лидером новой группы. В `Drop` отправь сигнал всей группе (отрицательный PID в `kill`), затем `kill` и `wait` самого ребёнка, чтобы не осталось зомби.''',
]
why.ru = '''В Unix дети не умирают вместе с родителем, поэтому лаунчер без уборки оставляет после падения процессы с занятыми портами. Группа процессов нужна, потому что сервис может запускать свои подпроцессы (скрипт, который запускает бинарь), и сигнал одному ребёнку их не достанет. `wait` после `kill` подбирает процесс, иначе в таблице процессов остаётся зомби. От SIGKILL самого лаунчера `Drop` не спасает: это работа супервизора.'''

[[exercises]]
name = "svdep5"
style = "todo"
hint.ru = [
  '''Что должна ответить проверка, если сервер принял соединение и замолчал? А если прислал не HTTP?''',
  '''Весь обмен (подключение, запрос, чтение строки статуса) живёт под одним сроком. Ответ 0 только для статуса 2xx из строки, которая начинается с `HTTP/1.`; всё остальное, включая ошибки и мусор, это 1.''',
  '''Запрос `GET <путь> HTTP/1.1` с `Host` и `Connection: close`. Читай кусками, пока в накопленном нет `\r\n` (и с пределом размера), потом раздели строку статуса по пробелам и разбери второе слово как число. Оберни всё в `tokio::time::timeout`.''',
]
why.ru = '''Healthcheck опасен в двух направлениях. Зависшая проверка задерживает решения Docker и сама становится источником проблем, поэтому срок один на весь обмен, а не только на подключение. Проверка, которая на непонятный ответ говорит «здоров», хуже отсутствия проверки: она прячет поломку. Строгий разбор строки статуса и ответ 1 на всё сомнительное делают её честной.'''

[[exercises]]
name = "svdep6"
style = "todo"
hint.ru = [
  '''Какие варианты конфигурации возможны для одного секрета, и какие из них ошибочны?''',
  '''Ровно один источник: `NAME` или `NAME_FILE`. Оба сразу и ни одного это разные ошибки. Из файла снимается один перевод строки на конце, пустое значение это ошибка. `Debug` у секрета значение не показывает.''',
  '''Разбери пару `(env.get(name), env.get(&format!("{name}_FILE")))` через `match` на четыре случая. Для файла `strip_suffix('\n')`, затем `strip_suffix('\r')`. В `impl Debug` пиши заглушку вместо значения.''',
]
why.ru = '''Файл вместо переменной убирает секрет из compose-файла, `docker inspect` и окружения дочерних процессов. Строгость важна: два заданных источника означают, что кто-то думает, что работает один, а работает другой. Перевод строки из редактора ломает пароль незаметно. Секрет без печати в `Debug` защищает от самой частой утечки: строки журнала с выводом всей конфигурации.'''

[[exercises]]
name = "svdep7"
style = "fix"
hint.ru = [
  '''Круг всегда выбирает следующего по порядку. Что ему нужно знать об экземпляре, чтобы пропустить его?''',
  '''У экземпляра нужны счётчик неудач подряд, момент, до которого он выведен, и признак «проба уже отправлена». После паузы ему уходит одна проба; её неудача сразу выводит снова, удача возвращает в круг.''',
  '''В выборе обходи экземпляры начиная с `next`: здоровый берётся сразу; выведенный, у которого пауза прошла и пробы нет, берётся как проба. В `report` удача обнуляет всё, неудача увеличивает счётчик и выводит на `cooldown` по порогу или если это была проба.''',
]
why.ru = '''Наивный круг отправляет в упавший экземпляр свою долю запросов вечно. Вывод из ротации по нескольким неудачам подряд (а не по одной) не реагирует на случайную ошибку. Одна проба после паузы, а не вся доля сразу, не обрушивает экземпляр, который только поднимается. Время аргументом делает логику проверяемой без настоящих часов.'''

[[exercises]]
name = "svdep8"
style = "fix"
hint.ru = [
  '''В какой момент экземпляр перестаёт получать новые запросы, и что происходит с уже начатыми, если его остановить раньше?''',
  '''Сначала экземпляр выходит из круга, потом дорабатывает начатые запросы, потом перезапускается, ждёт готовности и только тогда возвращается. Следующий экземпляр трогать после этого.''',
  '''Перед остановкой `set_serving(false)` и ожидание `in_flight() == 0` с коротким интервалом под сроком слива. После запуска дождись готовности и только потом `set_serving(true)`.''',
]
why.ru = '''Пока экземпляр в круге, балансировщик шлёт ему запросы, и любая остановка их обрывает. Вывод из круга до остановки и слив начатых запросов делают перезапуск невидимым. Срок слива нужен, чтобы один зависший запрос не остановил выкат навсегда. По одному экземпляру, чтобы в круге всё время оставались готовые.'''

[[exercises]]
name = "svdep_q1"
kind = "question"
question.ru = '''В Dockerfile последняя строка `ENTRYPOINT ./shopd --port 8080`. Сервис умеет мягко останавливаться по SIGTERM, но `docker stop` всегда ждёт 10 секунд, а в логах нет ни строчки про остановку. В чём причина?'''
options.ru = [
  '''Docker по умолчанию шлёт SIGKILL, а не SIGTERM''',
  '''Строковая форма запускает процесс через `/bin/sh -c`, PID 1 это оболочка, и она не передаёт SIGTERM сервису''',
  '''Сервис не успевает дослать ответы за 10 секунд''',
  '''Порт 8080 занят, и сервис не стартовал''',
]
answer = [1]
explain.ru = '''Строковая (shell) форма `ENTRYPOINT` и `CMD` запускает `/bin/sh -c "..."`. Первым процессом в контейнере становится оболочка, сигнал получает она и не пересылает его дальше. Через 10 секунд Docker шлёт SIGKILL. Исправление: exec-форма `ENTRYPOINT ["./shopd", "--port", "8080"]`.'''
hint.ru = '''Кто в контейнере процесс с PID 1 при строковой форме?'''

[[exercises]]
name = "svdep_q2"
kind = "question"
question.ru = '''В compose у сервиса заказов написано `depends_on: [postgres]`. Иногда при `docker compose up` заказы падают на старте с `connection refused`, хотя Postgres в итоге поднимается. Что нужно, чтобы это прекратилось?'''
options.ru = [
  '''Ничего: `depends_on` уже ждёт готовности Postgres, ошибка в чём-то другом''',
  '''Добавить `restart: always` к Postgres''',
  '''Добавить Postgres `healthcheck` и написать `depends_on` с `condition: service_healthy`''',
  '''Поменять порядок сервисов в файле: Postgres выше''',
]
answer = [2]
explain.ru = '''Простая форма `depends_on` ждёт только запуска контейнера, а не готовности процесса внутри. Готовность Docker узнаёт из `healthcheck`, а ждать её велит `condition: service_healthy`. Порядок в файле ни на что не влияет. Сам сервис при этом всё равно стоит учить переживать временную недоступность базы.'''
hint.ru = '''Чего именно ждёт короткая форма `depends_on`: контейнера или готового сервиса?'''

[[exercises]]
name = "svdep_q3"
kind = "question"
question.ru = '''Лаунчер читает вывод ребёнка так: сначала `stdout` до конца, потом `stderr` до конца, потом `wait()`. С обычными логами всё работает, а с `RUST_LOG=debug` (логи идут в stderr) сервис зависает на старте и даже не открывает порт. Почему?'''
options.ru = [
  '''В режиме debug сервис медленнее и не успевает в срок''',
  '''Канал stderr заполнился, ребёнок встал на записи в него, а лаунчер всё ещё ждёт конца stdout, который не наступит''',
  '''`RUST_LOG` меняет порт сервиса''',
  '''Лаунчер не может прочитать stderr, пока процесс не завершится''',
]
answer = [1]
explain.ru = '''Канал между процессами имеет небольшой буфер. Когда он полон, запись в него блокируется. Ребёнок ждёт, пока кто-нибудь прочитает stderr, лаунчер ждёт конца stdout: взаимная блокировка. Оба потока надо читать одновременно.'''
hint.ru = '''Что происходит с процессом, который пишет в канал, когда этот канал никто не читает?'''

[[exercises]]
name = "svdep_q4"
kind = "question"
question.ru = '''Какая последовательность выкатывает новую версию на один экземпляр из трёх без потерь запросов?'''
options.ru = [
  '''остановить, запустить новую версию, вернуть в круг, дождаться готовности''',
  '''вывести из круга, остановить, запустить, вернуть в круг, дождаться готовности''',
  '''вывести из круга, дождаться окончания начатых запросов, остановить, запустить, дождаться готовности, вернуть в круг''',
  '''запустить новую версию рядом, остановить старую, дождаться готовности новой''',
]
answer = [2]
explain.ru = '''Пока экземпляр в круге, ему приходят запросы, поэтому из круга он выходит первым. Начатые запросы надо доработать до остановки. Новая версия возвращается в круг только после готовности, иначе первые запросы попадут в непрогретый процесс. Вариант с запуском рядом тоже бывает (blue-green), но в нём старую останавливают после готовности новой и переключения трафика, а не до.'''
hint.ru = '''Пройди по шагам и спроси на каждом: куда сейчас идут новые запросы и что будет с начатыми?'''

[[exercises]]
name = "svdep_q5"
kind = "question"
question.ru = '''В Dockerfile есть `COPY . .`, а следующей строкой `RUN rm -f .env`. В `.env` лежит пароль от базы. Окажется ли пароль в готовом образе?'''
options.ru = [
  '''Нет: файл удалён, в образе его нет''',
  '''Да: пароль остаётся в слое, созданном `COPY`, и достаётся оттуда, даже если следующий слой файл удалил''',
  '''Только если сборка шла без кэша''',
  '''Только в многоэтапной сборке''',
]
answer = [1]
explain.ru = '''Образ это стопка слоёв, и каждый слой хранится целиком. `RUN rm` создаёт новый слой с пометкой «файл удалён», но предыдущий слой с файлом никуда не девается, его можно вытащить через `docker save`. Секреты не должны попадать в контекст сборки: `.dockerignore` и секреты сборки (`RUN --mount=type=secret`).'''
hint.ru = '''Как устроен образ: одно состояние файловой системы или стопка изменений?'''

[[exercises]]
name = "svdep_q6"
kind = "question"
question.ru = '''Лаунчер запускает детей в своих группах процессов и в `Drop` убивает группы. Его процесс завершили командой `kill -9 <pid лаунчера>`. Что стало с запущенными сервисами?'''
options.ru = [
  '''Они остановлены: `Drop` выполняется при любом завершении''',
  '''Они остановлены: дети всегда умирают вместе с родителем''',
  '''Они продолжают работать: SIGKILL не даёт процессу выполнить ни `Drop`, ни обработчики сигналов''',
  '''Они остановлены, если лаунчер собран в release''',
]
answer = [2]
explain.ru = '''SIGKILL нельзя перехватить: ядро снимает процесс сразу, никакой код лаунчера, включая `Drop`, не выполняется. Дети при этом живут дальше. От этого защищают механизмы снаружи процесса: `PR_SET_PDEATHSIG` в Linux, супервизор (systemd, Docker), который владеет группой процессов или cgroup.'''
hint.ru = '''Может ли процесс сделать что-нибудь в ответ на SIGKILL?'''

[[exercises]]
name = "svdep_docker"
kind = "project"
style = "fix"
locked = ["crates/dockercheck/tests/files.rs"]
hint.ru = [
  '''Прогони тесты: каждый падающий называет одну проблему образа или compose. Чини по одному, Docker для этого не нужен, тесты читают текст файлов.''',
  '''Образ: два этапа, манифесты раньше исходников, release-сборка, непривилегированный `USER`, exec-форма `ENTRYPOINT`, `HEALTHCHECK` через свой бинарь. В `.dockerignore` то, что не должно попасть в контекст: `target`, `.git`, `.env`. В compose `depends_on` с условием готовности и только нужные порты наружу.''',
  '''Кэш зависимостей делается заглушкой: скопировать `Cargo.toml` и `Cargo.lock`, создать пустой `main.rs`, собрать, затем скопировать настоящие исходники, обновить время файлов и собрать ещё раз. Пароль уходит в `secrets` compose-файла, а сервис читает `*_FILE`.''',
]
why.ru = '''Каждая проблема этого образа встречается в проде постоянно. Многоэтапная сборка уменьшает образ в десятки раз и убирает компилятор с поверхности атаки. Порядок слоёв решает, сколько длится пересборка после правки одной строки. Exec-форма нужна, чтобы сигнал получил сервис, а не оболочка. `depends_on` без условия ждёт запуска контейнера, а не готовности, поэтому связка стартует «через раз».'''

[[exercises]]
name = "svdep_quiz"
kind = "project"
quiz = true
style = "todo"
locked = ["src/crates/devctl/tests/stack.rs"]
hint.ru = [
  '''Это три задачи главы в одном месте: запуск по графу, остановка против стрелок и выкат по одному. Готовые помощники в `stack.rs` уже умеют ждать готовность и останавливать экземпляр.''',
  '''`up`: граф проверяется до запуска, сервис стартует всеми экземплярами, когда готовы его зависимости, готовый экземпляр входит в круг, при сроке остановить запущенное. `down`: зависимые раньше, независимые вместе. `restart`: по одному экземпляру, сначала из круга, потом слив, потом остальное.''',
  '''Для обоих порядков удобны `watch`-каналы по сервисам и `join_all`/`try_join_all` по задачам сервисов. Если `up` упал на чьей-то готовности, вызови `down` для того, что уже запущено, и верни `NotReady` с именем экземпляра.''',
]
why.ru = '''Лаунчер связки складывается из тех же кирпичей, что задачи главы, но вместе они ломаются по-новому: откат запуска должен остановить уже поднятое в правильном порядке, а выкат обязан держать в круге готовые экземпляры, пока один из них перезапускается. Подмена `Backend` с замороженным временем позволяет проверить порядок и параллельность точно, без процессов и сети.'''

[[exercises]]
name = "svdep_exam"
kind = "project"
style = "scratch"
exam = true
locked = ["tests/acceptance.rs"]
why.ru = """Экзамен собирает раздел в одну службу. Слои разделены: конфиг и секреты отдельно, проверка входа отдаёт все ошибки с путями полей, ошибки API имеют один формат с кодом и статусом. Ключи доступа хранятся хешами, арендаторы изолированы. Публикация идемпотентна по смыслу данных, а доставка фоновая, у каждой подписки своя очередь: так зависший получатель не трогает остальных, а порядок событий сохраняется. Повторы различают временные отказы (429, 5xx, сеть, срок) и окончательные, паузы растут до потолка, исчерпанное уходит в dead letter. Подпись HMAC от точных байт тела защищает получателя от подделки. Остановка сначала закрывает вход, потом доделывает начатое в пределах общего срока. Частые ошибки: повтор 4xx, общая очередь на все подписки, сравнение данных как строк с порядком ключей, срок только на подключение и остановка, которая ждёт зависшую попытку."""

