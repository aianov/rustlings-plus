test_command = ["cargo", "make", "check"]
requires = ["nats"]
hint.ru = [
"""Порядок подъёма это топологическая сортировка по сервисам, а не по экземплярам: сервис считается поднятым,
когда готовы все его экземпляры. Круг в зависимостях находится сам: на шаге нет ни одного готового к запуску.""",
"""Останавливай свой процесс через `Child::try_wait`, а чужой (из pid-файла прошлого запуска) через `kill -0`:
свой завершившийся процесс без `wait` остаётся зомби, и `kill -0` по нему отвечает «жив».""",
"""Шлюз выбирает реплику по кругу среди здоровых. Здоровье каждой реплики это свой `Readiness::supervised` с
одним upstream; пока наблюдение не запущено (тестовый `Ctx`), реплика считается здоровой.""",
"""В Dockerfile кэшируй реестр и `target` через `--mount=type=cache`, а в итоговый образ клади только два бинаря.
Запуск в exec-форме (`ENTRYPOINT ["/usr/local/bin/..."]`), иначе SIGTERM получит оболочка, а не сервис.""",
]
story.ru = """Соцсеть поднимается одной командой: devctl знает порядок и ждёт готовности, гасит без сирот и
перезапускает post-service по одному экземпляру, пока шлюз водит запросы в живой. Секреты приходят файлами, а для
другой машины есть образы и docker-compose со всем стеком."""
