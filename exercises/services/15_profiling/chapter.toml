[[exercises]]
name = "svprof1"
style = "scratch"
hint.ru = [
  '''Тебе нужна обёртка, которая сама реализует `Future`: опрашивает вложенную future и замеряет, сколько заняло именно это обращение. Вложенную future закрепи в куче (`Box::pin`), чтобы не возиться с закреплением полей.''',
  '''В `poll`: засечь время, опросить вложенную future, посмотреть, сколько прошло, обновить счётчики и вернуть результат вложенной future как есть. Счётчики лежат в общем `Arc`, чтобы к ним был доступ снаружи.''',
  '''Для самого долгого опроса подойдёт атомарное «взять большее» (`fetch_max`). Считай опрос медленным, если он строго длиннее порога.''',
]
why.ru = '''Сторож измеряет то, чего не видно ни в каких логах: сколько поток рантайма был занят одним опросом. Здоровая async-задача держит поток микросекунды, и любой опрос, измеряемый десятками миллисекунд, это блокировка. Ждёт при этом задача, а не поток, и ожидание на таймере само по себе не считается: считается только время внутри `poll`. Оборачивать подозрительные места временно, пока ищешь проблему, или постоянно в тестах и на стенде, где цена замера (два вызова `Instant::now`) пренебрежимо мала.'''

[[exercises]]
name = "svprof_q1"
kind = "question"
question.ru = '''Рантайм однопоточный (`current_thread`). Задача A вызывает `std::thread::sleep(100 мс)`. Задача B в цикле делает `tokio::time::sleep(10 мс)` и увеличивает счётчик. Сколько шагов успеет сделать B, пока A спит (с точки зрения того, кто ждёт завершения A)?'''
options.ru = [
  '''около десяти: каждые 10 мс по шагу''',
  '''ни одного или один: поток занят вызовом A, B не получает управления''',
  '''около пяти: потоку приходится делить время''',
  '''зависит от числа ядер''',
]
answer = [1]
explain.ru = '''`thread::sleep` останавливает операционный поток целиком. В однопоточном рантайме этот поток единственный, и другие задачи не могут выполняться, пока A не вернёт управление. Таймер B давно сработал, но опросить B некому. После пробуждения B сделает один шаг (догонит одним тиком), а не десять. В многопоточном рантайме ущерб меньше (остальные воркеры живы), но воркер выпал из работы, и при нескольких таких вызовах становится хуже.'''
hint.ru = '''Сколько потоков есть у такого рантайма и что делает `thread::sleep` с потоком?'''

[[exercises]]
name = "svprof2"
style = "fix"
hint.ru = [
  '''Пройди по обработчику и выпиши все вызовы, которые не `async`. Какие из них заведомо долгие? Подумай, где они выполняются: на каком потоке и чем он занят в это время.''',
  '''Синхронное и медленное отдают отдельному пулу потоков, предназначенному как раз для этого. Вызов возвращает future, которую можно ждать и пока она ждёт, воркер свободен. Результат вернётся обратно, значит, нужное в замыкание придётся переместить, а не одолжить.''',
  '''Достаточно одного такого вызова на оба шага: читать и разбирать в одной блокирующей задаче, если между ними нечего делать в async-коде. Ошибку паники в блокирующей задаче обработай явно: она приходит как результат ожидания.''',
]
why.ru = '''Синхронный код внутри async-функции выглядит безобидно, ведь вызов обычной функции ничем не отличается. Но на время его работы поток рантайма стоит. `spawn_blocking` переносит такую работу в отдельный пул, где потоки предназначены ждать и считать, а воркеры остаются для опросов. Чужую синхронную библиотеку менять не надо: достаточно не вызывать её напрямую из async. Паника в блокирующей задаче не роняет рантайм, а приходит как ошибка ожидания, и её надо обработать осознанно.'''

[[exercises]]
name = "svprof_q2"
kind = "question"
question.ru = '''В обработчике подключения написано `let _ = tokio::spawn(heartbeat());`, где `heartbeat` крутится в бесконечном цикле с паузой. Клиент отключился, и обработчик завершился. Что с задачей `heartbeat`?'''
options.ru = [
  '''остановилась: `JoinHandle` отброшен вместе с обработчиком''',
  '''продолжает жить: отброшенный `JoinHandle` задачу не останавливает''',
  '''остановится сама на следующем `await`''',
  '''рантайм завершит её при следующей проверке''',
]
answer = [1]
explain.ru = '''`JoinHandle` лишь ручка, чтобы дождаться результата или отменить задачу. Если его отбросить, задача (в терминах tokio: «отсоединённая») продолжает работать, пока не завершится сама. Бесконечный цикл не завершится, и каждое подключение оставит после себя задачу навсегда: это классическая утечка. Нужно хранить ручку и вызывать `abort()` при отключении, либо слушать сигнал остановки, либо собирать задачи в `JoinSet`.'''
hint.ru = '''Что делает `drop` для `JoinHandle`: останавливает задачу или просто отпускает ручку?'''

[[exercises]]
name = "svprof3"
style = "fix"
hint.ru = [
  '''Снимки рантайма берутся у текущего его обработчика (`Handle::current()`), и у него есть метод с метриками: число воркеров, живых задач и глубина общей очереди. Остальное это форматирование трёх gauge-метрик.''',
  '''Утечку видно сразу: после отключения клиентов живых задач больше, чем было. Каждому подключению соответствует задача, и записи о ней нет нигде, кроме самой задачи. Запись о подключении должна хранить и способ остановить её.''',
  '''При отключении задачу отменяют и дожидаются, пока она действительно закончится. Если сервер уничтожают, остановить надо и все оставшиеся. Для второго нужен `Drop` у владельца.''',
]
why.ru = '''Число живых задач самый ясный датчик утечки: рабочее значение колеблется вместе с нагрузкой, а утечка это лестница, не спускающаяся вниз. Чтобы закрыть утечку, у каждой фоновой задачи должен быть владелец и момент окончания. Отсоединённая задача (`spawn` без хранения ручки) живёт, пока не закончится сама, поэтому «убрать запись из карты» остановкой не является. Ждать завершения после `abort` нужно, если важно, что ресурсы действительно освобождены к моменту возврата.'''

[[exercises]]
name = "svprof4"
style = "scratch"
hint.ru = [
  '''Охрана (`guard`) нужна своя, чтобы поймать момент отпускания: именно в `Drop` у неё считается время удержания. Время ожидания считается раньше, при взятии замка.''',
  '''Чтобы отличить занятый замок от свободного, сначала пробуют взять без ожидания (`try_lock`). Не получилось из-за занятости: засекаешь время и берёшь с ожиданием. Получилось: ожидания не было вовсе.''',
  '''Учёт хранится под отдельным маленьким замком, потому что менять его надо и в `lock`, и в `Drop`. Отравленный замок (поток упал, держа его) восстанавливается получением внутреннего значения, а не паникой.''',
]
why.ru = '''Голый `Mutex` не расскажет, сколько на нём стояли. Учётная обёртка отличает два диагноза: много ожиданий с короткими удержаниями значит, что замок слишком популярен (шардировать), а редкие долгие удержания значит, что под замком делают лишнее (вынести работу). `try_lock` перед ожиданием стоит почти ничего, зато даёт честное «ждали / не ждали». Ожидание не должно попадать в удержание, иначе оно посчитается дважды. Отравление паникой обходят осознанно: учёт важнее, чем лишний обрыв сервиса.'''

[[exercises]]
name = "svprof_q3"
kind = "question"
question.ru = '''Карта пользователей разбита на 8 шардов, номер шарда равен `id % 8`. В системе идентификаторы выдаются с шагом 8: 8, 16, 24 и так далее. Сколько шардов реально работает и что это даёт?'''
options.ru = [
  '''все 8, нагрузка делится поровну''',
  '''4 шарда, потому что идентификаторы чётные''',
  '''один шард, остальные пусты: всё по-прежнему стоит в очереди к одному замку''',
  '''два шарда''',
]
answer = [2]
explain.ru = '''Все идентификаторы кратны 8, поэтому остаток от деления на 8 у всех нулевой, и в работе один шард. Шардирование по остатку работает, только если младшие разряды идентификаторов равномерны, а у выдаваемых номеров часто бывают закономерности (шаг, кратность, префиксы времени). Для ровного распределения ключ пропускают через хеш-функцию и берут остаток от хеша.'''
hint.ru = '''Чему равен остаток от деления на 8 у чисел, кратных 8?'''

[[exercises]]
name = "svprof5"
style = "fix"
hint.ru = [
  '''Что в текущем коде мешает двум потокам работать с разными пользователями одновременно? Подумай, какая часть структуры общая для всех.''',
  '''Вместо одной карты нужно несколько независимых, у каждой своя блокировка. Пользователь определяет карту по функции от своего номера. `shard_of` должна быть детерминирована (один пользователь всегда в одном шарде) и расселять похожие номера по разным шардам.''',
  '''Для расселения подойдёт хеш из стандартной библиотеки с остатком от деления на число шардов. Общие подсчёты (`len`, `total_hits`) обходят все шарды по очереди: точного мгновенного снимка они не дают, и для метрик этого достаточно.''',
]
why.ru = '''Шардирование превращает одну дверь в несколько: потоки толкутся только если попали в один шард. Хеш-функция нужна затем, чтобы распределение не зависело от закономерностей в номерах: остаток от деления у номеров, кратных числу шардов, складывает всех в один шард. Подсчёты по всем шардам берут замки по одному и не атомарны, это нормально для метрик, но для проверок «ровно сейчас» не годится. Число шардов делают заметно большим, чем потоков, чтобы редкие совпадения не создавали очередей.'''

[[exercises]]
name = "svprof_q4"
kind = "question"
question.ru = '''Какие из этих полей разбираемой структуры в `serde_json::from_str` берут данные из входной строки без копирования (в случае строки без экранирования)?'''
options.ru = [
  '''`name: &'a str`''',
  '''`#[serde(borrow)] tag: Option<Cow<'a, str>>`''',
  '''`#[serde(borrow)] text: Cow<'a, str>`''',
  '''`text: Cow<'a, str>` без атрибута''',
  '''`user: String`''',
]
answer = [0, 2]
explain.ru = '''Поле `&'a str` заимствует срез входной строки (но ломается на строке с экранированием: `\n` или `\"` требуют собрать новую строку). `Cow<'a, str>` с `#[serde(borrow)]` заимствует, когда может, и копирует, когда должен. Без атрибута `Cow` всегда будет владеющим. На `Option<Cow<str>>` атрибут не срабатывает (на практике поле остаётся владеющим, это видно по счётчику выделений), поэтому для необязательного текста надёжнее поле `Cow` с `#[serde(default)]`. `String` всегда копирует.'''
hint.ru = '''Какая строка из тех, что заимствуют, умеет ещё и откатываться на копирование?'''

[[exercises]]
name = "svprof6"
style = "fix"
hint.ru = [
  '''Запусти в голове путь одного запроса и посчитай создаваемые строки: разбор, перевод в верхний регистр, обрезка, форматирование. Каждый этап, который возвращает `String`, это выделение.''',
  '''Входные поля можно заимствовать у входной строки, а готовую строку писать прямо в переданный буфер, а не собирать новую. Верхний регистр можно печатать по символам, не создавая отдельную строку.''',
  '''Для текста, где бывают экранирования, заимствование «если можно» (`Cow` с атрибутом заимствования). Буфер перед записью очищают, ёмкость при этом остаётся. Писать в строку удобно через `write!` и трейт `std::fmt::Write`.''',
]
why.ru = '''Выделения надо убирать там, где они повторяются на каждый запрос, и только после измерения. Три приёма: заимствовать вместо копирования (срезы входных данных живут, пока жива входная строка), писать в переиспользуемый буфер вместо возврата новой строки, не строить промежуточных строк (`to_uppercase` и `format!` перед печатью). Заимствованное поле не годится для текста с экранированием, поэтому `Cow` «заимствуй, если можно». Счётчик в тесте считает выделения по потоку, потому что параллельные тесты иначе портили бы друг другу цифры.'''

[[exercises]]
name = "svprof_q5"
kind = "question"
question.ru = '''Профиль в свёрнутых стеках:
```
main;app;parse 10
main;app;handle;validate 30
main;app;handle;query;decode 200
main;app;handle;query 20
```
Какую функцию оптимизировать в первую очередь?'''
options.ru = [
  '''`app`: у неё самое большое полное время''',
  '''`handle`: она вызывает почти всё, что медленно''',
  '''`query`: она вызывается из `handle` и сама вызывает `decode`''',
  '''`decode`: у неё самое большое собственное время''',
]
answer = [3]
explain.ru = '''Полное время у `main` 260, у `app` 260, у `handle` 250, у `query` 220: это все те, кто лишь вызывает. Собственное время (замеры на вершине стека) у `decode` 200 из 260, это три четверти. Ускорение `app` или `handle` без изменения `decode` ничего не даст. Оптимизируют там, где процессор действительно работает.'''
hint.ru = '''Где процессор оказывается на вершине стека чаще всего?'''

[[exercises]]
name = "svprof7"
style = "bughunt"
hint.ru = [
  '''Для каждой функции нужно два числа. Попробуй вручную посчитать их на маленьком примере и сравнить с тем, что возвращает код. Где не сходится?''',
  '''Собственное время считает только стеки, у которых функция на вершине (последняя в цепочке). Полное время считает стеки, где она встречается вообще, но каждый стек учитывается один раз, даже если функция встречается в нём несколько раз (рекурсия).''',
  '''Горячие места рейтингуются по собственному времени, а не по полному. Сортировка по убыванию, а при равенстве по имени, чтобы результат не зависел от порядка обхода.''',
]
why.ru = '''Различие между собственным и полным временем это основа чтения любого профиля. В начале списка по полному времени всегда будут вызывающие функции (`main`, `serve`, обработчик): они «включают всё». Ускорять надо функции с большим собственным временем, иначе работа уйдёт на ветку, где процессор лишь проходит мимо. Рекурсия считается один раз на стек, потому что полное время не может превышать числа замеров. Сортировка с разрешением ничьих по имени нужна для воспроизводимости: порядок обхода хеш-карты случаен.'''

[[exercises]]
name = "svprof_quiz"
kind = "project"
quiz = true
style = "fix"
locked = ['src/crates/feed/tests/service.rs']
hint.ru = [
  '''Не начинай с правок. Запусти тесты и посмотри, какие падают и с каким текстом: каждый провал указывает на свой симптом. Для долгих опросов есть сторож `diag::watch`, для учёта выделений есть счётчик в тестах.''',
  '''Три места разной природы. Синхронный вызов хранилища выполняется прямо в async-обработчике. Все касания сессий идут через единственный замок (посмотри, чему равно число шардов фактически). Разбор запроса и печать страницы копируют строки там, где хватило бы заимствования и общего буфера.''',
  '''Хранилище уходит в пул для блокирующих вызовов (вызов нужно переместить в замыкание). Сессии раскладываются по шардам по хешу пользователя, как в `svprof5`. В разборе запроса поле с текстом заимствует из входной строки, если не нужно экранирование; печать идёт по символам прямо в переданный буфер без промежуточных строк.''',
]
why.ru = '''Узкие места разной природы лечатся разными приёмами, и находить их надо измерением: сторож долгих опросов для блокировок рантайма, учёт параллельности для замков, счётчик выделений для памяти. Все три исправления независимы, поэтому тесты могут проверять каждое отдельно, а итоговая проверка p99 подтверждает, что вместе они дали нужный эффект. Заметь, что итоговая проверка относительная: p99 сравнивается с задержкой хранилища, а не с абсолютными числами, поэтому она устойчива к скорости машины.'''

[[exercises]]
name = "m46_load"
kind = "milestone"
journey = "backend"
quiz = true
