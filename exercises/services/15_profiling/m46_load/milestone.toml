story.ru = """У соцсети появился свой генератор нагрузки: он ходит через тот же шлюз, что и клиент, считает p99 по
шагам, сравнивает прогон с прошлым и находит частоту, которую стенд держит. По его отчётам и метрикам рантайма
найдены и убраны первые узкие места: соединения шлюза больше не дерутся за один замок, а долгий poll сразу виден в логах."""
