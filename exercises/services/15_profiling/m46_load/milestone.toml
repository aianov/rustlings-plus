test_command = ["cargo", "make", "check"]
requires = ["nats"]
hint.ru = [
"""Гистограмма: значение меньше 128 лежит в своей корзине, иначе сдвиг `63 - leading_zeros - 7` оставляет восемь
старших бит, и номер корзины это `(сдвиг + 1) * 128 + (старшие - 128)`. Так корзины идут подряд без дыр, а верхняя
граница корзины отличается от любого значения в ней меньше чем на 1/128.""",
"""Открытая модель считает задержку от запланированного прибытия, а не от момента, когда исполнитель освободился:
