<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Очередь к одному Mutex и шардирование</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1c2330; --muted: #5d6879; --line: #c9d0db;
  --box: #eef1f6; --boxline: #aeb8c8; --ok: #1f8a4c; --bad: #c92a2a; --warn: #d9820f; --accent: #2f6fe0;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14181f; --panel: #1b212b; --ink: #e6ebf3; --muted: #9aa6b8; --line: #384152;
    --box: #232b38; --boxline: #4a566b; --ok: #51cf66; --bad: #ff6b6b; --warn: #ffa94d; --accent: #6ea4ff;
  }
}
:root[data-theme="dark"] {
  --bg: #14181f; --panel: #1b212b; --ink: #e6ebf3; --muted: #9aa6b8; --line: #384152;
  --box: #232b38; --boxline: #4a566b; --ok: #51cf66; --bad: #ff6b6b; --warn: #ffa94d; --accent: #6ea4ff;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1000px; margin: 0 auto; padding: 16px; }
h1 { font-size: 20px; margin: 0 0 4px; }
p.sub { margin: 0 0 12px; color: var(--muted); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
button, select { font: inherit; color: var(--ink); background: var(--box); border: 1px solid var(--boxline); border-radius: 6px; padding: 5px 12px; cursor: pointer; }
button:hover:enabled { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
.spacer { flex: 1; }
svg { width: 100%; height: auto; display: block; }
svg text { fill: var(--ink); font-size: 13px; }
svg .muted { fill: var(--muted); font-size: 12px; }
#caption { margin-top: 12px; min-height: 84px; }
.step { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>Очередь к одному Mutex и шардирование</h1>
  <p class="sub">Замок это дверь, в которую проходят по одному; шарды дают несколько независимых дверей.</p>
  <div class="panel">
    <div class="bar">
      <label>Случай <select id="scenario"></select></label>
      <span class="spacer"></span>
      <button id="reset">Сброс</button>
      <button id="prev">Назад</button>
      <button id="next">Шаг</button>
      <button id="play">Играть</button>
      <button id="theme">Тема</button>
    </div>
    <svg viewBox="0 0 960 400" role="img" aria-label="Очередь к одному Mutex и шардирование"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--muted)"/></marker></defs><g id="scene"></g></svg>
    <div id="caption" aria-live="polite"></div>
  </div>
</main>
<script>
"use strict";
const NS = "http://www.w3.org/2000/svg";
function el(name, attrs, parent, text) {
  const e = document.createElementNS(NS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}
const NODES = [{"id": "t1", "x": 10, "y": 30, "w": 130, "h": 80, "label": "поток 1", "sub": "user 1"}, {"id": "t2", "x": 10, "y": 120, "w": 130, "h": 80, "label": "поток 2", "sub": "user 2"}, {"id": "t3", "x": 10, "y": 210, "w": 130, "h": 80, "label": "поток 3", "sub": "user 3"}, {"id": "t4", "x": 10, "y": 300, "w": 130, "h": 80, "label": "поток 4", "sub": "user 4"}, {"id": "lk", "x": 400, "y": 30, "w": 260, "h": 160, "label": "один Mutex<HashMap>", "sub": "на все сессии"}, {"id": "sh", "x": 400, "y": 210, "w": 540, "h": 170, "label": "шарды", "sub": "hash(user) % 4"}];
const SCEN = {"one": {"title": "один замок на всех", "intro": "Четыре потока обновляют сессии четырёх разных пользователей. Данные никак не пересекаются.", "steps": [{"text": "Поток 1 берёт замок и делает работу со своей сессией, например обращается к стороннему сервису на 20 мс прямо под замком.", "hl": ["t1", "lk"], "arrows": [["t1", "lk", "lock", "ok"]], "tokens": {"lk": [["держит поток 1", "ok"]], "t1": [["работает", "ok"]]}}, {"text": "Потоки 2, 3 и 4 хотят каждый свою сессию, но замок один. Они ждут в очереди, хотя друг другу не мешают.", "hl": ["t2", "t3", "t4", "lk"], "arrows": [["t2", "lk", "ждёт", "bad"], ["t3", "lk", "ждёт", "bad"], ["t4", "lk", "ждёт", "bad"]], "tokens": {"t2": [["ждёт замок", "bad"]], "t3": [["ждёт замок", "bad"]], "t4": [["ждёт замок", "bad"]], "lk": [["держит поток 1", "ok"]]}}, {"text": "Итог: четыре потока, а работа идёт по одному. Четыре работы по 20 мс заняли 80 мс. Добавим потоков, и результат не изменится: пропускная способность упёрлась в замок.", "hl": ["lk"], "tokens": {"lk": [["очередь: 3 потока", "bad"], ["пропускная способность = 1", "bad"]]}}]}, "sharded": {"title": "замок на шард", "intro": "Те же четыре потока, но сессии разложены по четырём шардам, у каждого свой замок.", "steps": [{"text": "Шард выбирается по хешу пользователя. Пользователи 1, 2, 3 и 4 попали в разные шарды.", "hl": ["sh"], "tokens": {"sh": [["user 1 → шард 2", "n"], ["user 2 → шард 0", "n"], ["user 3 → шард 3", "n"], ["user 4 → шард 1", "n"]]}}, {"text": "Все четыре потока берут каждый свой замок одновременно и работают параллельно. Четыре работы по 20 мс заняли 20 мс.", "hl": ["t1", "t2", "t3", "t4", "sh"], "arrows": [["t1", "sh", "lock шарда 2", "ok"], ["t2", "sh", "lock шарда 0", "ok"], ["t3", "sh", "lock шарда 3", "ok"], ["t4", "sh", "lock шарда 1", "ok"]], "tokens": {"sh": [["4 замка, нет очереди", "ok"]]}}, {"text": "Если два пользователя попали в один шард, они подождут друг друга, но это редкость, и шардов делают заметно больше, чем потоков (например, 16 на 4 потока).", "hl": ["sh"], "tokens": {"sh": [["совпадение: короткая очередь", "warn"]]}}, {"text": "Ловушка хеша: номера пользователей кратны 16, а шардов 16. Остаток от деления у всех 0, и все они лежат в одном шарде: получился тот же единственный замок. Нужна настоящая хеш-функция.", "hl": ["sh"], "tokens": {"sh": [["id % 16 = 0 у всех", "bad"], ["все в шарде 0", "bad"]]}}]}};
const COLOR = { ok: "var(--ok)", bad: "var(--bad)", warn: "var(--warn)", n: "var(--accent)" };
const scene = document.getElementById("scene"), cap = document.getElementById("caption");
const sel = document.getElementById("scenario");
const btn = id => document.getElementById(id);
let idx = -1, timer = null;
Object.keys(SCEN).forEach(k => { const o = document.createElement("option"); o.value = k; o.textContent = SCEN[k].title; sel.appendChild(o); });
function center(id) { const n = NODES.find(n => n.id === id); return { x: n.x + n.w / 2, y: n.y + n.h / 2, n }; }
function render() {
  scene.textContent = "";
  const sc = SCEN[sel.value];
  const step = idx >= 0 ? sc.steps[idx] : null;
  NODES.forEach(n => {
    const hot = step && (step.hl || []).includes(n.id);
    el("rect", { x: n.x, y: n.y, width: n.w, height: n.h, rx: 10, fill: "var(--box)", stroke: hot ? "var(--accent)" : "var(--boxline)", "stroke-width": hot ? 3 : 1.2 }, scene);
    el("text", { x: n.x + 10, y: n.y + 20, "font-weight": "600" }, scene, n.label);
    if (n.sub) el("text", { x: n.x + 10, y: n.y + 36, class: "muted" }, scene, n.sub);
  });
  if (step) {
    (step.arrows || []).forEach(a => {
      const f = center(a[0]), t = center(a[1]);
      const dx = t.x - f.x, dy = t.y - f.y, len = Math.hypot(dx, dy) || 1;
      const x1 = f.x + (dx > 0 ? f.n.w / 2 : dx < 0 ? -f.n.w / 2 : 0), y1 = f.y + (Math.abs(dx) < 4 ? (dy > 0 ? f.n.h / 2 : -f.n.h / 2) : 0);
      const x2 = t.x - (dx > 0 ? t.n.w / 2 : dx < 0 ? -t.n.w / 2 : 0), y2 = t.y - (Math.abs(dx) < 4 ? (dy > 0 ? t.n.h / 2 : -t.n.h / 2) : 0);
      const c = COLOR[a[3] || "n"];
      el("line", { x1, y1, x2, y2, stroke: c, "stroke-width": 2.2, "marker-end": "url(#arr)", "stroke-dasharray": a[3] === "bad" ? "6 4" : "" }, scene);
      el("text", { x: (x1 + x2) / 2, y: (y1 + y2) / 2 - 6, "text-anchor": "middle", fill: c, style: "fill:" + c + ";font-size:12px" }, scene, a[2]);
    });
    Object.keys(step.tokens || {}).forEach(id => {
      const n = NODES.find(n => n.id === id);
      step.tokens[id].forEach((t, i) => {
        const y = n.y + 48 + i * 26;
        const c = COLOR[t[1] || "n"];
        el("rect", { x: n.x + 10, y, width: n.w - 20, height: 21, rx: 10, fill: "none", stroke: c, "stroke-width": 1.6 }, scene);
        el("text", { x: n.x + 18, y: y + 15, style: "fill:" + c + ";font-size:12px" }, scene, t[0]);
      });
    });
  }
  const sub = idx < 0 ? sc.intro : sc.steps[idx].text;
  cap.innerHTML = "";
  const s = document.createElement("div"); s.className = "step"; s.textContent = idx < 0 ? "Начало" : "Шаг " + (idx + 1) + " из " + sc.steps.length; cap.appendChild(s);
  const p = document.createElement("div"); p.textContent = sub; cap.appendChild(p);
  btn("prev").disabled = idx < 0; btn("next").disabled = idx >= sc.steps.length - 1;
}
function stop() { if (timer) { clearInterval(timer); timer = null; btn("play").textContent = "Играть"; } }
btn("next").onclick = () => { stop(); if (idx < SCEN[sel.value].steps.length - 1) { idx++; render(); } };
btn("prev").onclick = () => { stop(); if (idx >= 0) { idx--; render(); } };
btn("reset").onclick = () => { stop(); idx = -1; render(); };
sel.onchange = () => { stop(); idx = -1; render(); };
btn("play").onclick = () => {
  if (timer) { stop(); return; }
  if (idx >= SCEN[sel.value].steps.length - 1) idx = -1;
  btn("play").textContent = "Пауза";
  timer = setInterval(() => { if (idx < SCEN[sel.value].steps.length - 1) { idx++; render(); } else stop(); }, 1800);
  if (idx < 0) { idx = 0; render(); }
};
btn("theme").onclick = () => {
  const r = document.documentElement, cur = r.getAttribute("data-theme");
  const dark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.setAttribute("data-theme", dark ? "light" : "dark");
};
render();
</script>
</body>
</html>
