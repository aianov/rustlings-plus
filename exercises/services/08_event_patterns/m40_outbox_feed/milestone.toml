test_command = ["cargo", "make", "check"]
requires = ["nats"]
hint.ru = [
"""Начни с contracts: конверт `DomainEvent`, факты и `upcast` из svevt1, svevt2 и svevt3. Поле `kind` в JSON называется
`type`, а у `schema` значение по умолчанию 1 (`#[serde(default = "first")]`). `fact()` сначала проверяет тип по `KINDS`:
незнакомый тип это `Ok(None)`, его нельзя ломать апкастом.""",
"""Строка журнала это изменение плюс событие: `#[serde(flatten)] entry` и `outbox: Option<OutboxRow>`. `Outbox::prepare`
только готовит строку, а `push` применяется к состоянию после того, как строка записана в журнал. При восстановлении
журнала те же `push` и `published_through` дают тот же outbox, что был до перезапуска.""",
"""Релей не придумывает идентификатор: `event_id` уже лежит в строке outbox, поэтому повтор после падения до
`mark_published` брокер узнаёт по `Nats-Msg-Id`. Помечай отправленное до последней удачной строки, даже если пачка
оборвалась посередине. Ждать новых строк удобно на `tokio::sync::Notify` из репозитория с таймаутом в секунду.""",
"""В feed-service версия агрегата и эффект меняются под одной блокировкой: это inbox из svevt7. Событие из будущего
кладётся в `BTreeMap` по версии и применяется, когда дойдёт очередь. Незнакомое и сломанное событие применяются как
`Change::Nothing`, иначе агрегат застрянет. Время поста бери из `occurred_at`, тогда пересборка из stream даёт ту же ленту.""",
]
story.ru = """Событие больше не теряется между записью и публикацией: оно лежит в той же строке журнала, что и изменение, а
релей доносит его до JetStream ровно один раз для потребителя. Лента живёт в своём сервисе: feed-service собирает её из
событий, переименование видно и в старых постах, а после перезапуска проекция строится заново с начала stream."""
