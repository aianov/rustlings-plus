[[exercises]]
name = "svevt1"
style = "todo"
hint.ru = '''Поле в JSON называется `type`, а в структуре `kind`: за это отвечает `#[serde(rename)]`, он уже стоит. Для `decode` подумай, какие значения при разборе пройдут молча, хотя событием не являются: пустая строка и ноль тоже «значения». Лишние поля serde по умолчанию пропускает сам.'''
why.ru = '''Конверт один на все события, поэтому его проверяют на входе, а не в каждом потребителе: пустой `event_id` сломал бы идемпотентность, нулевая версия сломала бы порядок. Время и идентификатор приходят аргументами, а не из часов и генератора внутри функции: так событие можно собрать в тесте и пересобрать при повторе. Лишние поля не ошибка, иначе первое же добавление поля производителем ломало бы всех потребителей (этим занимается следующая задача).'''

[[exercises]]
name = "svevt2"
style = "scratch"
hint.ru = [
  '''Апкаст принимает событие целиком и возвращает событие целиком. Меняется только то, что нужно: схема и форма payload. Сначала реши, какие события апкаст вообще трогает.''',
  '''Работай с `payload` как с `Value`: достань `name`, разрежь по первому пробелу (`split_once(char::is_whitespace)`), удали старый ключ и вставь два новых через `as_object_mut`. Остальные ключи не трогай, там могут лежать чужие поля.''',
  '''`from_event` проще всего написать через `upcast`: поднял до последней схемы и читаешь только один формат. Схема 0 и схема 3 это `UnknownSchema`, а не повод угадывать.''',
]
why.ru = '''Апкаст стоит в одном месте на границе чтения, а потребители знают только последний формат: когда появится схема 3, добавится один шаг «из 2 в 3», а не правка во всех сервисах. Конверт при апкасте не трогаем: идентификатор и время должны остаться теми же, иначе дедупликация и порядок сломаются. Неизвестные поля сохраняем (читатель терпим), но схему из будущего не гадаем: лучше понятная ошибка и событие в мёртвой теме, чем молча неверное имя в профиле.'''

[[exercises]]
name = "svevt3"
style = "fix"
hint.ru = [
  '''Сколько мест в коде говорят «я принимаю только то, что знаю сегодня»? Их больше одного: посмотри на атрибуты структур и на тип, в который превращается поле `type`.''',
  '''Читай только нужное: из конверта хватает `event_id`, `type` и `payload`. Тип события пусть будет строкой, а `match` по ней пусть заканчивается веткой «не моё». Но если поле нужно, а его нет, это по-прежнему ошибка. Поля, которые теперь никто не читает, из структуры можно убрать.''',
]
why.ru = '''Строгий разбор выглядит как забота о качестве и работает как бомба замедленного действия: любое добавление поля производителем (а это самое частое изменение) останавливает всех потребителей разом. Правило терпимого читателя: бери что нужно, игнорируй остальное, не разбирай чужие типы. Обратная сторона: обязательные поля остаются обязательными, иначе вместо ошибки получишь молча неверные данные, а это хуже.'''

[[exercises]]
name = "svevt4"
style = "fix"
hint.ru = [
  '''Подумай, что нужно ленте для показа поста, и что это за данные: их знает тот, кто публикует событие, в момент публикации. Сколько вызовов нужно потребителю, если всё лежит в событии?''',
  '''Добавь в payload имя и аватар автора, но не весь `User`: почта ленте не нужна и не должна уезжать всем подписчикам события. Не забудь про старые события в журнале: у них нового поля нет.''',
]
why.ru = '''Событие, которое несёт то, что нужно потребителю, развязывает сервисы по доступности и по скорости: feed-service работает, пока user-service перезапускается. Платим дублированием данных в событии, поэтому кладём только нужное: каждое поле это контракт, а личные данные нельзя рассылать всем. Старые события остаются в журнале навсегда, потребитель обязан читать их тоже, поэтому новое поле читается терпимо.'''

[[exercises]]
name = "svevt_q1"
kind = "question"
question.ru = '''chat-service публикует событие «сообщение отправлено». push-service по нему должен показать пуш «Алиса: привет, ты идёшь?». Какое содержимое события лучше всего?'''
options.ru = [
  '''только `message_id`: push-service сам спросит у chat-service текст и имя отправителя''',
  '''`message_id`, `sender_id`, `sender_name` и короткий `preview`: ровно то, что нужно для пуша''',
  '''всё сообщение целиком, весь профиль отправителя и последние сто сообщений диалога''',
  '''только `message_id`, а имя отправителя отправится только в тему NATS, а текст пуша соберут по умолчанию''',
]
answer = [1]
explain.ru = '''Вариант 0 привязывает доставку пушей к доступности chat-service и ломается, если сообщение к этому моменту удалили. Вариант 2 раздаёт всем подписчикам события лишнее и личное, а размер события это тоже контракт. Вариант 3 прячет данные в заголовок, но проблему не решает. Нужное для показа кладём в событие, лишнего не кладём.'''
hint.ru = '''Что случится с пушем, если chat-service сейчас перезапускается? И кто ещё читает это событие, кроме push-service?'''

[[exercises]]
name = "svevt5"
style = "todo"
hint.ru = [
  '''Нужны две структуры сразу: очередь по порядку появления (чтобы знать, кого выбросить) и множество для быстрой проверки. Что должно произойти, когда пришёл уже известный идентификатор?''',
  '''Новый идентификатор при полном окне вытесняет самый старый: возьми его из начала очереди и убери из множества. Повтор очередь не трогает, в этом отличие от LRU. И нулевое окно не должно паниковать.''',
]
why.ru = '''Ограниченная память это компромисс, и его нужно называть вслух: повтор, пришедший позже окна, будет посчитан второй раз. Окно выбирают по тому, как поздно брокер может повторить доставку (ack_wait, ретраи, перезапуски), а для строгих случаев идентификаторы хранят в базе с отметкой времени и чистят по сроку. FIFO без обновления проще LRU и достаточен: повтор приходит вскоре после оригинала, а не в самом конце окна.'''

[[exercises]]
name = "svevt6"
style = "bughunt"
hint.ru = [
  '''Что именно считается «тем же событием»? Если два лайка одного человека на один пост это два разных события, то по какому признаку их различать?''',
  '''Идентификатор события уникален для каждого события и не меняется при повторе. Ключ из «что, на какой пост, кто» совпадает у настоящих повторных лайков. Подумай, что должно оказаться в журнале обработанного, чтобы опоздавший повтор после снятия лайка был узнан, а новый лайк того же человека нет.''',
]
why.ru = '''Повтор это то же событие, а не то же содержимое: пользователь может честно поставить лайк дважды (с промежутком), и это два события. Дедупликация по содержимому ломает именно этот случай. Дедупликация по состоянию («уже лайкнут») ломается на запоздалом повторе после смены состояния. Единственный надёжный ключ это event_id, назначенный производителем один раз.'''

[[exercises]]
name = "svevt_q2"
kind = "question"
question.ru = '''Обработчик помнит последние 1000 идентификаторов событий в памяти процесса. В потоке 50 событий в секунду. Событие e1 пришло и обработано. Брокер потерял ack и доставит его снова. Через какое время после первой доставки повтор e1 перестанет распознаваться и будет применён второй раз?'''
options.ru = [
  '''никогда: пока процесс жив, идентификаторы хранятся''',
  '''примерно через 20 секунд, когда e1 вытеснят 1000 новых событий''',
  '''примерно через 1000 секунд: столько лежит один идентификатор''',
  '''примерно через 50 секунд: по числу событий в секунду''',
]
answer = [1]
explain.ru = '''Окно хранит последние 1000 штук, а не события за какое-то время. При 50 событиях в секунду оно целиком сменяется за 1000 / 50 = 20 секунд. Повтор, пришедший позже, пройдёт как новый. Поэтому окно выбирают с запасом по самому позднему возможному повтору (ack_wait, число ретраев, время перезапуска), а для строгих случаев идентификаторы хранят в базе и чистят по сроку.'''
hint.ru = '''Что вытесняет старый идентификатор из окна: время или новые события?'''

[[exercises]]
name = "svevt7"
style = "todo"
hint.ru = [
  '''Тебе нужно сохранять два изменения как одно: счётчик и отметку. Что произойдёт, если первое уже сделано, а до второго не дошли? И наоборот?''',
  '''Работай с копией состояния: применяй эффект к копии, вызови точку сбоя, добавь отметку в копию и только потом замени оригинал копией. При сбое оригинал остался нетронутым. Но замок держи всё время: если отпустить его между копией и подменой, два потока потеряют чужую правку.''',
]
why.ru = '''Две записи, которые должны случиться вместе, не бывают «почти вместе»: между ними есть щель, и в неё падает процесс. Если отметить раньше эффекта, событие потеряется, если после, будет дубль. Решение одно: сделать их неделимыми. В настоящей базе это одна транзакция; здесь это замена состояния целиком под одной блокировкой. Внешний эффект, который в транзакцию не поместить (письмо, платёж), этим не лечится, там нужен ключ идемпотентности на стороне получателя.'''

[[exercises]]
name = "svevt8"
style = "bughunt"
hint.ru = [
  '''Ты видишь две блокировки по отдельности и паузу между ними. Что могут сделать два потока за время паузы?''',
  '''Проверка «обработано ли» и пометка «теперь обработано» должны быть одной операцией. Посмотри, что возвращает вставка в множество: одна операция может и занять отметку, и сказать, была ли она занята.''',
]
why.ru = '''Классическая гонка «проверил, потом сделал»: пока один поток спит в базе, второй проходит ту же проверку. Лекарство не в паузах и не в повторной проверке, а в атомарной операции «занять»: `insert` множества возвращает, оказался ли идентификатор новым, и ровно один поток получает `true`. Это ровно то, что в настоящей базе делает уникальный индекс по event_id.'''

[[exercises]]
name = "svevt_q3"
kind = "question"
question.ru = '''Обработчик делает так: (1) проверяет, что event_id нет в таблице inbox; (2) отправляет письмо через внешнего почтового провайдера; (3) в транзакции базы записывает event_id в inbox. Процесс упал после шага 2. Что произойдёт при повторной доставке события?'''
options.ru = [
  '''ничего лишнего: транзакция откатилась вместе с письмом, и всё чисто''',
  '''письмо уйдёт второй раз: внешний вызов в транзакцию базы не включить''',
  '''письмо потеряно навсегда: идентификатор в inbox записан ещё до сбоя''',
  '''брокер заметит падение и вовсе не станет доставлять событие повторно''',
]
answer = [1]
explain.ru = '''Транзакция базы откатывает только то, что в базе. Письмо уже ушло, а отметки нет, поэтому повторная доставка отправит его снова. Лечится это не inbox, а ключом идемпотентности на стороне получателя: провайдеру отправляют тот же идентификатор (например, event_id), и он сам отбрасывает повтор. Если провайдер так не умеет, «ровно один раз» для письма недостижимо, остаётся выбрать между «возможно дважды» и «возможно ни разу».'''
hint.ru = '''Какие из трёх шагов откатываются вместе с транзакцией, а какие нет?'''

[[exercises]]
name = "svevt9"
style = "todo"
hint.ru = [
  '''Проверь текст до любой записи: считай символы, а не байты. Потом собери пост, событие и строку outbox. Сколько вызовов `transaction` должно быть?''',
  '''Всё запись идёт в одно замыкание `transaction`: внутри добавь и пост, и строку outbox. Номер `seq` вычисляется внутри транзакции по текущей длине outbox, а идентификаторы лучше получить до неё.''',
]
why.ru = '''Двойная запись («сохранил в базу, потом опубликовал в брокер») не бывает надёжной: две разные системы не фиксируются вместе, и падение между шагами теряет событие навсегда. Outbox превращает две системы в одну: пост и событие лежат в одной базе и записываются одной транзакцией, а доставкой в брокер занимается отдельный процесс. Валидация идёт до транзакции, чтобы неверный ввод не тратил ни номера, ни места.'''

[[exercises]]
name = "svevt10"
style = "todo"
requires = ["nats"]
hint.ru = [
  '''Для каждой строки: публикация с заголовком, ожидание подтверждения записи, и только потом пометка. Что случится, если пометить раньше? А если не остановиться на первой ошибке?''',
  '''`js.publish_with_headers(...)` возвращает будущее подтверждения: нужны оба `.await`. Идентификатор берёшь из строки, а не генерируешь заново: повтор после падения должен нести то же значение. Заголовок называется `Nats-Msg-Id`.''',
]
why.ru = '''Релей даёт гарантию «хотя бы раз»: он может опубликовать, упасть до пометки и опубликовать снова. Пометка только после подтверждения означает, что событие не потеряется; стабильный Nats-Msg-Id означает, что повтор брокер отбросит в пределах окна дубликатов. Остановка на первой ошибке сохраняет порядок: не обгоняем застрявшее событие следующими. За пределами окна дубль всё равно возможен, поэтому у потребителя есть inbox.'''

[[exercises]]
name = "svevt11"
style = "fix"
hint.ru = [
  '''Задай себе вопрос: что из происходящего в `follow` можно отменить, если следующий шаг сорвётся? Публикацию в шину отменить нельзя.''',
  '''Сервису шина не нужна: он пишет в свою базу подписку и строку outbox в одной транзакции. Повторную подписку и самоподписку отсеивай до записи события, а версию события считай по outbox внутри транзакции.''',
]
why.ru = '''Событие должно быть следствием записанного факта, а не его предсказанием. Публикация до записи создаёт события о том, чего не было (отказ базы, повторная подписка), публикация после записи теряет события при падении между шагами. Единственный вариант без обоих дефектов: событие записывается вместе с фактом и уходит в шину позже. Версия агрегата тоже вычисляется внутри транзакции, иначе два параллельных запроса выдали бы одну и ту же.'''

[[exercises]]
name = "svevt_q4"
kind = "question"
question.ru = '''Релей outbox опубликовал событие в JetStream с `Nats-Msg-Id` равным event_id и упал до пометки. Его перезапустили через 3 минуты, и он опубликовал это событие снова с тем же идентификатором. Окно дедупликации в stream 2 минуты. Что лежит в stream?'''
options.ru = [
  '''одна копия: идентификатор тот же, значит брокер всегда узнаёт повтор''',
  '''ни одной: stream откатывает публикацию, у которой не было пометки''',
  '''две копии: окно истекло, и брокер уже забыл идентификатор первой''',
  '''две копии, и потребитель их различит по номеру в stream (seq)''',
]
answer = [2]
explain.ru = '''Дедупликация брокера работает только внутри окна (по умолчанию 2 минуты), потом идентификатор забыт. Номера в stream у двух копий разные, и потому они не помогают отличить повтор: у повтора новый seq. Значит, защита брокера и релея даёт «хотя бы раз» с редкими дублями, а настоящий фильтр стоит у потребителя: inbox по event_id.'''
hint.ru = '''Сколько брокер помнит идентификаторы и что в этот момент отличает вторую копию от первой?'''

[[exercises]]
name = "svevt12"
style = "scratch"
hint.ru = [
  '''Для каждого агрегата нужно знать, какую версию ждёшь следующей, и где лежат уже пришедшие «из будущего». Какое событие можно отдать сразу, а какое придётся придержать?''',
  '''Ожидающие хранятся по версиям в `BTreeMap`. Пришла ожидаемая версия: отдай её и затем доставай из карты следующую, пока цепочка не оборвётся. Версию меньше ожидаемой молча отбрасывай, это повтор.''',
]
why.ru = '''Когда события изменяют состояние дельтами («+1», «добавь в список»), порядок важен, и единственный способ его восстановить это номер в агрегате. Буфер ожидающих обязан быть ограничен, иначе потерянное событие (оно не придёт никогда) превращается в утечку памяти; при переполнении честнее потребовать пересбор. Агрегаты независимы, поэтому задержка одного не должна тормозить остальные.'''

[[exercises]]
name = "svevt13"
style = "fix"
hint.ru = [
  '''Сейчас последнее пришедшее событие побеждает, а нужно, чтобы побеждало самое новое. Чем измерить «новее», если часы двух серверов расходятся?''',
  '''Запоминай вместе с именем версию, которая его выставила, и применяй событие, только если его версия строго больше. Время события для этого не годится: оно приходит с чужих часов.''',
]
why.ru = '''Для событий-снимков (в событии новое значение целиком) буферизация не нужна: достаточно отбрасывать устаревшие. Последний пришедший не значит последний произошедший, а время на сервере врёт (часы расходятся, события из разных экземпляров), поэтому порядок задаёт версия агрегата, назначенная в транзакции производителя. Цена такого подхода: промежуточные версии можно пропустить, и для снимков это нормально.'''

[[exercises]]
name = "svevt_q5"
kind = "question"
question.ru = '''Доставка может менять порядок событий одного пользователя, повторов нет. Две проекции: (а) счётчик подписчиков, где `followed` делает +1, а `unfollowed` делает -1; (б) флаг «Боб подписан на Алису»: `followed` ставит true, `unfollowed` ставит false. Для какой проекции порядок критичен для итогового значения?'''
options.ru = [
  '''для обеих: любые события одного пользователя надо применять строго по порядку''',
  '''только для (а): сложение чувствительно к порядку, а присвоение нет''',
  '''только для (б): сложение не зависит от порядка, а присвоение зависит''',
  '''ни для одной: после всех событий оба значения сходятся само''',
]
answer = [2]
explain.ru = '''+1 и -1 коммутируют: итоговая сумма та же при любом порядке (в середине счётчик может побывать в минусе, это видно пользователю, но итог сойдётся). Присвоение true и false не коммутирует: события «подписался, отписался» в обратном порядке дадут true вместо false навсегда. Для присваиваний нужна версия агрегата: применять только новее уже применённого. Для дельт с условиями («только если не ноль») порядок снова критичен.'''
hint.ru = '''Попробуй вручную: применить события в обоих порядках и сравнить результат для каждой проекции.'''

[[exercises]]
name = "svevt14"
style = "scratch"
hint.ru = [
  '''Проекция это набор своих таблиц: имена, подписки, посты. Каждое событие меняет одну из них. Имена в посте не храни: так смена имени сама отразится в старых постах.''',
  '''Для ленты отфильтруй посты по автору (подписки зрителя плюс он сам), отсортируй по времени по убыванию, а при равенстве по идентификатору по убыванию, и обрежь по `limit`. Имя ищи в таблице имён на момент чтения.''',
]
why.ru = '''Проекция это чужие данные, превращённые в удобную для чтения форму. Имя автора хранится отдельно и подставляется при чтении: тогда одно событие смены имени исправляет все старые посты, и не нужно перепечатывать историю. Незнакомые события пропускаются: проекция не должна падать от нового типа, который понадобится только соседу. Порядок при равном времени задан явно, иначе разные запросы возвращали бы разные ленты.'''

[[exercises]]
name = "svevt15"
style = "bughunt"
hint.ru = [
  '''Проекция должна быть чистой функцией от журнала. Найди в коде всё, что берётся не из события: чем ещё, кроме событий, определяется итог?''',
  '''Время поста возьми из `occurred_at`. А ещё `HashMap` перебирается в произвольном порядке, и сортировка только по времени оставляет посты с равным временем в этом произвольном порядке.''',
]
why.ru = '''Пересборка проекции возможна только если обработчик детерминирован: тот же журнал, тот же результат. Три источника недетерминизма: текущее время, случайные числа и порядок перебора хеш-таблиц. Время берём из события, случайность не используем, порядок задаём явным ключом сортировки. Тогда проекцию можно выкинуть и построить заново, например после исправления ошибки в обработчике или при добавлении нового поля.'''

[[exercises]]
name = "svevt16"
style = "scratch"
hint.ru = [
  '''Запоминай, какие шаги выполнены. При ошибке пройдись по ним с конца. Упавший шаг в этот список не входит: он не завершился.''',
  '''Компенсацию одного шага оберни в цикл из трёх попыток. Если не удалось, запомни имя и иди к следующему: застрявший откат не повод бросать остальные.''',
]
why.ru = '''Сага заменяет распределённую транзакцию последовательностью локальных: у каждого шага есть обратное действие. Откат идёт в обратном порядке, потому что поздние шаги могли зависеть от ранних. Компенсации могут тоже падать, и их повторяют; но если не вышло, нельзя бросить остальное: чем больше откатили, тем меньше ручной работы, а застрявшее нужно вынести наружу (в отчёт, мёртвую тему, на дежурного). Необратимые шаги ставят в конец саги, когда всё остальное уже получилось.'''

[[exercises]]
name = "svevt17"
style = "bughunt"
hint.ru = [
  '''Какие шаги надо откатывать: те, что завершены? Или ещё какие-то? Что в журнале говорит, что шаг откатан?''',
  '''Идёшь по журналу и держишь список начатых и ещё не откатанных шагов (`Started` добавляет, `Compensated` убирает). Откатываешь их с конца. Запись `Done` для решения не нужна: начатый, но не завершённый шаг тоже мог что-то успеть.''',
]
why.ru = '''Восстановление после падения опирается только на журнал, и в нём нужно различать три состояния шага. Откатывать приходится и то, что только начато: падение могло случиться уже после действия, но до записи `Done`; компенсация должна быть безопасна для шага, которого на самом деле не было. Отметка `Compensated` делает восстановление повторяемым: упавшее восстановление можно запустить ещё раз, и никакой шаг не откатится дважды.'''

[[exercises]]
name = "svevt_q6"
kind = "question"
question.ru = '''Сага оформления заказа из четырёх шагов: A резервирует товар (обратимо), B списывает деньги (обратимо возвратом), C отправляет клиенту письмо «заказ принят» (необратимо), D передаёт заказ в доставку (обратимо). Где разумно поставить шаг C?'''
options.ru = [
  '''первым: клиент должен узнать о заказе как можно раньше''',
  '''вторым, сразу после резерва: так письмо уйдёт, пока всё в порядке''',
  '''последним, когда все обратимые шаги уже выполнены''',
  '''порядок не важен: компенсации потом всё исправят''',
]
answer = [2]
explain.ru = '''Необратимый шаг ставят как можно позже, после всех шагов, которые могут упасть: тогда откатывать письмо не придётся. Если поставить письмо первым, при отказе платежа клиент получит «заказ принят» про заказ, которого нет, и никакая компенсация этого не отменит (разве что второе письмо с извинениями). Компенсации исправляют обратимое, а необратимое нужно просто не делать раньше времени.'''
hint.ru = '''Что произойдёт у клиента, если после этого шага упадёт любой из следующих?'''

[[exercises]]
name = "svevt_quiz"
kind = "project"
quiz = true
style = "scratch"
locked = ["src/crates/events/tests/upcast.rs", "src/microservices/feed-service/tests/acceptance.rs"]
hint.ru = [
  '''Начни с `upcast` (его тесты короткие), потом `UserService` и `relay_once`: они дают тестам события. Общий помощник, который добавляет строку в outbox и считает `version` и `seq` внутри транзакции, пригодится всем трём методам.''',
  '''В `consume` порядок действий такой: апкаст, разбор payload (ошибка до любых изменений), блокировка состояния, сравнение версии с ожидаемой: старше ожидаемой это повтор, равная применяется, дальняя ждёт в буфере (повтор уже ждущей версии тоже дубль). Применил ожидаемое, посмотри, нет ли в буфере следующей версии, и повторяй, пока цепочка не оборвётся.''',
  '''Весь `consume` после разбора идёт под одной блокировкой `Mutex`: так проверка и отметка не разрываются. `feed` фильтрует посты по автору, сортирует по `(created_at, post_id)` по убыванию и подставляет имя при чтении. `rebuild` просто пропускает журнал через `consume`.''',
]
why.ru = '''Конвейер держится на трёх гарантиях, и каждая живёт в своём месте. Производитель пишет данные и событие одной транзакцией (outbox), релей доставляет «хотя бы раз» с неизменным идентификатором, потребитель превращает «хотя бы раз» в «один эффект» через порядок по версиям агрегата (номер версии сам работает как отметка «это уже было»). Проекция зависит только от событий, поэтому её можно пересобрать из журнала в любой момент, и результат будет тем же. Ни одна из гарантий не заменяет другую: убери любую, и соответствующий тест падает.'''

