<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Плавная остановка</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1c2330; --muted: #5d6879; --line: #c9d0db;
  --box: #eef1f6; --boxline: #aeb8c8; --ok: #1f8a4c; --bad: #c92a2a; --warn: #d9820f; --accent: #2f6fe0; --track: #e3e8f0;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14181f; --panel: #1b212b; --ink: #e6ebf3; --muted: #9aa6b8; --line: #384152;
    --box: #232b38; --boxline: #4a566b; --ok: #51cf66; --bad: #ff6b6b; --warn: #ffa94d; --accent: #6ea4ff; --track: #2a3342;
  }
}
:root[data-theme="dark"] {
  --bg: #14181f; --panel: #1b212b; --ink: #e6ebf3; --muted: #9aa6b8; --line: #384152;
  --box: #232b38; --boxline: #4a566b; --ok: #51cf66; --bad: #ff6b6b; --warn: #ffa94d; --accent: #6ea4ff; --track: #2a3342;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 980px; margin: 0 auto; padding: 16px; }
h1 { font-size: 20px; margin: 0 0 4px; }
p.sub { margin: 0 0 12px; color: var(--muted); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
button, select { font: inherit; color: var(--ink); background: var(--box); border: 1px solid var(--boxline); border-radius: 6px; padding: 5px 12px; cursor: pointer; }
button:hover:enabled { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
.spacer { flex: 1; }
svg { width: 100%; height: auto; display: block; }
svg text { fill: var(--ink); font-size: 13px; }
svg .muted { fill: var(--muted); font-size: 12px; }
#caption { margin-top: 12px; min-height: 84px; }
.step { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>Плавная остановка сервиса</h1>
  <p class="sub">Время идёт слева направо, 0 это момент SIGTERM. Закрашено то, что уже произошло.</p>
  <div class="panel">
    <div class="bar">
      <label>Сценарий <select id="scenario"></select></label>
      <span class="spacer"></span>
      <button id="reset">Сброс</button>
      <button id="prev">Назад</button>
      <button id="next">Шаг</button>
      <button id="play">Играть</button>
      <button id="theme">Тема</button>
    </div>
    <svg viewBox="0 0 940 390" role="img" aria-label="Фазы остановки во времени">
      <g id="chart"></g>
    </svg>
    <div id="caption" aria-live="polite"></div>
  </div>
</main>
<script>
"use strict";
const NS = "http://www.w3.org/2000/svg";
function el(name, attrs, parent, text) {
  const e = document.createElementNS(NS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}
const X0 = 150, SCALE = 62, T0 = -2;
const tx = (t) => X0 + (t - T0) * SCALE;
const LANES = { ready: 60, accepting: 110, A: 170, B: 205, C: 240, D: 275, bg: 335 };
const LABELS = { ready: "ready", accepting: "приём запросов", A: "запрос A", B: "запрос B", C: "запрос C", D: "новый запрос D", bg: "фоновые задачи" };
// segments: [lane, from, to, colorVar, label]
const SCEN = {
  normal: {
    title: "все запросы успели",
    segs: [
      ["ready", T0, 0, "--ok", "ready"], ["ready", 0, 12, "--bad", "не готов"],
      ["accepting", T0, 3, "--ok", "принимаем"], ["accepting", 3, 12, "--bad", "закрыто"],
      ["A", -1.5, 2, "--accent", ""], ["B", 0.5, 5, "--accent", ""], ["C", 2.4, 6, "--accent", ""],
      ["bg", T0, 6.4, "--ok", "работают"]
    ],
    marks: [["D", 4, "refused", "отказ"]],
    ends: [["A", 2, "ok"], ["B", 5, "ok"], ["C", 6, "ok"], ["bg", 6.4, "stop"]],
    exit: 6.8,
    steps: [
      [-1, "Сервис работает как обычно: готов, принимает запросы, фон крутится. Три запроса в разной стадии."],
      [0, "Пришёл SIGTERM. Первым делом <b>ready = false</b>: балансировщик на ближайшей проверке перестанет слать трафик. Но приём пока открыт."],
      [1.5, "Идёт пауза <b>grace</b>. Балансировщик ещё не заметил, и запросы всё ещё приходят: мы их принимаем. Нельзя закрывать дверь, пока у неё стоят люди."],
      [3, "Пауза прошла. <b>Приём закрыт</b>: новых подключений нет. Теперь число запросов в работе только убывает, и «дождаться их» имеет конец."],
      [4, "Опоздавший запрос D получает отказ: приём закрыт. Лучше отказ, чем запрос, который оборвётся на середине."],
      [6, "Дренаж закончился сам: все запросы в работе завершены, ни один не оборван. Время ожидания не истекло, ждали ровно столько, сколько надо."],
      [6.4, "Только теперь <b>останавливаем фон</b>: он нужен обработчикам, пока те работают (кэш, очередь, метрики)."],
      [6.8, "Процесс выходит с нулевым кодом. Клиенты ничего не заметили."]
    ]
  },
  stuck: {
    title: "запрос завис",
    segs: [
      ["ready", T0, 0, "--ok", "ready"], ["ready", 0, 12, "--bad", "не готов"],
      ["accepting", T0, 3, "--ok", "принимаем"], ["accepting", 3, 12, "--bad", "закрыто"],
      ["A", -1.5, 2, "--accent", ""], ["B", 0.5, 5, "--accent", ""], ["C", 2.4, 8, "--warn", "завис"],
      ["bg", T0, 8.4, "--ok", "работают"]
    ],
    marks: [["D", 4, "refused", "отказ"]],
    ends: [["A", 2, "ok"], ["B", 5, "ok"], ["C", 8, "cut"], ["bg", 8.4, "stop"]],
    exit: 8.8,
    steps: [
      [-1, "Работаем. Запрос C взялся за долгую операцию, но пока это нормально."],
      [0, "SIGTERM: <b>ready = false</b>. Заодно стартует отсчёт общего времени: у остановки есть предел."],
      [3, "Приём закрыт после паузы grace. Запрос C ещё идёт."],
      [5, "A и B закончились, остался один запрос C, и он не торопится."],
      [8, "Сработал <b>дедлайн дренажа</b> (5 секунд после закрытия приёма). C оборван: это плохо, но терпимо. Один зависший запрос не имеет права держать процесс вечно, оркестратор всё равно убьёт его по SIGKILL."],
      [8.4, "Фон остановлен, теперь уже можно."],
      [8.8, "Выход. В отчёте остановки видно, что дренаж не завершился (drained = false): это повод проверить, почему запрос C завис."]
    ]
  }
};
const g = document.getElementById("chart");
function color(v) { return "var(" + v + ")"; }
function render() {
  g.textContent = "";
  const sc = SCEN[sel.value];
  const stepsList = sc.steps;
  const cursor = idx < 0 ? T0 : stepsList[idx][0];
  const exited = idx >= 0 && cursor >= sc.exit;
  for (let t = T0; t <= 10; t += 2) {
    el("line", { x1: tx(t), y1: 32, x2: tx(t), y2: 355, stroke: "var(--line)", "stroke-dasharray": "3 4" }, g);
    el("text", { x: tx(t), y: 372, "text-anchor": "middle", class: "muted" }, g, t + " с");
  }
  for (const lane in LANES) {
    el("rect", { x: X0, y: LANES[lane] - 12, width: tx(10) - X0, height: 24, rx: 5, fill: "var(--track)" }, g);
    el("text", { x: 10, y: LANES[lane] + 4 }, g, LABELS[lane]);
  }
  for (const [lane, a, b, col, label] of sc.segs) {
    if (cursor <= a) continue;
    const end = Math.min(b, cursor);
    el("rect", { x: tx(a), y: LANES[lane] - 12, width: Math.max(0, tx(end) - tx(a)), height: 24, rx: 5, fill: color(col), opacity: 0.85 }, g);
    if (label && tx(end) - tx(a) > 60) el("text", { x: tx(a) + 8, y: LANES[lane] + 4, fill: "#fff", style: "fill:#fff" }, g, label);
  }
  for (const [lane, t, kind, label] of sc.ends) {
    if (cursor < t) continue;
    const col = kind === "cut" ? "--bad" : "--muted";
    const glyph = kind === "ok" ? "✓" : kind === "cut" ? "✕" : "■";
    el("text", { x: tx(t) + 4, y: LANES[lane] - 16, style: "fill:var(" + col + ");font-weight:700" }, g, glyph);
  }
  for (const [lane, t, kind, label] of sc.marks) {
    if (cursor < t) continue;
    el("text", { x: tx(t), y: LANES[lane] + 5, "text-anchor": "middle", style: "fill:var(--bad);font-weight:700" }, g, "✕ " + label);
  }
  if (idx >= 0) {
    el("line", { x1: tx(cursor), y1: 28, x2: tx(cursor), y2: 358, stroke: "var(--accent)", "stroke-width": 2.5 }, g);
  }
  if (exited) el("text", { x: tx(sc.exit) + 8, y: 24, style: "fill:var(--ok);font-weight:700" }, g, "выход");
  caption.innerHTML = idx < 0
    ? '<span class="step">Шаг 0 из ' + stepsList.length + '</span><br>Нажми «Шаг»: покажем, что происходит после SIGTERM.'
    : '<span class="step">Шаг ' + (idx + 1) + ' из ' + stepsList.length + '</span><br>' + stepsList[idx][1];
  finish();
}
const caption = document.getElementById("caption");
const sel = document.getElementById("scenario");
const btnPrev = document.getElementById("prev"), btnNext = document.getElementById("next");
const btnPlay = document.getElementById("play"), btnReset = document.getElementById("reset");
let idx = -1, timer = null;
for (const k in SCEN) { const o = document.createElement("option"); o.value = k; o.textContent = SCEN[k].title; sel.appendChild(o); }
function steps() { return SCEN[sel.value].steps; }
function stop() { if (timer) { clearInterval(timer); timer = null; } btnPlay.textContent = "Играть"; }
function next() { if (idx < steps().length - 1) { idx++; render(); } }
btnNext.onclick = () => { stop(); next(); };
btnPrev.onclick = () => { stop(); if (idx >= 0) { idx--; render(); } };
btnReset.onclick = () => { stop(); idx = -1; render(); };
btnPlay.onclick = () => {
  if (timer) { stop(); return; }
  if (idx >= steps().length - 1) idx = -1;
  btnPlay.textContent = "Пауза";
  next();
  timer = setInterval(next, 2600);
};
sel.onchange = () => { stop(); idx = -1; render(); };
document.getElementById("theme").onclick = () => {
  const root = document.documentElement;
  const dark = getComputedStyle(root).getPropertyValue("--bg").trim() === "#14181f";
  root.setAttribute("data-theme", dark ? "light" : "dark");
};
function finish() {
  btnPrev.disabled = idx < 0;
  btnNext.disabled = idx >= steps().length - 1;
  if (idx >= steps().length - 1) stop();
}
render();
</script>
</body>
</html>
