[[exercises]]
name = "svcfg1"
style = "todo"
hint.ru = """Сопоставь результат `lookup(name)` с тремя случаями: `Ok` (но проверь, не пустая ли строка), `Err(VarError::NotPresent)` и `Err(VarError::NotUnicode(_))`."""
why.ru = """«Нет переменной» и «в ней мусор» лечатся по-разному, поэтому это разные ошибки, и каждая называет переменную: админ не должен гадать, какая из двадцати имелась в виду. Пустое значение тоже отдельный случай, это обычно забытая подстановка в шаблоне. Источник значений приходит параметром, а не читается внутри: так функцию можно проверить, не трогая окружение процесса."""

[[exercises]]
name = "svcfg2"
style = "todo"
hint.ru = [
  """`parse_or`: `None` это умолчание, `Some` разбирается через `str::parse` после `trim`, провал превращается в `InvalidValue` с именем, значением и ожиданием.""",
  """`parse_port` строится на `parse_or::<u16>`, но добавляет отказ для нуля. `parse_millis` разбирает `u64` и делает `Duration::from_millis`.""",
  """В ошибке храни исходную строку, а не обрезанную: человек должен увидеть то, что он ввёл.""",
]
why.ru = """Умолчание подставляется только когда переменной нет. Если она есть, но кривая, это ошибка, а не повод молча взять 8080: опечатку в PORT иначе найдут через месяц на чужом порту. Ошибка называет переменную, значение и то, что ожидалось, потому что её прочтёт человек в логе старта."""

[[exercises]]
name = "svcfg3"
style = "scratch"
hint.ru = [
  """Каждое поле: `port("PORT", get("PORT"), 8080)?` и так далее. Вопросительный знак остановит разбор на первой ошибке.""",
  """Обязательный `DATABASE_URL`: `get("DATABASE_URL").ok_or_else(|| ConfigError::Missing(...))?`.""",
]
why.ru = """Конфиг не знает, откуда берутся значения: `from_source` принимает функцию, в проде это окружение, в тесте HashMap. Поэтому тесты не трогают окружение процесса (оно одно на все параллельные тесты) и могут собрать два конфига одновременно. `from_env` это тонкая обёртка в одну строку."""

[[exercises]]
name = "svcfg4"
style = "bughunt"
hint.ru = [
  """Найди в файле место, которое читает `std::env::var` в обход переданного источника. Тест подаёт `RETRY_LIMIT` через источник, а приложение его не видит.""",
  """У `Config` нет поля для лимита повторов. Добавь его и прочитай через `get("RETRY_LIMIT")` вместе с остальными, а `App` пусть берёт значение из `config`.""",
]
why.ru = """Один случайный `env::var` в глубине кода возвращает тесты в зависимость от окружения процесса: оно общее, меняется только небезопасным `set_var`, и параллельные тесты начинают мешать друг другу. Правило простое: окружение читается ровно в одном месте, при сборке конфига, и дальше значения путешествуют аргументами."""

[[exercises]]
name = "svcfg5"
style = "scratch"
hint.ru = [
  """Не ставь `?` на каждом поле: сначала посчитай все четыре результата, потом собери конфиг, если все четыре `Ok`.""",
  """Ошибки собирай так: `[port.err(), workers.err(), ...].into_iter().flatten().collect()`. Порядок полей сохранится сам.""",
]
why.ru = """Когда в конфиге три опечатки, цикл «запуск, ошибка про первую, правка» повторяется три раза. Сервис, который называет все проблемы сразу, экономит человеку эти запуски. Для этого разбор полей вычисляется целиком, а не прерывается на первой ошибке."""

[[exercises]]
name = "svcfg_q1"
kind = "question"
question.ru = """В образ сервиса попал файл `.env` с `LOG_LEVEL=debug`. Сервис собирает настройки слоями: окружение, потом файл, потом умолчание `info`. Оркестратор в проде задаёт `LOG_LEVEL=warn`, у разработчика на ноутбуке переменной нет, а в CI нет ни переменной, ни `.env`. Какой уровень получат прод, ноутбук и CI?"""
options.ru = [
  "прод: debug, ноутбук: debug, CI: info",
  "прод: warn, ноутбук: debug, CI: info",
  "прод: warn, ноутбук: info, CI: info",
  "прод: debug, ноутбук: info, CI: warn",
]
answer = [1]
explain.ru = """Слои применяются в порядке «чем ближе к моменту запуска, тем главнее»: окружение побеждает файл, файл побеждает умолчание. На проде переменная есть, поэтому warn, и забытый в образе `.env` её не перебивает. На ноутбуке переменной нет, значит берётся файл: debug. В CI нет ни того ни другого, остаётся умолчание info."""
hint.ru = """Для каждого окружения найди самый «близкий» слой, в котором значение вообще есть."""

[[exercises]]
name = "svcfg6"
style = "scratch"
hint.ru = [
  """Разбирай построчно: `trim`, пропусти пустое и начинающееся с `#`, отрежь `export `, потом `split_once('=')` (он делит по ПЕРВОМУ знаку, остальные `=` остаются в значении).""",
  """Значение в кавычках: если оно начинается и заканчивается одной и той же кавычкой, достань внутренность и больше ничего не трогай. Без кавычек отрежь хвост от ` #`.""",
  """`layered` это одна строка: `real(name).or_else(|| file.get(name).cloned())`.""",
]
why.ru = """Формат .env кажется тривиальным, пока в значении не встретится `=` (адрес базы с параметрами) или `#` (пароль). Кавычки нужны, чтобы эти символы не считались синтаксисом. Слои собираются функцией-источником: окружение первым, файл вторым, потому что на проде переменные задаёт тот, кто запустил процесс."""

[[exercises]]
name = "svcfg7"
style = "todo"
hint.ru = """`Debug` и `Display` для `Secret<T>` не должны требовать `T: Debug`: просто запиши строку через `f.write_str(...)`. Значение отдаётся только методом `expose`."""
why.ru = """Секрет защищён типом, а не дисциплиной: напечатать его нечаянно нельзя, ни через `{:?}` всего конфига, ни через `{:#?}`. Достать значение можно только явным `expose()`, и это слово легко найти поиском по коду. Это дешевле, чем надеяться, что никто не напишет `info!("{config:?}")`."""

[[exercises]]
name = "svcfg8"
style = "todo"
hint.ru = [
  """`tokio::signal::unix::signal(SignalKind::terminate())` и `SignalKind::interrupt()` дают потоки сигналов. Подписка происходит в момент вызова `signal(...)`, а не при первом `recv()`.""",
  """В `wait` два `recv()` в `tokio::select!`, каждая ветка возвращает свой `Signal`.""",
]
why.ru = """Подписываемся на сигналы заранее, в `new`, потому что сигнал, пришедший до подписки, убьёт процесс по умолчанию. `select!` по двум потокам даёт «что пришло первым» без гонки. SIGTERM шлёт оркестратор, SIGINT это Ctrl+C: реагировать нужно одинаково."""

[[exercises]]
name = "svcfg_q2"
kind = "question"
question.ru = """Оркестратор даёт сервису 30 секунд на остановку, потом шлёт SIGKILL. После SIGTERM сервис снимает готовность, ждёт `grace` = 5 секунд, перестаёт принимать запросы и дожидается текущих. Самые долгие запросы (выгрузка отчёта) идут до 40 секунд. Каким выбрать дедлайн дренажа?"""
options.ru = [
  "40 секунд: ни одна выгрузка не должна прерваться",
  "около 20 секунд: вместе с grace это укладывается в 30, а оставшиеся запросы лучше оборвать самим и записать в лог",
  "0 секунд: незачем ждать",
  "без дедлайна: пусть ждёт, сколько нужно",
]
answer = [1]
explain.ru = """Всё, что случится после 30-й секунды, сделает уже SIGKILL: он оборвёт процесс без разговоров, в том числе и фоновые задачи. Поэтому сумма `grace` и дедлайна дренажа должна уложиться в срок оркестратора с запасом, а запросы, которые не успели, лучше оборвать самим и увидеть в отчёте остановки (`drained = false`). 40 и «без дедлайна» просто перенесут обрыв на SIGKILL, но без записи в лог. Нулевой дедлайн теряет запросы, которые успели бы закончиться."""
hint.ru = """Посчитай, сколько времени остаётся после grace, прежде чем придёт SIGKILL."""

[[exercises]]
name = "svcfg9"
style = "scratch"
hint.ru = [
  """Ожидание текущих запросов без потолка зависнет на одном зависшем запросе. Подумай, чем ограничить цикл по времени: например `tokio::time::timeout` вокруг него или сравнение с `Instant`.""",
  """Цикл дренажа: каждые несколько миллисекунд смотри `in_flight`; вышел по нулю это `drained = true`, вышел по дедлайну это `false`. Время считай через `tokio::time::Instant`.""",
  """Фоновые задачи: `handle.abort()` у каждой, потом `handle.await`, чтобы убедиться, что они действительно закончились.""",
]
why.ru = """Каждый шаг решает свою проблему: «не готов» гасит поток новых запросов, пауза даёт балансировщику время заметить, закрытие приёма делает набор текущих запросов конечным, дедлайн защищает от зависшего запроса, остановка фона в самом конце потому, что обработчикам он нужен, пока они работают. Тесты наблюдают за этим со стороны, на замороженных часах, поэтому порядок и паузы проверяются точно."""

[[exercises]]
name = "svcfg10"
style = "fix"
hint.ru = [
  """Задачи, запущенные через `tokio::spawn`, никто не ждёт, и вместе с рантаймом они умирают. Складывай принятые запросы туда, где их можно дождаться.""",
  """Возьми `JoinSet`: `spawn` в него вместо `tokio::spawn`, а после выхода из цикла `while set.join_next().await.is_some() {}`.""",
]
why.ru = """Выйти из цикла приёма мало: у принятых запросов свои задачи, и когда `main` возвращается, рантайм их обрывает. `JoinSet` держит все активные задачи в одном месте, и после команды остановки мы дожидаемся именно их. Новые запросы при этом уже не берём: цикл прерван."""

[[exercises]]
name = "svcfg11"
style = "scratch"
hint.ru = [
  """`live` не зависит ни от чего, это `true`. Живость говорит только «процесс отвечает».""",
  """В `ready`: если идёт остановка, сразу вернуть «не готов». Иначе запусти все проверки через `join_all`, каждую оберни в `tokio::time::timeout(self.check_timeout, check.run())`.""",
  """Провал по таймауту это `("имя", "timeout")`. Порядок провалов совпадает с порядком регистрации проверок.""",
]
why.ru = """Проверки идут одновременно: три проверки по 400 мс подряд заняли бы 1200 мс, а оркестратор ждёт ответ секунду-две. У каждой свой лимит времени, потому что зависшая база не должна подвешивать `/ready`. Живость не ходит ни к каким зависимостям: её единственный смысл сказать «процесс не завис»."""

[[exercises]]
name = "svcfg_q3"
kind = "question"
question.ru = """Сервис умеет работать без кэша Redis, только медленнее: при промахе он идёт в основную базу. Redis недоступен уже десять минут. Что правильно отвечают `/health` и `/ready`?"""
options.ru = [
  "`/health` 200, `/ready` 503: без кэша трафик принимать нельзя",
  "`/health` 200, `/ready` 200: сервис деградировал, но справляется, а недоступность кэша видна в метриках и логах",
  "`/health` 503: оркестратор перезапустит экземпляр, и кэш подхватится",
  "`/health` 200, `/ready` 503 на половине экземпляров, чтобы нагрузка распределилась",
]
answer = [1]
explain.ru = """Готовность отвечает на вопрос «может ли экземпляр сейчас делать полезную работу?». Без кэша может, пусть медленнее, а если снять трафик со всех экземпляров сразу, получится полный отказ вместо замедления. Значит, проверка Redis не входит в `ready` (или помечена как необязательная и лишь попадает в отчёт). Перезапуск через `/health` кэш не вылечит, а холодный старт всех экземпляров одновременно ударит по основной базе. Обязательной зависимостью считают ту, без которой работа невозможна."""
hint.ru = """Спроси себя: что хуже для пользователя, медленные ответы или отказ?"""

[[exercises]]
name = "svcfg12"
style = "bughunt"
hint.ru = [
  """Прогони в голове три ситуации из тестов. В каждой спроси: должен ли оркестратор сейчас убить процесс? Если нет, значит, `/health` отвечает не то. Ошибок две, и живут они в разных местах.""",
  """Один дефект в `route`: ветка `/health` ходит к зависимостям. Второй в самом `Health`: посмотри, от чего зависит `live`, и сравни с тем, что говорит тест про остановку.""",
  """Живость не зависит ни от зависимостей, ни от остановки: `live` не должен читать `shutting_down`, а ветка `/health` должна звать именно `live`, а не проверки зависимостей.""",
]
why.ru = """Если liveness проверяет зависимости, падение базы убивает все экземпляры сразу, они перезапускаются, снова не видят базу, и цикл повторяется. Если liveness падает при остановке, оркестратор убивает процесс посреди дренажа, и все плавные шаги теряют смысл. Живость отвечает на единственный вопрос «процесс не завис?»: её ответ не зависит ни от чего снаружи и не ждёт никого, поэтому зависшая проверка не может подвесить и ответ про живость."""

[[exercises]]
name = "svcfg13"
style = "scratch"
hint.ru = [
  """В `wait_for` считай попытки в цикле: вызвал `probe`, при `Ok` вернул число попыток, при `Err` решаешь, ждать ли дальше.""",
  """Решение «ждать ли»: следующая попытка пришлась бы на `elapsed + interval`. Если это больше `total`, сдаёмся сразу, без лишней паузы.""",
  """`start`: сначала `source("DATABASE_URL")` (нет значения это `StartupError::Config` без единого вызова пробы), потом `wait_for("database", ...)`.""",
]
why.ru = """Ожидание зависимости ограничено паузой между попытками и общим дедлайном: без него сервис мог бы висеть вечно. Кривой конфиг ожиданием не лечится, поэтому он проверяется первым и падает сразу, не делая ни одной попытки. Время в тестах заморожено, поэтому число попыток и длительность можно проверять точно."""

[[exercises]]
name = "svcfg14"
style = "fix"
hint.ru = [
  """Нужна точка отсчёта: `Instant::now() + total` при входе в `run`. Проверяй её в цикле после каждого прохода по зависимостям.""",
  """Когда следующая пауза вышла бы за дедлайн, запиши в состояние `Failed` с именами тех, кого не дождались (`pending`), через `, `, и вернись.""",
]
why.ru = """Бесконечное «запускаюсь» хуже падения: оркестратор терпеливо ждёт, мониторинг молчит, а причина зарыта в логах. Дедлайн общий на все зависимости (а не на каждую), и итог называет конкретные недождавшиеся сервисы. Падение с понятной причиной можно перезапустить автоматически и показать в алерте."""

[[exercises]]
name = "svcfg15"
style = "scratch"
hint.ru = [
  """Для каждой задачи заведи свою асинхронную функцию-надзирателя: цикл «запустить, дождаться, при сбое пауза и снова», со счётчиком перезапусков.""",
  """Панику поймай прямо в цикле: `AssertUnwindSafe((spec.factory)()).catch_unwind().await`. Тогда отмена надзирателя (`abort`) сама отменит и задачу внутри.""",
  """В `run` все надзиратели лежат в `JoinSet`. `select!` по `shutdown.changed()` и `join_next()`: остановка и критичный отказ делают `abort_all` и выходят.""",
]
why.ru = """Супервизор различает важность: некритичная задача сдалась и остаётся выключенной (процесс живёт и это видно в метриках), критичная роняет весь процесс, чтобы оркестратор поднял его заново. Панику ловим внутри цикла, а не отдельным `spawn`: тогда при остановке надзирателя задача гибнет вместе с ним и не продолжает работать брошенной."""

[[exercises]]
name = "svcfg16"
style = "bughunt"
hint.ru = [
  """`JoinSet::join_next_with_id` возвращает `Result`: в `Err` лежит `JoinError`, и у паники он есть. Сейчас его выбрасывают циклом `while ... .is_some() {}`.""",
  """Посмотри в `meta`, критична ли упавшая задача (по `id` из `JoinError::id()`). Критичная: `abort_all` и ошибка. Остальные просто считай.""",
]
why.ru = """Паника внутри `tokio::spawn` не роняет программу: она превращается в `JoinError` для того, кто держит `JoinHandle`. Если этот результат выбросить, критичная задача умрёт молча, а сервис будет жить без неё и отдавать устаревшие данные. Результат ожидания задачи всегда нужно разбирать, а не терять."""

[[exercises]]
name = "svcfg_runtime"
kind = "project"
quiz = true
style = "scratch"
locked = [
  "src/crates/service-runtime/tests/acceptance.rs",
  "src/microservices/echo-service/tests/acceptance.rs",
]
hint.ru = [
  """Почти весь код уже написан в задачах главы: перенеси его в модули `service-runtime` и согласуй типы. Начни с `config`, он нужен `echo-service`.""",
  """`Settings::from_source` собирается из `parse_or` и `required`; складывай все ошибки в `Vec`, не выходи на первой. Ошибку битого `.env` оформи как `ConfigError::Invalid` с именем `.env`.""",
]
why.ru = """Крейт принимает источник значений снаружи и не знает про окружение, поэтому его можно проверять на замороженных часах без сети. Каждый сервис получает одинаковый старт, остановку и пробы, а `main` остаётся коротким: прочитал, собрал, запустил."""

[[exercises]]
name = "m34_service_runtime"
kind = "milestone"
journey = "backend"
quiz = true
