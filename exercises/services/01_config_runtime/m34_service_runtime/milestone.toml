"""Ошибки конфига собирай, а не возвращай по одной: после неудачного разбора верни умолчание и читай дальше, а `finish` отдаст всё
сразу. Сертификаты и `bind` оставь в main: `from_source` без файлов и сети проверяется обычным тестом.""",
"""В `Lifecycle::run` два `select!`. Первый ждёт готовности рядом с фоном и сигналом, с `biased`, чтобы сигнал до старта
