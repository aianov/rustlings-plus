не опрашивают, запросы не принимаются, поэтому неудачный старт не обслужит ни одного запроса.""",
"""Наблюдатели за соседями должны работать уже во время ожидания, иначе `/ready` никогда не позеленеет и старт упадёт по
дедлайну. Поэтому `Readiness::supervised` кладёт их в `Background`, а фон запускается внутри `run` с самого начала.
`process::exit` в проекте запрещён: второй сигнал только пишется в журнал, остановка и так укладывается в grace и drain.""",
]
story.ru = """Сервисы научились жить долго: читают настройки один раз и проверяют их все сразу, на SIGTERM уходят по шагам,
честно отвечают на /health и /ready, ждут соседей с дедлайном и не держат упавший фон в тайне."""
