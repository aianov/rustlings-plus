hint.ru = [
"""Начни с `service/token/`: base64url и HMAC проверяются векторами RFC отдельно от всего остального, а `verify`
собирай строго по порядку из главы. Пока подпись не сошлась, в токене всё написано кем угодно: декодируй claims только
после `hmac::same`. Заголовок и claims как типы с serde положи в `common/claims.rs`: в service нет `Deserialize`.""",
"""Сессии это одна карта «хеш refresh → строка» под одним замком: `rotate` за одну блокировку находит строку, проверяет
семейство, пометку `used` и срок, ставит пометку и кладёт новую. Повтор помеченной строки гасит всё семейство и кладёт
`jti` его access в список отзыва до `access_exp + leeway`, чтобы погасли и уже выданные access.""",
"""argon2 в отладочной сборке медленный: `opt-level = 3` для пакетов `argon2` и `blake2` в корне, а `Config::default()`
с `Cost::QUICK` для тестов. Фальшивый хеш для неизвестного ника считается тем же хешером, иначе время ответа выдаст,
есть ли такой ник.""",
"""Роль едет от токена до post-service так: auth-service кладёт её в claims, `ValidateToken` возвращает `role`, шлюз
держит её в `Ctx::acting_as`, `Stamp::role` пишет `x-user-role`, а `caller` переносит в `CallerRole`. Права решает
service post-service: контроллер только собирает `Actor`. Без роли это гость, и гостю нельзя ничего.""",
"""Тесты прошлых вех регистрируются с паролем `correct-horse`: так в новой версии `support.rs` и в сценариях клиента.
Клиент курса уже умеет cookie `refresh`; если сценарий падает на «сессия закрыта», проверь, что `/auth/refresh` читает
cookie, а не тело, и стирает её при отказе.""",
]
story.ru = """Вход стал настоящим: пароли на argon2, короткий подписанный access, refresh в HttpOnly cookie с ротацией и
гашением семейства, выход везде, смена и сброс пароля, роли, по которым модератор убирает чужие посты."""
