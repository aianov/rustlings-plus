[chapter]
title.en = "Authentication and permissions"
title.ru = "Аутентификация и права"

[[chapter.visuals]]
file = "visuals/login_flow.html"
title.ru = "Вход, обновление, кража refresh-токена и выход везде"

[[chapter.visuals]]
file = "visuals/token_anatomy.html"
title.ru = "Устройство токена и порядок проверки: подпись, потом всё остальное"

[[exercises]]
name = "svauth1"
style = "fix"
hint.ru = [
  """Две беды в одной: алгоритм быстрый, и соли нет. Нужен медленный алгоритм с памятью (argon2) и случайная соль на каждую запись. Крейт `argon2` умеет хранить всё в одной строке формата PHC.""",
  """В `argon2` пара трейтов: `PasswordHasher::hash_password` принимает пароль и `SaltString`, `PasswordVerifier::verify_password` принимает пароль и разобранный `PasswordHash`. Соль берётся из `SaltString::generate(&mut OsRng)`. Разбор записи может вернуть ошибку: её не `unwrap`-ят.""",
]
why.ru = """Быстрый хеш без соли превращает утечку в таблицу ответов: словарь прогоняется за миллисекунды, а одинаковые пароли видны сразу. Argon2 дорог по памяти, поэтому подбор на видеокартах не ускоряется, а соль в каждой записи делает каждый пароль отдельной задачей. PHC-строка несёт алгоритм, параметры и соль, поэтому проверка не требует никаких других колонок и параметры потом можно менять (см. следующую задачу). Мусор вместо записи это обычный отказ, а не паника: базу правят руками."""

[[exercises]]
name = "svauth_q1"
kind = "question"
question.ru = """Разработчик решил усилить хранение паролей: вместо `sha256(пароль)` хранить `sha256(соль + пароль)`, соль случайная и своя у каждого пользователя. Базу украли. Что это даёт против атакующего с видеокартой?
"""
options.ru = [
  "почти ничего не меняется: sha256 считается миллиарды раз в секунду, поэтому перебор слабых паролей остаётся быстрым и дешёвым для каждого пользователя",
  "общие таблицы хешей и сравнение хешей между людьми перестают работать, но каждый отдельный пароль подбирается так же быстро, как раньше",
  "соль делает хеш необратимым, а раньше его можно было развернуть обратно в пароль, и именно это пугало разработчика",
  "перебор становится невозможным, пока соль не украдена вместе с базой, потому что без неё атакующий не знает входных данных",
]
answer = [1]
explain.ru = """Соль решает одну задачу: убирает общие таблицы и сравнение хешей между пользователями. Но она хранится рядом с хешем, и скорость перебора для каждого пользователя остаётся прежней: быстрый алгоритм считается миллиарды раз в секунду. Поэтому нужны оба: уникальная соль и намеренно дорогой алгоритм с памятью. Хеш и до этого был необратим, обратимым его никто не считал."""
hint.ru = """Где хранится соль и сколько стоит одна попытка подбора?"""

[[exercises]]
name = "svauth2"
style = "todo"
hint.ru = [
  """Параметры записи лежат в самой PHC-строке: `Params::try_from(&PasswordHash)`. Проверять пароль нужно теми параметрами, которые в записи, а не целевыми.""",
  """Сначала проверь пароль, и только в случае успеха сравни параметры записи с целевыми: слабее хотя бы по одному из `m_cost`, `t_cost`, `p_cost` значит, что нужна новая запись. Новую запись считаем из открытого пароля, который у нас есть сейчас.""",
]
why.ru = """Перехеширование при входе единственный момент, когда у сервиса есть открытый пароль, и лучшее место для миграции параметров: пользователи не замечают, а база постепенно сильнеет. Проверка идёт параметрами из записи (иначе старые пароли перестанут проходить), обновление только после успешной проверки (иначе неверный пароль мог бы подменить запись), и запись сильнее целевой не ослабляется."""

[[exercises]]
name = "svauth3"
style = "fix"
hint.ru = [
  """Дорогое вычисление в async-функции стоит поток рантайма, пока не закончится: там нет точек `.await`, где рантайм мог бы переключиться. Для таких задач у tokio есть отдельный пул потоков.""",
  """`tokio::task::spawn_blocking` принимает замыкание `'static`, поэтому передай внутрь владеющие копии строк и клон `Arc` с функцией. Разрешение семафора получи до запуска и держи до конца работы, не выпускай раньше времени.""",
]
why.ru = """Argon2 это секунды процессорного времени и десятки мегабайт памяти. В async-коде он замораживает всех соседей на том же потоке, поэтому его выносят в `spawn_blocking`. Семафор нужен отдельно: пул блокирующих потоков большой, и без лимита сотня одновременных входов съест память. Разрешение живёт до конца вычисления, иначе оно ограничивает только очередь, а не нагрузку."""

[[exercises]]
name = "svauth4"
style = "todo"
hint.ru = [
  """Итератор с `all` или цикл с ранним `return` останавливаются на первой разнице, и это ровно то, что нельзя. Работу над всеми парами нужно проделать всегда, а решение принять после цикла.""",
  """Накопи различие в одной переменной: `diff |= x ^ y` для каждой пары. Если в конце `diff == 0`, всё совпало. Длины сравнивай заранее: длина подписи не секрет.""",
]
why.ru = """Раннее завершение сравнения утекает по времени: чем больше префикс угадан, тем дольше ответ. Накопление разницы через XOR делает время зависящим только от длины. Длину проверяют до цикла, потому что она в протоколе известна всем (подпись фиксированной длины). Современный компилятор может испортить такую ручную защиту, поэтому в боевом коде берут проверенный крейт; здесь мы учимся видеть, где кроется утечка."""

[[exercises]]
name = "svauth5"
style = "scratch"
hint.ru = [
  """Три байта это 24 бита, и они же четыре символа по 6 бит. Хвост из одного или двух байтов даёт два или три символа. Паддинга в конце нет: количество символов само говорит, сколько байтов закодировано.""",
  """В декодере работай группами по 4 символа: собери число, потом достань нужное число старших байтов (`n.to_be_bytes()`). Если группа неполная, неиспользуемые младшие биты обязаны быть нулями, иначе для одного набора байтов найдутся две записи. Длина `4k+1` невозможна.""",
]
why.ru = """Два разных текста для одних и тех же байтов опасны в подписях: проверяют одну запись, а в логи или список отозванных попадает другая. Поэтому декодер строгий: нет паддинга, нет чужих символов, нет ненулевых хвостовых битов. Алфавит `-_` годится прямо в URL и заголовки без экранирования, поэтому им и подписывают токены."""

[[exercises]]
name = "svauth6"
style = "scratch"
hint.ru = [
  """Два прохода SHA-256. Первый считается от (`ключ ^ 0x36`) и сообщения, второй от (`ключ ^ 0x5c`) и результата первого. Ключ предварительно доводится до размера блока: 64 байта, недостающее нулями.""",
  """`Sha256::new()`, потом `update` для каждой части по очереди (склеивать в один буфер не нужно), в конце `finalize()`. У массива есть `map`, он удобно применяет XOR к каждому байту.""",
]
why.ru = """HMAC устроен в два вложенных хеша не из прихоти: наивное `sha256(ключ + сообщение)` позволяет дописать к сообщению хвост и пересчитать подпись, не зная ключа (удлинение). Две разные заливки ключа и внешний хеш закрывают этот ход. Векторы RFC 4231 это единственный способ узнать, что твоя реализация совпадает с чужими: любое расхождение в байте значит, что твои токены никто больше не проверит."""

[[exercises]]
name = "svauth7"
style = "bughunt"
hint.ru = [
  """Две независимые поломки. Первая видна в векторах 6 и 7: что должно происходить с ключом длиннее блока? Вторая в `verify`: что делает `zip`, когда одна из последовательностей короче?""",
  """Ключ длиннее 64 байт не обрезают, а заменяют его хешем (и дополняют нулями). В `verify` длины сравнивают до побайтового сравнения, а само сравнение делают без раннего выхода: накопи разницу, а не вызывай `all`.""",
]
why.ru = """Ключ длиннее блока по стандарту хешируется, а обрезание тихо сводит разные ключи в один: тестовые ключи были короткие, поэтому поломка жила до первого клиента. Вторая ошибка опасней: `zip` останавливается на самой короткой стороне, и подпись из нуля или одного байта проходит. Проверка длины и сравнение без раннего выхода закрывают обе дыры (см. задачу про сравнение за постоянное время)."""

[[exercises]]
name = "svauth8"
style = "scratch"
hint.ru = [
  """Порядок такой: заголовок и данные превращаются в JSON (`serde_json::to_vec`), потом в base64url, потом склеиваются через точку, потом от этой строки считается HMAC и дописывается третьей частью. Разбор делает то же самое в обратную сторону.""",
  """Для разбора раздели строку по точкам и сопоставь с образцом `[a, b, c]`: любое другое количество частей это `Malformed`. Каждый шаг (base64, JSON) может провалиться, и любой провал это `Malformed`, а не паника. Подписываемую часть верни ровно такой, какой она пришла: не пересобирай её из разобранных данных.""",
]
why.ru = """Подпись считается от строки `заголовок.данные` в том виде, в каком она пришла: если пересобрать её из разобранных структур, байты могут отличаться (порядок полей, пробелы), и честный токен перестанет проходить или, хуже, будет проходить поддельный. `kid` в заголовке нужен, чтобы поддерживать несколько ключей (см. ниже). Все ошибки разбора сводятся в один вариант: клиенту незачем знать, на каком шаге мы споткнулись."""

[[exercises]]
name = "svauth9"
style = "scratch"
hint.ru = [
  """Сначала только подпись: пересчитай HMAC от `signing_input` и сравни с пришедшей через `ct_eq`. Пока она не сошлась, поля `claims` не трогай, даже если они уже разобраны.""",
  """После подписи идут сроки в таком порядке: `exp`, `nbf`, `iss`, `aud`. Допуск `leeway` расширяет окно действия в обе стороны. Складывай с `saturating_add`: `exp` из токена может быть `u64::MAX`.""",
]
why.ru = """Данные токена до проверки подписи это анонимная записка. Если сначала смотреть на срок или роль, поддельный токен заставит сервис выполнить логику (и выдать подсказку, что он понял) ещё до того, как выяснится, что токен фальшивый. Допуск на рассинхрон нужен всегда: часы у разных серверов расходятся на секунды, и без него токен «ещё не действует» на соседнем сервисе. Часы за трейтом позволяют проверить границы секунда в секунду."""

[[exercises]]
name = "svauth_q2"
kind = "question"
question.ru = """Сервис проверяет токен так:
```rust
let claims = parse(token)?;
if claims.exp <= now { return Err(Expired); }
if !verify_signature(&claims, &key) { return Err(BadSignature); }
```
Пришёл подделанный токен: данные написал атакующий, подпись случайная, срок в данных давно прошёл. Что здесь плохо?"""
options.ru = [
  "ничего: просроченный токен всё равно надо отвергнуть, поэтому порядок проверок не важен, а срок проверяется быстрее подписи",
  "решение принимается по данным, за которыми ещё нет подписи: сервис разбирает слова постороннего и отвечает по ним, а это лишняя поверхность атаки",
  "подпись надо проверять в самом конце, потому что это самая дорогая операция, и дешёвые проверки должны идти раньше",
  "проблема только в том, что `Expired` и `BadSignature` это разные ошибки, и клиенту нужно отдавать одну на всех",
]
answer = [1]
explain.ru = """Пока подпись не проверена, каждое поле внутри токена это слова постороннего. Решение по ним (срок, роль, издатель) уже сообщает атакующему, что его разбор дошёл так далеко, а при небрежном коде ведёт к уязвимостям (так появились атаки с алгоритмом none и подменой ролей). Подпись проверяют первой, а дорогой она не бывает: HMAC считается за микросекунды. Единый ответ на клиентской стороне тоже разумен, но суть в порядке."""
hint.ru = """Чьи это слова, пока подпись не сошлась?"""

[[exercises]]
name = "svauth_q3"
kind = "question"
question.ru = """У Алисы и у атакующего оказался один и тот же refresh-токен R1 (его украли с телефона). Атакующий успел первым и обменял R1 на пару с токеном R2. Через минуту телефон Алисы отправляет на сервер R1. Что должен сделать сервер с ротацией и обнаружением повтора?"""
options.ru = [
  "отдать Алисе новую пару: она настоящая владелица, а R1 пришёл с её телефона, значит, ему можно верить",
  "отказать, но оставить R2 рабочим: пусть всё идёт как идёт, нам важнее не разлогинить пользователя лишний раз",
  "отказать и погасить всё семейство вместе с R2: настоящего владельца сервер не знает, вход нужно повторить",
  "молча принять R1 и ничего не менять: токены одного пользователя взаимозаменяемы, кто бы их ни прислал",
]
answer = [2]
explain.ru = """Повтор уже использованного токена говорит, что у токена две копии у разных людей. Сервер не может отличить владельца от вора: оба предъявляют правильный секрет. Безопасный выход погасить всё семейство, включая R2, и потребовать пароль. Неудобство одного пользователя дешевле, чем свободный доступ вору. Выдача новой пары Алисе («она настоящая») оставила бы вору рабочий R2, а то и обоим."""
hint.ru = """Может ли сервер знать, кто из двоих настоящий?"""

[[exercises]]
name = "svauth_q4"
kind = "question"
question.ru = """В логах появилось странное: попытки входа на несуществующие ники в среднем завершаются за 2 миллисекунды, а на существующие с неверным паролем за 90. Других отличий в ответах нет, оба раза 401 и один и тот же текст. Чем это опасно и что делать?"""
options.ru = [
  "ничем не опасно: тела и коды ответов одинаковые, значит, по ним ничего не утекает и наружу видно то же самое",
  "по времени ответа можно перебирать ники и узнавать, кто зарегистрирован, а лечится это такой же проверкой против заготовленного хеша",
  "это признак перегрузки сервиса, надо поднять лимит запросов и увеличить число потоков, тогда времена выровняются",
  "надо добавить случайную задержку к каждому ответу, и тогда хешировать при неизвестном нике уже необязательно",
]
answer = [1]
explain.ru = """Время ответа это тоже ответ. Разница между 2 и 90 мс позволяет перебирать ники и составлять список аккаунтов для подбора паролей и фишинга. Лечение в том, чтобы делать для неизвестного ника ту же работу: проверять пароль против заготовленного фальшивого хеша тех же параметров. Случайная задержка размывает разницу хуже и требует подбирать диапазон, а честная одинаковая работа выравнивает по построению."""
hint.ru = """Что у сервиса делается в первом случае и не делается во втором?"""

[[exercises]]
name = "svauth10"
style = "bughunt"
hint.ru = [
  """Кто решает, как проверять токен: сервер или тот, кто его прислал? Заголовок приходит из недоверенного источника, и ему нельзя разрешать выбирать метод проверки. Второй дефект виден по порядку строк в функции.""",
  """Алгоритм у нас один, и сравнивается он строго: любое другое значение (включая `none` и другой регистр) это `UnsupportedAlg` до всякой работы с подписью. Потом подпись через `ct_eq`, и только после неё срок.""",
]
why.ru = """Алгоритм подписи в заголовке это совет атакующего: стандарт допускает `none`, и ошибочные библиотеки годами принимали такие токены. Правильный сервер знает свой алгоритм заранее и сверяет заголовок с ним строго. Порядок «подпись, потом всё остальное» не позволяет подделке проникнуть дальше первой проверки, а сравнение без раннего выхода не даёт подбирать подпись по времени."""

[[exercises]]
name = "svauth11"
style = "fix"
hint.ru = [
  """Сервис помнит только один ключ и проверяет им всё. Что должно храниться после смены ключа, чтобы токены, выданные минуту назад, жили дальше?""",
  """Нужны текущий ключ и список прошлых, поиск идёт по `kid` из заголовка. Неизвестный `kid` это отдельная ошибка до проверки подписи. `kid` только выбирает ключ: подпись всё равно проверяется этим ключом, и «обманный» токен проваливается там. Вывод ключа из оборота возвращает `true`, только если он действительно был в списке прошлых.""",
]
why.ru = """Ротация ключа работает, только когда старые токены доживают свой срок: поэтому связка хранит прошлые ключи, а `kid` подсказывает, каким из них проверять. Вывод старого ключа из оборота это тоже действие: так отзывают все токены, подписанные скомпрометированным ключом. `kid` приходит от клиента, поэтому он лишь указатель в нашей связке: неизвестный отклоняется, а подпись проверяется выбранным ключом так же строго."""

[[exercises]]
name = "svauth12"
style = "fix"
hint.ru = [
  """Что именно лежит в `HashMap` в качестве ключа? Если дамп таблицы можно использовать как набор токенов, значит, ключом служит секрет.""",
  """Положи в таблицу `sha256_hex(токен)`, а наружу отдавай сам токен. Искать нужно так же: хеш от присланного. Соль тут не нужна, потому что токен случайный и длинный, а не придуманный человеком.""",
]
why.ru = """Секрет, по которому открывают дверь, в базе хранить нельзя, хоть это пароль, хоть refresh-токен. Хеш необратим, поэтому украденная таблица не даёт войти. Быстрый хеш здесь уместен, в отличие от паролей: у токена 256 бит случайности, перебирать его бессмысленно, а проверка должна быть быстрой. Тест проверяет самое важное: каждая строка дампа, использованная как токен, ничего не открывает."""

[[exercises]]
name = "svauth13"
style = "scratch"
hint.ru = [
  """В таблице лежат хеши refresh-токенов и признак «уже использован». Обмен это: найти, проверить, пометить использованным и выдать новую строку с новым токеном. Всё это пока может происходить под одной блокировкой.""",
  """Порядок проверок: есть ли такой токен, не использован ли он, не просрочен ли. Срок нового токена отсчитывается от текущего времени (`Clock`), а не от срока старого. Старую строку не удаляй, а помечай: пригодится, чтобы отличать «такого не выдавали» от «уже использован».""",
]
why.ru = """Ротация превращает долгоживущий секрет в одноразовый: каждый refresh работает один раз, поэтому украденная копия бесполезна, как только хозяин обменял свой токен (или наоборот, вор обменял первым, и тогда хозяин получит отказ, что уже сигнал). Строки не удаляются, а помечаются: без этой метки нельзя понять, что токен предъявили повторно, а это главный признак кражи (следующая задача)."""

[[exercises]]
name = "svauth14"
style = "fix"
hint.ru = [
  """Найди место, где блокировка отпускается между «проверил» и «записал». Пока она отпущена, второй поток видит ту же строку непомеченной. Проверка и пометка должны быть одним неделимым действием.""",
  """Всё решение принимается под одной блокировкой: найти строку, проверить семейство, использованность и срок, пометить, вставить новую. Если токен уже использован (или его семейство погашено), занеси семейство в список погашенных и верни `Reused`. В реальной базе это одна транзакция, а в памяти один `MutexGuard`.""",
]
why.ru = """Состояние гонки «проверил, потом записал» превращает одноразовость в формальность: два запроса видят один и тот же непомеченный токен. Лечение не в sleep и не в повторной проверке, а в неделимой операции. Повтор использованного токена это сигнал: либо вор уже обменял, либо хозяин после вора. Определить, кто есть кто, невозможно, поэтому безопасный ответ это погасить всё семейство и потребовать нового входа. Другие входы пользователя (другое семейство) остаются."""

[[exercises]]
name = "svauth15"
style = "scratch"
hint.ru = [
  """Подпись токена не умеет «забывать». Отзыв держится на двух списках: сессии с признаком «жива» (для refresh) и список отозванных `jti` (для access). Сделай одну внутреннюю функцию «отозвать сессию» и вызывай её из всех трёх операций.""",
  """В denylist записывай `jti` вместе со сроком токена `exp`: запись нужна ровно до этого момента. `purge` убирает записи с `exp <= now`. Повторный отзыв той же сессии не должен ничего ломать и умножать.""",
]
why.ru = """Stateless-токен нельзя отозвать, поэтому к нему добавляют минимум состояния: список `jti` с общим сроком. Срок записи равен сроку токена, и больше хранить не надо: после него токен всё равно отвергнется по `exp`, а список не растёт бесконечно. «Выйти везде» и смена пароля используют ту же операцию отзыва, поэтому ведут себя одинаково; смена пароля оставляет текущее устройство, иначе пользователь выкинет сам себя."""

[[exercises]]
name = "svauth16"
style = "todo"
hint.ru = [
  """Для каждой роли перечисли выданные права явно, а для остального пусть будет `false`. Нет ли у тебя ветки, которая говорит «да» всем, кого не перечислили?""",
  """`matches!(permission, A | B | C)` записывает список выданных прав в одну строку. Для гостя ответ всегда `false`. Админу можно выдать всё сразу, но тогда новое право попадёт ему автоматически, и это должно быть осознанным решением.""",
]
why.ru = """Запрет по умолчанию значит, что забытая строка в таблице делает систему строже, а не слабее. Явное перечисление прав читается как документ, и в ревью видно, что именно получила роль. Тест проверяет лестницу: старшая роль не может иметь меньше, чем младшая, иначе повышение станет понижением. Админская ветка «всё разрешено» самая опасная в таблице, и о каждом новом праве стоит помнить, что оно там появится само."""

[[exercises]]
name = "svauth17"
style = "bughunt"
hint.ru = [
  """Выпиши, что функция возвращает для строк, которых нет в её `match`. Для токена, роль в котором нельзя понять, безопасный ответ один.""",
  """Нормализация (`trim`, `to_lowercase`) здесь вредна: ты принимаешь то, чего никогда не выдавал. Сравнивай точно. Ветка по умолчанию должна вести к роли без прав, а не к самой сильной.""",
]
why.ru = """Ветка по умолчанию в разборе роли это место, где решается, что произойдёт с неизвестным. «Администратор» там означает, что любая опечатка, пустое поле или новая роль, добавленная соседом, открывает всё. Мягкий разбор ещё и расширяет круг допустимых входов: токен подписываем мы, а значит, нам нечего прощать. Гость без прав превращает любую ошибку в видимый отказ, который починят, а не в тихую дыру."""

[[exercises]]
name = "svauth18"
style = "scratch"
hint.ru = [
  """Решение зависит от трёх вещей: кто спрашивает (роль, бан), что это за ресурс (автор) и какое действие. Бан проверяется первым и без исключений. Потом идёт существование ресурса, потом права.""",
  """Для удаления есть два пути к разрешению: «свой пост» (автор, и у роли ещё есть право править своё) или «право удалять любое». Правка текста только первый путь. Все проверки лежат в методах `Posts`, а не в вызывающем коде.""",
]
why.ru = """Проверка в контроллере защищает один вход, а сервис остаётся открытым для каждого нового (gRPC, фоновая задача, админка). Когда решение живёт в сервисе, обойти его нельзя, не обойдя сам сервис. Порядок важен: бан не должен зависеть от того, существует ли пост, иначе по ответу можно разведывать чужие номера; а «право на чужое» (удаление) отличается от «права автора» (правка), поэтому модератор правит чужой текст не может, хотя удалить может."""

[[exercises]]
name = "svauth19"
style = "scratch"
hint.ru = [
  """Раздели работу на две части: сначала разобрать и проверить заголовок (получится «нет заголовка», «ошибка» или «пользователь»), потом выбрать маршрут. Ошибку в заголовке возвращай сразу, до поиска маршрута.""",
  """Заголовок разбирается по первому пробелу: слева схема, справа токен. Токен непустой и без пробелов. Заголовки собери через `filter`: если нашлось больше одного, это ошибка. Для защищённого маршрута «нет заголовка» это 401 `auth.missing`, а для публичного обычный вызов.""",
]
why.ru = """Единая точка проверки убирает целый класс ошибок «забыл проверить»: обработчик защищённого маршрута вообще не может быть вызван без `Principal`, и ему не нужен `Option`, в котором легко забыть `None`. Испорченный токен на публичном маршруте тоже отклоняется: молча считать его анонимом значит скрывать от клиента, что его сессия сломана. Разные коды для просроченного и неверного токена позволяют клиенту обновить токен, а не выкидывать пользователя на экран входа."""

[[exercises]]
name = "svauth20"
style = "scratch"
hint.ru = [
  """Хранится хеш токена, а ключом служит он же: поиск по присланному токену это поиск по хешу. В записи нужны пользователь, назначение и срок.""",
  """Проверку назначения делай до удаления: токен с чужим назначением не должен сгореть от неверной попытки. Нашёл подходящую запись, удали её и только потом смотри на срок: просроченный токен тоже одноразовый. Всё `consume` выполняй под одной блокировкой.""",
]
why.ru = """Одноразовость гарантирует удаление записи в том же неделимом действии, что и проверка, иначе два запроса пройдут оба. Назначение привязано к токену, потому что ссылка из письма про подтверждение почты не должна менять пароль. Выпуск новой ссылки отменяет старую: пользователь, запросивший сброс дважды, не оставляет в почте две рабочие ссылки. В базе хеш, как у refresh: утечка таблицы не открывает сбросов."""

[[exercises]]
name = "svauth21"
style = "fix"
hint.ru = [
  """Откуда берутся «случайные» числа у генератора, созданного из числа (`seed_from_u64`)? Если знаешь число и алгоритм, ты знаешь всю последовательность. Что здесь известно атакующему?""",
  """Нужен источник случайности операционной системы: `rand::rngs::OsRng`. Знаков бери с запасом (хотя бы 32 из 62-символьного алфавита). Ни время, ни номер пользователя в генерации участвовать не должны.""",
]
why.ru = """Предсказуемый генератор делает секрет вычислимым: атакующему достаточно перебрать несколько секунд возле момента выдачи. Простое удлинение токена не помогает, пока источник детерминирован (тест перебирает несколько длин). Секреты берут из системного источника случайности, а время и номер пользователя в них не подмешивают: они не добавляют энтропии, зато дают подсказки."""

[[exercises]]
name = "svauth_service"
kind = "project"
quiz = true
style = "scratch"
locked = ["src/microservices/auth-service/tests/acceptance.rs"]
hint.ru = [
  """Начни с `dto.rs`: он ни от чего не зависит. Потом `AuthService::new` и `register`: хеширование вынеси в отдельный асинхронный метод, он понадобится и при входе. Вход, refresh и выход строй вокруг `store.transaction(...)`: всё, что должно быть неделимым, делай внутри одного замыкания.""",
  """Для refresh хватает таблицы хешей и признака `used`. Погашение семейства это две вещи: пометка семейства и запись всех его `access_jti` в список отозванных вместе со сроком. Чтобы вход для неизвестного ника не отличался, заготовь фальшивый хеш в `new` (хеш от случайной строки с теми же параметрами).""",
]
why.ru = """Сервис собрал решения из всех задач главы: медленный хеш вне рантайма и под лимитом, подписанные токены с проверкой по порядку, ротация refresh в одной транзакции с гашением семейства, список отозванных `jti`, связка ключей по `kid`. Слои разделены: HTTP знает только контроллер, правила тела только dto, остальное сервис. Одинаковый ответ и одинаковая работа для неизвестного ника это защита от перечисления пользователей."""

