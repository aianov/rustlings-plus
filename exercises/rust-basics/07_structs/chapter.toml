[chapter]
title.en = "Structs"
title.ru = "Структуры"

[[exercises]]
name = "structs1"
hint.en = """
Rust has more than one type of struct. Three actually, all variants are used to
package related data together.

There are regular structs. These are named collections of related data stored in
fields.

Tuple structs are basically just named tuples.

Finally, unit structs. These don't have any fields and are useful for generics.

In this exercise, you need to complete and implement one of each kind.
Read more about structs in The Book:
https://doc.rust-lang.org/book/ch05-01-defining-structs.html"""
hint.ru = """В Rust больше одного вида структур. Точнее, три, и все они нужны, чтобы
объединять связанные данные.

Есть обычные структуры. Это именованные наборы связанных данных, хранящихся в полях.

Кортежные структуры по сути просто именованные кортежи.

Наконец, unit-структуры. У них нет полей, и они полезны в обобщённом коде.

В этом упражнении нужно дописать и реализовать по одной структуре каждого вида.
Больше о структурах в книге:
https://doc.rust-lang.ru/book/ch05-01-defining-structs.html"""

[[exercises]]
name = "structs2"
hint.en = """
Creating instances of structs is easy, all you need to do is assign some values
to its fields.

There are however some shortcuts that can be taken when instantiating structs.
Have a look in The Book to find out more:
https://doc.rust-lang.org/book/ch05-01-defining-structs.html#creating-instances-from-other-instances-with-struct-update-syntax"""
hint.ru = """Создавать экземпляры структур просто: достаточно присвоить значения её полям.

Но при создании экземпляров есть и сокращения. Загляни в книгу, чтобы узнать больше:
https://doc.rust-lang.ru/book/ch05-01-defining-structs.html
(ищи раздел про синтаксис обновления структуры)."""

[[exercises]]
name = "structs3"
hint.en = """
Methods and associated functions are both declared in an `impl MyType {}`
block. Methods have a `self`, `&self` or `&mut self` parameter, where `self`
implicitly has the type of the impl block. Associated functions do not have
a `self` parameter.

Have a look in The Book to find out more about method implementations:
https://doc.rust-lang.org/book/ch05-03-method-syntax.html"""
hint.ru = """Методы и ассоциированные функции объявляются в блоке `impl MyType {}`.
У методов есть параметр `self`, `&self` или `&mut self`, где `self`
неявно имеет тип блока impl. У ассоциированных функций параметра `self` нет.

Подробнее о методах в книге:
https://doc.rust-lang.ru/book/ch05-03-method-syntax.html"""
