[chapter]
title.en = "Smart pointers"
title.ru = "Умные указатели"

[[exercises]]
name = "smart_pointers1"
hint.en = """
The compiler's message should help: Since we cannot store the value of the
actual type when working with recursive types, we need to store a reference
(pointer) to its value.

We should, therefore, place our `List` inside a `Box`. More details in The Book:
https://doc.rust-lang.org/book/ch15-01-box.html#enabling-recursive-types-with-boxes

Creating an empty list should be fairly straightforward (Hint: Read the tests).

For a non-empty list, keep in mind that we want to use our `Cons` list builder.
Although the current list is one of integers (`i32`), feel free to change the
definition and try other types!"""
hint.ru = """Сообщение компилятора должно помочь: нельзя хранить значение самого типа
в рекурсивных типах, поэтому нужно хранить ссылку (указатель) на значение.

Значит, `List` нужно поместить в `Box`. Подробнее в Книге:
https://doc.rust-lang.ru/book/ch15-01-box.html#enabling-recursive-types-with-boxes

Создать пустой список довольно просто (подсказка: прочитай тесты).

Для непустого списка помни, что нужно использовать наш конструктор `Cons`.
Хотя сейчас список состоит из целых (`i32`), можешь поменять определение
и попробовать другие типы!"""

[[exercises]]
name = "smart_pointers2"
hint.en = """
This is a straightforward exercise to use the `Rc<T>` type. Each `Planet` has
ownership of the `Sun`, and uses `Rc::clone()` to increment the reference count
of the `Sun`.

After using `drop()` to move the `Planet`s out of scope individually, the
reference count goes down.

In the end, the `Sun` only has one reference again, to itself.

See more at: https://doc.rust-lang.org/book/ch15-04-rc.html

Unfortunately, Pluto is no longer considered a planet :("""
hint.ru = """Простое упражнение на тип `Rc<T>`. Каждая `Planet` владеет `Sun` и использует
`Rc::clone()`, чтобы увеличить счётчик ссылок на `Sun`.

После того как `drop()` по одной убирает `Planet` из области видимости, счётчик
ссылок уменьшается.

В конце у `Sun` снова остаётся одна ссылка, на самого себя.

Больше здесь: https://doc.rust-lang.ru/book/ch15-04-rc.html

К сожалению, Плутон больше не считается планетой :("""

[[exercises]]
name = "smart_pointers3"
test = false
hint.en = """
Make `shared_numbers` be an `Arc` from the `numbers` vector. Then, in order
to avoid creating a copy of `numbers`, you'll need to create `child_numbers`
inside the loop but still in the main thread.

`child_numbers` should be a clone of the `Arc` of the numbers instead of a
thread-local copy of the numbers.

This is a simple exercise if you understand the underlying concepts, but if this
is too much of a struggle, consider reading through all of Chapter 16 in The
Book:
https://doc.rust-lang.org/book/ch16-00-concurrency.html"""
hint.ru = """Сделай `shared_numbers` типа `Arc` из вектора `numbers`. Затем, чтобы не
создавать копию `numbers`, создай `child_numbers` внутри цикла, но всё ещё
в главном потоке.

`child_numbers` должен быть клоном `Arc` с числами, а не локальной для потока
копией чисел.

Это простое упражнение, если понимаешь основные понятия, но если слишком
трудно, прочитай всю главу 16 Книги:
https://doc.rust-lang.ru/book/ch16-00-concurrency.html"""

[[exercises]]
name = "smart_pointers4"
hint.en = """
If `Cow` already owns the data, it doesn't need to clone it when `to_mut()` is
called.

Check out the documentation of the `Cow` type:
https://doc.rust-lang.org/std/borrow/enum.Cow.html"""
hint.ru = """Если `Cow` уже владеет данными, ему не нужно клонировать их при вызове
`to_mut()`.

Посмотри документацию типа `Cow`:
https://doc.rust-lang.org/std/borrow/enum.Cow.html"""
