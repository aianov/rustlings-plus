[chapter]
title.en = "Strings"
title.ru = "Строки"

[[exercises]]
name = "strings1"
test = false
hint.en = """
The `current_favorite_color` function is currently returning a string slice
with the `'static` lifetime. We know this because the data of the string lives
in our code itself -- it doesn't come from a file or user input or another
program -- so it will live as long as our program lives.

But it is still a string slice. There's one way to create a `String` by
converting a string slice covered in the Strings chapter of the book, and
another way that uses the `From` trait."""
hint.ru = """Сейчас функция `current_favorite_color` возвращает срез строки со временем жизни
`'static`. Это потому, что данные строки лежат прямо в нашем коде (они не пришли
из файла, не введены пользователем и не получены от другой программы), так что
они живут столько же, сколько наша программа.

Но это всё равно срез строки. Один способ создать `String` из среза описан в главе
книги про строки, а другой использует трейт `From`."""

[[exercises]]
name = "strings2"
test = false
hint.en = """
Yes, it would be really easy to fix this by just changing the value bound to
`word` to be a string slice instead of a `String`, wouldn't it? There is a way
to add one character to the `if` statement, though, that will coerce the
`String` into a string slice.

Side note: If you're interested in learning about how this kind of reference
conversion works, you can jump ahead in the book and read this part in the
smart pointers chapter:
https://doc.rust-lang.org/book/ch15-02-deref.html#implicit-deref-coercions-with-functions-and-methods"""
hint.ru = """Да, это очень легко починить, просто заменив значение, привязанное к `word`,
на срез строки вместо `String`, правда? Но есть способ дописать в инструкцию `if`
один символ так, что `String` приведётся к срезу строки.

Попутно: если хочешь узнать, как работает такое преобразование ссылок, можно
заглянуть вперёд, в главу книги про умные указатели:
https://doc.rust-lang.ru/book/ch15-02-deref.html"""

[[exercises]]
name = "strings3"
hint.en = """
There are many useful standard library functions for strings. Let's try and use
some of them:
https://doc.rust-lang.org/std/string/struct.String.html#method.trim

For the `compose_me` method: You can either use the `format!` macro, or convert
the string slice into an owned string, which you can then freely extend.

For the `replace_me` method, you can check out the `replace` method:
https://doc.rust-lang.org/std/string/struct.String.html#method.replace"""
hint.ru = """В стандартной библиотеке много полезных функций для строк. Давай попробуем
некоторые из них:
https://doc.rust-lang.org/std/string/struct.String.html#method.trim

Для метода `compose_me`: можно использовать макрос `format!` или превратить срез
строки во владеющую строку, которую затем свободно дополнять.

Для метода `replace_me` загляни в метод `replace`:
https://doc.rust-lang.org/std/string/struct.String.html#method.replace"""

[[exercises]]
name = "strings4"
test = false
hint.en = """
Replace `placeholder` with either `string` or `string_slice` in the `main`
function.

Example:
`placeholder("blue");`
should become
`string_slice("blue");`
because "blue" is `&str`, not `String`."""
hint.ru = """Замени `placeholder` на `string` или `string_slice` в функции `main`.

Пример:
`placeholder("blue");`
должно превратиться в
`string_slice("blue");`
потому что "blue" это `&str`, а не `String`."""
