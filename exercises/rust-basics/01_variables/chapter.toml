[chapter]
title.en = "Variables"
title.ru = "Переменные"

[[exercises]]
name = "variables1"
test = false
hint.en = """
The declaration in the `main` function is missing a keyword that is needed
in Rust to create a new variable binding."""
hint.ru = """В объявлении в функции `main` не хватает ключевого слова, которое в Rust нужно,
чтобы создать новую привязку переменной."""

[[exercises]]
name = "variables2"
test = false
hint.en = """
The compiler message is saying that Rust can't infer the type that the
variable binding `x` has with what is given here.

What happens if you annotate the first line in the `main` function with a type
annotation?

What if you give `x` a value?

What if you do both?

What type should `x` be, anyway?

What if `x` is the same type as `10`? What if it's a different type?"""
hint.ru = """Компилятор говорит, что Rust не может вывести тип привязки `x` по тому, что здесь дано.

Что будет, если добавить аннотацию типа в первой строке функции `main`?

А если присвоить `x` значение?

А если сделать и то и другое?

Какого типа вообще должен быть `x`?

А если `x` того же типа, что и `10`? А если другого?"""

[[exercises]]
name = "variables3"
test = false
hint.en = """
In this exercise, we have a variable binding that we've created in the `main`
function, and we're trying to use it in the next line, but we haven't given it
a value.

We can't print out something that isn't there; try giving `x` a value!

This is an error that can cause bugs that's very easy to make in any
programming language -- thankfully the Rust compiler has caught this for us!"""
hint.ru = """Здесь в функции `main` создана привязка переменной, и мы пытаемся использовать её
в следующей строке, но значения ей так и не дали.

Нельзя напечатать то, чего нет, так что присвой `x` значение!

Эту ошибку очень легко допустить на любом языке программирования, и она
порождает баги. К счастью, компилятор Rust поймал её за нас!"""

[[exercises]]
name = "variables4"
test = false
hint.en = """
In Rust, variable bindings are immutable by default. But here, we're trying
to reassign a different value to `x`! There's a keyword we can use to make
a variable binding mutable instead."""
hint.ru = """В Rust привязки переменных по умолчанию неизменяемы. А здесь мы пытаемся
присвоить `x` другое значение! Есть ключевое слово, которым привязку
можно сделать изменяемой."""

[[exercises]]
name = "variables5"
test = false
hint.en = """
In `variables4` we already learned how to make an immutable variable mutable
using a special keyword. Unfortunately this doesn't help us much in this
exercise because we want to assign a different typed value to an existing
variable. Sometimes you may also like to reuse existing variable names because
you are just converting values to different types like in this exercise.

Fortunately Rust has a powerful solution to this problem: 'Shadowing'!
You can read more about 'Shadowing' in the book's section 'Variables and
Mutability':
https://doc.rust-lang.org/book/ch03-01-variables-and-mutability.html#shadowing

Try to solve this exercise afterwards using this technique."""
hint.ru = """В `variables4` мы уже узнали, как сделать неизменяемую переменную изменяемой
специальным ключевым словом. Здесь это не поможет: мы хотим присвоить
существующей переменной значение другого типа. Иногда хочется и просто
переиспользовать имя, потому что значение всего лишь преобразуется в другой
тип, как в этом упражнении.

У Rust есть для этого отличное решение: затенение (shadowing)!
Почитай о нём в разделе книги «Переменные и изменяемость»:
https://doc.rust-lang.ru/book/ch03-01-variables-and-mutability.html

После этого попробуй решить упражнение с помощью затенения."""

[[exercises]]
name = "variables6"
test = false
hint.en = """
We know about variables and mutability, but there is another important type of
variable available: constants.

Constants are always immutable. They are declared with the keyword `const`
instead of `let`.

The type of Constants must always be annotated.

Read more about constants and the differences between variables and constants
under 'Constants' in the book's section 'Variables and Mutability':
https://doc.rust-lang.org/book/ch03-01-variables-and-mutability.html#constants"""
hint.ru = """Мы знаем про переменные и изменяемость, но есть ещё один важный вид
переменных: константы.

Константы всегда неизменяемы. Они объявляются ключевым словом `const`
вместо `let`.

Тип константы всегда нужно указывать явно.

О константах и их отличиях от переменных читай в разделе «Константы»
книги, глава «Переменные и изменяемость»:
https://doc.rust-lang.ru/book/ch03-01-variables-and-mutability.html"""
