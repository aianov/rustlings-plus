hint.ru = ["""Начни с `visible`: это одна цепочка `iter().rev().filter(..)`, без `collect`. Потом остальные методы строй поверх неё.""", """Адаптер `Pages` возьми из itr21: `by_ref().take(size).collect()`. `page(number, size)` не нужно строить через `nth` страниц: `skip(number * size)` и `take(size)` короче и без лишних аллокаций.""", """`authors` нужно множество уже виденных: оно может жить внутри замыкания `filter` (с `move`), как `seen.insert(..)`."""]
why.ru = """Весь проект это одна идея: описывать выборку цепочкой и собирать только то, что нужно вызывающему. Лента хранится по возрастанию времени, и `rev()` даёт «новые первыми» бесплатно; `since` останавливается на первом старом посте. Адаптер `Pages` ленив и не теряет неполную страницу. Тест считает аллокации: первый видимый пост ни одной, страница из трёх постов в ленте на пятьдесят тысяч не больше двух, и любой `collect` посреди цепочки, то есть вектор размером с ленту, это сразу покажет."""

