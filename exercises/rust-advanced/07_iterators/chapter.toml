[chapter]
title.ru = "Итераторы углублённо"

[[chapter.visuals]]
file = "visuals/iterator_pipeline.html"
title.ru = "Итераторы: элементы тянутся по одному"

[[exercises]]
name = "itr1"
style = "todo"
hint.ru = ["""Что лежит в `self.next`: уже следующее значение или то, что вернуть сейчас? Когда оно становится `None`?""", """Возьми текущее значение, проверь его против `end`, затем посчитай следующее через `checked_add`: если не поместилось, это конец."""]
why.ru = """Итератор это состояние плюс правило перехода. Следующее значение хранится заранее в `Option`: так конец ряда (по `end` или по переполнению) выражается просто `None`, а повторные вызовы после конца остаются `None`. `checked_add` превращает переполнение в конец, а не в бесконечный цикл по кругу. Реализовав один `next`, мы получили `take`, `zip`, `sum` и остальное даром."""

[[exercises]]
name = "itr2"
style = "todo"
hint.ru = ["""Ленивый адаптер получает значение и считает только тогда, когда у него просят. Подумай, какой адаптер вызывает замыкание по запросу.""", """`input.iter().map(..)` с замыканием, которое увеличивает `calls`. Замыкание должно владеть ссылкой на `calls` (`move`), чтобы пережить функцию."""]
why.ru = """Ленивость получилась сама, потому что `map` не вызывает замыкание, пока не попросят элемент. Eager-решение со сбором в вектор и возвратом его `into_iter()` проваливает первый тест: вычисления случились бы при создании. Поэтому счётчик показывает два вычисления, когда взяли два значения из тысячи, и четыре, когда `find` остановился на четвёртом."""

[[exercises]]
name = "itr_q1"
kind = "question"
question.ru = '''Чему равно `calls` в конце?
```rust
let mut calls = 0;
let v: Vec<i32> = (1..=5)
    .map(|x| { calls += 1; x * 2 })
    .filter(|x| x % 4 == 0)
    .take(1)
    .collect();
println!("{v:?} {calls}");
```'''
options.ru = ["[4] 1", "[4] 2", "[4] 5", "[4] 0"]
answer = [1]
explain.ru = """Элементы идут по одному: 1 даёт 2 (фильтр отбросил), 2 даёт 4 (прошло), `take(1)` получил своё и больше источник не спрашивает. Замыкание `map` вызвано два раза. Ждать «сначала все пять `map`» это типичное заблуждение про ленивость."""
hint.ru = """Идёт ли `map` по всем элементам, прежде чем начнёт работать `filter`?"""

[[exercises]]
name = "itr3"
style = "fix"
hint.ru = ["""Посмотри на предупреждение компилятора о неиспользованном результате: адаптер создан, но никто не просит значений.""", """Первую функцию проще написать без `map`: нужен потребитель, а не адаптер. Во второй к цепочке не хватает потребителя, который ещё и вернёт число."""]
why.ru = """Адаптеры ничего не делают, пока их не потребили, поэтому `map` и `inspect`, не доведённые до потребителя, молча пропали. В первой функции `map` для побочного эффекта не нужен вообще: `extend` или `for`. Во второй `count` потребляет цепочку и заодно возвращает нужное число. Прятать побочные эффекты в `map` и `inspect` годится для отладки, но не для основной логики."""

[[exercises]]
name = "itr4"
style = "todo"
hint.ru = ["""Для каждой функции ответь: нужно только прочитать, изменить на месте или забрать? Тип `Secret` не копируется, и это подскажет, где нужно забирать.""", """`bump_ids`: `iter_mut`; `longest_secret`: `iter` и `max_by_key`, но помни про ничьи; `into_secrets`: `into_iter`. Чтобы при равенстве взять первого, пройди в обратном порядке: `max_by_key` отдаёт последнего."""]
why.ru = """Три способа обхода дают три разных права: читать (`&T`), менять (`&mut T`), владеть (`T`). У `Secret` нет `Clone`, поэтому `into_secrets` обязана именно забрать значения, и компилятор не даст схалтурить копированием. Равенство в `max_by_key` разрешается в пользу последнего элемента, поэтому для «первого из равных» обход делают с конца."""

[[exercises]]
name = "itr5"
style = "todo"
hint.ru = ["""Нужны три реализации `IntoIterator`: для значения, для `&` и для `&mut`. Для каждой напиши `Item` и `IntoIter`.""", """Все три делегируют вектору: `into_iter()`, `iter()`, `iter_mut()`. Типы: `std::vec::IntoIter<Track>`, `std::slice::Iter<'a, Track>`, `std::slice::IterMut<'a, Track>`."""]
why.ru = """Три формы `for` соответствуют трём реализациям, и каждая просто передаёт вызов вектору. Время жизни `'a` в реализациях для ссылок привязывает итератор к заимствованию плейлиста. Метод `iter()` не нужен компилятору, это соглашение для вызывающих, которое делает код читаемее и работает в цепочках."""

[[exercises]]
name = "itr6"
style = "fix"
hint.ru = ["""Ошибка про «moved value» у вектора: какой цикл его забрал и нужно ли ему это? Кому после вызова нужны данные?""", """`summary` должна заимствовать посты, поэтому берёт `&[Post]`. В `tag_matrix` сигнатура остаётся: вектор тегов нужен заново на каждой итерации внешнего цикла, значит внутри идти надо по ссылке."""]
why.ru = """`for x in v` забирает вектор. Для функции, которая только читает, правильный параметр это заимствованный срез: данные остаются у вызывающего, и ничего не нужно клонировать. Во вложенном цикле внутренний вектор обходится на каждом шаге внешнего, поэтому там обязателен обход по ссылке, иначе он съедается на первой же итерации."""

[[exercises]]
name = "itr_q2"
kind = "question"
question.ru = '''Что скажет компилятор?
```rust
let names = vec![String::from("ann"), String::from("bob")];
for n in names {
    println!("{n}");
}
println!("{}", names.len());
```'''
options.ru = ["напечатает ann, bob, 2", "ошибка: names перемещён в цикл", "ошибка: n нельзя печатать", "предупреждение, но соберётся"]
answer = [1]
explain.ru = """`for n in names` это `names.into_iter()`: вектор переехал в цикл. После цикла он недоступен. Чтобы пройти и сохранить данные, пишут `for n in &names`."""
hint.ru = """Какая из трёх форм обхода получает владение вектором?"""

[[exercises]]
name = "itr7"
style = "todo"
hint.ru = ["""Какие края опасны? Страница ноль, размер ноль, огромный номер, шаг ноль. Каждый должен дать пустой результат, а не панику.""", """`page`: сначала посчитай, сколько пропустить, через `checked_sub` и `checked_mul`, потом `skip` и `take`. Для `every_nth_from_end`: `rev().step_by(step)`, а нулевой шаг отсеки заранее."""]
why.ru = """Адаптеры хорошо читаются, но не снимают заботу о краях. `step_by(0)` паникует, а `(number - 1) * size` переполняется на огромных номерах: оба случая обработаны заранее и дают пустой результат. `zip` с собственным сдвигом на один (`skip(1)`) стандартный способ посмотреть на соседей без индексов. `once` и `chain` приклеивают заголовок, не создавая лишнего вектора."""

[[exercises]]
name = "itr8"
style = "todo"
hint.ru = ["""Различай остановку и пропуск: `take_while` и `map_while` обрывают поток навсегда, `skip_while` отбрасывает только начало, `filter` и `filter_map` смотрят на каждый элемент.""", """`numbers_until_bad`: `map_while(|s| s.parse().ok())`. `hashtags`: `flat_map` по словам, `filter_map(strip_prefix('#'))`. `compact`: `flatten` понимает `Option` как итератор из нуля или одного элемента."""]
why.ru = """Шесть адаптеров, шесть разных свойств. `map_while` отличается от `filter_map` тем, что останавливается навсегда: после первого плохого числа остальные не рассматриваются. `skip_while(..).skip(1)` отбрасывает начало вместе с самим разделителем. `flatten` на `Option` работает, потому что `Option` тоже итерируется. Тест `valid_ages` отличает фильтрацию от ограничения значением: 151 пропускается, а не превращается в 150."""

[[exercises]]
name = "itr_q8"
kind = "question"
question.ru = '''Что получится?
```rust
let v: Vec<u32> = (0..10).step_by(3).skip(1).collect();
```'''
options.ru = ["[3, 6, 9]", "[1, 4, 7]", "[0, 3, 6, 9]", "[4, 7]"]
answer = [0]
explain.ru = """Сначала `step_by(3)` даёт 0, 3, 6, 9, потом `skip(1)` выбрасывает 0. Порядок адаптеров важен: `skip(1).step_by(3)` дал бы 1, 4, 7."""
hint.ru = """В каком порядке применяются адаптеры?"""

[[exercises]]
name = "itr9"
style = "todo"
hint.ru = ["""Для каждой функции спроси: что она вернёт и когда может остановиться раньше конца? Ответ «остановиться» подсказывает `find`, `position`, `any`, `all`.""", """`most_liked`: `max_by_key` отдаёт последнего из равных, а нужен ранний. Пройди список с конца. `third` принимает итератор, а не срез: `nth` потребляет первые два элемента."""]
why.ru = """Потребители, умеющие останавливаться (`find`, `position`, `any`, `all`), не читают лишнего. `all` на пустом верно, потому что нет ни одного опровергающего элемента. Ничьи решаются по-разному: `min_by_key` отдаёт первый, `max_by_key` последний, и в условии нужен ранний у обоих, поэтому максимум ищут по `rev()`. `nth(2)` забирает и два предыдущих элемента, поэтому на итераторе, который ещё нужен, его зовут осторожно."""

[[exercises]]
name = "itr_q4"
kind = "question"
question.ru = '''Что вернёт вызов?
```rust
let scores = [("ann", 7), ("bob", 9), ("cat", 9), ("dan", 2)];
let best = scores.iter().max_by_key(|p| p.1).map(|p| p.0);
```'''
options.ru = ["Some(\"bob\")", "Some(\"cat\")", "None", "Some(\"ann\")"]
answer = [1]
explain.ru = """У bob и cat по девять. `max_by_key` при равенстве возвращает **последний** из равных, поэтому «cat». А `min_by_key` вернул бы первого. Если по условию нужен первый, идут с конца (`rev`) или сравнивают вручную."""
hint.ru = """Кого берёт `max_by_key`, если лучших несколько?"""

[[exercises]]
name = "itr10"
style = "todo"
hint.ru = ["""Для каких функций `collect` подходит прямо, а для каких результат зависит от повторов? Что происходит с одинаковыми ключами при сборе пар в карту?""", """`likes_by_author` и `group_by_length` нельзя собрать из пар: повторяющийся ключ затрёт значение. Используй `entry(..).or_insert(0)` и `or_default().push(..)`. `initials` собирается в `String` из символов; `char::to_uppercase` сам итератор, раскрой его через `flat_map`."""]
why.ru = """`collect` в карту из пар хорош, когда ключи уникальны (`index_by_id`). Если ключи повторяются, последнее значение молча замещает предыдущее, и сумма лайков одного автора превратилась бы в лайки его последнего поста. Суммирование и группировка это `entry`. `String` собирается из символов (`char`), поэтому `initials` пишется одним `collect`, а `flat_map(char::to_uppercase)` корректно обрабатывает буквы, у которых верхний регистр занимает несколько символов."""

[[exercises]]
name = "itr11"
style = "todo"
hint.ru = ["""Какие функции должны прервать обход при первой ошибке, а какие отделить плохое от хорошего? Для первых цель `collect` это `Result<Vec<_>, _>` или `Option<Vec<_>>`.""", """`good_and_bad`: разбери всё в `Result`, затем `partition` по `is_ok`, а из каждой части достань значение или ошибку (`flatten` и `filter_map(Result::err)`)."""]
why.ru = """Тип результата `collect` определяет поведение: `Result<Vec<_>, _>` прерывается на первой ошибке и возвращает её, `Vec<Result<_, _>>` оставил бы всё как есть. `partition` и `unzip` разделяют поток на две коллекции за один проход. Для `good_and_bad` нужно оба: сначала превратить каждую запись в `Result`, потом разделить. Порядок записей сохраняется, потому что все части идут в одном направлении."""

[[exercises]]
name = "itr_q3"
kind = "question"
question.ru = '''Сколько раз вызвано замыкание?
```rust
let mut n = 0;
let r: Result<Vec<i32>, _> = ["1", "x", "3", "4"]
    .iter()
    .map(|s| { n += 1; s.parse::<i32>() })
    .collect();
println!("{} {}", r.is_err(), n);
```'''
options.ru = ["true 2", "true 4", "false 4", "true 1"]
answer = [0]
explain.ru = """`collect` в `Result` прерывается на первой ошибке: «1» разобрана, «x» дала ошибку, и сбор остановился. Замыкание вызвано дважды. Обычный `fold` с `Result` в накопителе дочитал бы все четыре."""
hint.ru = """Читает ли `collect` в `Result` элементы после первой ошибки?"""

[[exercises]]
name = "itr_q6"
kind = "question"
question.ru = '''Чему равно `s`?
```rust
let s: Option<u32> = [Some(1), None, Some(3)].into_iter().sum();
```'''
options.ru = ["Some(4)", "None", "Some(1)", "не скомпилируется"]
answer = [1]
explain.ru = """`Option<T>` умеет `Sum`: если встретился `None`, вся сумма `None`. Если все `Some`, получится `Some(сумма)`. Так же работает `product` и `collect` в `Option<Vec<_>>`."""
hint.ru = """Что значит один отсутствующий элемент для суммы всех?"""

[[exercises]]
name = "itr12"
style = "todo"
hint.ru = ["""Выбери для каждой функции: `scan` (промежуточные состояния, может остановиться), `reduce` (без начального значения), `fold` (с начальным значением и сложным накопителем).""", """`balances_until_overdraft`: `scan` останавливается, когда замыкание возвращает `None`. `longest_streak`: накопитель из двух чисел (текущая серия, лучшая). `longest_word`: `reduce`, и сравнивай строго `>`, тогда при равенстве останется первое."""]
why.ru = """`scan` это `fold`, который показывает промежуточные значения и может оборвать обход, вернув `None`. `reduce` нужен, когда начального значения нет, а пустой ввод должен дать `None`. Для `longest_word` строгое `>` оставляет первое из равных. `fold` с кортежем в накопителе проходит данные один раз и считает сразу два числа (текущая серия и лучшая) без дополнительных переменных вне цепочки."""

[[exercises]]
name = "itr13"
style = "fix"
hint.ru = ["""Посмотри на счётчик `visited`: после первой ошибки он продолжает расти. Какой метод умеет остановиться на первой неудаче?""", """Замени `fold` на `try_fold`: замыкание возвращает `Result`, и `?` внутри прерывает обход. Сложение делай через `checked_add`, а переполнение превращай в строку `overflow`."""]
why.ru = """`fold` с `Result` внутри накопителя не останавливается: каждый следующий шаг всё равно выполняется, и только результат оказывается ошибкой. `try_fold` прекращает обход на первом `Err` или `None`, поэтому счётчик посещений показывает, что остальные строки не разбирались. Молчаливое `wrapping_add` в таких местах дефект: сумма выглядит правдоподобно, но неверна. `checked_add` превращает переполнение в явную ошибку."""

[[exercises]]
name = "itr14"
style = "scratch"
hint.ru = ["""Основной цикл это `while let Some(&(позиция, символ)) = chars.peek()`. Решение «что делать» принимай по символу, но забирай его только когда решил.""", """Для числа и имени вложенный цикл: пока следующий символ подходит, забирай. Метод `next_if` делает «проверить и взять» за один вызов. Для позиции ошибки пригодится `char_indices`. Буквы здесь только ASCII (`is_ascii_alphabetic`, `is_ascii_digit`): `é` должна оказаться ошибкой. Буквы здесь только ASCII (`is_ascii_alphabetic`, `is_ascii_digit`): `é` должна оказаться ошибкой."""]
why.ru = """`peek` позволяет решить, что делать с символом, не забирая его, поэтому число заканчивается на первом не-цифровом, который остаётся нетронутым для следующего витка. `char_indices` даёт байтовые позиции, и тест с `é` показывает разницу между байтами и символами. Переполнение числа ловится `checked_mul` и `checked_add`: без этого очень длинное число паниковало бы в отладочной сборке."""

[[exercises]]
name = "itr15"
style = "fix"
hint.ru = ["""Вспомни, как адаптеры получают итератор: по значению. Что случилось с `it` после `it.take(3)`?""", """Добавь `by_ref()` перед `take`. Для `split_small` понадобится не `take_while` (он теряет первый непрошедший), а `next_if` внутри `from_fn` или цикл с `peek`."""]
why.ru = """`take(3)` забирает итератор целиком, а `by_ref()` отдаёт вместо него `&mut` ссылку, которая тоже итератор: после исчерпания лимита исходный остаётся с остатком. С `take_while` так не получится честно: он уже прочитал первый «неподходящий» элемент и потерял его. Задача `split_small` решается подсмотром: `next_if` берёт элемент, только если условие выполнено, иначе оставляет его на месте."""

[[exercises]]
name = "itr_q5"
kind = "question"
question.ru = '''Что напечатает последняя строка?
```rust
let mut it = 1..10;
let small: Vec<i32> = it.by_ref().take_while(|&x| x < 4).collect();
println!("{:?} {:?}", small, it.next());
```'''
options.ru = ["[1, 2, 3] Some(4)", "[1, 2, 3] Some(5)", "[1, 2, 3] None", "[1, 2, 3, 4] Some(5)"]
answer = [1]
explain.ru = """`take_while` должен прочитать элемент, чтобы узнать, что тот не подходит. Четвёрка прочитана, отвергнута и потеряна: в итераторе осталось 5 и дальше. Чтобы не терять, используют `peekable` и `next_if`."""
hint.ru = """Сколько элементов прочитал `take_while`, прежде чем остановиться?"""

[[exercises]]
name = "itr16"
style = "todo"
hint.ru = ["""Определи для каждой последовательности, чем задаётся следующий элемент: предыдущим (`successors`), внутренним счётчиком (`from_fn`), чем-то внешним (`once`, `repeat_with`).""", """`powers_of_two_below`: `successors(Some(1), |&x| x.checked_mul(2))` и `take_while`. `collatz`: `successors`, а ноль отсеки в самом начале. `noise`: замыкание у `repeat_with` может менять захваченное состояние."""]
why.ru = """`successors` хорош, когда следующий элемент вычисляется из предыдущего и ряд сам решает, где кончиться (`None`), включая переполнение через `checked_mul`. `from_fn` годится для счётчиков и других состояний, `repeat_with` для генераторов, а `once` приклеивает замыкающий элемент. Нигде не понадобилась собственная структура. Ноль в ряду Коллатца отсеян заранее, иначе ряд бесконечен."""

[[exercises]]
name = "itr17"
style = "todo"
hint.ru = ["""Результат `impl Iterator<Item = &Post>` заимствует `self`. Замыкание в `filter` держит ссылку на `author`, а результат живёт дольше вызова: что с ней сделать?""", """`by_author` и `long_texts` ленивы и не требуют вектора. `top` сортирует, поэтому вектор ссылок неизбежен: `collect`, `sort_by_key` с `Reverse`, затем `into_iter().take(n)`."""]
why.ru = """Ленивые методы возвращают цепочку адаптеров, и вызывающий решает, брать ли ему первый или все. Замыкание получает `author` через `move`, потому что итератор переживёт локальный параметр функции. `top` не может быть ленивым (сортировка требует всех элементов), но и она возвращает итератор: вектор ссылок внутри, наружу идёт `into_iter().take(n)`, интерфейс одинаковый. `sort_by_key` стабилен, поэтому при равных лайках порядок ленты сохраняется. `total_likes` принимает `impl Iterator`, и ей без разницы, откуда пришли посты."""

[[exercises]]
name = "itr18"
style = "fix"
hint.ru = ["""В обеих функциях итератор ссылается на что-то, созданное внутри. Первая ошибка про замыкание, которое «может пережить» функцию, вторая про возврат ссылки на локальное.""", """Для первой: `move` у замыкания. Для второй: ссылки на локальную нижнюю копию вернуть нельзя. Приводи к нижнему регистру каждое слово в `map` (получится владеющий `String`), а не всю строку заранее."""]
why.ru = """Результат живёт дольше функции, поэтому всё, что он использует, должно либо принадлежать ему, либо жить снаружи. Первое лечится `move`: множество переезжает в замыкание и живёт столько же, сколько итератор. Во втором случае `split_whitespace` ссылается на локальную строку `lowered`, и вернуть можно только владеющие значения: собираем `String` в вектор и отдаём `into_iter()`. Это и есть цена возвращаемого итератора: он не может ссылаться на созданное внутри."""

[[exercises]]
name = "itr_q9"
kind = "question"
question.ru = '''Какая функция соберётся?
```rust
fn a(v: &[i32]) -> impl Iterator<Item = i32> { let k = v.len() as i32; v.iter().map(|x| x + k) }
fn b(v: &[i32]) -> impl Iterator<Item = i32> { let k = v.len() as i32; v.iter().map(move |x| x + k) }
fn c(n: i32) -> impl Iterator<Item = i32> { let v = vec![1, 2, 3]; v.iter().map(move |x| x + n) }
```'''
options.ru = ["только a", "только b", "только c", "a и b"]
answer = [1]
explain.ru = """В `a` замыкание держит ссылку на локальную `k`, которая умрёт при выходе: нужен `move`. В `c` итератор ссылается на локальный вектор `v`, и `move` не поможет: надо вернуть `into_iter()` (владеющий). Соберётся только `b`: ссылка на входной срез допустима (результат захватывает его время жизни), а `k` в замыкании скопирована."""
hint.ru = """Что в каждой функции переживёт возврат: ссылка на локальную или копия?"""

[[exercises]]
name = "itr19"
style = "todo"
hint.ru = ["""Сколько элементов осталось, если `lo` и `hi` известны? Что вернёт `size_hint`, если диапазон перевёрнут?""", """`size_hint` отдаёт `(n, Some(n))`. `ExactSizeIterator` реализуется пустым блоком. `next_back` уменьшает `hi` и возвращает его: концы не пересекаются, потому что оба проверяют `lo >= hi`."""]
why.ru = """Точный `size_hint` разблокирует `len`, лучшие аллокации в `collect` и такие адаптеры, как `enumerate().rev()`. Перевёрнутый диапазон должен давать ноль, а не переполненное вычитание, поэтому `saturating_sub`. `next_back` берёт с другого конца, и оба конца сходятся к одной точке: после того как `lo` догнал `hi`, оба метода отвечают `None`. Тест с `zip(..).rev()` проверяет, что обе половины умеют и точную длину, и ход с конца."""

[[exercises]]
name = "itr_q7"
kind = "question"
question.ru = '''Какая из строк не соберётся?'''
options.ru = ["[1, 2, 3].iter().enumerate().rev()", "\"abc\".chars().rev()", "\"abc\".chars().enumerate().rev()", "\"abc\".char_indices().rev()"]
answer = [2]
explain.ru = """`rev` нужен `DoubleEndedIterator`, а `enumerate().rev()` ещё и `ExactSizeIterator`: чтобы пронумеровать с конца, надо знать длину. У `Chars` длины заранее нет (символы разного размера), поэтому третья строка не собирается. У `char_indices` есть свой `next_back`, и он нумерует байтами сам."""
hint.ru = """Какому адаптеру нужна точная длина, чтобы идти с конца?"""

[[exercises]]
name = "itr20"
style = "todo"
hint.ru = ["""`collect` вызывает `FromIterator`, `extend` вызывает `Extend`. Какая реализация естественнее: «создать пустой и дописать» или наоборот?""", """Сначала `Extend<String>`: для каждого слова увеличь счётчик через `entry`. Остальные три реализации выражаются через неё: `Extend<&str>` преобразует в `String`, а `from_iter` создаёт пустой мешок и зовёт `extend`."""]
why.ru = """`FromIterator` и `Extend` отличаются тем, что первый создаёт коллекцию, а второй дописывает в существующую, поэтому первый естественно выражается через второй. Поддержка и `String`, и `&str` избавляет вызывающего от лишних `to_string`. Реализация для `&str` не дублирует логику, а превращает элементы и передаёт дальше. Подсказка типов в `collect::<Bag>()` и `let bag: Bag` одинаково выбирает нужную реализацию."""

[[exercises]]
name = "itr21"
style = "scratch"
hint.ru = ["""Адаптер это структура плюс `impl Iterator`. А чтобы метод был у любого итератора, нужен ещё трейт с общей реализацией для всех `I: Iterator`.""", """Очередной кусок: `self.inner.by_ref().take(size).collect()`, а пустой кусок означает конец. Паника на нулевом размере должна происходить в `chunks_of`, а не при первом `next`."""]
why.ru = """Две части: структура с `impl Iterator` описывает поведение, трейт-расширение с `impl<I: Iterator> ChunksExt for I {}` раздаёт метод всем итераторам сразу (трейт надо импортировать). `by_ref().take(size)` читает ровно столько, сколько нужно куску, поэтому адаптер ленив и работает на бесконечных источниках. Пустой кусок означает конец, а значит, ни пустого хвоста при ровном делении, ни потери неполного последнего куска."""

[[exercises]]
name = "itr22"
style = "bughunt"
hint.ru = ["""Пройди по коду для трёх элементов и для четырёх. Что происходит с последним одиноким элементом и что произойдёт при следующем вызове `next` после конца?""", """Хвост: второй `next` не должен прерывать функцию через `?`, его результат это `Option`. Конец: добавь флаг `done` и после первого `None` из источника не обращайся к нему."""]
why.ru = """Первый дефект: `?` на втором чтении выбрасывает уже прочитанный первый элемент вместе с функцией. Второй дефект тоньше: контракт `Iterator` не требует, чтобы источник после `None` продолжал отвечать `None`. Хороший адаптер не полагается на это и запоминает конец. Это то, что делает `fuse()`, и тест с «оживающим» источником показывает, что без флага адаптер выдал бы данные после конца."""

[[exercises]]
name = "itr23"
style = "fix"
hint.ru = ["""В `promote` список читают и пишут одновременно. Что, если сначала собрать, что добавить, а потом добавить? В `clean` посчитай `collect`: сколько их и нужны ли они?""", """`promote`: `let hot: Vec<Post> = ...collect(); posts.extend(hot);`. `clean`: убери все промежуточные векторы, оставь одну цепочку `map`, `filter`, `map` и один `collect`."""]
why.ru = """Менять вектор, пока идёшь по нему, нельзя (заимствование): решение отделить чтение от записи, и здесь промежуточный `collect` оправдан. В `clean` он лишний: между адаптерами данные идут по одному, и вектор после каждого шага просто тратит память. Цепочка с одним `collect` в конце делает то же за один проход. Тест проверяет число `collect` в тексте функции, потому что поведение у обоих вариантов одинаковое."""

