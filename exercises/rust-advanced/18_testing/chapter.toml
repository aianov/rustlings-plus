[chapter]
title.ru = "Тестирование"

[[chapter.visuals]]
file = "visuals/test_layers.html"
title.ru = "Три места для тестов"

[[exercises]]
name = "tst1"
style = "fix"
hint.ru = [
  '''Приватные функции видны самому модулю и его детям. Где в таком случае должен лежать тест приватной функции? А где должен лежать код, нужный только тестам?''',
  '''Переезжает не только тест: рядом с ним в `mod slug` нужен `#[cfg(test)] mod tests { use super::*; ... }`. Помощник с примерами заголовков тоже живёт там, иначе обычная сборка о нём ругается.''',
]
why.ru = '''Тест приватной функции кладут рядом с ней, в дочерний модуль `tests`: дети видят приватное родителя, а `#[cfg(test)]` выкидывает модуль из рабочей сборки целиком, вместе с помощниками. Сделать `collapse` публичной ради теста значит сломать границы модуля: потом ей начнут пользоваться снаружи, и менять её внутренности станет нельзя.'''

[[exercises]]
name = "tst2"
style = "scratch"
hint.ru = [
  '''Подумай, какие ошибки обычно делают в парсере порта, и по одному случаю на каждую: границы с обеих сторон, ноль, пустая строка, пробелы, знак, мусор, ведущие нули.''',
  '''Для «большого переполнения» мало 65536: заворот в u16 даёт ноль, и ошибка спрячется. Нужно число, которое после заворота остаётся ненулевым.''',
  '''В `run_table` не выходи при первой ошибке: собери все провалы в `Vec<String>` и склей через `join("\n")`. Вход печатай через `{:?}`, чтобы пробелы были видны.''',
]
why.ru = '''Таблица хороша, когда каждая строка защищает от конкретной ошибки: проверь это, подставив в парсер сломанные версии. Имя случая нужно затем, чтобы по провалу не открывать код. Печатать вход через `{:?}` стоит потому, что пробел или невидимый символ в обычной строке не разглядеть. Останавливаться на первом провале нельзя: два упавших случая вместе подсказывают причину лучше, чем один.'''

[[exercises]]
name = "tst3"
style = "fix"
hint.ru = [
  '''Попробуй сначала усилить тесты, не трогая код: поставь `matches!` на конкретный вариант и `expected` на конкретное сообщение паники. Какие из них покраснеют?''',
  '''`is_err()` отвечает только «ошибка или нет». `#[should_panic(expected = "...")]` проверяет, что подстрока есть в сообщении паники. Тест может возвращать `Result<(), QuotaError>` и пробрасывать ошибку через `?`.''',
  '''Покрасневшее чини в коде: пустую строку отдели до разбора числа, границу лимита сделай включительной, а в `per_user` проверь делитель явным `assert!` с понятным текстом.''',
]
why.ru = '''Слабые проверки зеленеют от чужих ошибок: `is_err` не отличает «пусто» от «не число», а `should_panic` без текста принимает и арифметическую панику. Строгий тест красный ровно по той причине, о которой он написан. `?` в тесте с `Result` короче `unwrap` и показывает ошибку целиком, а не обрывок про `unwrap` на `Err`.'''

[[exercises]]
name = "tst_q1"
kind = "question"
question.ru = '''В крейте `shop` в файле `src/money.rs` есть приватная `fn round_cents(x: f64) -> u64` и публичная `pub fn price(..)`, которая её вызывает. Где можно написать тест, вызывающий `round_cents` напрямую?'''
options.ru = [
  "в `tests/money.rs`, через `use shop::money::round_cents`",
  "в `#[cfg(test)] mod tests` внутри `src/money.rs`",
  "в примере над `price`, в блоке с тремя обратными апострофами",
  "в `tests/common/mod.rs`",
]
answer = [1]
explain.ru = '''Приватное видно только самому модулю и его потомкам, а тестовый модуль внутри `money.rs` как раз потомок. Файлы в `tests/` и примеры в документации это отдельные крейты, которые видят крейт `shop` снаружи, то есть только `pub`. Делать `round_cents` публичной ради теста не нужно.'''
hint.ru = '''Какие тесты видят крейт как чужой, а какие находятся внутри него?'''

[[exercises]]
name = "tst_q10"
kind = "question"
question.ru = '''Для функции `is_leap(year: u32) -> bool` (високосный год) нужна таблица случаев. Какой набор входов сильнее всего?'''
options.ru = [
  "2021, 2022, 2023, 2025",
  "2000, 1900, 2024, 2023",
  "2024, 2028, 2032, 2036",
  "1, 2, 3, 4",
]
answer = [1]
explain.ru = '''Сильный набор берёт по представителю каждого правила: делится на 400 (2000, високосный), делится на 100, но не на 400 (1900, не високосный), делится на 4 (2024, високосный), не делится на 4 (2023). Остальные наборы проходят и у неверной функции «год % 4 == 0» либо вообще не содержат високосных годов.'''
hint.ru = '''Какие правила есть у високосного года и по одному ли случаю на каждое в наборе?'''

[[exercises]]
name = "tst_integration"
style = "scratch"
kind = "project"
locked = ["acceptance/Cargo.toml", "acceptance/tests/acceptance.rs"]
test_command = ["cargo", "test", "--manifest-path", "acceptance/Cargo.toml"]
hint.ru = [
  '''Начни с `crates/inbox/tests/receive.rs` и одного теста. Файлу из `tests/` нужна строка `use inbox::...`: он видит крейт снаружи, как чужой.''',
  '''Общее вынеси в `tests/common/mod.rs` и подключи через `mod common;` в каждом файле. Помощников делай `pub`, а в начале `common/mod.rs` напиши `#![allow(dead_code)]`, иначе каждый файл будет жаловаться на то, чем не пользуется.''',
  '''Подумай, какую ошибку можно сделать в каждой строке `lib.rs`: поменять `>` на `>=`, забыть обрезку, начать счёт с нуля. На каждую такую ошибку нужен тест, который покраснеет. Долгий тест помечай `#[ignore = "..."]`.''',
]
why.ru = '''Тесты в `tests/` видят крейт как внешний пользователь, поэтому проверяют обещания, а не устройство. Общие помощники лежат в `tests/common/mod.rs`: папка не станет отдельным тестовым крейтом, в отличие от `common.rs`. `#![allow(dead_code)]` нужен, потому что каждый файл-крейт компилирует `common` у себя и пользуется им не целиком. Ценность набора проверяет подмена строк: если тест не краснеет от `>=` вместо `>`, он не охраняет границу.'''

[[exercises]]
name = "tst_common_fix"
style = "fix"
kind = "project"
locked = ["acceptance/Cargo.toml", "acceptance/tests/acceptance.rs"]
test_command = ["cargo", "test", "--manifest-path", "acceptance/Cargo.toml"]
hint.ru = [
  '''Запусти `cargo test -p billing` и прочитай вывод целиком: там и ошибка компиляции, и лишний запуск. Какой файл в `tests/` cargo принимает за тест, хотя тестов в нём нет?''',
  '''Файл с помощниками надо превратить в модуль-папку: `tests/common/mod.rs`. Тестовые файлы продолжают писать `mod common;`, им ничего менять не нужно.''',
  '''После переезда останутся два замечания: функции приватные (добавь `pub`) и неиспользуемое (`#![allow(dead_code)]` первой строкой модуля).''',
]
why.ru = '''Каждый `.rs` в корне `tests/` это отдельный тестовый крейт, поэтому `common.rs` порождает пустой запуск. Модуль `tests/common/mod.rs` лежит в подпапке, и cargo его сам не собирает: его подтягивают через `mod common;`. `pub` нужен, потому что для соседнего файла это чужой модуль. `#![allow(dead_code)]` объясняет компилятору, что помощники общие: он считает неиспользованное отдельно в каждом файле-крейте.'''

[[exercises]]
name = "tst_q2"
kind = "question"
question.ru = '''После `cargo test` в выводе есть блок `Running tests/helpers.rs` и под ним `running 0 tests`. Такого теста ты не писал. Что произошло?'''
options.ru = [
  "cargo считает отдельным тестовым крейтом каждый `.rs` в корне `tests/`, в том числе файл с помощниками",
  "все тесты в helpers.rs помечены `#[ignore]`",
  "файл `helpers.rs` подключён через `mod helpers;` и поэтому показан дважды",
  "тесты не запустились из-за ошибки компиляции",
]
answer = [0]
explain.ru = '''Правило простое: файл в `tests/` это крейт. Файл с общими функциями тоже становится крейтом без тестов, и в выводе мелькает пустой запуск. Лечится переносом в `tests/helpers/mod.rs`: папки cargo не собирает, а `mod helpers;` в тестовых файлах находит `mod.rs`.'''
hint.ru = '''Что cargo делает с каждым файлом верхнего уровня в папке `tests/`?'''

[[exercises]]
name = "tst4"
style = "todo"
hint.ru = [
  '''Пример в `///` внутри блока с тремя обратными апострофами запускается как тест. Какого вида нужен пример для функции, которая не возвращается? А для кода, который не должен собираться?''',
  '''Для `Result` с `?` оберни пример в скрытый `fn main() -> Result<(), MaskError>`: строки, начинающиеся с `# `, в документации не видны, но компилируются. Блок для вечной функции помечай `no_run`, а для кода, который обязан не собираться, `compile_fail`.''',
  '''Поломки ловят только `assert_eq!`: проверь и успешный путь, и каждую ошибку, и границы. Пример без проверок зелёный при любом поведении.''',
]
why.ru = '''Doc-тест это маленькая внешняя программа: он видит только публичное и подключает крейт по имени, как настоящий пользователь. Скрытые строки (`# `) убирают из примера шум, `?` в нём работает через скрытый `main`. `no_run` нужен там, где запуск невозможен или бесконечен, `compile_fail` фиксирует, что неверное использование не собирается. Но настоящая ценность примера в `assert_eq!`: без него он лишь доказывает, что код компилируется.'''

[[exercises]]
name = "tst_q3"
kind = "question"
question.ru = '''Какие из этих блоков в документации действительно ВЫПОЛНЯЮТ код при `cargo test` (а не только собирают или пропускают)? Выбери все.'''
options.ru = [
  "```no_run",
  "```should_panic",
  "```ignore",
  "```compile_fail",
  "блок без пометки",
]
answer = [1, 4]
explain.ru = '''`no_run` только собирает, `ignore` не трогает вообще, `compile_fail` проверяет, что код не собирается, и ничего не запускает. Выполняют код обычный блок и `should_panic` (последний к тому же требует, чтобы код запаниковал).'''
hint.ru = '''Какая пометка отключает запуск, какая отключает сборку, а какая переворачивает ожидание?'''

[[exercises]]
name = "tst5"
style = "fix"
hint.ru = [
  '''Запусти только документационные тесты и прочитай провалы по одному. Они разные: где-то устарела проверка, где-то имя, где-то ожидаемый текст, где-то сам смысл примера.''',
  '''Пример под `compile_fail` теперь собирается, и rustdoc считает это ошибкой. Раз `Port` копируемый, покажи именно это: возьми порт в две переменные и проверь, что обе работают.''',
  '''Не ослабляй проверки: после правки каждый пример должен падать, если сломать функцию. Для `Result` проверяй `Ok(..)` и конкретные варианты `Err(..)`, для текста сравнивай строку целиком.''',
]
why.ru = '''Пример в документации стареет вместе с API, и хорошо, что он красный: это единственная документация, которую проверяет компилятор. Чинить нужно смысл, а не цвет: `ignore` или `no_run` вернут зелёный, но потеряют проверку. Пример под `compile_fail` особенно коварен: он «сломался» оттого, что код стал мягче, и rustdoc сообщает, что сборка прошла, хотя не должна была.'''

[[exercises]]
name = "tst6"
style = "todo"
hint.ru = [
  '''Фейк это не заглушка: `get` должен вернуть то, что положил `put`, а `remove` должен убрать. Какая коллекция сама держит ключи по порядку?''',
  '''`put` возвращает прежнего пользователя: у `BTreeMap::insert` ровно такой результат. `get` отдаёт копию (`cloned`), иначе правка снаружи тронула бы хранилище.''',
]
why.ru = '''Фейк повторяет поведение настоящего хранилища в том, что видит сервис: перезапись возвращает старое, `all` упорядочен как `ORDER BY id`, `get` отдаёт копию. `BTreeMap` даёт порядок сам, поэтому сортировка не забывается. Заглушка с заранее заданными ответами проверила бы только, что сервис вызывает методы, а не что он правильно использует результаты.'''

[[exercises]]
name = "tst7"
style = "todo"
hint.ru = [
  '''Трейт принимает `&self`, а журнал надо дополнять. Что позволяет менять данные за общей ссылкой? Подойдёт и `RefCell`, и `Mutex`.''',
  '''Запись в журнал делай до ответа: даже у мока, который отвечает ошибкой, вызов должен остаться в журнале. `calls()` отдаёт копию, чтобы гвард не жил в тесте.''',
]
why.ru = '''Мок отличается от фейка тем, что запоминает, как его использовали. Журнал вызовов позволяет проверить поведение сервиса, не лезя в его внутренности: сколько писем, кому, с каким текстом, в каком порядке. Дополнительный режим «всегда ошибка» нужен, чтобы проверить путь, который в жизни срабатывает редко. `Mutex` выбран, чтобы мок оставался `Sync`.'''

[[exercises]]
name = "tst8"
style = "fix"
hint.ru = [
  '''Сервис получил клон мока. Что именно скопировалось вместе с `derive(Clone)`: сам вектор или только ссылка на него?''',
  '''Журнал должен быть общим для всех клонов. Для общего владения есть `Arc`, а изменять через него можно под `Mutex`. Проверь, что мок остаётся `Send + Sync`.''',
]
why.ru = '''`derive(Clone)` честно копирует все поля, поэтому клон с `RefCell<Vec<_>>` получает свой собственный журнал, и проверка смотрит не туда. Общий журнал это `Arc<Mutex<Vec<_>>>`: клон копирует только `Arc`, то есть указатель, а данные остаются одни. Заодно мок становится `Send + Sync` и годится для сервиса, который живёт в другом потоке.'''

[[exercises]]
name = "tst_q4"
kind = "question"
question.ru = '''Что напечатает программа?
```rust
#[derive(Clone, Default)]
struct Spy {
    calls: RefCell<Vec<String>>,
}
impl Spy {
    fn record(&self, s: &str) { self.calls.borrow_mut().push(s.to_string()); }
}
struct Service { spy: Spy }
impl Service {
    fn run(&self) { self.spy.record("a"); self.spy.record("b"); }
}

let spy = Spy::default();
let service = Service { spy: spy.clone() };
service.run();
println!("{}", spy.calls.borrow().len());
```'''
options.ru = [
  "0",
  "1",
  "2",
  "не соберётся",
]
answer = [0]
explain.ru = '''`derive(Clone)` копирует `RefCell` вместе с вектором, и у сервиса оказывается свой журнал. Оригинал остаётся пустым, поэтому напечатается `0`, хотя `run` дважды записал вызов. Чтобы журнал был общим, его кладут в `Arc<Mutex<Vec<_>>>` (или `Rc<RefCell<..>>`, если потоков нет): тогда клонируется только указатель.'''
hint.ru = '''Что именно копирует derive(Clone) для поля с RefCell?'''

[[exercises]]
name = "tst9"
style = "scratch"
hint.ru = [
  '''Часы и генератор отдают значения через `&self`, а менять их надо снаружи. Какие типы изменяются за общей ссылкой и при этом остаются `Sync`?''',
  '''Сессия хранит время истечения. Жива, пока `now < until`, а не `<=`: ровно в момент `until` она уже просрочена. Время истечения считай в момент `open`.''',
  '''Для таблицы выдач нужен `Mutex<HashMap<u64, u64>>`. `purge` удобно сделать через `retain` и сравнить длину до и после.''',
]
why.ru = '''Время и случайность это скрытые входы функции. Если сервис зовёт их сам, тест не может ни ускорить десять минут, ни предсказать номер. Когда они приходят через трейт, тест держит часы в руках: сдвиг на 599 и ещё на 1 секунду проверяет границу без единого `sleep`. Атомики в подставных типах нужны потому, что трейты принимают `&self`.'''

[[exercises]]
name = "tst10"
style = "bughunt"
hint.ru = [
  '''Найди все места, где читается настоящее время. Часы переданы в структуру, но что из этого используется на самом деле?''',
  '''Оба метода берут время мимо `self.clock`. Поле «заглушено» через `let _ = &self.clock;`, из-за чего ни предупреждение, ни тесты не подсказали беды.''',
]
why.ru = '''Незаконченная переделка хуже, чем её отсутствие: код выглядит как с внедрённой зависимостью, а на деле читает системные часы. Такие тесты зелёные днём и красные около полуночи. Надёжный признак здесь простой: `SystemTime::now` остаётся ровно в одном месте, в реализации `SystemClock`. Всё остальное получает время через трейт.'''

[[exercises]]
name = "tst_q5"
kind = "question"
question.ru = '''Тест `invoice_is_dated_today` проверяет, что счёт получает сегодняшнюю дату. Раз в несколько недель его ночной прогон падает. Что лечит причину?'''
options.ru = [
  "добавить `sleep(1)` перед сравнением, чтобы дата точно успела обновиться",
  "передавать в код `Clock` и подставлять в тесте часы с фиксированным временем",
  "ограничить CI дневным временем",
  "пометить тест `#[ignore]`",
]
answer = [1]
explain.ru = '''Причина в том, что код и тест читают настоящие часы в разные моменты, а около полуночи между ними уже наступает другая дата. `sleep` и расписание лишь прячут проблему. Когда время приходит через трейт, тест ставит часы на 23:59:59 и проверяет оба случая спокойно и всегда одинаково.'''
hint.ru = '''Можно ли воспроизвести ошибку полуночи при настоящих часах?'''

[[exercises]]
name = "tst11"
style = "fix"
hint.ru = [
  '''Фиксированное имя папки делит её между параллельными тестами. Что даёт каждому потоку, процессу и вызову свой уникальный кусочек имени?''',
  '''Уникальность сделай из номера процесса и атомарного счётчика. Уборку поручи `Drop`: он срабатывает и при обычном выходе из области, и при размотке стека после паники.''',
]
why.ru = '''Тесты идут параллельно, а файловая система одна. Уникальное имя (номер процесса плюс счётчик) разводит их, а `Drop` убирает за тестом при любом исходе, даже при панике: при размотке стека деструкторы всё равно выполняются. Уборка в конце теста обычным вызовом при упавшем `assert!` не сработала бы, и мусор копился бы между прогонами.'''

[[exercises]]
name = "tst_q6"
kind = "question"
question.ru = '''Два теста пишут в файл `/tmp/report.csv` и иногда мешают друг другу. Какая мера лечит причину, а не симптом?'''
options.ru = [
  "запускать все тесты с `--test-threads=1`",
  "дать каждому тесту свою уникальную временную папку и убирать её в `Drop`",
  "поставить `#[ignore]` на оба теста",
  "вставить `sleep(50 мс)` перед записью",
]
answer = [1]
explain.ru = '''Общий фиксированный путь это и есть причина. Один поток тестов прячет её и замедляет все остальные тесты проекта, а пауза делает гонку просто реже. Уникальный путь (процесс плюс счётчик) убирает общее состояние, а `Drop` заметает следы и при панике.'''
hint.ru = '''Что общего у двух тестов, из-за чего они мешают друг другу?'''

[[exercises]]
name = "tst_q9"
kind = "question"
question.ru = '''Тест вызывает `println!("шаг 2")` и проходит, но в выводе `cargo test` этой строки нет. Что сделать, чтобы её увидеть?'''
options.ru = [
  "запустить `cargo test -- --nocapture`",
  "запустить `cargo test --nocapture`",
  "заменить `println!` на `print!`",
  "поставить `#[ignore]`",
]
answer = [0]
explain.ru = '''Тестовый бинарник прячет вывод прошедших тестов и показывает его только у упавших. Флаг `--nocapture` относится к тестовому бинарнику, а не к cargo, поэтому его пишут после `--`. Без разделителя cargo сам не поймёт флаг и выдаст ошибку.'''
hint.ru = '''Кому адресован флаг: cargo или тестовой программе?'''

[[exercises]]
name = "tst_support_crate"
style = "fix"
kind = "project"
locked = ["acceptance/Cargo.toml", "acceptance/tests/acceptance.rs"]
test_command = ["cargo", "test", "--manifest-path", "acceptance/Cargo.toml"]
hint.ru = [
  '''Запусти `cargo tree -p shop-core -e normal`: что рабочая сборка ядра берёт с собой? Теперь `-e dev`. Какой из списков должен содержать test-support?''',
  '''Зависимость для тестов объявляется в отдельной секции манифеста. Фейки в `test-support` спрячь за feature: в Cargo.toml `[features]`, в коде `#[cfg(feature = "...")]`. Оставь `unique_name` доступной всегда.''',
  '''Фейки можно вынести в отдельный модуль `fakes.rs` и подключить под `#[cfg(feature = "test-util")]`. В dev-зависимости ядра укажи `features = ["test-util"]`. Поле `default` у feature не заводи.''',
]
why.ru = '''Подставные часы нужны только тестам, поэтому их место в `[dev-dependencies]`: `cargo build` такую зависимость не видит, а `cargo tree -e normal` покажет это сразу. Feature `test-util` ещё один пояс безопасности: даже если крейт случайно попадёт в обычные зависимости, фейки без явной просьбы не скомпилируются. `default` оставлен пустым, потому что features складываются по воркспейсу: кто-то один включил, и всё включено у всех.'''

[[exercises]]
name = "tst_q7"
kind = "question"
question.ru = '''Крейт `core` объявил `test-support = { path = "../test-support", features = ["test-util"] }` в секции `[dependencies]`. `cargo build --release -p core` проходит без ошибок. Что тут не так?'''
options.ru = [
  "ничего: фейки не попадут в бинарник, пока их никто не вызвал",
  "test-support и фейки собираются как обычная зависимость релиза: место этой записи в `[dev-dependencies]`",
  "сборка упадёт, потому что feature `test-util` нельзя включать в release",
  "после этого cargo test не увидит фейки",
]
answer = [1]
explain.ru = '''Зависимость из `[dependencies]` собирается всегда, а feature `test-util` включена прямо в записи. Что именно линкер оставит в бинарнике, дело оптимизатора, но граф зависимостей рабочей сборки уже испорчен (`cargo tree -e normal` покажет test-support) и вся логика «тестовое отдельно» нарушена. `[dev-dependencies]` видны только тестам, примерам и бенчмаркам.'''
hint.ru = '''Какая секция манифеста видна обычной сборке, а какая только тестам?'''

[[exercises]]
name = "tst_q8"
kind = "question"
question.ru = '''Тест зелёный:
```rust
fn pick(items: &[u32], i: usize) -> u32 { items[i] }

#[test]
#[should_panic(expected = "index out of bounds")]
fn picks_beyond_the_end() { pick(&[1, 2, 3], 3); }
```
Разработчик переписал тело: `items.get(i).copied().expect("нет такого элемента")`. Что станет с тестом?'''
options.ru = [
  "останется зелёным: паника же всё равно есть",
  "покраснеет: сообщение паники другое, и `expected` не находит в нём нужную подстроку",
  "тест не соберётся",
  "покраснеет, потому что `get` не паникует",
]
answer = [1]
explain.ru = '''`expected` проверяет, что сообщение паники содержит заданный текст. Паника осталась, но говорит другое, и тест справедливо краснеет: он зафиксировал причину, а не просто факт паники. Поэтому текст в `expected` стоит делать частью обещания функции (`assert!` с понятным сообщением), а не случайной фразой стандартной библиотеки.'''
hint.ru = '''Что проверяет `expected`: сам факт паники или её текст?'''

[[exercises]]
name = "tst_cover_lib"
style = "scratch"
kind = "project"
quiz = true
locked = ["acceptance/Cargo.toml", "acceptance/tests/acceptance.rs"]
test_command = ["cargo", "test", "--manifest-path", "acceptance/Cargo.toml"]
hint.ru = [
  '''Составь список правил из ТЗ и для каждого найди граничный случай: 280 и 281 символ, 29 и 30 секунд, номер курсора, регистр автора. Каждое правило проверь тем видом теста, который его лучше видит.''',
  '''Приватную `clean` проверяй юнит-тестом в самом `lib.rs`, там же нужны свои часы. Остальное идёт в `tests/`: `FakeClock` с общим `Rc<Cell<u64>>`, чтобы тест сдвигал время, которое видит лента.''',
  '''Для кириллицы бери `"я".repeat(280)`: символов 280, байт 560. Для паузы проверяй обе стороны границы. Документационные примеры должны содержать `assert_eq!` и скрытые заглушки часов.''',
]
why.ru = '''Двенадцать подмен в приёмке это двенадцать типичных ошибок: байты вместо символов, `<=` вместо `<`, перевёрнутый порядок, регистр, отсчёт паузы от первого поста. Каждую ловит тест на границе или на неочевидном входе, а не на удобном. Часы с общим счётчиком позволяют сдвигать время без `sleep`. Проверка на `--test-threads=1` и на 8 потоков убеждается, что тесты независимы и не рассчитывают на порядок.'''
