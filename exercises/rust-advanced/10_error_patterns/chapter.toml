[chapter]
title.ru = "Ошибки как часть дизайна крейта"

[[chapter.visuals]]
file = "visuals/error_chain.html"
title.ru = "Ошибка поднимается через крейты и печатается по цепочке"

[[exercises]]
name = "erp1"
style = "todo"
hint.ru = [
  '''Display пишется через `write!(f, ...)` для каждого варианта в `match self`. Строки в кавычках в тестах получаются из `{key:?}`.''',
  '''Для `read_port` нужны три шага: достать значение (нет ключа: `Missing`), разобрать число (не вышло: `NotANumber`, и в нём лежит исходная строка), проверить границы. Первые два шага удобно писать через `ok_or_else` и `map_err` вместе с `?`.''',
  '''Разбирай в `u32`, а не в `u16`: тогда 70000 доходит до проверки границ и становится `OutOfRange`, а не `NotANumber`.''',
]
why.ru = '''Ошибка это обычное значение, поэтому у неё есть данные в вариантах: по ним код выбирает реакцию, а `Display` пишет текст для человека. `impl Error` пустой, потому что у этой ошибки нет причины. Разбор в `u32` важен: число 70000 разобралось, оно просто не годится как порт, и это другая ошибка, чем «не число».'''

[[exercises]]
name = "erp2"
style = "todo"
hint.ru = [
  '''Если пользователь нашёлся, ошибку строить не надо. Какой из методов `Option` принимает замыкание, а не готовое значение?''',
  '''`Option<&str>` в `Result<Option<u32>, _>` переворачивает `transpose`. Сначала `as_deref()` и `map(str::parse)`.''',
  '''`shout_city`: `table.get(&id)?` вернёт `None` из функции, если пользователя нет, а второй `?` проверит город.''',
]
why.ru = '''`ok_or_else` строит ошибку только на пути ошибки, а `ok_or` строит её всегда, и тест со счётчиком это ловит. `transpose` разворачивает `Option<Result<..>>` в `Result<Option<..>>`: «нет значения» остаётся успехом, «испорченное значение» остаётся ошибкой. `?` на `Option` работает в функциях, которые сами возвращают `Option`.'''

[[exercises]]
name = "erp3"
style = "todo"
hint.ru = [
  '''У трейта `Error` есть метод `source` со стандартной реализацией. Какой ответ она даёт?''',
  '''Нужно переопределить `source` в `impl Error for LoadError`. `match self` по вариантам, у которых есть причина, и `None` для остальных.''',
  '''Поле `source` в варианте уже подходит как причина. Ссылка на `io::Error` сама превращается в `&(dyn Error + 'static)`.''',
]
why.ru = '''Метод `source` это то, что отличает ошибку с причиной от ошибки без неё. Без него `Display` приходится делать длинным, а код, которому нужен `ErrorKind`, вынужден разбирать текст. Возвращаем ссылку на поле, а не клон: ошибка владеет причиной, и никто не создаёт копию.'''

[[exercises]]
name = "erp4"
style = "fix"
hint.ru = [
  '''Прочитай, что печатает каждый `Display`. Цепочку собирает функция обхода, а не сама ошибка: кто тогда отвечает за текст причины?''',
  '''Display каждого уровня говорит только о своём уровне: `read data.bin`, а не `read data.bin: disk is full`. Склеивает уровни `chain_line`: начни с самой ошибки и иди по `source()`.''',
  '''`root_cause` и `chain_line` ходят по одной и той же цепочке: переменная хранит текущую ошибку, на каждом шаге её заменяет причина, пока причины не кончатся.''',
]
why.ru = '''Есть два способа показать цепочку, и смешивать их нельзя. Либо каждый уровень пересказывает причину в своём `Display` (тогда печатать нужно только верхний), либо каждый говорит о себе (тогда обход идёт по `source`). Второй вариант лучше: лог и пользователь выбирают, сколько уровней показать, а структурированные причины остаются доступными.'''

[[exercises]]
name = "erp5"
style = "todo"
hint.ru = [
  '''`?` вызывает `From::from` для ошибки. Что именно компилятор не находит?''',
  '''Нужны две реализации `From`: из `io::Error` и из `ParseIntError`, каждая заворачивает значение в свой вариант.''',
  '''Тело `total` уже написано. Ему не хватает только того, что требует `?`: по реализации на каждую чужую ошибку.''',
]
why.ru = '''Знак вопроса это `match` плюс `From::from`. Пока для типа ошибки есть реализация `From`, `?` в теле функции работает без `map_err`. Это удобно, но широкие реализации стирают контекст (где именно сломалось), и об этом следующая задача.'''

[[exercises]]
name = "erp6"
style = "fix"
hint.ru = [
  '''Ошибка говорит `line 0`? Откуда берётся этот ноль? Посмотри на `From<ParseIntError>`.''',
  '''Тот, кто знает номер строки, это цикл в `parse_statement`. Значит, ошибку там и надо строить, а `?` с `From` не подходит: `From` ничего не знает о месте, где вызван.''',
  '''Вариант строится там, где известны номер и текст: у `parse()` для этого есть `map_err`, а общий `impl From` ничего не знает о месте вызова.''',
]
why.ru = '''`From` удобен, когда превращение не зависит от места. Если в ошибку нужны данные, которые известны только вызывающему (номер строки, имя файла, id), общий `From` либо выдумывает значения, либо молча кладёт пустые. Тест специально проверяет, что такого превращения вообще нет: компилятор не даст построить ошибку без номера строки.'''

[[exercises]]
name = "erp7"
style = "todo"
hint.ru = [
  '''Метод трейта на `Result<T, E>`: сначала `map_err`. Какой тип нужен внутри `Contextual`?''',
  '''`Box::new(e)` кладёт любую ошибку в `Box<dyn Error + Send + Sync>`, но только если `E` имеет все три свойства и время жизни `static`. Добавь `where`.''',
  '''`with_context` отличается тем, что строку делает вызов `make()` внутри `map_err`: замыкание выполняется только при `Err`.''',
]
why.ru = '''Это в десять строк то, что делают крейты вроде `anyhow`: оборачивают ошибку в новое сообщение и хранят исходную как `source`. Границы `Send + Sync + 'static` нужны потому, что причина лежит в `Box<dyn Error + Send + Sync>`: без них такой ящик нельзя ни отправить в поток, ни проверить `downcast_ref`.'''

[[exercises]]
name = "erp8"
style = "todo"
hint.ru = [
  '''`?` кладёт в `Box<dyn Error + Send + Sync>` и `io::Error`, и `ParseIntError`. А для строки есть `.into()`.''',
  '''`downcast_ref::<io::Error>()` отвечает «это ли тип», а не «есть ли он где-то глубже». Для глубины нужен цикл по `source()`.''',
  '''Заведи переменную с текущей ошибкой в цепочке и на каждом шаге пробуй `downcast_ref`, потом переходи к причине.''',
]
why.ru = '''`Box<dyn Error + Send + Sync>` хорош для верхнего слоя программы: ему не нужен общий enum, и он честно хранит настоящую ошибку внутри, поэтому `downcast_ref` её достаёт. Но обёртки скрывают тип, и проверка «это io::Error?» только на верхнем уровне пропустит ошибку, лежащую глубже. Поэтому поиск причины идёт по всей цепочке.'''

[[exercises]]
name = "erp9"
style = "fix"
hint.ru = [
  '''Прочитай, какого свойства не хватает типу: компилятор называет его в сообщении. Какое слово дописывается в `dyn Error`?''',
  '''Исправление в двух местах: коробка ошибки и тип внутри `Rejected`. `Rc` нельзя отправлять между потоками, а у какого указателя счётчик атомарный?''',
  '''Исправлений два: свойство в границе коробки и тип счётчика в поле. Конструкторы обновляются по ошибкам компилятора.''',
]
why.ru = '''`Box<dyn Error>` без `Send` значит «любая ошибка, возможно с `Rc` внутри». Поток вернёт значение через границу, а такое значение переехать не может. Пишите `Send + Sync` в сигнатурах публичных ошибок сразу: тогда они работают и в потоках, и в async-коде, и в `Arc`.'''

[[exercises]]
name = "erp10"
style = "todo"
hint.ru = [
  '''Прочитай модуль `storage` целиком: у него уже есть `Error`, `Result` и `Display`. Тот же набор нужен в `accounts`.''',
  '''`impl From<storage::Error> for Error` позволяет в `withdraw` писать `storage::balance(..)?`. Вариант `Storage` обязан хранить исходную ошибку и отдавать её через `source`.''',
  '''Тело `withdraw`: баланс через `?`, если денег меньше суммы: `Insufficient`, иначе остаток.''',
]
why.ru = '''У каждого крейта своя ошибка и свой `Result`: так по типу сразу видно, чья это неудача. Нижний слой оборачивается в вариант верхнего (`Storage`), а `Display` верхнего не повторяет текст нижнего: его покажет обход цепочки. `From` на границе слоёв делает сквозной `?` бесплатным.'''

[[exercises]]
name = "erp11"
style = "fix"
hint.ru = [
  '''Какой тип стоит в публичном enum? Чьей он библиотеки? Что будет, если парсер заменят?''',
  '''Публичная ошибка должна состоять из своих типов: числа, строки, свои перечисления. Чужой тип остаётся внутри функции.''',
  '''Вариант с чужим типом нужно заменить своим, с данными, которые вызывающему правда нужны, а ошибку парсера преобразовать на границе.''',
]
why.ru = '''Всё, что видно в публичной сигнатуре, часть твоего контракта. Если там стоит тип чужой библиотеки, смена версии или самой библиотеки ломает всех, кто на тебя полагается. Собственный вариант с нужными данными (смещение, строка) оставляет парсер деталью реализации. Тест гоняет компилятор с запретом `private_interfaces`: он находит публичное API, которое называет недоступный снаружи тип.'''

[[exercises]]
name = "erp12"
style = "fix"
hint.ru = [
  '''`let _ = writeln!(..)` отбрасывает `Result`. Подумай, что должен вернуть метод, который может не сработать.''',
  '''`append` и `finish` возвращают `io::Result<()>`, а `?` пробрасывает ошибку. Счётчик увеличивай после того, как запись удалась.''',
  '''Для `Batch` помогает атрибут `#[must_use]` на типе (с сообщением, что именно потеряно).''',
]
why.ru = '''`let _ =` и `.ok()` заглушают предупреждение о неиспользованном результате, но ошибка исчезает навсегда: запись в журнал «получилась», хотя диск полон. Если сбой нельзя обработать на месте, его возвращают. `#[must_use]` на типе защищает от обратной ошибки: методы-сборщики, которые возвращают изменённую копию, а не меняют на месте, часто вызывают «вхолостую».'''

[[exercises]]
name = "erp13"
style = "bughunt"
hint.ru = [
  '''Найди все `unwrap`, `assert!` и `panic!` в `parse_rate`. Откуда приходят данные: из нашего кода или снаружи?''',
  '''Чужие данные дают `Err(RateError::...)`, для каждого вида ошибки у enum уже есть вариант. В `run_isolated` панику потока вернёт `join()` как `Err(Box<dyn Any + Send>)`.''',
  '''Содержимое паники достаётся через `downcast_ref::<&str>()` и `downcast_ref::<String>()`: `panic!("текст")` и `panic!("текст {}", x)` хранят разные типы.''',
]
why.ru = '''Паника это «в моём коде нарушена ошибка, продолжать нельзя», а `Result` это «так бывает в работе». Всё, что пришло снаружи, ожидаемая ошибка. `join()` превращает панику потока в обычное значение, но внутри лежит `dyn Any`, и сообщение достаётся двумя `downcast_ref`: литерал паники это `&str`, форматированная строка это `String`.'''

[[exercises]]
name = "erp_error_layers"
style = "scratch"
kind = "project"
quiz = true
locked = ["crates/ledger-store/tests/acceptance.rs", "crates/ledger-core/tests/acceptance.rs", "crates/ledger-cli/tests/acceptance.rs"]
hint.ru = [
  '''Начни с `ledger-store`: сначала `Display` и `Error` для `Error`, потом `parse`. `source` у `BadLine` возвращает `ParseIntError`, у остальных `None`.''',
  '''`ledger-core`: у каждого варианта, оборачивающего ошибку хранилища, свой `source`. Перевод проверяй в таком порядке: сумма, оба счёта, достаточность. Чтобы перевод самому себе не ломал баланс, второй раз читай получателя после списания.''',
  '''`ledger-cli`: `run` складывает ошибку своего крейта в `Box` через `.into()`. `report` и `exit_code` ходят по `source()`; `exit_code` на каждом шаге пробует `downcast_ref` к трём типам.''',
]
why.ru = '''Три слоя, и в каждом одна и та же дисциплина: свой тип ошибки, причина лежит в поле и отдаётся через `source`, а `Display` говорит только о своём уровне. Из-за этого `report` собирает человеческую строку, а `exit_code` выбирает код по настоящему типу в цепочке, не разбирая текст. Тесты ловят и «ленивые» решения: ошибка, превращённая в `String` на границе крейта, не пройдёт `matches!` по вложенному типу.'''

[[exercises]]
name = "erp_q1"
kind = "question"
question.ru = '''Что напечатает программа?
```rust
use std::error::Error;
use std::fmt;

#[derive(Debug)]
struct Db(String);
impl fmt::Display for Db {
    fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result { write!(f, "db: {}", self.0) }
}
impl Error for Db {}

#[derive(Debug)]
struct Repo { source: Db }
impl fmt::Display for Repo {
    fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result { write!(f, "repo failed: {}", self.source) }
}
impl Error for Repo {
    fn source(&self) -> Option<&(dyn Error + 'static)> { Some(&self.source) }
}

fn chain(e: &(dyn Error + 'static)) -> String {
    let mut parts = vec![e.to_string()];
    let mut cur = e.source();
    while let Some(c) = cur { parts.push(c.to_string()); cur = c.source(); }
    parts.join(" | ")
}

fn main() {
    println!("{}", chain(&Repo { source: Db("timeout".into()) }));
}
```'''
options.ru = [
  "repo failed | db: timeout",
  "repo failed: db: timeout | db: timeout",
  "db: timeout",
  "repo failed: db: timeout",
]
answer = [1]
explain.ru = '''`Display` у `Repo` уже включает текст причины, а `chain` добавляет причину ещё раз, взяв её из `source`. Получается два упоминания `db: timeout`. Договорённость должна быть одна: или `Display` уровня говорит только о себе и цепочку собирает обход, или `Display` пересказывает причину и обход не нужен.'''
hint.ru = '''Сколько раз причина попадёт в строку: из `Display` верхнего уровня и из обхода?'''

[[exercises]]
name = "erp_q2"
kind = "question"
question.ru = '''Какая из этих функций не соберётся?
```rust
use std::error::Error;

fn a() -> Result<u8, Box<dyn Error>> { Ok("7".parse::<u8>()?) }
fn b() -> Result<u8, Box<dyn Error>> { Ok(None::<u8>.ok_or("missing")?) }
fn c() -> Result<u8, String> { Ok("7".parse::<u8>()?) }
fn d() -> Result<u8, Box<dyn Error + Send + Sync>> { Err(format!("bad {}", 1))? }
```'''
options.ru = [
  "a",
  "b",
  "c",
  "d",
]
answer = [2]
explain.ru = '''`?` вызывает `From::from` для типа ошибки функции. `Box<dyn Error>` принимает любую стандартную ошибку, а также `&str` и `String`, поэтому a, b и d собираются. В `Result<_, String>` нет `From<ParseIntError> for String`, поэтому c не компилируется: либо `map_err(|e| e.to_string())`, либо тип ошибки поновее.'''
hint.ru = '''Проверь у каждой функции: есть ли `From` из типа ошибки в выражении в тип ошибки функции.'''

[[exercises]]
name = "erp_q3"
kind = "question"
question.ru = '''Почему эта функция не собирается?
```rust
fn first_even(v: &[i32]) -> Result<i32, String> {
    let x = v.iter().find(|x| **x % 2 == 0)?;
    Ok(*x)
}
```'''
options.ru = [
  "`find` возвращает ссылку, а `Ok` ждёт значение",
  "`String` не реализует `Error`, поэтому его нельзя вернуть",
  "`?` превращает `None` в `Err(String::new())`, но это ошибка вывода типов",
  "`?` на `Option` можно использовать только в функции, которая сама возвращает `Option`; для `Result` нужен переход вроде `ok_or`",
]
answer = [3]
explain.ru = '''`?` не превращает `Option` в `Result` сам: `None` не знает, какую ошибку подставить. Нужен явный `ok_or("no even number")?` или `ok_or_else(|| ...)`. Ссылка `&i32` тут ни при чём, а `Result<_, String>` вполне допустим.'''
hint.ru = '''Что должно получиться из `None` в функции, которая возвращает `Result<_, String>`?'''

[[exercises]]
name = "erp_q4"
kind = "question"
question.ru = '''Что напечатает `report(&outer)`, если `report` печатает `to_string()` и все причины по `source()`, а `Outer` написан так?
```rust
#[derive(Debug)]
struct Inner;
impl fmt::Display for Inner { fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result { write!(f, "inner broke") } }
impl Error for Inner {}

#[derive(Debug)]
struct Outer { inner: Inner }
impl fmt::Display for Outer { fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result { write!(f, "outer failed") } }
impl Error for Outer {}
```'''
options.ru = [
  "outer failed",
  "outer failed: inner broke",
  "ошибка компиляции: `source` обязателен",
  "outer failed, а потом паника",
]
answer = [0]
explain.ru = '''Метод `source` у трейта `Error` имеет реализацию по умолчанию, которая возвращает `None`. Само поле `inner` не делает его причиной: компилятор не угадывает. Забытый `source` тихая ошибка: код собирается, а в логах пропадает настоящая причина.'''
hint.ru = '''Что вернёт `source()`, если его не переопределили?'''

[[exercises]]
name = "erp_q5"
kind = "question"
question.ru = '''В каких случаях `expect` (то есть паника) уместнее, чем возврат `Err`? Выбери все.'''
options.ru = [
  "Регулярное выражение собирается из литерала в самом коде, и оно проверено тестами",
  "Поле `age` из JSON-запроса клиента нужно разобрать в число",
  "Индекс элемента в таблице, которую эта же функция только что заполнила по длине",
  "Путь к файлу настроек пришёл из аргумента командной строки",
]
answer = [0, 2]
explain.ru = '''`expect` для нарушенных инвариантов: если регулярное выражение из литерала не собирается, это баг программиста, и лучше упасть сразу с понятным сообщением. То же с индексом, который мы сами только что сделали корректным. Данные клиента и аргументы командной строки приходят снаружи и ошибочны штатно, для них нужен `Result`.'''
hint.ru = '''Спроси себя: если это случилось, виноват ввод или программист?'''

[[exercises]]
name = "erp_q6"
kind = "question"
question.ru = '''Что напечатает программа?
```rust
use std::error::Error;
use std::io;

#[derive(Debug)]
struct Contextual { message: String, source: Box<dyn Error + Send + Sync> }
impl std::fmt::Display for Contextual {
    fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result { f.write_str(&self.message) }
}
impl Error for Contextual {
    fn source(&self) -> Option<&(dyn Error + 'static)> { Some(&*self.source) }
}

fn main() {
    let err: Box<dyn Error + Send + Sync> = Box::new(Contextual {
        message: "reading config".into(),
        source: Box::new(io::Error::from(io::ErrorKind::NotFound)),
    });
    println!("{}", err.downcast_ref::<io::Error>().is_some());
}
```'''
options.ru = [
  "true",
  "compile error",
  "false",
  "panic",
]
answer = [2]
explain.ru = '''`downcast_ref` проверяет тип самого значения в коробке, а там `Contextual`. `io::Error` лежит на уровень глубже, и добраться до него можно только обходом `source()` с `downcast_ref` на каждом шаге. Поэтому проверки вида «была ли в цепочке такая причина» пишут циклом.'''
hint.ru = '''Какого типа значение лежит в самой коробке?'''

[[exercises]]
name = "erp_q7"
kind = "question"
question.ru = '''У приложения такой тип ошибки и такая функция. Файла `data.bin` нет. В какой вариант попадёт ошибка?
```rust
enum AppError { Config(io::Error), Data(io::Error) }
impl From<io::Error> for AppError { fn from(e: io::Error) -> Self { AppError::Config(e) } }

fn load() -> Result<(), AppError> {
    let _cfg = fs::read("app.conf")?;
    let _data = fs::read("data.bin")?;
    Ok(())
}
```'''
options.ru = [
  "В `Data`: компилятор видит имя файла",
  "В `Data`, потому что она вторая в enum",
  "Код не соберётся: два варианта с одним типом",
  "В `Config`: `From` не знает, какой файл читали; различать надо `map_err` на месте вызова",
]
answer = [3]
explain.ru = '''`From<io::Error>` может быть только один, и он ничего не знает о месте вызова, поэтому любой `io::Error` попадёт в `Config`. Код собирается: конфликта нет, он возник бы, если бы реализаций `From<io::Error>` было две. Чтобы различать источники, пишут `fs::read("data.bin").map_err(AppError::Data)?`.'''
hint.ru = '''Откуда `?` узнает, какой именно файл не открылся?'''

[[exercises]]
name = "erp_q8"
kind = "question"
question.ru = '''Какие из этих способов тихо теряют ошибку записи?
```rust
let _ = writeln!(out, "line");        // 0
writeln!(out, "line").ok();           // 1
writeln!(out, "line")?;               // 2
writeln!(out, "line").unwrap();       // 3
```'''
options.ru = [
  "0",
  "1",
  "2",
  "3",
]
answer = [0, 1]
explain.ru = '''`let _ =` и `.ok()` заглушают предупреждение и выбрасывают `Err`, то есть сбой пропадает без следа. `?` отдаёт ошибку вызывающему, а `unwrap` останавливает программу (грубо, но не тихо). Если ошибкой действительно нельзя заняться, это решение стоит записать в комментарии или в журнале, а не оставить как `let _`.'''
hint.ru = '''Какие из способов не оставляют после себя ни ошибки, ни паники?'''

[[exercises]]
name = "erp_q9"
kind = "question"
question.ru = '''Поток падает двумя разными способами. Что печатает программа?
```rust
use std::thread;

fn main() {
    let a = thread::spawn(|| { panic!("disk"); }).join().unwrap_err();
    let n = 1;
    let b = thread::spawn(move || { panic!("disk {n}"); }).join().unwrap_err();
    println!("{} {}", a.downcast_ref::<&str>().is_some(), b.downcast_ref::<&str>().is_some());
}
```'''
options.ru = [
  "true false",
  "true true",
  "false false",
  "false true",
]
answer = [0]
explain.ru = '''Паника с литералом без аргументов несёт `&'static str`, а паника с форматированием несёт `String`: строка собирается во время выполнения. Поэтому сообщение паники достают, проверяя оба типа, как в `run_isolated`. Если проверить один, половина сообщений превратится в «unknown panic».'''
hint.ru = '''Откуда берётся строка во втором случае: из литерала или из `format!`?'''
