<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ошибка поднимается через крейты</title>
<style>
:root{--bg:#fafaf7;--fg:#1d1d1b;--mut:#6b6b66;--card:#fff;--line:#c9c7bd;--acc:#c2410c;--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;--warn:#a16207;--warnbg:#fef9c3;--btn:#1d1d1b;--btnfg:#fff;--hot:#fff1e6}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--fg:#ecebe6;--mut:#9a9a92;--card:#201f1d;--line:#46443f;--acc:#fb923c;--ok:#4ade80;--okbg:#14301d;--bad:#f87171;--badbg:#3a1a1a;--warn:#facc15;--warnbg:#3a3312;--btn:#ecebe6;--btnfg:#161614;--hot:#33241a}}
*{box-sizing:border-box}
body{margin:0;padding:20px;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 14px}
.panel{max-width:860px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;min-height:150px}
.row{display:flex;gap:10px;align-items:center;font:13px ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--line);border-radius:8px;padding:7px 10px;margin:6px 0}
.row.ok{border-color:var(--ok);background:var(--okbg)}
.row.no{border-color:var(--bad);background:var(--badbg);text-decoration:line-through;opacity:.75}
.row.hot{border-color:var(--warn);background:var(--warnbg)}
.row .tag{margin-left:auto;font:12px system-ui,sans-serif;color:var(--mut);text-decoration:none}
.box{display:inline-block;font:13px ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--line);border-radius:8px;padding:8px 12px;margin:4px 6px 4px 0;vertical-align:top}
.box.ok{border-color:var(--ok);background:var(--okbg)}
.box.hot{border-color:var(--warn);background:var(--warnbg)}
.box.no{border-color:var(--bad);background:var(--badbg)}
.box small{display:block;color:var(--mut);font:12px system-ui,sans-serif}
.arrow{display:inline-block;margin:0 4px;color:var(--mut);font-size:18px;vertical-align:middle}
.note{margin:12px 0;padding:12px 14px;border-left:4px solid var(--acc);background:var(--card);border-radius:0 8px 8px 0;min-height:76px;max-width:860px}
.bar2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:860px}
button{font:inherit;padding:7px 14px;border-radius:8px;border:0;background:var(--btn);color:var(--btnfg);cursor:pointer}
button.alt{background:transparent;color:var(--fg);border:1px solid var(--line)}
button:disabled{opacity:.4;cursor:default}
.cnt{color:var(--mut);margin-left:auto}
</style>
</head>
<body>
<h1>Ошибка поднимается через крейты</h1>
<p class="sub">Как ошибка обрастает слоями и как она печатается по цепочке</p>
<div class="panel" id="panel"></div>
<div class="note" id="note"></div>
<div class="bar2">
  <button id="step">Шаг</button>
  <button id="play" class="alt">Играть</button>
  <button id="reset" class="alt">Сначала</button>
  <span class="cnt" id="cnt"></span>
</div>
<script>
const steps=[{"p": "<div class=\"row hot\"><span>ParseIntError: invalid digit found in string</span><span class=\"tag\">стандартная библиотека</span></div><p style=\"color:var(--mut)\">Строка журнала <code>bob=x</code> не разобралась. Это самая глубокая причина, корень.</p>", "n": "Всё начинается внизу: parse() вернул ParseIntError. На этом уровне он ничего не знает ни о журнале, ни о строке, ни о пользователе."}, {"p": "<div class=\"row ok\"><span>store::Error::BadLine { line: 2, text: \"bob=x\", source }</span><span class=\"tag\">crate ledger-store</span></div><div style=\"margin-left:28px\"><div class=\"row hot\"><span>источник (source): ParseIntError</span><span class=\"tag\">хранится в поле</span></div></div>", "n": "Крейт хранилища оборачивает причину в свою ошибку и добавляет то, что знает только он: номер строки и сама строка. Display: bad line 2: \"bob=x\". Причина лежит в поле и отдаётся через source()."}, {"p": "<div class=\"row ok\"><span>core::Error::Open { source }</span><span class=\"tag\">crate ledger-core</span></div><div style=\"margin-left:28px\"><div class=\"row ok\"><span>store::Error::BadLine</span><span class=\"tag\">crate ledger-store</span></div><div style=\"margin-left:28px\"><div class=\"row hot\"><span>ParseIntError</span><span class=\"tag\">корень</span></div></div></div>", "n": "Слой правил оборачивает ошибку хранилища. Display: cannot open ledger. Текст нижнего уровня сюда не копируется, он останется доступен через source()."}, {"p": "<div class=\"row ok\"><span>cli::Error::Core(..)</span><span class=\"tag\">crate ledger-cli</span></div><div style=\"margin-left:28px\"><div class=\"row ok\"><span>core::Error::Open</span><span class=\"tag\">crate ledger-core</span></div><div style=\"margin-left:28px\"><div class=\"row ok\"><span>store::Error::BadLine</span><span class=\"tag\">crate ledger-store</span></div><div style=\"margin-left:28px\"><div class=\"row hot\"><span>ParseIntError</span><span class=\"tag\">корень</span></div></div></div></div>", "n": "Верхний крейт добавляет свой слой (command failed) и кладёт всю цепочку в Box<dyn Error + Send + Sync>. Из ящика наружу видна только общая ошибка, но настоящие типы остались внутри."}, {"p": "<div class=\"box ok\">main получает<small>Box&lt;dyn Error + Send + Sync&gt;</small></div><span class=\"arrow\">&rarr;</span><div class=\"box hot\">err.to_string()<small>только верхний уровень: «command failed»</small></div>", "n": "Одного to_string() мало: он говорит только о верхнем уровне. Чтобы показать пользователю всю историю, нужно пройти по цепочке причин."}, {"p": "<div class=\"row hot\"><span>command failed</span><span class=\"tag\">1. err.to_string()</span></div><div class=\"row \"><span>cannot open ledger</span><span class=\"tag\">2. err.source()</span></div><div class=\"row \"><span>bad line 2: \"bob=x\"</span><span class=\"tag\">3. .source()</span></div><div class=\"row \"><span>invalid digit found in string</span><span class=\"tag\">4. .source() ... None дальше</span></div>", "n": "Обход: взять err, напечатать, потом source(), и так пока не вернётся None. Каждый уровень рассказывает только о себе."}, {"p": "<div class=\"row ok\"><span>command failed: cannot open ledger: bad line 2: \"bob=x\": invalid digit found in string</span><span class=\"tag\">готовая строка</span></div><p style=\"color:var(--mut)\">Код возврата выбирается другим обходом: на каждом шаге <code>downcast_ref</code> к известному типу (Insufficient, NoSuchAccount, Usage).</p>", "n": "Результат: одна строка для человека. А для программы цепочка остаётся набором настоящих типов, по которым можно выбрать код возврата, не разбирая текст."}, {"p": "<div class=\"row no\"><span>command failed: cannot open ledger: bad line 2: \"bob=x\": invalid digit found in string: invalid digit found in string</span><span class=\"tag\">ошибка</span></div><p style=\"color:var(--mut)\">Если Display строки BadLine сам дописывает «: {source}», причина попадает в строку дважды: один раз из Display, второй раз из обхода.</p>", "n": "Типичная ошибка: уровень пересказывает причину в своём Display, а печать ходит по source(). Договорись: Display говорит только о своём уровне."}];
let i=0,timer=null;
function stop(){if(timer){clearInterval(timer);timer=null;}document.getElementById('play').textContent='Играть';}
function frame(){document.getElementById('panel').innerHTML=steps[i].p;document.getElementById('note').textContent=steps[i].n;document.getElementById('cnt').textContent='шаг '+(i+1)+' из '+steps.length;document.getElementById('step').disabled=i>=steps.length-1;if(i>=steps.length-1)stop();}
document.getElementById('step').onclick=()=>{if(i<steps.length-1){i++;frame();}};
document.getElementById('reset').onclick=()=>{stop();i=0;frame();};
document.getElementById('play').onclick=()=>{if(timer){stop();return;}if(i>=steps.length-1){i=0;frame();}document.getElementById('play').textContent='Пауза';timer=setInterval(()=>{if(i<steps.length-1){i++;frame();}else stop();},3000);};
frame();
</script>
</body>
</html>
