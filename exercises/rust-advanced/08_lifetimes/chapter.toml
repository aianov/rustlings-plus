```rust
fn run<F>(f: F) where F: for<'a> Fn(&'a str) -> &'a str {
    println!("{}", f("x"));
}
```'''
options.ru = ["`run(|s| s.trim())`", "`run(|s| s.to_uppercase())`", "`let fixed = String::from(\"q\"); run(|_| fixed.as_str())`", "`run(|_| \"const\")`"]
answer = [0, 3]
explain.ru = """Условие требует: для любой ссылки вернуть ссылку на ту же жизнь. `s.trim()` так и делает. Литерал `"const"` это `&'static str`, он подходит под любую жизнь. `s.to_uppercase()` возвращает `String`, это другой тип. Замыкание, отдающее `fixed.as_str()`, привязано к жизни `fixed`, а не к входу `s`, и под «любое время жизни» не годится."""
hint.ru = """Подумай, из чего построен результат в каждом замыкании: из входа, из захваченного или из ничего?"""

[[exercises]]
name = "ltm17"
style = "fix"
hint.ru = ["""Что тип `impl Iterator` в результате захватывает в edition 2024? Перечисли входы функции, которые итератор теперь «помнит».""", """Итератор держит только `text` и свою копию разделителей. Скажи это явно: к типу результата дописывается `+ use<'a>`."""]
why.ru = """С 2024 года `impl Trait` захватывает все времена жизни из входов, чтобы не ошибиться с невидимыми ссылками. Это безопасно, но иногда слишком щедро: итератор привязан к `separators`, хотя копирует его. `use<'a>` сужает список до того, что действительно используется, и тогда строку разделителей можно выбросить сразу после вызова."""

[[exercises]]
name = "ltm_q8"
kind = "question"
question.ru = '''Edition 2024. Что скажет компилятор?
```rust
fn words<'a>(text: &'a str, stop: &str) -> impl Iterator<Item = &'a str> {
    let stop = stop.to_string();
    text.split(' ').filter(move |w| *w != stop)
}

fn main() {
    let text = String::from("a b c");
    let it = {
        let s = String::from("b");
        words(&text, &s)
    };
    println!("{}", it.count());
}
```'''
options.ru = ["соберётся и напечатает 2", "ошибка: `s` не живёт достаточно долго, потому что `impl Iterator` в 2024 захватил и время жизни `stop`", "ошибка: у замыкания нет `move`", "ошибка: функция не может возвращать `impl Iterator`"]
answer = [1]
explain.ru = """Итератор владеет своей копией `stop`, на входную ссылку он не смотрит. Но в редакции 2024 тип `impl Trait` захватывает все времена жизни входов, значит и анонимное время жизни `stop`. Отсюда и ошибка в `main`: `s` умирает в конце блока, а итератор «помнит» заём `&s`. Лекарство: `+ use<'a>` в типе результата. В редакции 2021 этот код собрался бы."""
hint.ru = """Какие входные времена жизни попадают в тип результата в редакции 2024?"""

