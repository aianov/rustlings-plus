[[exercises]]
name = "ltm1"
style = "fix"
hint.ru = ["""Посмотри, у какой функции на входе нет ссылок вовсе, а у каких две и больше. Откуда компилятору знать, чьё время жизни брать результату?""", """У `greeting` брать не у кого: строка лежит в самой программе, это `'static`. У `pick` и `display_name` результат может прийти из любого из двух входов, поэтому у обоих входов и у результата одно имя `'a`. В методе `&self` тоже придётся написать `&'a self`."""]
why.ru = """Элизия закрывает три простых случая: одна входная ссылка, метод с `&self`, ничего не нужно. Всё остальное компилятор просит назвать, потому что тело функции он при проверке вызовов не читает, только сигнатуру. Общее `'a` на двух входах и результате читается так: «результат не переживёт ни первый, ни второй». У `display_name` без явных имён результат привязался бы к `self`, и вернуть `fallback` было бы нельзя."""

[[exercises]]
name = "ltm_q1"
kind = "question"
question.ru = '''Какая из функций собирается без явных времён жизни?
```rust
// a
fn pick(a: &str, b: &str) -> &str { a }
// b
fn make() -> &str { "x" }
// c
struct S { v: String }
impl S { fn name(&self, other: &str) -> &str { if self.v.is_empty() { other } else { &self.v } } }
// d
fn head(items: &[String]) -> &str { &items[0] }
```'''
options.ru = ["a", "b", "c", "d"]
answer = [3]
explain.ru = """Работает только `d`: на входе одна ссылка, и правило 2 отдаёт её время жизни результату. В `a` два входа и нет `self`, в `b` входов нет вовсе (нужен `'static`). Самая коварная `c`: правило 3 привязывает результат к `self`, поэтому вернуть `other` нельзя («lifetime may not live long enough»). Элизия угадывает по сигнатуре, а не по телу."""
hint.ru = """Для каждой функции пройди три правила пропуска: сколько входных времён жизни и есть ли `&self`?"""

[[exercises]]
name = "ltm2"
style = "todo"
hint.ru = ["""Результат берётся из реестра (или из строки), а не из имени и не из префикса. Как сказать компилятору, что у этих входов «своя» независимая жизнь?""", """Дай имя `'a` ссылке, из которой берётся результат (`registry`, `line`), и ему же результату. Второй вход имени не получает: ему хватит элизии."""]
why.ru = """Имя `'a` ставят ровно на те ссылки, между которыми есть связь «результат из этой». `name` и `prefix` нужны только внутри вызова, поэтому их жизнь ни с чем не связывается. Если бы все три получили одно общее имя, результат пришлось бы считать живущим не дольше короткой строки ввода, и команду нельзя было бы сохранить после неё."""

[[exercises]]
name = "ltm3"
style = "fix"
hint.ru = ["""Прочти тип `&'a mut Vec<&'a str>` медленно: что именно получает имя `'a`? Слова должны жить долго, а заём вектора должен быть коротким.""", """Заём вектора и ссылки внутри него это два разных времени жизни. Внутреннее оставь именованным, а заём вектора пусть будет любым: `seen: &mut Vec<&'a str>`."""]
why.ru = """`&'a mut Vec<&'a str>` говорит: «заём вектора длится столько же, сколько живут слова внутри него». Слова взяты из текста и живут долго, значит вектор оказывается занят чуть ли не навсегда, и второй вызов невозможен. Изменяемая ссылка к тому же инвариантна по содержимому, компилятор не может незаметно сократить `'a`. Разные имена разрывают эту связь."""

[[exercises]]
name = "ltm4"
style = "todo"
hint.ru = ["""Откуда должны вырезаться куски: из `self` или из строки, на которую `self.src` указывает? Копировать ссылку `&'a str` можно сколько угодно.""", """`self.src` имеет тип `&'a str`, срез от него получает `'a`, а не время жизни `&mut self`. Позицию храни в байтах, границы сегментов бери из `find(';')`.""", """В цикле возьми хвост `&self.src[self.pos..]`, найди конец сегмента (`;` или конец строки), сдвинь `pos`, потом `split_once('=')` и `trim`. Если пары нет, переходи к следующему сегменту."""]
why.ru = """Структура держит копируемую ссылку `&'a str`, поэтому куски из неё получаются с полным `'a` и от самого читателя не зависят: его можно выбросить, а пары останутся. Метод берёт `&mut self` только затем, чтобы двигать позицию. Позиция хранится в байтах, а `find` отдаёт границы символов, поэтому кириллица не ломается."""

[[exercises]]
name = "ltm5"
style = "fix"
hint.ru = ["""Что обещает сигнатура `fn get(&self, key: &str) -> Option<&str>` по правилам пропуска? От кого зависит результат? А откуда значение на самом деле?""", """Правило 3 привязывает результат к `&self`. Но значение лежит не в самом `Query`, а в адресе, на который `Query` ссылается. У этого времени жизни уже есть имя: `'a` из `impl<'a> Query<'a>`."""]
why.ru = """Правило 3 для методов делает результат зависимым от заёма `self`, и значение удавалось использовать только пока жив сам `Query`. Но разобранные значения лежат в исходном адресе, поэтому честная сигнатура называет `'a`. Тогда `Query` можно выбросить сразу после чтения, а значения останутся."""

[[exercises]]
name = "ltm6"
style = "scratch"
hint.ru = ["""Итератору по срезу достаточно хранить оставшийся кусок и укорачивать его. Какой метод среза отделяет первый элемент от хвоста?""", """`split_first` даёт `(&'a T, &'a [T])` с временем жизни среза, а не `&mut self`: это то, что нужно для `Item = &'a Track`. Для `next_back` то же через `split_last`. Для `len()` нужно честно написать `size_hint` и пометить тип `ExactSizeIterator`.""", """`impl<'a> IntoIterator for &'a Playlist` с `type IntoIter = TrackIter<'a>` просто зовёт `self.iter()`."""]
why.ru = """Время жизни элемента должно быть `'a`, а не временем заёма `&mut self`: иначе два элемента подряд нельзя держать одновременно. Хранить `&'a [Track]` и отрезать от него кусок как раз это даёт. `ExactSizeIterator` берёт длину из `size_hint`, поэтому подсказка должна быть точной, иначе `len()` паникует на проверке."""

[[exercises]]
name = "ltm7"
style = "fix"
hint.ru = ["""Почему ссылка на запрос и ссылка на текст получили одно имя `'a`? Чему равно это `'a` при вызове?""", """Две ссылки разной жизни это два параметра: `Highlighter<'t, 'q>`, и `spans` возвращает `&'t str`. Для `prefer` результат может быть и `primary`, и `fallback`, значит `primary` должен жить не меньше: `where 'a: 'b`."""]
why.ru = """С одним `'a` на оба поля компилятор выбирает самое короткое из двух, и куски текста оказываются привязаны к жизни запроса. Два параметра развязывают их: куски идут из текста, запрос нужен только для сравнения. В `prefer` ограничение `'a: 'b` разрешает вернуть `primary` под более коротким именем `'b`, потому что долгая ссылка годится там, где нужна короткая."""

[[exercises]]
name = "ltm8"
style = "fix"
hint.ru = ["""Чем отличается `'static` как время жизни ссылки (`&'static str`) от `T: 'static` как условия на тип? Какие значения вообще не содержат коротких ссылок?""", """Названия уровней лежат в самой программе, их тип `&'static str`. В `stash` допиши `+ 'static` к условию на `T`: `Box<dyn Debug>` без оговорки именно так и читается."""]
why.ru = """`&'static str` это ссылка на данные, которые есть всю программу. `T: 'static` это ограничение на тип: ни одной короткой ссылки внутри. Поэтому в журнал годятся `String` и числа, но не `&локальная`. Ящик `Box<dyn Debug>` по умолчанию `'static`, и условие на `T` обязано это гарантировать."""

[[exercises]]
name = "ltm_q9"
kind = "question"
question.ru = '''Для каких значений вызов `need(value)` соберётся, если `fn need<T: 'static>(_: T)`, а строка `s` объявлена в `main` как `let s = String::new();`?'''
options.ru = ["`String::new()`", "`\"lit\"`", "`&s`", "`vec![1, 2, 3]`"]
answer = [0, 1, 3]
explain.ru = """`T: 'static` исключает значения, внутри которых есть короткие ссылки. `String::new()` и `vec![1, 2, 3]` владеют своими данными и ссылок не держат. Литерал это `&'static str`. А `&s` ссылается на локальную переменную: эта ссылка не может быть `'static`. Заметь: «`'static` как условие» не значит, что значение живёт вечно, его можно освободить когда угодно."""
hint.ru = """Найди среди вариантов тот, где в значении сидит ссылка на локальную переменную."""

[[exercises]]
name = "ltm_q2"
kind = "question"
question.ru = '''Что скажет компилятор?
```rust
fn keep<T: std::fmt::Debug + 'static>(v: T) -> Box<dyn std::fmt::Debug> { Box::new(v) }

fn main() {
    let name = String::from("ann");
    let a = keep(name.clone());
    let b = keep(&name);
    let c = keep("lit");
}
```'''
options.ru = ["соберётся", "ошибка только в строке с `a`: String не 'static", "ошибка только в строке с `b`: `&name` ссылается на локальную переменную", "ошибки в строках с `a` и `b`"]
answer = [2]
explain.ru = """`T: 'static` значит «в `T` нет коротких ссылок». `String` владеет данными, ссылок не держит и подходит. Литерал `"lit"` это `&'static str`, тоже подходит. А `&name` это ссылка на локальную переменную, она живёт только до конца `main`, и `'static` не удовлетворяет."""
hint.ru = """Подумай: в каком из трёх аргументов внутри сидит ссылка на что-то, что умрёт раньше программы?"""

[[exercises]]
name = "ltm9"
style = "fix"
hint.ru = ["""Поток может пережить функцию, поэтому `thread::spawn` требует `'static`. Но ты сам дожидаешься всех потоков до выхода из функции. Есть ли способ сказать об этом компилятору?""", """`std::thread::scope`: потоки, запущенные через `scope.spawn`, обязаны закончиться до выхода из `scope`, поэтому им можно заимствовать локальные данные.""", """Внутри `thread::scope(|scope| { .. })` собери дескрипторы `scope.spawn(|| source.load())` в вектор и верни `join()` каждого по порядку."""]
why.ru = """`spawn` не знает, что ты дождёшься потока, и требует `'static`. `scope` даёт гарантию: все потоки внутри будут завершены до выхода, поэтому они могут брать данные по ссылке без клонирования. Здесь клонировать и нечего: `dyn Source` не клонируется, а `Arc` для этого был бы лишним."""

[[exercises]]
name = "ltm10"
style = "todo"
hint.ru = ["""Компилятор видит в `&mut fighters[i]` и `&mut fighters[j]` две изменяемые ссылки на один срез и не знает, что индексы разные. Чем можно честно разделить срез на два непересекающихся?""", """`split_at_mut(mid)` даёт `(&mut левая, &mut правая)`. Если `i < j`, возьми `mid = j`: `i` окажется слева, `j` первым справа. Если `i > j`, наоборот, и порядок аргументов `duel` не меняется.""", """Для чемпиона `split_first_mut` отдаёт `(первый, остальные)`, а в цикле по остальным зови `duel(champion, other)`."""]
why.ru = """Для компилятора `fighters[i]` и `fighters[j]` просто «элемент среза», и доказать, что `i != j`, он не может. `split_at_mut` решает это по построению: две половины физически не пересекаются. Порядок атаки задаёт порядок аргументов `duel`, поэтому ветки `i < j` и `i > j` различаются только тем, какая половина идёт первой."""

[[exercises]]
name = "ltm_q4"
kind = "question"
question.ru = '''Какой фрагмент соберётся?
```rust
struct P { x: Vec<i32>, y: Vec<i32> }
impl P {
    fn x_mut(&mut self) -> &mut Vec<i32> { &mut self.x }
    fn y_mut(&mut self) -> &mut Vec<i32> { &mut self.y }
}
```'''
options.ru = ["`let a = p.x_mut(); let b = p.y_mut(); a.push(1); b.push(2);`", "`let a = &mut p.x; let b = &mut p.y; a.push(1); b.push(2);`", "`let (a, b) = (&mut v[0], &mut v[1]);` для `v: Vec<i32>`", "`let a = &mut v; let b = &mut v; a.push(1); b.push(2);`"]
answer = [1]
explain.ru = """Прямой доступ к полям компилятор различает: `p.x` и `p.y` это разные пути. Метод `x_mut(&mut self)` занимает `p` целиком, и второй вызов тут же конфликтует. Индексы `v[0]` и `v[1]` вычисляются во время работы, компилятор не может доказать, что они разные (для этого есть `split_at_mut`). Две `&mut v` подряд невозможны по определению."""
hint.ru = """Вспомни, что видит компилятор: пути до полей или только сигнатуры методов?"""

[[exercises]]
name = "ltm11"
style = "fix"
hint.ru = ["""Метод `items_mut(&mut self)` заимствует `self` целиком, пока жив его результат. Что в это время нельзя трогать?""", """Внутри самой структуры компилятор различает поля по отдельности (`self.items`, `self.edits`), а вызов метода нет. Обращайся к полю напрямую, а `items_mut` оставь для внешнего кода."""]
why.ru = """Проверка заимствований смотрит на пути к полям, а метод для неё чёрный ящик: сигнатура `&mut self -> &mut Vec` говорит «занято всё». Прямой доступ `self.items` занимает только это поле, и `self.edits` остаётся свободным. Отсюда практическое правило: внутри impl работай с полями, геттеры предназначены для внешнего мира."""

[[exercises]]
name = "ltm_q3"
kind = "question"
question.ru = '''Соберётся ли программа?
```rust
struct Guard<'a>(&'a Vec<i32>);

impl Drop for Guard<'_> {
    fn drop(&mut self) { println!("{}", self.0.len()); }
}

fn main() {
    let mut v = vec![1];
    let g = Guard(&v);
    v.push(2);
}
```'''
options.ru = ["ошибка: у `g` есть `Drop`, и деструктор читает `v` в конце блока, когда `push` уже случился", "соберётся: `g` нигде не читается после создания", "ошибка: нельзя создавать `Guard` из ссылки", "соберётся, но `drop` напечатает 1"]
answer = [0]
explain.ru = """Обычно заём живёт до последнего использования. Но деструктор, написанный вручную, это тоже использование: он вызывается в конце `main` и читает `self.0`. Значит, заём `&v` длится до конца блока, и `v.push` попадает внутрь займа: «cannot borrow `v` as mutable because it is also borrowed as immutable». Без `impl Drop` программа собралась бы."""
hint.ru = """Что происходит с `g` в конце блока и читает ли это что-нибудь из `v`?"""

[[exercises]]
name = "ltm12"
style = "fix"
hint.ru = ["""Ссылка из `get(key)` возвращается из функции в одной ветке, и компилятор считает, что заём длится до конца функции, в том числе в другой ветке. Как сделать, чтобы поиск и вставка не пересекались?""", """Сначала спроси `contains_key` (этот заём заканчивается сразу), при отсутствии загрузи и вставь, а потом одним обращением верни `&self.map[key]`. Есть и вариант с `entry(..).or_insert_with(..)`."""]
why.ru = """Это известный предел NLL: заём, который вернули из функции, считается живущим до её конца, даже на ветке, где его уже нет. Поэтому порядок действий меняют: проверка (короткий заём), вставка, затем единственное обращение за ссылкой. Лезть в `unsafe` для этого не нужно."""

[[exercises]]
name = "ltm13"
style = "scratch"
hint.ru = ["""Нельзя хранить `&str` на собственное поле: при перемещении структуры поле переедет, а ссылка нет. Что можно хранить вместо адреса, чтобы оно не устаревало?""", """Диапазоны байт (`Range<usize>`) в строке. Заведи вектор диапазонов и вырезай `&self.raw[range]` в момент чтения. `match_indices(';')` отдаёт позиции разделителей.""", """Последнее поле заканчивается в `raw.len()`. Для `a;;b` диапазон между двумя `;` пустой, но существует."""]
why.ru = """Позиция байта не зависит от того, где лежит строка, а адрес зависит. Поэтому запись хранит владельца (`String`) и числа, а `&str` получается в момент чтения. Структуру можно спокойно перемещать, класть в вектор и передавать по потокам. Тест проверяет адреса: поля должны быть кусками исходной строки, а не копиями."""

[[exercises]]
name = "ltm_q7"
kind = "question"
question.ru = '''Что скажет компилятор?
```rust
struct Record { raw: String, parts: Vec<std::ops::Range<usize>> }
impl Record {
    fn field(&self, i: usize) -> &str { &self.raw[self.parts[i].clone()] }
}

fn main() {
    let rec = Record { raw: "a;b".into(), parts: vec![0..1, 2..3] };
    let first = rec.field(0);
    let moved = rec;
    println!("{first} {}", moved.raw);
}
```'''
options.ru = ["соберётся и напечатает `a a;b`", "ошибка: диапазоны нельзя хранить в векторе", "ошибка: нельзя переместить `rec`, пока `first` держит заём", "соберётся, но `first` станет висячей ссылкой"]
answer = [2]
explain.ru = """Вот зачем компилятор следит за заёмами: пока `first` ссылается на содержимое `rec`, `rec` нельзя перемещать (E0505). Ровно по этой причине структура не может сама держать ссылку на своё поле: перемещение структуры всегда было бы запрещено. Диапазоны в `parts` таких проблем не создают: они просто числа."""
hint.ru = """Что должен гарантировать компилятор, пока ссылка `first` ещё используется?"""

[[exercises]]
name = "ltm14"
style = "fix"
hint.ru = ["""Где в `Article::new` заимствуется `body`, и что с `body` происходит потом?""", """Хранить ссылку на собственное поле нельзя. Но заголовок это начало тела, ему достаточно знать, где он кончается. Какое одно число описывает такой кусок?""", """Убери параметр времени жизни, храни `title_len: usize`, а `title()` вырезает `&self.body[..self.title_len]`."""]
why.ru = """Конструктор занимал `body` ссылкой на его содержимое и тут же перекладывал `body` в структуру, а при перемещении содержимое могло переехать. Длина заголовка не зависит от адреса: достаточно одного числа. У структуры исчез параметр времени жизни, а значит, ей проще пользоваться снаружи."""

[[exercises]]
name = "ltm15"
