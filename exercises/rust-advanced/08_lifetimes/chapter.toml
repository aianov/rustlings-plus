hint.ru = ["""Нужно два варианта: `Cow::Borrowed`, когда менять нечего, и `Cow::Owned` для остального. Как за один быстрый проход понять, нужно ли что-то менять?""", """Сначала проверка: есть ли в строке обратная косая (для `unescape`) или два пробела подряд (для `squash_spaces`). Если не нашлось, верни `Cow::Borrowed(input)`. Иначе собери `String`.""", """В `unescape` иди по `chars()`: встретил косую, посмотри следующий символ. Неизвестный следующий символ и конец строки оставляют косую на месте."""]
why.ru = """Дешёвая проверка перед работой решает, нужна ли вообще аллокация. `Cow` выражает это в типе: вызывающий читает результат как `&str` и не знает (и не должен знать), копировали ли. Тест проверяет адрес: заимствованный вариант должен указывать на ту же память, что и вход."""

[[exercises]]
name = "ltm_q5"
kind = "question"
question.ru = '''Что напечатает программа?
```rust
use std::borrow::Cow;

fn main() {
    let original = String::from("abc");
    let mut c: Cow<str> = Cow::Borrowed(&original);
    println!("{}", matches!(c, Cow::Borrowed(_)));
    c.to_mut().push('d');
    println!("{} {}", matches!(c, Cow::Borrowed(_)), original);
}
```'''
options.ru = ["true, затем false abcd", "true, затем true abc", "false, затем false abcd", "true, затем false abc"]
answer = [3]
explain.ru = """Сначала `c` заимствует `original`. `to_mut()` при первом вызове клонирует содержимое в новую `String` (вариант становится `Owned`) и отдаёт её для записи. Оригинал не меняется: он остался `abc`. Поэтому второй вывод `false abc`. Копирование происходит один раз, при первой записи."""
hint.ru = """Что делает `to_mut`, если внутри `Borrowed`, и меняется ли тот, у кого заняли?"""

[[exercises]]
name = "ltm16"
style = "fix"
hint.ru = ["""Условие с `'a`, объявленным на функции, фиксирует одно время жизни для всех вызовов `f`, а функция вызывает `f` на ссылке, родившейся внутри.""", """Запиши «для любого времени жизни» как `for<'x> Fn(&'x str) -> &'x str`, `'a` на функции убери. Для `first_where` хватит `P: Fn(&str) -> bool`: запись `Fn(&str)` уже означает «для любой ссылки»."""]
why.ru = """С `'a` на функции время жизни выбирает вызывающий, а мы подаём в `f` ссылку на локальную строку, которая живёт короче любого выбора. `for<'x>` говорит иначе: `f` готова принять ссылку любой длины жизни и вернуть ссылку на тот же участок. В привычном `Fn(&str) -> &str` этот кванторный `for<'x>` подставляется автоматически."""

