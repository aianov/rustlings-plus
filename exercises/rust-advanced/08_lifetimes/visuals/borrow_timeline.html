<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Заём живёт до последнего использования</title>
<style>
:root{--bg:#fafaf7;--fg:#1d1d1b;--mut:#6b6b66;--card:#fff;--line:#c9c7bd;--acc:#c2410c;--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;--warn:#a16207;--warnbg:#fef9c3;--btn:#1d1d1b;--btnfg:#fff;--hot:#fff1e6}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--fg:#ecebe6;--mut:#9a9a92;--card:#201f1d;--line:#46443f;--acc:#fb923c;--ok:#4ade80;--okbg:#14301d;--bad:#f87171;--badbg:#3a1a1a;--warn:#facc15;--warnbg:#3a3312;--btn:#ecebe6;--btnfg:#161614;--hot:#33241a}}
*{box-sizing:border-box}
body{margin:0;padding:20px;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 14px}
.panel{max-width:860px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;min-height:150px}
.row{display:flex;gap:10px;align-items:center;font:13px ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--line);border-radius:8px;padding:7px 10px;margin:6px 0}
.row.ok{border-color:var(--ok);background:var(--okbg)}
.row.no{border-color:var(--bad);background:var(--badbg);text-decoration:line-through;opacity:.75}
.row.hot{border-color:var(--warn);background:var(--warnbg)}
.row .tag{margin-left:auto;font:12px system-ui,sans-serif;color:var(--mut);text-decoration:none}
.box{display:inline-block;font:13px ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--line);border-radius:8px;padding:8px 12px;margin:4px 6px 4px 0;vertical-align:top}
.box.ok{border-color:var(--ok);background:var(--okbg)}
.box.hot{border-color:var(--warn);background:var(--warnbg)}
.box.no{border-color:var(--bad);background:var(--badbg)}
.box small{display:block;color:var(--mut);font:12px system-ui,sans-serif}
.arrow{display:inline-block;margin:0 4px;color:var(--mut);font-size:18px;vertical-align:middle}
.note{margin:12px 0;padding:12px 14px;border-left:4px solid var(--acc);background:var(--card);border-radius:0 8px 8px 0;min-height:76px;max-width:860px}
.bar2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:860px}
button{font:inherit;padding:7px 14px;border-radius:8px;border:0;background:var(--btn);color:var(--btnfg);cursor:pointer}
button.alt{background:transparent;color:var(--fg);border:1px solid var(--line)}
button:disabled{opacity:.4;cursor:default}
.cnt{color:var(--mut);margin-left:auto}
</style>
</head>
<body>
<h1>Заём живёт до последнего использования</h1>
<p class="sub">Отрезки жизни ссылок на шкале строк и место, где они пересекаются.</p>
<div class="panel" id="panel"></div>
<div class="note" id="note"></div>
<div class="bar2">
  <button id="step">Шаг</button>
  <button id="play" class="alt">Играть</button>
  <button id="reset" class="alt">Сначала</button>
  <span class="cnt" id="cnt"></span>
</div>
<script>
const steps=[{"p": "<div style=\"margin-bottom:10px\"><div class=\"row\" style=\"margin:2px 0;padding:3px 10px\"><span style=\"color:var(--mut);width:18px\">1</span><span>let mut v = vec![1, 2, 3];</span></div><div class=\"row\" style=\"margin:2px 0;padding:3px 10px\"><span style=\"color:var(--mut);width:18px\">2</span><span>let first = &v[0];</span></div><div class=\"row\" style=\"margin:2px 0;padding:3px 10px\"><span style=\"color:var(--mut);width:18px\">3</span><span>println!(\"{first}\");</span></div><div class=\"row\" style=\"margin:2px 0;padding:3px 10px\"><span style=\"color:var(--mut);width:18px\">4</span><span>v.push(4);</span></div><div class=\"row\" style=\"margin:2px 0;padding:3px 10px\"><span style=\"color:var(--mut);width:18px\">5</span><span>println!(\"{}\", v.len());</span></div></div><div style=\"display:grid;grid-template-columns:260px repeat(5,1fr);gap:4px;align-items:center;font:13px ui-monospace,Menlo,Consolas,monospace\"><div></div><div style=\"text-align:center;color:var(--mut)\">1</div><div style=\"text-align:center;color:var(--mut)\">2</div><div style=\"text-align:center;color:var(--mut)\">3</div><div style=\"text-align:center;color:var(--mut)\">4</div><div style=\"text-align:center;color:var(--mut)\">5</div><div>v (владелец)</div><div class=\"row ok\" style=\"grid-column:2 / 7;margin:3px 0;padding:5px 8px;font-size:12px\">&nbsp;</div></div>", "n": "Берём простой код. Вектор v живёт с первой строки до конца блока. Это владелец, у него свой отрезок на шкале."}, {"p": "<div style=\"margin-bottom:10px\"><div class=\"row\" style=\"margin:2px 0;padding:3px 10px\"><span style=\"color:var(--mut);width:18px\">1</span><span>let mut v = vec![1, 2, 3];</span></div><div class=\"row hot\" style=\"margin:2px 0;padding:3px 10px\"><span style=\"color:var(--mut);width:18px\">2</span><span>let first = &v[0];</span></div><div class=\"row\" style=\"margin:2px 0;padding:3px 10px\"><span style=\"color:var(--mut);width:18px\">3</span><span>println!(\"{first}\");</span></div><div class=\"row\" style=\"margin:2px 0;padding:3px 10px\"><span style=\"color:var(--mut);width:18px\">4</span><span>v.push(4);</span></div><div class=\"row\" style=\"margin:2px 0;padding:3px 10px\"><span style=\"color:var(--mut);width:18px\">5</span><span>println!(\"{}\", v.len());</span></div></div><div style=\"display:grid;grid-template-columns:260px repeat(5,1fr);gap:4px;align-items:center;font:13px ui-monospace,Menlo,Consolas,monospace\"><div></div><div style=\"text-align:center;color:var(--mut)\">1</div><div style=\"text-align:center;color:var(--mut)\">2</div><div style=\"text-align:center;color:var(--mut)\">3</div><div style=\"text-align:center;color:var(--mut)\">4</div><div style=\"text-align:center;color:var(--mut)\">5</div><div>v (владелец)</div><div class=\"row ok\" style=\"grid-column:2 / 7;margin:3px 0;padding:5px 8px;font-size:12px\">&nbsp;</div><div>first = &v[0] (заём)</div><div class=\"row hot\" style=\"grid-column:3 / 4;margin:3px 0;padding:5px 8px;font-size:12px\">&nbsp;</div></div>", "n": "Строка 2: взяли ссылку first. С этого момента на шкале появляется отрезок займа. Пока он действует, v нельзя менять."}, {"p": "<div style=\"margin-bottom:10px\"><div class=\"row\" style=\"margin:2px 0;padding:3px 10px\"><span style=\"color:var(--mut);width:18px\">1</span><span>let mut v = vec![1, 2, 3];</span></div><div class=\"row\" style=\"margin:2px 0;padding:3px 10px\"><span style=\"color:var(--mut);width:18px\">2</span><span>let first = &v[0];</span></div><div class=\"row hot\" style=\"margin:2px 0;padding:3px 10px\"><span style=\"color:var(--mut);width:18px\">3</span><span>println!(\"{first}\");</span></div><div class=\"row\" style=\"margin:2px 0;padding:3px 10px\"><span style=\"color:var(--mut);width:18px\">4</span><span>v.push(4);</span></div><div class=\"row\" style=\"margin:2px 0;padding:3px 10px\"><span style=\"color:var(--mut);width:18px\">5</span><span>println!(\"{}\", v.len());</span></div></div><div style=\"display:grid;grid-template-columns:260px repeat(5,1fr);gap:4px;align-items:center;font:13px ui-monospace,Menlo,Consolas,monospace\"><div></div><div style=\"text-align:center;color:var(--mut)\">1</div><div style=\"text-align:center;color:var(--mut)\">2</div><div style=\"text-align:center;color:var(--mut)\">3</div><div style=\"text-align:center;color:var(--mut)\">4</div><div style=\"text-align:center;color:var(--mut)\">5</div><div>v (владелец)</div><div class=\"row ok\" style=\"grid-column:2 / 7;margin:3px 0;padding:5px 8px;font-size:12px\">&nbsp;</div><div>first = &v[0] (заём)</div><div class=\"row hot\" style=\"grid-column:3 / 5;margin:3px 0;padding:5px 8px;font-size:12px\">&nbsp;</div></div>", "n": "Строка 3: последнее использование first. Заём заканчивается здесь, а не в конце блока. Так работает NLL: отрезок кончается там, где ссылку больше не читают."}, {"p": "<div style=\"margin-bottom:10px\"><div class=\"row\" style=\"margin:2px 0;padding:3px 10px\"><span style=\"color:var(--mut);width:18px\">1</span><span>let mut v = vec![1, 2, 3];</span></div><div class=\"row\" style=\"margin:2px 0;padding:3px 10px\"><span style=\"color:var(--mut);width:18px\">2</span><span>let first = &v[0];</span></div><div class=\"row\" style=\"margin:2px 0;padding:3px 10px\"><span style=\"color:var(--mut);width:18px\">3</span><span>println!(\"{first}\");</span></div><div class=\"row hot\" style=\"margin:2px 0;padding:3px 10px\"><span style=\"color:var(--mut);width:18px\">4</span><span>v.push(4);</span></div><div class=\"row\" style=\"margin:2px 0;padding:3px 10px\"><span style=\"color:var(--mut);width:18px\">5</span><span>println!(\"{}\", v.len());</span></div></div><div style=\"display:grid;grid-template-columns:260px repeat(5,1fr);gap:4px;align-items:center;font:13px ui-monospace,Menlo,Consolas,monospace\"><div></div><div style=\"text-align:center;color:var(--mut)\">1</div><div style=\"text-align:center;color:var(--mut)\">2</div><div style=\"text-align:center;color:var(--mut)\">3</div><div style=\"text-align:center;color:var(--mut)\">4</div><div style=\"text-align:center;color:var(--mut)\">5</div><div>v (владелец)</div><div class=\"row ok\" style=\"grid-column:2 / 7;margin:3px 0;padding:5px 8px;font-size:12px\">&nbsp;</div><div>first = &v[0] (заём)</div><div class=\"row ok\" style=\"grid-column:3 / 5;margin:3px 0;padding:5px 8px;font-size:12px\">&nbsp;</div><div>v.push(4) (запись)</div><div class=\"row hot\" style=\"grid-column:5 / 6;margin:3px 0;padding:5px 8px;font-size:12px\">&nbsp;</div></div>", "n": "Строка 4: v.push требует изменяемого доступа. Отрезок займа к этому моменту закончился, пересечения нет. Собирается."}, {"p": "<div style=\"margin-bottom:10px\"><div class=\"row\" style=\"margin:2px 0;padding:3px 10px\"><span style=\"color:var(--mut);width:18px\">1</span><span>let mut v = vec![1, 2, 3];</span></div><div class=\"row\" style=\"margin:2px 0;padding:3px 10px\"><span style=\"color:var(--mut);width:18px\">2</span><span>let first = &v[0];</span></div><div class=\"row\" style=\"margin:2px 0;padding:3px 10px\"><span style=\"color:var(--mut);width:18px\">3</span><span>println!(\"{first}\");</span></div><div class=\"row\" style=\"margin:2px 0;padding:3px 10px\"><span style=\"color:var(--mut);width:18px\">4</span><span>v.push(4);</span></div><div class=\"row hot\" style=\"margin:2px 0;padding:3px 10px\"><span style=\"color:var(--mut);width:18px\">5</span><span>println!(\"{first}\");</span></div></div><div style=\"display:grid;grid-template-columns:260px repeat(5,1fr);gap:4px;align-items:center;font:13px ui-monospace,Menlo,Consolas,monospace\"><div></div><div style=\"text-align:center;color:var(--mut)\">1</div><div style=\"text-align:center;color:var(--mut)\">2</div><div style=\"text-align:center;color:var(--mut)\">3</div><div style=\"text-align:center;color:var(--mut)\">4</div><div style=\"text-align:center;color:var(--mut)\">5</div><div>v (владелец)</div><div class=\"row ok\" style=\"grid-column:2 / 7;margin:3px 0;padding:5px 8px;font-size:12px\">&nbsp;</div><div>first = &v[0] (заём)</div><div class=\"row hot\" style=\"grid-column:3 / 7;margin:3px 0;padding:5px 8px;font-size:12px\">&nbsp;</div><div>v.push(4) (запись)</div><div class=\"row hot\" style=\"grid-column:5 / 6;margin:3px 0;padding:5px 8px;font-size:12px\">&nbsp;</div></div>", "n": "Теперь добавим в конец ещё одно чтение first. Заём first продлевается до строки 5: ссылка нужна и после push."}, {"p": "<div style=\"margin-bottom:10px\"><div class=\"row\" style=\"margin:2px 0;padding:3px 10px\"><span style=\"color:var(--mut);width:18px\">1</span><span>let mut v = vec![1, 2, 3];</span></div><div class=\"row\" style=\"margin:2px 0;padding:3px 10px\"><span style=\"color:var(--mut);width:18px\">2</span><span>let first = &v[0];</span></div><div class=\"row\" style=\"margin:2px 0;padding:3px 10px\"><span style=\"color:var(--mut);width:18px\">3</span><span>println!(\"{first}\");</span></div><div class=\"row no\" style=\"margin:2px 0;padding:3px 10px\"><span style=\"color:var(--mut);width:18px\">4</span><span>v.push(4);</span></div><div class=\"row no\" style=\"margin:2px 0;padding:3px 10px\"><span style=\"color:var(--mut);width:18px\">5</span><span>println!(\"{first}\");</span></div></div><div style=\"display:grid;grid-template-columns:260px repeat(5,1fr);gap:4px;align-items:center;font:13px ui-monospace,Menlo,Consolas,monospace\"><div></div><div style=\"text-align:center;color:var(--mut)\">1</div><div style=\"text-align:center;color:var(--mut)\">2</div><div style=\"text-align:center;color:var(--mut)\">3</div><div style=\"text-align:center;color:var(--mut)\">4</div><div style=\"text-align:center;color:var(--mut)\">5</div><div>v (владелец)</div><div class=\"row ok\" style=\"grid-column:2 / 7;margin:3px 0;padding:5px 8px;font-size:12px\">&nbsp;</div><div>first = &v[0] (заём)</div><div class=\"row no\" style=\"grid-column:3 / 7;margin:3px 0;padding:5px 8px;font-size:12px\">&nbsp;</div><div>v.push(4) (запись)</div><div class=\"row no\" style=\"grid-column:5 / 6;margin:3px 0;padding:5px 8px;font-size:12px\">&nbsp;</div></div>", "n": "Пересечение: на строке 4 заём ещё жив, а push хочет писать. Ошибка E0502. И это настоящая защита: push мог перевыделить память, и first указывал бы в пустоту."}, {"p": "<div style=\"margin-bottom:10px\"><div class=\"row\" style=\"margin:2px 0;padding:3px 10px\"><span style=\"color:var(--mut);width:18px\">1</span><span>let mut v = vec![1];</span></div><div class=\"row\" style=\"margin:2px 0;padding:3px 10px\"><span style=\"color:var(--mut);width:18px\">2</span><span>let g = Guard(&v);</span></div><div class=\"row\" style=\"margin:2px 0;padding:3px 10px\"><span style=\"color:var(--mut);width:18px\">3</span><span>v.push(2);</span></div><div class=\"row hot\" style=\"margin:2px 0;padding:3px 10px\"><span style=\"color:var(--mut);width:18px\">4</span><span>// конец блока: вызывается drop(g)</span></div></div><div style=\"display:grid;grid-template-columns:260px repeat(4,1fr);gap:4px;align-items:center;font:13px ui-monospace,Menlo,Consolas,monospace\"><div></div><div style=\"text-align:center;color:var(--mut)\">1</div><div style=\"text-align:center;color:var(--mut)\">2</div><div style=\"text-align:center;color:var(--mut)\">3</div><div style=\"text-align:center;color:var(--mut)\">4</div><div>v (владелец)</div><div class=\"row ok\" style=\"grid-column:2 / 6;margin:3px 0;padding:5px 8px;font-size:12px\">&nbsp;</div><div>g = Guard(&v) (заём)</div><div class=\"row no\" style=\"grid-column:3 / 6;margin:3px 0;padding:5px 8px;font-size:12px\">&nbsp;</div><div>v.push(2) (запись)</div><div class=\"row no\" style=\"grid-column:4 / 5;margin:3px 0;padding:5px 8px;font-size:12px\">&nbsp;</div></div>", "n": "Есть и исключение. Если у типа Guard есть Drop, то его деструктор использует ссылку в конце блока. Тогда заём тянется до последней скобки, и push на строке 3 попадает внутрь займа, хотя g нигде явно не читают."}];
let i=0,timer=null;
function stop(){if(timer){clearInterval(timer);timer=null;}document.getElementById('play').textContent='Играть';}
function frame(){document.getElementById('panel').innerHTML=steps[i].p;document.getElementById('note').textContent=steps[i].n;document.getElementById('cnt').textContent='шаг '+(i+1)+' из '+steps.length;document.getElementById('step').disabled=i>=steps.length-1;if(i>=steps.length-1)stop();}
document.getElementById('step').onclick=()=>{if(i<steps.length-1){i++;frame();}};
document.getElementById('reset').onclick=()=>{stop();i=0;frame();};
document.getElementById('play').onclick=()=>{if(timer){stop();return;}if(i>=steps.length-1){i=0;frame();}document.getElementById('play').textContent='Пауза';timer=setInterval(()=>{if(i<steps.length-1){i++;frame();}else stop();},3000);};
frame();
</script>
</body>
</html>
