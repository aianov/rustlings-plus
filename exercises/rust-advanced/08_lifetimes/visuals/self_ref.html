<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Почему структура не может ссылаться на себя</title>
<style>
:root{--bg:#fafaf7;--fg:#1d1d1b;--mut:#6b6b66;--card:#fff;--line:#c9c7bd;--acc:#c2410c;--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;--warn:#a16207;--warnbg:#fef9c3;--btn:#1d1d1b;--btnfg:#fff;--hot:#fff1e6}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--fg:#ecebe6;--mut:#9a9a92;--card:#201f1d;--line:#46443f;--acc:#fb923c;--ok:#4ade80;--okbg:#14301d;--bad:#f87171;--badbg:#3a1a1a;--warn:#facc15;--warnbg:#3a3312;--btn:#ecebe6;--btnfg:#161614;--hot:#33241a}}
*{box-sizing:border-box}
body{margin:0;padding:20px;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 14px}
.panel{max-width:860px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;min-height:150px}
.row{display:flex;gap:10px;align-items:center;font:13px ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--line);border-radius:8px;padding:7px 10px;margin:6px 0}
.row.ok{border-color:var(--ok);background:var(--okbg)}
.row.no{border-color:var(--bad);background:var(--badbg);text-decoration:line-through;opacity:.75}
.row.hot{border-color:var(--warn);background:var(--warnbg)}
.row .tag{margin-left:auto;font:12px system-ui,sans-serif;color:var(--mut);text-decoration:none}
.box{display:inline-block;font:13px ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--line);border-radius:8px;padding:8px 12px;margin:4px 6px 4px 0;vertical-align:top}
.box.ok{border-color:var(--ok);background:var(--okbg)}
.box.hot{border-color:var(--warn);background:var(--warnbg)}
.box.no{border-color:var(--bad);background:var(--badbg)}
.box small{display:block;color:var(--mut);font:12px system-ui,sans-serif}
.arrow{display:inline-block;margin:0 4px;color:var(--mut);font-size:18px;vertical-align:middle}
.note{margin:12px 0;padding:12px 14px;border-left:4px solid var(--acc);background:var(--card);border-radius:0 8px 8px 0;min-height:76px;max-width:860px}
.bar2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:860px}
button{font:inherit;padding:7px 14px;border-radius:8px;border:0;background:var(--btn);color:var(--btnfg);cursor:pointer}
button.alt{background:transparent;color:var(--fg);border:1px solid var(--line)}
button:disabled{opacity:.4;cursor:default}
.cnt{color:var(--mut);margin-left:auto}
</style>
</head>
<body>
<h1>Почему структура не может ссылаться на себя</h1>
<p class="sub">Перемещение и перевыделение ломают ссылку на собственное поле; позиции переживают оба.</p>
<div class="panel" id="panel"></div>
<div class="note" id="note"></div>
<div class="bar2">
  <button id="step">Шаг</button>
  <button id="play" class="alt">Играть</button>
  <button id="reset" class="alt">Сначала</button>
  <span class="cnt" id="cnt"></span>
</div>
<script>
const steps=[{"p": "<div><b>Стек, кадр функции make()</b></div><span class=\"box ok\">data: [h,e,y,!]<small>адрес 0x100..0x104</small></span><span class=\"box hot\">ptr: &[u8]<small>= 0x100 (на data)</small></span><div style=\"margin-top:8px;color:var(--mut)\">struct S { data: [u8; 4], ptr: &[u8] }</div>", "n": "Структура на стеке: внутри лежит массив и ссылка на него же. Пока структура стоит на месте, ptr указывает верно: адрес 0x100 и есть data."}, {"p": "<div><b>Стек, кадр make()</b> (возвращаем S)</div><span class=\"box ok\">data<small>0x100</small></span><span class=\"box hot\">ptr<small>= 0x100</small></span><div style=\"margin:8px 0\">&darr; значение перемещается в кадр вызывающего</div><div><b>Стек, кадр main()</b></div><span class=\"box ok\">data: [h,e,y,!]<small>новый адрес 0x300</small></span><span class=\"box no\">ptr<small>всё ещё 0x100</small></span>", "n": "Возврат из функции или push в вектор перемещает структуру: байты копируются на новое место. Копия ptr сохранила старое число 0x100."}, {"p": "<div><b>Стек, кадр main()</b></div><span class=\"box ok\">data<small>0x300</small></span><span class=\"box no\">ptr<small>0x100</small></span><div style=\"margin:8px 0\"><b>Старый кадр make() освобождён</b>: по адресу 0x100 теперь чужие данные.</div>", "n": "Висячая ссылка: ptr смотрит на память, которой структура больше не владеет. Компилятор не знает заранее, когда структура переедет, поэтому запрещает такую структуру целиком."}, {"p": "<div><b>Куча</b></div><span class=\"box ok\">\"Hello\"<small>буфер на 0x900, len 5, cap 5</small></span><div style=\"margin:8px 0\"><b>Структура</b></div><span class=\"box ok\">text: String<small>ptr 0x900</small></span><span class=\"box hot\">title: &str<small>= 0x900..0x905</small></span><div style=\"margin-top:8px;color:var(--mut)\">у String текст лежит в куче, структура может переехать без последствий</div>", "n": "Вариант со String: текст в куче, при перемещении структуры буфер остаётся на месте, и ссылка на него остаётся верной. Кажется, можно."}, {"p": "<div><b>Куча после text.push_str(\" world\")</b></div><span class=\"box no\">\"Hello\"<small>старый буфер 0x900: освобождён</small></span><span class=\"box ok\">\"Hello world\"<small>новый буфер на 0xA00</small></span><div style=\"margin:8px 0\"><b>Структура</b></div><span class=\"box ok\">text: String<small>ptr 0xA00</small></span><span class=\"box no\">title: &str<small>всё ещё 0x900..0x905</small></span>", "n": "Но стоит дописать в строку, как буфер перевыделяется на другой адрес. Ссылка title остаётся на старом. Любая изменяемая операция над text ломает title, поэтому компилятор не даёт хранить их вместе."}, {"p": "<div><b>Решение: храним позиции, а не адреса</b></div><span class=\"box ok\">text: String<small>ptr 0xA00 (куда угодно переедет)</small></span><span class=\"box ok\">title_end: usize<small>5</small></span><div style=\"margin:8px 0\">title() = &text[..title_end]</div><span class=\"box ok\">при каждом чтении<small>база берётся из text сейчас</small></span><span class=\"box ok\">после перемещения<small>работает</small></span><span class=\"box ok\">после push<small>работает</small></span>", "n": "Число 5 не зависит от адресов. Адрес вычисляется заново при каждом чтении из текущего положения строки. Так и устроены Record из ltm13 и Article из ltm14: диапазон байт плюс владелец."}];
let i=0,timer=null;
function stop(){if(timer){clearInterval(timer);timer=null;}document.getElementById('play').textContent='Играть';}
function frame(){document.getElementById('panel').innerHTML=steps[i].p;document.getElementById('note').textContent=steps[i].n;document.getElementById('cnt').textContent='шаг '+(i+1)+' из '+steps.length;document.getElementById('step').disabled=i>=steps.length-1;if(i>=steps.length-1)stop();}
document.getElementById('step').onclick=()=>{if(i<steps.length-1){i++;frame();}};
document.getElementById('reset').onclick=()=>{stop();i=0;frame();};
document.getElementById('play').onclick=()=>{if(timer){stop();return;}if(i>=steps.length-1){i=0;frame();}document.getElementById('play').textContent='Пауза';timer=setInterval(()=>{if(i<steps.length-1){i++;frame();}else stop();},3000);};
frame();
</script>
</body>
</html>
