[chapter]
title.ru = "Замыкания"

[[chapter.visuals]]
file = "visuals/closure_capture.html"
title.ru = "Что замыкание забирает из окружения: &, &mut или значение"

[[chapter.visuals]]
file = "visuals/fn_traits.html"
title.ru = "FnOnce, FnMut, Fn: вложенность и кто что принимает"

[[exercises]]
name = "clos1"
style = "fix"
hint.ru = """Компилятор пишет, что типы замыканий различаются, хотя тела похожи. У каждого замыкания свой тип. Чтобы положить разные в один `Vec`, нужно сделать их одним типом: трейт-объектом в `Box`."""
why.ru = """Три замыкания имеют три разных безымянных типа, и общего у них только то, что все вызываются как `Fn(i32) -> i32`. `Box<dyn Fn(i32) -> i32>` стирает различие: в векторе лежат указатели одинакового размера, а вызов идёт через таблицу методов. Захваченное смещение живёт внутри своего ящика, поэтому два конвейера с разными смещениями друг на друга не влияют."""

[[exercises]]
name = "clos2"
style = "todo"
hint.ru = ["""Итог накапливается в одном поле, а имена читаются из другого. Что будет, если замыкание захватит всю структуру целиком? Пиши в замыкании `stats.total`, а не вызывай методы `stats`.""", """Первым аргументом `pair_up` передай `&stats.names`, последним замыкание, которое меняет `stats.total` и собирает строку. Раздельный захват полей это то, что позволяет им не мешать друг другу."""]
why.ru = """С edition 2021 замыкание захватывает не переменную, а то поле, которое реально используется. Поэтому `stats.total` занято замыканием по `&mut`, а `stats.names` в это время можно читать. Вызов метода вроде `stats.add(n)` захватил бы `stats` целиком, и разделение полей пропало бы. `zip` останавливается на более короткой стороне, так что лишние имена и суммы не учитываются."""

[[exercises]]
name = "clos_q1"
kind = "question"
question.ru = '''Что напечатает программа?
```rust
let mut n = 1;
let mut inc = move || { n += 1; n };
println!("{} {}", inc(), inc());
println!("{n}");
```'''
options.ru = ["2 3, потом 3", "2 3, потом 1", "2 3, потом 2", "не скомпилируется: n перемещена в замыкание"]
answer = [1]
explain.ru = """`move` для `Copy`-типа копирует значение внутрь замыкания. Замыкание меняет свою копию (2, потом 3), а внешняя `n` остаётся единицей и остаётся доступной: перемещения не было, было копирование. С `String` тот же `move` действительно забрал бы переменную."""
hint.ru = """Что происходит с `i32`, когда его «перемещают»?"""

[[exercises]]
name = "clos3"
style = "fix"
hint.ru = """Ошибка говорит, что `count` занят замыканием, которое используется позже. Кому на самом деле нужно это замыкание? Что изменится, если сделать то же самое прямо в цикле?"""
why.ru = """Замыкание, которое изменяет `count`, держит его по `&mut`, пока им можно пользоваться, то есть до последнего вызова в цикле. Читать `count` в это время нельзя, и компилятор прав: иначе значение могло бы измениться за спиной читателя. Замыкание здесь вообще лишнее: оно использовалось в одном месте. Иногда простое лечение это отказ от замыкания, иногда `Cell`, иногда сокращение срока жизни замыкания."""

[[exercises]]
name = "clos4"
style = "fix"
hint.ru = ["""Для каждой функции спроси: сколько раз она зовёт замыкание и как? Один раз, много раз подряд, много раз через общую ссылку.""", """`repeat` зовёт много раз подряд и владеет замыканием: хватит `FnMut` (и `f` должен быть `mut`). `once` зовёт один раз: `FnOnce`. Для `probe` не торопись: вызвать `FnMut` через `&F` нельзя."""]
why.ru = """Чем слабее трейт в границе, тем шире круг подходящих замыканий: `FnOnce` принимает всё, `FnMut` не принимает отдающие данные, `Fn` только читающие. `repeat` меняет состояние замыкания между вызовами, значит, ему нужно `mut f` и `FnMut`. `probe` получает только `&F`, а изменять через общую ссылку нельзя, поэтому `Fn` здесь честный минимум, и счётчики приходится делать на `Cell`."""

[[exercises]]
name = "clos_q2"
kind = "question"
question.ru = '''Что случится при сборке?
```rust
let report = String::from("done");
let finish = || drop(report);
finish();
finish();
```'''
options.ru = ["соберётся, drop вызовется дважды", "ошибка: finish вызвана после перемещения, замыкание можно вызвать только один раз", "ошибка: report нельзя передавать в drop", "соберётся, второй вызов ничего не сделает"]
answer = [1]
explain.ru = """Тело замыкания отдаёт `report` в `drop`, то есть уничтожает захваченное значение. Такое замыкание только `FnOnce`: вызов забирает его самого (`finish` перемещается в вызов). Второй вызов использует уже перемещённое значение, отсюда `use of moved value: finish`."""
hint.ru = """Что остаётся внутри замыкания после первого вызова?"""

[[exercises]]
name = "clos5"
style = "fix"
hint.ru = ["""У `retry` и у `Defer` ошибки разные. Для `retry` посмотри, что делает вызывающий в тесте с переменной. Для `Defer` посмотри, что происходит с `action` после вызова.""", """`retry` зовёт замыкание много раз подряд, значит, `FnMut`. В `Defer` действие можно вызвать один раз, а метод зовут повторно: храни его в `Option` и забирай через `take()`.""", """Деструктору можно просто позвать `self.run_now()`: если действие уже забрали, он ничего не сделает."""]
why.ru = """Слабейший подходящий трейт для `retry` это `FnMut`: операция вызывается много раз по очереди, и ей разрешено менять своё состояние. `FnOnce` нельзя вызвать из поля структуры, потому что вызов забирает значение, а из `&mut self` забирать нечего. `Option<F>` с `take()` решает это: при втором вызове в поле лежит `None`. Деструктор вызывает ту же `run_now`, поэтому «ровно один раз» гарантировано независимо от порядка."""

[[exercises]]
name = "clos_q3"
kind = "question"
question.ru = '''Функция объявлена как `fn run<F: Fn()>(f: F)`. Какие замыкания можно ей передать?
```rust
let mut visits = 0;
let a = || println!("hi");
let b = || visits += 1;
let s = String::from("x");
let c = move || drop(s);
```'''
options.ru = ["только a", "a и b", "a, b и c", "ни одно"]
answer = [0]
explain.ru = """`Fn` умеет только читать захваченное. `b` меняет `visits`, значит, `FnMut`; `c` отдаёт строку, значит, `FnOnce`. Подойдёт только `a`. Если бы функция вызывала замыкание один раз, ей хватило бы `FnOnce`, и подошли бы все три."""
hint.ru = """Что каждое из трёх замыканий делает с захваченным?"""

[[exercises]]
name = "clos6"
style = "todo"
hint.ru = ["""Поток может прожить дольше функции, поэтому замыкание не должно ссылаться на её переменные. Всё, что нужно, оно забирает с собой: ключевое слово `move`. А общий журнал нужен каждому потоку, значит, каждому свой клон `Arc`.""", """Клон делай до `move`, в теле `map`: `let log = Arc::clone(&log);`. Тогда в замыкание уезжает свой клон, а оригинал остаётся владельцу. После завершения потоков клоны уничтожаются, и счётчик ссылок возвращается к единице."""]
why.ru = """`thread::spawn` требует `'static`: замыкание не имеет права держать ссылки на локальные данные. `move` выносит владение внутрь, а клонирование `Arc` перед ним даёт каждому потоку свой счётчик ссылок на общий журнал. Клон внутри замыкания не поможет: сначала нужно пронести исходный `Arc` в замыкание, а значит, он перестанет быть доступен для следующих итераций. Проверка `strong_count == 1` ловит забытые клоны."""

[[exercises]]
name = "clos_q4"
kind = "question"
question.ru = '''Что случится при сборке?
```rust
let words = vec!["a", "b"];
let t = std::thread::spawn(|| println!("{:?}", words));
t.join().unwrap();
```'''
options.ru = ["напечатает [\"a\", \"b\"]", "ошибка: замыкание может пережить words, нужен move", "ошибка: Vec нельзя печатать из потока", "соберётся, но упадёт при join"]
answer = [1]
explain.ru = """Без `move` замыкание берёт `words` по ссылке, а `thread::spawn` требует `'static`: поток может жить после выхода из функции, и ссылка оказалась бы висячей. Компилятор предлагает добавить `move`, тогда вектор уезжает в поток. То, что здесь мы сразу делаем `join`, компилятору неизвестно, он смотрит на сигнатуру."""
hint.ru = """Откуда компилятор знает, что поток закончится до выхода из функции?"""

[[exercises]]
name = "clos7"
style = "fix"
hint.ru = ["""Ошибка про «предыдущую итерацию цикла»: сколько раз `move` забирает `prefix`, если в цикле три прохода?""", """Каждому замыканию нужен свой экземпляр префикса: сделай копию внутри цикла перед замыканием. Или заверни префикс в `Rc<str>` и клонируй указатель."""]
why.ru = """`move` внутри цикла забирает переменную из внешней области, и со второй итерации её уже нет. Лечится копированием внутри цикла: либо `prefix.clone()` (каждому своя строка), либо один `Rc<str>` с клонированием указателя (одна строка, много владельцев). Выбор зависит от размера данных и от того, нужна ли `Send`: `Rc` её не даёт."""

[[exercises]]
name = "clos8"
style = "todo"
hint.ru = ["""Таблица указателей на функции принимает обычные функции и замыкания без захвата. Команде с префиксом нужны данные, и в таблицу `fn` она не попадёт: для расширенной таблицы нужен другой тип элемента.""", """В `with_prefix` оберни каждую встроенную команду в `Box::new(command)`: указатель на функцию реализует `Fn` и годится как `Box<dyn Fn(&str) -> String>`. Команда `tag` это `move |s| format!(...)`."""]
why.ru = """Указатель на функцию это одно слово, без данных, поэтому в него влезают функции и незахватывающие замыкания, и таблица обходится без выделения памяти. Захватывающее замыкание это функция плюс данные, и ему нужен `Box<dyn Fn>`. Указатель на функцию сам реализует `Fn`, так что в общей таблице он уживается с захватывающими. Реверс по `chars()`, а не по байтам: байтовый реверс ломает кириллицу."""

[[exercises]]
name = "clos9"
style = "todo"
hint.ru = ["""Для `Button::new` прочитай ошибку про время жизни: что компилятор не может доказать про замыкание внутри `Box<dyn Fn>` в поле структуры?""", """Тип `Box<dyn Fn(..)>` в поле по умолчанию значит `Box<dyn Fn(..) + 'static>`. Значит, и принимаемое замыкание должно быть `'static`: допиши эту границу в сигнатуру `new`."""]
why.ru = """Три способа принять замыкание решают разные задачи. `impl Fn` генерирует код под конкретный тип и годится, когда замыкание нужно на время вызова. `&dyn Fn` позволяет собрать в один срез замыкания разных типов. Для поля структуры нужен `Box<dyn Fn>`, и из-за `'static` по умолчанию конструктор обязан требовать то же самое: без этого можно было бы спрятать в кнопку ссылку на локальную переменную и пережить её."""

[[exercises]]
name = "clos10"
style = "fix"
hint.ru = ["""`multiplier`: на что ссылается замыкание и что случится с этим после возврата? `chooser`: сколько разных типов может скрываться за `impl Fn`?""", """Первой нужен `move`, второй `Box<dyn Fn>` в возвращаемом типе: у веток разные типы замыканий, а `impl Fn` разрешает ровно один. Для `counter_from` состояние переносится в замыкание через `move`."""]
why.ru = """`impl Fn` значит один конкретный тип, поэтому `if` с двумя разными замыканиями не собирается: нужен `Box<dyn Fn>`, где разные ветки сводятся к одному типу ценой выделения в куче. Без `move` замыкание ссылалось бы на параметр `factor`, который умирает при возврате. Состояние счётчика живёт в замыкании: поэтому оно `FnMut`, а вызывающий хранит его в `let mut`."""

[[exercises]]
name = "clos11"
style = "scratch"
hint.ru = ["""`compose` возвращает замыкание, которое зовёт `f`, а результат передаёт в `g`; обе функции должны переехать внутрь. `memoize` возвращает `FnMut`: у него есть изменяемая таблица.""", """Таблица `HashMap<u64, u64>` создаётся до замыкания и уезжает в него через `move`. Внутри ищем ключ: нашли, возвращаем; не нашли, считаем, запоминаем и возвращаем."""]
why.ru = """Обе функции возвращают замыкания, которые владеют своими данными через `move`: `compose` держит `f` и `g`, `memoize` держит `f` и таблицу. Из-за таблицы результат `memoize` это `FnMut`, а не `Fn`: вызов меняет кэш. Тест считает вызовы исходной функции, поэтому «запоминание, которое ничего не запоминает» или пересчёт на каждый вызов проваливаются."""

[[exercises]]
name = "clos12"
style = "todo"
hint.ru = """Значение в таблице: `Box<dyn Fn(&str) -> String>`. `HashMap::insert` возвращает прежнее значение, если ключ был: из этого легко получить ответ для `add`. Имена собери из ключей и отсортируй."""
why.ru = """Таблица обработчиков это самая частая причина хранить замыкания: `HashMap<String, Box<dyn Fn(..)>>`. Обработчики могут быть любыми (функции, замыкания с состоянием), `Box` стирает различия, а `'static` в `add` гарантирует, что никто не сунет туда ссылку на локальную переменную. `insert` бесплатно сообщает о замене. Имена сортируются, чтобы вывод не зависел от случайного порядка хеш-таблицы."""

[[exercises]]
name = "clos13"
style = "todo"
hint.ru = ["""Поток может пережить создателя, и работает рядом с другими потоками. Какие границы это накладывает на тип обработчика? Посмотри, на что жалуется компилятор в `run_all`.""", """К `Fn(u32) -> u32` дописываются три границы, и `add` обязан требовать те же. Поток не может занять `&self`: ему нужен собственный клон `Arc<Registry>` (получатель `self: &Arc<Self>` разобран в README) и номер обработчика.""", """Сначала запусти все потоки (сохрани `JoinHandle` в вектор), и только потом дожидайся каждого. Если `join` стоит внутри того же цикла, потоки пойдут по очереди и тест с барьером сорвётся."""]
why.ru = """Каждая граница отвечает за своё: `Send`, чтобы значение можно было отдать другому потоку, `Sync`, чтобы на него можно было смотреть из нескольких потоков сразу (реестр в `Arc` читают параллельно), `'static`, чтобы поток не держал ссылку на чужие локальные данные. Параллельность проверяет барьер: три обработчика ждут друг друга, и если запуск и ожидание перемежаются, тест зависает и срабатывает таймаут. Результаты возвращаются в порядке регистрации, потому что `join` вызывают по порядку."""

[[exercises]]
name = "clos_q5"
kind = "question"
question.ru = '''Какие замыкания можно положить в `Box<dyn Fn() + Send + Sync + 'static>`?'''
options.ru = ["move-замыкание, владеющее Arc<Mutex<u32>>", "move-замыкание, владеющее Rc<u32>", "замыкание, которое берёт по ссылке локальную переменную x", "move-замыкание, владеющее Cell<u32>, которое меняет её через set"]
answer = [0]
explain.ru = """`Arc<Mutex<u32>>` и `Send`, и `Sync`: подходит. `Rc` не `Send`. Ссылка на локальную переменную не `'static`. Самый тонкий случай `Cell<u32>`: само значение можно отправить в другой поток (`Send`), но делиться им нельзя (`Sync` нет), а замыкание `Sync`, только если `Sync` всё, что оно захватило. Для общего изменяемого состояния нужны `Mutex` или атомики."""
hint.ru = """Замыкание `Send`/`Sync`, когда всё захваченное тоже `Send`/`Sync`. Проверь каждый вариант."""

[[exercises]]
name = "clos14"
style = "fix"
hint.ru = ["""Что в `Rc<RefCell<u32>>` не позволяет отправить его в другой поток? Для каждого из двух типов в std::sync есть потокобезопасный аналог.""", """`Rc` заменяется на `Arc`, `RefCell` на `Mutex`. Меняется и тип, который возвращает функция: тесты работают с `Arc<Mutex<u32>>`."""]
why.ru = """`Rc` считает ссылки без синхронизации, `RefCell` проверяет заимствования без блокировок: оба рассчитаны на один поток, и компилятор не даёт им пересечь границу потока. `Arc<Mutex<T>>` это их потокобезопасный двойник. Замыкание получает `Send + Sync` автоматически, если таковы все его захваты, поэтому достаточно поменять тип данных, сам обработчик почти не меняется."""

[[exercises]]
name = "clos15"
style = "fix"
hint.ru = ["""Ошибка про одновременные заимствования `self`: цикл держит `&mut self.listeners`, а слушателю нужен `&self`. Что, если на время обхода слушателей в `self` не будет?""", """Вынь список из структуры (`std::mem::take`), обойдите, затем верните обратно. Не забудь вернуть: тест проверит, что слушатели переживают уведомление."""]
why.ru = """Слушатель хочет прочитать счётчик целиком, а для его вызова `FnMut` нужна изменяемая ссылка на сам список слушателей, который лежит внутри счётчика: два заимствования одного объекта. `mem::take` на время выносит список в локальную переменную, так что `self` свободен. Если забыть вернуть его на место, объект молча лишится всех подписчиков после первого события. Именно это ловит повторный `inc` в тесте."""

[[exercises]]
name = "clos_q6"
kind = "question"
question.ru = '''Что случится при сборке (edition 2024)?
```rust
struct Shop { name: String, sales: u32 }
let mut shop = Shop { name: "Rye".into(), sales: 0 };
let mut sell = || shop.sales += 1;
println!("{}", shop.name);
sell();
```'''
options.ru = ["ошибка: shop занята замыканием", "соберётся и напечатает Rye", "ошибка: нельзя читать поле, пока замыкание меняет структуру", "соберётся, но sell() вызовет панику"]
answer = [1]
