[[exercises]]
name = "clos_q7"
kind = "question"
question.ru = '''Что случится при сборке?
```rust
let owner = String::from("ann");
let job: Box<dyn FnOnce() -> String> = Box::new(move || owner);
println!("{}", job());
```'''
options.ru = ["соберётся и напечатает ann", "ошибка: dyn FnOnce нельзя вызвать, размер неизвестен", "ошибка: замыкание отдаёт owner, а должно возвращать копию", "соберётся, но job() можно вызвать только по ссылке"]
answer = [0]
explain.ru = """Раньше вызвать `Box<dyn FnOnce>` было нельзя, но сейчас `Box<F>` где `F: FnOnce` сам умеет `FnOnce`, и вызов забирает ящик. Это основа очередей отложенных задач: `Vec<Box<dyn FnOnce() + Send>>`, из которого задачи вынимают и запускают по одной."""
hint.ru = """Умеет ли `Box<dyn FnOnce>` вызываться сам, без распаковки?"""

[[exercises]]
name = "clos_event_bus"
kind = "project"
style = "scratch"
quiz = true
locked = ["tests/acceptance.rs"]
hint.ru = ["""Подписка это структура из id, темы и обработчика. Шине нужен один вектор подписок и счётчик id. `publish` проходит по вектору в порядке добавления и выбирает подходящие.""", """Обработчик хранится как `Box<dyn FnMut(&Event)>` с границами, которые нужны для потоков (по пункту 6). Для `publish` нужен `iter_mut()` (обработчики `FnMut`) и фильтр `topic == s.topic || s.topic == "*"`. Отписка это `retain` по id; если длина изменилась, подписка была.""", """Id выдаёт счётчик, который только растёт, поэтому после отписки номер повторно не используется. `&mut self` в `publish` и `Send` в границах это то, что позволит положить шину в `Arc<Mutex<EventBus>>`."""]
why.ru = """Шина сводит вместе всё из главы: разнотипные замыкания хранятся как `Box<dyn FnMut>`, `FnMut` позволяет обработчику копить состояние, а `Send + 'static` делают шину пригодной для потоков. Порядок вызова это порядок подписки, а не порядок тем, поэтому подписки лежат в одном векторе, а не в карте по темам. Id не переиспользуются: старый id из чужих рук не должен отменить новую подписку."""
