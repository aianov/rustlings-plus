<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Автомат async fn по опросам</title>
<style>
:root{--bg:#fafaf7;--fg:#1d1d1b;--mut:#6b6b66;--card:#fff;--line:#c9c7bd;--acc:#c2410c;--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;--warn:#a16207;--warnbg:#fef9c3;--btn:#1d1d1b;--btnfg:#fff;--hot:#fff1e6}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--fg:#ecebe6;--mut:#9a9a92;--card:#201f1d;--line:#46443f;--acc:#fb923c;--ok:#4ade80;--okbg:#14301d;--bad:#f87171;--badbg:#3a1a1a;--warn:#facc15;--warnbg:#3a3312;--btn:#ecebe6;--btnfg:#161614;--hot:#33241a}}
*{box-sizing:border-box}
body{margin:0;padding:20px;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 14px}
.panel{max-width:860px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;min-height:150px}
.row{display:flex;gap:10px;align-items:center;font:13px ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--line);border-radius:8px;padding:7px 10px;margin:6px 0}
.row.ok{border-color:var(--ok);background:var(--okbg)}
.row.no{border-color:var(--bad);background:var(--badbg);text-decoration:line-through;opacity:.75}
.row.hot{border-color:var(--warn);background:var(--warnbg)}
.row .tag{margin-left:auto;font:12px system-ui,sans-serif;color:var(--mut);text-decoration:none}
.box{display:inline-block;font:13px ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--line);border-radius:8px;padding:8px 12px;margin:4px 6px 4px 0;vertical-align:top}
.box.ok{border-color:var(--ok);background:var(--okbg)}
.box.hot{border-color:var(--warn);background:var(--warnbg)}
.box.no{border-color:var(--bad);background:var(--badbg)}
.box small{display:block;color:var(--mut);font:12px system-ui,sans-serif}
.arrow{display:inline-block;margin:0 4px;color:var(--mut);font-size:18px;vertical-align:middle}
.note{margin:12px 0;padding:12px 14px;border-left:4px solid var(--acc);background:var(--card);border-radius:0 8px 8px 0;min-height:76px;max-width:860px}
.bar2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:860px}
button{font:inherit;padding:7px 14px;border-radius:8px;border:0;background:var(--btn);color:var(--btnfg);cursor:pointer}
button.alt{background:transparent;color:var(--fg);border:1px solid var(--line)}
button:disabled{opacity:.4;cursor:default}
.cnt{color:var(--mut);margin-left:auto}
</style>
</head>
<body>
<h1>Автомат async fn по опросам</h1>
<p class="sub">Что происходит с async fn на каждом poll</p>
<div class="panel" id="panel"></div>
<div class="note" id="note"></div>
<div class="bar2">
  <button id="step">Шаг</button>
  <button id="play" class="alt">Играть</button>
  <button id="reset" class="alt">Сначала</button>
  <span class="cnt" id="cnt"></span>
</div>
<script>
const steps=[{"p": "<div class=\"row\"><code>async fn publish(a: Delay, b: Delay) -> String {</code></div>\n<div class=\"row\"><code>&nbsp;&nbsp;let x = a.await;&nbsp;&nbsp;// точка 1</code></div>\n<div class=\"row\"><code>&nbsp;&nbsp;let y = b.await;&nbsp;&nbsp;// точка 2</code></div>\n<div class=\"row\"><code>&nbsp;&nbsp;format!(\"{x}+{y}\") }</code></div><p>Состояния автомата:</p><div><span class=\"box \">Start<small>a, b не начаты</small></span><span class=\"arrow\">→</span><span class=\"box \">WaitA<small>ждём a, b ждёт своей очереди</small></span><span class=\"arrow\">→</span><span class=\"box \">WaitB<small>x готов, ждём b</small></span><span class=\"arrow\">→</span><span class=\"box \">Done<small>результат отдан</small></span></div>", "n": "Вот функция с двумя `.await`. Компилятор превращает её в enum из четырёх состояний. Пока никто не вызвал `poll`, не выполнено ни одной строки тела."}, {"p": "<p><b>Опрос 1:</b> исполнитель вызывает <code>poll</code></p><div><span class=\"box hot\">Start<small>a, b не начаты</small></span><span class=\"arrow\">→</span><span class=\"box \">WaitA<small>ждём a, b ждёт своей очереди</small></span><span class=\"arrow\">→</span><span class=\"box \">WaitB<small>x готов, ждём b</small></span><span class=\"arrow\">→</span><span class=\"box \">Done<small>результат отдан</small></span></div><div class=\"row hot\">Тело начинает выполняться: доходим до <code>a.await</code>, опрашиваем <code>a</code><span class=\"tag\">poll #1</span></div>", "n": "Первый опрос запускает тело. Автомат лежит в состоянии Start и входит в первый `.await`."}, {"p": "<p><b>Опрос 1:</b> <code>a</code> ответил Pending</p><div><span class=\"box \">Start<small>a, b не начаты</small></span><span class=\"arrow\">→</span><span class=\"box hot\">WaitA<small>ждём a, b ждёт своей очереди</small></span><span class=\"arrow\">→</span><span class=\"box \">WaitB<small>x готов, ждём b</small></span><span class=\"arrow\">→</span><span class=\"box \">Done<small>результат отдан</small></span></div><div class=\"row no\"><code>poll</code> вернул <code>Pending</code>; автомат записал «я в WaitA» и вышел<span class=\"tag\">Pending</span></div>", "n": "Если `a` не готов, весь автомат отвечает `Pending`, а его состояние запоминает, где остановились. Стек вызовов при этом свободен: исполнитель занят другими задачами."}, {"p": "<p><b>Опрос 2:</b> исполнитель опросил снова</p><div><span class=\"box \">Start<small>a, b не начаты</small></span><span class=\"arrow\">→</span><span class=\"box hot\">WaitA<small>ждём a, b ждёт своей очереди</small></span><span class=\"arrow\">→</span><span class=\"box \">WaitB<small>x готов, ждём b</small></span><span class=\"arrow\">→</span><span class=\"box \">Done<small>результат отдан</small></span></div><div class=\"row hot\">Автомат смотрит в состояние WaitA и сразу опрашивает <code>a</code>, а не начинает сначала<span class=\"tag\">poll #2</span></div>", "n": "Новый опрос не повторяет начало, а продолжает с того места, где остановились. Это разница между автоматом и обычной функцией."}, {"p": "<p><b>Опрос 2:</b> <code>a</code> готов, идём к <code>b</code></p><div><span class=\"box \">Start<small>a, b не начаты</small></span><span class=\"arrow\">→</span><span class=\"box \">WaitA<small>ждём a, b ждёт своей очереди</small></span><span class=\"arrow\">→</span><span class=\"box hot\">WaitB<small>x готов, ждём b</small></span><span class=\"arrow\">→</span><span class=\"box \">Done<small>результат отдан</small></span></div><div class=\"row no\"><code>x</code> получен и сохранён в варианте; опрашиваем <code>b</code>: <code>Pending</code><span class=\"tag\">Pending</span></div>", "n": "`x` пережил границу `.await`, поэтому он лежит внутри варианта WaitB. Всё, что живёт через `.await`, хранится в автомате."}, {"p": "<p><b>Опрос 3:</b> <code>b</code> готов</p><div><span class=\"box \">Start<small>a, b не начаты</small></span><span class=\"arrow\">→</span><span class=\"box \">WaitA<small>ждём a, b ждёт своей очереди</small></span><span class=\"arrow\">→</span><span class=\"box \">WaitB<small>x готов, ждём b</small></span><span class=\"arrow\">→</span><span class=\"box hot\">Done<small>результат отдан</small></span></div><div class=\"row ok\"><code>y</code> получен, формируется строка <code>\"x+y\"</code>, автомат переходит в Done и отдаёт <code>Ready</code><span class=\"tag\">Ready</span></div>", "n": "Только теперь функция закончилась. После `Ready` автомат в состоянии Done: опрашивать его ещё раз нельзя, async fn на повторном опросе паникует."}];
let i=0,timer=null;
function stop(){if(timer){clearInterval(timer);timer=null;}document.getElementById('play').textContent='Играть';}
function frame(){document.getElementById('panel').innerHTML=steps[i].p;document.getElementById('note').textContent=steps[i].n;document.getElementById('cnt').textContent='шаг '+(i+1)+' из '+steps.length;document.getElementById('step').disabled=i>=steps.length-1;if(i>=steps.length-1)stop();}
document.getElementById('step').onclick=()=>{if(i<steps.length-1){i++;frame();}};
document.getElementById('reset').onclick=()=>{stop();i=0;frame();};
document.getElementById('play').onclick=()=>{if(timer){stop();return;}if(i>=steps.length-1){i=0;frame();}document.getElementById('play').textContent='Пауза';timer=setInterval(()=>{if(i<steps.length-1){i++;frame();}else stop();},3000);};
frame();
</script>
</body>
</html>
