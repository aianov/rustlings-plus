[[exercises]]
name = "pinf1"
style = "todo"
hint.ru = [
  '''У `Future` один метод. Что он получает и что должен вернуть? А кто его вообще вызывает, если рантайма нет?''',
  '''`Context::from_waker(Waker::noop())` собирает контекст, который никого не будит. `Pin::new(fut)` годится, потому что `F: Unpin`. Для «отдать один раз» подходит `Option::take`.''',
  '''В `drive` счётчик не нужен: цикл `for _ in 0..max_polls` с ранним `return` на первом `Ready`.''',
]
why.ru = '''`Future` это обычная структура с методом `poll`: никакой магии, опрашивает её тот, у кого есть `Context`. `Option::take` делает «отдать один раз» из коробки, а `expect` превращает повторный опрос в понятную панику: договор разрешает после `Ready` делать что угодно, но тихо отдавать то же значение значит прятать ошибку вызывающего. В `drive` важно не опрашивать лишнего: настоящие `async fn` после завершения паникуют.'''

[[exercises]]
name = "pinf2"
style = "todo"
hint.ru = [
  '''Между опросами `Future` помнит всё только в своих полях. Что нужно помнить `Collect` (сколько взято, чему равна сумма), а что `Calm` (длину серии, число опросов)?''',
  '''Опрос = один шаг: возьми из очереди не больше одного элемента, обнови поля, потом реши, готов ли ответ. Не набирай всё сразу в первом опросе: тогда это обычная функция, а не ожидание.''',
  '''У `Calm` шум ставит серию в ноль, тишина прибавляет единицу. Число опросов считай на каждом `poll`, даже если очередь опустела.''',
]
why.ru = '''Состояние `Future` между опросами живёт в его полях, и каждый `poll` делает один маленький шаг по нему. Поэтому `Collect` нельзя написать циклом «возьми сразу все»: он перестанет быть ожиданием, и вызывающий не сможет вклиниться между шагами. Ловушки: проверка `need == 0` (ответ нужен на первом же опросе) и сброс серии в `Calm` на шуме.'''

[[exercises]]
name = "pinf3"
style = "scratch"
hint.ru = [
  '''`async fn` и `async {}` лениво: пока их не опросили, тело не выполняется. А что делает обычная функция, которая сама пишет в журнал и возвращает `std::future::ready(..)`?''',
  '''Для `start_later` нужен `async move { .. }` с журналом внутри. Для автомата: у каждого `.await` своё состояние, а то, что нужно после него (результат первого, второй Delay), хранится в варианте.''',
  '''В `poll` цикл `loop { match &mut *self { .. } }`: когда первое состояние готово, поменяй `*self` на второе и иди на следующий виток. Второй `Delay` надо вынуть из старого варианта, например через `std::mem::replace(&mut *self, Done)`.''',
]
why.ru = '''Это ровно то, что делает компилятор: каждый `.await` становится границей состояния, в вариант попадает всё, что живёт через эту границу (здесь результат `a` и ещё не начатый `second`). Поэтому `async fn` ленивая: до первого `poll` в автомате нет ни одного выполненного шага. Рукописный вариант удобен для понимания, но в жизни его пишут редко: он велик, а ссылки между полями (самоссылки) руками без `Pin` не сделать, об этом ниже.'''

[[exercises]]
name = "pinf_q1"
kind = "question"
question.ru = '''Что окажется в журнале в конце?
```rust
async fn load(log: &Log) -> u32 {
    log.borrow_mut().push("loading");
    5
}

let log: Log = Default::default();
let fut = load(&log);
log.borrow_mut().push("created");
let n = block_on(fut);
```'''
options.ru = [
  "`[\"loading\", \"created\"]`: тело выполняется при вызове функции",
  "`[\"created\", \"loading\"]`: тело выполнится при первом опросе",
  "`[\"created\"]`: без `.await` тело вообще не выполняется",
  "не соберётся: `load` вернула не `u32`",
]
answer = [1]
explain.ru = '''Вызов `async fn` только строит автомат и ничего не выполняет. Первый шаг тела делается на первом `poll`, а его делает `block_on`. Поэтому «created» окажется раньше. Третий вариант неверен: `.await` внутри не нужен, чтобы тело выполнилось, достаточно опросить future. Это же причина, по которой забытый `.await` (future создан, но никто его не опрашивает) приводит к тому, что работа тихо не делается.'''
hint.ru = '''Когда именно начинает выполняться тело `async fn`: при вызове или при опросе?'''

[[exercises]]
name = "pinf4"
style = "fix"
hint.ru = [
  '''Прочитай панику: какой future опрошен повторно? На какой ветке `match` мы остались после его `Ready`?''',
  '''Состояние автомата хранится в `this.stage`. После `Ready` у `Fetch` оно не поменялось, и следующий виток цикла снова зашёл в ту же ветку. Куда должен перейти автомат?''',
  '''Новое состояние строится из того, что хранит `Pipeline` (`render_len`). Присваивание `this.stage = ..` можно делать внутри ветки: ссылка `delay` к этому моменту уже не нужна.''',
]
why.ru = '''Ручной автомат обязан сам продвигать своё состояние: никто за него этого не сделает, а опрос `Ready`-future это нарушение договора (часто паника). Классическая ошибка при ручном `poll` это вернуть управление, не записав новое состояние. В `async fn` такой ошибки быть не может: компилятор записывает состояние за тебя, поэтому в жизни автоматы вручную пишут только для комбинаторов.'''

[[exercises]]
name = "pinf5"
style = "todo"
hint.ru = [
  '''Что должен сделать `poll`, если сигнала нет? Куда положить то, что понадобится потоку, который потом позовёт `set`?''',
  '''Waker лежит в общем состоянии рядом с флагом. В `poll`: если флаг поднят, `Ready`; иначе `state.waker = Some(cx.waker().clone())` и `Pending`. Затирай старый Waker: он мог устареть.''',
  '''В `set` подними флаг и достань Waker методом `take`, чтобы он не остался в состоянии. Разбуди его уже после того, как отпустил замок, так не придётся держать замок внутри чужого кода.''',
]
why.ru = '''Договор Waker в двух строках: `Pending` значит «я позаботился, чтобы меня разбудили», `wake` значит «опроси меня ещё раз». Сохраняй именно `cx.waker().clone()` при каждом `Pending`: задачу могли переложить, и прежний Waker устарел. `take` не даёт будить дважды. А `wake` лучше звать после отпускания замка: он может сразу вызвать опрос, который вернётся на тот же замок.'''

[[exercises]]
name = "pinf6"
style = "fix"
hint.ru = [
  '''Прочитай падение: после какого по счёту `Pending` пробуждения не хватило? Что в заготовке делается только при первом опросе?''',
  '''У `Retry` и `YieldNow` нет внешнего события, значит напомнить о себе можно только самому. Но напоминание «в долг» не копится: Waker из этого опроса будится один раз и по одному разу на каждый `Pending`.''',
  '''В каждой ветке, которая возвращает `Pending`, перед возвратом нужен `cx.waker().wake_by_ref()`. В ветке `Ready` будить не надо.''',
]
why.ru = '''Каждый `Pending` это отдельное обещание, поэтому будить нужно на каждом из них, а не один раз «на всякий случай». Здесь у future нет внешнего источника событий, значит самый честный вариант это разбудить самого себя до возврата: опросчик получит `Pending`, увидит пробуждение и опросит ещё раз. Это и есть `yield_now`. Если же событие внешнее (поток, сокет), сам себя будить нельзя: получится пустая крутилка на 100% процессора (вернёмся к этому в `pinf14`).'''

[[exercises]]
name = "pinf_q2"
kind = "question"
question.ru = '''Future в `poll` делает так:
```rust
if self.ready {
    return Poll::Ready(());
}
cx.waker().wake_by_ref();
Poll::Pending
```
Событие, которого он ждёт, наступит через минуту. Что будет делать исполнитель всё это время?'''
options.ru = [
  "заснёт на минуту и проснётся, когда событие наступит",
  "будет опрашивать этот future снова и снова, загружая процессор",
  "упадёт: `wake` до возврата `Pending` запрещён",
  "выбросит future как «не отвечающий»",
]
answer = [1]
explain.ru = '''`wake_by_ref` говорит исполнителю: «опроси меня ещё раз», и он послушно ставит задачу в очередь сразу же. Получается крутилка: результат правильный, но процессор на 100%, пока событие не придёт. Будить надо тогда, когда состояние изменилось, а не «на всякий случай», и для этого Waker сохраняют туда, где событие случится (в поток таймера, в сокет).'''
hint.ru = '''Что именно означает `wake` для исполнителя и когда он вернёт задачу в очередь?'''

[[exercises]]
name = "pinf7"
style = "todo"
hint.ru = [
  '''Кто знает, что срок истёк? Кто знает, кого будить? Эти двое работают в разных потоках, значит им нужно общее место.''',
  '''Положи `fired` и `Option<Waker>` под один `Mutex` в `Arc`. Поток получает свой клон `Arc`. В `poll` под замком: сработал, значит `Ready`; нет, значит сохрани Waker и `Pending`.''',
  '''В потоке: поспать, под замком поставить `fired = true` и достать Waker через `take`, замок отпустить, потом `wake`. Если Waker нет (первого опроса ещё не было), будить некого, и это нормально.''',
]
why.ru = '''Таймер это пример всего устройства реактора в миниатюре: за событие отвечает «внешний» поток, за интерфейс `Future`, а встречаются они в общем состоянии с замком. Флаг и Waker обязательно под одним замком: когда они в разных местах, между проверкой и сохранением может проскочить событие (это ровно следующая задача). Старт отсчёта в `after`, а не в первом `poll`, делает таймер похожим на настоящий `sleep` и позволяет создать его заранее.'''

[[exercises]]
name = "pinf_q3"
kind = "question"
question.ru = '''Зачем `Waker` обязан быть `Send + Sync`, хотя `poll` вызывается на одном потоке исполнителя?'''
options.ru = [
  "потому что `poll` вызывается из нескольких потоков одновременно",
  "потому что `wake` вызывают из других потоков: из таймера, сетевого потока, из другой задачи",
  "потому что `Waker` хранит указатель на стек исполнителя",
  "это требование макроса `pin!`",
]
answer = [1]
explain.ru = '''Ждать будут события, которые случаются где угодно: поток таймера, поток сетевого драйвера, другая задача. Поэтому `Waker` сохраняют и отдают в другие потоки, и он обязан быть безопасным для этого. `poll` же, напротив, всегда вызывается одним владельцем задачи за раз.'''
hint.ru = '''Откуда приходит событие, которое надо сообщить задаче?'''

[[exercises]]
name = "pinf8"
style = "bughunt"
hint.ru = [
  '''Выпиши по шагам, что делают `poll` и `open`, если `open` вклинивается в паузу. Что увидит `open`, глядя в состояние? Что увидит потом `poll`?''',
  '''Проверка «калитка открыта?» и сохранение Waker сейчас идут под двумя разными захватами замка, между ними окно. Эти два действия должны быть неделимы относительно `open`.''',
  '''Один захват на весь `poll`: под ним проверь флаг, а если не открыто, сохрани Waker. Либо сохрани Waker первым и проверь флаг ещё раз.''',
]
why.ru = '''Это самый частый баг в ручных future: «проверил условие, потом зарегистрировал Waker», а событие пришло между этими шагами. `open` в это время не увидел Waker и никого не разбудил, а `poll` уже не увидит событие, потому что проверил его раньше. Лечится тем, что проверка и регистрация идут под одним замком (или регистрируют первым, проверяют вторым). Именно поэтому в настоящем рантайме проверку состояния и сохранение Waker никогда не разносят.'''

[[exercises]]
name = "pinf9"
style = "todo"
hint.ru = [
  '''Почему `Pin::new(&mut fut)` не компилируется для `async`-блока, а для `std::future::ready(5)` компилируется? Что отличает эти два типа?''',
  '''Для `poll_to_end` закрепление на стеке даёт макрос `pin!(fut)`: он возвращает `Pin<&mut F>`. Для хранения в `Vec` рядом с другими нужен ящик: `Box::pin(fut)` отдаёт `Pin<Box<F>>`, и его стираем до `dyn Future`.''',
  '''`finish_order`: во внешнем цикле раунды (не больше сотни), во внутреннем один опрос каждого оставшегося future: `futs[i].as_mut().poll(&mut cx)`. Готовый убирай из списка и записывай в ответ, не двигая индекс.''',
]
why.ru = '''Закрепление нужно только для future, которые могут содержать ссылки на себя (все `async`), и только с первого опроса. `pin!` держит future на стеке (без аллокации, но он привязан к функции), `Box::pin` отдаёт его в кучу, и дальше двигаться может только указатель, а сам автомат лежит на месте. Поэтому в `Vec` хранят `Pin<Box<dyn Future>>`. Круговой опрос тоже классика: так работают `join_all` и простые исполнители, а тест на порядок завершения ловит «опроси каждый до конца по очереди».'''

[[exercises]]
name = "pinf_q4"
kind = "question"
question.ru = '''Какие из этих типов являются `Unpin`? Выбери все верные.'''
options.ru = [
  "тип, сгенерированный блоком `async { .. }` с `.await` и ссылкой на свою локальную переменную",
  "`Box<такой async-блок>`",
  "`&mut такой async-блок`",
  "`std::future::ready(5)`",
  "`Pin<&mut такой async-блок>`",
]
answer = [1, 2, 3, 4]
explain.ru = '''`Unpin` означает «перемещение безопасно». Автомат из `async`-блока может хранить ссылки на себя, поэтому он `!Unpin`. А указатель на него (`Box`, `&mut`, `Pin<&mut>`) всегда `Unpin`: двигается указатель, а автомат остаётся на месте. Поэтому `Box::pin` и `pin!` превращают `!Unpin`-future во что-то, что можно передавать и хранить. `ready(5)` не держит ссылок на себя.'''
hint.ru = '''Что именно перемещается, когда ты перекладываешь `Box<T>` или `&mut T`?'''

[[exercises]]
name = "pinf10"
style = "todo"
hint.ru = [
  '''У `Map` два поля. Какое из них опрашивается, а какое используется один раз? Как получить из `Pin<&mut Map<..>>` обычную `&mut Map<..>`, и когда это разрешено?''',
  '''`Map<F, G>` сам `Unpin`, когда `Unpin` оба параметра, поэтому можно взять `self.get_mut()`. Внутренний future опрашивается через `Pin::new(&mut this.inner).poll(cx)`.''',
  '''Функцию забери из `Option` методом `take`: повторный вызов превратится в понятную панику `expect`. Не забирай её до `Ready`.''',
]
why.ru = '''Комбинаторы это кирпичи, из которых собран весь `futures`: у них один `inner`, и `poll` просто пробрасывает опрос внутрь. Пока `inner: Unpin`, всё безопасно и просто: `Pin::new` и `get_mut`. Проблемы начинаются, когда внутри `async`-блок (`!Unpin`): тогда `Pin::new` не работает, и следующая задача про это. `Option<G>` с `take` это стандартный способ дать `FnOnce` сработать единожды без `unsafe`.'''

[[exercises]]
name = "pinf11"
style = "fix"
hint.ru = [
  '''Прочитай ошибку компилятора до конца: какой именно трейт не реализован у `async`-блока, и в каких двух местах кода он требуется?''',
  '''Чтобы не требовать `Unpin`, `Map` сам должен закрепить внутренний future. Закрепить можно в куче, и тогда `Map` снова становится `Unpin` (указатель двигать можно). Для `poll_twice` вызывающий закрепляет сам, тебе остаётся принять `Pin<&mut F>`.''',
  '''В `Map`: поле `Pin<Box<F>>`, создаётся `Box::pin(inner)`, опрашивается `self.inner.as_mut().poll(cx)`. В `poll_twice`: параметр `mut fut: Pin<&mut F>` и `fut.as_mut().poll(..)` дважды.''',
]
why.ru = '''Есть три способа держать `!Unpin`-future внутри комбинатора: ящик (`Pin<Box<F>>`, простой путь, цена одна аллокация), `unsafe`-проекция пина на поле (то, что делают `pin-project` и `futures`, без аллокации, но с доказательством безопасности) и требование `Unpin` (то, что мы имели). Для учебного кода и многих прикладных нужд ящик подходит: наружу `Map` остаётся `Unpin`, потому что двигать указатель можно свободно. Метод `as_mut` нужен, чтобы `poll` не «съедал» твой `Pin`, а брал его на время.'''

[[exercises]]
name = "pinf_q5"
kind = "question"
question.ru = '''Что скажет компилятор?
```rust
fn make() -> impl Future<Output = u32> {
    let fut = std::pin::pin!(async { 1 });
    fut
}
```'''
options.ru = [
  "соберётся: `pin!` закрепляет future навсегда",
  "ошибка: ссылка на значение, которое умрёт при выходе из функции",
  "ошибка: `async`-блок не реализует `Future`",
  "соберётся, но упадёт во время работы",
]
answer = [1]
explain.ru = '''`pin!` кладёт future в безымянную переменную на стеке и отдаёт `Pin<&mut T>`, ссылку на неё. Из функции такую ссылку не вернуть, она указывала бы на мёртвый стек. Если future надо вернуть или сохранить, закрепляй в куче: `Box::pin(async { 1 })`. Либо просто возвращай сам `async`-блок: до первого опроса его двигать можно.'''
hint.ru = '''Где живёт значение, которое создаёт `pin!`, и что с ним происходит на выходе из функции?'''

[[exercises]]
name = "pinf12"
style = "scratch"
hint.ru = [
  '''Что должен помнить `Join2`, когда один из двух future уже готов, а второй ещё нет? Куда деть результат?''',
  '''`Slot::Running` пока работает, `Slot::Done(Some(value))` когда готов. В каждом опросе пройди оба слота: Running опроси, Done не трогай.''',
  '''Когда оба Done, забери значения методом `take` и верни пару. Выдели метод «опрошу слот, если он Running» на `Slot<T>`, иначе придётся писать цикл дважды.''',
]
why.ru = '''`join` это маленькая машина состояний на каждого участника: «ещё работает» или «готов, результат ждёт». Нельзя ни опрашивать готового (договор), ни дожидаться первого перед вторым (теряется смысл одновременности), ни выбрасывать результат раньше времени. Эту форму имеют `join_all`, `try_join` и `select`: меняется только условие выхода. Заметь, что на самом деле параллельно здесь ничего не работает: оба участника идут в одном потоке по очереди, одновременность в том, что ни один не ждёт другого.'''

[[exercises]]
name = "pinf_q6"
kind = "question"
question.ru = '''Самодельный `join` опрашивает `a` и `b` при каждом своём `poll`, но забыл помечать завершившиеся. `a` это обычная `async fn`, она закончилась на первом опросе, а `b` ещё ждёт. Что произойдёт на втором опросе `join`?'''
options.ru = [
  "`a` снова вернёт то же `Ready`, и всё продолжится",
  "`a` вернёт `Pending`",
  "`async fn` запаникует: «resumed after completion»",
  "проект не соберётся",
]
answer = [2]
explain.ru = '''После `Ready` автомат `async fn` находится в состоянии «завершён», и повторный `poll` по договору имеет право на что угодно, а у `async` это паника. Так сделано нарочно: тихое повторение результата скрыло бы ошибку в комбинаторе. Поэтому `join` хранит для каждого участника отдельно «ещё работает» или «результат ждёт».'''
hint.ru = '''Что делает компилятор с автоматом `async fn`, когда тот дошёл до конца?'''

[[exercises]]
name = "pinf13"
style = "bughunt"
hint.ru = [
  '''Перечисли все способы закончить жизнь `future` на середине: он дошёл до конца, он вернул отказ, его бросили (`drop`). В каких из них твой код возвращает место?''',
  '''Код после `.await` при отмене не выполняется вообще: выполнится только то, что делают деструкторы живых к этому моменту переменных. Значит, откат должен жить в `Drop`.''',
  '''Заведи маленькую структуру-охранник, которая хранит ссылку на `Seats` и флаг «оставить». Её `Drop` возвращает место, если флаг не поднят. Создай охранника сразу после занятия места, а флаг подними только после успешной оплаты.''',
]
why.ru = '''Отмена в Rust это просто `drop` на любом `.await`: код после него не выполнится никогда, выполнятся только деструкторы живых переменных. Поэтому всё, что нужно откатывать, откатывается в `Drop`, а не вручную «на отказе». Это тот же приём RAII-охранника, что в обычном коде, только его роль огромна: именно он делает `select!`, таймауты и отмену запросов безопасными. Правило «cancel safety»: после любого `.await` future может не вернуться, и мир должен остаться согласованным.'''

[[exercises]]
name = "pinf_q7"
kind = "question"
question.ru = '''```rust
async fn job(log: Log) {
    let _a = Guard::new("a", &log);      // Drop пишет «drop a»
    step().await;                        // первый await
    let _b = Guard::new("b", &log);
    step().await;                        // второй await
    log.borrow_mut().push("end".into());
}
```
Future опросили три раза: он прошёл первый `.await`, вернул `Pending` на втором, и его выбросили. Что в журнале?'''
options.ru = [
  "`[\"drop a\", \"drop b\"]`",
  "`[\"drop b\", \"drop a\"]`",
  "`[\"end\"]`",
  "пусто: деструкторы при отмене не вызываются",
]
answer = [1]
explain.ru = '''Отмена это `drop` автомата. Он уничтожает всё, что жило в момент остановки: `_a` и `_b`, в обратном порядке создания, то есть сначала `b`. Код после `.await` не выполняется, поэтому «end» не будет. Отсюда правило надёжной отмены: всё, что надо откатить, откатывает `Drop` охранника.'''
hint.ru = '''Какие переменные были живы в точке, где future остановился? В каком порядке Rust их уничтожает?'''

[[exercises]]
name = "pinf14"
style = "todo"
hint.ru = [
  '''`park` усыпляет текущий поток, `unpark` будит указанный. Что должно оказаться в `Waker`, чтобы другой поток мог разбудить именно этот?''',
  '''Заведи структуру с полем `Thread` (получить его можно через `thread::current()`), реализуй для неё `std::task::Wake`, а `Waker::from(Arc::new(..))` даст тебе `Waker`. `Context::from_waker(&waker)` соберёт контекст.''',
  '''Цикл: опроси, на `Ready` верни значение, на `Pending` вызови `thread::park()`. Если разбудили раньше, чем ты уснул, `unpark` оставляет «жетон», и `park` вернётся сразу: потерять пробуждение между `poll` и `park` нельзя.''',
]
why.ru = '''`park` и `unpark` рассчитаны ровно на такой случай: `unpark` до `park` оставляет жетон, поэтому пробуждение, пришедшее во время `poll`, не теряется. Опрос в цикле после `park` обязателен, потому что `park` может вернуться и без причины (ложное пробуждение): вернулись, опросили, получили `Pending`, уснули снова. Закрепление `pin!` на стеке удобно: `block_on` не двигает future после старта. Вот и вся магия `futures::executor::block_on`, внутри только чуть больше обвязки.'''

[[exercises]]
name = "pinf_q8"
kind = "question"
question.ru = '''Другой поток вызвал `unpark` для потока `T`, пока тот ещё не дошёл до `thread::park()`. Что сделает `park()` в потоке `T`?'''
options.ru = [
  "заснёт и будет спать, пока не придёт новый `unpark`: первый потерян",
  "сразу вернётся: `unpark` оставил жетон, который `park` забирает",
  "паникует: `unpark` был раньше",
  "зависит от планировщика операционной системы",
]
answer = [1]
explain.ru = '''`unpark` ставит жетон «разбудить в следующий раз», а `park` сначала смотрит на жетон. Именно поэтому `block_on` на `park`/`unpark` не теряет пробуждения, случившиеся между `poll` и `park`. Нужно помнить об обратной стороне: `park` может вернуться и просто так (ложное пробуждение), поэтому после него всегда проверяют условие, у нас это новый `poll`.'''
hint.ru = '''Что гарантирует документация: «unpark до park» теряется или сохраняется?'''

[[exercises]]
name = "pinf15"
style = "fix"
hint.ru = [
  '''Разыграй по шагам future, который в самом `poll` зовёт `wake`. В каком порядке меняется флаг `woken`, и что с ним делает цикл после опроса?''',
  '''Флаг должен отражать «после последнего опроса меня будили». Значит, сбрасывать его надо ДО опроса: всё, что случится после начала `poll`, должно остаться видимым в цикле ожидания.''',
  '''Перенеси сброс в начало витка цикла, перед `poll`. Ожидание `while !*woken` оставь как есть: оно защищает от ложных пробуждений `Condvar`.''',
]
why.ru = '''Классическая потерянная побудка: состояние «меня разбудили» сбрасывается после того, как поток уже узнал о пробуждении. Правило: флаг сбрасывается перед проверкой (опросом), а не после, и ожидание всегда в цикле `while !флаг`. Тогда любое пробуждение, случившееся после начала опроса, либо будет замечено в ожидании (флаг уже поднят), либо разбудит спящего. В `park`/`unpark` эту работу делает жетон; здесь тот же жетон устроен вручную.'''

[[exercises]]
name = "pinf16"
style = "scratch"
hint.ru = [
  '''Опиши жизнь задачи: она появляется в очереди, её достают, опрашивают, и дальше два пути (`Ready` или `Pending`). Кто и когда кладёт её в очередь второй раз?''',
  '''`Task` хранит future в `Mutex<Option<..>>`: на время опроса его достают (`take`), при `Pending` возвращают. `Waker::from(Arc<Task>)` строится через `Wake`, а `wake` просто отправляет `self` в канал.''',
  '''`run`: `while live > 0 { let task = receiver.recv()..; .. }`. Счётчик живых уменьшай, когда задача закончилась. `spawn`: увеличь счётчик ДО отправки, иначе `run` может решить, что работы нет.''',
]
why.ru = '''Это настоящий скелет любого рантайма: очередь готовых задач, `Waker` как способ вернуть задачу в очередь, цикл «достал, опросил». `Option` в слоте нужен, чтобы забрать future на время опроса и пометить задачу законченной. Порядок «сначала счётчик, потом очередь» важен: если отправить первым, исполнитель в другом потоке мог бы увидеть пустой счётчик. Честная очередь FIFO даёт справедливость: задача, дошедшая до `.await`, встаёт в хвост, и соседи не голодают.'''

[[exercises]]
name = "pinf17"
style = "fix"
hint.ru = [
  '''Прочитай панику и вспомни, когда задача попадает в очередь. Сколько раз она может там оказаться за одну жизнь? Что лежит в слоте, когда её достают в последний раз?''',
  '''После `Ready` future нельзя опрашивать, значит, исполнитель должен уметь пометить задачу «уже закончена» и пропускать такие записи в очереди.''',
  '''Слот становится `Option`: на время опроса future забирают, при `Pending` кладут назад, при `Ready` не кладут. Если при очередном извлечении слот пуст, это лишний `wake`, просто иди дальше.''',
]
why.ru = '''Договор Waker не обещает «ровно один wake на один Pending»: будить можно часто, в том числе лишний раз и после завершения (старый Waker остался у кого-то в кармане). Поэтому исполнитель обязан переживать любые пробуждения, а для этого ему нужен признак «задача закончена»: `Option` в слоте. То же делают настоящие рантаймы: tokio держит состояние задачи и игнорирует wake у завершённой. Заметь, что счётчик живых задач уменьшается один раз, потому что `Ready` бывает один раз.'''

[[exercises]]
name = "pinf_q9"
kind = "question"
question.ru = '''Исполнитель опрашивает задачу и получает `Ready`. Задача завершена, и её запись удалена. Через секунду таймер, у которого остался клон её `Waker`, вызывает `wake`. Что должен сделать исполнитель?'''
options.ru = [
  "упасть: пробуждение завершённой задачи это нарушение договора",
  "опросить задачу снова: вдруг что-то изменилось",
  "молча проигнорировать пробуждение",
  "увеличить счётчик живых задач",
]
answer = [2]
explain.ru = '''Договор Waker разрешает будить в любой момент, и после завершения задачи тоже: у кого-то остался клон, и никто не обязан его выбросить. Исполнитель обязан это пережить, то есть найти задачу по номеру или ссылке, увидеть «завершена» и пойти дальше. Опрос завершённой задачи для `async` это паника, как в `pinf17`.'''
hint.ru = '''Кто ещё может держать клон Waker после завершения задачи?'''

[[exercises]]
name = "pinf_mini_executor"
style = "scratch"
kind = "project"
quiz = true
locked = ["crates/mini-exec/tests/acceptance.rs"]
hint.ru = [
  '''Разбей проект на три слоя: очередь номеров задач с `Condvar` (сюда стучат все `Waker`), таблица «номер → future» в самом исполнителе и цикл `pop`, `poll`. Остальное (`JoinHandle`, `sleep`, `yield_now`) строится на тех же приёмах, что в задачах главы.''',
  '''`Waker` хранит только номер задачи и `Arc` очереди, поэтому задачи не обязаны быть `Send`. Задачу на время опроса вынь из таблицы, после `Pending` верни. В очереди не держи один номер дважды (`contains` перед `push_back`).''',
  '''Главный future для `run_until` держи на стеке (`pin!`), а в очереди пометь его особым номером (например 0). `JoinHandle` хранит общий слот `Rc<RefCell<..>>` с результатом и Waker того, кто ждёт: задача-обёртка кладёт результат и будит. `run` без задач возвращается сразу, поэтому условие цикла «живых задач больше нуля», а не «очередь не пуста».''',
]
why.ru = '''Здесь собраны все приёмы главы: `Waker` как способ вернуть задачу в очередь (`pinf16`), пробуждения, которые приходят когда угодно и откуда угодно (`pinf5`, `pinf17`), таймер на потоке (`pinf7`), сон вместо крутилки (`pinf14`, `pinf15`). Тесты считают опросы и пробуждения, поэтому «ленивые» решения не проходят: цикл, который опрашивает все задачи по кругу, даёт лишние опросы; очередь без дедупликации даёт два опроса на два `wake`; исполнитель, не засыпающий на `Condvar`, ловится на ожидании чужого потока. Именно такую модель tokio скрывает за `#[tokio::main]`.'''
