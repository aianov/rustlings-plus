<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Serde: структура превращается в JSON и обратно</title>
<style>
:root{--bg:#fafaf7;--fg:#1d1d1b;--mut:#6b6b66;--card:#fff;--line:#c9c7bd;--acc:#c2410c;--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;--warn:#a16207;--warnbg:#fef9c3;--btn:#1d1d1b;--btnfg:#fff;--hot:#fff1e6}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--fg:#ecebe6;--mut:#9a9a92;--card:#201f1d;--line:#46443f;--acc:#fb923c;--ok:#4ade80;--okbg:#14301d;--bad:#f87171;--badbg:#3a1a1a;--warn:#facc15;--warnbg:#3a3312;--btn:#ecebe6;--btnfg:#161614;--hot:#33241a}}
*{box-sizing:border-box}
body{margin:0;padding:20px;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 14px}
.panel{max-width:860px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;min-height:150px}
.row{display:flex;gap:10px;align-items:center;font:13px ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--line);border-radius:8px;padding:7px 10px;margin:6px 0}
.row.ok{border-color:var(--ok);background:var(--okbg)}
.row.no{border-color:var(--bad);background:var(--badbg);text-decoration:line-through;opacity:.75}
.row.hot{border-color:var(--warn);background:var(--warnbg)}
.row .tag{margin-left:auto;font:12px system-ui,sans-serif;color:var(--mut);text-decoration:none}
.box{display:inline-block;font:13px ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--line);border-radius:8px;padding:8px 12px;margin:4px 6px 4px 0;vertical-align:top}
.box.ok{border-color:var(--ok);background:var(--okbg)}
.box.hot{border-color:var(--warn);background:var(--warnbg)}
.box.no{border-color:var(--bad);background:var(--badbg)}
.box small{display:block;color:var(--mut);font:12px system-ui,sans-serif}
.arrow{display:inline-block;margin:0 4px;color:var(--mut);font-size:18px;vertical-align:middle}
.note{margin:12px 0;padding:12px 14px;border-left:4px solid var(--acc);background:var(--card);border-radius:0 8px 8px 0;min-height:76px;max-width:860px}
.bar2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:860px}
button{font:inherit;padding:7px 14px;border-radius:8px;border:0;background:var(--btn);color:var(--btnfg);cursor:pointer}
button.alt{background:transparent;color:var(--fg);border:1px solid var(--line)}
button:disabled{opacity:.4;cursor:default}
.cnt{color:var(--mut);margin-left:auto}
</style>
</head>
<body>
<h1>Serde: структура превращается в JSON и обратно</h1>
<p class="sub">Как значение Rust проходит через serde и где работают атрибуты</p>
<div class="panel" id="panel"></div>
<div class="note" id="note"></div>
<div class="bar2">
  <button id="step">Шаг</button>
  <button id="play" class="alt">Играть</button>
  <button id="reset" class="alt">Сначала</button>
  <span class="cnt" id="cnt"></span>
</div>
<script>
const steps=[{"p": "<div class=\"row ok\"><span>struct Post { id: u64, title: String, draft: bool }</span><span class=\"tag\">значение в Rust</span></div>", "n": "Дано обычное значение Rust. Ему всё равно, в каком формате оно будет жить: JSON, MessagePack или что-то ещё."}, {"p": "<div class=\"row hot\"><span>#[derive(Serialize)]  описывает: какие поля, какого типа, в каком порядке</span><span class=\"tag\">derive</span></div><p style=\"color:var(--mut)\">derive генерирует код один раз на этапе компиляции. Он не знает про JSON.</p>", "n": "derive(Serialize) пишет за тебя функцию, которая обходит поля и сообщает «сериализатору» о каждом: тут число, тут строка, тут булево. Формат пока не выбран."}, {"p": "<div class=\"row \"><span>поле id: u64 → serialize_u64(7)</span><span class=\"tag\"></span></div><div class=\"row \"><span>поле title → serialize_str(\"hi\")</span><span class=\"tag\"></span></div><div class=\"row \"><span>поле draft → serialize_bool(false)</span><span class=\"tag\"></span></div>", "n": "Этот разговор идёт через модель данных serde: около тридцати «простых» видов (числа, строки, последовательности, словари, Option, enum). Каждый тип Rust в неё превращается."}, {"p": "<div class=\"row hot\"><span>атрибуты работают здесь: rename_all, skip_serializing_if, with, flatten</span><span class=\"tag\">вмешиваются до формата</span></div><p style=\"color:var(--mut)\">Переименование, пропуск полей и свои функции меняют то, что сообщается сериализатору.</p>", "n": "Атрибуты не про JSON, они про модель данных. rename меняет имя поля до того, как его увидит формат, skip убирает поле из разговора, with подменяет способ записи."}, {"p": "<div class=\"box hot\">serde_json::Serializer<small>собирает текст</small></div><span class=\"arrow\">&rarr;</span><div class=\"box ok\">{\"id\":7,\"title\":\"hi\",\"draft\":false}<small>JSON</small></div>", "n": "Формат подключается в конце: serde_json превращает вызовы serialize_* в текст. С другим форматом модель та же, а байты другие."}, {"p": "<div class=\"box ok\">{\"id\":7,\"title\":\"hi\"}<small>пришло по сети</small></div><span class=\"arrow\">&rarr;</span><div class=\"box hot\">serde_json::Deserializer<small>читает, подсказывает типы</small></div>", "n": "Обратная дорога. Десериализатор читает текст и по просьбе «посетителя» (Visitor), которого вернул derive(Deserialize), отдаёт ему найденное: число, строку, начало объекта."}, {"p": "<div class=\"row no\"><span>нет поля draft → default или ошибка «missing field `draft`»</span><span class=\"tag\">ошибка: поле обязательно</span></div><div class=\"row warn\"><span>лишнее поле extra → по умолчанию молча пропускается</span><span class=\"tag\">или deny_unknown_fields</span></div><div class=\"row no\"><span>поле id: \"7\" вместо 7 → invalid type: string, expected u64</span><span class=\"tag\">ошибка типа</span></div>", "n": "Здесь срабатывают атрибуты чтения: default подставляет значение, alias принимает второе имя, deny_unknown_fields запрещает лишнее. Ошибки несут строку и столбец."}, {"p": "<div class=\"row ok\"><span>Post { id: 7, title: \"hi\", draft: false }</span><span class=\"tag\">значение собрано</span></div>", "n": "Готово. Исходный тип, формат и правила (атрибуты) независимы: поменяй одно, и остальное не придётся писать заново."}];
let i=0,timer=null;
function stop(){if(timer){clearInterval(timer);timer=null;}document.getElementById('play').textContent='Играть';}
function frame(){document.getElementById('panel').innerHTML=steps[i].p;document.getElementById('note').textContent=steps[i].n;document.getElementById('cnt').textContent='шаг '+(i+1)+' из '+steps.length;document.getElementById('step').disabled=i>=steps.length-1;if(i>=steps.length-1)stop();}
document.getElementById('step').onclick=()=>{if(i<steps.length-1){i++;frame();}};
document.getElementById('reset').onclick=()=>{stop();i=0;frame();};
document.getElementById('play').onclick=()=>{if(timer){stop();return;}if(i>=steps.length-1){i=0;frame();}document.getElementById('play').textContent='Пауза';timer=setInterval(()=>{if(i<steps.length-1){i++;frame();}else stop();},3000);};
frame();
</script>
</body>
</html>
