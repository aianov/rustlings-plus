<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Один enum в четырёх представлениях JSON</title>
<style>
:root{--bg:#fafaf7;--fg:#1d1d1b;--mut:#6b6b66;--card:#fff;--line:#c9c7bd;--acc:#c2410c;--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;--warn:#a16207;--warnbg:#fef9c3;--btn:#1d1d1b;--btnfg:#fff;--hot:#fff1e6}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--fg:#ecebe6;--mut:#9a9a92;--card:#201f1d;--line:#46443f;--acc:#fb923c;--ok:#4ade80;--okbg:#14301d;--bad:#f87171;--badbg:#3a1a1a;--warn:#facc15;--warnbg:#3a3312;--btn:#ecebe6;--btnfg:#161614;--hot:#33241a}}
*{box-sizing:border-box}
body{margin:0;padding:20px;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 14px}
.panel{max-width:860px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;min-height:150px}
.row{display:flex;gap:10px;align-items:center;font:13px ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--line);border-radius:8px;padding:7px 10px;margin:6px 0}
.row.ok{border-color:var(--ok);background:var(--okbg)}
.row.no{border-color:var(--bad);background:var(--badbg);text-decoration:line-through;opacity:.75}
.row.hot{border-color:var(--warn);background:var(--warnbg)}
.row .tag{margin-left:auto;font:12px system-ui,sans-serif;color:var(--mut);text-decoration:none}
.box{display:inline-block;font:13px ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--line);border-radius:8px;padding:8px 12px;margin:4px 6px 4px 0;vertical-align:top}
.box.ok{border-color:var(--ok);background:var(--okbg)}
.box.hot{border-color:var(--warn);background:var(--warnbg)}
.box.no{border-color:var(--bad);background:var(--badbg)}
.box small{display:block;color:var(--mut);font:12px system-ui,sans-serif}
.arrow{display:inline-block;margin:0 4px;color:var(--mut);font-size:18px;vertical-align:middle}
.note{margin:12px 0;padding:12px 14px;border-left:4px solid var(--acc);background:var(--card);border-radius:0 8px 8px 0;min-height:76px;max-width:860px}
.bar2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:860px}
button{font:inherit;padding:7px 14px;border-radius:8px;border:0;background:var(--btn);color:var(--btnfg);cursor:pointer}
button.alt{background:transparent;color:var(--fg);border:1px solid var(--line)}
button:disabled{opacity:.4;cursor:default}
.cnt{color:var(--mut);margin-left:auto}
</style>
</head>
<body>
<h1>Один enum в четырёх представлениях JSON</h1>
<p class="sub">Внешний, внутренний и соседний теги, а также вариант без тега</p>
<div class="panel" id="panel"></div>
<div class="note" id="note"></div>
<div class="bar2">
  <button id="step">Шаг</button>
  <button id="play" class="alt">Играть</button>
  <button id="reset" class="alt">Сначала</button>
  <span class="cnt" id="cnt"></span>
</div>
<script>
const steps=[{"p": "<pre style=\"margin:6px 0;font:13px ui-monospace,Menlo,monospace;white-space:pre-wrap\">enum Event {\n    Liked { post: u64 },\n    Followed(String),\n    Ping,\n}</pre><div class=\"row hot\"><span>три варианта: со структурой, с кортежем и без данных</span><span class=\"tag\"></span></div>", "n": "Один и тот же enum в четырёх представлениях JSON. Здесь вариант с полями (Liked), вариант с одним значением (Followed) и вариант без данных (Ping)."}, {"p": "<div class=\"row ok\"><span>{\"Liked\":{\"post\":3}}</span><span class=\"tag\">внешний тег (по умолчанию)</span></div><div class=\"row ok\"><span>{\"Followed\":\"ira\"}</span><span class=\"tag\"></span></div><div class=\"row ok\"><span>\"Ping\"</span><span class=\"tag\">вариант без данных строкой</span></div>", "n": "Внешний тег: имя варианта становится ключом, данные лежат в значении. Разбирать просто, но получатель сначала читает ключ, потом значение."}, {"p": "<pre style=\"margin:6px 0;font:13px ui-monospace,Menlo,monospace;white-space:pre-wrap\">#[serde(tag = \"type\")]</pre><div class=\"row ok\"><span>{\"type\":\"Liked\",\"post\":3}</span><span class=\"tag\">внутренний тег</span></div><div class=\"row ok\"><span>{\"type\":\"Ping\"}</span><span class=\"tag\"></span></div><div class=\"row no\"><span>Followed(\"ira\") → ошибка записи</span><span class=\"tag\">тег нельзя положить рядом с числом или строкой</span></div>", "n": "Внутренний тег кладёт вид сообщения в тот же объект, как принято в большинстве API. Работает для вариантов-структур и без данных. Для кортежа с примитивом невозможен."}, {"p": "<pre style=\"margin:6px 0;font:13px ui-monospace,Menlo,monospace;white-space:pre-wrap\">#[serde(tag = \"t\", content = \"d\")]</pre><div class=\"row ok\"><span>{\"t\":\"Liked\",\"d\":{\"post\":3}}</span><span class=\"tag\">соседний тег</span></div><div class=\"row ok\"><span>{\"t\":\"Followed\",\"d\":\"ira\"}</span><span class=\"tag\"></span></div><div class=\"row ok\"><span>{\"t\":\"Ping\"}</span><span class=\"tag\"></span></div>", "n": "Соседний тег держит тег и данные в двух ключах. Работает для любых вариантов, и получатель может сначала прочитать тег, а данные разобрать позже."}, {"p": "<pre style=\"margin:6px 0;font:13px ui-monospace,Menlo,monospace;white-space:pre-wrap\">#[serde(untagged)]</pre><div class=\"row ok\"><span>{\"post\":3}</span><span class=\"tag\">Liked</span></div><div class=\"row ok\"><span>\"ira\"</span><span class=\"tag\">Followed</span></div><div class=\"row warn\"><span>вариант выбирается по виду данных, первый подошедший</span><span class=\"tag\">порядок решает</span></div>", "n": "Без тега. Serde пробует варианты сверху вниз и берёт первый, у которого разобралось. Удобно для «число или строка», опасно для похожих объектов: лишние поля игнорируются."}, {"p": "<div class=\"row \"><span>внешний: просто, но получатель читает ключ как имя варианта</span><span class=\"tag\"></span></div><div class=\"row \"><span>внутренний: как в API, но не для кортежей с примитивами</span><span class=\"tag\"></span></div><div class=\"row \"><span>соседний: универсальный, чуть шумный</span><span class=\"tag\"></span></div><div class=\"row warn\"><span>без тега: только если формы данных различимы</span><span class=\"tag\"></span></div>", "n": "Как выбрать: для внешнего контракта почти всегда внутренний или соседний тег; без тега только когда форма данных однозначна, и тогда порядок вариантов важен."}];
let i=0,timer=null;
function stop(){if(timer){clearInterval(timer);timer=null;}document.getElementById('play').textContent='Играть';}
function frame(){document.getElementById('panel').innerHTML=steps[i].p;document.getElementById('note').textContent=steps[i].n;document.getElementById('cnt').textContent='шаг '+(i+1)+' из '+steps.length;document.getElementById('step').disabled=i>=steps.length-1;if(i>=steps.length-1)stop();}
document.getElementById('step').onclick=()=>{if(i<steps.length-1){i++;frame();}};
document.getElementById('reset').onclick=()=>{stop();i=0;frame();};
document.getElementById('play').onclick=()=>{if(timer){stop();return;}if(i>=steps.length-1){i=0;frame();}document.getElementById('play').textContent='Пауза';timer=setInterval(()=>{if(i<steps.length-1){i++;frame();}else stop();},3000);};
frame();
</script>
</body>
</html>
