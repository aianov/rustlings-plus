title.ru = "Serde и данные на проводе"

[[chapter.visuals]]
file = "visuals/serde_flow.html"
title.ru = "Serde: структура превращается в JSON и обратно"

[[chapter.visuals]]
file = "visuals/enum_tagging.html"
title.ru = "Один enum в четырёх представлениях JSON"

[[exercises]]
name = "srd1"
style = "todo"
kind = "project"
hint.ru = [
  '''Два атрибута `derive` на структуре. Какие трейты из крейта `serde` нужны, чтобы писать и читать?''',
  '''Функции живут в `serde_json`: `to_string`, `to_vec`, `from_str`, `from_slice`. Запись возвращает `Result`: подумай, может ли она провалиться для этой структуры.''',
  '''Для записи: `serde_json::to_string(user).expect("..")` с объяснением, почему тут невозможна ошибка. Разбор возвращает `serde_json::Error` как есть.''',
]
why.ru = '''`Serialize` и `Deserialize` из `derive` описывают структуру один раз, а формат решает `serde_json`. Запись числа, строки и вектора строк не может провалиться, поэтому `expect` с объяснением честнее, чем возврат `Result`, который никто не обработает. Разбор чужого текста может провалиться всегда, и ошибка serde_json называет поле и место.'''

[[exercises]]
name = "srd2"
style = "fix"
kind = "project"
hint.ru = [
  '''Что делает `rename_all` и на какие именно имена он действует? Отдельное поле, которое не подчиняется общему правилу, получает своё `rename`.''',
  '''Для `nick` нужен атрибут, который добавляет второе имя при чтении и не меняет имя при записи.''',
  '''Общее правило имён вешается на структуру, исключения на отдельные поля: у одного поля надо принять второе имя, у другого заменить слово, зарезервированное в Rust.''',
]
why.ru = '''`rename_all` задаёт общее правило, `rename` исключение, `alias` дополнительное имя только для чтения. Так клиент получает привычные ключи, а старые версии продолжают работать. Тест проверяет и обратное: snake_case на проводе не принимается, значит правило применено, а не просто добавлено рядом.'''

[[exercises]]
name = "srd3"
style = "todo"
kind = "project"
hint.ru = [
  '''Три разных желания: значение при отсутствии ключа, пропуск при записи и полный отказ от поля. Для каждого свой атрибут.''',
  '''`default = "имя_функции"` берёт значение из функции; `skip_serializing_if` принимает путь к функции вроде `Option::is_none`; `skip` убирает поле с обеих сторон.''',
  '''Для `bio` и `badges` нужны оба: `default` (чтобы читать отсутствие) и `skip_serializing_if` (чтобы не писать пустое).''',
]
why.ru = '''`skip_serializing_if` влияет только на запись, поэтому для полей, которые могут отсутствовать на проводе, `default` нужен отдельно. `skip` убирает поле целиком: клиент не может подставить служебное значение, даже если угадает имя ключа. Это дешёвая защита от массового присваивания полей.'''

[[exercises]]
name = "srd4"
style = "todo"
kind = "project"
hint.ru = [
  '''У serde четыре представления enum. Как отличается `tag = "cmd"` от `tag = "t", content = "d"` на данных в варианте?''',
  '''Тег внутри объекта (`tag`) работает для структурных вариантов и вариантов без данных. Для разных имён вариантов в JSON подходит `rename_all`.''',
  '''Три разных представления для трёх типов: тег внутри объекта, тег рядом с данными, без тега. Имена вариантов в JSON подгоняются отдельным атрибутом на enum.''',
]
why.ru = '''Внешний тег (по умолчанию) удобен, когда вариантов много и данные разные. Внутренний тег кладёт вид сообщения рядом с полями, как в большинстве API. Соседний тег держит данные отдельным ключом и работает для любых вариантов, включая числа и списки. `untagged` выбирает вариант по виду данных, и из-за этого его надо использовать осторожно: следующая задача показывает почему.'''

[[exercises]]
name = "srd5"
style = "bughunt"
kind = "project"
hint.ru = [
  '''Как `untagged` выбирает вариант: сверху вниз, первый подошедший? А лишние поля в объекте ему мешают?''',
  '''Объект `{"post":1,"text":"hi"}` подходит варианту, которому нужен только `post`. Значит, порядок вариантов решает.''',
  '''Ставь вперёд самые требовательные варианты (больше обязательных полей), а самый простой в конец. Либо запрети лишние поля (`deny_unknown_fields`) у простых.''',
]
why.ru = '''`untagged` пробует варианты по порядку и берёт первый, у которого получилось. Лишние ключи serde по умолчанию игнорирует, поэтому объект с `text` подходит и варианту, которому нужен один `post`. Лечение в порядке: от самого специфичного к самому общему. Надёжнее всего явный тег, но для внешнего контракта, который менять нельзя, остаётся порядок.'''

[[exercises]]
name = "srd6"
style = "todo"
kind = "project"
hint.ru = [
  '''Какой атрибут «вставляет» поля вложенной структуры в родителя? Он нужен и для структуры, и для enum, и для карты.''',
  '''Внутри плоского объекта тег enum стоит рядом с остальными полями: у `Kind` нужен `tag = "type"` и `rename_all`.''',
  '''`#[serde(flatten)]` на `meta`, на `kind` и на `extra`. Остальные поля `extra` собирает сам serde: после того, как известные поля взяты.''',
]
why.ru = '''`flatten` позволяет описать общие поля один раз и не вкладывать их в отдельный объект. Карта с `flatten` собирает всё, что не подошло другим полям: так сервис, который только перекладывает данные, не теряет незнакомое. Цена: десериализация с `flatten` буферизует объект, а `deny_unknown_fields` вместе с ним документация serde называет неподдерживаемым сочетанием.'''

[[exercises]]
name = "srd7"
style = "todo"
kind = "project"
hint.ru = [
  '''`Handle` это структура с одним полем: какой атрибут говорит serde считать её просто этим полем?''',
  '''Для `PostId` понадобится превращение в строку и обратно: `#[serde(into = "..", try_from = "..")]` и два `impl`. Ошибка обратного превращения это любой тип с `Display`.''',
  '''Серде требует `Clone` для `into`, потому что превращает копию. Для `try_from`: `strip_prefix("p_")`, потом `parse`; в тексте ошибки должен быть назван ожидаемый формат `p_<number>`.''',
]
why.ru = '''Newtype serde пишет как внутреннее значение сам. `transparent` даёт то же для структуры с одним именованным полем. Когда внешний вид сильно отличается от внутреннего (число в Rust, префикс на проводе), удобнее описать превращение обычными `From` и `TryFrom`, а serde подключить через `into` и `try_from`: вся логика формата лежит в одном месте и проверяется отдельно.'''

[[exercises]]
name = "srd8"
style = "todo"
kind = "project"
hint.ru = [
  '''`with = "ms"` ищет в модуле `ms` две функции: `serialize` и `deserialize` с определёнными сигнатурами. Они уже объявлены.''',
  '''Запись: у `Serializer` есть методы `serialize_u64` и `serialize_str`. Чтение: прочитай вспомогательно `u64::deserialize(d)?` или `String::deserialize(d)?`.''',
  '''Свои ошибки чтения делай через `D::Error::custom(...)` (нужен `use serde::de::Error`). Для единиц: `strip_suffix('h')`, `strip_suffix('m')`, `strip_suffix('s')`.''',
]
why.ru = '''Модуль с `serialize` и `deserialize` это способ описать формат поля один раз. Функции пишут и читают через `Serializer` и `Deserializer`, а не через `serde_json`, поэтому тот же формат сработает для любого формата данных. Ошибки чтения идут через `custom`: serde сам добавит позицию, а твой текст объясняет, что не так со значением.'''

[[exercises]]
name = "srd9"
style = "fix"
kind = "project"
hint.ru = [
  '''Что именно теряется: JSON, сервер или клиент? Сколько целых чисел точно представимы в `f64`?''',
  '''Если число большое, его отправляют строкой. Читать надо обе формы: строку и число. Подходит `with` на поле и вспомогательный `untagged` enum из двух вариантов.''',
  '''Запись: сериализатору можно отдать число как текст. Чтение: внутри функции `deserialize` заведи маленький `untagged` enum из двух вариантов и посмотри, какой из них сработал (раздел «Большие числа» в README).''',
]
why.ru = '''Сервер и JSON ни при чём: число в тексте записано точно. Теряет точность клиент, у которого нет отдельного 64-битного целого. Поэтому на границе с JavaScript идентификаторы и деньги в минимальных единицах отправляют строкой. Читать лучше обе формы: так обновление не ломает кэш, в котором остались старые числа.'''

[[exercises]]
name = "srd10"
style = "todo"
kind = "project"
hint.ru = [
  '''`Value` индексируется ключами `doc["post"]`; отсутствующий ключ даёт `Null`, поэтому цепочка `doc["a"]["b"]["c"]` не паникует.''',
  '''Запись в `doc["stats"]["likes"] = ...` создаёт недостающие объекты, если `doc` объект или `Null`.''',
  '''`json!({ ... })` собирает значение; в него можно вставлять переменные. Для типизированных значений есть `from_value` и `to_value`.''',
]
why.ru = '''`Value` нужен, когда форма JSON заранее неизвестна или не важна. Индексирование не паникует, а `as_str` и `as_u64` возвращают `Option`, поэтому путь к вложенному полю проверяется одной цепочкой. Типизированные структуры проще и безопаснее, поэтому `Value` держат на границе, а внутри программы переходят к своим типам через `from_value`.'''

[[exercises]]
name = "srd11"
style = "scratch"
kind = "project"
hint.ru = [
  '''План на `decode`: сначала `from_str::<Request>`, потом `match` по `method`, и в каждой ветке свой тип данных.''',
  '''Три маленьких структуры данных (`RegisterData`, `CreatePostData`, `FollowData`) и общая функция `data::<T>(method, value)`, которая собирает ошибку `BadData`.''',
  '''`serde_json::from_value::<T>(value)` разбирает `Value` в тип. Метод для сообщений об ошибке берётся до того, как `data` перемещается.''',
]
why.ru = '''Двухэтапный разбор нужен потому, что тип `data` зависит от соседнего поля `method`. Сначала читаем конверт с `Value` внутри, и ошибка конверта отдельная. Потом выбираем тип по методу, и ошибка данных несёт имя метода: клиенту важно знать, в каком запросе он ошибся. Неизвестный метод это третья, тоже ожидаемая ошибка, а не паника.'''

[[exercises]]
name = "srd12"
style = "bughunt"
kind = "project"
hint.ru = [
  '''Где в `decode` падает поток и почему? Найди все `unwrap`, `panic!` и `clone`.''',
  '''`Deserialize::deserialize` умеет читать прямо из `&Value`: копировать `data` ради `from_value` не нужно. Ошибку преврати в `BadData` через `map_err`.''',
  '''Обе ветки читают данные одинаково, поэтому общая обобщённая функция, которая принимает `&Value`, уберёт повторение. Ошибку serde превращай в `BadData` на месте.''',
]
why.ru = '''`&Value` сам реализует `Deserializer`, поэтому `T::deserialize(&request.data)` читает дерево по ссылке без копии. Паника на `unwrap` в разборе чужих данных означает, что один клиент может ронять сервис, а паника на неизвестном методе ломает совместимость с будущими версиями. Оба случая ожидаемые, и им место в `Result`.'''

[[exercises]]
name = "srd13"
style = "todo"
kind = "project"
hint.ru = [
  '''Какие операции делает каждая функция с `T`: пишет, читает, пишет и читает? Это и есть границы.''',
  '''`encode` только пишет: `T: Serialize`. `decode` создаёт `T` из строки, которая живёт только внутри вызова: нужен `DeserializeOwned`.''',
  '''`roundtrip` требует обе границы сразу. Внутри: `encode`, потом `decode::<T>` на получившейся строке, и из конверта достаётся `data`.''',
]
why.ru = '''Границы на `T` это то, что функция реально использует. Для записи достаточно `Serialize`. Для чтения, где `T` не должен держать ссылку на входную строку, пишут `DeserializeOwned`: это то же самое, что `for<'de> Deserialize<'de>`, «разбирается из любого источника, ничего не заимствуя». Если функция сама создаёт строку и отдаёт `T` наружу, другого варианта нет.'''

[[exercises]]
name = "srd14"
style = "fix"
kind = "project"
hint.ru = [
  '''Что обещает `T: Deserialize<'a>` и кому? Читай сообщение компилятора про `body`.''',
  '''Тело ответа живёт только внутри метода. Какой вариант границы запрещает `T` ссылаться на входную строку?''',
  '''Нужна граница «значение не ссылается на входную строку». У serde для неё есть готовый трейт-синоним; когда он подключён, параметр времени жизни не нужен.''',
]
why.ru = '''`Deserialize<'a>` разрешает `T` ссылаться на входные данные, а они живут `'a`. Метод, который сам создаёт строку и сразу её освобождает, такого обещания дать не может. `DeserializeOwned` значит «после разбора строка не нужна», и компилятор проверяет это за тебя. Когда нужно заимствование, исходные данные должны жить у вызывающего, как в следующей задаче.'''

[[exercises]]
name = "srd15"
style = "todo"
kind = "project"
hint.ru = [
  '''`&str` в структуре заимствует автоматически, а `Cow` нет: serde по умолчанию читает его в `Cow::Owned`.''',
  '''Атрибут для поля, которое должно заимствовать, когда это возможно: `#[serde(borrow)]`.''',
  '''Функции разбора тривиальны. Главное в атрибутах на `author` и `body`.''',
]
why.ru = '''Без `#[serde(borrow)]` поле `Cow` всегда становится `Owned`: код работает, а экономии нет. С атрибутом serde отдаёт срез исходной строки, если в тексте нет экранирования, и копирует, если есть. Структура с заимствованием привязана к исходной строке: пока живёт `PostRef`, живёт и строка JSON.'''

[[exercises]]
name = "srd16"
style = "bughunt"
kind = "project"
hint.ru = [
  '''Прочитай текст ошибки: «expected a borrowed string». Что в JSON `"a\nb"` отличается от среза исходной строки?''',
  '''Заимствовать можно только неизменённые байты. Тип, который умеет и заимствовать, и владеть: `Cow<'a, str>`.''',
  '''Тип поля должен уметь и заимствовать, и владеть, а serde нужно прямо сказать, что заимствовать надо, когда возможно.''',
]
why.ru = '''`&str` в структуре означает «срез исходного JSON без копирования». Как только в строке есть экранированный символ, такой срез невозможен: в исходнике записаны два знака `\n`, а нужен один настоящий перевод строки. `Cow` решает проблему: обычные строки по-прежнему не копируются, сложные копируются по необходимости. Тесты проверяют указатели, поэтому «просто `String`» не засчитывается.'''

[[exercises]]
name = "srd17"
style = "todo"
kind = "project"
hint.ru = [
  '''У `serde_json::Error` есть метод `classify()` и методы `line()` и `column()`. Какие категории бывают?''',
  '''Конец текста, не JSON и неподходящая форма это три разные реакции для клиента. Четвёртая категория, ввод-вывод, при чтении из строки невозможна.''',
  '''Для причины возьми `e.to_string()` и отрежь хвост ` at line `: `rsplit_once(" at line ")`.''',
]
why.ru = '''Одна строка ошибки смешивает три вопроса: что не так (категория), где (строка и столбец) и почему (причина). Для API их лучше разделить, чтобы клиент мог подсветить место, а сообщение осталось читаемым. `classify` отвечает на первый вопрос без разбора текста, а хвост про позицию отрезаем только у ошибок формы, где позиция уже хранится отдельно.'''

[[exercises]]
name = "srd_contracts"
style = "scratch"
kind = "project"
quiz = true
locked = ["crates/contracts/tests/acceptance.rs"]
hint.ru = [
  '''Начни с `ids.rs`: два типа почти одинаковые, общая вспомогательная функция разбора префикса сэкономит код. Потом `error.rs`: `Display` и `to_body`, затем `envelope.rs`.''',
  '''`Response<T>` с `flatten` и enum `Outcome<T>` с `rename_all = "snake_case"` даёт плоские `ok` и `error`. Для разбора конверта используй `ContractError::from_json` по `classify`: обрыв, синтаксис, форма.''',
  '''`decode_call` читает `data` по ссылке: `T::deserialize(&request.data)`. Причина ошибки это текст serde без хвоста ` at line .. column ..` (`rsplit_once`). Для `Envelope<T>`: `DeserializeOwned` в `decode`.''',
]
why.ru = '''Весь крейт это приём «контракт отдельно от всего остального»: типы ходят по сети одним и тем же способом, ошибки различимы машиной (`code`) и понятны человеку (`message`), а идентификаторы не теряются на JavaScript. Тест проверяет и общие вещи (поля, теги), и мелочи: хвост позиции убран из причины, большой идентификатор не теряет точность, неизвестный метод не роняет разбор.'''

[[exercises]]
name = "srd_q1"
kind = "question"
question.ru = '''Что напечатает программа?
```rust
use serde::Serialize;

#[derive(Serialize)]
#[serde(rename_all = "camelCase")]
struct Event { user_id: u64, kind: Kind }

#[derive(Serialize)]
enum Kind { PostCreated }

fn main() {
    println!("{}", serde_json::to_string(&Event { user_id: 1, kind: Kind::PostCreated }).unwrap());
}
```'''
options.ru = [
  "{\"userId\":1,\"kind\":\"postCreated\"}",
  "{\"userId\":1,\"kind\":\"PostCreated\"}",
  "{\"user_id\":1,\"kind\":\"PostCreated\"}",
  "{\"userId\":1,\"kind\":{\"PostCreated\":null}}",
]
answer = [1]
explain.ru = '''`rename_all` на структуре переименовывает поля этой структуры и больше ничего: имена вариантов вложенного enum остаются как есть. Чтобы получить `postCreated`, `rename_all = "camelCase"` нужно поставить и на `Kind`. Вариант без данных внешним тегом записывается просто строкой, а не `{"PostCreated":null}`.'''
hint.ru = '''На что именно действует `rename_all`: на поля структуры или на всё дерево типов?'''

[[exercises]]
name = "srd_q2"
kind = "question"
question.ru = '''Структура разбирается из JSON. Какие входные строки разберутся без ошибки? Выбери все.
```rust
#[derive(Deserialize)]
struct Query {
    q: String,
    page: Option<u32>,
    limit: u32,
    #[serde(default)]
    tags: Vec<String>,
}
```
Входы:'''
options.ru = [
  "{\"q\":\"a\",\"limit\":5}",
  "{\"q\":\"a\",\"page\":null,\"limit\":5}",
  "{\"q\":\"a\",\"page\":2}",
  "{\"q\":\"a\",\"limit\":5,\"tags\":null}",
]
answer = [0, 1]
explain.ru = '''`Option` без `default` serde считает необязательным: отсутствие ключа и `null` дают `None`. Для `limit` значение обязательно, поэтому третий вход падает. `default` на `tags` покрывает отсутствие ключа, но не `null`: `null` не список, и это ошибка типа. Чтобы принимать и `null`, нужен свой `deserialize_with`.'''
hint.ru = '''Чем отсутствие ключа отличается от значения `null` для `Option` и для `Vec`?'''

[[exercises]]
name = "srd_q3"
kind = "question"
question.ru = '''Что напечатает программа?
```rust
#[derive(Debug, Deserialize)]
#[serde(untagged)]
enum Shape {
    Point { x: i32, y: i32 },
    Labeled { x: i32, y: i32, label: String },
}

fn main() {
    let shape: Shape = serde_json::from_str(r#"{"x":1,"y":2,"label":"a"}"#).unwrap();
    println!("{shape:?}");
}
```'''
options.ru = [
  "Labeled { x: 1, y: 2, label: \"a\" }",
  "ошибка: лишнее поле label",
  "Point { x: 1, y: 2 }",
  "ошибка: вариант неоднозначен",
]
answer = [2]
explain.ru = '''`untagged` пробует варианты по порядку и берёт первый подошедший, а лишние поля serde по умолчанию игнорирует. `Point` подходит, поэтому `label` молча теряется. Поменяй варианты местами или запрети лишнее через `deny_unknown_fields` на `Point`.'''
hint.ru = '''В каком порядке `untagged` пробует варианты и что делает с лишними полями?'''

[[exercises]]
name = "srd_q4"
kind = "question"
question.ru = '''Что вернёт запись в JSON?
```rust
#[derive(Serialize)]
#[serde(tag = "kind")]
enum Msg {
    Count(u32),
    Text { body: String },
}

let result = serde_json::to_string(&Msg::Count(5));
```'''
options.ru = [
  "Ok со строкой {\"Count\":5}",
  "Err: тег нельзя положить рядом с голым числом, а объекта для него нет",
  "Ok со строкой {\"kind\":\"Count\",\"0\":5}",
  "Ok со строкой {\"kind\":\"Count\"}",
]
answer = [1]
explain.ru = '''Внутренний тег живёт внутри объекта, а число им не является. Для варианта-кортежа с примитивом serde не может вставить `kind` и возвращает ошибку при записи (при этом сам derive компилируется). Вариант-структура (`Text { body }`) или соседний тег (`tag` плюс `content`) такой проблемы не имеют.'''
hint.ru = '''Внутрь чего serde должен положить поле `kind`, если данные варианта это одно число?'''

[[exercises]]
name = "srd_q5"
kind = "question"
question.ru = '''JavaScript-клиент читает JSON-числа как дробные двойной точности. Какие из этих идентификаторов он прочитает неточно?'''
options.ru = [
  "9007199254740991",
  "9007199254740992",
  "9007199254740993",
  "9007199254740994",
]
answer = [2]
explain.ru = '''Дробное число двойной точности хранит целые точно до 2^53 включительно (это 9007199254740992), а выше представима только половина целых. 9007199254740993 это 2^53 + 1, ближайшее представимое значение 9007199254740992 или ...994, и клиент получает не тот id. Поэтому идентификаторы и деньги в минимальных единицах отправляют строкой.'''
hint.ru = '''Сколько бит в мантиссе дробного числа двойной точности?'''

[[exercises]]
name = "srd_q6"
kind = "question"
question.ru = '''Что напечатает программа?
```rust
use std::borrow::Cow;

#[derive(Deserialize)]
struct Tag<'a> {
    name: Cow<'a, str>,
}

fn main() {
    let raw = String::from(r#"{"name":"rust"}"#);
    let tag: Tag = serde_json::from_str(&raw).unwrap();
    println!("{}", matches!(tag.name, Cow::Borrowed(_)));
}
```'''
options.ru = [
  "true",
  "ошибка компиляции",
  "паника при разборе",
  "false",
]
answer = [3]
explain.ru = '''Для `Cow` serde по умолчанию создаёт `Cow::Owned`: заимствование включается только атрибутом `#[serde(borrow)]` на поле. Код при этом компилируется и работает, просто молча копирует каждую строку. Для `&str` заимствование включено само.'''
hint.ru = '''Умеет ли serde по умолчанию отдавать `Cow::Borrowed`?'''

[[exercises]]
name = "srd_q7"
kind = "question"
question.ru = '''Какая из функций не соберётся?
```rust
fn a<'x, T: Deserialize<'x>>() -> T {
    let s = String::from("1");
    serde_json::from_str(&s).unwrap()
}
fn b<T: DeserializeOwned>(s: &str) -> T { serde_json::from_str(s).unwrap() }
fn c<'x, T: Deserialize<'x>>(s: &'x str) -> T { serde_json::from_str(s).unwrap() }
fn d<T: DeserializeOwned>() -> T {
    let s = String::from("1");
    serde_json::from_str(&s).unwrap()
}
```'''
options.ru = [
  "a",
  "b",
  "c",
  "d",
]
answer = [0]
explain.ru = '''`a` обещает вернуть `T`, который может ссылаться на данные `'x`, а читает из локальной строки, которая умрёт на выходе. `d` честно требует `DeserializeOwned`: `T` ничего не заимствует. `c` тоже корректна: строка приходит снаружи и живёт `'x`. Правило: сам создал строку, значит нужен `DeserializeOwned`.'''
hint.ru = '''Откуда берётся строка в каждой функции и кто её переживёт?'''

[[exercises]]
name = "srd_q8"
kind = "question"
question.ru = '''Что напечатает программа?
```rust
let v: serde_json::Value = serde_json::from_str(r#"{"a":1}"#).unwrap();
println!("{}", v["a"]["b"]);
```'''
options.ru = [
  "1",
  "panic: нет ключа b",
  "ошибка компиляции",
  "null",
]
answer = [3]
explain.ru = '''Индексирование `Value` по ключу не паникует: если значение не объект или ключа нет, получается `Null`. Поэтому глубокие цепочки `doc["a"]["b"]["c"]` безопасно читать, а проверку делают через `as_str`, `as_u64` и другие методы, возвращающие `Option`. Паникует только запись по индексу, когда значение неподходящего вида.'''
hint.ru = '''Что `Value` возвращает вместо ошибки, когда пути нет?'''

[[exercises]]
name = "srd_q9"
kind = "question"
question.ru = '''Что вернёт разбор пустого объекта?
```rust
#[derive(Deserialize)]
struct S {
    #[serde(skip_serializing_if = "Option::is_none")]
    a: Option<u8>,
    #[serde(skip_serializing_if = "Vec::is_empty")]
    b: Vec<u8>,
}

let r = serde_json::from_str::<S>("{}");
```'''
options.ru = [
  "Ok: оба поля пустые",
  "Err: missing field `b`",
  "Err: missing field `a`",
  "Err: обе жалобы сразу",
]
answer = [1]
explain.ru = '''`skip_serializing_if` влияет только на запись. Читать отсутствующее поле помогает `default`, а `Option` особый случай: serde сам подставляет `None`. У `Vec` такого нет, поэтому ошибка про `b`. Парой «не пишем пустое» и «читаем отсутствие» всегда идут `skip_serializing_if` и `default`.'''
hint.ru = '''Что из этих двух атрибутов отвечает за чтение?'''

