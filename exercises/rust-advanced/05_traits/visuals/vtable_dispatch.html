<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Толстый указатель и таблица методов</title>
<style>
:root{--bg:#fafaf7;--fg:#1d1d1b;--mut:#6b6b66;--card:#fff;--line:#c9c7bd;--acc:#c2410c;--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;--warn:#a16207;--warnbg:#fef9c3;--btn:#1d1d1b;--btnfg:#fff;--hot:#fff1e6}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--fg:#ecebe6;--mut:#9a9a92;--card:#201f1d;--line:#46443f;--acc:#fb923c;--ok:#4ade80;--okbg:#14301d;--bad:#f87171;--badbg:#3a1a1a;--warn:#facc15;--warnbg:#3a3312;--btn:#ecebe6;--btnfg:#161614;--hot:#33241a}}
*{box-sizing:border-box}
body{margin:0;padding:20px;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 14px}
.panel{max-width:860px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.code{font:13px ui-monospace,Menlo,Consolas,monospace;white-space:pre;margin:0 0 10px}
.code .hl{background:var(--hot);color:var(--acc);display:inline-block;width:100%%}
.vars{display:flex;gap:10px;flex-wrap:wrap}
.v{font:13px ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--line);border-radius:8px;padding:8px 12px;min-width:150px;transition:all .3s}
.v small{display:block;color:var(--mut);font:12px system-ui,sans-serif}
.v.ref{border-color:var(--warn);background:var(--warnbg)}
.v.mut{border-color:var(--bad);background:var(--badbg)}
.v.moved{border-color:var(--ok);background:var(--okbg);opacity:.8}
.v.free{border-color:var(--line)}
.rows{margin-top:6px}
.row{display:flex;gap:10px;align-items:center;font:13px ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--line);border-radius:8px;padding:7px 10px;margin:6px 0;transition:all .3s}
.row.ok{border-color:var(--ok);background:var(--okbg)}
.row.no{border-color:var(--bad);background:var(--badbg)}
.row .tag{margin-left:auto;font:12px system-ui,sans-serif;color:var(--mut)}
.note{margin:12px 0;padding:12px 14px;border-left:4px solid var(--acc);background:var(--card);border-radius:0 8px 8px 0;min-height:76px;max-width:860px}
.bar2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:860px}
button{font:inherit;padding:7px 14px;border-radius:8px;border:0;background:var(--btn);color:var(--btnfg);cursor:pointer}
button.alt{background:transparent;color:var(--fg);border:1px solid var(--line)}
button:disabled{opacity:.4;cursor:default}
.cnt{color:var(--mut);margin-left:auto}
</style>
</head>
<body>
<h1>Толстый указатель и таблица методов</h1>
<p class="sub">Тип значения забыт, но вызвать метод всё равно можно: адрес метода лежит в таблице рядом с указателем.</p>
<div class="panel" id="panel"></div>
<div class="note" id="note"></div>
<div class="bar2">
  <button id="step">Шаг</button>
  <button id="play" class="alt">Играть</button>
  <button id="reset" class="alt">Сначала</button>
  <span class="cnt" id="cnt"></span>
</div>
<script>

const steps=[
 {sel:-1,note:'Есть два конкретных типа с одним трейтом Exporter и список Vec<Box<dyn Exporter>>. В списке лежат толстые указатели: адрес данных и адрес таблицы методов.'},
 {sel:0,note:'Первый элемент указывает на CsvExporter и на таблицу для пары (CsvExporter, Exporter). Данные в куче, таблица одна на тип, в статической памяти.'},
 {sel:1,note:'Вызов e.export(rows): берём из таблицы адрес метода export и прыгаем туда, передавая адрес данных. Для CSV это CsvExporter::export.'},
 {sel:2,note:'Второй элемент указывает на другие данные и на другую таблицу. Код вызова тот же самый, а выполняется JsonExporter::export. Это и есть динамическая диспетчеризация.'},
 {sel:3,note:'Размер указателя два слова (данные и таблица), а размер самого значения мог быть любым. Поэтому dyn Trait всегда за указателем: &dyn, Box<dyn>, Arc<dyn>.'}
];
const items=[
 {a:'Box<dyn Exporter> #0',d:'данные: CsvExporter { sep: ";" }',v:'vtable(Csv): drop, size, align, export -> Csv::export'},
 {a:'Box<dyn Exporter> #1',d:'данные: JsonExporter { pretty: true }',v:'vtable(Json): drop, size, align, export -> Json::export'}
];
function render(){
  const s=steps[i];
  let h='<div class="rows">';
  items.forEach((it,k)=>{
    const active=(s.sel===1&&k===0)||(s.sel===2&&k===1)||(s.sel===0&&k===0);
    h+='<div class="row'+(active?' ok':'')+'"><span>'+it.a+'</span><span class="tag">два слова: data ptr + vtable ptr</span></div>';
    h+='<div class="row'+(active?' ok':'')+'" style="margin-left:28px"><span>'+it.d+'</span></div>';
    h+='<div class="row'+(active&&s.sel>=1?' ok':'')+'" style="margin-left:28px"><span>'+it.v+'</span></div>';
  });
  h+='</div>';
  if(s.sel===3)h+='<div class="rows"><div class="row"><span>size_of::&lt;&amp;dyn Exporter&gt;() == 2 * size_of::&lt;usize&gt;()</span></div></div>';
  document.getElementById('panel').innerHTML=h;
}

let i=0,timer=null;
function stop(){if(timer){clearInterval(timer);timer=null;}document.getElementById('play').textContent='Играть';}
function frame(){render();document.getElementById('note').textContent=steps[i].note;document.getElementById('cnt').textContent='шаг '+(i+1)+' из '+steps.length;document.getElementById('step').disabled=i>=steps.length-1;if(i>=steps.length-1)stop();}
document.getElementById('step').onclick=()=>{if(i<steps.length-1){i++;frame();}};
document.getElementById('reset').onclick=()=>{stop();i=0;frame();};
document.getElementById('play').onclick=()=>{if(timer){stop();return;}if(i>=steps.length-1){i=0;frame();}document.getElementById('play').textContent='Пауза';timer=setInterval(()=>{if(i<steps.length-1){i++;frame();}else stop();},3000);};
frame();
</script>
</body>
</html>
