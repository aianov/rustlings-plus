hint.ru = ["""Начни с `IntoResponse`: пять маленьких реализаций, потом `Context`. Они независимы и проверяются первыми. `Bus` оставь на конец.""", """Для таблицы нужен свой внутренний трейт с одним методом `call(&self, ctx, args) -> Response`, `Send + Sync`. Обёртка `FnHandler<F>` реализует его для любого подходящего замыкания (параметр `R` возьми из границы `F`). Контекст это `HashMap<TypeId, Box<dyn Any + Send + Sync>>`.""", """В `Context::insert` старое значение достаётся приведением ящика вниз до `T`. Слои хранятся вектором `Box<dyn Layer>` и опрашиваются по порядку до первого `Some`. Результат `Bus::register` это `insert(..).is_some()`."""]
why.ru = """Шина собирает всю главу: обработчики разных типов стираются в `Box<dyn ErasedHandler>`, `IntoResponse` даёт им удобные возвращаемые типы, слои `Layer` ставят проверки перед любой командой, контекст на `TypeId` и `dyn Any` переносит типизированное состояние, а уведомитель лежит в нём как `Arc<dyn Notifier>`. `Send + Sync` по всей цепочке позволяют делить шину между потоками, а контекст у каждого потока свой. Тест в потоках проверяет именно это."""

