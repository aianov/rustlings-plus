[[exercises]]
name = "dyn1"
style = "todo"
hint.ru = """Для каждой скидки нужна своя реализация `Discount`, а функциям достаточно вызывать методы трейта через ящики. Считай целыми числами: размер процентной скидки это `price * p / 100` с отбрасыванием дробной части, цена после неё это вычитание, и оно не должно уходить ниже нуля (`saturating_sub`)."""
why.ru = """`Vec<Box<dyn Discount>>` хранит значения трёх разных типов, и код кассы не знает ни одного из них: он вызывает `apply` и `label` через таблицу методов. Новая скидка добавляется новым типом с реализацией трейта, функции `best_price` и `labels` не меняются. Проценты выше ста и фиксированная скидка больше цены тоже должны давать ноль, а не отрицательное число или переполнение `u64`: поэтому везде `saturating_sub`."""

[[exercises]]
name = "dyn2"
style = "todo"
hint.ru = ["""Три способа держать значение (`&dyn`, `Box<dyn>`, `Arc<dyn>`) отличаются владением, а не способом вызова метода. Для `sizes` подойдёт `std::mem::size_of`.""", """`into_boxed` это `Box::new(g)`: приведение к `Box<dyn Greeter>` происходит само, потому что тип результата указан. Для `share` клонируют `Arc` (указатель), не сам объект.""", """В `pointer_sizes` посчитай `size_of::<&dyn Greeter>()`, `size_of::<Box<dyn Greeter>>()` и `size_of::<&Loud>()`. Сравни: у какого из них один указатель, а у каких два."""]
why.ru = """Ссылка на трейт-объект состоит из двух слов: адрес данных и адрес таблицы методов. Обычная ссылка на конкретный тип хранит один адрес, потому что тип известен при компиляции. `Arc::clone` копирует только указатель и увеличивает счётчик, объект один на всех, поэтому `ptr_eq` у всех копий истинно, а `strong_count` равен числу владельцев."""

[[exercises]]
name = "dyn3"
style = "fix"
hint.ru = ["""`impl Storage` в возвращаемом типе означает один конкретный тип. А здесь в зависимости от строки получается один из двух.""", """Тип результата должен быть одним для обеих веток: используй трейт-объект в ящике и оберни каждую ветку в `Box::new`."""]
why.ru = """`-> impl Trait` обещает один тип, выбранный компилятором, так что ветки `match` с разными типами не собираются. Если выбор происходит во время работы, тип стирают: `Box<dyn Storage>`. Цена выделение в куче и вызов через таблицу методов, но взамен вызывающему не важно, что именно открыли."""

[[exercises]]
name = "dyn_q1"
kind = "question"
question.ru = '''Что скажет компилятор?
```rust
trait Shape { fn area(&self) -> f64; }
struct Circle<'a> { r: &'a f64 }
impl Shape for Circle<'_> { fn area(&self) -> f64 { *self.r } }

fn make(r: &f64) -> Box<dyn Shape> {
    Box::new(Circle { r })
}
```'''
options.ru = ["соберётся: Box владеет кругом", "ошибка: Box<dyn Shape> без пометки значит 'static, а круг держит ссылку на r", "ошибка: Circle не реализует Shape", "соберётся с предупреждением"]
answer = [1]
explain.ru = """В типе возврата `Box<dyn Shape>` по умолчанию означает `Box<dyn Shape + 'static>`: объект не должен содержать ссылок на данные, которые могут исчезнуть. Круг держит `&f64`, поэтому нужно писать `Box<dyn Shape + '_>` (результат живёт не дольше `r`) или клонировать значение внутрь круга."""
hint.ru = """Какое время жизни компилятор подставляет в `Box<dyn Trait>`, если его не указали?"""

[[exercises]]
name = "dyn4"
style = "todo"
hint.ru = ["""`total_generic` и `total_dyn` отличаются только типом среза. Обрати внимание на `largest`: он должен вернуть ссылку на фигуру, лежащую в списке, а не копию.""", """`Box<dyn Shape>` разыменовывается в `dyn Shape`: `boxed.as_ref()` даёт `&dyn Shape`. Для сравнения площадей `f64` используй `total_cmp`, а не `partial_cmp().unwrap()`."""]
why.ru = """Обобщённая версия работает только с однотипным срезом, зато компилятор создаёт под каждый тип свой быстрый код. Версия с `dyn` один раз откомпилирована и принимает смешанный список ценой косвенного вызова. `largest` возвращает `&dyn Shape` с временем жизни списка: никакого копирования, объект остаётся на месте. `total_cmp` даёт полный порядок на `f64` и не паникует на NaN."""

[[exercises]]
name = "dyn_q2"
kind = "question"
question.ru = '''Даны две функции:
```rust
fn total_g<S: Shape>(items: &[S]) -> f64 { .. }
fn total_d(items: &[Box<dyn Shape>]) -> f64 { .. }
```
Какое утверждение верно?'''
options.ru = ["total_g принимает вектор из кругов и квадратов вперемешку", "total_d компилируется в отдельную копию на каждый тип фигуры", "total_g компилируется в отдельную копию на каждый тип S, а total_d в один код с вызовами через таблицу методов", "обе компилируются в одну копию и вызывают методы одинаково"]
answer = [2]
explain.ru = """Обобщённая функция мономорфизируется: на каждый тип `S` свой код с прямыми вызовами, зато срез однотипный. Функция с трейт-объектами одна, срез может быть смешанным, а каждый вызов `area` идёт через таблицу методов. Это и есть выбор между скоростью и гибкостью."""
hint.ru = """Что компилятор делает с `<S: Shape>`, когда видит три разных `S` в программе?"""

[[exercises]]
name = "dyn5"
style = "fix"
hint.ru = ["""Компилятор называет три причины. Все они из одного списка: что мешает построить таблицу методов? Для каждого метода реши, нужен ли он на `dyn Plugin` вообще.""", """Метод, нужный только на конкретных типах (`new`, generic-метод), помечается `where Self: Sized`. Метод, возвращающий `Self`, должен вернуть что-то известного размера: ящик с трейт-объектом."""]
why.ru = """Таблица методов строится для конкретного типа заранее, поэтому в ней не может быть методов без `self` (нечем выбрать таблицу), с `Self` в результате (размер неизвестен) и с generic-параметрами (нужна своя копия на каждый `T`). `where Self: Sized` убирает метод из таблицы, но оставляет его для конкретных типов, и `Echo::new()` продолжает работать. `duplicate` возвращает `Box<dyn Plugin>`: так копию можно сделать и через трейт-объект."""

[[exercises]]
name = "dyn_q3"
kind = "question"
question.ru = '''Какой из трейтов можно использовать как `dyn`?
```rust
trait A { fn make() -> Self; }
trait B { fn same(&self, other: &Self) -> bool; }
trait C { fn run<T: std::fmt::Debug>(&self, t: T); }
trait D { fn size(&self) -> usize; fn double(&self) -> usize where Self: Sized { self.size() * 2 } }
```'''
options.ru = ["A", "B", "C", "D"]
answer = [3]
explain.ru = """В `A` нет `self` и результат `Self`, в `B` аргумент типа `Self`, в `C` generic-метод: ни для одного нельзя построить таблицу методов. У `D` второй метод помечен `where Self: Sized`, он исключается из таблицы, и трейт остаётся совместимым с `dyn`."""
hint.ru = """Какие методы можно вызвать, не зная конкретного типа?"""

[[exercises]]
name = "dyn6"
style = "fix"
hint.ru = ["""`Clone` требует `Sized`, а `dyn Shape` не `Sized`. Значит, `Shape` не может иметь `Clone` супертрейтом. Но копировать `Box<dyn Shape>` всё равно нужно.""", """Вынеси клонирование в отдельный метод, который возвращает `Box<dyn Shape>`, и реализуй его один раз для всех подходящих типов общей реализацией. Затем реализуй `Clone` для `Box<dyn Shape>` вручную через этот метод."""]
why.ru = """Приём «клонируй в ящик»: вспомогательный трейт с методом `clone_box`, одна общая реализация для всех `T: Shape + Clone + 'static` и `impl Clone for Box<dyn Shape>`. Новый тип фигуры получает клонирование бесплатно: достаточно `#[derive(Clone)]`. `Vec<Box<dyn Shape>>` после этого клонируется стандартным `.clone()`, а копии независимы, потому что каждая фигура клонируется как свой настоящий тип."""

[[exercises]]
name = "dyn7"
style = "todo"
hint.ru = ["""Тип результата определяет сам парсер, поэтому он задан ассоциированным типом `Output`. Для списка он собран из выхода вложенного парсера: `Vec<P::Output>`.""", """В `ListParser` можно разобрать каждый кусок вложенным парсером через `.map(..).collect::<Option<Vec<_>>>()`: один `None` превратит в `None` всё. Не забудь пустую строку."""]
why.ru = """С ассоциированным типом у каждого парсера ровно один выходной тип, и вызов `parser.parse(..)` не требует турбофиша или аннотаций. `ListParser<P>` выражает свой выход через выход вложенного парсера, и вложенность работает сколько угодно раз. Сбор в `Option<Vec<_>>` останавливается на первом `None`: «один плохой элемент портит список» записано одной строкой."""

[[exercises]]
name = "dyn8"
style = "todo"
hint.ru = """Константы трейта берутся как `Self::SYMBOL` внутри методов и как `A::TO_BASE` в обобщённых функциях. Реализации перечисляют константы, а умолчания можно просто не писать. Переопределить метод по умолчанию значит написать его в `impl` заново."""
why.ru = """Ассоциированные константы принадлежат типу: `A::TO_BASE` читается без значения, поэтому `convert` не нужны объекты, только их типы. Методы по умолчанию дают общее поведение, а переопределение (здесь запись километров) меняет его точечно. Перевод идёт через метры: к одной базовой единице сводится любая пара без таблицы «из каждой в каждую»."""

[[exercises]]
name = "dyn9"
style = "todo"
hint.ru = """`Animal: Named`, поэтому `&dyn Animal` можно передать туда, где ждут `&dyn Named`: приведение к супертрейту стабильно с Rust 1.86. Реализовать нужно оба трейта для каждого животного."""
why.ru = """Супертрейт значит «любой `Animal` обязан быть `Named`», поэтому методы `Named` доступны и через `dyn Animal`, и `&dyn Animal` приводится к `&dyn Named`. До Rust 1.86 такое приведение приходилось обходить вручную (вспомогательный метод `as_named`), теперь компилятор достраивает нужную таблицу сам. Общие функции вроде `shout_name` пишутся один раз для самого узкого трейта."""

[[exercises]]
name = "dyn_q4"
kind = "question"
question.ru = '''Rust 1.88. Соберётся ли это?
```rust
trait Named { fn name(&self) -> String; }
trait Animal: Named {}

fn label(a: &dyn Animal) -> String {
    let n: &dyn Named = a;
    n.name()
}
```'''
options.ru = ["да, приведение подтрейт-объекта к супертрейту разрешено", "нет: dyn Animal и dyn Named разные типы без приведения", "да, но только для Box, не для ссылок", "нет: у Animal нет своих методов"]
answer = [0]
explain.ru = """С Rust 1.86 стабилизировано приведение трейт-объектов к своим супертрейтам. Раньше надо было добавлять в трейт метод `fn as_named(&self) -> &dyn Named`. Пустое тело `Animal` ни на что не влияет: супертрейт и так наследуется."""
hint.ru = """Это возможность компилятора, а не особенность конкретного трейта."""

[[exercises]]
name = "dyn10"
style = "todo"
hint.ru = ["""Одну реализацию нужно написать сразу для всех типов с нужным свойством. Это записывается обобщённой реализацией с ограничением на параметр.""", """`impl<T: std::fmt::Display> Describe for T { .. }`. Значение внутри форматируй как `format!(\"<{self}>\")`."""]
why.ru = """Общая реализация `impl<T: Display> Describe for T` даёт метод всем типам с `Display`, включая чужие, и её не надо поддерживать при появлении новых. Но она же закрывает дорогу для отдельных реализаций: `impl Describe for u8` теперь конфликтует с общей. Тест проверяет оба следствия: покрытие чужих типов и отказ на чужой реализации для типа с `Display`."""

[[exercises]]
name = "dyn_q5"
kind = "question"
question.ru = '''Есть `impl<T: Display> Describe for T { .. }`. Затем пишут:
```rust
struct Id(u32);
impl Display for Id { .. }
impl Describe for Id { .. }
```
Что получится?'''
options.ru = ["своя реализация для Id переопределит общую", "ошибка: conflicting implementations of trait Describe for type Id", "соберётся, будет вызываться общая реализация", "соберётся, будет паника во время работы"]
answer = [1]
explain.ru = """В Rust нет специализации в стабильной версии: если под тип подходят две реализации трейта, это ошибка. `Id` реализует `Display`, значит, общая реализация к нему применима, и вторая конфликтует. Выход: не писать общую реализацию или отделить логику обёрткой."""
hint.ru = """Может ли компилятор выбрать из двух подходящих реализаций более частную?"""

[[exercises]]
name = "dyn11"
style = "fix"
hint.ru = ["""Ошибка про «only traits defined in the current crate». Оба участника (трейт `Display` и тип `Vec`) чужие. Что можно сделать так, чтобы один из них стал нашим?""", """Заведи свой тип поверх вектора. Чтобы он читался как вектор (`feed.len()`), реализуй `Deref`. Для `Feed::from(vec)` нужна реализация `From`."""]
why.ru = """Правило сироты защищает от конфликтов между крейтами: если бы можно было реализовать чужой трейт для чужого типа, две библиотеки навязали бы разные реализации одному `Vec<Post>`. Newtype делает тип своим. `Deref` возвращает удобство вектора для чтения, а `From` даёт короткое создание. Изменять вектор через `Feed` не получится, и это нормально: интерфейс уже.""" 

[[exercises]]
name = "dyn_q6"
kind = "question"
question.ru = '''Пусть в вашем крейте объявлено `struct Local;`. Какие из реализаций разрешены правилом сироты? (Выбери все подходящие.)'''
options.ru = ["impl Display for Vec<u8>", "impl From<Local> for String", "impl Iterator for Local", "impl PartialEq<Local> for u8", "impl<T> Display for Vec<T>"]
answer = [1, 2, 3]
explain.ru = """Нужно, чтобы хотя бы трейт или тип были твоими, причём свой тип может стоять и в параметре трейта (`From<Local>`, `PartialEq<Local>`). Для `Iterator for Local` свой тип. А `Display` для `Vec<..>` оба чужие, и обобщённость ничего не меняет."""
hint.ru = """Для каждого варианта найди, что здесь из твоего крейта: трейт, тип, либо параметр трейта."""

[[exercises]]
name = "dyn12"
style = "todo"
hint.ru = ["""Чтобы дать методы чужому типу, объявляют свой трейт и реализуют его для этого типа. Для `str` реализация пишется на `str` без ссылки, методы тогда доступны и у `&str`, и у `String`.""", """`or_report` реализуй для `Result<T, E>` с ограничением `E: Display`. Количество символов считай через `chars()`, не через байты."""]
why.ru = """Трейт-расширение даёт чужим типам свои методы и не нарушает правило сироты, потому что трейт наш. Реализация для `str` (без `&`) доступна всем, кто разыменовывается в `str`: `&str`, `String`, `Box<str>`. Обрезка по `chars()` не режет букву посередине, а `or_report` позволяет пройти по списку ошибок «собери все, не останавливайся», передавая журнал явным параметром."""

[[exercises]]
name = "dyn13"
style = "fix"
hint.ru = ["""Две отдельные проблемы. У параметра `N` по умолчанию есть невидимое ограничение, которое мешает принять `&dyn Notifier`. А `Box<dyn Notifier>` и `Arc<dyn Notifier>` сами пока не реализуют трейт.""", """Первое снимается записью `N: Notifier + ?Sized`. Для остального напиши пробрасывающие реализации: `impl<T: Notifier + ?Sized> Notifier for Box<T>` и подобные для `&T` и `Arc<T>`, внутри делегируй `(**self).send(..)`."""]
why.ru = """Параметр типа по умолчанию `Sized`, а `dyn Notifier` нет, поэтому `?Sized` нужен всюду, где функцию зовут с `&dyn`. Пробрасывающие реализации для `&T`, `Box<T>`, `Arc<T>` делают обёртки полноправными уведомителями: их можно передать в обобщённую функцию по значению. Так устроена стандартная библиотека для `Read`, `Write` и `Iterator`. Без `+ ?Sized` в этих реализациях они не покрыли бы самые интересные случаи, `T = dyn Notifier`."""

[[exercises]]
name = "dyn_q7"
kind = "question"
question.ru = '''Что скажет компилятор?
```rust
fn show<T: std::fmt::Display>(x: &T) -> String { x.to_string() }

fn main() {
    println!("{}", show("hi"));
}
```'''
options.ru = ["напечатает hi", "ошибка: размер str неизвестен, T здесь равно str", "ошибка: &str не реализует Display", "ошибка: нужен явный тип show::<&str>"]
answer = [1]
explain.ru = """Аргумент это `&str`, значит, `&T = &str`, а `T = str`. У `str` нет размера при компиляции, а параметр по умолчанию `Sized`. Исправляется `T: Display + ?Sized`. Альтернатива `show::<&str>(&"hi")` работает, но неудобна."""
hint.ru = """Если параметр функции `&T`, а передали `&str`, чему равно `T`?"""

[[exercises]]
name = "dyn14"
style = "todo"
hint.ru = ["""Объект один, владельцев много: нужен `Arc`. Выбор типа идёт по имени из строки, значит, трейт-объект. `pick` должен делить владение с переданными указателями, а не создавать новые хранилища.""", """В `pick` клонируй `Arc` нужного хранилища и приведи к `Arc<dyn Notifier + Send + Sync>` (`as` или аннотация типа). В `fan_out` клонируй `Arc` для каждого потока до `spawn`, потоки запусти все сразу и только потом дожидайся. Имена и текст приходят заимствованными, а `thread::spawn` берёт только `'static`: либо скопируй их в `String` до `spawn`, либо используй `std::thread::scope`."""]
why.ru = """`Arc<dyn Notifier + Send + Sync>` решает три задачи: один объект на многих владельцев, любая реализация, безопасная передача в потоки. Приведение клона `Arc<Mailbox>` к трейт-объекту не копирует хранилище: счётчик ссылок растёт, данные те же, и проверка `strong_count` это видит. Потоки запускаются все до первого `join`, иначе рассылка пошла бы по очереди."""

[[exercises]]
name = "dyn15"
style = "fix"
hint.ru = ["""Прочитай, что компилятор говорит про `dyn Notifier` и `Send`. Ограничение можно указать везде, где пишется `Arc<dyn Notifier + ..>`, но тест требует более сильную гарантию: тип с `Rc` вообще не должен мочь реализовать трейт.""", """Поставь `Send + Sync` супертрейтами самого `Notifier`. Тогда они действуют для любых реализаций и любых `dyn Notifier` автоматически."""]
why.ru = """Ограничения в сигнатуре (`dyn Notifier + Send + Sync`) нужно повторять во всех местах, и забытое выдаёт ошибку далеко от причины. Супертрейты `Send + Sync` в определении трейта делают гарантию частью контракта: любой `dyn Notifier` потокобезопасен, а реализовать трейт для типа с `Rc` внутри компилятор просто не позволит. Цена: трейт больше не годится для однопоточных типов с `Rc` и `RefCell`."""

[[exercises]]
name = "dyn_q8"
kind = "question"
question.ru = '''Чем отличается `trait Notifier: Send + Sync` от того, что везде пишут `dyn Notifier + Send + Sync`?'''
options.ru = ["ничем, это два способа записать одно и то же", "в первом случае реализовать трейт для типа с Rc нельзя, во втором можно, но такой объект не передашь в поток", "во втором случае нельзя использовать Arc", "в первом случае трейт нельзя использовать как dyn"]
answer = [1]
explain.ru = """Супертрейты проверяются при каждой реализации: тип с `Rc` внутри не `Send`, и `impl Notifier for Local` не соберётся. Вариант «в сигнатуре» оставляет трейт нейтральным: `Local` реализовать можно, пользоваться им в одном потоке тоже, а в `Arc<dyn Notifier + Send + Sync>` такой объект не положить. Это вопрос того, где ты хочешь узнать об ошибке."""
hint.ru = """Где в каждом из двух вариантов проверяется потокобезопасность?"""

[[exercises]]
name = "dyn16"
style = "todo"
hint.ru = ["""Прочитай ошибку про время жизни: результат ссылается на `prefix`, а тип `Box<dyn Transform>` без пометок утверждает, что ссылок нет.""", """Укажи время жизни в типе: `Box<dyn Transform + 'a>`. Реализацию трейта для `Prefixer<'_>` напиши как обычно."""]
why.ru = """`Box<dyn Trait>` без пометки означает `'static`, и это правильный выбор для хранилищ и реестров. Если объект держит ссылку, в типе так и пишут: `Box<dyn Transform + 'a>`, и результат нельзя использовать после того, как исчез префикс. Заметь, что в одном срезе с `'_` уживаются и заимствующие, и владеющие объекты: короткое время жизни подходит и тем, и другим."""

[[exercises]]
name = "dyn17"
style = "fix"
hint.ru = ["""Вектор `Vec<Box<dyn Validator>>` внутри `Registry` без пометки хранит только `'static` объекты. А `Banned` держит ссылку. Что надо сказать про реестр, чтобы он мог содержать заимствования?""", """Реестр получает параметр времени жизни: `Registry<'a>`, а в поле `Box<dyn Validator + 'a>`. Метод `add` принимает `impl Validator + 'a`."""]
why.ru = """Параметр времени жизни у реестра честно сообщает, что он не может пережить данные, на которые ссылаются его проверки: компилятор не даст использовать реестр после того, как исчезло запрещённое слово. Реестр с `'static` проверками это частный случай, где `'a = 'static`. Тест также проверяет, что реестр можно заполнять из вспомогательной функции с тем же временем жизни."""

[[exercises]]
name = "dyn18"
style = "todo"
hint.ru = ["""Ключ карты это `TypeId::of::<T>()`, значение `Box<dyn Any>`. При чтении нужен путь обратно из `dyn Any` в конкретный `T`.""", """`downcast_ref::<T>()` и `downcast_mut::<T>()` работают на `dyn Any`. Они дают ссылки. Для `insert` и `remove`, которые возвращают значение по владению, нужен метод приведения у самого `Box<dyn Any>`: загляни в его документацию."""]
why.ru = """`TypeId` делает тип ключом, а `dyn Any` позволяет хранить значения любых типов и вернуть их обратно `downcast`-ом. Приведение безопасно: если тип не совпал, получим `None`, а не неопределённое поведение. В карте не бывает двух значений одного типа, поэтому `insert` заменяет старое и отдаёт его. Так устроены «расширения» запроса в веб-фреймворках."""

[[exercises]]
name = "dyn19"
style = "bughunt"
hint.ru = ["""Код выглядит правильно: тип значения сравнивается с типом `T`. Но чей именно `type_id()` вызывается? Посмотри на тип параметра `value`.""", """У `&Box<dyn Any>` метод `type_id` находится у самого `Box`, потому что `Box<dyn Any>` тоже `Any`. Надо вызвать метод у содержимого: через `&dyn Any`."""]
why.ru = """Метод `type_id` есть у любого `'static`-типа, в том числе у `Box<dyn Any>`. Автоподстановка выбирает ближайший: для `&Box<dyn Any>` это сам ящик, поэтому `TypeId` оказывается ящика, и сравнение с `TypeId::of::<T>()` всегда ложно. Помогает принять `&dyn Any` (содержимое), либо разыменовать: `(**value).type_id()`. `downcast_ref` знает об этой ловушке и работает верно."""

[[exercises]]
name = "dyn_q9"
kind = "question"
question.ru = '''Что напечатает программа?
```rust
use std::any::{Any, TypeId};
let b: Box<dyn Any> = Box::new(5i32);
println!("{}", b.type_id() == TypeId::of::<i32>());
println!("{}", (*b).type_id() == TypeId::of::<i32>());
```'''
options.ru = ["true, true", "false, true", "true, false", "false, false"]
answer = [1]
explain.ru = """В первой строке `type_id()` вызывается у самого `Box<dyn Any>`, который тоже `Any`, и возвращает `TypeId` ящика. Во второй `*b` это содержимое `dyn Any`, и вызов идёт по таблице методов объекта, возвращая `TypeId` числа. Поэтому при ручном сравнении `TypeId` брать его надо у содержимого, а не у ящика."""
hint.ru = """Для какого типа вызывается метод в первой строке: для ящика или для содержимого?"""

[[exercises]]
name = "dyn20"
style = "todo"
hint.ru = ["""Таблице нужны обработчики одного типа, а у функций и замыканий типы разные. `FnHandler<F>` реализует `Handler` для любого подходящего `F`, и ящик с ним становится `Box<dyn Handler>`.""", """Реализация: `impl<F: Fn(&Request) -> Response> Handler for FnHandler<F>`; вызов `(self.0)(request)`. В `add` сначала оберни в `FnHandler`, потом в `Box::new`. Запрос в `dispatch` построй из пути."""]
why.ru = """Стирание типа превращает разнородные функции в однородные объекты: `FnHandler<F>` знает конкретный `F`, а `Box<dyn Handler>` его забывает. Таблица не знает ничего про замыкания, а замыкания ничего не знают про таблицу. Граница `'static` в `add` не даёт сунуть в таблицу замыкание, которое ссылается на локальную переменную, пережив её."""

[[exercises]]
name = "dyn21"
style = "todo"
hint.ru = ["""Реализации `IntoResponse` не связаны друг с другом: каждая превращает свой тип в `Response`. Для `Result` пригодится рекурсия по трейту (`T` и `E` сами `IntoResponse`).""", """Реализация `Handler` для `FnHandler<F>` вводит свой параметр `R` и связывает его границами `F: Fn(&Request) -> R` и `R: IntoResponse`. Результат вызова остаётся превратить в `Response`."""]
why.ru = """`IntoResponse` позволяет обработчикам возвращать удобные типы, а таблице работать с одним `Response`. Структуре параметр `R` не нужен: в `impl<F, R> Handler for FnHandler<F>` его определяет граница `F: Fn(&Request) -> R`, а лишний параметр в самой структуре пришлось бы закреплять `PhantomData`. Правило «ошибка без статуса это 500» оставляет смысл ответа и у вложенных `Result`."""

[[exercises]]
name = "dyn22"
style = "fix"
hint.ru = ["""Прочитай сообщение о конфликте: оно упоминает, что в будущем у `Vec<T>` может появиться `Display`. Значит, две общие реализации нельзя оставить вместе.""", """Вынеси реализацию для `Debug` в отдельный тип-обёртку `Debugged<T>(pub T)`: у неё нет общего с первой реализацией."""]
why.ru = """Две общие реализации одного трейта конфликтуют, если компилятор не может доказать, что множества типов не пересекаются. Даже для чужого `Vec<T>` он допускает, что `Display` когда-нибудь появится. Маркер `Debugged<T>` создаёт новый тип, который по определению не пересекается ни с чем. Платой становится явное оборачивание на месте использования, но поведение выбрано явно, а не угадано."""

