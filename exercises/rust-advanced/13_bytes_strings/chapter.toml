[[exercises]]
name = "byt1"
style = "todo"
hint.ru = '''Длина строки в байтах это `len()`. А что нужно, чтобы посчитать символы? Какой итератор отдаёт смещение вместе с символом?'''
why.ru = '''`len()` у `str` считает байты, а `chars().count()` символы: это разные числа, как только в тексте не ASCII. `char_indices` отдаёт пары (смещение, символ) и удобен всегда, когда нужен и сам символ, и его место в байтовой строке. `len_utf8` у `char` говорит, сколько байт он займёт.'''

[[exercises]]
name = "byt_q1"
kind = "question"
question.ru = '''Что напечатает программа?
```rust
let s = "привет";
let e = "👍";
println!("{} {} {}", s.len(), s.chars().count(), e.len());
```'''
options.ru = [
  "6 6 1",
  "12 6 4",
  "12 12 4",
  "6 12 2",
]
answer = [1]
explain.ru = '''Каждая кириллическая буква занимает в UTF-8 два байта: шесть букв дают 12 байт, но символов остаётся 6. Эмодзи «большой палец» это один символ и четыре байта. `len()` всегда про байты, а не про то, что видит человек.'''
hint.ru = '''`len()` считает байты или символы?'''

[[exercises]]
name = "byt2"
style = "scratch"
hint.ru = [
  '''Метод `str::is_char_boundary(i)` отвечает про один индекс. Что нужно сделать, если он вернул `false`: сдвинуться влево или вправо?''',
  '''`floor_boundary`: уменьши индекс, пока он не станет границей. Начни с `index.min(text.len())`, иначе упрёшься в конец. В худшем случае придётся отступить три байта.''',
  '''`ceil_boundary` то же с плюсом. `split_near`: `text.split_at(floor_boundary(text, index))`.''',
]
why.ru = '''Символ в UTF-8 занимает не больше четырёх байт, поэтому до ближайшей границы не больше трёх шагов, и цикл дёшев. Индекс сначала обрезается длиной строки: конец строки всегда граница. `split_at` паникует на не-границе, и поэтому его вызывают только после `floor_boundary`.'''

[[exercises]]
name = "byt3"
style = "fix"
hint.ru = [
  '''Запусти тест: на каком индексе падает срез и почему? Что хранится в этом байте?''',
  '''Лимит указан в байтах и включает многоточие, которое само занимает 3 байта. Конец среза должен быть границей символа: сдвигайся влево, пока `is_char_boundary` не скажет «да». Не забудь про лимит меньше трёх.''',
  '''Для инициалов не нужны срезы вообще: возьми первый символ слова через `chars().next()`, а верхний регистр через `to_uppercase` (он возвращает итератор, потому что одна буква может дать несколько).''',
]
why.ru = '''Срез по байтовому индексу паникует не на ошибке в данных, а на данных, которых автор не ожидал, и поэтому он уходит в продакшн. Безопасные варианты: найти границу `is_char_boundary` или не нарезать вовсе, а идти по `chars()`. Лимит байт включает многоточие, так что итог всегда не длиннее заказанного. Для букв вроде «ß» верхний регистр это две буквы, поэтому `flat_map(char::to_uppercase)`.'''

[[exercises]]
name = "byt_q2"
kind = "question"
question.ru = '''Что произойдёт при запуске?
```rust
fn main() {
    let s = String::from("héllo");
    let head = &s[..2];
    println!("{head}");
}
```'''
options.ru = [
  "напечатает `h`",
  "напечатает `hé`",
  "паника: byte index 2 is not a char boundary",
  "ошибка компиляции",
]
answer = [2]
explain.ru = '''Буква `é` занимает байты 1 и 2 (от 1 до 3 не включая). Индекс 2 попадает внутрь неё, и срез паникует во время выполнения: компилятор значений не знает. Правильные границы здесь 0, 1, 3, 4, 5, 6. Индекс 3 дал бы `hé`.'''
hint.ru = '''Из скольких байт состоит `é`, и где лежит граница после неё?'''

[[exercises]]
name = "byt4"
style = "todo"
hint.ru = [
  '''Какая разница между `is_alphanumeric` и `is_ascii_alphanumeric`? Какая из них пустит в логин полноширинные цифры «１２»?''',
  '''Для логина проверяй каждый символ только ASCII-методами. Длину считай символами (`chars().count()`), а не байтами. «Не с цифры» проверяй первым символом.''',
  '''Отображаемое имя: `is_alphanumeric` плюс разрешённые знаки через `matches!`, и `name == name.trim()`.''',
]
why.ru = '''Юникод-методы `is_alphabetic` и `is_alphanumeric` пускают письменности мира и странные цифры вроде «１２» или «٣»: для имени человека это правильно, для идентификатора в ссылке нет. Поэтому логин проверяется ASCII-вариантами, а имя юникодными. Длину считают в символах, иначе имя из 40 русских букв отвергнется как слишком длинное.'''

[[exercises]]
name = "byt5"
style = "fix"
hint.ru = [
  '''Выведи `"İ".len()` и `"İ".to_lowercase().len()`. Что случилось с длиной?''',
  '''`to_lowercase` по Unicode способен менять число байт и даже символов, поэтому смещения в копии нельзя применять к оригиналу. Для ASCII-ника хватит искать в оригинале, сравнивая байты без учёта ASCII-регистра.''',
  '''`text.as_bytes().windows(needle.len()).position(|w| w.eq_ignore_ascii_case(needle.as_bytes()))`. Совпадение ASCII-иголки всегда начинается на границе символа.''',
]
why.ru = '''Смещения всегда принадлежат строке, по которой они посчитаны. Если приведение регистра может изменить длину, искать надо в оригинале. `eq_ignore_ascii_case` работает на байтах и не меняет их число, а ASCII-иголка не может совпасть с серединой многобайтной буквы, потому что байты продолжения старше 0x7F. Для ключей кэша `to_ascii_lowercase` предсказуем и не зависит от таблиц Unicode.'''

[[exercises]]
name = "byt_q3"
kind = "question"
question.ru = '''Сколько символов в каждой строке?
```rust
let s = "straße";
let up = s.to_uppercase();
println!("{} {}", s.chars().count(), up.chars().count());
```'''
options.ru = [
  "6 6",
  "6 7",
  "7 7",
  "5 6",
]
answer = [1]
explain.ru = '''Буква `ß` при переводе в верхний регистр превращается в две: `SS`. Поэтому `STRASSE` на символ длиннее исходной строки. Приведение регистра не обязано сохранять длину, и код, который на это полагается (смещения, ширина колонок), ошибается.'''
hint.ru = '''Сколько букв получается из `ß`, когда её делают заглавной?'''

[[exercises]]
name = "byt6"
style = "todo"
hint.ru = '''Работай с `&[u8]` как с обычным срезом: `iter().position`, `strip_suffix`, `contains`. У `u8` есть `is_ascii_alphanumeric`, а у срезов `to_ascii_uppercase`.'''
why.ru = '''Для байтов вне UTF-8 нет `String`, и это нормально: срез и методы `u8` делают всё нужное. ASCII-методы не трогают байты 0x80 и выше, поэтому разбор протокола не портит чужие данные. Литералы `b"abc"` и `b'x'` удобнее, чем числа, и сразу показывают намерение.'''

[[exercises]]
name = "byt7"
style = "todo"
hint.ru = [
  '''`from_utf8` возвращает `Utf8Error`, у которого два метода: `valid_up_to` и `error_len`. Когда `error_len` возвращает `None`?''',
  '''`None` значит, что последовательность оборвалась посередине символа (ещё не пришла), `Some(n)` значит n плохих байт.''',
  '''`valid_prefix`: при ошибке возьми `&bytes[..e.valid_up_to()]` и разбери снова. `lossy`: `String::from_utf8_lossy(bytes).into_owned()`.''',
]
why.ru = '''Две разные ошибки спрятаны в одной: «ещё не все байты» и «байты неверные». Для сетевого кода это развилка «подождать» или «закрыть соединение». `valid_up_to` всегда указывает на границу символа, поэтому `&bytes[..valid_up_to]` безопасно превращается в `&str`. `lossy` скрывает различие, и это годится для логов, но не для протокола.'''

[[exercises]]
name = "byt_q4"
kind = "question"
question.ru = '''Что напечатает программа?
```rust
let a = std::str::from_utf8(&[0xd0, 0xbf, 0xd1]).unwrap_err();
let b = std::str::from_utf8(&[0xd0, 0xbf, 0xff]).unwrap_err();
println!("{} {:?} / {} {:?}", a.valid_up_to(), a.error_len(), b.valid_up_to(), b.error_len());
```'''
options.ru = [
  "2 None / 2 Some(1)",
  "3 None / 3 Some(1)",
  "2 Some(1) / 2 Some(1)",
  "2 None / 2 None",
]
answer = [0]
explain.ru = '''В обоих случаях первые два байта это буква `п`, поэтому `valid_up_to` равно 2. В первом третий байт `0xd1` начало двухбайтной буквы, которой не хватает продолжения: данные оборвались, `error_len` это `None`. Во втором `0xff` не встречается в UTF-8 никогда, это настоящий мусор длиной 1 байт: `Some(1)`.'''
hint.ru = '''Чем отличается оборванная буква от байта, которого в UTF-8 не бывает?'''

[[exercises]]
name = "byt8"
style = "fix"
hint.ru = [
  '''Что делает `from_utf8_lossy` с оборванным в конце куска символом? Что должен делать декодер, если вторая половина придёт в следующем куске?''',
  '''Нужна память: держи недочитанные байты в `pending` и перед разбором приписывай к ним новый кусок.''',
  '''Разбери `pending` через `from_utf8`. При ошибке отдай валидное начало; если `error_len` равен `Some(n)`, добавь U+FFFD и выкинь `valid + n` байт и продолжай цикл; если `None`, оставь хвост в `pending` и вернись.''',
]
why.ru = '''Границы кусков из сети случайны, поэтому обрезанный символ в конце куска это норма, а не ошибка. Декодер хранит недочитанный хвост (не больше трёх байт) до следующего вызова. Различие `error_len`: `None` значит ждать, `Some` значит заменить и идти дальше. `finish` закрывает поток: что осталось, уже не дойдёт, и это одна замена.'''

[[exercises]]
name = "byt9"
style = "todo"
hint.ru = [
  '''`windows(4)` проходит по буферу окнами по четыре байта; `position` найдёт первое окно, равное `b"\r\n\r\n"`.''',
  '''Конец заголовков это индекс окна плюс 4. Строки делятся так же, окном в 2 байта. Для значения заголовка пригодится `trim_ascii`.''',
  '''Не забудь последнюю строку без `\r\n` в конце и то, что тело нельзя трогать вообще.''',
]
why.ru = '''Всё работает на срезах исходного буфера: ничего не копируется и не требует UTF-8. Первое вхождение `\r\n\r\n` отделяет заголовки от тела, и всё, что дальше, остаётся нетронутым, даже если в нём снова встретится такая же последовательность. `trim_ascii` убирает пробельные байты по краям, не требуя строки.'''

[[exercises]]
name = "byt10"
style = "fix"
hint.ru = [
  '''`work` растёт быстрее длины буфера. Почему? С какого индекса `find_end` начинает каждый раз?''',
  '''Если искать только с «новой части», разделитель, разрезанный на стыке, пропадёт. Разделитель занимает 4 байта, значит, начинать надо на 3 байта раньше конца прошлой проверки.''',
  '''После поиска запомни `scanned = buf.len().saturating_sub(3)` и передай его как `from` в следующий раз. Когда конец найден, больше не ищи.''',
]
why.ru = '''Повторный просмотр уже проверенных байт превращает линейную работу в квадратичную: заголовок в десять килобайт, пришедший короткими кусками, обходился бы в сотни миллионов проверок. Ровно три последних байта нужно перепроверять, потому что именно в них мог начаться разделитель, разрезанный границей куска. Счётчик `work` делает такую ошибку видимой, не полагаясь на измерения времени.'''

[[exercises]]
name = "byt11"
style = "todo"
hint.ru = [
  '''Цифра ASCII в число: `b - b'0'`. Какие методы `u64` вернут `None` при переполнении?''',
  '''Копи число в цикле: `n = n * 10 + digit`, но каждый шаг умножения и сложения проверяемый. `checked_mul(10)` и `and_then(|n| n.checked_add(..))`.''',
  '''`parse_port`: переиспользуй `parse_decimal`, затем `u16::try_from`.''',
]
why.ru = '''Проверяемая арифметика отвечает на вопрос «влезло ли», а не молча портит число. Ведущие нули не вызывают переполнения, потому что значение остаётся маленьким. Различие `Empty`, `BadByte` и `Overflow` даёт вызывающему шанс ответить пользователю точной причиной.'''

[[exercises]]
name = "byt12"
style = "fix"
hint.ru = [
  '''Сравни, что принимает `"+5".parse::<usize>()`, и что должно приниматься в заголовке `Content-Length`. Где ещё в файле тихо теряется информация?''',
  '''Не передавай разбор в `str::parse`: пройди по байтам, каждый должен быть `is_ascii_digit`. Накопление через `checked_mul` и `checked_add`.''',
  '''Для шестнадцатеричного размера тот же приём с множителем 16; `to_digit(16)` принимает только шестнадцатеричные ASCII-цифры.''',
]
why.ru = '''Стандартный `parse` принимает знак `+`, поэтому два сервера на цепочке могут прочитать «одно и то же» заголовочное значение по-разному: так делают подмену запросов. Строгий разбор по байтам одинаков везде. `wrapping_*` годится для хешей, но не для длин: число, которое молча стало маленьким, превращает чужие данные в «следующее сообщение».'''

[[exercises]]
name = "byt13"
style = "todo"
hint.ru = [
  '''Маска выделяет поле: `byte & MASK`. Чтобы получить число из середины байта, после маски нужен сдвиг вправо.''',
  '''Установить бит: `|`. Снять: `& !MASK`. Заменить поле: сначала стереть его маской, потом `|` с новым значением.''',
  '''`with_opcode`: если код больше `OPCODE`, верни `None`; иначе `(self.0 & !OPCODE) | opcode`.''',
]
why.ru = '''Каждое поле меняется по схеме «стереть маской, затем установить», и остальные биты остаются нетронутыми. Проверка `opcode > 15` обязательна: иначе лишние биты потекли бы в соседние поля, и ошибка проявилась бы очень далеко от места записи. Константы с именами `FIN`, `OPCODE` читаются лучше, чем числа в коде.'''

[[exercises]]
name = "byt14"
style = "bughunt"
hint.ru = [
  '''Прогони функции на краевых значениях из тестов. Какая падает на панику, какая возвращает «слишком много»?''',
  '''В `be_u16` посмотри на приоритеты: сложение сильнее сдвига, поэтому `<< 8 + lo` это сдвиг на `8 + lo`. В `be_u32` последний байт превращается в число через знаковый тип.''',
  '''Расширяй каждый байт до нужной ширины заранее: `u32::from(b)`, и только потом сдвигай. Для `low_bits` у типа есть `checked_shl`, он возвращает `None` при сдвиге на ширину типа и больше.''',
]
why.ru = '''Сдвигать надо уже расширенное значение: `u8 << 8` потеряло бы все биты. Скобки нужны всегда, потому что `<<` слабее `+`: `a << 8 + b` это совсем не то. Приведение `as i8 as u32` расширяет со знаком и заполняет старшие биты единицами; `u32::from(b)` расширяет нулями и ничего не обещает лишнего. Сдвиг на ширину типа и больше это паника или ошибка, и проверяемая версия `checked_shl` описывает границу явно.'''

[[exercises]]
name = "byt_q5"
kind = "question"
question.ru = '''Что напечатает программа?
```rust
let b: u8 = 0b1000_0001;
println!("{} {}", b << 1, (b as u16) << 1);
```'''
options.ru = [
  "2 258",
  "258 258",
  "паника: сдвиг переполнил u8",
  "2 2",
]
answer = [0]
explain.ru = '''Сдвиг на 1 разрешён для `u8` (паникует только сдвиг на 8 и больше), но старший бит при этом просто выпадает: остаётся `0b0000_0010`, то есть 2. После расширения до `u16` бит сохраняется, и результат 258. Расширяй значение до сдвига, а не после.'''
hint.ru = '''Куда уходит старший бит, когда `u8` сдвигают влево?'''

[[exercises]]
name = "byt15"
style = "todo"
hint.ru = [
  '''Какие методы превращают `u32` в `[u8; 4]` и обратно? Чем различаются `be` и `le`?''',
  '''Из среза в массив: `slice.try_into()`, он вернёт `Result`. Взять кусок безопасно можно через `get(range)`, он вернёт `None` на коротком буфере.''',
  '''Для `read_u32_le`: `at + 4` может переполниться, используй `checked_add`.''',
]
why.ru = '''Методы `from_be_bytes` и `to_be_bytes` называют порядок прямо в имени, и ручные сдвиги не нужны. `get(..7)` вместо индексации превращает короткий буфер в `None` вместо паники, а `try_into` в массив проверяет длину среза. Смещение из внешних данных может быть огромным, поэтому `at + 4` считают проверяемо.'''

[[exercises]]
name = "byt_q6"
kind = "question"
question.ru = '''Что напечатает программа?
```rust
let bytes = [0, 0, 1, 2];
println!("{} {}", u32::from_be_bytes(bytes), u32::from_le_bytes(bytes));
```'''
options.ru = [
  "258 258",
  "258 33619968",
  "513 33619968",
  "33619968 258",
]
answer = [1]
explain.ru = '''В big-endian старший байт идёт первым: `[0, 0, 1, 2]` это 0x00000102, то есть 258. В little-endian младший первым: те же байты читаются как 0x02010000, то есть 33619968. Разница ровно в том, какой конец числа лежит по меньшему адресу.'''
hint.ru = '''Какой байт считается самым старшим в big-endian: первый или последний?'''

[[exercises]]
name = "byt16"
style = "fix"
hint.ru = [
  '''Что делает `70_000 as u16`? Проверь в голове: 70000 минус 65536.''',
  '''`as` обрезает молча. Для проверяемого сужения есть `u16::try_from(len)`: он вернёт `Err`, если число не помещается.''',
  '''`let len = u16::try_from(text.len()).map_err(|_| EncodeError::TooLong(text.len()))?;` и то же для `u8` с `TooMany`.''',
]
why.ru = '''`as` между целыми это «возьми младшие биты», а не «преврати, если можно». В протоколе такая обрезка молчит и портит поток уже у получателя. `try_from` превращает вопрос «влезло ли» в ошибку на стороне отправителя, где ещё можно что-то сделать. Граничные значения (65535 и 65536, 255 и 256) входят в тест не случайно: ошибки на единицу самые частые.'''

[[exercises]]
name = "byt_q7"
kind = "question"
question.ru = '''Что напечатает программа?
```rust
let n: usize = 70_000;
println!("{} {}", n as u16, u16::try_from(n).is_ok());
```'''
options.ru = [
  "70000 true",
  "65535 false",
  "4464 false",
  "0 false",
]
answer = [2]
explain.ru = '''`as` оставляет младшие 16 бит: 70000 − 65536 = 4464. Ни ошибки, ни предупреждения. `try_from` возвращает `Err`, потому что число не помещается, и `is_ok()` даёт `false`.'''
hint.ru = '''Сколько будет 70000 по модулю 65536?'''

[[exercises]]
name = "byt17"
style = "todo"
hint.ru = [
  '''Каждый байт превращается в два шестнадцатеричных символа: старшая половина `b >> 4` и младшая `b & 0x0f`.''',
  '''Для декодирования не режь строку `&text[i..i + 2]`: на многобайтной букве это паника. Работай с `text.as_bytes()` и разбирай каждый байт отдельно. Длину проверяй по байтам.''',
  '''`char::from(byte).to_digit(16)` принимает цифры и буквы обоих регистров и не пропускает знак. Собери результат через `collect::<Result<Vec<_>, _>>()`.''',
]
why.ru = '''Работа на байтах избавляет от двух ловушек сразу: срезы строки посередине символа и знак `+` в `from_str_radix`. Индекс в ошибке байтовый, и это честно: сообщение указывает позицию во входной последовательности. Нечётную длину проверяют до разбора символов, иначе для «aé» первая же ошибка была бы про не-цифру.'''

[[exercises]]
name = "byt18"
style = "todo"
hint.ru = [
  '''Строка формата хранит всё: `{name:<8.8}` это выравнивание влево, ширина 8, и после точки максимум 8 символов (для строки это обрезка).''',
  '''`{flags:#010b}`: `#` добавляет `0b`, `0` заполняет нулями, 10 это общая ширина вместе с префиксом. `{id:#06x}` по тому же принципу.''',
  '''Для своего типа `write!` игнорирует ширину из спецификатора. Собери итоговый текст в `String` и отдай его через `f.pad(&text)`.''',
]
why.ru = '''Все параметры формата живут в спецификаторе, и его стоит читать как короткую фразу: флаг, выравнивание, ширина, точность, тип. Для строк точность режет, для чисел задаёт знаки. Ширина в `{:#010b}` включает префикс `0b`, поэтому для 8 цифр нужно 10. `f.pad` включает в свой тип то же поведение, что у встроенных: ширину, заполнитель и выравнивание задаёт вызывающий.'''

[[exercises]]
name = "byt_q8"
kind = "question"
question.ru = '''Что напечатает программа?
```rust
println!("{:.2}|{:>5}|{:#06x}", "hello", "ab", 255);
```'''
options.ru = [
  "`hello|ab|0xff`",
  "`he|   ab|0x00ff`",
  "`he|ab   |0x00ff`",
  "`hel|   ab|0xff`",
]
answer = [1]
explain.ru = '''Точность у строки обрезает её до двух символов: `he`. Ширина 5 по умолчанию для строки выравнивает влево, но с явным `>` вправо: `   ab`. В `{:#06x}` общая ширина 6 включает префикс `0x`, поэтому остаётся четыре цифры: `0x00ff`.'''
hint.ru = '''Что точность делает для строки и что ширина включает для `#`?'''

[[exercises]]
name = "byt19"
style = "todo"
hint.ru = [
  '''`Vec<u8>` реализует `io::Write`, значит `write!(vec, ...)` работает так же, как для файла. Не забудь импортировать трейт: он уже в шапке.''',
  '''Заголовок пиши через `write!` в вектор, а тело добавляй `extend_from_slice`. Тело не должно проходить через строку.''',
  '''Для `String` трейт `fmt::Write` позволяет делать `write!(s, ...)` без промежуточных строк.''',
]
why.ru = '''Приёмник для записи может быть и `Vec<u8>`, и `String`, и сокетом: `write!` одинаково работает с любым. Ответ из текстового заголовка и бинарного тела нельзя собирать через `String`: UTF-8 не позволит хранить произвольные байты, а `from_utf8_lossy` их испортит. Запись прямо в приёмник экономит временную строку на каждую часть.'''

[[exercises]]
name = "byt20"
style = "scratch"
hint.ru = [
  '''Что должно вернуть чтение, когда байт мало: ошибку данных или просьбу подождать? Сколько байт не хватает?''',
  '''Все чтения проходят через одну операцию `take(n)`: она проверяет остаток и сдвигает позицию только при успехе.''',
  '''`read_until`: ищи разделитель в `&self.buf[self.pos..]`, и позицию двигай только если нашёл. `read_str`: если UTF-8 неверный, верни позицию на место.''',
]
why.ru = '''Одна точка входа `take` гарантирует, что ни одно чтение не паникует и не двигает позицию при неудаче. Из этого следует свойство, на котором стоят потоковые парсеры: после `Incomplete` можно дочитать данные и повторить ту же операцию. `Incomplete` и `BadUtf8` разные ответы: первый значит подождать, второй значит, что ждать нечего.'''

[[exercises]]
name = "byt21"
style = "fix"
hint.ru = [
  '''Разбери по пунктам, где парсер возвращает не ту ошибку. Что надо проверить первым делом, ещё до чтения длины?''',
  '''Порядок проверок: вид по первому байту, длина по заголовку, наличие тела, содержимое. Каждую проверку делай так, как только хватает байт для неё.''',
  '''Для безопасного доступа без паники пользуйся `buf.first()` и `buf.get(a..b)` вместо индексов. Недостающие байты: `3 - buf.len()` для заголовка и `3 + len - buf.len()` для тела.''',
]
why.ru = '''Парсер потока отвечает на три вопроса в порядке очерёдности: можно ли уже сказать, что данные плохие (отвергнуть сразу), хватает ли байт (иначе попросить ещё), что внутри. Мусор, который виден по первому байту, нельзя «дожидаться»: клиент висел бы на таймауте. А когда все байты на месте и текст неверный, ждать тоже нечего. `get` вместо индекса превращает любую границу в `None`.'''

[[exercises]]
name = "byt_q9"
kind = "question"
question.ru = '''Парсер сообщений читает поток. Для каких входов он должен сразу вернуть «данные битые» и закрыть соединение, а не ждать продолжения? (Заголовок: вид 1 байт, длина 2 байта, не больше 1000; тело UTF-8.)'''
options.ru = [
  "пришло 2 байта из 3-байтового заголовка",
  "первый байт 9, вид бывает только 1 или 2",
  "заголовок целиком, длина равна 60000",
  "длина 4 и четыре байта тела, но они не UTF-8",
]
answer = [1, 2, 3]
explain.ru = '''Два байта заголовка: просто мало данных, ждём ещё. Неизвестный вид виден по первому байту, дальнейшее ждать бессмысленно. Длина 60000 больше предела видна по заголовку, ждать 60000 байт нельзя (это ещё и способ занять память). Тело на месте, но не UTF-8: больше байт не нужно, и ничего не исправит. Правило: ждём, пока может прийти недостающее, отвергаем, как только поняли, что оно ничего не изменит.'''
hint.ru = '''Может ли приход новых байт изменить вердикт в каждом из случаев?'''

