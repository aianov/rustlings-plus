  '''`Stream` держит `Vec<u8>`; `next_message` зовёт `decode`: на `Incomplete` отвечает `Ok(None)`, на успехе убирает прочитанные байты (`drain`), на остальных ошибках возвращает ошибку, не трогая буфер.''',
  '''`hexdump`: `chunks(16)` и `write!` в `String`; ячейки по три символа, недостающие заполни пробелами. `preview` тебе знакома из задач главы.''',
]
why.ru = '''Кодек держится на трёх решениях. Ошибки разведены: «мало» не равно «битые», и битое отвергается как можно раньше. Поток хранит не больше одного неполного сообщения и не копит прочитанное. Длина считается в байтах и переводится в `u16` проверяемо, поэтому ни эмодзи, ни кириллица не обманут лимит. Те же приёмы потом лежат в основе парсеров HTTP, WebSocket и protobuf.'''

