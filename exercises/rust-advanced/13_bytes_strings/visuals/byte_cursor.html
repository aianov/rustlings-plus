<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Курсор по байтам: мало или битые</title>
<style>
:root{--bg:#fafaf7;--fg:#1d1d1b;--mut:#6b6b66;--card:#fff;--line:#c9c7bd;--acc:#c2410c;--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;--warn:#a16207;--warnbg:#fef9c3;--btn:#1d1d1b;--btnfg:#fff;--hot:#fff1e6}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--fg:#ecebe6;--mut:#9a9a92;--card:#201f1d;--line:#46443f;--acc:#fb923c;--ok:#4ade80;--okbg:#14301d;--bad:#f87171;--badbg:#3a1a1a;--warn:#facc15;--warnbg:#3a3312;--btn:#ecebe6;--btnfg:#161614;--hot:#33241a}}
*{box-sizing:border-box}
body{margin:0;padding:20px;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 14px}
.panel{max-width:860px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;min-height:150px}
.row{display:flex;gap:10px;align-items:center;font:13px ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--line);border-radius:8px;padding:7px 10px;margin:6px 0}
.row.ok{border-color:var(--ok);background:var(--okbg)}
.row.no{border-color:var(--bad);background:var(--badbg);text-decoration:line-through;opacity:.75}
.row.hot{border-color:var(--warn);background:var(--warnbg)}
.row .tag{margin-left:auto;font:12px system-ui,sans-serif;color:var(--mut);text-decoration:none}
.box{display:inline-block;font:13px ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--line);border-radius:8px;padding:8px 12px;margin:4px 6px 4px 0;vertical-align:top}
.box.ok{border-color:var(--ok);background:var(--okbg)}
.box.hot{border-color:var(--warn);background:var(--warnbg)}
.box.no{border-color:var(--bad);background:var(--badbg)}
.box small{display:block;color:var(--mut);font:12px system-ui,sans-serif}
.arrow{display:inline-block;margin:0 4px;color:var(--mut);font-size:18px;vertical-align:middle}
.note{margin:12px 0;padding:12px 14px;border-left:4px solid var(--acc);background:var(--card);border-radius:0 8px 8px 0;min-height:76px;max-width:860px}
.bar2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:860px}
button{font:inherit;padding:7px 14px;border-radius:8px;border:0;background:var(--btn);color:var(--btnfg);cursor:pointer}
button.alt{background:transparent;color:var(--fg);border:1px solid var(--line)}
button:disabled{opacity:.4;cursor:default}
.cnt{color:var(--mut);margin-left:auto}
</style>
</head>
<body>
<h1>Курсор по байтам: мало или битые</h1>
<p class="sub">Как потоковый парсер решает: подождать, принять или отвергнуть</p>
<div class="panel" id="panel"></div>
<div class="note" id="note"></div>
<div class="bar2">
  <button id="step">Шаг</button>
  <button id="play" class="alt">Играть</button>
  <button id="reset" class="alt">Сначала</button>
  <span class="cnt" id="cnt"></span>
</div>
<script>
const steps=[{"p": "<p style=\"color:var(--mut);margin:8px 0 0\">формат: вид (1 байт) | длина (2 байта) | текст</p><div class=\"box hot\">01</div><div class=\"box warn\">00</div><div class=\"box warn\">05</div><div class=\"box \">68</div><div class=\"box \">65</div><div class=\"box \">6C</div><div class=\"box \">6C</div><div class=\"box \">6F</div>", "n": "Сообщение 01 00 05 «hello»: вид 1, длина 5, пять байт текста. В потоке оно может прийти целиком, кусками или вместе со следующим."}, {"p": "<p style=\"color:var(--mut);margin:8px 0 0\">пришло 2 байта</p><div class=\"box ok\">01</div><div class=\"box ok\">00</div><p style=\"color:var(--mut);margin:8px 0 0\">вердикт: Incomplete { needed: 1 }. Ждём, курсор на месте.</p>", "n": "Заголовок занимает 3 байта, пришло 2. Это не ошибка данных: просто мало. Просим ещё байт и пробуем снова с того же места."}, {"p": "<p style=\"color:var(--mut);margin:8px 0 0\">пришло 4 байта</p><div class=\"box ok\">01</div><div class=\"box ok\">00</div><div class=\"box ok\">05</div><div class=\"box hot\">68</div><p style=\"color:var(--mut);margin:8px 0 0\">вердикт: Incomplete { needed: 4 }</p>", "n": "Заголовок прочитан, длина 5, а тела пока один байт. Не хватает четырёх. Теперь известно, сколько ждать."}, {"p": "<p style=\"color:var(--mut);margin:8px 0 0\">пришло 8 байт: всё</p><div class=\"box ok\">01</div><div class=\"box ok\">00</div><div class=\"box ok\">05</div><div class=\"box ok\">68</div><div class=\"box ok\">65</div><div class=\"box ok\">6C</div><div class=\"box ok\">6C</div><div class=\"box ok\">6F</div><p style=\"color:var(--mut);margin:8px 0 0\">вердикт: Ok(сообщение), съедено 8 байт</p>", "n": "Достаточно байт: разбираем, убираем из буфера ровно 8 байт, остаток (если есть) остаётся для следующего сообщения."}, {"p": "<p style=\"color:var(--mut);margin:8px 0 0\">первый байт 09</p><div class=\"box no\">09</div><div class=\"box \">00</div><div class=\"box \">05</div><p style=\"color:var(--mut);margin:8px 0 0\">вердикт: Invalid(\"unknown kind\"). Сразу.</p>", "n": "Вид 9 не бывает. Ждать остальное нет смысла: сообщение никогда не станет правильным. Соединение закрываем, не дожидаясь таймаута."}, {"p": "<p style=\"color:var(--mut);margin:8px 0 0\">длина 10000 при пределе 1000</p><div class=\"box ok\">01</div><div class=\"box no\">27</div><div class=\"box no\">10</div><p style=\"color:var(--mut);margin:8px 0 0\">вердикт: Invalid(\"too long\"). Не ждём десять тысяч байт.</p>", "n": "Слишком большая длина видна по заголовку. Если ждать, злоумышленник заставит копить десятки килобайт на каждое соединение."}, {"p": "<p style=\"color:var(--mut);margin:8px 0 0\">все байты на месте, но текст не UTF-8</p><div class=\"box \">01</div><div class=\"box \">00</div><div class=\"box \">02</div><div class=\"box no\">FF</div><div class=\"box no\">FE</div><p style=\"color:var(--mut);margin:8px 0 0\">вердикт: Invalid(\"bad utf-8\")</p>", "n": "Здесь тело полное. Новые байты ничего не изменят, поэтому «подождать» не вариант: это битые данные."}, {"p": "<p style=\"color:var(--mut);margin:8px 0 0\">правило</p><div class=\"box warn\">мало данных<small>ждать, курсор на месте</small></div><div class=\"box no\">битые данные<small>отвергнуть как можно раньше</small></div>", "n": "Мало данных можно исправить временем. Битые данные нельзя. Парсер, который их путает, либо зависает, либо рвёт соединение на медленной сети."}];
let i=0,timer=null;
function stop(){if(timer){clearInterval(timer);timer=null;}document.getElementById('play').textContent='Играть';}
function frame(){document.getElementById('panel').innerHTML=steps[i].p;document.getElementById('note').textContent=steps[i].n;document.getElementById('cnt').textContent='шаг '+(i+1)+' из '+steps.length;document.getElementById('step').disabled=i>=steps.length-1;if(i>=steps.length-1)stop();}
document.getElementById('step').onclick=()=>{if(i<steps.length-1){i++;frame();}};
document.getElementById('reset').onclick=()=>{stop();i=0;frame();};
document.getElementById('play').onclick=()=>{if(timer){stop();return;}if(i>=steps.length-1){i=0;frame();}document.getElementById('play').textContent='Пауза';timer=setInterval(()=>{if(i<steps.length-1){i++;frame();}else stop();},3000);};
frame();
</script>
</body>
</html>
