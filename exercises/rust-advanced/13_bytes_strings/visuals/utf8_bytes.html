<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UTF-8 по байтам</title>
<style>
:root{--bg:#fafaf7;--fg:#1d1d1b;--mut:#6b6b66;--card:#fff;--line:#c9c7bd;--acc:#c2410c;--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;--warn:#a16207;--warnbg:#fef9c3;--btn:#1d1d1b;--btnfg:#fff;--hot:#fff1e6}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--fg:#ecebe6;--mut:#9a9a92;--card:#201f1d;--line:#46443f;--acc:#fb923c;--ok:#4ade80;--okbg:#14301d;--bad:#f87171;--badbg:#3a1a1a;--warn:#facc15;--warnbg:#3a3312;--btn:#ecebe6;--btnfg:#161614;--hot:#33241a}}
*{box-sizing:border-box}
body{margin:0;padding:20px;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 14px}
.panel{max-width:860px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;min-height:150px}
.row{display:flex;gap:10px;align-items:center;font:13px ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--line);border-radius:8px;padding:7px 10px;margin:6px 0}
.row.ok{border-color:var(--ok);background:var(--okbg)}
.row.no{border-color:var(--bad);background:var(--badbg);text-decoration:line-through;opacity:.75}
.row.hot{border-color:var(--warn);background:var(--warnbg)}
.row .tag{margin-left:auto;font:12px system-ui,sans-serif;color:var(--mut);text-decoration:none}
.box{display:inline-block;font:13px ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--line);border-radius:8px;padding:8px 12px;margin:4px 6px 4px 0;vertical-align:top}
.box.ok{border-color:var(--ok);background:var(--okbg)}
.box.hot{border-color:var(--warn);background:var(--warnbg)}
.box.no{border-color:var(--bad);background:var(--badbg)}
.box small{display:block;color:var(--mut);font:12px system-ui,sans-serif}
.arrow{display:inline-block;margin:0 4px;color:var(--mut);font-size:18px;vertical-align:middle}
.note{margin:12px 0;padding:12px 14px;border-left:4px solid var(--acc);background:var(--card);border-radius:0 8px 8px 0;min-height:76px;max-width:860px}
.bar2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:860px}
button{font:inherit;padding:7px 14px;border-radius:8px;border:0;background:var(--btn);color:var(--btnfg);cursor:pointer}
button.alt{background:transparent;color:var(--fg);border:1px solid var(--line)}
button:disabled{opacity:.4;cursor:default}
.cnt{color:var(--mut);margin-left:auto}
</style>
</head>
<body>
<h1>UTF-8 по байтам</h1>
<p class="sub">Один символ, от одного до четырёх байт, границы и куски из сети</p>
<div class="panel" id="panel"></div>
<div class="note" id="note"></div>
<div class="bar2">
  <button id="step">Шаг</button>
  <button id="play" class="alt">Играть</button>
  <button id="reset" class="alt">Сначала</button>
  <span class="cnt" id="cnt"></span>
</div>
<script>
const steps=[{"p": "<p style=\"color:var(--mut);margin:8px 0 0\">строка \"aй👋\" в памяти</p><div class=\"box \">61<small>байт 0</small></div><div class=\"box \">D0<small>байт 1</small></div><div class=\"box \">B9<small>байт 2</small></div><div class=\"box \">F0<small>байт 3</small></div><div class=\"box \">9F<small>байт 4</small></div><div class=\"box \">91<small>байт 5</small></div><div class=\"box \">8B<small>байт 6</small></div>", "n": "Строка Rust это просто байты, которые обязаны быть правильным UTF-8. Видно три символа, а байтов семь."}, {"p": "<p style=\"color:var(--mut);margin:8px 0 0\">сколько байт на символ</p><div class=\"box ok\">a<small>1 байт: 0xxxxxxx</small></div><div class=\"box hot\">й<small>2 байта: 110xxxxx 10xxxxxx</small></div><div class=\"box warn\">👋<small>4 байта: 11110xxx 10xxxxxx 10xxxxxx 10xxxxxx</small></div>", "n": "Первый байт символа говорит, сколько всего байт в нём. Остальные байты («продолжения») всегда начинаются с битов 10."}, {"p": "<p style=\"color:var(--mut);margin:8px 0 0\">границы символов</p><div class=\"box ok\">61<small>байт 0</small></div><div class=\"box ok\">D0<small>байт 1</small></div><div class=\"box no\">B9<small>байт 2</small></div><div class=\"box ok\">F0<small>байт 3</small></div><div class=\"box no\">9F<small>байт 4</small></div><div class=\"box no\">91<small>байт 5</small></div><div class=\"box no\">8B<small>байт 6</small></div>", "n": "Граница символа это байт, который не является продолжением. Здесь это индексы 0, 1, 3 и конец строки (7). Индексы 2, 4, 5, 6 лежат внутри символа."}, {"p": "<p style=\"color:var(--mut);margin:8px 0 0\">&s[..2] режет внутри буквы й</p><div class=\"box ok\">61<small>байт 0</small></div><div class=\"box hot\">D0<small>байт 1</small></div><div class=\"box no\">B9<small>байт 2</small></div><div class=\"box \">F0<small>байт 3</small></div><div class=\"box \">9F<small>байт 4</small></div><div class=\"box \">91<small>байт 5</small></div><div class=\"box \">8B<small>байт 6</small></div><p style=\"color:var(--mut);margin:8px 0 0\">паника: byte index 2 is not a char boundary</p>", "n": "Срез по байтовому индексу проверяет границу и паникует, если индекс внутри символа. Безопасный путь: is_char_boundary или итерация по chars()."}, {"p": "<p style=\"color:var(--mut);margin:8px 0 0\">данные приходят кусками, и стык может пасть внутрь символа</p><div class=\"box hot\">61 D0<small>кусок 1</small></div><div class=\"box hot\">B9 F0 9F<small>кусок 2</small></div><div class=\"box hot\">91 8B<small>кусок 3</small></div>", "n": "Сеть режет поток по своим правилам. Буква й разорвана между первым и вторым куском, эмодзи между вторым и третьим."}, {"p": "<p style=\"color:var(--mut);margin:8px 0 0\">from_utf8_lossy каждого куска отдельно</p><div class=\"box no\">a �<small>кусок 1</small></div><div class=\"box no\">� �<small>кусок 2</small></div><div class=\"box no\">�<small>кусок 3</small></div>", "n": "Если декодировать каждый кусок отдельно, половинки букв превращаются в символы замены. Текст потерян безвозвратно."}, {"p": "<p style=\"color:var(--mut);margin:8px 0 0\">декодер с памятью: хвост остаётся до следующего куска</p><div class=\"box ok\">a<small>кусок 1, в запасе D0</small></div><div class=\"box ok\">й<small>кусок 2, в запасе F0 9F</small></div><div class=\"box ok\">👋<small>кусок 3, запас пуст</small></div>", "n": "Что оборвалось на краю куска (error_len() == None), откладываем в буфер и приписываем перед следующим куском. Настоящий мусор (error_len() == Some) заменяем сразу."}];
let i=0,timer=null;
function stop(){if(timer){clearInterval(timer);timer=null;}document.getElementById('play').textContent='Играть';}
function frame(){document.getElementById('panel').innerHTML=steps[i].p;document.getElementById('note').textContent=steps[i].n;document.getElementById('cnt').textContent='шаг '+(i+1)+' из '+steps.length;document.getElementById('step').disabled=i>=steps.length-1;if(i>=steps.length-1)stop();}
document.getElementById('step').onclick=()=>{if(i<steps.length-1){i++;frame();}};
document.getElementById('reset').onclick=()=>{stop();i=0;frame();};
document.getElementById('play').onclick=()=>{if(timer){stop();return;}if(i>=steps.length-1){i=0;frame();}document.getElementById('play').textContent='Пауза';timer=setInterval(()=>{if(i<steps.length-1){i++;frame();}else stop();},3000);};
frame();
</script>
</body>
</html>
