<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Воркспейс: члены, зависимости, один лок</title>
<style>
:root{--bg:#fafaf7;--fg:#1d1d1b;--mut:#6b6b66;--card:#fff;--line:#c9c7bd;--acc:#c2410c;--ok:#15803d;--bad:#b91c1c;--btn:#1d1d1b;--btnfg:#fff;--hot:#fff1e6}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--fg:#ecebe6;--mut:#9a9a92;--card:#201f1d;--line:#46443f;--acc:#fb923c;--ok:#4ade80;--bad:#f87171;--btn:#ecebe6;--btnfg:#161614;--hot:#33241a}}
*{box-sizing:border-box}
body{margin:0;padding:20px;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 12px}
svg{width:100%;max-width:820px;height:auto;display:block;background:var(--card);border:1px solid var(--line);border-radius:10px}
svg text{fill:var(--fg);font:13px ui-monospace,Menlo,Consolas,monospace}
svg .mut{fill:var(--mut)}
.g{opacity:0;transition:opacity .35s}
.g.on{opacity:1}
.node rect{fill:var(--card);stroke:var(--line);stroke-width:2}
.node.hot rect{stroke:var(--acc);fill:var(--hot)}
.node.bad rect{stroke:var(--bad)}
.edge{stroke:var(--fg);stroke-width:2;fill:none}
.edge.bad{stroke:var(--bad);stroke-dasharray:5 4}
.box{fill:none;stroke:var(--line);stroke-width:2;stroke-dasharray:6 4}
.box.root{stroke:var(--acc);stroke-dasharray:none}
.note{margin:12px 0;padding:12px 14px;border-left:4px solid var(--acc);background:var(--card);border-radius:0 8px 8px 0;min-height:72px;max-width:820px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:820px}
button{font:inherit;padding:7px 14px;border-radius:8px;border:0;background:var(--btn);color:var(--btnfg);cursor:pointer}
button.alt{background:transparent;color:var(--fg);border:1px solid var(--line)}
button:disabled{opacity:.4;cursor:default}
.cnt{color:var(--mut);margin-left:auto}
</style>
</head>
<body>
<h1>Воркспейс: члены, зависимости, один лок</h1>
<p class="sub">Корень объединяет крейты в одну сборку.</p>
<svg viewBox="0 0 820 420" role="img" aria-label="Схема воркспейса">
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs>
  <g class="g" data-from="0" data-to="99">
    <rect class="box root" x="10" y="10" width="800" height="400" rx="12"/>
    <text x="24" y="34">Cargo.toml  [workspace] members = ["crates/*", "tools/*"]</text>
  </g>
  <g class="g" data-from="1" data-to="99">
    <rect class="box" x="30" y="60" width="380" height="150" rx="10"/><text class="mut" x="44" y="82">crates/*</text>
    <rect class="box" x="430" y="60" width="360" height="150" rx="10"/><text class="mut" x="444" y="82">tools/*</text>
  </g>
  <g class="g node" data-from="1" data-to="99"><rect x="50" y="110" width="150" height="56" rx="8"/><text x="68" y="143">pay-core</text></g>
  <g class="g node" data-from="1" data-to="99"><rect x="230" y="110" width="150" height="56" rx="8"/><text x="256" y="143">pay-api</text></g>
  <g class="g node" data-from="1" data-to="99"><rect x="470" y="110" width="150" height="56" rx="8"/><text x="504" y="143">refund</text></g>
  <g class="g" data-from="2" data-to="99" style="color:var(--fg)">
    <path class="edge" d="M470 138 L384 138" marker-end="url(#ar)"/>
    <path class="edge" d="M230 138 L204 138" marker-end="url(#ar)"/>
    <text class="mut" x="404" y="205" style="font-size:12px">refund -> pay-api -> pay-core</text>
  </g>
  <g class="g" data-from="3" data-to="99">
    <rect x="40" y="250" width="360" height="62" rx="8" fill="none" stroke="var(--ok)" stroke-width="2"/>
    <text x="56" y="277" style="fill:var(--ok)">Cargo.lock: один на всех</text>
    <text class="mut" x="56" y="298">serde 1.0.200, tokio 1.30.3 ...</text>
  </g>
  <g class="g" data-from="4" data-to="99">
    <rect x="430" y="250" width="360" height="62" rx="8" fill="none" stroke="var(--ok)" stroke-width="2"/>
    <text x="446" y="277" style="fill:var(--ok)">target/: одна сборка на всех</text>
    <text class="mut" x="446" y="298">serde собран один раз</text>
  </g>
  <g class="g" data-from="5" data-to="5">
    <rect class="box" x="30" y="335" width="380" height="60" rx="8" style="stroke:var(--bad)"/>
    <text x="46" y="361" style="fill:var(--bad)">crates/audit  не в members (список вместо маски)</text>
    <text class="mut" x="46" y="381">cargo test --workspace его не видит</text>
  </g>
  <g class="g" data-from="6" data-to="6">
    <rect class="box" x="430" y="335" width="360" height="60" rx="8" style="stroke:var(--bad)"/>
    <text x="446" y="361" style="fill:var(--bad)">tools/importer: свой [workspace]</text>
    <text class="mut" x="446" y="381">второй Cargo.lock и второй target</text>
  </g>
  <g class="g" data-from="7" data-to="7" style="color:var(--bad)">
    <path class="edge bad" d="M204 168 Q215 215 226 168" marker-end="url(#ar)"/>
    <rect class="box" x="30" y="335" width="760" height="60" rx="8" style="stroke:var(--bad)"/>
    <text x="46" y="361" style="fill:var(--bad)">pay-core -> pay-api -> pay-core: цикл, воркспейс не открывается</text>
    <text class="mut" x="46" y="381">общее уезжает вниз, в третий крейт; стрелки идут в одну сторону</text>
  </g>
</svg>
<div class="note" id="note"></div>
<div class="bar">
  <button id="step">Шаг</button>
  <button id="play" class="alt">Играть</button>
  <button id="reset" class="alt">Сначала</button>
  <span class="cnt" id="cnt"></span>
</div>
<script>
const notes=[
 'В корне лежит Cargo.toml с таблицей [workspace]. Это и есть воркспейс: сам корень не программа, а оглавление.',
 'Маски в members находят папки: crates/* даёт pay-core и pay-api, tools/* даёт refund. Новый крейт в этих папках попадёт в сборку без правок корня.',
 'Крейты подключают друг друга по path. Каждая такая запись это стрелка графа зависимостей: refund знает pay-api, pay-api знает pay-core.',
 'Версии выбираются один раз на весь воркспейс и записываются в один Cargo.lock в корне. Разъехаться версиям негде.',
 'Сборка тоже одна: общие зависимости собираются один раз и лежат в единственной папке target в корне.',
 'Ловушка: если members это явный список, крейт, которого в нём нет, выпадает. cargo test --workspace его тесты не запускает, и зелёный результат врёт.',
 'Ловушка: [workspace] внутри члена создаёт второй воркспейс, а с ним второй Cargo.lock и второй target с повторной сборкой зависимостей.',
 'Ловушка: цикл между крейтами. Cargo не открывает такой воркспейс. Лечится переносом общего вниз, в крейт contracts, на который смотрят оба.'
];
let i=0,timer=null;
function render(){
  document.querySelectorAll('.g').forEach(g=>{
    const f=+g.dataset.from,t=+g.dataset.to;
    g.classList.toggle('on',i>=f&&i<=t);
  });
  document.getElementById('note').textContent=notes[i];
  document.getElementById('cnt').textContent='шаг '+(i+1)+' из '+notes.length;
  document.getElementById('step').disabled=i===notes.length-1;
  if(i===notes.length-1)stop();
}
function stop(){if(timer){clearInterval(timer);timer=null;}document.getElementById('play').textContent='Играть';}
document.getElementById('step').onclick=()=>{if(i<notes.length-1){i++;render();}};
document.getElementById('reset').onclick=()=>{stop();i=0;render();};
document.getElementById('play').onclick=()=>{
  if(timer){stop();return;}
  if(i===notes.length-1){i=0;render();}
  document.getElementById('play').textContent='Пауза';
  timer=setInterval(()=>{if(i<notes.length-1){i++;render();}else stop();},2800);
};
render();
</script>
</body>
</html>
