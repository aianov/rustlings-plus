[chapter]
title.ru = "Воркспейсы и модули"

[[chapter.visuals]]
file = "visuals/workspace_graph.html"
title.ru = "Воркспейс: члены, path-зависимости, один Cargo.lock и один target"

[[chapter.visuals]]
file = "visuals/feature_unify.html"
title.ru = "Features от двух крейтов сливаются в одну сборку общей зависимости"

[[exercises]]
name = "wsp_first"
kind = "project"
style = "scratch"
locked = ["acceptance/Cargo.toml", "acceptance/tests/acceptance.rs"]
test_command = ["cargo", "test", "--manifest-path", "acceptance/Cargo.toml"]
hint.ru = ["""Начни с корня: какие две вещи cargo должен узнать из корневого манифеста, чтобы считать папку воркспейсом? Потом запусти `cargo build` и читай ошибку про крейт, которого не видно.""", """Корень: таблица `[workspace]` с `resolver` и `members`. Члены задай маской, чтобы новые крейты подхватывались сами. Зависимость между соседями: `geometry = { path = "../geometry" }` в манифесте того, кто её использует."""]
why.ru = """Виртуальный корень (только `[workspace]`, без `[package]`) говорит: здесь нет программы, здесь живут программы. Маска в members означает, что новый крейт попадает в сборку сам, и про него нельзя «забыть». resolver в виртуальном манифесте надо писать явно, иначе cargo молча выберет старое поведение. Path-зависимость между соседями это и есть стрелка в графе крейтов; один Cargo.lock и один target на всех появляются сами, пока ты не создаёшь вложенных воркспейсов."""

[[exercises]]
name = "wsp_q1"
kind = "question"
question.ru = """Корневой Cargo.toml воркспейса содержит только `[workspace]` с `members = ["crates/*"]`, внутри три библиотечных крейта. Что делает `cargo build` без флагов, запущенный в корне?"""
options.ru = ["ничего: надо указать -p или --workspace", "собирает все три крейта", "собирает только первый по алфавиту", "завершается ошибкой: у корня нет [package]"]
answer = [1]
explain.ru = """В виртуальном воркспейсе `default-members` по умолчанию равен всем членам, поэтому `cargo build`, `cargo test` и `cargo check` без флагов работают со всеми крейтами. Флаг `-p имя` сужает выбор до одного пакета, а `--workspace` нужен там, где в корне есть и обычный пакет (тогда по умолчанию берётся только он)."""
hint.ru = """Вспомни, зачем вообще нужен корень без [package]."""

[[exercises]]
name = "wsp_shared_deps"
kind = "project"
style = "todo"
locked = ["acceptance/Cargo.toml", "acceptance/tests/acceptance.rs"]
test_command = ["cargo", "test", "--manifest-path", "acceptance/Cargo.toml"]
hint.ru = ["""Одни и те же версии записаны в трёх манифестах по-разному. Куда в воркспейсе принято складывать то, что должно совпадать у всех, и как член на это ссылается?""", """Корень: `[workspace.package]`, `[workspace.dependencies]` (внешние и внутренние через path) и `[workspace.lints]`. Член: `version.workspace = true`, `serde.workspace = true`, `[lints] workspace = true`. Лишний feature добавляется в записи члена: `{ workspace = true, features = [...] }`."""]
why.ru = """Общая версия живёт в одном месте, поэтому обновление зависимости это одна правка и один diff. Член ссылается на запись корня через `workspace = true` и может только добавить features, но не поменять версию. Это ровно то, что нужно dump'у: порядок ключей JSON его личное дело, и общая запись serde_json остаётся чистой. `[workspace.lints]` раздаёт правила всем, кто явно написал `[lints] workspace = true`: без этой строки в члене правила молча не действуют, поэтому тест проверяет каждый крейт."""

[[exercises]]
name = "wsp_q2"
kind = "question"
question.ru = """В корне: `tokio = { version = "1", features = ["rt"] }` в `[workspace.dependencies]`. Крейт `a` пишет `tokio = { workspace = true, features = ["macros"] }`, крейт `b` пишет `tokio = { workspace = true }`. Собираем весь воркспейс. С какими features соберётся tokio?"""
options.ru = ["только rt", "rt и macros для a, только rt для b: две копии", "rt и macros в одной общей сборке", "ошибка: features нельзя добавлять к записи из корня"]
answer = [2]
explain.ru = """Добавка features к общей записи складывается с тем, что написано в корне, а сборка зависимости одна на всё дерево: features объединяются. Поэтому b тоже получит macros, хотя не просил. Именно так «лишний» feature одного крейта оказывается включён у всех соседей. Хорошо, пока features аддитивны."""
hint.ru = """Вспомни, сколько копий одной версии зависимости собирает cargo."""

[[exercises]]
name = "wsp_lost_member"
kind = "project"
style = "bughunt"
locked = ["acceptance/Cargo.toml", "acceptance/tests/acceptance.rs"]
test_command = ["cargo", "test", "--manifest-path", "acceptance/Cargo.toml"]
hint.ru = ["""Запусти `cargo test --workspace` и сравни, какие тесты запустились, со списком крейтов в папках. Потом зайди в каждую папку крейта и запусти там просто `cargo build`. Что видишь?""", """Два дефекта: часть крейтов не названа в members (и cargo, запущенный внутри такого крейта, жалуется на воркспейс), а в одном манифесте есть собственный `[workspace]`. Лечится маской в members и удалением лишней секции."""]
why.ru = """Забытый член опасен тишиной: `cargo test --workspace` просто не запускает его тесты, и зелёный результат врёт. Вложенный `[workspace]` создаёт второй воркспейс со своим Cargo.lock и своим target, то есть вторую сборку тех же зависимостей, возможно других версий. Маски в members (`crates/*`, `tools/*`) делают так, что новый крейт попадает в воркспейс сам. Тест проверяет итог: один лок, один target и работа из любой папки."""

[[exercises]]
name = "wsp_q3"
kind = "question"
question.ru = """Корень: `members = ["crates/*"]`. В `crates/tool/Cargo.toml` кто-то дописал пустую таблицу `[workspace]`. Что скажет cargo?"""
options.ru = ["всё соберётся, tool станет отдельным воркспейсом", "error: multiple workspace roots found in the same workspace", "предупреждение, секция будет проигнорирована", "tool молча перестанет быть членом"]
answer = [1]
explain.ru = """Манифест с `[workspace]` объявляет корень воркспейса. Корень, который по маске оказался внутри другого воркспейса, даёт ошибку «multiple workspace roots». Если бы `tool` не попадал под маску, он тихо стал бы самостоятельным воркспейсом со своим локом и target: именно так появляются двойные сборки, о которых говорит задача."""
hint.ru = """Сколько корней может быть у одного воркспейса?"""

[[exercises]]
name = "wsp_cycle"
kind = "project"
style = "fix"
locked = ["acceptance/Cargo.toml", "acceptance/tests/acceptance.rs", "crates/app/tests/api.rs"]
test_command = ["cargo", "test", "--manifest-path", "acceptance/Cargo.toml"]
hint.ru = ["""Cargo не принимает круговые зависимости между крейтами. Нарисуй стрелки на бумаге: кто кого импортирует? Что именно users берёт у posts и что posts берёт у users?""", """Обе стороны нужны друг другу ради одного маленького общего типа. Вынеси его в третий крейт, на который смотрят оба, а код, которому нужны оба домена сразу, перенеси на уровень выше (в app)."""]
why.ru = """Цикл между крейтами лечится не уловкой, а переносом зависимости вниз. Общие типы идут в `contracts`, который ни от кого не зависит, и стрелки идут одним направлением: app, потом users и posts, потом contracts. Функция, которой нужны и пользователи, и посты (karma), живёт в app, который видит обоих. Так и растёт большой воркспейс: нижний слой тонкий и стабильный, верхний знает всё."""

[[exercises]]
name = "wsp_feature_unify"
kind = "project"
style = "bughunt"
locked = ["acceptance/Cargo.toml", "acceptance/tests/acceptance.rs", "crates/greeter/tests/greet.rs", "crates/quiet-app/tests/welcome.rs", "crates/loud-app/tests/announce.rs"]
test_command = ["cargo", "test", "--manifest-path", "acceptance/Cargo.toml"]
hint.ru = ["""Запусти `cargo test -p quiet-app`, потом `cargo test --workspace`. Результаты разные. Почему сборка зависимости зависит от того, какие ещё крейты собираются вместе с тобой?""", """Features объединяются по всем собираемым пакетам, а `-p` сужает набор. Код greeter меняет поведение существующей функции в зависимости от feature. Сделай так, чтобы feature ничего не отнимала и не подменяла, и тесты не зависели от набора собираемых крейтов."""]
why.ru = """Пока ты собираешь один крейт (`-p`), его зависимость видит только его features. В `--workspace` она видит сумму всех, и функция, чьё поведение зависит от feature, начинает вести себя иначе для всех. Поэтому feature допустимо только добавлять: новую функцию, новый тип, новую ветку, но не менять смысл существующих. Тест greeter с `--all-features` нужен как раз для этого: если всё включено и поведение прежнее, объединение безопасно."""

[[exercises]]
name = "wsp_q4"
kind = "question"
question.ru = """Воркспейс на resolver 3. Крейт `a` зависит от `log` с `features = ["json"]`, крейт `b` зависит от `log` без features. Запускаем `cargo test -p b`. Будет ли `log` собран с feature json?"""
options.ru = ["да: features объединяются по всему воркспейсу", "нет: при -p учитываются features только выбранных пакетов и их зависимостей", "да, но только в release", "зависит от порядка членов в members"]
answer = [1]
explain.ru = """Современный резолвер (2 и 3) объединяет features среди тех пакетов, что реально собираются. При `-p b` крейт `a` в сборке не участвует, и json не включается. При `--workspace` участвуют оба, и json появляется у всех. Отсюда класс багов «`-p` проходит, `--workspace` падает» и обратный. Лекарство одно: features аддитивны."""
hint.ru = """Что именно сужает флаг -p: набор пакетов или набор features?"""

[[exercises]]
name = "wsp1"
style = "fix"
hint.ru = ["""Для каждого имени, которое не находится, спроси: в каком модуле оно живёт и как оттуда до него дойти? Вверх на уровень, сверху от корня крейта или по соседству?""", """`super::` поднимается к родителю, `crate::` начинается с корня файла, `self::` с текущего модуля. Чаще всего удобнее один `use` в начале модуля, чем длинный путь в каждом вызове."""]
why.ru = """Путь читается как адрес: `crate::` это абсолютный адрес от корня, `super::` и `self::` относительные. В коде, который двигают между модулями, надёжнее абсолютные пути, а в тесно связанных соседях короткие относительные. Приватная `line_sum` осталась приватной: видимость и пути это разные вещи, найти имя ещё не значит получить к нему доступ."""

[[exercises]]
name = "wsp_q5"
kind = "question"
question.ru = """Пакет называется `auth-service` и содержит `src/lib.rs` и `src/main.rs`. Как правильно подключить функцию `verify` из библиотеки в `main.rs`?"""
options.ru = ["use auth-service::verify;", "use auth_service::verify;", "mod auth_service; use auth_service::verify;", "use crate::verify;"]
answer = [1]
explain.ru = """Имя крейта в коде это идентификатор, а в идентификаторе дефиса быть не может, поэтому cargo заменяет его на подчёркивание. `mod auth_service;` создал бы пустой вложенный модуль в бинарнике, а `crate::` в `main.rs` указывает на сам бинарник, где `verify` нет."""
hint.ru = """В каком из вариантов всё же можно сослаться на другой крейт?"""

[[exercises]]
name = "wsp2"
style = "todo"
hint.ru = ["""Для каждого элемента из таблицы в шапке найди самого дальнего потребителя и выбери видимость, которая впускает его и никого дальше.""", """`pub(super)` открывает родителю и его потомкам, `pub(crate)` всему крейту, `pub(in crate::путь)` модулю по указанному пути. Проверяй себя: тесты пробуют вызвать то, что должно быть закрыто."""]
why.ru = """Видимость описывает аудиторию: «кому это нужно». `pub(crate)` честнее, чем `pub`, когда крейт библиотечный: так внутренние помощники не становятся обещанием на всю жизнь. `pub(super)` и `pub(in path)` полезны для тесно связанных соседей. Ошибка новичка: открывать всё подряд, чтобы «заработало». Тесты с попыткой скомпилировать запретный вызов ловят именно её."""

[[exercises]]
name = "wsp_q6"
kind = "question"
question.ru = """Дано:
```rust
mod outer {
    pub mod inner {
        pub(super) fn a() {}
        pub(crate) fn b() {}
        pub(in crate::outer::inner) fn c() {}
        fn d() {}
    }
    pub fn run() {
        inner::a();
        inner::b();
        inner::c();
        inner::d();
    }
}
```
Какие из четырёх вызовов в `run` не скомпилируются? Выбери все."""
options.ru = ["inner::a()", "inner::b()", "inner::c()", "inner::d()"]
answer = [2, 3]
explain.ru = """`run` лежит в модуле `outer`. Для `a` видимость `pub(super)` это `outer`, и `run` внутри, так что вызов законен. `b` видна всему крейту. `c` открыта только внутри `outer::inner`, а `run` снаружи неё, поэтому вызов не пройдёт. `d` приватна: её видит только сам `inner`."""
hint.ru = """Для каждой видимости определи, входит ли модуль outer в область, которую она открывает."""

[[exercises]]
name = "wsp3"
style = "scratch"
hint.ru = ["""Что должно быть приватным, чтобы никто не собрал значение в обход конструктора? И какая функция остаётся единственным входом?""", """Структура-обёртка с приватным полем: `pub struct Rating(u8);`. Конструктор проверяет диапазон. Остальные методы обязаны сами сохранять инвариант, а не надеяться, что аргумент подходящий."""]
why.ru = """Инвариант держится, пока значение нельзя получить иначе, чем через проверяющие входы. Приватное поле закрывает «литерал в обход» и снаружи, и из соседних модулей. Методы изменения идут через те же проверки: `saturating_add` не просто складывает, а возвращает снова валидное значение. Остерегайся `derive(Default)`, `Deserialize` и `unsafe`-преобразований: каждая из этих лазеек выдаёт значение без проверки."""

[[exercises]]
name = "wsp_q7"
kind = "question"
question.ru = """Дано:
```rust
mod score {
    #[derive(Debug, Default, Clone, Copy)]
    pub struct Stars(u8); // допустимо 1..=5

    impl Stars {
        pub fn new(v: u8) -> Option<Stars> {
            (1..=5).contains(&v).then_some(Stars(v))
        }
    }
}
```
Может ли код за пределами модуля `score` получить значение `Stars(0)`?"""
options.ru = ["нет, поле приватное", "да, через Stars::default()", "да, написав Stars(0) после use", "да, но только в тестах"]
answer = [1]
explain.ru = """Приватность поля запрещает только литерал `Stars(0)`. Но `derive(Default)` генерирует реализацию внутри модуля, где поле видно, и она создаёт `Stars(0)`. Любой может вызвать `Stars::default()`. Инвариант нужно защищать от всех способов получить значение: либо не выводить Default, либо реализовать его руками с допустимым значением."""
hint.ru = """Кто пишет код, который derive подставляет в твой тип?"""

[[exercises]]
name = "wsp4"
style = "fix"
hint.ru = ["""Запусти тесты и прочитай, на что жалуется компилятор при включённых `private_interfaces` и `private_bounds`. Кого из внешних вызывающих сейчас нельзя назвать тип, который ему отдают?""", """Есть два честных пути: сделать нужные типы и трейты публичными (скрыв внутренности приватными полями) или не показывать их в сигнатуре. Тесты принимают оба, лишь бы токены печатались."""]
why.ru = """Приватный тип в публичной сигнатуре означает, что вызывающий получает значение, которое не может ни назвать, ни положить в структуру, ни передать дальше в обобщённую функцию. Сегодня это предупреждение, но оно предвестник сломанного API. Публичный тип с приватными полями и методами-доступом это обычный и безопасный способ: структура видна, а устройство нет. Публичность всего подряд тест тоже примет: идея не в том, чтобы прятать любой ценой, а в том, чтобы в сигнатуре не было имён, которых снаружи не написать."""

[[exercises]]
name = "wsp5"
style = "todo"
hint.ru = ["""Что должно остаться снаружи: имена, которыми пользуются, или пути, по которым их хранят? Фасад публикует первое и прячет второе.""", """Модули делай приватными (`mod render;`), а нужные типы поднимай через `pub use`. Модуль prelude это ещё один слой `pub use`. Помощников закрывай как `pub(crate)`."""]
why.ru = """Фасад отделяет то, что ты обещаешь, от того, как это лежит в папках. Пользователь пишет `engine::Mesh`, и ты вправе двигать `mesh.rs` куда угодно. Приватный модуль плюс `pub use` это стандартный приём: имя доступно, путь закрыт. Prelude держи маленьким: только то, что нужно почти каждому; иначе он засоряет чужие пространства имён."""

[[exercises]]
name = "wsp_q8"
kind = "question"
question.ru = """Дано (крейт `lib`):
```rust
mod internal {
    pub struct Secret;
    pub fn make() -> Secret { Secret }
}
pub use internal::make;
```
Внешний крейт вызывает `lib::make()`. Что у него получится?"""
options.ru = ["можно и вызвать, и написать тип lib::internal::Secret", "вызвать можно, значение получить можно, но назвать тип нельзя", "не скомпилируется вообще: тип в сигнатуре приватного модуля", "можно, только если Secret помечен pub(crate)"]
answer = [1]
explain.ru = """`Secret` объявлен как `pub`, поэтому приватного типа в публичной сигнатуре нет, и lint молчит. Но путь к нему закрыт приватным модулем. Вызвать `make()` и получить значение можно, а вот написать его тип в сигнатуре нельзя. Такие «безымянные» типы встречаются в стандартной библиотеке (например, итераторы адаптеров) и иногда оправданы, но чаще это упущение."""
hint.ru = """Отдельно подумай, кто решает, видно ли тип, и кто решает, виден ли путь к нему."""

[[exercises]]
name = "wsp_module_layout"
kind = "project"
style = "todo"
locked = ["acceptance/Cargo.toml", "acceptance/tests/acceptance.rs", "crates/shopcore/tests/api.rs"]
test_command = ["cargo", "test", "--manifest-path", "acceptance/Cargo.toml"]
hint.ru = ["""Открой старт и посчитай: сколько в src/lib.rs уровней вложенных модулей? Каждый уровень это либо папка, либо файл. Приведи всё к одному правилу: модуль с вложенными модулями становится папкой с mod.rs, листья становятся файлами.""", """План файлов в README. Не забудь после переезда исправить пути в use, а в lib.rs оставь только mod и pub use. Сами модули сделай приватными, наружу выходит фасад: `pub use billing::invoice::Invoice;` и так далее."""]
why.ru = """Раскладка по правилу «папка с mod.rs для всего, что имеет детей» читается и ищется проще, чем смесь стилей: открыв папку, сразу видишь все её модули. lib.rs превращается в оглавление, а детали закрыты фасадом, поэтому можно переставлять файлы, не ломая пользователей. Пути с `crate::` переезд переживают без правок, а относительные `super::` нужно перепроверять."""

[[exercises]]
name = "wsp_monorepo"
kind = "project"
style = "scratch"
quiz = true
locked = ["acceptance/Cargo.toml", "acceptance/tests/acceptance.rs"]
test_command = ["cargo", "test", "--manifest-path", "acceptance/Cargo.toml"]
hint.ru = ["""Составь на бумаге граф: кто от кого зависит, и какие записи должны быть общими. Потом пиши корень, потом манифесты снизу вверх (contracts, движки, сервисы), и после каждого запускай `cargo build --workspace`.""", """Корень: members двумя масками, `[workspace.package]`, `[workspace.dependencies]` для serde_json и трёх внутренних крейтов, `[workspace.lints]`. Каждый член: поля `.workspace = true`, зависимости `.workspace = true`, `[lints] workspace = true`. Фасады: в lib.rs каждого крейта `mod x;` и `pub use`, имена из README."""]
why.ru = """Эталон держит всё общее в корне: версии, поля пакета, правила проверок. Манифест члена состоит из ссылок на корень и перечисляет только то, что относится именно к нему. Стрелки идут вниз: сервисы видят движки, движки видят contracts, и никто не видит соседа по слою. Фасады прячут внутренние модули, поэтому движки можно переписывать, не трогая сервисы."""

