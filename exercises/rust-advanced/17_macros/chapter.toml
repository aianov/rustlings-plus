[chapter]
title.ru = "Макросы"

[[chapter.visuals]]
file = "visuals/macro_expand.html"
title.ru = "Как раскрывается макрос"

[[exercises]]
name = "mcr1"
style = "todo"
hint.ru = [
  '''У каждого макроса одно правило вида `(шаблон) => { расширение }`. В шаблоне `$имя:вид` называет кусок. Какой вид подходит куску «выражение», какой «тип», какой «имя»?''',
  '''`limit!`: `($name:ident : $ty:ty = $value:expr)`, расширение объявляет `const`. `square!`: если написать `$e * $e`, выражение будет вычислено дважды. Как вычислить один раз и пользоваться результатом?''',
  '''Расширение, которое состоит из нескольких операторов, оборачивай в двойные фигурные скобки: `{{ let v = $e; v * v }}`, тогда получится одно выражение с локальной переменной. Для `default_of!` нужна запись `<$t as Default>::default()`.''',
]
why.ru = '''Вид фрагмента определяет, как макрос читает токены: `expr` разбирает выражение целиком и вставляет его как одно дерево, поэтому `1 + 2` в `$e * $e` не разваливается на `1 + 2 * 1 + 2`. А вот двойное вычисление остаётся: макрос подставляет код, а не значение, и пишется `$e` дважды. Привычка `let value = $e;` в расширении лечит это. Двойные фигурные скобки нужны, когда расширение из нескольких операторов должно быть выражением.'''

[[exercises]]
name = "mcr_q1"
kind = "question"
question.ru = '''```rust
macro_rules! twice {
    ($e:expr) => { $e + $e };
}

let mut n = 0;
let mut next = || { n += 1; n };
let result = twice!(next());
```
Чему равен `result`?'''
options.ru = [
  "2: выражение вычисляется один раз и удваивается",
  "3: выражение подставлено дважды, вызовы дают 1 и 2",
  "4: `n` к концу равно 2, и оба слагаемых читают его",
  "не соберётся: нельзя вызвать замыкание дважды",
]
answer = [1]
explain.ru = '''Макрос подставляет код, а не значение, поэтому `next()` появится в расширении дважды: `next() + next()`. Первый вызов даёт 1, второй 2, итог 3. Замыкание `FnMut` можно вызывать сколько угодно раз по очереди. Чтобы вычислить один раз, пишут `let v = $e; v + v` (в двойных скобках, если расширение из нескольких операторов).'''
hint.ru = '''Сколько раз слово `$e` встречается в расширении?'''

[[exercises]]
name = "mcr2"
style = "fix"
hint.ru = [
  '''Прочитай ошибку: после `$cond:expr` стоит слово `otherwise`, а в правилах макросов после некоторых видов фрагментов разрешены только определённые токены. Какие именно, говорит сообщение компилятора.''',
  '''После `expr` разрешены только `=>`, `,` и `;`. После `ty` разрешены, например, `=>`, `,`, `=`, `|`, `;`, `:`, `>`, `as`, `where`, но у нас `as` стоит после `expr`. Выбери разделитель из разрешённых.''',
  '''Для `ensure!` второе правило `($cond:expr)` без сообщения: текст условия даёт `stringify!($cond)`. Правила проверяются сверху вниз: следи, чтобы короткое не перехватывало длинное.''',
]
why.ru = '''Это «follow-set»: чтобы разбор макроса оставался однозначным и не ломался от будущих расширений языка, после `expr` разрешены только три токена: `=>`, `,` и `;`. Выражение может продолжаться любым словом (`as`, оператором), и компилятор не станет гадать, где оно кончилось. Для `ty` список шире, для `ident` и `tt` ограничений нет. `stringify!` печатает исходное написание условия, поэтому сообщение получается читаемым.'''

[[exercises]]
name = "mcr3"
style = "fix"
hint.ru = [
  '''Какие вызовы падают? `strings!()` и `strings!["x",]`. Что в шаблоне требует хотя бы один элемент и запрещает запятую в конце?''',
  '''Повторение `$(...),+` значит «один и больше, через запятую», а `$(...),*` «ноль и больше». Необязательное звено записывается `$(...)?`, и запятая в конце это `$(,)?`.''',
  '''Для `tag!` объедини два правила в одно: после имени необязательная часть `$(, class = $c:expr)?`. В расширении такой же `$( .. )?` вставляет код, только если часть была.''',
]
why.ru = '''Три вида повторений: `*` (ноль и больше), `+` (один и больше), `?` (ноль или один). Шаблон с `+` не принимает пустой вызов, а запятая после последнего элемента требует отдельного `$(,)?`. Если часть синтаксиса необязательна, в расширении её тоже оборачивают в `$( .. )?`: макрос подставит код только когда часть была в вызове. Так в стандартной библиотеке написан `vec!`.'''

[[exercises]]
name = "mcr_q2"
kind = "question"
question.ru = '''Макрос объявлен так:
```rust
macro_rules! m { ($($x:expr),+) => { /* .. */ }; }
```
Какие вызовы соберутся? Выбери все.'''
options.ru = [
  "`m!()`",
  "`m!(1)`",
  "`m!(1,)`",
  "`m!(1, 2)`",
  "`m!(1; 2)`",
]
answer = [1, 3]
explain.ru = '''Шаблон `$(...),+` требует хотя бы один элемент (поэтому `m!()` не подойдёт) и разрешает запятую только между элементами (поэтому `m!(1,)` тоже не подойдёт: после запятой ждут ещё один `expr`). Точка с запятой в качестве разделителя не принимается. Чтобы принять пустой вызов и запятую в конце, пишут `$($x:expr),* $(,)?`.'''
hint.ru = '''Что значит `+` в повторении и где разрешена запятая?'''

[[exercises]]
name = "mcr4"
style = "scratch"
hint.ru = [
  '''Опиши вход словами: «пары через запятую, каждая пара: ключ, стрелка, список в квадратных скобках». А список: «значения через запятую». Какой кусок шаблона повторяется внутри какого?''',
  '''Внешнее повторение: `$( $key:expr => [ ... ] ),*`. Внутри квадратных скобок своё повторение: `$( $post:expr ),*`. В расширении они вложены так же: внешний `$( .. )*` содержит внутренний `$( .. ),*`.''',
  '''Запятые в конце: `$(,)?` внутри скобок списка и `$(,)?` после внешнего повторения. Расширение оберни в `{{ .. }}`: внутри заведи `BTreeMap`, внешний цикл повторения вставляет `map.insert(..)`, потом верни `map`.''',
]
why.ru = '''Переменная повторения вставляется ровно на той глубине, на какой она объявлена: `$key` внутри одного уровня, `$post` внутри двух. Если в расширении попытаться использовать `$post` на внешнем уровне, компилятор откажет («still repeating at this depth»). Внешний `$(...)*` в расширении не знает про внутренний заранее: они вкладываются в том же порядке, что и в шаблоне. Двойные скобки дают макросу место для локальной переменной `map`.'''

[[exercises]]
name = "mcr5"
style = "fix"
hint.ru = [
  '''Макрос, как и функция, не видит локальные переменные другой стороны. Какое имя `idx` ищет блок пользователя, и где оно объявлено? Где объявлен `counter` и откуда макрос его берёт?''',
  '''Чтобы макрос и вызывающий договорились об имени, имя должно прийти в макрос как параметр вида `ident`: `($i:ident, ...)`. Тогда `for $i in ..` вводит именно ту переменную, которую видит блок вызывающего.''',
  '''`swap_values!` пиши как `{{ let tmp = $a; $a = $b; $b = tmp; }}`: `tmp` макроса не пересекается с `tmp` вызывающего. Не забудь обновить вызовы `repeat!` и `bump!` в `squares` и `count_events`.''',
]
why.ru = '''Гигиена защищает в обе стороны: макрос не может случайно затереть переменную вызывающего (поэтому `tmp` внутри `swap_values!` безопасен), и не может, наоборот, незаметно её подсмотреть. Если надо договориться об имени, оно передаётся как `ident`. В Си-подобных текстовых макросах эти две ошибки были классикой (`#define SWAP` с `tmp`), в Rust компилятор различает имена по контексту, откуда они пришли.'''

[[exercises]]
name = "mcr_q3"
kind = "question"
question.ru = '''```rust
macro_rules! show {
    () => { println!("{x}") };
}

fn main() {
    let x = 5;
    show!();
}
```
Что произойдёт?'''
options.ru = [
  "напечатает `5`: макрос раскрывается в месте вызова, где `x` виден",
  "ошибка сборки: имя `x` внутри макроса не то же самое, что `x` у вызывающего",
  "напечатает `0`",
  "напечатает пустую строку",
]
answer = [1]
explain.ru = '''Локальные переменные в `macro_rules!` гигиеничны: имя, написанное внутри тела макроса, ищется там, где макрос определён (и там `x` нет), а не в месте вызова. Поэтому макрос не может подсмотреть переменную вызывающего. Чтобы он её видел, имя передают параметром: `($v:ident) => { println!("{}", $v) }` и вызывают `show!(x)`.'''
hint.ru = '''Где ищется имя, написанное в теле макроса: в месте определения или в месте вызова?'''

[[exercises]]
name = "mcr6"
style = "fix"
hint.ru = [
  '''Раскрытие макроса вставляется в место вызова. Как компилятор разрешает там имя `HashMap`: ищет его рядом с вызовом или рядом с определением макроса?''',
  '''Для типов и функций из `std` пиши путь от корня: `::std::collections::HashMap`, с ведущими `::`, чтобы нельзя было подменить модулем `std`. Для собственных функций макрос использует `$crate`: это путь к корню того крейта, где макрос определён.''',
  '''`$crate::util::normalize(word)` работает и в соседнем модуле, и в другом крейте. `#[macro_export]` уже стоит: он выносит макрос в корень крейта, поэтому и зовут `crate::word_counts!` или `имя_крейта::word_counts!`.''',
]
why.ru = '''Только локальные переменные в макросах гигиеничны, а пути (типы, функции, трейты) читаются в месте вызова. Поэтому правильный макрос из библиотеки не полагается на чужие `use`: пути до std идут от корня (`::std::..`), а до собственных функций через `$crate`. Это и есть частая причина «у меня работает, а у пользователя нет». Заметь, что пользовательский `HashMap` в тесте не ломает макрос именно из-за абсолютного пути.'''

[[exercises]]
name = "mcr_q4"
kind = "question"
question.ru = '''Макрос из крейта `a` помечен `#[macro_export]` и используется в крейте `b`, где нет никаких `use` для чужого. Какие пути из тела макроса сработают? Выбери все.'''
options.ru = [
  "`Vec::new()`",
  "`HashMap::new()`",
  "`::std::collections::HashMap::new()`",
  "`helper()`, обычная функция из крейта `a`",
  "`$crate::helper()`, та же функция, если она `pub`",
]
answer = [0, 2, 4]
explain.ru = '''Пути в теле макроса читаются в месте вызова. Всё, что приносит prelude (`Vec`, `Option`, `String`) доступно везде. `HashMap` и функции из `a` нужно называть полностью: `::std::collections::HashMap` с ведущими `::` и `$crate::helper` для собственных функций (но функция должна быть публичной, иначе поможет скрытый `__private`).'''
hint.ru = '''Какие имена доступны в `b` без `use`?'''

[[exercises]]
name = "mcr7"
style = "todo"
hint.ru = [
  '''Какие макросы знают место вызова? `file!()` и `line!()` внутри твоего макроса раскроются там, где его вызвали, а не там, где написан. Проверь это в тесте `check_reports_where_it_was_called`.''',
  '''`join_path!`: `concat!` принимает только литералы, поэтому разделитель нельзя ставить после каждого элемента повторения (получится лишний в конце). Первый элемент отдельно, остальные с разделителем перед каждым.''',
  '''`pick_one!`: два правила. Первое для одного выражения, второе для чего угодно (`$($other:tt)*`) раскрывается в `compile_error!("..")`. Порядок правил важен.''',
]
why.ru = '''Встроенные макросы работают на уровне токенов и поэтому знают то, чего не знают функции: текст выражения, файл, строку, модуль. `compile_error!` превращает неправильное использование макроса в ошибку сборки с твоим сообщением вместо загадочного «no rules expected the token». Для `concat!` важно, что он склеивает литералы, а не значения: константа считается при компиляции и бесплатна во время работы.'''

[[exercises]]
name = "mcr_q5"
kind = "question"
question.ru = '''```rust
fn run() -> u8 {
    greet!();
    1
}

macro_rules! greet {
    () => {};
}
```
Что скажет компилятор? (Макрос не экспортирован.)'''
options.ru = [
  "всё собирается: порядок определений не важен, как у функций",
  "ошибка: макрос `greet` не найден, он определён ниже по тексту",
  "только предупреждение о неиспользуемом макросе",
  "ошибка станет не ошибкой, если добавить `pub`",
]
answer = [1]
explain.ru = '''У `macro_rules!` текстовая область видимости: макрос виден только ниже места определения (в том же модуле и в его вложенных). Функции так не ведут себя, поэтому ошибка неожиданна. Лечится переносом определения выше, `#[macro_use]` на модуле или `#[macro_export]` и вызовом по пути `crate::greet!()`. Слово `pub` для `macro_rules!` не существует.'''
hint.ru = '''Видит ли макрос тот код, который написан выше его определения?'''

[[exercises]]
name = "mcr8"
style = "scratch"
hint.ru = [
  '''Начни с разбора входа: необязательные атрибуты (`$(#[$meta:meta])*`), видимость (`$vis:vis`), `enum`, имя, и в фигурных скобках повторение `имя = "строка"` через запятую, у каждого варианта свои атрибуты.''',
  '''В расширении повтори один и тот же список вариантов три раза: в самом enum, в `ALL` и в `match` двух методов. Полный список текстов для сообщения об ошибке держи в `const`-срезе рядом.''',
  '''`as_str` это `match self { $(Имя::Вариант => $text,)+ }`. `FromStr` зеркально: `match input { $($text => Ok(..),)+ _ => Err(..) }`: литералы в образце работают, потому что `$text` это `literal`.''',
]
why.ru = '''Один список вариантов в вызове превращается в пять разных кусков кода, и новый вариант добавляется одной строкой, а не пятью правками, которые легко забыть. Детали, на которых ломаются: атрибуты и документация переносятся через `$(#[$meta:meta])*` (иначе `derive(Hash)` из вызова теряется), видимость через `$vis:vis`, а `ALL` строится как `const`, чтобы использоваться в const-контексте. Это обычная схема у `strum`-подобных макросов, пока серьёзность задачи не потребует derive.'''

[[exercises]]
name = "mcr9"
style = "scratch"
hint.ru = [
  '''Нужно получить из имён колонок строку `"id, login, created_at"`. `stringify!` умеет печатать любой набор токенов. Что получится из `stringify!(id, login)`?''',
  '''Модуль с именем из вызова создаётся прямо макросом: `pub mod $table { .. }`. `COUNT`: сделай массив из `stringify!($column)` и возьми его длину, она константа. `SELECT`: `concat!` склеивает литералы, а `stringify!` как раз их производит.''',
  '''`users_select` теперь не собирает колонки, а добавляет только `LIMIT`: `format!("{} LIMIT {limit}", users::SELECT)`.''',
]
why.ru = '''Всё, что известно при компиляции, должно считаться при компиляции. `stringify!($($column),+)` печатает сам список через запятую с пробелом, поэтому `join` не нужен, а `concat!` собирает запрос в одну литеральную строку. Длина массива даёт `COUNT` без рекурсии. Бонус: запрос и список колонок теперь описаны один раз и не разъедутся. Именно так в продакшене хранят SQL-константы, а динамическим остаётся только то, что меняется (лимит, параметры).'''

[[exercises]]
name = "mcr10"
style = "scratch"
hint.ru = [
  '''Рекурсия в макросе: правило для пустого случая, правило для «первый + остальные», которое вызывает макрос на остальных. Что считает `count!` в каждом шаге: свою единицу плюс результат для остатка.''',
  '''Для `max_of!` нужен накопитель: вспомогательное правило `(@acc $acc:expr; $next:expr, ...)` несёт текущий максимум. Внешнее правило запускает его: `max_of!(@acc $first; $($rest),*)`. Правила с `@` ставь так, чтобы общее правило их не перехватывало.''',
  '''Не вычисляй `$acc` и `$next` дважды: заведи для них `let` и подставь в следующий вызов выражение `if a >= b { a } else { b }`. Сравнение `>=` работает и для чисел с запятой, и для строк, поэтому `std::cmp::max` (он требует `Ord`) тут не годится.''',
]
why.ru = '''Макрос без рекурсии не может перебрать список переменной длины, а с ней может: каждый вызов съедает один элемент. `@acc` в начале правила это договорённость: внешний пользователь так написать не додумается, значит, правило внутреннее. Накопитель, в который «замотано» выражение, вычисляет каждый аргумент один раз. У рекурсии есть предел (`recursion_limit`, по умолчанию 128), поэтому для сотен элементов макросы пишут иначе, но для списков из десятка аргументов это нормальный путь.'''

[[exercises]]
name = "mcr_q6"
kind = "question"
question.ru = '''Рекурсивный макрос `count!` из задачи вызывают с двумястами аргументами. Что будет?'''
options.ru = [
  "соберётся: рекурсия в макросах не ограничена",
  "ошибка сборки: превышен `recursion_limit` (по умолчанию 128), лечится атрибутом `#![recursion_limit = \"256\"]` или переписыванием без рекурсии",
  "программа соберётся, но упадёт во время работы из-за переполнения стека",
  "соберётся, но сборка займёт минуты, а ошибки не будет",
]
answer = [1]
explain.ru = '''Раскрытие макросов происходит при сборке, и компилятор ограничивает его глубину, чтобы бесконечная рекурсия не повисла: по умолчанию 128. На двухстах аргументах это упирается в предел. Есть два пути: поднять предел или считать иначе, без рекурсии, например `[$(replace!($x ())),*].len()` или обычным массивом строк `[$(stringify!($x)),*].len()`.'''
hint.ru = '''Когда раскрывается макрос: во время сборки или во время работы программы?'''

[[exercises]]
name = "mcr11"
style = "fix"
hint.ru = [
  '''Правила проверяются сверху вниз, и срабатывает первое подходящее. Подходит ли `warn: "x"` под `$($arg:tt)*`? Любой набор токенов подходит под него.''',
  '''Порядок правил должен идти от частного к общему: сначала то, что требует особых токенов (`warn:`), в конце то, что принимает всё. То же с видами: литерал это частный случай выражения, имя тоже.''',
  '''Для `kind_of!` сначала `literal`, потом `ident`, потом `expr`. Если сомневаешься, спроси себя: бывает ли вход, подходящий под оба правила? Тогда частное идёт первым.''',
]
why.ru = '''Сопоставление идёт по порядку, и первое совпавшее правило побеждает, даже если ниже есть более точное. Поэтому макросы пишут «от частного к общему», как ветки `match`. С фрагментами та же логика: любой литерал и любое имя ещё и выражения, поэтому `expr` ставят последним. Бывает и хуже: если разбор фрагмента (`expr`, `ty`) начался и сорвался, компилятор не пробует следующее правило, а сообщает об ошибке. Этим тоже определяется порядок: правило с жадным `expr` лучше ставить после того, что разбирает конкретные токены.'''

[[exercises]]
name = "mcr_q7"
kind = "question"
question.ru = '''```rust
macro_rules! pick {
    ($x:expr) => { "expr" };
    (1) => { "one" };
}
println!("{}", pick!(1));
```
Что напечатается?'''
options.ru = [
  "`one`: литерал точнее выражения",
  "`expr`: первое подошедшее правило побеждает",
  "ошибка сборки: правила пересекаются",
  "обе строки подряд",
]
answer = [1]
explain.ru = '''Правила проверяются сверху вниз и первое совпавшее срабатывает. Литерал `1` это тоже выражение, поэтому первое правило подходит и до второго дело не доходит (компилятор может предупредить о недостижимом правиле). Частные случаи надо ставить выше общих, как ветки `match`.'''
hint.ru = '''Подходит ли `1` под `$x:expr`?'''

[[exercises]]
name = "mcr12"
style = "scratch"
hint.ru = [
  '''Опиши разбор словами: «возьми метод, путь в кавычках, стрелку, имя функции и точку с запятой; добавь маршрут; повтори на остатке; остаток пуст, закончи». Каждое «повтори на остатке» это рекурсивный вызов с остатком в виде `$($rest:tt)*`.''',
  '''Нужен накопитель: имя вектора (`$table:ident`) передаётся во все вызовы. Вход: `routes!(@acc table; ...)`, пустой остаток закрывает рекурсию, непустой остаток разбирают правила по методам, по одному на метод.''',
  '''Правила с `@acc` выше общего `($($entries:tt)*)`, иначе общее перехватит и их. Правило для незнакомого слова идёт после правил с методами и вызывает `compile_error!`. Общее правило создаёт `let mut table = Vec::new()`, запускает `@acc` и возвращает `table` в `{{ .. }}`.''',
]
why.ru = '''Это шаблон «tt-muncher»: общий вход принимает `$($entries:tt)*` (любой набор токенов), а внутренние правила откусывают по записи и вызывают себя. Он универсален, потому что `tt` не требует понимать синтаксис заранее: DSL с любыми словами и стрелками собирается одним макросом. Платой становится порядок правил (внутренние выше общего) и глубина рекурсии. Накопитель-идентификатор работает, потому что имя `table` и в общем правиле, и в `@acc` создано в одном контексте гигиены.'''

[[exercises]]
name = "mcr13"
style = "fix"
hint.ru = [
  '''Какая ошибка на `(A)`? Скобки без запятой в Rust это не кортеж, а просто значение в скобках. Что тогда получается из `impl<A> FromParts for (A)`?''',
  '''Кортеж из одного элемента пишется с запятой: `(A,)`. Запятая должна быть и в типе, и в значении. Чтобы она стояла при любом числе элементов, повтор записывается как `$($name,)+`.''',
  '''Список вызова расширь до четырёх: `(A, B, C, D)`. Остальной код менять не нужно: макрос уже умеет считать слова по числу имён.''',
]
why.ru = '''В Rust `(A)` это просто `A` в скобках, а кортеж из одного элемента пишется `(A,)`. Поэтому макрос, который генерирует типы кортежей, ставит запятую после каждого элемента: `($($name,)+)` даёт `(A,)`, `(A, B,)` и так далее, и всё это валидные типы и значения. Ошибка в исходнике вылезает не сразу и не очевидно: реализация для `(A)` превращается в `impl<A> FromParts for A`, которая конфликтует с реализациями для `u32` и `String`. Так устроены реализации для кортежей в самой `std`.'''

[[exercises]]
name = "mcr_q8"
kind = "question"
question.ru = '''Какие из этих выражений являются кортежами? Выбери все.'''
options.ru = [
  "`(1)`",
  "`(1,)`",
  "`()`",
  "`(1, 2,)`",
  "`(1 + 2)`",
]
answer = [1, 2, 3]
explain.ru = '''`(1)` и `(1 + 2)` это просто выражения в скобках. Кортеж из одного элемента требует запятой: `(1,)`. Пустая пара скобок `()` это кортеж из нуля элементов (тип `()`), а запятая после последнего элемента у `(1, 2,)` ничего не меняет. Поэтому макросы, которые генерируют кортежи, ставят запятую после каждого элемента.'''
hint.ru = '''Что отличает кортеж из одного элемента от значения в скобках?'''

[[exercises]]
name = "mcr14"
style = "todo"
hint.ru = [
  '''Сравни со своим опытом `derive`: для структуры он обходит поля по порядку и применяет один и тот же трейт к каждому. Какие у `fmt::Formatter` есть помощники для структур, кортежных и обычных вариантов?''',
  '''`f.debug_struct("Имя").field("поле", &значение).finish()`; для кортежных вариантов `debug_tuple`; вариант без данных пишется просто именем. Эти же помощники дают и красивый вывод `{:#?}`.''',
  '''`PartialEq` для enum это `match (self, other)` по парам одинаковых вариантов, а все остальные пары дают `false`. `Clone` создаёт новое значение того же варианта с клонами полей.''',
]
why.ru = '''Derive не делает ничего, чего нельзя написать руками: он обходит поля и вызывает для каждого тот же трейт. Руками ты заметишь то, что derive скрывает: `Debug` строится через `debug_struct`/`debug_tuple`, поэтому `{:#?}` работает «бесплатно»; `PartialEq` для enum сопоставляет пары вариантов; `Clone` клонирует каждое поле отдельно. В `Profile` derive потребует `Clone` и `PartialEq` от каждого поля, и это ограничение вытекает из того, что код буквально вызывает метод поля.'''

[[exercises]]
name = "mcr_q9"
kind = "question"
question.ru = '''Какие утверждения верны? Выбери все.'''
options.ru = [
  "`macro_rules!` умеет выполнять цикл или условие на этапе компиляции и решать, какой код выдать",
  "процедурный макрос это функция на Rust, которая получает токены и возвращает токены, и запускается компилятором",
  "`#[derive(...)]` добавляет код рядом с типом, а сам тип не переписывает",
  "`#[derive(...)]` может изменить поля структуры, к которой применён",
]
answer = [1, 2]
explain.ru = '''`macro_rules!` только сопоставляет шаблон и подставляет куски, вычислять он не умеет. Процедурный макрос это полноценная программа: может перебирать поля, строить имена, выбрасывать ошибки. Derive один из трёх видов процедурных макросов (ещё есть макросы-атрибуты и функциональные): он получает определение типа и возвращает дополнительные элементы, но исходный тип остаётся как был. Переписывать тип может только макрос-атрибут.'''
hint.ru = '''Сравни возможности: шаблон с подстановкой против программы, запущенной компилятором.'''

[[exercises]]
name = "mcr_export"
style = "fix"
kind = "project"
locked = ["crates/feed-app/tests/acceptance.rs"]
hint.ru = [
  '''Запусти `cargo test --workspace` и прочитай первую ошибку: в `feed-app` макросов не видно. Чего не хватает макросу, чтобы его можно было подключить из другого крейта?''',
  '''В других крейтах макрос должен ссылаться только на публичное. Для этого есть приём: `#[doc(hidden)] pub mod __private` с повторным экспортом нужных вещей, а в макросе пути `$crate::__private::..`. Вложенные вызовы макросов тоже идут через `$crate::имя!`.''',
  '''Порядок: `macro_rules!` пишется выше первого использования по имени (или вызывается по полному пути). Поправь пути внутри обоих макросов, добавь `#[macro_export]` обоим, `pub use errors::Invalid` оставь на месте, а `errors` и `validate` публичными не делай.''',
]
why.ru = '''Три отдельных причины, и каждая встречается в жизни. `#[macro_export]` выносит макрос в корень крейта, без него он виден только по цепочке `#[macro_use]` или внутри крейта. `$crate` даёт путь к корню крейта-автора, поэтому макрос работает в любом месте. Но пути через `$crate` должны быть публичными, и для этого заводят скрытый модуль `__private` (в документации его нет, а ломать его можно без мажорной версии). Порядок объявления нужен для текстовой области видимости `macro_rules!`: до определения макрос по имени не виден.'''

[[exercises]]
name = "mcr_proc_derive"
style = "scratch"
kind = "project"
locked = ["crates/describe-derive/tests/acceptance.rs"]
hint.ru = [
  '''Начни с того, чтобы просто вывести на экран, что приходит на вход (`println!("{:#?}", input)` в `cargo build` покажет токены). Увидишь знаки `#`, группы `[..]`, слова `pub`, `struct` и группу `{..}` с телом.''',
  '''Разбор в три шага: пропустить атрибуты (`#` и следующая группа) и видимость (`pub` и необязательная группа в `()`), прочитать `struct`/`enum` и имя, разобрать тело. Тело режь на части по запятым верхнего уровня, считая глубину угловых скобок и не считая `>` после `-`.''',
  '''Из каждой части возьми первое слово после атрибутов и видимости. Результат собери обычной `format!`-строкой с `impl Имя { .. }` и преврати в токены методом `.parse::<TokenStream>()`. Ошибку отдавай как `compile_error!("текст");`, тоже строкой.''',
]
why.ru = '''Процедурный макрос это обычная функция из токенов в токены, запущенная компилятором. `syn` и `quote` удобны, но не обязательны: на этом проекте видно, что настоящая сложность не в API, а в языке: запятые внутри `<..>`, стрелки, атрибуты и видимость. Если разбирать вход «по запятым» и «по первому слову», тесты с `HashMap<String, Vec<(u8, u8)>>` и `Box<dyn Fn(u32) -> u32 + Send>` сразу ломают наивное решение. Именно из-за таких углов серьёзные derive используют `syn`.'''

[[exercises]]
name = "mcr_contract_dsl"
style = "scratch"
kind = "project"
quiz = true
locked = ["crates/contracts/tests/acceptance.rs", "crates/user-service/tests/acceptance.rs", "crates/post-service/tests/acceptance.rs"]
hint.ru = [
  '''Разбери вызов на куски: атрибуты и видимость, имя enum, и повторение «Вариант = "имя" (ТипЗапроса) -> ТипОтвета» через запятую. Какой вид фрагмента у типа? Какие токены могут за ним идти?''',
  '''Из одного списка получается пять мест в расширении: сам enum, `ALL`, `ROUTES`, и три `match` (`name`, `request_type`, `response_type`), плюс `from_name` и `duplicates`. Таблица маршрутов строится из `stringify!($request)`, поэтому типы в ней текстом, а константа остаётся константой.''',
  '''Путь к `Route` и `find_duplicates` пиши через `$crate::`, потому что макрос зовут из других крейтов. Проверка существования типов: константа-замыкание, в которой вызывается обобщённая функция с этими типами; она ничего не делает, но заставляет компилятор найти типы.''',
]
why.ru = '''Это те же приёмы, что в маленьких задачах главы, но собранные в работающий инструмент: повторение с несколькими фрагментами (`mcr4`, `mcr8`), константы из `stringify!` (`mcr9`), `$crate` для общего крейта (`mcr6`, `mcr_export`) и проверка порядка правил. Выгода видна сразу: метод добавляется одной строкой, а enum, таблица маршрутов и поиск по имени не могут разъехаться. Путь через `$crate::Route` делает макрос пригодным для любого сервиса, и поэтому оба сервиса не знают о его внутренностях.'''
