<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Как раскрывается макрос</title>
<style>
:root{--bg:#fafaf7;--fg:#1d1d1b;--mut:#6b6b66;--card:#fff;--line:#c9c7bd;--acc:#c2410c;--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;--warn:#a16207;--warnbg:#fef9c3;--btn:#1d1d1b;--btnfg:#fff;--hot:#fff1e6}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--fg:#ecebe6;--mut:#9a9a92;--card:#201f1d;--line:#46443f;--acc:#fb923c;--ok:#4ade80;--okbg:#14301d;--bad:#f87171;--badbg:#3a1a1a;--warn:#facc15;--warnbg:#3a3312;--btn:#ecebe6;--btnfg:#161614;--hot:#33241a}}
*{box-sizing:border-box}
body{margin:0;padding:20px;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 14px}
.panel{max-width:860px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;min-height:150px}
.row{display:flex;gap:10px;align-items:center;font:13px ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--line);border-radius:8px;padding:7px 10px;margin:6px 0}
.row.ok{border-color:var(--ok);background:var(--okbg)}
.row.no{border-color:var(--bad);background:var(--badbg);text-decoration:line-through;opacity:.75}
.row.hot{border-color:var(--warn);background:var(--warnbg)}
.row .tag{margin-left:auto;font:12px system-ui,sans-serif;color:var(--mut);text-decoration:none}
.box{display:inline-block;font:13px ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--line);border-radius:8px;padding:8px 12px;margin:4px 6px 4px 0;vertical-align:top}
.box.ok{border-color:var(--ok);background:var(--okbg)}
.box.hot{border-color:var(--warn);background:var(--warnbg)}
.box.no{border-color:var(--bad);background:var(--badbg)}
.box small{display:block;color:var(--mut);font:12px system-ui,sans-serif}
.arrow{display:inline-block;margin:0 4px;color:var(--mut);font-size:18px;vertical-align:middle}
.note{margin:12px 0;padding:12px 14px;border-left:4px solid var(--acc);background:var(--card);border-radius:0 8px 8px 0;min-height:76px;max-width:860px}
.bar2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:860px}
button{font:inherit;padding:7px 14px;border-radius:8px;border:0;background:var(--btn);color:var(--btnfg);cursor:pointer}
button.alt{background:transparent;color:var(--fg);border:1px solid var(--line)}
button:disabled{opacity:.4;cursor:default}
.cnt{color:var(--mut);margin-left:auto}
</style>
</head>
<body>
<h1>Как раскрывается макрос</h1>
<p class="sub">Сопоставление правил и рекурсивное раскрытие max_of!(3, 9, 2)</p>
<div class="panel" id="panel"></div>
<div class="note" id="note"></div>
<div class="bar2">
  <button id="step">Шаг</button>
  <button id="play" class="alt">Играть</button>
  <button id="reset" class="alt">Сначала</button>
  <span class="cnt" id="cnt"></span>
</div>
<script>
const steps=[{"p": "<p>Вызов:</p><div class=\"row hot\"><code>max_of!(3, 9, 2)</code></div><p>Правила макроса (по порядку):</p><div class=\"row \"><code>(@acc $acc:expr;) =&gt; { $acc }</code><span class=\"tag\">правило 1</span></div><div class=\"row \"><code>(@acc $acc:expr; $next:expr $(, $rest:expr)*) =&gt; { .. max_of!(@acc .. ; $($rest),*) }</code><span class=\"tag\">правило 2</span></div><div class=\"row \"><code>($first:expr $(, $rest:expr)*) =&gt; { max_of!(@acc $first; $($rest),*) }</code><span class=\"tag\">правило 3</span></div>", "n": "Макрос получает не значения, а токены `3 , 9 , 2`. Компилятор будет пробовать правила сверху вниз и возьмёт первое подходящее."}, {"p": "<p>Пробуем правила на <code>3, 9, 2</code>:</p><div class=\"row \"><code>(@acc $acc:expr;) =&gt; { $acc }</code><span class=\"tag\">правило 1</span></div><div class=\"row \"><code>(@acc $acc:expr; $next:expr $(, $rest:expr)*) =&gt; { .. max_of!(@acc .. ; $($rest),*) }</code><span class=\"tag\">правило 2</span></div><div class=\"row hot\"><code>($first:expr $(, $rest:expr)*) =&gt; { max_of!(@acc $first; $($rest),*) }</code><span class=\"tag\">правило 3</span></div><div class=\"row ok\">правила 1 и 2 начинаются с <code>@acc</code>, а у нас вход начинается с <code>3</code>: не подходят. Правило 3: <code>$first = 3</code>, <code>$rest = 9, 2</code><span class=\"tag\">совпало</span></div>", "n": "Правила с `@acc` не подходят, потому что вход не начинается с токена `@`. Подошло третье: `$first` забрал `3`, а повторение `$rest` всё остальное."}, {"p": "<p>Раскрытие правила 3:</p><div class=\"row hot\"><code>max_of!(@acc 3; 9, 2)</code><span class=\"tag\">новый вызов</span></div>", "n": "Расширение само содержит вызов макроса: компилятор раскроет его на следующем шаге. Это и есть рекурсия макросов."}, {"p": "<p>Правило 2 на <code>@acc 3; 9, 2</code>:</p><div class=\"row \"><code>(@acc $acc:expr;) =&gt; { $acc }</code><span class=\"tag\">правило 1</span></div><div class=\"row hot\"><code>(@acc $acc:expr; $next:expr $(, $rest:expr)*) =&gt; { .. max_of!(@acc .. ; $($rest),*) }</code><span class=\"tag\">правило 2</span></div><div class=\"row \"><code>($first:expr $(, $rest:expr)*) =&gt; { max_of!(@acc $first; $($rest),*) }</code><span class=\"tag\">правило 3</span></div><div class=\"row ok\"><code>$acc = 3</code>, <code>$next = 9</code>, <code>$rest = 2</code><span class=\"tag\">совпало</span></div>", "n": "Правило 1 требует, чтобы после `;` ничего не было, а у нас есть `9, 2`. Подходит второе: оно забирает один элемент."}, {"p": "<p>Раскрытие правила 2:</p><div class=\"row hot\"><code>{ let current = 3; let candidate = 9; max_of!(@acc if current &gt;= candidate { current } else { candidate }; 2) }</code><span class=\"tag\">снова вызов</span></div>", "n": "Накопитель `3` вычислен один раз и смешан с `9` в новое выражение. Имена `current` и `candidate` гигиеничны, во вложенных раскрытиях они не конфликтуют."}, {"p": "<p>Ещё раз правило 2, остаток <code>2</code>:</p><div class=\"row \"><code>(@acc $acc:expr;) =&gt; { $acc }</code><span class=\"tag\">правило 1</span></div><div class=\"row hot\"><code>(@acc $acc:expr; $next:expr $(, $rest:expr)*) =&gt; { .. max_of!(@acc .. ; $($rest),*) }</code><span class=\"tag\">правило 2</span></div><div class=\"row \"><code>($first:expr $(, $rest:expr)*) =&gt; { max_of!(@acc $first; $($rest),*) }</code><span class=\"tag\">правило 3</span></div><div class=\"row ok\"><code>$acc = if .. , $next = 2, $rest = пусто</code><span class=\"tag\">совпало</span></div>", "n": "Накопитель теперь целое выражение `if 3 >= 9 {..} else {..}`, `expr` разбирает его как одно целое."}, {"p": "<p>Остаток пуст: правило 1</p><div class=\"row hot\"><code>(@acc $acc:expr;) =&gt; { $acc }</code><span class=\"tag\">правило 1</span></div><div class=\"row \"><code>(@acc $acc:expr; $next:expr $(, $rest:expr)*) =&gt; { .. max_of!(@acc .. ; $($rest),*) }</code><span class=\"tag\">правило 2</span></div><div class=\"row \"><code>($first:expr $(, $rest:expr)*) =&gt; { max_of!(@acc $first; $($rest),*) }</code><span class=\"tag\">правило 3</span></div><div class=\"row ok\"><code>$acc</code> без остатка: расширение равно самому накопителю<span class=\"tag\">конец</span></div>", "n": "Когда `$next` не осталось, подходит первое правило, и рекурсия заканчивается. Вся цепочка раскрылась в один большой блок."}, {"p": "<p>Итог после всех раскрытий:</p><div class=\"row ok\"><code>{ let c1 = 3; let n1 = 9; { let c2 = if c1 &gt;= n1 { c1 } else { n1 }; let n2 = 2; if c2 &gt;= n2 { c2 } else { n2 } } }</code><span class=\"tag\">код без макросов</span></div><p>Каждый аргумент встречается в итоге ровно один раз.</p>", "n": "Компилятор подставил весь код и выбросил макрос. Дальше работает обычная проверка типов и заимствований. Увидеть такое можно через `cargo expand`."}];
let i=0,timer=null;
function stop(){if(timer){clearInterval(timer);timer=null;}document.getElementById('play').textContent='Играть';}
function frame(){document.getElementById('panel').innerHTML=steps[i].p;document.getElementById('note').textContent=steps[i].n;document.getElementById('cnt').textContent='шаг '+(i+1)+' из '+steps.length;document.getElementById('step').disabled=i>=steps.length-1;if(i>=steps.length-1)stop();}
document.getElementById('step').onclick=()=>{if(i<steps.length-1){i++;frame();}};
document.getElementById('reset').onclick=()=>{stop();i=0;frame();};
document.getElementById('play').onclick=()=>{if(timer){stop();return;}if(i>=steps.length-1){i=0;frame();}document.getElementById('play').textContent='Пауза';timer=setInterval(()=>{if(i<steps.length-1){i++;frame();}else stop();},3000);};
frame();
</script>
</body>
</html>
