<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Typestate: состояние живёт в типе</title>
<style>
:root{--bg:#fafaf7;--fg:#1d1d1b;--mut:#6b6b66;--card:#fff;--line:#c9c7bd;--acc:#c2410c;--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;--warn:#a16207;--warnbg:#fef9c3;--btn:#1d1d1b;--btnfg:#fff;--hot:#fff1e6}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--fg:#ecebe6;--mut:#9a9a92;--card:#201f1d;--line:#46443f;--acc:#fb923c;--ok:#4ade80;--okbg:#14301d;--bad:#f87171;--badbg:#3a1a1a;--warn:#facc15;--warnbg:#3a3312;--btn:#ecebe6;--btnfg:#161614;--hot:#33241a}}
*{box-sizing:border-box}
body{margin:0;padding:20px;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 14px}
.panel{max-width:860px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;min-height:150px}
.row{display:flex;gap:10px;align-items:center;font:13px ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--line);border-radius:8px;padding:7px 10px;margin:6px 0}
.row.ok{border-color:var(--ok);background:var(--okbg)}
.row.no{border-color:var(--bad);background:var(--badbg);text-decoration:line-through;opacity:.75}
.row.hot{border-color:var(--warn);background:var(--warnbg)}
.row .tag{margin-left:auto;font:12px system-ui,sans-serif;color:var(--mut);text-decoration:none}
.box{display:inline-block;font:13px ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--line);border-radius:8px;padding:8px 12px;margin:4px 6px 4px 0;vertical-align:top}
.box.ok{border-color:var(--ok);background:var(--okbg)}
.box.hot{border-color:var(--warn);background:var(--warnbg)}
.box.no{border-color:var(--bad);background:var(--badbg)}
.box small{display:block;color:var(--mut);font:12px system-ui,sans-serif}
.arrow{display:inline-block;margin:0 4px;color:var(--mut);font-size:18px;vertical-align:middle}
.note{margin:12px 0;padding:12px 14px;border-left:4px solid var(--acc);background:var(--card);border-radius:0 8px 8px 0;min-height:76px;max-width:860px}
.bar2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:860px}
button{font:inherit;padding:7px 14px;border-radius:8px;border:0;background:var(--btn);color:var(--btnfg);cursor:pointer}
button.alt{background:transparent;color:var(--fg);border:1px solid var(--line)}
button:disabled{opacity:.4;cursor:default}
.cnt{color:var(--mut);margin-left:auto}
</style>
</head>
<body>
<h1>Typestate: состояние живёт в типе</h1>
<p class="sub">Письмо переходит между типами-состояниями, недоступные методы гаснут.</p>
<div class="panel" id="panel"></div>
<div class="note" id="note"></div>
<div class="bar2">
  <button id="step">Шаг</button>
  <button id="play" class="alt">Играть</button>
  <button id="reset" class="alt">Сначала</button>
  <span class="cnt" id="cnt"></span>
</div>
<script>
const steps=[{"p": "<div style=\"margin-bottom:10px\"><span class=\"box \">Letter&lt;Draft&gt;</span><span class=\"arrow\">&rarr;</span><span class=\"box \">Letter&lt;Sealed&gt;</span><span class=\"arrow\">&rarr;</span><span class=\"box \">Letter&lt;Sent&gt;</span></div><div class=\"rows\"><div class=\"row\"><span>impl Letter&lt;Draft&gt;</span><span class=\"tag\">write, seal</span></div><div class=\"row\"><span>impl Letter&lt;Sealed&gt;</span><span class=\"tag\">send</span></div><div class=\"row\"><span>impl&lt;S&gt; Letter&lt;S&gt;</span><span class=\"tag\">text (для любого состояния)</span></div></div>", "n": "Письмо это Letter<S>, где S только метка состояния. Методы разложены по блокам impl: write и seal в impl Letter<Draft>, send в impl Letter<Sealed>, text в общем impl<S>. Пока это просто схема: какой блок что умеет."}, {"p": "<div style=\"margin-bottom:10px\"><span class=\"box \">Letter&lt;Draft&gt;</span><span class=\"arrow\">&rarr;</span><span class=\"box \">Letter&lt;Sealed&gt;</span><span class=\"arrow\">&rarr;</span><span class=\"box \">Letter&lt;Sent&gt;</span></div><div class=\"rows\"><div class=\"row ok\"><span>.write(&amp;str)</span><span class=\"tag\">доступен (impl для Letter&lt;Draft&gt;)</span></div><div class=\"row ok\"><span>.seal()</span><span class=\"tag\">доступен (impl для Letter&lt;Draft&gt;)</span></div><div class=\"row no\"><span>.send()</span><span class=\"tag\">нет такого метода (impl для Letter&lt;Sealed&gt;)</span></div><div class=\"row ok\"><span>.text()</span><span class=\"tag\">доступен (impl для любого S)</span></div></div>", "n": "Новое письмо имеет тип Letter<Draft>. Компилятор знает, какие методы у этого типа есть: write, seal и text. Метода send у Letter<Draft> просто нет, поэтому letter.send() не соберётся."}, {"p": "<div style=\"margin-bottom:10px\"><span class=\"box \">Letter&lt;Draft&gt;</span><span class=\"arrow\">&rarr;</span><span class=\"box \">Letter&lt;Sealed&gt;</span><span class=\"arrow\">&rarr;</span><span class=\"box \">Letter&lt;Sent&gt;</span></div><div class=\"rows\"><div class=\"row ok\"><span>.write(&amp;str)</span><span class=\"tag\">доступен (impl для Letter&lt;Draft&gt;)</span></div><div class=\"row ok\"><span>.seal()</span><span class=\"tag\">доступен (impl для Letter&lt;Draft&gt;)</span></div><div class=\"row no\"><span>.send()</span><span class=\"tag\">нет такого метода (impl для Letter&lt;Sealed&gt;)</span></div><div class=\"row ok\"><span>.text()</span><span class=\"tag\">доступен (impl для любого S)</span></div></div>", "n": "write(self, ..) берёт письмо по значению и возвращает его же: состояние Draft сохраняется, текст дописан. Старая переменная после вызова недоступна, остаётся новая."}, {"p": "<div style=\"margin-bottom:10px\"><span class=\"box \">Letter&lt;Draft&gt;</span><span class=\"arrow\">&rarr;</span><span class=\"box \">Letter&lt;Sealed&gt;</span><span class=\"arrow\">&rarr;</span><span class=\"box \">Letter&lt;Sent&gt;</span></div><div class=\"rows\"><div class=\"row no\"><span>.write(&amp;str)</span><span class=\"tag\">нет такого метода (impl для Letter&lt;Draft&gt;)</span></div><div class=\"row no\"><span>.seal()</span><span class=\"tag\">нет такого метода (impl для Letter&lt;Draft&gt;)</span></div><div class=\"row ok\"><span>.send()</span><span class=\"tag\">доступен (impl для Letter&lt;Sealed&gt;)</span></div><div class=\"row ok\"><span>.text()</span><span class=\"tag\">доступен (impl для любого S)</span></div></div>", "n": "seal(self) возвращает Letter<Sealed>. Это уже другой тип: write для него не существует, так что править запечатанное письмо нельзя. Данные те же, поменялась только метка."}, {"p": "<div style=\"margin-bottom:10px\"><span class=\"box \">Letter&lt;Draft&gt;</span><span class=\"arrow\">&rarr;</span><span class=\"box \">Letter&lt;Sealed&gt;</span><span class=\"arrow\">&rarr;</span><span class=\"box \">Letter&lt;Sent&gt;</span></div><div class=\"rows\"><div class=\"row no\"><span>.write(&amp;str)</span><span class=\"tag\">нет такого метода (impl для Letter&lt;Draft&gt;)</span></div><div class=\"row no\"><span>.seal()</span><span class=\"tag\">нет такого метода (impl для Letter&lt;Draft&gt;)</span></div><div class=\"row no\"><span>.send()</span><span class=\"tag\">нет такого метода (impl для Letter&lt;Sealed&gt;)</span></div><div class=\"row ok\"><span>.text()</span><span class=\"tag\">доступен (impl для любого S)</span></div></div>", "n": "send(self) возвращает Letter<Sent>. Теперь доступен только общий text(): отправить второй раз или дописать нельзя, и компилятор сообщает об этом, а не тесты."}, {"p": "<div class=\"rows\"><div class=\"row no\"><span>impl&lt;S&gt; Letter&lt;S&gt; { fn send(self) .. }</span><span class=\"tag\">дыра</span></div><div class=\"row ok\"><span>impl Letter&lt;Sealed&gt; { fn send(self) .. }</span><span class=\"tag\">верно</span></div></div>", "n": "Типичная ошибка: объявить переход в общем impl<S>. Тогда send есть у любого состояния, и типы ничего не защищают. Общими оставляй только методы, безопасные всегда."}];
let i=0,timer=null;
function stop(){if(timer){clearInterval(timer);timer=null;}document.getElementById('play').textContent='Играть';}
function frame(){document.getElementById('panel').innerHTML=steps[i].p;document.getElementById('note').textContent=steps[i].n;document.getElementById('cnt').textContent='шаг '+(i+1)+' из '+steps.length;document.getElementById('step').disabled=i>=steps.length-1;if(i>=steps.length-1)stop();}
document.getElementById('step').onclick=()=>{if(i<steps.length-1){i++;frame();}};
document.getElementById('reset').onclick=()=>{stop();i=0;frame();};
document.getElementById('play').onclick=()=>{if(timer){stop();return;}if(i>=steps.length-1){i=0;frame();}document.getElementById('play').textContent='Пауза';timer=setInterval(()=>{if(i<steps.length-1){i++;frame();}else stop();},3000);};
frame();
</script>
</body>
</html>
