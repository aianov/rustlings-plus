[chapter]
title.ru = "Generics углублённо"

[[chapter.visuals]]
file = "visuals/typestate.html"
title.ru = "Typestate: состояние живёт в типе"

[[exercises]]
name = "gnc1"
style = "fix"
hint.ru = ["""Посмотри, что стоит на самой структуре и на блоке `impl`. Каждый метод должен требовать только своё.""", """Раздели методы: `new`, `push`, `len`, `is_empty` не требуют ничего; `best` требует порядок; `top` порядок и копирование. Это три разных `impl`-блока."""]
why.ru = """Структура без границ создаётся для любого типа, а требования переехали на блоки `impl`, где они нужны: хранение не требует ничего, `best` только `Ord` (ссылка на максимум, копировать нечего), `top` ещё и `Clone`, потому что возвращает копии. Тест с `f64` и типом без свойств доказывает первое, тест с типом без `Clone` второе. Если поставить `Ord + Clone` на весь `impl`, `best` перестанет работать для типов, которые нельзя копировать."""

[[exercises]]
name = "gnc2"
style = "todo"
hint.ru = ["""Спроси про каждый метод: для каких типов он осмыслен? Для всех, для `Display`, для одного `i32`?""", """Три блока: `impl<T: Display> Labeled<T>`, `impl<T: Display + PartialOrd> Labeled<T>` и `impl Labeled<i32>`. `render_over` может звать `render`."""]
why.ru = """Метод попадает в тот блок, где выполнены все его требования и не больше. `render` нужен только `Display`, поэтому у `Labeled<Vec<u8>>` его нет, а хранение работает. `is_negative` лежит в `impl Labeled<i32>`: у `Labeled<f64>` он не появится, даже если сравнение с нулём там возможно, потому что у вещественных своя логика (минус ноль, NaN). Тест проверяет отсутствие методов компиляцией пробного кода, ведь «лишние» методы поведением не поймать."""

[[exercises]]
name = "gnc_q1"
kind = "question"
question.ru = '''Что скажет компилятор?
```rust
use std::fmt::Display;
struct Tag<T>(T);
impl<T: Display> Tag<T> { fn show(&self) -> String { format!("#{}", self.0) } }
impl Tag<i32> { fn show(&self) -> String { format!("#{:03}", self.0) } }
```'''
options.ru = ["соберётся: для Tag<i32> выберется более конкретный impl", "соберётся, но вызов Tag(5).show() не скомпилируется из-за неоднозначности", "предупреждение о дублировании, сборка идёт", "ошибка: два метода show определены для Tag<i32>"]
answer = [3]
explain.ru = """Обычные (inherent) impl-блоки не перекрываются: для `Tag<i32>` оба блока подходят, и это ошибка уже в объявлении (duplicate definitions), без всякого вызова. Выбора «более конкретного» в Rust нет. Нужное поведение для i32 делают другим именем метода или обобщённой реализацией, которая сама различает типы."""
hint.ru = """Подходит ли `i32` под `T: Display`?"""

[[exercises]]
name = "gnc3"
style = "fix"
hint.ru = """Для каждой ошибки спроси, откуда компилятору взять тип: из аргумента, из возвращаемого значения, из соседней строки. Если неоткуда, напиши сам: `::<T>` в вызове или тип у переменной. Для сумм посмотри на размеры чисел в тестах."""
why.ru = """Все три места одного рода: метод общий по результату (`parse`, `collect`, `sum`), а контекст не говорит, каким он должен быть. Выбор типа тоже решение: `parse::<i32>` собирался бы, но тест с шестью миллиардами показывает, что счётчики в таких функциях лучше брать с запасом. Турбофиш хорош в середине цепочки, аннотация читается лучше, когда результат сразу кладут в переменную."""

[[exercises]]
name = "gnc_q2"
kind = "question"
question.ru = '''Что скажет компилятор?
```rust
let n = "5".parse().unwrap();
println!("{}", n + 1);
```'''
options.ru = ["напечатает 6", "ошибка: type annotations needed", "ошибка: нельзя складывать строку и число", "напечатает 51"]
answer = [1]
explain.ru = """`parse` может вернуть любой тип с `FromStr`, а `n + 1` лишь требует «что-то, что можно сложить с целым литералом». Этого мало, чтобы выбрать тип, и компилятор просит аннотацию: `parse::<i32>()` или `let n: i32`. Литерал `1` не фиксирует тип `n`."""
hint.ru = """Что именно известно компилятору о типе `n` в момент вызова `parse`?"""

[[exercises]]
name = "gnc4"
style = "todo"
hint.ru = ["""Что нужно сделать с именем: сохранить или только прочитать? От ответа зависит трейт: `Into<_>` или `AsRef<_>`.""", """`greet(name: impl Into<String>)`, `count_vowels(s: impl AsRef<str>)`, `checksum(data: impl AsRef<[u8]>)`. В теле вызови `.into()` или `.as_ref()` один раз."""]
why.ru = """`Into<String>` для значения, которое сохраняется: `String` переедет без копии, `&str` скопируется, и вызывающий не пишет `.to_string()`. `AsRef` для значения, которое только читается: подходят `&str`, `String`, `&String`, `Cow`, а для байт ещё `Vec<u8>`, массивы и срезы. Заметь, что `&str` в сигнатуре принимает меньше: `String` пришлось бы заимствовать вручную, а `Cow` приводить."""

[[exercises]]
name = "gnc5"
style = "fix"
hint.ru = ["""Подумай, что функция делает с коллекцией: только читает. Какой самый общий тип для чтения подряд идущих элементов, и какой для текста?""", """`&[T]` вместо `&Vec<T>`, `&str` вместо `&String`. Для результата то же: вместо `Option<&String>` отдавай `Option<&str>`."""]
why.ru = """`&Vec<T>` и `&String` принимают меньше, чем `&[T]` и `&str`, а дают те же возможности чтения. Срез принимает вектор, массив и кусок вектора; `&str` принимает литерал и `&String`, потому что `&String` приводится к `&str` автоматически (deref coercion). Возвращаемое значение тоже лучше отдавать срезом: вызывающему не навязывается внутренний тип хранения. Об этом же предупреждает clippy (`ptr_arg`)."""

[[exercises]]
name = "gnc_q3"
kind = "question"
question.ru = '''`fn total_len(parts: &[impl AsRef<str>]) -> usize`. Какой из вызовов не соберётся?'''
options.ru = ["total_len(&[\"a\", \"bc\"])", "total_len(&vec![String::from(\"a\")])", "total_len(&[String::from(\"a\"), \"b\"])", "total_len(&[Cow::Borrowed(\"a\")])"]
answer = [2]
explain.ru = """`impl AsRef<str>` в аргументе это один параметр типа: все элементы среза обязаны быть одного типа. В третьем варианте в массиве лежат `String` и `&str`, а массив однотипный. Остальные три собираются: каждый содержит элементы одного типа с `AsRef<str>`."""
hint.ru = """Сколько разных типов может быть у элементов одного среза?"""

[[exercises]]
name = "gnc6"
style = "todo"
hint.ru = ["""`parse` возвращает `Result<T, T::Err>`. Что нужно знать про `T::Err`, чтобы вставить его в сообщение?""", """Для `parse_list` нужны две границы: `T: FromStr` и `T::Err: Display`. Номер элемента даёт `enumerate`, пустой текст проверь отдельно, ошибки собери через `collect::<Result<Vec<_>, _>>()`, а номер элемента добавь к ошибке через `map_err` внутри `map`."""]
why.ru = """У `FromStr` тип ошибки ассоциированный, и разные типы выбирают разные: `ParseIntError`, `String`, свои. Общего у них только возможность напечатать, поэтому граница пишется на `T::Err`. Тесты проверяют свой тип `Rgb` с `String` в ошибке: если бы код предполагал `ParseIntError`, он бы не собрался. Для `parse_or` ограничения на ошибку не нужны: её просто выбрасывают."""

[[exercises]]
name = "gnc7"
style = "fix"
hint.ru = ["""Ошибка говорит, что для `I::Item` нет `Display`, сравнения или сложения. Границу надо повесить на элементы, а не на итератор.""", """`where I::Item: Display`, `where I::Item: PartialOrd`, `where I::Item: Sum<I::Item>`. Для `join_all` итератор и коллекция сводятся к `IntoIterator`."""]
why.ru = """Трейт `Iterator` ничего не знает об элементах, поэтому всё, что нужно делать с `Item`, записывается границей на ассоциированный тип в `where`. Для `largest` выбрано `PartialOrd`, а не `Ord`: иначе `f64` не принять, а тест это проверяет. `Sum<I::Item>` говорит «элементы умеют складываться сами с собой». `IntoIterator` в `join_all` позволяет передавать и вектор, и готовый итератор."""

[[exercises]]
name = "gnc8"
style = "scratch"
hint.ru = ["""Нужна структура, которая хранит число, но «помнит» тип. Как заставить компилятор считать, что `T` используется, не храня его?""", """`PhantomData<fn() -> T>` вместо `PhantomData<T>`: тест требует, чтобы `Id<Rc<u8>>` оставался `Send`. Хранилище выдаёт `Id<T>`, принимает `Id<T>`."""]
why.ru = """`T` в `Id<T>` только метка, поэтому нужен `PhantomData`, а форма `fn() -> T` не наследует от `T` ни `Send`, ни `Sync`, ни права на уничтожение. Хранилище использует тот же `T` в паре «вставка и чтение», и смешение `Id<Post>` с `Store<User>` перестаёт собираться: ошибка уходит из тестов в компилятор. Размер `Id` остаётся восемь байт, метка ничего не стоит."""

[[exercises]]
name = "gnc9"
style = "fix"
hint.ru = ["""`derive(Clone, Copy, PartialEq, Hash)` для `Id<T>` ставит границы на `T`. Посмотри, как выглядит развёртка derive и почему `Post` под неё не подходит.""", """Выкинь derive и напиши `impl<T> Clone`, `Copy`, `PartialEq`, `Eq`, `Hash`, `Debug` вручную: каждая смотрит только на `raw`. `Clone` можно сделать через `*self`."""]
why.ru = """`derive` не умеет отличать параметр, который хранится, от метки, и требует свойства от каждого `T`. Для настоящих структур без `Copy` это ломает копирование и хеширование ключей. Ручные реализации честно сравнивают только число и работают при любом `T`. Отдельный выигрыш `Debug`: derive напечатал бы `PhantomData<...>`, а так видно только `Id(7)`."""

[[exercises]]
name = "gnc_q4"
kind = "question"
question.ru = '''Что скажет компилятор?
```rust
use std::marker::PhantomData;
#[derive(Clone)]
struct Handle<T> { id: u32, _m: PhantomData<T> }
struct Conn;
fn main() {
    let a: Handle<Conn> = Handle { id: 1, _m: PhantomData };
    let b = a.clone();
}
```'''
options.ru = ["соберётся: Handle хранит только u32", "ошибка: Conn не реализует Clone, поэтому у Handle<Conn> нет clone", "ошибка: PhantomData нельзя клонировать", "предупреждение о неиспользуемом b"]
answer = [1]
explain.ru = """`derive(Clone)` разворачивается в `impl<T: Clone> Clone for Handle<T>`: граница ставится на каждый параметр, даже если он только метка. У `Conn` нет `Clone`, значит, у `Handle<Conn>` нет и метода `clone`. Лечится ручной реализацией без границы на `T`."""
hint.ru = """Какую границу `derive` ставит на параметр `T`?"""

[[exercises]]
name = "gnc10"
style = "scratch"
hint.ru = ["""Операторы это трейты из `std::ops`: `Add`, `Sub`, `Neg`, `AddAssign`, `Mul<_>`. Что написать в `Output`?""", """Для `3 * money` нужна реализация `Mul<Money> for i64`: тип `Money` стоит в параметре трейта, и правило сироты это допускает. `Sum` складывает итератор с нуля, `Display` форматируй через `unsigned_abs`."""]
why.ru = """Каждый оператор это трейт со своим `Output`. Реализация для `i64` в обратном порядке разрешена, потому что наш тип стоит в параметре трейта. `Sum` нужен, чтобы работал `.sum::<Money>()`, а начинать надо с нуля, иначе сумма пустого набора вышла бы неправильной. В `Display` знак выводят отдельно от модуля: у `-5` целая часть равна нулю, и `-0.05` теряет минус, если форматировать `abs / 100` со знаком числа."""

[[exercises]]
name = "gnc11"
style = "todo"
hint.ru = ["""Индексом бывает любой тип: `(usize, usize)` тоже. Какую проверку нужно сделать до вычисления смещения?""", """Проверяй обе оси отдельно, смещение считай как `y * width + x`. Для `IndexMut` вычисли смещение один раз и верни `&mut self.cells[at]`. Для строки `type Output = [T]`."""]
why.ru = """Проверка общего индекса в плоском векторе пропустила бы `(width, 0)`, и ученик получил бы клетку соседней строки без всякой паники. Поэтому проверяется каждая ось, а смещение считается после проверки. Для чтения и записи разных обращений общая функция `offset` избавляет от дубля. `Output = [T]` показывает, что `Index` может возвращать и неразмерные типы."""

[[exercises]]
name = "gnc_q7"
kind = "question"
question.ru = '''Для `Grid` реализован только `Index<(usize, usize)>`. Какая операция не соберётся?'''
options.ru = ["let v = grid[(1, 2)];", "let r = &grid[(1, 2)];", "grid[(1, 2)] += 1;", "println!(\"{}\", grid[(0, 0)]);"]
answer = [2]
explain.ru = """Чтение и взятие ссылки идут через `Index`. Присваивание и `+=` требуют изменяемую ссылку, то есть `IndexMut`. Трейт `IndexMut` обязан быть реализован отдельно (и `Index` для него супертрейт)."""
hint.ru = """Какая ссылка нужна для присваивания: общая или изменяемая?"""

[[exercises]]
name = "gnc12"
style = "todo"
hint.ru = ["""Массив длиной `N` лежит внутри значения. Нужны только индекс следующей записи и счётчик заполненных клеток.""", """Не забудь `N = 0`: остаток от деления на ноль паникует, поэтому `push` возвращает значение сразу. `take_array`: `items.get(..N)?` даёт срез, `try_into()` превращает его в массив."""]
why.ru = """Размер буфера входит в тип, поэтому массив живёт в стеке и копирование не нужно. Начало считается как `(next + N - len) % N`, и вся арифметика по модулю держится на том, что `N` не ноль, а для `N = 0` отдельная ветка. `try_into` из среза в массив срабатывает, только если длины совпали: проверка длины выполнена типом, а не рукой."""

[[exercises]]
name = "gnc_q5"
kind = "question"
question.ru = '''Есть `struct Recent<T, const N: usize> { buf: [T; N] }` и `fn new<const N: usize>() -> Recent<u8, N>`. Какая строка не соберётся?'''
options.ru = ["let c: Recent<u8, 3> = new::<4>();", "let a: Recent<u8, 3> = new();", "let b = new::<4>();", "let d: [Recent<u8, 2>; 2] = [new(), new()];"]
answer = [0]
explain.ru = """`Recent<u8, 3>` и `Recent<u8, 4>` это разные типы, как `Vec<u8>` и `Vec<i8>`. В `c` слева тройка, а турбофиш требует четвёрку. В `a` и `d` значение `N` выводится из ожидаемого типа, в `b` задано явно."""
hint.ru = """Равны ли типы с разным значением const-параметра?"""

[[exercises]]
name = "gnc13"
style = "scratch"
hint.ru = ["""Каждый метод builder'а берёт `mut self`, меняет поле и возвращает `self`. Чего не хватает, чтобы `build` мог сообщить об ошибке?""", """Поля `Option<String>` для обязательных. Порядок проверок в `build` задан условием. Текст считай `chars().count()`, не `len()`. Тег очищай от `#` и приводи к нижнему регистру до проверки на повтор."""]
why.ru = """Обязательные поля хранятся как `Option`, а `build` превращает отсутствие в ошибку, и порядок проверок зафиксирован: иначе при двух ошибках результат зависел бы от случая. Длина считается в символах, потому что лимит про буквы, а не про байты (кириллица занимает два байта на букву). Теги нормализуются сразу при добавлении, поэтому дубль вида `#Rust` и `rust` отсеивается одной проверкой."""

[[exercises]]
name = "gnc_q6"
kind = "question"
question.ru = '''Что скажет компилятор? У `PostBuilder` все методы берут `self` по значению.
```rust
let b = Post::builder().author("ann");
let p = b.text("hi").build();
let q = b.pinned(true).build();
```'''
options.ru = ["соберётся: b копируется", "ошибка: b перемещён в text и больше не доступен", "ошибка: build нельзя вызывать дважды", "соберётся, но q будет без текста"]
answer = [1]
explain.ru = """Методы по значению забирают `b`; `PostBuilder` не `Copy`, поэтому вторая строка использует перемещённое значение. Если нужно собрать два похожих поста, builder клонируют до первого вызова (`#[derive(Clone)]`) или собирают цепочку заново."""
hint.ru = """Что происходит с `b` после вызова метода, который берёт `self`?"""

[[exercises]]
name = "gnc14"
style = "scratch"
hint.ru = ["""Сделай `Session<S>` с общими данными и метку состояния через `PhantomData<S>`. Переход должен переносить данные в значение другого типа.""", """Общий приватный метод `into_state<T>(self) -> Session<T>`; методы переходов лежат в `impl Session<Disconnected>`, `impl Session<Connected>`, `impl Session<Authed>`. `login` возвращает `Result<Session<Authed>, (Session<Connected>, String)>`."""]
why.ru = """Состояние закодировано параметром типа, и каждый метод написан в `impl` для одного состояния, так что недопустимые вызовы не существуют. Переход берёт `self` по значению: старая сессия недоступна, данные переезжают без копий. Неудачный вход возвращает сессию назад, иначе ошибка стоила бы подключения. История хранится в общей части и переживает переходы."""

[[exercises]]
name = "gnc15"
style = "bughunt"
hint.ru = ["""Посмотри, в каком `impl`-блоке лежат `pay` и `ship`. Для каких состояний они существуют?""", """Общий `impl<S>` оставь только для методов, безопасных всегда (`id`). `pay` переложи в `impl Order<New>`, `ship` в новый `impl Order<Paid>`."""]
why.ru = """Тесты поведения зелёные, потому что дыра не в логике, а в области определения методов: `impl<S>` даёт их всем состояниям, и компилятор послушно разрешает повтор. Лечится сужением блоков. Проверка делается пробной компиляцией: у типа-состояния должны исчезнуть методы, а не просто вернуть ошибку во время работы."""

[[exercises]]
name = "gnc16"
style = "scratch"
hint.ru = ["""Нужны два параметра типа: по одному на каждое обязательное поле. Каждый принимает значение `Missing` или `Set`.""", """Сеттер имени объявляется для любого `E` и возвращает `ProfileBuilder<Set, E>`; сеттер почты симметрично. `build` лежит в `impl ProfileBuilder<Set, Set>`. `bio` возвращает `Self`."""]
why.ru = """Каждое обязательное поле получило свой параметр-состояние. Сеттеры обобщены по другому параметру, поэтому порядок вызовов не важен и повторный вызов допустим. `build` существует только для `<Set, Set>`, так что забытое поле это ошибка сборки, а не `Result` во время работы. Платой служит сложность типов в сообщениях компилятора, поэтому метки состояний имеют говорящие имена."""

[[exercises]]
name = "gnc_q8"
kind = "question"
question.ru = '''Что скажет компилятор?
```rust
use std::str::FromStr;
fn read<T: FromStr>(raw: &str) -> Result<T, String> {
    raw.parse::<T>().map_err(|e| e.to_string())
}
```'''
options.ru = ["ошибка: у T::Err нет Display, поэтому нет to_string", "соберётся", "ошибка: parse нельзя звать с обобщённым T", "ошибка: нужен T: Default"]
answer = [0]
explain.ru = """Про тип ошибки `T::Err` известно только то, что он есть. `to_string` приходит от `Display`, поэтому нужна граница на ассоциированный тип: `where T::Err: Display`. Граница на сам `T` её не заменяет."""
hint.ru = """Что известно про `T::Err`, если написано только `T: FromStr`?"""

