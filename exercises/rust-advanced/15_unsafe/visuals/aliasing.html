<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Две &amp;mut на одни данные</title>
<style>
:root{--bg:#fafaf7;--fg:#1d1d1b;--mut:#6b6b66;--card:#fff;--line:#c9c7bd;--acc:#c2410c;--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;--warn:#a16207;--warnbg:#fef9c3;--btn:#1d1d1b;--btnfg:#fff;--hot:#fff1e6}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--fg:#ecebe6;--mut:#9a9a92;--card:#201f1d;--line:#46443f;--acc:#fb923c;--ok:#4ade80;--okbg:#14301d;--bad:#f87171;--badbg:#3a1a1a;--warn:#facc15;--warnbg:#3a3312;--btn:#ecebe6;--btnfg:#161614;--hot:#33241a}}
*{box-sizing:border-box}
body{margin:0;padding:20px;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 14px}
.panel{max-width:860px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;min-height:150px}
.row{display:flex;gap:10px;align-items:center;font:13px ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--line);border-radius:8px;padding:7px 10px;margin:6px 0}
.row.ok{border-color:var(--ok);background:var(--okbg)}
.row.no{border-color:var(--bad);background:var(--badbg);text-decoration:line-through;opacity:.75}
.row.hot{border-color:var(--warn);background:var(--warnbg)}
.row .tag{margin-left:auto;font:12px system-ui,sans-serif;color:var(--mut);text-decoration:none}
.box{display:inline-block;font:13px ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--line);border-radius:8px;padding:8px 12px;margin:4px 6px 4px 0;vertical-align:top}
.box.ok{border-color:var(--ok);background:var(--okbg)}
.box.hot{border-color:var(--warn);background:var(--warnbg)}
.box.no{border-color:var(--bad);background:var(--badbg)}
.box small{display:block;color:var(--mut);font:12px system-ui,sans-serif}
.arrow{display:inline-block;margin:0 4px;color:var(--mut);font-size:18px;vertical-align:middle}
.note{margin:12px 0;padding:12px 14px;border-left:4px solid var(--acc);background:var(--card);border-radius:0 8px 8px 0;min-height:76px;max-width:860px}
.bar2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:860px}
button{font:inherit;padding:7px 14px;border-radius:8px;border:0;background:var(--btn);color:var(--btnfg);cursor:pointer}
button.alt{background:transparent;color:var(--fg);border:1px solid var(--line)}
button:disabled{opacity:.4;cursor:default}
.cnt{color:var(--mut);margin-left:auto}
</style>
</head>
<body>
<h1>Две &amp;mut на одни данные</h1>
<p class="sub">Что оптимизатор делает с допущением «изменяемая ссылка уникальна»</p>
<div class="panel" id="panel"></div>
<div class="note" id="note"></div>
<div class="bar2">
  <button id="step">Шаг</button>
  <button id="play" class="alt">Играть</button>
  <button id="reset" class="alt">Сначала</button>
  <span class="cnt" id="cnt"></span>
</div>
<script>
const steps=[{"p": "<pre style=\"margin:0 0 8px;font:13px ui-monospace,Menlo,monospace;white-space:pre-wrap\">fn bump_twice(a: &amp;mut i32, b: &amp;mut i32) {\n    *a += 1;\n    *b += 1;\n    *a += 1;\n}</pre><p style=\"color:var(--mut);margin:8px 0 0\">Безопасная функция с двумя изменяемыми ссылками.</p>", "n": "Функция берёт две &mut. Правило Rust: пока жива &mut, к этим данным больше никто не обращается. Поэтому a и b точно указывают на разные числа."}, {"p": "<pre style=\"margin:0 0 8px;font:13px ui-monospace,Menlo,monospace;white-space:pre-wrap\">fn bump_twice(a: &amp;mut i32, b: &amp;mut i32) {\n    *a += 1;\n    *b += 1;\n    *a += 1;\n}</pre><div class=\"box ok\">x = 0<small>одна ячейка</small></div><div class=\"box hot\">a<small>&mut → x</small></div><div class=\"box hot\">b<small>&mut → x</small></div><p style=\"color:var(--mut);margin:8px 0 0\">через unsafe обе ссылки собраны из одного указателя</p>", "n": "Теперь представь, что из unsafe-кода передали обе ссылки на одну и ту же ячейку x. Компилятор об этом не знает и не может узнать: из сигнатуры видно только «две &mut»."}, {"p": "<pre style=\"margin:0 0 8px;font:13px ui-monospace,Menlo,monospace;white-space:pre-wrap\">fn bump_twice(a: &amp;mut i32, b: &amp;mut i32) {\n    *a += 1;\n    *b += 1;\n    *a += 1;\n}</pre><p style=\"color:var(--mut);margin:8px 0 0\">что делает оптимизатор, веря в уникальность</p><div class=\"box ok\">держит *a в регистре<small>r = *a</small></div><div class=\"box ok\">r += 1</div><div class=\"box hot\">*b += 1<small>пишет в память</small></div><div class=\"box ok\">r += 1</div><div class=\"box ok\">*a = r<small>итого +2 к a, +1 к b</small></div>", "n": "Оптимизатор вправе не перечитывать *a после записи в *b: «они разные, значит запись в b *a не меняет». Он собирает обе прибавки к a в регистре и записывает один раз."}, {"p": "<pre style=\"margin:0 0 8px;font:13px ui-monospace,Menlo,monospace;white-space:pre-wrap\">fn bump_twice(a: &amp;mut i32, b: &amp;mut i32) {\n    *a += 1;\n    *b += 1;\n    *a += 1;\n}</pre><div class=\"box ok\">x = 0</div><p style=\"color:var(--mut);margin:8px 0 0\">без оптимизаций (debug): 1 → 2 → 3, итог x = 3</p>", "n": "Если собрать без оптимизаций, каждая строка честно читает и пишет память: получается x = 3, как «ожидалось»."}, {"p": "<pre style=\"margin:0 0 8px;font:13px ui-monospace,Menlo,monospace;white-space:pre-wrap\">fn bump_twice(a: &amp;mut i32, b: &amp;mut i32) {\n    *a += 1;\n    *b += 1;\n    *a += 1;\n}</pre><div class=\"box no\">x = 0</div><p style=\"color:var(--mut);margin:8px 0 0\">с оптимизациями (release): запись через b потеряна из регистра, итог x = 2</p>", "n": "С оптимизациями регистр затирает запись через b, итог 2. Тест в debug зелёный, релиз ломается, а в другой версии компилятора может быть иначе. Это и есть неопределённое поведение: язык ничего не обещает."}, {"p": "<pre style=\"margin:0 0 8px;font:13px ui-monospace,Menlo,monospace;white-space:pre-wrap\">fn bump_twice(a: &amp;mut i32, b: &amp;mut i32) {\n    *a += 1;\n    *b += 1;\n    *a += 1;\n}</pre><div class=\"box ok\">pair_mut(v, i, j)<small>i != j</small></div><div class=\"box ok\">i == j → None</div><p style=\"color:var(--mut);margin:8px 0 0\">безопасная функция проверяет, что цели различны, и ловушки нет</p>", "n": "Вывод для кода: безопасная функция, которая раздаёт &mut, сама проверяет различность (i != j, окна не пересекаются). Тогда допущение компилятора выполняется, и оптимизатор правильно переставляет записи."}];
let i=0,timer=null;
function stop(){if(timer){clearInterval(timer);timer=null;}document.getElementById('play').textContent='Играть';}
function frame(){document.getElementById('panel').innerHTML=steps[i].p;document.getElementById('note').textContent=steps[i].n;document.getElementById('cnt').textContent='шаг '+(i+1)+' из '+steps.length;document.getElementById('step').disabled=i>=steps.length-1;if(i>=steps.length-1)stop();}
document.getElementById('step').onclick=()=>{if(i<steps.length-1){i++;frame();}};
document.getElementById('reset').onclick=()=>{stop();i=0;frame();};
document.getElementById('play').onclick=()=>{if(timer){stop();return;}if(i>=steps.length-1){i=0;frame();}document.getElementById('play').textContent='Пауза';timer=setInterval(()=>{if(i<steps.length-1){i++;frame();}else stop();},3000);};
frame();
</script>
</body>
</html>
