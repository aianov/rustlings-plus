[chapter]
title.ru = "unsafe без страха"

[[chapter.visuals]]
file = "visuals/aliasing.html"
title.ru = "Две &mut на одни данные"

[[exercises]]
name = "uns1"
style = "todo"
hint.ru = '''Внутри `unsafe` разыменование `*ptr` разрешено, но проверять границы ты должен сам, до блока. Для среза `as_ptr()` даёт указатель на первый элемент, а `add(i)` сдвигает его на `i` элементов (не байт).'''
why.ru = '''Блок `unsafe` ничего не отключает: он лишь разрешает пять вещей (разыменовать сырой указатель, вызвать `unsafe fn`, обратиться к `static mut`, реализовать `unsafe trait`, читать поле `union`). Поэтому вся проверка границ остаётся в обычном коде перед ним, а внутри блока только то, что компилятор доказать не умеет. Блок делают как можно меньше.'''

[[exercises]]
name = "uns_q1"
kind = "question"
question.ru = '''Какие из этих строк НЕ скомпилируются, даже если их написать внутри `unsafe { ... }`? Выбери все.'''
options.ru = [
  "`let a = &mut x; let b = &mut x; *a += 1; *b += 1;`",
  "`let n: i32 = \"5\";`",
  "`*raw_ptr = 5;`, где `raw_ptr: *mut i32`",
  "`drop(text); println!(\"{text}\");`, где `text: String`",
]
answer = [0, 1, 3]
explain.ru = '''`unsafe` снимает пять конкретных запретов, и разыменование сырого указателя среди них. Всё остальное работает как обычно: правила заимствования (две изменяемые ссылки), типы и владение (использование после перемещения). Поэтому внутри `unsafe` по-прежнему работает почти вся проверка, и баги, которые ты вносишь, обычно сидят в нескольких строках с указателями.'''
hint.ru = '''Какие из четырёх запретов относятся к списку «пять вещей, которые разрешает unsafe»?'''

[[exercises]]
name = "uns2"
style = "todo"
hint.ru = [
  '''Что обязан гарантировать вызывающий `get_raw`? Это и есть содержимое раздела Safety: одно-два предложения.''',
  '''`values.get_unchecked(index)` сам `unsafe`. В редакции 2024 даже тело `unsafe fn` требует отдельного блока `unsafe { }` вокруг опасной операции.''',
  '''Обёртка: `if index < values.len() { unsafe { get_raw(..) } } else { default }`. Перед каждым блоком напиши `// SAFETY:` и одним предложением, почему условие выполнено в этом месте.''',
]
why.ru = '''`unsafe fn` переносит доказательство на вызывающего, поэтому правило для него записывают в `# Safety`. Безопасная обёртка снимает бремя с остальной программы: пока её проверка стоит прямо перед вызовом, наружу торчит безопасный API. Комментарий `SAFETY:` у блока нужен читателю: он отвечает на вопрос «почему здесь верно», и при правке кода сразу видно, что условие сломали.'''

[[exercises]]
name = "uns_q2"
kind = "question"
question.ru = '''Библиотека выставляет четыре публичные функции. Какие из них нельзя оставлять обычными `pub fn` (без `unsafe`), потому что неверный вызов приведёт к неопределённому поведению? Выбери все.
```rust
pub fn first(v: &[u8]) -> u8 { v[0] }
pub fn at(v: &[u8], i: usize) -> u8 { unsafe { *v.get_unchecked(i) } }
pub fn len_of(p: *const Vec<u8>) -> usize { unsafe { (*p).len() } }
pub fn mix(x: u32) -> u32 { x.wrapping_mul(31) }
```'''
options.ru = [
  "`first`",
  "`at`",
  "`len_of`",
  "`mix`",
]
answer = [1, 2]
explain.ru = '''`first` может паниковать на пустом срезе, но паника это безопасное поведение: программа определённо останавливается. `mix` вообще не опасна. А `at` читает за границей при любом `i`, и `len_of` разыменует любой переданный указатель: в обоих случаях безопасный вызов с неудачным аргументом ломает память. Такие функции делают `unsafe fn` с описанием условий или ставят проверку внутрь.'''
hint.ru = '''Что случится в каждой функции при «неудачном» аргументе: определённая остановка или чтение чужой памяти?'''

[[exercises]]
name = "uns3"
style = "scratch"
hint.ru = [
  '''Почему `let a = &mut v[..mid]; let b = &mut v[mid..];` не собирается, а в стандартной библиотеке такая операция есть? Что там делают иначе?''',
  '''Возьми `as_mut_ptr()` и собери два среза через `slice::from_raw_parts_mut(указатель, длина)`: первый `(base, mid)`, второй `(base.add(mid), len - mid)`. Проверка `mid <= len` стоит ДО блока `unsafe`.''',
  '''Условие безопасности: куски лежат внутри одного выделения, не пересекаются, а исходный `&mut` заимствован на время результата (это даёт сигнатура с одним временем жизни). Запиши это в `// SAFETY:`.''',
]
why.ru = '''Компилятор считает, что любые две ссылки на срез могут пересекаться, а доказать непересечение по двум индексам не умеет. Мы знаем больше: `mid` делит срез. Поэтому внутри мы берём на себя доказательство, а наружу отдаём безопасную сигнатуру. Условие `mid <= len` проверяем до `unsafe`: нарушенное, оно превратило бы второй срез в чтение за границей. Типы с `Drop` проверяют отсутствие двойного освобождения: срезы лишь смотрят на элементы, но не владеют ими.'''

[[exercises]]
name = "uns_q3"
kind = "question"
question.ru = '''Функция делит срез по индексу `mid` и собирает половины через `slice::from_raw_parts_mut`. Что обязана проверить безопасная обёртка перед `unsafe`-блоком?
```rust
pub fn halves<T>(v: &mut [T], mid: usize) -> (&mut [T], &mut [T]) {
    let p = v.as_mut_ptr();
    unsafe { (from_raw_parts_mut(p, mid), from_raw_parts_mut(p.add(mid), v.len() - mid)) }
}
```'''
options.ru = [
  "что `mid <= v.len()`",
  "что `T: Copy`",
  "что срез не пустой",
  "ничего: `from_raw_parts_mut` проверяет границы сама",
]
answer = [0]
explain.ru = '''`from_raw_parts_mut` доверяет вызывающему и границ не проверяет. Если `mid > v.len()`, то `v.len() - mid` переполнится (в debug паника, в release огромная длина), и второй срез смотрит в чужую память. Одной строки `assert!(mid <= v.len())` перед блоком достаточно. `T: Copy` и непустой срез не нужны: пустые куски допустимы.'''
hint.ru = '''Что получится в `v.len() - mid`, если `mid` больше длины?'''

[[exercises]]
name = "uns4"
style = "bughunt"
hint.ru = [
  '''`from_utf8_unchecked` обещает компилятору, что байты уже проверены. Кто проверил? Какая безопасная функция делает проверку и сама возвращает ошибку?''',
  '''Для чтения по индексу есть `slice::get(i)`: он возвращает `Option<&T>`. Для заголовка из трёх байт удобно сопоставление по срезу: `[kind, high, low, ..]`.''',
  '''`u16::from_be_bytes([high, low])` читает два байта в сетевом порядке (старший первым). Все три функции получаются однострочными, без `unsafe`.''',
]
why.ru = '''Быстрее всего `unsafe` оказывается там, где «и так понятно». Если вход идёт извне, то «и так понятно» не работает: невалидный UTF-8 в `str` ломает всё, что рассчитывает на его валидность, а чтение за границей отдаёт чужие данные или падает через раз. Стандартная библиотека проверяет это за пару сравнений, а выигрыша от `unchecked` в таких местах не видно в профиле. Сначала безопасно, `unsafe` только после замеров.'''

[[exercises]]
name = "uns5"
style = "bughunt"
hint.ru = [
  '''Функция безопасная, значит, ЛЮБОЙ вызов обязан быть корректным. Какой вызов выдаст две `&mut` на одно и то же? Подставь его в голове и проверь, что произойдёт в `pair_mut`.''',
  '''Одной проверки границ мало: нужна проверка, что доступы не пересекаются. Для пары элементов это `i != j`. Для окон два непустых диапазона пересекаются, когда `a.start < b.end && b.start < a.end`.''',
  '''Сначала отсеки неверные границы и пересечения (`return None`), потом `unsafe`. В `// SAFETY:` пиши именно это: «индексы различны» и «окна не пересекаются».''',
]
why.ru = '''Две живые `&mut` на одну память это неопределённое поведение, даже если ты ими не пользуешься одновременно: компилятор строит оптимизации на том, что такая ссылка единственная (может держать значение в регистре, переставлять записи). Тест может быть зелёным, потому что конкретная сборка этого не использовала. Поэтому безопасная функция обязана проверить условие, на котором держится её `unsafe`, иначе её вызов из безопасного кода ломает язык.'''

[[exercises]]
name = "uns_q4"
kind = "question"
question.ru = '''Программа напечатала `7` во всех сборках, debug и release, на сотне запусков.
```rust
let mut x = 5;
let p = &mut x as *mut i32;
let a = unsafe { &mut *p };
let b = unsafe { &mut *p };
*a += 1;
*b += 1;
println!("{x}");
```
Можно ли считать этот код корректным?'''
options.ru = [
  "да: результат стабилен, а `unsafe` разрешает такие вещи",
  "нет: две живые `&mut` на одну переменную это неопределённое поведение, и `7` лишь то, что получилось у этих сборок",
  "нет: код не скомпилируется",
  "да, но только в debug, а в release оптимизатор исправит",
]
answer = [1]
explain.ru = '''Неопределённое поведение не обязано выглядеть как сбой. Правило языка такое: пока жива `&mut`, к памяти больше никто не обращается. Нарушив его, ты даёшь компилятору право на любое преобразование, например держать `*a` в регистре и не видеть записи через `b`. Другой компилятор, флаг или соседний код дадут 6 или что-то ещё. Утверждение «тесты зелёные» относится к одной сборке, а не к языку.'''
hint.ru = '''Какие гарантии про `&mut` использует оптимизатор, и выполняются ли они здесь?'''

[[exercises]]
name = "uns6"
style = "todo"
hint.ru = [
  '''Почему нельзя написать `*(&self.value as *const T as *mut T) = v`? Что компилятор вправе предположить про данные за `&T`?''',
  '''`UnsafeCell::get(&self)` возвращает `*mut T` из общей ссылки, и это единственный законный путь. Внутри метода превращай указатель в `&mut` только на время операции.''',
  '''`replace` сделай через `std::mem::replace(&mut *ptr, value)`, а `set` выразится через `replace`. Условие безопасности: в одну секунду жива одна ссылка (тип не `Sync`, наружу ссылок на значение не выдаём).''',
]
why.ru = '''`UnsafeCell` отключает у компилятора допущение «данные за `&T` не меняются», и больше ничего. Остальное держится на твоём обещании: пока ты внутри метода, на значение больше никто не смотрит. Это выполнимо, потому что тип не `Sync` (один поток) и потому что наружу уходят только копии и перемещения, а не ссылки на внутреннее значение (иначе `set` изменил бы данные под чужой ссылкой). `MyCell` автоматически не `Sync` из-за `UnsafeCell`, и это ровно то, что нужно.'''

[[exercises]]
name = "uns7"
style = "scratch"
hint.ru = [
  '''Что должен делать `lock`? Захватить флаг атомарно: «если было `false`, сделать `true`». Какая операция делает это за один шаг?''',
  '''`compare_exchange(false, true, Acquire, Relaxed)` в цикле (с `std::hint::spin_loop()`), а при успехе возвращай охранника. Освобождение это `store(false, Release)` в `Drop` охранника.''',
  '''`Deref` и `DerefMut` отдают `&*lock.value.get()` и `&mut *lock.value.get()`. Для `Sync` нужна граница на `T`: что должно уметь значение, раз его будут трогать разные потоки по очереди?''',
]
why.ru = '''Спинлок это ровно два факта: флаг захватывается неделимой операцией, и данные доступны только держателю флага. Охранник с `Drop` делает второе невозможным нарушить: открыть замок можно только уничтожением охранника. `Acquire` при захвате и `Release` при выходе дают то, чего ждут от замка: всё, что сделал предыдущий держатель, видно следующему. `unsafe impl Sync` с границей `T: Send` честно говорит, что замок передаёт значение между потоками по очереди, поэтому `Rc` внутри не пройдёт.'''

[[exercises]]
name = "uns8"
style = "fix"
hint.ru = [
  '''Разбери, какие выходы из `update` есть. Какие из них минуют строчку `unlock()`?''',
  '''Любой путь, который не доходит до конца функции (паника, `?`, `return`), пропускает ручной `unlock`. Нужно, чтобы замок открывал деструктор, а он вызывается при любом выходе.''',
  '''Заведи маленькую структуру-охранник со ссылкой на флаг и `Drop`, который делает `store(false, Release)`. `lock` возвращает его, а в методах держи его в переменной (`let _unlock = self.lock();`), не `_`.''',
]
why.ru = '''Освобождение, написанное в конце функции вручную, всегда пропускает какой-нибудь выход: ранний `return`, оператор `?`, панику. Деструктор срабатывает на всех путях, включая разматывание стека при панике, поэтому открывать замок должен `Drop`. Ровно по этой причине `std::sync::Mutex` отдаёт охранника, а не пару `lock/unlock`. Имя `_unlock` с подчёркиванием важно: чистое `_` уничтожило бы охранника сразу.'''

[[exercises]]
name = "uns9"
style = "fix"
hint.ru = [
  '''Что нужно от `T`, чтобы безопасно передать `RawBox<T>` в другой поток? Посмотри, как устроен `Box<T>`: он `Send`, когда?''',
  '''`RawBox<T>` ведёт себя как `Box<T>`: `Send`, если `T: Send`, и `Sync`, если `T: Sync`. Границы пишутся прямо в заголовке impl.''',
  '''`unsafe impl<T: Send> Send for RawBox<T> {}` и `unsafe impl<T: Sync> Sync for RawBox<T> {}`. Над каждым impl напиши, почему он верен.''',
]
why.ru = '''`unsafe impl Send` и `unsafe impl Sync` ничего не проверяют: это подпись под обещанием. Верное обещание повторяет поведение настоящего владельца, то есть `Box<T>`. Без границы `T` тип пропускает через потоки что угодно, включая `Rc`, и ошибка выглядит безобидно, пока два потока не испортят счётчик ссылок. Правило: пиши границу на каждый параметр, который тип содержит, и проверяй компиляцией «отрицательных» случаев (`Rc` внутри не должен проходить), как делают эти тесты.'''

[[exercises]]
name = "uns_q5"
kind = "question"
question.ru = '''Спинлок объявлен так:
```rust
pub struct SpinLock<T> { locked: AtomicBool, value: UnsafeCell<T> }
unsafe impl<T: Send> Sync for SpinLock<T> {}
```
Для каких `T` можно положить `Arc<SpinLock<T>>` в `thread::spawn`? Выбери все.'''
options.ru = [
  "`Vec<String>`",
  "`Cell<u32>`",
  "`Rc<u32>`",
  "`*const u8`",
]
answer = [0, 1]
explain.ru = '''Для `thread::spawn` нужно `Arc<SpinLock<T>>: Send`, а это требует `SpinLock<T>: Send + Sync`. `Sync` обещан при `T: Send`, `Send` выводится из полей и тоже требует `T: Send`. `Vec<String>` и `Cell<u32>` оба `Send`, и замок делает доступ к `Cell` по очереди. `Rc` и сырой указатель не `Send`, так что и обёртка в потоки не пойдёт.'''
hint.ru = '''Какой маркер нужен типу внутри `Arc`, чтобы его отправить в поток, и что гарантирует `unsafe impl`?'''

[[exercises]]
name = "uns_safe_buffer"
style = "scratch"
kind = "project"
quiz = true
locked = ["crates/byte-ring/tests/acceptance.rs"]
hint.ru = [
  '''Сначала запиши инварианты: что значат `head` и `len`, какие байты в памяти уже записаны. Индекс записи равен `(head + len) % capacity`, чтение идёт с `head`. Ёмкость ноль обработай отдельно: остаток по модулю нуля паникует.''',
  '''Память: `Layout::array::<u8>(capacity)`, `alloc::alloc` и `NonNull::new`; для нулевой ёмкости `NonNull::dangling()` и никакого выделения. `Drop` освобождает `dealloc` только при ёмкости больше нуля. Не забудь `unsafe impl Send`: сырой указатель сам не `Send`.''',
  '''`write` и `read` делают по два копирования: сначала до конца памяти (`min(count, capacity - индекс)`), потом остаток с начала. `as_slices` возвращает те же два диапазона срезами `from_raw_parts`; если данных нет, верни пустые срезы, не трогая указатель.''',
]
why.ru = '''Всё ядро держится на трёх инвариантах: `head < capacity`, в памяти записано ровно `len` байт начиная с `head` (по кругу), и память освобождается один раз. Каждый `unsafe`-блок ссылается на них, и из-за этого API безопасный: поля приватные, значит, снаружи инвариант не нарушить. Ёмкость ноль отдельный случай, потому что там нет выделенной памяти и остаток по модулю не определён. Случайный прогон против `VecDeque` ловит любую ошибку на стыке кольца, которую глазами не увидеть.'''
