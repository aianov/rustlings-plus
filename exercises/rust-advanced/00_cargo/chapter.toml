[[exercises]]
name = "cargo_anatomy"
kind = "project"
style = "fix"
locked = ["tests/acceptance.rs"]
hint.ru = ["""Запусти `cargo test` и прочитай первую ошибку компилятора: она про цепочку `let` в условии. В какой edition такие цепочки разрешены, написано в README. Потом сверь список целей, который ждут тесты.""", """Три правки в Cargo.toml: edition = "2024", rust-version = "1.88" и секция [[bin]] с name = "calc-bench" и path = "src/bin/bench.rs". Посмотреть результат можно командой `cargo metadata --no-deps --format-version 1`."""]
why.ru = """Cargo находит цели по раскладке папок, а манифест нужен только там, где автоматика не угадывает: имя второго бинарника задано явно через [[bin]], потому что по умолчанию src/bin/bench.rs стал бы просто bench. Edition 2024 лежит в [package], а не в коде: одна строка решает, какой диалект языка видит компилятор. rust-version не ускоряет сборку, зато даёт понятную ошибку тому, у кого компилятор старше."""

[[exercises]]
name = "cargo_q13"
kind = "question"
question.ru = """Что делает строка `rust-version = "1.88"` в `[package]`? Выбери все верные утверждения."""
options.ru = ["cargo скачает компилятор 1.88", "cargo откажется собирать пакет более старым компилятором и объяснит почему", "она сообщает пользователям, какой компилятор нужен минимум", "пакет нельзя собрать компилятором новее 1.88"]
answer = [1, 2]
explain.ru = """`rust-version` это минимальная поддерживаемая версия компилятора (MSRV). Cargo проверяет её до сборки и вместо длинной простыни ошибок о неизвестных возможностях печатает понятное сообщение. Скачивать компилятор она не умеет (это делает rustup и файл rust-toolchain.toml) и верхнюю границу не задаёт."""
hint.ru = """Это ограничение снизу или сверху? И кто его проверяет, cargo или rustup?"""

[[exercises]]
name = "cargo_q1"
kind = "question"
question.ru = """В пакете `chat-core` лежат файлы:
```
Cargo.toml
src/lib.rs
src/main.rs
src/bin/admin.rs
src/bin/seed/main.rs
examples/demo.rs
```
Сколько бинарных целей соберёт обычный `cargo build`?"""
options.ru = ["одну", "две", "три", "четыре"]
answer = [2]
explain.ru = """Три: `src/main.rs` даёт бинарник `chat-core`, `src/bin/admin.rs` даёт `admin`, а папка `src/bin/seed/` с `main.rs` внутри даёт `seed`. Библиотека `src/lib.rs` это отдельная цель, не бинарная. Пример `demo` обычный `cargo build` не трогает: примеры собираются командой `cargo build --examples` или запускаются через `cargo run --example demo`."""
hint.ru = """Считай только файлы, которые cargo сам признаёт точками входа бинарников. Библиотека и пример в счёт не идут."""

[[exercises]]
name = "cargo_lib_bin"
kind = "project"
style = "todo"
locked = ["tests/acceptance.rs"]
hint.ru = ["""Бинарник это просто ещё один крейт пакета, и библиотеку он видит как внешнюю зависимость. Какое у неё имя в коде?""", """Положи второй бинарник в `src/bin/lines.rs`: cargo найдёт его сам, имя будет по имени файла. Оба раза пиши `use` с путём `word_count::stats::analyze`, а не `mod stats;`."""]
why.ru = """Тонкие бинарники над библиотекой нужны, чтобы логику можно было тестировать и переиспользовать: из теста, из второго бинарника, из другого пакета. `mod stats;` в main.rs не дал бы доступа к библиотеке, он скомпилировал бы тот же файл заново как часть бинарника. Дефис в имени пакета превращается в подчёркивание в пути крейта, а вот имя бинарника остаётся с дефисом."""

[[exercises]]
name = "cargo_twin_modules"
kind = "project"
style = "fix"
locked = ["tests/acceptance.rs"]
hint.ru = ["""Сравни пути типов в сообщении компилятора: у одного он начинается с `shelf::model::`, у другого просто `model::`. Откуда взялся второй?""", """Модуль можно объявить (`mod`) ровно в одном корне крейта. В main.rs его надо не объявлять, а подключить из библиотеки: `use shelf::model::Book;`."""]
why.ru = """`mod` не импортирует, а включает файл в текущий крейт. Если один файл включён и в lib.rs, и в main.rs, получаются два независимых типа Book. Правило: модуль объявляется один раз, в корне библиотеки, а бинарник обращается к нему по имени пакета. Ошибка коварна тем, что пути в сообщении выглядят одинаково."""

[[exercises]]
name = "cargo_q2"
kind = "question"
question.ru = """Требование в Cargo.toml: `serde = "1.2.3"`. Какие версии serde под него подходят? Выбери все."""
options.ru = ["1.2.2", "1.2.3", "1.9.0", "2.0.0"]
answer = [1, 2]
explain.ru = """Запись без знака означает то же, что `^1.2.3`: всё от 1.2.3 включительно до 2.0.0 не включая. Версия 1.2.2 старее нижней границы, 2.0.0 уже новый major, то есть по semver возможна несовместимость."""
hint.ru = """Каретка разрешает любые обновления, которые по semver не должны ломать код. Что меняется при смене первого номера?"""

[[exercises]]
name = "cargo1"
style = "scratch"
hint.ru = "Версия это три числа через точку. `split('.')` и `parse::<u64>()` на каждой части, плюс проверка, что четвёртой части нет. Осторожно: `parse::<u64>()` принимает ещё и `+1`, а в версии знак не нужен. Деривация `Ord` на структуре сравнивает поля по порядку, то есть major, потом minor, потом patch, это ровно то, что нужно. Для `matches`: отрежь префикс `=` или `^` через `strip_prefix`, дальше сравнение с нижней границей и равенство major."
why.ru = """Каретка это всего две проверки: версия не меньше нижней границы и первый номер тот же. `derive(PartialOrd, Ord)` сравнивает поля структуры по порядку объявления, поэтому порядок major, minor, patch в структуре важен, а строки сравнивать нельзя: "1.10.0" меньше "1.9.0" как текст. Кривой ввод даёт false, а не панику: библиотека разбора не имеет права падать на чужих строках."""

[[exercises]]
name = "cargo_q3"
kind = "question"
question.ru = """Какие версии подходят под `^0.2.3`? Выбери все."""
options.ru = ["0.2.2", "0.2.9", "0.3.0", "0.2.3"]
answer = [1, 3]
explain.ru = """Для версий 0.x первый ненулевой номер считается «главным»: `^0.2.3` значит `>=0.2.3, <0.3.0`. Поэтому 0.2.3 и 0.2.9 подходят, а 0.3.0 нет. Это правило нуля: пока крейт ещё не дорос до 1.0, любое изменение minor может ломать совместимость."""
hint.ru = """Сколько нулей в начале версии? Граница ставится сразу после первого ненулевого номера."""

[[exercises]]
name = "cargo2"
style = "bughunt"
hint.ru = ["""Тесты падают на нулевых версиях и на тильде. Оба раза неверно считается верхняя граница диапазона, а она живёт в одной функции.""", """Тильда: если указан minor, верхняя граница это (major, minor + 1, 0), иначе (major + 1, 0, 0). У каретки главный разряд первый ненулевой: major, если он больше нуля; иначе minor; иначе patch."""]
why.ru = """Диапазон `[нижняя, верхняя)` решает всё: семь видов требований сводятся к вычислению одной верхней границы. Правило нуля нужно потому, что в 0.x любое изменение может ломать API, поэтому `^0.2.3` не доходит до 0.3.0, а `^0.0.3` не доходит даже до 0.0.4. Тильда мягче: она разрешает только патчи. Ошибка «каретка везде как для 1.x» самая частая, её же делают в самописных проверках версий."""

[[exercises]]
name = "cargo3"
style = "scratch"
hint.ru = ["""`resolve` это конвейер: разобрать требование, разобрать версии (мусор выбросить), оставить подходящие, взять максимум. Максимум по `Version` даёт `.max()`, потому что порядок уже есть.""", """`build` сначала смотрит в лок: если запись есть и `matches(req, запись)`, возвращает её и ничего не меняет. Иначе делает то же, что `update`. `update` берёт `resolve`, и только если версия найдена, пишет её в карту. `build_locked` вообще не изменяет `self`."""]
why.ru = """Cargo.lock делает сборку воспроизводимой: пока записанная версия удовлетворяет Cargo.toml, новые релизы не подтягиваются сами. Новая версия попадает в проект только осознанно, через `cargo update`, причём с `-p` она затрагивает один пакет. Флаг `--locked` нужен CI: если лок устарел, сборка должна упасть, а не тихо переписать файл. Поэтому `build_locked` принимает `&self`, а не `&mut self`."""

[[exercises]]
name = "cargo_q4"
kind = "question"
question.ru = """В репозитории лежит Cargo.lock, где записан `serde 1.0.200`, а в Cargo.toml стоит `serde = "1"`. Вышла версия 1.0.250. Что сделает `cargo build`?"""
options.ru = ["скачает 1.0.250 и перепишет Cargo.lock", "оставит 1.0.200 из Cargo.lock", "упадёт: появилась новая версия", "скачает 1.0.250, но Cargo.lock не тронет"]
answer = [1]
explain.ru = """Cargo.lock фиксирует выбор. Пока записанная версия удовлетворяет Cargo.toml, `cargo build` берёт её и ничего не обновляет. Новую версию ты получишь, только когда сам скажешь: `cargo update` (всё) или `cargo update -p serde` (один пакет)."""
hint.ru = """Зачем вообще нужен Cargo.lock, если cargo каждый раз выбирал бы самое свежее?"""

[[exercises]]
name = "cargo_q5"
kind = "question"
question.ru = """Cargo.toml изменили (`serde = "1"` стало `serde = "2"`), а Cargo.lock остался старым. Что сделает `cargo build --locked`?"""
options.ru = ["пересоздаст лок и соберёт", "завершится ошибкой, лок надо обновить", "проигнорирует Cargo.toml и соберёт по локу", "возьмёт serde 2 из реестра, лок не запишет"]
answer = [1]
explain.ru = """`--locked` запрещает cargo менять Cargo.lock. Если лок нужно менять, чтобы он соответствовал манифесту, команда падает. Это то, что нужно в CI: устаревший лок должен стать красной сборкой, а не тихой правкой файла, которую никто не закоммитит."""
hint.ru = """Что именно запрещает флаг: скачивание, запись в лок или сборку?"""

[[exercises]]
name = "cargo_deps"
kind = "project"
style = "fix"
locked = ["tests/acceptance.rs"]
hint.ru = ["""Запусти `cargo build` и исправляй по одной ошибке: сначала жалуется build.rs, потом, когда он заработает, код в src. Про каждый крейт спроси себя: кто его вызывает, программа, тест или сам build.rs?""", """Код библиотеки видит `[dependencies]`, тесты видят `[dependencies]` и `[dev-dependencies]`, build.rs видит только `[build-dependencies]`. Каждый из трёх крейтов должен остаться ровно в одной секции."""]
why.ru = """Секция отвечает на вопрос «кто и когда использует крейт». build.rs компилируется и запускается до основного кода и видит только свои зависимости. Dev-зависимости не попадают в тех, кто подключит твой пакет, и не собираются в `cargo build`, а значит ускоряют сборку и уменьшают дерево. Неверная секция редко ломает сборку сразу, зато незаметно раздувает чужие проекты, поэтому тест смотрит именно в `cargo tree`."""

[[exercises]]
name = "cargo_q6"
kind = "question"
question.ru = """Напиши команду, которая добавляет крейт `tempfile` в зависимости только для тестов (в `[dev-dependencies]`)."""
answer_text = ["cargo add --dev tempfile", "cargo add tempfile --dev", "cargo add -D tempfile", "cargo add tempfile -D"]
explain.ru = """`cargo add --dev tempfile` (или короткий `-D`) допишет крейт в `[dev-dependencies]`. Для build-зависимости есть `--build`. Команда сама подберёт свежую версию и запишет её с кареткой."""
hint.ru = """У cargo add есть флаги по видам зависимостей: `--dev`, `--build`."""

[[exercises]]
name = "cargo_q7"
kind = "question"
question.ru = """В дереве зависимостей оказался странный крейт `syn`. Напиши команду cargo, которая покажет, кто именно его тянет (обратное дерево)."""
answer_text = ["cargo tree -i syn", "cargo tree --invert syn"]
explain.ru = """`cargo tree -i syn` (`--invert`) переворачивает дерево: показывает, какие пакеты зависят от `syn`, и по цепочке до твоего корня. Рядом полезны `cargo tree -d` (дубликаты версий) и `cargo tree -e features` (какие features включены)."""
hint.ru = """Флаг называется invert."""

[[exercises]]
name = "cargo_features"
kind = "project"
style = "todo"
locked = ["tests/acceptance.rs"]
hint.ru = ["""Feature в Cargo.toml это имя и список того, что она включает. Пустой список значит «просто флаг для cfg». Опциональная зависимость включается записью `dep:имя`.""", """Нужны три строки: `default = ["json"]`, `json = []`, `color = ["dep:colorize"]`. В коде над функциями поставь `#[cfg(feature = "json")]` и `#[cfg(feature = "color")]`. Проверяй `cargo build --no-default-features` и `cargo build --all-features`."""]
why.ru = """`dep:colorize` включает зависимость и прячет её неявную feature, поэтому наружу виден один понятный переключатель color. Код, которому нужна опциональная зависимость, обязан висеть под cfg той же feature, иначе без неё он не соберётся. Про `default` забывают чаще всего: `--no-default-features` как раз отключает всё, что в нём перечислено, и тест на это смотрит."""

[[exercises]]
name = "cargo_q8"
kind = "question"
question.ru = """Крейт A зависит от `lib` с `features = ["fast"]`, крейт B зависит от той же `lib` с `features = ["log"]`. Твоя программа использует и A, и B. Что соберёт cargo?"""
options.ru = ["две копии lib: одну с fast, другую с log", "одну копию lib с fast и log сразу", "одну копию lib, победят features ближайшего к корню", "ошибку: features конфликтуют"]
answer = [1]
explain.ru = """Features аддитивны, и cargo берёт их объединение: одна копия `lib` с `fast` и `log`. Поэтому feature не должна отнимать возможности. Если бы одна из них включала режим «без логов», она сломала бы второго потребителя."""
hint.ru = """Версия у зависимости одна и та же. Сколько раз cargo станет собирать её?"""

[[exercises]]
name = "cargo_features_fix"
kind = "project"
style = "bughunt"
locked = ["tests/acceptance.rs"]
hint.ru = ["""Две отдельные проблемы. Для первой найди в Cargo.toml feature, которая должна «зажигать» опциональную зависимость. Для второй сравни вывод probe с флагом `--all-features` и без него.""", """Первая: `stats = ["dep:tinymap"]`. Вторая: переверни смысл. Была `no_log` и `#[cfg(not(feature = "no_log"))]`. Нужна `log` в `default` и `#[cfg(feature = "log")]`."""]
why.ru = """Features аддитивны: cargo объединяет их по всему дереву зависимостей, и итоговая сборка получает их сумму. Поэтому feature с отрицательным смыслом («без логов», «без std») опасна: достаточно одному крейту её включить, и все остальные потеряют возможность. Безопасный шаблон: возможность включается положительной feature, а отказ от неё это отказ от default. Проверка «--all-features ничего не отнимает» хорошая привычка для любого крейта с features."""

[[exercises]]
name = "cargo_q9"
kind = "question"
question.ru = """В Cargo.toml `colorize` объявлен как `optional = true` и включается только feature `color`. Пакет собирают без этой feature. Соберётся ли такой код?
```rust
fn main() {
    if cfg!(feature = "color") {
        println!("{}", colorize::red("hi"));
    }
}
```"""
options.ru = ["да, ветка просто не выполнится", "нет: крейт colorize не найден, потому что cfg! не вырезает код", "да, но с предупреждением", "зависит от edition"]
answer = [1]
explain.ru = """`cfg!(...)` превращается в обычное `true` или `false`, обе ветки остаются в программе и обе должны скомпилироваться. Без feature крейта `colorize` нет, и ветка с ним не собирается. Нужен атрибут `#[cfg(feature = "color")]`: он вырезает код до компиляции."""
hint.ru = """Вырезается ли код, или подставляется булево значение?"""

[[exercises]]
name = "cargo4"
style = "todo"
hint.ru = ["""`cfg!(debug_assertions)` это обычное булево выражение, а `#[cfg(...)]` вырезает код до компиляции. Для `log_line` нужны две функции с одинаковым именем и взаимоисключающими атрибутами.""", """`#[cfg_attr(test, derive(Debug, PartialEq))]` повесит derive только в тестовой сборке. Помощник для тестов: `#[cfg(test)] fn sample_config() -> Config`. В `retry_delay_ms` добавь `debug_assert!(attempt <= 16, "attempt ...")`, текст сообщения должен содержать слово attempt."""]
why.ru = """`cfg!` оставляет обе ветки в программе и просто подставляет true или false, поэтому подходит там, где код компилируется в любом случае. `#[cfg]` вырезает код целиком: именно он нужен для функций, которых в release быть не должно. `cfg_attr` не раздувает рабочий код derive'ами ради тестов. А `debug_assert!` проверяет то, что должно быть невозможно, и ничего не стоит в release: поведение для таких значений в release задаёт отдельная защита (здесь `min`)."""

[[exercises]]
name = "cargo_q10"
kind = "question"
question.ru = """Дано:
```rust
fn inc(x: u8) -> u8 {
    x + 1
}

fn main() {
    println!("{}", inc(255));
}
```
Что произойдёт при `cargo run` и при `cargo run --release` с настройками по умолчанию?"""
options.ru = ["оба раза напечатает 0", "оба раза паника", "в debug паника, в release напечатает 0", "в debug напечатает 0, в release паника"]
answer = [2]
explain.ru = """По умолчанию проверки переполнения (`overflow-checks`) включены в dev-профиле и выключены в release. Поэтому в debug будет паника `attempt to add with overflow`, а в release значение молча завернётся до 0. Если нужно одинаковое поведение, выбирай явный метод (`wrapping_add`, `checked_add`) или включай `overflow-checks = true` в профиле."""
hint.ru = """Вспомни, где включены проверки: в профиле dev или в release?"""

[[exercises]]
name = "cargo5"
style = "fix"
hint.ru = ["""Сначала запусти `cargo test` и посмотри, какие функции паникуют. Потом реши по смыслу: где «не ниже нуля», где «по кругу», где «сообщи об ошибке».""", """Нужны `saturating_sub`, `wrapping_add`, `checked_add` в `try_fold`, расширение до `u16` для среднего, `checked_abs`, `checked_div`, `overflowing_add` и `wrapping_mul` в хеше."""]
why.ru = """У каждого метода своё обещание: `saturating_` упирается в границу, `wrapping_` идёт по кругу (нужен хешам и счётчикам), `checked_` возвращает None, `overflowing_` отдаёт и результат, и флаг. Обычные `+` и `-` проверяют переполнение только в debug, поэтому тесты могут пройти в release и упасть в debug, или наоборот дать другой ответ. Выбор метода должен быть решением автора, а не следствием профиля сборки."""

[[exercises]]
name = "cargo_profiles"
kind = "project"
style = "todo"
locked = ["tests/acceptance.rs"]
hint.ru = ["""Профили лежат в `[profile.dev]` и `[profile.release]`. Настройки для одной зависимости это отдельная таблица с именем пакета в заголовке.""", """Заголовок для зависимости: `[profile.dev.package.heavy]`. В release нужны четыре ключа: `lto`, `codegen-units`, `panic`, `overflow-checks`. Проверяй себя: `cargo build --release -v` печатает флаги rustc."""]
why.ru = """Профили настраивают компилятор, а не язык: код тот же, но поведение другое. Оптимизировать горячую зависимость в dev значит получать быстрые тесты без потери отладки в своём коде. `panic = "abort"` и `lto` делают бинарник меньше и быстрее, но panic=abort отключает размотку стека, поэтому для библиотек её выбирает владелец бинарника, а не библиотека. А `overflow-checks = true` в release возвращает ту самую панику, которую по умолчанию там заменяет тихий заворот."""

[[exercises]]
name = "cargo_lints"
kind = "project"
style = "fix"
locked = ["tests/acceptance.rs"]
hint.ru = ["""Добавь секции в Cargo.toml и запусти `cargo clippy`: он покажет, какой код теперь запрещён.""", """`[lints.rust]` с `unsafe_code = "forbid"`, `[lints.clippy]` с `unwrap_used = "deny"`. Вместо `get_unchecked(0)` бери `.first()`, вместо `unwrap` бери `.ok()`."""]
why.ru = """[lints] в манифесте работает на все цели пакета и не требует трогать каждый файл. `forbid` сильнее `deny`: его нельзя ослабить локальным `#[allow]`, поэтому для unsafe он честнее. Приоритет -1 у группы нужен, чтобы индивидуальные правила переопределяли её, а не наоборот. Тест копирует пакет и добавляет нарушение: так проверяется, что правило реально включено, а не просто записано."""

[[exercises]]
name = "cargo_build_script"
kind = "project"
style = "scratch"
locked = ["tests/acceptance.rs"]
hint.ru = ["""Сгенерируй текст кода обычным `format!` и запиши его в файл `$OUT_DIR/words.rs`. Путь бери из `env::var_os("OUT_DIR")`. Управляющие строки для cargo это обычные `println!`, начинающиеся с `cargo::`.""", """Очистка: `lines().map(str::trim).filter(...)`, потом `sort_unstable()` и `dedup()`. Литералы с кавычками удобно получать через `{word:?}`. В lib.rs: `include!(concat!(env!("OUT_DIR"), "/words.rs"));`."""]
why.ru = """OUT_DIR это единственное место, куда build.rs можно писать: оно своё у каждой сборки и не загрязняет исходники. `rustc-env` передаёт значения в код через `env!` на этапе компиляции, поэтому версия сборки не требует ни рантайм-чтения файлов, ни ручного обновления. `rerun-if-changed` нужен, чтобы cargo пересобирал генерацию только когда поменялись входные данные. Рабочая папка скрипта это корень пакета, поэтому путь `data/words.txt` относительный."""

[[exercises]]
name = "cargo_q11"
kind = "question"
question.ru = """В `build.rs` нет ни одной строки `cargo::rerun-if-changed`. Когда cargo будет заново запускать скрипт?"""
options.ru = ["никогда после первой сборки", "при каждой сборке", "когда изменится любой файл пакета", "только когда изменится сам build.rs"]
answer = [2]
explain.ru = """Без директив rerun cargo следит за всем пакетом: любой изменённый файл заставит перезапустить скрипт. Как только появилась хотя бы одна `rerun-if-changed`, отслеживаются только указанные пути. Поэтому если ты написал `rerun-if-changed=build.rs` и забыл про данные, правки данных пропадут."""
hint.ru = """Подумай о двух режимах: директив нет и директивы есть."""

[[exercises]]
name = "cargo_build_rerun"
kind = "project"
style = "bughunt"
locked = ["tests/acceptance.rs"]
hint.ru = ["""Два симптома: правки данных не видны, а в src/ после сборки лежит лишний файл. Посмотри на `rerun-if-changed` и на то, куда скрипт пишет результат.""", """`rerun-if-changed=build.rs` следит только за скриптом, добавь путь к `data/items.txt`. Скрипт пишет `src/generated.rs`: результат должен лежать не в исходниках пакета, а там, куда сборка кладёт свои файлы, и lib.rs подключает его иначе, чем обычный модуль."""]
why.ru = """Проверка свежести в cargo основана на времени изменения файлов, и список наблюдаемых путей задаёшь ты. Забытый путь к данным тихо делает правки невидимыми, причём в логах об этом ни слова. Скрипт, который пишет в src/, ещё и подкладывает файлы в исходники: при отсутствии rerun-if-changed это перезапускало бы его после каждой сборки, а в Git появлялся бы мусор. Поэтому тест проверяет все три вещи: чистый src, Fresh на повторной сборке и реакцию на правку данных."""

[[exercises]]
name = "cargo_q12"
kind = "question"
question.ru = """Выбираешь крейт для коммерческого проекта. Три кандидата для одной задачи:
```
A: 4 млн загрузок в месяц, релиз две недели назад, MIT OR Apache-2.0, 3 зависимости
B: 900 тыс. загрузок, последний релиз 5 лет назад, MIT, 0 зависимостей
C: 50 загрузок, релиз вчера, GPL-3.0, 40 зависимостей
```
Кого берёшь?"""
options.ru = ["A", "B", "C", "любого, это не влияет"]
answer = [0]
explain.ru = """A живой, популярный, с разрешающей лицензией и небольшим деревом. B тоже может работать, но пять лет без релизов означают, что исправлений безопасности ждать не от кого. C хуже по всем статьям: почти никем не проверен, тянет сорок зависимостей, а GPL-3.0 для закрытого коммерческого кода обычно неприемлема."""
hint.ru = """Посмотри по очереди на лицензию, свежесть, размер дерева и популярность."""

[[exercises]]
name = "cargo_toolbox"
kind = "project"
style = "scratch"
quiz = true
locked = ["tests/acceptance.rs"]
hint.ru = ["""Иди по списку требований сверху вниз и после каждого запускай `cargo test`: тесты приёмки названы по смыслу и падают по одному. Манифест, build.rs и код идут отдельными шагами.""", """Манифест: [[bin]] для textstat-words, [dependencies] / [dev-dependencies], [features] json = [], [lints.rust], [lints.clippy], [profile.release]. Скрипт сборки смотри в задаче cargo_build_script, а флаги и режимы вывода в main.rs разбирай через `args.iter().position(...)`."""]
why.ru = """Эталон держит каждую настройку на своём месте: зависимости по видам, feature без default, lints на уровне пакета, генерация в OUT_DIR с rerun-if-changed. Бинарники тонкие, всё интересное в библиотеке. Код под feature выделен в отдельные функции с cfg, а не размазан по main. Эта же раскладка станет основой воркспейса в следующей главе."""
