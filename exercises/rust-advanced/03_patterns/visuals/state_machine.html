<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Автомат на (состояние, событие)</title>
<style>
:root{--bg:#fafaf7;--fg:#1d1d1b;--mut:#6b6b66;--card:#fff;--line:#c9c7bd;--acc:#c2410c;--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;--btn:#1d1d1b;--btnfg:#fff;--hot:#fff1e6}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--fg:#ecebe6;--mut:#9a9a92;--card:#201f1d;--line:#46443f;--acc:#fb923c;--ok:#4ade80;--okbg:#14301d;--bad:#f87171;--badbg:#3a1a1a;--btn:#ecebe6;--btnfg:#161614;--hot:#33241a}}
*{box-sizing:border-box}
body{margin:0;padding:20px;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 14px}
.panel{max-width:860px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
svg{width:100%;height:auto;display:block}
.node rect{fill:var(--card);stroke:var(--line);stroke-width:2;transition:all .3s}
.node text{fill:var(--fg);font:14px ui-monospace,Menlo,Consolas,monospace;text-anchor:middle}
.node.now rect{stroke:var(--acc);fill:var(--hot);stroke-width:3}
.node.bad rect{stroke:var(--bad);fill:var(--badbg)}
.edge{stroke:var(--line);stroke-width:2;fill:none;transition:all .3s}
.edge.used{stroke:var(--ok);stroke-width:4}
.elabel{fill:var(--mut);font:12px ui-monospace,Menlo,Consolas,monospace;text-anchor:middle}
.log{font:13px ui-monospace,Menlo,Consolas,monospace;margin-top:8px;min-height:90px}
.log div{padding:2px 0}
.log .ok{color:var(--ok)}
.log .no{color:var(--bad)}
.note{margin:12px 0;padding:12px 14px;border-left:4px solid var(--acc);background:var(--card);border-radius:0 8px 8px 0;min-height:76px;max-width:860px}
.note.no{border-left-color:var(--bad)}
.bar2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:860px}
button{font:inherit;padding:7px 14px;border-radius:8px;border:0;background:var(--btn);color:var(--btnfg);cursor:pointer}
button.alt{background:transparent;color:var(--fg);border:1px solid var(--line)}
button:disabled{opacity:.4;cursor:default}
.cnt{color:var(--mut);margin-left:auto}
</style>
</head>
<body>
<h1>Автомат на (состояние, событие)</h1>
<p class="sub">Замок с кодом. Допустимые переходы перечислены явно, всё остальное отклоняется, а состояние остаётся прежним.</p>
<div class="panel">
<svg viewBox="0 0 760 250" role="img" aria-label="Состояния замка">
  <path id="e_lo" class="edge" d="M190 80 L330 80"/>
  <path id="e_pu" class="edge" d="M410 45 C 440 5, 500 5, 500 45"/>
  <g class="node" id="n_Locked"><rect x="60" y="45" width="130" height="70" rx="10"/><text x="125" y="85">Locked</text></g>
  <g class="node" id="n_Open"><rect x="330" y="45" width="150" height="70" rx="10"/><text x="405" y="85">Open{since}</text></g>
  <g class="node" id="n_Alarm"><rect x="580" y="45" width="130" height="70" rx="10"/><text x="645" y="85">Alarm</text></g>
  <text class="elabel" x="260" y="70">Code(1234)</text>
  <path id="e_al" class="edge" d="M190 100 C 250 170, 520 170, 580 100"/>
  <path id="e_re" class="edge" d="M600 115 C 560 215, 200 215, 150 115"/>
  <text class="elabel" x="470" y="22">Push: since + 1</text>
  <text class="elabel" x="385" y="165">Code(другой)</text>
  <text class="elabel" x="385" y="228">Reset</text>
</svg>
<div class="log" id="log"></div>
</div>
<div class="note" id="note"></div>
<div class="bar2">
  <button id="step">Шаг</button>
  <button id="play" class="alt">Играть</button>
  <button id="reset" class="alt">Сначала</button>
  <span class="cnt" id="cnt"></span>
</div>
<script>
const steps=[
 {ev:'Push',from:'Locked',to:'Locked',ok:false,edge:null,note:'Событие Push в состоянии Locked: такого перехода в таблице нет. Последняя ветка (lock, input) => Err((lock, input)) возвращает и состояние, и событие. Замок остался Locked, ничего не потеряно.'},
 {ev:'Code(1234)',from:'Locked',to:'Open',ok:true,edge:'e_lo',note:'Верный код: ветка (Locked, Code(1234)) создаёт Open { since: 0 }. Литерал 1234 прямо в образце, никаких if.'},
 {ev:'Push',from:'Open',to:'Open',ok:true,edge:'e_pu',note:'Push в Open допустим, и since растёт. Значение since достали образцом Open { since } и положили в новое состояние.'},
 {ev:'Reset',from:'Open',to:'Open',ok:false,edge:null,note:'Reset в Open не предусмотрен. Если завтра добавят новое событие, оно тоже попадёт в последнюю ветку и будет отклонено, а не принято случайно. Это закрытое по умолчанию поведение.'},
 {ev:'Code(1234)',from:'Open',to:'Open',ok:false,edge:null,note:'Повторный верный код в Open: перехода нет. Автомат не делает вид, что всё хорошо: возвращается ошибка, вызывающий решает, что с ней делать.'}
,
 {ev:'Code(0000)',from:'Locked',to:'Alarm',ok:true,edge:'e_al',note:'Для верности вернёмся к закрытому замку (новая сессия) и введём неверный код: ветка (Locked, Code(_)) переводит в Alarm. Конкретный верный код стоит выше общего Code(_), иначе тревога срабатывала бы всегда.'},
 {ev:'Reset',from:'Alarm',to:'Locked',ok:true,edge:'e_re',note:'Единственный выход из Alarm: Reset возвращает Locked. Все остальные события в Alarm отклоняются последней веткой.'}
];
let i=0,timer=null;
function render(){
  const names=['Locked','Open','Alarm'];
  const s=i>0?steps[i-1]:null;
  const cur=s?s.to:'Locked';
  names.forEach(n=>{
    const g=document.getElementById('n_'+n);
    g.setAttribute('class','node'+(n===cur?' now':'')+(s&&!s.ok&&s.from===n?' bad':''));
  });
  ['e_lo','e_pu','e_al','e_re'].forEach(e=>{document.getElementById(e).setAttribute('class','edge'+(s&&s.edge===e?' used':''));});
  const log=document.getElementById('log');
  log.innerHTML=steps.slice(0,i).map(x=>'<div class="'+(x.ok?'ok':'no')+'">'+x.from+' + '+x.ev+' -&gt; '+(x.ok?'Ok('+x.to+')':'Err((состояние, событие))')+'</div>').join('');
  const note=document.getElementById('note');
  note.textContent=s?s.note:'Замок закрыт. Подаём события по одному и смотрим, что решит match по паре (состояние, событие).';
  note.className='note'+(s&&!s.ok?' no':'');
  document.getElementById('cnt').textContent='шаг '+i+' из '+steps.length;
  document.getElementById('step').disabled=i>=steps.length;
  if(i>=steps.length)stop();
}
function stop(){if(timer){clearInterval(timer);timer=null;}document.getElementById('play').textContent='Играть';}
document.getElementById('step').onclick=()=>{if(i<steps.length){i++;render();}};
document.getElementById('reset').onclick=()=>{stop();i=0;render();};
document.getElementById('play').onclick=()=>{
  if(timer){stop();return;}
  if(i>=steps.length){i=0;render();}
  document.getElementById('play').textContent='Пауза';
  timer=setInterval(()=>{if(i<steps.length){i++;render();}else stop();},3000);
};
render();
</script>
</body>
</html>
