<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Как match проходит ветки</title>
<style>
:root{--bg:#fafaf7;--fg:#1d1d1b;--mut:#6b6b66;--card:#fff;--line:#c9c7bd;--acc:#c2410c;--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;--warn:#a16207;--warnbg:#fef9c3;--btn:#1d1d1b;--btnfg:#fff;--hot:#fff1e6}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--fg:#ecebe6;--mut:#9a9a92;--card:#201f1d;--line:#46443f;--acc:#fb923c;--ok:#4ade80;--okbg:#14301d;--bad:#f87171;--badbg:#3a1a1a;--warn:#facc15;--warnbg:#3a3312;--btn:#ecebe6;--btnfg:#161614;--hot:#33241a}}
*{box-sizing:border-box}
body{margin:0;padding:20px;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 14px}
.panel{max-width:860px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{background:transparent;color:var(--fg);border:1px solid var(--line)}
.tabs button.on{background:var(--btn);color:var(--btnfg)}
.val{font:14px ui-monospace,Menlo,Consolas,monospace;margin-bottom:10px}
.val b{color:var(--acc)}
.arm{display:flex;gap:10px;align-items:center;font:13px ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--line);border-radius:8px;padding:7px 10px;margin:6px 0;opacity:.45;transition:all .3s}
.arm.seen{opacity:1}
.arm.cur{border-color:var(--acc);background:var(--hot);opacity:1}
.arm.miss{border-color:var(--line)}
.arm.guard{border-color:var(--warn);background:var(--warnbg)}
.arm.hit{border-color:var(--ok);background:var(--okbg)}
.arm .tag{margin-left:auto;font:12px system-ui,sans-serif;color:var(--mut);white-space:nowrap}
.arm.hit .tag{color:var(--ok)}
.arm.guard .tag{color:var(--warn)}
.note{margin:12px 0;padding:12px 14px;border-left:4px solid var(--acc);background:var(--card);border-radius:0 8px 8px 0;min-height:76px;max-width:860px}
.bar2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:860px}
button{font:inherit;padding:7px 14px;border-radius:8px;border:0;background:var(--btn);color:var(--btnfg);cursor:pointer}
button.alt{background:transparent;color:var(--fg);border:1px solid var(--line)}
button:disabled{opacity:.4;cursor:default}
.cnt{color:var(--mut);margin-left:auto}
</style>
</head>
<body>
<h1>Как match проходит ветки</h1>
<p class="sub">Сверху вниз, по одной. Побеждает первая подошедшая, а ветка с условием может подойти по форме и всё равно не пройти.</p>
<div class="panel">
  <div class="tabs" id="tabs"></div>
  <div class="val" id="val"></div>
  <div id="arms"></div>
</div>
<div class="note" id="note"></div>
<div class="bar2">
  <button id="step">Шаг</button>
  <button id="play" class="alt">Играть</button>
  <button id="reset" class="alt">Сначала</button>
  <span class="cnt" id="cnt"></span>
</div>
<script>
const scenarios=[
 {name:'Пакет с неверной длиной',value:'packet = [0xAA, 0x55, 2, 3, 9, 9]',
  arms:[
   {p:'[]',r:'miss',t:'срез не пустой',n:'Первая ветка ждёт пустой срез. У пакета шесть байт, не подходит.'},
   {p:'[0xAA, 0x55, kind, len, payload @ ..] if payload.len() == *len',r:'guard',t:'форма подошла, условие нет',n:'Форма совпала: kind = 2, len = 3, payload = [9, 9]. Но guard требует payload.len() == 3, а длина два. Привязки отбрасываются, идём дальше.'},
   {p:'[0xAA, 0x55, ..]',r:'hit',t:'подошла',n:'Магия совпала, остальное неважно. Это ветка «обрезанный пакет». Если бы её поставили выше ветки с guard, верные пакеты тоже попадали бы сюда.'},
   {p:'[first, ..]',r:'skip',t:'не проверяется',n:'До этой ветки дело не дошло: первая подошедшая останавливает match.'}]},
 {name:'Порт',value:'port = 8080',
  arms:[
   {p:'p @ 1..=1023',r:'miss',t:'вне диапазона',n:'8080 не входит в 1..=1023. Привязка p ещё не создана: она появляется только при успехе.'},
   {p:'p @ (8000 | 8080 | 8888)',r:'hit',t:'подошла',n:'Альтернатива 8080 совпала, и значение привязалось к p. Скобки вокруг альтернатив нужны, иначе p окажется не во всех вариантах.'},
   {p:'p',r:'skip',t:'не проверяется',n:'Эта ветка подошла бы всему, но стоит ниже и уже не нужна.'}]},
 {name:'Команда по словам',value:'words = ["schedule", "mon", "8", "9"]',
  arms:[
   {p:'["set", value]',r:'miss',t:'первое слово другое',n:'Образец проверяет и длину (ровно два слова), и первый элемент. Не подошло по обоим пунктам.'},
   {p:'["mode", name]',r:'miss',t:'первое слово другое',n:'То же самое для mode.'},
   {p:'["schedule", day, times @ ..]',r:'hit',t:'подошла',n:'Первое слово совпало, day = "mon", а хвост times = ["8", "9"] собран срезовым образцом. Длину проверять руками не пришлось.'},
   {p:'[other, ..]',r:'skip',t:'не проверяется',n:'Ловушка для неизвестных команд, до неё не дошли.'},
   {p:'[]',r:'skip',t:'не проверяется',n:'Пустой ввод: этой ветки не коснулись.'}]}
];
let sc=0,i=0,timer=null;
function renderTabs(){document.getElementById('tabs').innerHTML=scenarios.map((s,k)=>'<button class="'+(k===sc?'on':'')+'" data-k="'+k+'">'+s.name+'</button>').join('');
 document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{stop();sc=+b.dataset.k;i=0;render();});}
function lastIdx(s){return s.arms.findIndex(a=>a.r==='hit');}
function render(){
  const s=scenarios[sc];
  renderTabs();
  document.getElementById('val').innerHTML='match <b>'+s.value.split(' = ')[0]+'</b> со значением '+s.value.split(' = ')[1];
  const total=lastIdx(s)+1;
  document.getElementById('arms').innerHTML=s.arms.map((a,k)=>{
    let cls='arm';
    if(i>0&&k<i){cls+=' seen '+(a.r==='skip'?'':a.r);}
    if(i>0&&k===i-1){cls+=' cur';}
    const show=i>0&&k<i;
    return '<div class="'+cls+'"><span>'+a.p+' =&gt; ...</span><span class="tag">'+(show?a.t:'')+'</span></div>';
  }).join('');
  const note=i===0?'Нажми «Шаг»: значение пойдёт по веткам сверху вниз.':s.arms[i-1].n;
  document.getElementById('note').textContent=note;
  document.getElementById('cnt').textContent='шаг '+i+' из '+total;
  document.getElementById('step').disabled=i>=total;
  if(i>=total)stop();
}
function stop(){if(timer){clearInterval(timer);timer=null;}document.getElementById('play').textContent='Играть';}
document.getElementById('step').onclick=()=>{if(i<lastIdx(scenarios[sc])+1){i++;render();}};
document.getElementById('reset').onclick=()=>{stop();i=0;render();};
document.getElementById('play').onclick=()=>{
  if(timer){stop();return;}
  const total=lastIdx(scenarios[sc])+1;
  if(i>=total){i=0;render();}
  document.getElementById('play').textContent='Пауза';
  timer=setInterval(()=>{if(i<lastIdx(scenarios[sc])+1){i++;render();}else stop();},2500);
};
render();
</script>
</body>
</html>
