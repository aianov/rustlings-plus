[[exercises]]
name = "mtch1"
style = "todo"
hint.ru = """Каждая ошибка в `VoteError` соответствует одному шагу: нет такой команды, нет номера, номер не число, и так далее. Для каждого шага пиши `let <образец> = <выражение> else { return Err(...) };`. Образцом может быть и литерал: `let Some("vote") = words.next() else { ... }`."""
why.ru = """В эталоне нет ни одного отступа глубже одного уровня: каждый шаг либо проходит, либо сразу возвращает свою ошибку, и порядок проверок читается сверху вниз как порядок требований. Литерал внутри образца (`Some("vote")`) проверяет и наличие слова, и его значение, ничего не привязывая. Блок `else` обязан завершать функцию, поэтому «забыть вернуть ошибку» компилятор не даст. Частая ошибка здесь: сначала собрать все слова в `Vec` и индексировать, тогда пропущенный аргумент превращается в панику, а не в `MissingPoll`."""

[[exercises]]
name = "mtch_q1"
kind = "question"
question.ru = '''Что случится при сборке?
```rust
fn first_word_len(text: &str) -> usize {
    let Some(word) = text.split_whitespace().next() else {
        println!("пустая строка");
    };
    word.len()
}
```'''
options.ru = ["напечатает «пустая строка» и вернёт 0", "не соберётся: блок else должен завершать выполнение (return, break, continue, panic!)", "соберётся, но упадёт в рантайме на пустой строке", "соберётся с предупреждением о неиспользуемом блоке"]
answer = [1]
explain.ru = """После `let ... else` код идёт дальше с привязанной `word`. Если бы `else` мог «закончиться нормально», `word` осталась бы неопределённой. Поэтому тип блока обязан быть `!` (никогда): `return`, `break`, `continue`, `panic!` или вызов функции, которая не возвращается. `println!` возвращает `()`, и компилятор отвечает ошибкой `else clause of let...else does not diverge`."""
hint.ru = """Что должно быть с `word`, если образец не подошёл?"""

[[exercises]]
name = "mtch2"
style = "todo"
hint.ru = ["""Для адреса нужны четыре условия подряд, и каждое опирается на предыдущее. Условия `if` в edition 2024 могут сочетать `let` и булевы выражения через `&&`. Для обхода: стек это просто `Vec`, а цикл прекращается, когда `pop` возвращает `None`.""", """В обходе у `Group` потомки должны выполниться в записанном порядке, а `pop` забирает последний. Значит, в стек их кладут в обратном порядке: `children.into_iter().rev()`. Для `Repeat(n, task)` в стек кладут n копий (поэтому `Task` умеет `Clone`)."""]
why.ru = """Цепочка `if let ... && ... && let ...` читается как перечень требований, и привязки предыдущих шагов (`user`) видны следующим. Явный стек вместо рекурсии: глубина вложенности ограничена памятью, а не стеком вызовов, поэтому цепочка в двести тысяч групп проходит. Порядок обхода зависит от порядка вставки: `pop` берёт последнее, и чтобы получить «сверху вниз», потомков вставляют с конца. Эту ошибку любят: результат выходит в обратном порядке, а тесты на одиночных элементах её не видят."""

[[exercises]]
name = "mtch_q2"
kind = "question"
question.ru = '''Что напечатает программа?
```rust
let mut stack = vec![1, 2, 3];
while let Some(top) = stack.pop() {
    print!("{top} ");
    if top == 2 {
        stack.push(9);
    }
}
```'''
options.ru = ["3 2 1 9", "3 2 9 1", "3 9 2 1", "1 2 3 9"]
answer = [1]
explain.ru = """`pop` забирает последний элемент. Сначала 3, потом 2. После двойки в стек кладётся 9, и он становится последним, значит, достаётся следующим. Единица лежит глубже всех и идёт в самом конце. Так же ведёт себя любой обход с явным стеком: что положили последним, то обработают первым."""
hint.ru = """Какой элемент стека забирает следующий `pop` после `push(9)`?"""

[[exercises]]
name = "mtch3"
style = "todo"
hint.ru = ["""Ветки идут сверху вниз, побеждает первая подошедшая. Что должно стоять выше: частные случаи или общие диапазоны? Проверь крайние значения: `b'@'` стоит прямо перед `b'A'`, а `429` внутри диапазона `400..=499`.""", """Чтобы получить значение цифры, привяжи байт через `@` и вычти `b'0'`: `d @ b'0'..=b'9' => Digit(d - b'0')`. Несколько значений в одной ветке пишутся через `|`, а привязка к альтернативам берётся в скобки: `code @ (301 | 308)`."""]
why.ru = """Каждый класс записан одной веткой, а порядок веток выражает приоритет: пробельные символы выше управляющих (иначе табуляция стала бы `Control`), 204 и 205 выше общего диапазона 2xx, 429 выше 4xx, а диапазон 502..=504 выше общего 5xx. Привязка `@` даёт и проверку диапазона, и само значение, так что внутри ветки не нужно переспрашивать `if`. Последняя ветка `code => Invalid(code)` здесь осознанно ловит всё остальное: числа это открытый тип, вариантов никто не добавит."""

[[exercises]]
name = "mtch_q3"
kind = "question"
question.ru = '''Сколько раз напечатается «проверка»?
```rust
let pair = (1, 1);
match pair {
    (1, _) | (_, 1) if { println!("проверка"); false } => println!("ветка"),
    _ => println!("мимо"),
}
```'''
options.ru = ["ни разу", "один раз", "два раза", "ни разу, потому что код не соберётся"]
answer = [2]
explain.ru = """Образец с `|` может подойти несколькими способами: здесь и `(1, _)`, и `(_, 1)` подходят к `(1, 1)`. Если для первого способа guard вернул `false`, компилятор пробует следующий и вызывает guard ещё раз. Поэтому условие относится ко всему образцу целиком и может выполняться несколько раз: побочные эффекты в нём недопустимы."""
hint.ru = """Подходит ли значение под каждую из альтернатив по отдельности?"""

[[exercises]]
name = "mtch_q4"
kind = "question"
question.ru = '''Что вернут `bucket(4)`, `bucket(7)` и `bucket(12)`?
```rust
fn bucket(n: i32) -> &'static str {
    match n {
        i32::MIN..=-1 => "neg",
        0 => "zero",
        x if x % 2 == 0 => "even",
        1..=9 => "small odd",
        _ => "big odd",
    }
}
```'''
options.ru = ["even, even, even", "even, small odd, even", "small odd, small odd, big odd", "even, small odd, big odd"]
answer = [1]
explain.ru = """Четвёрка чётная: ветка с guard стоит раньше диапазона `1..=9`, и ей достаётся 4, хотя диапазон тоже подошёл бы. Семёрка нечётная, guard не прошёл, её ловит `1..=9`. Двенадцать чётное и тоже уходит в guard. До `_` дойдут только нечётные больше девяти. Порядок веток это и есть программа."""
hint.ru = """Для каждого числа найди первую ветку, которая подошла полностью, вместе с guard."""

[[exercises]]
name = "mtch4"
style = "todo"
hint.ru = ["""Образец повторяет форму данных: `Post { author: User { name, verified, .. }, body, .. }` достаёт имя автора и тело одним махом. А внутри тела ещё один `match`, или вложенный образец прямо в ветке.""", """Репост лежит в `Box<Post>`: образцов «внутри Box» нет, поэтому сначала разыменуй (`&**original`) и применяй образец к `Post`. Параметры замыканий тоже разбираются образцами: `|(name, score)|` для элемента `&(String, u32)`. Номер места считай после фильтра."""]
why.ru = """Один `match` на форму данных заменяет серию геттеров и `if`. Поля, которые не нужны, отбрасывает `..`, и вариант `Photo { alt: Some(alt), .. }` заодно проверяет, что описание есть. Репост показывает границу образцов: сквозь `Box` они не проходят, и значение сначала разыменовывают. В `leaderboard` порядок `filter`, затем `enumerate` определяет, что места нумеруются среди оставшихся, и эту ошибку (нумеровать до фильтра) тест ловит."""

[[exercises]]
name = "mtch5"
style = "scratch"
hint.ru = ["""Опиши каждую команду её формой: у `rollback` ровно три слова, у `deploy` не меньше двух, у `status` одно. Срез можно разобрать так же, как кортеж: `["scale", service, replicas]`.""", """Хвост переменной длины берётся через `@ ..`: `["deploy", env, services @ ..]`. Ветки с известным первым словом, но неподходящей длиной, ставь после точных, но перед общей `[name, ..]`: это и есть `WrongArgs`. Число разбирай уже внутри ветки.""", """Для `ends`: `[]`, `[only]`, `[first, .., last]`. Для `inner`: `[_, middle @ .., _]` покрывает всё от двух элементов, остальное пусто. Для `WrongArgs` подойдёт `[name @ ("deploy" | "rollback" | "scale" | "status"), ..]`."""]
why.ru = """Образец описывает форму команды целиком: длина и содержимое проверяются в одном месте, а привязанные имена существуют только там, где форма совпала. Индексов нет, значит, и паниковать на `words[2]` нечему. Порядок веток кодирует приоритет ошибок: точные формы, затем «знакомая команда с неправильными аргументами», затем «неизвестная команда». Для `inner` случай короче двух элементов нельзя оставить без внимания: срез из одного элемента не подходит под `[_, .., _]`, и компилятор требует назвать его."""

[[exercises]]
name = "mtch_q5"
kind = "question"
question.ru = '''Что вернут `f(&[5, 5])` и `f(&[8])`?
```rust
fn f(v: &[i32]) -> &'static str {
    match v {
        [] => "empty",
        [_] => "one",
        [first, .., last] if first == last => "same ends",
        [_, _, ..] => "many",
    }
}
```'''
options.ru = ["same ends и one", "many и one", "same ends и same ends", "many и same ends"]
answer = [0]
explain.ru = """Срез `[5, 5]` не подходит под `[]` и `[_]`, зато подходит под `[first, .., last]`: `..` может съесть ноль элементов, и тогда first и last это два соседних. Guard `first == last` проходит, значит, «same ends». Срез `[8]` из одного элемента ловит `[_]` ещё раньше. В `[first, .., last]` один элемент не поместился бы: это образец для двух и более."""
hint.ru = """Сколько элементов может съесть `..` и что нужно образцу `[first, .., last]` минимум?"""

[[exercises]]
name = "mtch6"
style = "fix"
hint.ru = ["""Запусти тесты и посмотри, какие ветки не срабатывают. Сравни порядок образцов в `decode` с таблицей из шапки: какая ветка перекрывает остальные? Заодно поищи, что конкретно ловит `[b'E', b'C', b'H', b'O', rest @ ..]`.""", """Ветка `[tag, ..]` подходит любому непустому срезу, поэтому всё, что ниже, недостижимо. Общие образцы всегда ниже частных, а образец с guard выше образца без него, иначе guard никогда не сработает. Для `ECHO` проверь, что именно попало в `rest`.""", """Принцип: от узкого к широкому, образец с guard выше такой же формы без guard. Для `command` подумай, что именно попадает в `rest`, когда команда и данные разделены пробелом, и какой образец не пустит `ECHOES`."""]
why.ru = """Компилятор ругается на недостижимые ветки не всегда: если общая ветка идёт выше специальной с guard, он молчит, и баг видят только тесты. Правило порядка простое: от узкого к широкому, с guard выше такой же формы без guard. Байтовая строка в образце сравнивается со срезом целиком (`b"PING"` не подойдёт для `PINGPONG`), а префикс задаётся образцом из байтов, и пробел после команды нужно включить в него, иначе он окажется в данных."""

[[exercises]]
name = "mtch_q6"
kind = "question"
question.ru = '''Что вернут `kind(b"GET")`, `kind(b"GET /")` и `kind(b"GE")`?
```rust
fn kind(line: &[u8]) -> u8 {
    match line {
        b"GET" => 1,
        [b'G', b'E', b'T', ..] => 2,
        _ => 3,
    }
}
```'''
options.ru = ["1, 2 и 3", "1, 1 и 3", "2, 2 и 3", "1, 2 и 2"]
answer = [0]
explain.ru = """Байтовая строка в образце совпадает со срезом целиком, а не с началом. Поэтому `b"GET"` подходит только строке из трёх байт, а `b"GET /"` в неё не попадает и идёт ко второй ветке, которая проверяет префикс. Для `b"GET"` первая ветка срабатывает раньше второй. Двухбайтовый `b"GE"` короче и префикса, и литерала, поэтому не подходит ни одной ветке и уходит в `_`. Хочешь префикс, разворачивай в байты `[b'G', b'E', b'T', ..]` или бери `strip_prefix`."""
hint.ru = """Сравнивает ли байтовая строка в образце начало или всё целиком?"""

[[exercises]]
name = "mtch7"
style = "todo"
hint.ru = ["""Для чтения: матч идёт по ссылке (`&self.nickname`), и тогда привязка тоже ссылка, а профиль не расходуется. Для правки на месте: `&mut self.bio` и привязка `&mut String`.""", """`display_name` возвращает `&str` из `&String` (приведение сработает само). Для обрезки на границе символа есть `is_char_boundary`, а `truncate` меняет строку на месте. Заменить значение и получить старое умеют `Option::replace` и `std::mem::replace`.""", """Ловушка для `clip_bio`: если собрать новую строку (`bio.chars().take(..).collect()`) и записать её в поле, указатель на буфер изменится. Тест это видит. Нужен `truncate`, а `cut` ищи уменьшая число, пока не встанешь на границу символа."""]
why.ru = """Матч по ссылке на поле (`&self.nickname`, `&mut self.bio`) это ровно то, что нужно для чтения и правки на месте: привязка становится ссылкой нужного вида, а владение остаётся у структуры. Попытка матчить `self.nickname` по значению пыталась бы вынуть `String` из-за `&self`. Правка на месте через `&mut String` не перевыделяет память, поэтому указатель на буфер не меняется, и тест на это смотрит. Границу символа надо искать явно: обрезка по байтам посреди буквы приводит к панике."""

[[exercises]]
name = "mtch_q7"
kind = "question"
question.ru = '''Что за типы у `name` и `age`?
```rust
let pair = &(String::from("ann"), 31u32);
let (name, age) = pair;
```'''
options.ru = ["String и u32", "&String и &u32", "&String и u32", "не соберётся: нельзя разбирать ссылку на кортеж"]
answer = [1]
explain.ru = """Образец без ссылки (`(name, age)`), применённый к значению типа `&(…)`, включает режим привязки по ссылке: компилятор «проходит сквозь» ссылку, и все привязки становятся ссылками (`&String` и `&u32`), даже для `Copy`-типов. Исходный кортеж никуда не перемещается. Чтобы получить `u32` по значению, разыменуй: `*age` (число `Copy`)."""
hint.ru = """Что происходит с привязками, если образец применяют к ссылке?"""

[[exercises]]
name = "mtch8"
style = "fix"
hint.ru = ["""Читай ошибки компилятора по очереди: `cannot move out of self.link` в трёх методах и что-то странное в `send`, которое даже собирается. Подумай, для каких методов достаточно посмотреть, а для какого нужно по-настоящему забрать значение.""", """Для чтения (`describe`, `peer`) матчь по ссылке: `match &self.link`. Для изменения числа на месте (`send`) матчь по `&mut self.link`, а счётчик меняй через разыменование. Для `close` нужно временно вынуть всё состояние.""", """В `close` вынь состояние целиком: `std::mem::replace(&mut self.link, Link::Idle)`, разбери полученное значение, и положи обратно нужное (при отказе то же самое, что и вынул)."""]
why.ru = """Три разных ситуации, три разных решения. Чтение: матч по ссылке, строки остаются в состоянии. Изменение: матч по `&mut`, и счётчик это `&mut u32`, который меняют через `*sent += 1`. Баг, который компилируется: `Link::Connected { mut sent, .. }` на значении копирует `u32` в локальную переменную, и увеличивается копия. Вынуть владение из места за `&mut self` можно только заменой: `mem::replace` оставляет на месте допустимое значение, и объект ни на миг не бывает «разобранным»."""

[[exercises]]
name = "mtch_q8"
kind = "question"
question.ru = '''Что из этого скомпилируется?
```rust
struct Card { title: String, tags: Vec<String> }

let card = Card { title: "t".into(), tags: vec![] };
let Card { title, .. } = card;
// строка A:
println!("{}", card.tags.len());
// строка B:
println!("{}", card.title);
```'''
options.ru = ["только A", "только B", "обе", "ни одна"]
answer = [0]
explain.ru = """Образец `Card { title, .. }` перемещает только поле `title`: компилятор отслеживает перемещения по полям. Остальные поля (`tags`) остаются живыми, и к ним можно обращаться, а `card.title` уже перемещено, и строка B не соберётся. Целиком `card` использовать нельзя (например, передать в функцию), пока перемещено хотя бы одно поле."""
hint.ru = """Перемещается вся структура или только названное поле?"""

[[exercises]]
name = "mtch_q9"
kind = "question"
question.ru = '''Какие строки скомпилируются?
```rust
let s = String::from("hi");
let _ = s;
println!("{s}");        // строка 1

let t = String::from("yo");
let _t = t;
println!("{t}");        // строка 2
```'''
options.ru = ["обе", "только строка 1", "только строка 2", "ни одна"]
answer = [1]
explain.ru = """`_` не привязывает ничего, поэтому `let _ = s;` значение не перемещает, и `s` остаётся доступной. `_t` обычное имя (подчёркивание в начале лишь заглушает предупреждение о неиспользовании), поэтому `let _t = t;` перемещает строку, и `println!("{t}")` не соберётся. Эта разница важна для блокировок: `let _ = mutex.lock();` отпускает замок сразу, а `let _guard = mutex.lock();` держит до конца блока."""
hint.ru = """Привязывает ли голое подчёркивание значение к имени?"""

[[exercises]]
name = "mtch9"
style = "bughunt"
hint.ru = ["""Прочитай обе функции: что делает последняя ветка с вариантами, добавленными позже других? Сравни с кодами в шапке.""", """Замени ловушку на явный список вариантов: тогда добавление нового варианта сломает сборку в нужном месте. Для второго требования библиотеке нужен атрибут на самом enum: он действует на тех, кто использует крейт снаружи.""", """`#[non_exhaustive]` ставится над `pub enum StoreError`. Внутри самого крейта он ничего не меняет, поэтому явные ветки в `http_status` и `is_retryable` остаются без `_`."""]
why.ru = """`_ =>` в `match` по enum превращает «забыл новый вариант» из ошибки компиляции в тихий баг: Conflict получил 500, а Corrupted получил повторы. Явный перечень означает, что компилятор покажет все функции, куда добавленный вариант нужно вписать. `#[non_exhaustive]` работает на границе крейтов: внутри библиотеки ветки остаются исчерпывающими без `_`, а чужой код обязан иметь запасную ветку и потому не ломается, когда библиотека выпускает новый вариант."""

[[exercises]]
name = "mtch_q10"
kind = "question"
question.ru = '''Библиотека помечена `#[non_exhaustive]` на `pub enum Level { Low, High }`. Кому придётся писать ветку `_ =>` в `match` по `Level`?'''
options.ru = ["только коду в других крейтах, использующих библиотеку", "всем, включая саму библиотеку", "никому: атрибут влияет только на документацию", "только тем, кто матчит больше двух вариантов"]
answer = [0]
explain.ru = """Атрибут защищает автора библиотеки: он вправе добавить вариант, не ломая чужие сборки. Поэтому снаружи `match` без запасной ветки не компилируется. Внутри самого крейта исчерпывающий `match` остаётся нормальным, там компилятор по-прежнему обязан напомнить обо всех местах при добавлении варианта."""
hint.ru = """Для кого эта гарантия: для автора или для пользователей?"""

[[exercises]]
name = "mtch_q11"
kind = "question"
question.ru = '''В `enum Job { Idle, Running, Done }` добавили вариант `Paused`. Что произойдёт?
```rust
fn can_cancel(job: &Job) -> bool {
    match job {
        Job::Running => true,
        _ => false,
    }
}
fn label(job: &Job) -> &'static str {
    match job {
        Job::Idle => "idle",
        Job::Running => "run",
        Job::Done => "done",
    }
}
```'''
options.ru = ["обе функции перестанут собираться", "can_cancel соберётся и скажет false для Paused, label перестанет собираться", "label соберётся и вернёт пустую строку для Paused", "обе соберутся, Paused попадёт в первую подходящую ветку"]
answer = [1]
explain.ru = """В `label` перечислены все варианты, и без `Paused` она перестаёт быть исчерпывающей: компилятор укажет на неё. В `can_cancel` есть `_ =>`, поэтому она спокойно проглотит новый вариант и ответит `false`. Может быть, это правильно (приостановленное отменять нельзя), а может нет, но компилятор вопрос не задаст. Поэтому по enum с осмысленными вариантами лучше перечислять варианты, а `_` оставлять для чисел и строк."""
hint.ru = """Какая из двух функций сообщит о новом варианте?"""

[[exercises]]
name = "mtch10"
style = "scratch"
hint.ru = ["""Матч идёт по паре `(state, event)`: каждая допустимая строка таблицы это одна ветка. Что делать со всем остальным? Верни ошибку, в которую положи и состояние, и событие.""", """Состояния и события приходят по значению, поэтому в последней ветке `(state, event) => Err(Invalid { state, event })` они возвращаются целиком. Для `Progress` складывай через `saturating_add`: прогресс может быть огромным.""", """Одно действие для нескольких состояний записывается через `|` внутри образца кортежа: `(State::Running { .. } | State::Paused { .. }, Event::Cancel)`. Строку для `Start { total: 0 }` поставь выше общей `Start { total }`."""]
why.ru = """Таблица переходов читается прямо из `match`: что не перечислено, то запрещено. Последняя ветка `(state, event) => Err(...)` это «закрытое по умолчанию»: новое событие или состояние будет отклонено, а не принято случайно, и вызывающий получит оба значения для журнала, ведь они пришли по значению. Частный случай (`total: 0`) обязан стоять выше общего. `saturating_add` защищает от переполнения на гигантском прогрессе, которое в отладочной сборке привело бы к панике."""

[[exercises]]
name = "mtch_q12"
kind = "question"
question.ru = '''Автомат загрузки заканчивается веткой `(state, event) => Err(Invalid { state, event })`. Завтра в `Event` добавят вариант `Retry`, но таблицу не обновят. Что будет?'''
options.ru = ["код перестанет собираться, пока не опишут Retry", "Retry в любом состоянии будет отклонён ошибкой Invalid", "Retry в любом состоянии молча принимается и ничего не меняет", "поведение зависит от состояния, в котором пришёл Retry"]
answer = [1]
explain.ru = """Последняя ветка ловит любое сочетание, не описанное выше, и возвращает его как ошибку. Новое событие никому не известно, значит, отказ: это безопасный выбор по умолчанию. Компилятор не заметит пропуска, так что новые события нужно сознательно вносить в таблицу и в тесты. Здесь ловушка-ветка осознанно значит «запрещено», в отличие от `_ => false` в проверке прав, где она может молча разрешить или запретить лишнее."""
hint.ru = """Что именно делает последняя ветка автомата, и под неё подходит ли неизвестное событие?"""

[[exercises]]
name = "mtch11"
style = "bughunt"
hint.ru = ["""Составь по таблице из шапки список допустимых пар (состояние, событие) и посмотри, что делает код на каждой. Особенно присмотрись к двум вещам: что происходит на недопустимой паре и какой счётчик растёт у закрывающегося соединения.""", """Последняя ветка `_ => {}` ничего не делает, а после `match` стоит безусловный `Ok(())`. Для недопустимой пары нужен возврат ошибки до того, как что-то изменено. И сообщения в Closing считает отдельный счётчик.""", """Разведи `(Open, Message)` и `(Closing, Message)` по разным веткам с разными счётчиками. Последнюю ветку замени на `(state, event) => return Err(BadEvent { state, event })`: поля `state` и `event` уже скопированы (`Copy`), так что менять `self` по пути не пришлось."""]
why.ru = """Опасный баг тут тихий: `_ => {}` вместе с безусловным `Ok(())` превращает любое лишнее событие в «успех», и сервер перестаёт различать принятое и проигнорированное. Вторая ошибка из того же семейства: объединённая ветка `(Open | Closing, Message)` выглядит аккуратно и потому не вызывает подозрений, а смысл у двух состояний разный. Для автомата на `&mut self` правило такое: изменение состояния и счётчиков только внутри допустимых веток, отказ возвращается раньше, чем что-либо тронуто."""

[[exercises]]
name = "mtch_command_parser"
kind = "project"
style = "scratch"
quiz = true
locked = ["tests/acceptance.rs"]
hint.ru = ["""Начни с `parse`: слова собери в `Vec<&str>` и разбирай `words.as_slice()`. Одну команду за раз, после каждой запускай тесты. Потом `step`: сначала `match self` по состоянию, а внутри по команде.""", """Образец для `/msg`: `["msg", nick, text @ ..]`, а пустой текст ловится выше: `["msg", _]`. Ники проверяй отдельной функцией, она нужна трём командам. Лимит истории: `let limit @ 1..=100 = limit else { ... };`. Приоритет ошибок: неизвестная команда, форма, содержимое.""", """В `step` отказ возвращает исходную сессию: собери `Rejected { session, reason }` из тех же полей, которые разобрал образцом (поэтому поля удобнее брать по значению и клонировать только нужное). Чтобы не писать `_ =>` в `Closed`, достаточно ветки `Session::Closed => reject(Session::Closed, Reason::SessionClosed)` без разбора команды."""]
why.ru = """Разбор строки и автомат сессии держатся на одних и тех же образцах: срезы слов описывают форму команды, let-else отсекает ошибки сразу, а явный `match` по паре «состояние, команда» делает таблицу доступных действий видимой целиком. В эталоне нет ни одной ветки `_ =>`: добавь вариант в `Command` или `Session`, и компилятор покажет каждое место, где его нужно описать. Отказ возвращает исходную сессию, потому что переход берёт её по значению, и без этого вызывающий потерял бы состояние на первой же ошибке."""

