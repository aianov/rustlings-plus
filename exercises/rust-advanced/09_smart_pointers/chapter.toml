[[exercises]]
name = "smp1"
style = "todo"
hint.ru = ["""Что должен вернуть `deref`, чтобы методы `String` работали на `Watched<String>`? А что должен сделать по дороге, чтобы чтение засчиталось?""", """`deref` получает `&self`, поэтому счётчик чтений лежит в `Cell`: `self.reads.set(self.reads.get() + 1)`. `deref_mut` получает `&mut self`, здесь обычное поле можно увеличить напрямую и счётчик чтений не трогать."""]
why.ru = """Счётчик чтений лежит в `Cell`, потому что `deref` берёт `&self`, и обычное поле менять нельзя. `deref_mut` получает изменяемую ссылку, поэтому записи можно считать простым полем. Deref coercion включается сама: как только есть `Deref`, `&Watched<String>` подходит везде, где ждут `&str`."""

[[exercises]]
name = "smp_q5"
kind = "question"
question.ru = '''Какие вызовы соберутся?
```rust
use std::rc::Rc;
fn takes_str(s: &str) {}
fn takes_slice(s: &[i32]) {}

let boxed: Box<String> = Box::new(String::from("x"));
let rc: Rc<Vec<i32>> = Rc::new(vec![1, 2]);
```'''
options.ru = ["`takes_str(&boxed)`", "`takes_slice(&rc)`", "`takes_str(boxed)`", "`takes_slice(rc)`"]
answer = [0, 1]
explain.ru = """Deref coercion работает для ссылок: `&Box<String>` превращается в `&String`, а затем в `&str`; `&Rc<Vec<i32>>` в `&Vec<i32>` и в `&[i32]`. Передавать сам `Box` или `Rc` по значению туда, где ждут ссылку на внутренний тип, нельзя: автоматическое преобразование для значений не действует."""
hint.ru = """Какие из вызовов передают ссылку, а какие само значение?"""

[[exercises]]
name = "smp2"
style = "fix"
hint.ru = ["""Вспомни два правила порядка: в каком порядке уничтожаются поля структуры и в каком локальные переменные? Выпиши, что у тебя получается сейчас, и сравни с требуемым.""", """Поля: в порядке объявления, поэтому поменяй строки внутри `struct`. Локальные: в обратном порядке, поэтому поменяй порядок `let`. Для `finish` нужно уничтожить блокировку раньше конца функции: есть функция, которая принимает значение и ничего с ним не делает."""]
why.ru = """Поля структуры уничтожаются в порядке объявления, локальные переменные в обратном, и оба правила видны только на `Drop`, который пишет в журнал. Раньше срока значение убирает `drop(value)`. Порядок закрытия ресурсов часто важнее порядка открытия, поэтому его стоит проверять тестом с журналом, а не доверять интуиции."""

[[exercises]]
name = "smp_q1"
kind = "question"
question.ru = '''Что напечатает программа?
```rust
struct D(&'static str);
impl Drop for D { fn drop(&mut self) { println!("{}", self.0); } }
struct Pair { _a: D, _b: D }

fn main() {
    let _x = D("x");
    let p = Pair { _a: D("a"), _b: D("b") };
    let _y = D("y");
    drop(p);
    println!("end");
}
```'''
options.ru = ["b a end y x", "end y a b x", "a b end y x", "a b end x y"]
answer = [2]
explain.ru = """`drop(p)` уничтожает структуру сразу, поля идут в порядке объявления: `a`, затем `b`. Потом `end`. В конце функции локальные переменные уничтожаются в обратном порядке объявления: сначала `_y`, потом `_x`. Итого `a b end y x`."""
hint.ru = """Три правила порядка: поля по порядку объявления в структуре, локальные в обратном порядке, `drop(p)` срабатывает сразу."""

[[exercises]]
name = "smp3"
style = "scratch"
hint.ru = ["""Охранник должен хранить то, что нужно для отката: что именно? А `Drop` должен понимать, нужен ли откат.""", """`begin` клонирует целевой вектор в `snapshot`. `Drop` смотрит на флаг `committed`: если он не поднят, возвращает `snapshot` на место (`mem::take`). `commit` берёт `self` по значению, поднимает флаг и охранник уничтожается сам.""", """`drop` возвращает снимок на место, если коммита не было; `commit` забирает `self` по значению и поднимает флаг до того, как охранник умрёт."""]
why.ru = """Откат живёт в `Drop`, поэтому работает на всех путях выхода: `?`, `return`, паника. `commit` забирает охранник по значению, чтобы после подтверждения им нельзя было пользоваться. `Drop` получает `&mut self`, поэтому снимок забирают через `mem::take`, а не перемещают."""

[[exercises]]
name = "smp4"
style = "fix"
hint.ru = ["""Сравни, что происходит со значением в `let _ = ..;`, в `let _span = ..;` и в строке-выражении `Span::enter(..);`. Когда оно уничтожается в каждом случае?""", """Значение живёт до конца блока только если оно привязано к имени. Какое имя годится для переменной, которая нужна ради побочного эффекта? Проверь и ветку с ранним `return`: охранники там тоже должны закрыться."""]
why.ru = """`let _ = expr` и просто `expr;` уничтожают значение немедленно. Имя с подчёркиванием привязывает значение к области видимости. Охранник, созданный ради побочного эффекта, всегда должен получить именованную переменную. Внешний охранник уничтожается последним, потому что объявлен раньше (обратный порядок)."""

[[exercises]]
name = "smp_q2"
kind = "question"
question.ru = '''Что напечатает программа?
```rust
fn main() {
    let _ = D("one");
    let _g = D("two");
    println!("body");
}
// D при уничтожении печатает своё имя
```'''
options.ru = ["body one two", "one two body", "body two one", "one body two"]
answer = [3]
explain.ru = """Шаблон `_` не привязывает значение ни к какой переменной, поэтому `D("one")` уничтожается тут же, на своей строке. Переменная `_g` держит значение до конца блока: `body` печатается раньше, чем уничтожится `two`. Для охранников блокировки это ровно разница между «защищён» и «не защищён»."""
hint.ru = """Куда сохраняется значение в `let _ = ..` и куда в `let _g = ..`?"""

[[exercises]]
name = "smp5"
style = "todo"
hint.ru = ["""Нужно вытащить значение из `&mut`, не имея права его переместить. Что можно поставить на место взамен? У `Job` нет ни `Clone`, ни `Default`.""", """`mem::take` подходит, когда у типа есть `Default` (у `Vec` есть). `mem::replace` ставит конкретное значение и возвращает старое. `mem::swap` меняет местами два поля."""]
why.ru = """Из `&mut` значение нельзя переместить, но можно подменить, поэтому для этого и есть тройка `take`, `replace`, `swap`. `Job` не клонируется, так что вариант «скопировать и очистить» не подходит, а подмена перекладывает значение без копирования и без лишних аллокаций."""

[[exercises]]
name = "smp6"
style = "fix"
hint.ru = ["""Что значит «нельзя переместить из-за `&mut self`»: после этого в `*self` образовалась бы дыра. Чем можно временно заполнить место, пока мы разбираем старое значение?""", """Не обязательно забирать весь `self`. Свяжи вариант по ссылке (`= self` вместо `= *self`), и тогда в `finish` байты можно только прочитать, а в `take_bytes` забрать вектор из `&mut Vec` через `std::mem::take`."""]
why.ru = """Метод получает только заём, а не владение, поэтому разбирать по значению содержимое `*self` нельзя. `mem::replace` оставляет на месте заглушку, а старое значение возвращает нам во владение. После этого можно спокойно разобрать его и записать итоговое состояние. Ветка `other => *self = other` важна: без неё состояния `Failed` и `Hashed` потеряются."""

[[exercises]]
name = "smp_q6"
kind = "question"
question.ru = '''Что напечатает программа?
```rust
fn main() {
    let mut name = String::from("old");
    let prev = std::mem::replace(&mut name, String::from("new"));
    let taken = std::mem::take(&mut name);
    println!("{prev} {taken} [{name}]");
}
```'''
options.ru = ["old new []", "new old [new]", "old new [new]", "old  [new]"]
answer = [0]
explain.ru = """`replace` ставит `new` на место и возвращает прежнее значение (`old`). `take` забирает текущее (`new`) и оставляет на месте значение по умолчанию, то есть пустую строку. В итоге `old new []`."""
hint.ru = """Что оставляет на месте `take`?"""

[[exercises]]
name = "smp7"
style = "scratch"
hint.ru = ["""Что нужно изменять: число и список. Какой тип внутренней изменяемости подходит маленькому копируемому значению, а какой остальному?""", """Счётчик в `Cell` (`get`, `set`), список в `RefCell` (`borrow`, `borrow_mut`). Для `try_visit` есть `try_borrow_mut`, который возвращает `Result` вместо паники."""]
why.ru = """`Cell<usize>` подходит для числа: он копирует значения туда и обратно без заёмов. Список лежит в `RefCell`, потому что в него нужно класть, а ссылку на содержимое выдавать нельзя. `try_borrow_mut` позволяет ответить отказом вместо паники, когда список занят, а это важно, пока к структуре обращаются из нескольких мест."""

[[exercises]]
name = "smp8"
style = "fix"
hint.ru = ["""Паника «already borrowed» говорит, что кто-то взял `borrow_mut`, когда заём уже есть. Найди в `fib`, где заём берётся, и где он заканчивается.""", """Заём живёт, пока жива переменная `cache`, а `self.fib(n - 1)` внутри снова просит заём. Сначала достань нужное значение (`.copied()`), чтобы заём кончился, вычисли остальное, потом коротко возьми `borrow_mut` только для вставки."""]
why.ru = """`RefCell` проверяет заимствования во время работы, поэтому долгий `borrow_mut` вместе с рекурсией паникует, а компилятор молчит. Правило: заём должен быть короче, чем любой вызов, который может снова обратиться к той же ячейке. Читаем значение (и копируем его), закрываем заём, считаем, и только потом пишем."""

[[exercises]]
name = "smp_q4"
kind = "question"
question.ru = '''Что произойдёт при запуске?
```rust
use std::cell::RefCell;

fn main() {
    let c = RefCell::new(vec![1]);
    match c.borrow().first() {
        Some(x) => c.borrow_mut().push(*x),
        None => {}
    }
    println!("done {}", c.borrow().len());
}
```'''
options.ru = ["напечатает `done 2`", "паника `already borrowed: BorrowMutError`", "ошибка компиляции: два заёма одного `RefCell`", "напечатает `done 1`"]
answer = [1]
explain.ru = """Временное значение `c.borrow()` в выражении `match` живёт до конца всего `match`, то есть и внутри ветки. Когда ветка просит `borrow_mut()`, чтение ещё не закончилось, и `RefCell` паникует во время выполнения: компилятор такого не видит. Лечится тем, что сначала достаётся значение (`let first = c.borrow().first().copied();`), а потом идёт `match first`."""
hint.ru = """Когда заканчивается жизнь временного `Ref`, созданного в заголовке `match`?"""

[[exercises]]
name = "smp9"
style = "todo"
hint.ru = ["""Подписчик должен видеть те же письма, что и владелец ящика. Это один и тот же ящик у двух хозяев: какой тип позволяет делиться, и как положить письмо внутрь?""", """`subscribe` кладёт `Rc::clone(inbox)`, а не копию содержимого. `publish` идёт по подписчикам и делает `inbox.borrow_mut().messages.push(..)`. Отписку ищи через `Rc::ptr_eq`."""]
why.ru = """`Rc::clone` копирует указатель, а не ящик, поэтому владелец видит все письма. `ptr_eq` сравнивает адреса: два пустых ящика равны по содержимому, но это разные ящики, и отписать нужно именно тот, который указан. Тема освобождает счётчик при отписке и при собственном уничтожении."""

[[exercises]]
name = "smp_q3"
kind = "question"
question.ru = '''Что напечатает программа?
```rust
use std::rc::Rc;

fn main() {
    let a = Rc::new(5);
    let b = Rc::clone(&a);
    let w = Rc::downgrade(&a);
    drop(b);
    println!("{} {} {}", Rc::strong_count(&a), Rc::weak_count(&a), w.upgrade().is_some());
}
```'''
options.ru = ["1 1 true", "2 1 true", "1 0 false", "2 0 true"]
answer = [0]
explain.ru = """Сильных ссылок было две (`a` и `b`), `drop(b)` оставил одну. Слабая одна, `w`. Значение живо, поэтому `upgrade` вернёт `Some`. Заметь: временный `Rc`, созданный `upgrade`, исчезает в конце оператора, так что счётчик `strong_count` не искажается."""
hint.ru = """Считай отдельно сильные и слабые ссылки: кто остался после `drop(b)`?"""

[[exercises]]
name = "smp10"
style = "todo"
hint.ru = ["""Ребёнок принадлежит родителю, а родитель ребёнку нет. Какая ссылка подходит для движения вверх, чтобы не получилась петля?""", """Вверх идёт `Weak`: `Rc::downgrade(parent)` при добавлении, `upgrade()` при чтении. `path` строится рекурсивно через `parent()`.""", """`add_child` меняет два поля: `child.parent` (слабо) и `parent.children` (сильно)."""]
why.ru = """Дерево с `Rc` в обе стороны никогда не освободится. Вниз ссылки сильные (владение), вверх слабые (знание). Тесты проверяют счётчики: у родителя один сильный владелец, а число слабых равно числу детей. `upgrade` возвращает `None`, когда родителя уже нет, и осиротевшая папка считает себя корнем."""

[[exercises]]
name = "smp11"
style = "fix"
hint.ru = ["""Проверь тест: сколько объектов должно быть уничтожено и сколько в итоге уничтожено? Где в структурах есть цикл?""", """Владелец держит устройства (вниз), а устройство держит владельца (вверх). Которую из двух ссылок нужно сделать слабой? Принцип: сильными идут ссылки «по владению».""", """Слабая ссылка не мешает счётчику дойти до нуля. Чтобы вернуть имя владельца, её нужно сначала превратить обратно в сильную, и это может не получиться."""]
why.ru = """Цикл из `Rc` не обнуляет счётчики, поэтому `Drop` не вызывается и память утекает, а компилятор молчит. Ссылка вверх (на владельца) слабая: владелец существует независимо от устройств, а устройство лишь «знает» его. Когда владельца нет, `upgrade` вернёт `None`, и это нормальный случай, а не ошибка."""

[[exercises]]
name = "smp_q8"
kind = "question"
question.ru = '''Что напечатает программа?
```rust
use std::rc::Rc;

fn main() {
    let strong = Rc::new(1);
    let weak = Rc::downgrade(&strong);
    let again = weak.upgrade();
    drop(strong);
    println!("{}", weak.upgrade().is_some());
    drop(again);
    println!("{}", weak.upgrade().is_some());
}
```'''
options.ru = ["false, затем false", "true, затем false", "true, затем true", "false, затем true"]
answer = [1]
explain.ru = """`upgrade` вернул `Some(Rc)`, то есть новую сильную ссылку, и она лежит в `again`. Поэтому после `drop(strong)` значение ещё живо, и второй `upgrade` тоже вернёт `Some`. Только после `drop(again)` сильных ссылок не остаётся, значение уничтожается, и `upgrade` возвращает `None`."""
hint.ru = """Что делает `upgrade` со счётчиком сильных ссылок?"""

[[exercises]]
name = "smp12"
style = "fix"
hint.ru = ["""Что делает `clone` для `String` и `Vec`? А что делает `clone` для `Arc<..>`? Какие типы неизменяемые данные могут хранить без лишних полей?""", """`Arc<str>` вместо `String` и `Arc<[String]>` вместо `Vec<String>`. Собираются через `Arc::from(..)` и `collect()` в `Arc<[T]>`."""]
why.ru = """Для неизменяемых данных `Arc<str>` и `Arc<[T]>` лучше `String` и `Vec`: клон это одно атомарное увеличение счётчика, и нет поля ёмкости, которое незачем хранить. Читать их можно как обычные `&str` и `&[T]`, поэтому остальной код не меняется. Тест сравнивает адреса: данные в клонах одни и те же."""

[[exercises]]
name = "smp13"
style = "scratch"
hint.ru = ["""Тебе нужна ситуация «правь на месте, если один владелец, иначе скопируй». В `Arc` для этого есть готовый метод.""", """`Arc::make_mut(&mut self.cfg)` отдаёт `&mut Settings`. Для `snapshot` достаточно `Arc::clone`. Для `into_inner` есть `Arc::try_unwrap`, у него в ошибке тот же `Arc`.""", """`Arc::try_unwrap` отдаёт `Result`: в ошибке лежит тот же `Arc`, из него можно собрать `Handle` обратно."""]
why.ru = """Копирование при записи экономит клоны: пока владелец один, `make_mut` правит на месте (тест считает вызовы `clone` и ждёт ноль), а при общем владении клонирует один раз, и дальше у этого снимка своя копия. `try_unwrap` не клонирует вообще: он возвращает значение, только если владелец единственный."""

[[exercises]]
name = "smp_q7"
kind = "question"
question.ru = '''Что напечатает программа?
```rust
use std::sync::Arc;

fn main() {
    let mut a = Arc::new(vec![1]);
    let b = Arc::clone(&a);
    Arc::make_mut(&mut a).push(2);
    println!("{:?} {:?} {}", a, b, Arc::ptr_eq(&a, &b));
}
```'''
options.ru = ["[1, 2] [1, 2] true", "[1] [1] true", "[1, 2] [1] true", "[1, 2] [1] false"]
answer = [3]
explain.ru = """Пока вектор делят `a` и `b`, `make_mut` не может править на месте: он клонирует вектор, кладёт копию в `a` и правит её. `b` остаётся с прежним содержимым и прежним буфером, поэтому `ptr_eq` возвращает `false`. Если бы `b` не было, правка прошла бы на месте без копирования."""
hint.ru = """Сколько владельцев у вектора в момент `make_mut`?"""

[[exercises]]
name = "smp14"
style = "todo"
hint.ru = ["""Три разных случая: глобальное значение с замыканием-инициализатором, глобальное значение, которое кладут позже, и поле, которое заполняется при первом чтении. Сопоставь каждому тип.""", """`static CONFIG: OnceLock<Config>` и `CONFIG.get_or_init(load_config)`. `static OPS: LazyLock<Ops> = LazyLock::new(build_ops)`. В `Report::total` вызови `self.total.get_or_init(..)` и внутри увеличь счётчик."""]
why.ru = """Все три типа гарантируют, что инициализация выполнится один раз. `OnceLock` и `LazyLock` безопасны для потоков, `OnceCell` только для одного потока и годится для поля структуры. Тест запускает несколько потоков и проверяет, что загрузка с диска случилась ровно один раз: этого не добиться обычным `if` с флагом."""

[[exercises]]
name = "smp_q9"
kind = "question"
question.ru = '''Что напечатает программа?
```rust
use std::sync::LazyLock;

static TABLE: LazyLock<Vec<u32>> = LazyLock::new(|| {
    println!("init");
    vec![1, 2, 3]
});

fn main() {
    println!("start");
    println!("{}", TABLE.len());
    println!("{}", TABLE.len());
}
```'''
options.ru = ["init start 3 3", "start 3 init 3", "start init 3 3", "start init 3 init 3"]
answer = [2]
explain.ru = """`LazyLock` не вычисляет значение при объявлении и не вызывает замыкание при старте программы. Первое обращение (`TABLE.len()`) запускает инициализацию один раз, она печатает `init`, второе обращение берёт готовое значение. Порядок: `start`, `init`, `3`, `3`."""
hint.ru = """Когда вызывается замыкание у `LazyLock`: при объявлении, при старте или при первом обращении?"""

[[exercises]]
name = "smp15"
style = "fix"
hint.ru = ["""Обе ошибки про одно: в `static` можно положить только значение, вычислимое при сборке. Что подходит для таблицы с данными, которая создаётся при первом использовании? А для числа, которое меняют потоки?""", """`LazyLock<HashMap<..>>` для таблицы (`LazyLock::new(|| HashMap::from([..]))`), `AtomicU32` с `fetch_add` и `load` для счётчика. `unsafe` и `static mut` исчезают."""]
why.ru = """`static mut` требует `unsafe` и честного слова программиста, что гонок нет; тест с потоками показывает, что слово нарушено. `AtomicU32` делает то же без `unsafe`, а `LazyLock` создаёт `HashMap` при первом обращении, когда это допустимо: статики вычисляются при сборке и вызвать `HashMap::insert` там нельзя."""

[[exercises]]
name = "smp_comment_tree"
style = "scratch"
quiz = true
kind = "project"
locked = ["tests/acceptance.rs"]
hint.ru = ["""Начни с вопроса «кто кому принадлежит»: сильные ссылки вниз, слабая вверх. `Live` это охранник со счётчиком: увеличивает при создании, уменьшает в `Drop`.""", """`remove`: найди, откуда отцепить (родитель или корни), убери через `retain` с `Rc::ptr_eq`, затем сбрось слабую ссылку на родителя. Заём списка не держи дольше `retain`.""", """`tags`: пройди по `match_indices('#')`, возьми буквы и цифры после, найди слово в словаре (`LazyLock`), добавь, если ещё не было."""]
why.ru = """Проект складывает главу целиком: `Rc` вниз и `Weak` вверх (дерево освобождается без утечек), `RefCell` для правок через общие ссылки, `Live` как RAII-счётчик (тест видит утечку цикла как ненулевой счётчик), `LazyLock` для словаря, строящегося один раз. Удаление ветки не требует обхода: освобождение идёт по счётчикам само, когда последняя сильная ссылка исчезает."""
