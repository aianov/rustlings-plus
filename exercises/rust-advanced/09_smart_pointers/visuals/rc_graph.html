<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rc и Weak: счётчики и цикл</title>
<style>
:root{--bg:#fafaf7;--fg:#1d1d1b;--mut:#6b6b66;--card:#fff;--line:#c9c7bd;--acc:#c2410c;--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;--warn:#a16207;--warnbg:#fef9c3;--btn:#1d1d1b;--btnfg:#fff;--hot:#fff1e6}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--fg:#ecebe6;--mut:#9a9a92;--card:#201f1d;--line:#46443f;--acc:#fb923c;--ok:#4ade80;--okbg:#14301d;--bad:#f87171;--badbg:#3a1a1a;--warn:#facc15;--warnbg:#3a3312;--btn:#ecebe6;--btnfg:#161614;--hot:#33241a}}
*{box-sizing:border-box}
body{margin:0;padding:20px;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 14px}
.panel{max-width:860px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;min-height:150px}
.row{display:flex;gap:10px;align-items:center;font:13px ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--line);border-radius:8px;padding:7px 10px;margin:6px 0}
.row.ok{border-color:var(--ok);background:var(--okbg)}
.row.no{border-color:var(--bad);background:var(--badbg);text-decoration:line-through;opacity:.75}
.row.hot{border-color:var(--warn);background:var(--warnbg)}
.row .tag{margin-left:auto;font:12px system-ui,sans-serif;color:var(--mut);text-decoration:none}
.box{display:inline-block;font:13px ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--line);border-radius:8px;padding:8px 12px;margin:4px 6px 4px 0;vertical-align:top}
.box.ok{border-color:var(--ok);background:var(--okbg)}
.box.hot{border-color:var(--warn);background:var(--warnbg)}
.box.no{border-color:var(--bad);background:var(--badbg)}
.box small{display:block;color:var(--mut);font:12px system-ui,sans-serif}
.arrow{display:inline-block;margin:0 4px;color:var(--mut);font-size:18px;vertical-align:middle}
.note{margin:12px 0;padding:12px 14px;border-left:4px solid var(--acc);background:var(--card);border-radius:0 8px 8px 0;min-height:76px;max-width:860px}
.bar2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:860px}
button{font:inherit;padding:7px 14px;border-radius:8px;border:0;background:var(--btn);color:var(--btnfg);cursor:pointer}
button.alt{background:transparent;color:var(--fg);border:1px solid var(--line)}
button:disabled{opacity:.4;cursor:default}
.cnt{color:var(--mut);margin-left:auto}
</style>
</head>
<body>
<h1>Rc и Weak: счётчики и цикл</h1>
<p class="sub">Сильные и слабые ссылки, момент освобождения и цикл, который не освободится.</p>
<div class="panel" id="panel"></div>
<div class="note" id="note"></div>
<div class="bar2">
  <button id="step">Шаг</button>
  <button id="play" class="alt">Играть</button>
  <button id="reset" class="alt">Сначала</button>
  <span class="cnt" id="cnt"></span>
</div>
<script>
const steps=[{"p": "<div><b>Узел A в куче</b></div><span class=\"box ok\">A: Node<small>strong = 1, weak = 0</small></span><div style=\"margin-top:8px;color:var(--mut)\">let a = Rc::new(Node)</div>", "n": "Rc::new кладёт значение в кучу и ставит счётчик сильных ссылок в 1. Переменная a это единственный владелец."}, {"p": "<div><b>Узел A в куче</b></div><span class=\"box ok\">A: Node<small>strong = 2, weak = 0</small></span><div style=\"margin-top:8px;color:var(--mut)\">let b = Rc::clone(&a)</div>", "n": "Rc::clone не копирует узел. Он только увеличивает счётчик. Теперь a и b указывают на один и тот же узел."}, {"p": "<div><b>Узел A в куче</b></div><span class=\"box hot\">A: Node<small>strong = 2, weak = 1</small></span><div style=\"margin-top:8px;color:var(--mut)\">let w = Rc::downgrade(&a)</div>", "n": "Weak считается отдельно. Он не держит узел живым, он лишь умеет проверить, жив ли ещё узел (upgrade)."}, {"p": "<div><b>Узел A в куче</b></div><span class=\"box ok\">A: Node<small>strong = 1, weak = 1</small></span><div style=\"margin-top:8px;color:var(--mut)\">drop(b)</div>", "n": "Один из владельцев ушёл. Счётчик упал до 1, узел жив."}, {"p": "<div><b>Узел A освобождён</b></div><span class=\"box no\">(пусто)<small>strong = 0, weak = 1</small></span><div style=\"margin-top:8px;color:var(--mut)\">drop(a); w.upgrade() даёт None</div>", "n": "Последний сильный владелец ушёл: узел уничтожен (вызван Drop). Слабая ссылка осталась, но upgrade вернёт None."}, {"p": "<div><b>Цикл через Rc в обе стороны</b></div><span class=\"box no\">P (родитель)<small>strong = 2</small></span><span class=\"box no\">C (ребёнок)<small>strong = 2</small></span><div style=\"margin:8px 0\">P.child = Rc&lt;C&gt;, C.parent = Rc&lt;P&gt;, переменные p и c ещё живы</div>", "n": "Родитель держит ребёнка, ребёнок держит родителя. У каждого счётчик равен двум: одна ссылка от переменной, одна от соседа."}, {"p": "<div><b>Переменные p и c вышли из области видимости</b></div><span class=\"box no\">P<small>strong = 1 (от C)</small></span><span class=\"box no\">C<small>strong = 1 (от P)</small></span><div style=\"margin:8px 0\">Счётчики не дошли до нуля, Drop не вызван, память не вернётся</div>", "n": "Утечка. Пока P держит C, а C держит P, ни один счётчик не обнулится. Компилятор об этом не предупредит."}, {"p": "<div><b>Ребёнок держит родителя слабо</b></div><span class=\"box ok\">P<small>strong = 1, weak = 1</small></span><span class=\"box ok\">C<small>strong = 1</small></span><div style=\"margin:8px 0\">C.parent = Weak&lt;P&gt;</div>", "n": "Переделка: вниз сильная ссылка, вверх слабая. Теперь у P один сильный владелец (переменная p), у C тоже один (список детей в P)."}, {"p": "<div><b>p выходит из области видимости</b></div><span class=\"box no\">P<small>strong = 0: уничтожен</small></span><span class=\"box no\">C<small>strong = 0: уничтожен следом</small></span><div style=\"margin:8px 0\">Drop для P, затем освобождается его список детей, и C тоже</div>", "n": "P освобождается, вместе с ним падает счётчик C. Утечки нет. Так устроена любая пара родитель и потомок с Rc и Weak."}];
let i=0,timer=null;
function stop(){if(timer){clearInterval(timer);timer=null;}document.getElementById('play').textContent='Играть';}
function frame(){document.getElementById('panel').innerHTML=steps[i].p;document.getElementById('note').textContent=steps[i].n;document.getElementById('cnt').textContent='шаг '+(i+1)+' из '+steps.length;document.getElementById('step').disabled=i>=steps.length-1;if(i>=steps.length-1)stop();}
document.getElementById('step').onclick=()=>{if(i<steps.length-1){i++;frame();}};
document.getElementById('reset').onclick=()=>{stop();i=0;frame();};
document.getElementById('play').onclick=()=>{if(timer){stop();return;}if(i>=steps.length-1){i=0;frame();}document.getElementById('play').textContent='Пауза';timer=setInterval(()=>{if(i<steps.length-1){i++;frame();}else stop();},3000);};
frame();
</script>
</body>
</html>
