<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Порядок уничтожения</title>
<style>
:root{--bg:#fafaf7;--fg:#1d1d1b;--mut:#6b6b66;--card:#fff;--line:#c9c7bd;--acc:#c2410c;--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;--warn:#a16207;--warnbg:#fef9c3;--btn:#1d1d1b;--btnfg:#fff;--hot:#fff1e6}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--fg:#ecebe6;--mut:#9a9a92;--card:#201f1d;--line:#46443f;--acc:#fb923c;--ok:#4ade80;--okbg:#14301d;--bad:#f87171;--badbg:#3a1a1a;--warn:#facc15;--warnbg:#3a3312;--btn:#ecebe6;--btnfg:#161614;--hot:#33241a}}
*{box-sizing:border-box}
body{margin:0;padding:20px;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 14px}
.panel{max-width:860px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;min-height:150px}
.row{display:flex;gap:10px;align-items:center;font:13px ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--line);border-radius:8px;padding:7px 10px;margin:6px 0}
.row.ok{border-color:var(--ok);background:var(--okbg)}
.row.no{border-color:var(--bad);background:var(--badbg);text-decoration:line-through;opacity:.75}
.row.hot{border-color:var(--warn);background:var(--warnbg)}
.row .tag{margin-left:auto;font:12px system-ui,sans-serif;color:var(--mut);text-decoration:none}
.box{display:inline-block;font:13px ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--line);border-radius:8px;padding:8px 12px;margin:4px 6px 4px 0;vertical-align:top}
.box.ok{border-color:var(--ok);background:var(--okbg)}
.box.hot{border-color:var(--warn);background:var(--warnbg)}
.box.no{border-color:var(--bad);background:var(--badbg)}
.box small{display:block;color:var(--mut);font:12px system-ui,sans-serif}
.arrow{display:inline-block;margin:0 4px;color:var(--mut);font-size:18px;vertical-align:middle}
.note{margin:12px 0;padding:12px 14px;border-left:4px solid var(--acc);background:var(--card);border-radius:0 8px 8px 0;min-height:76px;max-width:860px}
.bar2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:860px}
button{font:inherit;padding:7px 14px;border-radius:8px;border:0;background:var(--btn);color:var(--btnfg);cursor:pointer}
button.alt{background:transparent;color:var(--fg);border:1px solid var(--line)}
button:disabled{opacity:.4;cursor:default}
.cnt{color:var(--mut);margin-left:auto}
</style>
</head>
<body>
<h1>Порядок уничтожения</h1>
<p class="sub">Локальные переменные, поля структуры, ранний drop и ловушка с подчёркиванием.</p>
<div class="panel" id="panel"></div>
<div class="note" id="note"></div>
<div class="bar2">
  <button id="step">Шаг</button>
  <button id="play" class="alt">Играть</button>
  <button id="reset" class="alt">Сначала</button>
  <span class="cnt" id="cnt"></span>
</div>
<script>
const steps=[{"p": "<div style=\"margin-bottom:10px\"><div class=\"row\" style=\"margin:2px 0;padding:3px 10px\">let a = D(\"a\");</div><div class=\"row\" style=\"margin:2px 0;padding:3px 10px\">let s = S { x: D(\"x\"), y: D(\"y\") };</div><div class=\"row\" style=\"margin:2px 0;padding:3px 10px\">let b = D(\"b\");</div><div class=\"row\" style=\"margin:2px 0;padding:3px 10px\">{ let c = D(\"c\"); }</div><div class=\"row\" style=\"margin:2px 0;padding:3px 10px\">drop(s);</div><div class=\"row\" style=\"margin:2px 0;padding:3px 10px\">// конец функции</div></div><div><b>Журнал уничтожения:</b> пока пуст</div>", "n": "В коде четыре значения с Drop (a, x, y, b, c) и структура S с полями x и y. Смотрим, в каком порядке они будут уничтожены."}, {"p": "<div style=\"margin-bottom:10px\"><div class=\"row ok\" style=\"margin:2px 0;padding:3px 10px\">let a = D(\"a\");</div><div class=\"row ok\" style=\"margin:2px 0;padding:3px 10px\">let s = S { x: D(\"x\"), y: D(\"y\") };</div><div class=\"row hot\" style=\"margin:2px 0;padding:3px 10px\">let b = D(\"b\");</div><div class=\"row\" style=\"margin:2px 0;padding:3px 10px\">{ let c = D(\"c\"); }</div><div class=\"row\" style=\"margin:2px 0;padding:3px 10px\">drop(s);</div><div class=\"row\" style=\"margin:2px 0;padding:3px 10px\">// конец функции</div></div><div><b>Живы:</b> a, s (x, y), b</div><div><b>Журнал:</b> пока пуст</div>", "n": "Три строки позади: созданы a, s, b. Пока ничего не уничтожено."}, {"p": "<div style=\"margin-bottom:10px\"><div class=\"row ok\" style=\"margin:2px 0;padding:3px 10px\">let a = D(\"a\");</div><div class=\"row ok\" style=\"margin:2px 0;padding:3px 10px\">let s = S { x: D(\"x\"), y: D(\"y\") };</div><div class=\"row ok\" style=\"margin:2px 0;padding:3px 10px\">let b = D(\"b\");</div><div class=\"row hot\" style=\"margin:2px 0;padding:3px 10px\">{ let c = D(\"c\"); }</div><div class=\"row\" style=\"margin:2px 0;padding:3px 10px\">drop(s);</div><div class=\"row\" style=\"margin:2px 0;padding:3px 10px\">// конец функции</div></div><div><b>Живы:</b> a, s (x, y), b</div><div class=\"rows\"><div class=\"row ok\"><span>drop c</span></div></div>", "n": "Внутренний блок закончился. Локальная переменная c вышла из области видимости и уничтожена сразу, на закрывающей скобке."}, {"p": "<div style=\"margin-bottom:10px\"><div class=\"row ok\" style=\"margin:2px 0;padding:3px 10px\">let a = D(\"a\");</div><div class=\"row ok\" style=\"margin:2px 0;padding:3px 10px\">let s = S { x: D(\"x\"), y: D(\"y\") };</div><div class=\"row ok\" style=\"margin:2px 0;padding:3px 10px\">let b = D(\"b\");</div><div class=\"row ok\" style=\"margin:2px 0;padding:3px 10px\">{ let c = D(\"c\"); }</div><div class=\"row hot\" style=\"margin:2px 0;padding:3px 10px\">drop(s);</div><div class=\"row\" style=\"margin:2px 0;padding:3px 10px\">// конец функции</div></div><div><b>Живы:</b> a, b</div><div class=\"rows\"><div class=\"row\"><span>drop c</span></div><div class=\"row\"><span>drop x</span></div><div class=\"row ok\"><span>drop y</span></div></div>", "n": "drop(s) уничтожает структуру целиком. Поля идут в порядке объявления в структуре: сначала x, потом y."}, {"p": "<div style=\"margin-bottom:10px\"><div class=\"row ok\" style=\"margin:2px 0;padding:3px 10px\">let a = D(\"a\");</div><div class=\"row ok\" style=\"margin:2px 0;padding:3px 10px\">let s = S { x: D(\"x\"), y: D(\"y\") };</div><div class=\"row ok\" style=\"margin:2px 0;padding:3px 10px\">let b = D(\"b\");</div><div class=\"row ok\" style=\"margin:2px 0;padding:3px 10px\">{ let c = D(\"c\"); }</div><div class=\"row ok\" style=\"margin:2px 0;padding:3px 10px\">drop(s);</div><div class=\"row hot\" style=\"margin:2px 0;padding:3px 10px\">// конец функции</div></div><div><b>Живы:</b> a</div><div class=\"rows\"><div class=\"row\"><span>drop c</span></div><div class=\"row\"><span>drop x</span></div><div class=\"row\"><span>drop y</span></div><div class=\"row ok\"><span>drop b</span></div></div>", "n": "Конец функции. Локальные переменные уничтожаются в обратном порядке объявления: сначала b (объявлена позже)."}, {"p": "<div style=\"margin-bottom:10px\"><div class=\"row ok\" style=\"margin:2px 0;padding:3px 10px\">let a = D(\"a\");</div><div class=\"row ok\" style=\"margin:2px 0;padding:3px 10px\">let s = S { x: D(\"x\"), y: D(\"y\") };</div><div class=\"row ok\" style=\"margin:2px 0;padding:3px 10px\">let b = D(\"b\");</div><div class=\"row ok\" style=\"margin:2px 0;padding:3px 10px\">{ let c = D(\"c\"); }</div><div class=\"row ok\" style=\"margin:2px 0;padding:3px 10px\">drop(s);</div><div class=\"row hot\" style=\"margin:2px 0;padding:3px 10px\">// конец функции</div></div><div><b>Всё освобождено</b></div><div class=\"rows\"><div class=\"row\"><span>drop c</span></div><div class=\"row\"><span>drop x</span></div><div class=\"row\"><span>drop y</span></div><div class=\"row\"><span>drop b</span></div><div class=\"row ok\"><span>drop a</span></div></div>", "n": "Последней уходит a, объявленная раньше всех. Правило «как стопка тарелок»: что положили последним, то снимают первым. А поля структуры и элементы вектора идут по порядку, как записаны."}, {"p": "<div class=\"row\"><span>let _ = D(\"t\");</span></div><div class=\"row no\"><span>drop t: уничтожен сразу, на этой же строке</span></div><div class=\"row\"><span>let _g = D(\"g\");</span></div><div class=\"row ok\"><span>g живёт до конца блока и уничтожится в обратном порядке</span></div>", "n": "Ловушка с подчёркиванием. Шаблон «_» значение не сохраняет, и оно умирает немедленно. Имя «_g» значение удерживает до конца блока. Для охранников (блокировок, транзакций) это разница между защитой и её отсутствием."}];
let i=0,timer=null;
function stop(){if(timer){clearInterval(timer);timer=null;}document.getElementById('play').textContent='Играть';}
function frame(){document.getElementById('panel').innerHTML=steps[i].p;document.getElementById('note').textContent=steps[i].n;document.getElementById('cnt').textContent='шаг '+(i+1)+' из '+steps.length;document.getElementById('step').disabled=i>=steps.length-1;if(i>=steps.length-1)stop();}
document.getElementById('step').onclick=()=>{if(i<steps.length-1){i++;frame();}};
document.getElementById('reset').onclick=()=>{stop();i=0;frame();};
document.getElementById('play').onclick=()=>{if(timer){stop();return;}if(i>=steps.length-1){i=0;frame();}document.getElementById('play').textContent='Пауза';timer=setInterval(()=>{if(i<steps.length-1){i++;frame();}else stop();},3000);};
frame();
</script>
</body>
</html>
