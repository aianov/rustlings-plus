<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Разброс замеров одной функции</title>
<style>
:root{--bg:#fafaf7;--fg:#1d1d1b;--mut:#6b6b66;--card:#fff;--line:#c9c7bd;--acc:#c2410c;--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;--warn:#a16207;--warnbg:#fef9c3;--btn:#1d1d1b;--btnfg:#fff;--hot:#fff1e6}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--fg:#ecebe6;--mut:#9a9a92;--card:#201f1d;--line:#46443f;--acc:#fb923c;--ok:#4ade80;--okbg:#14301d;--bad:#f87171;--badbg:#3a1a1a;--warn:#facc15;--warnbg:#3a3312;--btn:#ecebe6;--btnfg:#161614;--hot:#33241a}}
*{box-sizing:border-box}
body{margin:0;padding:20px;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 14px}
.panel{max-width:860px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;min-height:150px}
.row{display:flex;gap:10px;align-items:center;font:13px ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--line);border-radius:8px;padding:7px 10px;margin:6px 0}
.row.ok{border-color:var(--ok);background:var(--okbg)}
.row.no{border-color:var(--bad);background:var(--badbg);text-decoration:line-through;opacity:.75}
.row.hot{border-color:var(--warn);background:var(--warnbg)}
.row .tag{margin-left:auto;font:12px system-ui,sans-serif;color:var(--mut);text-decoration:none}
.box{display:inline-block;font:13px ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--line);border-radius:8px;padding:8px 12px;margin:4px 6px 4px 0;vertical-align:top}
.box.ok{border-color:var(--ok);background:var(--okbg)}
.box.hot{border-color:var(--warn);background:var(--warnbg)}
.box.no{border-color:var(--bad);background:var(--badbg)}
.box small{display:block;color:var(--mut);font:12px system-ui,sans-serif}
.arrow{display:inline-block;margin:0 4px;color:var(--mut);font-size:18px;vertical-align:middle}
.note{margin:12px 0;padding:12px 14px;border-left:4px solid var(--acc);background:var(--card);border-radius:0 8px 8px 0;min-height:76px;max-width:860px}
.bar2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:860px}
button{font:inherit;padding:7px 14px;border-radius:8px;border:0;background:var(--btn);color:var(--btnfg);cursor:pointer}
button.alt{background:transparent;color:var(--fg);border:1px solid var(--line)}
button:disabled{opacity:.4;cursor:default}
.cnt{color:var(--mut);margin-left:auto}
</style>
</head>
<body>
<h1>Разброс замеров одной функции</h1>
<p class="sub">Двадцать запусков одной и той же функции, цифры в миллисекундах</p>
<div class="panel" id="panel"></div>
<div class="note" id="note"></div>
<div class="bar2">
  <button id="step">Шаг</button>
  <button id="play" class="alt">Играть</button>
  <button id="reset" class="alt">Сначала</button>
  <span class="cnt" id="cnt"></span>
</div>
<script>
const steps=[{"p": "<div style=\"display:flex;align-items:flex-end;gap:4px;height:130px;border-bottom:2px solid var(--line)\"><div title=\"48 мс\" style=\"width:22px;height:57px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"31 мс\" style=\"width:22px;height:37px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"22 мс\" style=\"width:22px;height:26px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"12 мс\" style=\"width:22px;height:14px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"11 мс\" style=\"width:22px;height:13px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"10 мс\" style=\"width:22px;height:12px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"10 мс\" style=\"width:22px;height:12px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"11 мс\" style=\"width:22px;height:13px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"10 мс\" style=\"width:22px;height:12px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"12 мс\" style=\"width:22px;height:14px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"10 мс\" style=\"width:22px;height:12px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"10 мс\" style=\"width:22px;height:12px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"95 мс\" style=\"width:22px;height:114px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"11 мс\" style=\"width:22px;height:13px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"10 мс\" style=\"width:22px;height:12px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"10 мс\" style=\"width:22px;height:12px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"12 мс\" style=\"width:22px;height:14px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"10 мс\" style=\"width:22px;height:12px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"11 мс\" style=\"width:22px;height:13px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"10 мс\" style=\"width:22px;height:12px;background:var(--acc);border-radius:3px 3px 0 0\"></div></div><div class=\"row\">20 запусков: 48 31 22 12 11 10 10 11 10 12 10 10 95 11 10 10 12 10 11 10</div>", "n": "Функция одна, код один, а времена разные: от 10 до 95 мс. Один запуск не расскажет ничего."}, {"p": "<div style=\"display:flex;align-items:flex-end;gap:4px;height:130px;border-bottom:2px solid var(--line)\"><div title=\"48 мс\" style=\"width:22px;height:57px;background:var(--bad);border-radius:3px 3px 0 0\"></div><div title=\"31 мс\" style=\"width:22px;height:37px;background:var(--bad);border-radius:3px 3px 0 0\"></div><div title=\"22 мс\" style=\"width:22px;height:26px;background:var(--bad);border-radius:3px 3px 0 0\"></div><div title=\"12 мс\" style=\"width:22px;height:14px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"11 мс\" style=\"width:22px;height:13px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"10 мс\" style=\"width:22px;height:12px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"10 мс\" style=\"width:22px;height:12px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"11 мс\" style=\"width:22px;height:13px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"10 мс\" style=\"width:22px;height:12px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"12 мс\" style=\"width:22px;height:14px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"10 мс\" style=\"width:22px;height:12px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"10 мс\" style=\"width:22px;height:12px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"95 мс\" style=\"width:22px;height:114px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"11 мс\" style=\"width:22px;height:13px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"10 мс\" style=\"width:22px;height:12px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"10 мс\" style=\"width:22px;height:12px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"12 мс\" style=\"width:22px;height:14px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"10 мс\" style=\"width:22px;height:12px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"11 мс\" style=\"width:22px;height:13px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"10 мс\" style=\"width:22px;height:12px;background:var(--acc);border-radius:3px 3px 0 0\"></div></div><div class=\"row no\">первые три запуска: холодные кэши, память ещё не выделена</div>", "n": "Первые запуски всегда медленнее. Их делают на прогреве и выбрасывают."}, {"p": "<div style=\"display:flex;align-items:flex-end;gap:4px;height:130px;border-bottom:2px solid var(--line)\"><div title=\"12 мс\" style=\"width:22px;height:14px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"11 мс\" style=\"width:22px;height:13px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"10 мс\" style=\"width:22px;height:12px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"10 мс\" style=\"width:22px;height:12px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"11 мс\" style=\"width:22px;height:13px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"10 мс\" style=\"width:22px;height:12px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"12 мс\" style=\"width:22px;height:14px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"10 мс\" style=\"width:22px;height:12px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"10 мс\" style=\"width:22px;height:12px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"95 мс\" style=\"width:22px;height:114px;background:var(--bad);border-radius:3px 3px 0 0\"></div><div title=\"11 мс\" style=\"width:22px;height:13px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"10 мс\" style=\"width:22px;height:12px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"10 мс\" style=\"width:22px;height:12px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"12 мс\" style=\"width:22px;height:14px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"10 мс\" style=\"width:22px;height:12px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"11 мс\" style=\"width:22px;height:13px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"10 мс\" style=\"width:22px;height:12px;background:var(--acc);border-radius:3px 3px 0 0\"></div></div><div class=\"row hot\">один выброс в 95 мс: сосед по процессору, планировщик, сборка мусора у соседа</div>", "n": "Дальше разброс небольшой, но один запуск попал на неудачный момент. Такое случается всегда."}, {"p": "<div style=\"display:flex;align-items:flex-end;gap:4px;height:130px;border-bottom:2px solid var(--line)\"><div title=\"12 мс\" style=\"width:22px;height:14px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"11 мс\" style=\"width:22px;height:13px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"10 мс\" style=\"width:22px;height:12px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"10 мс\" style=\"width:22px;height:12px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"11 мс\" style=\"width:22px;height:13px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"10 мс\" style=\"width:22px;height:12px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"12 мс\" style=\"width:22px;height:14px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"10 мс\" style=\"width:22px;height:12px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"10 мс\" style=\"width:22px;height:12px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"95 мс\" style=\"width:22px;height:114px;background:var(--bad);border-radius:3px 3px 0 0\"></div><div title=\"11 мс\" style=\"width:22px;height:13px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"10 мс\" style=\"width:22px;height:12px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"10 мс\" style=\"width:22px;height:12px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"12 мс\" style=\"width:22px;height:14px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"10 мс\" style=\"width:22px;height:12px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"11 мс\" style=\"width:22px;height:13px;background:var(--acc);border-radius:3px 3px 0 0\"></div><div title=\"10 мс\" style=\"width:22px;height:12px;background:var(--acc);border-radius:3px 3px 0 0\"></div></div><div class=\"row bad\">среднее арифметическое: 15.6 мс</div><div class=\"row ok\">медиана: 10 мс (типичное время)</div><div class=\"row hot\">p99: 95 мс (хвост), минимум: 10 мс</div>", "n": "Среднее поднялось почти вдвое из-за одного выброса, оно описывает то, чего на самом деле не бывает. Медиана показывает типичный запуск, p99 хвост, минимум лучший случай."}, {"p": "<div class=\"row ok\">прогрев → десятки запусков → медиана и p99 → Instant, а не SystemTime → --release → black_box</div><div class=\"row no\">один запуск, среднее, отладочная сборка, результат без black_box</div>", "n": "Короткий рецепт честного замера и список того, чем он портится."}];
let i=0,timer=null;
function stop(){if(timer){clearInterval(timer);timer=null;}document.getElementById('play').textContent='Играть';}
function frame(){document.getElementById('panel').innerHTML=steps[i].p;document.getElementById('note').textContent=steps[i].n;document.getElementById('cnt').textContent='шаг '+(i+1)+' из '+steps.length;document.getElementById('step').disabled=i>=steps.length-1;if(i>=steps.length-1)stop();}
document.getElementById('step').onclick=()=>{if(i<steps.length-1){i++;frame();}};
document.getElementById('reset').onclick=()=>{stop();i=0;frame();};
document.getElementById('play').onclick=()=>{if(timer){stop();return;}if(i>=steps.length-1){i=0;frame();}document.getElementById('play').textContent='Пауза';timer=setInterval(()=>{if(i<steps.length-1){i++;frame();}else stop();},3000);};
frame();
</script>
</body>
</html>
