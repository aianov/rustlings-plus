<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Рост вектора: переносы и with_capacity</title>
<style>
:root{--bg:#fafaf7;--fg:#1d1d1b;--mut:#6b6b66;--card:#fff;--line:#c9c7bd;--acc:#c2410c;--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;--warn:#a16207;--warnbg:#fef9c3;--btn:#1d1d1b;--btnfg:#fff;--hot:#fff1e6}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--fg:#ecebe6;--mut:#9a9a92;--card:#201f1d;--line:#46443f;--acc:#fb923c;--ok:#4ade80;--okbg:#14301d;--bad:#f87171;--badbg:#3a1a1a;--warn:#facc15;--warnbg:#3a3312;--btn:#ecebe6;--btnfg:#161614;--hot:#33241a}}
*{box-sizing:border-box}
body{margin:0;padding:20px;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 14px}
.panel{max-width:860px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;min-height:150px}
.row{display:flex;gap:10px;align-items:center;font:13px ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--line);border-radius:8px;padding:7px 10px;margin:6px 0}
.row.ok{border-color:var(--ok);background:var(--okbg)}
.row.no{border-color:var(--bad);background:var(--badbg);text-decoration:line-through;opacity:.75}
.row.hot{border-color:var(--warn);background:var(--warnbg)}
.row .tag{margin-left:auto;font:12px system-ui,sans-serif;color:var(--mut);text-decoration:none}
.box{display:inline-block;font:13px ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--line);border-radius:8px;padding:8px 12px;margin:4px 6px 4px 0;vertical-align:top}
.box.ok{border-color:var(--ok);background:var(--okbg)}
.box.hot{border-color:var(--warn);background:var(--warnbg)}
.box.no{border-color:var(--bad);background:var(--badbg)}
.box small{display:block;color:var(--mut);font:12px system-ui,sans-serif}
.arrow{display:inline-block;margin:0 4px;color:var(--mut);font-size:18px;vertical-align:middle}
.note{margin:12px 0;padding:12px 14px;border-left:4px solid var(--acc);background:var(--card);border-radius:0 8px 8px 0;min-height:76px;max-width:860px}
.bar2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:860px}
button{font:inherit;padding:7px 14px;border-radius:8px;border:0;background:var(--btn);color:var(--btnfg);cursor:pointer}
button.alt{background:transparent;color:var(--fg);border:1px solid var(--line)}
button:disabled{opacity:.4;cursor:default}
.cnt{color:var(--mut);margin-left:auto}
</style>
</head>
<body>
<h1>Рост вектора: переносы и with_capacity</h1>
<p class="sub">Девять push в Vec<u32>, без запаса и с запасом</p>
<div class="panel" id="panel"></div>
<div class="note" id="note"></div>
<div class="bar2">
  <button id="step">Шаг</button>
  <button id="play" class="alt">Играть</button>
  <button id="reset" class="alt">Сначала</button>
  <span class="cnt" id="cnt"></span>
</div>
<script>
const steps=[{"p": "<div class=\"row hot\">let mut v = Vec::new(); <span class=\"tag\">аллокаций: 0, ёмкость 0, длина 0</span></div><div class=\"row\">куча: пусто (ничего не выделено)</div>", "n": "Пустой вектор ничего не просит у аллокатора: указатель на заглушку, ёмкость 0."}, {"p": "<div class=\"row hot\">v.push(1); <span class=\"tag\">аллокаций: 1, ёмкость 4, длина 1</span></div><div><span class=\"box ok\" style=\"min-width:30px;text-align:center;padding:6px 4px\">1</span><span class=\"box \" style=\"min-width:30px;text-align:center;padding:6px 4px\">&nbsp;</span><span class=\"box \" style=\"min-width:30px;text-align:center;padding:6px 4px\">&nbsp;</span><span class=\"box \" style=\"min-width:30px;text-align:center;padding:6px 4px\">&nbsp;</span></div>", "n": "Первый push выделяет место сразу на 4 элемента. Аллокация номер один."}, {"p": "<div class=\"row hot\">v.push(2); v.push(3); v.push(4); <span class=\"tag\">аллокаций: 1, ёмкость 4, длина 4</span></div><div><span class=\"box ok\" style=\"min-width:30px;text-align:center;padding:6px 4px\">1</span><span class=\"box ok\" style=\"min-width:30px;text-align:center;padding:6px 4px\">2</span><span class=\"box ok\" style=\"min-width:30px;text-align:center;padding:6px 4px\">3</span><span class=\"box ok\" style=\"min-width:30px;text-align:center;padding:6px 4px\">4</span></div>", "n": "Следующие три push помещаются в запас. Аллокатор не трогаем."}, {"p": "<div class=\"row hot\">v.push(5); <span class=\"tag\">аллокаций: 2, ёмкость 8, длина 5</span></div><div><span class=\"box ok\" style=\"min-width:30px;text-align:center;padding:6px 4px\">1</span><span class=\"box ok\" style=\"min-width:30px;text-align:center;padding:6px 4px\">2</span><span class=\"box ok\" style=\"min-width:30px;text-align:center;padding:6px 4px\">3</span><span class=\"box ok\" style=\"min-width:30px;text-align:center;padding:6px 4px\">4</span><span class=\"box ok\" style=\"min-width:30px;text-align:center;padding:6px 4px\">5</span><span class=\"box \" style=\"min-width:30px;text-align:center;padding:6px 4px\">&nbsp;</span><span class=\"box \" style=\"min-width:30px;text-align:center;padding:6px 4px\">&nbsp;</span><span class=\"box \" style=\"min-width:30px;text-align:center;padding:6px 4px\">&nbsp;</span></div><div class=\"row no\">старый буфер на 4 места освобождён, 4 элемента скопированы</div>", "n": "Пятый push не помещается: ёмкость удваивается до 8, элементы переезжают в новый буфер. Аллокация номер два, плюс копирование."}, {"p": "<div class=\"row hot\">v.push(6..=8); <span class=\"tag\">аллокаций: 2, ёмкость 8, длина 8</span></div><div><span class=\"box ok\" style=\"min-width:30px;text-align:center;padding:6px 4px\">1</span><span class=\"box ok\" style=\"min-width:30px;text-align:center;padding:6px 4px\">2</span><span class=\"box ok\" style=\"min-width:30px;text-align:center;padding:6px 4px\">3</span><span class=\"box ok\" style=\"min-width:30px;text-align:center;padding:6px 4px\">4</span><span class=\"box ok\" style=\"min-width:30px;text-align:center;padding:6px 4px\">5</span><span class=\"box ok\" style=\"min-width:30px;text-align:center;padding:6px 4px\">6</span><span class=\"box ok\" style=\"min-width:30px;text-align:center;padding:6px 4px\">7</span><span class=\"box ok\" style=\"min-width:30px;text-align:center;padding:6px 4px\">8</span></div>", "n": "Снова запас: ничего не просим."}, {"p": "<div class=\"row hot\">v.push(9); <span class=\"tag\">аллокаций: 3, ёмкость 16, длина 9</span></div><div><span class=\"box ok\" style=\"min-width:30px;text-align:center;padding:6px 4px\">1</span><span class=\"box ok\" style=\"min-width:30px;text-align:center;padding:6px 4px\">2</span><span class=\"box ok\" style=\"min-width:30px;text-align:center;padding:6px 4px\">3</span><span class=\"box ok\" style=\"min-width:30px;text-align:center;padding:6px 4px\">4</span><span class=\"box ok\" style=\"min-width:30px;text-align:center;padding:6px 4px\">5</span><span class=\"box ok\" style=\"min-width:30px;text-align:center;padding:6px 4px\">6</span><span class=\"box ok\" style=\"min-width:30px;text-align:center;padding:6px 4px\">7</span><span class=\"box ok\" style=\"min-width:30px;text-align:center;padding:6px 4px\">8</span><span class=\"box ok\" style=\"min-width:30px;text-align:center;padding:6px 4px\">9</span><span class=\"box \" style=\"min-width:30px;text-align:center;padding:6px 4px\">&nbsp;</span><span class=\"box \" style=\"min-width:30px;text-align:center;padding:6px 4px\">&nbsp;</span><span class=\"box \" style=\"min-width:30px;text-align:center;padding:6px 4px\">&nbsp;</span><span class=\"box \" style=\"min-width:30px;text-align:center;padding:6px 4px\">&nbsp;</span><span class=\"box \" style=\"min-width:30px;text-align:center;padding:6px 4px\">&nbsp;</span><span class=\"box \" style=\"min-width:30px;text-align:center;padding:6px 4px\">&nbsp;</span><span class=\"box \" style=\"min-width:30px;text-align:center;padding:6px 4px\">&nbsp;</span></div><div class=\"row no\">ещё перенос: 8 элементов скопированы</div>", "n": "Девятый push: ёмкость 16, третья аллокация и третье копирование. На миллионе элементов таких переносов около двадцати, а скопировано в сумме столько же, сколько лежит в векторе."}, {"p": "<div class=\"row hot\">let mut w = Vec::with_capacity(9); <span class=\"tag\">аллокаций: 1, ёмкость 9, длина 0</span></div><div><span class=\"box \" style=\"min-width:30px;text-align:center;padding:6px 4px\">&nbsp;</span><span class=\"box \" style=\"min-width:30px;text-align:center;padding:6px 4px\">&nbsp;</span><span class=\"box \" style=\"min-width:30px;text-align:center;padding:6px 4px\">&nbsp;</span><span class=\"box \" style=\"min-width:30px;text-align:center;padding:6px 4px\">&nbsp;</span><span class=\"box \" style=\"min-width:30px;text-align:center;padding:6px 4px\">&nbsp;</span><span class=\"box \" style=\"min-width:30px;text-align:center;padding:6px 4px\">&nbsp;</span><span class=\"box \" style=\"min-width:30px;text-align:center;padding:6px 4px\">&nbsp;</span><span class=\"box \" style=\"min-width:30px;text-align:center;padding:6px 4px\">&nbsp;</span><span class=\"box \" style=\"min-width:30px;text-align:center;padding:6px 4px\">&nbsp;</span></div>", "n": "Если размер известен заранее, вся ёмкость выделяется сразу: одна аллокация."}, {"p": "<div class=\"row hot\">9 раз w.push(..); <span class=\"tag\">аллокаций: 1, ёмкость 9, длина 9</span></div><div><span class=\"box ok\" style=\"min-width:30px;text-align:center;padding:6px 4px\">1</span><span class=\"box ok\" style=\"min-width:30px;text-align:center;padding:6px 4px\">2</span><span class=\"box ok\" style=\"min-width:30px;text-align:center;padding:6px 4px\">3</span><span class=\"box ok\" style=\"min-width:30px;text-align:center;padding:6px 4px\">4</span><span class=\"box ok\" style=\"min-width:30px;text-align:center;padding:6px 4px\">5</span><span class=\"box ok\" style=\"min-width:30px;text-align:center;padding:6px 4px\">6</span><span class=\"box ok\" style=\"min-width:30px;text-align:center;padding:6px 4px\">7</span><span class=\"box ok\" style=\"min-width:30px;text-align:center;padding:6px 4px\">8</span><span class=\"box ok\" style=\"min-width:30px;text-align:center;padding:6px 4px\">9</span></div><div class=\"row ok\">итог: 1 аллокация против 3, ни одного копирования</div>", "n": "Вот и вся разница. Для итератора с известной длиной (диапазон, срез, map по ним) collect делает то же самое сам."}];
let i=0,timer=null;
function stop(){if(timer){clearInterval(timer);timer=null;}document.getElementById('play').textContent='Играть';}
function frame(){document.getElementById('panel').innerHTML=steps[i].p;document.getElementById('note').textContent=steps[i].n;document.getElementById('cnt').textContent='шаг '+(i+1)+' из '+steps.length;document.getElementById('step').disabled=i>=steps.length-1;if(i>=steps.length-1)stop();}
document.getElementById('step').onclick=()=>{if(i<steps.length-1){i++;frame();}};
document.getElementById('reset').onclick=()=>{stop();i=0;frame();};
document.getElementById('play').onclick=()=>{if(timer){stop();return;}if(i>=steps.length-1){i=0;frame();}document.getElementById('play').textContent='Пауза';timer=setInterval(()=>{if(i<steps.length-1){i++;frame();}else stop();},3000);};
frame();
</script>
</body>
</html>
