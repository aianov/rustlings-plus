why.ru = '''Экзамен собирает разделы вместе. Разбор строк отдаёт срезы исходного текста (времена жизни), ленивый обход строится на итераторах, свёртки это трейт с ассоциированным типом, ошибка настоящая (`Display`, `source`, `From`), параллельность идёт через `thread::scope` без `Arc`, а feature и линты закрывают манифест. Макрос принимает любое число уровней, потому что повторение `$(...),*` покрывает и ноль. Всё поведение проверяется приёмкой, включая счётчик аллокаций и собственные пробные сборки в песочнице.'''

