[[exercises]]
name = "perf1"
style = "todo"
hint.ru = [
  '''Вектор на стеке это заголовок из трёх слов, а данные в куче. Сколько кучи он занял: по длине или по ёмкости? Размеры типов даёт `std::mem::size_of`.''',
  '''Для `Option<T>` важно, есть ли у `T` значение, которого не бывает: у `Box`, ссылок, `NonZero*` это нуль, у `char` всё выше 0x10FFFF. Туда помещается `None`, и метка не нужна.''',
]
why.ru = '''Память вектора определяет ёмкость, а не длина: `with_capacity(100)` занимает место сразу под сто. Срез в `Box<[T]>` хранит только указатель и длину, поэтому лишнего запаса в нём нет. Оптимизация ниши делает `Option<Box<T>>`, `Option<&T>` и `Option<NonZeroU32>` бесплатными: `None` занимает значение, которого у типа не бывает. У `u32` свободных значений нет, поэтому `Option<u32>` вдвое тяжелее.'''

[[exercises]]
name = "perf_q1"
kind = "question"
question.ru = '''Размер `Vec<u8>` на 64-битной машине 24 байта (указатель, длина, ёмкость). Чему равен `std::mem::size_of::<Option<Vec<u8>>>()`?'''
options.ru = [
  "24",
  "25",
  "32",
  "16",
]
answer = [0]
explain.ru = '''Указатель внутри `Vec` не бывает нулевым, и `None` занимает именно это недопустимое значение, поэтому метка не нужна. Те же ниши у `Box`, ссылок, `NonZero*` и `char`. У `u64` свободных значений нет, поэтому `Option<u64>` вдвое тяжелее самого `u64`.'''
hint.ru = '''Есть ли у Vec значение, которое никогда не встречается у настоящих векторов?'''

[[exercises]]
name = "perf2"
style = "fix"
hint.ru = [
  '''Размер enum равен размеру самого большого варианта плюс метка. Какой вариант самый большой и во сколько раз он больше остальных?''',
  '''Крупную нечасто встречающуюся нагрузку выносят в кучу: в варианте остаётся один указатель. Проверяй результат `size_of::<Event>()`, а не на глаз.''',
]
why.ru = '''Каждое значение enum занимает место под самый большой вариант, даже если лежит самый маленький. Очередь из миллиона тиков тогда весит как миллион снимков экрана. `Box` в редком варианте превращает 512 байт в 8, а за снимок платит только тот, у кого он есть. Сопоставление с образцом почти не меняется: `data` в варианте стал `Box`, но `data.len()` и `data.iter()` работают через автоматическое разыменование.'''

[[exercises]]
name = "perf_q9"
kind = "question"
question.ru = '''```rust
enum Shape {
    Dot,
    Circle(f32),
    Poly([f32; 64]),
}
```
Сколько примерно байт займёт `Vec<Shape>` из 1000 точек `Shape::Dot` (если считать только элементы)?'''
options.ru = [
  "около 1000 байт",
  "около 4 000 байт",
  "около 260 000 байт",
  "около 8 000 байт",
]
answer = [2]
explain.ru = '''Размер enum определяет самый большой вариант: 64 числа по 4 байта (256) плюс метка, всего около 260. Каждый элемент вектора занимает столько, даже если это `Dot`. Решение: `Poly(Box<[f32; 64]>)`, тогда `Shape` весит 16 байт или меньше.'''
hint.ru = '''Сколько места занимает один элемент вектора, если варианты разного размера?'''

[[exercises]]
name = "perf3"
style = "scratch"
hint.ru = [
  '''Аллокатор вызывается из любой части программы, в том числе из потоков, поэтому счётчики общие и атомарные. Что можно считать в обёртке до того, как вызов уйдёт в `System`?''',
  '''Реализуй `alloc` и `realloc`, а ещё подумай про `alloc_zeroed`: через него идёт `vec![0; n]`. Для порядка памяти хватит `Relaxed`: счётчики ни с чем не синхронизируются.''',
  '''`measure`: прочитать счётчики, запустить замыкание, прочитать снова и вычесть. Не вызывай в самом аллокаторе ничего, что выделяет память (`println!`, `format!`, `Vec`): это бесконечная рекурсия.''',
]
why.ru = '''Глобальный аллокатор должен быть внутри себя предельно простым: любое выделение памяти в нём вызывает его же. Поэтому счётчики это атомики, а не вектор или мьютекс с логом. `alloc_zeroed` стоит учесть явно, иначе `vec![0; n]` пройдёт мимо. Важно помнить ограничение этой версии: счётчики общие на весь процесс, и в параллельных тестах чужие потоки будут в них попадать.'''

[[exercises]]
name = "perf4"
style = "fix"
hint.ru = [
  '''Запусти тест несколько раз: падение плавающее. Что делает соседний поток, пока ты меряешь? И почему общие счётчики это видят?''',
  '''Нужен счётчик на каждый поток. В `std` для этого есть `thread_local!`. Внутри аллокатора нельзя выделять память, поэтому начальное значение надо задавать константой: `const { Cell::new(0) }`.''',
  '''Обращайся к thread_local через `try_with`: при остановке потока его локальное хранилище уже могло быть уничтожено, и обычный `with` упадёт посреди выделения.''',
]
why.ru = '''Глобальный счётчик меряет весь процесс, а тест хочет мерить один поток. `thread_local!` с `Cell` даёт каждому потоку свой счётчик без атомиков, и чужие аллокации в замер не попадают. `const { ... }` в инициализаторе не даёт локальному хранилищу самому выделять память при первом обращении, а `try_with` защищает от обращения к уже уничтоженному хранилищу во время завершения потока. Тесты, которые считают аллокации, обязаны использовать такой счётчик.'''

[[exercises]]
name = "perf_q7"
kind = "question"
question.ru = '''Тест «этот путь не делает аллокаций» с глобальным счётчиком на `AtomicUsize` иногда падает, хотя сам путь не аллоцирует. Почему и как лечить?'''
options.ru = [
  "счётчик Relaxed слишком слабый, нужен SeqCst",
  "`cargo test` запускает тесты в разных потоках, и аллокации соседних тестов попадают в общий счётчик: нужен счётчик на поток",
  "аллокатор считает освобождения, поэтому результат непредсказуем",
  "тест нужно запускать только в `--release`",
]
answer = [1]
explain.ru = '''Атомик общий на весь процесс, а параллельные тесты аллоцируют постоянно. Порядок памяти тут ни при чём: ошибка не в видимости записи, а в том, что считается чужое. `thread_local!` с `Cell<usize>` даёт каждому потоку свой счётчик, и замер видит только тот поток, который его запустил.'''
hint.ru = '''Кто ещё в процессе выделяет память, пока идёт замер?'''

[[exercises]]
name = "perf5"
style = "fix"
hint.ru = [
  '''Найди в каждой из трёх функций строку, которая создаёт новое значение, хотя исходное доживает до конца работы. Что можно вернуть вместо `String`, если данные уже лежат в входной строке?''',
  '''Для упоминаний вернётся вектор срезов. Для тега нужен тип, который бывает и заимствованным, и владеющим. Для профилей нужен общий владелец, который копируется как счётчик ссылок.''',
  '''Результат `normalize_tag` должен быть `Cow<str>`: заимствуй, пока тег не содержит заглавных, и создавай `String` только при изменении. В посте вместо `Profile` храни `Arc<Profile>` и клонируй сам `Arc`.''',
]
why.ru = '''Три приёма на одном месте. Срезы вместо копий работают, пока исходная строка жива дольше результата. `Cow` откладывает копию до момента, когда она действительно нужна: нормальный тег проходит насквозь без единой аллокации. `Arc` делает «копию» профиля сложением одного счётчика, и тысяча постов ссылается на три профиля. Проверять такие вещи удобнее счётчиком аллокаций, чем глазами: он показывает не «выглядит дёшево», а сколько раз попросили память.'''

[[exercises]]
name = "perf_q8"
kind = "question"
question.ru = '''Функция `fn tidy(s: &str) -> Cow<'_, str>` вызывается 1000 раз. В 990 вызовах строка уже в порядке, в 10 её нужно поправить. Сколько примерно аллокаций сделают все вызовы вместе?'''
options.ru = [
  "около 10",
  "около 1000",
  "около 990",
  "около 2000",
]
answer = [0]
explain.ru = '''`Cow::Borrowed` не выделяет память: возвращается тот же срез. Новая строка создаётся только в десяти случаях, когда содержимое меняется. Вариант с `-> String` сделал бы тысячу копий, из них 990 бесполезных.'''
hint.ru = '''Когда Cow остаётся заимствованным и что при этом выделяется?'''

[[exercises]]
name = "perf6"
style = "fix"
hint.ru = [
  '''Посчитай, сколько раз просят память за одну строку: вектор для кусочков, `to_string`, `to_uppercase`, `join`, `format!` и рост итоговой строки. Какие из них нужны вообще?''',
  '''Пиши прямо в итоговую строку: `write!(out, ...)` из `std::fmt::Write`. Размер можно оценить заранее и выделить один раз (`String::with_capacity`). Если размер известен, `collect` по итератору с точной длиной выделяет ровно один раз.''',
  '''У кодировщика не заводи новый `Vec` на каждый вызов: очисти старый (`clear` оставляет ёмкость) и допиши в него. Возвращаемое значение останется срезом буфера.''',
]
why.ru = '''Аллокация стоит дорого не одним вызовом, а повторами: цикл по тысяче строк умножает любую мелочь на тысячу. `write!` в готовую строку избавляет от промежуточных `String`, `with_capacity` убирает серию расширений, а `clear` сохраняет ёмкость буфера и превращает «новый вектор на каждый вызов» в «ни одной аллокации после прогрева». Счётчик аллокаций в тестах держит оптимизацию честной: результат тот же, просьб к аллокатору на порядок меньше.'''

[[exercises]]
name = "perf_q2"
kind = "question"
question.ru = '''Сколько раз код обратится к аллокатору?
```rust
let mut v = Vec::new();
for i in 0..9u32 {
    v.push(i);
}
```'''
options.ru = [
  "1",
  "2",
  "3",
  "9",
]
answer = [2]
explain.ru = '''Первый `push` выделяет место на 4 элемента, пятый переносит на 8 (`realloc`), девятый на 16. Итого три обращения. С `Vec::with_capacity(9)` обращение было бы одно.'''
hint.ru = '''Ёмкость вектора удваивается, начиная с 4 для маленьких элементов. Когда на девятом элементе она закончится?'''

[[exercises]]
name = "perf7"
style = "fix"
hint.ru = [
  '''Что делает `Vec::remove(0)` со всеми остальными элементами? А что делает `contains` на вектор из тысяч элементов, когда его зовут в цикле?''',
  '''Для очереди нужна структура, у которой дёшево и начало, и конец: в `std::collections` такая есть. Для «уже встречали» нужна структура, где проверка не зависит от размера.''',
  '''Для уникальных держи множество ссылок на встреченные элементы (`HashSet<&T>`) и отдавай в результат только те, которые успешно вставились: `insert` возвращает `true` для нового. Не забудь про границы: теперь нужны `Eq` и `Hash`.''',
]
why.ru = '''`Vec::remove(0)` сдвигает все остальные элементы, поэтому очередь на нём тратит время пропорционально квадрату размера. `VecDeque` это кольцевой буфер: обе стороны дешёвые. `contains` по `Vec` в цикле тоже квадратичен, `HashSet` проверяет принадлежность за почти постоянное время, но требует `Eq + Hash`. Счётчик сравнений в тесте надёжнее таймера: он не зависит от скорости машины и точно показывает разницу между `n²` и `n`.'''

[[exercises]]
name = "perf_q10"
kind = "question"
question.ru = '''Очередь заданий реализована на `Vec`: `push` кладёт в конец, обработчик берёт задание через `remove(0)`. На 100 заданиях всё быстро, на 100 тысячах сервис стоит. Что заменить?'''
options.ru = [
  "`Vec` на `VecDeque`",
  "`remove(0)` на `swap_remove(0)`, потому что он быстрее",
  "`Vec` на `HashSet`",
  "ничего: для вектора такие операции быстрые",
]
answer = [0]
explain.ru = '''`remove(0)` сдвигает все оставшиеся элементы, и вся обработка очереди становится квадратичной. `VecDeque` это кольцевой буфер: взять с начала и добавить в конец одинаково дёшево. `swap_remove(0)` быстрый, но нарушает порядок (последний элемент встаёт на место первого), для очереди это неверное поведение.'''
hint.ru = '''Что происходит со всеми элементами вектора после remove(0)?'''

[[exercises]]
name = "perf8"
style = "scratch"
hint.ru = [
  '''Что именно ты меряешь: время одного вызова. Значит, засечку делай вокруг каждого вызова, а не вокруг всего цикла, иначе медиану и хвост взять не из чего. Какие часы не прыгают назад?''',
  '''Отсортируй замеры и бери элементы по рангу: для процентиля `ranг = ceil(p * n / 100)`, индекс на единицу меньше. Целочисленное `div_ceil` избавляет от плавающей запятой.''',
  '''Прогрев вызывай до замеров и не записывай. Для чётной выборки медиана это среднее двух средних. `Duration` можно складывать и делить на число.''',
]
why.ru = '''Одно измерение почти бесполезно: на него влияют кэши, планировщик и соседние процессы. Прогрев убирает холодный старт, медиана игнорирует редкие выбросы, p99 показывает хвост, который чувствуют самые невезучие запросы. `Instant` монотонный, а `SystemTime` можно перевести назад, и тогда замер получится отрицательным. Метод ближайшего ранга выбирает реальный замер, а не придуманную середину, поэтому на малой выборке p99 честно равен максимуму.'''

[[exercises]]
name = "perf_q4"
kind = "question"
question.ru = '''Десять замеров функции в миллисекундах: `10, 10, 11, 10, 10, 10, 95, 10, 11, 10`. Какое число честнее всего назвать типичным временем?'''
options.ru = [
  "среднее: около 19,7 мс",
  "максимум: 95 мс",
  "медиану: 10 мс",
  "минимум: 10 мс, потому что остальное шум",
]
answer = [2]
explain.ru = '''Среднее тянет вверх один выброс и описывает время, которого на самом деле нет. Максимум это худший случай, а не типичный. Медиана устойчива к выбросам и показывает, что обычно запуск занимает около 10 мс; хвост (p99, максимум) стоит приводить отдельно. Минимум показывает лучший случай и тоже не типичен.'''
hint.ru = '''Какая статистика не меняется, если один замер из десяти станет в десять раз больше?'''

[[exercises]]
name = "perf9"
style = "bughunt"
hint.ru = [
  '''Запусти `cargo run` и `cargo run --release` и сравни числа. Что в релизе знает компилятор про `checksum` и про то, что её результат никуда не идёт?''',
  '''Чистая функция без побочных эффектов, чей результат выброшен, оптимизатору не нужна. В `std::hint` есть функция, которая «скрывает» значение от оптимизатора.''',
  '''Скрывай и вход, и выход: `black_box(checksum(black_box(data)))`. Вход, чтобы компилятор не вычислил результат заранее или не вынес за цикл, выход, чтобы вычисление нельзя было выбросить.''',
]
why.ru = '''В отладочной сборке оптимизаций нет, поэтому баг не виден, а в `--release` компилятор честно выбрасывает работу, результат которой не нужен. `black_box` не делает ничего, но для оптимизатора это непрозрачный вызов: он не может ни вычислить значение заранее, ни убрать его. Скрывать нужно и входы, и выходы. Любой замер надо проверять на здравый смысл: мегабайт не хешируется за ноль наносекунд.'''

[[exercises]]
name = "perf_q3"
kind = "question"
question.ru = '''Замер функции в `--release` показывает «2 нс на вызов», хотя она проходит по мегабайту данных. Функция чистая, а её результат в замере не используется. Что вероятнее всего произошло?'''
options.ru = [
  "процессор выполняет мегабайт за 2 нс",
  "оптимизатор увидел, что результат не нужен, и выбросил вычисление целиком",
  "Instant округляет время до наносекунд",
  "функция закешировалась после первого вызова",
]
answer = [1]
explain.ru = '''Чистая функция без побочных эффектов с неиспользуемым результатом для компилятора мёртвый код. В отладочной сборке оптимизаций нет, и цифры похожи на правду. Лекарство: `black_box` на вход и на выход, а ещё привычка сверять результат замера со здравым смыслом (мегабайт за пару наносекунд не пройти).'''
hint.ru = '''Что бы ты делал на месте компилятора с результатом, который никто не читает?'''

[[exercises]]
name = "perf10"
style = "todo"
hint.ru = [
  '''FNV-1a идёт по байтам: сначала xor состояния с байтом, потом умножение на простое число с заворотом (`wrapping_mul`). Начальное состояние это константа `OFFSET`.''',
  '''`Hasher::write` может вызываться много раз подряд для одного ключа (составной ключ пишет по полю), поэтому состояние живёт в структуре. `BuildHasher` всего лишь фабрика: на каждый ключ новый хешер.''',
]
why.ru = '''FNV-1a это четыре строки, которые считают хеш быстрее, чем `SipHash`, потому что не стараются быть стойкими. Для счётчиков по внутренним номерам этого хватает, и карта получается быстрее и, что часто не замечают, детерминированной: порядок обхода повторяется от запуска к запуску. Для ключей от пользователя это ловушка (HashDoS): противник подбирает ключи с одинаковым хешем, карта вырождается в список, и сервис встаёт. Поэтому стандартный `RandomState` с секретным ключом на входе из сети лучше оставить.'''

[[exercises]]
name = "perf_q5"
kind = "question"
question.ru = '''Сервис принимает от клиентов JSON-объекты и считает, сколько раз встретился каждый ключ, в `HashMap` с быстрым хешером FNV вместо стандартного. Что может пойти не так?'''
options.ru = [
  "ничего: FNV быстрее SipHash, значит, сервис станет быстрее",
  "противник подберёт ключи с одинаковым хешем, карта вырождается в список, и один запрос съест процессор",
  "карта перестанет принимать строки",
  "порядок обхода карты станет случайным",
]
answer = [1]
explain.ru = '''Стандартный хешер выбран за стойкость: у него случайный секретный ключ, и коллизии заранее не подобрать. Фиксированный хеш известен всем, поэтому атакующий присылает тысячи ключей с одним хешем, и вставки в карту становятся линейными (HashDoS). Быстрый хеш допустим только для ключей, которые выдаёт сам сервис.'''
hint.ru = '''Кто выбирает ключи: сервис или внешний мир? И знает ли внешний мир функцию хеширования?'''

[[exercises]]
name = "perf11"
style = "scratch"
hint.ru = [
  '''Таймер хранит ссылку на журнал, имя и момент старта. Запись единственное, что он делает при уничтожении. Журнал меняется через `&self`, значит, нужна внутренняя изменяемость (в структуре уже лежит `RefCell`).''',
  '''Таймер ставь в начало фазы как локальную переменную (`let _timer = ...`, не `let _ = ...`: от такого имени значение уничтожается сразу). Фазу ограничь блоком, чтобы таймер закончился вместе с ней.''',
  '''`slowest` складывает записи с одинаковым именем и выбирает наибольший итог: удобно собрать итоги в вектор пар и взять `max_by_key`.''',
]
why.ru = '''Объект с `Drop` решает три задачи сразу: не нужно помнить про остановку таймера, остановка происходит при любом выходе из области (ранний `return`, `?`, паника), и вложенные таймеры заканчиваются в правильном порядке сами. Ловушка в имени: `let _ = PhaseTimer::start(..)` уничтожает значение мгновенно, фаза получится нулевой, а `let _timer` держит его до конца блока. Такой таймер и есть самодельный профилировщик: по результатам видно, какая фаза съедает время.'''

[[exercises]]
name = "perf_q6"
kind = "question"
question.ru = '''Таймер фаз записывает время в `Drop`. Какое время запишет первая строка и какое вторая?
```rust
let _ = PhaseTimer::start(&rec, "load");
// ... тяжёлая работа ...
let _timer = PhaseTimer::start(&rec, "parse");
// ... тяжёлая работа ...
```'''
options.ru = [
  "обе записывают полное время работы",
  "первая запишет почти ноль, вторая время до конца области",
  "первая запишет время работы, вторая почти ноль",
  "обе запишут ноль",
]
answer = [1]
explain.ru = '''Подчёркивание без имени (`let _ = ...`) не создаёт переменную, и значение уничтожается сразу в конце оператора: `Drop` срабатывает до «тяжёлой работы». Имя `_timer` держит значение до конца блока, и запись происходит, когда область закончится. Для таймеров, охранников замков и подобного всегда давай имя с подчёркиванием.'''
hint.ru = '''Когда уничтожается значение, которое не присвоили никакой переменной?'''

[[exercises]]
name = "perf_speed_up"
style = "todo"
kind = "project"
quiz = true
locked = ["crates/feed-builder/tests/acceptance.rs"]
hint.ru = [
  '''Сначала измерь: `cargo run --release --example bench` до правок даёт точку отсчёта. Потом читай `build_feed` глазами профилировщика: что происходит на каждый пост, а что на каждый элемент подписок?''',
  '''Три больших проблемы: `contains` по спискам в цикле (замени структуру), клонирование постов в промежуточный вектор (достаточно ссылок) и сортировка вставкой всего видимого, хотя нужны первые `limit`. Отдельно: заголовки собирай только для тех, кто попал в результат, и пиши прямо в заранее выделенную строку.''',
  '''Для первых `limit` из многих есть `select_nth_unstable_by`: он ставит нужный элемент на своё место за линейное время, остальное отбрасывается через `truncate`, а на оставшихся делается обычная сортировка. Подписки и блокировки превращай в `HashSet` один раз до цикла.''',
]
why.ru = '''Тут собрано всё из главы. Квадраты убраны структурами (`HashSet` вместо `contains` по списку, выбор верхушки вместо сортировки вставкой). Копии постов заменены ссылками, заголовки строятся только для карточек страницы, в уже выделенный буфер. Правильный порядок работы: сначала замер (`bench` до правок), потом одно изменение за раз, потом замер после. Тест с числом аллокаций и тест на двухстах тысячах постов защищают результат от случайного возвращения прежнего поведения.'''

[[exercises]]
name = "perf_exam"
style = "scratch"
kind = "project"
