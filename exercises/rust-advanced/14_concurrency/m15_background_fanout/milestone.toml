test_command = ["cargo", "make", "check"]
requires = []
hint.ru = [
"""Начни с пула: `cargo test -p worker-pool`. Пока у src/crates/worker-pool нет Cargo.toml, cargo ругается на весь
воркспейс, потому что маска `src/crates/*` уже видит папку с тестами. Состояние пула это одна структура под одним
`Mutex`: очередь `VecDeque<Box<dyn FnOnce() + Send>>`, сколько заданий работает и закрыт ли пул. Рядом два `Condvar`:
на одном воркеры ждут работу, на другом `wait_idle` ждёт, пока станет пусто. Если тест «четыре задания одновременно»
не встречается, значит задание выполняется, пока воркер держит замок: вынь задание, отпусти guard, потом вызывай.""",
"""Висит `drop` пула? Воркер ждёт работу в `wait_while(.., |s| s.queue.is_empty() && !s.closed)`, и разбудить его
может только `close`: поставь флаг под замком и сделай `notify_all`, потом `join` каждого потока. Паника задания
ловится `panic::catch_unwind(AssertUnwindSafe(job))`, и счётчик работающих уменьшается в любом случае. Для `submit`
заведи `mpsc::channel`: задание отправляет результат, а `JobHandle::join` это `recv`, у которого отправитель пропал
вместе с паникой.""",
"""Рассылка: в `SharedNetwork::publish` возьми замок сети блоком `{ .. }`, внутри `publish` и `audience`, наружу
отдай id поста и список получателей. Задания ставь уже после блока. Если тест с уведомителем, который сам зовёт
`net.profile`, висит, доставка идёт под замком сети: `Mutex` в Rust не реентерабельный и ждёт сам себя. Реестр
уведомителей заверни в `Arc` и клонируй его в каждое задание, `Notification` это `Copy`. Чтобы `inbox` видел всё
опубликованное, перед чтением ящика сделай `pool.wait_idle()`.""",
"""Счётчики: `Arc<Counters>` с двумя `AtomicU64`, `fetch_add(1, Ordering::Relaxed)`. Уведомления удобно считать
уведомителем: структура со счётчиком реализует `Notifier` и кладётся в реестр рядом с ящиком, тогда каждая доставка
посчитана ровно один раз. Кэш профилей: `read()` и `get(&id).cloned()`; при промахе guard кэша уже отпущен, бери
копию `User` через `self.read(..)`, а потом `write()` и `entry(id).or_insert_with(|| Arc::new(user))`. Держать
write-замок кэша, пока ждёшь сеть, нельзя: все попадания встанут за одним промахом.""",
]
story.ru = """У alice тысяча подписчиков, и каждый узнаёт о её посте, а она даже не ждёт: рассылку разносят четыре
воркера твоего собственного пула. `stats` считает посты и уведомления без единого общего замка, а профиль читается
из кэша, даже когда сеть занята."""
