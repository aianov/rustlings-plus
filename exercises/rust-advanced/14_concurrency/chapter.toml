[[exercises]]
name = "conc1"
style = "todo"
hint.ru = '''Запусти поток через `thread::spawn(move || ...)`, а результат забери из `JoinHandle::join()`. Что лежит в `Err`, если поток упал?'''
why.ru = '''`spawn` возвращает `JoinHandle`, `join` отдаёт результат потока или `Err` с тем, чем он упал. Для `map_in_threads` сначала запусти все потоки (собери handle в `Vec`) и только потом делай `join`: иначе потоки пойдут один за другим. В паническом payload лежит `&str` для `panic!("текст")` и `String` для форматирования, поэтому `downcast_ref` пробуют на оба типа.'''

[[exercises]]
name = "conc2"
style = "todo"
hint.ru = [
  '''Что мешает `thread::spawn` взять срез `&[u64]`? А что гарантирует `thread::scope`, чтобы это стало можно?''',
  '''Внутри `thread::scope(|scope| { ... })` вызывай `scope.spawn(...)`. Нарежь данные через `chunks`, а для записи через `chunks_mut`: каждый поток получает свой непересекающийся кусок. Размер куска `len.div_ceil(parts)`, но не меньше 1, иначе `chunks(0)` паникует.''',
  '''Для возврата значений собери `ScopedJoinHandle` в `Vec` и сделай `join` уже после запуска всех, иначе потоки пойдут по очереди. Замыкание `f` передай в потоки по ссылке: `let f = &f;`.''',
]
why.ru = '''Область потоков даёт компилятору гарантию, что ни один поток не переживёт функцию, поэтому он разрешает заимствовать локальные данные. `chunks_mut` отдаёт непересекающиеся `&mut`, и именно поэтому несколько потоков могут писать в один срез без замков: компилятор видит, что кусков не пересечь. `Arc<Mutex<Vec>>` тут был бы лишним и по коду, и по скорости.'''

[[exercises]]
name = "conc_q1"
kind = "question"
question.ru = '''Что произойдёт при сборке?
```rust
let mut total = 0;
thread::scope(|s| {
    s.spawn(|| total += 1);
    s.spawn(|| total += 2);
});
println!("{total}");
```'''
options.ru = [
  "напечатает 3",
  "не соберётся: два замыкания одновременно берут `total` изменяемо",
  "соберётся, итог может оказаться 1, 2 или 3 (гонка данных)",
  "соберётся, но паникнет в одном из потоков",
]
answer = [1]
explain.ru = '''Потоки с областью разрешают заимствовать локальные данные, но правила заимствования остаются: две изменяемые ссылки на одну переменную одновременно запрещены. Компилятор останавливает такой код ещё до запуска, и гонки данных (в смысле Rust) в безопасном коде не бывает. Чтобы считать из двух потоков, нужен `AtomicU32` или `Mutex`.'''
hint.ru = '''Сколько изменяемых ссылок на `total` живёт одновременно?'''

[[exercises]]
name = "conc3"
style = "todo"
hint.ru = [
  '''`Send` значит «можно переехать в другой поток», `Sync` значит «можно показывать `&T` нескольким потокам одновременно». Второе то же, что `&T: Send`.''',
  '''Правила выводятся из полей. `Rc` и сырые указатели не `Send` и не `Sync`. `Cell` и `RefCell` `Send`, но не `Sync` (внутри нет замка). `Arc<T>` `Send` и `Sync` только если `T` одновременно `Send` и `Sync`.''',
  '''`Mutex<T>` делает `Sync` из любого `T: Send`. `MutexGuard` нельзя отправить в другой поток (замок должен отпускать тот же поток, что его взял), но `&MutexGuard` показывать можно, если `T: Sync`. `&T` это `Send` только когда `T: Sync`.''',
]
why.ru = '''Таблица не заучивается, а выводится: `Arc<T>` делится между потоками, поэтому требует от `T` и того и другого; `Mutex` превращает «только по одному» в `Sync`, поэтому ему хватает `T: Send`; `Cell` без замка, поэтому не `Sync`. Пара «`Arc<Cell>`» и «`Mutex<Cell>`» хорошо показывает, где выручает замок, а где нет.'''

[[exercises]]
name = "conc_q2"
kind = "question"
question.ru = '''Какие из этих типов можно положить в `Arc` и передать в другой поток? Нужно, чтобы `Arc<T>` был `Send`. Выбери все.'''
options.ru = [
  "`Cell<u32>`",
  "`Mutex<Cell<u32>>`",
  "`RefCell<String>`",
  "`Mutex<Vec<String>>`",
  "`Rc<u32>`",
]
answer = [1, 3]
explain.ru = '''`Arc<T>` отправляется между потоками, только если `T: Send + Sync`. `Cell` и `RefCell` не `Sync` (под `&` их можно менять без замка), `Rc` не `Send`. А `Mutex<T>` `Sync` для любого `T: Send`, поэтому даже `Mutex<Cell<u32>>` проходит: замок превращает «только один поток за раз» в разрешение делить.'''
hint.ru = '''Для `Arc<T>` нужны оба маркера у `T`. Какие из типов не `Sync`?'''

[[exercises]]
name = "conc4"
style = "fix"
hint.ru = [
  '''Прочитай ошибку целиком: она называет тип и маркер (`Rc<...>` cannot be sent between threads safely). Какой тип заменяет `Rc` в потоках и какой `RefCell`?''',
  '''`Rc` меняется на `Arc`, а внутреннюю изменяемость даёт `Mutex` (вместо `RefCell`) или атомик (вместо `Cell` с числом). Обрати внимание на конец функции: `Rc::try_unwrap` теперь должен стать `Arc::try_unwrap`, а `into_inner` у `Mutex` возвращает `Result`.''',
  '''Журнал: `Arc<Mutex<Vec<String>>>`, запись через `log.lock().unwrap().push(..)`. Счётчик: `Arc<AtomicU64>` и `fetch_add`.''',
]
why.ru = '''Компилятор ловит ошибку ещё до запуска: `Rc` считает ссылки без синхронизации, и два потока легко испортят счётчик. Замена всегда парная: `Rc` на `Arc`, а `RefCell`/`Cell` на `Mutex` или атомик. Для простого числа атомик дешевле замка и не может отравиться. `try_unwrap` после `join` безопасен: все остальные клоны уже умерли вместе с потоками.'''

[[exercises]]
name = "conc5"
style = "todo"
hint.ru = [
  '''Цикл `for x in rx` заканчивается только когда закрыты все `Sender`. Сколько их у тебя живо к моменту, когда цикл начинается?''',
  '''Каждому потоку отдай `tx.clone()`, а оригинал сделай `drop(tx)` до цикла. Для заданий: `Box<dyn FnOnce() -> u32 + Send>` вызывается как `job()`; рабочий поток читает `for job in job_rx`.''',
  '''`rx.try_iter()` не ждёт. `rx.recv_timeout(d)` возвращает `RecvTimeoutError::{Timeout, Disconnected}`, и это разные ответы.''',
]
why.ru = '''Канал живёт, пока жив хотя бы один `Sender`, и оригинальный `tx` в функции это такой же отправитель, как и клоны в потоках. Поэтому его роняют вручную. Задания в очереди это просто `Box<dyn FnOnce + Send>`: тип стирает конкретное замыкание, а `Send` разрешает ему переехать в другой поток. Таймаут и закрытие это разные события, и код вызова решает, ждать ли ещё.'''

[[exercises]]
name = "conc_q3"
kind = "question"
question.ru = '''Что сделает программа?
```rust
let (tx, rx) = mpsc::channel();
for i in 0..3 {
    let tx = tx.clone();
    thread::spawn(move || tx.send(i).unwrap());
}
for value in rx {
    println!("{value}");
}
println!("готово");
```'''
options.ru = [
  "напечатает 0, 1, 2 в каком-то порядке и «готово»",
  "напечатает 0, 1, 2, а «готово» никогда: цикл ждёт дальше",
  "паникует: `send` на закрытый канал",
  "не напечатает ничего",
]
answer = [1]
explain.ru = '''Цикл `for value in rx` заканчивается, когда закрыты все отправители. Три клона в потоках умерли, но оригинальный `tx` живёт в главном потоке до конца функции, и канал открыт. Лечится `drop(tx)` перед циклом (или перемещением оригинала в последний поток).'''
hint.ru = '''Сколько отправителей живо к моменту, когда цикл начинает ждать?'''

[[exercises]]
name = "conc6"
style = "todo"
hint.ru = [
  '''Замок держится, пока жив guard (результат `lock()`). Когда он умирает в твоей функции? Что происходит, если `make()` вызвать, пока guard жив, а `make` снова просит этот замок?''',
  '''Сначала `let line = make();`, потом короткое `self.lines.lock().unwrap().push(line);`. Для отравления: `lock()` возвращает `Err(PoisonError)`, внутри которого всё равно лежит guard.''',
  '''`m.lock().unwrap_or_else(PoisonError::into_inner)` достаёт guard из ошибки. Дальше работай с ним как обычно.''',
]
why.ru = '''Критическая секция должна содержать только то, что обязано быть под замком: сам доступ к данным. Всё остальное (форматирование, вызовы чужого кода, ввод-вывод) делают снаружи, иначе, как минимум, остальные потоки ждут зря, а как максимум чужой код возьмёт тот же замок и получится самоблокировка. Отравление это не потеря данных, а сигнал «кто-то упал на середине». Если инвариант данных простой, как у списка, его можно просто продолжать использовать.'''

[[exercises]]
name = "conc_q4"
kind = "question"
question.ru = '''Что будет?
```rust
let m = Mutex::new(vec![1, 2, 3]);
if let Some(last) = m.lock().unwrap().last() {
    m.lock().unwrap().push(*last + 1);
}
println!("{:?}", m.lock().unwrap());
```'''
options.ru = [
  "`[1, 2, 3, 4]`",
  "программа зависнет в `push`",
  "паника: замок уже взят, `lock` вернёт ошибку",
  "не соберётся: `last` заимствует `m`",
]
answer = [1]
explain.ru = '''Охранник замка из условия `if let` это временное значение, и оно живёт до конца блока. Пока `last` используется внутри, замок всё ещё удерживается, а второй `lock` в том же потоке ждёт сам себя. Правильно: `let next = m.lock().unwrap().last().map(|last| last + 1);` отдельной строкой, и только потом `push` под новым захватом.'''
hint.ru = '''Когда умирает временный `MutexGuard` из условия `if let`?'''

[[exercises]]
name = "conc7"
style = "fix"
hint.ru = [
  '''Запусти тесты и посмотри, какой именно зависает. Кто держит замок в тот момент, когда `reserve` зовёт `available`?''',
  '''Метод, который уже держит замок, не должен звать публичный метод, берущий тот же замок. Работай с `stock`, который у тебя уже есть.''',
  '''В `reserve` возьми `have` прямо из `stock.get(item)`. В `restock_report` посчитай `stock.values().sum()` по тому же guard. Публичные `available` и `total` остаются как были.''',
]
why.ru = '''Мьютекс нерекурсивный: поток, который уже держит замок, при повторном `lock` ждёт сам себя. Правило такое: публичные методы берут замок, а внутри под замком работают с уже взятыми данными. Если логику хочется делить между методами, выноси её в приватные функции от `&HashMap`, а не от `&self`. Замок не защищает от логических повторов, он только требует, чтобы вход под него был один.'''

[[exercises]]
name = "conc8"
style = "fix"
hint.ru = [
  '''Разбери по шагам, что делают два потока: Аня→Борис и Борис→Аня. Какой замок каждый держит и какого ждёт? Нарисуй стрелки.''',
  '''Дедлок возникает, когда замки берут в разном порядке. Договорись об одном порядке для всех: например, по возрастанию номера счёта, независимо от того, кто отправитель.''',
  '''Возьми меньший номер первым, потом больший, а какой из них отправитель, определи уже под замками. Случай `from == to` обработай отдельно: там один замок, а не два.''',
]
why.ru = '''Дедлок невозможен, если все потоки берут замки в одном и том же порядке: тогда цикла ожидания просто не бывает. Порядок не обязан быть «правильным», он обязан быть общим. Номер счёта для этого подходит идеально. Отдельная ловушка: `from == to` в такой схеме берёт один и тот же замок дважды, то есть воспроизводит самоблокировку из предыдущей задачи.'''

[[exercises]]
name = "conc_q5"
kind = "question"
question.ru = '''Функция `both(first, second)` берёт замок `first`, потом `second`, и держит оба. Четыре потока запускают одновременно:
```
A: both(&m1, &m2)
B: both(&m2, &m3)
C: both(&m3, &m1)
D: both(&m1, &m3)
```
Какие наборы потоков могут зависнуть навсегда, если запустить именно их? Выбери все.'''
options.ru = [
  "только A и B",
  "A, B и C вместе",
  "A и D",
  "C и D",
]
answer = [1, 3]
explain.ru = '''Зависание возможно, когда в графе ожиданий есть цикл. A, B, C замыкают круг m1→m2→m3→m1. C и D берут одну и ту же пару в разном порядке (m3→m1 и m1→m3), это самый короткий цикл. A и B, A и D выстраиваются в цепочку без возврата: кто-то всегда сможет закончить. Общий порядок замков (по номеру) убирает все циклы сразу.'''
hint.ru = '''Нарисуй стрелки «держит → ждёт» и ищи замкнутый круг.'''

[[exercises]]
name = "conc9"
style = "bughunt"
hint.ru = [
  '''Два потока приходят с одним логином одновременно. Выпиши, в каком порядке они могут пройти шаги «проверил», «проверил», «вставил», «вставил». Что видит второй?''',
  '''Проверка и вставка должны происходить под одним и тем же захватом: `let mut users = lock(); if users.contains_key(..) {..} users.insert(..)`. Но медленная `validate` здесь не нужна, пока замок не взят.''',
  '''Порядок: сначала `validate` без замка, потом один захват, внутри него `contains_key`, расчёт id и `insert`. Одна `entry`-операция тоже подойдёт.''',
]
why.ru = '''Гонка «проверил, потом сделал» (check-then-act) не исчезает от того, что каждый шаг сам по себе под замком: исчезает она, только если оба шага вместе под одним. При этом всё лишнее (медленная проверка формата) держат снаружи, иначе вся регистрация идёт по одному. Проверка занятости дублировать до замка не надо: она всё равно могла бы устареть.'''

[[exercises]]
name = "conc10"
style = "fix"
hint.ru = [
  '''Какие замки держит поток в строке с `write()`? Чтение отпущено или оно ещё живо?''',
  '''Нужно отпустить чтение до записи: охранник живёт до конца своей области, а затеняющий `let` его не убивает. Но после взятия записи кэш уже могли заполнить другие, так что смотри в него ещё раз.''',
  '''Порядок: `read` (в отдельном выражении, чтобы guard умер), при промахе `write`, внутри снова `get`, и только потом загрузка и вставка.''',
]
why.ru = '''Из читающего замка в пишущий нельзя «подняться»: пишущий ждёт ухода всех читателей, включая тебя. Поэтому читающий guard отпускают, берут запись и проверяют условие заново, ведь пока ты ждал, кто-то мог вставить то же самое (double-checked locking). Без второй проверки загрузчик вызывается несколько раз, и в реальной жизни это лишние походы в базу.'''

[[exercises]]
name = "conc11"
style = "todo"
hint.ru = [
  '''`Condvar` всегда работает в паре с `Mutex`: `wait` отпускает замок и засыпает, а проснувшись, берёт его обратно. Какое условие тебе нужно ждать в каждом случае?''',
  '''Самый короткий вид: `let guard = cv.wait_while(mutex.lock().unwrap(), |state| <ещё ждём>).unwrap();`. Условие говорит, когда НЕ пора просыпаться.''',
  '''Для ворот `notify_all` (ждут многие), для ящика хватит `notify_one`. С таймаутом: `wait_timeout_while` возвращает кортеж `(guard, результат)`.''',
]
why.ru = '''Состояние (флаг, очередь) живёт под мьютексом, а `Condvar` только будит: поэтому условие всегда проверяется заново после пробуждения, и `wait_while` делает это за тебя. У ворот `notify_all`, потому что освободиться должны все. В ящике достаточно `notify_one`: одно сообщение нужно одному потребителю. Спать с `sleep` в цикле или жечь процессор не нужно, система сама разбудит поток.'''

[[exercises]]
name = "conc12"
style = "fix"
hint.ru = [
  '''Для `Signal` представь, что `notify` вызвали на микросекунду раньше `wait`. Где в структуре запомнено, что сигнал был?''',
  '''`Condvar` ничего не помнит. Состояние должно лежать в мьютексе: булев флаг, который выставляет `notify` и проверяет `wait`. Ждать надо, пока флаг не поднят.''',
  '''Для `Queue`: после пробуждения очереди может уже не быть, потому что другой потребитель успел раньше. Условие надо проверять заново в цикле, поэтому `while items.is_empty() { items = cv.wait(items).unwrap(); }`.''',
]
why.ru = '''Уведомление не копится: `Condvar` будит тех, кто спит прямо сейчас, а опоздавшим не достаётся ничего. Поэтому событие записывают в состояние под замком, и ждущий смотрит на состояние, а не на сам факт пробуждения. Так же `if` вместо `while`: между уведомлением и моментом, когда поток снова взял замок, чужой поток мог всё забрать. Есть ещё ложные пробуждения, которые случаются без всякого `notify`. Правило одно: условие всегда в цикле.'''

[[exercises]]
name = "conc_q6"
kind = "question"
question.ru = '''Очередь потребляют два потока. Каждый делает так:
```rust
let mut q = lock.lock().unwrap();
if q.is_empty() {
    q = cv.wait(q).unwrap();
}
let job = q.pop_front().unwrap();
```
В каких ситуациях `unwrap` на последней строке может запаниковать? Выбери все.'''
options.ru = [
  "оба потребителя проснулись от одного `notify_all` после одного `push`",
  "поток проснулся сам, без `notify` (ложное пробуждение)",
  "очередь уже непуста, когда потребитель пришёл",
  "`notify_one` случился до того, как потребитель начал ждать",
]
answer = [0, 1]
explain.ru = '''После пробуждения нет гарантии, что условие всё ещё верно: другой поток мог уже забрать значение, а ложные пробуждения бывают без всякого `notify`. Поэтому проверку ставят в цикл `while q.is_empty()`. Вариант с опоздавшим `notify_one` ломает иначе: потребитель уснёт навсегда, но не запаникует. Непустая очередь сразу работает правильно.'''
hint.ru = '''Что гарантирует `wait` о состоянии очереди в момент, когда поток снова взял замок?'''

[[exercises]]
name = "conc13"
style = "todo"
hint.ru = [
  '''Атомики меняют число одной неделимой операцией. Какой метод прибавляет и возвращает старое значение? Какой берёт максимум?''',
  '''`fetch_add` возвращает значение ДО прибавления, поэтому уникальный номер, начинающийся с 1, это `fetch_add(1, ..) + 1`. `fetch_max(now, ..)` обновляет пик без гонки. Для всех счётчиков тут достаточно `Ordering::Relaxed`.''',
  '''Для `Visit` реализуй `Drop`, в нём `fetch_sub(1, ..)` у `gauge.current`. Флаг остановки: `store(true, ..)` и `load(..)`.''',
]
why.ru = '''Атомик это одна неделимая операция над числом, и для независимых счётчиков порядка относительно других данных не нужно, поэтому достаточно `Relaxed`. `fetch_add` возвращает старое значение, и это даёт уникальные номера бесплатно. Пик датчика берётся через `fetch_max`, а не «прочитал, сравнил, записал»: такая связка теряет обновления (в следующей задаче главы это видно). Уход посетителя в `Drop` гарантирует, что счётчик убывает даже при ранних выходах и паниках.'''

[[exercises]]
name = "conc14"
style = "bughunt"
hint.ru = [
  '''`load` и `store` по отдельности атомарны, но между ними есть дыра. Что может случиться в этой дыре с двумя потоками?''',
  '''Для счётчика есть `fetch_add`, для максимума `fetch_max`. А для «увеличить, только если меньше лимита» готовой операции нет: нужна проверка и запись как одна операция.''',
  '''`compare_exchange(old, new, ..)` пишет, только если значение всё ещё равно `old`, иначе возвращает `Err` с актуальным. Оберни в цикл, либо возьми готовый `fetch_update` с замыканием, которое возвращает `Some(новое)` или `None`.''',
]
why.ru = '''Прочитать, сосчитать, записать это три шага, и между ними всегда может встать чужой поток. Для типичных случаев есть готовые неделимые операции: `fetch_add`, `fetch_max`. Для произвольного условия (счётчик с лимитом) нужен цикл с `compare_exchange`: «запиши, только если никто не успел изменить», а `fetch_update` как раз упаковывает этот цикл. Ошибка не видна на одном потоке, поэтому такие тесты запускают много потоков и много повторов.'''

[[exercises]]
name = "conc_q7"
kind = "question"
question.ru = '''Два потока по 1000 раз делают с общим `AtomicU32` (начало 0) вот это:
```rust
let v = HITS.load(Ordering::SeqCst);
HITS.store(v + 1, Ordering::SeqCst);
```
Что можно сказать об итоге после `join` обоих потоков?'''
options.ru = [
  "всегда ровно 2000: каждая операция атомарна и порядок строгий",
  "от 1000 до 2000",
  "любое число от 2 до 2000, гарантии нет",
  "программа зависнет",
]
answer = [2]
explain.ru = '''Атомарна каждая операция по отдельности, но связка «прочитать, прибавить, записать» нет: пока один поток держит старое `v`, другой успевает записать новое, и затем первый затирает его. Самый строгий `SeqCst` тут не помогает, дело не в видимости, а в разрыве между двумя шагами. Нужен `fetch_add`.'''
hint.ru = '''Что делает второй поток, пока первый держит прочитанное `v`?'''

[[exercises]]
name = "conc15"
style = "todo"
hint.ru = [
  '''Что значит «видно после `Acquire`»? Читатель, увидевший значение, записанное через `Release`, увидит и всё, что писали ДО него в том потоке.''',
  '''Три числа пишутся `Relaxed`, а флаг `store(true, Release)`. Читатель делает `load(Acquire)` по флагу, и только потом читает числа через `Relaxed`.''',
  '''Счётчик посещений никем не используется как сигнал, поэтому `fetch_add(1, Relaxed)` и `load(Relaxed)`. `SeqCst` тут не нужен, он дороже и ничего не добавляет.''',
]
why.ru = '''Release и Acquire работают парой на одной и той же переменной: запись с Release «выпускает» всё, что поток записал до неё, а чтение с Acquire «забирает» это. Данные при этом можно писать с Relaxed, они публикуются вместе с флагом. Счётчику, который ни с чем не связан, порядок не нужен. Сильнее всего ошибка заметна на слабых процессорах (ARM): на x86 неверный порядок часто «работает», пока не сменят железо, поэтому тест дополнительно смотрит и на сам код.'''

[[exercises]]
name = "conc16"
style = "fix"
hint.ru = [
  '''Прочитай ошибку компилятора: она называет строку. Какие значения `Ordering` допустимы для неудачи у `compare_exchange`?''',
  '''Ордеринг неудачи не может быть `Release` и `AcqRel`: при неудаче ничего не записывается, значит, и выпускать нечего. Нужно что-то из `Relaxed`, `Acquire`, `SeqCst`. Обычно достаточно `Relaxed`.''',
  '''Для успеха нужен `Acquire` (получаем право и хотим видеть чужие подготовленные данные). Флаг готовности: `store(.., Release)` и `load(Acquire)`.''',
]
why.ru = '''Ordering это не «громкость», а договор о видимости. Release что-то выпускает, поэтому у чтения он не нужен, а у неудачного обмена нечего выпускать. Acquire подбирает выпущенное, поэтому он нужен тому, кто читает или забирает право. Данные можно писать Relaxed, пока их публикует парный флаг. Такие ошибки не падают в тестах на x86 и ломаются на слабых процессорах, поэтому первое правило: если не уверен, бери пару Release/Acquire для публикации и Relaxed для счётчиков, а `SeqCst` приберегай для случаев, когда нужен общий порядок.'''

[[exercises]]
name = "conc_q8"
kind = "question"
question.ru = '''В каких случаях `Relaxed` для флага или счётчика недостаточно? Выбери все.'''
options.ru = [
  "счётчик запросов, который читают в конце, после `join` всех потоков",
  "флаг `ready`, после которого читатель берёт данные, записанные до флага",
  "приблизительная статистика, которую показывают на дашборде",
  "флаг `stop` («пора выходить»), других данных вместе с ним не передают",
]
answer = [1]
explain.ru = '''Когда флаг сопровождает данные (опубликовал данные, поднял флаг), нужна пара Release/Acquire: иначе читатель увидит флаг раньше данных. Счётчик после `join` читается с полной синхронизацией, дашборду допустим слегка устаревший ответ, а флаг остановки сам несёт всю информацию: что бы ни происходило в остальной памяти, ему важен только он.'''
hint.ru = '''Передаёт ли флаг какие-то данные, записанные в другой памяти?'''

[[exercises]]
name = "conc_thread_pool"
style = "scratch"
kind = "project"
locked = ["crates/worker-pool/tests/acceptance.rs"]
hint.ru = [
  '''Начни со структуры: общее состояние под `Mutex` (очередь, число выполняющихся, флаг закрытия) плюс два `Condvar`: один будит рабочих, другой будит `wait_idle`. Всё это в `Arc`.''',
  '''Рабочий: цикл «подожди, пока очередь непуста или пул закрыт; возьми задание; сделай `running += 1`; отпусти замок; выполни под `catch_unwind`; возьми замок, `running -= 1`, если всё пусто, `notify_all` на idle».''',
  '''`submit` строится поверх `execute`: создай `mpsc::channel`, в задание положи `tx` и `tx.send(job())`. Если задание упало, `tx` умирает без отправки, и `recv` у хэндла возвращает `Err`: это и есть `Panicked`. `Drop`: `close()`, затем `join` всех потоков.''',
]
why.ru = '''Пул держится на одном состоянии под замком и двух условиях. Рабочие ждут «есть задание или закрыто», `wait_idle` ждёт «пусто и никто не работает»: два условия, два `Condvar`, оба проверяются в `wait_while`. Задание выполняется вне замка, иначе пул превратился бы в однопоточный. `catch_unwind` не даёт панике убить рабочего, а канал результата сам превращает упавшее задание в `Err`. Остановка это закрытие очереди и `join`: принятое доделывается, новое отвергается.'''

[[exercises]]
name = "conc_q9"
kind = "question"
question.ru = '''В пуле из двух рабочих нет защиты от паники в задании: рабочий просто вызывает `job()`. Приходят два задания, которые паникуют, и затем пять обычных. Что будет с обычными?'''
options.ru = [
  "выполнятся: пул сам запустит новых рабочих",
  "будут лежать в очереди, и `wait_idle` не вернётся никогда: оба рабочих мертвы",
  "выполнятся в потоке, который вызвал `execute`",
  "выполнятся после перезапуска пула",
]
answer = [1]
explain.ru = '''Паника в потоке завершает его, а пул сам рабочих не пересоздаёт. После двух паник живых рабочих нет, очередь никто не разбирает. Поэтому каждое задание запускают под `catch_unwind` (или пересоздают рабочего), а результат паники превращают в ошибку для того, кто ждёт `join`.'''
hint.ru = '''Сколько рабочих остаётся живыми после двух паник?'''

[[exercises]]
name = "conc17"
style = "fix"
hint.ru = [
  '''Два теста, две разные беды. Прочитай, какой висит и какой говорит про «одновременно». Рабочий в цикле ждёт задание из `Receiver`: когда `recv` вернёт `Err`?''',
  '''`recv` возвращает `Err`, только когда закрыты ВСЕ отправители. В `MiniPool` один отправитель живёт в самой структуре, пока она жива. В `Drop` его нужно уронить до `join`, а для этого он должен лежать в `Option` (`take`).''',
  '''Вторая беда: `while let Ok(job) = receiver.lock().unwrap().recv() { job(); }`. Временное значение из условия (guard замка) живёт до конца тела цикла. Достань задание отдельным `let job = ...;`, чтобы guard умер на точке с запятой, и вызывай его уже без замка.''',
]
why.ru = '''Пул останавливают закрытием очереди: рабочие дочитывают оставшееся, видят `Err` и выходят, поэтому `Drop` сначала роняет отправителя, потом `join`. А «guard живёт в условии `while let`» это та же ловушка, что `match mutex.lock().unwrap().get(..)`: временное значение в скобках выживает до конца блока. Замок на приёмнике нужен только на время `recv`, а выполнение задания идёт уже без него.'''

[[exercises]]
name = "conc_q10"
kind = "question"
question.ru = '''Рабочие берут задания из общей очереди двумя способами:
```rust
// способ 1
while let Some(job) = queue.lock().unwrap().pop_front() {
    job();
}
// способ 2
loop {
    let job = queue.lock().unwrap().pop_front();
    match job {
        Some(job) => job(),
        None => break,
    }
}
```
В чём разница при четырёх рабочих?'''
options.ru = [
  "никакой",
  "в способе 1 задания выполняются по одному на всех: замок держится на время `job()`",
  "в способе 2 задания выполняются по одному",
  "способ 1 вызовет дедлок при первом же задании",
]
answer = [1]
explain.ru = '''Временное значение в условии `while let` (охранник замка) живёт до конца тела цикла, то есть всё время работы задания. Остальные рабочие стоят на замке, и четыре потока превращаются в один. В способе 2 охранник умирает на точке с запятой, и задание бежит без замка. Привычка: достать значение отдельным `let`, а уже потом работать с ним.'''
hint.ru = '''До какого места живёт охранник в условии `while let`?'''

[[exercises]]
name = "conc_fanout"
style = "scratch"
kind = "project"
quiz = true
locked = ["crates/fanout/tests/acceptance.rs"]
hint.ru = [
  '''Разложи по замкам: реестр пользователей и логинов (проверка логина и выдача id внутри одного захвата), кэш профилей, список друзей каждого пользователя, счётчики. Что из этого должно быть под общим замком, а что можно разделить?''',
  '''Профиль: сначала `read`, при промахе загрузи из хранилища БЕЗ замка, потом `write` и `entry().or_insert`: так медленная загрузка не стопорит других, а все получат один `Arc`. `befriend`: достань оба `Arc<User>` из реестра (замок реестра уже отпущен), потом бери замки друзей в порядке возрастания id.''',
  '''`publish`: список получателей скопируй под коротким захватом и отпусти замок, потом ставь задания в пул; в каждое задание клонируй `Arc` счётчиков и sink. `shutdown` это `pool.close()`, `pool.wait_idle()`, `stats()`.''',
]
why.ru = '''Здесь собрано всё из главы. Проверка и вставка логина идут под одним захватом (иначе два одинаковых логина), медленная загрузка профиля идёт вне замка с повторной проверкой при записи, а пара замков друзей берётся в порядке id, поэтому встречные `befriend` не блокируют друг друга. Счётчики атомарные, потому что им не нужна согласованность с остальным состоянием. Пул получает копию данных, а не ссылки на замки, поэтому рабочие никогда не держат замки сервиса.'''

