<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Потеря обновления и замок</title>
<style>
:root{--bg:#fafaf7;--fg:#1d1d1b;--mut:#6b6b66;--card:#fff;--line:#c9c7bd;--acc:#c2410c;--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;--warn:#a16207;--warnbg:#fef9c3;--btn:#1d1d1b;--btnfg:#fff;--hot:#fff1e6}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--fg:#ecebe6;--mut:#9a9a92;--card:#201f1d;--line:#46443f;--acc:#fb923c;--ok:#4ade80;--okbg:#14301d;--bad:#f87171;--badbg:#3a1a1a;--warn:#facc15;--warnbg:#3a3312;--btn:#ecebe6;--btnfg:#161614;--hot:#33241a}}
*{box-sizing:border-box}
body{margin:0;padding:20px;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 14px}
.panel{max-width:860px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;min-height:150px}
.row{display:flex;gap:10px;align-items:center;font:13px ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--line);border-radius:8px;padding:7px 10px;margin:6px 0}
.row.ok{border-color:var(--ok);background:var(--okbg)}
.row.no{border-color:var(--bad);background:var(--badbg);text-decoration:line-through;opacity:.75}
.row.hot{border-color:var(--warn);background:var(--warnbg)}
.row .tag{margin-left:auto;font:12px system-ui,sans-serif;color:var(--mut);text-decoration:none}
.box{display:inline-block;font:13px ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--line);border-radius:8px;padding:8px 12px;margin:4px 6px 4px 0;vertical-align:top}
.box.ok{border-color:var(--ok);background:var(--okbg)}
.box.hot{border-color:var(--warn);background:var(--warnbg)}
.box.no{border-color:var(--bad);background:var(--badbg)}
.box small{display:block;color:var(--mut);font:12px system-ui,sans-serif}
.arrow{display:inline-block;margin:0 4px;color:var(--mut);font-size:18px;vertical-align:middle}
.note{margin:12px 0;padding:12px 14px;border-left:4px solid var(--acc);background:var(--card);border-radius:0 8px 8px 0;min-height:76px;max-width:860px}
.bar2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:860px}
button{font:inherit;padding:7px 14px;border-radius:8px;border:0;background:var(--btn);color:var(--btnfg);cursor:pointer}
button.alt{background:transparent;color:var(--fg);border:1px solid var(--line)}
button:disabled{opacity:.4;cursor:default}
.cnt{color:var(--mut);margin-left:auto}
</style>
</head>
<body>
<h1>Потеря обновления и замок</h1>
<p class="sub">Два потока, одна переменная: что происходит без замка и с ним</p>
<div class="panel" id="panel"></div>
<div class="note" id="note"></div>
<div class="bar2">
  <button id="step">Шаг</button>
  <button id="play" class="alt">Играть</button>
  <button id="reset" class="alt">Сначала</button>
  <span class="cnt" id="cnt"></span>
</div>
<script>
const steps=[{"p": "<div style=\"margin:8px 0 10px\"><span class=\"box ok\" style=\"margin:0\">total = 0</span></div><div style=\"display:flex;gap:6px;align-items:center;margin:6px 0\"><b style=\"width:90px\">поток A</b></div><div style=\"display:flex;gap:6px;align-items:center;margin:6px 0\"><b style=\"width:90px\">поток B</b></div>", "n": "Два потока прибавляют единицу к общей переменной total. Начало: total = 0. Оба сделают «прочитал, прибавил, записал»."}, {"p": "<div style=\"margin:8px 0 10px\"><span class=\"box ok\" style=\"margin:0\">total = 0</span></div><div style=\"display:flex;gap:6px;align-items:center;margin:6px 0\"><b style=\"width:90px\">поток A</b><div class=\"box hot\" style=\"margin:0\">читает 0</div></div><div style=\"display:flex;gap:6px;align-items:center;margin:6px 0\"><b style=\"width:90px\">поток B</b></div>", "n": "Поток A прочитал total и держит в руках 0."}, {"p": "<div style=\"margin:8px 0 10px\"><span class=\"box ok\" style=\"margin:0\">total = 0</span></div><div style=\"display:flex;gap:6px;align-items:center;margin:6px 0\"><b style=\"width:90px\">поток A</b><div class=\"box hot\" style=\"margin:0\">читает 0</div></div><div style=\"display:flex;gap:6px;align-items:center;margin:6px 0\"><b style=\"width:90px\">поток B</b><div class=\"box hot\" style=\"margin:0\">читает 0</div></div>", "n": "Поток B успел прочитать тот же 0, пока A ещё ничего не записал. Между чтением и записью дыра, и именно в неё попадает второй поток."}, {"p": "<div style=\"margin:8px 0 10px\"><span class=\"box ok\" style=\"margin:0\">total = 1</span></div><div style=\"display:flex;gap:6px;align-items:center;margin:6px 0\"><b style=\"width:90px\">поток A</b><div class=\"box hot\" style=\"margin:0\">читает 0</div><div class=\"box ok\" style=\"margin:0\">пишет 1</div></div><div style=\"display:flex;gap:6px;align-items:center;margin:6px 0\"><b style=\"width:90px\">поток B</b><div class=\"box hot\" style=\"margin:0\">читает 0</div></div>", "n": "A записал 1. Всё хорошо, но B об этом не знает."}, {"p": "<div style=\"margin:8px 0 10px\"><span class=\"box no\" style=\"margin:0\">total = 1</span></div><div style=\"display:flex;gap:6px;align-items:center;margin:6px 0\"><b style=\"width:90px\">поток A</b><div class=\"box hot\" style=\"margin:0\">читает 0</div><div class=\"box ok\" style=\"margin:0\">пишет 1</div></div><div style=\"display:flex;gap:6px;align-items:center;margin:6px 0\"><b style=\"width:90px\">поток B</b><div class=\"box hot\" style=\"margin:0\">читает 0</div><div class=\"box no\" style=\"margin:0\">пишет 1</div></div>", "n": "B записал свои 0 + 1 = 1 поверх. Два прибавления, а итог 1: одно обновление потеряно. Тест на одном потоке этого не покажет."}, {"p": "<div style=\"margin:8px 0 10px\"><span class=\"box ok\" style=\"margin:0\">total = 0</span></div><div style=\"display:flex;gap:6px;align-items:center;margin:6px 0\"><b style=\"width:90px\">поток A</b><div class=\"box ok\" style=\"margin:0\">lock</div></div><div style=\"display:flex;gap:6px;align-items:center;margin:6px 0\"><b style=\"width:90px\">поток B</b></div>", "n": "С замком (Mutex) всё иначе. A берёт замок, и теперь внутри только он."}, {"p": "<div style=\"margin:8px 0 10px\"><span class=\"box ok\" style=\"margin:0\">total = 0</span></div><div style=\"display:flex;gap:6px;align-items:center;margin:6px 0\"><b style=\"width:90px\">поток A</b><div class=\"box ok\" style=\"margin:0\">lock</div><div class=\"box hot\" style=\"margin:0\">читает 0</div></div><div style=\"display:flex;gap:6px;align-items:center;margin:6px 0\"><b style=\"width:90px\">поток B</b><div class=\"box no\" style=\"margin:0\">ждёт lock</div></div>", "n": "B тоже хочет внутрь и становится в очередь. Ждёт не процессор, а замок: поток спит, пока его не разбудят."}, {"p": "<div style=\"margin:8px 0 10px\"><span class=\"box ok\" style=\"margin:0\">total = 1</span></div><div style=\"display:flex;gap:6px;align-items:center;margin:6px 0\"><b style=\"width:90px\">поток A</b><div class=\"box ok\" style=\"margin:0\">lock</div><div class=\"box hot\" style=\"margin:0\">читает 0</div><div class=\"box ok\" style=\"margin:0\">пишет 1</div><div class=\"box ok\" style=\"margin:0\">unlock</div></div><div style=\"display:flex;gap:6px;align-items:center;margin:6px 0\"><b style=\"width:90px\">поток B</b><div class=\"box no\" style=\"margin:0\">ждёт lock</div></div>", "n": "A закончил и отпустил замок. Критическая секция должна быть короткой: пока A внутри, B стоит."}, {"p": "<div style=\"margin:8px 0 10px\"><span class=\"box ok\" style=\"margin:0\">total = 2</span></div><div style=\"display:flex;gap:6px;align-items:center;margin:6px 0\"><b style=\"width:90px\">поток A</b><div class=\"box ok\" style=\"margin:0\">lock</div><div class=\"box hot\" style=\"margin:0\">читает 0</div><div class=\"box ok\" style=\"margin:0\">пишет 1</div><div class=\"box ok\" style=\"margin:0\">unlock</div></div><div style=\"display:flex;gap:6px;align-items:center;margin:6px 0\"><b style=\"width:90px\">поток B</b><div class=\"box no\" style=\"margin:0\">ждёт lock</div><div class=\"box ok\" style=\"margin:0\">lock</div><div class=\"box hot\" style=\"margin:0\">читает 1</div><div class=\"box ok\" style=\"margin:0\">пишет 2</div><div class=\"box ok\" style=\"margin:0\">unlock</div></div>", "n": "B вошёл, увидел 1 и записал 2. Итог верный. Для одного числа атомик дешевле: fetch_add делает то же без замка."}];
let i=0,timer=null;
function stop(){if(timer){clearInterval(timer);timer=null;}document.getElementById('play').textContent='Играть';}
function frame(){document.getElementById('panel').innerHTML=steps[i].p;document.getElementById('note').textContent=steps[i].n;document.getElementById('cnt').textContent='шаг '+(i+1)+' из '+steps.length;document.getElementById('step').disabled=i>=steps.length-1;if(i>=steps.length-1)stop();}
document.getElementById('step').onclick=()=>{if(i<steps.length-1){i++;frame();}};
document.getElementById('reset').onclick=()=>{stop();i=0;frame();};
document.getElementById('play').onclick=()=>{if(timer){stop();return;}if(i>=steps.length-1){i=0;frame();}document.getElementById('play').textContent='Пауза';timer=setInterval(()=>{if(i<steps.length-1){i++;frame();}else stop();},3000);};
frame();
</script>
</body>
</html>
