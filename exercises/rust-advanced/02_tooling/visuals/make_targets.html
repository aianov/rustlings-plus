<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Цели и зависимости</title>
<style>
:root{--bg:#fafaf7;--fg:#1d1d1b;--mut:#6b6b66;--card:#fff;--line:#c9c7bd;--acc:#c2410c;--ok:#15803d;--okbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;--btn:#1d1d1b;--btnfg:#fff;--hot:#fff1e6}
@media (prefers-color-scheme:dark){:root{--bg:#161614;--fg:#ecebe6;--mut:#9a9a92;--card:#201f1d;--line:#46443f;--acc:#fb923c;--ok:#4ade80;--okbg:#14301d;--bad:#f87171;--badbg:#3a1a1a;--btn:#ecebe6;--btnfg:#161614;--hot:#33241a}}
*{box-sizing:border-box}
body{margin:0;padding:20px;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 14px}
.panel{max-width:820px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.cmd{font:14px ui-monospace,Menlo,Consolas,monospace;margin-bottom:10px;color:var(--acc);min-height:22px}
.nodes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.n{font:13px ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--card);transition:all .3s}
.n small{display:block;color:var(--mut);font-size:11px}
.n.run{border-color:var(--acc);background:var(--hot)}
.n.done{border-color:var(--ok);background:var(--okbg)}
.n.skip{border-color:var(--bad);background:var(--badbg)}
.lanes{margin-top:10px}
.lane{display:flex;align-items:center;gap:8px;margin:5px 0;font:13px ui-monospace,Menlo,Consolas,monospace}
.lane .name{width:70px;color:var(--mut)}
.track{flex:1;height:22px;background:var(--bg);border:1px solid var(--line);border-radius:6px;position:relative}
.bar{position:absolute;top:2px;bottom:2px;border-radius:4px;background:var(--acc);transition:all .5s;opacity:.9}
.bar.b{background:var(--mut)}
.axis{display:flex;justify-content:space-between;color:var(--mut);font-size:11px;margin-left:78px}
.note{margin:12px 0;padding:12px 14px;border-left:4px solid var(--acc);background:var(--card);border-radius:0 8px 8px 0;min-height:76px;max-width:820px}
.bar2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:820px}
button{font:inherit;padding:7px 14px;border-radius:8px;border:0;background:var(--btn);color:var(--btnfg);cursor:pointer}
button.alt{background:transparent;color:var(--fg);border:1px solid var(--line)}
button:disabled{opacity:.4;cursor:default}
.cnt{color:var(--mut);margin-left:auto}
</style>
</head>
<body>
<h1>Цели и зависимости</h1>
<p class="sub">Цель выполняется после своих зависимостей. Параллельность появляется только если её явно попросить.</p>
<div class="panel">
  <div class="cmd" id="cmd"></div>
  <div class="nodes" id="nodes"></div>
  <div class="lanes" id="lanes"></div>
  <div class="axis" id="axis"></div>
</div>
<div class="note" id="note"></div>
<div class="bar2">
  <button id="step">Шаг</button>
  <button id="play" class="alt">Играть</button>
  <button id="reset" class="alt">Сначала</button>
  <span class="cnt" id="cnt"></span>
</div>
<script>
const node=(name,sub,st)=>({name,sub,st});
const steps=[
 {cmd:'check: fmt lint test    test: build',nodes:[node('check','fmt lint test',''),node('fmt','',''),node('lint','',''),node('test','build',''),node('build','','')],lanes:null,
  note:'В Makefile у цели check три зависимости, а у test своя, build. Это граф: стрелки ведут от цели к тому, что нужно сделать раньше.'},
 {cmd:'$ make check',nodes:[node('fmt','1','done'),node('lint','2','done'),node('build','3','done'),node('test','4','done'),node('check','5','done')],lanes:null,
  note:'make обходит зависимости слева направо вглубь: fmt, lint, потом для test сначала build, потом сам test, и в конце check. Порядок в списке зависимостей и есть порядок выполнения.'},
 {cmd:'$ make test    (каталог test/ существует, .PHONY нет)',nodes:[node('build','','skip'),node('test','актуально?','skip')],lanes:null,
  note:'Ловушка: make считает цель именем файла. Каталог test есть, зависимости не новее, и make отвечает «up to date», ничего не запуская. Строка .PHONY: test говорит, что это команда, а не файл.'},
 {cmd:'$ cargo make run-all   (dependencies = [api, auth, worker])',nodes:[node('api','2 c','done'),node('auth','2 c','done'),node('worker','2 c','done')],
  lanes:[['api',0,33],['auth',33,66],['worker',66,100]],end:'6 c',
  note:'Список dependencies это очередь: пока api не закончил, auth не стартует. Три сервиса по две секунды дают шесть. Для сборки это правильно, для запуска сервисов нет.'},
 {cmd:'$ cargo make run-all   (run_task parallel = true)',nodes:[node('api','','done'),node('auth','','done'),node('worker','','done')],
  lanes:[['api',0,33],['auth',0,33],['worker',0,33]],end:'6 c',
  note:'С run_task и parallel = true все три задачи стартуют вместе. Время почти как у одного сервиса. Но если собирать проект внутри каждой, они начнут драться за блокировку папки сборки.'},
 {cmd:'$ cargo make run-all   (dependencies = [build-all] + parallel)',nodes:[node('build-all','1 раз','done'),node('api','','done'),node('auth','','done'),node('worker','','done')],
  lanes:[['build',0,12,'b'],['api',12,45],['auth',12,45],['worker',12,45]],end:'',
  note:'Правильная схема: сборка один раз как зависимость, потом параллельный запуск. Зависимость выполняется до run_task, и сервисы стартуют уже на готовых бинарниках.'}
];
let i=0,timer=null;
function render(){
  const s=steps[i];
  document.getElementById('cmd').textContent=s.cmd;
  document.getElementById('nodes').innerHTML=s.nodes.map(n=>'<div class="n '+n.st+'">'+n.name+(n.sub?'<small>'+n.sub+'</small>':'')+'</div>').join('');
  const lanes=document.getElementById('lanes');
  if(s.lanes){
    lanes.innerHTML=s.lanes.map(l=>'<div class="lane"><span class="name">'+l[0]+'</span><div class="track"><div class="bar '+(l[3]||'')+'" style="left:'+l[1]+'%;width:'+(l[2]-l[1])+'%"></div></div></div>').join('');
    document.getElementById('axis').innerHTML='<span>0</span><span>время</span><span>'+(s.end||'')+'</span>';
  }else{lanes.innerHTML='';document.getElementById('axis').innerHTML='';}
  document.getElementById('note').textContent=s.note;
  document.getElementById('cnt').textContent='шаг '+(i+1)+' из '+steps.length;
  document.getElementById('step').disabled=i===steps.length-1;
  if(i===steps.length-1)stop();
}
function stop(){if(timer){clearInterval(timer);timer=null;}document.getElementById('play').textContent='Играть';}
document.getElementById('step').onclick=()=>{if(i<steps.length-1){i++;render();}};
document.getElementById('reset').onclick=()=>{stop();i=0;render();};
document.getElementById('play').onclick=()=>{
  if(timer){stop();return;}
  if(i===steps.length-1){i=0;render();}
  document.getElementById('play').textContent='Пауза';
  timer=setInterval(()=>{if(i<steps.length-1){i++;render();}else stop();},3000);
};
render();
</script>
</body>
</html>
