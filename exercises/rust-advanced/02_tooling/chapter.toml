[chapter]
title.ru = "Скрипты и окружение разработчика"

[[chapter.visuals]]
file = "visuals/make_targets.html"
title.ru = "Цели и зависимости: порядок в make и в cargo make, параллельный run-all"

[[exercises]]
name = "tool_makefile"
kind = "project"
style = "fix"
locked = ["acceptance/Cargo.toml", "acceptance/tests/acceptance.rs"]
test_command = ["cargo", "test", "--manifest-path", "acceptance/Cargo.toml"]
hint.ru = ["""Начни с двух симптомов по отдельности: чем отличается рецепт, который make принимает, от того, который не принимает? И почему make считает, что тест уже сделан?""", """Make по умолчанию думает, что цель это файл, и если файл (или папка) с таким именем есть, делать нечего. Есть специальная цель, которая объявляет имена «просто командами». Рецепты начинаются с символа, который в редакторе легко подменить пробелами."""]
why.ru = """Табуляция в начале рецепта это синтаксис make, а не стиль: пробелы он не принимает («missing separator»). `.PHONY` объявляет цели командами, а не файлами: без него одноимённая папка `test/` или `build/` делает цель «актуальной» и молча пропускает работу. Порядок в `check: fmt lint test` выполняется слева направо, а `test: build` гарантирует сборку перед тестами. `make -n` печатает план, не выполняя его, и это самый дешёвый способ проверить Makefile."""

[[exercises]]
name = "tool_q1"
kind = "question"
question.ru = """Makefile выглядит так, но `make build` пишет `*** missing separator. Stop.`
```
build:
    cargo build
```
Что не так?"""
options.ru = ["после двоеточия нужен пробел", "рецепт начинается пробелами, а нужна табуляция", "у цели нет зависимостей", "cargo нельзя звать из make"]
answer = [1]
explain.ru = """Рецепт (строки команд) обязан начинаться с символа табуляции. Четыре пробела выглядят так же, но для make это не рецепт, а посторонний текст, отсюда «missing separator». Хороший редактор показывает табуляции или умеет их сохранять для Makefile."""
hint.ru = """Строки в рецепте отличаются от прочих особым первым символом."""

[[exercises]]
name = "tool_q2"
kind = "question"
question.ru = """В папке есть Makefile с целью `test: cargo test`, но без `.PHONY`, и ещё каталог `test/` с файлами. Что напечатает `make test`?"""
options.ru = ["запустит cargo test", "make: `test' is up to date.", "ошибку: цель test не определена", "запустит cargo test и очистит каталог test/"]
answer = [1]
explain.ru = """Make считает цель именем файла. Каталог `test` существует, у цели нет зависимостей, которые были бы новее, значит, её «пересобирать не надо». Поэтому и нужна строка `.PHONY: test`: она говорит, что `test` это команда, а не файл."""
hint.ru = """Make сравнивает цель с файлом на диске."""

[[exercises]]
name = "tool_make_vars"
kind = "project"
style = "todo"
locked = ["acceptance/Cargo.toml", "acceptance/tests/acceptance.rs"]
test_command = ["cargo", "test", "--manifest-path", "acceptance/Cargo.toml"]
hint.ru = ["""Подумай, откуда значение переменной может прийти: из файла, из окружения, из командной строки. Какой присваивание в файле уступает окружению, а какое нет?""", """`?=` присваивает, только если переменная ещё не определена. Аргумент `make цель ИМЯ=значение` всегда сильнее. Условный флаг удобно собрать функцией `$(if $(filter release,$(PROFILE)),--release,)`."""]
why.ru = """У make три источника значений, и порядок важен: командная строка сильнее файла, а `=` в файле сильнее окружения. Поэтому значение по умолчанию пишут через `?=`: оно уступает и окружению, и командной строке. Условный флаг собирается в одну переменную, чтобы не дублировать рецепты для build и run. Для `make -n` разница видна без запуска."""

[[exercises]]
name = "tool_q3"
kind = "question"
question.ru = """В Makefile: `SERVICE ?= api`. В оболочке выполнена `export SERVICE=auth`. Какой сервис запустит `make run SERVICE=db`?"""
options.ru = ["api", "auth", "db", "ошибка: значение задано дважды"]
answer = [2]
explain.ru = """Аргумент командной строки сильнее всего остального: и окружения, и присваивания в файле (даже обычного `=`). Оператор `?=` лишь уступает уже определённому значению. Без аргумента сработало бы `auth` из окружения, а `api` взялось бы только при пустом окружении."""
hint.ru = """Какой из трёх источников значения самый сильный?"""

[[exercises]]
name = "tool_cargo_make"
kind = "project"
style = "scratch"
locked = ["acceptance/Cargo.toml", "acceptance/tests/acceptance.rs"]
test_command = ["cargo", "test", "--manifest-path", "acceptance/Cargo.toml"]
hint.ru = ["""Задачи в Makefile.toml это таблицы `[tasks.имя]`. Настройка, которая должна действовать на все задачи сразу, пишется выше таблиц. Выполни `cargo make check` и посмотри, какие команды реально запускаются.""", """У cargo-make есть встроенные задачи со знакомыми именами (`test`, `check`, `format`...). Если объявить свою задачу с таким именем, поля сливаются: твои `dependencies` добавятся, а встроенная команда останется. Чтобы подмены не было, у `check` есть поле `clear`. Для файла `.env` смотри ключ `env_files` и опцию `defaults_only`."""]
why.ru = """Проверки собраны в цепочку зависимостей, и порядок задаёт список `dependencies`. Встроенные задачи cargo-make сливаются с твоими, поэтому у `check` нужен `clear = true`, иначе сверху прилетит `cargo check`. Опция `defaults_only = true` у `env_files` делает файл источником значений по умолчанию: переменная из оболочки остаётся сильнее, и разработчик может временно поменять настройку, не трогая файл."""

[[exercises]]
name = "tool_q5"
kind = "question"
question.ru = """В Makefile.toml: `env_files = [".env"]` (без опций). В `.env` строка `NAME=file`, в оболочке задано `NAME=shell`. Что увидит задача в `${NAME}`?"""
options.ru = ["shell", "file", "пусто", "ошибка: переменная определена дважды"]
answer = [1]
explain.ru = """По умолчанию значения из env-файла перезаписывают окружение. Чтобы оболочка могла переопределить файл, пишут `env_files = [{ path = ".env", defaults_only = true }]`: тогда файл только дополняет то, что не задано. Это одна из тех мелочей, из-за которых «у меня переменная выставлена, а работает по-другому»."""
hint.ru = """Файл настроек по умолчанию считает себя главным."""

[[exercises]]
name = "tool_cargo_make_fix"
kind = "project"
style = "bughunt"
locked = ["acceptance/Cargo.toml", "acceptance/tests/acceptance.rs"]
test_command = ["cargo", "test", "--manifest-path", "acceptance/Cargo.toml"]
hint.ru = ["""Прочитай вывод `cargo make check` внимательно: сколько раз и где (в каких папках) печатается Task? И какие команды выполняются на самом деле?""", """В воркспейсе cargo-make по умолчанию запускает задачу отдельно в каждом крейте. Это отключается в секции конфигурации. Второй дефект: у cargo-make уже есть встроенная задача с именем, которое ты используешь для итоговой."""]
why.ru = """Есть два «скрытых» поведения cargo-make, и оба срабатывают только в воркспейсе. Первое: `default_to_workspace` по умолчанию истина, и задача исполняется в каждом члене отдельно. Второе: свои задачи с именами встроенных (`check`, `test`) сливаются с ними. Баг не виден, пока не прочитаешь, какие именно команды выполнялись: поэтому тест считает строки `Execute Command`."""

[[exercises]]
name = "tool_q4"
kind = "question"
question.ru = """В корне воркспейса с тремя крейтами лежит `Makefile.toml` без секции `[config]`. Ты запускаешь `cargo make test`, где `test` это твоя задача с командой `cargo test --workspace`. Сколько раз она выполнится?"""
options.ru = ["один раз, из корня", "три раза, по разу в каждом крейте", "ни разу: cargo-make не работает в воркспейсах", "один раз, но только в первом крейте"]
answer = [1]
explain.ru = """Если в корне воркспейса не отключить `default_to_workspace`, cargo-make сам обходит членов и выполняет задачу в каждом по очереди. Для задач, которые и так работают на весь воркспейс (`cargo test --workspace`), это лишняя работа в N раз, а для некоторых ещё и ошибка. В конфиг пишут `default_to_workspace = false`."""
hint.ru = """Вспомни задачу про воркспейс: какой флаг ты там меняли?"""

[[exercises]]
name = "tool_run_all"
kind = "project"
style = "todo"
locked = ["acceptance/Cargo.toml", "acceptance/tests/acceptance.rs"]
test_command = ["cargo", "test", "--manifest-path", "acceptance/Cargo.toml"]
hint.ru = ["""Список `dependencies` у cargo-make выполняется по очереди. А как сказать задаче «запусти вот эти задачи вместе»?""", """У задачи есть поле `run_task`, принимающее имя или таблицу с несколькими именами и флагом `parallel`. Сборку выполни отдельной задачей и поставь её в `dependencies`: тогда она произойдёт один раз до запуска параллельных."""]
why.ru = """`dependencies` строит последовательность, `run_task` с `parallel = true` строит одновременный запуск. Сборка вынесена в отдельную зависимость, чтобы три `cargo run` не соревновались за блокировку папки сборки и не собирали проект трижды. Общие настройки лежат в `[env]` один раз: изменить паузу можно в одном месте."""

[[exercises]]
name = "tool1"
style = "scratch"
hint.ru = ["""Начни с `split_first`: имя команды и остальное. Каждая команда разбирает свой хвост по-своему, вынеси `up` в отдельную функцию.""", """Для флага со значением удобен цикл `while let Some(flag) = iter.next()`: внутри можно взять следующий элемент того же итератора. Форму `--service=auth` лови через `strip_prefix`."""]
why.ru = """Разбор аргументов это конечный автомат из двух состояний: «жду флаг» и «жду значение», и итератор, который можно продвинуть вручную, выражает это естественно. Ошибки возвращаются значениями с именем виноватого аргумента, потому что сообщение для человека формируется выше. Значение после `--service` берётся как есть, даже если оно похоже на флаг: так делают почти все утилиты."""

[[exercises]]
name = "tool2"
style = "todo"
hint.ru = ["""Для поиска вверх у `Path` есть итератор по предкам. А что происходит с `join`, если второй путь абсолютный?""", """`Path::ancestors()` даёт саму папку и всех родителей. Для проверки пути на побег смотри на `components()` и варианты `Component::ParentDir`, `RootDir`, `Prefix`."""]
why.ru = """`Path::join` с абсолютным путём молча подменяет базу целиком: `/srv/app` плюс `/etc/passwd` даёт `/etc/passwd`. Поэтому любой путь от пользователя разбирают по компонентам до склейки. Проверка по компонентам надёжнее, чем поиск подстроки `..` в тексте (которая ложно срабатывает на `a..b` и пропускает хитрые формы). Отсутствие папки `crates` это ошибка, а не пустой список: так скрипт замечает, что запущен не там."""

[[exercises]]
name = "tool_q6"
kind = "question"
question.ru = """Что вернёт `Path::new("/srv/app").join("/etc/hosts")`?"""
options.ru = ["/srv/app/etc/hosts", "/srv/app//etc/hosts", "/etc/hosts", "ошибку"]
answer = [2]
explain.ru = """Когда добавляемый путь абсолютный, `join` заменяет базу целиком. Поэтому склеивать пользовательские пути с базовой папкой без проверки опасно: достаточно передать `/etc/passwd`, чтобы выбраться за её пределы. Проверяй компоненты пути до склейки."""
hint.ru = """Что значит начальный слэш для пути?"""

[[exercises]]
name = "tool3"
style = "scratch"
hint.ru = ["""Подумай, сколько разных способов у запуска провалиться. Какие методы `Command` возвращают ошибку ввода-вывода, а где ошибка прячется внутри успешного результата?""", """`Command::output()` возвращает `Err`, только если процесс не удалось запустить. Если он запустился и упал, ты получишь `Ok(Output)` со статусом: смотри `output.status.success()` и `status.code()`."""]
why.ru = """Два вида неудачи требуют разной реакции: программы нет (подскажи установить) и программа упала (покажи её stderr и код). Если смешать их, сообщение станет бесполезным. Вывод читается через `from_utf8_lossy`: программа может напечатать не UTF-8, и скрипт не должен из-за этого паниковать. Рабочую папку передают через `current_dir`, а не через `cd` в строке: так нет ничего, что можно подменить пробелом."""

[[exercises]]
name = "tool_q7"
kind = "question"
question.ru = """Что вернёт `Command::new("cargo").arg("no-such-command").output()`, если cargo установлен, а подкоманды такой нет?"""
options.ru = ["Err: запуск не удался", "Ok(output), в котором status.success() равно false", "панику", "Ok(output) с успешным статусом, ошибка только в stderr"]
answer = [1]
explain.ru = """`output()` возвращает `Err` лишь тогда, когда процесс не удалось запустить. Cargo запустился и сам завершился с ошибкой, поэтому ты получишь `Ok(Output)` с ненулевым статусом. Кто не смотрит на `status`, считает упавшую команду успешной: это и есть баг из задачи."""
hint.ru = """Различай «не запустилась» и «запустилась и упала»."""

[[exercises]]
name = "tool4"
style = "bughunt"
hint.ru = ["""Что именно возвращает `is_ok()` на результате `output()`: «команда прошла» или «команда запустилась»?""", """Нужно смотреть на статус завершения, а не на успех запуска. И цикл должен выйти при первой же неудаче, а не продолжить: вспомни оператор, который прерывает функцию на ошибке."""]
why.ru = """Самый частый баг скриптов: проверять, что процесс запустился, вместо того чтобы проверять, что он завершился успешно. Зелёная проверка при красном шаге хуже, чем отсутствие проверки: ей верят. Оператор `?` решает вторую половину бага одним символом, потому что остановка на первой ошибке это и есть его смысл. Сообщение с именем шага и кодом экономит время при чтении логов CI."""

[[exercises]]
name = "tool_xtask"
kind = "project"
style = "scratch"
locked = ["acceptance/Cargo.toml", "acceptance/tests/acceptance.rs"]
test_command = ["cargo", "test", "--manifest-path", "acceptance/Cargo.toml"]
hint.ru = ["""Начни с каркаса: как программа получает свои аргументы, и как проверить, что аргументов нет или они неизвестные? Потом подумай, откуда xtask узнает корень воркспейса, если запущен из любого места.""", """Алиас `cargo xtask` это запись в `.cargo/config.toml` в таблице `[alias]`, раскрывающаяся в `run --package xtask --`. Корень проще всего вычислить от `CARGO_MANIFEST_DIR` пакета xtask. Внешние команды запускай через `Command` и обязательно проверяй статус."""]
why.ru = """xtask хорош тем, что это обычный крейт воркспейса: он собирается теми же инструментами, тестируется, и его можно запускать на любой ОС, где есть cargo. Правила имён проверяются до касания диска, поэтому отказ ничего не оставляет за собой. Существующий сервис не перезаписывается: скрипт, который молча затирает работу, опаснее, чем скрипт, который отказывается. Путь к cargo берётся из переменной `CARGO`, чтобы xtask использовал тот же cargo, что его запустил."""

[[exercises]]
name = "tool_q8"
kind = "question"
question.ru = """Репозиторий с `tools/xtask` и без файла `.cargo/config.toml`. Что выведет `cargo xtask check`?"""
options.ru = ["запустит проверки, cargo сам найдёт крейт xtask", "error: no such command: `xtask`", "соберёт xtask, но ничего не запустит", "предложит установить пакет xtask с crates.io"]
answer = [1]
explain.ru = """`cargo xtask` на самом деле не подкоманда: это алиас, и без записи `xtask = "run --package xtask --"` в `.cargo/config.toml` cargo ничего о нём не знает. Сам крейт `xtask` это обычная программа воркспейса, которую алиас запускает."""
hint.ru = """Откуда cargo узнает слово xtask?"""

[[exercises]]
name = "tool_toolchain"
kind = "project"
style = "todo"
locked = ["acceptance/Cargo.toml", "acceptance/tests/acceptance.rs"]
test_command = ["cargo", "test", "--manifest-path", "acceptance/Cargo.toml"]
hint.ru = ["""Каждый из трёх файлов настроек лежит в корне воркспейса, и каждый подхватывается своим инструментом сам. Какие ключи нужны, чтобы строка в 85 символов считалась слишком длинной, а `exit` запрещённой?""", """`rust-toolchain.toml`: таблица `[toolchain]` с `channel`, `components`, `profile`. Для rustfmt смотри параметры `max_width` и `use_field_init_shorthand`. Для clippy: `disallowed-methods` (список таблиц с `path`) и `too-many-arguments-threshold`. После добавления `rustfmt.toml` запусти `cargo fmt`."""]
why.ru = """Файлы настроек превращают договорённости в код: новому человеку не надо ничего объяснять, инструменты сами берут правила. Точная версия в `rust-toolchain.toml` убирает класс проблем «у меня другой clippy». `disallowed-methods` ловит опасные вызовы в ревью автоматически. А `--locked` в `make check` делает устаревший лок красной сборкой: файл `Cargo.lock` это часть репозитория, и тихо переписывать его нельзя."""

[[exercises]]
name = "tool_q9"
kind = "question"
question.ru = """В корне лежит `rust-toolchain.toml` с `channel = "1.88.0"`, но на твоей машине такого компилятора нет. Что будет при `cargo build`?"""
options.ru = ["соберётся тем компилятором, который стоит", "rustup скачает 1.88.0 (с нужными компонентами) и соберёт им", "cargo откажется работать без ручной установки", "файл будет проигнорирован с предупреждением"]
answer = [1]
explain.ru = """Когда команды запускаются через rustup (так устроен обычный `cargo`), он читает `rust-toolchain.toml` в текущей и родительских папках и ставит указанный компилятор, если его нет. Поэтому достаточно закоммитить файл, и новому человеку ничего ставить руками не нужно."""
hint.ru = """Кто выбирает компилятор: cargo или rustup?"""

[[exercises]]
name = "tool_q10"
kind = "question"
question.ru = """Что делает `cargo fmt --all --check` на файле с плохим форматированием?"""
options.ru = ["исправляет файл и завершается успешно", "печатает отличия и завершается с ненулевым кодом, файл не меняется", "исправляет файл и завершается с ненулевым кодом", "ничего не печатает, только предупреждает"]
answer = [1]
explain.ru = """`--check` включает режим проверки: rustfmt показывает, что изменил бы, и возвращает ошибку, а файлы не трогает. Для CI это то, что нужно. Без флага `cargo fmt` тихо переписывает файлы, и такая команда для проверки не годится."""
hint.ru = """Проверка и исправление это разные режимы."""

