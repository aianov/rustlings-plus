why.ru = '''Индекс по тегам обновляется там же, где меняется текст: при вставке, правке и удалении. Забытая симметрия даёт «призраков»: пост исчез, а в теге остался. Правка устроена как «убрать по старому тексту, поставить по новому», это проще, чем сравнивать два набора тегов. Опустевшие теги убираем сразу, чтобы `tags_known` не врал.'''

