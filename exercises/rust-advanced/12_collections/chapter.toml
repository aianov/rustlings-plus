kind = "question"
question.ru = '''Что напечатает программа?
```rust
let mut v = vec![("b", 2), ("a", 1), ("c", 2), ("d", 1)];
v.sort_by_key(|p| p.1);
println!("{v:?}");
```'''
options.ru = [
  "[(\"a\", 1), (\"d\", 1), (\"b\", 2), (\"c\", 2)]",
  "[(\"d\", 1), (\"a\", 1), (\"c\", 2), (\"b\", 2)]",
  "[(\"a\", 1), (\"b\", 2), (\"c\", 2), (\"d\", 1)]",
  "порядок внутри групп не определён",
]
answer = [0]
explain.ru = '''`sort_by_key` устойчивая: равные по ключу элементы остаются в исходном порядке. В исходном `a` стоял раньше `d`, а `b` раньше `c`, поэтому `[("a", 1), ("d", 1), ("b", 2), ("c", 2)]`. Если заменить на `sort_unstable_by_key`, порядок внутри групп уже не гарантирован.'''
hint.ru = '''Что устойчивая сортировка делает с элементами, у которых ключи равны?'''

[[exercises]]
name = "coll18"
style = "fix"
hint.ru = [
  '''Протестируй каждую функцию по очереди. `dedup` убирает только соседние повторы, `remove(i)` сдвигает следующий элемент на место удалённого, а `drain(..n)` паникует, если `n` больше длины.''',
  '''Для авторов нужен «видели ли уже»: `HashSet::insert` возвращает `false` для повтора, это удобный фильтр. Для заглушённых есть метод, который проходит вектор один раз сам.''',
  '''`filter(|a| seen.insert(*a))`; `feed.retain(|i| !muted.contains(&i.author))`; `drain(..n.min(feed.len()))`. Для уведомлений `dedup_by_key(|n| (n.kind, n.target))`.''',
]
why.ru = '''`dedup` работает только по соседям, поэтому для «каждый один раз» нужен `HashSet` или предварительная сортировка. Ручной цикл с `remove(i)` и `i += 1` пропускает элемент после каждого удаления; `retain` проходит вектор один раз и ничего не пропускает. `drain` отрезает голову за один сдвиг, но границу надо ограничить длиной. `dedup_by_key` как раз про соседние повторы: ровно то, что нужно для свёртки уведомлений.'''

[[exercises]]
name = "coll_q8"
kind = "question"
question.ru = '''Что напечатает программа?
```rust
let mut v = vec![1, 1, 2, 3, 3, 1, 1];
v.dedup();
v.retain(|x| *x != 2);
println!("{v:?}");
```'''
options.ru = [
  "[1, 3]",
  "[1, 3, 1]",
  "[3, 1]",
  "[1, 1, 3, 3, 1, 1]",
]
answer = [1]
explain.ru = '''`dedup` схлопывает только соседние повторы: `[1, 2, 3, 1]`. Отдельные единицы по краям остаются. Потом `retain` убирает двойку: `[1, 3, 1]`. Чтобы остались уникальные значения целиком, вектор нужно сначала отсортировать.'''
hint.ru = '''Какие повторы видит `dedup`: все или только стоящие рядом?'''

[[exercises]]
name = "coll19"
style = "scratch"
hint.ru = [
  '''`binary_search` возвращает `Ok(позиция)` или `Err(куда вставить)`. Оба случая пригодятся.''',
  '''`partition_point(|x| *x < lo)` возвращает число элементов, для которых условие истинно, если все истинные идут подряд в начале. Число id в `[lo, hi)` это разность двух таких точек.''',
  '''`count_in` при `lo > hi` не должно паниковать: `saturating_sub`. `first_at_least`: позиция точки разбиения, `get(pos)`.''',
]
why.ru = '''Отсортированный `Vec` оправдан, когда читают много, а пишут редко: он компактный, а поиск идёт за логарифм. `Err(pos)` из `binary_search` это ровно то место, куда вставка сохраняет порядок. `partition_point` не требует равенства и находит границу любого монотонного условия, поэтому он надёжнее ручных циклов с `<=` и `<`.'''

[[exercises]]
name = "coll_q9"
kind = "question"
question.ru = '''Что напечатает программа?
```rust
let v = [1, 3, 3, 3, 7];
let a = v.partition_point(|x| *x < 3);
let b = v.partition_point(|x| *x <= 3);
let c = v.binary_search(&5);
println!("{a} {b} {c:?}");
```'''
options.ru = [
  "1 4 Err(4)",
  "1 3 Err(4)",
  "2 4 Ok(4)",
  "1 4 Err(5)",
]
answer = [0]
explain.ru = '''Условие `< 3` верно только для первой единицы, значит граница на позиции 1. Условие `<= 3` верно для четырёх первых элементов: граница 4. Числа 5 нет, место для него между тройкой и семёркой, то есть позиция 4: `Err(4)`. Для повторяющихся значений `binary_search` может вернуть любую из позиций, а `partition_point` точно задаёт начало и конец.'''
hint.ru = '''Где в массиве условие переключается с истины на ложь? И куда встал бы пропущенный элемент?'''

