]
why.ru = '''Согласованность индексов держится на одном месте: любая запись о посте сначала снимает старые следы, потом ставит новые. Тогда замена, передача и удаление не расходятся. Пустые множества убираются сразу, иначе счётчик авторов растёт и показывает людей, у которых нет постов. `BTreeSet<(время, id)>` даёт нужный порядок ленты без сортировки.'''

[[exercises]]
