[[exercises]]
name = "coll1"
style = "todo"
hint.ru = [
  '''У `HashMap::entry` два лица: занятая ячейка и свободная. Какое из них нужно, когда лайки кончились и запись надо убрать?''',
  '''`like`: `*entry(post).or_insert(0) += 1` и вернуть значение. `unlike`: `match` по `Entry::Occupied(e)` и `Entry::Vacant(_)`; у занятой есть `get`, `get_mut` и `remove`. Для заголовка у `Entry` есть метод, принимающий замыкание, а не готовое значение.''',
]
why.ru = '''Занятая ячейка даёт `remove`, поэтому `unlike` находит ключ один раз и сразу решает, уменьшить или убрать. `or_insert_with(make)` вызывает функцию только на свободной ячейке, а `or_insert(make())` построила бы значение до проверки, даже если оно не нужно. Неизвестный пост при `unlike` остаётся нетронутым: свободную ячейку не заполняем.'''

[[exercises]]
name = "coll_q1"
kind = "question"
question.ru = '''Сколько раз сработает `make` за два прохода?
```rust
use std::cell::Cell;
use std::collections::HashMap;

let calls = Cell::new(0);
let make = || {
    calls.set(calls.get() + 1);
    0_u32
};
let mut m = HashMap::new();
for k in [1, 2, 1, 1] {
    *m.entry(k).or_insert(make()) += 1;
}
let first = calls.get();
for k in [1, 2, 1, 1] {
    *m.entry(k).or_insert_with(make) += 1;
}
println!("{first} {}", calls.get());
```'''
options.ru = [
  "2 2",
  "4 4",
  "4 8",
  "2 4",
]
answer = [1]
explain.ru = '''`or_insert(make())` получает готовое значение, значит `make()` вызывается на каждой итерации до обращения к карте: четыре раза, хотя ключей два. Во втором проходе оба ключа уже есть, и `or_insert_with(make)` не вызывает функцию ни разу. Итого `4 4`. Если значение дорого строить (запрос, выделение), нужна ленивая версия.'''
hint.ru = '''Кто и когда вычисляет аргумент `or_insert`, а кто откладывает вычисление?'''

[[exercises]]
name = "coll2"
style = "fix"
hint.ru = [
  '''Тест считает вызовы `Hash::hash`. Сколько раз хешируется ключ в `get_or_load` на попадании? Посчитай вызовы `contains_key`, `get`, `insert`.''',
  '''Ключ нужно найти один раз и получить либо значение, либо место под него. Такой метод у `HashMap` называется `entry`.''',
  '''`cache.entry(key).or_insert_with(|| load(key))` вернёт `&mut V`, а наружу нужен `&V`: он выводится сам. Для `touch` годится `*seen.entry(key).or_insert(0) += 1`.''',
]
why.ru = '''Проверка и вставка по отдельности хешируют и ищут ключ дважды: для длинного составного ключа это заметно. `entry` ищет один раз и держит найденное место, поэтому и гонки с заимствованием нет: пока жив `Entry`, никто другой карту не трогает. Попутно уходит коварная ошибка `get_mut` с ранним `return` и последующим `insert`, которую борроу-чекер отвергает.'''

[[exercises]]
name = "coll3"
style = "todo"
hint.ru = '''Три функции, и в каждой нужно одно и то же: «взять запись по ключу, а если её нет, завести пустую». Какой метод `Entry` создаёт значение по умолчанию?'''
why.ru = '''`entry(..).or_default()` заводит пустой `Vec`, и в него сразу можно положить. Ключами карты тегов служат `&str` из самих постов, поэтому строки не копируются. Равенство в `top_tag` решает `then_with` по обратному сравнению имён: из двух одинаково частых побеждает меньший по алфавиту, а `max_by` при равных отдаёт последний, поэтому порядок надо задать явно.'''

[[exercises]]
name = "coll4"
style = "todo"
hint.ru = [
  '''Пересечение множеств возвращает итератор по ссылкам. Нужно отсортировать, значит сначала собрать. Для рекомендаций: что даёт `difference` двух множеств друзей?''',
  '''`mutual`: `intersection(..).copied().collect()`, потом `sort_unstable`. `suggest`: пройди по друзьям, для каждого возьми `difference(&мои_друзья)`, пропусти себя, считай появления в `HashMap<u64, usize>`.''',
  '''Потом собери карту в `Vec`, отсортируй `sort_by` по числу общих друзей по убыванию, затем по id по возрастанию. Не забудь, что у пользователя может не быть записи в графе.''',
]
why.ru = '''Рекомендации это подсчёт: каждый друг друга-кандидата «голосует» за него, а множества нужны, чтобы отсеять себя и тех, кто уже в друзьях. Результат карты случаен по порядку, поэтому его сортируют по полному ключу: число голосов и id. Тогда тест не зависит от зерна хеша.'''

[[exercises]]
name = "coll5"
style = "fix"
hint.ru = [
  '''Запусти тест несколько раз: порядок обхода `HashMap` каждый раз другой. Чем можно заменить прямой обход, чтобы порядок определялся данными, а не картой?''',
  '''Собери записи в `Vec` и отсортируй. Для тегов ключ сортировки это пара (число постов по убыванию, имя), для id просто числа.''',
]
why.ru = '''`HashMap` и `HashSet` не обещают порядок, и в Rust он меняется даже между запусками одной программы (зерно случайное). Всё, что попадает в ответ, лог или тест, надо упорядочить явно. Если порядок нужен постоянно, пора брать `BTreeMap`, но для разового вывода сортировка дешевле.'''

[[exercises]]
name = "coll6"
style = "todo"
hint.ru = [
  '''Для ключа-пары `(время, id)` промежуток по времени записывается парами. Какая пара самая маленькая для времени `from`, и какая для `to`?''',
  '''`range((from, 0)..(to, 0))` берёт всё от `(from, 0)` включительно до `(to, 0)` не включая. Но `range` паникует, если начало больше конца: проверь это до вызова.''',
  '''`newest`: у `BTreeMap` есть `last_key_value`, у старейшего `pop_first`.''',
]
why.ru = '''Диапазон по составному ключу строится из минимального значения второй части. Если `from >= to`, `BTreeMap::range` паникует, поэтому перевёрнутый промежуток обрабатывается раньше. Обход всего дерева с фильтром дал бы тот же ответ, но потерял бы смысл упорядоченной структуры: `range` спускается к началу промежутка за логарифм.'''

[[exercises]]
name = "coll7"
style = "scratch"
hint.ru = [
  '''Страница это `n` ключей строго меньше курсора, идущих от больших к меньшим. Какие методы `BTreeMap` дают диапазон и обратный порядок?''',
  '''Как узнать, что за страницей есть ещё посты, не обходя дерево? Возьми на один пост больше, чем просят, и посмотри, получилось ли `n + 1`.''',
  '''`posts.range(..c).rev().take(n + 1)`; если вышло больше `n`, обрежь до `n` и отдай курсором id последнего. Для `None` вместо `range` годится `keys().rev()`.''',
]
why.ru = '''Курсор по ключу стабилен: новые посты появляются справа от него и страницы слева не сдвигают, в отличие от номера страницы. Лишний элемент (`n + 1`) отвечает на вопрос «есть ли продолжение» без второго запроса. Курсор следующей страницы это id последнего отданного поста, а не первого неотданного, потому что границу исключаем.'''

[[exercises]]
name = "coll_q2"
kind = "question"
question.ru = '''Что напечатает программа?
```rust
use std::collections::BTreeMap;
use std::ops::Bound::{Excluded, Unbounded};

let m: BTreeMap<u32, char> = [(1, 'a'), (3, 'b'), (5, 'c'), (7, 'd')].into();
let a: Vec<u32> = m.range(3..7).map(|(k, _)| *k).collect();
let b: Vec<u32> = m.range(..=3).rev().map(|(k, _)| *k).collect();
let c: Vec<u32> = m.range((Excluded(3), Unbounded)).map(|(k, _)| *k).collect();
println!("{a:?} {b:?} {c:?}");
```'''
options.ru = [
  "[3, 5] [3, 1] [5, 7]",
  "[3, 5, 7] [1, 3] [3, 5, 7]",
  "[3, 5] [1, 3] [5, 7]",
  "[5] [3, 1] [5]",
]
answer = [0]
explain.ru = '''`3..7` включает 3 и исключает 7: `[3, 5]`. `..=3` включает 3, а `.rev()` разворачивает: `[3, 1]`. Пара `(Excluded(3), Unbounded)` это «строго больше 3» без верхней границы: `[5, 7]`. Только такая запись даёт исключённое начало.'''
hint.ru = '''Для каждого диапазона отметь, входят ли границы, и не забудь про `.rev()`.'''

[[exercises]]
name = "coll8"
style = "bughunt"
hint.ru = [
  '''Пройди пример на бумаге: страница отдала `(30, 7)` последним, это курсор. Какие ключи вернёт `range(..=курсор)`? Сколько раз встретится `(30, 7)`?''',
  '''Исключённая верхняя граница получается у `..курсор`. Для исключённой нижней границы у короткой записи `a..` аналога нет, нужна пара `Bound`.''',
  '''`feed.range(..c)` для страницы и `feed.range((Bound::Excluded(last_seen), Bound::Unbounded))` для опроса.''',
]
why.ru = '''Курсор это уже виденный пост, поэтому границы с ним исключающие в обе стороны: страница берёт всё строго меньше, опрос строго больше. Включённая граница даёт по повтору на каждом стыке страниц. Дело не во времени: на составном ключе `(время, id)` посты с одним временем не склеиваются, и курсор указывает на конкретный пост.'''

[[exercises]]
name = "coll9"
style = "todo"
hint.ru = '''Двусторонняя очередь `VecDeque` умеет `push_back`, `push_front`, `pop_front`, `pop_back`. Для буфера последних событий важно не забыть про ёмкость 0 и про «просили больше, чем есть».'''
why.ru = '''Возврат неудавшегося сообщения на голову (`push_front`) сохраняет его место: иначе повторная доставка уходила бы за все новые. У `Vec` та же операция сдвигала бы все элементы. Буфер последних событий вытесняет `pop_front` перед `push_back`, а нулевую ёмкость проверяет отдельно: иначе `pop_front` на пустой очереди ничего не вытеснит, а `push_back` всё равно положит элемент.'''

[[exercises]]
name = "coll10"
style = "todo"
hint.ru = [
  '''`BinaryHeap` отдаёт наибольший элемент. Для приоритета это годится, а как сделать, чтобы среди равных первым шёл более ранний?''',
  '''В кортеж `(приоритет, Reverse(номер), текст)` номер приходит в обратном порядке: меньший номер считается большим. Планировщик хранит `Reverse((время, id))`.''',
  '''`pop_due`: смотри `peek`, пока время не больше `now`, снимай `pop` и копи id. Остановись на первом неготовом.''',
]
why.ru = '''Куча упорядочена по наибольшему, и `Reverse` переворачивает сравнение без новых типов. Номер прихода превращает «одинаково важные» в строго упорядоченные, поэтому порядок среди равных предсказуем. `pop_due` зависит от того, что куча отдаёт самые ранние первыми: достаточно остановиться на первом, кто ещё не наступил.'''

[[exercises]]
name = "coll_q3"
kind = "question"
question.ru = '''Что напечатает программа?
```rust
use std::cmp::Reverse;
use std::collections::BinaryHeap;

let mut h = BinaryHeap::new();
for x in [5, 1, 8, 3] {
    h.push(Reverse(x));
}
let a = h.pop().unwrap().0;
let b = h.peek().unwrap().0;
println!("{a} {b} {}", h.len());
```'''
options.ru = [
  "8 5 3",
  "1 3 3",
  "1 5 3",
  "8 5 4",
]
answer = [1]
explain.ru = '''`Reverse` переворачивает сравнение, поэтому наибольшим для кучи считается наименьшее число. `pop` отдаёт 1, после него вершина 3 (меньшая из 5, 8, 3), и осталось три элемента. Итого `1 3 3`. Не забудь про `.0`: внутри `Reverse` обёрнутое число.'''
hint.ru = '''Какой элемент куча считает наибольшим, когда все значения обёрнуты в `Reverse`?'''

[[exercises]]
name = "coll11"
style = "fix"
hint.ru = [
  '''Выпиши, что остаётся в куче после каждого `push`, если куча отдаёт наибольшее, а выкидывать надо наименьшее.''',
  '''Выкидывать надо самый слабый, а куча всегда отдаёт самый сильный. Значит, ей нужен обратный порядок: оберни элементы в `Reverse`.''',
  '''Хранилище `BinaryHeap<Reverse<(u32, Reverse<u64>)>>`: вершина это самый слабый кандидат. `ranked`: `into_sorted_vec` по возрастанию `Reverse` даёт лучших первыми.''',
]
why.ru = '''Для «топ N» нужна куча, обратная желаемому порядку: её вершина это худший из лучших, и именно его выбрасывают, когда пришёл кто-то лучше. Тогда размер ограничен `n`, а каждый элемент стоит логарифм от `n`. Максимальная куча здесь выкидывала бы победителей. Равенство лайков решает вложенный `Reverse(id)`: у равных выбывает больший id.'''

[[exercises]]
name = "coll12"
style = "todo"
hint.ru = [
  '''Если упорядочить по полям в порядке объявления через `derive`, сначала сравнится имя. Тебе нужен другой порядок критериев, а у `bool` и чисел «лучше» значит «больше». Как перевернуть сравнение двух чисел?''',
  '''`other.verified.cmp(&self.verified)` ставит `true` впереди. Дальше цепочка: `.then_with(|| other.followers.cmp(&self.followers))` и `.then_with(|| self.name.cmp(&other.name))`.''',
  '''`partial_cmp` это `Some(self.cmp(other))`. Так у типа не бывает двух порядков.''',
]
why.ru = '''`then_with` вызывает следующий критерий только при равенстве предыдущего. Порядок «лучшие первыми» получается переворотом аргументов у критериев, где больше значит лучше. Последний критерий, имя, делает порядок полным: `cmp` возвращает `Equal` только для одинаковых людей, как и `==`. `PartialOrd` делегирует в `Ord`, чтобы два порядка не разошлись.'''

[[exercises]]
name = "coll_q4"
kind = "question"
question.ru = '''После сортировки кто окажется первым?
```rust
#[derive(PartialEq, Eq, PartialOrd, Ord, Debug)]
struct User {
    verified: bool,
    followers: u32,
    name: &'static str,
}

let mut v = vec![
    User { verified: true, followers: 5, name: "a" },
    User { verified: false, followers: 900, name: "b" },
    User { verified: true, followers: 70, name: "c" },
];
v.sort();
println!("{}", v[0].name);
```'''
options.ru = [
  "a",
  "b",
  "c",
  "зависит от версии компилятора",
]
answer = [1]
explain.ru = '''`derive(Ord)` сравнивает поля по порядку объявления, а `false < true`, так что первым идёт непроверенный `b`, хотя подписчиков у него больше всех. «Лучший первым» `derive` не даёт: для такого порядка пишут `cmp` руками, разворачивая критерии, где большее значит лучшее.'''
hint.ru = '''Какие поля сравнятся первыми и что меньше: `false` или `true`?'''

[[exercises]]
name = "coll13"
style = "fix"
hint.ru = [
  '''Что делает `partial_cmp().unwrap()` с парой, где один из `f64` это NaN? Сколько мест в файле так делают?''',
  '''У `f64` есть `total_cmp`, полный порядок, но NaN в нём не обязательно оказывается там, где нужно. Здесь в конце. Придётся проверить `is_nan` отдельно.''',
  '''Для `rank`: разбери четыре случая пары (NaN, не NaN) и упорядочи вне NaN через `b.score.total_cmp(&a.score)`. `sort_by` устойчивый, равные не переставит. Для `best` сначала отфильтруй NaN.''',
]
why.ru = '''`partial_cmp` возвращает `None`, когда сравнить нельзя, и `unwrap` превращает пользовательские данные в панику. `total_cmp` полный порядок, но он ставит положительный NaN выше всех, а для рейтинга по убыванию это означало бы «NaN первый». Поэтому NaN обрабатываются явным `is_nan`. Устойчивая сортировка сохраняет прежний порядок равных, и это тоже часть контракта.'''

[[exercises]]
name = "coll14"
style = "scratch"
hint.ru = [
  '''Равенство без учёта регистра и хеш должны смотреть на одно и то же. Что общего у «ÄRGER» и «ärger»?''',
  '''Переведи символы в нижний регистр одним способом и в `eq`, и в `hash`: `chars().flat_map(char::to_lowercase)`. В `eq` сравни два таких итератора методом `Iterator::eq`.''',
  '''В `hash` пройди по тем же символам и вызови `c.hash(state)` для каждого.''',
]
why.ru = '''Закон один: если `a == b`, то хеши равны. Поэтому у `eq` и `hash` общий источник данных, нормализованные символы. Сравнивать `eq_ignore_ascii_case` а хешировать оригинал нельзя: равные ники получат разные хеши, и карта потеряет ключ. `to_lowercase` у `char` возвращает итератор, потому что одна буква иногда превращается в несколько.'''

[[exercises]]
name = "coll15"
style = "bughunt"
hint.ru = [
  '''Какой закон связывает `PartialEq` и `Hash`? Прочитай, что выводит `derive(Hash)` для этой структуры.''',
  '''`derive(Hash)` хеширует все поля, а равенство смотрит только на `id`. Равные по `eq` посты получают разные хеши.''',
  '''Убери `Hash` из `derive` и напиши свой `impl Hash`, который хеширует только `id`.''',
]
why.ru = '''Равенство и хеш обязаны смотреть на один и тот же набор данных: из `a == b` следует `hash(a) == hash(b)`. Нарушенный закон не ловится компилятором, а карта начинает вести себя по-разному в зависимости от зерна и размера таблицы. Честная замена `derive` двумя строками исправляет ошибку, и тест с пустышкой с тем же `id` ловит её надёжно.'''

[[exercises]]
name = "coll_q5"
kind = "question"
question.ru = '''Что можно утверждать про эту программу?
```rust
use std::collections::HashSet;
use std::hash::{Hash, Hasher};

struct Key(u32, u32);
impl PartialEq for Key {
    fn eq(&self, o: &Key) -> bool { self.0 == o.0 }
}
impl Eq for Key {}
impl Hash for Key {
    fn hash<H: Hasher>(&self, s: &mut H) { self.0.hash(s); self.1.hash(s); }
}

let mut set = HashSet::new();
set.insert(Key(1, 1));
let second = set.insert(Key(1, 2));
println!("{second}");
```'''
options.ru = [
  "всегда `false`: ключи равны по `eq`",
  "всегда `true`: хеши отличаются",
  "нельзя сказать заранее: контракт нарушен, результат зависит от внутреннего устройства таблицы",
  "не соберётся: у `Key` нет `Clone`",
]
answer = [2]
explain.ru = '''Программа соберётся, но закон «равные ключи имеют равные хеши» нарушен. Карта сначала выбирает ячейку по хешу и только потом сравнивает `eq`. Чаще всего ключи окажутся в разных ячейках и `insert` вернёт `true`, но при совпадении ячеек будет `false`. Положиться нельзя, и в разных запусках результат может отличаться.'''
hint.ru = '''Что карта делает раньше: сравнивает `eq` или считает хеш?'''

[[exercises]]
name = "coll16"
style = "todo"
hint.ru = [
  '''Метод `get` принимает `&Q`, где ключ реализует `Borrow<Q>`. Что должен реализовать `Tag`, чтобы подошёл `&str`? А для `Vec<S>` и среза `&[S]` реализация уже есть.''',
  '''`impl Borrow<str> for Tag`: вернуть `&self.0`. Хеш `Tag` и хеш `str` совпадают, потому что `derive(Hash)` для обёртки хеширует строку.''',
  '''`self.posts.get(tag)` с `&str` напрямую, `contains_key(tag)`, и `self.map.get(path)` со срезом.''',
]
why.ru = '''`Borrow` обещает, что ключ и его «заимствованный вид» равны и хешируются одинаково, поэтому карта может искать по нему, не строя ключ. Обёртка `Tag(String)` с `derive(Hash)` хеширует внутреннюю строку, как сам `str`, и закон соблюдён. Пересборка ключа ради поиска не меняет ответ, но выделяет память на каждый запрос, что тест и считает.'''

[[exercises]]
name = "coll_q6"
kind = "question"
question.ru = '''Какие вызовы соберутся?
```rust
use std::collections::HashMap;

let words: HashMap<String, u32> = HashMap::new();
let paths: HashMap<Vec<u8>, u32> = HashMap::new();
let ids: HashMap<u32, &str> = HashMap::new();
```'''
options.ru = [
  "`words.get(\"rust\")`",
  "`paths.get(&[1u8, 2][..])`",
  "`ids.get(\"rust\")`",
  "`words.get(&5)`",
]
answer = [0, 1]
explain.ru = '''`String: Borrow<str>`, поэтому поиск по `&str` работает. `Vec<u8>: Borrow<[u8]>`, поэтому поиск по срезу тоже. У `u32` нет `Borrow<str>`, а у `String` нет `Borrow<i32>`: типы поиска должны быть заимствованными видами ключа.'''
hint.ru = '''Какой «заимствованный вид» у `String` и у `Vec<u8>`?'''

[[exercises]]
name = "coll17"
style = "todo"
hint.ru = [
  '''Профиль: три критерия. Какой тип ключа умеет сравниваться как кортеж и как перевернуть сортировку по убыванию в `sort_by_key`?''',
  '''`sort_by_key(|p| (Reverse(p.likes), Reverse(p.created), p.id))`. Для сводки подойдёт та же сортировка с одним ключом, но она обязана быть устойчивой.''',
  '''Дорогой ключ считай через `sort_by_cached_key`: он вычисляет ключ по разу на элемент и хранит.''',
]
why.ru = '''`sort_by_key` вычисляет ключ при каждом сравнении, примерно `n log n` раз; `sort_by_cached_key` считает один раз на элемент, поэтому он выигрывает, когда ключ это строка или тяжёлый расчёт. `sort` и `sort_by_key` устойчивые, `sort_unstable*` нет: на десятках элементов разница не видна, а на сотнях равные начинают прыгать, и страница при обновлении меняет порядок.'''

[[exercises]]
