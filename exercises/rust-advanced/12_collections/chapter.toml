]
why.ru = '''Хранилище это набор индексов, согласованных одним правилом: любое изменение поста снимает старые следы и ставит новые. Страницы по составному ключу `(время, id)` стабильны и не теряют посты с одинаковым временем. Тренды на min-куче размера `n` не растут вместе с числом постов, а `Reverse(id)` делает порядок среди равных детерминированным.'''
