[[exercises]]
name = "ntsv1"
style = "todo"
hint.ru = """В цикле: `let (stream, _) = listener.accept().await?;`, затем `tokio::spawn(async move { ... echo(stream) ... })`. Задачу не ждём, accept сразу идёт на новый круг."""
why.ru = """Пока `echo` обслуживает первого клиента, accept не вызывается, и второй ждёт в очереди ядра. `spawn` отдаёт соединение отдельной задаче, а цикл возвращается к accept за микросекунды. Результат `echo` нам не нужен: клиент ушёл, сообщать некому, и ошибка одного соединения не должна ничего останавливать (об этом следующая задача)."""

[[exercises]]
name = "ntsv2"
style = "bughunt"
hint.ru = [
  """Что происходит с `serve`, когда `handle` возвращает ошибку? Посмотри на знак `?` после `handle(stream).await`.""",
  """Ошибка и паника обработчика не должны выходить за пределы его соединения. Для этого обработчик живёт в своей задаче.""",
  """`tokio::spawn(async move { if let Err(e) = handle(stream).await { eprintln!(...) } })`. Паника внутри задачи не трогает остальные: tokio ловит её на границе задачи.""",
]
why.ru = """`?` после `handle` выносит ошибку одного клиента из цикла и заканчивает `serve`: сервер перестаёт принимать всех, потому что один прислал мусор. Это самый частый баг первых серверов. Правило: `?` допустимо на самом `accept` (и то с оговорками, см. следующую задачу), но не на обработке соединения. Задача с `spawn` заодно изолирует панику: JoinHandle вернёт ошибку, а цикл accept даже не заметит."""

[[exercises]]
name = "ntsv3"
style = "todo"
hint.ru = [
  """Сначала `is_temporary`: подойдёт `matches!` по `e.raw_os_error()` (23 и 24, это ENFILE и EMFILE) и по `e.kind()` (ConnectionAborted, ConnectionReset и подобные).""",
  """В цикле `match acceptor.accept().await`: `Ok` отдай в `on_conn`, временная ошибка это `tokio::time::sleep(backoff).await`, остальные верни через `return Err(e)`.""",
]
why.ru = """Кончились дескрипторы это не повод умирать: клиенты уйдут, и место появится. Но сразу звать accept снова нельзя: он тут же вернёт ту же ошибку, и цикл превратится в горячий, который съест процессор ровно тогда, когда машине и так плохо. Пауза разрывает этот круг. Постоянные ошибки (не те права, сломанный сокет) пауза не вылечит, их возвращаем наружу. Трейт `Accept` позволяет проверить всё это без настоящего EMFILE."""

[[exercises]]
name = "ntsv4"
style = "todo"
hint.ru = [
  """Для общего S читать и писать одновременно из одной переменной нельзя. `tokio::io::split(stream)` разделит её на две половинки.""",
  """Чтение: `BufReader::new(reader).lines()` и цикл `while let Some(line) = lines.next_line().await?`. Ответ формируй через `match` по строке и пиши `write_all`.""",
]
why.ru = """Функция, которой нужен только «поток байтов», не должна принимать `TcpStream`. Обобщение по `AsyncRead + AsyncWrite` даёт тесты на `duplex` без сети: быстрые, без портов и без таймаутов. А ещё то же самое потом пригодится для TLS, где поверх сокета лежит шифрованный слой, а обработчик не меняется. `split` (в отличие от `into_split`) работает для любого S, но половинки хранят общий замок, так что для сокета ниже есть дешёвый способ."""

[[exercises]]
name = "ntsv5"
style = "todo"
hint.ru = [
  """Читать и писать нужно одновременно, значит нужны два владельца: `stream.into_split()` отдаёт две независимые половинки.""",
  """Запись (с паузами между tick) отправь в `tokio::spawn`, чтение (`read_to_end`) оставь в текущей задаче. После цикла tick не забудь `writer.shutdown()`.""",
  """В конце дождись задачу записи через `sender.await`: её результат два уровня (`JoinError` и `io::Error`), оба разверни `?`.""",
]
why.ru = """Половинки из `into_split` владеют сокетом независимо и могут жить в разных задачах, поэтому чтение не мешает записи. Если вести их по очереди, сервер и клиент, которые ждут друг друга, замирают: клиент хочет tick раньше, чем закроет запись, а сервер хочет EOF раньше, чем начнёт писать. `shutdown` в конце записи сообщает клиенту, что tick больше не будет."""

[[exercises]]
name = "ntsv_q1"
kind = "question"
question.ru = """Лимит 100 соединений. Автор написал так:

```rust
loop {
    let (stream, _) = listener.accept().await?;
    let permit = semaphore.clone().acquire_owned().await?;
    tokio::spawn(async move {
        handle(stream).await;
        drop(permit);
    });
}
```

Что произойдёт, когда одновременно придёт 10 000 клиентов?"""
options.ru = [
  "Первые 100 будут обслужены, остальные получат ConnectionRefused",
  "Сервер примет все 10 000 в сокеты (дескрипторы и память заняты), а обслуживать будет по 100. Лимит не защитил главный ресурс",
  "Сервер примет только 100, остальные подождут в очереди ядра, это и есть смысл лимита",
  "Не скомпилируется: permit нельзя отправлять в задачу",
]
answer = [1]
explain.ru = """Здесь accept стоит перед acquire. После accept у сервера уже есть сокет (дескриптор, буферы в ядре), и ждёт permit уже принятое соединение, а цикл повисает на acquire и дальше не принимает. Но сокеты в очереди и так заняли ресурсы, а клиенты, чьё соединение принято, считают, что их обслуживают. Правильно брать permit до accept: пока места нет, лишние клиенты остаются в очереди ядра (backlog), у них уже есть тайм-аут клиента, а у сервера нет ни дескрипторов, ни буферов под них."""
hint.ru = "Что сервер уже получил от ядра к моменту, когда начинает ждать permit?"

[[exercises]]
name = "ntsv_q2"
kind = "question"
question.ru = """Что из этого верно про `select!` и `read_exact`?

```rust
tokio::select! {
    r = stream.read_exact(&mut buf) => { ... }
    _ = tokio::time::sleep(Duration::from_secs(1)) => { ... }
}
```

В `buf` на 8 байт уже пришли 5, и сработал таймер."""
options.ru = [
  "Пять уже прочитанных байтов останутся в сокете, и следующий read_exact получит их заново",
  "Пять уже прочитанных байтов потеряны: read_exact не безопасен к отмене. Нужен read, который сам хранит прогресс в твоём буфере",
  "select! дождётся окончания read_exact и только потом проверит таймер",
  "Паника: select! нельзя использовать с сокетами",
]
answer = [1]
explain.ru = """Когда ветка select! проигрывает, её future просто выбрасывается. У `read_exact` частично прочитанные данные лежат в состоянии future, и вместе с ним исчезают: из сокета они уже вынуты, обратно не вернуть. Безопасные к отмене операции (`read`, `recv`, `accept`, `Lines::next_line`) либо ничего не забирают до готовности, либо хранят прогресс снаружи. Вывод: в select! ставь `read`, а накопление в нужный размер делай сам, в цикле. Документация tokio описывает безопасность к отмене у каждого метода."""
hint.ru = "Куда деваются данные, которые future уже вынул из сокета, если его выбросили?"

[[exercises]]
name = "ntsv6"
style = "todo"
hint.ru = [
  """Сокет одолжен, `into_split` недоступен. Для заимствованных половинок есть `stream.split()`. Таймер: `tokio::time::interval(every)`.""",
  """Первый `tick()` у `interval` срабатывает сразу, дождись его один раз до цикла. В цикле `tokio::select!` с двумя ветками: `reader.read(&mut buf)` и `ticker.tick()`.""",
  """Запись делай внутри обработчиков веток, а не в самом выражении select!: там половинка писателя не конфликтует с половинкой читателя.""",
]
why.ru = """Если соединение целиком живёт в одной задаче, `spawn` не нужен: две заимствованные половинки и `select!` делают то же без лишних аллокаций и без передачи владения. В select! стоит именно `read` (безопасный к отмене), поэтому ни один байт не теряется, когда побеждает таймер. Запись выполняется в теле ветки, когда ни одна из future уже не борется за сокет."""

[[exercises]]
name = "ntsv7"
style = "scratch"
hint.ru = [
  """Нужен канал `mpsc::channel::<String>(32)` и задача, которая крутится на `rx.recv().await`. Писателя перемести в задачу (`async move`).""",
  """Цикл: `while let Some(mut line) = rx.recv().await { line.push('\\n'); writer.write_all(line.as_bytes()).await?; }`, после цикла `writer.shutdown().await`. Верни `(tx, handle)`.""",
  """Если запись упала, задача заканчивается через `?`, `rx` уничтожается, и у отправителей `send` начинает возвращать Err: так они узнают, что писать некуда.""",
]
why.ru = """Один владелец записи это единственный способ не перемешать строки разных задач: каждое `write_all` отправляет свою строку целиком, и между ними никто не втиснется. Канал ограничен, чтобы медленный клиент не накапливал память без предела: отправитель получает обратное давление (`send().await` ждёт). Когда writer умирает, канал закрывается, и остальной код находит об этом без отдельных флагов. Этот приём ещё не раз встретится: в чате, WebSocket-сервере и шлюзе."""

[[exercises]]
name = "ntsv8"
style = "todo"
hint.ru = [
  """`Semaphore::new(max)` в `Arc`. Разрешение берут методом `acquire_owned` у `Arc<Semaphore>` (не забудь клонировать `Arc`).""",
  """Порядок в цикле: сначала permit, потом accept. Handler лежит в `Arc` (он `Fn`, но не `Clone`), чтобы вызывать его из каждой задачи.""",
  """`tokio::spawn(async move { handler(stream).await; drop(permit); })`: permit переезжает в задачу и освобождается, когда соединение закончено.""",
]
why.ru = """Permit берётся до accept: пока мест нет, цикл стоит на acquire, а лишние клиенты остаются в очереди ядра и ничего не стоят серверу. Permit владеет задача соединения, и он возвращается сам, когда задача завершится (даже по панике, потому что Drop). Если бы permit брали после accept, сервер всё равно принял бы тысячи сокетов."""

[[exercises]]
name = "ntsv9"
style = "todo"
hint.ru = [
  """Оберни каждое чтение: `tokio::time::timeout(idle, stream.read(&mut buf)).await`. Результат двухэтажный: `Ok(read)` или `Err(Elapsed)`.""",
  """`Err(_)` это `Idle`, `Ok(Ok(0))` это `Closed`, а `Ok(Ok(n))` значит «эхо назад и снова в цикл». Таймер создаётся заново на каждом чтении, поэтому простой считается от последнего байта.""",
]
why.ru = """Таймаут на каждое чтение, а не на всё соединение: клиент, который шлёт по байту, жив, и его закрывать не надо. Так работает idle timeout в реальных серверах (keep-alive в HTTP, ping в WebSocket). Оборачивать приходится именно `read`, потому что он безопасен к отмене: если время вышло, ни один байт не пропал."""

[[exercises]]
name = "ntsv10"
style = "todo"
hint.ru = [
  """У `TcpSocket` есть `new_v4` и `new_v6`, выбор по `addr.is_ipv4()`. Опции: `set_reuseaddr`, `set_nodelay`. Оба метода берут `bool`.""",
  """`listen_on`: `new_socket(addr, true, false)?`, затем `socket.bind(addr)?` и `socket.listen(backlog)`. Для клиента опции ставятся до `connect`, который тоже метод сокета.""",
]
why.ru = """Опции вроде SO_REUSEADDR действуют только до bind, поэтому для них нужен «сырой» TcpSocket, а не готовый TcpListener. Без reuseaddr сервер, который перезапустили сразу после остановки, получит AddrInUse из-за соединений в TIME_WAIT: ядро несколько минут помнит закрытые соединения (сторона, закрывшая первой). Backlog это размер очереди готовых соединений, которые ещё не взял accept. NODELAY отключает алгоритм Nagle: для интерактивных протоколов с мелкими сообщениями это почти всегда нужно."""

[[exercises]]
name = "ntsv_q3"
kind = "question"
question.ru = """Клиент отправляет серверу два мелких сообщения подряд по одному байту (`write_all(b"a")`, затем `write_all(b"b")`), `TCP_NODELAY` выключен, а сервер отвечает не сразу. Что может случиться?"""
options.ru = [
  "Оба байта всегда уходят сразу, двумя пакетами",
  "Первый байт уходит сразу, а второй может ждать, пока не придёт подтверждение (ACK) на первый: это алгоритм Nagle, а отложенный ACK на стороне сервера может растянуть паузу до десятков миллисекунд",
  "Оба байта ждут таймер и уходят вместе одним пакетом",
  "Второй байт теряется, если первый ещё не подтверждён",
]
answer = [1]
explain.ru = """Алгоритм Nagle экономит сеть: пока есть неподтверждённые данные, новые мелкие кусочки копятся в буфере. Получатель по правилу отложенного ACK ждёт до 40 мс, надеясь прицепить подтверждение к ответу. Вместе они дают паузу, которую видно в запросах «послал пару мелких, жду ответа». Для интерактивных протоколов (чат, RPC, игры) включают `TCP_NODELAY`. А для потока больших данных он не нужен: там пакеты и так полные."""
hint.ru = "Nagle не копит первый пакет, он копит следующие, пока первый не подтверждён."

[[exercises]]
name = "ntsv11"
style = "scratch"
hint.ru = [
  """Нужны `impl AsyncRead for Tap<S>` и `impl AsyncWrite for Tap<S>`. Внутренний поток вызывается через `Pin::new(&mut this.inner).poll_read(cx, buf)`. `this` получи как `self.get_mut()` (это можно, потому что `S: Unpin`).""",
  """Журналить нужно только когда внутри вернулось `Poll::Ready(Ok(..))`. Для чтения это `buf.filled()[before..]`, где `before` длина до вызова. Для записи это `buf[..n]`.""",
  """`poll_flush` и `poll_shutdown` просто передай внутрь тем же `Pin::new(&mut this.inner)`. Не забудь про shutdown: без него читатель на другом конце не получит EOF.""",
]
why.ru = """Обёртка над потоком это тот же приём, что и адаптеры итераторов: она реализует те же трейты и добавляет поведение. Тонкость одна: `poll_write` вправе принять меньше, чем предложено, и журналить надо принятые `n` байт, иначе при частичной записи одни и те же данные попадут в журнал дважды. Журналить до `Ready` тоже нельзя: `Pending` означает, что ничего не произошло. Такой Tap пригодится на отладке любого протокола из этого раздела."""

[[exercises]]
name = "ntsv_q4"
kind = "question"
question.ru = """Что случится с задачами соединений, если `main` (с `#[tokio::main]`) вернётся, пока они ещё работают, а их `JoinHandle` не сохранены?"""
options.ru = [
  "Рантайм дождётся их завершения перед выходом",
  "Задачи будут отменены вместе с рантаймом: соединения оборвутся на полуслове, без прощания с клиентами",
  "Задачи продолжат работать как фоновые потоки, процесс не завершится",
  "Паника в каждой задаче",
]
answer = [1]
explain.ru = """`tokio::spawn` не привязывает задачу к функции, которая её запустила, но привязывает к рантайму. Когда рантайм закрывается (main вернулся), все его задачи отменяются в ближайшей точке `.await`. Клиенты увидят обрыв соединения. Чтобы остановка была мягкой, сервер хранит задачи (JoinSet), перед выходом ждёт их с дедлайном и только потом возвращается из main."""
hint.ru = "К чему привязана задача: к функции, которая её создала, или к рантайму?"

[[exercises]]
name = "ntsv12"
style = "scratch"
hint.ru = [
  """Цикл с `tokio::select!`: ветка `_ = &mut shutdown => break` и ветка `listener.accept()`. Future shutdown нужно закрепить: `tokio::pin!(shutdown)`. Соединения кладутся в `JoinSet` через `conns.spawn(handler(stream))`.""",
  """Чтобы завершённые соединения не копились, добавь третью ветку: `Some(_) = conns.join_next(), if !conns.is_empty() => {}`. После цикла `drop(listener)`.""",
  """Дожитие: `timeout(grace, async { while conns.join_next().await.is_some() {} }).await`. Если вышло `Ok`, оборванных 0. Иначе запомни `conns.len()`, вызови `conns.abort_all()` и верни число.""",
]
why.ru = """Три шага мягкой остановки: перестать принимать (и закрыть порт, чтобы новые получили отказ, а не повисли в очереди), дать текущим время, оборвать упрямых. Без дедлайна один зависший клиент блокирует выкладку новой версии вечно, без прощального периода каждый деплой рвёт чьи-то запросы. JoinSet нужен, чтобы знать, сколько соединений осталось, и уметь их прервать разом. Дедлайн grace это политика: в реальных сервисах он согласован с оркестратором (kubernetes даёт 30 секунд по умолчанию)."""

[[exercises]]
name = "ntsv_q5"
kind = "question"
question.ru = """Сервер получил сигнал остановки, закрыл слушателя (`drop(listener)`) и ждёт текущие соединения. Что увидит новый клиент, который пытается подключиться в этот момент?"""
options.ru = [
  "Подключение зависнет: слушатель не закрыт, он просто перестал вызывать accept",
  "ConnectionRefused: порт закрыт, и это честный ответ для балансировщика или клиента, который попробует другой экземпляр",
  "Соединение установится, но запросы будут игнорироваться",
  "Сервер вежливо ответит «до свидания» и закроет соединение",
]
answer = [1]
explain.ru = """После закрытия слушателя в ядре нет сокета, который отвечал бы на SYN: клиенты получают Refused сразу. Это хорошо: балансировщик видит, что экземпляр не принимает, и идёт к другому. Если слушателя держать открытым, но не звать accept, клиенты ставятся в очередь ядра и висят, пока не истечёт их собственный таймаут: это хуже, потому что выглядит как зависание сервиса. Поэтому слушателя отпускают первым делом."""
hint.ru = "Есть ли в ядре сокет, который отвечает на SYN, после закрытия слушателя?"

[[exercises]]
name = "ntsv13"
style = "bughunt"
hint.ru = [
  """Сервер дожидается соединений (`conns.join_next()`), а соединению о сигнале никто не говорит. Куда в `handle` уходит `stop`?""",
  """Нужно ждать двух событий: данных от клиента и изменения `stop`. Это работа для `tokio::select!` внутри цикла `handle`.""",
  """В `select!` поставь `stream.read(&mut buf)` (безопасное к отмене) и `stop.changed()`. На второй ветке напиши `bye` и вернись из функции.""",
]
why.ru = """Сигнал, который не добрался до соединений, останавливает только accept, а ждать приходится до тех пор, пока последний клиент не уйдёт по своей воле. В исходном коде handle принимал `stop`, но не слушал его: компилятор такое не поймает. Эталон ждёт двух событий через `select!` и прощается с клиентом. Заметь: `watch` подходит для сигнала лучше канала сообщений, потому что хранит последнее значение, и опоздавший подписчик его всё равно увидит."""

[[exercises]]
name = "ntsv_chat"
kind = "project"
style = "scratch"
quiz = true
locked = ["tests/acceptance.rs"]
hint.ru = [
  """Скелет: `run` это accept-цикл с семафором (permit до accept) и `JoinSet` соединений. На каждое соединение функция `connection`, внутри которой writer-задача с каналом и цикл чтения команд.""",
  """Комната это `Arc<Mutex<HashMap<String, mpsc::Sender<String>>>>`. Рассылка через `try_send` под короткой блокировкой, без `.await` внутри. Ник занимается под одной блокировкой: проверил, отправил OK, вставил, оповестил остальных.""",
  """Остановка: `watch::channel(false)` и в каждом соединении `select!` между `lines.next_line()` и `stop.changed()`. На остановке отправь `BYE`, сними ник с комнаты (без LEAVE), дождись writer-задачу. Не забудь, что writer закроется только когда не останется ни одного отправителя, включая тот, что лежит в комнате.""",
]
why.ru = """Чат собирает все приёмы главы в одну конструкцию: задача и writer-задача на соединение, комната под коротким замком, рассылка без ожидания (медленный не тормозит быстрых), лимит permit до accept, остановка через watch. Основные ловушки: держать Mutex через await (дедлок и остановка рассылки), занимать ник в два шага (гонка за ник), забыть убрать отправителя из комнаты (канал не закрывается и writer не завершается), не отпустить слушателя (порт открыт после остановки)."""

[[exercises]]
name = "ntsv_proxy"
kind = "project"
style = "scratch"
quiz = true
locked = ["tests/acceptance.rs"]
hint.ru = [
  """Для каждого клиента: подключись к upstream, раздели оба сокета через `into_split` и запусти два одинаковых «насоса»: из читающей половины в пишущую, по одному в каждую сторону.""",
  """Насос читает порциями и пишет `write_all`. На `read == 0` он делает `shutdown` пишущей половины и завершается: так закрытие записи одной стороны становится закрытием записи в другую. Счётчик увеличивай после успешной записи.""",
  """Склей два насоса через `tokio::try_join!`: он ждёт оба, но при первой ошибке сразу бросает второй. Тогда сброс с одной стороны не оставит другую висеть. Accept-цикл как в ntsv12 (JoinSet, select с shutdown).""",
]
why.ru = """В прокси три тонких места. Half-close: если закрыть оба направления сразу при первом EOF, ответ upstream, который ещё в пути, потеряется. Если не передать EOF дальше, upstream вечно ждёт конца запроса. Ошибки: сброс на одной стороне означает, что ждать вторую бессмысленно, и `try_join!` это делает сам. Счётчики: считаем то, что реально записано, а не прочитано. `copy_bidirectional` в tokio делает ровно это, и после этой задачи ты знаешь, что внутри."""
