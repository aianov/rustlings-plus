[chapter]
title.ru = "HTTP-сервер против нагрузки и злых клиентов"

[[chapter.visuals]]
file = "visuals/keepalive_timeline.html"
title.ru = "Keep-alive: несколько запросов в одном соединении, простой, закрытие"

[[chapter.visuals]]
file = "visuals/slowloris.html"
title.ru = "Slowloris: таймаут на read против общего дедлайна"

[[chapter.visuals]]
file = "visuals/middleware_onion.html"
title.ru = "Middleware: запрос идёт сквозь слои внутрь, ответ наружу"

[[exercises]]
name = "nhr1"
style = "todo"
hint.ru = [
  """Connection может быть списком токенов (`keep-alive, Upgrade`) и встречаться несколько раз. Разбирай по запятым и сравнивай без учёта регистра.""",
  """Значение по умолчанию зависит от версии: в 1.1 соединение открыто, пока не сказали `close`; в 1.0 закрыто, пока не сказали `keep-alive`. А `close` перевешивает всё.""",
  """В `connection` нужен цикл по запросам. Не забудь сказать клиенту в ответе, что закрываешься, и подтвердить `keep-alive` для версии 1.0.""",
]
why.ru = """Решение о закрытии принимается до записи ответа, потому что оно должно попасть в его заголовки: иначе клиент узнает о закрытии только по обрыву, и запрос, отправленный на закрывающееся соединение, пропадёт. Токены `Connection` собираются со всех заголовков, потому что их может быть несколько, а `close` сильнее любого `keep-alive`. HTTP/1.0 без явного `keep-alive` закрывается потому, что в этой версии конец ответа часто определялся именно закрытием."""

[[exercises]]
name = "nhr2"
style = "scratch"
hint.ru = [
  """Один `read` может принести хвост предыдущего, несколько запросов целиком и начало следующего. Работай с накопленным `buf`: сначала проверь, нет ли в нём целого запроса, и только потом читай ещё.""",
  """Целый запрос это голова плюс столько байтов тела, сколько сказано в Content-Length. Голова может уже быть, а тело ещё нет.""",
  """Когда запрос готов, вырежи из начала `buf` ровно его байты (`drain`): остальное принадлежит следующему.""",
]
why.ru = """Буфер принадлежит соединению, а не запросу. `read_request` берёт из его начала ровно один запрос и оставляет остальное, даже если остаток это один байт. Ошибка, при которой лишнее выбрасывают, проявляется только в конвейере и только на быстрых клиентах, поэтому тест режет вход в каждой точке. Границу тела определяет Content-Length, а не содержимое: тело вполне может содержать `\\r\\n\\r\\n` и выглядеть как запрос."""

[[exercises]]
name = "nhr_q1"
kind = "question"
question.ru = """Клиент одним куском отправил три запроса подряд (конвейер): `GET /a`, потом `GET /b HTTP/9.9` (версия, которую сервер не знает) и `GET /c`. Что должен сделать сервер?"""
options.ru = [
  "Ответить на первый запрос, на второй отправить 400 и закрыть соединение: после испорченного запроса надёжно найти границу следующего нельзя",
  "Ответить на все три: 200, 400, 200. Каждый запрос независим, испорченный просто получает свою ошибку",
  "Закрыть соединение сразу, не отвечая даже на первый: пришедший кусок считается испорченным целиком",
  "Ответить на первый и третий, а второй молча пропустить: 400 клиенту не нужен",
]
answer = [0]
explain.ru = """Ответ на первый запрос уйдёт, потому что он был корректен и разобран до ошибки. Второй запрос нарушает протокол, и сервер уже не уверен, где он кончается: возможно, в нём есть тело, возможно, нет. Угадывать границу значит рисковать тем, что хвост запроса «а» превратится в запрос, которого клиент не отправлял (на этом строится контрабанда запросов). Поэтому после ошибки разбора отвечают кодом и закрывают соединение. Третий запрос клиент должен отправить заново на новом соединении."""
hint.ru = """Откуда сервер узнает, где кончился испорченный запрос?"""

[[exercises]]
name = "nhr3"
style = "todo"
hint.ru = [
  """Таймаут нужен на ожидание первого байта, а не на весь `read_request`: иначе медленный, но живой запрос закроется как простаивающий.""",
  """Если буфер пуст, прочитай первый кусок под `timeout(idle, stream.read(..))` и положи его в буфер, а уже потом зови `read_request`. Истёкший таймаут это тихий выход.""",
  """Таймер создаётся заново на каждой итерации цикла, значит, и после каждого ответа.""",
]
why.ru = """Простой и медленный запрос это разные вещи. Простой: ни одного байта, клиент ничего не просил. Медленный запрос уже занял внимание сервера, и его судьбу решает дедлайн на голову и тело (следующая задача), а не таймаут простоя. Таймер перезапускается сам собой: он создаётся заново на каждой итерации, и соединение с регулярными запросами живёт сколько угодно. Закрытие тихое: ни 408, ни другого ответа, потому что на запрос, которого не было, не отвечают."""

[[exercises]]
name = "nhr4"
style = "bughunt"
hint.ru = [
  """Что именно измеряет `timeout(patience, read)`: паузу между байтами или время от начала запроса?""",
  """Нужны две разные границы. До первого байта ждём `patience`, и это простой (`Ok(None)`). С первого байта запускаются часы дедлайна на всю голову.""",
  """На каждой итерации ждать надо не `patience`, а остаток до дедлайна: `deadline.saturating_sub(started.elapsed())`.""",
]
why.ru = """Таймаут на каждый `read` не защищает от медленного клиента: пауза между байтами остаётся маленькой, и таймер сбрасывается снова и снова. Защищает только общий дедлайн, посчитанный от первого байта (так отбиваются от slowloris). От подключения считать нельзя: честный клиент имеет право подумать перед первым запросом, а это простой, у него свой таймер. Ответ 408 отправляет вызывающий код: функция чтения сообщает причину, а не решает судьбу соединения."""

[[exercises]]
name = "nhr_q2"
kind = "question"
question.ru = """Сервер настроен так: пауза между байтами не дольше 30 секунд, вся голова запроса не дольше 10 секунд. Клиент быстро присылает голову `POST /upload` с `Content-Length: 1000`, а тело отправляет по одному байту раз в 5 секунд. Что произойдёт?"""
options.ru = [
  "Через 10 секунд дедлайн на голову сработает и клиент получит 408",
  "Через 30 секунд сработает таймаут простоя и клиент получит 408",
  "Ничего не сработает: голова уже прочитана, паузы короче 30 секунд, а тело в таком темпе придёт за 83 минуты. Не хватает дедлайна на тело",
  "Ничего страшного: запрос завершится сам, когда придёт тысячный байт, и соединение освободится",
]
answer = [2]
explain.ru = """Дедлайн на голову к этому моменту уже выполнил свою работу, голова пришла вовремя. Таймаут между байтами не срабатывает, потому что байты идут каждые 5 секунд. Получается та же атака, что и с головой, только на другом этапе: сервер держит соединение 83 минуты. Поэтому у тела тоже нужен общий дедлайн (или минимальная скорость), а последний вариант ответа и есть опасная иллюзия: «рано или поздно кончится» не защита, когда соединений ограниченное число."""
hint.ru = """Что считается от какого момента: голова, тело, пауза?"""

[[exercises]]
name = "nhr5"
style = "fix"
hint.ru = [
  """Лимиты проверяются в разных местах. Размер головы: на каждом шаге чтения, пока не пришёл конец. Длина тела: сразу после разбора головы, до чтения тела.""",
  """Голова может не поместиться двумя способами: терминатор найден, но дальше лимита, или терминатора нет, а буфер уже полон. Нужны обе проверки.""",
  """Content-Length разбирай строго: только цифры. Число, не влезающее в `usize`, это тоже слишком много (413), мусор это 400.""",
]
why.ru = """Лимит на голову проверяется по мере чтения, а не после: иначе клиент заставит копить мегабайты, прежде чем лимит вообще сработает. Длина тела проверяется до тела: пока сервер ждёт гигабайты, которые всё равно отвергнет, он тратит соединение и память. Мусорное Content-Length ни в коем случае не читается как ноль: оставшиеся байты станут началом следующего запроса, а это прямой путь к контрабанде запросов. Границы включены: ровно лимит проходит."""

[[exercises]]
name = "nhr6"
style = "scratch"
hint.ru = [
  """У `read_line` нет предела длины: она прочитает хоть гигабайт. Ограничь чтение: прочитай через `take` не больше `MAX_LINE` байт (с запасом в один, чтобы отличить строку ровно в предел от обрезанной) и `read_until`.""",
  """Размер куска проверяй сразу после разбора числа, до `read_exact`. Сравнение `size > max_body - body.len()` не переполняется, в отличие от сложения.""",
  """Порядок такой: строка размера, данные ровно `size` байт, ровно `\\r\\n`. Размер ноль переходит к трейлерам: читай строки до пустой, но не больше MAX_TRAILERS.""",
]
why.ru = """Декодер, читающий из потока, не знает, сколько данных ещё будет, поэтому каждый размер из сети проверяется до того, как под него что-то выделено или прочитано. Лимит ставится на сумму, а не на кусок, иначе тысяча кусков по лимиту обходит ограничение. Ограничить нужно и длину строки (`take`), и число трейлеров: бесконечная строка или бесконечные заголовки в хвосте тоже забирают память."""

[[exercises]]
name = "nhr7"
style = "todo"
hint.ru = [
  """Решение принимается после головы и до тела. Сначала длина: если она больше лимита, отвечай 413 и не зови 100.""",
  """Для `Expect: 100-continue` отправь `HTTP/1.1 100 Continue\\r\\n\\r\\n` до `read_body`. Это промежуточный ответ, за ним всё равно придёт настоящий.""",
  """Если тело уже лежит в буфере, клиент не ждал и 100 слать поздно. Любое другое значение Expect это 417.""",
]
why.ru = """100 Continue отвечает на вопрос клиента «стоит ли слать тело». Поэтому отказ по размеру или по неизвестному ожиданию идёт вместо него, а не после: иначе клиент уже отправил бы гигабайты. После промежуточного ответа настоящий всё равно будет. Если тело уже пришло, вопрос снят. При отказе соединение закрывается, потому что клиент мог отправить тело всё равно, и оно осталось бы в потоке мусором, который прочитался бы как следующий запрос."""

[[exercises]]
name = "nhr_q3"
kind = "question"
question.ru = """Клиент отправил на сервер `POST /backup` с `Expect: 100-continue` и `Content-Length: 52428800` (50 МБ), а лимит сервера 1 МБ. Что делает сервер?"""
options.ru = [
  "Присылает 100 Continue, читает 50 МБ и выбрасывает, потом отвечает 413: так соединение остаётся чистым",
  "Отвечает 413 и оставляет соединение для следующего запроса: раз 100 не получено, тело клиент не отправлял",
  "Отвечает 413 и закрывает соединение: клиент вправе был отправить тело, не дожидаясь, и оно испортило бы следующий запрос",
  "Отвечает 400: слишком большая длина это ошибка синтаксиса, а не размера",
]
answer = [2]
explain.ru = """Отказ идёт вместо 100 Continue, и клиент, получивший финальный ответ, тело не отправляет (если он вежливый). Но вежливость нельзя предполагать: клиент мог не ждать (так делает curl через секунду). Тогда 50 МБ окажутся в потоке сразу за ответом, и если соединение оставить открытым, сервер прочитает их как начало следующего запроса. Закрытие соединения после отказа это дешёвая страховка. Читать и выбрасывать 50 МБ значит тратить именно то, ради чего ставили лимит."""
hint.ru = """Что, если клиент отправил тело, не дожидаясь ответа?"""

[[exercises]]
name = "nhr8"
style = "scratch"
hint.ru = [
  """Заголовки без Content-Length, но с `Transfer-Encoding: chunked`. Тело потом строится из кусков.""",
  """Кусок это `format!("{:x}\\r\\n", len)`, данные и `\\r\\n`, лучше собрать в один буфер. Пустой кусок пропусти: его размер ноль, а ноль закрывает тело.""",
  """После каждого куска делай `flush`: писатель может буферизовать, и клиент увидит кусок только в самом конце.""",
]
why.ru = """Chunked существует ради тела, длину которого пока никто не знает. Поэтому кусок должен доходить до клиента сразу: промежуточный буфер, который ждёт конца потока, превращает потоковый ответ в обычный с задержкой. Размер пишется в hex, нулевой кусок закрывает тело. Пустой кусок из канала нельзя отправлять как есть: размер ноль означает конец, и клиент решит, что ответ закончился, пока данные ещё идут. Ошибка записи возвращается наружу: клиент ушёл, и источник данных можно остановить."""

[[exercises]]
name = "nhr9"
style = "scratch"
hint.ru = [
  """Слой это функция `Handler -> Handler`. Внутри `handler(move |request| ...)` клонируй `next` и всё общее: замыкание вызывается на каждый запрос.""",
  """`apply` оборачивает `inner` слоями с конца списка (`iter().rev()`), тогда первый слой оказывается самым внешним.""",
  """Время измеряй `tokio::time::Instant` до вызова `next` и после. Заголовок добавляй в ответ, который вернул `next`.""",
]
why.ru = """Слой не знает, что внутри: другой слой или конечный обработчик. Поэтому слои составляются как матрёшка, и порядок решает всё. Первый в списке самый внешний: его код «до» выполняется первым, код «после» последним. Клоны `next` и общего состояния внутри замыкания нужны потому, что слой вызывается на каждый запрос, а async-блок забирает свои переменные."""

[[exercises]]
name = "nhr10"
style = "todo"
hint.ru = [
  """Слой может не вызывать `next` вообще: просто верни свой `Response`.""",
  """Начни с `remove_header("X-User")` на любом пути, даже открытом: заголовок, пришедший от клиента, не должен дойти до обработчика.""",
  """Токен из `Authorization`: `split_once(' ')`, схема без учёта регистра, токен через `trim`. Нашёл в таблице: `set_header("X-User", имя)`.""",
]
why.ru = """Идентификатор пользователя в заголовке работает как внутренний канал: обработчики ему доверяют. Значит, слой, который его ставит, обязан сначала стереть любую подделку, включая открытые пути, на которых он сам ничего не ставит. Ответ 401 слой отдаёт сам и обработчика не вызывает. `WWW-Authenticate` сообщает клиенту, какую схему ждут."""

[[exercises]]
name = "nhr11"
style = "bughunt"
hint.ru = [
  """Выпиши требования: журнал должен видеть 401 и 500, замер должен видеть 401, обработчик закрыт токеном. Кто тогда стоит снаружи кого?""",
  """Журналу нужно видеть то, что вернул слой внутри него. Значит, `recover` и `auth` должны быть внутри `access_log`.""",
  """`recover` должен быть внутри журнала, но снаружи от всего, что может паниковать. Помни: первый в списке самый внешний.""",
]
why.ru = """Порядок слоёв это порядок вопросов, которые задаются запросу: тот, кто снаружи, видит итог всех внутренних. Журнал и замер хотят видеть всё, поэтому стоят снаружи. `recover` превращает панику в ответ, поэтому он должен стоять внутри журнала (иначе паника убьёт журнал вместе с обработчиком), но снаружи от всего, что может паниковать. Проверка токена стоит внутри: её отказ выглядит как обычный ответ для всех, кто снаружи."""

[[exercises]]
name = "nhr_q4"
kind = "question"
question.ru = """Слои `a`, `b`, `c` (первый в списке самый внешний) устроены так:

```rust
// a и c:
println!("{name} in");
let response = next(request).await;
println!("{name} out");
response

// b:
println!("b in");
if request.header("Authorization").is_none() {
    return Response::new(401, "no");
}
let response = next(request).await;
println!("b out");
response
```
Что напечатает запрос без заголовка Authorization?"""
options.ru = [
  "a in, b in, c in, handler, c out, b out, a out",
  "a in, b in, b out, a out",
  "a in, b in, a out",
  "b in, a in, a out",
]
answer = [2]
explain.ru = """Запрос заходит в `a` (печатает `a in`), оттуда в `b` (`b in`). У `b` нет заголовка, и он возвращает 401, не вызывая `next`: до `c` и обработчика дело не доходит, и строка `b out` не печатается, потому что она стоит после вызова `next`. Ответ 401 возвращается в `a`, тот печатает `a out` и отдаёт его наружу. Вот почему журнал, стоящий снаружи, видит отказы, а журнал внутри проверки не увидит."""
hint.ru = """Какие строки стоят после вызова `next`?"""

[[exercises]]
name = "nhr12"
style = "scratch"
hint.ru = [
  """Два сигнала: `shutdown` для самого `serve` и `watch::channel(false)` для соединений. После сигнала закрой слушатель (`drop(listener)`).""",
  """Соединению нужно ждать сразу двух событий: прихода первого байта (`stream.readable()`) и `stop.changed()`. Для этого `select!`.""",
  """Запрос в работе не прерывай: допиши ответ с `Connection: close` и выйди. Флаг остановки смотри после обработчика, а не до него: сигнал мог прийти, пока тот работал. `serve` дожидается соединений через `JoinSet` и `join_next`.""",
]
why.ru = """Остановка состоит из четырёх шагов, и порядок важен. Сначала порт закрывается, потому что новый клиент теперь только обманется. Потом простаивающие соединения закрываются сразу: запросов у них нет, ждать нечего. Запрос в работе дописывается и объявляет закрытие (`Connection: close`), чтобы клиент не слал следующий. Наконец `serve` ждёт всех: иначе процесс выйдет, оборвав ответы. Оставшиеся без владельца задачи при выходе из `main` просто обрываются."""

[[exercises]]
name = "nhr_q5"
kind = "question"
question.ru = """Сервер закрывает простаивающие keep-alive соединения через 5 секунд. Клиент отправил на такое соединение запрос ровно в тот момент, когда сервер его закрыл. Что увидит клиент и как ему правильно поступить?"""
options.ru = [
  "Получит ответ 408: сервер всегда отвечает на запрос, даже закрывая соединение",
  "Получит сброс соединения и может безопасно повторить любой запрос: сервер ничего не успел обработать",
  "Ничего не заметит: сервер дочитает пришедший запрос и ответит, прежде чем закрыться",
  "Получит обрыв без ответа. Повторить на новом соединении безопасно только идемпотентный запрос (GET), а POST мог уже выполниться",
]
answer = [3]
explain.ru = """Гонка неизбежна: пока запрос летел по сети, сервер закрыл соединение. Клиент видит обрыв и не знает, получил ли сервер его запрос и успел ли обработать. Для GET это неважно (повтор ничего не испортит), а повтор POST мог бы создать заказ дважды. Поэтому клиентские библиотеки повторяют запрос на свежем соединении только когда он идемпотентен и сервер не ответил ни байтом. Серверам это тоже подсказка: закрывать простаивающие соединения стоит с запасом (чуть раньше, чем клиент считает соединение живым) и сообщать Keep-Alive: timeout=N."""
hint.ru = """Знает ли клиент, успел ли сервер обработать запрос?"""

[[exercises]]
name = "nhr13"
style = "fix"
hint.ru = [
  """Склей голову и тело в один `Vec<u8>` и сделай один `write_all`.""",
  """Для HEAD не добавляй тело в буфер, но `Content-Length` оставь по настоящему телу.""",
]
why.ru = """Каждый `write_all` на сокете это системный вызов и обычно отдельный пакет. Голова одним пакетом, тело другим: клиент может увидеть голову и ждать тело, а Nagle вместе с отложенным ACK добавят задержку в десятки миллисекунд. Один буфер стоит одной копии тела, что почти всегда дешевле. Для больших тел (файлы) копию избегают другими способами, но для JSON-ответов API одна запись правильный выбор."""

[[exercises]]
name = "nhr_engine"
kind = "project"
style = "scratch"
locked = ["tests/acceptance.rs", "tests/part1.rs"]
quiz = true
hint.ru = [
  """Скелет соединения: цикл, в начале которого `next_request` (читает из `buf` и сокета, возвращает запрос, закрытие или отказ), потом `run_handler`, потом `write_response`. Остаток запроса остаётся в `buf` для следующей итерации.""",
  """`next_request`: разбор головы через `parse_head`, затем `parse_request`. Дедлайн зависит от стадии: простой (`idle_timeout`, пока буфер пуст), голова (`head_timeout` от первого байта), тело (`body_timeout` от конца головы). Ждёшь через `select!` между `read`, `sleep_until(дедлайн)` и (только в простое) `stop.changed()`. `100 Continue` отправляй один раз, пока тело не пришло целиком.""",
  """`serve_with`: на каждый цикл сначала `acquire_owned` у семафора (лимит соединений), потом `accept`, оба внутри `select!` с `shutdown`. После выхода из цикла закрой слушатель, пошли сигнал соединениям и дождись `JoinSet` в пределах `drain_timeout`. `write_response` для потока пишет голову с `Transfer-Encoding: chunked`, потом каждый непустой кусок одной записью. Голову собери через `to_bytes(true)` до того, как забрал `stream`: без потока `to_bytes` решит, что у ответа есть длина.""",
]
why.ru = """Все четыре задачи сервера сходятся в одном месте: `next_request`. Он различает простой, медленную голову и медленное тело, потому что у них разные дедлайны и разные ответы (тихое закрытие и 408). Лимиты срабатывают раньше данных, `100 Continue` идёт после проверок, а остаток буфера бережно переходит к следующему запросу. Остановка работает потому, что соединение ждёт сразу и данных, и сигнала. Слои middleware независимы от всего этого: они только принимают и возвращают `Handler`."""
