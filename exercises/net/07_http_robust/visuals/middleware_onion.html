<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Middleware: луковица слоёв</title>
<style>
:root { --bg:#fafaf7; --fg:#1d1f24; --muted:#6b7078; --card:#fff; --line:#c9ccd2; --accent:#7c3aed; --shadow:rgba(0,0,0,.08);
  --ok:#1f8a5b; --warn:#b7791f; --bad:#c2410c; --info:#2b6cd9; --mute:#8a8f98; }
@media (prefers-color-scheme: dark) { :root { --bg:#14161a; --fg:#e8eaee; --muted:#9aa0aa; --card:#1d2026; --line:#3a3f48; --accent:#b794ff; --shadow:rgba(0,0,0,.4);
  --ok:#4fd197; --warn:#f0b64a; --bad:#ff9a62; --info:#6ea3ff; --mute:#8a8f98; } }
* { box-sizing:border-box; }
body { margin:0; padding:20px; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
main { max-width:900px; margin:0 auto; }
h1 { font-size:20px; margin:0 0 4px; }
p.sub { margin:0 0 14px; color:var(--muted); }
.bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px; }
button { font:inherit; padding:6px 14px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); cursor:pointer; }
button:hover:not(:disabled) { border-color:var(--accent); }
button:disabled { opacity:.45; cursor:default; }
button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
.counter { margin-left:auto; color:var(--muted); font-variant-numeric:tabular-nums; }
.board { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; }
.box { background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:0 2px 8px var(--shadow); padding:10px; min-height:150px; }
.box h2 { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:0 0 8px; font-weight:600; }
.chips { display:flex; flex-direction:column; gap:6px; }
.chip { padding:5px 10px; border-radius:8px; border:1.5px solid currentColor; font-size:13.5px; font-weight:600; background:transparent; }
.chip.ok { color:var(--ok); } .chip.warn { color:var(--warn); } .chip.bad { color:var(--bad); } .chip.info { color:var(--info); } .chip.mute { color:var(--mute); }
.chip.new { animation:pop .7s ease-out; }
@keyframes pop { 0% { transform:scale(.7); opacity:0; } 60% { transform:scale(1.08); opacity:1; } 100% { transform:scale(1); } }
.empty { color:var(--muted); font-size:13px; }
.caption { margin-top:14px; padding:12px 14px; border-left:4px solid var(--accent); background:var(--card); border-radius:0 8px 8px 0; min-height:3.4em; }
</style>
</head>
<body>
<main>
  <h1>Middleware: луковица слоёв</h1>
  <p class="sub">Четыре слоя вокруг обработчика. Запрос идёт внутрь, ответ наружу.</p>
  <div class="bar" id="scenarios"></div>
  <div class="bar">
    <button id="prev">Назад</button><button id="next">Шаг</button><button id="play">Играть</button><button id="reset">Сброс</button>
    <span class="counter" id="counter"></span>
  </div>
  <div class="board" id="board"></div>
  <div class="caption" id="caption" aria-live="polite"></div>
</main>
<script>
const SCENARIOS = [
 {
  "label": "Запрос с верным токеном",
  "boxes": [
   "timing",
   "access_log",
   "recover",
   "auth",
   "Обработчик"
  ],
  "steps": [
   {
    "t": "Слои надеты друг на друга. Первый в списке (timing) самый внешний. Запрос входит в него первым.",
    "s": [
     [
      [
       "запрос ->",
       "info"
      ]
     ],
     [],
     [],
     [],
     []
    ]
   },
   {
    "t": "timing запоминает время старта и вызывает следующий слой.",
    "s": [
     [
      [
       "старт часов",
       "ok"
      ]
     ],
     [
      [
       "запрос ->",
       "info"
      ]
     ],
     [],
     [],
     []
    ]
   },
   {
    "t": "access_log запоминает метод и путь и вызывает дальше. Запись будет сделана после возврата.",
    "s": [
     [
      [
       "часы идут",
       "mute"
      ]
     ],
     [
      [
       "GET /private",
       "ok"
      ]
     ],
     [
      [
       "запрос ->",
       "info"
      ]
     ],
     [],
     []
    ]
   },
   {
    "t": "recover запускает всё, что внутри, в отдельной задаче. auth проверяет токен: он верный, заголовок X-User проставлен.",
    "s": [
     [],
     [
      [
       "ждёт ответ",
       "mute"
      ]
     ],
     [
      [
       "в отдельной задаче",
       "ok"
      ]
     ],
     [
      [
       "токен верный",
       "ok"
      ]
     ],
     [
      [
       "запрос ->",
       "info"
      ]
     ]
    ]
   },
   {
    "t": "Обработчик возвращает 200. Ответ идёт наружу в обратном порядке.",
    "s": [
     [],
     [],
     [],
     [
      [
       "<- 200",
       "ok"
      ]
     ],
     [
      [
       "200 OK",
       "ok"
      ]
     ]
    ]
   },
   {
    "t": "access_log пишет строку «GET /private 200». timing добавляет заголовок X-Elapsed-Ms. Клиент получает ответ.",
    "s": [
     [
      [
       "X-Elapsed-Ms: 12",
       "ok"
      ]
     ],
     [
      [
       "записано: GET /private 200",
       "ok"
      ]
     ],
     [],
     [],
     []
    ]
   }
  ]
 },
 {
  "label": "Без токена: слой отвечает сам",
  "boxes": [
   "timing",
   "access_log",
   "recover",
   "auth",
   "Обработчик"
  ],
  "steps": [
   {
    "t": "Запрос без Authorization входит в timing и access_log так же, как обычный.",
    "s": [
     [
      [
       "старт часов",
       "ok"
      ]
     ],
     [
      [
       "GET /private",
       "ok"
      ]
     ],
     [
      [
       "в отдельной задаче",
       "ok"
      ]
     ],
     [],
     []
    ]
   },
   {
    "t": "auth не находит токена и возвращает 401, не вызывая обработчик. До него запрос не дошёл.",
    "s": [
     [],
     [],
     [],
     [
      [
       "нет токена: 401",
       "bad"
      ]
     ],
     [
      [
       "не вызван",
       "mute"
      ]
     ]
    ]
   },
   {
    "t": "Ответ 401 идёт наружу. recover просто передаёт его дальше, ведь паники не было.",
    "s": [
     [],
     [],
     [
      [
       "пропускает 401",
       "ok"
      ]
     ],
     [
      [
       "<- 401",
       "bad"
      ]
     ],
     []
    ]
   },
   {
    "t": "access_log стоит снаружи от auth и поэтому видит отказ: «GET /private 401». timing тоже, у ответа есть X-Elapsed-Ms.",
    "s": [
     [
      [
       "X-Elapsed-Ms: 1",
       "ok"
      ]
     ],
     [
      [
       "записано: GET /private 401",
       "ok"
      ]
     ],
     [],
     [],
     []
    ]
   },
   {
    "t": "Если бы auth стоял снаружи журнала, 401 никогда не попал бы в журнал: слой внутри не виден тем, кто стоит снаружи его ответа.",
    "s": [
     [],
     [
      [
       "журнал ослеп бы на отказы",
       "warn"
      ]
     ],
     [],
     [
      [
       "неверный порядок",
       "warn"
      ]
     ],
     []
    ]
   }
  ]
 },
 {
  "label": "Паника обработчика",
  "boxes": [
   "timing",
   "access_log",
   "recover",
   "auth",
   "Обработчик"
  ],
  "steps": [
   {
    "t": "Запрос с верным токеном дошёл до обработчика, и тот паникует (unwrap на пустом Option).",
    "s": [
     [
      [
       "старт часов",
       "ok"
      ]
     ],
     [
      [
       "GET /boom",
       "ok"
      ]
     ],
     [
      [
       "в отдельной задаче",
       "ok"
      ]
     ],
     [
      [
       "токен верный",
       "ok"
      ]
     ],
     [
      [
       "panic!",
       "bad"
      ]
     ]
    ]
   },
   {
    "t": "Задача, в которой работали auth и обработчик, уничтожена. recover получает ошибку JoinError и превращает её в ответ 500.",
    "s": [
     [],
     [],
     [
      [
       "JoinError -> 500",
       "warn"
      ]
     ],
     [],
     [
      [
       "задача умерла",
       "bad"
      ]
     ]
    ]
   },
   {
    "t": "access_log, стоящий снаружи recover, получает нормальный ответ 500 и записывает «GET /boom 500». Журнал жив.",
    "s": [
     [
      [
       "X-Elapsed-Ms: 3",
       "ok"
      ]
     ],
     [
      [
       "записано: GET /boom 500",
       "ok"
      ]
     ],
     [],
     [],
     []
    ]
   },
   {
    "t": "Если бы recover стоял снаружи журнала, паника убила бы и журнал вместе с обработчиком: записи не было бы вовсе.",
    "s": [
     [],
     [
      [
       "не записал бы ничего",
       "bad"
      ]
     ],
     [
      [
       "неверный порядок",
       "warn"
      ]
     ],
     [],
     []
    ]
   }
  ]
 }
];
let cur = 0, step = 0, timer = null;
const $ = id => document.getElementById(id);
function render() {
  const sc = SCENARIOS[cur], s = sc.steps[step], prev = step > 0 ? sc.steps[step - 1] : null;
  const board = $("board"); board.innerHTML = "";
  sc.boxes.forEach((title, i) => {
    const box = document.createElement("div"); box.className = "box";
    const h = document.createElement("h2"); h.textContent = title; box.appendChild(h);
    const chips = document.createElement("div"); chips.className = "chips";
    const list = s.s[i] || [];
    if (!list.length) { const e = document.createElement("span"); e.className = "empty"; e.textContent = "пусто"; chips.appendChild(e); }
    list.forEach(([text, kind]) => {
      const c = document.createElement("div");
      const was = prev && (prev.s[i] || []).some(p => p[0] === text);
      c.className = "chip " + (kind || "info") + (prev && !was ? " new" : "");
      c.textContent = text; chips.appendChild(c);
    });
    box.appendChild(chips); board.appendChild(box);
  });
  $("caption").textContent = s.t;
  $("counter").textContent = "шаг " + step + " из " + (sc.steps.length - 1);
  $("prev").disabled = step === 0; $("next").disabled = step === sc.steps.length - 1;
  document.querySelectorAll("#scenarios button").forEach((b, i) => b.classList.toggle("on", i === cur));
}
function go(n) { step = Math.max(0, Math.min(SCENARIOS[cur].steps.length - 1, n)); render(); }
function stop() { clearInterval(timer); timer = null; $("play").textContent = "Играть"; }
$("next").onclick = () => { stop(); go(step + 1); };
$("prev").onclick = () => { stop(); go(step - 1); };
$("reset").onclick = () => { stop(); go(0); };
$("play").onclick = () => {
  if (timer) return stop();
  if (step === SCENARIOS[cur].steps.length - 1) go(0);
  $("play").textContent = "Пауза";
  timer = setInterval(() => { if (step >= SCENARIOS[cur].steps.length - 1) return stop(); go(step + 1); }, 2300);
};
SCENARIOS.forEach((sc, i) => {
  const b = document.createElement("button"); b.textContent = sc.label;
  b.onclick = () => { stop(); cur = i; go(0); };
  $("scenarios").appendChild(b);
});
if (SCENARIOS.length < 2) $("scenarios").style.display = "none";
go(0);
</script>
</body>
</html>
