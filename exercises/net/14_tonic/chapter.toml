[chapter]
title.ru = "gRPC на tonic"

[[chapter.visuals]]
file = "visuals/grpc_call_lifecycle.html"
title.ru = "Жизнь одного gRPC-вызова"

[[exercises]]
name = "ntn_build"
kind = "project"
style = "scratch"
locked = ["tests/acceptance.rs"]
hint.ru = [
  """Три файла: схема, скрипт сборки и `src/lib.rs`. Схему пиши в папке, которая повторяет пакет: `proto/users/v1/users.proto`. В ней `syntax = "proto3";`, `package users.v1;`, сервис и два сообщения из таблицы.""",
  """В `build.rs` вызови `tonic_prost_build::compile_protos(путь_к_схеме)`. Перед этим напечатай `cargo:rerun-if-changed=proto`, иначе правки схемы не будут пересобирать код. Если `protoc` не находится, проверь `protoc --version` или задай переменную `PROTOC`.""",
  """Сгенерированный файл подключается макросом `tonic::include_proto!("users.v1")`. Положи его внутрь вложенных модулей `users` и `v1`, чтобы путь в тестах совпал с пакетом.""",
]
why.ru = """Контракт живёт в .proto, а Rust-код получается из него при каждой сборке и не коммитится: так клиент и сервер физически не могут разойтись в номерах полей. Модули повторяют пакет, потому что сгенерированный код других схем ссылается на типы по этому пути (`super::super::users::v1::User`). Имя сервиса на проводе собирается из пакета, поэтому переименование пакета ломает всех клиентов, как и смена номера поля."""

[[exercises]]
name = "ntn_unary"
kind = "project"
style = "todo"
locked = ["tests/acceptance.rs"]
hint.ru = [
  """Обработчик получает `Request<T>`, а возвращает `Result<Response<U>, Status>`. Тело запроса достаётся из `request.into_inner()`. Замок `Mutex` бери коротко и не держи его через `.await`.""",
  """Номер и запись в карту должны идти под одним замком: если взять номер, отпустить замок и потом записать, два параллельных вызова получат один номер. В `start` сначала `TcpListener::bind("127.0.0.1:0")` и `local_addr()`, и только потом `tokio::spawn`.""",
  """Запускает сервер `Server::builder().add_service(UsersServer::new(svc)).serve_with_incoming(TcpListenerStream::new(listener))`. Это будущее, его надо отдать в `tokio::spawn`, а результат `JoinHandle` вернуть вместе с адресом.""",
]
why.ru = """Адрес известен до запуска сервера, потому что слушатель открыт заранее и передан серверу готовым: тест или соседний сервис может подключаться сразу, без повторов «пока не поднимется». Порт 0 нужен, чтобы тесты не дрались за номера. Замок вокруг «взять номер и записать» один, потому что любой разрыв между чтением и записью в параллельной среде это гонка, а gRPC обрабатывает вызовы одного клиента параллельно."""

[[exercises]]
name = "ntn_client"
kind = "project"
style = "todo"
locked = ["tests/acceptance.rs"]
hint.ru = [
  """Канал описывается через `Endpoint`: `Endpoint::from_shared(String)`. У него есть `connect_timeout` (на установку соединения) и `timeout` (на каждый вызов). Адрес пиши со схемой: `http://127.0.0.1:50051`.""",
  """`Endpoint::connect().await` ждёт, пока сервис ответит, и ругается, если его нет. Тебе нужен вариант, который возвращает `Channel` сразу и подключается при первом вызове: он синхронный.""",
  """Цепочка: `Endpoint::from_shared(...)`, затем `.connect_timeout(..)`, `.timeout(..)` и в конце вариант «лениво». `from_shared` возвращает `Result`, а адрес из `SocketAddr` всегда корректен.""",
]
why.ru = """Ленивый канал убирает порядок запуска: шлюз стартует, когда сервиса ещё нет, а первый настоящий вызов сам откроет соединение и будет переоткрывать его после обрывов. Сроки нужны двух видов: `connect_timeout` ограничивает установку соединения, `timeout` весь вызов целиком. Без второго зависший обработчик держит вызывающего вечно, а вместе с ним и очередь запросов за ним."""

[[exercises]]
name = "ntn_q3"
kind = "question"
question.ru = """Шлюз стартует раньше сервиса пользователей, и тот ещё не слушает порт. Что произойдёт на старте шлюза?"""
options.ru = [
  """`UsersClient::connect(url).await` вернёт ошибку на старте, а `Endpoint::connect_lazy()` вернёт канал, и ошибка появится у первого вызова""",
  """оба варианта вернут ошибку сразу, ленивое подключение ничем не отличается""",
  """`connect` будет ждать, пока сервис появится, сколько бы это ни длилось""",
  """оба варианта вернут успех, и ошибок не будет вообще, даже у вызовов""",
]
answer = [0]
explain.ru = """`connect` пытается соединиться сразу и честно возвращает `Err`, если никто не слушает. `connect_lazy` откладывает подключение до первого использования, поэтому шлюз стартует при любом порядке запуска, а недоступность сервиса видна как `Unavailable` у конкретных вызовов. Канал при этом сам переподключится, когда сервис появится."""
hint.ru = """Где в каждом из двух вариантов происходит попытка соединения?"""

[[exercises]]
name = "ntn_conn_per_call"
kind = "project"
style = "bughunt"
locked = ["tests/acceptance.rs"]
hint.ru = [
  """Посмотри, что `handle_of` делает перед самим вызовом. Что произойдёт, если вызвать его сто раз? Тест считает принятые сервером TCP-соединения.""",
  """Соединение должно жить столько же, сколько шлюз, а не один вызов. Создай клиента один раз в `Gateway::new`, а на каждый вызов бери его копию. Методы клиента требуют `&mut self`, копия решает и это.""",
  """`new` синхронная, поэтому открывать соединение «по-честному» (`connect().await`) там нельзя. Нужен канал, который подключается при первом использовании. Замок вокруг клиента не ставь: он выстроит вызовы в очередь, и тест на параллельность его поймает.""",
]
why.ru = """Новое соединение на каждый вызов стоит рукопожатия TCP и HTTP/2 и держит порт сокета в TIME_WAIT: на нагрузке сервис тонет не в работе, а в служебных соединениях. Канал создаётся один раз и клонируется: все клоны делят одно соединение, а HTTP/2 раскладывает вызовы по потокам. Мьютекс на клиенте выглядит безопасным, но превращает параллельный сервис в последовательный: поэтому тесты проверяют и число соединений, и время."""

[[exercises]]
name = "ntn_q2"
kind = "question"
question.ru = """```rust
let channel = Endpoint::from_static("http://users:50051").connect_lazy();
for id in 0..100 {
    let mut client = UsersClient::new(channel.clone());
    tokio::spawn(async move { client.get_user(GetUserRequest { id }).await });
}
```
Сколько TCP-соединений к `users` будет открыто, если сервис доступен?"""
options.ru = [
  """сто: каждый клон канала открывает своё соединение""",
  """одно: клоны делят соединение, оно откроется на первом вызове, а HTTP/2 раскладывает вызовы по потокам""",
  """ни одного: `connect_lazy` никогда не подключается сам""",
  """десять: у канала внутри пул фиксированного размера""",
]
answer = [1]
explain.ru = """`Channel` это дешёвая ручка к одному (пере)подключаемому HTTP/2-соединению, а клоны ручки делят его. Лень означает «подключимся при первом вызове», а не «никогда». Сто параллельных вызовов идут сотней потоков внутри одного соединения. Сто соединений получились бы, если бы каждый вызов делал `UsersClient::connect(..)`, как в задаче ntn_conn_per_call."""
hint.ru = """Что именно клонируется при `channel.clone()`: соединение или ссылка на него?"""

[[exercises]]
name = "ntn_status"
kind = "project"
style = "todo"
locked = ["tests/acceptance.rs"]
hint.ru = [
  """Ошибка в обработчике это `Err(Status::...)`. У `Status` по конструктору на каждый код: `not_found`, `invalid_argument`, `already_exists`. Сообщение должно помочь тому, кто будет читать лог: что именно не так и с каким значением.""",
  """Проверка уникальности без учёта регистра и запись в карту идут под одним замком, как и выдача номера. Длину ника считай в символах, а не в байтах: `chars().count()`. Допустимость символов уже проверяет готовый `valid_handle`.""",
  """На клиенте разбирай ошибку по `status.code()`: нужный код превращай в значение, остальные возвращай как есть. Не пиши `Err(_) => Ok(None)`: так пропадёт и `Unavailable`, который вызывающий должен увидеть.""",
]
why.ru = """Код ошибки это часть контракта: от него зависит поведение клиента (показать «не найден», повторить, считать багом), и поэтому его нельзя терять и нельзя подменять на Internal. NotFound на клиенте становится значением, потому что отсутствие пользователя это штатный исход вопроса «кто это?», а вот всё остальное обязано дойти до вызывающего как ошибка: если превратить Unavailable в None, шлюз начнёт говорить пользователям «такого нет», когда сервис просто лёг."""

[[exercises]]
name = "ntn_q1"
kind = "question"
question.ru = """Пользователь с валидным токеном пытается удалить чужой пост. Сервис постов знает, кто он, и знает, что пост существует. Какой код вернуть?"""
options.ru = [
  """`Unauthenticated`: токен не даёт права на этот пост""",
  """`PermissionDenied`: личность известна, прав на это действие нет""",
  """`InvalidArgument`: номер поста не подходит этому пользователю""",
  """`FailedPrecondition`: пост нельзя удалять в его состоянии""",
]
answer = [1]
explain.ru = """`Unauthenticated` значит «не удалось понять, кто ты» (нет токена, просрочен, подпись не сошлась). Здесь личность установлена, не хватает прав: это `PermissionDenied`. `InvalidArgument` про плохое значение поля независимо от состояния системы, а `FailedPrecondition` про состояние (например, пост уже удалён). Иногда чужой пост намеренно отдают как `NotFound`, чтобы не раскрывать, что он есть, но это осознанное исключение, а не умолчание."""
hint.ru = """Спроси себя, известно ли серверу, кто вызывает."""

[[exercises]]
name = "ntn_errors"
kind = "project"
style = "bughunt"
locked = ["tests/acceptance.rs"]
hint.ru = [
  """Запусти тесты и посмотри, что видит клиент при ошибке базы. Сравни с тем, что остаётся в журнале. Нужное место одно: `impl From<DomainError> for Status`.""",
  """Для каждого вида ошибки реши, можно ли клиенту знать детали. Ошибки ввода и «нет такого» можно, они про клиента. Ошибки базы нельзя: им нужен код `Internal` и текст, который не зависит от причины.""",
  """Не меняй `Display` у `DomainError`: журнал пишется из него, и полный текст там нужен. Меняй только то, что попадает в `Status`.""",
]
why.ru = """Ошибка с общим текстом и кодом Internal говорит клиенту ровно то, что он может использовать: «это не ваша вина, повторите позже». Подробности для разбора остаются в журнале, где их увидит тот, кто может исправить. Утечка текста ошибки драйвера хуже, чем кажется: в нём бывают адреса внутренних сервисов, фрагменты запросов и иногда пароли. Реализация `From` стоит в одном месте, поэтому исправление действует на все обработчики сразу."""

[[exercises]]
name = "ntn_q4"
kind = "question"
question.ru = """Сервис постов отвечает на запрос чужого поста: `Status::not_found("пост 15 принадлежит закрытому аккаунту ann")`. Что здесь не так?"""
options.ru = [
  """ничего: сообщение точное и помогает отладке""",
  """код нужен `PermissionDenied`, текст при этом можно оставить""",
  """текст выдаёт, что аккаунт `ann` существует и закрыт, а тому, кто прав не имеет, надо отвечать так же, как про несуществующий пост""",
  """`NotFound` нельзя использовать с номером в сообщении""",
]
answer = [2]
explain.ru = """Сообщения об ошибках видит вызывающий, а значит, любой, кто может подобрать номер. Из этого текста можно узнать и что пост 15 есть, и чей он, и что аккаунт закрыт. Для закрытых ресурсов отвечают одинаково на «нет» и «нельзя»: короткое «пост не найден» без подробностей. Подробности остаются в журнале сервиса."""
hint.ru = """Кто прочитает это сообщение и что он уже знал до вызова?"""

[[exercises]]
name = "ntn_mapping"
kind = "project"
style = "todo"
locked = ["tests/acceptance.rs"]
hint.ru = [
  """Для каждого поля реши, что в нём считается допустимым, и верни `Status::invalid_argument` с именем поля в сообщении. Номер автора `NonZeroU64::new(x)` возвращает `Option`, пустое значение у него `None`.""",
  """Перечисление в запросе лежит как `i32`. Нужен `pb::Visibility::try_from(число)`: он вернёт ошибку для чисел вне перечисления. Метод-геттер `.visibility()` подставит значение по умолчанию и скроет плохой ввод.""",
  """Длину текста считай по символам (`chars().count()`), не по байтам: русская буква весит два байта. Обрезай пробелы до проверки и клади в домен обрезанный текст.""",
]
why.ru = """Граница сервиса это единственное место, где знают, что protobuf разрешает всё: ноль, пустую строку, неизвестное число в перечислении. После `TryFrom` внутри живут типы, в которых плохих значений нет (`NonZeroU64`, enum без UNSPECIFIED), и остальной код не обязан перепроверять. Имя поля в сообщении нужно клиенту, чтобы показать ошибку у нужного поля формы. А `try_from` вместо геттера нужен, потому что новый клиент с новым значением перечисления иначе тихо превратится в `UNSPECIFIED`."""

[[exercises]]
name = "ntn_metadata"
kind = "project"
style = "todo"
locked = ["tests/acceptance.rs"]
hint.ru = [
  """Метаданные запроса: `request.metadata()` и `metadata_mut()`, ответа: `response.metadata()` и `metadata_mut()`. Читать значение обычного ключа: `.get("ключ")`, это `Option<&MetadataValue<Ascii>>`, а текст из него достаёт `to_str()`, и он возвращает `Result`.""",
  """Бинарный ключ оканчивается на `-bin`, и работать с ним надо другими методами: `insert_bin`, `get_bin`, значение собирается через `MetadataValue::from_bytes`, а достаётся через `to_bytes()`. Обычным `insert` бинарный ключ не положить.""",
  """Тело запроса забирай через `into_inner()` последним: оно съедает запрос вместе с метаданными. Проверку идентификатора на клиенте делай по байтам (`0x20..=0x7e`) и до того, как создашь запрос: `MetadataValue::try_from` пропускает и не-ASCII, так что на него полагаться нельзя.""",
]
why.ru = """Всё, что пришло в метаданных, написал чужой код, и серверу нельзя на него паниковать: нечитаемое значение он заменяет своим и идёт дальше. Клиент проверяет идентификатор сам, потому что нижележащая библиотека пропускает байты выше 0x7f, и тогда ошибка проявится на сервере, который не виноват. Двоичные метаданные не пересекаются с текстовыми: суффикс -bin включает кодирование base64, поэтому любые 256 значений байта доходят целыми."""

[[exercises]]
name = "ntn_msg_size"
kind = "project"
style = "todo"
locked = ["tests/acceptance.rs"]
hint.ru = [
  """Запусти тесты и посмотри, что отвечает клиент на 6 МиБ. Лимиты настраиваются на обёртках: `FilesServer` для сервера и `FilesClient` для клиента. Нужны методы с `message_size` в названии.""",
  """У каждой стороны две настройки: `max_decoding_message_size` (сколько готова принять) и `max_encoding_message_size` (сколько готова отправить). Загрузка упирается в приём на сервере, скачивание в приём на клиенте.""",
  """Выбери число и поставь его на всех четырёх настройках (`LIMIT` уже есть). Не используй `usize::MAX`: последний тест специально приходит с клиентом без лимитов и ждёт, что сервер отобьётся сам.""",
]
why.ru = """Лимит размера это защита памяти: без него один вызов может заставить сервис выделить гигабайты. Поэтому его поднимают осознанно, до цифры, которая нужна по делу (аватарки до 8 МиБ), а не снимают совсем. Лимит ставится на каждой стороне отдельно, потому что стороны друг другу не доверяют: сервер не может полагаться на то, что клиент соблюдает свои ограничения. Для настоящих больших файлов правильное решение вообще стрим кусками, а не поднятие лимита."""

[[exercises]]
name = "ntn_q5"
kind = "question"
question.ru = """Клиент загрузки поставил `max_encoding_message_size(10 МиБ)` и шлёт аватарку в 6 МиБ. Сервер остался с настройками по умолчанию. Что получит клиент?"""
options.ru = [
  """успех: клиент ограничил отправку десятью мегабайтами, значит 6 пройдёт""",
  """ошибку `OutOfRange`: сервер при разборе входящего сообщения применяет свой лимит 4 МиБ""",
  """ошибку на стороне клиента ещё до отправки: лимит по умолчанию 4 МиБ действует и на него""",
  """зависание: сервер будет ждать остаток сообщения""",
]
answer = [1]
explain.ru = """У каждой стороны лимиты свои и независимые. `max_encoding_message_size` клиента про то, что он готов отправить; принимающий сервер применяет собственный `max_decoding_message_size` (по умолчанию 4 МиБ) и отвечает `OutOfRange`. Поэтому поднимать надо оба лимита, и на сервере тоже, иначе работать будет только скачивание."""
hint.ru = """Кто в этой цепочке принимает сообщение и чей лимит он применяет?"""

[[exercises]]
name = "ntn_shared_proto"
kind = "project"
style = "todo"
locked = ["crates/users-service/tests/acceptance.rs", "crates/posts-service/tests/acceptance.rs"]
quiz = true
hint.ru = [
  """Три места: `build.rs` и `src/lib.rs` крейта `proto`, а ещё `Cargo.toml` обоих сервисов (им не хватает зависимости от `proto`). Начни со сборки `cargo build` и читай первую ошибку: она подскажет, чего не хватает.""",
  """Схемы нужно собрать **одним** вызовом `tonic_prost_build::configure().compile_protos(&[файлы], &[корень_импортов])`, корень один: папка `proto`. Второй путь в импорте (`users/v1/users.proto`) считается от этого корня.""",
  """В `lib.rs` два сгенерированных файла, по одному на пакет, и модули повторяют пакеты: `users::v1` и `posts::v1`. Зависимость сервисов: `proto = { path = "../proto" }`.""",
]
why.ru = """Один крейт со всеми схемами это единственный способ, при котором тип User один на весь воркспейс. Собранный дважды, он стал бы двумя разными типами, и общение сервисов превратилось бы в ручное копирование полей. Сервисы без своих build.rs быстрее собираются (protoc запускается один раз) и не могут разойтись со схемой. Модули повторяют пакеты, потому что сгенерированный код ссылается на соседей относительными путями."""

[[exercises]]
name = "ntn_two_services"
kind = "project"
style = "scratch"
