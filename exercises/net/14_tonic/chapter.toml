quiz = true
hint.ru = [
  """Начни с `map_upstream`: это чистая функция с таблицей из README, её можно проверить отдельно. Потом `create_post`: порядок действий такой, что дешёвая проверка текста стоит до похода в users. Клиент в структуре уже есть, его нужно клонировать на каждый вызов.""",
  """Заголовок достаётся из метаданных входящего запроса до `into_inner()`. Значение `MetadataValue` можно вставить в исходящий запрос как есть. Замок на состоянии бери после ответа users, а не до: не держи его через `.await`.""",
  """Номер поста и вставка в карту под одним замком. Ответ users превращается в `Post { author: Some(..) }`. Ошибку users прогоняй через `map_err(map_upstream)`, текст чужой ошибки в свою не копируй.""",
]
why.ru = """Ошибка зависимого сервиса переводится, а не пробрасывается: NotFound от users для posts означает плохой аргумент клиента, Unavailable остаётся Unavailable, потому что клиент может повторить, а всё непонятное становится Internal с общим текстом, чтобы чужие подробности не уехали наружу. Дешёвые проверки стоят до сетевого вызова, request-id пересылается, чтобы строки в журналах двух сервисов связались в одну историю, канал один на все вызовы, а замок не держится через await, иначе вызовы выстроятся в очередь."""

