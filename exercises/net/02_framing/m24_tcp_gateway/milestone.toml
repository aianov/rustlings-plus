hint.ru = [
"""Начни с framing, это крейт главы: `decode` ищет `\\n` в буфере и забирает строку через `split_to`, остаток ждёт в
буфере; `Framed::recv` в цикле зовёт `decode`, а если сообщения нет, читает `read_buf` в тот же буфер. Ноль байт
значит конец потока, тогда `decode_eof`. Отмена `recv` посреди чтения ничего не теряет: прочитанное уже в буфере.""",
"""Шлюз: в `server/` бесконечный цикл, где сначала `acquire_owned` у `Semaphore`, потом `accept`, и оба под
`select!` с токеном остановки. Разрешение уезжает в задачу соединения и освобождается вместе с ней. Ошибка accept
(например, кончились дескрипторы) это пауза и следующий круг, а не выход из цикла.""",
"""Соединение: `into_split`, чтение `Framed` с `LinesCodec` в задаче соединения, запись в отдельной задаче из
`mpsc::channel(outbox)`. Push кладёт в эту же очередь `Hub`, поэтому задача записи кончится, когда уйдут все
отправители: и свой, и ссылка в реестре. Для этого `Link` убирает себя из `Hub` в `Drop`.""",
"""Сессия: `session.*` разбирает `decode_session`, остальное `decode_call`, а перед ним `needs_actor` и `act_as`
подставляют `user` из сессии. Ответ собирается как `Response { id, outcome }` и кодируется `contracts::encode`,
ошибки ядра дают код через `to_body()`. Для тестов в процессе `run` принимает готовый `TcpListener` на `127.0.0.1:0`.""",
]
story.ru = """Соцсеть впервые слушает порт: `cargo make demo`, и можно самому зарегистрироваться, написать пост, подписаться
и переписываться со вторым окном, видя push в ту же секунду."""
