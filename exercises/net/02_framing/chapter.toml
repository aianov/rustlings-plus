[chapter]
title.ru = "Границы сообщений"

[[chapter.visuals]]
file = "visuals/framing_partial_reads.html"
title.ru = "Поток режется как попало, буфер собирает сообщения"

[[chapter.visuals]]
file = "visuals/length_prefix.html"
title.ru = "Кадр с длиной впереди: заголовок, ожидание, следующий кадр"

[[exercises]]
name = "nfrm1"
style = "todo"
hint.ru = [
  """`read_line` дописывает строку вместе с `\\n` и возвращает 0 на EOF. Проверь, чем кончается прочитанное.""",
  """Заведи цикл: прочитал строку, сними `\\n` (`strip_suffix`), если `\\n` не было, это обрыв. Потом снять необязательный `\\r`, и если осталось пусто, `continue`.""",
]
why.ru = """`read_line` и `lines()` для сетевого протокола ведут себя по-разному в одном месте: `lines()` отдаёт последнюю строку без `\\n` как обычную, а нам важно отличить её от целой команды. Обрыв на полуслове не должен выглядеть как команда «QUI». Пустые строки и `\\r` это не прихоть: telnet и Windows присылают именно так, а сервер, который падает на «\\r\\n», не работает с половиной клиентов."""

[[exercises]]
name = "nfrm2"
style = "bughunt"
hint.ru = [
  """Где в функции проверяется длина и сколько байтов к этому моменту уже в памяти?""",
  """`read_line` читает, пока не встретит `\\n`, как бы далеко он ни был. Значит, лимит нужно проверять по ходу чтения, а не после.""",
  """У `AsyncBufRead` есть `fill_buf()` (посмотреть, что лежит во внутреннем буфере) и `consume(n)` (забрать n байтов). В цикле ищи `\\n` в этом кусочке, дописывай найденное в свой `Vec` и проверяй его длину после каждого куска.""",
]
why.ru = """Тесты на обычных строках зелёные, потому что проверка длины в исходной функции честная, но запоздалая: `read_line` уже дочитал гигабайт в `String`. Лимит безопасности работает только пока данные ещё не накоплены. Эталон смотрит во внутренний буфер через `fill_buf`, забирает порциями и отказывает, как только накоплено больше `max`. Заметь: после отказа прочитано не больше одного буфера сверх лимита."""

[[exercises]]
name = "nfrm3"
style = "todo"
hint.ru = [
  """Цикл: сначала ищи `\\n` в `buf`, и только если его нет, читай сокет. Читать нужно в тот же `buf`, а не в отдельный буфер.""",
  """Для чтения в `BytesMut` есть `reader.read_buf(buf).await?` (трейт `AsyncReadExt`), ноль значит EOF. Строку вынимай через `buf.split_to(i + 1)`, потом убери `\\n` с конца (`truncate`).""",
  """На EOF: если `buf.is_empty()` это `Ok(None)`, иначе `UnexpectedEof`. Результат верни как `Bytes`: `line.freeze()`.""",
]
why.ru = """Буфер принадлежит вызывающему и живёт между вызовами: всё, что сверх первой строки пришло в одном чтении, остаётся в нём, и следующий вызов находит это без обращения к сокету. Если бы буфер был локальной переменной, при каждом вызове пропадал бы хвост. Заметь порядок: сначала ищем в буфере, потом читаем, иначе после чтения, принёсшего две строки, мы бы зависли в ожидании третьей."""

[[exercises]]
name = "nfrm4"
style = "todo"
hint.ru = [
  """Цикл `while let Some(i) = buf.iter().position(..)`: пока в буфере есть `\\n`, вынимай сообщение.""",
  """`buf.split_to(i + 1)` забирает начало вместе с `\\n` и оставляет в `buf` хвост. Потом `truncate(i)` и `freeze()`.""",
]
why.ru = """`split_to` не копирует байты: возвращённая часть и остаток делят одну память. Так сообщения выдаются дёшево, а хвост остаётся в буфере ровно на своём месте. Любое решение через `to_vec` и пересборку буфера работает, но копирует всё при каждом вызове: на нагруженном сервере это заметно."""

[[exercises]]
name = "nfrm5"
style = "bughunt"
hint.ru = [
  """Попробуй скормить декодеру `a\\nb\\nc` одним куском. Что он вернёт и что останется в буфере?""",
  """Декодер ищет `\\n` один раз за вызов, а потом делает с буфером что-то слишком радикальное. Сообщений в буфере может быть несколько, а хвост принадлежит следующему вызову.""",
  """Замени `if let` на `while let` и вместо `clear()` вынимай ровно найденную часть через `split_to`.""",
]
why.ru = """Баг виден только тогда, когда в буфере больше одного сообщения или есть хвост, а это бывает, когда сеть быстрая или сообщения мелкие: то есть почти никогда в тестах и регулярно в проде. Единственный надёжный способ поймать такое: проверять результат при каждой нарезке потока (на каждой позиции разреза, по одному байту, по три куска). Этот приём называется split-point тестом, и он понадобится при тестировании HTTP-парсера."""

[[exercises]]
name = "nfrm6"
style = "todo"
hint.ru = [
  """Длину в `u32` получи через `u32::try_from(payload.len())`, в байты её переводит `to_be_bytes()`. Кадр собери в один `Vec` с заголовком в начале.""",
  """`write_frame` это вызов `encode_frame` и один `write_all` результата: так заголовок и тело уходят одной записью.""",
]
why.ru = """Два `write_all` (заголовок и тело отдельно) работают и проходят большинство тестов, но по сети это два крошечных пакета: на сокете без NODELAY тело ещё и подождёт подтверждения на заголовок (глава про TCP-сервер). Сборка кадра в одну аллокацию и одна запись дешевле и надёжнее. Проверка длины в `u32` важна: тело в 5 ГБ молча обрезало бы длину."""

[[exercises]]
name = "nfrm7"
style = "todo"
hint.ru = [
  """Различить «ничего» и «часть» нельзя, если сразу звать `read_exact` на весь заголовок: ошибка одна и та же. Прочитай сначала один байт обычным `read`.""",
  """Если `read` одного байта вернул 0, это чистый конец. Иначе дочитай остальные три байта заголовка и тело через `read_exact`: тут любой EOF это ошибка.""",
]
why.ru = """Чистый и грязный конец потока выглядят одинаково (EOF), различаются только местом: между кадрами или внутри. Поэтому нужен отдельный байт «разведки» перед `read_exact`. Если все EOF считать концом, оборванный кадр превращается в тихо потерянное сообщение. Если все считать ошибкой, нормальное закрытие соединения клиентом выглядит как сбой."""

[[exercises]]
name = "nfrm8"
style = "todo"
hint.ru = [
  """Сравнивай длину с `max` сразу после чтения заголовка, до `vec![0; len]`.""",
  """`io::Error::new(io::ErrorKind::InvalidData, ...)` для кадра больше лимита. Остальное как в прошлой задаче.""",
]
why.ru = """Длина в заголовке чужая. Выделить память по ней значит позволить любому клиенту просить у сервера гигабайты одним пакетом. Проверка до выделения стоит одного сравнения. Вернуть именно InvalidData (а не UnexpectedEof) важно: вызывающий код отличает «собеседник нарушил протокол» от «соединение оборвалось»."""

[[exercises]]
name = "nfrm_q1"
kind = "question"
question.ru = """Формат netstring: `5:hello,` (десятичная длина, двоеточие, тело, запятая). Декодер получил буфер с байтами `5:hel`. Что он должен сделать?"""
options.ru = [
  "Вернуть ошибку: тело короче заявленной длины",
  "Вернуть Ok(None) и оставить буфер как есть: сообщение ещё не пришло целиком",
  "Вернуть «hel» как кусок сообщения и ждать остальное",
  "Убрать «5:» из буфера и вернуть Ok(None): заголовок уже разобран, повторять разбор не нужно",
]
answer = [1]
explain.ru = """Неполное сообщение это не ошибка, а нормальное состояние потока: остальное ещё в пути. Декодер возвращает «пока нет» и не меняет буфер, потому что при следующем вызове ему снова понадобится видеть всё с самого начала. Четвёртый вариант ломает следующий вызов: «5:» из буфера уже ушло, и длину больше взять неоткуда. Первый вариант путает «пока не пришло» и «никогда не придёт»: это различает только конец потока."""
hint.ru = "Откуда декодер знает, что остальные байты не придут?"

[[exercises]]
name = "nfrm9"
style = "todo"
hint.ru = [
  """`encode_message`: определи тип и тело через `match`, затем собери `[тип][длина u16 big-endian][тело]`. Длину получи через `u16::try_from`, ошибка это `TooLong`.""",
  """`parse_message`: `match kind`. Для Ping тело обязано быть пустым (guard `if body.is_empty()`), для Text используй `String::from_utf8`, остальные типы это `UnknownType(kind)`.""",
]
why.ru = """Тип в начале кадра превращает разбор в обычный `match`: каждому типу своя ветка. Всё, что может быть неправильным (тип, UTF-8, длина), возвращается ошибкой, а не паникой: на вход пришло то, что прислал чужой человек. Разделение на «кадр целиком» (parse_message) и «поиск кадра в потоке» (декодер из следующей задачи) делает обе части простыми и независимо тестируемыми."""

[[exercises]]
name = "nfrm10"
style = "scratch"
hint.ru = [
  """Нужны три проверки по порядку: есть ли заголовок (3 байта), не больше ли длина лимита, пришло ли тело целиком. Нет заголовка или нет тела целиком: `Ok(None)` и буфер не трогай. Длина больше лимита: ошибка `TooLong`.""",
  """Длина лежит в `buf[1]` и `buf[2]` (u16 big-endian: `u16::from_be_bytes([buf[1], buf[2]])`). Лимит проверяй сразу, как длина известна.""",
  """Когда кадр целый, `buf.split_to(3 + len)` вынимает его целиком, и `parse_message(frame[0], &frame[3..])` разбирает. Результат оберни в `Some` через `.map(Some)`.""",
]
why.ru = """Правило декодера: пока кадр неполон, буфер остаётся нетронутым. Если убрать заголовок раньше времени, при следующем вызове длину уже не найти. Лимит проверяется по заголовку, не дожидаясь тела: иначе клиент заставил бы сервер копить мегабайты байтов под заведомо ненужный кадр. Поскольку декодер чистая функция без сокета, тест кормит его по одному байту и режет в любом месте: это проверка того, что состояние хранится в буфере, а не в переменных вызова."""

[[exercises]]
name = "nfrm_q2"
kind = "question"
question.ru = """В `select!` рядом с таймером нужно ждать данные от сокета. Какие из этих операций безопасно ставить в ветку `select!` (при отмене не теряются уже прочитанные байты)?"""
options.ru = [
  "stream.read_u32()",
  "reader.read_line(&mut line)",
  "stream.read_buf(&mut buf)",
  "stream.read_to_end(&mut vec)",
]
answer = [2]
explain.ru = """Безопасна к отмене только та операция, которая либо ничего не забирает из сокета до готовности, либо складывает прогресс в твой буфер, живущий снаружи future. `read_buf` пишет прямо в `buf`, и после отмены всё уже прочитанное осталось там. `read_u32` может вынуть три байта из четырёх, `read_line` часть строки, `read_to_end` половину потока: при отмене всё это исчезает вместе с future. Поэтому для разбора кадров в цикле с `select!` схема всегда «буфер снаружи и `read_buf`, декодер отдельно»."""
hint.ru = "Где лежат уже прочитанные байты, если future выбросили: в твоей переменной или в его состоянии?"

[[exercises]]
name = "nfrm11"
style = "bughunt"
hint.ru = [
  """Что происходит с `read_frame`, когда победила ветка таймера, а заголовок уже прочитан наполовину?""",
  """Есть два помощника: `read_frame` (читает кадр целиком) и `decode_frame` (разбирает буфер). Для `select!` годится тот, у которого прогресс лежит не в самом future.""",
  """Заведи `BytesMut` до цикла. В цикле сначала `decode_frame(&mut buf)`, если кадра нет, то `select!` между `reader.read_buf(&mut buf)` и тиком. На EOF проверь, пуст ли буфер.""",
]
why.ru = """Исходная версия работает, пока кадры приходят целиком. Но стоит таймеру выиграть в середине кадра, и `read_exact` внутри `read_frame` выбрасывается вместе с уже вынутыми из сокета байтами: поток съезжает, следующее чтение начинается с середины кадра, и всё превращается в мусор. Такие баги видны только под медленной сетью. Исправление то, о чём говорит вся глава: буфер живёт снаружи, `read_buf` безопасен к отмене, декодер разбирает то, что накоплено. Тест с `start_paused` делает «медленную сеть» детерминированной."""

[[exercises]]
name = "nfrm_q3"
kind = "question"
question.ru = """Сервер читает кадры «u32 длина, тело» и делает `let mut body = Vec::with_capacity(len)`, где `len` из заголовка. Лимита нет. Что случится, если клиент пришлёт заголовок `FF FF FF FF` и замолчит?"""
options.ru = [
  "Ничего страшного: пока клиент не прислал тело, память не используется",
  "Сервер попытается зарезервировать около 4 ГБ под одно соединение. Десяток таких, и под лимитом памяти контейнера сервис убьют",
  "Компилятор откажется собирать код",
  "Сработает паника, и сервер перезапустится",
]
answer = [1]
explain.ru = """`with_capacity` резервирует память сразу, а длина пришла от того, кому доверять нельзя. Один заголовок в четыре байта заставляет сервер резервировать четыре гигабайта: система может отдать их лениво, но под лимитом памяти контейнера или когда буфер начнёт заполняться, процесс убьют, и ровно это называют отказом в обслуживании. Лечится лимитом, который проверяется до выделения: длина больше `max` это ошибка протокола и закрытие соединения. Заодно хороший код не выделяет память на всё тело заранее, а растит буфер по мере того, как данные приходят."""
hint.ru = "Кто решает, сколько памяти зарезервирует сервер?"

[[exercises]]
name = "nfrm12"
style = "todo"
hint.ru = [
  """Для `decode` найди `\\n` в `src`. Если его нет, но накопилось больше `max_len + 1` байт, сразу `TooLong`, иначе `Ok(None)`.""",
  """Когда `\\n` найден, вынь строку через `src.split_to(end + 1)`, обрежь `\\n` и необязательный `\\r`, проверь длину, затем `String::from_utf8`. Ошибку UTF-8 превращай в `BadUtf8`.""",
  """`encode`: проверь длину, потом `dst.put_slice(item.as_bytes())` и `dst.put_u8(b'\\n')` (трейт `BufMut`). При отказе в `dst` ничего писать не нужно.""",
]
why.ru = """Кодек ничего не знает про сокет, поэтому его можно проверить на любых нарезках потока без единого порта. Лимит срабатывает по накопленному размеру, а не по найденной строке: иначе для бесконечной строки без `\\n` кодек вечно возвращал бы Ok(None), пока память не кончится. Разделение на Decoder, Encoder и общий Framed (следующая задача главы) значит, что новый протокол это два десятка строк кодека, а не новый сетевой слой."""

[[exercises]]
name = "nfrm_q4"
kind = "question"
question.ru = """Сообщения в протоколе это текст в UTF-8. Первое чтение из сокета вернуло байт `0xD0`, это первая половина двухбайтового символа «д». Как правильно поступить?"""
options.ru = [
  "Сразу превратить прочитанное в String через from_utf8_lossy и отдать как кусок сообщения",
  "Вернуть ошибку: байт 0xD0 сам по себе не валидный UTF-8",
  "Хранить байты как есть в буфере и преобразовать в строку, когда сообщение собрано целиком",
  "Подождать 10 мс: вторая половина обычно приходит сразу",
]
answer = [2]
explain.ru = """Границы чтений никак не связаны с границами символов: многобайтовый символ запросто разрежется между двумя `read`. Преобразование в строку нужно делать над целым сообщением, границы которого определил протокол. Если делать это по кускам, получишь символ-заменитель вместо «д» (`from_utf8_lossy`) или ложную ошибку (`from_utf8`). Паузы и «обычно» в сетевом коде не работают: «обычно» ломается именно в проде."""
hint.ru = "Кто решает, где кончается символ: границы чтений или протокол?"

[[exercises]]
name = "nfrm_framed"
kind = "project"
style = "scratch"
quiz = true
locked = ["tests/acceptance.rs"]
hint.ru = [
  """Начни с кодеков, их можно проверять без Framed: `decode` над `BytesMut` и `encode` в `BytesMut`. Логика та же, что в `nfrm10` и `nfrm12`. Потом `Framed::recv` и `send`.""",
  """`recv`: цикл «сначала `decode`, если не вышло, `read_buf` в `self.read_buf`». Ноль от `read_buf` означает EOF: запомни это в поле и дальше зови `decode_eof`, пока она не вернёт `Ok(None)`. Буфер должен быть полем структуры, иначе отмена потеряет данные.""",
  """`send`: очисти `write_buf`, дай кодеку закодировать в него сообщение (`self.codec.encode(item, &mut self.write_buf)?`) и отправь буфер одним `write_all`. Ошибка записи превращается в ошибку кодека через `From<io::Error>`, поэтому здесь работает `?`.""",
]
why.ru = """`Framed` это склейка двух простых вещей: кодека (чистая функция над буфером) и цикла «декодируй, иначе дочитай». Всё, что в главе было отдельными ловушками, здесь собрано в одном месте: буфер живёт в структуре (безопасность к отмене), хвост принадлежит следующему вызову, EOF бывает чистым и грязным, лимит проверяется до ожидания, ответ уходит одной записью. `into_parts` нужен для протоколов с «апгрейдом» (HTTP в WebSocket): байты, прочитанные сверх нужного, не должны пропасть при передаче сокета дальше."""

[[exercises]]
name = "nfrm_q5"
kind = "question"
question.ru = """Клиент RPC отправил запрос с `id = 7` и ждёт ответа в `oneshot`. Вызов отменили по таймауту: future выброшена, приёмник закрыт. Потом от сервера приходит ответ с `id = 7`. Что должен сделать клиент?"""
options.ru = [
  "Паника на `sender.send(..).unwrap()`: ответ пришёл, а получателя нет, это баг",
  "Достать отправителя из таблицы, попытаться отправить, и если приёмника уже нет (Err), просто проигнорировать",
  "Закрыть всё соединение: пришёл ответ на несуществующий вызов",
  "Положить ответ в очередь и отдать следующему вызову",
]
answer = [1]
explain.ru = """Опоздавший ответ на отменённый вызов это штатная ситуация, а не повод падать: ответ ушёл раньше, чем отмена дошла до сервера. Отправитель в таблице ещё лежит, `send` вернёт Err, и это правильно проигнорировать. Дальше стоит позаботиться, чтобы запись из таблицы убиралась и при самой отмене (Drop-гард в `call`), иначе при потерянных ответах таблица растёт. Закрывать соединение из-за одного опоздавшего ответа значит ронять остальные вызовы, а отдавать ответ чужому вызову (последний вариант) ломает смысл id."""
hint.ru = "Что значит ошибка у oneshot::Sender::send?"

[[exercises]]
name = "nfrm_rpc"
kind = "project"
style = "scratch"
quiz = true
locked = ["tests/acceptance.rs"]
hint.ru = [
  """Клиенту нужны три вещи: общий писатель сокета (за `tokio::sync::Mutex`), таблица `id -> oneshot::Sender` и задача-читатель, которая достаёт отправителей из таблицы по `id` из `FrameReader`. `Client` это `Arc` на всё это.""",
  """Таблицу сделай как `Mutex<Option<HashMap<..>>>`: `None` значит «соединение закрыто». Когда читатель завершился, он делает `take()` и тем самым роняет всех отправителей, а `call` на закрытой таблице сразу возвращает `Closed`. Блокировку std-Mutex не держи через `.await`.""",
  """Сервер: на соединение две задачи (читающая запросы и пишущая через `mpsc`), а каждый запрос обрабатывается своим `tokio::spawn`. Ответ отправляется в канал, когда готов, поэтому может обогнать другие.""",
]
why.ru = """Конвейер запросов (pipelining) держится на трёх решениях. Запросы не ждут ответов: вызов кладёт отправителя в таблицу и сразу пишет кадр. Ответы сопоставляются по `id`, а не по порядку: сервер вправе отвечать вперемешку. Любой конец соединения будит всех ожидающих: пустая таблица плюс уничтоженные `oneshot` превращаются в `Closed`, иначе вызов повисает навсегда. Блокировка таблицы короткая и без `.await`, а писатель сервера один, чтобы кадры разных ответов не смешивались."""

