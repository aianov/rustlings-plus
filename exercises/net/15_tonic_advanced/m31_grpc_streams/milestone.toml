test_command = ["cargo", "make", "check"]
requires = []
hint.ru = [
"""Начни с grpc-kit и его тестов: это ntx_client_interceptor (штамп), ntx_server_interceptor (caller), ntx_deadline_chain
(срок и `grpc-timeout`), ntx_tower_layer (журнал), ntx_health и ntx_shutdown. Готовность слушай потоком `HealthClient::watch`,
а не опросом `check` в цикле: Watch сам пришлёт перемену.""",
"""Новые .proto ломают сборку сервисов и шлюза: компилятор сам покажет каждое место, где действующий ехал в теле. Замени его
на `caller_of(&request)` в сервисе и на штамп в шлюзе. Записи заверни в `tokio::spawn` и дождись `JoinHandle`: если клиент
ушёл по сроку, tonic бросит будущее обработчика, а задача доделает запись.""",
"""Долгие потоки мешают мягкой остановке: сервер ждёт, пока закончатся все вызовы. Поэтому chat-service на сигнале закрывает
подписки (`Hub::close`), задача `Watch` в post-service слушает токен остановки, шлюз отпускает Health/Watch на NOT_SERVING,
а `bounded` ставит жёсткий предел на случай чужого потока.""",
"""Подписку на сообщения шлюз открывает в `ws::open` до `upgrade`: тогда к ответу 101 chat-service уже знает о подписчике,
и сообщение, отправленное сразу после входа, не потеряется. Счётчик устройств и задачу держи в `Inboxes`, а уход последнего
устройства лови в `Drop` у `InboxGuard`.""",
"""Живая лента привязана к сокету, а не к пользователю: события `FeedPush` идут прямо в `Outbox` соединения. Поток
`Watch` открывай с `endless()`, иначе он умрёт через 300 мс вместе с бюджетом запроса. Тест m09 пришёл новой версией:
настоящий chat-service теперь есть, и заготовка проверяется на имени `sandbox-service`.""",
]
story.ru = """Сервисы заговорили по-взрослому: каждый вызов несёт пользователя, request-id и срок, медленный сосед
больше не держит запрос, сообщения летят потоком на все устройства, лента живёт, а остановка вежливо говорит NOT_SERVING."""
