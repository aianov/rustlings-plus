[[rules]]
kind = "contains"
globs = ["src/microservices/post-service/src/config/mod.rs"]
regex = '"POSTS_JOURNAL"'
message.ru = "У каждого сервиса свой журнал в своей переменной окружения: USERS_JOURNAL, POSTS_JOURNAL, AUTH_JOURNAL."

[[rules]]
kind = "contains"
globs = ["src/microservices/auth-service/src/config/mod.rs"]
regex = '"AUTH_JOURNAL"'
