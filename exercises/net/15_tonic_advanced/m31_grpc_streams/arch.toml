  "prost",
  "tonic",
  "tonic-prost",
  "tonic-prost-build",
  "getrandom",
]
message.ru = "proto это только контракт: prost и tonic с генератором, плюс getrandom для x-request-id. Ни ядра, ни сервисов он не знает."

[[rules]]
kind = "deps"
package = "src/crates/social-core"
forbid = [
  "tonic",
  "prost",
  "proto",
  "tonic-prost",
]
message.ru = "Ядро не знает про сеть между сервисами: ни tonic, ни prost, ни proto в social-core."

[[rules]]
