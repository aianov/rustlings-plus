[[rules]]
kind = "deps"
package = "src/microservices/auth-service"
allow_only = [
  "contracts",
  "getrandom",
  "grpc-kit",
  "http-engine",
  "proto",
  "serde",
  "serde_json",
  "service-runtime",
  "tokio",
  "tokio-stream",
  "tonic",
  "tonic-health",
  "user-service",
]
