globs = ["src/crates/grpc-kit/src/access/mod.rs"]
regex = 'impl<S> Layer<S> for AccessLog'
message.ru = "Журнал вызовов это tower-слой: он видит и запрос, и ответ с кодом."

[[rules]]
kind = "contains"
globs = ["src/crates/grpc-kit/src/health/mod.rs"]
regex = '\.watch\('
message.ru = "Готовность соседей слушается потоком Health/Watch, а не опросом Check по таймеру."

[[rules]]
kind = "not_contains"
globs = ["src/crates/grpc-kit/src/health/**/*.rs"]
regex = '\.check\('
message.ru = "Готовность не опрашивается: Check в цикле с паузой это лишняя нагрузка и задержка, Watch сам присылает перемены."

[[rules]]
kind = "contains"
globs = ["src/crates/grpc-kit/src/health/mod.rs"]
regex = 'ServingStatus::NotServing'
message.ru = "Мягкая остановка: сначала NOT_SERVING, пауза grace, потом сервер перестаёт принимать."

[[rules]]
kind = "contains"
globs = [
  "src/microservices/user-service/src/lib.rs",
  "src/microservices/post-service/src/lib.rs",
  "src/microservices/chat-service/src/lib.rs",
  "src/microservices/auth-service/src/lib.rs",
]
regex = 'bounded\('
message.ru = "У мягкой остановки есть жёсткий предел: долгий поток не держит сервис вечно."

[[rules]]
kind = "contains"
globs = [
  "src/microservices/user-service/src/lib.rs",
  "src/microservices/post-service/src/lib.rs",
  "src/microservices/chat-service/src/lib.rs",
  "src/microservices/auth-service/src/lib.rs",
]
regex = '\.layer\(AccessLog::new\('
message.ru = "Каждый сервис пишет журнал вызовов слоем AccessLog."

[[rules]]
kind = "contains"
globs = [
  "src/microservices/user-service/src/lib.rs",
  "src/microservices/post-service/src/lib.rs",
  "src/microservices/chat-service/src/lib.rs",
  "src/microservices/auth-service/src/lib.rs",
]
regex = 'health_reporter\(\)'
message.ru = "Каждый сервис отвечает о здоровье через tonic-health."

[[rules]]
kind = "contains"
globs = [
  "src/microservices/user-service/src/lib.rs",
  "src/microservices/post-service/src/lib.rs",
  "src/microservices/chat-service/src/lib.rs",
]
regex = 'InterceptedService::new\(\w+, caller\)'
message.ru = "Пользователя из x-user-id сервисы достают перехватчиком caller до обработчика."

[[rules]]
kind = "contains"
globs = ["src/microservices/post-service/src/service/mod.rs"]
regex = 'Stamp::follow'
message.ru = "post-service пробрасывает в user-service x-request-id, x-user-id и остаток срока: Stamp::follow."

[[rules]]
kind = "contains"
globs = [
  "src/microservices/post-service/src/service/mod.rs",
  "src/microservices/user-service/src/service/mod.rs",
  "src/microservices/chat-service/src/service/mod.rs",
]
regex = 'tokio::spawn'
message.ru = "Запись, начатая для клиента, доделывается, даже если клиент ушёл: она идёт в tokio::spawn."

[[rules]]
kind = "contains"
globs = ["src/microservices/post-service/src/service/mod.rs"]
regex = 'type WatchStream'
message.ru = "Живая лента из post-service это server-stream Watch."

[[rules]]
kind = "contains"
globs = ["src/microservices/post-service/src/service/mod.rs"]
regex = 'stop\.cancelled\(\)'
message.ru = "Поток живой ленты закрывается на остановке сервиса, иначе мягкая остановка ждала бы его вечно."

[[rules]]
kind = "contains"
globs = ["src/microservices/chat-service/src/service/mod.rs"]
regex = 'type SubscribeStream'
message.ru = "Сообщения пользователю идут server-stream Subscribe из chat-service."

[[rules]]
kind = "contains"
globs = ["src/microservices/chat-service/src/hub/mod.rs"]
regex = 'pub fn close'
message.ru = "На остановке chat-service закрывает все подписки сам."

[[rules]]
kind = "contains"
globs = ["src/microservices/chat-service/src/config/mod.rs"]
regex = '"CHAT_JOURNAL"'
message.ru = "У каждого сервиса свой журнал в своей переменной окружения: CHAT_JOURNAL у chat-service."

[[rules]]
kind = "contains"
globs = ["src/microservices/api-gateway/src/upstream/mod.rs"]
regex = 'with_interceptor'
message.ru = "Клиенты шлюза ставят штамп перехватчиком: with_interceptor на каждом канале."

[[rules]]
kind = "contains"
globs = ["src/microservices/api-gateway/src/upstream/mod.rs"]
regex = 'Readiness::watch'
message.ru = "Шлюз слушает здоровье всех сервисов: Readiness::watch."

[[rules]]
kind = "contains"
globs = ["src/microservices/api-gateway/src/http/mod.rs"]
regex = 'readiness\.missing\(\)'
message.ru = "GET /health шлюза отвечает 200, только когда все сервисы SERVING, иначе называет, кого ждёт."

[[rules]]
kind = "not_contains"
globs = ["src/microservices/api-gateway/src/**/*.rs"]
regex = 'traced\('
message.ru = "Метаданные ставит перехватчик Stamp, а не ручной traced в каждом вызове."

[[rules]]
kind = "contains"
globs = ["src/microservices/api-gateway/src/ws/mod.rs"]
regex = 'inboxes\.join'
message.ru = "Подписка на сообщения открывается на первом устройстве пользователя до ответа 101."

[[rules]]
kind = "contains"
globs = ["src/microservices/api-gateway/src/inbox/mod.rs"]
regex = 'impl Drop for InboxGuard'
message.ru = "Подписка закрывается, когда уходит последнее устройство: Drop у InboxGuard."

[[rules]]
kind = "contains"
globs = ["src/microservices/api-gateway/src/routes/ctx.rs"]
regex = 'endless\(\)'
message.ru = "Поток ленты не должен умирать по бюджету запроса: для Watch штамп без срока."

[[rules]]
kind = "contains"
globs = ["src/crates/contracts/src/live/mod.rs"]
regex = 'pub fn decode_live'
message.ru = "Живые методы ленты разбирает contracts: decode_live."

[[rules]]
kind = "contains"
globs = ["src/crates/contracts/src/push/mod.rs"]
regex = 'pub enum FeedPush'
message.ru = "Событие ленты это свой тип рядом с Push: FeedPush с тегом event."

[[rules]]
kind = "contains"
globs = ["src/crates/social-core/src/chat/mod.rs"]
regex = 'pub fn check'
message.ru = "Проверка сообщения без записи: Chats::check в ядре."

[[rules]]
kind = "contains"
globs = ["Makefile.toml"]
regex = '\[tasks\.chat-service\]'
message.ru = "chat-service поднимается вместе со всеми: задача chat-service в Makefile.toml."

[[rules]]
kind = "contains"
globs = [".env.example"]
regex = '^CHAT_GRPC_ADDR='
message.ru = "Адрес chat-service описан в .env.example: CHAT_GRPC_ADDR."
