[[exercises]]
name = "ntx_client_interceptor"
kind = "project"
style = "todo"
locked = ["tests/acceptance.rs"]
hint.ru = [
  """`call` получает `Request<()>`: метаданные у него есть, тела пока нет. Посмотри методы `request.metadata()` и `metadata_mut()`. Токен лежит в `Arc<RwLock<String>>`, читать его надо внутри `call`, каждый раз заново.""",
  """Порядок проверок: уже есть `authorization` (выходим), токен пуст (выходим без заголовка), иначе собираем значение `Bearer <токен>`. Собрать `MetadataValue` из строки может не получиться; в этом случае верни `Err(Status::unauthenticated(..))`, а не `unwrap`.""",
  """Осторожно: `MetadataValue::try_from` пропускает байты выше 0x7f, и русский пароль в заголовок «проскочит». Допустимыми считай только видимые ASCII-символы без пробела (0x21 до 0x7e) и проверяй это сам.""",
]
why.ru = """Перехватчик вызывается на каждый исходящий запрос, поэтому всё, что должно ехать в каждом вызове (токен, request-id), кладётся тут и не забывается. Токен читается в момент вызова: клиент создаётся один раз и живёт долго, а токены перевыпускаются. Явный заголовок вызывающего уважается, чтобы одному вызову можно было дать другие права. Ошибку перехватчик возвращает как Status, а не паникой: его вызывает чужой код на горячем пути."""

[[exercises]]
name = "ntx_server_interceptor"
kind = "project"
style = "todo"
locked = ["tests/acceptance.rs"]
hint.ru = [
  """В `call` у тебя `Request<()>`. Заголовок достаётся из `request.metadata().get(..)`, а текст из него `to_str()`, который может вернуть ошибку. Все пути отказа ведут в один и тот же `Status::unauthenticated`.""",
  """Номер пользователя клади в `request.extensions_mut().insert(UserId(..))`: обработчик достанет его по типу. Текст ошибки не собирай из пришедшего значения, иначе токен попадёт в логи.""",
  """Для сервера перехватчик навешивается на обёртку одного сервиса: у сгенерированного `MeServer` есть конструктор `with_interceptor`. Открытый сервис (`Public`) в `add_service` кладёшь как был.""",
]
why.ru = """Проверка в перехватчике стоит до обработчика и распространяется на весь сервис, поэтому в новом методе её нельзя забыть. Все виды отказа дают один код и один текст: клиенту не нужно знать, какой именно шаг не прошёл, а злоумышленнику это подсказка. Перехватчик не видит имени метода, так что открытые вызовы выносятся в отдельный сервис, и это общее правило, а не особенность задачи. Найденный пользователь едет в обработчик через extensions, а не через заголовок, который клиент мог бы подделать."""

[[exercises]]
name = "ntx_q6"
kind = "question"
question.ru = """В одном gRPC-сервисе `Account` есть метод `Ping`, который должен отвечать без токена, и десять методов, закрытых токеном. Можно ли сделать это перехватчиком сервера, который проверяет токен?"""
options.ru = [
  """да: перехватчик получает путь метода и пропускает `/Account/Ping`""",
  """нет: перехватчик не видит имени метода, поэтому `Ping` выносят в отдельный сервис без перехватчика (или проверяют токен в слое tower, где путь известен)""",
  """да: в перехватчике достаточно проверить, что тело запроса пустое""",
  """нет: открытых методов в gRPC быть не может""",
]
answer = [1]
explain.ru = """Перехватчик получает `Request<()>`: метаданные и расширения, но не URI. Путь метода виден только на уровне HTTP, то есть в слое tower. Практичные решения два: открытые методы живут в отдельном сервисе (его не оборачивают перехватчиком, как здоровье), или проверку токена делает слой tower, который знает путь и пропускает открытые методы."""
hint.ru = """Что именно получает перехватчик на вход?"""

[[exercises]]
name = "ntx_tower_layer"
kind = "project"
style = "todo"
locked = ["tests/acceptance.rs"]
hint.ru = [
  """Внутри `call` нужно сначала достать из запроса всё, что понадобится в журнале (путь, заголовок), потому что сам запрос уйдёт во внутренний сервис. Время запускай там же. Дальше собери будущее через `Box::pin(async move { .. })`.""",
  """В `async move` нельзя тащить `self`. Перенеси внутрь копию внутреннего сервиса по идиоме из README и копию `sink`. Внутри блока: дождись `inner.call(request).await?`, разбери ответ, запиши строку, верни ответ.""",
  """Код gRPC читай из заголовка ответа `grpc-status` (это число в строке). Если заголовка нет, ответ успешный, и код 0: у успешных вызовов статус едет в трейлерах, которых слой не видит. Время бери после `await`.""",
]
why.ru = """Слой стоит снаружи всех обработчиков, поэтому видит то, что перехватчику недоступно: ответ целиком и время. Копия внутреннего сервиса переносится в будущее по идиоме с mem::replace: `poll_ready` вызывали на `self.inner`, и вызывать нужно ту же копию, иначе гарантии готовности нет. Код успешного ответа слой не видит (он в трейлерах после тела), и честная запись об этом лучше, чем попытка его угадать: настоящие трейлеры читают, оборачивая тело ответа."""

[[exercises]]
name = "ntx_q1"
kind = "question"
question.ru = """Нужно писать в журнал сервиса по строке на каждый вызов: путь метода, код ответа и сколько всё заняло. Что подходит?"""
options.ru = [
  """перехватчик сервера (`Interceptor`)""",
  """слой tower (`Layer`) на `Server::builder()`""",
  """вызов `println!` в начале каждого обработчика""",
  """метаданные ответа, которые клиент присылает назад""",
]
answer = [1]
explain.ru = """Перехватчик получает `Request<()>` до обработчика и до того, как известен ответ: ни кода, ни времени он не видит и не может увидеть. Слой tower оборачивает сервис целиком: он видит путь и заголовки запроса, получает ответ и может измерить время вокруг вызова внутреннего сервиса. Строки в начале каждого обработчика приходится писать в каждом методе и не получить код ответа."""
hint.ru = """Что из этого стоит снаружи обработчика и видит ответ?"""

[[exercises]]
name = "ntx_deadline"
kind = "project"
style = "scratch"
locked = ["tests/acceptance.rs"]
hint.ru = [
  """Три независимые части. Разбор заголовка: последний символ это единица, перед ним от одной до восьми цифр. Сначала проверь формат, потом считай: так мусор не даст ни паники, ни переполнения.""",
  """В `find` сначала `budget_of(&request)`. Если остаток есть и он меньше `self.cost`, верни `Status::deadline_exceeded(..)` до того, как счётчик вызовов бэкенда увеличится. На клиенте срок ставит `request.set_timeout(..)`.""",
  """Клиентский таймер tonic завершает вызов статусом `Cancelled` (не `DeadlineExceeded`), а обработчик отказывает кодом `DeadlineExceeded`. Для вызывающего это один и тот же исход «не успели», объедини их в `TimedOut`, остальные коды оставь как `Failed`.""",
]
why.ru = """Остаток времени известен в самом начале вызова, и узнать его дешевле, чем потом бросить работу посередине: бэкенд не нагружается запросом, который всё равно никто не дождётся. Разбор заголовка строгий, потому что его читает код, который доверяет клиенту ровно настолько, насколько проверил формат. А клиентский помощник сводит два кода к одному исходу: кто именно оборвал вызов, таймер клиента или сервер, вызывающему неважно, ему важно, что повторять с тем же сроком смысла нет."""

[[exercises]]
name = "ntx_deadline_chain"
kind = "project"
style = "bughunt"
locked = ["tests/acceptance.rs"]
hint.ru = [
  """Запусти тесты и посмотри, какой срок видит users в каждом сценарии. Сравни с тем, что должно остаться от бюджета входящего вызова. Искать нужно в том месте, где `call` получает срок.""",
  """Остаток считается от начала обработчика: `started` уже есть. Если входящий срок известен, остаток равен срок минус `started.elapsed()` (с насыщением, чтобы не уйти в минус). Если не известен, берём `DEFAULT_UPSTREAM`.""",
  """Нулевой остаток отправлять нельзя: нулевой срок либо снимается, либо мгновенно оборвётся. Верни `deadline_exceeded` сразу, ещё до вызова users.""",
]
why.ru = """Фиксированный таймаут на каждом звене выглядит аккуратно, но не складывается: на цепочке из трёх сервисов суммарное ожидание может втрое превысить срок, который дал пользователь, и нижние сервисы работают на тех, кто давно ушёл. Бюджет, который убывает, делает так, что вся цепочка сдаётся одновременно. Потолок для вызова без срока нужен, чтобы забытый срок на входе не превращался в бесконечное ожидание внизу."""

[[exercises]]
name = "ntx_q2"
kind = "question"
question.ru = """Шлюз принял запрос с бюджетом 400 мс. Сервис постов потратил на свою работу 250 мс и теперь зовёт сервис пользователей. Какой срок ему поставить?"""
options.ru = [
  """300 мс: стандартный срок для вызовов между сервисами""",
  """400 мс: как у входящего вызова""",
  """около 150 мс: остаток бюджета на данный момент""",
  """срок не ставить: пусть ответит, когда ответит""",
]
answer = [2]
explain.ru = """Бюджет делят все звенья цепочки: у шлюза осталось 400 минус 250, и именно столько можно дать следующему звену, потому что через 150 мс шлюз всё равно сдастся. Любой больший срок означает работу нижнего сервиса на того, кто давно ушёл. Без срока вызов может висеть бесконечно."""
hint.ru = """Сколько времени осталось у того, кто ждёт самого верхнего ответа?"""

[[exercises]]
name = "ntx_cancel"
kind = "project"
style = "bughunt"
locked = ["tests/acceptance.rs"]
hint.ru = [
  """Что происходит с обработчиком, когда клиент закрыл вызов? Он останавливается на ближайшем `.await` и дальше не идёт. Найди в обработчике шаги, которые нельзя оставлять недоделанными, и вспомни, чья это ответственность: клиента или сервера.""",
  """Всё, что обязано завершиться, выноси в `tokio::spawn`: оборванный обработчик ей уже не помеха. Сам обработчик остаётся ждать `JoinHandle`, чтобы ответить клиенту, если он ещё здесь.""",
  """Обработчик ждёт `JoinHandle` и получает `Result<T, JoinError>`. Паника задачи приходит туда как `Err`: преврати её в `Status::internal(..)` с общим текстом.""",
]
why.ru = """Сброс будущего обработчика это не исключение, а штатная отмена, и код после последнего достигнутого await просто не выполняется. Поэтому у обработчика с побочными эффектами есть две части: то, что можно бросить (ждать результат, отвечать клиенту), и то, что обязано дойти до конца (запись, рассылка). Вторая часть живёт в spawn, и отмена клиента ей не мешает. JoinHandle даёт и результат, и панику как ошибку, так что сбой в рассылке не обрывает соединение."""

[[exercises]]
name = "ntx_q3"
kind = "question"
question.ru = """```rust
async fn publish(&self, req: Request<PublishRequest>) -> Result<Response<PublishReply>, Status> {
    let id = self.db.insert_pending(&req.into_inner().text).await?;
    self.mailer.send_to_followers(id).await?;
    self.db.mark_published(id).await?;
    Ok(Response::new(PublishReply { id }))
}
```
Клиент поставил срок 100 мс, а `send_to_followers` занимает 300 мс. Что останется после этого вызова?"""
options.ru = [
  """ничего: tonic откатит всё, что обработчик успел сделать""",
  """строка в базе в состоянии pending, рассылка оборвана на полпути, `mark_published` не выполнен""",
  """обработчик доработает до конца, tonic дождётся его, прежде чем ответить""",
  """tonic перезапустит обработчик с начала""",
]
answer = [1]
explain.ru = """Когда срок вышел, будущее обработчика сбрасывается там, где оно ждало: внутри `send_to_followers`. Всё, что уже выполнено (вставка), остаётся, всё, что идёт после последнего достигнутого await, не выполнится. Транзакций в таком коде нет, и откатывать нечего. Такую работу выносят в `tokio::spawn`: отмена клиента ей не мешает."""
hint.ru = """Что происходит с будущим, когда его сбрасывают?"""

[[exercises]]
name = "ntx_server_stream"
kind = "project"
style = "todo"
locked = ["tests/acceptance.rs"]
hint.ru = [
  """Подписка на хаб (`self.hub.listen()`) делается в самом обработчике, до `tokio::spawn`: иначе события, опубликованные между возвратом и стартом задачи, пропадут. Поток ответа соберёшь из `mpsc::channel` и `ReceiverStream::new(rx)`.""",
  """Задача-пересыльщик в цикле ждёт два события: новое сообщение хаба и закрытие приёмника клиентом (`tx.closed()`). Если ждать только сообщение хаба, то при тишине в хабе задача никогда не заметит, что клиент ушёл. Ждать два события сразу умеет `tokio::select!`.""",
  """Ветки хаба: сообщение чужого пользователя пропускаем, своё отправляем (ошибка `send` значит, что клиент ушёл, выходим), `Lagged(n)` отправляем как `Err(Status::data_loss(..))` и выходим, `Closed` просто выходим.""",
]
why.ru = """Поток ответа сервер ведёт из отдельной задачи, и у неё два источника событий: хаб и признак, что клиент ушёл. Если слушать только хаб, то подписчик, чей клиент давно закрыл вызов, остаётся жить до следующего события, а при тихом хабе навсегда: утечка, которая растёт с каждым открытым и закрытым приложением. Подписка до возврата убирает окно потерь, а Lagged превращён в явную ошибку, потому что молчаливый пропуск событий в ленте хуже обрыва: клиент не знает, что пора загрузить заново."""

[[exercises]]
name = "ntx_q4"
kind = "question"
question.ru = """Серверный стрим ленты сделан так: задача-пересыльщик в цикле делает `events.recv().await` из broadcast и отправляет в `mpsc`, а ошибку `send` обрабатывает выходом. Клиент закрыл приложение, а в хабе тишина: новых событий нет. Когда подписка пересыльщика освободится?"""
options.ru = [
  """сразу: tonic убивает все задачи, связанные с вызовом""",
  """когда придёт следующее событие и `send` вернёт ошибку""",
  """никогда: подписки broadcast не освобождаются""",
  """через 30 секунд по таймауту HTTP/2""",
]
answer = [1]
explain.ru = """tonic останавливает только будущее обработчика, а запущенную им `tokio::spawn` задачу никто не трогает. Пересыльщик спит на `recv()` и о закрытии потока узнает только при попытке отправки, то есть с очередным событием. Если хаб молчит, подписка живёт, и такие утечки копятся. Лечится ожиданием сразу двух вещей через `select!`: нового события и закрытия приёмника (`tx.closed()`)."""
hint.ru = """Кто в этой цепочке узнаёт, что клиент ушёл, и в какой момент?"""

[[exercises]]
name = "ntx_client_stream"
kind = "project"
style = "todo"
locked = ["tests/acceptance.rs"]
hint.ru = [
  """Серверу приходит `Request<Streaming<LikeRequest>>`: сам поток достаётся через `into_inner()`, а читать его надо циклом по `stream.message().await?`. Вопросительный знак пробросит ошибку транспорта. У сообщения поле `kind` с тремя исходами: лайк, `Commit` и пусто (поток кончился или пришло пустое сообщение).""",
  """Не пиши в общее хранилище внутри цикла. Копи счётчики в локальной карте и перенеси их в хранилище одним действием, когда прочитан `Commit`. Конец потока без `Commit` это `Status::aborted(..)`, а не успех: оборвавшийся клиент выглядит для сервера как закрывший поток.""",
  """Лимит проверяй на каждом сообщении, а не после цикла: бесконечный поток иначе никогда не закончится. На клиенте поток собери из итератора лайков и одного `Commit` в конце (`tokio_stream::iter(..)`).""",
]
why.ru = """Клиентский поток обрабатывают по одному сообщению: накопить всё в памяти значит потерять смысл стрима и стать мишенью для бесконечного потока. Результат копится локально и применяется один раз, когда клиент сам сказал «всё», потому что оборвавшийся клиент неотличим от закрывшего поток: у gRPC нет сигнала «я передумал», только закрытие. Поэтому подтверждение (Commit) часть протокола. Всё-или-ничего нужно ещё и затем, что клиент при ошибке повторит пачку целиком: если часть уже записана, лайки задвоятся."""

[[exercises]]
name = "ntx_q7"
kind = "question"
question.ru = """Клиент шлёт серверу поток из 500 лайков, и на 300-м приложение закрывают: вызов оборван. Что увидит серверный обработчик, который читает поток через `stream.message().await`?"""
options.ru = [
  """всегда `Err(Status::cancelled)`: сервер сразу узнаёт об отмене""",
  """после 300 сообщений `Ok(None)`, то есть то же, что при нормальном завершении отправки""",
  """обработчик продолжит ждать следующее сообщение бесконечно""",
  """tonic перезапросит у клиента потерянные сообщения""",
]
answer = [1]
explain.ru = """Закрытие клиентом своей стороны потока и обрыв вызова для сервера выглядят одинаково: поток сообщений кончился. Иногда ошибка приходит чуть позже, но полагаться на неё нельзя, ответ в этот момент всё равно уже никому не нужен. Поэтому у протоколов «всё или ничего» есть явное подтверждение конца в самом потоке (Commit, итоговое сообщение с количеством): без него обрыв посередине принимают за полную пачку."""
hint.ru = """Откуда серверу знать, что клиент не закончил, а оборвался?"""

[[exercises]]
name = "ntx_bidi"
kind = "project"
style = "scratch"
locked = ["tests/acceptance.rs"]
hint.ru = [
  """Сначала `inbound.message().await` и проверка `Join`: это можно делать прямо в обработчике, до возврата ответа. Подписку на комнату оформи там же, до `Response::new`.""",
  """Дальше две задачи. Читающая гоняет `inbound.message()` и кладёт каждое `Say` в комнату. Пишущая слушает комнату и отправляет в `mpsc`, из которого собран поток ответов. Они не знают друг о друге, кроме сигнала «клиент закончил».""",
  """Пишущая задача ждёт сразу несколько событий (`tokio::select!`): сообщение комнаты, сигнал конца ввода, закрытие приёмника клиентом (`out.closed()`). Без последнего она переживёт ушедшего клиента. `Lagged` от комнаты можно пропустить и продолжить.""",
]
why.ru = """В bidi-стриме нет парности запросов и ответов, поэтому читать и писать надо в разных задачах, иначе молчащий слушатель никогда не получит слова. Подписка оформляется до ответа, чтобы сообщения сразу после входа не терялись. Конец ввода клиента означает конец его разговора, а не всей комнаты: сигнал уходит только в пишущую задачу этого участника. Закрытие приёмника тоже ловится явно, иначе при тихой комнате ушедшие участники копятся задачами."""

[[exercises]]
name = "ntx_stream_error"
kind = "project"
style = "bughunt"
locked = ["tests/acceptance.rs"]
hint.ru = [
  """Запусти тесты и посмотри, какие падают. Два дефекта, по одному на каждой стороне, поэтому исправление только одной половины не заставит пройти все тесты.""",
  """Сервер: задача, которая тихо вышла, закрыла канал, и клиент увидел нормальный конец. Чтобы клиент узнал о сбое, в канал нужно положить `Err(Status::...)` перед выходом. Клиент: где у него проглатывается ошибка чтения?""",
  """На клиенте цикл `while let Ok(Some(..))` останавливается и на `Ok(None)`, и на `Err(..)`, а нужно различать. Разбери три исхода `stream.message().await` через `match`: сообщение, нормальный конец, ошибка. Ошибка вместе с числом уже полученных строк идёт в `Truncated`.""",
]
why.ru = """Конец потока без ошибки обещает полноту: «больше ничего нет». Если сервер закрывает поток молча на аварии, а клиент складывает `Err` и `None` в одну ветку, обещание лжёт, и неполные данные идут дальше по цепочке как полные. Ошибка в потоке это сообщение особого вида, и её нужно отправить явно, а получатель обязан различать три исхода: элемент, нормальный конец и сбой. Число полученных до сбоя строк отдаётся вместе с ошибкой, чтобы вызывающий мог решить, повторять ли выгрузку с начала или с места обрыва."""

[[exercises]]
name = "ntx_health"
kind = "project"
style = "todo"
locked = ["tests/acceptance.rs"]
hint.ru = [
  """Сервис здоровья берётся из `tonic_health::server::health_reporter()`: там и управляющая часть, и готовый сервис. Его надо добавить в сервер вместе с `UsersServer`. Начальный статус задаёт `set_service_status(имя, статус)`.""",
  """Клиент здоровья: `HealthClient::new(channel.clone())`, метод `check` с `HealthCheckRequest { service }`. В ответе поле `status`, у ответа есть метод `status()`, который возвращает `ServingStatus`. Неизвестное имя приходит как ошибка `NotFound`.""",
  """`wait_serving` это цикл «спросили, не готов, поспали 50 мс» под общим `tokio::time::timeout`. Любая ошибка внутри цикла (сосед не слушает, не готов, соединение оборвалось) повод спать и пробовать снова, а не выходить: наружу выходит только таймаут.""",
]
why.ru = """Проверка готовности отвечает на вопрос, который «порт открыт» не покрывает: может ли сервис прямо сейчас работать. Состояние здоровья отдельно для каждого сервиса и для сервера целиком, и его меняет сам сервис, когда прогрелся, потерял базу или собирается остановиться. Ожидание при старте не должно падать на первой же ошибке: на старте всей системы соседи поднимаются в любом порядке, и «ещё не слушает» штатное состояние, а не авария. Срок ожидания общий, а не на каждую попытку, чтобы шлюз не висел бесконечно."""

[[exercises]]
name = "ntx_shutdown"
kind = "project"
style = "todo"
locked = ["tests/acceptance.rs"]
hint.ru = [
  """У `Server` есть запуск с сигналом остановки: `serve_with_incoming_shutdown(incoming, будущее)`. Когда будущее завершилось, сервер перестаёт принимать новое и дожидается текущих вызовов. Это и есть корень правильной остановки.""",
  """Всё, что нужно сделать до остановки, помести в само это будущее: сначала дождись сигнала, потом смени состояние на `NotServing`, потом поспи `grace`. Пока будущее спит, сервер продолжает работать. `HealthReporter` нужно перенести в это будущее (`async move`).""",
  """Не забудь выставить `SERVING` в начале (иначе тест не дождётся готовности). Результат `serve_with_incoming_shutdown` и есть возвращаемое значение функции.""",
]
why.ru = """Остановка сервиса это не событие, а последовательность. Состояние NOT_SERVING до закрытия порта нужно, чтобы балансировщик успел убрать сервис из ротации: пока он этого не сделал, ему приходят новые вызовы, и отказывать им нельзя. Пауза grace даёт это время. Потом сервер перестаёт принимать новые соединения и дожидается тех, что в полёте: иначе каждая раскатка рвёт вызовы пользователей. Сигнал остановки от сброшенного отправителя тоже считается сигналом: если управляющая сторона умерла, сервис не должен жить вечно."""

[[exercises]]
name = "ntx_q5"
kind = "question"
question.ru = """Балансировщик опрашивает проверку здоровья каждые 5 секунд, а сервис при остановке ставит `NOT_SERVING`, ждёт 1 секунду и закрывает порт. Что не так?"""
options.ru = [
  """всё правильно: секунды хватает, чтобы балансировщик увидел NOT_SERVING""",
  """пауза должна быть длиннее интервала опроса: иначе балансировщик может не успеть заметить смену и продолжит слать трафик в закрытый порт""",
  """NOT_SERVING вообще не нужен: достаточно закрыть порт""",
  """пауза не нужна: после закрытия порта балансировщик сам всё поймёт""",
]
answer = [1]
explain.ru = """Балансировщик узнаёт о NOT_SERVING только на следующем опросе, а это может случиться через 5 секунд. Всё это время он считает сервис живым и шлёт ему новые вызовы, а порт уже закрыт. Период грации выбирают не короче интервала опроса плюс запас. Закрытие порта без NOT_SERVING хуже: отказы получают те, кому не повезло оказаться в окне."""
hint.ru = """Через сколько балансировщик увидит смену состояния в худшем случае?"""

[[exercises]]
name = "ntx_feed_chain"
kind = "project"
style = "scratch"
locked = ["crates/posts-service/tests/acceptance.rs"]
quiz = true
hint.ru = [
  """Порядок: `map_upstream` (чистая функция), `publish` (автор из расширений), `fetch_author` (срок, request-id, перевод ошибки), `timeline`, в конце `run`. Каждую часть можно запускать тестами отдельно: имена тестов говорят, чем проверяется.""",
  """Для ленты нужны три вещи, которые легко забыть вместе. Автор запрашивается один раз (карта «номер автора, пользователь» внутри задачи-пересыльщика). Бюджет считается от момента входа в обработчик на каждый вызов users. Ошибка идёт в поток через `tx.send(Err(..))`, а после неё задача выходит.""",
  """В `run` порядок вызовов в `Server::builder()`: слой журнала, затем сервис здоровья, затем `FeedServer::with_interceptor(svc, auth)`. Остановка: будущее для `serve_with_incoming_shutdown` ждёт сигнал, меняет состояние `feed.v1.Feed` на `NotServing`, спит `grace`. В начале состояние `Serving`.""",
]
why.ru = """Это та же цепочка, что в боевом шлюзе, и каждая её часть проверена отдельным тестом, потому что ломаются они по-разному. Токен проверяется перехватчиком, а здоровье остаётся вне его, иначе балансировщик не сможет спросить о готовности. Один вызов users на автора и один канал держат нагрузку на соседа пропорциональной числу авторов, а не числу постов. Бюджет считается от входа в обработчик, и ошибка про исчерпанный бюджет идёт в поток, а не нормальным концом, иначе клиент примет обрыв за конец ленты. Остановка идёт по порядку из прошлой задачи, поэтому идущая лента дорабатывает, а балансировщик успевает заметить NOT_SERVING."""

