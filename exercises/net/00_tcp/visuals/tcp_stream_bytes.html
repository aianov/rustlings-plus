<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TCP это поток байтов</title>
<style>
:root {
  --bg: #fafaf7; --fg: #1d1f24; --muted: #6b7078; --card: #ffffff; --line: #c9ccd2;
  --w1: #2b6cd9; --w2: #1f8a5b; --accent: #7c3aed; --shadow: rgba(0,0,0,.08); --ghost: #e7e8ec;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14161a; --fg: #e8eaee; --muted: #9aa0aa; --card: #1d2026; --line: #3a3f48;
    --w1: #6ea3ff; --w2: #4fd197; --accent: #b794ff; --shadow: rgba(0,0,0,.4); --ghost: #2a2e36;
  }
}
* { box-sizing: border-box; }
body { margin: 0; padding: 20px; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 820px; margin: 0 auto; }
h1 { font-size: 20px; margin: 0 0 4px; }
p.sub { margin: 0 0 14px; color: var(--muted); }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
button { font: inherit; padding: 6px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.counter { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
.stage { background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 2px 8px var(--shadow); padding: 14px; display: grid; gap: 14px; }
.zone h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; min-height: 46px; }
.group { display: flex; flex-direction: column; gap: 4px; padding: 6px 8px; border: 1px dashed var(--line); border-radius: 8px; }
.group .name { font: 12px ui-monospace, Menlo, monospace; color: var(--muted); }
.cells { display: flex; gap: 2px; }
.cell { width: 28px; height: 32px; display: grid; place-items: center; font: 600 14px ui-monospace, Menlo, monospace; color: #fff; border-radius: 4px; transition: transform .25s, opacity .25s; }
.cell.w1 { background: var(--w1); }
.cell.w2 { background: var(--w2); }
.cell.ghost { background: var(--ghost); color: transparent; }
.pipe { display: flex; gap: 0; padding: 8px; border-radius: 10px; border: 2px solid var(--line); min-height: 52px; background: linear-gradient(90deg, transparent, var(--ghost) 40%, transparent); }
.pipe .cell { border-radius: 0; }
.pipe .empty { color: var(--muted); font-size: 13px; align-self: center; padding-left: 4px; }
.legend { font-size: 13px; color: var(--muted); }
.caption { margin-top: 12px; padding: 12px 14px; border-left: 4px solid var(--accent); background: var(--card); border-radius: 0 8px 8px 0; min-height: 3.4em; }
code { font: 13px ui-monospace, Menlo, monospace; }
</style>
</head>
<body>
<main>
  <h1>TCP это поток байтов</h1>
  <p class="sub">Цвет это наша разметка: он показывает, какой write отправил байт. Для сети байты одинаковы, и границ write в потоке нет.</p>
  <div class="bar">
    <button id="sc-a" class="on">Два write, один read</button>
    <button id="sc-b">Один write, три read</button>
    <span style="width:12px"></span>
    <button id="prev">Назад</button>
    <button id="next">Шаг</button>
    <button id="play">Играть</button>
    <button id="reset">Сброс</button>
    <span class="counter" id="counter"></span>
  </div>
  <div class="stage">
    <div class="zone"><h2>Отправитель</h2><div class="row" id="senders"></div></div>
    <div class="zone"><h2>Поток в сети (в пути)</h2><div class="pipe" id="pipe"></div></div>
    <div class="zone"><h2>Получатель</h2><div class="row" id="readers"></div></div>
    <div class="legend" id="legend"></div>
  </div>
  <div class="caption" id="caption" aria-live="polite"></div>
</main>
<script>
const SC = {
  a: {
    data: [["HELLO ", 1], ["WORLD!", 2]],
    legend: "Синий и зелёный: два разных write. Получатель их не различает.",
    steps: [
      { t: "Ничего ещё не отправлено. Получатель вызовет read(&mut buf) с буфером на 64 байта.", sent: 0, writes: 0, reads: [] },
      { t: "Первый write_all(\"HELLO \") принят ядром: 6 байт ушли в поток.", sent: 6, writes: 1, reads: [] },
      { t: "Второй write_all(\"WORLD!\"). В потоке теперь одна лента из 12 байт, швов между write в ней нет.", sent: 12, writes: 2, reads: [] },
      { t: "Один read вернул 12 байт: оба write склеились. Код, который ждал «первое сообщение отдельно», сломался.", sent: 12, writes: 2, reads: [12] }
    ]
  },
  b: {
    data: [["HELLO WORLD!", 1]],
    legend: "Один write на 12 байт. Буфер получателя маленький, поэтому read читает кусками (в реальной сети куски режут пакеты и окна).",
    steps: [
      { t: "Ничего ещё не отправлено. Получатель вызывает read(&mut buf) с буфером на 5 байт.", sent: 0, writes: 0, reads: [] },
      { t: "Один write_all(\"HELLO WORLD!\"): 12 байт ушли в поток.", sent: 12, writes: 1, reads: [] },
      { t: "Первый read вернул 5 байт: \"HELLO\". Остальное ждёт в потоке.", sent: 12, writes: 1, reads: [5] },
      { t: "Второй read: ещё 5 байт. Заметь, что граница пришлась внутрь слова.", sent: 12, writes: 1, reads: [5, 5] },
      { t: "Третий read вернул 2 байта. Чтобы получить сообщение целиком, нужен цикл или read_exact.", sent: 12, writes: 1, reads: [5, 5, 2] }
    ]
  }
};
let key = "a", step = 0, timer = null;
const $ = id => document.getElementById(id);

function bytes(sc) {
  const out = [];
  sc.data.forEach(([text, w]) => { for (const ch of text) out.push({ ch, w }); });
  return out;
}
function cell(b, extra) {
  const d = document.createElement("div");
  d.className = `cell w${b.w} ${extra || ""}`;
  d.textContent = b.ch === " " ? "·" : b.ch;
  return d;
}
function group(name, list, ghost) {
  const g = document.createElement("div");
  g.className = "group";
  const n = document.createElement("div");
  n.className = "name"; n.textContent = name;
  const c = document.createElement("div");
  c.className = "cells";
  list.forEach(b => c.appendChild(cell(b, ghost ? "ghost" : "")));
  g.append(n, c);
  return g;
}
function render() {
  const sc = SC[key], s = sc.steps[step], all = bytes(sc);
  const senders = $("senders"), pipe = $("pipe"), readers = $("readers");
  senders.innerHTML = pipe.innerHTML = readers.innerHTML = "";
  let off = 0;
  sc.data.forEach(([text], i) => {
    const list = all.slice(off, off + text.length);
    off += text.length;
    senders.appendChild(group(`write_all("${text}")`, list, i >= s.writes));
  });
  const consumed = s.reads.reduce((a, b) => a + b, 0);
  const inFlight = all.slice(consumed, s.sent);
  if (!inFlight.length) {
    const e = document.createElement("span");
    e.className = "empty"; e.textContent = "пусто";
    pipe.appendChild(e);
  } else inFlight.forEach(b => pipe.appendChild(cell(b)));
  let pos = 0;
  s.reads.forEach((n, i) => {
    readers.appendChild(group(`read #${i + 1} -> n = ${n}`, all.slice(pos, pos + n)));
    pos += n;
  });
  if (!s.reads.length) {
    const e = document.createElement("span");
    e.className = "legend"; e.textContent = "read ещё не вызывали";
    readers.appendChild(e);
  }
  $("legend").textContent = sc.legend;
  $("caption").textContent = s.t;
  $("counter").textContent = `шаг ${step} из ${sc.steps.length - 1}`;
  $("prev").disabled = step === 0;
  $("next").disabled = step === sc.steps.length - 1;
}
function go(n) { step = Math.max(0, Math.min(SC[key].steps.length - 1, n)); render(); }
function stop() { clearInterval(timer); timer = null; $("play").textContent = "Играть"; }
$("next").onclick = () => { stop(); go(step + 1); };
$("prev").onclick = () => { stop(); go(step - 1); };
$("reset").onclick = () => { stop(); go(0); };
$("play").onclick = () => {
  if (timer) return stop();
  if (step === SC[key].steps.length - 1) go(0);
  $("play").textContent = "Пауза";
  timer = setInterval(() => { if (step >= SC[key].steps.length - 1) return stop(); go(step + 1); }, 2200);
};
function pick(k) {
  stop(); key = k;
  $("sc-a").classList.toggle("on", k === "a");
  $("sc-b").classList.toggle("on", k === "b");
  go(0);
}
$("sc-a").onclick = () => pick("a");
$("sc-b").onclick = () => pick("b");
go(0);
</script>
</body>
</html>
