[chapter]
title.ru = "Адреса и TCP-соединение"

[[chapter.visuals]]
file = "visuals/tcp_handshake.html"
title.ru = "TCP: рукопожатие, данные и закрытие"

[[chapter.visuals]]
file = "visuals/tcp_stream_bytes.html"
title.ru = "TCP это поток байтов: write и read не совпадают"

[[exercises]]
name = "ntcp1"
style = "todo"
hint.ru = """`SocketAddr` реализует `FromStr`, поэтому `text.parse()` разбирает строку. Для сборки из частей есть `SocketAddr::new`, для замены порта `set_port` (метод требует `mut`), а для проверки семейства `is_ipv6`."""
why.ru = """Разбор через `parse` не ходит в DNS: имя хоста для него просто ошибка, и это правильно, потому что резолвинг медленный и асинхронный, а разбор мгновенный. Квадратные скобки у IPv6 нужны, чтобы двоеточия адреса не путались с двоеточием перед портом. `SocketAddr` это `Copy`, так что `with_port` честно принимает значение и отдаёт новое."""

[[exercises]]
name = "ntcp2"
style = "todo"
hint.ru = [
  """connectable_addr: адрес-«все интерфейсы» называется unspecified, у `IpAddr` для него есть метод `is_unspecified`. Нужное семейство (v4 или v6) сохраняется.""",
  """connectable_addr: сделай `match bind.ip()` с двумя ветками по `IpAddr::V4` и `IpAddr::V6` и guard `if ip.is_unspecified()`. Подставляй `Ipv4Addr::LOCALHOST` и `Ipv6Addr::LOCALHOST`, порт бери из `bind.port()`.""",
  """is_local_only это одна строка: у `IpAddr` есть `is_loopback`.""",
]
why.ru = """0.0.0.0 и [::] значат «слушаю на каждом интерфейсе», это адрес для bind, а не для connect. Поэтому конфиг сервера и адрес клиента нельзя брать из одной строки. Ветки разделены по семействам: v6 неспецифицированный адрес должен превращаться в `::1`, а не в `127.0.0.1`, иначе клиент пойдёт не в то семейство."""

[[exercises]]
name = "ntcp_q1"
kind = "question"
question.ru = """Сервис запущен в Docker-контейнере и слушает `127.0.0.1:3000`. Порт проброшен наружу (`-p 3000:3000`), но с хоста `curl http://localhost:3000` не достучаться. Почему?"""
options.ru = [
  "Порт 3000 уже занят другим процессом на хосте",
  "Внутри контейнера 127.0.0.1 виден только самому контейнеру, а проброшенный трафик приходит на другой его интерфейс. Сервис должен слушать 0.0.0.0",
  "Docker не умеет пробрасывать TCP, только UDP",
  "Нужно слушать [::1] вместо 127.0.0.1",
]
answer = [1]
explain.ru = """Loopback у каждой сетевой «комнаты» свой. Контейнер живёт в своём сетевом пространстве, и его 127.0.0.1 недоступен снаружи, даже если порт проброшен: Docker доставляет пакеты на внешний интерфейс контейнера (например, 172.17.0.2), а сервис там не слушает. Лечится привязкой к 0.0.0.0 внутри контейнера. Наружу при этом обычно выставляют порт только на 127.0.0.1 хоста (`-p 127.0.0.1:3000:3000`), чтобы сервис не торчал в сеть."""
hint.ru = "Подумай, что значит «127.0.0.1» с точки зрения процесса внутри контейнера."

[[exercises]]
name = "ntcp3"
style = "todo"
hint.ru = """`TcpListener::bind("127.0.0.1:0").await?` даёт слушателя, а настоящий порт спрашивают у него: `listener.local_addr()?`. Адрес, который ты передавал в bind, порт 0 и содержит."""
why.ru = """Порт 0 это просьба «дай любой свободный». Узнать, какой достался, можно только через `local_addr` после bind. Все сетевые тесты курса стоят на этом: фиксированные порты ломают параллельный запуск тестов и падают у соседей по машине. Вернуть слушателя вместе с адресом удобно: тесту нужны оба."""

[[exercises]]
name = "ntcp4"
style = "scratch"
hint.ru = [
  """Нужен слушатель на `127.0.0.1:0` и его `local_addr`. После этого `connect` и `accept` идут навстречу друг другу.""",
  """Если сначала дождаться `connect`, а потом вызвать `accept`, это тоже работает: ядро уже приняло рукопожатие и держит соединение в очереди. Но надёжнее запустить обе операции вместе, `tokio::join!`.""",
  """`let (client, accepted) = tokio::join!(TcpStream::connect(addr), listener.accept());` дальше разбери два Result, у accept внутри пара `(stream, peer_addr)`.""",
]
why.ru = """Рукопожатие делает ядро, поэтому `connect` у клиента может завершиться раньше, чем сервер вызовет `accept`: соединение ждёт в очереди готовых соединений (backlog). Это важно помнить, когда ловишь «клиент уже подключён, а сервер ничего не принял». Зеркальность `local_addr` и `peer_addr` хорошая проверка в тестах: так видно, что две стороны правда говорят друг с другом."""

[[exercises]]
name = "ntcp5"
style = "todo"
hint.ru = """Сначала `stream.write_all(question).await?`, потом `let n = stream.read(&mut buf).await?`. Верни `buf[..n].to_vec()`, а не весь буфер: после `n` лежат нули, а не данные."""
why.ru = """`read` не заполняет буфер, он кладёт в начало сколько есть и сообщает `n`. Поэтому всё, что читается из буфера, читается как `&buf[..n]`. Здесь одного `read` хватает только потому, что ответ крошечный и сервер отдаёт его одним куском. В следующих задачах мы увидим, что это везение, а не гарантия."""

[[exercises]]
name = "ntcp_q2"
kind = "question"
question.ru = """Клиент делает два отдельных `write_all`, сервер один раз читает:

```rust
// клиент
stream.write_all(b"ab").await?;
stream.write_all(b"cd").await?;

// сервер
let mut buf = [0u8; 16];
let n = stream.read(&mut buf).await?;
```

Что гарантировано про `n` и данные?"""
options.ru = [
  "n == 2, потому что один write это один read",
  "n == 4: ядро склеит оба write в одно сообщение",
  "n от 1 до 4, а все четыре байта рано или поздно придут в порядке abcd",
  "n равно 2 или 4, но ни в каком другом значении",
]
answer = [2]
explain.ru = """TCP не знает про «сообщения», это поток байтов. Два write могут склеиться в одно чтение, один write может разорваться на несколько чтений, и то, что на твоей машине сегодня всегда выходит 4, ничего не гарантирует: другая сеть, другая нагрузка, другой размер буферов. Гарантирован только порядок и целостность байтов. Границы сообщений придётся задавать самому (это тема главы про фрейминг)."""
hint.ru = "Вспомни, что у TCP нет понятия «сообщение»."

[[exercises]]
name = "ntcp6"
style = "scratch"
hint.ru = [
  """Нужен цикл: читай в буфер, и если `read` вернул 0, выходи. Всё прочитанное накапливай в `Vec<u8>`.""",
  """`let n = stream.read(&mut buf).await?; if n == 0 { return Ok(all); } all.extend_from_slice(&buf[..n]);`""",
]
why.ru = """Ok(0) от `read` означает EOF: собеседник закрыл свою сторону записи. Это самый частый способ узнать, что поток закончился, и самый частый источник бесконечных циклов, если его не проверить. Забирать нужно именно `&buf[..n]`, а не весь буфер."""

[[exercises]]
name = "ntcp_q3"
kind = "question"
question.ru = """Что произойдёт, когда собеседник закроет соединение?

```rust
let mut buf = [0u8; 1024];
while let Ok(n) = stream.read(&mut buf).await {
    handle(&buf[..n]);
}
```"""
options.ru = [
  "Цикл завершится: закрытие соединения приходит как Err",
  "Цикл завершится: read вернёт None",
  "Цикл будет крутиться бесконечно: read снова и снова возвращает Ok(0), и handle получает пустой срез",
  "Программа запаникует на срезе buf[..0]",
]
answer = [2]
explain.ru = """Закрытие, которое прошло чисто (FIN), это не ошибка, а Ok(0). Раз `read` вернул Ok, паттерн `Ok(n)` совпал, и цикл идёт дальше. На следующем вызове будет снова Ok(0), и так до бесконечности: процессор занят на 100%, а в логах тишина. Правильно: `Ok(0) => break`. Именно такой баг тебе предстоит найти в следующей задаче."""
hint.ru = "Какой результат даёт read на соединении, которое собеседник закрыл?"

[[exercises]]
name = "ntcp7"
style = "bughunt"
hint.ru = [
  """Что делает цикл, когда `read` вернул 0? Посмотри на условие `if n == 1`.""",
  """Ноль прочитанных байтов в непустом буфере всегда означает EOF. Если строка к этому моменту не закончилась, это ошибка `UnexpectedEof`.""",
]
why.ru = """Исходный цикл проверяет только «получили байт» и молча игнорирует всё остальное, включая EOF. Тесты с целой строкой проходят, а в проде это горячий цикл на мёртвом соединении. Эталон проверяет 0 сразу после read и возвращает `UnexpectedEof`: так вызывающий код отличает «строка пришла» от «соединение оборвалось». Читать по одному байту дорого, в главе про фрейминг мы заменим это буфером."""

[[exercises]]
name = "ntcp8"
style = "fix"
hint.ru = [
  """Компилятор жалуется на метод `read`: ему не хватает трейта в области видимости. Асинхронные методы чтения живут в `tokio::io::AsyncReadExt`.""",
  """Когда заработает, тесты покажут, что приходит меньше байтов, чем нужно. У `AsyncReadExt` есть метод, который читает ровно столько, сколько просят, или возвращает ошибку.""",
  """`stream.read_exact(&mut buf).await?;` и обрезать буфер уже не нужно.""",
]
why.ru = """Исходный код делал одно чтение и считал, что сообщение пришло целиком. Так бывает на быстрой локальной сети с маленькими сообщениями, потому тесты на ноутбуке зелёные, а в проде редкие обрезанные сообщения. `read_exact` читает в цикле и возвращает `UnexpectedEof`, если собеседник закрылся раньше: обрезанное сообщение превращается в понятную ошибку."""

[[exercises]]
name = "ntcp_q4"
kind = "question"
question.ru = """Сервер слушает только `127.0.0.1:P`. Имя `localhost` на машине клиента превращается в два адреса: сначала `::1`, потом `127.0.0.1`. Что сделает клиент?

```rust
let stream = TcpStream::connect(("localhost", P)).await;
```"""
options.ru = [
  "Вернёт Err(ConnectionRefused): первая попытка на ::1 не удалась, и это конец",
  "Подключится к 127.0.0.1: tokio пробует адреса из списка по очереди до первого успеха",
  "Зависнет навсегда в ожидании ::1",
  "Не скомпилируется: connect не принимает имён",
]
answer = [1]
explain.ru = """`TcpStream::connect` принимает всё, что реализует `ToSocketAddrs`, в том числе имя с портом. Имя резолвится в список адресов, и tokio пробует их по очереди, пока один не сработает. Поэтому у tokio этот сценарий работает. А вот код, который берёт только первый адрес из списка (`lookup_host(..).next()`), на таких машинах ломается. В задаче ntcp11 ты напишешь перебор сам, с таймаутом на каждую попытку."""
hint.ru = "Что написано в документации к TcpStream::connect про несколько адресов?"

[[exercises]]
name = "ntcp9"
style = "bughunt"
hint.ru = [
  """Маленькие сообщения доходят, большие нет. Что возвращает `write` и что делает код с этим числом?""",
  """`write` записывает сколько влезло в буфер отправки ядра и возвращает это число. Остаток нужно дописать.""",
  """Для этого есть `write_all`, он крутится в цикле, пока не отдаст всё.""",
]
why.ru = """`write` может принять только часть данных (буфер отправки заполнен, получатель не успевает читать), и честно сообщает сколько. Если проигнорировать результат, хвост теряется молча: ни ошибки, ни паники. `write_all` повторяет запись, пока не отправит всё. Clippy ловит эту ошибку линтом `unused_io_amount`, поэтому его стоит слушать."""

[[exercises]]
name = "ntcp_q5"
kind = "question"
question.ru = """Клиент отправил серверу 100 байтов, и они уже лежат в буфере приёма сервера. Сервер не читает их и закрывает сокет:

```rust
let (stream, _) = listener.accept().await?;
drop(stream);
```

Что увидит клиент при следующем чтении из своего сокета?"""
options.ru = [
  "Ok(0): чистое закрытие, как обычно",
  "Err с ConnectionReset: соединение оборвано сбросом, а не вежливо закрыто",
  "Ничего, чтение будет ждать вечно",
  "Err с TimedOut: ядро само отсчитает время",
]
answer = [1]
explain.ru = """Если закрыть сокет, в буфере приёма которого остались непрочитанные данные, ядро отправляет не FIN, а RST: данные потеряны, и вежливо закончить разговор уже нельзя. Клиент получает ConnectionReset. Это реальная причина «странных» сбросов в серверах: ответ отправили и закрылись, не дочитав запрос, и клиент потерял даже ответ. Правило: дочитай то, что присылает собеседник, или сначала сделай shutdown и дождись EOF."""
hint.ru = "Закрытие с непрочитанными данными это не то же, что закрытие без них."

[[exercises]]
name = "ntcp10"
style = "todo"
hint.ru = [
  """Запись надо закрыть до чтения ответа. У `AsyncWriteExt` есть нужный метод.""",
  """`stream.write_all(request).await?; stream.shutdown().await?;`, а ответ прочитай `read_to_end`.""",
]
why.ru = """`shutdown` на TcpStream закрывает только сторону записи (отправляет FIN), читать дальше можно. Для сервера это сигнал «запрос закончился», для клиента способ не вводить длину сообщения. Без shutdown обе стороны ждут друг друга вечно, и тест падает по таймауту, а не по панике: такие зависания и есть самая неприятная сетевая ошибка. Протоколы с длиной или разделителем обходятся без half-close, но «запрос, EOF, ответ» остаётся простейшим."""

[[exercises]]
name = "ntcp11"
style = "scratch"
hint.ru = [
  """`tokio::net::lookup_host` возвращает итератор адресов, собери его в `Vec`. Для перебора нужен цикл по адресам, внутри `tokio::time::timeout(per_try, TcpStream::connect(addr))`.""",
  """У timeout три исхода: успех соединения, ошибка соединения и истечение времени. Запоминай последнюю ошибку в `last`, начни с `InvalidInput` для пустого списка.""",
  """`match timeout(per_try, TcpStream::connect(addr)).await { Ok(Ok(s)) => return Ok(s), Ok(Err(e)) => last = e, Err(_) => last = io::Error::new(TimedOut, ...) }`""",
]
why.ru = """Одно имя может вести на несколько адресов, и первый из них не обязан быть рабочим: типичный случай `localhost` с `::1` впереди и сервером только на IPv4. Перебор с таймаутом на каждую попытку не даёт одному мёртвому адресу съесть весь бюджет времени. Ошибка последней попытки лучше выдуманной: по ней видно, чем всё закончилось."""

[[exercises]]
name = "ntcp12"
style = "todo"
hint.ru = [
  """В `From<io::Error>` сделай `match e.kind()` по `io::ErrorKind`. Всё, чего нет в списке, оборачивай в `NetError::Other(e)`.""",
  """Обрати внимание на `connect` и `read_n`: они вообще не разбирают ошибки, всю работу делает `?` через твой `From`.""",
  """В `Display` для `Other(e)` выведи и текст исходной ошибки через `write!(f, "...: {e}")`.""",
]
why.ru = """Свой enum ошибок нужен затем, чтобы код выше по стеку принимал решения: Refused значит «сервер не поднят» (повторить позже), Reset и Closed значит «собеседник пропал» (переподключиться), TimedOut значит «медленно» (может, подождать). Пересылать `io::Error` наверх и сравнивать там `kind()` тоже можно, но тогда каждый вызывающий должен знать эту таблицу. `Other` хранит исходную ошибку, чтобы не потерять причину."""

[[exercises]]
name = "ntcp13"
style = "scratch"
hint.ru = [
  """`tokio::time::timeout(limit, fut).await` возвращает `Result<T, Elapsed>`. Здесь `T` само `io::Result`, так что разбирай два уровня.""",
  """`with_timeout` пишется один раз, а `connect_timeout` и `read_timeout` это по одной строке поверх неё.""",
  """`match timeout(limit, op).await { Ok(inner) => inner, Err(_) => Err(io::Error::new(io::ErrorKind::TimedOut, "...")) }`""",
]
why.ru = """Ожидание из сети без лимита времени это отказ сервиса, который ещё не случился: любой молчащий клиент держит задачу и память вечно. Одна обёртка с `TimedOut` вместо `Elapsed` даёт единый вид ошибок: вызывающий код смотрит на `kind()`, а не на два разных типа. Тесты с `start_paused` двигают время сами, поэтому проверка 30-секундного таймаута занимает микросекунды."""

[[exercises]]
name = "ntcp14"
style = "scratch"
hint.ru = [
  """Если отправить всё и только потом читать, на больших объёмах оба зависнут. Значит, отправка и приём должны идти одновременно, и у них должны быть разные владельцы сокета.""",
  """`stream.into_split()` даёт две половинки. Запись вместе с закрытием записи отправь в `tokio::spawn`, чтение (`read_to_end`) оставь в текущей задаче.""",
  """В конце дождись задачу записи: `sender.await` даёт `Result<io::Result<()>, JoinError>`, оба уровня разворачивай через `?` (ошибку `JoinError` приведи к `io::Error` через `io::Error::other`).""",
]
why.ru = """Эхо возвращает байты по мере чтения. Клиент, который сначала пишет всё, не читает, поэтому буферы заполняются в обе стороны, и обе стороны ждут друг друга. Одновременность решает это без единой паузы и таймаута: запись живёт в своей задаче, чтение в своей. `shutdown` после записи сообщает серверу, что байты кончились, и тот закроет свою сторону, позволив `read_to_end` завершиться."""

[[exercises]]
name = "ntcp_echo"
kind = "project"
style = "scratch"
quiz = true
locked = ["tests/acceptance.rs"]
hint.ru = [
  """Сервер читает порцию и сразу пишет её обратно. Когда `read` вернул 0, он закрывает свою сторону записи через `shutdown` и возвращает число эхо-байтов.""",
  """Главная ловушка: клиент, который сначала целиком отправляет мегабайт и только потом читает, зависнет. Сервер упрётся в полный буфер отправки и перестанет читать. Отправку и приём нужно вести одновременно: `into_split` и отдельная задача на запись.""",
  """Клиент: `let (mut rd, mut wr) = stream.into_split();` затем `tokio::spawn` с `wr.write_all(&data)` и `wr.shutdown()`, а в основной задаче `rd.read_to_end`. Ошибки из `io::Error` раскладывай по `kind()` в твой `EchoError`.""",
]
why.ru = """Эхо на мегабайт ловит сразу все ошибки главы: нужен цикл чтения до EOF, `write_all` вместо `write`, half-close, чтобы сервер понял конец, и одновременная запись с чтением, иначе два буфера заполняются и обе стороны ждут друг друга. Свой enum ошибок собирает их в понятные категории, а таймаут простоя защищает сервер от молчащего клиента."""
