[chapter]
title.ru = "Protobuf: формат и prost"

[[chapter.visuals]]
file = "visuals/protobuf_wire.html"
title.ru = "Protobuf на проводе: ключ, varint, длина вперёд"

[[chapter.visuals]]
file = "visuals/schema_evolution.html"
title.ru = "Эволюция схемы: кто кого прочитает"

[[exercises]]
name = "npb1"
style = "todo"
hint.ru = [
  """Число режется на группы по семь бит, начиная с младших. Каждая группа становится байтом, и у всех байтов кроме последнего старший (восьмой) бит равен единице: «дальше ещё есть».""",
  """Цикл: возьми `value & 0x7f`, сдвинь число на 7 вправо. Если остаток не нуль, допиши байт с флагом `0x80` и иди дальше, иначе допиши байт без флага и выйди. Нуль тоже одна группа.""",
  """Для длины цикл не нужен: нужно число значащих бит (`64 - leading_zeros`, но для нуля считай как для единицы), поделённое на семь с округлением вверх (`div_ceil`).""",
]
why.ru = """Формат экономит на самом частом: маленькие числа стоят один байт, и платить за большие приходится только тем, у кого они есть. Младшие группы идут первыми, поэтому читатель может собирать число на лету, не зная длины заранее. Лишний нулевой байт в конце был бы допустим для читателя, но наш кодировщик обязан писать кратчайшую запись, иначе байты одного и того же числа начнут различаться у разных отправителей."""

[[exercises]]
name = "npb2"
style = "todo"
hint.ru = [
  """Иди по байтам слева направо: у каждого бери младшие семь бит и клади их в результат со сдвигом `7 * номер`. Число кончается на байте, где старший бит сброшен.""",
  """У числа без результата три разных конца: вход кончился, а флаг продолжения стоял (оборвано); прошло десять байтов, а число не кончилось (слишком длинное); десятый байт несёт больше одного бита (не влезает в u64). Различай их разными ошибками.""",
  """Сдвиг `<<` на 64 и больше в Rust паникует в отладочной сборке, поэтому длину проверяй до сдвига, а не после, и не разматывай больше десяти байтов.""",
]
why.ru = """Декодер получает байты от чужого, и три разные ошибки нужны затем, чтобы по логу было видно, что случилось: обрыв это проблема сети, слишком длинное число это либо баг, либо атака, а переполнение это несовместимость типов. Лишние нулевые байты (`80 00`) спецификация разрешает читать, поэтому мы их принимаем: строгость, которой нет в формате, ломала бы совместимость с чужими кодировщиками. Главная ловушка: паника на 11 байтах от сдвига за разрядность."""

[[exercises]]
name = "npb3"
style = "todo"
hint.ru = [
  """Ключ это обычный varint: его младшие три бита способ записи, остальное номер поля (`>> 3`). Сначала разбери varint.""",
  """Проверки идут в таком порядке: номер ноль, номер больше 2^29 - 1 (сравнивай как `u64`, до приведения к `u32`), потом способ записи: 0, 1, 2, 5 допустимы, 3 и 4 это группы, 6 и 7 мусор.""",
  """При записи обратная формула: `(номер << 3) | способ`, затем обычный varint. Не забудь привести номер к `u64` до сдвига.""",
]
why.ru = """Ключ несёт ровно столько, чтобы читатель мог пропустить поле, не зная схемы: номер и способ записи. Отсюда и совместимость: старый читатель видит незнакомый номер и по способу записи знает, сколько байтов выбросить. Номера до 15 занимают один байт ключа, поэтому самые частые поля нумеруют от 1 до 15. Приведение к u32 до проверки диапазона дало бы тихую ошибку: огромный ключ обрезался бы до маленького номера."""

[[exercises]]
name = "npb4"
style = "todo"
hint.ru = [
  """У int32 нет своего формата: значение расширяется знаком до 64 бит (`i64::from(n) as u64`) и пишется как обычный varint. Поэтому -1 это все единицы и десять байтов.""",
  """Zigzag переставляет числа так, чтобы маленькие по модулю отрицательные стали маленькими положительными: 0, -1, 1, -2, 2 превращаются в 0, 1, 2, 3, 4. Хватит двух сдвигов и xor; арифметический сдвиг вправо на 31 даёт маску знака.""",
  """Обратно: `(z >> 1)` xor с `-(z & 1)`. Читая int32, берут младшие 32 бита varint, поэтому приведение `as i32` от u64 подходит.""",
]
why.ru = """Расширение знаком у int32 сделано ради совместимости с int64: старый int32, превращённый в int64, должен читаться теми же байтами. Цена этого десять байтов на каждое отрицательное число, и именно поэтому для величин, которые бывают отрицательными, придумали sint с zigzag. Выбор типа поля это выбор формата на проводе, и ошибиться в нём можно только раз: поменять int32 на sint32 потом значит сломать всех читателей, байты те же, а числа другие."""

[[exercises]]
name = "npb5"
style = "todo"
hint.ru = [
  """У каждого целого типа есть `to_le_bytes` и `from_le_bytes`: little-endian это то, что требует формат.""",
  """Для float и double переводи число в биты (`to_bits`, `from_bits`), а не в целое значение через `as`. Так сохраняются и минус ноль, и NaN с нагрузкой.""",
  """Чтение: достань нужное число байтов через `get(..N)` (ошибка, если их меньше) и преобразуй срез в массив через `try_into`.""",
]
why.ru = """Протокол выбрал little-endian, а не сетевой порядок, потому что почти все процессоры уже так устроены, а сеть для protobuf вторична. Ошибка `to_be_bytes` проходит тесты между двумя копиями твоего же кода и ломается только при встрече с чужим сервисом на другом языке. Float через `to_bits` важен для NaN и минус нуля: приведение через `as` теряет и то и другое."""

[[exercises]]
name = "npb6"
style = "todo"
hint.ru = [
  """Запись простая: длина как varint, потом сами байты. Длина считается в байтах, а не в символах.""",
  """Читая, сначала достань длину, потом сравни её с тем, что осталось в буфере, и только после этого срезай. Сравнивай как `u64`, не приводя к `usize` заранее и не складывая «начало плюс длина»: при злых входах сумма переполнится.""",
  """Для строк после `take_len` остаётся `std::str::from_utf8`. Ошибка UTF-8 не то же самое, что обрыв, это отдельный вариант ошибки.""",
]
why.ru = """Весь формат строится на длине вперёд, и это ровно то место, где чужой вход пытается навредить: заявить гигабайтную длину, чтобы получить выделение памяти, или переполнить сложение, чтобы выйти за срез. Проверка длины до любых действий с ней снимает обе проблемы. Строки отдельно проверяются на UTF-8, а bytes нет: в этом разница между ними, хотя на проводе они одинаковы."""

[[exercises]]
name = "npb7"
style = "scratch"
hint.ru = [
  """Цикл `while pos < buf.len()`: ключ, затем значение по способу записи, затем сдвиг позиции. Для Len значение это срез буфера, а не копия, поэтому у `Field` есть время жизни.""",
  """В `decode_profile` обходи поля по порядку и просто перезаписывай результат: «последнее побеждает» получится само собой. Совпадение номера, но не способа записи это ошибка, а неизвестный номер просто пропускается.""",
  """Каждое обращение к срезу делай через `get`, а длины сравнивай как `u64`. Мусор не должен давать панику, ведь тест подаёт тысячи случайных буферов.""",
]
why.ru = """Умение пропустить незнакомое поле и есть то, что делает protobuf расширяемым: новые поля добавляют, старые читатели живут. «Последнее побеждает» нужно потому, что сообщения можно склеивать конкатенацией байтов, и по спецификации результат равен слиянию. Разбор без схемы делается один раз и годится как для декодера, так и для пропуска, поэтому он вынесен в отдельную функцию, как это устроено в настоящих библиотеках."""

[[exercises]]
name = "npb8"
style = "scratch"
hint.ru = [
  """Поле 4 может прийти как Varint (одно число) или как Len (упакованный список). Оба случая дописывают значения в один вектор в порядке появления.""",
  """Внутри упакованного поля числа идут подряд без ключей: разбирай срез в цикле, пока он не опустеет, сдвигая его на прочитанное. Оборванное число внутри это ошибка.""",
  """При записи сначала собери тело (varint каждого числа, отрицательные пишутся десятью байтами), потом ключ с типом Len, длину и тело. Пустой список не занимает ни байта.""",
]
why.ru = """Упакованный список появился позже, чем обычный, и для совместимости читатель обязан принимать оба вида: писатель в другой версии или на другом языке мог выбрать любой. Упаковка экономит ключ на каждый элемент, что для списков идентификаторов существенно. Пустой repeated нигде не пишется, поэтому «пустой список» и «поля нет» на проводе одно и то же."""

[[exercises]]
name = "npb9"
style = "scratch"
hint.ru = [
  """Структура описывается тремя вещами: derive `Message`, атрибут `#[prost(тип, tag = "N")]` у каждого поля и подходящий Rust-тип. Тип в атрибуте это тип из схемы (`sint32`, `uint64`, `string`), он решает, как поле лежит на проводе.""",
  """Для списка добавь `repeated`, для вложенного сообщения `message, optional` и тип поля `Option<...>`. Упаковку списков prost включает сам.""",
  """Номера бери строго из схемы: в ней нет поля 3, и это нормально, номера не обязаны идти подряд.""",
]
why.ru = """Derive prost это генератор кода от описания, которое ты пишешь руками: атрибуты содержат всё, что нужно (тип на проводе и номер). Ошибка в атрибуте не видна компилятору: `int32` вместо `sint32` соберётся и даже пройдёт круг «закодировал и прочитал», а сломается только при встрече с чужим сервисом. Поэтому на настоящих контрактах пишут тесты по готовым байтам и генерируют код из .proto, как в проекте этой главы."""

[[exercises]]
name = "npb10"
style = "scratch"
hint.ru = [
  """Иди по таблице сверху вниз, и на каждое поле у тебя один вопрос: оно равно значению по умолчанию? Если да, не пиши ничего.""",
  """Исключение из этого правила вложенное сообщение. Если оно задано (`Some`), пишется всегда, даже пустое (ключ и нулевая длина), а внутри него правила умолчаний работают заново.""",
  """Тест покажет сообщение, на котором есть расхождение. Частые виновники: расширение знака у int32 до 64 бит, zigzag у sint32, упаковка tags, порядок байтов у double, float и fixed32.""",
]
why.ru = """Побайтная сверка с эталонной библиотекой на тысячах случайных сообщений ловит то, что не поймают ручные примеры: границы разрядов, умолчания в середине сообщения, пустые вложенные сообщения. Хороший способ проверить своё понимание формата: пока байты не совпадают, чего-то ты не знаешь. Одна из самых частых ошибок самодельных кодировщиков это писать «задано, но пусто» так же, как «не задано»."""

[[exercises]]
name = "npb11"
style = "bughunt"
hint.ru = [
  """Нужно, чтобы поле умело быть «не задано»: в prost для этого есть `optional` в атрибуте и `Option<T>` в типе. Такое поле пишется, когда оно `Some`, даже если внутри ноль.""",
  """Номера и типы значений не меняй: на проводе optional-поле выглядит так же, как обычное, только пишется и при нулевом значении. Байты старых клиентов читаются, их `true` становится `Some(true)`.""",
  """В `apply` заменяй поле, только если пришло `Some`. Для `display_name` остаётся старое правило пустой строки.""",
]
why.ru = """В proto3 у скалярного поля нет «не задано»: значение по умолчанию не пишется, и принимающая сторона не отличит «поставь ноль» от «ничего не менять». Для частичных обновлений это не годится, и лечат это `optional` (есть явное присутствие) или обёртками вроде `google.protobuf.BoolValue`. Важно, что изменение совместимо: на проводе форма поля та же, поэтому старые клиенты и новые сервисы продолжают понимать друг друга."""

[[exercises]]
name = "npb12"
style = "todo"
hint.ru = [
  """Поле-перечисление в prost это `i32`. Приведение `Priority::try_from(число)` возвращает ошибку на неизвестном значении: используй её как признак.""",
  """Геттер `job.priority()` на неизвестном значении молча возвращает значение по умолчанию. Для этой задачи он вреден: он стирает информацию, которую надо сохранить.""",
  """В `escalate` неизвестное число просто копируется в результат, так задача проходит через нас такой, какой пришла.""",
]
why.ru = """Хранение enum как i32 в prost это сознательное решение: значение от более новой версии схемы не должно пропасть при прохождении через старый сервис. Если сервис нормализует неизвестное в значение по умолчанию, он теряет данные, а если ещё и повышает его, превращает чужое решение в своё. Правило такое: неизвестное либо отвергай осознанно, либо пропускай нетронутым, но никогда не угадывай."""

[[exercises]]
name = "npb13"
style = "scratch"
hint.ru = [
  """Oneof в prost это поле типа `Option<модуль::Enum>` с атрибутом `oneof = "модуль::Enum"` и `tags = "2, 3, 4"`. Сам enum выводится через `prost::Oneof`, у каждого варианта свой `#[prost(тип, tag = "N")]`.""",
  """У map в prost две формы: `map = "string, string"` с HashMap и `btree_map = "string, string"` с BTreeMap. Одна из них кодирует записи в порядке, который меняется от запуска к запуску.""",
  """Enum с вариантами клади в отдельный модуль (по соглашению в нижнем регистре с именем сообщения), чтобы не конфликтовать с типами сообщений.""",
]
why.ru = """Oneof на проводе это просто несколько обычных полей, а то, что вариант один, обеспечивает декодер правилом «побеждает последнее». Map на проводе это повторяющееся поле с вложенными записями ключ-значение, и порядка у него нет, значит кодировщик волен писать в любом. Если байты нужны детерминированными (кэш по хэшу, подпись, тесты), порядок задают сами: BTreeMap или явная сортировка."""

[[exercises]]
name = "npb14"
style = "scratch"
hint.ru = [
  """Собери номера из обеих схем (полей и reserved), отсортируй без повторов и для каждого реши, что с ним случилось: тип изменился, поле удалено, добавлено, резервирование снято.""",
  """Совместимость типов это таблица: целые и bool между собой, sint между sint, fixed между fixed, string и message с bytes. Если тип несовместим, различай: способ записи другой (`WireTypeChanged`) или тот же, но значения читаются неверно (`EncodingChanged`).""",
  """Порядок проверок для номера: поле осталось и зарезервировано (противоречие), поле осталось и сменило тип, поле удалено без резерва, поле добавлено на зарезервированный номер, резервирование потеряно.""",
]
why.ru = """Эволюция схем строится на четырёх привычках: не менять номера, не менять смысл типа, не удалять поле без резерва номера и не занимать резервы. Самое подлое изменение то, что проходит молча: int32 на sint32 читается без ошибок и даёт неверные числа, а старые байты лежат в базе. Автоматическая проверка схем в CI (как `buf breaking`) экономит именно такие потери."""

[[exercises]]
name = "npb_q1"
kind = "question"
question.ru = """Поле `delta` в метриках принимает значения от -5 до 5, примерно половина отрицательных. Какой тип выбрать, чтобы сообщения были меньше?"""
options.ru = [
  """int32: отрицательные числа в varint короче положительных""",
  """sint32: zigzag делает маленькие по модулю числа маленькими на проводе в обе стороны""",
  """sfixed32: всегда четыре байта, зато без сюрпризов""",
  """uint32 с добавлением смещения 5 на стороне приложения: это всегда выгоднее""",
]
answer = [1]
explain.ru = """int32 пишет любое отрицательное число десятью байтами (расширение знаком до 64 бит). sfixed32 всегда четыре байта, то есть хуже одного байта у sint32. Смещение на uint32 тоже даст один байт, но переносит часть схемы в код приложения и ломает читателей, которые про смещение не знают. Для величин с обоими знаками обычно берут sint32 или sint64."""
hint.ru = """Сколько байтов занимает -3 в int32 и сколько в sint32?"""

[[exercises]]
name = "npb_q2"
kind = "question"
question.ru = """Сервис A шлёт `repeated int32 ids = 3` в старой упаковке, каждое число отдельным полем с ключом. Сервис B ожидает упакованный список (`packed`, как по умолчанию в proto3). Что произойдёт при декодировании?"""
options.ru = [
  """Ошибка декодирования: способ записи не совпал с ожидаемым""",
  """B прочитает только последнее число, остальные потеряются""",
  """Всё прочитается: декодер обязан принимать оба вида записи, и значения сложатся в один список по порядку""",
  """B прочитает пустой список, потому что ждал Len, а пришёл Varint""",
]
answer = [2]
explain.ru = """Спецификация требует, чтобы читатель принимал repeated числовых полей в обоих видах, независимо от объявления: упаковку добавили позже, и старых писателей полно. Более того, в одном сообщении виды могут чередоваться. В отличие от скалярных полей (там побеждает последнее), элементы списка складываются."""
hint.ru = """Что сказано в спецификации про читателей repeated-полей: они ждут один вид записи или любой?"""

[[exercises]]
name = "npb_q3"
kind = "question"
question.ru = """В схеме `bool is_premium = 5`. Сервис получил сообщение, в котором байтов поля 5 нет. Что можно уверенно сказать о пользователе?"""
options.ru = [
  """Он не премиальный: false это отсутствие поля""",
  """Это неизвестно: поле могли не прислать, а могли прислать false, и оба случая на проводе выглядят одинаково. Если нужно различать, поле объявляют `optional bool` (или заводят обёртку/enum с состоянием «не указано»)""",
  """Он премиальный: отсутствие поля означает значение по умолчанию true""",
  """Декодер вернёт ошибку, потому что обязательное поле не пришло""",
]
answer = [1]
explain.ru = """В proto3 нет обязательных полей, а значение по умолчанию для bool это false. Разница между «не прислали» и «прислали false» стирается на уровне формата. Для флагов, где это важно (согласие, подписка, права), используют optional или enum с явным UNSPECIFIED, чтобы не принять отсутствие данных за решение пользователя."""
hint.ru = """Пишется ли false на провод в proto3?"""

[[exercises]]
name = "npb_q4"
kind = "question"
question.ru = """Полгода назад из схемы удалили `string phone = 4` без резервирования. Сегодня в то же сообщение добавили `int64 balance = 4`. В архиве лежат старые сообщения с телефонами. Что случится при чтении архива новым кодом?"""
options.ru = [
  """Ничего: имена полей в байтах не хранятся, а новое поле просто будет пустым""",
  """Номер 4 теперь означает другое. Телефон записан способом Len, а balance ждёт Varint: чтение либо упадёт с ошибкой типа, либо (в других случаях совпадения способа) тихо выдаст чужие данные под видом баланса. Удалённый номер надо было зарезервировать: `reserved 4;`""",
  """Новый код проигнорирует поле 4 как устаревшее""",
  """Компилятор protoc не даст собрать такую схему""",
]
answer = [1]
explain.ru = """Номер поля навсегда привязан к смыслу, потому что в байтах есть только он. Reserved нужен как раз для того, чтобы protoc запретил повторное использование номера и имени. Компилятор про старые данные в твоём архиве ничего не знает, поэтому сам ничего не запретит, а вот reserved спасёт от этой ошибки."""
hint.ru = """Что лежит в старых байтах: имя поля или его номер?"""

[[exercises]]
name = "npb_q5"
kind = "question"
question.ru = """Сервис подписывает HMAC байты protobuf-сообщения с полем `map<string, string> labels`, а проверяющая сторона кодирует то же самое сообщение заново из распарсенного и сверяет подпись. Иногда проверка падает без видимой причины. Что наиболее вероятно?"""
options.ru = [
  """HMAC нельзя применять к бинарным данным""",
  """Порядок записей map в байтах не определён: два кодирования равного сообщения могут дать разные байты (например, HashMap с случайным хэшем), и подпись не сойдётся. Подписывать надо исходные байты, а не пересобранные, либо использовать детерминированное кодирование (BTreeMap)""",
  """prost не умеет кодировать map""",
  """В protobuf подписи не поддерживаются на уровне формата""",
]
answer = [1]
explain.ru = """Каноничного кодирования у protobuf нет: порядок записей map, порядок полей, лишние нули в varint могут различаться у разных реализаций. Поэтому «разобрать и собрать заново» не гарантирует тех же байтов. Подписи считают по исходным байтам, которые пришли, а не по пересобранному."""
hint.ru = """Один ли у равных сообщений набор байтов, если в них есть map?"""

[[exercises]]
name = "npb_q6"
kind = "question"
question.ru = """Прокси на prost читает сообщение `Job` через `Job::decode`, меняет поле `name` и отправляет дальше через `encode_to_vec`. Новая версия схемы добавила поле 7 (`string trace_id = 7`), прокси собран по старой схеме. Что получит получатель?"""
options.ru = [
  """Сообщение с полем 7 без изменений: неизвестные поля prost хранит и пересылает""",
  """Сообщение без поля 7: prost при декодировании отбрасывает неизвестные поля, и при повторном кодировании их не будет. Если прокси должен быть прозрачным, ему нельзя собирать сообщение заново: нужно править байты на месте или хранить тело как bytes""",
  """Ошибку декодирования на прокси: неизвестные поля запрещены""",
  """Сообщение с полем 7, но с пустым значением""",
]
answer = [1]
explain.ru = """Спецификация protobuf разрешает хранить неизвестные поля, но prost этого не делает: они пропускаются при чтении и пропадают. Поэтому сервис «прочитал, поправил одно, записал» на prost теряет все поля более новой схемы. Это нужно знать, когда в цепочке есть сервис на старой версии схемы."""
hint.ru = """Есть ли в сгенерированной структуре prost место для поля, о котором схема ничего не знает?"""

[[exercises]]
name = "npb_build"
kind = "project"
style = "scratch"
locked = ["tests/acceptance.rs"]
quiz = true
hint.ru = [
  """Начни со схем: два файла в `proto/social/v1/`, пакет `social.v1` в обоих. Импорт `common.proto` пиши от корня include-пути (`social/v1/common.proto`), а не от файла. Потом `build.rs` с `prost_build::compile_protos`.""",
  """`compile_protos(&[файлы], &[корни_импортов])`: во втором аргументе папка `proto`. Не забудь напечатать `cargo:rerun-if-changed=proto`, чтобы cargo знал, когда запускать скрипт заново. Если `protoc` не найден, проверь `protoc --version` и переменную `PROTOC`.""",
  """Сгенерированный файл называется по пакету (`social.v1.rs`) и лежит в `OUT_DIR`. Подключи его макросом `include!` внутри вложенных модулей `social::v1`, чтобы пути в тестах совпали.""",
]
why.ru = """Единый источник правды для контрактов это сами .proto-файлы, а Rust-код из них лишь получается при сборке и не коммитится. Папки повторяют пакет и версию, чтобы несовместимое изменение получило соседний пакет, а не поломало старый. Timestamp берётся из prost-types, а не генерируется заново: иначе в каждом сервисе будет свой несовместимый по типам Timestamp, и передавать времена между крейтами станет нельзя."""

[[exercises]]
name = "npb_contracts"
kind = "project"
style = "scratch"
locked = ["tests/compat.rs"]
quiz = true
hint.ru = [
  """Идём по таблице из README сверху вниз. Удаляя `legacy_flag`, не просто сотри строку: номер и имя надо зарезервировать, иначе тест на `reserved` и следующий программист пожалуются.""",
  """Смена типа и переименование не меняют номера. Для `bio` нужно слово `optional`, для `media` блок `oneof` с двумя полями, для `reactions` `map<string, uint32>`. Импорт Timestamp пишется в начале файла.""",
  """Если тест говорит, что байты не совпали с согласованными, сверь номер и тип поля с таблицей: на проводе важны только они. Если не читаются байты первой версии, значит, где-то изменился номер или ушёл несовместимый тип.""",
]
why.ru = """Совместимость проверяют не разглядыванием схемы, а сохранёнными байтами: старые байты должны читаться новыми типами, а новые байты старыми читателями, и оба направления нужны, потому что сервисы выкатываются по одному. Зарезервированный номер защищает от самой коварной ошибки (повторного использования), а optional и oneof добавляют выразительности без поломки: на проводе это обычные поля. Такой набор тестов с bytes-литералами стоит держать рядом с контрактами навсегда."""
