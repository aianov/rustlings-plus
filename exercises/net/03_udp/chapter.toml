[chapter]
title.ru = "UDP: датаграммы без соединения"

[[chapter.visuals]]
file = "visuals/udp_vs_tcp.html"
title.ru = "UDP против TCP: потери, перестановки, дубли"

[[exercises]]
name = "nudp1"
style = "todo"
hint.ru = [
  """Порт 0 при `bind` значит «выбери любой свободный». Так одновременные вызовы не столкнутся.""",
  """`send_to` отправляет датаграмму, `recv_from` возвращает пару `(сколько байтов, откуда)`. Буфер заведи с запасом, а наружу отдай только `buf[..n]`.""",
]
why.ru = """У UDP нет соединения, поэтому клиенту не нужен ни `connect`, ни адрес «клиентского» порта заранее: порт 0 даёт временный. Ответ нужно резать по `n`: в буфере после `recv_from` лежит хвост от прошлых данных или нули, а датаграмма это ровно `n` байт. Адрес из `recv_from` пригодится дальше: именно по нему сервер отличает собеседников."""

[[exercises]]
name = "nudp_q1"
kind = "question"
question.ru = """Метеостанция дважды вызвала `send_to` на адрес коллектора: сначала 10 байт `T=21.5;H=40`, потом 20 байт. Коллектор вызывает `recv_from` с буфером на 64 байта, оба пакета уже лежат в очереди ядра. Что вернёт первый вызов?"""
options.ru = [
  "30 байт: UDP склеил оба сообщения, как TCP склеивает записи",
  "10 байт: одна датаграмма, ровно та, что отправили первой",
  "64 байта: буфер заполняется, пока в очереди есть данные",
  "Сколько-нибудь от 1 до 30: ядро режет по своему усмотрению",
]
answer = [1]
explain.ru = """Датаграмма это неделимая единица: один `send_to` даёт ровно один `recv_from`, а границы сообщений сохраняются самим протоколом. Поэтому в UDP не нужны ни разделители, ни префиксы длины, чем он и отличается от TCP, где первый вариант был бы верным. Платой за это идёт всё остальное: порядок и доставка не гарантированы. Второй `recv_from` вернёт 20 байт, если пакеты вообще дошли и не поменялись местами."""
hint.ru = "Что в UDP считается одной «порцией»?"

[[exercises]]
name = "nudp2"
style = "scratch"
hint.ru = [
  """Цикл по `0..count`: `recv_from`, затем `send_to` тому же адресу. Буфер заведи сразу большой: датаграмма может быть до 64 КБ.""",
  """В UDP ноль принятых байтов это не конец потока, а пустая, но настоящая датаграмма. Отдельной проверки на `n == 0` не нужно.""",
]
why.ru = """Читая из TCP, нулевой `read` означает «собеседник закрыл запись», и привычка проверять `n == 0` легко переезжает в UDP-код. Там это ошибка: пустая датаграмма законна (её используют как «стук» или keepalive), а закрытия у протокола нет вообще. Адрес для ответа берётся из каждой датаграммы заново, потому что один сокет обслуживает всех клиентов сразу."""

[[exercises]]
name = "nudp_q2"
kind = "question"
question.ru = """Приёмник читает `socket.recv_from(&mut buf)` в буфер на 4 байта. Пришли две датаграммы: `ABCDEFGHIJ` и затем `xyz`. Что вернут два вызова подряд (на Linux и macOS)?"""
options.ru = [
  "`ABCD`, потом `EFGH`: остаток первой датаграммы дочитывается следующим вызовом, как в TCP",
  "`ABCD`, потом `xyz`: остаток первой датаграммы выброшен молча",
  "`ABCDEFGHIJ`, потом `xyz`: tokio сам увеличивает буфер",
  "Ошибка на первом вызове: буфер меньше датаграммы",
]
answer = [1]
explain.ru = """Если буфер меньше датаграммы, ядро кладёт в него начало, а остаток выбрасывает, и узнать об этом без специальных флагов нельзя (`MSG_TRUNC` в tokio не выведен; на Windows, кстати, будет ошибка, поэтому код, который на неё полагается, непереносим). Следующий вызов читает уже следующую датаграмму. Отсюда правило: буфер ставят не меньше максимального размера сообщения протокола, а чтобы поймать превышение, берут размер на байт больше и смотрят, не вернулось ли больше лимита."""
hint.ru = "Остаток датаграммы кто-то хранит, как в TCP-потоке?"

[[exercises]]
name = "nudp3"
style = "fix"
hint.ru = [
  """Ядро обрезает датаграмму до размера буфера и не говорит об этом. Как отличить «пришло ровно limit» от «пришло больше limit», если буфер ровно limit?""",
  """Если буфер хоть на байт больше лимита, то слишком длинное сообщение обнаружит себя длиной: `n > limit`.""",
  """Заведи буфер `limit + 1`, после `recv_from` проверь `n > limit` и верни `io::Error::new(InvalidData, ...)`. Содержимое не нужно, оно целиком уже вычитано и следующее чтение чистое.""",
]
why.ru = """Тихое обрезание это не баг tokio, а свойство UDP: информации о потере хвоста у приложения нет. Единственный переносимый способ её получить: читать в буфер на один байт больше допустимого. Заодно ошибка не портит дальнейшую работу: ядро уже отдало датаграмму целиком, и следующий `recv_from` читает следующую."""

[[exercises]]
name = "nudp4"
style = "todo"
hint.ru = [
  """У UDP-сокета тоже есть `connect`. Он ничего не посылает по сети, а только запоминает адрес собеседника.""",
  """После `connect` работают `send` и `recv` без адресов, а датаграммы от других адресов ядро отбрасывает само. Там же система начинает сообщать об ICMP-ответах «порт закрыт».""",
]
why.ru = """`connect` у UDP это не рукопожатие, а фильтр и запоминание адреса в ядре. Он даёт две вещи сразу: чужие датаграммы не доходят до программы (одна из причин, почему «ответ» нельзя принимать от кого попало) и ICMP «port unreachable» превращается в ошибку `ConnectionRefused` на следующем `recv`. Без `connect` клиент в обоих случаях ничего не заметит: либо примет чужое, либо будет ждать вечно."""

[[exercises]]
name = "nudp5"
style = "scratch"
hint.ru = [
  """Цикл по попыткам. В каждой: отправка и `tokio::time::timeout(per_attempt, socket.recv(..))`. Ответ внутри таймаута значит успех, `Err` от таймаута значит «пробуем снова».""",
  """Не создавай новый сокет на каждую попытку: поздний ответ на прошлую попытку придёт на старый адрес и пропадёт. Один сокет (с `connect`) на весь вызов. Ошибки самого сокета (`?`) отделяй от таймаута: это разные вещи.""",
]
why.ru = """Повтор по таймауту это вся «надёжность» UDP в одной функции. Важны два предела: число попыток (иначе недоступный сервер держит клиента вечно) и пауза между ними (иначе пачка запросов только добьёт перегруженный сервер). Заметь, что клиент не может узнать, потерялся запрос или ответ, поэтому сервер может получить повтор уже выполненного запроса. Что с этим делать, показывает следующий вопрос."""

[[exercises]]
name = "nudp_q3"
kind = "question"
question.ru = """Клиент платёжного шлюза шлёт по UDP «списать 100 рублей» и повторяет запрос при молчании. Три раза подряд ответа нет, но на счёте списано дважды. Что произошло?"""
options.ru = [
  "Таймаут был слишком короткий: если поставить минуту, повторов не будет и деньги спишутся один раз",
  "Первый запрос дошёл и выполнился, но ответ потерялся, и повтор выполнился ещё раз: сервер принял его за новый платёж",
  "Сеть изменила сумму в пути: UDP не проверяет целостность, и без контрольной суммы платежи невозможны",
  "Платежи по UDP принципиально невозможны: единственный выход это перейти на TCP и забыть про повторы",
]
answer = [1]
explain.ru = """Потеря ответа неотличима от потери запроса, поэтому повтор принципиально может выполнить действие второй раз. Лекарство называется идемпотентностью (операцию с уникальным id сервер не выполняет второй раз): у операции есть уникальный id, а сервер хранит результат и на повтор с тем же id возвращает его, не выполняя заново. Длинный таймаут только прячет проблему. Контрольная сумма в UDP есть, повреждённые пакеты отбрасываются. Выбор TCP не снимает вопроса: при обрыве соединения клиент точно так же не знает, выполнено ли списание."""
hint.ru = "Клиент видит только отсутствие ответа. Что именно потерялось?"

[[exercises]]
name = "nudp_q4"
kind = "question"
question.ru = """Клиент отправил запрос с номером 7, получил ответ на него и перешёл к запросу 8. Сеть задвоила пакет: опять пришёл ответ с номером 7. Что делать клиенту?"""
options.ru = [
  "Принять как ответ на 8: он последний и пришёл раньше настоящего",
  "Выбросить: номер 7 уже не ожидается, ответ на 8 придёт со своим номером",
  "Закрыть сокет: протокол нарушен",
  "Подождать и посмотреть, совпадёт ли содержимое с ответом на 7",
]
answer = [1]
explain.ru = """Задвоение и опоздание нормальны для UDP. Клиент помнит, какой номер ждёт сейчас, и всё остальное отбрасывает молча, без паники и без закрытия сокета. Принять чужой ответ значит отдать пользователю данные не на тот вопрос, причём ошибка выглядит как успех и находится только в продакшене. Сравнение содержимого ненадёжно: два разных запроса вполне могут получить одинаковые ответы."""
hint.ru = "Что в пакете говорит, на какой вопрос это ответ?"

[[exercises]]
name = "nudp6"
style = "bughunt"
hint.ru = [
  """Ответы приходят в любом порядке и по нескольку раз, а клиент принимает первый попавшийся. Чем ответ на «этот» вопрос отличается от остальных?""",
  """Нужен счётчик запросов: его кладут в первые 4 байта и сверяют в ответе. Чужие и слишком короткие пакеты пропускают и читают дальше.""",
  """Читай в цикле, а срок ожидания (`Instant` и `timeout_at`) считай один раз до цикла, иначе поток мусора будет продлевать ожидание до бесконечности. Не забудь `n >= 4` до среза.""",
]
why.ru = """Номер запроса это основа любого надёжного протокола поверх UDP (DNS, NTP, QUIC делают то же самое). Он отвечает сразу на три беды: запоздавший ответ прошлого вызова, дубль и чужой пакет. Общий дедлайн на цикл важен отдельно: если на каждом пропущенном пакете запускать таймаут заново, злоумышленник (или баг) с потоком мусора заморозит клиента навсегда."""

[[exercises]]
name = "nudp_ping"
kind = "project"
style = "scratch"
quiz = true
locked = ["tests/acceptance.rs"]
hint.ru = [
  """Два источника событий сразу: таймер отправки и приход пакетов, поэтому `tokio::select!` с `interval`. Номер пакета это индекс в `Vec<Instant>`, время отправки лежит там же.""",
  """Для перестановки помни наибольший номер, который уже видели: ответ с меньшим номером, пришедший впервые, переставлен. Дубль определяется отдельным вектором `seen` и проверяется раньше.""",
  """Когда отправлен последний номер, заведи дедлайн `now + wait` и добавь в `select!` ветку `sleep_until` с условием `if deadline.is_some()`. Ветку таймера отправки отключи условием, когда отправлять больше нечего.""",
]
why.ru = """Инструмент собирает всё, чему учит глава. Сокет с `connect` отсекает чужое, номера отличают дубль и перестановку от нормы, таймер и дедлайн не дают ожиданию стать вечным. Главная идея в том, что UDP-клиент это конечный автомат из событий (тик отправки, пакет, конец ожидания), а не последовательность «отправил, подождал»: последняя на потере каждого пакета простаивает целый таймаут."""
