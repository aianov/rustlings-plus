[[exercises]]
name = "nha1"
style = "todo"
hint.ru = [
  """Разделитель пар `;`, разделитель имени и значения первое `=`. Пара без `=` или с пустым именем пропускается без ошибки.""",
  """`split_once('=')` отрезает ровно по первому знаку равенства, всё остальное остаётся в значении. Края имени и значения обрежь пробелами. Кавычки снимай только если есть обе.""",
  """Имя с пробелом внутри (`bad name`) значит порчу всей пары: пропусти её. `cookie` это обычный поиск первого совпадения, без приведения регистра.""",
]
why.ru = """Заголовок `Cookie` это не список «имя: значение», а плоская строка, и парсер для неё должен быть терпимым: браузеры, прокси и библиотеки пишут её по-разному. Терпимость не значит доверие: значение приходит от клиента и может быть чем угодно, поэтому данные из cookie всегда проверяются (подпись токена, формат). Повторы возможны (cookie с одним именем на разных путях), браузер ставит более специфичные первыми, потому и берётся первое."""

[[exercises]]
name = "nha2"
style = "todo"
hint.ru = [
  """Сначала проверки, потом сборка строки. Для значения проще всего описать, какие байты разрешены (печатные ASCII, кроме пяти запрещённых), а не какие запрещены.""",
  """Префикс `__Host-` обещает: Secure, `Path=/` и никакого Domain. `__Secure-` обещает только Secure. Это ограничения самой библиотеки, не браузера: ты отказываешься выдавать cookie, которое браузер отвергнет.""",
  """Удаление это не отдельный заголовок, а тот же `Set-Cookie` с пустым значением и `Max-Age=0`. Браузер сопоставляет cookie по имени, пути и домену, поэтому путь (а домен, если использовался) должен совпасть с тем, с которым cookie выдавали.""",
]
why.ru = """Cookie это пара «заголовок и атрибуты», в которой любой символ из чужого значения может стать управляющим. Поэтому библиотека, собирающая `Set-Cookie`, отказывается, а не вычищает: вычищенное значение меняет смысл (токен перестаёт сходиться с подписью), а отказ виден сразу. Порядок атрибутов не важен для браузера, но важен для тестов и для сравнения заголовков в журналах. Удаление cookie возможно только с теми же `Path` и `Domain`, иначе браузер хранит старое и клиент «не может выйти»."""

[[exercises]]
name = "nha_q1"
kind = "question"
question.ru = """Сервер выдал при входе `Set-Cookie: sid=abc; Path=/api; HttpOnly`. При выходе обработчик `/auth/logout` отвечает `Set-Cookie: sid=; Max-Age=0` (без `Path`). Что останется в браузере?"""
options.ru = [
  "Cookie `sid` удалена: имя совпало",
  "Cookie `sid` с `Path=/api` остаётся: удаляющая cookie получила другой путь (по умолчанию из адреса запроса, то есть `/auth`) и считается другой cookie",
  "Браузер покажет ошибку: у удаляющей cookie должен быть `Path`",
  "Cookie удалится, но только до закрытия браузера",
]
answer = [1]
explain.ru = """Cookie различаются по тройке «имя, домен, путь». Без `Path` браузер берёт путь по умолчанию из адреса запроса, `/auth/logout` даёт `/auth`, а выданная cookie жила на `/api`. Получилась другая cookie, старая осталась, и пользователь «не может выйти». Поэтому при удалении `Path` и `Domain` повторяют ровно те, с которыми выдавали."""
hint.ru = """По каким полям браузер сопоставляет cookie, когда её надо заменить или удалить?"""

[[exercises]]
name = "nha3"
style = "todo"
hint.ru = [
  """Origin сравнивается строкой целиком: `http://app.example` и `https://app.example` разные, как и `app.example:8443` с `app.example`. Никаких `starts_with` и `contains`.""",
  """Разрешённому Origin возвращай его же: ответ `Access-Control-Allow-Origin` содержит один адрес, а не весь список. Для чужих заголовок просто не ставится, ошибки браузер сделает сам.""",
  """`Vary: Origin` добавляется всегда, даже для чужих и для запросов без Origin: кеш, запомнивший ответ без разрешения для одного сайта, отдаст его потом разрешённому и сломает ему страницу.""",
]
why.ru = """CORS это не защита сервера, а разрешение для браузера: запрос с чужого сайта всё равно доходит и выполняется, а запрещается только чтение ответа страницей. Поэтому разрешать надо точечно, по полному совпадению Origin, а не по префиксу или подстроке (`https://app.example.evil.com`). `Vary: Origin` нужен всегда по простой причине: ответ меняется в зависимости от заголовка запроса, и кеш без этой подсказки перепутает ответы для разных сайтов."""

[[exercises]]
name = "nha4"
style = "todo"
hint.ru = [
  """Предзапрос определяется тремя признаками вместе: метод OPTIONS, заголовок Origin и Access-Control-Request-Method. Нет любого из них, значит это обычный OPTIONS, и отвечать должен обычный обработчик.""",
  """Запрошенные заголовки приходят одной строкой через запятую: разбери её, обрежь пробелы и сравни с разрешёнными без учёта регистра. Метод сравнивается точно.""",
  """Проверь всё до сборки ответа: либо все три условия выполнены и ответ 204, либо 403 без разрешающих заголовков. В `Vary` перечисли каждый заголовок запроса, от которого зависит ответ.""",
]
why.ru = """Предзапрос отвечает на вопрос браузера, а не выполняет работу: у него нет тела, он не должен доходить до бизнес-логики и авторизации (браузер не шлёт на него токен). Поэтому предзапросы обрабатываются в слое CORS раньше всех остальных слоёв и не требуют токена. `Access-Control-Max-Age` экономит предзапросы: браузер кеширует разрешение, но на ограниченное время, чтобы изменение политики дошло до пользователей. Отказ 403 без заголовков приведёт к ошибке CORS в консоли браузера, и это правильно."""

[[exercises]]
name = "nha5"
style = "bughunt"
hint.ru = [
  """Прочитай тесты как симптомы: какие ответы остаются без разрешения? Что должно стоять в `Access-Control-Allow-Origin`, когда включены cookie? Что добавлено в ответ, который мог бы выглядеть иначе для другого сайта?""",
  """Разрешение на ответ нужно ставить независимо от статуса: браузер должен дать странице прочитать и ошибку. Если в политике шаблон и включены credentials, возвращай Origin запроса, а не звёздочку. `Vary: Origin` добавляй всегда, когда ответ может зависеть от Origin.""",
  """Звёздочка постоянная только при шаблоне без credentials: тогда ответ от Origin не зависит и Vary не нужен. Во всех остальных случаях добавляй Vary отдельной строкой, существующий Vary обработчика не затирай.""",
]
why.ru = """Эти три ошибки встречаются чаще, чем любые другие в CORS, и все видны только из браузера: сервер не понимает, что что-то не так, curl работает, тесты на 200 проходят. Ответ об ошибке без CORS-заголовков маскирует настоящую ошибку (`CORS error` вместо `401`) и ломает диагностику у фронта. `*` с credentials спецификация запрещает, браузер просто не отдаст ответ. А `Vary: Origin` защищает от отравления кеша: ответ с разрешением для одного сайта нельзя показывать другому."""

[[exercises]]
name = "nha_q2"
kind = "question"
question.ru = """API отвечает на все запросы `Access-Control-Allow-Origin: *`. Фронт включает в `fetch` режим `credentials: 'include'`, чтобы отправлять cookie, а сервер дополнительно присылает `Access-Control-Allow-Credentials: true`. В журнале сервера везде 200. Что происходит у страницы?"""
options.ru = [
  "Всё работает: сервер разрешил всё",
  "Браузер отбрасывает ответ, JavaScript видит ошибку сети; сервер ничего не замечает",
  "Cookie отправляются, но ответ приходит без тела",
  "Браузер понижает режим и повторяет запрос без cookie",
]
answer = [1]
explain.ru = """Спецификация запрещает `*` вместе с учётными данными: разрешать нужно конкретный origin запроса. Браузер проверяет это на своей стороне и просто выбрасывает ответ, так что сервер видит успешный запрос и не получает никакого сигнала об ошибке. Поэтому в слое CORS для шаблона с credentials возвращают Origin запроса и `Vary: Origin`."""
hint.ru = """Кто проверяет совместимость `*` и credentials: сервер или браузер, и что он делает при нарушении?"""

[[exercises]]
name = "nha_q3"
kind = "question"
question.ru = """Перед API стоит CDN, который кеширует GET `/feed` по адресу. Слой CORS отвечает на запрос от `https://a.example` заголовком `Access-Control-Allow-Origin: https://a.example` и не добавляет `Vary`. Через минуту тот же `/feed` запрашивает страница с `https://b.example`, которой тоже разрешён доступ. Что она получит?"""
options.ru = [
  "Свежий ответ от API с `Allow-Origin: https://b.example`",
  "Закешированный ответ с `Allow-Origin: https://a.example`: браузер отвергнет его, и страница увидит ошибку CORS",
  "Ответ 304 без тела",
  "Ошибку 403 от CDN",
]
answer = [1]
explain.ru = """Без `Vary: Origin` кеш считает, что ответ на адрес один для всех, и отдаёт запомненный. Заголовок разрешает другому сайту, браузер b.example его отвергает. Баг зависит от порядка запросов, воспроизводится плохо и пропадает при очистке кеша. `Vary: Origin` говорит кешу хранить отдельные копии для каждого значения Origin."""
hint.ru = """Что кеш знает о том, что ответ зависит от заголовка Origin?"""

[[exercises]]
name = "nha6"
style = "todo"
hint.ru = [
  """If-None-Match это список тегов через запятую, а не один тег. Сравнивать весь заголовок с etag нельзя: клиент может прислать несколько версий сразу, со слабым префиксом или звёздочку.""",
  """Режь по запятым, но только вне кавычек: сам etag может содержать запятую. Каждый кандидат: срежь пробелы, отбрось `W/`, сравни остаток с etag вместе с кавычками.""",
  """304 и 200 отличаются телом и длиной, а ETag и Cache-Control общие, соберём их заранее. Для HEAD тело не добавляй, но длину оставь настоящей.""",
]
why.ru = """Условные запросы экономят канал, а не вычисления: сервер всё равно считает, какая у ресурса версия, но тело по сети не гонит. Валидатор может быть слабым (`W/`): «по смыслу то же самое», и для GET сравнение слабое. Звёздочка в `If-None-Match` нужна в основном для `PUT`, но разобрать её правильно тоже нужно. `Cache-Control: no-cache` не запрещает кеш, а требует перепроверки: именно то, что нужно для данных, которые могут измениться."""

[[exercises]]
name = "nha7"
style = "scratch"
hint.ru = [
  """Три формы: `первый-последний`, `первый-` (до конца), `-N` (последние N байтов). Отдели число от пустоты и разбери четыре случая отдельно, не пытаясь свести их в одну формулу.""",
  """Конец диапазона обрезается до `len - 1`, а вот начало за пределами файла это 416. Если конец меньше начала, диапазон синтаксически испорчен: по стандарту его игнорируют (200), а не отказывают (416). То же с непонятной единицей, не `bytes`.""",
  """Числа проверяй по цифрам до `parse`: `+1` разбирается как число. `len = 0` ломает `len - 1`, обработай пустой файл до вычитания. В ответе 416 длина всего файла стоит в `Content-Range` после `*/`.""",
]
why.ru = """Range это единственный заголовок, где «не понял» означает «отдай всё»: ошибка в разборе не должна превращаться в отказ. Различие 200 и 416 тонкое: испорченный диапазон игнорируется, а корректный, но невыполнимый получает 416 и подсказку о настоящем размере. `Accept-Ranges: bytes` в обычном ответе сообщает, что докачка возможна. Все границы проверяются целыми беззнаковыми числами, поэтому `len - 1` на пустом файле это единственная возможная паника, и её нужно предусмотреть заранее."""

[[exercises]]
name = "nha_q4"
kind = "question"
question.ru = """Файл занимает 1000 байт. Клиент отправил `Range: bytes=900-100`. Что должен ответить сервер?"""
options.ru = [
  "`416 Range Not Satisfiable` с `Content-Range: bytes */1000`",
  "`206 Partial Content` с байтами с 100 по 900",
  "`200 OK` с файлом целиком",
  "`400 Bad Request`",
]
answer = [2]
explain.ru = """Конец раньше начала это синтаксически неверный диапазон. Стандарт велит такой `Range` игнорировать и отвечать как на обычный запрос: 200 с целым файлом. 416 предназначен для корректных диапазонов, которые невозможно выполнить, например `bytes=1000-` у файла в 1000 байт. Игнорирование здесь безопаснее отказа: клиент хотя бы получит данные."""
hint.ru = """Какой диапазон корректен синтаксически, а какой нет, и что с каждым делать?"""

[[exercises]]
name = "nha8"
style = "scratch"
hint.ru = [
  """Это конечный автомат с состояниями: остаток тела по длине, ожидание размера куска, данные куска, CRLF после куска, трейлеры, конец. Каждый вызов `next_chunk` делает шаги автомата, пока не получит данные или конец.""",
  """Данные отдавай через `piece`: он берёт из буфера (а если там пусто, дочитывает) не больше `left` и не больше 4096 байт. Размер куска проверяй сразу после разбора числа, до перехода к данным, по формуле «сколько осталось до лимита».""",
  """Трейлеры после нулевого куска читай строками до пустой. Строка размера может содержать расширение после `;`, его отбрось. Размер, не поместившийся в `u64`, и пустая строка вместо размера это `InvalidData`, а не паника.""",
]
why.ru = """Потоковое чтение держит память постоянной: процесс, принимающий тысячу загрузок, не должен знать их размеров заранее. Отказ по заявленной длине (`Content-Length` или размеру куска) сработает до того, как хоть байт тела попал в память, а сумма проверяется накопительно, потому что chunked позволяет прислать бесконечно много маленьких кусков. Остаток за телом нельзя ни читать, ни выбрасывать: он принадлежит следующему запросу на этом же соединении."""

[[exercises]]
name = "nha9"
style = "bughunt"
hint.ru = [
  """Тело запроса принадлежит запросу, даже если обработчик его не читал. Кто должен его убрать из потока, прежде чем сервер начнёт разбирать следующую голову?""",
  """После ответа, не читавшего тело, определи его границы (`body_framing`) и вычитай через `BodyReader` вместе с `drain(DRAIN_CAP)`. Если вычитать не вышло (слишком большое, оборвано, мусор), соединение продолжать нельзя.""",
  """Для заявленной длины больше `DRAIN_CAP` не читай ничего: ответ уходит с `Connection: close`, и сервер закрывает соединение. Ответ нужно сформировать после решения: признак keep-alive зависит от того, получилось ли вычитать тело.""",
]
why.ru = """Граница запроса определяется заголовками, а не содержимым, и пока тело не вычитано, поток ещё внутри этого запроса. Забытое тело дороже ошибки разбора: по нему можно подсунуть серверу чужой запрос (request smuggling). Вычитывать большое тело ради возможности продолжить соединение невыгодно (злоумышленник может присылать терабайты ради нашей вежливости), поэтому предел и закрытие. Решение «держать ли соединение» принимается до записи ответа, потому что клиент должен узнать о закрытии из заголовка."""

[[exercises]]
name = "nha_q5"
kind = "question"
question.ru = """Сервер вычитывает непрочитанные тела запросов до 64 КиБ, чтобы сохранить keep-alive. Клиент присылает `PUT /avatar` с `Content-Length: 5368709120` (5 ГиБ), обработчик сразу отвечает `403`. Как поступить серверу?"""
options.ru = [
  "Вычитать 5 ГиБ и выбросить: иначе соединение испортится",
  "Ответить 403 с `Connection: close` и закрыть соединение, не читая тело",
  "Ответить 403 и разбирать дальнейшие байты как следующий запрос",
  "Не отвечать вовсе, пока тело не придёт",
]
answer = [1]
explain.ru = """Вычитывать пять гигабайт значит дать клиенту рычаг: он может держать сервер занятым чужими байтами сколько захочет. Для большого тела выгоднее закрыть соединение. Читать байты дальше как запросы нельзя ни в коем случае: это путь к request smuggling. Решение о закрытии принимается до записи ответа, потому что клиент узнаёт о нём из заголовка `Connection: close`."""
hint.ru = """Что дороже: потерять keep-alive или разрешить клиенту тратить ресурсы сервера?"""

[[exercises]]
name = "nha_api_kit"
style = "scratch"
kind = "project"
locked = ["tests/acceptance.rs", "tests/part2.rs"]
quiz = true
hint.ru = [
  """Модули независимы: начни с `cookie.rs`, потом `conditional.rs` и `body.rs` (чистые функции), затем `cors.rs` и в конце `files.rs`, который их собирает. Тесты первых модулей идут без сети.""",
  """Все решения лежат в задачах главы: nha2 (to_header), nha5 (слой cors, верная версия без трёх ошибок), nha6 и nha7 (условные запросы и диапазоны), nha8 (читатель). Здесь они переписываются на типы движка: `Request`, `Response`, `Headers`.""",
  """`serve_bytes` проверяет условие раньше диапазона и только для GET и HEAD. Роутер сам отправляет HEAD в GET-обработчик, а движок отрезает тело, так что отдельной ветки для HEAD в обработчике нет. 413 на слишком большую загрузку не должен ломать соединение.""",
]
why.ru = """Здесь собирается то, что браузеру нужно от API: cookie с нужными атрибутами, CORS, который работает и на ошибках, кеширование без передачи тела, докачка и аккуратная работа с телом запроса. Слои независимы и подключаются в `apply` в любом порядке, но CORS стоит снаружи авторизации, иначе предзапрос без токена получит 401. Сервис файлов нужен как стенд: на нём видно, как условные запросы и диапазоны работают вместе по настоящей сети."""

[[exercises]]
name = "m27_browser_media"
kind = "milestone"
journey = "backend"
quiz = true
