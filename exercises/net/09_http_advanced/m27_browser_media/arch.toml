message.ru = "Не хватает файла из дерева вехи. Разбор строк (Command, ChatCommand, Input) и сессия провода (contracts/src/session) живут в src/crates/contracts, переписка в src/crates/social-core/src/chat, шина событий в events/, адаптер страниц в feed/, скрытые авторы в network/mutes.rs, уведомители в notify/, таблица команд «service.method» в commands/table.rs ядра с обработчиками по сервисам (users.rs, posts.rs, comments.rs, chat.rs, notify.rs, admin.rs), async-порты в ports/repo.rs и синхронные хранилища в ports/store.rs, реализации в памяти в storage/mem (repo.rs, users.rs, posts.rs, app.rs), запросы фасада в app/queries.rs, медленные фейки портов в test-support/src/slow, токен отмены, учёт задач, супервизор, остановка по стадиям и консоль задач в src/crates/service-runtime (token/, tracker/, supervisor/, shutdown/, console/ с traced.rs), формат журнала в contracts/src/journal и видимость поста в contracts/src/visibility, журнал ядра в social-core/src/journal (writer.rs, replay.rs, file.rs, error.rs), восстановление в network/restore.rs, запись журнала в app/journal.rs и операции записи в app/writes.rs, кусочные приёмник и источник в test-support/src/io, стримы ленты в social-core/src/feed/stream.rs и живая лента фасада в app/live.rs, контракт провода в contracts (envelope/, api/, push/, error/), курсор страниц в contracts/src/cursor, индексы автора и тегов и операции с постами и комментариями в network/ ядра, часы в contracts/src/clock (Clock, SystemClock), отрисовка ответов в commands/render.rs, тренды в trends/, комментарии в comments/, исполнение вызовов в api/ ядра, ошибки крейтов в их error/, асинхронный фасад App в app/ ядра (mod.rs, config.rs, error.rs, fanout.rs, heavy.rs, import.rs, trends.rs), шардированная карта в shards/, асинхронная шина событий в events/bus.rs, живые настройки в app/settings.rs и contracts/src/setting, карточка профиля в app/card.rs, фейки, часы, счётчик аллокаций и замеры в src/crates/test-support, свои интеграционные тесты ядра в tests/clock.rs с общим tests/common/mod.rs, пример замера в social-core/examples/feed_bench.rs, его запуск в tools/xtask/src/bench.rs, свой Framed и кодеки в src/crates/framing (codec/, framed/, lines/, length/), свой HTTP в src/crates/http-engine (method/, status/, headers/, request/, response/, parse/ с chunked.rs и text.rs, router/, server/, middleware/, cors/, cookie/, conditional/, body/), свой клиент в src/crates/http-client (url/, wire/ с head.rs и body.rs, pool/, client/ с request.rs, error/), свои интеграционные тесты HTTP-API в api-gateway/tests/http_api.rs, фаззер в src/crates/minifuzz (rng/, mutate/, shrink/, fuzz/, split/), вход и токены в contracts/src/auth, шлюз в src/microservices/api-gateway (auth/ с токенами, http/ с маршрутами по файлам auth.rs, users.rs, posts.rs, avatars.rs, media/ с аватарами в памяти, main.rs с TcpListener::bind, lib.rs с run, config/, server/ с циклом accept, connection/ с чтением и writer-задачей, protocol/, session/ с автоматом сессии, hub/ с соединениями пользователей, error/), скрипты разработчика в tools/xtask, файлы окружения в корне. Если нет .env, скопируй его из .env.example."

[[rules]]
kind = "allowed_children"
dirs = ["src"]
allowed = ["crates", "microservices"]
message.ru = "В src/ корня только две папки: crates/ для библиотек и microservices/ для сервисов."

[[rules]]
kind = "absent"
globs = ["tests/*.rs"]
message.ru = "В корне воркспейса нет пакета, поэтому tests/*.rs там никто не скомпилирует, и тесты молча перестанут работать. Тесты прошлых вех живут в tests/ своих пакетов."

[[rules]]
kind = "not_contains"
globs = ["Cargo.toml"]
regex = '^\[package\]'
message.ru = "Корневой Cargo.toml виртуальный: в нём [workspace] и общие таблицы, а [package] нет. Пакеты это src/crates/* и tools/*."

[[rules]]
kind = "contains"
globs = ["Cargo.toml"]
regex = 'resolver = "3"'
message.ru = "В виртуальном корне нужна строка `resolver = \"3\"` в [workspace]: у корня нет edition, и без неё cargo молча возьмёт старый резолвер."

[[rules]]
kind = "workspace_members"
members = [
  "src/crates/social-core",
  "src/crates/contracts",
  "src/crates/test-support",
  "src/crates/service-runtime",
  "tools/xtask",
  "src/crates/framing",
  "src/microservices/api-gateway",
  "tools/social-cli",
  "src/crates/http-engine",
  "src/crates/minifuzz",
  "src/crates/http-client",
]
message.ru = "В [workspace] members не попадают все пакеты. Удобнее всего три маски: \"src/crates/*\", \"src/microservices/*\" и \"tools/*\"."

[[rules]]
kind = "contains"
globs = ["Cargo.toml"]
regex = '^\[workspace.package\]'
message.ru = "Общие поля пакетов (version, edition, rust-version, publish) живут в [workspace.package] корня."

[[rules]]
kind = "contains"
globs = ["src/crates/*/Cargo.toml", "tools/xtask/Cargo.toml", "src/microservices/*/Cargo.toml"]
regex = '^version.workspace = true'
message.ru = "Версию пакет наследует из корня: `version.workspace = true`. Тогда версия у всех одна и правится в одном месте."

[[rules]]
kind = "contains"
globs = ["src/crates/*/Cargo.toml", "tools/xtask/Cargo.toml", "src/microservices/*/Cargo.toml"]
regex = '^edition.workspace = true'
message.ru = "Edition пакет наследует из корня: `edition.workspace = true`."

[[rules]]
kind = "workspace_deps"
packages = ["src/crates/*", "src/microservices/*", "tools/xtask"]
message.ru = "Зависимость объявлена в пакете напрямую. Все зависимости, и внутренние крейты тоже, описываются в [workspace.dependencies] корня, а в пакете `имя.workspace = true`."

[[rules]]
kind = "deps"
package = "src/crates/contracts"
allow_only = ["serde", "serde_json"]
message.ru = "contracts это нижний слой: типы, ники, команды и контракт провода. Из чужого ему нужны только serde и serde_json, а ядро и терминал зависят от него. Стрелки идут только вниз."

[[rules]]
kind = "deps"
package = "src/crates/social-core"
forbid = ["api-gateway", "social-cli"]
message.ru = "Ядро не знает про шлюз и клиента: api-gateway зависит от social-core, а не наоборот."

[[rules]]
kind = "deps"
package = "src/crates/social-core"
forbid = ["serde", "serde_json"]
message.ru = "Ядро не читает и не пишет JSON само: конверты разбирает и печатает contracts (decode, decode_call, write_line), а ядро получает готовый Call и отдаёт Reply. Тогда протокол живёт в одном месте."

[[rules]]
kind = "contains"
globs = ["Cargo.toml"]
regex = '^\[workspace.lints'
message.ru = "Правила проверок общие для всех: [workspace.lints.rust] и [workspace.lints.clippy] в корне."

[[rules]]
kind = "contains"
globs = ["Cargo.toml"]
regex = 'unsafe_code = "forbid"'
message.ru = "В [workspace.lints.rust] нужен `unsafe_code = \"forbid\"`: соцсети unsafe не нужен, и пусть компилятор это гарантирует."

[[rules]]
kind = "contains"
globs = ["Cargo.toml"]
regex = 'unwrap_used = "deny"'
message.ru = "В [workspace.lints.clippy] нужен `unwrap_used = \"deny\"`: договорённость «без unwrap» теперь проверяет clippy, в том числе в тестах (там вместо него expect с объяснением)."

[[rules]]
kind = "contains"
globs = [
  "src/crates/contracts/Cargo.toml",
  "src/crates/social-core/Cargo.toml",
  "src/crates/service-runtime/Cargo.toml",
  "tools/xtask/Cargo.toml",
  "src/crates/framing/Cargo.toml",
  "src/microservices/*/Cargo.toml",
]
regex = '^workspace = true'
message.ru = "Пакет не подключил общие правила. Без `[lints]` и строки `workspace = true` под ней правила корня на него не действуют, и никто этого не заметит. Исключение одно, test-support: ему нужен unsafe для счётчика аллокаций, и правила он пишет себе сам."

[[rules]]
kind = "contains"
globs = ["Cargo.toml"]
regex = '^\[profile.release\]'
message.ru = "Профиль релизной сборки задаётся в корне воркспейса: [profile.release] в пакетах cargo игнорирует."

[[rules]]
kind = "uniform_modules"
roots = [
  "src/crates/social-core/src",
  "src/crates/contracts/src",
  "src/crates/test-support/src",
  "src/crates/service-runtime/src",
  "tools/xtask/src",
  "src/crates/framing/src",
  "src/microservices/api-gateway/src",
  "src/crates/http-engine/src",
  "src/crates/minifuzz/src",
  "src/crates/http-client/src",
]
message.ru = "В одной папке смешаны файлы-модули и папки-модули. Рядом с lib.rs лежат только папки-модули, внутри папок только файлы .rs."

[[rules]]
kind = "not_contains"
globs = ["src/crates/*/src/lib.rs", "src/microservices/*/src/lib.rs"]
regex = 'struct '
message.ru = "lib.rs крейта и сервиса это фасад: только `mod ...;` и `pub use ...;`. Структуры живут в модулях."

[[rules]]
kind = "not_contains"
globs = ["src/crates/*/src/lib.rs", "src/microservices/*/src/lib.rs"]
regex = 'enum '
message.ru = "lib.rs крейта и сервиса это фасад: только `mod ...;` и `pub use ...;`. Перечисления живут в модулях."

[[rules]]
kind = "not_contains"
globs = ["src/crates/*/src/lib.rs", "src/microservices/*/src/lib.rs"]
regex = 'impl[ <]'
message.ru = "lib.rs крейта и сервиса это фасад: только `mod ...;` и `pub use ...;`. Методы пишутся рядом со своими типами."

[[rules]]
kind = "absent"
globs = ["**/utils.rs", "**/helpers.rs"]
message.ru = "Файлы-свалки utils.rs и helpers.rs не заводим: положи функцию в модуль, которому она принадлежит."

[[rules]]
kind = "not_contains"
globs = ["src/**/*.rs", "tools/**/*.rs"]
regex = 'allow\(dead_code\)'
message.ru = "Глушилка `allow(dead_code)` не нужна: пусть компилятор подсказывает про забытый код."

[[rules]]
kind = "not_contains"
globs = ["src/crates/*/src/**/*.rs", "tools/*/src/**/*.rs", "tools/*/build.rs"]
regex = '\.unwrap\(\)'
message.ru = "В коде нашёлся `.unwrap()`. Верни `Result` или `Option` и пробрось ошибку через `?`."

[[rules]]
kind = "not_contains"
globs = ["src/crates/*/src/**/*.rs", "tools/*/src/**/*.rs", "tools/*/build.rs"]
regex = 'panic!'
message.ru = "В коде нашёлся `panic!`. Правила соцсети нарушаются каждый день, это не повод падать: верни ошибку."

[[rules]]
kind = "not_contains"
globs = [
  "src/crates/social-core/src/domain/**/*.rs",
  "src/crates/social-core/src/network/**/*.rs",
  "src/crates/social-core/src/commands/**/*.rs",
  "src/crates/social-core/src/chat/**/*.rs",
  "src/crates/social-core/src/events/**/*.rs",
  "src/crates/social-core/src/api/**/*.rs",
  "src/crates/social-core/src/trends/**/*.rs",
  "src/crates/social-core/src/comments/**/*.rs",
  "src/crates/social-core/src/app/**/*.rs",
]
regex = 'storage::'
