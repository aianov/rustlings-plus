"""Слои CORS, cookie, условные ответы и BodyReader уже написаны в главе 09 (задачи nha1..nha8 и проект nha_api_kit):
перенеси их в папки движка из дерева и поправь пути импортов на модули движка. Новое здесь одно: `token_from_cookie`,
крошечный слой, который до `bearer_auth` превращает cookie `session` в заголовок `Authorization: Bearer`.""",
"""Порядок слоёв решает: CORS первым, иначе браузерный предзапрос OPTIONS к `/users/me` придёт без токена и получит 401,
и фронт не узнает даже, что ему можно. Журнал вторым, он видит и отказы авторизации.""",
"""Cookie сессии собирается через `SetCookie { http_only: true, same_site: Some(SameSite::Lax), path: Some("/"), .. }`,
а выход отвечает `SetCookie::delete("session", "/")` и вычёркивает токен из `Tokens`. Профиль отдавай с `etag` от байт
JSON и сравнивай с If-None-Match через `etag_matches`.""",
"""Аватар хранится как `Arc<Vec<u8>>` с типом картинки, отдаётся `serve_bytes`. Проверка размера идёт по уже
прочитанному телу, поэтому после 413 соединение keep-alive продолжает жить: следующий запрос начинается ровно там,
где кончилось тело.""",
]
story.ru = """У профиля появилось лицо: аватар загружается из клиента и скачивается с докачкой, а фронт на своём origin уже может
звать API, держа вход в cookie, которую не прочитает ни один скрипт."""
