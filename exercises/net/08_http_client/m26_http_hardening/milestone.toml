Остановка приходит через `watch`: простаивающее соединение закрывается сразу, занятое дорабатывает и ставит
`Connection: close`.""",
"""Слой это функция `Handler -> Handler`, поэтому `apply` сворачивает список справа налево: тогда первый слой
