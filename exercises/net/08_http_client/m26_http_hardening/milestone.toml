story.ru = """HTTP соцсети вырос: соединения живут между запросами, медленные и жадные клиенты получают 408, 413 и 431, а
`/users/me` пускает только по Bearer-токену. И у соцсети появился свой HTTP-клиент, которым ты сам проверяешь её API."""
