[chapter]
title.ru = "Свой HTTP-клиент"

[[chapter.visuals]]
file = "visuals/client_pool.html"
title.ru = "Пул соединений: взять, вернуть чистым, пережить протухшее"

[[exercises]]
name = "nhc1"
style = "todo"
hint.ru = [
  """Сначала отдели схему (`split_once("://")`), потом найди конец authority: это первый из символов `/`, `?`, `#`. Дальше работай только с authority.""",
  """Если authority начинается с `[`, хост до `]`, а порт только после `]:`. Иначе порт после последнего двоеточия, и лишнее двоеточие в хосте это ошибка. Порт проверяй по цифрам до `parse`: `"+80"` разбирается без ошибки.""",
  """Фрагмент отрезается от хвоста по `#`. Хвост, начинающийся с `?`, получает впереди `/`. Проверку на пробелы и управляющие символы сделай одной строкой в самом начале.""",
]
why.ru = """Адрес разбирается один раз на входе, а дальше по клиенту ходит готовый `Url`: никто больше не режет строки по двоеточиям. Скобки у IPv6 нужны именно из-за двоеточий, поэтому порт ищется после `]`. Проверка на пробелы и CR LF стоит первой: всё, что попадёт в `Url.path`, потом дословно уйдёт в строку запроса, и один перенос строки добавит запросу чужие заголовки. Логин в адресе мы не принимаем: он оседает в журналах и истории."""

[[exercises]]
name = "nhc2"
style = "todo"
hint.ru = [
  """Порядок такой: строка запроса, `Host`, пользовательские заголовки, длина, пустая строка, тело. Всё, кроме тела, собирай в `String`, потом переводи в байты.""",
  """Три заголовка вызывающего пропускай по имени без учёта регистра, но проверку на опасные символы делай раньше пропуска: плохой заголовок `Host` тоже ошибка. Длину пиши, когда тело есть, и ещё для `POST`, `PUT`, `PATCH` без тела.""",
  """Для проверки имён пригодится набор «символов токена» из RFC 9110: буквы, цифры и несколько знаков. В значениях запрещены `\\r`, `\\n` и `\\0`. Проверка пути: начинается с `/`, пробелов и управляющих нет.""",
]
why.ru = """Запрос это границы, а границы строятся из CRLF. Поэтому всё, что идёт от вызывающего, проверяется, а не чистится: молча вырезанный перевод строки скрывает ошибку и всё равно может склеить заголовки. Host и длину клиент ставит сам, потому что от них зависит, как сервер вообще поймёт, где кончается запрос. `Content-Length: 0` у пустого POST нужен: без него сервер не знает, есть ли тело, и на keep-alive соединении это путает следующий запрос."""

[[exercises]]
name = "nhc3"
style = "todo"
hint.ru = [
  """Найди конец головы поиском `\\r\\n\\r\\n` в байтах, до любого разбора. Нет конца: либо `Ok(None)`, либо, если буфер уже больше `MAX_HEAD`, ошибка.""",
  """Строку статуса дели по первому пробелу (версия), потом по второму (код и причина). Код проверяй по длине и по цифрам до `parse`. Строки заголовков получаются через `split("\\r\\n")` по тексту головы без финальной пустой строки.""",
  """Строка заголовка, начавшаяся с пробела или табуляции, это продолжение предыдущей. Мы такие не принимаем. Имя проверяется как токен: пробелов, скобок и пустоты в нём быть не может, и пробел перед двоеточием в том числе.""",
]
why.ru = """Разбор головы это чистая функция от буфера: ни сокета, ни состояния. Поэтому её легко проверять на каждом разрезе, а клиент остаётся простым: читай в буфер и спрашивай парсер, пока он не ответит. `Ok(None)` и ошибка это разные вещи, и перепутать их значит либо падать на медленной сети, либо зависать на мусоре. Предел на размер головы нужен клиенту так же, как серверу: чужой сервер может не кончать голову вечно."""

[[exercises]]
name = "nhc4"
style = "scratch"
hint.ru = [
  """Порядок проверок такой: сначала Transfer-Encoding (chunked главнее), потом Content-Length, потом «до конца потока». Тело может уже лежать в `buf`: читай из `reader` только когда его не хватает.""",
  """Для chunked крути цикл: строка размера (до `;` расширения), потом ровно `размер + 2` байта (данные и CRLF), и так до нулевого куска, после которого читаются строки трейлеров до пустой. `take_line` и `fill` уже написаны выше.""",
  """Лимит проверяй до чтения: и по заявленной длине, и по размеру куска. Размер куска не из цифр, пустой или слишком большой для `usize` это `InvalidData`, не паника. Лишнее после тела забирать нельзя: `buf.drain(..n)` берёт ровно `n`.""",
]
why.ru = """Читать тело нужно так, как говорит голова, а не «пока что-то приходит». Content-Length и chunked дают конец без закрытия соединения, и именно поэтому по нему можно ходить снова. Остаток в буфере хранится, а не выбрасывается: на конвейере или при жадном чтении там лежит начало следующего ответа. Оба заголовка вместе (`Content-Length` и `Transfer-Encoding`) основа атак request smuggling: клиент подчиняется chunked, но дальше соединению не верит."""

[[exercises]]
name = "nhc5"
style = "bughunt"
hint.ru = [
  """Тело есть не у каждого ответа. Какие ответы по правилам протокола тела не имеют, как бы ни выглядели их заголовки? Ответ зависит и от метода запроса.""",
  """Заголовки `Content-Length` и `Transfer-Encoding` у ответа на HEAD описывают тело, которое сервер отправил бы на GET, но не отправил. То же у 204 и 304. А промежуточные ответы 1xx (кроме 101) за ответ не считаются: настоящий придёт после них.""",
  """Перед чтением тела реши, есть ли оно: метод `HEAD`, статус `204`, `304` или `101` значит «нет». Промежуточные ответы пропускай в цикле чтения головы и читай следующую голову.""",
]
why.ru = """Конец тела определяет не только голова ответа, но и контекст: метод запроса и статус. Это правило из RFC 9112, и оно общее для клиентов и прокси. Без него клиент работает на всём, что ты пробовал руками, и виснет на первом HEAD или кеширующем 304. Промежуточные ответы тоже ловушка: `100 Continue` приходит перед настоящим ответом, и если принять его за ответ, настоящий превратится в «хвост» и испортит следующий запрос."""

[[exercises]]
name = "nhc_q1"
kind = "question"
question.ru = """Клиент отправил `HEAD /archive.zip` по соединению, которое он собирается использовать дальше. Сервер ответил:
```
HTTP/1.1 200 OK
Content-Length: 4000000000
Accept-Ranges: bytes
```
и больше ничего не прислал. Что должен сделать клиент?"""
options.ru = [
  "Прочитать 4 000 000 000 байт: длина же указана",
  "Считать ответ законченным сразу после пустой строки; соединение пригодно для следующего запроса",
  "Закрыть соединение и открыть новое: на HEAD тело нельзя пропускать",
  "Вернуть ошибку: сервер нарушил протокол, отправив длину без тела",
]
answer = [1]
explain.ru = """У ответа на HEAD тела нет по определению, а `Content-Length` описывает тело, которое сервер прислал бы на GET. Если клиент станет ждать эти байты, он зависнет (соединение открыто, сервер молчит). То же правило у ответов 204 и 304. Соединение остаётся чистым и годится для следующего запроса."""
hint.ru = """Что говорит длина в ответе на HEAD: сколько байтов сейчас придёт или сколько пришло бы на GET?"""

[[exercises]]
name = "nhc6"
style = "todo"
hint.ru = [
  """Разложи работу: `send` делает всё до готового `Response` (адрес, запрос, соединение, запись, чтение), а превращение ответа в значение выглядит одинаково для GET и POST. Его можно вынести в одну общую функцию.""",
  """Проверку статуса делай до разбора JSON: тело ответа 404 может быть чем угодно. Тело ошибки сохрани в `Status`, оно поможет разобраться. Ошибки каждого шага отображай в свой вариант `ClientError`.""",
  """Для POST собери тело через `serde_json::to_vec`, добавь `Content-Type` и `Accept`. Длину ставит `build_request`, повторять её не нужно. Разбор: `serde_json::from_slice` на `response.body`.""",
]
why.ru = """У клиента три группы отказов, и их нельзя смешивать. Транспорт (не подключились, оборвалось) часто имеет смысл повторить. Статус (сервер ответил 4xx или 5xx) повторять бессмысленно, а тело ответа нужно показать человеку. Разбор (200, но не тот JSON) это ошибка контракта, и её видно в журнале как несовпадение сервера с клиентом. Если свалить всё в один `Error(String)`, вызывающему придётся читать текст ошибки, чтобы решить, что делать дальше."""

[[exercises]]
name = "nhc7"
style = "scratch"
hint.ru = [
  """Два вложенных `tokio::time::timeout`: внутренний на подключение, внешний на всё сразу. Внешний оборачивает и подключение тоже, поэтому время подключения входит в общий срок.""",
  """Результат внешнего `timeout` это `Result<Result<..>, Elapsed>`. `Elapsed` превращай в `TotalTimeout`. Внутренний `Elapsed` превращай в `ConnectTimeout`, а ошибку самого подключения (`Ok(Err(e))`) не путай с таймаутом.""",
  """Всё, что идёт после подключения (запись запроса и чтение ответа), складывай в один `async`-блок и оборачивай его одним `timeout(total, ..)`. Один блок, один отсчёт.""",
]
why.ru = """Один общий дедлайн на запрос единственный надёжный способ ограничить капающий ответ. Отдельный срок на подключение нужен, потому что подключение к мёртвому хосту хочется оборвать быстро, не дожидаясь общего срока. Вложенность задаёт порядок: внутренний срок короче внешнего, поэтому на подключении срабатывает он, а время подключения при этом всё равно съедает часть общего. Тесты на виртуальном времени (`start_paused`) позволяют проверять секунды точно и мгновенно."""

[[exercises]]
name = "nhc_q2"
kind = "question"
question.ru = """Таймаут на одно чтение у клиента 8 секунд, а общего срока нет. Сервер отвечает на запрос 1000 байтами тела, присылая по одному байту раз в 5 секунд. Когда клиент сдастся?"""
options.ru = [
  "Через 8 секунд: столько ждёт одно чтение",
  "Через 5 секунд: первая же пауза",
  "Примерно через 83 минуты, когда ответ придёт целиком: ни одно чтение не молчит дольше 8 секунд",
  "Никогда: таймаут чтения клиент в конце концов сбрасывает",
]
answer = [2]
explain.ru = """Таймаут на чтение сбрасывается при каждом пришедшем байте, а байты приходят чаще, чем он срабатывает. 1000 байтов по 5 секунд это почти 84 минуты работы на одном запросе. Ловит такую каплю только общий срок на весь запрос, посчитанный от начала."""
hint.ru = """Сколько секунд молчит любое отдельное чтение?"""

[[exercises]]
name = "nhc8"
style = "scratch"
hint.ru = [
  """Начни с `resolve`: четыре формы Location (полный адрес, `//хост/путь`, абсолютный путь, относительный) сводятся к одной: собери полную строку и пропусти через `parse_url`. Остальное это нормализация точек в пути.""",
  """В `follow` решения принимаются по таблице: статус плюс метод. Заведи условие «стать GET» отдельно от условия «забыть учётные данные»: они независимы. Подсчёт переходов начинай после проверки, что есть Location.""",
  """Сегменты пути с `.` пропускаются, с `..` убирают предыдущий (на пустом стеке ничего). Если путь кончился точкой, результат оканчивается на `/`. Лишние заголовки при смене на GET: `Content-Type`, `Content-Length`, `Content-Encoding`, `Transfer-Encoding`.""",
]
why.ru = """Клиент, переходящий по Location, исполняет чужую команду, поэтому ему нужна осторожность. Токен авторизации принадлежит одному источнику (схема, хост, порт): после перехода на другой он должен остаться дома, иначе открытый редирект на сайте злоумышленника сливает токены. Смена метода идёт из истории: браузеры меняли POST на GET при 301 и 302, и стандарт это узаконил; для 307 и 308 придумали честный вариант «ничего не менять». Лимит переходов превращает бесконечный цикл в понятную ошибку."""

[[exercises]]
name = "nhc_q3"
kind = "question"
question.ru = """Клиент отправил `PUT /profile` с телом и заголовком `Authorization` на `api.example`. Сервер ответил `301` с `Location: http://cdn.example/profile`. Что клиент по правилам этой главы отправит следом?"""
options.ru = [
  "`GET /profile` без тела, с `Authorization`",
  "`PUT /profile` с тем же телом, с `Authorization`",
  "`PUT /profile` с тем же телом, без `Authorization`",
  "Остановится с ошибкой: PUT при переходе повторять нельзя",
]
answer = [2]
explain.ru = """301 и 302 превращают в GET только POST, а PUT остаётся PUT вместе с телом. Но хост другой (`cdn.example` вместо `api.example`), поэтому `Authorization` остаётся дома: токен выдан одному источнику."""
hint.ru = """Какие методы меняет 301 и что происходит с токеном, если хост стал другим?"""

[[exercises]]
name = "nhc9"
style = "scratch"
hint.ru = [
  """Для каждого ключа заведи вектор пар «когда положили, соединение». Свежее соединение лежит в конце: `pop` берёт его.""",
  """Перед выдачей выбрось всё, что простояло не меньше `ttl` (`retain` по времени `Instant::now()`). Выброшенное закрывается само, когда уходит из вектора. Сравнение «старше или равно»: ровно `ttl` уже протухло.""",
  """При `put` после добавления проверяй размер вектора и убирай с начала, пока он больше `max_idle`: там самое старое. Лимит считается для каждого ключа отдельно.""",
]
why.ru = """Пул отдаёт самое свежее соединение, потому что у него наименьший шанс быть уже закрытым сервером. Простой считается с момента возврата, а не создания: соединение, которым пользовались минуту назад, свежее того, которое просто лежит. `Drop` решает проблему закрытия: достаточно убрать значение из структуры, и сокет закроется сам, ничего вызывать не нужно. Тесты используют виртуальное время (`start_paused`), поэтому «30 секунд» проверяются мгновенно."""

[[exercises]]
name = "nhc10"
style = "bughunt"
hint.ru = [
  """Выпиши, при каких условиях соединение после запроса можно использовать снова. Что у соединения должно быть прочитано до конца, и что сказал сервер?""",
  """Соединение можно вернуть в пул, только если ответ получен целиком, тело кончилось само (по длине или chunked, а не закрытием), сервер не просил `close` и в буфере не осталось лишних байтов. Всё это уже известно внутри `exchange`, но наружу не выходит.""",
  """Пусть `exchange` возвращает ответ вместе с решением «соединение можно переиспользовать», а `get` кладёт соединение в пул только по этому решению. В остальных случаях стрим просто выбрасывается и закрывается.""",
]
why.ru = """Соединение с протоколом «запрос-ответ» несёт состояние: пока предыдущий ответ не прочитан до конца, следующий читать нельзя, иначе начало чужого тела превращается в голову нового ответа. Поэтому в пул возвращают только те соединения, про которые точно известно, что они чисты. Любое сомнение (недочитанное тело, лишние байты, `Connection: close`, тело до закрытия) означает выбросить сокет и платить рукопожатием. Это дешевле, чем отвечать пользователю чужими данными."""

[[exercises]]
name = "nhc_q4"
kind = "question"
question.ru = """Пользователь клиента вызвал `get_stream(url)`, получил начало ответа, прочитал пару килобайт тела из 50 МБ, ему стало неинтересно, и он бросил объект ответа (Drop). Что клиенту делать с соединением?"""
options.ru = [
  "Вернуть в пул: запрос-то был выполнен",
  "Дочитать тело в фоне и потом вернуть в пул",
  "Закрыть: тело недочитано, и в сокете лежат чужие для следующего запроса байты",
  "Вернуть в пул, но пометить «подозрительным»: вдруг пригодится",
]
answer = [2]
explain.ru = """Недочитанное соединение к следующему запросу не пригодно: оставшиеся байты тела будут прочитаны как голова нового ответа. Дочитывать 50 МБ ради возврата в пул обычно дороже нового рукопожатия (хотя для маленьких остатков некоторые клиенты так делают). Безопасный минимум: закрыть."""
hint.ru = """Что прочитает следующий запрос на этом соединении?"""

[[exercises]]
name = "nhc11"
style = "scratch"
hint.ru = [
  """Помни, откуда взято соединение: из пула или только что открыто. Повтор нужен лишь тогда, когда сбой «протух» произошёл на соединении из пула.""",
  """Идемпотентные методы: GET, HEAD, PUT, DELETE, OPTIONS, TRACE (повтор даёт тот же итог). POST и PATCH нет. Повтор делается ровно один раз, на новом соединении, без пула.""",
  """Структура: взять из пула или открыть, `exchange`, на `Stale` проверить два условия (было из пула, метод безопасен) и сделать второй `exchange` на новом сокете. В пул клади только соединение с `reusable` ответом.""",
]
why.ru = """Сервер вправе закрыть idle-соединение в любой момент, и клиент узнает об этом только при следующей записи. Поэтому повтор после обрыва на соединении из пула это штатная часть клиента, а не костыль. Он ограничен тремя условиями: соединение было переиспользованным (на свежем сбой значит проблему сервера), метод идемпотентный (повтор безопасен) и повтор один (иначе сервер, который падает на каждом запросе, получит лавину). Не-идемпотентный запрос вернёт ошибку вызывающему: решать, повторять ли платёж, должен тот, кто знает, что у него в запросе."""

[[exercises]]
name = "nhc_q5"
kind = "question"
question.ru = """Клиент отправил `POST /charge` по соединению из пула. Запись прошла, а чтение вернуло конец потока без единого байта ответа. Что правильно?"""
options.ru = [
  "Повторить на новом соединении: это же протухшее соединение, как у GET",
  "Вернуть ошибку «исход неизвестен» и оставить решение о повторе вызывающему",
  "Вернуть успех: раз ошибки сервера нет, платёж прошёл",
  "Повторять до успеха, но не больше трёх раз",
]
answer = [1]
explain.ru = """Запрос мог дойти до сервера и выполниться, а оборвалось только возвращение ответа. Повторить POST значит рискнуть списать деньги дважды. Автоматически повторяют только идемпотентные запросы. Для остальных клиент честно говорит «не знаю», а решает тот, кто знает смысл запроса (например, использует ключ идемпотентности)."""
hint.ru = """Знает ли клиент, дошёл ли запрос до сервера?"""

