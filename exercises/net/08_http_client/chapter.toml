hint.ru = [
  """Порядок работы: сначала `wire.rs` (`parse_head`, `read_body`, `read_response`: это задачи nhc3 до nhc5), потом `pool.rs`, потом клиент. Тесты `bodiless_answers...` и `keep_alive...` проверяют первые два слоя, не ожидая остального.""",
  """`send_once`: взять из пула или подключиться (под `connect_timeout`), `exchange`, повтор при `Stale` на соединении из пула для идемпотентного метода, возврат чистого соединения. `follow` вызывает `send_once` в цикле и решает судьбу метода, тела и заголовков на каждом переходе.""",
  """`send` оборачивает весь `follow` одним общим сроком, а истёкший срок превращает в `Error::TotalTimeout`. `fetch` собирается из `Request`, `Client::send` и разбора аргументов; код выхода выбирай по статусу и по ошибке.""",
]
why.ru = """Крейт держится на трёх решениях: границы ответа определяет голова и контекст, а не желание (HEAD, 204, 304, 1xx), соединение возвращается в пул только чистым, а общий срок стоит над всем запросом, включая редиректы. Всё остальное (повтор, ограничение токенов, смена метода) это правила вокруг этих трёх. Консольная утилита нужна, чтобы клиент можно было пощупать руками: на нём потом будут проверяться и сервисы курса."""

