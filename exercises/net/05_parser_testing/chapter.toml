[chapter]
title.ru = "Тестирование парсеров"

[[chapter.visuals]]
file = "visuals/split_points.html"
title.ru = "Разрезание входа во всех точках"

[[chapter.visuals]]
file = "visuals/shrink_loop.html"
title.ru = "Сжатие падающего входа шаг за шагом"

[[exercises]]
name = "nfz_q1"
kind = "question"
question.ru = """В декодере строк баг проявляется, только если '\\r' оказывается последним байтом куска, а '\\n' первым байтом следующего. Вход `ab\\r\\ncd\\r\\n`. Автор написал три теста: нарезка по 1 байту, по 4 байта и по 16 байтов. Какие из них поймают баг?"""
options.ru = [
  "Все три: чем больше разных размеров куска, тем лучше",
  "Только нарезка по 1 байту: при куске в 4 байта «\\r\\n» остаётся внутри куска, а при 16 весь вход приходит целиком",
  "Нарезка по 4 и по 16, потому что они ближе к реальным размерам чтения",
  "Ни один: баг виден только в настоящей сети",
]
answer = [1]
explain.ru = """Нарезка по 4 байта даёт куски `ab\\r\\n` и `cd\\r\\n`: «\\r\\n» внутри кусков, граница между \\r и \\n не появляется. По 16 весь вход одним куском. Только побайтовая подача гарантированно ставит границу в каждое место. Отсюда идея главы: не выбирать места разреза, а перебирать все, потому что пример автора проверяет только то, о чём автор подумал."""
hint.ru = "Где в каждом из трёх тестов оказывается граница между кусками?"

[[exercises]]
name = "nfz1"
style = "todo"
hint.ru = [
  """Три прохода: целый вход как эталон; разрез на два куска в каждой позиции `1..len`; один проход, где разрезы стоят везде.""",
  """Хранить разрез удобно списком позиций. Для построения кусков есть готовый `chunks_at`. Первое расхождение сразу возвращай как `SplitFailure`.""",
]
why.ru = """Перебор разрезов превращает «придумай неудачное место» в «проверь все». Порядок важен для отладки: сначала два куска (простейший контрпример), потом побайтовая подача. В отчёт кладут разрезы и оба результата, чтобы сбой воспроизводился без магии. Пустой вход и вход из одного байта проверяются тем же кодом, и это тоже полезные случаи."""

[[exercises]]
name = "nfz2"
style = "bughunt"
hint.ru = [
  """Запусти тест `every_split_agrees` и посмотри, на каких входах и разрезах он упал. Что общего у проблемных строк?""",
  """Декодер выбрасывает `\\r`, если он последний байт куска, считая, что это половина CRLF. А если дальше `\\n` не придёт?""",
  """Хранить сырые байты и убирать `\\r` только в момент, когда виден `\\n`.""",
]
why.ru = """Решение о «\\r» нельзя принимать, пока не видно следующего байта. Декодер хранит сырые данные в буфере и отрезает `\\r` в момент строки, когда `\\n` уже есть. Это общий принцип потоковых парсеров: состояние лежит в буфере, а не в догадках о том, что придёт дальше. Ручные примеры резали вход посреди слов и никогда не ставили границу между `\\r` и следующим байтом."""

[[exercises]]
name = "nfz_q2"
kind = "question"
question.ru = """Тест случайный, а seed берётся из времени: `Rng::new(SystemTime::now()...)`. Тест упал в CI один раз из двухсот. Что мы потеряли?"""
options.ru = [
  "Ничего: достаточно перезапустить, и он пройдёт",
  "Возможность воспроизвести сбой: seed неизвестен, повторный запуск возьмёт другой. Seed надо печатать при падении и уметь задавать извне",
  "Только скорость: время как seed медленнее",
  "Случайность: время не годится как источник чисел",
]
answer = [1]
explain.ru = """Случайные тесты ценны, пока любой сбой можно повторить. Если seed взят из часов и нигде не напечатан, ты знаешь только, что «иногда падает». Правило: seed либо фиксирован, либо печатается в сообщении об ошибке (и принимается из переменной окружения для повтора). Так устроен `run_property` в этой главе: он перебирает seed подряд и в отчёте называет упавший."""
hint.ru = "Что нужно, чтобы запустить тот же самый случай ещё раз?"

[[exercises]]
name = "nfz3"
style = "todo"
hint.ru = [
  """Состояние это одно `u64`. Каждый вызов прибавляет константу `0x9E3779B97F4A7C15` (`wrapping_add`) и перемешивает результат двумя умножениями.""",
  """Для `below(n)` не бери `% n` от любого числа: чисел, дающих малые остатки, чуть больше. Отбрасывай «хвост» (числа, которые не укладываются целым числом раз в `n`) и пробуй снова.""",
  """`range(lo, hi)` это `lo + below(hi - lo)`, `chance(p)` это `below(100) < p`, `pick` индексирует срез через `below(len)`.""",
]
why.ru = """splitmix64 это три строки с `wrapping_*`: арифметика должна переполняться без паники, а не падать в debug. Смещение у `% n` реально: при n около 2^63 нижняя половина диапазона выпадала бы в полтора раза чаще. Отсечение хвоста исправляет это ценой редких повторов. Главное в генераторе то, что один seed даёт одну последовательность на любой машине."""

[[exercises]]
name = "nfz4"
style = "todo"
hint.ru = [
  """Всю случайность бери только из `rng`: метод, длину пути, сегменты, заголовки. Никаких `HashMap` итераций и системных источников.""",
  """Тело создавай только для POST и PUT и не всегда: `rng.chance(70)`. Пустое тело у POST тоже важный случай.""",
  """Имена заголовков выбирай из набора с повторами: дубли имён встречаются в реальных запросах и ломают наивные парсеры.""",
]
why.ru = """Хороший генератор это описание пространства допустимых входов, а не одного «типичного». Если он не создаёт ни дубликатов заголовков, ни пустых тел, ни корневого пути, парсер с багами на них пройдёт тесты. Проверка «все ли пять методов встретились» ловит генераторы, которые молча сводятся к одному виду. Детерминизм по seed не опция, а условие воспроизводимости."""

[[exercises]]
name = "nfz5"
style = "todo"
hint.ru = [
  """`run_property`: цикл по `0..cases`, на каждом случае свежий `Rng::new(base_seed + i)`; первый `Err` превращай в `Failure` и сразу возвращай.""",
  """`roundtrip` принимает парсер и возвращает замыкание-свойство: сгенерируй запрос, сериализуй, разбери, сравни. В тексте ошибки покажи исходный запрос и то, что получилось.""",
]
why.ru = """Свойство «разобрал после сериализации и получил то же» ловит целый класс ошибок, которых нет в примерах: потерянные дубли, перепутанный порядок, лишние пробелы. Сообщение об ошибке с самим входом экономит час отладки: видно не только «упало», но и на чём. Новый `Rng` на каждый случай делает любой случай независимым и воспроизводимым по одному числу."""

[[exercises]]
name = "nfz6"
style = "scratch"
hint.ru = [
  """Обёртка: `for _ in 0..1 + rng.below(3)` и `match rng.below(7)` по операциям. Операции, которым нужен непустой вход, пропускай или заменяй другой.""",
  """Для вставки и дубля в `Vec` годятся `insert`, `splice`, `drain`. Следи за границами: `i..i + n` не должно выходить за длину.""",
  """Операция «из corpus» берёт кусок чужого входа и вставляет в случайное место: так появляются сочетания, которых в одиночных входах не было.""",
]
why.ru = """Мутации должны быть мелкими (иначе вход быстро перестаёт быть похожим на валидный и фаззер бродит по одной ветке «отказ»), но разнообразными: биты, байты, вставки, удаления, дубли, склейки, «интересные» значения вроде 0, 0xFF, `\\r`, `\\n`. Пустой вход и пустой корпус обязаны работать: фаззер часто начинается с них. Тест на долю изменённых входов ловит мутатор, который почти всегда ничего не делает."""

[[exercises]]
name = "nfz7"
style = "todo"
hint.ru = [
  """Секрет воспроизводимости: `Rng::new(seed + iteration)` внутри каждой итерации, а не один `Rng` на весь прогон.""",
  """`input_for` строит вход итерации, `fuzz` зовёт его и оборачивает вызов цели в `catch_unwind(AssertUnwindSafe(..))`.""",
  """Пустой корпус: базовый вход пуст, `pick` по пустому срезу паникует.""",
]
why.ru = """Если случайность идёт из общего состояния, вход 41732-й итерации можно получить, лишь прогнав 41731 предыдущих. Когда состояние выводится из пары (seed, номер), crash воспроизводится одной функцией. `catch_unwind` превращает панику цели в обычный результат, а сообщение приходит либо `&str`, либо `String` (смотри готовый `panic_message`). Остановка на первом сбое экономит время и сохраняет самый ранний вход."""

[[exercises]]
name = "nfz_q3"
kind = "question"
question.ru = """Фаззер упал на входе из 4000 байт. Ты написал `shrink`, и он вернул 12 байт. Но на этих 12 байтах цель падает **другой** паникой (деление на ноль вместо выхода за границы). Что не так?"""
options.ru = [
  "Ничего: любая паника это баг, и два бага лучше одного",
  "Сжатие проверяло лишь «падает ли», а не «падает ли так же». Предикат должен сравнивать причину (сообщение или место паники), иначе сжатие уходит в другой, часто более простой баг",
  "`shrink` слишком агрессивен, надо убирать только по одному байту",
  "Нужно перезапустить фаззер с другим seed",
]
answer = [1]
explain.ru = """Сжатие меняет вход, а значит, может незаметно сменить баг. Если предикат «падает хоть как-то», самая маленькая паника выигрывает, и исходная причина теряется. Хороший предикат сравнивает сообщение паники (или хотя бы её тип), а в крупных инструментах ещё и точку в коде. Отдельный баг тоже полезно найти, но чинить придётся оба, и важно знать, какой есть какой."""
hint.ru = "Что именно проверяет предикат в shrink?"

[[exercises]]
name = "nfz8"
style = "scratch"
hint.ru = [
  """Идея ddmin: пробуй выбросить кусок размером в половину входа, потом четверть и так до одного байта. Если выброс сохранил падение, оставляй его.""",
  """Один проход по входу с окном `chunk`: `while start < len`; при успехе `start` не двигай (на этом месте теперь новые байты), при неудаче сдвигай на `chunk`.""",
  """После удаления упрости байты: заменяй каждый на `b'a'`, если падение остаётся. Предикат «чётная длина» ловит решение, которое умеет только по одному байту.""",
]
why.ru = """Бинарное сжатие делает проверок порядка `log(n) * размер результата`, а не `n`. Это решает, можно ли вообще сжимать вход в мегабайт: линейный перебор по одному байту делает миллион запусков цели. Предикат с чётной длиной показывает, почему нужны куски разных размеров: удаление одного байта ломает условие, а удаление пары сохраняет. Упрощение символов до `a` делает минимальный вход читаемым."""

[[exercises]]
name = "nfz9"
style = "bughunt"
hint.ru = [
  """Запусти `fuzzer_finds_nothing` и прочитай, какая паника и на каком входе. Чини по одной: фаззер найдёт следующую.""",
  """Три типичных паники: умножение `len * 16` переполняется в debug (нужны `checked_mul`/`checked_add`), срез `&name[..4]` попадает в середину символа (бери `chars().take(4)`), вычитание `buf.len() - start - len` уходит ниже нуля (сначала проверь границы).""",
  """`start + len` тоже может переполниться, если длина близка к `usize::MAX`. Считай конец тела через `checked_add` и сравнивай с длиной буфера.""",
]
why.ru = """Все три паники растут из доверия к числу и размеру из сети: арифметика без проверок, срез по байтам вместо символов, вычитание без сравнения. Ручные примеры их не находят, потому что автор подаёт разумные значения. Фаззер подаёт неразумные, и каждая находка превращается в обычный регрессионный тест (в файле они уже есть). Правило для парсеров: никакой арифметики над чужими числами без `checked_*`, никаких срезов без проверки границ."""

[[exercises]]
name = "nfz_q4"
kind = "question"
question.ru = """Дифф-тест сравнивает быстрый и медленный парсеры. На входе `%zz` оба вернули ошибку, но тексты ошибок разные: «bad hex» против «invalid escape». Это расхождение?"""
options.ru = [
  "Да: тексты должны совпадать буква в букву",
  "Нет, если в контракте только факт ошибки. Сравнивать нужно то, что входит в контракт (значение или «ошибка»), а текст ошибки это деталь реализации",
  "Да, и надо переписать быстрый парсер, чтобы он вернул такой же текст",
  "Нет, расхождением считается только паника",
]
answer = [1]
explain.ru = """Дифф-тест проверяет соответствие контракту, а не побайтовое совпадение всего, что умеет выдать реализация. Если сравнивать лишнее (тексты, порядок полей, время), тест будет краснеть на безобидном и его перестанут слушать. Если сравнивать мало, баги проскочат. Поэтому в задаче `Outcome` различает три исхода: значение, ошибка (без текста), паника."""
hint.ru = "Что именно обещает функция: значение, текст ошибки или оба?"

[[exercises]]
name = "nfz10"
style = "todo"
hint.ru = [
  """`outcome` превращает вызов в одно из трёх: `Ok`, `Err`, `Panic` (через `catch_unwind`).""",
  """`differential`: для каждого случая подай один и тот же вход обеим функциям и сравни `Outcome`. На первом различии позови `shrink` с предикатом «исходы всё ещё различаются».""",
  """В отчёт кладёшь исходы на сжатом входе, а не на исходном: они должны соответствовать `input`.""",
]
why.ru = """Эталон, который очевидно верен, но медленный, дешевле любого набора ручных примеров: он отвечает на любой вход. Паника в одной из реализаций считается отдельным исходом: «эталон вернул ошибку, быстрая версия упала» тоже баг. Сжатие входа до трёх байт превращает «нашли расхождение на строке из двенадцати символов» в «`%2a` декодируется неверно», и баг сразу виден."""

[[exercises]]
name = "nfz_harness"
kind = "project"
style = "scratch"
quiz = true
locked = ["tests/acceptance.rs"]
hint.ru = [
  """Каждый кусок уже был задачей главы: Rng (nfz3), mutate (nfz6), input_for и fuzz (nfz7), shrink (nfz8), run_property (nfz5), check_splits (nfz1). Перенеси и сделай публичными, потом подгони под сигнатуры из заготовки.""",
  """`fuzz` на панике цели берёт найденный вход как `original`, сжимает его `shrink` с предикатом «цель паникует с тем же сообщением» (иначе сожмёшь до другой ошибки, см. раздел про сжатие) и возвращает оба. Бюджет по времени проверяй перед каждой итерацией через `Instant`.""",
  """`check_splits` у крейта общий: вместо декодера он принимает замыкание `run(&[&[u8]]) -> R`, результат сравнивается через `PartialEq`. Отчёт `SplitFailure` хранит разрезы и оба результата.""",
]
why.ru = """Инструмент собран из пяти идей: воспроизводимая случайность (seed на итерацию), мелкие и разнообразные мутации, быстрое сжатие большими кусками, бюджет по итерациям и времени и перебор разрезов. Всё без зависимостей, потому что этим крейтом будут проверяться парсеры курса, а инструмент для поиска багов не должен тянуть за собой чужие. Проверка бюджета перед итерацией не прервёт зависшую цель: от зависания защищает только таймаут уровнем выше."""
