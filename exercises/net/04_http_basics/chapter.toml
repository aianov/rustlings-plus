[chapter]
title.ru = "HTTP/1.1 изнутри"

[[chapter.visuals]]
file = "visuals/http_request_anatomy.html"
title.ru = "Запрос по байтам: из чего он состоит"

[[chapter.visuals]]
file = "visuals/http_body_framing.html"
title.ru = "Где кончается тело: Content-Length, chunked, закрытие"

[[exercises]]
name = "nhb1"
style = "todo"
hint.ru = [
  """HTTP-запрос это просто строка в `format!`. Строки в нём кончаются двумя символами, `\\r\\n`, а не одним `\\n`.""",
  """После заголовков нужна пустая строка, иначе сервер будет ждать продолжения. Прочитать весь ответ до конца потока можно `read_to_string`, но для этого сервер должен закрыть соединение: попроси его об этом заголовком.""",
]
why.ru = """Запрос это обычный текст с жёсткими правилами: CRLF между строками, пустая строка в конце головы, Host обязателен в HTTP/1.1. Заголовок `Connection: close` честно говорит серверу, что после ответа соединение можно закрыть, и тогда конец ответа определяется закрытием. Без него `read_to_string` ждал бы вечно: по умолчанию HTTP/1.1 держит соединение открытым."""

[[exercises]]
name = "nhb2"
style = "todo"
hint.ru = [
  """Метод и версия это `match` по строке. Лишний вариант в `match` это `Err`.""",
  """В `parse_request_line` сначала проверь форму (ровно три непустые части через одиночный пробел), и только потом разбирай части через `parse()`; `?` сам проведёт ошибку наружу.""",
]
why.ru = """Строгий разбор начинается с формы: split по одному пробелу, а не `split_whitespace`, потому что последний прощает лишние пробелы, а настоящий сервер не должен. Для каждого вида ошибки свой вариант, потому что дальше версия даёт 505, метод 501 или 405, а форма 400. Регистр метода значим: `get` не `GET`."""

[[exercises]]
name = "nhb3"
style = "todo"
hint.ru = """Проверь целиком цель: первый символ, запрещённые символы (пробел, `#`, управляющие). Потом `split_once('?')`: он делит по первому вхождению, как нужно."""
why.ru = """Цель запроса тут только в форме origin-form (путь с необязательным запросом). Всё остальное (`*`, полный URL, пустая строка) отвергается сразу: роутер потом рассчитывает на путь с `/`. Пустой запрос и отсутствие запроса различаются, потому что `/a?` и `/a` формально разные адреса, и `Option` передаёт это без выдумывания."""

[[exercises]]
name = "nhb4"
style = "scratch"
hint.ru = [
  """Идёшь по байтам, а не по символам: `%XX` это байт. Результат копишь в `Vec<u8>`.""",
  """Две hex-цифры бери через `(b as char).to_digit(16)`, оба значения должны существовать, иначе `BadEscape`. UTF-8 проверяй один раз в конце: `String::from_utf8`.""",
]
why.ru = """Декодировать надо байты, и проверять UTF-8 только после того, как все `%XX` собраны: символ вроде `é` приходит двумя отдельными эскейпами. Плюс как пробел, это история форм в query, а не путей: поэтому он включается флагом, а не всегда. Результат `%2B` это настоящий плюс, и его нельзя потом снова превратить в пробел: декодируется один раз."""

[[exercises]]
name = "nhb_q1"
kind = "question"
question.ru = """Адрес `/files?name=a%2Fb&x=1`. Сколько параметров и какое значение у `name`, если разбирать правильно?"""
options.ru = [
  "Один параметр `name` со значением `a/b&x=1`, потому что после `%2F` значение продолжается до конца",
  "Три параметра: `name`, `a` и `b`, потому что закодированный слеш тоже делит значения",
  "Два параметра: `name` со значением `a/b` и `x` со значением `1`, закодированный символ разделителем не служит",
  "Ошибка разбора: закодированный слеш в запросе запрещён, сервер обязан ответить 400",
]
answer = [2]
explain.ru = """Разделители `&` и `=` распознают в сыром тексте, а `%2F` это лишь закодированный символ внутри значения. Параметров два. Значит, сначала режут по `&`, потом по `=`, и только потом раскодируют части. Именно так порядок действий и ломается в следующей задаче: после раскодирования уже не отличить настоящий `&` от пришедшего из `%26`."""
hint.ru = "Что считается разделителем: сырой символ или закодированный?"

[[exercises]]
name = "nhb5"
style = "bughunt"
hint.ru = [
  """Попробуй `a%26b=1` вручную: сколько кусков получится, если раскодировать до разбиения?""",
  """Раскодированный `%26` превращается в `&`, который уже ничем не отличается от настоящего разделителя. Значит, раскодировать нужно позже.""",
  """Режь по `&` и `=` в исходной строке, а `percent_decode` вызывай отдельно для ключа и для значения.""",
]
why.ru = """Раскодирование смешивает данные и разделители: после него уже не отличить `&` из `%26` от настоящего. Правильный порядок: разбить по структуре, и только потом раскодировать каждый кусок. Тот же принцип у путей, заголовков и SQL: сначала структура, потом содержимое. Нарушение порядка даёт дыры в безопасности, а не только неверные значения."""

[[exercises]]
name = "nhb6"
style = "todo"
hint.ru = [
  """`split_once(':')` делит по первому двоеточию: дальше они часть значения.""",
  """Имя проверяй целиком: если оно содержит пробел, значит, пробел был перед двоеточием или внутри. Значение обрезай только по пробелам и табуляциям (`trim_matches`).""",
]
why.ru = """Пробел перед двоеточием запрещён из-за разногласий: одни серверы игнорируют его, другие считают частью имени, и на этой разнице строились атаки на кэши и прокси. Единственный надёжный ответ: ошибка. Управляющие символы в значении запрещены по той же причине, и в одном из следующих заданий именно они откроют дорогу расщеплению ответа."""

[[exercises]]
name = "nhb7"
style = "scratch"
hint.ru = [
  """Достаточно `Vec<(String, String)>`: заголовков мало, линейный поиск быстрее хэш-таблицы, и порядок сохраняется сам.""",
  """Сравнение имён `eq_ignore_ascii_case`. Для `set`: найди индекс первого вхождения, замени значение, остальные удали через `retain` со счётчиком.""",
]
why.ru = """Вектор пар здесь лучше `HashMap`: у заголовков нет уникальности (Set-Cookie повторяется), нужен порядок вывода и сохранение исходного регистра. Поиск по имени без учёта регистра это `eq_ignore_ascii_case`, а не приведение всех имён к нижнему регистру при вставке: тогда терялся бы вид, в котором имя пришло."""

[[exercises]]
name = "nhb8"
style = "todo"
hint.ru = [
  """Конец головы это четыре байта `\\r\\n\\r\\n`. Ищи их во всём буфере, ведь на границе чтений они могут быть разрезаны.""",
  """Лимит проверяй дважды: если терминатор найден, но дальше лимита; и если терминатора нет, а буфер уже не меньше лимита. Число заголовков: сколько CRLF в голове без завершающей пары.""",
]
why.ru = """Парсер, которому вызывают с накопленным буфером, должен искать терминатор по всему буферу, а не только в новом куске: так разрезанный `\\r\\n|\\r\\n` не теряется. Лимит применяется и без терминатора, иначе клиент без пустой строки заставит сервер копить память бесконечно. Число заголовков считают отдельно, потому что тысяча крошечных заголовков тоже атака (хэш-коллизии, расход CPU)."""

[[exercises]]
name = "nhb_q2"
kind = "question"
question.ru = """Сервер читает заголовки с лимитом 8 КБ. Клиент открывает соединение и шлёт по одному байту раз в 10 секунд, никогда не доходя до пустой строки. Лимит размера ни разу не сработает. Чего ещё не хватает серверу?"""
options.ru = [
  "Лимита на общее время получения головы: размер ни разу не сработает, а тысяча таких клиентов займёт все соединения",
  "Лимита на число заголовков: клиент будет слать их по одному, и сервер насчитает слишком много",
  "Проверки версии протокола: HTTP/1.0 так медленно не шлёт, поэтому такого клиента можно отсеять",
  "Ничего: восемь килобайт наберутся за сутки, и тогда сервер сам закроет соединение",
]
answer = [0]
explain.ru = """Лимит размера защищает память, а не соединения. Медленный клиент (slowloris) держит соединение занятым часами, не нарушая ни одного лимита размера, и тысяча таких клиентов занимает весь пул. Нужен дедлайн на получение всей головы (десятки секунд), и отдельный таймаут простоя для тела. Позже в серверной части курса он появится как ответ 408."""
hint.ru = "Что именно потребляет этот клиент, если память он не тратит?"

[[exercises]]
name = "nhb9"
style = "todo"
hint.ru = """Сначала сравни заявленную длину с лимитом (до любого ожидания), потом с `buf.len()`. Тело это `&buf[..content_length]`, остаток не твой."""
why.ru = """Лимит проверяется по заявленной длине до получения хотя бы байта тела: иначе клиент, объявивший четыре гигабайта, заставит сервер ждать, а то и выделить память. Парсер отдаёт срез буфера и не копирует: владение решает вызывающий код. Тело, равное нулю, обязательный случай: POST с пустым телом встречается постоянно."""

[[exercises]]
name = "nhb_q3"
kind = "question"
question.ru = """Заголовок `Content-Length: 5`. В теле клиент отправил слово `héllo` в UTF-8. Что случится у сервера, который читает ровно 5 байтов тела?"""
options.ru = [
  "Всё нормально: в слове пять символов, в теле пять байтов, сервер прочитает слово целиком",
  "Сервер ответит ошибкой, потому что UTF-8 в теле запрещён без отдельного заголовка",
  "Сервер сам дождётся шестого байта, потому что длина в заголовке лишь рекомендация",
  "Сервер прочитает `héll`, а байт `o` останется в потоке и на keep-alive станет началом следующего запроса",
]
answer = [3]
explain.ru = """Content-Length считает байты, не символы. В UTF-8 буква `é` занимает 2 байта, поэтому всего тело занимает 6 байтов. Клиент, который посчитал длину в символах, оставил лишний байт в потоке, и на keep-alive соединении он станет началом следующего запроса: так возникает рассинхронизация, на которой строится контрабанда запросов. Считай `len()` у байтов, а не `chars().count()` у строки."""
hint.ru = "Что измеряет Content-Length: символы или байты?"

[[exercises]]
name = "nhb_q4"
kind = "question"
question.ru = """Твой сервер стоит за фронтовым прокси. Прокси при разборе опирается на `Content-Length`, а твой парсер умеет оба способа. Приходит запрос, где есть и `Content-Length: 4`, и `Transfer-Encoding: chunked`. Как поступить?"""
options.ru = [
  "Следовать chunked: стандарт отдаёт ему приоритет, а прокси пусть разбирается сам",
  "Ответить 400 и закрыть соединение: у запроса два толкования, и выбирать ни одно нельзя",
  "Взять меньшее из двух чисел: так точно не прочитаем лишнего",
  "Убрать Content-Length и принять запрос как chunked: заголовок, по которому не работаем, только мешает",
]
answer = [1]
explain.ru = """Если два звена цепочки по-разному находят границу запроса, байты за этой границей одно звено считает телом, а другое началом нового запроса. Атакующий прячет туда запрос, который прокси не проверил (например, к закрытому разделу). Следовать chunked значит повторить ровно ту ошибку, которой пользуется атака: прокси-то опирается на длину. Меньшее из двух чисел и выбрасывание заголовка то же самое угадывание. Единственный безопасный ответ: отвергнуть запрос целиком и закрыть соединение, потому что оставшийся в потоке хвост уже нельзя трактовать."""
hint.ru = "Что, если два сервера по-разному находят конец запроса?"

[[exercises]]
name = "nhb10"
style = "bughunt"
hint.ru = [
  """Попробуй вручную: `+5`, `-1`, `0x10`, пустую строку и два заголовка с разными значениями. Что вернёт функция?""",
  """`value.trim().parse().ok()` принимает знак плюс и превращает все ошибки в «нет заголовка». Функция должна ошибаться громко.""",
  """Проверь, что все байты значения цифры, собери одно значение из всех заголовков (и из списка через запятую) и сравни, а ещё посмотри, нет ли `Transfer-Encoding`.""",
]
why.ru = """Все атаки контрабандой запросов используют различия между серверами в толковании неоднозначного. Правило одно: если есть хотя бы два способа прочитать запрос, отвергай. Именно поэтому `+5` и `0x10` ошибки (`parse` принимает знак), поэтому два разных значения ошибка, а не «возьмём первое», и поэтому Content-Length вместе с Transfer-Encoding не пропускается."""

[[exercises]]
name = "nhb11"
style = "scratch"
hint.ru = [
  """Цикл: найди CRLF, разбери размер в hex (до `;`), если размер ноль, переходи к трейлерам, иначе проверь, что данные и CRLF после них уже пришли. Если чего-то нет в буфере, верни `Ok(None)`.""",
  """Размер проверяй до ожидания данных: и на количество hex-цифр (не больше 16), и на `max_body`. Сумму размеров не считай «в лоб»: она не должна переполняться, поэтому сравнивай размер куска с остатком лимита (`max_body - уже_принято`), а не складывай. Строка размера тоже ограничена: не копи её без конца, если CRLF всё не приходит.""",
  """Для префиксов: нехватка байтов всегда `Ok(None)`, ошибка только когда видно, что сообщение уже испорчено (не-hex, не CRLF там, где он обязан быть).""",
]
why.ru = """Декодер, которому подают префикс сообщения, различает «пока мало» и «уже испорчено». Первое `Ok(None)`, второе ошибка, и граница определяется тем, что видно в буфере. Размер куска из сети никогда не используют как размер выделения, пока он не проверен: `7FFF...` в hex это атака на память. Трейлеры разбирают так же аккуратно, но их содержимое тут пропускают."""

[[exercises]]
name = "nhb12"
style = "todo"
hint.ru = [
  """Сначала найди конец головы. Нет, значит `Partial`. Потом режь голову по `\\r\\n`: первая строка запрос, остальные заголовки (готовые функции есть).""",
  """Тело: `Content-Length` из заголовков (нет, значит 0). Если в буфере после головы меньше байтов, значит, `Partial`. `consumed` это длина головы плюс длина тела.""",
]
why.ru = """Инкрементальный парсер без состояния: его вызывают снова и снова с накопленным буфером, а ответ `Partial` просто значит «зови, когда будет больше». `consumed` позволяет вызывающему коду выбросить из буфера ровно один запрос и продолжить со следующим, это основа pipelining. Проверка «каждый префикс даёт Partial» ловит парсеры, которые ошибаются на неполных данных."""

[[exercises]]
name = "nhb_q5"
kind = "question"
question.ru = """Сервер ответил на HTTP/1.1-запрос так: `HTTP/1.1 200 OK`, заголовок `Content-Type`, пустая строка, тело. Заголовков `Content-Length` и `Transfer-Encoding` нет. Соединение держится открытым. Как клиент узнает, что тело закончилось?"""
options.ru = [
  "По пустой строке, которой заканчивается и тело, как заканчивалась голова",
  "По паузе: если сервер молчит около секунды, клиент считает тело законченным",
  "Сервер обязан был указать длину, но не указал, поэтому тело считается пустым",
  "Только по закрытию соединения сервером, поэтому keep-alive с таким ответом невозможен",
]
answer = [3]
explain.ru = """Для ответа без Content-Length и без chunked единственный признак конца тела это закрытие соединения. Значит, сервер обязан его закрыть, а повторно использовать соединение нельзя. Поэтому любой сервер, поддерживающий keep-alive, всегда сообщает длину: заранее (Content-Length) или кусками (chunked). Для 204 и 304 тела нет по определению, и длина не нужна."""
hint.ru = "Какой из способов определения длины остался?"

[[exercises]]
name = "nhb13"
style = "todo"
hint.ru = [
  """Имена заголовков сравнивай без учёта регистра. Для `Connection` собери все значения со всех строк и разбей по запятой.""",
  """`close` в любом месте списка выигрывает. Иначе `keep-alive` включает для 1.0, а по умолчанию решает версия.""",
]
why.ru = """Connection это список токенов, а не одно слово, и значений может быть несколько строк: проверка на подстроку нашла бы `close` внутри `closed-form`, а проверка на равенство потеряла бы `keep-alive, close`. `close` побеждает, потому что осторожнее лишний раз закрыть. Host проверяют по числу и непустоте: два разных Host приводят к тому, что прокси и сервер выбирают разные виртуальные хосты."""

[[exercises]]
name = "nhb14"
style = "todo"
hint.ru = """Причины бери из таблицы в шапке задачи. Диапазон проверь в `new`, класс получи делением на 100. Тела нет у `1xx`, `204` и `304`: условие проще записать через «кода 200 и больше, но не эти два»."""
why.ru = """Неизвестный код всё равно имеет класс: клиент обязан обработать 226 как успех, а 499 как ошибку клиента, даже если не знает причину. Поэтому класс считается по первой цифре, а таблица причин это дополнение, не источник истины. Правило про тело существует потому, что на 204 и 304 клиент не ждёт тело, и лишние байты станут началом следующего ответа."""

[[exercises]]
name = "nhb15"
style = "scratch"
hint.ru = [
  """Собери ответ в `Vec<u8>`: строка статуса, заголовки по порядку, свой `Content-Length` (если разрешён и не задан), пустая строка, тело.""",
  """Три условия: `status < 200 || 204 || 304` (ни заголовка, ни тела), `head_request` (длина есть, тела нет), пользователь сам задал Content-Length (не дублировать).""",
]
why.ru = """Сборщик ответа берёт на себя то, что легко забыть: длину тела, пробел после кода при пустой причине и тело там, где его нельзя. Для HEAD сохранение Content-Length принципиально: клиент должен узнать размер, не скачивая его (кэши и проверка файлов на этом работают). Двойной Content-Length в собственном ответе это та самая контрабанда, только исходящая."""

[[exercises]]
name = "nhb_q6"
kind = "question"
question.ru = """Разработчик защищает редирект `Location: <next>` так: проверяет параметр `next` из сырой строки адреса на наличие `\r` и `\n`, потом раскодирует его и подставляет в заголовок. Атакующий присылает жертве `?next=%2Fx%0D%0ASet-Cookie:%20session=evil`. Сработает ли защита?"""
options.ru = [
  "Нет: проверка видела текст `%0D%0A`, а заголовок получил настоящие CR LF; проверять надо итоговое значение при сборке ответа",
  "Да: в сыром адресе нет ни CR, ни LF, значит и результат безопасен",
  "Да, но только на HTTP/1.1, у версии 1.0 такой заголовок не разделился бы",
  "Нет: проверка сработала бы, но браузер всё равно подставит cookie из `Location`",
]
answer = [0]
explain.ru = """Проверка смотрела на текст `%0D%0A`, в котором нет управляющих символов. Раскодирование превратило его в настоящие CR LF уже после проверки: заголовок закончился, и `Set-Cookie` стал отдельным заголовком (так же дописывают и тело ответа: расщепление ответа, response splitting). Проверка должна стоять там, где ответ собирается, и смотреть на итоговые байты. Тогда любой путь, каким значение сюда дошло, закрыт одной проверкой."""
hint.ru = "Что делает раскодирование %0D%0A?"

[[exercises]]
name = "nhb16"
style = "bughunt"
hint.ru = [
  """Подставь в `redirect` значение с `\\r\\n` и посмотри на байты ответа. Что в них появилось?""",
  """Защищаться нужно там, где собирается ответ: `Response::header` должен сам отвергать недопустимое. Подумай и про имя заголовка: оно тоже бывает чужим.""",
  """Имя заголовка должно состоять из токен-символов (буквы, цифры и !#$%&'*+-.^_`|~), в значении не должно быть управляющих символов, кроме табуляции. Не забудь одинокие CR и LF.""",
]
why.ru = """Проверка стоит в одном месте, на пути к сокету: любой код, который добавляет заголовок, получает защиту даром. Одинокий LF отвергается тоже: часть серверов и прокси считают его концом строки, и этого хватает для атаки. Поведение при ошибке важно: отвергнутый заголовок не должен частично попадать в ответ."""

[[exercises]]
name = "nhb_parse"
kind = "project"
style = "scratch"
quiz = true
locked = ["tests/acceptance.rs"]
hint.ru = [
  """Каждая часть уже была задачей главы: percent_decode, parse_header_line, head_end, content_length, decode_chunked, check_host, сборка ответа. Перенеси их в крейт и проверь по очереди, прежде чем склеивать.""",
  """В `parse_request` порядок такой: конец головы (с лимитами), строка запроса, заголовки, Host, способ определения тела, тело. Ошибки головы выдавай до ожидания тела.""",
  """Для chunked-запроса: Transfer-Encoding должен быть ровно `chunked` (иначе `BadHeader`), вместе с Content-Length это `Smuggling`. `consumed` у chunked это длина головы плюс число байтов, которое вернул `decode_chunked`.""",
]
why.ru = """Крейт держится на трёх принципах. Парсер не хранит состояния: он получает накопленный буфер и отвечает Partial, пока данных мало, а границу запроса отдаёт числом consumed. Любая неоднозначность отвергается (два Content-Length, Content-Length с chunked, плохие числа), потому что именно на ней строятся атаки. Лимиты работают по заявленным размерам, ещё до прихода данных, а ввод из сети никогда не определяет размер выделяемой памяти."""
