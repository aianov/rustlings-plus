<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Запрос по байтам</title>
<style>
:root {
  --bg: #fafaf7; --fg: #1d1f24; --muted: #6b7078; --card: #ffffff; --line: #c9ccd2;
  --ok: #1f8a5b; --bad: #c0392b; --accent: #7c3aed; --shadow: rgba(0,0,0,.08); --ghost: #e7e8ec; --msg: #2b6cd9;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14161a; --fg: #e8eaee; --muted: #9aa0aa; --card: #1d2026; --line: #3a3f48;
    --ok: #4fd197; --bad: #ff8a7a; --accent: #b794ff; --shadow: rgba(0,0,0,.4); --ghost: #2a2e36; --msg: #6ea3ff;
  }
}
* { box-sizing: border-box; }
body { margin: 0; padding: 20px; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 820px; margin: 0 auto; }
h1 { font-size: 20px; margin: 0 0 4px; }
p.sub { margin: 0 0 14px; color: var(--muted); }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
button { font: inherit; padding: 6px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--fg); cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.counter { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
.stage { background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 2px 8px var(--shadow); padding: 14px; display: grid; gap: 14px; }
.zone h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
.row { display: flex; flex-wrap: wrap; gap: 8px; min-height: 44px; align-items: center; }
.pkt0 { min-width: 48px; height: 38px; padding: 0 8px; display: grid; place-items: center; font: 600 14px ui-monospace, Menlo, monospace; color: #fff; background: var(--msg); border-radius: 6px; }
.pkt.ghost { background: var(--ghost); color: var(--muted); }
.pkt.lost { background: transparent; border: 2px dashed var(--bad); color: var(--bad); }
.pkt.dup { background: var(--accent); }
.pkt.late { outline: 2px solid var(--bad); }
.pipe { border: 2px solid var(--line); border-radius: 10px; padding: 8px; min-height: 54px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; background: linear-gradient(90deg, transparent, var(--ghost) 40%, transparent); }
.empty { color: var(--muted); font-size: 13px; }
.legend { font-size: 13px; color: var(--muted); }
.caption { margin-top: 12px; padding: 12px 14px; border-left: 4px solid var(--accent); background: var(--card); border-radius: 0 8px 8px 0; min-height: 3.4em; }
</style>
<style>
.raw { font: 15px/1.7 ui-monospace, Menlo, monospace; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; white-space: pre-wrap; word-break: break-all; }
.raw span { padding: 1px 0; border-radius: 3px; }
.raw .on { outline: 2px solid var(--accent); }
.c0 { background: color-mix(in srgb, #2b6cd9 28%, transparent); }
.c1 { background: color-mix(in srgb, #1f8a5b 28%, transparent); }
.c2 { background: color-mix(in srgb, #c2410c 28%, transparent); }
.c3 { background: color-mix(in srgb, #7c3aed 28%, transparent); }
.c4 { background: color-mix(in srgb, #b45309 28%, transparent); }
.ctl { color: var(--accent); font-weight: 700; }
.names { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; font-size: 13px; }
.names b { padding: 2px 8px; border-radius: 6px; }
</style>
</head>
<body>
<main>
  <h1>Запрос по байтам</h1>
  <p class="sub">Один POST-запрос, разложенный на части. Тёмные символы CR LF обычно не видны, а парсеру они важнее всего.</p>
  <div class="bar">
    <button id="prev">Назад</button>
    <button id="next">Шаг</button>
    <button id="play">Играть</button>
    <button id="reset">Сброс</button>
    <span class="counter" id="counter"></span>
  </div>
  <div class="stage">
    <div class="zone"><h2>Байты запроса (CR и LF показаны явно)</h2><div class="raw" id="raw"></div></div>
    <div class="names" id="names"></div>
  </div>
  <div class="caption" id="caption" aria-live="polite"></div>
</main>
<script>
const $ = id => document.getElementById(id);
const PARTS = [
  { cls: "c0", name: "метод", text: "POST" },
  { cls: "", name: "", text: " " },
  { cls: "c1", name: "цель", text: "/recipes?lang=ru" },
  { cls: "", name: "", text: " " },
  { cls: "c2", name: "версия", text: "HTTP/1.1" },
  { cls: "ctl", name: "", text: "\\r\\n", crlf: true },
  { cls: "c3", name: "заголовок", text: "Host: recipes.test" },
  { cls: "ctl", name: "", text: "\\r\\n", crlf: true },
  { cls: "c3", name: "заголовок", text: "Content-Length: 11" },
  { cls: "ctl", name: "", text: "\\r\\n", crlf: true },
  { cls: "ctl", name: "пустая строка", text: "\\r\\n", crlf: true },
  { cls: "c4", name: "тело", text: "борщ,свёкла" }
];
const STEPS = [
  { upto: 0, t: "Запрос это просто текст. Пока в буфере ничего нет." },
  { upto: 5, on: [0,4], t: "Строка запроса: метод, цель и версия, ровно по одному пробелу между ними. Ни больше, ни меньше." },
  { upto: 6, on: [5], t: "Строка заканчивается парой CR LF (два байта, 13 и 10), а не просто переводом строки." },
  { upto: 10, on: [6,8], t: "Заголовки: Имя: значение. Каждый кончается CR LF. Пробела между именем и двоеточием быть не должно." },
  { upto: 11, on: [10], t: "Пустая строка: CR LF сразу после CR LF. Вот так парсер находит конец головы: четыре байта подряд \\r\\n\\r\\n. Ищи их во всём буфере, они могут прийти разрезанными." },
  { upto: 12, on: [11], t: "Тело. Сколько его, говорит Content-Length: 11. Считаются байты: «борщ,свёкла» в UTF-8 занимает больше 11 символов-на-байт, поэтому длину считай у байтов." }
];
function render() {
  const s = STEPS[step];
  const raw = $("raw"); raw.innerHTML = "";
  PARTS.forEach((p, i) => {
    if (i >= s.upto) return;
    const e = document.createElement("span");
    e.className = p.cls + (s.on && i >= s.on[0] && i <= s.on[s.on.length - 1] ? " on" : "");
    e.textContent = p.text;
    raw.appendChild(e);
    if (p.crlf) raw.appendChild(document.createTextNode("\n"));
  });
  const names = $("names"); names.innerHTML = "";
  [["c0","метод"],["c1","цель"],["c2","версия"],["c3","заголовки"],["c4","тело"]].forEach(([c, n]) => {
    const b = document.createElement("b"); b.className = c; b.textContent = n; names.appendChild(b);
  });
  $("caption").textContent = s.t;
  $("counter").textContent = `шаг ${step} из ${STEPS.length - 1}`;
  $("prev").disabled = step === 0;
  $("next").disabled = step === STEPS.length - 1;
}
let step = 0, timer = null;
function stop() { clearInterval(timer); timer = null; $("play").textContent = "Играть"; }
function go(n) { step = Math.max(0, Math.min(STEPS.length - 1, n)); render(); }
$("next").onclick = () => { stop(); go(step + 1); };
$("prev").onclick = () => { stop(); go(step - 1); };
$("reset").onclick = () => { stop(); go(0); };
$("play").onclick = () => {
  if (timer) return stop();
  if (step === STEPS.length - 1) go(0);
  $("play").textContent = "Пауза";
  timer = setInterval(() => { if (step >= STEPS.length - 1) return stop(); go(step + 1); }, 2600);
};
go(0);
</script>
</body>
</html>
