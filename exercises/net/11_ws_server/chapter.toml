[[exercises]]
name = "nrt1"
style = "todo"
hint.ru = [
  """Гарантировать чистку при любом выходе умеет только деструктор. Повесь `impl Drop` на гард, а в обработчике ничего убирать не придётся.""",
  """В `drop` достаточно удалить запись по `self.id`. Но представь, что этот код сработает во время паники, а замок реестра уже отравлен другим потоком: `lock().unwrap()` запаникует, а паника во время паники обрывает процесс.""",
  """Отравленный замок можно взять через `unwrap_or_else(|e| e.into_inner())`: данные внутри целы, отравление это только метка. Пусть все обращения к карте идут через один метод `lock`.""",
]
why.ru = """Деструктор отрабатывает при возврате, при `?`, при панике и при отмене задачи на `await`, а ручная чистка в конце функции только при хорошем исходе. Поэтому состояние, которое надо убрать, привязывают к значению с Drop. Отдельная мелочь: Drop во время раскрутки паники не имеет права паниковать сам, иначе процесс умрёт, поэтому замок в нём берётся терпимо к отравлению."""

[[exercises]]
name = "nrt2"
style = "todo"
hint.ru = [
  """Писатель владеет сокетом и один вызывает `write_all`. Остальным достаётся только `Sender`. Тело писателя это цикл `while let Some(..) = rx.recv().await`.""",
  """Когда все `Sender`ы закрыты, `recv` отдаёт `None`: писать больше некому. Закрой запись у клиента (`shutdown`), чтобы он увидел конец потока. Ошибку записи возвращай из задачи сразу: вместе с задачей умрёт и приёмник очереди, и отправители узнают, что клиента нет.""",
  """`try_send` возвращает `TrySendError` с вариантами `Full` и `Closed`, переведи их в свои `PushError`. Строку и перевод строки собирай одним буфером, чтобы сообщение ушло одной записью.""",
]
why.ru = """Один владелец сокета решает сразу три задачи: порядок (очередь), целостность строк (два обработчика не вклинятся друг в друга) и изоляцию (медленный клиент тормозит только свою очередь). Ограниченная ёмкость превращает «клиент не читает» из роста памяти в видимый сигнал Full, с которым уже можно что-то делать. Конец потока вместо молчаливого зависания достаётся клиенту бесплатно, если писатель честно вызывает shutdown."""

[[exercises]]
name = "nrt3"
style = "todo"
hint.ru = [
  """Нужна карта «пользователь → устройства». `entry(user).or_default()` создаёт набор при первом устройстве, `insert` кладёт в него отправитель.""",
  """Рассылка берёт под замком копии `Sender`ов, отпускает замок и только потом вызывает `try_send`. Считай те, что приняли сообщение.""",
  """В `drop` удали устройство, потом проверь, не опустел ли набор. Если опустел, убери и самого пользователя, иначе карта будет копить мёртвые записи.""",
]
why.ru = """Люди ходят в соцсеть с нескольких устройств, поэтому адресат сообщения это пользователь, а не соединение. Карта пользователей, которая не убирает пустые записи, растёт без видимых признаков: тесты на корректность проходят, а память течёт месяцами. Рассылка не ждёт и не держит замок во время отправки, это пригодится в нескольких следующих задачах."""

[[exercises]]
name = "nrt4"
style = "scratch"
hint.ru = [
  """`BTreeSet::insert` возвращает `false`, если элемент уже был: это ответ для `join`. Неизвестное соединение (его нет в `senders`) в комнату пускать нельзя.""",
  """В `broadcast` под замком проверь, что отправитель состоит в комнате, собери `Sender`ы остальных участников, отпусти замок и только потом отправляй.""",
  """Пустая комната это мусор. После `leave` и `remove` убирай её из карты; `HashMap::retain` обходит все комнаты и заодно вычищает опустевшие.""",
]
why.ru = """Комната живёт ровно столько, сколько в ней есть люди, поэтому уборка пустых комнат часть логики, а не косметика: имена комнат присылает клиент, и без уборки ему достаточно перебирать имена, чтобы раздуть карту. Запрет писать в комнату, где тебя нет, тоже защита: членство проверяется там, где решается доставка, а не надеждой на хорошее поведение клиента."""

[[exercises]]
name = "nrt5"
style = "bughunt"
hint.ru = [
  """Проследи, на чём застрял `broadcast`, когда у одного получателя очередь полна. Подумай, чем в этот момент владеет задача, которая застряла, и кому это нужно.""",
  """Нельзя держать замок, пока ждёшь чужого. Забери под замком только копии отправителей (`Sender` клонируется дёшево), отпусти замок и рассылай по копиям.""",
  """Ждать медленного в рассылке вообще не нужно: `try_send` не засыпает, и тот, кому не хватило места, просто не засчитывается в доставленных.""",
]
why.ru = """Замок, удерживаемый через await, превращает задержку одного клиента в остановку всех, и самое неприятное в том, что на стенде этого не видно: нужен клиент с полной очередью. Лечится в два приёма: не держать замок на время ожидания и не ждать там, где можно не ждать. Переход на tokio::sync::Mutex сам по себе ничего не лечит: он разрешает await под замком, но не делает ожидание короче."""

[[exercises]]
name = "nrt6"
style = "todo"
hint.ru = [
  """Close должен попасть в очередь, когда в ней уже лежат N сообщений. Значит, место под него надо было оставить заранее: подумай, какой ёмкости должен быть настоящий канал.""",
  """У `Sender` есть `capacity()`: сколько мест свободно прямо сейчас. Когда остаётся последнее, обычные сообщения больше не принимай, а положи в него Close.""",
  """Флаг отключения ставь одним `swap`, Close клади только тому, кто флаг поставил, чтобы он не оказался в очереди дважды. После отключения `push` отказывает сразу, ничего не кладя.""",
]
why.ru = """Отключать медленного клиента надо не молча: код 1008 попадает в логи и объясняет, почему у человека оборвалась лента. Хитрость в том, что объявление о закрытии едет по той же переполненной очереди, поэтому одно место в ней резервируется под Close с самого начала. Альтернатива (отдельный канал для управляющих сообщений) тоже рабочая, но требует от писателя слушать два источника."""

[[exercises]]
name = "nrt7"
style = "todo"
hint.ru = [
  """В одном `select!` три события: строка от клиента, тик таймера и срок молчания. Первый тик у `interval` срабатывает сразу, а ping нужен после первого интервала: поищи `interval_at`.""",
  """Срок молчания сдвигается при любой полученной строке. Храни `deadline` и жди `sleep_until(deadline)`: новый `sleep` на каждый круг цикла сбрасывался бы любым тиком таймера, и молчун жил бы вечно.""",
  """Чтение строки в `select!` могут прервать посреди строки. У `lines()` метод `next_line` рассчитан на отмену, недочитанное остаётся внутри него. `read_line` с буфером, созданным заново на каждом круге, теряет начало строки.""",
]
why.ru = """Heartbeat состоит из двух независимых часов: «когда пора пинговать» и «когда пора считать мёртвым». Любая весть от клиента, а не только pong, продлевает жизнь: занятой клиент, который шлёт данные, не обязан отвечать ещё и на ping. Главная ловушка тут не таймеры, а отмена: ветка select!, проигравшая гонку, отбрасывается вместе с прочитанным, поэтому в таких циклах используют только те операции чтения, которые это переживают."""

[[exercises]]
name = "nrt8"
style = "scratch"
hint.ru = [
  """Источников токена два, и порядок важен: сначала заголовок `Authorization` со схемой `Bearer`, потом адрес. Проверка токена это поход в сервис, поэтому вызывай её только когда токен действительно есть.""",
  """Адрес разберёшь по `?` и `&`, ключ сравнивай целиком (`mytoken` это другой параметр). Два параметра `token` двусмысленны: отказ с 400 лучше, чем угадывание.""",
  """У проверки три исхода: токена нет или он не подошёл (401), сервис проверки недоступен (503), успех. Присланный токен в текст отказа не клади.""",
]
why.ru = """Проверка до 101 важна тем, что после апгрейда у клиента уже есть соединение и память на сервере, а честный HTTP-отказ можно выдать почти бесплатно. 503 вместо 401 нужен, чтобы клиент не стёр хороший токен из-за сбоя на нашей стороне. Токен в адресе плох тем, что адреса попадают в логи и историю, поэтому его нельзя печатать нигде и лучше делать короткоживущим, но у браузерного WebSocket нет заголовков, и другого места нет."""

[[exercises]]
name = "nrt9"
style = "scratch"
hint.ru = [
  """Разбирай запрос в `serde_json::Value`, а не в структуру с derive: при любой ошибке derive отдаёт просто Err, а нам нужно знать, получилось ли достать id. Сначала достань id, потом остальное.""",
  """Корректность id решает `as_u64`: он отвергает строки, отрицательные и дробные числа. Если id есть, а остальное сломано, ошибку привяжи к этому id.""",
  """`json!` принимает `Option` и превращает `None` в `null`. Результат `.to_string()` это одна строка без переводов, как и нужно для текстового сообщения.""",
]
why.ru = """Ответ с id нужен клиенту, чтобы закрыть своё ожидание. Если id известен, ошибка обязана его нести, иначе клиентский запрос будет висеть до таймаута. Если id нет, отвечать «на запрос с id null» всё равно нужно, хотя бы закрытием с понятным кодом на практике, а здесь ошибкой с null. Ручной разбор Value выглядит многословнее derive, но только он даёт эту разницу."""

[[exercises]]
name = "nrt10"
style = "scratch"
hint.ru = [
  """В таблице обработчик хранится как `Arc<dyn Fn(..) -> BoxFuture<..>>`, а `route` принимает любое замыкание с любым `Future`. Склейка: оберни результат вызова в `Box::pin` внутри нового замыкания.""",
  """Ключ таблицы собирается как `format!("{service}.{method}")`. Вариант маршрута решает, что делать с `session.user`; пользователь берётся только из сессии.""",
  """Обработчик перед вызовом клонируй из таблицы (`Arc` клонируется дёшево), чтобы не держать заимствование через `.await`. Повторную регистрацию имени лови сразу, паникой при сборке роутера.""",
]
why.ru = """Таблица методов вырезает из шлюза огромный match и превращает «нужен ли вход» в свойство маршрута, а не в проверку, которую забывают в сто первом обработчике. Пользователь приходит из сессии, потому что всё, что лежит в data, написал клиент. Паника при повторной регистрации: ошибка конфигурации лучше падает при старте, чем тихо перетирает чужой обработчик."""

[[exercises]]
name = "nrt11"
style = "scratch"
hint.ru = [
  """Разрешение (permit) берётся до чтения следующего запроса, а возвращается, когда ответ ушёл. Так потолок честный: лишние запросы ждут во входной очереди, и клиент упирается в неё сам.""",
  """Паника обработчика ловится так: запусти его отдельной задачей и посмотри на `JoinError`. Ответ-ошибка со своим id уходит в любом случае, и разрешение освобождается тоже.""",
  """Когда вход закрыт, цикл не конец работы: дождись всех запущенных задач (`join_next` в цикле). Следи и за `outbound.is_closed()`: если читать ответы некому, продолжать незачем.""",
]
why.ru = """Параллельные запросы дают клиенту ленту за время самого медленного запроса, а не за сумму. Потолок нужен потому, что один злой клиент иначе заказывает тысячи задач. Берём разрешение до чтения, чтобы давление уходило по цепочке назад (в очередь, потом в TCP), а не копилось в памяти сервера. Отдельный контроль паники сохраняет и соединение, и лимит: утёкшее разрешение через несколько паник остановило бы клиента совсем."""

[[exercises]]
name = "nrt12"
style = "todo"
hint.ru = [
  """Сообщения двух видов различаются полями: у ответа `id` и `ok`, у события `event` и `seq`. Собирай оба через `json!`.""",
  """Выдача номера и постановка в очередь это одна операция. Если номер получен в одном месте, а `try_send` вызван в другом, два потока легко поменяются местами, и в очереди номера пойдут не по порядку.""",
  """Держи замок на счётчике до самого `try_send`: он не блокируется, поэтому держать замок безопасно. Номер расходуй независимо от успеха, чтобы пропавшее событие оставило дыру.""",
]
why.ru = """Клиент отличает событие от ответа по форме сообщения и проверяет, что не пропустил ничего, по номерам. Это работает только если порядок номеров совпадает с порядком в очереди, а такое гарантирует лишь общий замок вокруг «выдать номер и положить». Атомарный счётчик здесь обманчиво подходит: каждая операция по отдельности атомарна, а пара из двух нет."""

[[exercises]]
name = "nrt13"
style = "scratch"
hint.ru = [
  """Две фазы: сначала всем `try_send(1001)` без ожидания, потом ожидание. Если ждать после каждой отправки, упрямый первый в списке задержит Close для всех остальных.""",
  """Срок один на всех: `deadline = Instant::now() + grace` и `timeout_at(deadline, ...)` для каждой задачи по очереди. Уже завершившаяся задача успевает отдать результат, даже если срок прошёл.""",
  """Кого срок застал живым, того `abort()`, и дождись завершения, чтобы к возврату из функции его деструкторы точно отработали. Отправка Close в уже закрытый канал не ошибка остановки.""",
]
why.ru = """Остановка это самая редкая и самая болезненная часть шлюза: её не видно на стенде, а в бою она срабатывает при каждом деплое. Вежливое закрытие с 1001 делает деплой управляемым: клиенты знают, что надо переподключиться, и не считают это сбоем. Общий дедлайн ограничивает остановку сверху независимо от числа упрямых, а принудительный abort с ожиданием гарантирует, что процесс не завершится, пока где-то ещё что-то пишет."""

[[exercises]]
name = "nrt_q1"
kind = "question"
question.ru = """Обработчик соединения в самом начале создаёт гард реестра, который убирает запись в `Drop`. В каких случаях запись всё же останется в реестре? (Выбери все.)"""
options.ru = [
  """Обработчик вышел через `return Err(..)` посреди работы""",
  """Обработчик запаниковал (профиль сборки с `panic = "unwind"`)""",
  """Задачу оборвали через `JoinHandle::abort()`, пока она ждала на `rx.recv().await`""",
  """Кто-то вызвал `std::mem::forget(guard)` или процесс завершили через `std::process::exit`""",
]
answer = [3]
explain.ru = """Drop срабатывает при любом нормальном выходе из области видимости: при возврате, `?`, панике с раскруткой и даже при `abort()` задачи (её будущее просто уничтожается, и локальные значения роняются). Не сработает он только там, где деструкторы пропускают: `forget`, `exit`, `panic = "abort"` или падение процесса. Поэтому реестр с Drop-гардом надёжен, но не бессмертен, и на случай жёсткого падения процесса его состояние всё равно считается временным."""
hint.ru = """Что происходит с локальными переменными, когда будущее задачи уничтожают на точке await?"""

[[exercises]]
name = "nrt_q2"
kind = "question"
question.ru = """В шлюзе реестр соединений лежит в `tokio::sync::RwLock`. Рассылка берёт `read()` и в цикле делает `tx.send(msg).await` по всем получателям. Один получатель перестал читать, очередь у него полна. Что произойдёт с остальными?"""
options.ru = [
  """Ничего: читатели не блокируют друг друга, поэтому новые подключения и другие рассылки идут как обычно""",
  """Рассылка застрянет на медленном клиенте. Подключение нового клиента (`write()`) будет ждать, пока рассылка отпустит замок, а за ожидающим писателем встанут в очередь и новые читатели, так что скоро замрёт всё""",
  """Застрянет только эта рассылка, новые подключения и чужие рассылки не пострадают, потому что RwLock допускает много читателей""",
  """Tokio сам прервёт `send().await`, когда очередь переполнена""",
]
answer = [1]
explain.ru = """Читатель, который держит замок через await, блокирует писателя, а справедливый RwLock (в tokio это так) не пускает новых читателей вперёд ждущего писателя. Один зависший получатель превращается в остановку всего реестра. Лечение то же, что с Mutex: под замком только копируем отправителей, рассылаем уже без замка и через `try_send`."""
hint.ru = """Кого ждёт писатель и пустит ли справедливый замок нового читателя вперёд него?"""

[[exercises]]
name = "nrt_q3"
kind = "question"
question.ru = """Шлюз раз в 30 секунд шлёт клиенту WebSocket-ping и считает клиента живым, если вернулся pong. Пользователь свернул вкладку браузера, и браузер заморозил страницу: JavaScript на ней не выполняется, но pong сервер продолжает получать. Что из этого следует?"""
options.ru = [
  """Ничего страшного: нет pong это мёртвый клиент, есть pong это живой, механизм работает""",
  """Pong отвечает сетевой стек браузера, а не код страницы. Замороженную страницу такой ping не отличит от живой, и для проверки того, что приложение клиента работает, нужен прикладной ping внутри обычных сообщений (с id и ответом из JavaScript)""",
  """Браузер нарушает RFC 6455, потому что обязан отвечать pong только когда страница активна""",
  """Надо уменьшить интервал ping до 1 секунды, тогда замороженная вкладка перестанет отвечать""",
]
answer = [1]
explain.ru = """По RFC pong отправляет сама реализация WebSocket, без участия кода приложения. Ping на уровне протокола ловит обрыв сети и мёртвые TCP-соединения, но не зависшее или замороженное приложение. Для второго нужны прикладные сообщения: сервер спрашивает, клиент отвечает обычным запросом, и ответ означает, что код страницы выполняется."""
hint.ru = """Кто именно отвечает на ping: код страницы или браузер?"""

[[exercises]]
name = "nrt_q4"
kind = "question"
question.ru = """Клиент отправил запросы с id 1 (медленный) и id 2 (быстрый) и написал так: `send(req1); resp1 = await nextMessage(); send(req2); resp2 = await nextMessage();`. Параллельно сервер умеет слать события. Что пойдёт не так, и как правильно?"""
options.ru = [
  """Ничего: WebSocket сохраняет порядок сообщений, поэтому следующее сообщение всегда ответ на последний запрос""",
  """Следующим сообщением может прийти событие, или ответ на другой запрос. Клиент должен вести таблицу ожидающих запросов по id и раздавать входящие: сообщения с id закрывают свой запрос, сообщения с event идут подписчикам""",
  """Нужно отключить параллельную обработку на сервере, тогда ответы пойдут по порядку, и код клиента станет корректным""",
  """Достаточно проверять поле ok у каждого сообщения: оно говорит, чей это ответ""",
]
answer = [1]
explain.ru = """Порядок байтов в соединении сохраняется, но порядок смысла уже нет: сервер отвечает по готовности, и между ответами вклиниваются события. Поэтому корреляция по id часть протокола. Отключать параллелизм на сервере ради клиентского кода значит вернуть задержку суммы всех запросов; событий это всё равно не уберёт."""
hint.ru = """В соединении ходят и ответы, и события. На что клиент опирается, чтобы связать ответ с вопросом?"""

[[exercises]]
name = "nrt_q5"
kind = "question"
question.ru = """При деплое шлюз закрыл 20 000 соединений с кодом 1001. Клиент при любом закрытии сразу переподключается без паузы. Что произойдёт с новым экземпляром шлюза, и что нужно сделать на клиенте?"""
options.ru = [
  """Ничего особенного: новый экземпляр спокойно принимает подключения по одному""",
  """Все 20 000 клиентов постучатся почти одновременно, новый экземпляр (или балансировщик) захлебнётся, часть получит отказ и снова повторит запрос в ту же секунду. Клиенту нужна пауза между попытками, которая растёт при неудачах и содержит случайную добавку (экспоненциальный backoff с jitter)""",
  """Нужно запретить клиентам переподключаться после 1001""",
  """Достаточно увеличить лимит открытых файлов на сервере""",
]
answer = [1]
explain.ru = """Одновременные повторы называют thundering herd: нагрузка приходит залпом, отказывает часть, и неудачники возвращаются тоже залпом. Лекарство клиентское: ожидание растёт (например, 1, 2, 4 секунды) и к нему добавляется случайная составляющая, чтобы клиенты рассеялись по времени. Код 1001 при этом правильный: он говорит «это не ошибка, зайди снова», а не «ты что-то сломал»."""
hint.ru = """Что делают 20 000 клиентов, если каждый реагирует на закрытие одинаково и мгновенно?"""

[[exercises]]
name = "nrt_q6"
kind = "question"
question.ru = """Браузерный клиент подключается как `wss://api.example/ws?token=abc123`. Reverse proxy перед шлюзом пишет в access-log строку запроса целиком. Что из перечисленного разумно сделать?"""
options.ru = [
  """Ничего: адрес внутри TLS, значит, он нигде не виден""",
  """Не печатать query в логах (или вырезать параметр token), а саму выдачу сделать короткоживущей: например, клиент получает по HTTP одноразовый «билет» на 30 секунд и подключается с ним""",
  """Перенести токен в cookie без атрибута SameSite и не думать об этом""",
  """Передавать токен в заголовке `Authorization` из JavaScript: у браузерного WebSocket-API есть для этого параметр""",
]
answer = [1]
explain.ru = """Шифрование защищает канал, но не логи на самих серверах: прокси, балансировщик и шлюз видят адрес и часто его пишут. Заголовки у браузерного `new WebSocket(url)` поставить нельзя, поэтому токен либо в адресе, либо в cookie (а там своя защита от чужих страниц, см. проверку Origin). Практичное решение: короткоживущий одноразовый билет и никаких query в логах."""
hint.ru = """Кто, кроме браузера и шлюза, видит строку запроса?"""

[[exercises]]
name = "nrt_chat"
kind = "project"
style = "scratch"
locked = ["tests/acceptance.rs"]
quiz = true
hint.ru = [
  """Порядок работы: `Outbox` и `Hub` в `hub.rs` (задачи nrt6, nrt3, nrt4, nrt12 почти целиком переносятся), потом `methods.rs`, потом цикл соединения `conn.rs` и в конце `server.rs`. Первые тесты (`bad_tokens...`, `whoami...`) пройдут, когда готов `server.rs`, поэтому его можно написать раньше цикла: пусть соединение сначала просто отвечает на `sys.whoami`.""",
  """Цикл соединения это один `select!` с шестью событиями: остановка, исходящая очередь, чтение запроса (только если задач в полёте меньше потолка), завершённая задача из `JoinSet`, тик таймера и (внутри ветки отправки) сигнал отключения. Запись в сокет, которая зависла на медленном клиенте, должна прерываться `kicked()`.""",
  """В `server.rs` токен проверяется до `upgrade(...)`. Сигнал остановки сначала переводит соединения в режим закрытия (`watch`), а сервер движка получает готовый сигнал и ждёт обработчики до `drain_timeout`. Ошибки обработчика и паники превращаются в ответы с тем же `id`, а не в закрытие соединения.""",
]
why.ru = """Шлюз получился тем же набором решений, что и отдельные задачи главы: реестр с Drop-гардом, очередь с резервом под Close, рассылка без замка через await, heartbeat с общим дедлайном, параллельные запросы с потолком и общий срок на остановку. Новое здесь только то, что всё это работает вместе: цикл соединения слушает сразу и клиента, и очередь, и таймер, и сигнал остановки, и ни одно из ожиданий не имеет права заблокировать остальные. Из этого каркаса потом вырастает api-gateway соцсети."""

