[[exercises]]
name = "nhs1"
style = "todo"
hint.ru = [
  """Один `read` может принести половину головы запроса. Копи байты в `Vec`, пока в накопленном не появится `\\r\\n\\r\\n`.""",
  """Ищи конец головы во всём накопленном буфере, а не в последнем куске: терминатор бывает разрезан между двумя `read`. Для этого годится `buf.windows(4)`.""",
  """`read` вернул 0: клиент закрылся. Если голова к этому моменту не пришла, выйди с `Ok(())`. После ответа закрой запись: `stream.shutdown()`.""",
]
why.ru = """Ответ после первого `read` это ставка на то, что голова пришла целиком. На loopback она почти всегда выигрывает, а через мобильную сеть проигрывает постоянно. Поэтому условие выхода из цикла чтения не «что-то прочитали», а «в накопленных байтах есть пустая строка». Клиент, ушедший на полуслове, не ошибка: `read` вернул 0, и сервер молча забывает его."""

[[exercises]]
name = "nhs2"
style = "todo"
hint.ru = [
  """Content-Length считает байты. У строки это `len()`, а не количество символов: русская буква в UTF-8 занимает два байта.""",
  """Сначала разбери первую строку головы через `parse_request_line`. На `None` отвечай 400 сразу, до обработчика дело не доходит.""",
  """В `site` ветки идут от точных путей к общим: `/echo/<текст>` ищи через `strip_prefix`, и только потом 404.""",
]
why.ru = """Обработчик чистая функция: запрос на входе, ответ на выходе, сокетов он не видит. Поэтому его легко тестировать без сети, и поэтому ошибки протокола (нечитаемая строка запроса) ловит не он, а код соединения. Длина тела всегда в байтах: на кириллице ошибка в счёте сразу видна, и клиент либо обрежет ответ, либо повиснет."""

[[exercises]]
name = "nhs3"
style = "scratch"
hint.ru = [
  """Тип будущего у каждой async fn свой, а таблице нужен один. Спрячь будущее в `Box::pin`, а замыкание в `Box`.""",
  """Замыкание владеет `f` и вызывается много раз, поэтому оно `Fn`, а не `FnOnce`. Посмотри, что возвращает `f(request)` и как стереть его тип.""",
]
why.ru = """`Pin<Box<dyn Future<Output = Response> + Send>>` выглядит страшно, но смысл простой: обработчики в таблице одного типа, потому что каждое будущее лежит в куче за указателем. `Send` в границе нужен, чтобы будущее можно было отдать любому потоку рантайма, `'static` потому, что задача живёт дольше любой функции, из которой её запустили. Одна функция `handler` прячет всё это и позволяет регистрировать обычные `async fn`."""

[[exercises]]
name = "nhs4"
style = "fix"
hint.ru = [
  """В ошибках компилятора два виновника. Первый называется `Rc`, второй это ссылка `greeting`. Найди в тексте обе фразы.""",
  """`Rc` считает ссылки без атомарных операций, поэтому не `Send`: его нельзя отдавать между потоками. Нужна пара из потокобезопасного счётчика и общего владения. Ссылка на чужую строку не `'static`: замыканию нужна собственная копия.""",
  """Замыкание вызывается много раз, а `async move` забирает всё, что использует. Значит, внутри замыкания копии надо делать заново для каждого вызова.""",
]
why.ru = """Обработчик будет жить в таблице сервера, а его будущее поедет на любой поток: поэтому все захваченные значения обязаны быть `Send + Sync` и владеть собой. `Arc<AtomicU32>` даёт общий счётчик без блокировки, `String` вместо `&str` отвязывает приветствие от места, где оно создано. Ошибка про `Rc` всплывает не там, где он создан, а там, где его требует `tokio::spawn`: это нормально, читай ошибку до конца."""

[[exercises]]
name = "nhs5"
style = "todo"
hint.ru = [
  """Номер заметки выдаётся там же, где она кладётся в список, под одной блокировкой: иначе между «выдал» и «положил» вклинится другой запрос.""",
  """Блокировку `std::sync::Mutex` держи в отдельном блоке и отпусти до любого `.await`: `let id = { let mut notes = ...; ...; id };`. Иначе будущее перестанет быть `Send`.""",
  """`audit` это async: вызывай его после блока, когда guard уже умер.""",
]
why.ru = """Блокировка из std быстрая и подходит для коротких секций без `.await`. Её guard не `Send`, и компилятор не даст держать его через ожидание: это не придирка, а защита от взаимной блокировки задач на одном потоке. Выдать номер и положить заметку нужно одним куском: иначе список окажется не в порядке номеров. Всё медленное (аудит, обращение к базе) происходит после того, как блокировка отпущена."""

[[exercises]]
name = "nhs_q1"
kind = "question"
question.ru = """Какие из трёх функций можно запустить через `tokio::spawn`?

```rust
async fn a(s: Arc<Mutex<Vec<u32>>>) {
    s.lock().unwrap().push(1);
    tokio::time::sleep(Duration::from_millis(5)).await;
}
async fn b(s: Arc<Mutex<Vec<u32>>>) {
    let mut g = s.lock().unwrap();
    g.push(1);
    tokio::time::sleep(Duration::from_millis(5)).await;
    g.push(2);
}
async fn c(s: Arc<tokio::sync::Mutex<Vec<u32>>>) {
    let mut g = s.lock().await;
    g.push(1);
    tokio::time::sleep(Duration::from_millis(5)).await;
    g.push(2);
}
```
(`Mutex` без пути это `std::sync::Mutex`.)"""
options.ru = [
  "Только `a`: в остальных блокировка держится дольше",
  "`a` и `c`: у `b` guard std-мьютекса живёт через `.await`, такое будущее не `Send`",
  "`a` и `b`: обе используют обычный мьютекс, а `c` с `.await` на блокировке слишком медленная",
  "Все три: компилятору всё равно, как долго живёт guard",
]
answer = [1]
explain.ru = """У `b` guard `std::sync::MutexGuard` переживает точку `.await`, то есть хранится внутри состояния будущего. Этот guard нельзя передавать между потоками, значит, и будущее не `Send`, и `tokio::spawn` его отвергнет. У `a` guard умирает в конце выражения до `.await`. У `c` guard асинхронного мьютекса `Send`, он создан именно для удержания через ожидание, но это дороже: пользуйся им, только когда блокировку действительно надо держать через `.await`."""
hint.ru = """Где в каждой функции живёт guard: до `.await` или через него?"""

[[exercises]]
name = "nhs6"
style = "scratch"
hint.ru = [
  """Пройди по таблице: если путь совпал и метод совпал, вызывай обработчик. Если путь совпал, а метод нет, запомни этот метод.""",
  """Запомненные методы отсортируй и убери повторы (`sort_unstable`, `dedup`), потом склей через `join(", ")`. Если запомнить нечего, это 404.""",
  """Обработчик вызывается как `handler(request).await`. Запрос уходит в обработчик по значению, поэтому сравнивай с ним до вызова.""",
]
why.ru = """Различие между 404 и 405 не косметика: 404 говорит «такого адреса нет», 405 говорит «адрес есть, но так с ним нельзя», и Allow подсказывает клиенту (и человеку с curl), что можно. Поэтому роутер сначала ищет по пути, а потом смотрит на метод, а не наоборот. Таблица остаётся обычным вектором: до сотни маршрутов линейный поиск быстрее хеш-таблицы, и он сохраняет порядок регистрации, который понадобится дальше."""

[[exercises]]
name = "nhs7"
style = "todo"
hint.ru = [
  """Разбей оба пути по `/` и сравни число сегментов. Пары сегментов удобно получить через `zip`.""",
  """Сегмент шаблона с `:` в начале захватывает любой непустой сегмент пути. Остальные сравниваются точно. Пустой сегмент (`/users/`) параметром не считается.""",
  """В `parse` различай три исхода: параметра нет в шаблоне (500), значение не разбирается (400), всё хорошо. Имя параметра положи в сообщение 400.""",
]
why.ru = """Разбор пути по сегментам, а не регулярками: так проще получить правило «число сегментов совпадает» и без труда добавить приоритет. Параметры остаются строками до самого последнего момента, и преобразование в нужный тип делает обработчик, который знает, что ему нужно. Различие между 400 и 500 принципиально: опечатка клиента и ошибка в шаблоне маршрута (программист забыл `:id`) требуют разных реакций от людей, читающих логи."""

[[exercises]]
name = "nhs8"
style = "bughunt"
hint.ru = [
  """Подходящих маршрутов может быть несколько. Сначала собери все подходящие, и только потом выбирай одного.""",
  """Оценка маршрута это вектор `bool` по сегментам: статичный сегмент `true`, параметр `false`. Векторы сравниваются слева направо, это именно то, что нужно.""",
  """Возьми маршрут с максимальной оценкой (`max_by`). Запросы разных методов в сравнении не участвуют.""",
]
why.ru = """Правило «первым зарегистрирован, первым и выиграл» делает поведение сервера зависимым от порядка строк в `main`, и ошибка появляется только после очередного рефакторинга. Правило «конкретнее значит приоритетнее» не зависит от порядка. Сравнение слева направо выбрано потому, что левые сегменты определяют раздел сайта (`/api/v1/...`), правые уточняют. При полном равенстве оценок побеждает любой: такие маршруты неоднозначны, и в боевом роутере это лучше ловить при регистрации."""

[[exercises]]
name = "nhs_q2"
kind = "question"
question.ru = """В роутере три маршрута для GET:

```
A: /api/:version/users
B: /api/v1/:resource
C: /:service/v1/users
```
Правило: сравниваем сегменты слева направо, статичный сегмент сильнее параметра. Какой маршрут обработает `GET /api/v1/users`?"""
options.ru = [
  "A: он совпадает последним сегментом `users`, а это самая важная часть адреса",
  "C: у него два статичных сегмента подряд в конце, значит он самый длинный по статике",
  "Ни один: три равноправных совпадения это неоднозначность, и роутер вернёт 404",
  "B: у него статичные `api` и `v1` в начале, а побеждает тот, чьи статичные сегменты левее",
]
answer = [3]
explain.ru = """Оценки по сегментам: A это [да, нет, да], B это [да, да, нет], C это [нет, да, да]. Сравнение идёт слева направо: у A и B первый сегмент равен, на втором у B статичный `v1` против параметра у A, поэтому B выше A. У C уже первый сегмент параметр, он проигрывает обоим. Статичных сегментов у каждого ровно два, так что «у кого их больше» критерием быть не может."""
hint.ru = """Выпиши для каждого маршрута тройку «статичный или параметр» и сравни по порядку."""

[[exercises]]
name = "nhs9"
style = "todo"
hint.ru = [
  """Отдельная функция на одно число экономит код: найди все значения по имени, проверь количество, проверь, что это цифры, потом `parse`.""",
  """Цифры проверяй вручную (`bytes().all(|b| b.is_ascii_digit())`): `u32::from_str` согласен на ведущий плюс.""",
  """Сначала целиком обработай limit (повтор, число, диапазон), потом offset. Так при двух ошибках сообщение про limit.""",
]
why.ru = """Типизированные параметры превращают неопределённость запроса в одну точку проверки: дальше по коду ходит `Page`, а не строки. Ошибка возвращается структурой, а не готовым текстом, чтобы обработчик сам решил, как её показать (JSON, текст). Повтор параметра отвергается, потому что разные части системы (прокси, фреймворк, код) по-разному выбирают «первое» или «последнее» значение, и на этом строятся обходы проверок."""

[[exercises]]
name = "nhs10"
style = "scratch"
hint.ru = [
  """Три шага по порядку: тип, параметры типа, тело. Первое, что не сошлось, и есть ответ клиенту.""",
  """Тип: `split(';')`, первая часть без пробелов равна `application/json` без учёта регистра. Остальные части это `имя=значение`, интересует `charset`.""",
  """Ошибку serde можно показать как есть: в её тексте строка и колонка, а для недостающего поля ещё и его имя.""",
]
why.ru = """Три разных кода отвечают на три разных вопроса клиента. 415 говорит «поменяй заголовок», 400 «поправь тело». Если вернуть везде 400, клиент будет часами править JSON, у которого на самом деле неверный заголовок. Content-Type проверяется до чтения тела, потому что решение «умею ли я это читать» не зависит от байтов. Текст ошибки serde не секрет, а подсказка: в нём позиция и поле."""

[[exercises]]
name = "nhs_q3"
kind = "question"
question.ru = """Клиент шлёт `POST /users` с заголовком `Content-Type: application/json; charset=windows-1251`, а в теле JSON с кириллицей, закодированной именно в windows-1251. Сервер проверяет только, что тип равен `application/json`, а байты отдаёт в `serde_json::from_slice`. Что получит клиент и что лучше?"""
options.ru = [
  "Всё сработает: серверу достаточно типа `application/json`, кодировку он определит сам",
  "Скорее всего 400 с непонятным «invalid unicode», хотя клиент честно назвал кодировку; лучше сразу 415 с причиной",
  "Всегда 200: serde сам перекодирует windows-1251 в UTF-8, а ошибку даст только заглавная кириллица",
  "Сервер упадёт, потому что не-UTF-8 байты в строках приводят к панике внутри serde_json",
]
answer = [1]
explain.ru = """JSON в HTTP это UTF-8, и serde_json читает только его. Байты windows-1251 для кириллицы не образуют корректный UTF-8, поэтому разбор упадёт на первом таком символе с ошибкой про юникод. Клиенту это похоже на ошибку в его данных, хотя причина в заголовке. Честнее проверить `charset` заранее и ответить 415 с текстом «нужен UTF-8». Паники нет: serde возвращает ошибку, а не падает."""
hint.ru = """Что serde_json умеет читать, кроме UTF-8?"""

[[exercises]]
name = "nhs11"
style = "todo"
hint.ru = [
  """Не собирай JSON склейкой строк. Пусть это делает serde_json: `json!({ "error": message })` экранирует кавычки и переводы строк сам.""",
  """`serde_json::to_vec` возвращает `Result`. Ветку с ошибкой оформи 500, а не `unwrap`.""",
]
why.ru = """Единый формат ошибки это часть контракта API: клиентский код пишет один разборщик, а не по ветке на каждый эндпоинт. Экранирование поручено сериализатору, потому что руками его не получается сделать верно во всех случаях (юникод, управляющие символы). Ошибка сериализации в `json` не должна ронять обработчик: она вина сервера, а значит, честный 500, и клиент не должен видеть детали."""

[[exercises]]
name = "nhs12"
style = "fix"
hint.ru = [
  """Поломок две. Сначала `dispatch`: что должен делать HEAD, когда собственного HEAD-обработчика нет? Потом `to_wire`: что он пишет в конец ответа?""",
  """В `dispatch` сначала ищи точное совпадение метода, а для HEAD запасной вариант GET. Тем же способом дополни список Allow: если разрешён GET, то и HEAD.""",
  """В `to_wire` длина считается по настоящему телу, а само тело дописывается только при `!head_only`.""",
]
why.ru = """HEAD это вопрос «что бы ты ответил на GET», поэтому запасной путь через GET-обработчик правильный по умолчанию, а собственный HEAD-обработчик нужен лишь тому, кто хочет сэкономить на вычислении тела. Длина в заголовках должна быть настоящей: на ней клиент строит решение (скачивать ли, докачивать ли). Лишние байты тела в ответе на HEAD не безобидны: на соединении, которое остаётся открытым, они читаются как начало следующего ответа."""

[[exercises]]
name = "nhs13"
style = "todo"
hint.ru = [
  """Паника внутри `tokio::spawn` не убивает того, кто вызвал `spawn`: она возвращается как ошибка у `JoinHandle`.""",
  """Вызов самого замыкания (`handler(request)`) тоже должен быть внутри spawn: паника в нём до первого `.await` иначе пролетит мимо.""",
  """`.await` на `JoinHandle` даёт `Result<Response, JoinError>`. Ветка `Err` это паника или отмена, ответ в обоих случаях 500.""",
]
why.ru = """Обработчики пишут люди, и рано или поздно один из них паникует. Граница задачи в tokio и есть защитная перегородка: паника уничтожает задачу, но не рантайм. Поэтому обработчик запускается как отдельная задача, а паника превращается в `JoinError`. Клиент получает общий текст, подробности паники идут в журнал: наружу внутренности не выдают. Через `futures::FutureExt::catch_unwind` то же делается без лишней задачи, но тогда надо отдельно думать про панику в синхронной части замыкания."""

[[exercises]]
name = "nhs_q4"
kind = "question"
question.ru = """Сервер так запускает соединения: `tokio::spawn(connection(stream, app.clone()))`, а внутри `connection` обработчик вызывается напрямую, без защиты от паники. Обработчик паникует на запросе клиента А. Что увидят клиент А, клиент Б (другое соединение) и сам сервер?"""
options.ru = [
  "А получит 500, Б и сервер ничего не заметят",
  "А получит оборванное соединение без ответа, Б и сервер продолжат работать: паника убила только задачу соединения А",
  "Все соединения оборвутся, сервер завершится: паника в любой задаче роняет процесс",
  "А и Б оба получат оборванное соединение: задачи одного рантайма делят судьбу",
]
answer = [1]
explain.ru = """Паника в tokio-задаче заканчивает только эту задачу, остальные продолжают работать (если не включён panic = abort). Но клиент А ничего не получит: 500 никто не отправлял, соединение просто закроется. Поэтому защита нужна не ради живучести сервера (она и так есть), а ради вежливого ответа клиенту. А вот если обработчик вызвать прямо в цикле accept, паника убьёт сам цикл, и сервер перестанет принимать соединения."""
hint.ru = """Что именно уничтожает паника в tokio: процесс, рантайм или задачу?"""

[[exercises]]
name = "nhs_q5"
kind = "question"
question.ru = """В роутере два маршрута: `GET /a` и `POST /a/:id`. Клиент отправляет `GET /a/5`. Что ответит сервер, который правильно различает 404 и 405?"""
options.ru = [
  "404: адреса `/a/5` для GET нет, и метод тут ни при чём",
  "200: сработает ближайший по смыслу маршрут",
  "405 с `Allow: POST`: путь `/a/5` подходит под шаблон, но метод не тот",
  "405 с `Allow: GET, HEAD, POST`: сервер перечисляет все методы, которые он знает",
]
answer = [2]
explain.ru = """Путь `/a/5` подходит под шаблон `/a/:id`, значит, адрес существует, но у него есть только POST. Это 405 и Allow со списком методов именно этого пути. Маршрут `GET /a` к нему не относится: `/a` и `/a/5` разные пути. Перечислять в Allow все методы сервера было бы ложью: клиент решит, что для этого пути они допустимы."""
hint.ru = """Какие маршруты подходят под путь `/a/5`, если не смотреть на метод?"""

[[exercises]]
name = "nhs_router"
kind = "project"
style = "scratch"
locked = ["tests/acceptance.rs"]
quiz = true
hint.ru = [
  """Скелет: `Router::route` кладёт сегменты в `Vec`, `dispatch` раскодирует сегменты пути, выбирает лучший маршрут среди подходящих по методу (статичный сегмент сильнее параметра, слева направо) и подставляет параметры в `request.params`. Нет подходящих по методу, но путь подошёл, это 405 с Allow, иначе 404. HEAD при отсутствии своего обработчика идёт в GET.""",
  """Сервер: `serve` в цикле принимает соединения и запускает `connection`. В `connection` накапливай байты и вызывай `parse_request`, пока не получишь `Complete` (или ошибку: ответ с кодом из `e.status()`, потом `finish`). Обработчик запусти через `run_handler` с `tokio::spawn`, чтобы паника стала 500.""",
  """JSON: `Response::error` собирай через `serde_json::json!`, `Response::json` при ошибке сериализации возвращает 500. `Request::json` сначала проверяет Content-Type (415), потом разбирает тело (400). Перед закрытием соединения вызови `finish`, который напишешь сам: он закрывает запись и вычитывает остаток (с лимитом по объёму и по времени), иначе ответ на слишком большой запрос теряется в RST.""",
]
why.ru = """Проект собирает всё, что было в главе, в один крейт, на котором дальше строится боевой сервер. Три решения держат его: запрос собирается из кусков, пока парсер не скажет `Complete` (ошибки парсера превращаются в коды сразу), обработчик запускается в своей задаче (паника не стоит клиенту ответа), а перед закрытием сервер вычитывает остаток запроса (иначе клиент теряет ответ об ошибке). Роутер выбирает маршрут по специфичности, а не по порядку, и различает 404 и 405."""

