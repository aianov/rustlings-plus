requires = []
hint.ru = [
"""http-engine собирается из проектов глав nhb_parse и nhs_router: парсер это чистая функция над накопленным буфером,
которая отвечает Partial или Complete с числом потреблённых байт, а сервер читает сокет в буфер, пока парсер не
ответит Complete. Разложи код по папкам из дерева, у каждого типа свой модуль.""",
"""Обработчики разной формы живут в одной таблице, если у всех один тип: `Arc<dyn Fn(Request) -> BoxFuture<Response> +
Send + Sync>`. `with_state(state, f)` прячет `Arc::clone` состояния внутрь, тогда маршрут это одна строка:
`.post("/auth/login", with_state(shared.clone(), login))`, а `login` обычная `async fn(Arc<Shared>, Request)`.""",
"""Паника обработчика не должна валить соединение и сервер: запусти обработчик в `tokio::spawn`, и паника придёт
как `JoinError`, из которого получается ответ 500. Тесты курса паникуют через `resume_unwind`, чтобы не печатать
бэктрейсы.""",
"""Токен это 16 байт из `getrandom::fill`, записанные hex: 32 знака. Храни `HashMap<токен, UserView>` под замком в
общем состоянии шлюза: HTTP-обработчик `/auth/login` кладёт туда токен, а `session.hello` по TCP его ищет. Шлюз
слушает два порта: `tokio::join!` двух циклов, оба гаснут по одному токену остановки.""",
]
story.ru = """Соцсеть заговорила на HTTP: вход выдаёт настоящий токен, профиль и пост открываются по ссылке хоть в браузере, а
свой парсер выдержал двадцать тысяч мутаций без единой паники."""
