hint.ru = [
"""websocket-engine это проект главы 10 nws_engine, разложенный по папкам из дерева. Его вложенный http-engine уже
умеет Upgrade: перенеси в свой движок `Upgraded`, `UpgradeHook`, `Response::on_upgrade` и ветку для 101 в цикле
соединения. Самое важное там одно: вместе с сокетом отдай крючку остаток буфера `buf`.""",
"""Шлюз теряет цикл accept и построчное соединение: удали `server/` и `connection/`, а `Shared` перенеси в `state/`.
Сессия WebSocket повторяет старое соединение: конверт пришёл, `protocol::handle` ответил, ответ ушёл фреймом.
Push от `Hub` приходят в ту же сессию через `mpsc`, поэтому главный цикл это `select!` из остановки, очереди push и
`timeout(idle, ws.recv())`.""",
"""Порядок в обработчике `/ws` решает: сначала `check_upgrade` (кривой запрос не должен ждать места), потом токен из
`?token=` (чужой это 401 обычным ответом), потом `acquire_owned` у семафора сессий, и только потом `upgrade`.
Разрешение уезжает в сессию и отпускается, когда она кончится.""",
"""Коды закрытия: 1001, когда шлюз останавливается или клиент молчит дольше `idle_timeout`; 1003 на двоичный фрейм;
1009 сам поставит `WsStream`, если сообщение больше `max_message`, а это `max_line` из конфига.""",
]
story.ru = """Соцсеть заговорила на языке браузера: конверты бегают WebSocket-фреймами по тому же порту, что вход и аватары, а
свой движок держит рукопожатие, маски, фрагменты и закрытие по RFC."""
