[[exercises]]
name = "nws1"
style = "todo"
hint.ru = [
  """Три байта это 24 бита, а символ несёт 6 бит: 24 / 6 = 4. Сложи три байта в одно число `u32` и вытащи четыре шестибитных куска сдвигами и маской `& 63`.""",
  """Для хвоста из одного или двух байтов добавь к числу нулевые байты, но символов выводи только столько, сколько настоящих бит: один байт даёт два символа, два байта дают три. Остаток до четырёх заполни `=`.""",
  """Индекс символа `i` (0..4) берётся так: `(n >> (18 - 6 * i)) & 63`. Для `i` больше числа байтов в куске вместо символа идёт `=`.""",
]
why.ru = """Кодировщик сделан на целых числах: сдвиги и маски дешевле, чем возня со строками битов, и именно так его пишут в настоящих библиотеках. Хвосты обрабатываются тем же циклом, а не отдельной веткой: лишние нулевые байты в числе не меняют значащие шесть бит, нужно только не вывести лишние символы. Ошибка, которую делают чаще всего, это забытый паддинг или лишний символ `A` вместо `=` на хвосте."""

[[exercises]]
name = "nws2"
style = "todo"
hint.ru = [
  """Для каждой четвёрки символов найди индексы в алфавите, собери 24-битное число и вытащи байты. Если в конце стоят `=`, это не данные: считай их нулями, а байтов выдай меньше (один `=` даёт два байта, два `=` один байт).""",
  """Паддинг ищи с конца группы. Если знаков `=` больше двух или паддинг стоит не в последней четвёрке, это ошибка. Символ вне алфавита (включая `=` на месте данных) тоже.""",
  """Строгость в хвосте: при `==` у второго символа должны быть нулевыми младшие 4 бита, при одном `=` у третьего младшие 2 бита. Проще проверить через собранное число: биты ниже использованных байтов должны быть нулями.""",
]
why.ru = """Строгий разбор нужен не из занудства. Если один и тот же ключ можно записать несколькими способами (с лишними битами, с пробелами), то прокси, сервер и фильтр безопасности будут понимать его по-разному, а это источник лазеек. Поэтому берём одну каноническую запись и отвергаем всё остальное. Заодно ты видишь, что `=` это не символ алфавита, а служебный знак, и в данных он невозможен."""

[[exercises]]
name = "nws3"
style = "todo"
hint.ru = [
  """Алгоритм из трёх слов: ключ плюс GUID, sha1, base64. Ключ берётся как текст (24 символа), его не нужно раскодировать.""",
  """В `sha1` хэш считается так: `let mut h = Sha1::new(); h.update(...); let digest = h.finalize();` (трейт `Digest` нужно подключить). `update` можно вызвать дважды, сначала для ключа, потом для GUID.""",
  """В base64 отдай сами 20 байт дайджеста (`&digest` как срез). Не `format!("{digest:x}")`: hex-текст вдвое длиннее и не совпадёт с клиентом.""",
]
why.ru = """Типичная ошибка тут одна: закодировать hex-представление хэша вместо самих байтов. Клиент делает то же вычисление и сверяет строку, поэтому любое расхождение превращается в закрытое соединение без внятной причины. Ещё одна мелочь: ключ берётся в том виде, в каком пришёл. Раскодировать и закодировать обратно нельзя, если клиент прислал неканоничную запись, ответ будет другим."""

[[exercises]]
name = "nws4"
style = "todo"
hint.ru = [
  """Шагай по списку из шапки сверху вниз и на первом же несоответствии возвращай ошибку. Для Upgrade и Connection бери готовый `has_token`, не сравнивай строки целиком.""",
  """Ключ проверяй не по длине строки, а по тому, что получилось после раскодирования: 24 символа могут оказаться и восемнадцатью байтами. Заголовок ключа встретиться должен ровно один раз (`all` отдаёт все вхождения).""",
  """Версию сравнивай после `trim` с текстом `"13"`, отсутствие заголовка и несколько заголовков тоже ведут к 426. В `Reject` кладётся и статус, и пара для заголовка ответа.""",
]
why.ru = """Проверка запроса это границы доверия: всё, что пришло по сети, пока лишь текст. Ключ проверяется по смыслу (ровно 16 байт), а не по виду, потому что кто-то обязательно пришлёт 24 хороших на вид символа. Отдельный код 426 нужен, чтобы клиент мог отличить «ты ошибся в запросе» от «мы не говорим на твоей версии» и сообщить об этом пользователю."""

[[exercises]]
name = "nws5"
style = "bughunt"
hint.ru = [
  """В RFC 7230 `Connection` и `Upgrade` это списки токенов через запятую. Загляни в запрос браузера, который не работает, и сравни его с тем, что код ждёт буквально.""",
  """Поломок в одной функции несколько: целая строка вместо токенов, чувствительность к регистру, а ещё `header` смотрит только первое вхождение заголовка. Для последнего есть метод, который отдаёт все строки.""",
  """Токен нужно найти целиком, не как подстроку: `not-upgrade` не должен подойти. Разбей значения по запятой, обрежь пробелы и сравни без учёта регистра.""",
]
why.ru = """Заголовки `Connection` и `Upgrade` описаны как списки, и браузеры пользуются этим: Firefox прибавляет к Upgrade ещё и `keep-alive`, прокси переписывает и дробит строки. Сравнение «всё значение равно слову» работает с ровно одним клиентом, на котором автор проверил, и ломается на остальных. Обратная ошибка так же опасна: проверка «содержит подстроку» пропустит `not-upgrade`. Поэтому токенизация, и обязательно по всем вхождениям заголовка."""

[[exercises]]
name = "nws6"
style = "todo"
hint.ru = [
  """Origin это не URL с путём, а тройка «схема, хост, порт», записанная одной строкой без слэша в конце. Поэтому в списке допустимых лежат такие же строки, и сравнивать надо их целиком.""",
  """`starts_with` и `contains` пропустят `https://app.example.evil.com`. Нужно равенство без учёта регистра (`eq_ignore_ascii_case`). Отдельно обработай `null` и отсутствие заголовка.""",
  """Порядок: нет заголовка (смотри настройку), потом `null` (отказ всегда), потом поиск в списке. Для всех отказов статус один, 403.""",
]
why.ru = """Cross-Site WebSocket Hijacking это реальная уязвимость: страница злоумышленника открывает сокет на наш сервер, браузер услужливо прикладывает cookie, и чужой код говорит от имени пользователя. CORS тут не спасает, он касается только `fetch` и XHR. Полное сравнение с белым списком единственная надёжная проверка; префиксы и подстроки всегда находят поддомен злоумышленника. `null` отвергается потому, что его шлют, в том числе, страницы из песочницы, которую кто угодно может создать."""

[[exercises]]
name = "nws_q4"
kind = "question"
question.ru = """Банк делает чат поддержки на WebSocket. Сессия пользователя хранится в cookie. Разработчик пишет: «Origin не проверяем, CORS и так защищает». На странице evil.example скрипт выполняет `new WebSocket('wss://bank.example/chat')`, пока пользователь залогинен в банке. Что произойдёт?"""
options.ru = [
  """Браузер заблокирует подключение: правила CORS действуют и на WebSocket""",
  """Браузер не отправит cookie банка на запрос с чужой страницы, поэтому подключение будет анонимным""",
  """Соединение установится с cookie пользователя, и скрипт с чужого сайта сможет читать и писать от его имени""",
  """Подключение откроется, но сервер сразу закроет его из-за разных доменов""",
]
answer = [2]
explain.ru = """CORS касается fetch и XHR, а для WebSocket браузер не делает предзапросов и не блокирует подключения. Cookie банка прикладываются, потому что запрос идёт на домен банка. Единственная защита: сервер сам сверяет заголовок Origin (его ставит браузер, скрипт подделать его не может) со списком разрешённых страниц. Эта атака называется Cross-Site WebSocket Hijacking."""
hint.ru = """Какой механизм браузера вообще проверяет, с какой страницы открывают сокет?"""

[[exercises]]
name = "nws7"
style = "todo"
hint.ru = [
  """Подумай о порядке: клиент должен увидеть 101 раньше, чем обработчик начнёт что-то писать. И о том, чем заканчивается цикл: в HTTP он ждёт следующего запроса, а здесь следующего запроса уже не будет.""",
  """Запиши ответ и дождись `flush`, потом передай владение сокетом. Вызов обработчика нужно именно ждать (`.await`), а не отправлять в `spawn`: соединение принадлежит тому, кто сейчас им управляет, и пока оно живо, оно должно оставаться занятым.""",
  """После возврата из обработчика сокет в нём уже перемещён, цикл продолжать нечем. Выйди из функции.""",
]
why.ru = """Апгрейд меняет контракт соединения целиком, поэтому код обработчика получает сокет, а не просто приказ «ответь 101». Ждём `takeover` прямо в задаче соединения по двум причинам: пока обработчик работает, занят слот в лимите соединений, а мягкая остановка сервера видит эту задачу и может её дождаться. Если бы мы отпустили сокет в отдельную `spawn`-задачу, сервер считал бы соединение завершённым, а оно продолжало бы жить без присмотра."""

[[exercises]]
name = "nws8"
style = "bughunt"
hint.ru = [
  """Сообщения теряются только когда сегмент с рукопожатием уже содержит и начало сообщения. Спроси себя: что делает `accept_upgrade` с байтами, прочитанными после конца заголовков, и что делает `read_messages` с полем `rest`?""",
  """Здесь две потери подряд. Первая: прочитанное сверх заголовков надо оставить в `rest`, а отрезать только сам запрос. Вторая: потребитель обязан начать с `rest`, а уже потом читать сокет.""",
  """Достаточно, чтобы буфер потребителя начинался с `rest` и из буфера `accept_upgrade` убирались ровно `end` первых байтов.""",
]
why.ru = """Это самая обидная ошибка апгрейда, потому что она плавающая: на медленном канале каждый кусок приходит отдельным сегментом и всё работает, а в быстрой сети клиент пишет рукопожатие и первое сообщение одним вызовом. Протокол после 101 обязан получить всё, что уже вычитано из сокета. Поэтому `Upgraded` несёт не только поток, но и `rest`, а читатель сначала разбирает его. В настоящих библиотеках это называется `Upgraded` с «перемотанным» (rewind) входом."""

[[exercises]]
name = "nws9"
style = "todo"
hint.ru = [
  """Первый байт: `FIN | RSV1 | RSV2 | RSV3 | opcode(4 бита)`. Второй: `MASK | длина(7 бит)`. Для каждого поля нужна своя маска: `0x80` старший бит, `0x70` три зарезервированных, `0x0F` младшие четыре, `0x7F` младшие семь.""",
  """Сначала проверь зарезервированные биты, потом код операции: так ошибка однозначна. Допустимые коды: 0, 1, 2 (данные), 8, 9, 10 (управление). Всё остальное `from_u8` возвращает как `None`.""",
  """`masked` и `fin` это булевы, `len7` число. Остальные биты в этой задаче не интересны: длину и маску разберём дальше.""",
]
why.ru = """Расширения протокола используют RSV-биты (например, сжатие permessage-deflate), поэтому сервер, который о них не договаривался, обязан отвергнуть фрейм с этими битами, а не тихо пропустить: иначе данные будут истолкованы неверно. Неизвестный код операции отвергается так же. Тест перебирает все 65536 комбинаций двух байтов против независимого условия, и это дешевле, чем придумывать отдельные случаи."""

[[exercises]]
name = "nws10"
style = "todo"
hint.ru = [
  """Три ветки: `len7 < 126` (длина и есть `len7`, прочитано 0 байт), `126` (два байта big-endian) и `127` (восемь байт big-endian). Для `u16` и `u64` есть `from_be_bytes`.""",
  """Нехватку байтов возвращай как `Ok(None)` до всякой проверки значения: ждать нужно и в том случае, если пришедшая часть выглядит подозрительно, а решит всё полное число.""",
  """Старший бит 64-битной длины проверь сдвигом (`n >> 63`). Минимальность: после 126 число должно быть не меньше 126, после 127 не меньше 65536.""",
]
why.ru = """Две проверки вдобавок к арифметике нужны не из педантизма. Неминимальная запись длины позволяет одному и тому же фрейму выглядеть по-разному, и фильтр на прокси увидит одно, а сервер другое. Старший бит длины запрещён, чтобы длина всегда помещалась в знаковое 64-битное число: иначе на некоторых платформах она станет отрицательной и обойдёт проверку лимита. А `Ok(None)` ради нехватки байтов это стандартная форма инкрементального разбора: «пока не знаю, подожди»."""

[[exercises]]
name = "nws_q5"
kind = "question"
question.ru = """Клиент утверждает, что отправил корректный текстовый фрейм из пяти байт, и показывает на проводе: 81 7E 00 05 48 65 6C 6C 6F. Серверный декодер отвечает ошибкой «неминимальная длина». Кто прав?"""
options.ru = [
  """Клиент: длина 5 записана верно, просто в двухбайтной форме""",
  """Сервер: пять байт обязаны быть записаны в семи битах (второй байт 05 без маркера 126), кратчайшая форма обязательна""",
  """Клиент, но сервер вправе перестраховаться, поэтому можно игнорировать ошибку""",
  """Оба неправы: длина вообще должна быть восьмибайтной""",
]
answer = [1]
explain.ru = """RFC 6455 требует записывать длину минимальным числом байт. Маркер 126 означает «длина от 126 до 65535 в двух байтах», и пять там быть не может. Если разрешить любую запись, один фрейм получит несколько представлений, и фильтр на прокси и сервер будут понимать его по-разному."""
hint.ru = """Для какого диапазона длин отведён маркер 126?"""

[[exercises]]
name = "nws11"
style = "todo"
hint.ru = [
  """Байт `i` данных получает ключ номер `(offset + i) % 4`. Само действие это `^=`, и оно же снимает маску.""",
  """Смещение нужно для данных, которые приходят кусками: если первый кусок был длиной 5, то второй надо маскировать с `offset = 5`, а не с нуля, иначе ключ «собьётся».""",
  """Роли: сервер требует маски от клиента, клиент запрещает маски у сервера. Две ошибки разные, чтобы журнал сразу показывал, чья вина.""",
]
why.ru = """Маска защищает не данные, а посредников. Если клиент способен отправить в сокет произвольные байты, его скрипт может подделать такой поток, что кеширующий прокси примет часть за ответ на другой запрос и запомнит его (атака отравления кеша). Случайная маска, которую злоумышленник не выбирает, лишает его такой возможности. Поэтому ключ клиент обязан генерировать заново для каждого фрейма и непредсказуемо. На стороне сервера XOR применяется кусками, и смещение нужно, чтобы не сбиться при разрезе данных."""

[[exercises]]
name = "nws_q1"
kind = "question"
question.ru = """Автор клиентской библиотеки решил не маскировать фреймы: «Соединение у нас по wss, то есть всё зашифровано, а маска только жжёт процессор». Сервер написан по RFC. Что произойдёт?"""
options.ru = [
  """Всё заработает: TLS защищает и фреймы, и маску, поэтому маска лишняя""",
  """Сервер примет фреймы, маска нужна только для совместимости со старыми прокси""",
  """Сервер обязан считать это нарушением протокола и закрыть соединение с кодом 1002: маска защищает не от прослушки, а от посредников, которые стоят после точки, где TLS уже снят""",
  """Данные дойдут, но их сможет прочитать любой, кто видит трафик""",
]
answer = [2]
explain.ru = """По RFC 6455 клиент обязан маскировать каждый фрейм, а сервер обязан отвергнуть немаскированный: это ошибка протокола, код 1002. Довод про TLS не работает: маска не для шифрования. Она нужна, чтобы скрипт на странице не мог составить поток так, чтобы кеширующий или обратный прокси принял часть данных за HTTP-ответ и запомнил его. Такие посредники стоят как раз там, где TLS уже снят."""
hint.ru = """Для чего маске нужен ключ, если он едет в том же фрейме, что и данные?"""

[[exercises]]
name = "nws12"
style = "todo"
hint.ru = [
  """Действуй по слоям: два байта, длина, ключ маски, полезная нагрузка. На каждом слое, если данных не хватает, верни `Ok(None)` и ничего не извлекай из буфера. Заберёшь байты (`split_to`) только тогда, когда весь фрейм точно лежит в буфере.""",
  """Проверку лимита делай сразу, как узнала длину: до того, как проверять, хватает ли байтов самой нагрузки. Иначе злоумышленник заявит гигабайт, а сервер будет копить его в памяти.""",
  """Считай полный размер фрейма: `2 + байты длины + 4 (если есть маска) + длина`. Нагрузку размаскируй тем же `apply_mask`, начиная с нулевого смещения.""",
]
why.ru = """Декодер, который «съедает» байты по мере разбора, потом не может продолжить, когда придёт остальное: ему пришлось бы хранить собственное состояние. Проще и надёжнее смотреть в буфер, не двигая его, и забирать фрейм одним куском в конце. Проверка лимита по заявленной длине защищает память: клиент отправляет всего 10 байт, объявляя гигабайт, и сервер не должен выделять и ждать, пока тот придёт."""

[[exercises]]
name = "nws13"
style = "todo"
hint.ru = [
  """Первый байт: `FIN << 7 | opcode`. Второй: бит маски `0x80` плюс либо длина (до 125), либо маркер 126 или 127. Длину после маркера пиши big-endian (`to_be_bytes`). Выбирай кратчайшую форму: 125, потом 65535, потом остальное.""",
  """Если есть ключ, запиши его сразу после длины, а данные замаскируй копией (исходный `Frame` менять нельзя). Если ключа нет, данные идут как есть.""",
  """Генератор: xorshift64 с тремя сдвигами (13, 7, 17) держит состояние в `u64`; чтобы младшие биты не были слабыми, умножь состояние на большую нечётную константу (например, 0x2545F4914F6CDD1D) и возьми старшие 32 бита. Зерно из `RandomState::new().build_hasher().finish()`: оно у каждого процесса своё. Ноль в состоянии убивает xorshift, поэтому зерно проходит через `| 1`.""",
]
why.ru = """Кодировщик и декодер должны быть зеркальны, и лучший способ проверить зеркальность: пустить одно через другое. Мы проверим это ещё жёстче в следующей задаче. Случайность ключа маски нужна по соображениям безопасности, поэтому детерминированное зерно (время запуска, номер процесса) недопустимо: злоумышленник, который может предсказать ключ, может подобрать данные так, чтобы после маскирования получился нужный ему поток."""

[[exercises]]
name = "nws14"
style = "scratch"
hint.ru = [
  """Свойство такое: набор фреймов, закодированный и потом прочитанный кодеком, должен получиться тем же, независимо от того, как поток разрезан на куски. Значит, у тебя три генератора: фреймы, их ключи масок и нарезка.""",
  """Случайные размеры от 0 до 300 редко попадают в 125, 126, 65535, 65536. Добавь список граничных размеров и выбирай из него с вероятностью около половины. Фреймы бери всех видов (Text, Binary, Continuation, управляющие) и с разными FIN, ведь кодек их не проверяет.""",
  """Нарезок нужно три вида: весь поток одним куском, по одному байту (на коротких потоках, иначе долго) и случайными кусками. Несколько фреймов в одном потоке даёт случай «два фрейма в одном куске». В сообщении об ошибке укажи зерно, номер случая и вид нарезки, чтобы поломку можно было воспроизвести.""",
]
why.ru = """Тут проверяется сам метод. Пример-тесты проверяют то, что ты придумал, а ошибки живут там, где ты не придумал: на границах длин, на разрезах посреди заголовка, на нескольких фреймах в одной порции. Случайный перебор с детерминированным зерном находит их и позволяет повторить падение. Хорошее свойство ловит поломку сразу по двум признакам: чем шире генератор, тем реже ошибка проскакивает. Эту же идею ты применишь к настоящему кодеку в проекте главы."""

[[exercises]]
name = "nws15"
style = "todo"
hint.ru = [
  """Две функции с разной задачей. Первая смотрит только на заголовок (код операции, FIN, заявленная длина) и ничего не знает о данных: так её можно позвать, пока данные ещё не пришли. Вторая получает готовый фрейм.""",
  """Для управляющих фреймов запрещены разрезание (`FIN = 0`) и длина больше 125. Для остальных эта функция ничего не проверяет.""",
  """Pong-ответ несёт то же тело, что и ping. Pong без ping допустим и вызывает только «ничего не делать». Close пока верни наружу вместе с телом.""",
]
why.ru = """Ограничения на управляющие фреймы не случайны: они должны проходить сквозь любую передачу данных и не требовать сборки. Если разрешить фрагментировать ping, он снова станет «сообщением» и потребует состояния. Проверка по заголовку помогает защитить память так же, как лимит в декодере: нет смысла ждать 10 МБ «ping». И pong без ping разрешён намеренно: клиент может присылать его как одностороннюю проверку связи, а сервер не обязан ему отвечать."""

[[exercises]]
name = "nws16"
style = "todo"
hint.ru = [
  """Состояние всего одно: «идёт сборка сообщения такого-то типа, накоплено столько-то байт». Пока оно есть, новое сообщение начинать нельзя. Пока его нет, нельзя продолжать.""",
  """Управляющие фреймы разбирай в первую очередь и не трогай состояние: они могут прийти в любой момент и не должны ничего прерывать. Проверку их правил можно оформить так же, как в прошлой задаче.""",
  """Текст превращай в `String` один раз, когда пришёл последний фрагмент. Проверять UTF-8 в каждом фрагменте нельзя: буква может быть разрезана между ними. Эту сторону мы потрогаем ещё в одной задаче.""",
]
why.ru = """Сборщик держит единственную вещь: что собирается прямо сейчас. Из этого следуют все ошибки порядка: продолжение без начала, начало поверх начала. Управляющие фреймы обходят сборку, и это сделано специально: ping нужно ответить сразу, иначе долгая передача большого сообщения даст ложный таймаут. А вот текст нельзя проверять по кускам: граница фрагмента может пройти через середину символа, и каждая половина по отдельности не является UTF-8."""

[[exercises]]
name = "nws_q2"
kind = "question"
question.ru = """Клиент отправил по очереди три фрейма: Text с FIN=0 и данными «He», затем Ping с данными «p», затем Continuation с FIN=1 и данными «llo». Что получится у сервера по стандарту?"""
options.ru = [
  """Ошибка протокола: ping нельзя вставлять посреди сообщения""",
  """Сначала клиент получит pong с «p», а приложение после третьего фрейма получит одно сообщение «Hello»""",
  """Приложение получит «He», потом pong уйдёт клиенту, потом приложение получит «llo»""",
  """Сначала сервер дождётся конца сообщения, и только потом ответит pong""",
]
answer = [1]
explain.ru = """Управляющие фреймы можно вставлять между фрагментами, и отвечать на ping нужно сразу: иначе при долгой передаче большого сообщения у клиента случится ложный таймаут по pong. Сборка при этом не прерывается, и приложение видит только готовое сообщение «Hello» после фрейма с FIN=1."""
hint.ru = """Какой из фреймов вообще не участвует в сборке сообщения?"""

[[exercises]]
name = "nws17"
style = "bughunt"
hint.ru = [
  """Тест подсказывает условие: 4 байта эмодзи, разрезанные по одному, всё равно составляют правильный текст. Что проверяет код сейчас, глядя на каждый фрагмент в одиночку?""",
  """Для проверки по частям пригодится `std::str::from_utf8`: при ошибке `valid_up_to` говорит, сколько байт хорошие, а `error_len` отличает «ошибка здесь» (`Some`) от «строка просто оборвалась на полуслове» (`None`). Недописанный хвост нужно сохранить до следующего фрагмента.""",
  """Храни хвост (максимум три байта) отдельно от накопленного текста. К новому фрагменту дописывай его в начало. Последний фрагмент не может оставлять хвост: это тоже InvalidUtf8.""",
]
why.ru = """Две противоположные ошибки в одном месте. Проверка по фрагментам в одиночку отвергает хороший текст, а проверка в самом конце принимает мусор слишком поздно: сервер копит в памяти до лимита то, что давно доказуемо плохо. Верное решение это потоковый валидатор: он принимает всё, что может оказаться началом символа, и отвергает сразу то, что уже ничем быть не может. `error_len() == None` в стандартной библиотеке существует именно для такого случая."""

[[exercises]]
name = "nws18"
style = "todo"
hint.ru = [
  """Лимит относится к сумме всех фрагментов сообщения. Проверяй перед тем, как добавить новый кусок: так лишнее не накопится. Считай и накопленный текст, и недописанный хвост символа.""",
  """Управляющие фреймы в сумму не входят: они не часть сообщения. Для ошибки используй `ProtoError::TooBig`.""",
  """Коды закрытия: 1002 нарушение протокола (почти все ошибки), 1007 данные не того типа (плохой UTF-8), 1009 слишком большое сообщение.""",
]
why.ru = """Лимит срабатывает по сумме, потому что иначе его обходят: тысяча фрагментов по килобайту, ни один из которых не превышает лимита фрейма. Проверка «заранее», до добавления, нужна, чтобы не выделять память под то, что мы уже решили отвергнуть. Коды закрытия это единственный способ рассказать клиенту, почему его выгнали: 1002, 1007 и 1009 различимы на стороне клиента и в логах, и это экономит часы отладки."""

[[exercises]]
name = "nws19"
style = "todo"
hint.ru = [
  """Тело Close: два байта кода big-endian и необязательная причина в UTF-8. Пусто допустимо, один байт нет. Разрешённые коды: 1000..=1003, 1007..=1014 и 3000..=4999 (1004, 1005, 1006 и 1015 это внутренние пометки, по сети их не шлют).""",
  """Автомат из трёх состояний: открыто, мы отправили Close (ждём ответ), закрыто. Если Close пришёл, когда мы ещё открыты, отвечаем тем же кодом и закрываемся. Если мы уже ждём ответа, этот Close и есть ответ. Всё, что ниже закрытия, молча игнорируется.""",
  """Ожидание ответа: общий дедлайн `Instant::now() + limit`, а в цикле `timeout_at(дедлайн, rx.recv())`. Так каждый пришедший по дороге фрейм не продлевает срок. Причину при отправке режь по границе символа (`is_char_boundary`), чтобы тело влезло в 125 байт.""",
]
why.ru = """Закрытие это не «сокет закрылся», а договорённость: код и причина показывают приложению, нормальное ли это завершение. Ответный Close нужен, чтобы вторая сторона отличила «собеседник ушёл» от «сеть упала». Срок ожидания ответа общий, иначе болтливый клиент (шлёт данные и не отвечает) держит соединение вечно. И обрезать причину по байтам нельзя: половина символа в управляющем фрейме превратит нормальный Close в нарушение протокола."""

[[exercises]]
name = "nws_q3"
kind = "question"
question.ru = """Сервер получил от клиента Close с кодом 1000 и отправил такой же Close в ответ. Что он делает дальше с TCP-соединением?"""
options.ru = [
  """Ждёт, пока клиент сам закроет TCP-соединение, и только потом закрывает своё""",
  """Ждёт ещё один Close от клиента как подтверждение подтверждения""",
  """Закрывает TCP-соединение сам, сразу после отправки ответного Close (предварительно закрыв запись и вычитав остаток входа), а клиент ждёт этого закрытия""",
  """Шлёт ping, чтобы убедиться, что клиент прочитал Close""",
]
answer = [2]
explain.ru = """По RFC 6455 после обмена Close первым TCP закрывает сервер, а клиент ждёт. Практическая деталь: перед закрытием сокета сервер закрывает запись и ненадолго вычитывает остаток входа. Если сразу бросить сокет с непрочитанными данными, ядро ответит RST, и клиент может потерять ответный Close."""
hint.ru = """Кто из двоих должен первым закрыть TCP по стандарту?"""

[[exercises]]
name = "nws20"
style = "todo"
hint.ru = [
  """Ключ это 16 случайных байт. У тебя есть генератор, который отдаёт по 4 байта: четыре вызова дают ровно 16. Кодируй результат в base64.""",
  """Запрос собирается по шаблону: строка `GET путь HTTP/1.1`, заголовки Host, Upgrade, Connection, Sec-WebSocket-Key, Sec-WebSocket-Version и, если нужен, Origin, потом пустая строка. Каждая строка заканчивается `\\r\\n`. Пустой путь заменяй на `/`.""",
  """Ответ разбирай строго: первая строка (версия и ровно `101`), потом заголовки в нижнем регистре. Accept должен быть единственным и равным `accept_key(ключ)`. Отдельно отвергай расширения и подпротоколы, о которых клиент не просил.""",
]
why.ru = """Клиент проверяет ответ тем же ключом, что отправил, и это защита от самой странной ошибки: ответа, который пришёл не нам (из кеша прокси или с другого соединения). Расширения и подпротоколы клиент вообще не заявлял, значит сервер не имеет права их выбирать: расширение permessage-deflate меняет значение RSV-бит, и клиент без поддержки будет читать мусор. Строгость здесь экономит дни отладки."""

[[exercises]]
name = "nws_engine"
kind = "project"
style = "scratch"
locked = ["tests/acceptance.rs"]
quiz = true
hint.ru = [
  """Порядок работы по слоям: `base64.rs`, `frame.rs` (декодер, кодировщик, `MaskGen`), `assembler.rs`, `close.rs`, потом `handshake.rs`, `client.rs` и в конце `stream.rs`. Каждый слой почти целиком лежит в решениях задач главы, нужно только перенести его на типы крейта. Первые тесты (`base64_vectors_and_strictness`, `codec_roundtrip_with_random_splits`, `accept_key_from_rfc`) идут без сети.""",
  """`WsStream::recv` это цикл: достать фрейм из буфера декодером, отдать сборщику, обработать результат. Нет фрейма, значит читаем из сокета в тот же буфер (нулевое чтение при незакрытом соединении это ошибка, при закрытом это конец). Ping получает pong прямо здесь, Close завершает чтение, любая ошибка протокола сначала отправляет собеседнику Close с кодом из `close_code`. Буфер при создании стартует с `rest`.""",
  """Закрытие сокета после ошибки или Close: сначала `shutdown` записи, потом чтение остатка с ограничением по времени и размеру, и только потом сокет отпускается (иначе RST съест Close). `close()` отправляет Close и ждёт ответный в общем сроке `close_timeout` через `timeout_at`, а всё лишнее по дороге выбрасывает. Клиентские фреймы маскирует `write_frame` свежим ключом из `MaskGen`, серверные нет.""",
]
why.ru = """Весь крейт держится на трёх решениях: байты, прочитанные сверх рукопожатия, переходят к WebSocket вместе с сокетом, декодер никогда не двигает буфер, пока фрейма нет целиком, и закрытие всегда проходит по правилам (код, ответ, общий срок, мягкое закрытие сокета). Остальное это проверки и вежливость к чужим ошибкам: каждая строгость в этой главе вернётся как баг в чужом клиенте, если её не сделать. Свой клиент в крейте нужен ещё и затем, что в тестах курса сторонних клиентов нет."""

