[[exercises]]
name = "nmux1"
style = "todo"
hint.ru = [
  """Первые три байта это длина в 24 бита, big-endian: собери `u32` из трёх байтов сдвигами. Номер потока занимает четыре байта big-endian, и его старший бит надо обнулить маской `0x7fff_ffff`.""",
  """`split_frames` в цикле зовёт `parse_header` на оставшемся хвосте буфера. Если заголовка ещё нет, цикл заканчивается без ошибки. Заявленную длину сверяй с `max_frame_size` сразу после заголовка, ещё до проверки, что тело пришло.""",
  """Тело кадра это срез буфера сразу за девятью байтами заголовка. Если тела не хватает, позицию не двигай: этот кадр ждёт следующей порции. В ответ верни и разобранные кадры, и число съеденных байтов.""",
]
why.ru = """Читатель кадров живёт между TCP и остальным протоколом, а TCP режет поток как хочет: кадр бывает разорван в любом месте, в том числе внутри заголовка. Поэтому «нужно ещё N байтов» это нормальный ответ, а не ошибка. Заявленную длину проверяют по одному заголовку: ждать пять мегабайтов тела ради того, чтобы потом сказать «слишком много», значит дать любому клиенту рычаг на память сервера. Зарезервированный бит маскируется на чтении и обнуляется на записи, чтобы не передать чужое значение дальше."""

[[exercises]]
name = "nmux2"
style = "scratch"
hint.ru = [
  """Начни с проверок, общих для всех типов: кому нужен номер потока, а кому обязательно ноль (соединению). Потом разложи тело по типам в `match h.kind`.""",
  """Выравнивание снимается так: при флаге первый байт это длина выравнивания, она должна быть меньше длины всего тела, а последние столько байтов отбрасываются. У HEADERS после этого может идти ещё пять байтов приоритета, если стоит свой флаг.""",
  """Длины тел проверяются точно: RST_STREAM и WINDOW_UPDATE по 4 байта, PING 8, PRIORITY 5, GOAWAY не меньше 8, SETTINGS кратно 6. У номеров потока внутри тела (GOAWAY, WINDOW_UPDATE) старший бит зарезервирован, его надо маскировать.""",
]
why.ru = """Каждая проверка здесь это правило, нарушение которого по стандарту обязывает закрыть соединение, и они нужны не из занудства: кадр от злого или глючного собеседника не должен превратиться в тихо неверное состояние. Исключение составляют неизвестные типы кадров: их пропускают, и благодаря этому протокол можно расширять. Флаги, которых у типа нет, тоже читатель не трогает. Выравнивание придумано, чтобы скрывать длину настоящих данных, поэтому оно стоит перед всем остальным в теле и снимается первым."""

[[exercises]]
name = "nmux3"
style = "todo"
hint.ru = [
  """Прелюдия приходит порциями, поэтому сравнивай начало: сколько байтов есть (но не больше длины прелюдии), столько и должно совпасть. Не совпало, значит это уже ошибка, остальных байтов ждать не нужно.""",
  """Параметры применяй по порядку к копии, а не к оригиналу, и подставь копию, только когда все пары прошли проверки. Тогда плохая пара не оставит наполовину применённых настроек.""",
  """Допустимые значения: ENABLE_PUSH только 0 или 1, начальное окно не больше 2^31 - 1 (код ошибки другой, не PROTOCOL_ERROR), размер кадра от 16 384 до 16 777 215. Неизвестные идентификаторы пропускай.""",
]
why.ru = """Прелюдия отличается от всего остального тем, что её проверяют и по длине, и по содержимому, пока она ещё не пришла целиком. Сервер, который ждёт все 24 байта чужого HTTP/1.1 запроса, зря держит соединение. Настройки применяют атомарно: кадр SETTINGS либо принимается целиком, либо отвергается целиком, потому что половина новых настроек (скажем, большой размер кадра при старом окне) это состояние, в которое никто не собирался приходить."""

[[exercises]]
name = "nmux4"
style = "scratch"
hint.ru = [
  """Для HEADERS три случая: поток новый (проверь чётность, возрастание и лимит), поток открыт (это трейлеры, они обязаны нести конец потока), поток закрыт (ошибка потока). Состояние каждого номера хранится в `states`.""",
  """Различай ошибки одного потока и ошибки всего соединения. Данные для потока, которого не открывали, ломают соединение, а данные после конца запроса ломают только свой поток: остальные вызовы должны жить.""",
  """Номер потока, отказанного по лимиту, всё равно считается использованным (запомни `last_id`), иначе следующий вызов с тем же номером выглядел бы новым. В `route` ошибки потока записывай в журнал и иди дальше, а ошибку соединения возвращай.""",
]
why.ru = """Разделение ошибок на «поток» и «соединение» это основа устойчивости HTTP/2: один кривой вызов не должен ронять тысячу соседних. С другой стороны, нарушения, после которых нельзя быть уверенным в общем состоянии (чужая чётность, номер из прошлого, данные в неоткрытом потоке), обязаны закрывать всё. Отказанный по лимиту поток продолжает занимать свой номер: иначе клиент мог бы использовать его второй раз, а сервер не отличил бы повтор от нового вызова."""

[[exercises]]
name = "nmux5"
style = "scratch"
hint.ru = [
  """Не отправляй больше, чем позволяет меньший из двух кредитов (потока и соединения), и не больше `max_frame` за кадр. Окно хранится знаковым числом, потому что оно может стать отрицательным.""",
  """Чтобы большой поток не съел весь кредит соединения, ходи по потокам по кругу: по одному кадру на поток за проход, пока хоть кто-то продвигается. Поток с пустым кредитом пропускай, остальные идут дальше.""",
  """`set_initial_window` меняет окна всех открытых потоков на разность новой и старой величины, а не выставляет им новое значение. Перед изменением проверь, что ничьё окно не выйдет за 2^31 - 1, и ничего не меняй при ошибке.""",
]
why.ru = """Управление потоком защищает приёмник от переполнения, но отправитель отвечает за то, чтобы кредит не стал оружием против соседей: жадный проход по потокам в порядке номеров позволяет одному большому потоку оставить остальные без единого байта. Окно может быть отрицательным, и это штатно: SETTINGS меняет начальное значение задним числом. Ошибка, которой не видно на коротких тестах, это вычитание без знакового типа: на беззнаковом числе такое окно превратится в огромное положительное."""

[[exercises]]
name = "nmux6"
style = "todo"
hint.ru = [
  """Если значение меньше максимума префикса (`2^N - 1`), оно целиком в первом байте. Иначе в префикс пишутся единицы, а остаток (`value - max`) идёт следующими байтами по семь бит, младшие первыми, с флагом продолжения.""",
  """Читая, сначала возьми префикс первого байта (`& max`). Если он меньше максимума, готово. Иначе складывай байты `(b & 0x7f) << shift` с шагом 7 до первого байта без флага.""",
  """Сдвиг на 64 бита и больше в Rust паникует в отладочной сборке. Останавливай чтение раньше (например, когда сдвиг перешагнул 56) и пользуйся `checked_add`.""",
]
why.ru = """Запись с префиксом это экономия на самом частом: индекс из таблицы почти всегда помещается в семь бит вместе с признаком вида, и целый байт уходит на ссылку. Граничное значение (равное максимуму префикса) пишется с продолжением, иначе читатель не отличил бы «ровно максимум» от «больше». Как и в varint, декодер получает данные извне, и самое важное в нём это отказ от паники на бесконечной цепочке байтов."""

[[exercises]]
name = "nmux7"
style = "scratch"
hint.ru = [
  """Первый байт говорит, какое это поле: старший бит `1` значит ссылку на таблицу (индекс в семибитном префиксе), `0000` и `0001` литерал без индексации, остальные виды пока `Unsupported`. У литерала сначала идёт индекс имени (4-битный префикс), потом значение.""",
  """Строка это флаг Хаффмана в старшем бите, длина в семибитном префиксе и байты. Проверь, что байтов достаточно, прежде чем срезать, и только потом превращай в `String`. Индекс 0 у имени значит «имя записано литералом».""",
  """Кодировщик ищет сначала полное совпадение пары в таблице (одним байтом), потом совпадение имени (наименьший индекс) и только потом пишет всё литералом.""",
]
why.ru = """HPACK придуман так, чтобы повторяющиеся заголовки стоили один байт, и статическая таблица делает это ещё до первого запроса: `:method POST`, `:scheme http`, `:status 200` и десятки других пар не нужно ни писать, ни запоминать. Не умея чего-то, декодер должен сказать об этом прямо: тихий пропуск Хаффмана или динамической ссылки превращает дальнейшие заголовки в мусор, который выглядит как настоящий."""

[[exercises]]
name = "nmux8"
style = "scratch"
hint.ru = [
  """Каждая запись весит длину имени плюс длину значения плюс 32. Вставка выбрасывает самые старые записи, пока новая не поместится. Если новая больше всей таблицы, таблица очищается, а запись не добавляется.""",
  """Индексы после 61 ведут в динамическую таблицу, считая от самой свежей: 62 голова очереди. Имя для записи с индексацией бери до вставки: вытеснение может выбросить запись, на которую ссылаешься.""",
  """Обновление размера (`001xxxxx`) допустимо только перед первым полем блока и не выше согласованного предела. Уменьшение размера тоже вытесняет записи с конца.""",
]
why.ru = """Динамическая таблица это общее состояние двух участников, которое нигде не передаётся целиком: каждый вычисляет его сам из потока блоков. Поэтому любая неточность в учёте размера или порядка вытеснения тихо ломает всё последующее соединение: индекс 62 начинает указывать не на ту запись. Вот почему по стандарту блоки обязательно декодируют по порядку, даже если сам вызов уже отвергнут, а ошибка таблицы считается ошибкой соединения."""

[[exercises]]
name = "nmux9"
style = "todo"
hint.ru = [
  """Префикс это один байт флага и четыре байта длины big-endian. Накапливай входящие байты в буфере и вынимай сообщения, пока в буфере хватает на префикс и тело.""",
  """Проверки делай по префиксу, не дожидаясь тела: флаг сжатия, лимит длины. Тогда злой клиент не заставит копить гигабайт ради сообщения, которое всё равно будет отвергнуто.""",
  """В конце убери из буфера всё, что отдано, одним `drain`, а недочитанное оставь на следующий вызов. Длину при сравнении приводи к `usize` аккуратно: `u32` в `usize` на 64-битной платформе безопасен.""",
]
why.ru = """Границы сообщений gRPC и границы кадров DATA никак не связаны, поэтому декодер копит состояние: это тот же приём, что и в кадровании поверх TCP, только на уровень выше. Лимит проверяется по префиксу ещё до тела, потому что память под тело выделяют именно в ожидании тела. Сжатые сообщения без согласованного кодека это ошибка протокола, а не повод угадывать формат."""

[[exercises]]
name = "nmux10"
style = "scratch"
hint.ru = [
  """Последний символ это единица, остальное цифры (от одной до восьми). Проверяй по порядку: пусто, нет цифр, слишком много цифр, нецифра внутри. Только ASCII-цифры: `char::is_numeric` пропустит чужие алфавиты.""",
  """Для записи иди от мелких единиц к крупным и бери первую, в которой число (округлённое вверх через `div_ceil`) не больше 99 999 999. Считай в `u128` наносекундах, чтобы не переполниться.""",
  """Для сроков больше, чем влезает в часы, возвращай максимум, а не ошибку.""",
]
why.ru = """Срок вызова это то, что отличает сервис, который держит нагрузку, от сервиса, который копит зомби-работу: чужой клиент давно ушёл, а мы всё ещё считаем. Формат строгий, потому что заголовок приходит извне: девять цифр, минус, пробел или чужая единица должны быть отказом. Округление при записи всегда вверх: срок, укороченный из-за округления, превратится в ложные DEADLINE_EXCEEDED. Регистр единиц важен: `M` это минуты, а `m` миллисекунды, и спутать их значит разница в 60 тысяч раз."""

[[exercises]]
name = "nmux11"
style = "scratch"
hint.ru = [
  """Ответ собирается из трёх частей: заголовки (200 и content-type), по одному DATA на сообщение (с префиксом) и трейлеры с `grpc-status`. Конец потока ставится только на последнем блоке заголовков.""",
  """Когда сообщений нет, заголовки и трейлеры сливаются в один блок с концом потока. Пустой `grpc-message` не пишут вовсе. В тексте остаются байты от 0x20 до 0x7e, кроме знака процента, остальные кодируются как `%XX`.""",
  """Декодер процентной записи снисходителен: `%` без двух шестнадцатеричных цифр после него остаётся как есть. Отсутствие `grpc-status` в трейлерах это UNKNOWN (2), а не успех.""",
]
why.ru = """Итог вызова лежит в самом конце, поэтому HTTP-статус 200 ни о чём не говорит: проверять надо grpc-status в трейлерах. Форма «trailers only» нужна для ошибок, случившихся до первого сообщения, чтобы не слать два блока заголовков подряд. Процентная запись нужна, потому что в HTTP/2 значения заголовков это не любые байты; а снисходительное чтение защищает от сервера, который записал её криво: показать человеку кривой текст лучше, чем потерять статус."""

[[exercises]]
name = "nmux_q1"
kind = "question"
question.ru = """HTTP/2 мультиплексирует много потоков в одном TCP-соединении, и говорят, что он избавил HTTP от блокировки очереди (head-of-line blocking). Но при потере одного пакета в сети все вызовы на этом соединении всё равно подвисают на время повторной передачи. Почему?"""
options.ru = [
  """Потому что HTTP/2 всё же отправляет ответы строго по порядку запросов""",
  """Потому что TCP отдаёт байты приложению только по порядку: пока не придёт потерянный сегмент, всё, что за ним, лежит в буфере ядра, даже если принадлежит другим потокам HTTP/2. Блокировка осталась, но уехала на уровень TCP""",
  """Потому что окно управления потоком общее на все потоки и опустошается потерянным пакетом""",
  """Потому что сжатие заголовков HPACK требует повторной отправки всех блоков при потере""",
]
answer = [1]
explain.ru = """Мультиплексирование решает проблему на уровне HTTP: ответ потока 3 можно отправить раньше ответа потока 1. Но все байты едут по одному упорядоченному потоку TCP, и потеря одного сегмента задерживает чтение всего последующего. Именно это и стало одной из причин появления HTTP/3 и QUIC, где у каждого потока своя упорядоченность."""
hint.ru = """Кто решает, в каком порядке приложение видит байты: HTTP/2 или TCP?"""

[[exercises]]
name = "nmux_q2"
kind = "question"
question.ru = """Начальное окно потока и окно соединения оба по 65 535 байтов. Клиент запустил server-streaming вызов (поток 1) и перестал вызывать recv: сообщения лежат в буфере приложения, кредит окон не возвращается. Параллельно идёт короткий unary-вызов (поток 3). Что с ним будет?"""
options.ru = [
  """Ничего: у потока 3 своё окно, поток 1 его не затрагивает""",
  """Поток 1 получит 65 535 байтов и исчерпает не только своё окно, но и общее окно соединения. Пока кредит соединения не вернётся, поток 3 не сможет получать данные, хотя его собственное окно полно. Поэтому окно соединения делают намного больше окон потоков и возвращают кредит рано""",
  """Сервер оборвёт поток 1 с кодом FLOW_CONTROL_ERROR, и поток 3 не пострадает""",
  """Клиент автоматически перестанет принимать данные потока 1 на уровне TCP, и ничего не заблокируется""",
]
answer = [1]
explain.ru = """Кредит соединения общий и тратится всеми потоками. Если приёмник возвращает его только когда приложение прочитало данные, то один не читающий поток может держать соединение. Практический вывод: окно соединения ставят большим (сотни килобайтов и больше), и кредит соединения возвращают сразу, как только данные приняты в буфер, оставляя поток-за-потоком учёт для защиты памяти."""
hint.ru = """Из какого окна тратится кредит при получении DATA: только из окна потока или ещё и из какого-то общего?"""

[[exercises]]
name = "nmux_q3"
kind = "question"
question.ru = """Сервер выкатывает новую версию и хочет остановиться, не потеряв ни одного вызова. Клиенты держат по долгому соединению и постоянно открывают вызовы. Что нужно сделать на уровне HTTP/2?"""
options.ru = [
  """Закрыть TCP-соединение: клиенты поймут и переподключатся""",
  """Отправить RST_STREAM на каждый открытый поток""",
  """Отправить GOAWAY с last_stream_id, равным номеру последнего принятого потока, продолжить обработку открытых вызовов и закрыть соединение, когда они завершатся. Клиенты откроют новые вызовы на другом соединении, а непринятые (с номерами больше last_stream_id) повторят""",
  """Отправить SETTINGS с MAX_CONCURRENT_STREAMS = 0 и ждать""",
]
answer = [2]
explain.ru = """GOAWAY это ровно мягкая остановка: он сообщает, какие потоки сервер ещё обработает (номера до last_stream_id), а остальные клиент безопасно повторит на другом соединении, потому что сервер их не начинал. Обрыв TCP или массовые RST_STREAM теряют вызовы, а нулевой лимит потоков не объясняет клиентам, что делать с уже отправленными."""
hint.ru = """Какой кадр говорит «новые потоки больше не открывай, а старые я доделаю»?"""

[[exercises]]
name = "nmux_q4"
kind = "question"
question.ru = """gRPC-стрим сервера отправил клиенту три сообщения и затем упал с ошибкой INTERNAL. Какой HTTP-статус увидит прокси в потоке и где клиент узнает об ошибке?"""
options.ru = [
  """HTTP 500 в заголовках ответа, потому что сервер упал""",
  """HTTP 200 в первых заголовках (они ушли ещё до сообщений), а ошибка придёт в трейлерах: grpc-status 13 в последнем блоке заголовков с END_STREAM. Статус HTTP говорит только о том, что транспорт сработал""",
  """HTTP 200, а ошибка будет видна по RST_STREAM с кодом INTERNAL_ERROR""",
  """Клиент узнает об ошибке по закрытию TCP-соединения""",
]
answer = [1]
explain.ru = """Заголовки ответа уходят до первого сообщения, и изменить статус потом уже нельзя. Поэтому итог вызова вынесен в трейлеры: gRPC-статус приходит в конце и может отличаться от успешного даже после многих сообщений. Для балансировщиков и мониторинга отсюда вывод: смотреть только на HTTP-статус бесполезно, надо читать grpc-status."""
hint.ru = """Когда уходят заголовки ответа: до первого сообщения или после последнего?"""

[[exercises]]
name = "nmux_q5"
kind = "question"
question.ru = """Сервер получил два запроса подряд по одному соединению. Первый запрос отвергнут по лимиту MAX_CONCURRENT_STREAMS ещё на чтении заголовков, и сервер решил не разбирать его блок заголовков, а просто ответить REFUSED_STREAM. Что случится со вторым запросом?"""
options.ru = [
  """Ничего: второй запрос независим и разбирается как обычно""",
  """Динамическая таблица HPACK общая на всё соединение, а клиент мог положить в неё записи из первого блока. Не разобрав его, сервер не добавит эти записи в свою таблицу, и ссылки второго запроса на них укажут не туда: это COMPRESSION_ERROR или тихая подмена заголовков. Блок надо декодировать в любом случае, а потом отказывать""",
  """Второй запрос тоже будет отвергнут автоматически""",
  """Клиент заново отправит первый блок заголовков сам""",
]
answer = [1]
explain.ru = """HPACK привязан к соединению и направлению, а не к потоку. Таблица меняется каждым блоком заголовков, и обе стороны обязаны применять все блоки в одном порядке. Поэтому даже у отвергнутого вызова блок надо декодировать, а затем уже решать его судьбу."""
hint.ru = """Чья это таблица: потока или всего соединения?"""

[[exercises]]
name = "nmux_q6"
kind = "question"
question.ru = """Клиент вызвал сервис A со сроком grpc-timeout 2S. Через 1,5 секунды A обращается к сервису B. Что A должен поставить в grpc-timeout для B?"""
options.ru = [
  """2S: срок один и тот же для всей цепочки""",
  """Оставшееся время: около 500m (меньше с учётом накладных расходов). Иначе B будет работать после того, как клиент уже отказался ждать, а цепочка из нескольких сервисов получит в сумме больше времени, чем разрешил клиент""",
  """Ничего не ставить: у B будет собственный срок по умолчанию""",
  """Любое значение: срок проверяет только клиент""",
]
answer = [1]
explain.ru = """Срок вызова описывает, сколько ещё готов ждать исходный клиент. Правильный сервер вычисляет крайний момент из заголовка, и при исходящем вызове передаёт то, что осталось. Тогда вся цепочка прекращает работу одновременно с отказом клиента, а не продолжает тратить ресурсы впустую."""
hint.ru = """Сколько времени осталось у клиента через полторы секунды из двух?"""

[[exercises]]
name = "nmux_dump"
kind = "project"
style = "scratch"
locked = ["tests/dump.rs"]
quiz = true
hint.ru = [
  """Порядок работы: сначала читатель кадров (заголовок, тело, выравнивание и приоритет), потом HPACK с динамической таблицей, потом gRPC-сообщения и срок, и в конце сборка отчёта. Все части уже есть в твоих решениях задач главы, их можно переносить почти целиком на новые типы.""",
  """Клиентский и серверный потоки байтов читаются независимо, одним и тем же кодом, но с двумя отдельными таблицами HPACK. Блок заголовков надо декодировать всегда, даже если по номеру потока вызова ещё нет: иначе таблица разъедется.""",
  """Для каждого вызова нужны отдельные накопители сообщений в каждом направлении: границы DATA не совпадают с границами сообщений. Итог (`grpc-status`) берётся из любого блока заголовков сервера, где он есть, поэтому «trailers only» отдельной ветки не требует.""",
]
why.ru = """Разбор дампа проверяет всё, что дали отдельные задачи, в одном месте: кадры разорваны как угодно, заголовки сжаты с общей таблицей на соединение, сообщения нарезаны иначе, чем кадры. Ошибки в чужих байтах возвращаются как значения, а не паники, иначе инструмент, которым ищут причину сбоя, сам становится причиной нового. Такая программа потом пригодится в жизни, когда в логах пусто, а дамп трафика есть."""
