hint.ru = [
"""Начни с certgen и `cargo xtask certs`: это ntls_mtls почти без изменений, только имена сервисов наши и в SAN ещё
`localhost` и `127.0.0.1`, чтобы клиенты на этой машине проверяли имя сервера. Ключ пиши с правами 0600 через
`OpenOptionsExt::mode` под `#[cfg(unix)]`.""",
"""Движки не трогаем, поэтому TLS снимает терминатор: `TlsAcceptor::accept` на публичном порту, `TcpStream::connect` к
движку на `127.0.0.1:0` и `copy_bidirectional` между ними. На остановке не рви соединения сразу: движок сам закроет
WebSocket кодом 1001, а терминатору достаточно дождаться, пока байты кончатся.""",
"""В tonic взаимный TLS это `client_ca_root` на сервере и `identity` у клиента, а адрес канала с TLS начинается с
`https://`. `domain_name` у клиента это имя сервиса из SAN, по нему проверяется сервер, а не по адресу.""",
"""Личность звонящего лежит в `request.peer_certs()`, это есть и в перехватчике. Разбери первый сертификат
`x509_parser::parse_x509_certificate` и возьми DNS-имена из `subject_alternative_name`. В тестах прошлых вех TLS нет,
поэтому `Gate::open()` пропускает всех, а `Gate::only` ставится только вместе с `tls_config`.""",
]
story.ru = """Соцсеть заговорила шёпотом: снаружи https и wss со своим CA, внутри взаимный TLS, и post-service теперь
слушает только шлюз, сколько бы чужих сервисов ни стучалось к нему с x-user-id."""
