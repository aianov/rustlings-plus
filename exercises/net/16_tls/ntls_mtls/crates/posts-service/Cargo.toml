[package]
name = "posts-service"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
tonic = { version = "=0.14.6", features = ["tls-ring"] }
prost = "=0.14.4"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
x509-parser = "0.16"
proto = { path = "../proto" }
certgen = { path = "../certgen" }
