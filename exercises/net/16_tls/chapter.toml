[[exercises]]
name = "ntls1"
kind = "project"
style = "scratch"
locked = ["tests/acceptance.rs"]
hint.ru = [
  """В `rcgen` сертификат собирается из `CertificateParams`. Для CA нужны три вещи: самоподписанность (`params.self_signed(&key)`), признак `is_ca` и разрешение на подпись сертификатов (`KeyUsagePurpose::KeyCertSign`). Ключ создаёт `KeyPair::generate()`.""",
  """Сертификат сервера: `CertificateParams::new(список_имён)` сам распознаёт IP-адреса и кладёт их в SAN как адреса, а остальное как DNS-имена. Подписать сертификат CA-шным ключом: `params.signed_by(&ключ_сервера, &cert_ca, &ключ_ca)`.""",
  """Права на файл надо задать при создании, а не потом: между `write` и `set_permissions` файл успевает полежать читаемым всеми. На Unix у `OpenOptions` есть расширение `mode(0o600)` из `std::os::unix::fs::OpenOptionsExt`. Ключ CA в каталог не пиши вообще.""",
]
why.ru = """CA отличается от обычного сертификата двумя пометками: basicConstraints CA:TRUE и правом подписи сертификатов. Если пометить CA сертификат сервера, его ключ сможет выпускать любые сертификаты, поэтому серверному сертификату флаг CA не ставят. Имена кладутся в SAN, а не в CN, потому что проверка имени идёт по SAN, и IP-адрес должен быть в SAN именно как IP. Ключ создаётся сразу с правами 0600: окно между созданием и chmod уже окно для чужого процесса. Закрытый ключ CA на диск не пишется вообще, пока без этого можно обойтись."""

[[exercises]]
name = "ntls2"
kind = "project"
style = "todo"
locked = ["tests/acceptance.rs"]
hint.ru = [
  """У `CertificateDer` есть `pem_slice_iter(байты)`: итератор по всем сертификатам, каждый элемент это `Result`. У `PrivateKeyDer` есть `from_pem_slice(байты)`. Тип ошибки: `rustls::pki_types::pem::Error`, и один из его вариантов говорит «ничего не найдено».""",
  """«Ничего не найдено» и «найдено, но повреждено» разные случаи. Итератор по сертификатам просто не вернёт элементов на пустом файле, а на обрезанном вернёт `Err`. Собери результаты в `Vec` через `collect::<Result<Vec<_>, _>>()`, потом проверь пустоту.""",
  """Согласованность ключа и сертификата проверяет сам `ServerConfig::builder().with_no_client_auth().with_single_cert(..)`, ошибку этого вызова превращай в `KeyMismatch`. Не забудь, что порядок вызовов такой: сначала прочитать сертификаты, потом ключ, потом собирать.""",
]
why.ru = """Ошибка загрузки должна называть файл и причину, потому что её читают ночью: пустой файл значит «не смонтировали секрет», нет ключа значит «перепутали файлы», обрыв значит «скопировали не до конца», несовпадение значит «ключ от прошлой выдачи». Отдельные варианты ошибки дают возможность писать в журнал именно это. Проверка пары «сертификат и ключ» делается при сборке конфигурации, на старте, а не при первом клиенте: сервис с битыми файлами должен не запуститься, а не запуститься и отвечать всем ошибкой рукопожатия."""

[[exercises]]
name = "ntls3"
kind = "project"
style = "todo"
locked = ["tests/acceptance.rs"]
hint.ru = [
  """Рукопожатие делает `acceptor.accept(tcp).await`, и оно может занять сколько угодно, если клиент молчит. Подумай, что случится с остальными клиентами, если `accept` TLS вызвать прямо в цикле приёма соединений.""",
  """Цикл приёма должен только принимать TCP-соединения и сразу отдавать каждое в `tokio::spawn`. Рукопожатие, эхо и закрытие происходят внутри задачи. Ограничение по времени: `tokio::time::timeout(срок, acceptor.accept(tcp))`, у результата два слоя `Result` (срок и само рукопожатие).""",
  """Эхо: читай буфер, пока не придёт 0 байт (клиент закрыл свою сторону), каждый кусок пиши обратно. В конце вызови `shutdown()`: это отправит close_notify, и клиент с `read_to_end` увидит чистый конец, а не обрыв.""",
]
why.ru = """Рукопожатие TLS это сетевой обмен в несколько шагов, и он должен выполняться в той же задаче, которая потом обслуживает соединение, иначе любой молчащий клиент парализует приём остальных: классическая уязвимость медленного рукопожатия. Срок рукопожатия ограничивает ущерб от тех, кто подключился и ничего не говорит. Закрытие через shutdown важно для собеседника: без close_notify клиент не может отличить конец данных от обрыва, который подстроил кто-то посередине."""

[[exercises]]
name = "ntls_q1"
kind = "question"
question.ru = """Админ видит в журнале сервиса: `handshake failed: invalid peer certificate: UnknownIssuer`, причём вчера всё работало, а сертификат сервера никто не менял. Что проверить в первую очередь?"""
options.ru = [
  """часы на сервере: сертификат мог «истечь»""",
  """что в списке доверия клиента лежит тот же CA, которым подписан сертификат сервера, и не переехал ли сервис на сертификат от другого CA""",
  """имя в SAN: оно не совпадает с адресом""",
  """версию TLS на сервере""",
]
answer = [1]
explain.ru = """UnknownIssuer значит, что цепочку сертификата сервера не удалось довести до корня из списка доверия клиента. Срок и имя дают другие ошибки (Expired, NotValidForName). Самая вероятная причина «вчера работало» это смена CA на одной из сторон (перевыпуск, новый корень на сервере, а клиент ещё со старым списком). Поэтому в журналах нужна точная причина, а не «invalid peer certificate»."""
hint.ru = """Какая из перечисленных причин даёт именно UnknownIssuer?"""

[[exercises]]
name = "ntls4"
kind = "project"
style = "scratch"
locked = ["tests/acceptance.rs"]
hint.ru = [
  """Три шага подготовки до сети: доверие (`RootCertStore`, каждый сертификат из PEM кладётся методом `add`), имя (`ServerName::try_from(String)`), конфигурация клиента. Любая из этих ошибок должна стать своим вариантом `ClientError`, а не паникой.""",
  """Сетевую часть собери в один `async`-блок: подключение TCP, рукопожатие `connector.connect(имя, tcp)`, запись, `shutdown()` на записи, `read_to_end`. Весь блок оберни в один `tokio::time::timeout`, а не по таймауту на каждый шаг.""",
  """Ошибки `io::Error` из блока превращай в `ClientError::Io(текст)`. Текст ошибки рукопожатия содержит причину (UnknownIssuer, не подходит имя), и тесты читают именно его. Пустой `RootCertStore` проверяй отдельно: он сам по себе не ошибка, но ни с кем не соединится.""",
]
why.ru = """Клиент TLS отвечает за две проверки, и обе обязательны: «этот сертификат подписан тем, кому я доверяю» и «он выдан тому имени, к которому я иду». Без второй любой владелец любого настоящего сертификата может выдать себя за твой сервер. Имя для проверки отделено от адреса подключения, потому что сервисы ходят по IP и портам, а сертификаты выписаны на имена. Срок один на весь обмен: на подключение, рукопожатие и ответ вместе, иначе сервер, который молчит на втором шаге, подвешивает клиента на сумму таймаутов."""

[[exercises]]
name = "ntls_q2"
kind = "question"
question.ru = """Клиент подключается к серверу по адресу `10.0.0.5:8443`, а сертификат выдан на `billing.internal.test`. Как настроить клиента, чтобы проверка проходила и оставалась честной?"""
options.ru = [
  """отключить проверку имени: всё равно адрес в своей сети""",
  """подключаться к адресу, но проверять сертификат на имя `billing.internal.test`""",
  """выписать сертификат на IP-адрес `10.0.0.5`, чтобы имя совпало""",
  """заменить адрес на имя в файле hosts и больше ничего не менять""",
]
answer = [1]
explain.ru = """Адрес подключения и имя для проверки независимы: клиент идёт по IP, а сертификат проверяет на то имя, для которого он выдан (в tonic это `domain_name`, в rustls `ServerName`). Отключать проверку имени нельзя: без неё любой владелец любого настоящего сертификата выдаёт себя за твой сервис. Сертификат на IP ломается при каждом переезде, а hosts подменяет только адрес и тоже не решает вопрос именно на уровне настройки клиента."""
hint.ru = """Что именно сертификат обещает: «я живу по этому адресу» или «меня зовут так»?"""

[[exercises]]
name = "ntls5"
kind = "project"
style = "scratch"
locked = ["tests/acceptance.rs"]
hint.ru = [
  """Сначала `contains` и `looks_like_tls`: они короткие. Для `sni` заведи маленького читателя по срезу с методами «взять n байт» и «прочитать число из 1, 2 или 3 байт»; каждое чтение возвращает `Option`, и тогда оборванный вход проваливается на первом же `?`, а паники нет.""",
  """Порядок разбора ClientHello: тип записи 22, версия (2), длина записи (2); тип рукопожатия 1, длина (3), версия (2), случайное (32); идентификатор сессии (длина 1 байт); наборы шифров (длина 2 байта); сжатие (длина 1 байт); расширения (общая длина 2 байта). Каждый кусок пропускай через «взять n».""",
  """Расширения идут парами «тип (2), длина (2), данные». Ищи тип 0. В данных: длина списка (2), тип имени (1, должен быть 0), длина имени (2), имя. Обрезанный вход должен давать `None`, а не имя из недочитанного куска: проверяй, что кусок взят целиком.""",
]
why.ru = """TLS шифрует содержимое, но не факт соединения и не имя, к которому идёт клиент: SNI едет в ClientHello открытым текстом (расширение ECH это закрывает, но оно пока редкость). Поэтому слушатель видит, что ты ходишь в банк, но не видит, что ты там делаешь. Разбор написан как цепочка проверяемых чтений: любой вход, даже обрезанный на полуслове, заканчивается None, а не паникой и не неверным именем. Это и есть правило для парсеров, которые читают чужие данные."""

[[exercises]]
name = "ntls_q6"
kind = "question"
question.ru = """Слушатель в сети кафе записывает весь трафик между твоим приложением и сервером по HTTPS (TLS 1.3). Что он сможет прочитать?"""
options.ru = [
  """всё: пароли, тело запросов и заголовки""",
  """имя сервера (SNI), размеры и время сообщений, но не содержимое""",
  """ничего: даже факт соединения скрыт""",
  """только пароли: остальное открыто""",
]
answer = [1]
explain.ru = """Содержимое шифруется, но имя сервера в ClientHello идёт открытым текстом (расширение ECH пока мало распространено), а размеры и моменты пакетов видны всегда. Слушатель узнает, что ты ходишь в банк и сколько данных передаёшь, но не что именно. Поэтому TLS защищает содержимое, а не факт и не метаданные общения."""
hint.ru = """Что клиент обязан сказать серверу до того, как появится общий ключ?"""

[[exercises]]
name = "ntls6"
kind = "project"
style = "todo"
locked = ["tests/acceptance.rs"]
hint.ru = [
  """Ошибка рукопожатия это `io::Error`. Доберись до вложенной: `err.get_ref()` вернёт `Option<&(dyn Error + Send + Sync)>`, у которого есть `downcast_ref::<rustls::Error>()`. Если вложенной ошибки нет или это не `InvalidCertificate`, причина `Other`.""",
  """Внутри `rustls::Error::InvalidCertificate(CertificateError)` нужны четыре варианта: `UnknownIssuer`, `NotValidForName`, `Expired`, `NotValidYet`. Но в новых версиях rustls три последних приходят с подробностями (`NotValidForNameContext { .. }`, `ExpiredContext { .. }`, `NotValidYetContext { .. }`). Обе формы должны давать одну причину.""",
  """В описаниях говори, что делать, а не что случилось: «выдан неизвестным центром: проверь список доверия» полезнее, чем «UnknownIssuer». Для `Other` приложи исходный текст: иначе причина потеряется.""",
]
why.ru = """Пять причин отказа лечатся пятью разными способами, и точная причина в журнале экономит дежурному час. Ошибка рукопожатия приходит как io::Error с вложенной rustls::Error, поэтому классификация делает downcast, а не разбирает текст ошибки: тексты меняются между версиями, а типы меняются осознанно. Перечисление CertificateError помечено как расширяемое, поэтому в match обязательна ветка «остальное», иначе обновление библиотеки сломает сборку, а при её отсутствии новые причины будут молча попадать не туда."""

[[exercises]]
name = "ntls7"
kind = "project"
style = "bughunt"
locked = ["tests/acceptance.rs"]
hint.ru = [
  """Запусти тесты: зелёными остаются те, где сервер настоящий, а красными те, где его подменили. Посмотри, какой путь построения `ClientConfig` выбрала заготовка, и найди в ней всё, что к нему относится.""",
  """Нормальная конфигурация клиента: `RootCertStore` со всеми сертификатами из PEM-блоков списка, потом `with_root_certificates(roots)` и `with_no_client_auth()`. Структура с реализацией `ServerCertVerifier` после исправления не нужна совсем, удали её вместе с импортами.""",
  """Пустой `RootCertStore` строится без ошибок, а потом отвергает всех: это сбой конфигурации, который лучше увидеть при старте. Проверь `roots.is_empty()` до сборки клиента. Ошибки чтения PEM и добавления сертификата превращай в `BadPem`.""",
]
why.ru = """Верификатор «принимаю всё» оставляет шифрование и убирает его смысл: канал надёжен, но собеседник может быть кем угодно. Такой код чаще всего появляется «временно» для стенда и переезжает в продакшен вместе с остальным. Правильное лечение стенда это добавить его CA в список доверия, а не выключить проверку. Список доверия принимает несколько CA, потому что корень приходится менять без остановки: сначала доверяют старому и новому вместе, потом убирают старый. Пустой список ошибка на старте, потому что клиент, никому не доверяющий, найдёт свои проблемы только под нагрузкой."""

[[exercises]]
name = "ntls8"
kind = "project"
style = "todo"
locked = ["tests/acceptance.rs"]
hint.ru = [
  """Скелет такой же, как у TCP: цикл приёма, на каждое соединение своя задача. Новое только одно действие между приёмом и обработчиком: `TlsAcceptor::accept(tcp).await`. Его провал закрывает только это соединение.""",
  """Обработчик принимает поток по значению, а закрывать TLS потом должен ты. Значит, обработчику нужно отдать не сам поток, а заём: `&mut tls` тоже умеет читать и писать. После возврата из обработчика вызови `shutdown()`.""",
  """Без `shutdown` тест «чистое закрытие» упадёт на стороне клиента с ошибкой `UnexpectedEof`: клиент не может отличить конец ответа от обрыва, потому что close_notify не пришёл.""",
]
why.ru = """Движок, обобщённый по потоку, получает TLS бесплатно: парсеры и маршрутизаторы читают и пишут в «что-то, что умеет AsyncRead и AsyncWrite», и им всё равно, шифрует ли это что-то. Единственное, что добавляется, это действия вокруг самого потока: рукопожатие до обработчика и close_notify после. Поэтому обработчик получает заём потока, а закрытие TLS остаётся у вызывающего. Без close_notify клиент не отличит конец ответа от обрыва, и стандартный HTTPS-клиент честно выдаст ошибку: так защищаются от усечения данных злоумышленником."""

[[exercises]]
name = "ntls_q5"
kind = "question"
question.ru = """HTTP-движок, написанный как `async fn handle<S: AsyncRead + AsyncWrite + Unpin>(stream: S)`, подключили к TLS. Все тесты прошли, но браузер иногда пишет «обрыв соединения при чтении ответа». Что вероятнее всего забыли?"""
options.ru = [
  """включить HTTP/2""",
  """вызвать `shutdown()` на TLS-потоке после ответа, чтобы отправить close_notify""",
  """увеличить буфер чтения""",
  """добавить заголовок `Content-Type`""",
]
answer = [1]
explain.ru = """Без close_notify получатель не может отличить «ответ закончен» от «соединение оборвал тот, кто стоит посередине». Строгие клиенты (и браузеры при чтении до конца потока) сообщают об обрыве. Закрывать TLS положено явно: обработчику отдают заём потока, а `shutdown` вызывают снаружи, после возврата."""
hint.ru = """Что отправляет сервер, когда честно заканчивает TLS-сеанс?"""

[[exercises]]
name = "ntls9"
kind = "project"
style = "todo"
locked = ["tests/acceptance.rs"]
hint.ru = [
  """Список протоколов лежит в публичном поле `alpn_protocols` у `ServerConfig` и `ClientConfig`. Его значение это `Vec<Vec<u8>>`: каждый протокол отдельная байтовая строка. Менять его надо до того, как конфигурация станет `Arc`.""",
  """Порядок в списке сервера задаёт его предпочтения: rustls выбирает первый протокол из списка сервера, который есть и у клиента. Порядок в списке клиента на выбор не влияет. Поэтому на сервере сначала `h2`.""",
  """Итог переговоров читают у установленного соединения: `tls.get_ref().1` это серверная часть состояния (`ClientConnection`), а у неё метод `alpn_protocol()`, возвращающий `Option<&[u8]>`.""",
]
why.ru = """ALPN переносит выбор протокола внутрь рукопожатия, и это экономит круг обмена и устраняет угадывание по первым байтам. Предпочтения задаёт сервер, потому что он знает, что умеет лучше, а клиент лишь перечисляет возможное. Отказ при отсутствии общих протоколов сделан намеренно: продолжить значило бы, что стороны говорят на разных языках и ошибка выплывет позже и в странном месте. Клиент без ALPN остаётся допустимым: так подключаются старые клиенты, и им достаётся протокол по умолчанию."""

[[exercises]]
name = "ntls10"
kind = "project"
style = "todo"
locked = ["tests/acceptance.rs"]
hint.ru = [
  """Серверу нужны два набора корней: его собственная цепочка сертификатов (как раньше) и хранилище CA, которым он доверяет при проверке клиентов. Второе превращается в `WebPkiClientVerifier::builder(Arc::new(хранилище)).build()?`.""",
  """Вместо `with_no_client_auth()` на сервере вызови `with_client_cert_verifier(verifier)`, дальше `with_single_cert(..)` как обычно. На клиенте при наличии пары вызови `with_client_auth_cert(цепочка, ключ)`, а без неё `with_no_client_auth()`: обе ветки заканчивают построитель.""",
  """Если тест на «клиент без сертификата» падает не на отказе, а на успехе, значит сервер не требует сертификат. Если «чужой CA» проходит, то проверяющий собран не из того хранилища.""",
]
why.ru = """mTLS убирает пароли и токены из общения сервисов: личность клиента доказывается владением ключа, а проверяет её сервер по своему CA. Требование клиентского сертификата включается явно, по умолчанию сервер клиентов не проверяет вовсе. Клиентский сертификат проверяется так же строго, как серверный: цепочка, срок и назначение (сертификат «только для серверов» не годится в клиенты). Отказ приходит клиенту позже рукопожатия, потому что в TLS 1.3 клиент заканчивает свою часть раньше, чем сервер проверил сертификат, и надёжное свидетельство отказа это ошибка при первом обмене."""

[[exercises]]
name = "ntls_q4"
kind = "question"
question.ru = """Клиент с просроченным сертификатом подключается к mTLS-серверу. Вызов `connect` у клиента закончился успехом, а первая отправка данных упала с ошибкой. Это баг?"""
options.ru = [
  """баг в rustls: ошибка должна быть уже в `connect`""",
  """нет: в TLS 1.3 клиент считает рукопожатие завершённым раньше, чем сервер проверил его сертификат, и отказ приходит при первом обмене""",
  """баг сервера: он должен был прервать соединение до рукопожатия""",
  """нет: просроченный сертификат клиента допустим, ошибка вызвана чем-то другим""",
]
answer = [1]
explain.ru = """В TLS 1.3 клиент отправляет свой сертификат в последнем сообщении рукопожатия и считает его оконченным, не дожидаясь проверки на сервере. Отказ приходит алертом позже, и клиент видит его на первом чтении или записи. Поэтому в тестах mTLS проверяют целый обмен («отправил, получил ответ»), а не только успешный `connect`."""
hint.ru = """Кто первым узнаёт, что клиентский сертификат плох?"""

[[exercises]]
name = "ntls11"
kind = "project"
style = "todo"
locked = ["tests/acceptance.rs"]
hint.ru = [
  """Три независимые части. `identity_of`: разбери DER через `x509_parser::parse_x509_certificate`, возьми расширение SAN и найди первое `GeneralName::DNSName`. На любой ошибке разбора верни `None`. `Rules::allows`: сначала поищи метод в таблице, потом клиента в списке метода.""",
  """В `serve` личность достаётся после рукопожатия: `tls.get_ref().1.peer_certificates()` возвращает `Option<&[CertificateDer]>`, первым идёт сертификат клиента. Читай строку запроса только после этого и бери из неё лишь имя метода, второе слово.""",
  """Всё, что клиент пишет сам (`AS gateway`, имя в тексте), игнорируй: он может написать что угодно. Для ответа нужны оба случая: когда личность есть и когда её нет (`-`). Закрывай соединение через `shutdown`.""",
]
why.ru = """Личность клиента это только то, что подтверждено рукопожатием: сертификат, подписанный нашим CA. Любое утверждение внутри запроса написал сам клиент, и верить ему нельзя. Имя берётся из SAN, потому что проверка имён живёт там, а CN давно не используется и позволяет подложить чужое имя при выписывании сертификата. Права проверяются по таблице с запретом по умолчанию: ошибка в таблице должна приводить к лишнему отказу, а не к лишнему доступу. Разбор сертификата читает чужие байты и поэтому на любой ошибке возвращает None, а не падает."""

[[exercises]]
name = "ntls_q3"
kind = "question"
question.ru = """Сервис постов с mTLS пускает вызовы от любого клиента, у которого сертификат выдан общим CA. Нужно, чтобы метод `Create` вызывал только шлюз. Какой подход верный?"""
options.ru = [
  """в самом запросе передавать имя вызывающего сервиса и проверять его в обработчике""",
  """взять имя из SAN клиентского сертификата, подтверждённого рукопожатием, и сравнить с разрешённым списком""",
  """отдать шлюзу отдельный порт и надеяться, что остальные его не найдут""",
  """проверять IP-адрес клиента""",
]
answer = [1]
explain.ru = """Имя из запроса клиент написал сам и может написать любое. IP-адрес подделывается и меняется при переезде. Единственное, что доказано рукопожатием, это сертификат: он подписан нашим CA, и клиент владеет его ключом. Поэтому права выдают по имени из SAN сертификата, а таблицу ведут с запретом по умолчанию."""
hint.ru = """Что из перечисленного клиент не может изменить по своему желанию?"""

[[exercises]]
name = "ntls_tonic"
kind = "project"
style = "bughunt"
locked = ["tests/acceptance.rs"]
hint.ru = [
  """Запусти тесты: два теста про TLS и имя падают, а ещё один (про чужой CA) может проходить по неправильной причине. Разбери по порядку, что нужно клиенту, чтобы настоящее TLS-соединение состоялось, и сверь с `client_channel`.""",
  """Первый дефект в адресе, который строится для `Endpoint`: от схемы зависит, включится ли TLS вообще, и настройки TLS при неподходящей схеме просто не применяются. Второй: имя, по которому проверяется сертификат, в `ClientTlsConfig` задаётся отдельно и никуда не берётся из параметров.""",
  """Нужны схема `https`, а в `ClientTlsConfig` вызов `domain_name(domain)`. Без него tonic проверяет сертификат по хосту из адреса, то есть по `127.0.0.1`, и сервис, доступный по IP, но выписанный на имя, недоступен.""",
]
why.ru = """Защита, которая включается строкой в адресе, легко «отключается» опечаткой в схеме, и тогда тесты, которые проверяют только «ответ пришёл», этого не заметят: клиент и сервер просто поговорят открытым текстом. Поэтому тесты проверяют и обратное: открытый клиент к серверу под TLS не проходит. Имя для проверки задаётся явно, потому что сервисы ходят по адресам, а сертификаты выдаются на имена: если имя берётся из адреса, то сертификат придётся выписывать на IP, а это ломается при каждом переезде."""

[[exercises]]
name = "ntls_mtls"
kind = "project"
style = "scratch"
locked = ["crates/certgen/tests/acceptance.rs", "crates/posts-service/tests/acceptance.rs"]
quiz = true
hint.ru = [
  """Две независимые половины: `certgen` не знает про tonic, а `posts-service` не выпускает сертификаты. Начни с `certgen::issue_all`: из задачи про свой CA возьми приём выпуска и записи с правами `0600`, в цикле по трём именам. Остальное в `posts-service` тесты не запустят, пока выпуск не работает.""",
  """В `ServerTlsConfig` нужны два вызова: `identity(Identity::from_pem(сертификат, ключ))` для самого сервера и `client_ca_root(Certificate::from_pem(ca))`, который включает требование клиентского сертификата. Без второго рукопожатие пройдёт у кого угодно.""",
  """Рукопожатие mTLS пускает любого с сертификатом общего CA, а права решаются отдельно. Проверку удобно вынести в перехватчик сервиса: у `Request<()>` есть `peer_certs()`. Возьми первый сертификат цепочки, достань имена через `identity::dns_names` и сравни с `GATEWAY`. Нет сертификата это `Unauthenticated`, не то имя это `PermissionDenied`.""",
]
why.ru = """Сертификаты нужны каждому сервису свои: тогда компрометация одного не открывает остальные, а права можно выдавать по именам. CA один, потому что сервисы должны доверять друг другу, и поэтому прошедшее рукопожатие означает только «этот клиент наш», а какие методы ему можно, решает отдельная проверка по SAN. Ключи пишутся сразу с правами 0600, а каталог с сертификатами внесён в .gitignore командой, которая сама проверяет, что строка там есть ровно один раз: секреты, попавшие в репозиторий, остаются в истории навсегда."""

