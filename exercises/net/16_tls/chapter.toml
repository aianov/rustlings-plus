[[exercises]]
name = "ntls_exam"
kind = "project"
style = "scratch"
exam = true
locked = ["tests/acceptance.rs"]
why.ru = """Экзамен собирает раздел в одну вещь. Один общий Store за мьютексом и три независимых входа, у каждого свои правила того, что считать плохим вводом. UDP принимает всё и ничего не отвечает, поэтому плохие строки считаются, а не отвергаются; HTTP обязан не зависать на молчащих клиентах и не терять ответы об ошибках; gRPC закрыт токеном и TLS, а здоровье остаётся открытым. Остановка идёт по порядку: сначала NOT_SERVING, пауза, затем стоп. Самые частые ошибки: относительные датчики, обрезка лимита имён до проверки существования, ответ 431 без дочитывания хвоста и остановка, которая обрывает уже принятые HTTP-запросы."""
