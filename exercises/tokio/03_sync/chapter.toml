[chapter]
title.en = "Synchronization"
title.ru = "Синхронизация"

[[chapter.visuals]]
file = "visuals/mutex_await.html"
title.ru = "guard через .await держит очередь остальных задач"

[[chapter.visuals]]
file = "visuals/notify_lost.html"
title.ru = "notify_waiters раньше notified: пробуждение потеряно"

[[exercises]]
name = "sy1"
style = "todo"
hint.ru = [
  """Порядок действий в record: сначала медленное (audit), потом короткая секция под замком. Внутри замка .await быть не должно.""",
  """`self.routes.lock().unwrap().entry(route.to_string()).or_insert((0, 0))` даёт изменяемую пару (число замеров, сумма).""",
]
why.ru = """Обычный std::sync::Mutex в async-коде безопасен и быстр, пока замок берётся на короткое время и без .await внутри: задача не отдаёт поток, пока держит замок, но и держит она его микросекунды. Всё медленное делается до или после замка. Это правило по умолчанию; tokio::sync::Mutex нужен только когда замок приходится держать через .await (sy4)."""

[[exercises]]
name = "sy2"
style = "fix"
hint.ru = [
  """Guard от std Mutex не Send, а всё, что живёт через .await, часть Future. Значит, пока ты ждёшь отправки, замка у тебя быть не должно.""",
  """Достань содержимое из-под замка целиком и сразу отпусти замок: `std::mem::take` забирает вектор и оставляет пустой.""",
  """`let lines = std::mem::take(&mut *pending.lock().unwrap());` и дальше цикл по `lines` без замка.""",
]
why.ru = """Решение одновременно лечит компиляцию и поведение. Пока flush ждёт отправки, другие задачи могут добавлять сообщения: забрав список целиком через mem::take, flush отправляет ровно то, что было на старте, а новое остаётся в очереди для следующего раза. Вариант «держать замок через .await» сломал бы и Send, и добавление сообщений."""

[[exercises]]
name = "sy3"
style = "bughunt"
hint.ru = [
  """Временное значение в выражении match живёт до конца всего match, включая все его ветки. Что это значит для замка?""",
  """`cache.map.lock().unwrap()` в заголовке match это временный guard: он дожил до ветки None, где идёт .await и повторный lock.""",
  """Вынеси результат поиска в `let` (с `.cloned()`), чтобы guard умер на точке с запятой, и матчь уже по этому значению.""",
]
why.ru = """Временные значения в заголовке match и в условии if let живут до конца выражения (для if let в редакции 2024 это правило смягчили лишь для ветки else). Поэтому guard std Mutex, взятый в заголовке, оказывается живым в ветке с .await: future перестаёт быть Send, а если заменить замок на tokio::sync::Mutex, повторный lock в той же ветке даст дедлок. Привычка: результат из-под замка сначала кладут в переменную, и только потом ветвятся."""

[[exercises]]
name = "sy_q1"
kind = "question"
style = "bughunt"
question.ru = '''`m` это `Arc<std::sync::Mutex<Vec<u8>>>`. Каждый фрагмент лежит в async-блоке, который уходит в tokio::spawn (редакция 2024). Какие фрагменты не соберутся из-за «future cannot be sent between threads safely»? Выбери все.'''
options.ru = [
  "let n = m.lock().unwrap().len(); sleep(d).await; n",
  "match m.lock().unwrap().len() { 0 => sleep(d).await, _ => {} }",
  "if m.lock().unwrap().is_empty() { sleep(d).await; }",
  "if let Some(x) = m.lock().unwrap().pop() { sleep(d).await; drop(x); }",
]
answer = [1, 3]
explain.ru = """Guard остаётся живым в ветках match и в теле if let, потому что временное значение из заголовка живёт до конца всей конструкции. Условие обычного if вычисляется отдельно и guard умирает до входа в блок. А в первом фрагменте guard умер на точке с запятой. Проверено компилятором: ошибка будет у второго и четвёртого."""
hint.ru = """В каком месте умирает временное значение, созданное в заголовке конструкции?"""

[[exercises]]
name = "sy4"
style = "scratch"
hint.ru = [
  """Номер и запись должны быть единым действием, значит, замок на номер нужно держать, пока идёт запись. Через .await это позволяет только асинхронный замок (поле уже такое).""",
  """В append: `let mut next = self.next.lock().await;`, возьми номер, запиши через `write_slow(seq, line).await`, увеличь `*next` и верни номер.""",
  """Для фоновой записи замок берут до spawn: `Arc::clone(&self.next).lock_owned().await` даёт OwnedMutexGuard, который можно унести в задачу через move.""",
]
why.ru = """Асинхронный Mutex существует именно для замков, которые держат через .await: его guard Send, а ожидающие встают в очередь без блокировки потока. Цена: он медленнее std Mutex, поэтому берётся только по необходимости. lock_owned даёт guard без заимствования, поэтому его можно отдать в spawn: так порядок захвата замка (по порядку вызовов) отделяется от самой работы. Замок взят до spawn, и это то, что фиксирует порядок."""

[[exercises]]
name = "sy5"
style = "fix"
hint.ru = [
  """Что делает render с замком в течение 200 мс? Зачем ему замок во время оформления?""",
  """Замок нужен только чтобы прочитать список. Оформлять можно уже копию.""",
]
why.ru = """Замок через медленный .await выстраивает в очередь всех, кому нужны данные, хотя ждать им нечего: оформление не требует доступа к списку. Правило: под замком копируем или забираем то, что нужно, замок отпускаем, а долгую работу ведём над копией. Цена копии почти всегда меньше цены очереди. Побочный эффект: витрина показывает снимок, это обычно именно то, что нужно."""

[[exercises]]
name = "sy6"
style = "fix"
hint.ru = [
  """Нужен замок, который различает чтение и запись.""",
  """tokio::sync::RwLock: `read().await` для читателей (их может быть сколько угодно), `write().await` для писателя (он ждёт, пока читатели не уйдут).""",
]
why.ru = """RwLock разрешает много читателей или одного писателя. Для данных, которые читают часто, а меняют редко, это убирает очередь читателей. Писатель ждёт ухода всех читателей, а читатель, начавший до записи, видит значение целиком: ни частичных обновлений, ни разрыва. Замок tokio честный: пока писатель ждёт, новые читатели встают в очередь за ним (см. вопрос ниже)."""

[[exercises]]
name = "sy_q2"
kind = "question"
style = "bughunt"
question.ru = '''Рантайм current_thread. Что напечатает программа?

```rust
let lock = Arc::new(tokio::sync::RwLock::new(0));
let r1 = lock.read().await;                    // читатель держит замок
let l2 = lock.clone();
tokio::spawn(async move { let _w = l2.write().await; });
tokio::task::yield_now().await;                // писатель встал в очередь
let ok = tokio::time::timeout(Duration::from_millis(100), lock.read()).await.is_ok();
println!("{ok}");
```'''
options.ru = [
  "true: читателей может быть сколько угодно",
  "false: ждущий писатель не пропускает вперёд новых читателей",
  "паника",
]
answer = [1]
explain.ru = """RwLock в tokio справедливый: очередь идёт по порядку, и новый читатель встаёт за ждущим писателем, а писатель ждёт первого читателя. Так писатель не голодает под потоком читателей. Но читатель, который берёт read() второй раз, пока держит первый, при ждущем писателе повиснет навсегда: это классический дедлок на ровном месте (разберём в отладке)."""
hint.ru = """Кого пропускает впереди себя справедливая очередь?"""

[[exercises]]
name = "sy7"
style = "todo"
hint.ru = [
  """Нужен счётчик свободных мест, который задачи берут перед работой и возвращают после. Он лежит в tokio::sync.""",
  """`Semaphore::new(limit)` в Arc. Перед `work` в каждой задаче: `let _permit = permits.acquire().await.unwrap();`. Разрешение вернётся само, когда _permit умрёт.""",
]
why.ru = """Semaphore считает свободные места. acquire ждёт, если мест нет, а разрешение возвращается в Drop, поэтому пропустить возврат невозможно, даже при панике или отмене. Имя переменной `_permit` с подчёркиванием важно: голое `_` дропнуло бы разрешение сразу же. Здесь все задачи создаются разом, а ограничена только работа; следующая задача ограничивает и сами задачи."""

[[exercises]]
name = "sy8"
style = "scratch"
hint.ru = [
  """Подход из sy7 (разрешение внутри задачи) создаёт все задачи сразу, а нужно, чтобы цикл сам притормаживал. Где разрешение должно быть получено?""",
  """В самом цикле, до spawn: тогда следующая итерация не начнётся, пока не освободится место. Разрешение должно уехать в задачу и вернуться в конце.""",
  """`Arc::clone(&permits).acquire_owned().await` даёт OwnedSemaphorePermit, он 'static и переносится в spawn через move. Создавай `job(..)` уже после получения разрешения.""",
]
why.ru = """acquire_owned даёт разрешение без заимствования семафора, поэтому его можно унести в spawn. Если брать разрешение внутри задачи (sy7), цикл успеет создать все задачи сразу, и десять тысяч Future лягут в память. Когда разрешение берёт сам цикл, он притормаживает: это называется обратным давлением. Порядок важен: разрешение сначала, создание задачи потом."""

[[exercises]]
name = "sy9"
style = "todo"
hint.ru = [
  """Для сигнала «разбудить одну ждущую задачу» у Notify есть два метода: один будит всех ждущих прямо сейчас, другой одну и запоминает сигнал, если ждущих ещё нет.""",
  """Ждать: `door.notified().await`. Подавать: `door.notify_one()`.""",
]
why.ru = """notify_one хранит ровно одно разрешение: если ждущих нет, сигнал дожидается первого, кто начнёт ждать. Поэтому «открыть раньше, чем кто-то стал ждать» не теряется. notify_waiters, наоборот, будит только тех, кто уже ждёт, и ничего не запоминает (следующая задача). Выбор между ними это выбор семантики: сигнал-разрешение или широковещательное событие."""

[[exercises]]
name = "sy10"
style = "bughunt"
hint.ru = [
  """Что делает notify_waiters, если в этот момент никто не ждёт? А что сделает notify_one, если ждущих трое?""",
  """Ни один из двух не годится сам по себе: первый ничего не запоминает, второй будит одну задачу. Опоздавшие должны увидеть, что готовность уже была, значит, это нужно где-то хранить.""",
  """Рядом с Notify нужен флаг (AtomicBool). set_ready поднимает его и будит всех ждущих; wait_ready в цикле создаёт Notified, потом смотрит на флаг, потом ждёт.""",
]
why.ru = """Потерянное пробуждение это классика: событие произошло в промежутке, когда никто не ждал, и обещание «разбудить» растворилось. notify_one хранит разрешение, но будит одного, а готовность нужна всем, в том числе тем, кто придёт позже. Поэтому состояние живёт во флаге, а Notify только будит: Notified создаётся до проверки флага, иначе остаётся та же щель. Только состояние переживает момент, когда никто не слушает."""

[[exercises]]
name = "sy11"
style = "fix"
hint.ru = [
  """Между «пусто» и «стал ждать» есть окно, в которое попадает push. Ожидание должно быть создано ДО проверки.""",
  """Future от `notified()` гарантированно получает notify_waiters, начиная с момента создания, даже если его ещё не опрашивали. Создай его раньше проверки.""",
  """В цикле: `let notified = self.notify.notified();`, потом проверка `peek_pop`, и только если пусто, `notified.await`.""",
]
why.ru = """Шаблон ожидания условия всегда такой: создать Notified, проверить условие, и если оно ложно, ждать этот самый Notified. Тогда любой notify_waiters между проверкой и ожиданием не пропадёт: Notified, созданный раньше, его увидит. Цикл нужен потому, что проснуться можно ради элемента, который успел забрать другой потребитель. Тест намеренно держит точку ожидания внутри peek_pop, чтобы окно было детерминированным."""

[[exercises]]
name = "sy_q3"
kind = "question"
style = "bughunt"
question.ru = '''Что напечатает программа? Время заморожено, Notify новый.

```rust
let n = tokio::sync::Notify::new();
n.notify_one();
n.notify_one();
let a = timeout(Duration::from_secs(1), n.notified()).await.is_ok();
let b = timeout(Duration::from_secs(1), n.notified()).await.is_ok();
println!("{a} {b}");
```'''
options.ru = ["true true", "true false", "false false", "false true"]
answer = [1]
explain.ru = """Notify хранит не больше одного разрешения: два notify_one подряд без ждущих дают одно. Первый notified его забирает, второй ждёт и по таймауту выдаёт false. Если нужно считать события, а не сигнализировать, Notify не годится (смотри Semaphore или канал)."""
hint.ru = """Сколько разрешений запоминает Notify, пока никто не ждёт?"""

[[exercises]]
name = "sy12"
style = "scratch"
hint.ru = [
  """Нужна ячейка, которая сама следит, чтобы инициализация прошла ровно один раз, а остальные её дождались. Она уже лежит в структуре.""",
  """`OnceCell::get_or_init(|| future)` принимает замыкание, возвращающее Future; пока один вызов инициализирует, остальные ждут его результата.""",
]
why.ru = """OnceCell решает задачу «лениво и один раз» без ручных флагов и замков: параллельные вызовы не плодят подключения, а ждут единственное. Замыкание вызывается только победителем. Ручная связка «проверил, что пусто, подключился, положил» гонится: двадцать задач увидят пусто одновременно."""

[[exercises]]
name = "sy13"
style = "fix"
hint.ru = [
  """Сейчас проверка и подключение разделены, и между ними параллельные вызовы друг о друге не знают.""",
  """Нужен вариант инициализации, который может вернуть ошибку и при ошибке оставляет ячейку пустой: у OnceCell он называется get_or_try_init.""",
]
why.ru = """get_or_try_init делает то же, что get_or_init, но инициализатор может провалиться: тогда ячейка остаётся пустой, ошибку получает тот вызов, чья попытка упала, а ожидавшие пробуют сами по очереди. Поэтому на десять параллельных вызовов приходится ровно три попытки, а не десять. Кэшировать ошибку подключения почти всегда неправильно: сеть могла просто моргнуть."""

[[exercises]]
name = "sy14"
style = "scratch"
hint.ru = [
  """Что значит «независимые части»: вектор из Mutex<HashMap>, и ключ определяет, какой из них брать.""",
  """shard_of: перемешай ключ (умножение на большую нечётную константу) и возьми остаток от деления на число шардов. Не бери голый `key % n`: последовательные ключи тогда ложатся по кругу, но закономерные ключи кучкуются.""",
  """update: возьми замок только шарда `shards[shard_of(key)]` и вызови f над `entry(key).or_default()`.""",
]
why.ru = """Один замок на карту сериализует все обновления, даже над разными ключами. Шардирование разбивает конкуренцию: ключи из разных шардов не мешают друг другу, а из одного ждут. Число шардов берут с запасом относительно числа потоков. Тест измеряет не время (оно шумит), а число потоков, одновременно находящихся внутри update."""

[[exercises]]
name = "sy_gate"
style = "scratch"
quiz = true
hint.ru = [
  """Каждое требование это отдельный примитив: Notify и флаг для открытия, OnceCell для подключения, RwLock для кэша, Semaphore для лимита. Замок кэша держи только на время чтения или вставки, без .await.""",
  """Ожидание открытия: цикл, в котором ты создаёшь `door.notified()`, затем проверяешь флаг `opened`, и если не открыто, ждёшь этот Notified. `open` ставит флаг и зовёт notify_waiters.""",
  """profile: wait_open, чтение кэша (клон, замок сразу отпущен), `conn.get_or_try_init(|| backend.connect())`, `permits.acquire()` вокруг `backend.fetch(..)`, запись в кэш.""",
]
why.ru = """Шлюз складывает главу: сигнал открытия не должен теряться и будит всех (флаг и Notified, созданный до проверки), подключение ленивое и общее (get_or_try_init), кэш на RwLock без замка через .await, лимит на Semaphore. Тест со стрессом на multi_thread проверяет, что вместе это не рассыпается. Обрати внимание, что permit берётся только вокруг обращения к бэкенду, а не вокруг всей функции: иначе кэш-попадание ждало бы свободное место."""

[[exercises]]
name = "m17_async_core"
kind = "milestone"
journey = "backend"
quiz = true
