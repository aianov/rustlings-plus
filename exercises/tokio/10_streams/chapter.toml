question.ru = """В канал пришли три элемента, и после этого производитель замолчал на час (канал открыт). Потребитель читает пачками по пять. Что он увидит сразу?

```rust
let a = rx_stream(rx).chunks(5);          // первый вариант
let b = rx_stream(rx2).ready_chunks(5);   // второй вариант
```"""
options.ru = ["Оба варианта сразу отдадут пачку из трёх элементов", "Первый ждёт, пока наберётся пять, а второй сразу отдаёт три", "Первый сразу отдаёт три, а второй ждёт пять", "Оба ждут, пока набежит пять"]
answer = [1]
explain.ru = """`chunks(5)` обещает пачку ровно из пяти (кроме последней при конце потока): пока источник открыт и молчит, он ждёт недостающие два. `ready_chunks(5)` забирает всё, что готово без ожидания, и отдаёт, как только источник сказал «пока нет». Для живого потока, где важна задержка, берут второй. Для выгрузки архива, где данные придут всё равно, первый."""
hint.ru = """Кто из двух готов отдать пачку, если источник сейчас ничего не присылает?"""

[[exercises]]
name = "strm14"
style = "bughunt"
hint.ru = [
  """Что делает код между `fn` и `stream::iter`, когда функция вызвана: работа или только описание работы? Для итераторов и потоков отличие в том, где стоит `collect`.""",
  """Вычисление должно сидеть внутри комбинатора (`map` по диапазону), а не до него. Тогда оно выполняется при каждом опросе, а не при создании.""",
]
why.ru = """Потоки, как итераторы, ленивы: вызов функции, которая возвращает `impl Stream`, должен лишь описать конвейер. Вся работа происходит, когда потребитель опрашивает. Если вычислить всё до `stream::iter`, лень пропадает: расходуются процессор и память на значения, которых никто не просил, и потребитель, который взял три из тысячи, платит за тысячу. Настоящая лень даёт ещё одно полезное свойство: бросить поток значит остановить источник, ведь опрашивать больше некому."""

[[exercises]]
name = "strm15"
style = "bughunt"
hint.ru = [
  """Что возвращает `send`, когда приёмник уже уничтожен? И что делает код с этим результатом?""",
  """Ошибка `send` это единственный сигнал задаче, что читать больше некому. Если её игнорировать, задача никогда не узнает. Выход из цикла по этой ошибке закончит задачу, и её копия `probe` освободится.""",
]
why.ru = """Фоновая задача и канал связаны только через `Sender`. Когда потребитель бросает поток, приёмник уничтожается, и `send` начинает возвращать `Err`. Это единственный способ узнать, что работа никому не нужна. `let _ = tx.send(..)` молча проглатывает его, и задача вертится бесконечно, держа память и таймеры: так выглядит утечка задач. Правило: результат `send` в цикле производителя всегда проверяется, а ошибка означает выход. Тот же приём работает в actor-е и в любом конвейере из каналов."""

[[exercises]]
name = "strm_q5"
kind = "question"
style = "bughunt"
question.ru = """Производитель крутится в `tokio::spawn` и пишет в канал `mpsc`. Потребитель взял несколько элементов и выбросил поток вместе с приёмником. Какие из производителей после этого завершатся? Выбери все.

```rust
// A
loop { let _ = tx.send(n).await; sleep(pause).await; }
// B
loop { if tx.send(n).await.is_err() { break; } sleep(pause).await; }
// C
loop { tx.send(n).await.unwrap(); sleep(pause).await; }
```"""
options.ru = ["A", "B", "C"]
answer = [1, 2]
explain.ru = """После выброса приёмника `send` возвращает `Err`. В варианте A ошибка проглочена (`let _`), и задача крутится вечно: утечка. В варианте B ошибка приводит к выходу из цикла: задача кончается тихо, как и положено. В варианте C `unwrap` паникует, и задача тоже кончается, но через панику (в логах появится сообщение, а `JoinHandle` вернёт ошибку). Рабочий вариант только B: аккуратный выход без шума."""
hint.ru = """Что именно возвращает `send`, когда читать больше некому, и что с этим результатом делает каждый вариант?"""

[[exercises]]
name = "strm_feed"
style = "scratch"
quiz = true
hint.ru = [
  """Разбей на три функции, каждая небольшая. `feed` это конвейер: страницы через `unfold`, разворачивание в плоский поток (`try_flatten`), фильтр (`try_filter`), поиск автора (`map` в future), и параллельность с порядком (`buffered`). `digest` это одно звено. `with_live` это слияние двух потоков.""",
  """В `feed` порядок звеньев важен: сначала отбрасываем, потом ходим за автором (иначе лишние запросы). Поиск автора делай в `map`, который возвращает future, а `buffered(LOOKUPS)` запустит их параллельно и сохранит порядок. Ошибки страниц проходят по потоку как `Err` и в `map` пересылаются дальше. В `digest` пригодится `chunks` и то, что `Result` умеет собираться из итератора `Result`. В `with_live` второй поток нужно привести к такому же `Result<Entry, _>`, как у первого.""",
  """Страницы: `unfold(Some(None), ...)`, где состояние `Option<Option<u64>>`: внешний `None` значит «страниц больше нет», внутренний `None` значит «курсор начала». При ошибке страницы выдай `Err` и переведи состояние в «конец». Слияние: `stream::select(..)` двух потоков одного типа элемента; приёмник превращается в поток готовым помощником `rx_stream`.""",
]
why.ru = """Это та же лента, что строится в сквозном проекте, и в ней сошлись приёмы главы. Страницы идут через `unfold` по курсору: лениво, с остановкой на ошибке. Фильтр стоит до поиска авторов, потому что каждый запрос стоит времени. Поиск авторов это `map` в future плюс `buffered(N)`: порядок сохраняется, лимит встроен, и сбой одного поиска портит только свой элемент. `try_*` версии пропускают ошибки сквозь поток, не разворачивая его. `chunks` и сборка `Result` из итератора дают пачки с правилом «пачка с ошибкой это ошибка». Слияние живых событий через `select` кончается, когда кончились оба источника, поэтому история и подписка не мешают друг другу."""

