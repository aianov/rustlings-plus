[chapter]
title.en = "Streams"
title.ru = "Стримы"

[[chapter.visuals]]
file = "visuals/stream_pull.html"
title.ru = "Стрим тянут: buffer_unordered, ленивость и брошенный стрим"

[[exercises]]
name = "strm1"
style = "fix"
hint.ru = """Как и в вводе-выводе, у `Stream` в крейте `futures` сам трейт крошечный (`poll_next`), а удобные методы (`next`, `map`, `collect`) лежат в трейте-расширении. Найди его и подключи через `use`."""
why.ru = """`Stream` это асинхронный итератор: вместо `next()`, который возвращает `Option<T>`, у него `poll_next`, а удобный `next().await` живёт в `StreamExt`. Без `use futures::StreamExt` этих методов у типа нет, и компилятор сообщает именно так. Потоки ленивы, как итераторы: пока никто не вызвал `next`, ничего не происходит, поэтому находка в начале не заставляет читать остальное. Требование `Unpin` нужно, потому что `next` берёт `&mut self`; про более общий случай следующие задачи."""

[[exercises]]
name = "strm2"
style = "scratch"
hint.ru = [
  """Поток обрабатывается цепочкой комбинаторов так же, как итератор: отфильтровал, ограничил, пронумеровал, собрал. Асинхронная особенность: замыкание в `filter` должно вернуть future, а не `bool`.""",
  """`filter(|n| ready(*n > 0))` оставит положительные, `take(3)` остановит чтение после трёх, `enumerate()` пронумерует, `collect::<Vec<_>>().await` соберёт. Порядок звеньев важен: что изменится, если поставить `enumerate` до `filter`?""",
]
why.ru = """Комбинаторы потока устроены как у итераторов, но методы возвращают потоки, а запускает всё `.await` на терминальной операции (`collect`, `fold`, `next`). `take(3)` останавливает вытягивание из источника сразу после третьего элемента: это то самое «источник бесконечный, а мы читаем сколько надо». Порядок звеньев меняет смысл: `enumerate` после `filter` нумерует отобранные, а перед ним нумеровал бы все. В `filter` замыкание возвращает future (`ready(..)` для мгновенных ответов), потому что фильтру разрешено ждать."""

[[exercises]]
name = "strm_q1"
kind = "question"
style = "bughunt"
question.ru = """В каком порядке появятся строки?

```rust
let doubled = stream::iter(1..=3).map(|n| {
    println!("map {n}");
    n * 2
});
println!("created");
let v: Vec<_> = doubled.take(2).collect().await;
println!("{v:?}");
```"""
options.ru = ["created, map 1, map 2, [2, 4]", "map 1, map 2, map 3, created, [2, 4]", "created, map 1, map 2, map 3, [2, 4]", "map 1, map 2, created, [2, 4]"]
answer = [0]
explain.ru = """Потоки ленивы: пока никто не опрашивает, замыкание в `map` не вызывается, поэтому `created` идёт первым. Дальше `collect` тянет элементы через `take(2)`, и `map` выполняется ровно два раза: `take` не опрашивает источник после второго элемента. Третьего `map 3` нет, как и в ленивом итераторе."""
hint.ru = """Кто вызывает замыкание из `map`: создание потока или опрос? И что делает `take`, когда набрал нужное число?"""

[[exercises]]
name = "strm3"
style = "scratch"
hint.ru = [
  """У `Stream` есть `then`: он применяет к каждому элементу асинхронную функцию и обрабатывает элементы по очереди, а не одновременно. А для «выбросить `None`, оставить значения» подойдёт `filter_map`.""",
  """Номера превращаются в поток через `stream::iter`, к каждому применяешь вызов справочника, получая поток из `Option<String>`. Лишние `None` убирает `filter_map`: в `futures` его функция возвращает future, а готовое значение в future заворачивает функция из `std::future`.""",
]
why.ru = """`then` это «`map`, но с `.await` внутри»: следующий элемент берётся из источника только после того, как future предыдущего завершился, поэтому порядок и последовательность сохраняются. Для справочника с лимитом это то, что нужно. Параллельность делается отдельным шагом (`buffered`), и это решение принимает автор кода, а не комбинатор. `filter_map` в `futures` ждёт future, а не готовое значение, поэтому `ready` из стандартной библиотеки снова оказывается кстати."""

[[exercises]]
name = "strm4"
style = "fix"
hint.ru = [
  """Метод `next` требует `Unpin` от потока. Поток из `then` хранит внутри future от асинхронного блока, а такие future самоссылочные и двигаться не могут. Значит, надо закрепить поток на месте.""",
  """Закрепить можно двумя способами: положить поток в кучу (`Box::pin(..)`) или закрепить на стеке макросом `pin!` из `std::pin`. Макрос не выделяет память.""",
]
why.ru = """Асинхронный блок внутри `then` может хранить ссылки на собственные локальные переменные, поэтому после первого опроса его нельзя перемещать в памяти: он `!Unpin`. А метод `next` требует `Unpin`, потому что берёт `&mut self` и теоретически мог бы поток подвинуть. `pin!` закрепляет значение на стеке (получается `Pin<&mut T>`, для которого `Unpin` выполняется всегда), а `Box::pin` закрепляет в куче. Нужно только когда поток читают через `next` вручную; терминальные операции вроде `collect` забирают поток по значению и закрепляют его сами."""

[[exercises]]
name = "strm5"
style = "fix"
hint.ru = [
  """`then` обрабатывает элементы строго по одному. Для «несколько в работе сразу» у `StreamExt` есть другие комбинаторы, которые принимают поток future и держат в работе не больше N.""",
  """Превращай элементы в future через `map` (а не `then`, который их сам дожидается), затем дай потоку future комбинатор `buffered(n)`. Он сохраняет порядок, а его родственник без порядка нужен в другой задаче.""",
]
why.ru = """`map` превращает каждый элемент в future, который ещё не запущен, а `buffered(n)` опрашивает вперёд до `n` таких future одновременно и выдаёт результаты в порядке исходного потока: если ранний запрос медленнее поздних, поздние ждут своей очереди на выдачу, но выполняются уже сейчас. Новый запрос стартует, когда освободилось место в окне, поэтому десять одинаковых запросов при лимите четыре занимают три «волны». Лимит соблюдается самим комбинатором, отдельный замок не нужен. Цена порядка: готовый результат ждёт отстающего впереди и занимает место в окне."""

[[exercises]]
name = "strm_q2"
kind = "question"
style = "bughunt"
question.ru = """Три задания идут с задержками: задание 1 занимает 300 мс, задание 2 занимает 100 мс, задание 3 занимает 250 мс. В обоих случаях лимит равен двум. Что получится?

```rust
let a: Vec<u32> = stream::iter([1, 2, 3]).map(job).buffered(2).collect().await;
let b: Vec<u32> = stream::iter([1, 2, 3]).map(job).buffer_unordered(2).collect().await;
```"""
options.ru = ["a = [1, 2, 3] за 350 мс, b = [2, 1, 3] за 350 мс", "a = [1, 2, 3] за 550 мс, b = [2, 1, 3] за 350 мс", "a = [2, 1, 3] за 350 мс, b = [2, 1, 3] за 350 мс", "оба дают [1, 2, 3] за 650 мс, потому что лимит два"]
answer = [1]
explain.ru = """`buffer_unordered(2)` выдаёт результаты по мере готовности: задание 2 готово в момент 100, его место сразу занимает задание 3 (старт 100, конец 350), задание 1 заканчивается в 300. Итог `[2, 1, 3]` за 350 мс. `buffered(2)` обязан выдавать в порядке входа, поэтому готовое задание 2 лежит и ждёт, пока выйдет задание 1, и занимает место в окне. Задание 3 стартует только в момент 300 и кончается в 550. Порядок стоит времени, когда задания разной длины: если порядок не нужен, берите `buffer_unordered`."""
hint.ru = """Если результат второго задания готов, но первое ещё идёт, свободно ли место в окне `buffered`?"""

[[exercises]]
name = "strm6"
style = "fix"
hint.ru = [
  """`join_all` создаёт и запускает все future сразу, поэтому лимита у него нет. Нужен способ держать в работе не больше N из потока.""",
  """Если порядок результатов не важен, подойдёт вариант `buffered` без сохранения порядка: он выдаёт результат, как только любой из N готов, и не простаивает из-за медленного первого. А сумму можно копить на лету через `fold`.""",
]
why.ru = """`join_all` строит все десять тысяч future заранее и запускает их разом: память и нагрузка на сервис растут пропорционально данным. `stream::iter(..).map(..).buffer_unordered(n)` создаёт future лениво и держит в работе не больше `n`, а когда порядок не нужен, не ждёт отстающих: выдаёт результат, как только он готов. Это стандартный способ «обработать много, но с потолком»: тот же потолок получился бы семафором, но здесь он встроен в сам комбинатор. Сумма через `fold` не копит результаты в векторе."""

[[exercises]]
name = "strm7"
style = "scratch"
hint.ru = [
  """Для потоков, элементы которых `Result`, есть отдельный трейт-расширение `TryStreamExt`. Он умеет достать значение из `Ok` и пробросить `Err` наверх, как оператор `?`.""",
  """`try_next().await?` возвращает `Option<T>` и сам пробрасывает ошибку, поэтому цикл `while let Some(x) = rows.try_next().await?` читается так же, как обычный. А для «собрать всё или ошибка» есть `try_collect`.""",
]
why.ru = """Поток результатов нельзя разбирать обычным `next`: пришлось бы на каждом шаге писать `match`. `TryStreamExt` делает то, что `?` делает для функций: `try_next` разворачивает `Option<Result<T, E>>` в `Result<Option<T>, E>`, и `?` работает как обычно, а `try_collect` собирает значения и останавливается на первой ошибке. Остановка важна: потоки ленивы, и пока ты не вернулся к источнику, он не тянется. Если сначала собрать всё в вектор результатов, а потом искать ошибку, источник будет вычитан зря до самого конца."""

[[exercises]]
name = "strm8"
style = "scratch"
hint.ru = [
  """Состояние между шагами здесь одно: курсор следующей страницы. Для потока, у которого каждый следующий элемент требует асинхронного запроса от предыдущего, есть конструктор `stream::unfold(начальное_состояние, |состояние| async { ... })`.""",
  """Функция внутри `unfold` возвращает `Option<(элемент, новое_состояние)>`: `None` кончает поток. Состояние сделай `Option<usize>`: `None` означает «страниц больше нет». Что вернуть при ошибке страницы, чтобы поток выдал её и не пошёл по кругу?""",
  """Плоский поток получается из потока страниц так: каждую страницу-`Ok(Vec)` превращаешь в поток `Ok`-элементов (`map_ok`) и склеиваешь (`try_flatten`). Ошибка страницы при этом проходит как есть.""",
]
why.ru = """`unfold` это генератор: состояние (здесь курсор) входит в замыкание, а выходит пара «элемент и следующее состояние». Каждый шаг делает свой запрос, и пока потребитель не попросил следующий элемент, запроса нет, отсюда ленивость. Ошибку надо отдать и сразу перевести состояние в «конец»: если оставить прежний курсор, поток будет бесконечно перезапрашивать сломанную страницу. `try_flatten` разворачивает вложенные потоки `Result`, не теряя ошибок. Так обычно выглядят и выборки из баз данных, и постраничные API."""

[[exercises]]
name = "strm_q3"
kind = "question"
style = "bughunt"
question.ru = """Постраничная выгрузка через `unfold`. Страница 2 всегда отвечает ошибкой. Что увидит потребитель, который читает поток до конца?

```rust
stream::unfold(Some(0usize), |cursor| async move {
    let cursor = cursor?;
    match api.page(cursor).await {
        Ok(page) => Some((Ok(page.items), page.next)),
        Err(e) => Some((Err(e), Some(cursor))),
    }
})
```"""
options.ru = ["Ошибку один раз, потом поток закончится", "Хорошие страницы, а затем одну и ту же ошибку бесконечно", "Панику на третьем шаге", "Хорошие страницы и конец потока: страница 2 просто пропадёт"]
answer = [1]
explain.ru = """`unfold` кончается только тогда, когда замыкание вернуло `None`. Здесь при ошибке оно возвращает `Some` с прежним курсором, поэтому следующий опрос снова просит страницу 2, снова получает ошибку и так далее. Поток никогда не закончится, а потребитель с `collect` зависнет в бесконечном сборе ошибок. Чтобы ошибка была последней, состояние после неё должно стать «страниц больше нет» (`None`)."""
hint.ru = """Что в `unfold` отличает «следующий шаг будет» от «потока больше нет»?"""

[[exercises]]
name = "strm9"
style = "todo"
hint.ru = [
  """У `mpsc::Receiver` есть синхронная опросная сестра `recv()`: `poll_recv(cx)`. Она возвращает то же, что и `poll_next` у потока, только в форме `Poll<Option<T>>`: готово с событием, готово с концом, не готово.""",
  """`poll_recv` уже умеет сам запоминать `Waker` из `cx`, когда возвращает `Pending`, поэтому проталкивать его никуда не нужно. Тебе остаётся преобразовать успешный результат (добавить номер) и вернуть остальное как есть.""",
]
why.ru = """`Stream` это ровно один метод `poll_next`, а `poll_recv` у приёмника канала возвращает тот же `Poll<Option<T>>`, поэтому мост получается тонким. Главное правило ручного `poll_next`: возвращая `Pending`, обязан быть зарегистрирован `Waker`. Здесь это делает `poll_recv`, который хранит `cx.waker()` в канале и будит нас, когда придёт событие. Номер события живёт в самой структуре: потоку позволено иметь состояние между опросами. Именно так устроен `ReceiverStream` из `tokio-stream`, который в нашем разделе не подключён."""

[[exercises]]
name = "strm10"
style = "todo"
hint.ru = [
  """У `Interval` кроме `tick().await` есть опросная версия: `poll_tick(cx)`. Она годится для `poll_next`, потому что, как и положено опросу, регистрирует `Waker`, когда тик ещё не готов.""",
  """Сначала проверь счётчик: если тиков не осталось, верни `Ready(None)`, не опрашивая таймер (иначе лишний период ожидания). Иначе опроси `poll_tick`: готов, уменьши счётчик и верни значение; не готов, верни `Pending`.""",
]
why.ru = """В `poll_next` нельзя написать `.await`: это обычная функция, которая обязана вернуть `Poll` сразу. Поэтому там вызывают опросные методы нижнего слоя (`poll_tick`, `poll_recv`, `poll_read`) и возвращают их `Pending`: пробуждение уже зарегистрировано внутри них. Проверка счётчика идёт перед опросом таймера, иначе после последнего тика поток ждал бы лишний период, прежде чем сообщить конец. Поле `left` живёт в структуре, потому что состояние между опросами хранится только там."""

[[exercises]]
name = "strm11"
style = "fix"
hint.ru = [
  """Контракт `poll_next`: вернув `Pending`, поток обязан договориться, чтобы его опросили снова, иначе никто этого не сделает. Кому и как producer узнает, что потребитель ждёт?""",
  """В `Shared` уже есть место под `Waker`, и `push` с `close` его используют. Не хватает того, кто его туда положит. Подсказка: `cx.waker()`.""",
]
why.ru = """Рантайм опрашивает future или поток, только когда его разбудили. Вернув `Pending`, ты обещаешь, что позаботился о пробуждении: сохранил `Waker` в месте, откуда его вызовет тот, кто изменит состояние. Здесь это поле в общей структуре. Без этого опрос состоится только случайно, а чаще не состоится никогда, и ошибка выглядит как зависание без паники. Нельзя лечить это вызовом `wake_by_ref` перед `Pending`: поток тогда опрашивается в бесконечном цикле, ест процессор и не отпускает рантайм (в тесте с замороженным временем он вообще не даст времени пойти)."""

[[exercises]]
name = "strm_q4"
kind = "question"
style = "bughunt"
question.ru = """Future ждёт флаг, который взведёт другой поток. Сейчас он возвращает `Pending` и никогда не просыпается. Какое исправление правильное и не гоняет процессор впустую?

```rust
impl Future for Door {
    type Output = ();
    fn poll(self: Pin<&mut Self>, cx: &mut Context<'_>) -> Poll<()> {
        if self.open.load(Ordering::SeqCst) { Poll::Ready(()) } else { Poll::Pending }
    }
}
```"""
options.ru = ["Перед `Pending` вызвать `cx.waker().wake_by_ref()`", "Сохранить `cx.waker().clone()` в общей ячейке, а поток, взводя флаг, достанет его оттуда и вызовет `wake()`", "Вернуть `Poll::Ready(())` сразу, а флаг проверить позже", "Вставить `yield_now().await` в начало `poll`"]
answer = [1]
explain.ru = """Рантайм опрашивает future только после пробуждения, и будить обязан тот, кто меняет состояние: он должен знать `Waker`, а значит, его надо оставить в общем месте. Вариант 0 формально разбудит, но заставит рантайм опрашивать future без остановки: процессор занят, а другие задачи (и таймеры в замороженном времени) страдают. Вариант 2 просто неверен. Вариант 3 не компилируется: `poll` не асинхронная функция."""
hint.ru = """Кто знает момент, когда флаг стал истинным, и что ему нужно, чтобы разбудить именно эту задачу?"""

[[exercises]]
name = "strm12"
style = "scratch"
hint.ru = [
  """Для слияния многих потоков в один, где выигрывает тот, у кого событие готово раньше, у `futures::stream` есть `select_all` (и `select` для двух). Конец наступает, когда кончились все.""",
  """`select_all` требует, чтобы каждый поток был `Unpin`, а поток из `unfold` таким не является: компилятор скажет то же самое про «unpinned», что и в одной из прошлых задач. Помогает метод `boxed()` из `StreamExt`: он кладёт поток в кучу и закрепляет.""",
]
why.ru = """`select_all` опрашивает все потоки и отдаёт готовое по мере поступления, а когда один закончился, продолжает с остальными. Конец наступает, лишь когда кончились все: в этом отличие от `chain` (последовательно, один за другим) и `zip` (парами, до первого конца). Требование `Unpin` относится к хранению потоков в коллекции: их нельзя двигать при перестановках, поэтому либо `Unpin`, либо упаковка в `Box::pin`/`boxed()`. Цена упаковки одно выделение памяти на поток, а выигрыш в том, что к слиянию можно присоединять потоки разных типов."""

[[exercises]]
name = "strm13"
style = "scratch"
hint.ru = [
  """В `StreamExt` есть два близких комбинатора для пачек. Один набирает ровно N и ждёт недостающего, другой отдаёт то, что готово прямо сейчас, до N. Выбирай по описанию режима.""",
  """`chunks(n)` для первого режима, `ready_chunks(n)` для второго. Пачки внутри тоже `Vec`, поэтому типы сойдутся без преобразований.""",
]
why.ru = """Это два разных обещания. `chunks(n)` копит ровно `n` и ждёт, сколько понадобится, а на конце потока отдаёт остаток: для архива, где данные всё равно придут. `ready_chunks(n)` опрашивает источник, пока тот готов отвечать сразу, и отдаёт накопленное, как только источник сказал `Pending`: для живого потока, где пачка ждёт ровно столько, сколько реально лежит в очереди, и не дольше. Перепутанные режимы дают либо лишнюю задержку (живой поток застрял в ожидании полной пачки), либо мелкие записи (архив режется как придётся)."""

[[exercises]]
