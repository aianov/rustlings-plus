нужен ли `next`. Потом страницы: `stream::unfold((fetch, Some(None)), ...)`, где внешний `None` значит «страниц больше
нет», а внутренний `None` это «курсор начала». Посты страницы разворачивает `map_ok(stream::iter(..))` и `try_flatten`.""",
"""Авторы: `map`, который синхронно создаёт future поиска (App клонируется в замыкание), и `buffered(feed_lookups)`.
`buffer_unordered` тоже параллелен, но отдаёт посты в порядке готовности, и лента перемешается. Тип возврата
`impl Stream<Item = ...> + Send + use<>`: стрим владеет своим App и не держит `&self`.""",
"""Живая лента теряет посты, если подписаться на события лениво, на первом опросе: пост, вышедший, пока грузилась
история, уже улетел. Поэтому `app.events()` зовётся прямо в `live`. Склейка: `history.chain(once(UpToDate)).chain(live)`,
а `scan` с самым новым id истории выкидывает живые посты, которые история уже показала.""",
"""Счётчик слушателей: guard с `Drop`, который едет внутри стрима. Проще всего своя обёртка `Tracked { inner, guard }`
с `impl Stream`, где `poll_next` просто зовёт внутренний стрим. В терминале готовые события забирает
`feed.next().now_or_never()` из `FutureExt`: `Some` значит событие уже было, `None` значит ждать пришлось бы.""",
]
