<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Почтовый ящик актора</title>
<style>
:root { --bg:#f6f7f9; --panel:#fff; --ink:#1c2330; --muted:#667085; --line:#d5d9e0; --a:#2f6fed; --b:#d9822b; --ok:#2e9e5b; --bad:#d64545; --code:#f0f2f6; }
@media (prefers-color-scheme: dark) { :root { --bg:#12151b; --panel:#1b2029; --ink:#e6e9ef; --muted:#98a2b3; --line:#343b49; --a:#6b9bff; --b:#f0a85a; --ok:#4cc585; --bad:#ff7b7b; --code:#151a22; } }
* { box-sizing:border-box; }
body { margin:0; padding:16px; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
h1 { font-size:18px; margin:0 0 4px; } .sub { color:var(--muted); margin:0 0 12px; }
.modes { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
.mode { text-align:left; font:13px/1.4 ui-monospace,Menlo,monospace; padding:8px 12px; border-radius:8px; border:2px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer; }
.mode.on { border-color:var(--a); } .mode small { display:block; font:12px system-ui,sans-serif; color:var(--muted); }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:10px; }
.cols { display:flex; gap:10px; flex-wrap:wrap; }
.col { flex:1 1 170px; min-width:150px; border:1px solid var(--line); border-radius:8px; padding:8px; background:var(--bg); }
.col h2 { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:0 0 8px; }
.chip { display:block; margin:4px 0; padding:6px 10px; border-radius:8px; border:2px solid var(--line); font:600 13px ui-monospace,Menlo,monospace; background:var(--panel); }
.chip.a { border-color:var(--a); } .chip.b { border-color:var(--b); } .chip.ok { border-color:var(--ok); color:var(--ok); } .chip.bad { border-color:var(--bad); color:var(--bad); }
.chip.gone { opacity:.5; text-decoration:line-through; border-style:dashed; }
.empty { color:var(--muted); font-size:13px; font-style:italic; }
code { font:13px ui-monospace,Menlo,monospace; background:var(--code); padding:1px 5px; border-radius:4px; }
.caption { padding:10px 12px; border-radius:8px; background:var(--panel); border:1px solid var(--line); min-height:68px; margin-bottom:10px; }
.controls { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
button.ctl { font:600 14px system-ui,sans-serif; padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer; }
button.ctl:disabled { opacity:.45; cursor:default; } .counter { color:var(--muted); font-size:13px; margin-left:auto; }
.verdict { margin-top:10px; padding:8px 12px; border-radius:8px; border:2px solid var(--line); font:600 14px system-ui,sans-serif; }
.verdict.ok { border-color:var(--ok); color:var(--ok); } .verdict.bad { border-color:var(--bad); color:var(--bad); } .verdict.info { color:var(--muted); }
</style>
</head>
<body>
<h1>Актор: один хозяин состояния</h1>
<p class="sub">Клиенты не трогают таблицу. Они кладут команды в ящик, а хозяин разбирает их по одной. Для вопросов в команду кладут одноразовый канал для ответа.</p>
<div class="modes" id="modes"></div>
<div class="panel" id="view"></div>
<div class="caption" id="caption"></div>
<div class="controls">
  <button class="ctl" id="step">Шаг</button><button class="ctl" id="play">Играть</button><button class="ctl" id="reset">Сброс</button>
  <span class="counter" id="counter"></span>
</div>
<script>
const MODES = {"fire": {"label": "Команды без ответа", "small": "Like и конец работы", "steps": [{"cols": [{"h": "Клиенты", "items": [{"t": "клиент A", "s": "a"}, {"t": "клиент B", "s": "b"}]}, {"h": "Ящик (mpsc)", "items": []}, {"h": "Актор: likes", "items": [{"t": "{}", "s": ""}]}], "v": {"k": "info", "t": "Ящик пуст, таблица пуста"}, "cap": "Актор запущен и ждёт на <code>rx.recv().await</code>. Таблица лайков лежит в локальной переменной его задачи, больше никто до неё не дотянется."}, {"cols": [{"h": "Клиенты", "items": [{"t": "клиент A", "s": "a"}, {"t": "клиент B", "s": "b"}]}, {"h": "Ящик (mpsc)", "items": [{"t": "Like(1) от A", "s": "a"}, {"t": "Like(1) от B", "s": "b"}]}, {"h": "Актор: likes", "items": [{"t": "{}", "s": ""}]}], "v": {"k": "info", "t": "Две команды лежат в очереди"}, "cap": "Оба клиента отправили <code>Like(1)</code> почти одновременно. Канал выстроил их в очередь: кто успел положить, тот и первый. Замка нет, потому что до таблицы они не дотягиваются."}, {"cols": [{"h": "Клиенты", "items": [{"t": "клиент A", "s": "a"}, {"t": "клиент B", "s": "b"}]}, {"h": "Ящик (mpsc)", "items": [{"t": "Like(1) от B", "s": "b"}]}, {"h": "Актор: likes", "items": [{"t": "{1: 1}", "s": "ok"}]}], "v": {"k": "ok", "t": "Первая команда разобрана"}, "cap": "Актор взял первую команду и изменил таблицу. Вторая ждёт: актор делает одно дело за раз, поэтому гонок в таблице быть не может."}, {"cols": [{"h": "Клиенты", "items": [{"t": "клиент A", "s": "a"}, {"t": "клиент B", "s": "b"}]}, {"h": "Ящик (mpsc)", "items": []}, {"h": "Актор: likes", "items": [{"t": "{1: 2}", "s": "ok"}]}], "v": {"k": "ok", "t": "Потерь нет, счёт верный"}, "cap": "Обе команды учтены, ни один лайк не пропал. Так же было бы под замком, но здесь не нужно держать замок через <code>.await</code> и думать о его порядке."}, {"cols": [{"h": "Клиенты", "items": [{"t": "A: Sender выброшен", "s": "gone"}, {"t": "B: Sender выброшен", "s": "gone"}]}, {"h": "Ящик (mpsc)", "items": [{"t": "закрыт", "s": "bad"}]}, {"h": "Актор: likes", "items": [{"t": "recv() вернул None", "s": "bad"}, {"t": "таблица уходит в JoinHandle", "s": "ok"}]}], "v": {"k": "ok", "t": "Актор завершился сам"}, "cap": "Когда выброшен последний <code>Sender</code>, <code>recv()</code> возвращает <code>None</code>, цикл кончается, а таблица становится результатом задачи. Отдельной команды «стоп» не нужно."}]}, "reply": {"label": "Запрос с ответом", "small": "Count и oneshot", "steps": [{"cols": [{"h": "Клиент", "items": [{"t": "rx: ждёт ответа", "s": "a"}]}, {"h": "Ящик (mpsc)", "items": [{"t": "Like(1)", "s": "b"}, {"t": "Count{post:1, reply: tx}", "s": "a"}]}, {"h": "Актор: likes", "items": [{"t": "{}", "s": ""}]}], "v": {"k": "info", "t": "Свой одноразовый канал на каждый вопрос"}, "cap": "Клиент создал пару <code>oneshot::channel()</code>: отправитель <code>tx</code> уехал внутри команды, получатель <code>rx</code> остался у клиента. Чужой ответ по этому каналу прийти не может."}, {"cols": [{"h": "Клиент", "items": [{"t": "rx: ждёт ответа", "s": "a"}]}, {"h": "Ящик (mpsc)", "items": [{"t": "Count{post:1, reply: tx}", "s": "a"}]}, {"h": "Актор: likes", "items": [{"t": "{1: 1}", "s": "ok"}]}], "v": {"k": "info", "t": "Like разобран раньше вопроса"}, "cap": "Порядок в очереди сохранён: <code>Like(1)</code> лежал впереди <code>Count</code>, поэтому в ответ попадёт уже учтённый лайк."}, {"cols": [{"h": "Клиент", "items": [{"t": "rx: ждёт ответа", "s": "a"}]}, {"h": "Ящик (mpsc)", "items": []}, {"h": "Актор: likes", "items": [{"t": "{1: 1}", "s": "ok"}, {"t": "reply.send(1)", "s": "a"}]}], "v": {"k": "info", "t": "Актор отвечает"}, "cap": "Актор разобрал <code>Count</code> и вызвал <code>reply.send(1)</code>. Он ответил и пошёл дальше к следующей команде, а не стал ждать, получил ли клиент ответ."}, {"cols": [{"h": "Клиент", "items": [{"t": "rx получил 1", "s": "ok"}]}, {"h": "Ящик (mpsc)", "items": []}, {"h": "Актор: likes", "items": [{"t": "{1: 1}", "s": "ok"}]}], "v": {"k": "ok", "t": "Клиент получил свой ответ"}, "cap": "Клиент дождался <code>rx.await</code> и получил <code>Ok(1)</code>. Ответ принадлежит именно этому вопросу."}, {"cols": [{"h": "Клиент", "items": [{"t": "rx выброшен (таймаут)", "s": "gone"}]}, {"h": "Ящик (mpsc)", "items": []}, {"h": "Актор: likes", "items": [{"t": "reply.send(1) вернул Err", "s": "bad"}, {"t": ".unwrap() = паника, актор умер", "s": "bad"}]}], "v": {"k": "bad", "t": "А если клиент ушёл, не дождавшись?"}, "cap": "Ушедший клиент выбросил <code>rx</code>, поэтому <code>send</code> у актора возвращает <code>Err</code>. Это не авария, а обычная жизнь. Если на этом месте стоит <code>unwrap</code>, один нетерпеливый клиент остановит актора для всех. Пиши <code>let _ = reply.send(..)</code>."}]}};
const KEYS = Object.keys(MODES);
let mode = KEYS[0], pos = 0, timer = null;
const $ = id => document.getElementById(id);
function view(s) {
  const cols = s.cols.map(c => {
    const items = c.items.length ? c.items.map(i => `<span class="chip ${i.s || ""}">${i.t}</span>`).join("") : `<span class="empty">пусто</span>`;
    return `<div class="col"><h2>${c.h}</h2>${items}</div>`;
  }).join("");
  return `<div class="cols">${cols}</div><div class="verdict ${s.v.k}">${s.v.t}</div>`;
}
function render() {
  const steps = MODES[mode].steps, s = steps[pos];
  $("view").innerHTML = view(s);
  $("caption").innerHTML = s.cap;
  $("counter").textContent = `шаг ${pos} из ${steps.length - 1}`;
  const end = pos >= steps.length - 1;
  $("step").disabled = end; $("play").disabled = end;
  if (end) stop();
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } $("play").textContent = "Играть"; }
function step(){ if (pos < MODES[mode].steps.length - 1) { pos++; render(); } }
function setMode(m){ stop(); mode = m; pos = 0; document.querySelectorAll(".mode").forEach(b => b.classList.toggle("on", b.dataset.m === m)); render(); }
$("modes").innerHTML = KEYS.map(k => `<button class="mode ${k === mode ? "on" : ""}" data-m="${k}">${MODES[k].label}<small>${MODES[k].small}</small></button>`).join("");
document.querySelectorAll(".mode").forEach(b => b.onclick = () => setMode(b.dataset.m));
$("step").onclick = () => { stop(); step(); };
$("play").onclick = () => { if (timer) { stop(); return; } $("play").textContent = "Пауза"; timer = setInterval(step, 1800); };
$("reset").onclick = () => setMode(mode);
render();
</script>
</body>
</html>
