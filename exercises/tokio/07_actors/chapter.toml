[[exercises]]
name = "act1"
style = "todo"
hint.ru = [
  """Нужен канал `mpsc` и цикл `while let Some(cmd) = rx.recv().await` внутри `tokio::spawn`. Таблица живёт в локальной переменной задачи, больше нигде.""",
  """`recv()` вернёт `None`, когда закрыты все отправители: тут цикл кончается, и задача может вернуть таблицу как результат `async move`-блока. Для `Unlike` смотри на `get_mut`: что делать, когда записи нет и когда счётчик дошёл до нуля.""",
]
why.ru = """Состояние живёт внутри задачи, и менять его может только она, так что замок не нужен вообще. Цикл `while let Some(..) = rx.recv().await` заканчивается сам, когда закрыт последний отправитель, и таблица уходит в `JoinHandle` как обычное возвращаемое значение. Ловушка в `Unlike`: счётчик `u32` ниже нуля не уходит, а запись без лайков лучше удалить, иначе таблица копит мёртвые нули."""

[[exercises]]
name = "act2"
style = "todo"
hint.ru = [
  """У команды `Count` есть поле для ответа. Значит, на каждый вопрос создаётся своя пара `oneshot::channel()`: отправитель уезжает в команде, получатель остаётся ждать у спросившего.""",
  """Актор отвечает через `reply.send(..)`, а `send` возвращает `Result`: подумай, что значит `Err`, когда получатель уже уничтожен, и стоит ли из-за этого падать. В `likes_of` у обеих операций (отправить вопрос, дождаться ответа) есть своя ошибка, обе превращаются в `None`.""",
]
why.ru = """Запрос с ответом это команда с `oneshot::Sender` внутри: каждый вопрос получает свой канал, и перепутать ответы нельзя. Ошибка у `reply.send` значит «спросивший уже не слушает», и это нормальная жизнь (таймаут, отмена), так что актор игнорирует её, иначе один ушедший клиент остановил бы всем лайки. Тот же принцип у `likes_of`: мёртвый актор это `None`, а не паника, потому что вызывающий не виноват, что актора остановили."""

[[exercises]]
name = "act_q1"
kind = "question"
style = "bughunt"
question.ru = """Актор удваивает числа, клиент отправил один запрос и передумал ждать. Потом он отправляет второй.
Что произойдёт на строке с `let sent`? Рантайм однопоточный, `yield_now` даёт актору поработать.

```rust
async fn actor(mut rx: mpsc::Receiver<(u32, oneshot::Sender<u32>)>) {
    while let Some((n, reply)) = rx.recv().await {
        reply.send(n * 2).unwrap();
    }
}

let (tx, rx) = mpsc::channel(4);
tokio::spawn(actor(rx));

let (reply, answer) = oneshot::channel();
tx.send((1, reply)).await.unwrap();
drop(answer);
tokio::task::yield_now().await;

let (reply2, answer2) = oneshot::channel();
let sent = tx.send((2, reply2)).await;
```"""
options.ru = ["`sent` это `Ok`, и `answer2` вернёт `Ok(4)`", "`sent` это `Err`: актор уже не работает", "`sent` это `Ok`, но `answer2` вернёт ошибку", "`send` зависнет навсегда: очередь актора переполнена"]
answer = [1]
explain.ru = """Пока актор отвечал на первый запрос, получатель уже был выброшен, и `reply.send(..)` вернул `Err`. `unwrap` превратил его в панику, а паника убила задачу актора вместе с приёмником очереди. Поэтому второй `send` получает `Err`. Проверено запуском. Лечится так: ошибку ответа актор игнорирует (`let _ = reply.send(..)`), потому что «клиент ушёл» это нормальная жизнь."""
hint.ru = """Что делает `send` у `oneshot`, если получателя уже нет, и во что превращает это `unwrap`?"""

[[exercises]]
name = "act3"
style = "scratch"
hint.ru = [
  """`Bookmarks` хранит только отправителя команд, `mpsc::Sender<Cmd>`. Он сам умеет `Clone`, поэтому и обёртка может выводить `Clone`. Актор запускается в `start`: создай канал и отдай приёмник готовой функции `actor`.""",
  """Каждый метод делает одно и то же: создаёт `oneshot::channel()`, отправляет нужную команду вместе с отправителем ответа и ждёт `answer.await`. Когда актор остановлен, обе операции вернут ошибку; пока что достаточно `expect` с понятным текстом.""",
]
why.ru = """Handle скрывает три вещи: канал, тип команд и протокол «команда плюс oneshot». Снаружи остаются обычные асинхронные методы, которые можно звать из любой задачи, потому что `Sender` дёшево клонируется, а клоны шлют в один и тот же ящик. `expect` здесь осознанный: пока актор в этой программе не останавливают, его исчезновение это ошибка программиста. Что делать, когда остановка нормальна, мы разберём в следующей задаче."""

[[exercises]]
name = "act4"
style = "fix"
hint.ru = [
  """Первая беда: канал закрывается, когда исчезает последний `Sender`. Подумай, кто ещё его держит. Вторая: `unwrap` на ошибке отправки паникует вместо того, чтобы вернуть `Err`.""",
  """Актору не нужен сильный `Sender` на самого себя. У `mpsc::Sender` есть `downgrade()`, он даёт слабую ссылку, которая канал не держит; `upgrade()` у неё возвращает `Option`. Для ошибок: у `send` и у `oneshot`-приёмника есть `map_err`.""",
]
why.ru = """Актор, который шлёт команды себе, держит собственный `Sender`, и канал уже никогда не закроется: «последний Handle» теперь он сам. Лечится слабой ссылкой: `downgrade()` не считается отправителем, а `upgrade()` в нужный момент вернёт `None`, если все настоящие владельцы ушли. Вторая половина урока про границу актора: пока актор есть, методы Handle отвечают; когда его нет, честный ответ это `Err`, а не паника у вызывающего."""

[[exercises]]
name = "act5"
style = "todo"
hint.ru = [
  """`mpsc::Receiver` нельзя клонировать, а `recv` требует `&mut`. Чтобы несколько воркеров брали из одной очереди, приёмник кладут под замок и делят через `Arc`. Какой `Mutex` нужен, если замок надо держать через `.await`?""",
  """Замок асинхронный (`tokio::sync::Mutex`). Воркер в цикле берёт замок, ждёт `recv()` и сразу отпускает замок; результаты он складывает в общий вектор под обычным `std::sync::Mutex`, потому что там `.await` нет. Закрытая очередь (`None`) значит «пора выходить».""",
]
why.ru = """У `mpsc` один получатель, поэтому пул из N воркеров делит его через `Arc<tokio::sync::Mutex<Receiver>>`: воркер берёт замок, дожидается задания, отпускает замок. Замок асинхронный, потому что его держат через `.await` на `recv`. Очередь закрывается сразу после загрузки (`drop(tx)`), и воркеры выходят, когда она опустела: никакой отдельной команды «стоп» не нужно. В следующей задаче посмотрим, как это же устройство тихо превращается в одного воркера из N."""

[[exercises]]
name = "act6"
style = "fix"
hint.ru = [
  """Результаты правильные, время неправильное: такое бывает, когда что-то держит воркеров друг за другом. Что общее у всех четырёх воркеров? Только очередь и её замок. Как долго живёт охранник замка в строке `while let Some(job) = queue.lock().await.recv().await`?""",
  """Временные значения из условия `while let` живут до конца всего тела цикла. Охранник замка заодно с ними: пока первый воркер выполняет задание, остальные ждут замок. Нужно взять задание в отдельной инструкции, чтобы охранник умер сразу после неё.""",
]
why.ru = """Охранник замка получен в выражении `queue.lock().await.recv().await`, и временные значения в заголовке `while let` живут до конца тела цикла, то есть всё время работы над заданием. Воркеры выстраиваются в очередь за замком, и из N трудится один. Лечится отдельной инструкцией `let next = queue.lock().await.recv().await;`: охранник умирает в конце строки, `resize` идёт уже без замка. Тест с одним долгим заданием важен: он ловит и половинчатое решение, в котором замок отпускается слишком поздно."""

[[exercises]]
name = "act_q2"
kind = "question"
style = "bughunt"
question.ru = """Три воркера делят очередь из шести заданий, каждое занимает 100 мс (`work(job).await`).
В каких вариантах цикла воркера все три работают одновременно? Выбери все.

```rust
// 0
while let Some(job) = rx.lock().await.recv().await {
    work(job).await;
}

// 1
loop {
    let job = rx.lock().await.recv().await;
    match job {
        Some(job) => work(job).await,
        None => break,
    }
}

// 2
loop {
    let mut queue = rx.lock().await;
    let Some(job) = queue.recv().await else { break };
    drop(queue);
    work(job).await;
}

// 3
while let Some(job) = {
    let mut queue = rx.lock().await;
    queue.recv().await
} {
    work(job).await;
}
```"""
options.ru = ["0", "1", "2", "3"]
answer = [1, 2, 3]
explain.ru = """В варианте 0 охранник замка это временное значение в заголовке `while let`, и оно живёт до конца тела цикла: пока один воркер работает, остальные ждут замок. Результат 600 мс вместо 200. В варианте 1 охранник умирает в конце инструкции `let`, в варианте 2 его выбрасывают явно, в варианте 3 он остаётся в локальной переменной блока и умирает вместе с блоком. Во всех трёх работа идёт без замка: 200 мс. Проверено запуском на замороженном времени."""
hint.ru = """Где в каждом варианте умирает охранник замка: до `work` или после?"""

[[exercises]]
name = "act7"
style = "scratch"
hint.ru = [
  """Один общий приёмник даёт «кто успел, тот и взял» и портит порядок. Вместо него каждому воркеру нужна своя очередь, а `send` должен выбирать очередь по пользователю. Как из `user` получить индекс воркера, чтобы один и тот же пользователь всегда давал один и тот же индекс?""",
  """Список отправителей `Vec<mpsc::Sender<Notification>>` и по одной задаче `deliver` на каждый. Индекс воркера считай от `user` (остаток от деления на число воркеров подойдёт). Чтобы `finish` дождался доставки, сначала выброси отправителей (очереди закроются), потом дождись всех `JoinHandle`.""",
]
why.ru = """Порядок для одного пользователя гарантирует только одна очередь с одним получателем, а параллельность между пользователями даёт то, что очередей несколько. Ключ (`user % workers`) всегда указывает на одного и того же воркера, поэтому два уведомления одного пользователя не могут обгонять друг друга, а разные пользователи обслуживаются одновременно. Цена: если один пользователь шумит, его воркер загружен сильнее остальных. `finish` закрывает очереди и ждёт, а не прерывает: то, что уже отправлено, должно дойти."""

[[exercises]]
name = "act_q3"
kind = "question"
style = "bughunt"
question.ru = """Рассылка уведомлений идёт через четыре воркера, воркер выбирается как `user % 4`, внутри воркера
порядок сохраняется. Нагрузка выросла, и пул без остановки расширили до пяти воркеров:
теперь выбор `user % 5`. Что может случиться с пользователем 7, у которого в очереди воркера 3
(`7 % 4`) уже лежат необработанные уведомления?

Выбери все верные утверждения."""
options.ru = ["Новые уведомления пользователя 7 пойдут воркеру 2 (`7 % 5`) и могут обработаться раньше старых из очереди воркера 3", "Порядок сохранится: каждый воркер всё равно разбирает свою очередь по порядку", "Старые уведомления из очереди воркера 3 пропадут, потому что воркер больше не отвечает за пользователя 7", "Чтобы порядок не ломался, перед сменой правила надо дождаться, пока старые очереди опустеют"]
answer = [0, 3]
explain.ru = """Порядок для пользователя гарантирует не «каждый воркер по порядку», а то, что один и тот же пользователь всегда попадает в один и тот же воркер. Правило `user % 5` для пользователя 7 даёт другого воркера, и старая очередь разбирается параллельно с новой, так что новое уведомление может обогнать старое. Ничего не пропадает: очередь воркера 3 живёт своей жизнью. Безопасная смена правила требует паузы: дождаться, пока старые очереди опустеют, или копить новые события, пока это не произойдёт."""
hint.ru = """Что именно гарантирует разбиение по ключу: порядок внутри воркера или постоянство выбора воркера?"""

[[exercises]]
name = "act8"
style = "todo"
hint.ru = [
  """Читатель один, источников много: каждому источнику нужно по своему отправителю в один и тот же канал. Как получить несколько отправителей одного приёмника? И вспомни, когда закрывается приёмник.""",
  """Каждый источник живёт в своей задаче со своим клоном `Sender`. Приёмник вернёт `None`, когда выброшены все отправители, значит исходный `tx` тоже должен исчезнуть, а не остаться где-то жить.""",
]
why.ru = """Fan-in это много отправителей и один получатель: канал `mpsc` создан именно под такое. Источники запускаются каждый в своей задаче, поэтому ждут одновременно, а общее время равно времени самого медленного. Поток заканчивается сам, когда выброшены все клоны `Sender`, включая оригинал. Забытый оригинал (держит его, например, функция, которая ещё и читает) это классическая причина «поток никогда не кончается»."""

[[exercises]]
name = "act9"
style = "todo"
hint.ru = [
  """Каждая стадия это задача, у каждой пары соседей свой канал. Размер очереди и есть та ручка, что держит источник за руку: что делает `send` в полной очереди?""",
  """Три канала `mpsc::channel(..)` с маленькой ёмкостью (1 или 2). Закрытие идёт каскадом само: задача выходит из `while let`, её отправитель выбрасывается, и следующая стадия видит `None`. В обратную сторону тот же каскад работает через ошибку `send`: не игнорируй её, выходи из цикла.""",
]
why.ru = """Ограниченные каналы превращают медленного читателя в тормоз для всей цепочки: когда последняя очередь полна, третья стадия застревает в `send`, за ней вторая и источник. Память растёт не больше чем на сумму ёмкостей. Закрытие идёт каскадом вперёд (кончились номера, значит закрыт следующий канал) и назад (читатель ушёл, значит `send` вернул ошибку). Ошибку `send` нельзя проглатывать: тогда ушедшего читателя никто не заметит и цепочка будет вхолостую считать до конца."""

[[exercises]]
name = "act_q4"
kind = "question"
style = "bughunt"
question.ru = """Конвейер из трёх стадий: источник, вторая стадия, читатель. Каналы между ними ограниченные.
Вторая стадия паникует на числе 3, остальные написаны корректно (ошибки `send` не игнорируют,
выходят из цикла). Что произойдёт? Выбери все верные утверждения.

```rust
tokio::spawn(async move {                 // вторая стадия
    while let Some(n) = a_rx.recv().await {
        if n == 3 { panic!("стадия упала"); }
        if b_tx.send(n).await.is_err() { break; }
    }
});
```"""
options.ru = ["Читатель получит значения 0, 1, 2 и затем `None`: канал закроется, когда задача второй стадии умрёт", "Читатель будет ждать вечно, пока кто-нибудь не закроет канал вручную", "Источник на ближайшем `send` получит `Err` и остановится", "Источник дойдёт до конца и никто не заметит потери"]
answer = [0, 2]
explain.ru = """Паника завершает задачу, а при этом уничтожаются её локальные переменные, включая `b_tx` и `a_rx`. Читатель видит закрытый канал и получает `None` после значений 0, 1, 2. Источник пытается отправить следующее число в закрытый канал и получает `Err`, на котором выходит из цикла. Так закрытие каналов выстраивает каскад в обе стороны. Проверено запуском."""
hint.ru = """Что происходит с `Sender` и `Receiver`, когда задача, которая ими владеет, умирает?"""

[[exercises]]
name = "act10"
style = "todo"
hint.ru = [
  """Ответ приходит в один общий канал, а ждут его разные задачи. Каждому запросу нужен свой личный канал для ответа, а общий читатель должен знать, чей это ответ. Где хранить соответствие «номер запроса, ждущий»?""",
  """Таблица `HashMap<u64, oneshot::Sender<String>>` под `std::sync::Mutex` (`await` внутрь замка не попадает). `call` берёт номер, кладёт в таблицу отправителя, шлёт запрос и ждёт получателя. Отдельная задача читает ответы и забирает запись из таблицы по номеру. А что должно случиться с таблицей, когда ответов больше не будет?""",
]
why.ru = """Мультиплексор превращает одно соединение в общую линию: у запроса есть номер, номеру в таблице соответствует одноразовый канал, а одна задача-читатель раздаёт ответы. Замок над таблицей короткий и без `.await` внутри, поэтому обычный `std::sync::Mutex` подходит. Самое тихое место: когда читатель вышел (соединение закрыто), надо очистить таблицу, иначе отправители `oneshot` продолжают жить в ней, и ждущие вызовы висят вечно. И проверка `send` в `call`: если линия мертва, запись убирается сразу."""

[[exercises]]
name = "act11"
style = "fix"
hint.ru = [
  """Запись убирается в двух местах: читателем, когда ответ пришёл, и в ветке ошибки отправки. А что, если ожидание просто оборвали, не дойдя ни до одного из этих мест? Future при отмене не выполняет остаток кода, но уничтожает свои локальные переменные.""",
  """Заведи небольшую структуру-охранник, которая знает таблицу и номер и убирает запись в `Drop`. Создай её сразу после вставки в таблицу, чтобы любая отмена после этого момента была покрыта. Двойное удаление (читатель уже забрал запись) безвредно: `remove` просто ничего не найдёт.""",
]
why.ru = """Отмена future означает «остаток кода не выполнится», но переменные будут уничтожены, поэтому единственное надёжное место для уборки это `Drop` охранника. Охранник создаётся сразу после вставки в таблицу: что бы ни случилось дальше (таймаут, `select!`, `abort`), запись уйдёт. Что читатель тоже удаляет запись, не страшно: повторный `remove` ничего не делает. Такая утечка не видна ни в одном тесте «счастливого пути» и проявляется только в проде, когда клиентов с таймаутами много."""

[[exercises]]
name = "act_q5"
kind = "question"
style = "bughunt"
question.ru = """Таблица ожидающих ответов в мультиплексоре: запись создаётся в первом опросе `call`, удаляется читателем,
когда ответ пришёл. Других очисток нет. В каких случаях запись останется в таблице навсегда? Выбери все.

```rust
let reply = mux.call("запрос");          // future создан, но не опрашивался
```"""
options.ru = ["Ответ пришёл вовремя, читатель выдал его ждущему", "Вызывающий упёрся в `tokio::time::timeout`, ответа сервер не прислал", "Задачу, которая ждёт ответа, остановили через `abort()`", "Future вызова создали (`let reply = mux.call(..)`), но ни разу не ожидали и выбросили"]
answer = [1, 2]
explain.ru = """Запись появляется только при опросе future. Если его вообще не опрашивали (вариант 3), записи нет и чистить нечего. Если ответ пришёл (вариант 0), запись забирает читатель. А вот таймаут и `abort` обрывают ожидание после вставки в таблицу: код после `.await` не выполнится, и убрать запись некому. Именно эти два случая закрывает охранник с `Drop`."""
hint.ru = """В какой момент создаётся запись, и какой код выполняется при отмене future?"""

[[exercises]]
name = "act12"
style = "todo"
hint.ru = [
  """Два вопроса: сколько соединений на руках (счётчик с ожиданием: `Semaphore`) и какие именно свободны (`Vec<Conn>` под `Mutex`). Разрешение семафора и соединение связаны: пока есть разрешение, в списке есть соединение. Что сделает `Lease`, когда его выбросят?""",
  """`Lease` держит соединение (`Option<Conn>`, чтобы его можно было забрать в `Drop`), ссылку на список свободных и `OwnedSemaphorePermit`. В `Drop::drop` соединение кладётся обратно в список. Разрешение отпустится само, когда уничтожится его поле, а поля уничтожаются после `drop`. Для `get_timeout` пригодится `tokio::time::timeout`.""",
]
why.ru = """Пул это семафор плюс список: семафор считает свободные места и умеет ждать, список хранит сами соединения. Возврат делает `Drop` охранника, поэтому он работает и при досрочном выходе, и при панике. Порядок важен: сначала `drop` кладёт соединение в список, потом (при уничтожении полей) отпускается разрешение. Если бы разрешение отпустилось первым, другой ожидающий успел бы получить его и найти список пустым. Отменённый `get` ничего не теряет: разрешение выдаёт только завершившийся `acquire`."""

[[exercises]]
name = "act13"
style = "todo"
hint.ru = [
  """Периодический таймер не подходит: он тикает независимо от значений, и срок пачки считается не с её начала. Нужен срок, который заводится на первом значении пачки и сбрасывается после отправки.""",
  """Храни `Option<Instant>` с моментом, когда пачку надо отправить. Пока пачка пуста, ждёшь просто `recv()`. Пока в ней что-то есть, ждёшь `recv()` с ограничением по этому моменту (подойдёт `timeout_at`). Таймаут значит «отправить то, что есть».""",
]
why.ru = """Срок пачки заводится на её первом значении, поэтому он `Option<Instant>`: пустая пачка не ждёт ничего, непустая ждёт либо значения, либо момент. Такой же эффект можно получить `select!` с закреплённым `sleep`, но `timeout_at` короче. Отправка полной пачки сбрасывает срок, иначе следующая пачка уйдёт раньше положенного. Периодический `interval` кажется естественным, но пачки получаются нерегулярного размера, а значение может ждать почти два периода."""

[[exercises]]
name = "act_q6"
kind = "question"
style = "bughunt"
question.ru = """Пакетировщик с `max = 4` и `wait = 100 мс`, срок отсчитывается от первого значения пачки.
Значения приходят в моменты 0, 30, 60, 120 и 125 мс. Когда уходят пачки и что в них?"""
options.ru = ["В 100 мс пачка из трёх значений, в 220 мс пачка из двух", "В 60 мс пачка из трёх значений, в 125 мс пачка из двух", "В 100 мс пачка из трёх значений, в 200 мс пачка из двух (срок второй пачки считается с момента ухода первой)", "В 125 мс пачка из пяти значений"]
answer = [0]
explain.ru = """Срок первой пачки заводится на значении в 0 мс и истекает в 100 мс; к этому времени в ней три значения. Четвёртое значение (120 мс) начинает новую пачку со своим сроком: 120 + 100 = 220 мс. Пятое значение (125 мс) присоединяется к ней, и пачка уходит в 220 мс. Во втором варианте пачка уходит раньше срока без причины, в третьем срок второй пачки отсчитан от ухода первой, а не от её первого значения, в четвёртом все пять значений слиплись в одну пачку, хотя первая уже ушла."""
hint.ru = """Когда начинается отсчёт у второй пачки: в момент ухода первой или в момент появления её первого значения?"""

[[exercises]]
name = "act14"
style = "fix"
hint.ru = [
  """Две разные беды. Первая: что происходит с тем, что лежит в буфере, когда `recv` вернул `None`? Вторая: когда именно отсчитывается `every` в этой схеме и когда по условию должен?""",
  """Сразу после цикла проверь буфер. А вместо `interval` нужен срок, который заводится на первом событии пачки и снимается после записи (как в `batcher`): `Option<Instant>` и `timeout_at` на `recv`.""",
]
why.ru = """Первая ошибка в самом частом месте любого пакетировщика: выход из цикла по закрытию канала обходит запись остатка. Правило такое: пакетировщик, который копит, обязан иметь явный код «слить остаток» на пути выхода. Вторая ошибка в том, что `interval` тикает по часам, а не от первого события: событие, пришедшее за миг до тика, уходит одно. Срок, заведённый на первом событии пачки, даёт пачки нужного размера и гарантию «не дольше every»."""

[[exercises]]
name = "act_store"
kind = "project"
style = "scratch"
quiz = true
locked = ["crates/acceptance/tests/acceptance.rs"]
hint.ru = [
  """Начни с границы: `Store` держит `mpsc::Sender` команд и `broadcast::Sender` событий, а `start` запускает две задачи: актора с постами и писателя на диск. Команды актору это `enum` с `oneshot`-ответами, как в act3.""",
  """Актор после каждой публикации шлёт пост в `broadcast` (ошибка отправки без подписчиков не должна ничего ломать) и в отдельный ограниченный канал писателю. Писатель это пакетировщик из act13 и act14 с остатком при закрытии канала.""",
  """`Runner::finish` ждёт обе задачи по очереди: сначала актора (он кончается, когда выброшены все `Store`), потом писателя (он кончается, когда актор выбросил свой `Sender` и писатель слил остаток).""",
]
why.ru = """Хранилище на акторе совмещает всё из главы: состояние у одной задачи (никаких замков над постами), `Handle` с асинхронными методами, подписки через `broadcast` и пакетная запись в отдельной задаче, чтобы медленный диск не тормозил публикацию. Закрытие идёт каскадом: выброшены все `Store`, актор выходит, писатель видит закрытую очередь и сливает хвост. Тесты на замороженном времени проверяют размер и время отправки пачек, а не только итог, поэтому периодический таймер и потерю остатка они ловят сразу."""
