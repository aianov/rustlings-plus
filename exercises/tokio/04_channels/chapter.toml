[[exercises]]
name = "chn1"
style = "fix"
hint.ru = """Из-за чего компилятор жалуется на «use of moved value»? Подумай, куда уходит `tx` на первом обороте цикла."""
why.ru = """Sender в mpsc клонируется, и клон дёшев: счётчик ссылок, а не копия очереди. Каждая задача получает свой клон, а оригинал остаётся у тебя. Здесь количество сообщений известно заранее, поэтому цикл получателя считает до `workers`; про закрытие канала будут следующие задачи."""

[[exercises]]
name = "chn2"
style = "scratch"
hint.ru = [
  """Конец потока определяется не счётчиком, а закрытием канала. Когда `recv` вернёт `None`?""",
  """Канал закрыт, когда уничтожены все `Sender`. Клоны живут в задачах, а оригинал внутри `fan_in`: что с ним происходит при выходе из функции?""",
  """В `fan_in`: `let (tx, rx) = mpsc::channel(..)`, на каждый источник `tx.clone()` внутрь задачи, `rx` наружу. В `collect_all`: `while let Some(id) = rx.recv().await`.""",
]
why.ru = """Получатель не знает, сколько сообщений придёт, и не должен: об окончании говорит закрытие канала, то есть уход последнего отправителя. Поэтому клоны уезжают в задачи (`move`), а оригинал умирает при выходе из `fan_in` автоматически, и дальше канал закроется сам, когда досылает последняя задача. Тест на пустой набор источников ловит решения, которые рассчитывают сообщения заранее."""

[[exercises]]
name = "chn3"
style = "bughunt"
hint.ru = [
  """Кто ещё держит `Sender` в тот момент, когда `collect` ждёт новых сообщений? Посмотри на поля `Report`.""",
  """`collect` владеет `self`, значит, может распорядиться и полем `tx`. Оно нужно только для `writer`, а к моменту сбора писателей больше не будет.""",
  """В начале `collect` уничтожь свой отправитель, а потом читай. Менять `new` и `writer` не надо.""",
]
why.ru = """Классическое зависание: структура хранит оригинальный Sender «на всякий случай» вместе с Receiver, и канал никогда не закрывается, потому что один из отправителей живёт рядом с получателем. Лечение в точке, где ты принимаешь решение «больше писателей не будет»: `drop(self.tx)` перед циклом. Переделка в `Option<Sender>` и `take()` тоже работает; удалить поле и клонировать из `new` нельзя, `writer` перестанет работать."""

[[exercises]]
name = "chn_q1"
kind = "question"
style = "bughunt"
question.ru = '''Приёмник читает `while let Some(x) = rx.recv().await {}` после каждого фрагмента. Один клон `tx2` уже ушёл в задачу, которая отправляет и завершается. Какие фрагменты оставят цикл ждать вечно? Выбери все.

```rust
let (tx, mut rx) = mpsc::channel::<u32>(4);
let tx2 = tx.clone();
tokio::spawn(async move { tx2.send(1).await.unwrap(); });
// ВСТАВКА, потом цикл приёмника
```'''
options.ru = [
  "drop(tx);",
  "let _ = tx;",
  "let _keep = tx;",
  "tokio::spawn(async move { drop(tx) });",
  "(ничего не вставлять)",
]
answer = [1, 2, 4]
explain.ru = """`let _ = tx;` ничего не забирает: шаблон `_` не связывает значение, так что `tx` остаётся жить до конца области. `let _keep = tx;` перемещает значение в переменную, которая живёт до конца области, то есть дольше цикла. Без вставки `tx` тоже жив. Фрагменты 0 и 3 уничтожают оригинал (во втором его уничтожит задача), и цикл завершается. Проверено запуском."""
hint.ru = """Что именно уничтожает значение: перемещение в переменную, шаблон подчёркивания или явный drop?"""

[[exercises]]
name = "chn4"
style = "todo"
hint.ru = [
  """Производитель должен ждать, когда очередь полна. Какой метод отправки умеет ждать?""",
  """Нужен ограниченный канал с вместимостью `capacity`, отправка `send(..).await`, а базу запусти отдельной задачей, чтобы производитель и она работали одновременно.""",
  """`let (tx, rx) = mpsc::channel(capacity); let sink = tokio::spawn(slow_sink(rx, probe));` потом цикл `send`. Чтобы база закончила, закрой канал и дождись задачу.""",
]
why.ru = """Backpressure получается сам собой, если очередь ограничена, а отправка ждёт: производитель идёт со скоростью получателя, и очередь не длиннее `capacity`. Тест ловит три ленивых решения: огромный буфер (пик больше вместимости), `try_send` без проверки (потеря записей) и забытое ожидание базы (feed возвращается раньше времени). Не забываем закрыть канал, иначе база будет ждать вечно."""

[[exercises]]
name = "chn5"
style = "todo"
hint.ru = [
  """У `Sender` есть метод, который никогда не ждёт. Что он возвращает, когда очередь полна?""",
  """`try_send` возвращает `Result<(), TrySendError<T>>`, и у ошибки два варианта: `Full(T)` и `Closed(T)`. Сопоставь их с `Outcome`.""",
  """Счётчик увеличивай только в ветке `Full`.""",
]
why.ru = """Метод `report` вызывают из обработчика запросов, и его задержка прямо превращается в задержку пользователю, поэтому ждать он не вправе. Выброшенная метрика считается, чтобы потери были видны. `Closed` отделён от `Full`: «очередь полна» может пройти сама, «получателя нет» не пройдёт никогда, и смешивать их в одном счётчике значит скрывать аварию за нагрузкой."""

[[exercises]]
name = "chn6"
style = "bughunt"
hint.ru = [
  """Где в конвейере очередь может расти без предела? Посмотри на тип канала между стадиями.""",
  """Неограниченный `send` не ждёт, поэтому быстрая стадия вырывается вперёд и давление до входа не доходит. Ограничение должно быть у каждого звена.""",
  """Замени канал между стадиями на ограниченный с маленькой вместимостью (две-четыре записи) и поправь типы в обеих стадиях. `send` теперь с `.await`.""",
]
why.ru = """Ограничение работает, пока оно непрерывно: стоит одной ступени быть неограниченной, и вся очередь, которую не пустила первая ступень, копится на ней. Багу не видно при малой нагрузке, потому что очередь пуста; тест создаёт нагрузку и смотрит на пик. Размер буфера между стадиями выбирают малым: он сглаживает скачки, а не хранит запас."""

[[exercises]]
name = "chn7"
style = "scratch"
hint.ru = [
  """Ошибка `send` возвращает не только факт неудачи, но и кое-что ещё. Что именно лежит в `SendError`?""",
  """`SendError(item)` отдаёт сообщение обратно: это поле `err.0`. После неудачи продолжай читать `input` до его закрытия, но уже не отправляй, а складывай в архив.""",
  """Для `wait_until_closed` у Sender есть метод `closed()`: он завершается, когда получатель ушёл.""",
]
why.ru = """Недоставленное сообщение не исчезает: оно возвращается в `SendError`, и его надо сохранить первым в архиве, иначе потеряется именно то, на котором отправка не удалась (тест сравнивает объединение доставленного и недоставленного со всем входом). Остальные сообщения из `input` тоже нельзя бросать. `closed()` будит ровно в момент ухода получателя, а опрос с шагом реагирует с опозданием, на что тест тоже смотрит."""

[[exercises]]
name = "chn8"
style = "scratch"
hint.ru = [
  """Запрос несёт в себе половинку oneshot-канала, а клиент ждёт на второй. Какие три разных способа не получить ответ есть?""",
  """`server.send(..)` проваливается, если сервис не принимает запросы. `answer.await` даёт `Err`, если ответчик выбросил запрос, не ответив. И ещё срок: оберни ожидание ответа в `timeout`.""",
  """`timeout(wait, answer).await` даёт `Result<Result<String, RecvError>, Elapsed>`: разбери оба слоя. В `serve` результат `reply.send(..)` не разворачивай через `unwrap`, а считай ошибки.""",
]
why.ru = """У oneshot две разные поломки: отправитель умер без ответа (получатель видит `RecvError`) и получатель ушёл раньше ответа (отправитель получает своё значение назад в `Err`). Обе нужно различать и обрабатывать, а не `unwrap`-ить: клиенты уходят по таймауту постоянно, и сервис не должен из-за этого падать. Сервис при этом всё равно доделывает работу: таймаут клиента её не отменяет, об этом и говорит счётчик потерянных ответов."""

[[exercises]]
name = "chn_q2"
kind = "question"
style = "bughunt"
question.ru = '''Клиент отправил запрос и ушёл по таймауту, то есть уничтожил `rx`. Сервис всё же закончил работу. Что напечатает сервис?

```rust
let (tx, rx) = oneshot::channel::<String>();
drop(rx);
println!("{:?}", tx.send("профиль".to_string()));
```'''
options.ru = [
  "Ok(())",
  "Err(\"профиль\")",
  "Err(RecvError)",
  "паника",
]
answer = [1]
explain.ru = """`oneshot::Sender::send` возвращает `Result<(), T>`: при неудаче значение возвращается вызывающему целиком, чтобы его не потерять. Получатель уже уничтожен, поэтому отправка не удалась. Паники нет, она бывает только если вызвать `unwrap` на этом `Err`, и вот этого сервису делать не надо. `RecvError` бывает у получателя, а не у отправителя."""
hint.ru = """У какой стороны oneshot-канала есть `RecvError`, и что возвращает `send` при неудаче?"""

[[exercises]]
name = "chn9"
style = "scratch"
hint.ru = [
  """Что именно клонирует broadcast при чтении, и можно ли сделать эту копию дешёвой?""",
  """Положи в канал `Arc<Post>`: копируется счётчик, а не тело. Подписчик получает тот же `Arc`.""",
  """`send` у broadcast возвращает ошибку, когда получателей нет вовсе: превращай её в ноль через `unwrap_or(0)`. В `next` разбери три исхода `recv`.""",
]
why.ru = """Broadcast клонирует значение для каждого получателя, поэтому тяжёлое сообщение оборачивают в `Arc`: рассылка остаётся дешёвой, сколько бы подписчиков ни было. Счётчик клонов в тесте ловит решение «отдать пост по значению» и «клонировать Post внутри next». Отсутствие подписчиков это нормальная ситуация, а не авария, поэтому `Err` из `send` не пробрасывается."""

[[exercises]]
name = "chn_q3"
kind = "question"
style = "bughunt"
question.ru = '''Буфер broadcast на два сообщения. Что напечатает программа (имена `rx1` и `rx2` разные получатели)?

```rust
let (tx, mut rx1) = broadcast::channel(2);
tx.send(1).unwrap();
tx.send(2).unwrap();
tx.send(3).unwrap();
let mut rx2 = tx.subscribe();
tx.send(4).unwrap();
println!("{:?} {:?}", rx1.recv().await, rx2.recv().await);
```'''
options.ru = [
  "Ok(3) Ok(4)",
  "Err(Lagged(2)) Ok(4)",
  "Ok(1) Ok(4)",
  "Err(Closed) Ok(4)",
]
answer = [1]
explain.ru = """В буфере на два места после четырёх отправленных остались 3 и 4. Первый получатель не прочитал ничего и отстал на два сообщения (1 и 2 затёрты), поэтому первым делом он получает `Lagged(2)`, а читать 3 будет уже следующим вызовом. Второй подписался после тройки и начинает с четвёрки. `Closed` не бывает: отправитель жив. Проверено запуском."""
hint.ru = """Что лежит в буфере на два места после четырёх отправок, и с какого сообщения начинает тот, кто подписался после третьей?"""

[[exercises]]
name = "chn10"
style = "bughunt"
hint.ru = [
  """Что делает `while let Ok(..) = rx.recv().await`, когда приходит ошибка `Lagged`?""",
  """У `RecvError` два варианта, и они значат разное: `Lagged(n)` означает «пропущено n, читай дальше», `Closed` означает «конец».""",
  """Разбери `recv` через `match` в цикле `loop`: `Ok` кладёт значение (и спит `delay`), `Lagged(n)` прибавляет к счётчику, `Closed` выходит.""",
]
why.ru = """Lagged это не авария, а штатное сообщение отстающему: он потерял n сообщений и может продолжать с самого старого из сохранённых. Выход из цикла по любой ошибке превращает единичную потерю в смерть подписчика. Тест с медленным потребителем проверяет баланс: прочитанные плюс пропущенные дают всё отправленное, то есть потери не просто переживаются, но и посчитаны, а самое свежее сообщение доходит всегда."""

[[exercises]]
name = "chn11"
style = "scratch"
hint.ru = [
  """Нужно отреагировать на текущее значение до первого ожидания, а потом ждать изменений. В каком порядке?""",
  """Читай через `borrow_and_update()`: он отдаёт значение и отмечает версию увиденной. Тогда следующий `changed()` не вернётся сразу.""",
  """Цикл: прочитай `*rx.borrow_and_update()`, добавь в список, `rx.changed().await`; при `Err` выходи.""",
]
why.ru = """Значение, которое уже менялось до старта воркера, должно быть обработано ровно один раз. Если читать через `borrow()`, версия остаётся «непрочитанной», и `changed()` тут же вернётся: дубль. Если сразу ждать `changed()`, не посмотрев на текущее, начальное значение пропадёт. `borrow_and_update` и `changed` вместе дают шаблон «прочитать, ждать, повторить». Пара `send(3)` и `send(4)` подряд схлопывается в одно пробуждение: watch хранит только последнее."""

[[exercises]]
name = "chn_q4"
kind = "question"
style = "bughunt"
question.ru = '''Канал watch, получатель ждёт `changed()` не дольше 50 мс. Что напечатает программа?

```rust
let (tx, mut rx) = watch::channel(10);
let first = timeout(Duration::from_millis(50), rx.changed()).await;
println!("{}", first.is_ok());
tx.send(10).unwrap();
let second = timeout(Duration::from_millis(50), rx.changed()).await;
println!("{}", second.is_ok());
```'''
options.ru = [
  "false, false",
  "false, true",
  "true, false",
  "true, true",
]
answer = [1]
explain.ru = """Начальное значение при создании канала считается увиденным, поэтому первое ожидание истекает по таймауту (`false`). А `send` всегда поднимает версию, даже если новое значение равно старому: `watch` версии не сравнивает значения. Так что второй `changed()` просыпается сразу (`true`). Если нужны отправки только при реальном изменении, сравнивай сам или используй `send_if_modified`."""
hint.ru = """Что считается увиденным в момент создания канала, и сравнивает ли send новое значение со старым?"""

[[exercises]]
name = "chn12"
style = "fix"
hint.ru = [
  """Что возвращает `borrow()`, и что компилятор не любит в этом типе?""",
  """`Ref` держит замок на чтение и не `Send`. Пока он жив через `.await`, future нельзя отправить в spawn, а отправитель не может записать новое значение. Нужно отпустить его до `.await`.""",
  """Скопируй весь баннер целиком (`Banner` умеет `Clone`) и работай с копией. Копия должна быть одна, чтобы строки не перемешались из разных версий.""",
]
why.ru = """`Ref` защищает значение замком, поэтому держать его через `.await` нельзя: future не `Send`, а отправитель встанет в очередь за читателем (в однопоточном рантайме это ещё и взаимная блокировка). Лечение: снять копию одним `.clone()` и сразу отпустить `Ref`. Копию делаем целиком, одним действием, иначе заголовок возьмётся от одной версии, а теги от другой: тест меняет баннер посреди публикации и сверяет журнал."""

[[exercises]]
name = "chn13"
style = "scratch"
hint.ru = [
  """Чтение, изменение и запись вместе должны быть одним шагом, иначе чужая запись между ними потеряется. Есть ли у Sender метод для такого изменения?""",
  """`send_modify` берёт замыкание над `&mut T` и сам уведомляет получателей. Для ожидания состояния у Receiver есть метод, который сначала проверяет текущее значение.""",
  """`rx.wait_for(|mode| *mode == Mode::Stopped).await` вернёт `Result<Ref, RecvError>`. Ref отпусти (`map(|_| ())`), а ошибку превращай в `SenderGone`.""",
]
why.ru = """Составное изменение «прочитал-прибавил-записал» через `borrow` и `send` теряет правки при гонке, а `send_modify` делает его под замком одним шагом. `wait_for` проверяет текущее значение до ожидания, поэтому не зависнет на уже наступившем состоянии, а цикл на голом `changed()` зависает. Если отправитель ушёл, не дождавшись условия, это ошибка, а не вечное ожидание."""

[[exercises]]
name = "chn14"
style = "scratch"
hint.ru = [
  """У Receiver есть метод, который забирает несколько сообщений за один вызов. Как он ведёт себя, если очередь пуста, и что возвращает на закрытом канале?""",
  """`recv_many(&mut buf, limit)` дописывает в `buf` (не очищает) и возвращает число добавленных. Ноль означает, что канал закрыт и пуст.""",
  """В цикле: очисти буфер, `recv_many`, при нуле выйди, иначе запиши копию буфера в `store`.""",
]
why.ru = """`recv_many` забирает то, что уже лежит, и не ждёт наполнения: одиночные сообщения пишутся сразу, а при нагрузке пачки сами растут до `max`. Это даёт выигрыш на записи без добавочной задержки (чего не даст «подождать, пока наберётся»). Вызов дописывает в буфер, поэтому его очищают на каждом обороте, а ноль, а не пустой буфер, служит признаком конца."""

[[exercises]]
name = "chn_event_bus"
style = "scratch"
quiz = true
hint.ru = [
  """Начни с типов: что лежит в `Bus` (отправитель команд, отправитель событий, отправитель лимита, хэндл ядра) и какие бывают команды. Потом ядро, потом остальное.""",
  """Ядро это цикл `while let Some(cmd) = commands.recv().await` с `sleep(work)` на каждую команду. Пост: сравни длину с `*max_len.borrow()` (в момент обработки), иначе увеличь счётчик, разошли `Arc<Event>`, ответь через oneshot. Ошибки `send` в события и в ответ игнорируй.""",
  """`shutdown`: достаточно уничтожить отправитель команд и дождаться хэндл ядра, ядро выйдет, когда дочитает очередь. Подписчики узнают о конце, когда уйдут все отправители событий, включая тот, что лежит в `Bus`. `try_follow` это `try_send`.""",
]
why.ru = """Каждый канал стоит там, где подходит по смыслу: команды идут через ограниченный mpsc (давление и порядок), ответ на публикацию через oneshot, события через broadcast с `Arc` (одна копия на всех, потери у отстающих видны как `Missed`), живой лимит через watch (читается в момент обработки, `Ref` не живёт через `.await`). Остановка тоже построена на правилах закрытия: ушли отправители команд, ядро доделало очередь и вернуло статистику, ушли отправители событий, подписчики увидели `Closed`. Ошибки отправки в события и в ответ игнорируются сознательно: нет подписчиков или клиент ушёл, это не авария."""
