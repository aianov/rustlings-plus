<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>watch: получатель видит только последнее значение</title>
<style>
:root { --bg:#f6f7f9; --panel:#fff; --ink:#1c2330; --muted:#667085; --line:#d5d9e0; --a:#2f6fed; --b:#d9822b; --ok:#2e9e5b; --bad:#d64545; --code:#f0f2f6; }
@media (prefers-color-scheme: dark) { :root { --bg:#12151b; --panel:#1b2029; --ink:#e6e9ef; --muted:#98a2b3; --line:#343b49; --a:#6b9bff; --b:#f0a85a; --ok:#4cc585; --bad:#ff7b7b; --code:#151a22; } }
* { box-sizing:border-box; }
body { margin:0; padding:16px; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
h1 { font-size:18px; margin:0 0 4px; } .sub { color:var(--muted); margin:0 0 12px; }
.modes { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
.mode { text-align:left; font:13px/1.4 ui-monospace,Menlo,monospace; padding:8px 12px; border-radius:8px; border:2px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer; }
.mode.on { border-color:var(--a); } .mode small { display:block; font:12px system-ui,sans-serif; color:var(--muted); }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:10px; }
.panel h2 { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:0 0 8px; }
.row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:6px 0; }
.lbl { color:var(--muted); font-size:13px; min-width:150px; }
.slot { width:54px; height:44px; border-radius:8px; border:2px dashed var(--line); display:flex; align-items:center; justify-content:center; font:600 16px ui-monospace,Menlo,monospace; }
.slot.full { border-style:solid; border-color:var(--a); background:color-mix(in srgb,var(--a) 14%,transparent); }
.slot.new { border-color:var(--ok); background:color-mix(in srgb,var(--ok) 16%,transparent); }
.slot.lost { border-style:solid; border-color:var(--bad); color:var(--bad); background:color-mix(in srgb,var(--bad) 12%,transparent); }
.chip { min-width:40px; height:34px; padding:0 8px; border-radius:17px; border:2px solid var(--line); display:flex; align-items:center; justify-content:center; font:600 14px ui-monospace,Menlo,monospace; }
.chip.live { border-color:var(--a); } .chip.gone { opacity:.5; text-decoration:line-through; border-style:dashed; }
.chip.ptr { box-shadow:0 0 0 3px color-mix(in srgb,var(--b) 55%,transparent); }
.badge { padding:4px 12px; border-radius:12px; font:600 13px system-ui,sans-serif; border:2px solid var(--line); }
.badge.on { border-color:var(--ok); color:var(--ok); } .badge.bad { border-color:var(--bad); color:var(--bad); } .badge.wait { border-color:var(--b); color:var(--b); }
code { font:13px ui-monospace,Menlo,monospace; background:var(--code); padding:1px 5px; border-radius:4px; }
.caption { padding:10px 12px; border-radius:8px; background:var(--panel); border:1px solid var(--line); min-height:68px; margin-bottom:10px; }
.controls { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
button.ctl { font:600 14px system-ui,sans-serif; padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer; }
button.ctl:disabled { opacity:.45; cursor:default; } .counter { color:var(--muted); font-size:13px; margin-left:auto; }
</style>
</head>
<body>
<h1>watch: получатель видит только последнее значение</h1>
<p class="sub">Отправитель меняет значение быстрее, чем получатель успевает его читать. Что видит получатель, и чем borrow отличается от borrow_and_update.</p>
<div class="modes"><button class="mode on" data-m="upd">borrow_and_update + changed<small>правильный порядок</small></button><button class="mode" data-m="dup">borrow + changed<small>дубль значения</small></button></div>
<div class="panel" id="view"></div>
<div class="caption" id="caption"></div>
<div class="controls">
  <button class="ctl" id="step">Шаг</button><button class="ctl" id="play">Играть</button><button class="ctl" id="reset">Сброс</button>
  <span class="counter" id="counter"></span>
</div>
<script>

const SC = {
  upd: [
    { val:0, ver:0, seen:0, hist:[0], gone:[], out:[], cap:"Канал <code>watch::channel(0)</code>: в нём всегда ровно одно значение, и у каждого получателя запомнено, какую версию он уже видел. Начальное значение считается увиденным." },
    { val:1, ver:1, seen:0, hist:[0,1], gone:[0], out:[], cap:"<code>send(1)</code>: значение заменено, версия выросла. Старое значение не хранится нигде. Получатель его ещё не видел." },
    { val:3, ver:3, seen:0, hist:[0,1,2,3], gone:[0,1,2], out:[], cap:"Пока получатель занят, отправитель сделал ещё <code>send(2)</code> и <code>send(3)</code>. Значения 1 и 2 так никто и не увидит: канал хранит только последнее." },
    { val:3, ver:3, seen:3, hist:[0,1,2,3], gone:[0,1,2], out:[3], cap:"Получатель вызвал <code>changed().await</code>: версия 3 новее увиденной 0, поэтому он проснулся сразу. <code>borrow_and_update()</code> отдал 3 и отметил версию 3 прочитанной. Три изменения слились в одно пробуждение." },
    { val:3, ver:3, seen:3, hist:[0,1,2,3], gone:[0,1,2], out:[3], waiting:true, cap:"Следующий <code>changed().await</code> будет ждать: нового, чего получатель не видел, нет. Если отправитель закроется, вместо ожидания придёт Err." }
  ],
  dup: [
    { val:0, ver:0, seen:0, hist:[0], gone:[], out:[], cap:"Тот же канал, но получатель читает значение через <code>borrow()</code> и только потом зовёт <code>changed()</code>." },
    { val:1, ver:1, seen:0, hist:[0,1], gone:[0], out:[], cap:"<code>send(1)</code>: версия 1, получатель видел версию 0." },
    { val:1, ver:1, seen:0, hist:[0,1], gone:[0], out:[1], cap:"Получатель прочитал значение: <code>borrow()</code> вернул 1. Но <b>borrow() не отмечает версию прочитанной</b>: увиденной по-прежнему считается 0." },
    { val:1, ver:1, seen:1, hist:[0,1], gone:[0], out:[1,1], bad:true, cap:"<code>changed().await</code> возвращается сразу (версия 1 для получателя «непрочитанная») и воркер обрабатывает то же значение второй раз. Дубль. Если нужно прочитать и отметить, берут <code>borrow_and_update()</code>." }
  ]
};
function view(s) {
  const hist = s.hist.map(v=>`<div class="chip ${s.gone.includes(v)?'gone':'live'}">${v}</div>`).join('');
  return `<h2>Канал: одно значение</h2><div class="row"><div class="slot full" style="width:90px">${s.val}</div><span class="badge">версия ${s.ver}</span></div>
  <h2>Все отправленные значения (перечёркнуты те, что получатель не увидел)</h2><div class="row">${hist}</div>
  <h2>Получатель</h2><div class="row"><span class="badge ${s.seen===s.ver?'on':'wait'}">видел версию ${s.seen}</span>${s.waiting?'<span class="badge wait">спит в changed()</span>':''}<span class="lbl">обработал: ${s.out.length?s.out.join(', '):'ничего'}</span>${s.bad?'<span class="badge bad">дубль</span>':''}</div>`;
}


let mode = Object.keys(SC)[0], pos = 0, timer = null;
const $ = id => document.getElementById(id);
function render() {
  const sc = SC[mode], s = sc[pos];
  $("view").innerHTML = view(s);
  $("caption").innerHTML = s.cap;
  $("counter").textContent = `шаг ${pos} из ${sc.length-1}`;
  const end = pos >= sc.length-1;
  $("step").disabled = end; $("play").disabled = end;
  if (end) stop();
}
function stop(){ if(timer){clearInterval(timer);timer=null;} $("play").textContent="Играть"; }
function step(){ if(pos<SC[mode].length-1){pos++;render();} }
function setMode(m){ stop(); mode=m; pos=0; document.querySelectorAll(".mode").forEach(b=>b.classList.toggle("on",b.dataset.m===m)); render(); }
document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>setMode(b.dataset.m));
$("step").onclick=()=>{stop();step();};
$("play").onclick=()=>{ if(timer){stop();return;} $("play").textContent="Пауза"; timer=setInterval(step,1800); };
$("reset").onclick=()=>setMode(mode);
render();

</script>
</body>
</html>
