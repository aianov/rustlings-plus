[[exercises]]
name = "tm1"
style = "todo"
hint.ru = [
  """Для замера возьми `tokio::time::Instant::now()` до сна и `elapsed()` после. Для backoff понадобится степень двойки и ограничение сверху.""",
  """Степень двойки: `1u64.checked_shl(attempt)` возвращает None, когда сдвиг не помещается. Сдвигай единицу, а не 100: проверка ловит только слишком большой сдвиг, а потерю старших битов у уже сдвинутой сотни нет. Умножение на 100 делай через `saturating_mul`, потом `.min(2000)`.""",
]
why.ru = """sleep усыпляет задачу, а не поток, и Instant из tokio::time это часы рантайма: на замороженном времени замер точный. Backoff нужен почти в любом клиенте, и ловушка в нём одна: степень двойки при больших номерах попыток переполняется. checked_shl и saturating_mul превращают переполнение в «очень много», которое потом обрезает потолок."""

[[exercises]]
name = "tm2"
style = "todo"
hint.ru = [
  """Нужна обёртка вокруг Future, которая обрывает ожидание по сроку. Она лежит в tokio::time.""",
  """`tokio::time::timeout(срок, future).await` возвращает `Result<T, Elapsed>`. Ok значит успели, Err значит срок вышел.""",
]
why.ru = """timeout не отменяет работу по волшебству: он просто перестаёт ждать и дропает внутренний Future. Поэтому тест проверяет не только значение по умолчанию, но и момент возврата: ровно срок, а не время, за которое пришёл бы поздний ответ. Сроки ставят всегда, на любое ожидание внешнего мира: сеть, диск, соседний сервис."""

[[exercises]]
name = "tm3"
style = "todo"
hint.ru = [
  """Ожидание timeout даёт Result<Result<u32, String>, Elapsed>: два слоя, и значат они разное. Разбери оба.""",
  """Ok(Ok(v)) это успех, Ok(Err(e)) отказ сервиса (кладёшь текст в Failed), Err(_) опоздание. summarize просто считает исходы call.""",
]
why.ru = """Вложенный Result выглядит как мелочь, но смешивать «не успели» и «успели узнать отказ» нельзя: на таймаут часто отвечают повтором, а на отказ нет. Свой enum ошибок делает это различие явным для вызывающего. Заметь, что опоздавший отказ остаётся таймаутом: ответ мы не увидели, значит, и узнать, что там было, не могли."""

[[exercises]]
name = "tm_q1"
kind = "question"
style = "bughunt"
question.ru = '''Рантайм на замороженном времени. Чему будет равен count?

```rust
let mut count = 0;
let result = tokio::time::timeout(Duration::from_millis(250), async {
    loop {
        tokio::time::sleep(Duration::from_millis(100)).await;
        count += 1;
    }
})
.await;
println!("{count}");
```'''
options.ru = ["0", "2", "3", "программа не скомпилируется"]
answer = [1]
explain.ru = """Блок работает 250 мс: тики в 100 и 200 мс успевают, третий пришёлся бы на 300 мс, но на 250 срок вышел, и Future дропнули прямо на .await. Что выполнилось до этого, осталось (count равен 2), а что нет, так и не выполнится. Именно поэтому операции, оборванные по таймауту, не должны оставлять полупроделанных изменений (следующая задача)."""
hint.ru = """В какие моменты внутри блока увеличивается count и в какой момент блок дропнут?"""

[[exercises]]
name = "tm4"
style = "bughunt"
hint.ru = [
  """Что остаётся от операции, если её оборвать ровно на `.await`? Выполненное до него остаётся.""",
  """Нужно, чтобы между первым изменением состояния и последним не было ни одного .await. Сначала всё медленное, потом все изменения подряд.""",
]
why.ru = """Отмена в Rust это просто дроп Future, и она может случиться на любом .await. Если между двумя связанными изменениями стоит .await, их можно разорвать. Рецепт: всё медленное и ненадёжное делать до изменений, а сами изменения проводить подряд без точек ожидания. Тогда операция атомарна относительно отмены: либо не дошла, либо выполнилась целиком. Тест перебирает моменты обрыва, потому что ошибка живёт в промежутке, а не в конкретной точке."""

[[exercises]]
name = "tm5"
style = "scratch"
hint.ru = [
  """Общий срок это один момент во времени, а не длительность на каждый шаг. Зафиксируй его один раз до цикла.""",
  """В tokio::time есть Instant и вариант timeout, который принимает момент, а не длительность: `timeout_at`.""",
  """Крайний срок шага это ближайший из двух моментов: общий и «сейчас плюс свой лимит». Моменты сравниваются через `min`. Номер шага из `enumerate` даст число завершённых.""",
]
why.ru = """timeout(budget, шаг) на каждом шаге даёт каждому шагу полный бюджет, и цепочка из трёх шагов тянется втрое дольше обещанного. Общий дедлайн это момент во времени: чем меньше осталось, тем меньше ждёт следующий шаг. Тот же приём работает для цепочки вызовов к разным сервисам внутри одного запроса. Вместо timeout_at можно взять sleep_until и select!, но об этом позже."""

[[exercises]]
name = "tm6"
style = "fix"
hint.ru = [
  """Что делает самый первый вызов tick у interval, и как заставить его начать отсчёт позже?""",
  """Есть вариант конструктора с моментом старта: `interval_at(start, period)`. Начало должно быть на один период позже сейчас.""",
]
why.ru = """Первый тик interval приходит сразу: так удобно запускать периодическую работу немедленно. Если первый запуск должен быть через период, нужен interval_at с отложенным стартом (или вызвать tick один раз вхолостую). Это одна из самых частых неожиданностей с interval: сразу после старта срабатывает то, что должно было ждать."""

[[exercises]]
name = "tm7"
style = "fix"
hint.ru = [
  """Подсчитай, когда начнётся второй раунд, если после работы идёт пауза в 100 мс. Что можно заменить, чтобы сетка не зависела от длительности работы?""",
  """interval тикает по расписанию от своего старта, а не от конца прошлой работы. Тик в начале каждого раунда, потом работа.""",
]
why.ru = """sleep после работы даёт период «работа плюс пауза»: 130 мс вместо 100, и каждый раунд сдвигается ещё на длительность работы. interval ведёт собственное расписание от момента создания, поэтому работа внутри цикла его не сдвигает. Если работа длиннее периода, вступают в дело политики пропуска (следующая задача)."""

[[exercises]]
name = "tm_q2"
kind = "question"
style = "bughunt"
question.ru = '''Рантайм на замороженном времени, интервал с политикой по умолчанию. В какие моменты (мс от старта) вернутся три последних tick?

```rust
let start = Instant::now();
let mut iv = tokio::time::interval(Duration::from_millis(100));
iv.tick().await;                                   // момент 0
tokio::time::sleep(Duration::from_millis(250)).await;
iv.tick().await;                                   // A
iv.tick().await;                                   // B
iv.tick().await;                                   // C
```'''
options.ru = [
  "A=350, B=450, C=550",
  "A=250, B=250, C=300",
  "A=250, B=350, C=450",
  "A=300, B=400, C=500",
]
answer = [1]
explain.ru = """Политика по умолчанию Burst: пропущенные тики (100 и 200 мс) отдаются сразу один за другим, пока расписание не догонит часы. Поэтому A и B приходят в момент 250, а C по расписанию в 300. Вариант с 350, 450, 550 это поведение sleep в цикле, вариант 250, 350, 450 это Delay, вариант 300, 400, 500 не получается ни при одной политике. Skip дал бы 250, 300, 400."""
hint.ru = """Что interval делает с тиками, которые ты пропустил, пока спал?"""

[[exercises]]
name = "tm8"
style = "todo"
hint.ru = [
  """Прогони `observe` для каждой политики (в main это уже сделано) и сравни списки моментов с требованиями.""",
  """Burst догоняет пачкой, Delay сдвигает расписание на период после задержки, Skip пропускает пропущенное и возвращается на сетку.""",
]
why.ru = """Выбор политики это выбор смысла: билинг ничего не теряет и платит ценой пачки, heartbeat не имеет права слать очередь устаревших сигналов, уборка защищает ресурс от плотных запусков. Тест проверяет свойства, а не точные числа, потому что важно, какое требование выполнено: нет потерь, нет пачек и возврат на сетку, нет запусков теснее периода."""

[[exercises]]
name = "tm9"
style = "scratch"
hint.ru = [
  """В каждой записи хранится момент её смерти, а не момент создания. Тогда все проверки сводятся к сравнению с текущим Instant.""",
  """Часы кэша должны быть теми, которые видит рантайм: `tokio::time::Instant` (импорт уже есть). Срок хранится как `Instant::now() + ttl`.""",
  """Просрочено, когда `now >= expires`. Для остатка пригодится `checked_duration_since`, а для уборки `HashMap::retain`.""",
]
why.ru = """Хранить момент истечения удобнее, чем момент создания: ttl нужен только при вставке. Граница важна: ровно в момент ttl запись уже мертва, иначе на границе кэш отдаёт то, что отдавать нельзя. Часы tokio::time::Instant подчиняются замороженному времени, поэтому час ожидания в тесте стоит миллисекунды. Какой Instant брать, мы разберём подробнее в tm11."""

[[exercises]]
name = "tm10"
style = "todo"
hint.ru = [
  """advance двигает часы, но не ждёт, пока разбуженные задачи доработают. Разбуженным задачам нужна передышка, чтобы отработать.""",
  """Передышка для рантайма это `tokio::task::yield_now().await`: текущая задача уступает очередь.""",
  """После advance сделай yield_now. Обычно хватает одной-двух передышек; чем длиннее цепочка задач, тем больше нужно, поэтому делай несколько с запасом.""",
]
why.ru = """На замороженном времени часы стоят, пока ты не сдвинешь их сам или пока все задачи не упрутся в таймеры. После advance разбуженные задачи ещё в очереди, а каждое звено цепочки (таймер, канал, приёмник) срабатывает на отдельном опросе. Поэтому между сдвигом и проверкой нужны уступки очереди. Вручную подбирать число yield хрупко, поэтому позже в разделе тестов появится помощник, который прогоняет задачи до затишья."""

[[exercises]]
name = "tm_q3"
kind = "question"
style = "bughunt"
question.ru = '''Тест с замороженным временем. Что напечатает программа?

```rust
#[tokio::test(start_paused = true)]
async fn t() {
    let started = std::time::Instant::now();
    tokio::time::sleep(Duration::from_secs(10)).await;
    println!("{}", started.elapsed().as_secs());
}
```'''
options.ru = ["0", "1", "10"]
answer = [0]
explain.ru = """Рантайм перематывает свои часы, и sleep на 10 секунд заканчивается мгновенно. std::time::Instant про это не знает и показывает настоящее время, которое прошло. Для измерений в таких тестах нужен tokio::time::Instant, и он покажет честные 10 секунд виртуального времени."""
hint.ru = """Чьи часы показывает std::time::Instant?"""

[[exercises]]
name = "tm11"
style = "bughunt"
hint.ru = [
  """Какие часы у `std::time::Instant` и какие у рантайма на замороженном времени?""",
  """Замороженное время подменяет только часы tokio. Instant из std идёт по настоящему времени, которое в тесте почти не движется.""",
  """Возьми Instant из tokio::time везде, где ведёшь отсчёт.""",
]
why.ru = """tokio::time::pause подменяет часы tokio, а std::time::Instant продолжает показывать настоящее время. Поэтому любой код, который меряет время std-часами, на замороженных часах «не видит» ожидания, и тесты выглядят так, будто ничего не происходит. В продакшне оба Instant ведут себя одинаково, так что баг прячется до тестов. Правило: в async-коде, привязанном к таймерам tokio, считай время только часами tokio."""

[[exercises]]
name = "tm_heartbeat"
style = "scratch"
quiz = true
hint.ru = [
  """Состояние узлов живёт в Arc<Mutex<HashMap<..>>>, блокировки короткие и без .await внутри. Фоновая задача читает и меняет его на каждом просмотре.""",
  """Фоновая задача: `interval(period)`, `set_missed_tick_behavior(Skip)`, в цикле tick, потом (один раз) задержка из stall_once, потом обход узлов: был сигнал, так сбросить пропуски, иначе прибавить один.""",
  """wait_dead: `timeout(within, цикл с sleep(10 мс), пока status != Dead)`. wait_all_dead: один `deadline = Instant::now() + budget` и `timeout_at(deadline, ...)` для каждого узла по очереди.""",
]
why.ru = """Здесь собрано всё из главы: interval для расписания, Skip для защиты от лавины тиков после затянувшегося просмотра, timeout для ограничения ожидания и общий дедлайн для группы ожиданий. Тест на stall_once ловит Burst (ложные смерти), тест на общий бюджет ловит timeout на каждый узел по отдельности. Опрос статуса раз в 10 мс это простейший способ, в главе про каналы и синхронизацию то же самое делается уведомлением без опроса."""
