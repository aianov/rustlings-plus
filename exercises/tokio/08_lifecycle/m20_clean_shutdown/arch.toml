  "src/crates/service-runtime/src/shutdown/mod.rs",
]
message.ru = "Не хватает файла из дерева вехи. Разбор строк (Command, ChatCommand, Input) живёт в src/crates/contracts, переписка в src/crates/social-core/src/chat, шина событий в events/, адаптер страниц в feed/, скрытые авторы в network/mutes.rs, уведомители в notify/, таблица команд «service.method» в commands/table.rs ядра с обработчиками по сервисам (users.rs, posts.rs, comments.rs, chat.rs, notify.rs, admin.rs), async-порты в ports/repo.rs и синхронные хранилища в ports/store.rs, реализации в памяти в storage/mem (repo.rs, users.rs, posts.rs, app.rs), запросы фасада в app/queries.rs, медленные фейки портов в test-support/src/slow, токен отмены, учёт задач, супервизор и остановка по стадиям в src/crates/service-runtime (token/, tracker/, supervisor/, shutdown/), контракт провода в contracts (envelope/, api/, push/, error/), курсор страниц в contracts/src/cursor, индексы автора и тегов и операции с постами и комментариями в network/ ядра, часы в contracts/src/clock (Clock, SystemClock), отрисовка ответов в commands/render.rs, тренды в trends/, комментарии в comments/, исполнение вызовов в api/ ядра, ошибки крейтов в их error/, режимы терминала в tools/repl/src/run, асинхронный фасад App в app/ ядра (mod.rs, config.rs, error.rs, fanout.rs, heavy.rs, import.rs, trends.rs), шардированная карта в shards/, асинхронная шина событий в events/bus.rs, живые настройки в app/settings.rs и contracts/src/setting, карточка профиля в app/card.rs, рантайм терминала в tools/repl/src/runtime, фейки, часы, счётчик аллокаций и замеры в src/crates/test-support, свои интеграционные тесты ядра в tests/clock.rs с общим tests/common/mod.rs, пример замера в social-core/examples/feed_bench.rs, его запуск в tools/xtask/src/bench.rs, автомат сессии в tools/repl/src/session, терминал в tools/repl/src/terminal, скрипты разработчика в tools/xtask, файлы окружения в корне. Если нет .env, скопируй его из .env.example."

[[rules]]
kind = "allowed_children"
dirs = ["src"]
allowed = ["crates"]
message.ru = "В src/ корня теперь только папка crates/. Старые модули пакета backend переехали в src/crates/social-core/src и src/crates/contracts/src."

[[rules]]
kind = "absent"
globs = ["tests/*.rs"]
message.ru = "В корне воркспейса нет пакета, поэтому tests/*.rs там никто не скомпилирует, и тесты молча перестанут работать. Тесты прошлых вех живут в tests/ своих пакетов."

[[rules]]
kind = "not_contains"
globs = ["Cargo.toml"]
regex = '^\[package\]'
message.ru = "Корневой Cargo.toml виртуальный: в нём [workspace] и общие таблицы, а [package] нет. Пакеты это src/crates/* и tools/*."

[[rules]]
kind = "contains"
globs = ["Cargo.toml"]
regex = 'resolver = "3"'
message.ru = "В виртуальном корне нужна строка `resolver = \"3\"` в [workspace]: у корня нет edition, и без неё cargo молча возьмёт старый резолвер."

[[rules]]
kind = "workspace_members"
members = ["src/crates/social-core", "src/crates/contracts", "src/crates/test-support", "src/crates/service-runtime", "tools/repl", "tools/xtask"]
message.ru = "В [workspace] members не попадают все пакеты. Удобнее всего две маски: \"src/crates/*\" и \"tools/*\"."

[[rules]]
kind = "contains"
globs = ["Cargo.toml"]
regex = '^\[workspace.package\]'
message.ru = "Общие поля пакетов (version, edition, rust-version, publish) живут в [workspace.package] корня."

[[rules]]
kind = "contains"
globs = ["src/crates/*/Cargo.toml", "tools/repl/Cargo.toml", "tools/xtask/Cargo.toml"]
regex = '^version.workspace = true'
message.ru = "Версию пакет наследует из корня: `version.workspace = true`. Тогда версия у всех одна и правится в одном месте."

[[rules]]
kind = "contains"
globs = ["src/crates/*/Cargo.toml", "tools/repl/Cargo.toml", "tools/xtask/Cargo.toml"]
regex = '^edition.workspace = true'
message.ru = "Edition пакет наследует из корня: `edition.workspace = true`."

[[rules]]
kind = "workspace_deps"
packages = ["src/crates/*", "tools/repl", "tools/xtask"]
message.ru = "Зависимость объявлена в пакете напрямую. Все зависимости, и внутренние крейты тоже, описываются в [workspace.dependencies] корня, а в пакете `имя.workspace = true`."

[[rules]]
kind = "deps"
package = "src/crates/contracts"
allow_only = ["serde", "serde_json"]
message.ru = "contracts это нижний слой: типы, ники, команды и контракт провода. Из чужого ему нужны только serde и serde_json, а ядро и терминал зависят от него. Стрелки идут только вниз."

[[rules]]
kind = "deps"
package = "src/crates/social-core"
forbid = ["repl"]
message.ru = "Ядро не знает про терминал: repl зависит от social-core, а не наоборот."

[[rules]]
kind = "deps"
package = "src/crates/social-core"
forbid = ["serde", "serde_json"]
message.ru = "Ядро не читает и не пишет JSON само: конверты разбирает и печатает contracts (decode, decode_call, write_line), а ядро получает готовый Call и отдаёт Reply. Тогда протокол живёт в одном месте."

[[rules]]
kind = "contains"
globs = ["Cargo.toml"]
regex = '^\[workspace.lints'
message.ru = "Правила проверок общие для всех: [workspace.lints.rust] и [workspace.lints.clippy] в корне."

[[rules]]
kind = "contains"
globs = ["Cargo.toml"]
regex = 'unsafe_code = "forbid"'
message.ru = "В [workspace.lints.rust] нужен `unsafe_code = \"forbid\"`: соцсети unsafe не нужен, и пусть компилятор это гарантирует."

[[rules]]
kind = "contains"
globs = ["Cargo.toml"]
regex = 'unwrap_used = "deny"'
message.ru = "В [workspace.lints.clippy] нужен `unwrap_used = \"deny\"`: договорённость «без unwrap» теперь проверяет clippy, в том числе в тестах (там вместо него expect с объяснением)."

[[rules]]
kind = "contains"
globs = ["src/crates/contracts/Cargo.toml", "src/crates/social-core/Cargo.toml", "src/crates/service-runtime/Cargo.toml", "tools/repl/Cargo.toml", "tools/xtask/Cargo.toml"]
regex = '^workspace = true'
message.ru = "Пакет не подключил общие правила. Без `[lints]` и строки `workspace = true` под ней правила корня на него не действуют, и никто этого не заметит. Исключение одно, test-support: ему нужен unsafe для счётчика аллокаций, и правила он пишет себе сам."

[[rules]]
kind = "contains"
globs = ["Cargo.toml"]
regex = '^\[profile.release\]'
message.ru = "Профиль релизной сборки задаётся в корне воркспейса: [profile.release] в пакетах cargo игнорирует."

[[rules]]
kind = "contains"
globs = ["tools/repl/build.rs"]
regex = 'rustc-env=REPL_VERSION='
message.ru = "build.rs терминала должен передавать строку версии в компиляцию: `cargo::rustc-env=REPL_VERSION=...`."

[[rules]]
kind = "contains"
globs = ["tools/repl/src/main.rs"]
regex = 'env!\("REPL_VERSION"\)'
message.ru = "Строку для --version main.rs берёт из build.rs через `env!(\"REPL_VERSION\")`, а не пишет руками."

[[rules]]
kind = "max_lines"
globs = ["tools/repl/src/main.rs"]
max = 40
message.ru = "tools/repl/src/main.rs разросся. main только читает строки и печатает ответы Terminal: сессия живёт в session/, разбор в contracts, исполнение в social-core."

[[rules]]
kind = "uniform_modules"
roots = ["src/crates/social-core/src", "src/crates/contracts/src", "src/crates/test-support/src", "src/crates/service-runtime/src", "tools/repl/src", "tools/xtask/src"]
message.ru = "В одной папке смешаны файлы-модули и папки-модули. Рядом с lib.rs лежат только папки-модули, внутри папок только файлы .rs."

[[rules]]
kind = "not_contains"
globs = ["src/crates/*/src/lib.rs", "tools/repl/src/lib.rs"]
regex = 'struct '
message.ru = "lib.rs крейта это фасад: только `mod ...;` и `pub use ...;`. Структуры живут в модулях."

[[rules]]
kind = "not_contains"
globs = ["src/crates/*/src/lib.rs", "tools/repl/src/lib.rs"]
regex = 'enum '
message.ru = "lib.rs крейта это фасад: только `mod ...;` и `pub use ...;`. Перечисления живут в модулях."

[[rules]]
kind = "not_contains"
globs = ["src/crates/*/src/lib.rs", "tools/repl/src/lib.rs"]
regex = 'impl[ <]'
message.ru = "lib.rs крейта это фасад: только `mod ...;` и `pub use ...;`. Методы пишутся рядом со своими типами."

[[rules]]
kind = "absent"
globs = ["**/utils.rs", "**/helpers.rs"]
message.ru = "Файлы-свалки utils.rs и helpers.rs не заводим: положи функцию в модуль, которому она принадлежит."

[[rules]]
kind = "not_contains"
globs = ["src/**/*.rs", "tools/**/*.rs"]
regex = 'allow\(dead_code\)'
message.ru = "Глушилка `allow(dead_code)` не нужна: пусть компилятор подсказывает про забытый код."

[[rules]]
kind = "not_contains"
globs = ["src/crates/*/src/**/*.rs", "tools/*/src/**/*.rs", "tools/*/build.rs"]
regex = '\.unwrap\(\)'
message.ru = "В коде нашёлся `.unwrap()`. Верни `Result` или `Option` и пробрось ошибку через `?`."

[[rules]]
kind = "not_contains"
globs = ["src/crates/*/src/**/*.rs", "tools/*/src/**/*.rs", "tools/*/build.rs"]
regex = 'panic!'
message.ru = "В коде нашёлся `panic!`. Правила соцсети нарушаются каждый день, это не повод падать: верни ошибку."

[[rules]]
kind = "not_contains"
globs = ["src/crates/social-core/src/domain/**/*.rs", "src/crates/social-core/src/network/**/*.rs", "src/crates/social-core/src/commands/**/*.rs", "src/crates/social-core/src/chat/**/*.rs", "src/crates/social-core/src/events/**/*.rs", "src/crates/social-core/src/api/**/*.rs", "src/crates/social-core/src/trends/**/*.rs", "src/crates/social-core/src/comments/**/*.rs", "src/crates/social-core/src/app/**/*.rs"]
regex = 'storage::'
message.ru = "Фасад App, домен, сеть, тренды, комментарии, переписка, команды и вызовы с провода не знают про storage: App работает через порты (Arc<dyn UserRepo>, PostRepo, ChatRepo), сеть через трейты UserStore и PostStore. Реализация в памяти собирает App у себя, в storage/mem/app.rs."

[[rules]]
kind = "not_contains"
globs = ["src/crates/social-core/src/network/**/*.rs"]
regex = 'Vec<Post>'
message.ru = "В network/ остался свой Vec<Post>. Посты хранит PostStore, а Network только просит его."

[[rules]]
kind = "contains"
globs = ["src/crates/social-core/src/network/feed.rs"]
regex = '#\[cfg\(test\)\]'
message.ru = "В network/feed.rs пропали твои тесты ленты. Верни `#[cfg(test)] mod tests`."

[[rules]]
kind = "not_contains"
globs = ["src/crates/social-core/src/network/feed.rs"]
regex = '\.clone\(\)'
message.ru = "В ленте нашёлся `.clone()`. Лента отдаёт ссылки на посты из хранилища, копировать ничего не нужно."

[[rules]]
kind = "not_contains"
globs = [
  "src/crates/social-core/src/domain/**/*.rs",
  "src/crates/social-core/src/network/**/*.rs",
  "src/crates/social-core/src/chat/**/*.rs",
  "src/crates/social-core/src/events/mod.rs",
  "src/crates/social-core/src/api/**/*.rs",
  "src/crates/social-core/src/error/**/*.rs",
  "src/crates/social-core/src/trends/**/*.rs",
  "src/crates/social-core/src/comments/**/*.rs",
  "src/crates/contracts/src/**/*.rs",
]
regex = 'std::sync::[^A]'
message.ru = "Network, индексы, тренды, комментарии, переписка, синхронная шина событий, вызовы с провода, ошибки и contracts остаются однопоточными. Замки, атомики и каналы живут только в app/, shards/, notify/, events/bus.rs и в памяти-адаптере storage/mem. Общие неизменяемые данные в Arc можно везде: `use std::sync::Arc;`."

[[rules]]
kind = "not_contains"
globs = ["src/**/*.rs", "tools/**/*.rs"]
regex = 'static mut'
message.ru = "`static mut` это общая память без всякой защиты. Общее состояние живёт в Arc<Mutex<...>>."

[[rules]]
kind = "contains"
globs = ["Makefile"]
regex = '^\.PHONY:'
message.ru = "В Makefile нет .PHONY. Цели build, run, test, fmt, lint, check это команды, а не файлы: без .PHONY одноимённая папка или файл молча выключит цель."

[[rules]]
kind = "contains"
globs = ["Makefile"]
regex = '^SERVICE \?= '
message.ru = "Сервис для `make run` задаётся через `SERVICE ?= repl`: так его можно переопределить и аргументом make, и переменной окружения."

[[rules]]
kind = "contains"
globs = ["Makefile.toml"]
regex = '^\[tasks.check\]'
message.ru = "В Makefile.toml нет задачи [tasks.check]: с этой вехи курс проверяет соцсеть командой `cargo make check`."

[[rules]]
kind = "contains"
globs = ["Makefile.toml"]
regex = 'default_to_workspace = false'
message.ru = "В [config] Makefile.toml нужен `default_to_workspace = false`, иначе cargo-make выполнит каждую задачу в каждом члене воркспейса."

[[rules]]
kind = "contains"
globs = ["Makefile.toml"]
regex = 'defaults_only = true'
message.ru = ".env подключается через env_files с `defaults_only = true`: файл дополняет окружение, но переменная из оболочки сильнее."

[[rules]]
kind = "contains"
globs = ["rust-toolchain.toml"]
regex = 'channel = "\d+\.\d+\.\d+"'
message.ru = "rust-toolchain.toml закрепляет точную версию компилятора (например, \"1.88.0\"). `stable` плывёт, и закрепление ничего не закрепляет."

[[rules]]
kind = "contains"
globs = ["rustfmt.toml"]
regex = 'use_field_init_shorthand = true'
message.ru = "В rustfmt.toml нужен `use_field_init_shorthand = true`: `Point { x: x }` пишем как `Point { x }`."

[[rules]]
kind = "contains"
globs = ["clippy.toml"]
regex = 'disallowed-methods'
message.ru = "clippy.toml должен запрещать хотя бы std::process::exit через disallowed-methods: из main возвращаем ExitCode."

[[rules]]
kind = "deps"
package = "tools/repl"
allow_only = ["contracts", "social-core", "tokio"]
message.ru = "Терминалу хватает трёх крейтов: contracts (разбор строк), social-core (исполнение) и tokio (рантайм, в котором живёт ядро)."

[[rules]]
kind = "not_contains"
globs = ["src/crates/contracts/src/**/*.rs"]
regex = '_ =>'
message.ru = "В contracts нашлась ветка `_ =>`. Она молча проглотит новый вариант enum или новую форму команды. Назови каждую ветку, а для неизвестного имени команды привяжи его: `(other, _) =>`."

[[rules]]
kind = "contains"
globs = ["src/crates/contracts/src/chat/mod.rs"]
regex = 'let .+ else \{'
message.ru = "Ранний выход в разборе команд сессии пишется через let-else: `let Some(name) = first.strip_prefix('/') else { ... };`."

[[rules]]
kind = "contains"
globs = ["src/crates/contracts/src/chat/mod.rs"]
regex = '@ \.\.'
message.ru = "Слова команды разбираются срезовыми образцами, а текст сообщения это хвост среза: `[to, text @ ..]`."

[[rules]]
kind = "not_contains"
globs = ["tools/repl/src/session/**/*.rs"]
regex = '_ =>'
message.ru = "В автомате сессии нашлась ветка `_ =>`. Каждое сочетание состояния и команды должно быть названо, тогда новая команда не пройдёт мимо компилятора."

[[rules]]
kind = "not_contains"
globs = ["tools/repl/src/session/**/*.rs"]
regex = ', _\) =>'
message.ru = "В автомате сессии нашлась ветка «любая команда» вида `(состояние, _) =>`. Перечисли команды через `|`: так видно, что именно запрещено в этом состоянии."

[[rules]]
kind = "not_contains"
globs = ["tools/repl/src/session/**/*.rs"]
regex = 'social_core'
message.ru = "Автомат сессии чистый: он решает, куда перейти и что сделать, но сеть не трогает. Действия исполняет терминал (terminal/) через social-core."

[[rules]]
kind = "not_contains"
globs = ["src/crates/**/*.rs", "tools/**/*.rs"]
regex = 'Rc<'
message.ru = "Нашёлся `Rc<`. Обработчики и уведомители живут в сети, которую делят потоки, а Rc не Send. Общий владелец между потоками это Arc."

[[rules]]
kind = "contains"
globs = ["src/crates/social-core/src/events/mod.rs"]
regex = 'FnMut'
message.ru = "Подписчик шины событий это замыкание `FnMut(&Event)`: оно может копить своё состояние между вызовами."

[[rules]]
kind = "contains"
globs = ["src/crates/social-core/src/notify/mod.rs"]
regex = 'trait Notifier'
message.ru = "В notify/ нет трейта Notifier. Уведомители (ящик, лог и те, что придут потом) реализуют один трейт и выбираются при запуске."

[[rules]]
kind = "contains"
globs = ["src/crates/social-core/src/notify/mod.rs"]
regex = 'Arc<dyn Notifier'
message.ru = "Реестр уведомителей хранит их как `Arc<dyn Notifier>`: одна реализация у многих владельцев, тип выбирается при запуске."

[[rules]]
kind = "not_contains"
globs = ["src/crates/social-core/src/network/**/*.rs"]
regex = 'Notifier'
message.ru = "Network ничего не знает про уведомители: она публикует события в свою шину, а уведомители подписываются на неё снаружи."

[[rules]]
kind = "contains"
globs = ["tools/repl/src/terminal/mod.rs"]
regex = 'CommandTable'
message.ru = "Терминал исполняет сетевые команды через асинхронную таблицу ядра CommandTable (по методу service.method), а команды сессии разбирает сам автомат."

[[rules]]
kind = "not_contains"
globs = ["tools/repl/src/terminal/**/*.rs"]
regex = 'Input::'
message.ru = "Терминал больше не разбирает строку сам и не делит её на два языка: строку получает шина и выбирает обработчик по первому слову."

[[rules]]
kind = "not_contains"
globs = ["src/crates/social-core/src/feed/**/*.rs"]
regex = 'collect'
message.ru = "В feed/ нашёлся `collect`. Адаптер собирает только саму страницу, и то через `extend`: промежуточные коллекции посреди цепочки не нужны."

[[rules]]
kind = "not_contains"
globs = ["src/crates/social-core/src/feed/**/*.rs"]
regex = 'assert!'
message.ru = "В адаптере страниц нашёлся `assert!`. Ядро не паникует: страниц размером 0 просто нет."

[[rules]]
kind = "contains"
globs = ["src/crates/social-core/src/feed/pages.rs"]
regex = 'trait PagesExt'
message.ru = "`.pages(n)` появляется у любого итератора через трейт-расширение `PagesExt` с общей реализацией для всех `I: Iterator`."

[[rules]]
kind = "contains"
globs = ["src/crates/social-core/src/network/feed.rs"]
regex = 'impl Iterator<Item = &Post>'
message.ru = "Лента и поиск отдают ленивый `impl Iterator<Item = &Post> + '_`, а собирает только вызывающий."

[[rules]]
kind = "not_contains"
globs = ["src/crates/social-core/src/network/feed.rs"]
regex = '-> Vec<'
message.ru = "В network/feed.rs функция возвращает `Vec`. Лента отдаёт итератор: сколько взять и во что собрать, решает вызывающий."

[[rules]]
kind = "contains"
globs = ["src/crates/contracts/src/envelope/mod.rs"]
regex = 'Value'
message.ru = "Разбор идёт в два этапа: сначала конверт, где data это serde_json::Value, потом метод выбирает тип данных. Envelope<T = Value>."

[[rules]]
kind = "not_contains"
globs = ["src/crates/contracts/src/envelope/**/*.rs", "src/crates/contracts/src/api/**/*.rs"]
regex = '\.clone\(\)'
message.ru = "В разборе конверта нашёлся `.clone()`. Данные читаются из дерева по ссылке: `T::deserialize(&envelope.data)`, &Value сам умеет быть Deserializer."

[[rules]]
kind = "contains"
globs = ["src/crates/contracts/src/error/mod.rs", "src/crates/social-core/src/error/mod.rs", "tools/repl/src/error/mod.rs"]
regex = 'pub type Result<T>'
message.ru = "У каждого крейта свой Error и свой алиас `pub type Result<T> = std::result::Result<T, Error>;` в его error/mod.rs: по сигнатуре видно, чья это неудача."

[[rules]]
kind = "contains"
globs = ["src/crates/social-core/src/error/mod.rs", "tools/repl/src/error/mod.rs"]
regex = 'fn source'
message.ru = "Ошибка, которая оборачивает причину, отдаёт её через `source`. Без этого метода причина молча пропадёт из всех отчётов."

[[rules]]
kind = "not_contains"
globs = ["src/crates/*/src/**/*.rs"]
regex = 'Box<dyn .*Error'
message.ru = "В крейте нашёлся `Box<dyn Error>`. Библиотека отдаёт типизированные ошибки, по которым можно принять решение; коробка нужна только самому верхнему слою, main терминала."

[[rules]]
kind = "contains"
globs = ["tools/repl/src/main.rs"]
regex = 'Box<dyn Error \+ Send \+ Sync>'
message.ru = "main терминала собирает любые ошибки в `Box<dyn Error + Send + Sync>` и печатает всю цепочку причин."

[[rules]]
kind = "not_contains"
globs = ["tools/repl/src/main.rs"]
regex = 'fn main\(\) -> Result'
message.ru = "main не возвращает Result: тогда Rust сам напечатает ошибку через Debug (`Error: Custom { .. }`). Верни ExitCode, а ошибку напечатай сам: `ошибка: <цепочка причин>`."

[[rules]]
kind = "max_lines"
globs = ["src/crates/*/src/**/*.rs"]
max = 300
message.ru = "Файл длиннее 300 строк. Разложи его по смыслу: операции с постами Network живут в network/posts.rs, с комментариями в network/comments.rs, индексы в своих файлах, отрисовка строк рядом с командами."

[[rules]]
kind = "contains"
globs = ["src/crates/social-core/src/network/authors.rs"]
regex = 'BTree'
message.ru = "Индекс автора это упорядоченное множество ключей (время, id): BTreeSet<Cursor> или BTreeMap с ключом Cursor. Тогда страница это range от курсора, а не обход всех постов сети."

[[rules]]
kind = "not_contains"
globs = ["src/crates/social-core/src/network/authors.rs"]
regex = '\.\.='
message.ru = "В индексе автора нашёлся `..=`. Пост под курсором уже показан на прошлой странице: граница исключается (`..cursor` или `Bound::Excluded(cursor)`), иначе он повторится на стыке."

[[rules]]
kind = "contains"
globs = ["src/crates/social-core/src/network/tags.rs"]
regex = 'Set<'
message.ru = "Посты тега хранятся множеством id (BTreeSet или HashSet): повтор тега в посте не задвоит запись, а удаление поста не обходит весь список."

[[rules]]
kind = "contains"
globs = ["src/crates/social-core/src/trends/mod.rs"]
regex = 'BinaryHeap'
message.ru = "Топ-N трендов считается на куче BinaryHeap размера не больше n."

[[rules]]
kind = "contains"
globs = ["src/crates/social-core/src/trends/mod.rs"]
regex = 'Reverse'
message.ru = "BinaryHeap в Rust максимальная: pop выкидывает самый сильный пост. Для топ-N нужна min-куча через std::cmp::Reverse, тогда выкидывается самый слабый."

[[rules]]
kind = "not_contains"
globs = ["src/crates/social-core/src/trends/**/*.rs"]
regex = '\.sort'
message.ru = "В трендах нашлась сортировка. Сортировать все посты ради десяти лучших дорого: куча размера n держит только кандидатов, а порядок отдаёт into_sorted_vec."

[[rules]]
kind = "not_contains"
globs = ["src/crates/social-core/src/domain/post.rs"]
regex = 'pub fn delete'
message.ru = "Post::delete публичный, значит кто угодно пометит пост удалённым мимо индексов, и он останется в тегах и трендах. Сделай его pub(crate): пост удаляется только через Network::delete_post."

[[rules]]
kind = "not_contains"
globs = ["src/crates/social-core/src/**/*.rs"]
regex = 'SystemTime'
message.ru = "Ядро больше не читает системные часы само: время приходит через трейт Clock, который Network держит в поле (`with_clock`, `now`). Настоящие часы SystemClock живут в contracts, а в тестах их подменяет FakeClock из test-support."

[[rules]]
kind = "not_contains"
globs = ["src/crates/contracts/src/username/**/*.rs"]
regex = 'to_lowercase'
message.ru = "Ник переводится в нижний регистр через to_ascii_lowercase. Юникодный to_lowercase трогает не только ASCII: \"İ\" превращается в два символа, и длина и смещения уезжают."

[[rules]]
kind = "not_contains"
globs = ["src/crates/contracts/src/username/**/*.rs"]
regex = 'is_alpha'
message.ru = "Символы ника проверяются ASCII-методами (is_ascii_lowercase, is_ascii_digit). is_alphabetic и is_alphanumeric пропустят кириллицу, и «аlice» с русской «а» станет двойником alice."

[[rules]]
kind = "contains"
globs = ["src/crates/social-core/src/network/mod.rs"]
regex = 'dyn Clock'
message.ru = "Network держит часы как `Box<dyn Clock>`: по умолчанию SystemClock, в тестах FakeClock через `with_clock`, и тип сети от этого не меняется."

[[rules]]
kind = "deps"
package = "src/crates/test-support"
allow_only = ["contracts", "social-core", "tokio"]
message.ru = "test-support строит фейки из типов соцсети: ему нужны только contracts и social-core, и те за feature test-util."

[[rules]]
kind = "contains"
globs = ["src/crates/test-support/src/lib.rs"]
regex = 'cfg\(feature = "test-util"\)'
message.ru = "Фейки, часы и журнал уведомлений живут за `#[cfg(feature = \"test-util\")]`: без feature их нет даже в коде крейта, и в релиз они не попадут, кто бы ни подключил test-support."

[[rules]]
kind = "contains"
globs = ["src/crates/test-support/Cargo.toml"]
regex = '^test-util = '
message.ru = "В [features] test-support нужна feature `test-util`, она же включает зависимости фейков: `test-util = [\"dep:contracts\", \"dep:social-core\"]`."

[[rules]]
kind = "contains"
globs = ["src/crates/test-support/Cargo.toml"]
regex = 'unsafe_code = "deny"'
message.ru = "test-support не берёт общие [lints] (там unsafe запрещён навсегда, forbid), поэтому пишет свои: `unsafe_code = \"deny\"` в [lints.rust]. deny разрешает снять запрет точечно, одним `#[allow(unsafe_code)]` над реализацией GlobalAlloc."

[[rules]]
kind = "contains"
globs = ["src/crates/test-support/Cargo.toml"]
regex = 'unwrap_used = "deny"'
message.ru = "Свои [lints] test-support не отменяют договорённость «без unwrap»: `unwrap_used = \"deny\"` в [lints.clippy]."

[[rules]]
kind = "not_contains"
globs = [
  "src/crates/test-support/src/lib.rs",
  "src/crates/test-support/src/bench/**/*.rs",
  "src/crates/test-support/src/clock/**/*.rs",
  "src/crates/test-support/src/ids/**/*.rs",
  "src/crates/test-support/src/notify/**/*.rs",
  "src/crates/test-support/src/stores/**/*.rs",
]
regex = 'unsafe'
message.ru = "unsafe в test-support живёт в одном месте, alloc/: там обёртка над System. Фейкам, часам и замерам он не нужен."

[[rules]]
kind = "contains"
globs = ["src/crates/test-support/src/alloc/mod.rs"]
regex = 'GlobalAlloc'
message.ru = "Счётчик аллокаций это свой аллокатор: `unsafe impl GlobalAlloc for CountingAlloc`, который считает и передаёт работу System."

[[rules]]
kind = "contains"
globs = ["src/crates/test-support/src/alloc/mod.rs"]
regex = 'thread_local!'
message.ru = "Счётчик аллокаций живёт в thread_local!: тесты идут параллельно, и общий атомик насчитает чужие аллокации."

[[rules]]
kind = "contains"
globs = ["src/crates/test-support/src/bench/mod.rs"]
regex = 'black_box'
message.ru = "Замер прогоняет результат через std::hint::black_box, иначе оптимизатор выкинет работу, которую ты меряешь, и покажет ноль."

[[rules]]
kind = "contains"
globs = ["src/crates/test-support/src/bench/mod.rs"]
regex = 'Instant'
message.ru = "Длительность меряется через Instant: SystemTime могут перевести назад посреди замера."

[[rules]]
kind = "no_comments"
