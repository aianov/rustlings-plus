message.ru = "В крейте test-support нет комментариев: имена фейков и методов должны говорить сами."

[[rules]]
kind = "absent"
globs = ["**/tests/common.rs"]
message.ru = "tests/common.rs cargo считает отдельным тестом (running 0 tests), а помощники в нём другим файлам не видны. Общий модуль тестов живёт в tests/common/mod.rs."

[[rules]]
kind = "contains"
globs = ["src/crates/social-core/tests/clock.rs"]
regex = '^mod common;'
message.ru = "Свои тесты ядра в tests/clock.rs берут помощников из общего модуля: `mod common;` в начале файла."

[[rules]]
kind = "contains"
globs = ["src/crates/social-core/tests/common/mod.rs"]
regex = 'FakeClock'
message.ru = "Общий модуль тестов собирает сеть на FakeClock из test-support: тесты времени не должны зависеть от настоящих часов."

[[rules]]
kind = "contains"
globs = ["src/crates/social-core/Cargo.toml"]
regex = '^\[dev-dependencies\]'
message.ru = "test-support подключается к ядру только в [dev-dependencies]: тесты и примеры его видят, а релизная сборка нет."

[[rules]]
