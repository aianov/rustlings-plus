regex = 'spawn_blocking'
message.ru = "Тяжёлая работа (разбор файла, пересчёт трендов) идёт в spawn_blocking, а не на воркере рантайма."

[[rules]]
kind = "contains"
globs = ["src/crates/social-core/src/app/heavy.rs"]
regex = 'acquire_owned'
message.ru = "Разрешение Semaphore уезжает внутрь spawn_blocking (acquire_owned): тогда работа, которую перестали ждать по таймауту, всё равно держит место до конца, и лимит не превышается."

[[rules]]
kind = "contains"
globs = ["src/crates/social-core/src/app/mod.rs"]
regex = 'Semaphore'
message.ru = "Лимит одновременных тяжёлых операций держит tokio::sync::Semaphore на heavy_limit разрешений."

[[rules]]
kind = "contains"
globs = ["src/crates/social-core/src/app/import.rs"]
regex = 'JoinSet'
message.ru = "Импорт запускает записи задачами в JoinSet: окно не больше import_window, первая ошибка отменяет остальных."

[[rules]]
