[[rules]]
kind = "absent"
globs = ["src/crates/worker-pool", "src/crates/social-core/src/shared"]
message.ru = "Пул потоков и SharedNetwork ушли: их работу делают задачи tokio, а ручкой ядра стал App в app/. Удали src/crates/worker-pool и social-core/src/shared."

[[rules]]
kind = "not_contains"
globs = ["src/crates/**/*.rs"]
regex = 'thread::sleep'
message.ru = "Нашёлся thread::sleep. В async-коде он держит воркер рантайма, и соседние задачи стоят; в тестах время двигает tokio::time (sleep, advance, start_paused), а работа ждёт сигнала, а не паузы."

[[rules]]
kind = "not_contains"
globs = ["src/crates/social-core/src/**/*.rs"]
regex = 'thread::'
message.ru = "Ядро не запускает своих потоков: доставка идёт задачами tokio, тяжёлая работа уходит в spawn_blocking."

[[rules]]
kind = "contains"
globs = ["src/crates/social-core/src/notify/mod.rs"]
regex = 'Shards<'
message.ru = "Ящики уведомлений живут в шардированной карте Shards<UserId, Vec<Notification>>: доставки разным пользователям не ждут один общий замок."

[[rules]]
kind = "contains"
globs = ["src/crates/social-core/src/shards/mod.rs"]
regex = 'Vec<Mutex<HashMap'
message.ru = "Шардированная карта это Vec<Mutex<HashMap<K, V>>>: ключ попадает в шард по хешу, и замок берётся только у его шарда."

[[rules]]
kind = "not_contains"
globs = ["src/crates/social-core/src/**/*.rs"]
regex = 'tokio::sync::Mutex'
message.ru = "Секции под замками ядра короткие и без .await, для них правильный замок std::sync::Mutex. tokio::sync::Mutex нужен, только когда guard обязан пережить .await."

[[rules]]
kind = "not_contains"
globs = ["src/crates/social-core/src/**/*.rs"]
regex = 'block_on'
message.ru = "block_on внутри async-ядра паникует (рантайм в рантайме). Таблица команд асинхронная, и граница sync и async проходится один раз: в терминале."

[[rules]]
