regex = 'run_heavy'
message.ru = "Разбор файла импорта и пересчёт трендов идут через run_heavy: лимит, таймаут и spawn_blocking в одном месте."

[[rules]]
kind = "contains"
globs = ["src/crates/social-core/src/app/trends.rs"]
regex = 'MissedTickBehavior::Skip'
message.ru = "Тикер трендов не догоняет пропущенные тики пачкой: MissedTickBehavior::Skip."

[[rules]]
kind = "contains"
globs = ["src/crates/social-core/src/app/error.rs"]
regex = 'enum Op'
message.ru = "Таймауты и паники ядра говорят, какая операция не справилась: свой enum Op (Import, Trends, Flush, Job)."

[[rules]]
kind = "contains"
globs = ["tools/repl/src/runtime/mod.rs"]
regex = 'Builder::new_multi_thread'
message.ru = "Терминал собирает рантайм сам: tokio::runtime::Builder::new_multi_thread() с worker_threads, thread_name и enable_all."

[[rules]]
