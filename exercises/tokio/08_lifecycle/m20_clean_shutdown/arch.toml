message.ru = "Пример feed_bench меряет ленту через `test_support::measure`: прогрев, повторы, медиана и p99."

[[rules]]
kind = "contains"
globs = ["src/crates/contracts/src/username/mod.rs", "src/crates/contracts/src/ids/mod.rs", "src/crates/contracts/src/cursor/mod.rs", "src/crates/contracts/src/envelope/mod.rs", "src/crates/contracts/src/clock/mod.rs"]
regex = '^\s*/// ```'
message.ru = "У публичного API contracts нет примера. Над ником, id, курсором, конвертом и часами нужен doc-тест (`/// ```` с кодом): `cargo test` его компилирует и запускает, поэтому пример не врёт."

[[rules]]
kind = "not_contains"
globs = ["src/crates/contracts/src/**/*.rs"]
regex = '```ignore'
message.ru = "Doc-тест с ignore не запускается и молча устаревает. Пример должен собираться и проходить."

[[rules]]
kind = "contains"
globs = ["tools/xtask/src/bench.rs"]
regex = 'feed_bench'
