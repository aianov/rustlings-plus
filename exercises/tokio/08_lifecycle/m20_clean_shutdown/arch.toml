globs = ["src/crates/**/*.rs", "tools/**/*.rs"]
regex = 'unbounded_channel'
message.ru = "Нашёлся unbounded_channel. Медленный потребитель, и очередь растёт, пока не кончится память. Канал с ёмкостью (mpsc::channel(n)) заставляет отправителя ждать места: это и есть backpressure."

[[rules]]
kind = "contains"
globs = ["src/crates/social-core/src/events/bus.rs"]
regex = 'broadcast'
message.ru = "Доменные события расходятся подписчикам через tokio::sync::broadcast: каждому своя копия Arc<Event>."

[[rules]]
kind = "contains"
globs = ["src/crates/social-core/src/events/bus.rs"]
regex = 'Lagged'
message.ru = "Отстающий подписчик broadcast получает RecvError::Lagged(n): поток событий считает потери (Next::Missed) и читает дальше, а не падает."

[[rules]]
kind = "contains"
globs = ["src/crates/social-core/src/app/fanout.rs"]
regex = 'mpsc::channel'
message.ru = "Уведомления о новых постах идут через очередь доставки на mpsc::channel с ёмкостью queue."

[[rules]]
kind = "contains"
globs = ["src/crates/social-core/src/app/fanout.rs", "src/crates/social-core/src/app/trends.rs"]
regex = 'oneshot'
message.ru = "Ответ обработчика (flush дошёл, тренды пересчитаны) приходит через oneshot."

[[rules]]
kind = "contains"
globs = ["src/crates/social-core/src/app/fanout.rs", "src/crates/social-core/src/app/trends.rs"]
regex = 'select!'
message.ru = "Обработчик крутится в select! по своим каналам, тикеру и сигналу остановки."

[[rules]]
kind = "contains"
globs = ["src/crates/social-core/src/app/fanout.rs", "src/crates/social-core/src/app/trends.rs"]
regex = 'biased;'
message.ru = "Сигнал остановки проверяется первым: select! с biased; и веткой остановки сверху."

[[rules]]
kind = "contains"
globs = ["src/crates/social-core/src/app/settings.rs"]
regex = 'watch'
message.ru = "Живые настройки лежат в tokio::sync::watch: читатели берут последнее значение, обработчики ждут changed()."

[[rules]]
kind = "contains"
globs = ["src/crates/social-core/src/app/card.rs"]
regex = 'try_join!'
message.ru = "Части карточки профиля собираются конкурентно через try_join!: первая ошибка отменяет остальные части."

[[rules]]
kind = "contains"
globs = ["src/crates/social-core/src/app/card.rs"]
regex = 'timeout'
message.ru = "У карточки один общий дедлайн на все части: timeout вокруг всего try_join!."

[[rules]]
kind = "absent"
globs = ["src/crates/social-core/src/commands/bus.rs", "src/crates/social-core/src/commands/context.rs", "src/crates/social-core/src/storage/users.rs", "src/crates/social-core/src/storage/posts.rs"]
message.ru = "Синхронная шина команд и её контекст ушли, их место заняла таблица CommandTable. Хранилища в памяти переехали в storage/mem/."

[[rules]]
kind = "not_contains"
globs = ["src/crates/social-core/src/app/**/*.rs"]
regex = 'Network'
message.ru = "App не знает про Network: под портами может быть что угодно, память сейчас, база потом. Сеть в памяти прячется за MemRepo в storage/mem."

[[rules]]
kind = "contains"
globs = ["src/crates/social-core/src/ports/repo.rs"]
regex = 'Pin<Box<dyn Future'
message.ru = "Async-метод трейта не годится для dyn, поэтому порты отдают BoxFuture: `pub type BoxFuture<'a, T> = Pin<Box<dyn Future<Output = T> + Send + 'a>>;`."

[[rules]]
kind = "contains"
globs = ["src/crates/social-core/src/ports/repo.rs"]
regex = 'trait UserRepo: Send \+ Sync'
message.ru = "Порт пользователей это `pub trait UserRepo: Send + Sync`: его держат как Arc<dyn UserRepo> из многих задач."

[[rules]]
kind = "contains"
globs = ["src/crates/social-core/src/ports/repo.rs"]
regex = 'trait PostRepo: Send \+ Sync'
message.ru = "Порт постов это `pub trait PostRepo: Send + Sync`."

[[rules]]
kind = "contains"
globs = ["src/crates/social-core/src/ports/repo.rs"]
regex = 'trait ChatRepo: Send \+ Sync'
message.ru = "Порт переписки это `pub trait ChatRepo: Send + Sync`."

[[rules]]
kind = "contains"
globs = ["src/crates/social-core/src/ports/repo.rs"]
regex = 'Arc<dyn UserRepo>'
message.ru = "Repos держит порты как Arc<dyn …>: App не знает конкретных типов хранилищ."

[[rules]]
kind = "contains"
globs = ["src/crates/social-core/src/app/queries.rs"]
regex = 'Box::pin'
message.ru = "Ветка комментариев грузится рекурсивной async fn: рекурсивный вызов заворачивается в Box::pin, иначе у future бесконечный размер."

[[rules]]
kind = "contains"
globs = ["src/crates/social-core/src/commands/table.rs"]
regex = 'BoxFuture'
message.ru = "Таблица хранит обработчики как Box<dyn Fn(App, Command) -> BoxFuture<'static, ..> + Send + Sync> и заворачивает обычные async fn сама."

[[rules]]
kind = "deps"
package = "src/crates/social-core"
forbid = ["async-trait", "futures"]
message.ru = "BoxFuture и обёртку обработчиков пишем сами, это пара строк: ни async-trait, ни futures ядру не нужны."

[[rules]]
kind = "deps"
package = "src/crates/service-runtime"
allow_only = ["tokio"]
message.ru = "service-runtime это кирпич под всеми сервисами: только tokio. Ни tokio-util, ни крейтов соцсети, свой токен и учёт задач пишутся в пару экранов."

[[rules]]
kind = "deps"
package = "src/crates/service-runtime"
forbid = ["tokio-util"]
message.ru = "Готовые CancellationToken и TaskTracker из tokio-util не берём: в этой вехе их пишем сами."

[[rules]]
kind = "no_comments"
globs = ["src/crates/service-runtime/**/*.rs"]
message.ru = "В крейте service-runtime нет комментариев: имена должны говорить сами."

[[rules]]
kind = "contains"
globs = ["src/crates/service-runtime/src/token/mod.rs"]
regex = 'watch::'
message.ru = "Токен отмены стоит на tokio::sync::watch: у watch есть текущее значение, и слушатель, пришедший после отмены, не зависнет."

[[rules]]
kind = "contains"
globs = ["src/crates/service-runtime/src/token/mod.rs"]
regex = 'send_replace'
message.ru = "Отмена пишется через send_replace: обычный send без получателей ничего не запишет, и сигнал потеряется."

[[rules]]
kind = "contains"
globs = ["src/crates/service-runtime/src/supervisor/mod.rs"]
regex = 'impl<T> Drop for'
message.ru = "Ребёнок не должен пережить супервизора: держи его JoinHandle в обёртке, которая в Drop делает abort."

[[rules]]
kind = "contains"
globs = ["src/crates/service-runtime/src/shutdown/mod.rs"]
regex = 'timeout_at'
message.ru = "У всей остановки один дедлайн: каждая стадия ждёт через timeout_at до общего срока, а не свой отдельный таймаут."

[[rules]]
kind = "contains"
globs = ["src/crates/social-core/src/app/fanout.rs"]
regex = 'supervise'
message.ru = "Воркеры доставки живут под supervise из service-runtime: упавший поднимается снова."

[[rules]]
kind = "contains"
globs = ["src/crates/social-core/src/app/fanout.rs"]
regex = 'notify_batch'
message.ru = "Воркер отдаёт уведомления пачкой через Notifier::notify_batch."

[[rules]]
kind = "not_contains"
globs = ["src/crates/social-core/src/**/*.rs"]
regex = 'catch_unwind'
message.ru = "catch_unwind больше не нужен: упавший воркер перезапускает супервизор, а не глушит обёртка."

[[rules]]
kind = "contains"
globs = ["src/crates/social-core/src/app/trends.rs"]
regex = 'struct TrendsHandle'
message.ru = "Тренды живут в акторе, снаружи видна только ручка TrendsHandle с async-методами."

[[rules]]
kind = "contains"
globs = ["src/crates/social-core/src/app/mod.rs"]
regex = 'Shutdown'
message.ru = "Ядро останавливается через Shutdown из service-runtime: стадии sources, handlers, trends и общий дедлайн."

[[rules]]
kind = "contains"
globs = ["src/crates/social-core/Cargo.toml"]
regex = '^service-runtime.workspace = true'
message.ru = "Ядро подключает service-runtime в [dependencies]: `service-runtime.workspace = true`."

[[rules]]
kind = "absent"
globs = ["src/crates/*/tests/m??_*.rs", "tools/*/tests/m??_*.rs"]
message.ru = "Тесты вех живут в tests/journey/ своего пакета (один тестовый бинарник на пакет, mod на каждую веху в tests/journey/main.rs). Старые tests/mNN_*.rs удали: их новые версии уже лежат в tests/journey/."
