hint.ru = [
"""Начни с крейта, он не знает про соцсеть. Токен это `Arc<watch::Sender<bool>>` и, у ребёнка, копия родителя:
`is_cancelled` смотрит свой флаг и предков, а `cancelled()` ждёт `wait_for(|on| *on)` своего флага и (через
`select!`) отмену родителя; рекурсия по предкам требует `Box::pin`. Учёт задач: карта id в `AbortHandle` под замком
и `watch` со счётчиком; guard в задаче убирает её запись в `Drop`, поэтому и отменённая задача уходит из учёта.""",
"""Остановка: стадии в векторе в порядке объявления. Для каждой: `token.cancel()`, `tasks.close()`, потом
`timeout_at(общий_срок, tasks.wait())`. Не успели, значит `abort_all()` и ещё одно `wait()`. Супервизор держит
ребёнка в обёртке с `abort` в `Drop`: если задачу супервизора отменили по дедлайну, ребёнок не останется сиротой.""",
"""Воркеры доставки: у каждого своя очередь, `hash_one(user) % workers` выбирает очередь. Воркер в `select!` с
`biased;`: токен стадии (закрыть очередь, дочитать, отдать хвост, выйти), `recv` (в пачку, при `batch_size` сразу
отдать) и `sleep_until(срок_пачки), if !batch.is_empty()`. Под `supervise` воркеру нужна та же очередь после
перезапуска: `tokio::sync::Mutex<Receiver>` в общем `Arc`, а супервизору токен корня, не стадии, иначе он оборвёт
воркер раньше, чем тот отдаст хвост.""",
"""Актор трендов: задача с `mpsc::Receiver<Request>` и `watch::Sender<Arc<[Trend]>>`, запросы `Refresh` и `Top`
несут `oneshot::Sender`. `App::trends(n)` читает `watch::Receiver` без запроса к актору. Тикер теперь отдельная
задача в стадии sources: всё, что раньше пересчитывало тренды, превращается в `handle.refresh().await`.""",
]
story.ru = """Соцсеть уходит так же аккуратно, как работает: тикер замолкает первым, воркеры дочитывают очередь и
отдают последние пачки, актор трендов гаснет последним, а того, кто завис, close добивает к сроку. Упавший воркер
поднимается сам."""
