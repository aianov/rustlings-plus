[chapter]
title.en = "Cancellation and shutdown"
title.ru = "Отмена и остановка"

[[chapter.visuals]]
file = "visuals/graceful_shutdown.html"
title.ru = "Корректная остановка: сигнал по дереву токенов, учёт задач, дедлайн и abort"

[[exercises]]
name = "lc1"
style = "scratch"
hint.ru = [
  """Нужно значение, которое можно один раз перевести из «нет» в «да», которое видят все и до которого ждущий может дойти позже. Подумай про канал `watch`: у него есть текущее значение, а не только события.""",
  """`watch::Sender<bool>` в `Arc` (чтобы клонировать токен), `cancel` записывает `true` через `send_replace` (в отличие от `send`, он работает и без единого получателя), `is_cancelled` читает `borrow()`, а `cancelled` подписывается и ждёт значения `true` методом `wait_for`.""",
]
why.ru = """`watch` подходит как никакой другой канал: у него есть текущее значение, поэтому опоздавший слушатель видит уже сделанную отмену сразу (`wait_for` сначала смотрит текущее значение). `Notify` тут не годится: сигнал, посланный до подписки, пропадает. Тонкость в `send_replace`: обычный `send` у `watch` ничего не записывает, когда получателей нет, и отмена до первого слушателя потерялась бы. Токен это `Arc<Sender>`, а ждущие подписываются на лету, так что клонов можно плодить сколько угодно."""

[[exercises]]
name = "lc2"
style = "scratch"
hint.ru = [
  """Ребёнку нужны два сигнала: свой и родительский. Откуда ему узнать про отмену родителя без отдельной задачи, которая бы пересылала сигнал? Родитель ведь тоже умеет отвечать на вопрос «ты отменён?».""",
  """Токен хранит свой `Sender` и список `Sender`ов предков. `is_cancelled` проверяет все. А вот `cancelled().await` должен проснуться, когда сработает любой из них: подпишись на каждый и жди первый готовый future (в крейте `futures` для этого есть `select_all`).""",
]
why.ru = """Дерево токенов можно построить двумя способами: пересылкой (вешаем на родителя задачу, которая отменит ребёнка) и просмотром вверх (ребёнок сам спрашивает предков). У пересылки две беды: нужна лишняя задача на каждого ребёнка, и `is_cancelled` ребёнка отстаёт на один поворот планировщика. Просмотр вверх даёт мгновенный ответ без задач. Цена: `cancelled()` ждёт сразу несколько сигналов, для этого `select_all` по подпискам на всю цепочку. Направление только вниз: ребёнок знает предков, предки детей не знают."""

[[exercises]]
name = "lc_q1"
kind = "question"
style = "bughunt"
question.ru = """Дерево токенов собрано так. Что из перечисленного отменено сразу после последней строки? Выбери все.

```rust
let root = Token::new();
let a = root.child();
let b = root.child();
let a1 = a.child();
a.cancel();
let a2 = a.child();
```"""
options.ru = ["`root`", "`a`", "`b`", "`a1`", "`a2`"]
answer = [1, 3, 4]
explain.ru = """Сигнал идёт только вниз по дереву. `a` отменён сам, `a1` его ребёнок и отменяется вместе с ним, а `a2` создан уже у отменённого родителя и рождается отменённым. Родитель `root` и брат `b` отмену не видят: они выше или рядом."""
hint.ru = """В какую сторону идёт сигнал: к детям, к родителю или к соседям?"""

[[exercises]]
name = "lc3"
style = "fix"
hint.ru = [
  """Цикл по `interval` бесконечный: в нём нет места, где задача могла бы услышать токен. Тебе нужно ждать сразу двух событий и реагировать на то, что наступит раньше. Что в прошлых главах ждёт несколько событий сразу?""",
  """`select!` с двумя ветками: `token.cancelled()` и `tick.tick()`. Первый тик `interval` готов сразу, а отменённый токен тоже готов сразу, и без порядка опроса выбор между ними случаен. Какая ветка должна выигрывать, когда готовы обе?""",
]
why.ru = """Фоновая задача останавливается там, где она ждёт: `select!` между токеном и тем, что задача делает обычно. Пока цикл просто ждёт тиков, остановить его снаружи нечем. `biased;` важен из-за первого тика `interval`, который готов сразу: без приоритета у уже отменённого токена с вероятностью в половину получится «один лишний удар». Остановка по токену мгновенная и в середине периода, а не «после следующего тика», потому что ветка отмены опрашивается наравне с таймером."""

[[exercises]]
name = "lc4"
style = "scratch"
hint.ru = [
  """Счётчик нужен общий, и ждать его обнуления лучше не опросом в цикле, а так, чтобы будил сам счётчик. Какой канал хранит текущее значение и умеет его дождаться? А вот убавлять его нужно в любом случае, как бы задача ни закончилась.""",
  """`watch::Sender<usize>`: `send_modify` меняет число, `wait_for(|n| *n == 0)` ждёт ноль. Прибавляй до `tokio::spawn`, а убавляй в `Drop` небольшой структуры, которую ты переносишь внутрь задачи: `Drop` сработает и при возврате, и при панике, и при `abort`.""",
]
why.ru = """Счёт увеличивается в `spawn`, снаружи задачи: если считать внутри, между запуском и первым опросом есть щель, в которую попадёт `wait` и решит, что задач нет. Убавляет число `Drop` охранника, а не код в конце задачи: код в конце не выполнится ни при панике, ни при `abort`, зато все локальные переменные задачи при этом уничтожаются. `watch` хранит число и умеет его ждать, поэтому `wait` не опрашивает счётчик по таймеру. Задача, порождающая задачу, увеличивает счёт ещё до своего конца, поэтому нуль не наступит раньше времени."""

[[exercises]]
name = "lc_q2"
kind = "question"
style = "bughunt"
question.ru = """Учёт задач бывает написан по-разному. В каких реализациях `spawn` у `wait()` есть шанс вернуться, пока полезная работа ещё идёт, или не вернуться вообще? Выбери все.

```rust
// A
count.fetch_add(1);
let exit = Exit(count.clone());                 // Drop уменьшает счётчик
tokio::spawn(async move { let _e = exit; work.await; });

// B
tokio::spawn(async move {
    count.fetch_add(1);
    work.await;
    count.fetch_sub(1);
});

// C
count.fetch_add(1);
tokio::spawn(async move {
    work.await;
    count.fetch_sub(1);
});
```"""
options.ru = ["A", "B", "C"]
answer = [1, 2]
explain.ru = """В варианте B счётчик растёт внутри задачи: между `spawn` и первым опросом он ещё нулевой, и `wait()` в этот момент решит, что работы нет. В варианте C уменьшение стоит после `work.await`, так что при панике `work` оно не выполнится, и `wait()` будет ждать вечно. В варианте A прибавление идёт до `spawn`, а уменьшение сидит в `Drop`, поэтому он выдерживает и панику, и `abort`."""
hint.ru = """Где именно растёт счётчик и какой код выполняется, если задача упала?"""

[[exercises]]
name = "lc5"
style = "todo"
hint.ru = [
  """Сервер должен слушать два события: новое задание и сигнал. После выхода из цикла работа ещё не окончена. Кто знает, сколько задач сейчас в полёте?""",
  """Каждое задание запускай через `Tracker::spawn`. Цикл на `select!` с `biased;`: сигнал выше очереди (иначе уже отменённый сервер возьмёт задание). После цикла `tracker.wait().await`.""",
]
why.ru = """Остановка делится на две фазы: перестать принимать и доделать принятое. Первая это выход из цикла по токену (с `biased;`, чтобы сигнал не проигрывал забитой очереди), вторая это `tracker.wait()`, который ждёт все взятые задачи. Если вернуться сразу после цикла, `serve` скажет «готово», а задачи ещё будут работать без присмотра: клиенты получат «принято» и не получат результата. Задания, лежащие в очереди и не взятые, остаются там: решение, что с ними делать, принимает хозяин очереди."""

[[exercises]]
name = "lc6"
style = "todo"
hint.ru = [
  """Ждать нужно задачи из `JoinSet` по одной, но весь отсчёт один на всех: не сто миллисекунд на каждую, а общий срок. Что даёт `join_next`, когда набор пуст? И что нужно сделать после принудительной остановки, чтобы быть уверенным, что задачи действительно исчезли?""",
  """Фиксируй момент срока один раз (`Instant::now() + deadline`) и ждись `timeout_at(limit, tasks.join_next())`. Когда срок вышел, число оставшихся задач в наборе это `aborted`. Потом `abort_all()` и ещё один цикл `join_next`, чтобы дождаться, пока отменённые задачи действительно уничтожены.""",
]
why.ru = """Общий срок это один момент, а не таймаут на каждое ожидание: иначе три упрямые задачи по очереди съели бы втрое больше времени. Принудительная остановка (`abort_all`) только планирует уничтожение: задача уничтожается, когда рантайм дойдёт до её точки `.await`. Чтобы к моменту возврата ничего не осталось, нужно дочитать `join_next` до конца: так видно, что `Drop` у остановленных задач уже выполнился. Всё это работает только потому, что у упрямой задачи есть `.await`: `abort` не может остановить цикл без точек ожидания."""

[[exercises]]
name = "lc_q3"
kind = "question"
style = "bughunt"
question.ru = """После `abort_all()` и вызова `join_next` до конца какие из этих задач продолжают выполнять свой код? Выбери все.

```rust
// 0
loop { sleep(Duration::from_millis(10)).await; }

// 1
loop { counter.fetch_add(1, Ordering::Relaxed); }

// 2
while let Some(job) = rx.recv().await { handle(job); }

// 3
spawn_blocking(|| loop { if stop.load(Ordering::Relaxed) { break; } }).await.unwrap();
```"""
options.ru = ["0", "1", "2", "3"]
answer = [1, 3]
explain.ru = """`abort` срабатывает только в точке `.await`: задача снимается там, где она остановилась. В вариантах 0 и 2 такие точки есть. В варианте 1 их нет, цикл не отдаёт управление, и остановить задачу снаружи нельзя (на однопоточном рантайме вместе с ней встаёт всё остальное). В варианте 3 внешняя задача снимется, но блокирующая работа в отдельном потоке отменить нельзя: она будет крутиться, пока сама не проверит `stop`."""
hint.ru = """Где задача может быть остановлена снаружи и что остаётся за пределами рантайма?"""

[[exercises]]
name = "lc7"
style = "todo"
hint.ru = [
  """Три части связаны цепочкой: источник кормит обработчика, обработчик кормит журнал. Что случится, если журнал закрыть раньше обработчика, а обработчика раньше, чем он доел очередь? Остановка идёт против течения данных или по течению?""",
  """Сначала источник: отмени его токен и дождись его задачи. Потом дождись обработчика: он сам закончит, когда в его очереди не останется ничего (источник ушёл и выбросил отправителя). И только потом отмени токен журнала и дождись журнала.""",
]
why.ru = """Остановку строят по течению данных: сначала то, что порождает (источник), затем то, что обрабатывает (оно доедает очередь и выходит, когда очередь закрылась), и в самом конце то, что только принимает результаты (журнал). Закрыть всё одним махом значит потерять то, что лежало в очередях между частями. Обработчику отдельный токен не нужен: его останавливает закрытие входной очереди, а это следствие остановки источника. Журнал же получает записи и от других частей (`_audit` держит канал открытым), поэтому сам не закроется, и его останавливает токен, но только после того, как обработчик закончил."""

[[exercises]]
name = "lc8"
style = "scratch"
hint.ru = [
  """Надзиратель это цикл «запустить, дождаться, решить». Запускать задачу нужно через `tokio::spawn`, иначе паника уронит самого надзирателя. Что возвращает `JoinHandle` при панике?""",
  """`let mut child = tokio::spawn(make());` и `select!` между `&mut child` и `token.cancelled()`. Если победил токен, `child.abort()` и дождись его. Если задача упала, проверь счётчик и подожди паузу, тоже в `select!` с токеном. Бросить `JoinHandle` не значит остановить задачу: он её только отпускает.""",
]
why.ru = """Надзиратель запускает задачу через `spawn`, а не `.await`: паника тогда превращается в `Err(JoinError)` у `JoinHandle`, и её можно обработать. Пауза между попытками и предел нужны, чтобы вечно падающая задача не крутилась вхолостую; предел считается по попыткам: первая плюс `max_restarts`. Токен слушают в обоих местах ожидания: и пока задача работает, и пока длится пауза, иначе остановка зависнет на `pause`. Самое коварное место: выброшенный `JoinHandle` задачу не останавливает, поэтому при отмене её надо явно `abort()` и дождаться, иначе она останется жить сиротой."""

[[exercises]]
name = "lc_q4"
kind = "question"
style = "bughunt"
question.ru = """Надзиратель написан так. Токен отменили, пока ребёнок работал. Что происходит с ребёнком после возврата `Cancelled`?

```rust
let child = tokio::spawn(make());
tokio::select! {
    result = child => { /* перезапуск или конец */ }
    _ = token.cancelled() => return Outcome::Cancelled,
}
```"""
options.ru = ["Ребёнок остановлен: выброшенный `JoinHandle` отменяет задачу", "Ребёнок продолжает работать, пока сам не закончится: `JoinHandle` его только отпустил", "Ребёнок остановится на ближайшем `.await`", "Программа упадёт с паникой при выходе из `select!`"]
answer = [1]
explain.ru = """Выброшенный `JoinHandle` задачу не останавливает, он лишь перестаёт быть способом её дождаться. Ребёнок остаётся сиротой и работает, пока не дойдёт до конца сам, а при задаче вроде «жди вечно» не остановится никогда. Остановить надо явно: `child.abort()` и дождаться. Проверено запуском."""
hint.ru = """Что делает выброс `JoinHandle` с самой задачей?"""

[[exercises]]
name = "lc9"
style = "fix"
hint.ru = [
  """В `Drop` нельзя ни `.await`, ни блокироваться на асинхронной работе: выброс сессии происходит прямо внутри рантайма, и он не позволит вложенный `block_on`. Что можно сделать в `Drop` синхронно, не ожидая, и кто потом подхватит дело?""",
  """В сессии уже есть канал без ограничения и фоновая задача, которая читает из него и пишет в приёмник. Отправка в такой канал синхронная. После `close` буфер пуст: пустое не отправляй. Ошибку отправки (фоновой задачи уже нет) сделай безвредной.""",
]
why.ru = """`Drop` синхронный: `.await` в нём нельзя, а блокирующее ожидание внутри рантайма либо паникует (`block_on` в рантайме), либо вешает рабочий поток. Поэтому дело делят: настоящий путь это явный `close().await`, а `Drop` это страховка, которая ничего не ждёт, а лишь передаёт буфер фоновой задаче через канал без ограничения (его `send` синхронный). Буфер опустошается в `close`, потому что `Drop` сработает и после него; без этого строки записывались бы дважды. Ошибка отправки в `Drop` не повод паниковать: если фоновой задачи уже нет, то рантайм, скорее всего, закрывается, и терять приходится молча."""

[[exercises]]
name = "lc_q5"
kind = "question"
style = "bughunt"
question.ru = """Что из этого можно написать в `Drop::drop` сессии, чтобы оно скомпилировалось и не заблокировало поток рантайма? Выбери все.

```rust
// 0
self.sink.write_all(lines).await;

// 1
futures::executor::block_on(self.sink.write_all(lines));

// 2
let _ = self.fallback.send(lines);          // UnboundedSender

// 3
let sink = self.sink.clone();
tokio::spawn(async move { sink.write_all(lines).await });
```"""
options.ru = ["0", "1", "2", "3"]
answer = [2, 3]
explain.ru = """`Drop::drop` не асинхронная функция, поэтому `.await` в варианте 0 не скомпилируется. Вариант 1 компилируется, но `block_on` держит поток, пока приёмник не закончит; на рантайме с одним потоком этот самый поток нужен приёмнику, и всё встанет. Вариант 2 синхронный и мгновенный. Вариант 3 тоже не блокирует, но работает, только пока в этом потоке есть рантайм, и не гарантирует, что запись закончится до остановки программы."""
hint.ru = """Что в `Drop` можно сделать синхронно и мгновенно, и кто потом доведёт дело до конца?"""

[[exercises]]
name = "lc_shutdown"
style = "scratch"
quiz = true
hint.ru = [
  """Порядок: источник (тикер), потом то, что разбирает очередь (воркеры), и только в конце то, что принимает результаты (актор). Воркеры под надзирателем: как узнать, что надзиратель кончил и воркер в порядке? А как заставить его остановить зависшего ребёнка?""",
  """Воркеры запусти через `supervise` в `JoinSet<Outcome>` с общим токеном воркеров. В остановке: токен тикера и дождись тикера; дождись воркеров по общему сроку (`timeout_at`); если срок вышел, отмени токен воркеров, и надзиратели сами остановят детей; потом выброси `Results` и дождись актора. Для `probe` каждая запущенная задача должна получить копию (в `make` клонируй конфиг).""",
]
why.ru = """Это та же схема, что в вехе: останавливать по течению данных (тикер, воркеры, актор) и дать каждой стадии время закончиться, а не сломать всех разом. Воркеры под надзирателем с общим токеном: мирный путь ждёт, пока они выйдут сами, а принудительный это отмена токена, после чего надзиратели останавливают зависших детей (иначе `abort` самого надзирателя оставил бы ребёнка сиротой, и проба осталась бы взятой). Актор останавливается последним и только после того, как выброшены все `Results`: тогда результаты, ещё лежащие в очереди, не пропадают. Счётчик `Arc::strong_count` в тесте это доказательство «живых задач нет»: любая забытая задача держит свою копию."""

[[exercises]]
name = "m20_clean_shutdown"
kind = "milestone"
journey = "backend"
quiz = true
