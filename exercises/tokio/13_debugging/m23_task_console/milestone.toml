hint.ru = [
"""Начни с `Traced<F>`: это обёртка-Future над `Pin<Box<F>>`, поэтому сама она `Unpin`, и в `poll` хватает `&mut *self`.
Запись о задаче (id, имя, число poll, состояние, момент последней смены) лежит в `Arc<Slot>` со своим маленьким
`Mutex`, а реестр держит `BTreeMap<u64, Arc<Slot>>` живых: так poll не трогает общий замок.""",
"""Задача уходит из реестра в `Drop` обёртки. Завершилась она или её бросили, видно по флагу `done`, который ставит
`poll`, вернувший `Ready`. Паника посреди poll: заведи в `poll` маленький guard со своим `Drop`, который помечает
запись упавшей, и разоружи его после возврата из внутреннего poll. Если внутренний poll упал, guard сработает при
раскрутке стека.""",
"""Длину poll меряй `std::time::Instant`: на замороженных часах tokio она всегда ноль. А «ждёт 600 мс» считай по
`tokio::time::Instant`, иначе тест с `advance` не увидит точных чисел.""",
"""В ядре задачи стадий запускает `stage.spawn("имя", ...)`. Воркер доставки запускает супервизор, поэтому
заворачивай его в `console.traced("fanout-worker", ...)` прямо в `make`, а задачи импорта в `traced` перед
`spawn_on`. Команда `tasks` сначала делает `flush`: после него каждый воркер точно стартовал и попал в дамп.""",
]
story.ru = """У соцсети появилась своя консоль задач: `tasks` показывает каждую фоновую задачу с именем и тем, сколько она уже
ждёт, а сторож запоминает poll, который держал поток дольше порога. Утечку теперь видно числом, а не догадкой."""
