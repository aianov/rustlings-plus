<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Граф ожидания</title>
<style>
:root { --bg:#f6f7f9; --panel:#fff; --ink:#1c2330; --muted:#667085; --line:#d5d9e0; --a:#2f6fed; --b:#d9822b; --ok:#2e9e5b; --bad:#d64545; --code:#f0f2f6; }
@media (prefers-color-scheme: dark) { :root { --bg:#12151b; --panel:#1b2029; --ink:#e6e9ef; --muted:#98a2b3; --line:#343b49; --a:#6b9bff; --b:#f0a85a; --ok:#4cc585; --bad:#ff7b7b; --code:#151a22; } }
* { box-sizing:border-box; }
body { margin:0; padding:16px; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
h1 { font-size:18px; margin:0 0 4px; } .sub { color:var(--muted); margin:0 0 12px; }
.modes { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
.mode { text-align:left; font:13px/1.4 ui-monospace,Menlo,monospace; padding:8px 12px; border-radius:8px; border:2px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer; }
.mode.on { border-color:var(--a); } .mode small { display:block; font:12px system-ui,sans-serif; color:var(--muted); }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:10px; }
.cols { display:flex; gap:10px; flex-wrap:wrap; }
.col { flex:1 1 170px; min-width:150px; border:1px solid var(--line); border-radius:8px; padding:8px; background:var(--bg); }
.col h2 { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:0 0 8px; }
.chip { display:block; margin:4px 0; padding:6px 10px; border-radius:8px; border:2px solid var(--line); font:600 13px ui-monospace,Menlo,monospace; background:var(--panel); }
.chip.a { border-color:var(--a); } .chip.b { border-color:var(--b); } .chip.ok { border-color:var(--ok); color:var(--ok); } .chip.bad { border-color:var(--bad); color:var(--bad); }
.chip.gone { opacity:.5; text-decoration:line-through; border-style:dashed; }
.empty { color:var(--muted); font-size:13px; font-style:italic; }
code { font:13px ui-monospace,Menlo,monospace; background:var(--code); padding:1px 5px; border-radius:4px; }
.caption { padding:10px 12px; border-radius:8px; background:var(--panel); border:1px solid var(--line); min-height:68px; margin-bottom:10px; }
.controls { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
button.ctl { font:600 14px system-ui,sans-serif; padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer; }
button.ctl:disabled { opacity:.45; cursor:default; } .counter { color:var(--muted); font-size:13px; margin-left:auto; }
.verdict { margin-top:10px; padding:8px 12px; border-radius:8px; border:2px solid var(--line); font:600 14px system-ui,sans-serif; }
.verdict.ok { border-color:var(--ok); color:var(--ok); } .verdict.bad { border-color:var(--bad); color:var(--bad); } .verdict.info { color:var(--muted); }
</style>
</head>
<body>
<h1>Кто кого ждёт: цикл в графе и есть дедлок</h1>
<p class="sub">У зависшего кода нет стека, зато есть граф: задачи держат ресурсы и ждут ресурсы. Нарисуй его, найди цикл.</p>
<div class="modes" id="modes"></div>
<div class="panel" id="view"></div>
<div class="caption" id="caption"></div>
<div class="controls">
  <button class="ctl" id="step">Шаг</button><button class="ctl" id="play">Играть</button><button class="ctl" id="reset">Сброс</button>
  <span class="counter" id="counter"></span>
</div>
<script>
const MODES = {"locks": {"label": "Два замка", "small": "встречные переводы", "steps": [{"cols": [{"h": "Задача 1 (A в B)", "items": [{"t": "идёт", "s": "a"}]}, {"h": "Замки", "items": [{"t": "A", "s": ""}, {"t": "B", "s": ""}]}, {"h": "Задача 2 (B в A)", "items": [{"t": "идёт", "s": "b"}]}], "v": {"k": "info", "t": "Обе задачи только начали"}, "cap": "Перевод из A в B берёт сначала A, потом B. Встречный перевод из B в A берёт сначала B, потом A."}, {"cols": [{"h": "Задача 1 (A в B)", "items": [{"t": "держит A", "s": "ok"}]}, {"h": "Замки", "items": [{"t": "A: занят задачей 1", "s": "a"}, {"t": "B: свободен", "s": ""}]}, {"h": "Задача 2 (B в A)", "items": [{"t": "держит B", "s": "ok"}]}], "v": {"k": "info", "t": "Каждая взяла свой первый замок"}, "cap": "Между двумя захватами есть точка <code>.await</code> (проверка лимитов), и именно в ней задачи успели переключиться."}, {"cols": [{"h": "Задача 1 (A в B)", "items": [{"t": "держит A, ждёт B", "s": "bad"}]}, {"h": "Замки", "items": [{"t": "A: занят задачей 1", "s": "a"}, {"t": "B: занят задачей 2", "s": "b"}]}, {"h": "Задача 2 (B в A)", "items": [{"t": "держит B, ждёт A", "s": "bad"}]}], "v": {"k": "bad", "t": "Цикл: 1 → B → 2 → A → 1"}, "cap": "Задача 1 ждёт замок, который держит задача 2, а задача 2 ждёт замок, который держит задача 1. Это и есть граф с циклом. Никто никого не отпустит, таймеров нет, поэтому рантайм тоже тихо стоит."}, {"cols": [{"h": "Задача 1 (A в B)", "items": [{"t": "берёт A, потом B", "s": "ok"}]}, {"h": "Замки", "items": [{"t": "порядок: сначала меньший номер", "s": "ok"}]}, {"h": "Задача 2 (B в A)", "items": [{"t": "берёт A, потом B", "s": "ok"}]}], "v": {"k": "ok", "t": "Единый порядок: цикл невозможен"}, "cap": "Оба берут сначала замок с меньшим номером (A), независимо от направления перевода. Цепочка «держу X, жду Y» идёт только вверх по номерам, замкнуться ей не на чем."}]}, "self": {"label": "Актор и он сам", "small": "summary через собственный Handle", "steps": [{"cols": [{"h": "Клиент", "items": [{"t": "summary()", "s": "a"}]}, {"h": "Ящик актора", "items": [{"t": "Summary", "s": "b"}]}, {"h": "Актор", "items": [{"t": "читает ящик", "s": "ok"}]}], "v": {"k": "info", "t": "Запрос ушёл в ящик актора"}, "cap": "Клиент отправил <code>Summary</code> и ждёт ответа."}, {"cols": [{"h": "Клиент", "items": [{"t": "ждёт актора", "s": "gone"}]}, {"h": "Ящик актора", "items": [{"t": "пусто", "s": "gone"}]}, {"h": "Актор", "items": [{"t": "обрабатывает Summary", "s": "ok"}, {"t": "шлёт себе Get(a) и ждёт", "s": "bad"}]}], "v": {"k": "info", "t": "Актор задал вопрос самому себе"}, "cap": "Чтобы собрать сводку, актор вызывает <code>me.get(..).await</code>: это обычный публичный метод, он кладёт <code>Get</code> в тот же ящик."}, {"cols": [{"h": "Клиент", "items": [{"t": "ждёт актора", "s": "gone"}]}, {"h": "Ящик актора", "items": [{"t": "Get(a): никто не читает", "s": "bad"}]}, {"h": "Актор", "items": [{"t": "ждёт ответа на Get", "s": "bad"}]}], "v": {"k": "bad", "t": "Цикл из одного участника"}, "cap": "Ответить на <code>Get</code> может только актор, но он занят ожиданием этого же ответа. Единственный читатель ящика не вернётся к чтению."}, {"cols": [{"h": "Клиент", "items": [{"t": "получил сводку", "s": "ok"}]}, {"h": "Ящик актора", "items": [{"t": "пусто", "s": "gone"}]}, {"h": "Актор", "items": [{"t": "собирает сводку из своего data", "s": "ok"}]}], "v": {"k": "ok", "t": "Внутри актора данные берут напрямую"}, "cap": "<code>Handle</code> существует для других. У самого актора состояние лежит в локальной переменной: сводка собирается из неё без единого сообщения."}]}, "mailboxes": {"label": "Полные ящики", "small": "два актора шлют друг другу", "steps": [{"cols": [{"h": "Актор A", "items": [{"t": "получил порцию, шлёт две в B", "s": "a"}]}, {"h": "Ящики (по 1)", "items": [{"t": "ящик A: пусто", "s": ""}, {"t": "ящик B: пусто", "s": ""}]}, {"h": "Актор B", "items": [{"t": "получил порцию, шлёт две в A", "s": "b"}]}], "v": {"k": "info", "t": "Обе стороны начали разгребать входящие"}, "cap": "Каждая порция глубины 3 порождает две порции глубины 2 для напарника."}, {"cols": [{"h": "Актор A", "items": [{"t": "send(1) в B: принят", "s": "ok"}, {"t": "send(2) в B: ждёт места", "s": "bad"}]}, {"h": "Ящики (по 1)", "items": [{"t": "ящик A: порция", "s": "a"}, {"t": "ящик B: порция", "s": "b"}]}, {"h": "Актор B", "items": [{"t": "send(1) в A: принят", "s": "ok"}, {"t": "send(2) в A: ждёт места", "s": "bad"}]}], "v": {"k": "bad", "t": "Оба ящика полны, оба актора на send"}, "cap": "Второй <code>send</code> у каждого упирается в полный ящик напарника. Освободить место может только читающий напарник, а он тоже стоит на <code>send</code>."}, {"cols": [{"h": "Актор A", "items": [{"t": "читает свой ящик, остаток откладывает у себя", "s": "ok"}, {"t": "очередь: [порция]", "s": "a"}]}, {"h": "Ящики (по 1)", "items": [{"t": "ящик A: свободно", "s": "gone"}, {"t": "ящик B: свободно", "s": "gone"}]}, {"h": "Актор B", "items": [{"t": "читает свой ящик, остаток откладывает у себя", "s": "ok"}, {"t": "очередь: [порция]", "s": "b"}]}], "v": {"k": "ok", "t": "Цикл разорван: актор не блокируется на отправке"}, "cap": "Актор, которому некуда отправить, откладывает порцию в собственную очередь и продолжает читать. Отправка идёт, когда в ящике напарника есть бронь места (<code>reserve</code> в <code>select!</code>)."}]}};
const KEYS = Object.keys(MODES);
let mode = KEYS[0], pos = 0, timer = null;
const $ = id => document.getElementById(id);
function view(s) {
  const cols = s.cols.map(c => {
    const items = c.items.length ? c.items.map(i => `<span class="chip ${i.s || ""}">${i.t}</span>`).join("") : `<span class="empty">пусто</span>`;
    return `<div class="col"><h2>${c.h}</h2>${items}</div>`;
  }).join("");
  return `<div class="cols">${cols}</div><div class="verdict ${s.v.k}">${s.v.t}</div>`;
}
function render() {
  const steps = MODES[mode].steps, s = steps[pos];
  $("view").innerHTML = view(s);
  $("caption").innerHTML = s.cap;
  $("counter").textContent = `шаг ${pos} из ${steps.length - 1}`;
  const end = pos >= steps.length - 1;
  $("step").disabled = end; $("play").disabled = end;
  if (end) stop();
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } $("play").textContent = "Играть"; }
function step(){ if (pos < MODES[mode].steps.length - 1) { pos++; render(); } }
function setMode(m){ stop(); mode = m; pos = 0; document.querySelectorAll(".mode").forEach(b => b.classList.toggle("on", b.dataset.m === m)); render(); }
$("modes").innerHTML = KEYS.map(k => `<button class="mode ${k === mode ? "on" : ""}" data-m="${k}">${MODES[k].label}<small>${MODES[k].small}</small></button>`).join("");
document.querySelectorAll(".mode").forEach(b => b.onclick = () => setMode(b.dataset.m));
$("step").onclick = () => { stop(); step(); };
$("play").onclick = () => { if (timer) { stop(); return; } $("play").textContent = "Пауза"; timer = setInterval(step, 1800); };
$("reset").onclick = () => setMode(mode);
render();
</script>
</body>
</html>
