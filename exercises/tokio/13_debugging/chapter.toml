[chapter]
title.en = "Debugging async code"
title.ru = "Отладка async"

[[chapter.visuals]]
file = "visuals/wait_graph.html"
title.ru = "Граф «кто кого ждёт»: цикл в графе и есть дедлок"

[[chapter.visuals]]
file = "visuals/orphan_tasks.html"
title.ru = "Задачи-сироты: на каждое подключение остаётся по одной"

[[exercises]]
name = "dbg1"
style = "todo"
hint.ru = [
  """Ошибка должна нести имя слоя, а имя знает только то место, где слой вызывают. Значит, оборачивать надо каждый вызов отдельно, а не весь `handle` целиком.""",
  """Нужна небольшая обобщённая функция: принимает имя и future слоя, ждёт его не дольше секунды, а при истечении возвращает `Stuck` с этим именем. Подойдёт `tokio::time::timeout` и `map_err`.""",
  """В `handle` каждый из четырёх вызовов проходит через эту функцию, а вопросительный знак отдаёт `Stuck` наверх. Секунда считается у каждого слоя заново, потому что таймер заводится на каждый вызов отдельно.""",
]
why.ru = """Первая задача отладки зависания не в том, чтобы найти причину, а в том, чтобы узнать место. Именованный таймаут на каждом слое превращает «запрос завис» в «завис слой database», а это уже половина диагноза. Таймаут обязан быть на каждом слое отдельно: общий дедлайн скажет только, что время вышло, но не где, а секунда на запрос целиком съедается медленным, но живым слоем. Тест проверяет точное время срабатывания, чтобы отличить это решение от общего дедлайна."""

[[exercises]]
name = "dbg2"
style = "todo"
hint.ru = [
  """Всю статистику меняют до и после опроса внутреннего future. До опроса: счётчик, номер задачи (если ещё не записан) и учёт времени ожидания, которое только что закончилось. После: по результату `Ready` или `Pending`.""",
  """Начало ожидания записывается, когда внутренний future вернул `Pending`. Следующий опрос это конец ожидания: прибавь разницу к сумме и очисти отметку начала. Номер текущей задачи есть у `tokio::task::try_id()`.""",
  """Блокировку статистики держи только в короткие моменты, и не на время опроса внутреннего future: внутри него может понадобиться та же статистика. `inner` уже закреплён в `Box`, поэтому `self.inner.as_mut().poll(cx)` работает без `unsafe`.""",
]
why.ru = """Инструментированный future это основа всех инструментов отладки async: `tokio-console` устроен так же, только записывает больше. Три числа дают почти весь диагноз: число опросов (разбудили ли future вообще), время в ожидании (насколько давно оно ждёт) и номер задачи (чья это вина). Важная деталь: ожидание считается от `Pending` до следующего опроса, а не от создания, поэтому долгая работа внутри `poll` в него не попадает. Внутренний future лежит в `Box::pin`, чтобы обёртка была `Unpin` и не требовала `unsafe`."""

[[exercises]]
name = "dbg3"
style = "scratch"
hint.ru = [
  """Реестр хранит ссылки на статистику в порядке создания, а внешние обёртки создаются раньше внутренних. Значит, искать нужно с конца: первое подходящее с конца и есть самое внутреннее.""",
  """Подходящее то, которое не закончилось и сейчас ждёт (у него есть отметка начала ожидания). Закончившиеся шаги и те, что в этот момент выполняются, пропускай.""",
  """Сколько ждёт, это разница между текущим моментом и отметкой начала ожидания. Для `find_map` удобно, что вопросительный знак внутри замыкания над `Option` пропускает элемент.""",
]
why.ru = """Виноват самый внутренний незавершённый шаг: внешние обёртки тоже не закончены, но они ждут именно его. В реестре обёртки лежат в порядке создания, поэтому внешняя всегда раньше внутренней, и смотреть надо с конца. Закончившиеся ветки не виноваты, как бы медленно они ни работали (проверяется на параллельных ветках). Число опросов отвечает на главный вопрос зависания: единица значит, что будить было нечем, то есть пробуждение потеряно или ждёт не то, что нужно. Время ожидания считается от отметки `Pending`, поэтому оно показывает, как давно всё стоит."""

[[exercises]]
name = "dbg4"
style = "fix"
hint.ru = [
  """Загляни в `add` и `total`: что они делают сразу при входе? Теперь посмотри, что делает `restock`, пока держит `guard`, и сколько таких замков в одной цепочке вызовов.""",
  """Замок `tokio::sync::Mutex` не рекурсивный: задача, которая берёт его во второй раз, ждёт сама себя. Но просто отпустить замок перед вызовами нельзя: параллельные пополнения влезут между добавкой и подсчётом, и итог в ответе перестанет быть точным.""",
  """Вся работа, которая должна быть атомарной (добавить и подсчитать), делается под одним замком, то есть с одним охранником: работай с данными прямо через него, а не через методы, которые берут замок сами.""",
]
why.ru = """`tokio::sync::Mutex` не реентерабельный: вторая попытка взять замок в той же цепочке вызовов ждёт освобождения, которого сама не даст. Зависание при этом не связано с другими задачами, его воспроизводит один вызов. Простое «отпустить и вызвать» убирает зависание, но ломает атомарность: между добавкой и подсчётом проходят чужие пополнения. Правильная форма: одна операция, один охранник, прямая работа с данными. Обычное правило для замков и акторов: публичные методы берут замок, внутренние функции получают уже взятые данные (`&mut HashMap`), чтобы публичные не вызывали друг друга под замком."""

[[exercises]]
name = "dbg5"
style = "fix"
hint.ru = [
  """Встречные переводы берут одни и те же два замка в разном порядке: один держит первый и ждёт второй, другой держит второй и ждёт первый. Нарисуй, кто кого ждёт: получится кольцо.""",
  """Кольцо ломают единым порядком захвата: все берут замки в одной и той же последовательности, например по возрастанию номера счёта, независимо от того, кто откуда куда переводит. После захвата списание и зачисление определяются направлением, а не порядком замков.""",
  """Отдельный случай: счёт тот же. Два раза взять один и тот же замок нельзя (он не реентерабелен), а менять тут нечего, так что случай разбирают до захвата.""",
]
why.ru = """Тупик по замкам требует четырёх условий, и в коде проще всего убрать одно: циклическое ожидание. Единый порядок захвата (здесь по номеру счёта) исключает кольцо, потому что любая цепочка «держу X, жду Y» идёт только вверх по номерам. Направление перевода от порядка замков не зависит: берём замки по возрастанию, а потом решаем, откуда куда деньги. Перевод самому себе это вырожденный цикл из одного замка, его отсекают заранее. Тест с кольцом из пяти переводов нужен потому, что два счёта легко починить частным случаем, а пять уже нет."""

[[exercises]]
name = "dbg_q1"
kind = "question"
style = "bughunt"
question.ru = """Три задачи берут по два замка (асинхронных мьютекса) одновременно, не отпуская первый, пока не получат второй:

```
задача 1: A, потом B
задача 2: B, потом C
задача 3: C, потом A
```

Возможен ли тупик, и что его гарантированно устранит?"""
options.ru = ["Тупик невозможен: у каждой задачи свой набор замков", "Тупик возможен (кольцо 1 → 2 → 3 → 1). Помогает единый порядок A, B, C: задача 3 берёт сначала A, потом C", "Тупик возможен. Помогает замена мьютексов на RwLock", "Тупик возможен. Помогает `yield_now` между захватами"]
answer = [1]
explain.ru = """Каждая задача может взять первый замок и застрять на втором: задача 1 держит A и ждёт B, задача 2 держит B и ждёт C, задача 3 держит C и ждёт A. Это кольцо. Чтобы его разорвать, нужен единый порядок захвата для всех: по алфавиту A, B, C. Тогда задача 3 берёт сначала A, потом C, и цепочка «держу X, жду Y» идёт только вверх, колец быть не может. RwLock при записи ведёт себя так же, а `yield_now` лишь отдаёт ход и ничего не освобождает."""
hint.ru = """Нарисуй, у кого что в руках и кого он ждёт. Есть ли замкнутая цепочка?"""

[[exercises]]
name = "dbg6"
style = "bughunt"
hint.ru = [
  """Тест без писателя проходит, а с писателем висит. Значит, дело в очерёдности. Кто стоит в очереди на замок и чьё чтение оказывается за чьей записью?""",
  """Замок `RwLock` в tokio честный: когда писатель встал в очередь, новые читатели пропускают его вперёд и ждут, даже если сейчас замок держат только читатели. Читатель, который во второй раз просит чтение, не получит его, пока не пройдёт писатель, а писатель ждёт, пока читатель отпустит первое.""",
  """Одного охранника достаточно, чтобы увидеть и число, и список: вызывать для длины отдельный метод, который берёт замок сам, не надо. Отсюда же и согласованность: число и список теперь из одного состояния.""",
]
why.ru = """Повторное чтение не безопасно на `RwLock`, как это принято считать. Замок честный (писателя в очереди не обгоняют новые читатели), поэтому читатель, которому нужно ещё одно чтение, может встать в очередь за писателем, который ждёт его же. Без писателя всё работает, и ошибка живёт месяцами. Лечение то же, что и в предыдущей задаче: под замком работают с одним охранником и не вызывают методы, берущие тот же замок. Бонус: число и список теперь из одного снимка, а не из двух разных моментов, между которыми мог проскочить писатель."""

[[exercises]]
name = "dbg_q2"
kind = "question"
style = "bughunt"
question.ru = """Рантайм `current_thread`, замок `tokio::sync::RwLock`. Чем кончится каждый случай?

```rust
// Случай 1: писателей нет
let _a = lock.read().await;
let _b = lock.read().await;
// Случай 2: сначала в очереди встал писатель
let _a = lock.read().await;
// в другой задаче уже вызван lock.write().await и он ждёт
let _b = lock.read().await;
```"""
options.ru = ["Оба случая проходят: читателей может быть сколько угодно", "Случай 1 проходит, случай 2 зависает: новый читатель встаёт в очередь за писателем, а писатель ждёт первого читателя", "Оба зависают: один поток, повторно взять нельзя", "Случай 1 зависает, случай 2 проходит"]
answer = [1]
explain.ru = """Читатели совместимы друг с другом, и в случае 1 всё проходит. Но `RwLock` в tokio честный: если в очереди есть писатель, новые читатели ждут за ним, чтобы писатель не голодал. В случае 2 писатель ждёт, пока первый читатель отпустит замок, а второй чтение ждёт писателя, то есть в итоге ждёт сам себя. Из-за этого баг живёт, пока нет писателей, и просыпается под нагрузкой."""
hint.ru = """Что делает честный замок с читателем, который пришёл после писателя, стоящего в очереди?"""

[[exercises]]
name = "dbg7"
style = "bughunt"
hint.ru = [
  """Кто обрабатывает `Summary`? Тот же цикл, который должен ответить на `Get`. Во время обработки `Summary` цикл не вернулся к `recv`, а в `Summary` стоит `me.get(..).await`. Что делает этот вызов?""",
  """Актор отправил `Get` в собственный ящик и ждёт ответа, а ответить некому: единственный, кто читает ящик, это он сам, и он занят ожиданием. Замкнутый круг из одной задачи.""",
  """Внутри актора не нужно общаться с собой через сообщения: все данные принадлежат ему и лежат в локальной переменной. Собирай сводку прямо из неё.""",
]
why.ru = """Актор обрабатывает по одному сообщению, и пока он ждёт ответа на запрос к самому себе, он не может прочитать этот запрос из своего ящика. Это тупик из одного участника. Он вылезает при добавлении «удобного» метода, который реализован через публичный интерфейс: для внешних клиентов это нормально, для самого актора нет. Правило: внутри актора работают с его состоянием напрямую, а `Handle` существует для других. Заодно ясно, зачем в тестах таймаут вокруг каждого запроса к актору: без него такой баг превращается в зависший тест, а не в понятную ошибку."""

[[exercises]]
name = "dbg8"
style = "fix"
hint.ru = [
  """Сложи картинку: A хочет положить порцию в ящик B, B хочет положить порцию в ящик A, оба ящика полны, а читать их могут только сами A и B. Каждый ждёт места, которое освободит другой.""",
  """Цикл ожидания разрывается, если актор, которому некуда отправить, всё равно продолжает читать свой ящик. Для этого отправка не должна блокировать цикл: излишек откладывается у отправителя, а отправляется, когда в ящике напарника появилось место.""",
  """Нужны две вещи в одном цикле: очередь отложенного у самого актора и `select!` из двух веток: «в ящике напарника есть место, отправляй из очереди» (место резервируется заранее, `reserve`) и «пришла новая порция». Ветка отправки включается условием, только пока очередь не пуста.""",
]
why.ru = """Два актора с ограниченными ящиками, шлющие друг другу в обе стороны, образуют цикл ожидания: оба ждут места, которое освободит только другой, а освободить он не может, пока сам ждёт. Лечится разрывом цикла: актор, которому некуда отправить, откладывает излишек в собственную очередь и продолжает читать. Ящик остаётся ограниченным, но давление уходит в локальную очередь (её размер ограничен глубиной работы, а не скоростью напарника). `reserve` бронирует место заранее, поэтому в `select!` ветка отправки не теряет порцию при отмене. Другие выходы (неограниченный ящик в одну сторону, отдельные задачи на отправку) работают, но переносят проблему в память."""

[[exercises]]
name = "dbg9"
style = "fix"
hint.ru = [
  """Ящик закрывается, когда выброшены все `Sender`. Пересчитай их: сколько их у `Counter` и сколько у самого актора?""",
  """Актор хранит копию отправителя в собственном ящике и тем самым сам не даёт ящику закрыться. Пока копия жива, `recv` ждёт ещё одного сообщения, и задача не завершится.""",
  """Отправитель бывает слабый: `Sender::downgrade()` даёт `WeakSender`, который не удерживает ящик, а `upgrade()` возвращает `Some` только пока живёт хоть один сильный. Слабый хранится у актора, сильный берётся временно в момент отправки.""",
]
why.ru = """Актор, хранящий собственный `Sender`, образует цикл «ящик держит актора, актор держит ящик», и ни один из них не умирает. Типичная причина утечки задач: тест ничего не видит, а процесс копит живые акторы. `WeakSender` разрывает цикл: он умеет отправлять, пока кто-то из внешних владельцев жив, но сам закрытию не мешает. Берётся сильный отправитель на один вызов и тут же отпускается. Так актор сохраняет возможность планировать себе работу и при этом завершается каскадом, когда внешние владельцы ушли."""

[[exercises]]
name = "dbg_q3"
kind = "question"
style = "bughunt"
question.ru = """Что напечатает программа?

```rust
let (tx, mut rx) = mpsc::channel::<u32>(4);
let weak = tx.downgrade();
let strong2 = tx.clone();
drop(tx);
println!("{}", weak.upgrade().is_some());
drop(strong2);
println!("{}", weak.upgrade().is_some());
println!("{:?}", rx.recv().await);
```"""
options.ru = ["true, true, None", "true, false, None", "false, false, None", "true, false, зависнет, пока слабый отправитель жив"]
answer = [1]
explain.ru = """`WeakSender` не считается владельцем канала. Пока жив хоть один сильный отправитель (`strong2`), `upgrade` возвращает `Some`, поэтому первая строка `true`. Когда выброшен последний сильный, `upgrade` возвращает `None`, и вторая строка `false`. Канал закрыт, потому что сильных отправителей больше нет, и `recv` отвечает `None`, не дожидаясь слабого. На этом и держится лечение актора, который хранит собственный отправитель."""
hint.ru = """Кто из отправителей удерживает канал открытым, а кто только умеет отправлять, пока кто-то другой его удерживает?"""

[[exercises]]
name = "dbg10"
style = "bughunt"
hint.ru = [
  """Сравни, что создаётся при подключении и что исчезает при отключении. Тест считает живые задачи и записи в реестре: расхождение двойное, значит, причина общая. Посмотри, какая из задач ждёт сообщения и кто может прислать ей ещё одно.""",
  """Читающая задача заканчивается, когда клиент ушёл. Пишущая задача ждёт сообщений из канала, а канал закрывается только когда уничтожены все отправители. Один из них лежит в общем реестре, и дальше его никто не убирает.""",
  """Уходя, читающая задача должна убрать подключение из реестра: тогда уничтожается последний отправитель, канал закрывается, и пишущая задача завершается сама. Альтернатива: хранить пару задач под охранником, который прерывает обе при уходе (`JoinSet` или своя обёртка с `abort` в `Drop`).""",
]
why.ru = """Задача-сирота это задача, которую никто больше не ждёт и которая сама не закончится. Здесь она появилась из-за общего реестра: он хранит копию отправителя, и канал пишущей задачи не закрывается после ухода клиента. Утечка тихая: ничего не падает, число живых задач просто растёт с каждым подключением, а в памяти копятся записи реестра. Тест проверяет оба следа (задачи и записи), потому что чинят их вместе. Две общие схемы лечения: убирать следы в конце жизни подключения (как здесь) или связывать жизнь вспомогательных задач с главной через `JoinSet` или охранника с `abort` в `Drop`."""

[[exercises]]
name = "dbg11"
style = "scratch"
hint.ru = [
  """Паника в задаче доходит до того, кто ждёт её `JoinHandle`: `await` возвращает `Err(JoinError)`. А у ошибки есть вопросы: паника ли это (`is_panic`), и можно ли достать её содержимое (`into_panic`).""",
  """Нужно два действия: запустить саму задачу и запустить наблюдателя, который дождётся ручки первой и отправит отчёт. Прервать надо именно первую, поэтому наружу отдаётся её `abort_handle()`, снятая до передачи ручки наблюдателю.""",
  """Содержимое паники это `Box<dyn Any + Send>`. Обычно внутри `&'static str` (паника с литералом) или `String` (паника с форматированием); пробуй `downcast` в обе формы, а иначе пиши запасной текст.""",
]
why.ru = """Паника в отсоединённой задаче умирает вместе с задачей: рантайм продолжает работать, а `JoinHandle`, который никто не `await`-ит, ошибку просто выбрасывает. Наблюдатель решает это: он единственный, кто ждёт задачу и потому знает, чем она кончилась. Отмена выглядит как `JoinError`, но не паника (`is_panic` ложно), поэтому её различают. Содержимое паники вытаскивается `downcast`-ом в `&str` и `String`, потому что `panic!("...")` и `panic!("{}", x)` кладут разные типы. В боевом коде такой отчёт идёт в журнал и в метрики здоровья."""

[[exercises]]
name = "dbg_q4"
kind = "question"
style = "bughunt"
question.ru = """Что произойдёт при запуске (настройки по умолчанию, `panic = "unwind"`)?

```rust
#[tokio::main]
async fn main() {
    tokio::spawn(async { panic!("упали") });
    tokio::time::sleep(Duration::from_millis(100)).await;
    println!("работаем");
}
```"""
options.ru = ["Процесс завершится с кодом 101 до печати «работаем»", "В stderr появится сообщение о панике, затем программа напечатает «работаем»", "Сообщения о панике не будет совсем, только «работаем»", "«работаем» напечатается, и сразу после этого процесс упадёт при уничтожении ручки"]
answer = [1]
explain.ru = """Паника внутри задачи ловится рантаймом: сообщение печатает обычный обработчик паник (в stderr), задача завершается, а остальная программа продолжает работу. Ошибку получил бы тот, кто ждёт `JoinHandle`, но ручку выбросили, и ошибка исчезла. Поэтому такие паники надо отлавливать явно: сервис молча теряет задачу и считает себя здоровым."""
hint.ru = """Кто ловит панику внутри задачи, и куда она деваться, если ручку никто не ждёт?"""

[[exercises]]
name = "dbg12"
style = "todo"
hint.ru = [
  """Замерять надо только внутренний `poll`: от входа в него до выхода. Время, которое future провёл в ожидании между опросами, к делу не относится, и учитывать его в одном замере нельзя.""",
  """Часы нужны настоящие (`std::time::Instant`): блокирующий поток стоит по-настоящему, а замороженные часы tokio его бы не заметили. Замер делается на каждый вызов `poll` заново, никакого накопления между вызовами.""",
  """Если измеренное больше порога, в канал уходит отчёт, а результат опроса возвращается наружу без изменений. Ошибку отправки отчёта игнорируй: сторож не должен ронять наблюдаемый future.""",
]
why.ru = """Долгий poll вредит не сам по себе, а потому, что на этом потоке рантайма в это время никто больше не работает. Поэтому мерить надо длительность каждого опроса отдельно: сто опросов по миллисекунде никому не мешают, один на сто миллисекунд мешает всем. Настоящие часы тут обязательны: замороженное время tokio блокирующих пауз не видит. Такая обёртка в реальном сервисе включается в отладочном режиме, пишет в журнал имя задачи и длительность, а искать после этого надо место с `std::thread::sleep`, `std::fs`, тяжёлым хешем или циклом без `.await`."""

[[exercises]]
name = "dbg13"
style = "bughunt"
hint.ru = [
  """Рантайм из одного потока передаёт управление другим задачам только на `.await`, который вернул `Pending`. Цикл по часам не содержит ни одного. Сколько подряд работает этот poll?""",
  """Нужно, чтобы расчёт сам время от времени отдавал поток. Не каждую итерацию (это дорого), а раз в небольшую порцию работы. Есть и принципиально другой путь: вынести расчёт в отдельный поток.""",
  """Раз в несколько тысяч шагов вставь `tokio::task::yield_now().await`. Порцию подбирай так, чтобы одна работа между отдачами занимала доли миллисекунды: сторож порог держит в 50 мс.""",
]
why.ru = """На рантайме из одного потока задача без `.await` (или с `.await`, который всегда готов) держит поток до конца. Сердцебиение, таймеры и ответы остальным клиентам просто стоят, а внешне всё «асинхронно». Сторож долгих poll делает проблему видимой: он называет задачу и длительность. Лечение двух видов. Либо расчёт сам делает паузы (`yield_now` порциями, чтобы не платить за переключение на каждую итерацию), либо он уходит из рантайма в `spawn_blocking`, если это чистая нагрузка на процессор. Порция должна быть заметно короче порога сторожа, иначе сторож будет шуметь."""

[[exercises]]
name = "dbg_broken_service"
style = "bughunt"
quiz = true
hint.ru = [
  """Три дефекта, три разных вида: ожидание, которое никогда не закончится (потерянное уведомление), ожидание по кругу (порядок замков) и забытая уборка (след от закрытого сеанса). Разбирай по тестам, по одному. Каждому тесту соответствует одна часть сервиса.""",
  """`notify_waiters` будит только тех, кто уже ждёт в этот момент, и не оставляет никаких следов для опоздавших. Флаг готовности есть, но ждущий на него не смотрит. Чинится не тем, чтобы проверить флаг один раз, а правильным порядком: сначала подписаться на уведомление, потом проверить флаг, потом ждать.""",
  """Остальные два дефекта уже встречались в этой главе: единый порядок захвата замков (и особый случай «оба счёта одинаковы») и уборка записи об уходящем сеансе, после которой закрывается канал и завершается фоновая задача. Подписку на `Notify` делают через `notified()`, закрепляют (`pin`) и вызывают `enable()` до проверки флага.""",
]
why.ru = """Три дефекта и три приёма диагностики. Потерянное пробуждение: `notify_waiters` ничего не запоминает, поэтому ждущий, пришедший после, зависает; лечение: подписаться (`enable`), потом проверить флаг, потом ждать. Тупик по замкам: кольцо ожидания, лечится единым порядком. Утечка: след в общем реестре держит канал открытым, поэтому фоновая задача не заканчивается. Общий вывод про отладку: три «висящих» теста снаружи одинаковы, а различаются тем, что именно стоит. Таймауты в тестах превращают вечное ожидание в ошибку, а метрика числа задач и размер реестра показывают утечку."""

[[exercises]]
name = "dbg_console"
kind = "project"
style = "scratch"
quiz = true
locked = ["crates/acceptance/tests/acceptance.rs"]
hint.ru = [
  """Начни с реестра: общая структура за `Arc<Mutex<..>>` со списком записей (номер, имя, состояние, число опросов, самый долгий опрос, момент начала ожидания) и счётчиком номеров. `Console::spawn` регистрирует запись и запускает обычную задачу, внутри которой твоё future обёрнуто в свой `Future` с инструментированным `poll`.""",
  """В `poll` обёртки до опроса внутреннего future пометь запись `Running` и увеличь число опросов, после опроса по результату поставь `Waiting` (и запомни момент через `tokio::time::Instant`), `Finished` или `Panicked`. Панику лови через `FutureExt::catch_unwind` вокруг внутреннего future и пробрасывай дальше `resume_unwind`, чтобы `JoinHandle` её увидел. Отмену узнаёшь по `Drop` обёртки, если она не успела завершиться.""",
  """Замок реестра нельзя держать во время опроса внутреннего future и во время вызова сторожа долгих poll: сторож может сам вызвать `tasks()`. Снимай данные для отчёта под замком, отпускай, потом вызывай. Формат `dump()` и все поля описаны в README ровно: тесты сверяют строку целиком.""",
]
why.ru = """Консоль задач это инструментированный future из dbg2, собранный в реестр: имя, состояние, число опросов и момент начала ожидания лежат в общей таблице, а `dump` и `stuck` читают её. Состояние `Cancelled` определяется по `Drop` обёртки, `Panicked` по `catch_unwind` (с повторным `resume_unwind`, чтобы владелец `JoinHandle` не лишился паники). Сторож долгих poll вызывает обратный вызов уже без замка, иначе обратный вызов, спросивший `tasks()`, вешает консоль. Время ожидания считается по часам tokio, поэтому на замороженном времени `dump` детерминирован."""

[[exercises]]
name = "dbg_exam"
kind = "project"
style = "scratch"
exam = true
locked = ["crates/jobq/tests/acceptance.rs"]
why.ru = """Экзамен собирает раздел в одну вещь. Планировщик это актор: очередь и таблица заданий у одной задачи, а `Handle` общается с ней командами с `oneshot`-ответами. Лимит параллельности и приоритеты решает выбор следующего из очереди при каждом освобождении места. Таймаут попытки, повторы с удвоением паузы и перехват паники живут в задаче одного задания, её можно прервать без последствий для остальных. Отмена и остановка опираются на `AbortHandle` и `JoinSet`, поэтому живых задач после остановки не остаётся. Поток обновлений это `broadcast` в виде `Stream`. Время везде замороженное, и тесты точны до миллисекунды."""

