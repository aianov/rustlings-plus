[chapter]
title.en = "Async in traits and types"
title.ru = "Async в трейтах и типах"

[[chapter.visuals]]
file = "visuals/future_boxing.html"
title.ru = "async fn в трейте и Pin<Box<dyn Future + Send>>: где проверяется Send"

[[exercises]]
name = "atr1"
style = "todo"
hint.ru = [
  """Метод трейта с `async fn` реализуется тоже через `async fn`, тело пишется как у обычной функции. Хранилище внутри под `Mutex`: возьми замок, сделай дело и отпусти до конца метода.""",
  """`find`: `self.users.lock().unwrap().get(&id).cloned()`. `save`: `insert(user.id, user)`. `rename` берёт пользователя через `repo.find`, меняет имя и возвращает через `repo.save`.""",
]
why.ru = """Порт это обычный трейт, и с версии Rust 1.75 методы в нём могут быть `async fn` без внешних крейтов. Реализация тоже пишется как `async fn`. Функции вроде `rename` обобщены по `R: UserRepo` и ничего не знают про память: завтра `MemRepo` заменится реализацией над базой, а `rename` не изменится. Замок std внутри короткий и не пересекает `.await` (тут их вообще нет), поэтому ему ничего не мешает."""

[[exercises]]
name = "atr2"
style = "fix"
hint.ru = [
  """Ошибка про `Send` говорит: компилятор не знает, можно ли отправить future метода `find` в другой поток. Но задачи нужны, чтобы ходить одновременно. Есть ли другой способ ждать несколько future вместе, не отправляя их никуда?""",
  """Для ожидания списка future внутри одной задачи у тебя есть `join_all` (прошлая глава). Future можно брать из заимствованного хранилища, спавн не нужен.""",
]
why.ru = """Метод `async fn` в трейте возвращает безымянный future, и в обобщённом коде компилятор знает про него только то, что он существует: `Send` ему никто не обещал. Поэтому `tokio::spawn` на таком future не собирается. Самое простое лекарство не трогает трейт: одновременность внутри одной задачи (`join_all`) не требует `Send` вообще. Если же задача действительно нужна (результат должен пережить вызывающего), лечить придётся сам трейт: так мы поступим в следующей задаче."""

[[exercises]]
name = "atr3"
style = "fix"
hint.ru = [
  """`async fn` в трейте прячет тип future, а нужно обещать его свойство. Метод трейта можно объявить обычным `fn`, который возвращает `impl Future<Output = ..> + Send`. Реализации при этом остаются `async fn`.""",
  """Поменяй объявления обоих методов, `send` и `send_many`. Тело `send_many` придётся обернуть в `async move { ... }`: теперь это обычная функция, возвращающая future.""",
  """Если компилятор скажет, что `Self` нельзя делить между потоками внутри `send_many`, подумай, что значит `&self` в future, который обещан как `Send`: ссылка `&Self` отправляется между потоками только если `Self: Sync`. Это можно потребовать у всех реализаций прямо в объявлении трейта.""",
]
why.ru = """С `async fn` в трейте тип future скрыт и `Send` не обещан, а нужный обещанный вид записывается так: обычный `fn` с `-> impl Future<Output = T> + Send`. Реализации по-прежнему пишут `async fn`, компилятор сам проверяет, что их future действительно `Send`. С готовым методом `send_many` вылезает ещё одно требование: его future держит `&self`, а `&Self` отправляется между потоками, только если `Self: Sync`. Поэтому `Sync` становится супертрейтом. Ошибка «future is not Send» в обобщённом коде обычно означает ровно это: обещание не записано там, где его нужно использовать."""

[[exercises]]
name = "atr4"
style = "todo"
hint.ru = [
  """`async fn` в трейте нельзя положить за `dyn`: у каждой реализации свой тип future, а у `dyn` метод должен возвращать один и тот же тип. Нужен возвращаемый тип, одинаковый для всех реализаций.""",
  """Метод должен возвращать `Pin<Box<dyn Future<Output = Option<String>> + Send + '_>>` (`'_` привязывает future к `&self`). Тело реализации оборачивается в `Box::pin(async move { ... })`.""",
  """В `SlowCache` внутренний слой вызывается так же: `self.inner.get(key).await`. `lookup` ходит по слоям по порядку и возвращает первую находку вместе с `enumerate()`-номером.""",
]
why.ru = """Трейт-объект требует, чтобы метод возвращал известный размером и типом результат. `async fn` возвращает у каждой реализации свой анонимный тип, поэтому `dyn Trait` с таким методом невозможен. Выход прост: вынести разнообразие под один тип, `Pin<Box<dyn Future + Send + '_>>`. Цена: аллокация на каждый вызов, но для кэша, базы и сети это ничто рядом с самим обращением. `'_` важен: future держит ссылку на `self`, и компилятору надо знать, что он не переживёт слой."""

[[exercises]]
name = "atr_q1"
kind = "question"
style = "bughunt"
question.ru = """Какие из этих трейтов можно использовать как `&dyn Трейт`? Выбери все.

```rust
trait A { async fn run(&self) -> u32; }

trait B { fn run(&self) -> Pin<Box<dyn Future<Output = u32> + Send + '_>>; }

trait C { fn run(&self) -> impl Future<Output = u32> + Send; }

trait D {
    fn run<T: Send + 'static>(&self, value: T) -> Pin<Box<dyn Future<Output = u32> + Send + '_>>;
}
```"""
options.ru = ["A", "B", "C", "D"]
answer = [1]
explain.ru = """Для `dyn` у каждого метода должен быть один известный возвращаемый тип и не должно быть обобщённых параметров. У `A` и `C` тип future анонимный и свой у каждой реализации (`async fn` это сокращение для `impl Future`). У `D` результат уже упакован, но метод обобщён по `T`, а для вызова через таблицу виртуальных методов нужна одна-единственная версия. Остаётся `B`. Проверено компилятором."""
hint.ru = """Что должно быть известно компилятору о методе, чтобы положить его в таблицу виртуальных вызовов?"""

[[exercises]]
name = "atr5"
style = "fix"
hint.ru = [
  """Ошибка в реализациях говорит, что future может прожить дольше, чем текст, на который он ссылается. Посмотри, какое время жизни у возвращаемого `BoxFuture<'_, ..>` и что к нему привязано.""",
  """С двумя заимствованными аргументами (`&self` и `input`) правило пропуска `'_` связывает результат только с `self`. Future же держит оба. Дай обоим один явный параметр времени жизни и сделай возвращаемый `BoxFuture` с тем же параметром. Менять нужно и трейт, и все реализации.""",
]
why.ru = """Правило пропуска времён жизни привязывает результат к `&self`, когда он есть. Future из `Box::pin(async move { ... input ... })` захватывает ещё и `input`, и компилятор справедливо отказывает: результат пережил бы текст. Явный общий параметр `'a` на `&'a self` и `input: &'a str` говорит: future живёт не дольше обоих, и тогда вызов с временной строкой собирается. Это же правило превращает «borrowed data escapes» в нормальную работу, когда нужно, и в понятное сообщение, когда `'a` пришлось бы расширить до `'static`."""

[[exercises]]
name = "atr6"
style = "scratch"
hint.ru = [
  """Таблице нужен один тип для всех обработчиков, а у каждого `async fn` свой. Обработчик, который кладут в `Box<dyn Fn(Req) -> BoxFuture<'static, Resp> + Send + Sync>`, должен обещать то же самое: `Send`, `Sync`, `'static` и для самого обработчика, и для его future.""",
  """Ограничения: `F: Fn(Req) -> Fut + Send + Sync + 'static`, `Fut: Future<Output = Resp> + Send + 'static`. В таблицу кладёшь новое замыкание, которое вызывает исходный обработчик и упаковывает его future.""",
  """`Box::new(move |req| handler(req).boxed())`: `boxed()` из `futures::FutureExt` собирает `BoxFuture<'static, _>` (нужен `Send`).""",
]
why.ru = """Чтобы разные обработчики жили в одной таблице, их стирают до одного типа: `Box<dyn Fn(Req) -> BoxFuture<'static, Resp> + Send + Sync>`. Стирание делается один раз, в `register`: оно принимает любой `F`, возвращающий любой `Fut`, и упаковывает future в `Box<dyn Future + Send>`. Ограничения `Send + Sync + 'static` на `F` и `Send + 'static` на `Fut` нужны, потому что таблица общая для задач и обработчики живут дольше вызова `register`. Без `'static` компилятор не даст сложить обработчик в `Box`, без `Send` таблицу нельзя отдать в `spawn`."""

[[exercises]]
name = "atr7"
style = "fix"
hint.ru = [
  """Ошибка говорит про `'static`: `tokio::spawn` может держать задачу сколько угодно, значит, всё внутри неё должно принадлежать ей, а не быть взятым взаймы у вызывающего. Что именно в твоей задаче заимствовано?""",
  """Заимствованы три вещи: `self`, `users` и `text`. Данные из них нужно перенести в задачу владельцами: общий журнал клонируется как `Arc`, число копируется, список и строка превращаются в `Vec` и `String` ещё до `spawn`.""",
  """Перед `tokio::spawn` сделай `Arc::clone(&self.log)`, скопируй `delay_ms`, и `users.to_vec()`, `text.to_string()`. Внутрь `async move` ходят только эти локальные копии.""",
]
why.ru = """`spawn` требует `'static`: future не должен ссылаться ни на что, что может умереть раньше задачи. Здесь вызывающий оставляет задачу жить своей жизнью, поэтому всё нужное ей надо забрать с собой: общее состояние через `Arc`, маленькие значения копированием, срезы и строки превращением во владеющие `Vec` и `String`. Копии делаются вне `async move`, до `spawn`: внутри блока `self` и аргументы уже заимствованы. Замена `&self` на `self: Arc<Self>` работает не всегда (вызывающий может не иметь `Arc`), а копирование трёх полей работает всегда."""

[[exercises]]
name = "atr8"
style = "scratch"
hint.ru = [
  """Future нельзя ждать дважды: после завершения он пуст. Для повтора нужно каждый раз создавать новый. Как передать в функцию не сам future, а способ его создавать?""",
  """Принимай не future, а замыкание, которое его возвращает: `F: FnMut() -> Fut`, `Fut: Future<Output = Result<T, E>>`. Каждая попытка вызывает `op()` заново. Замыкание может брать данные по ссылке (`|| service.call()`).""",
  """Цикл: вызвать `op().await`, при `Ok` вернуть, при `Err` на последней попытке вернуть ошибку, иначе `sleep(delay)`, удвоить паузу и повторить.""",
]
why.ru = """Повтор требует не future, а фабрику future: замыкание `FnMut() -> Fut` вызывается на каждую попытку и возвращает новый. Готовый future можно дождаться один раз. Замыкание не обязано быть `'static` или `Send`: оно живёт в вызывающем коде и спокойно берёт данные по ссылке (`|| client.call(id)`). Ограничения `Send`, нужные для `spawn`, ты добавишь на свои вызовы сам, если понадобится. Пауза растёт удвоением и не добавляется после последней попытки: это частая мелочь, на которой ловят."""

[[exercises]]
name = "atr9"
style = "fix"
hint.ru = [
  """Тип `Fut` в границах один на все вызовы, а future обработчика должен жить, пока жива ссылка на сессию, которую ему дали на этот вызов. Одним типом такое не записать. Для таких замыканий в Rust есть отдельные трейты.""",
  """Вместо пары `F: FnOnce(&mut Session) -> Fut` и `Fut: Future` используй `F: AsyncFnOnce(&mut Session) -> R`. Для вызываемого много раз с изменением состояния есть `AsyncFnMut`, для вызываемого много раз без изменения `AsyncFn`.""",
  """Параметр `Fut` из обеих сигнатур убирается совсем, возвращаемый тип пишется после стрелки (`-> R`, у второй функции его нет). Вызов остаётся `work(&mut session).await`.""",
]
why.ru = """Обычное замыкание с границей `Fn(&mut S) -> Fut` не может вернуть future, который держит эту же ссылку: тип `Fut` фиксируется один раз, а ссылка у каждого вызова своя. Асинхронные замыкания (`async |s| { ... }` и трейты `AsyncFnOnce`, `AsyncFnMut`, `AsyncFn`, стабильны с Rust 1.85) решают именно это: их future может заимствовать аргументы и захваченное окружение. Выбор между тремя такой же, как у обычных замыканий: один раз, много раз с изменением состояния, много раз без. Цена: в границах для `spawn` трейты не обещают `Send` для future, поэтому для кода, который уходит в `spawn`, по-прежнему нужны обычные `Fn` и `BoxFuture`."""

[[exercises]]
name = "atr_q2"
kind = "question"
style = "bughunt"
question.ru = """Какие из этих вариантов рекурсивной функции не соберутся? Выбери все.

```rust
// 0
async fn f(n: u32) -> u32 {
    if n == 0 { 0 } else { f(n - 1).await + 1 }
}

// 1
fn f(n: u32) -> BoxFuture<'static, u32> {
    Box::pin(async move { if n == 0 { 0 } else { f(n - 1).await + 1 } })
}

// 2
async fn f(n: u32) -> u32 {
    if n == 0 { 0 } else { Box::pin(f(n - 1)).await + 1 }
}

// 3
fn f(n: u32) -> impl Future<Output = u32> {
    async move { if n == 0 { 0 } else { f(n - 1).await + 1 } }
}
```"""
options.ru = ["0", "1", "2", "3"]
answer = [0, 3]
explain.ru = """Размер future рекурсивной функции включал бы сам себя, если вызов лежит прямо в нём. Достаточно положить рекурсивный future в `Box` в любом месте цепочки: либо возвращаемый тип функции (вариант 1), либо только сам вызов (вариант 2, так можно с версии 1.77). Вариант 0 нигде не упакован. Вариант 3 прячет тип за `impl Future`, но размер у него по-прежнему неопределим (вызов внутри блока возвращает тот же `impl Future`). Проверено компилятором."""
hint.ru = """Где в цепочке «функция, её future, рекурсивный вызов» стоит `Box`, и стоит ли он вообще?"""

[[exercises]]
name = "atr10"
style = "fix"
hint.ru = [
  """`async fn` не может вызывать сама себя напрямую: размер её future зависел бы от него самого. Рекурсивный вызов нужно положить в `Box`, чтобы размер стал конечным.""",
  """Сделай функцию обычной (не `async`), которая возвращает `BoxFuture<'_, Comment>` (из `futures::future`), а тело оберни в `Box::pin(async move { ... })`. Рекурсивный вызов теперь возвращает коробку фиксированного размера.""",
  """Одновременная загрузка: собери future для всех ответов (`ids.into_iter().map(|child| load_tree(store, child))`) и дождись их через `join_all`.""",
]
why.ru = """У рекурсивной `async fn` размер future включал бы самого себя, поэтому компилятор требует «коробку» на рекурсивном вызове. Самый ровный способ: обычная функция, возвращающая `BoxFuture`, и тело в `Box::pin(async move {...})`. Параллельность сама собой не появляется: цикл с `.await` внутри грузил бы ответы по очереди. Нужно собрать future ответов и ждать их вместе (`join_all`). Тогда время равно высоте дерева, умноженной на задержку одного запроса, а не числу узлов."""

[[exercises]]
name = "atr_q3"
kind = "question"
style = "bughunt"
question.ru = """Какие из этих функций можно запустить через `tokio::spawn`? Выбери все. (`pause` это обычная асинхронная пауза.)

```rust
// 0
async fn a() {
    let data = Rc::new(1);
    println!("{data}");
    pause().await;
}

// 1
async fn b() {
    {
        let data = Rc::new(1);
        println!("{data}");
    }
    pause().await;
}

// 2
async fn c() {
    let data = Rc::new(1);
    println!("{data}");
    drop(data);
    pause().await;
}
```"""
options.ru = ["0", "1", "2"]
answer = [1]
explain.ru = """Для `Send` важно, какие значения компилятор считает живыми в точке `.await`. `Rc` не `Send`. В варианте 0 он живёт до конца функции. В варианте 2 явный `drop(data)` не помогает: область видимости переменной всё равно захватывает `.await`, и компилятор это учитывает. Работает только вариант 1, где `Rc` умирает в конце вложенного блока до ожидания. Проверено компилятором."""
hint.ru = """Что именно считает компилятор: момент последнего использования или границы области видимости?"""

[[exercises]]
name = "atr11"
style = "bughunt"
hint.ru = [
  """Future не-`Send`, если через `.await` проходит значение, которое нельзя отправлять между потоками. Что живёт через `.await` в каждом из двух методов? Замок `std::sync::Mutex` (точнее, его охранник) и `Rc` как раз такие.""",
  """Охранник замка надо отпустить до `.await`: не держать его в переменной на всю функцию, а брать на одну строку, как делает рабочий `touch`. `Rc` замени на то, что можно отправлять: `Arc` или просто `String`.""",
  """В `register` два отдельных захвата замка (до и после `save`). Порядок записей остаётся прежним.""",
]
why.ru = """Future хранит всё, что живёт через `.await`, и становится `Send` только если `Send` всё это. Охранник `std::sync::MutexGuard` и `Rc` запрещено отправлять между потоками, поэтому метод, где они живут через `.await`, нельзя запустить в `spawn`. Ошибка обычно всплывает далеко от причины, у `spawn`, поэтому в большой кодовой базе удобно ставить проверку прямо в тесте: `assert_send(&service.method())`. Она падает при компиляции и показывает, какой именно метод сломан. Чинится это сужением области видимости: брать замок на одно выражение и не держать через `.await`."""

[[exercises]]
name = "atr_q4"
kind = "question"
style = "bughunt"
question.ru = """Какие из этих future займут не меньше 4096 байт? Выбери все. (`pause` это обычная асинхронная пауза.)

```rust
// 0
async fn a() {
    let buf = [0u8; 4096];
    pause().await;
    println!("{}", buf[0]);
}

// 1
async fn b() {
    let buf = [0u8; 4096];
    println!("{}", buf[0]);
    pause().await;
}

// 2
async fn c() {
    let buf = vec![0u8; 4096];
    pause().await;
    println!("{}", buf[0]);
}

// 3
async fn d() {
    let sum: u32 = {
        let buf = [0u8; 4096];
        buf.iter().map(|byte| u32::from(*byte)).sum()
    };
    pause().await;
    println!("{sum}");
}
```"""
options.ru = ["0", "1", "2", "3"]
answer = [0, 1]
explain.ru = """Массив лежит прямо в состоянии функции. Вариант 0 это очевидный случай: массив нужен после ожидания. Вариант 1 удивляет: после `.await` массив не используется, но живёт до конца области видимости, и место под него зарезервировано. В варианте 2 данные в куче, в future только указатель (около сотни байт). В варианте 3 массив умирает в конце вложенного блока до ожидания и в future не попадает. Проверено через `size_of_val`."""
hint.ru = """Нужен ли массив после ожидания и когда заканчивается его область видимости?"""

[[exercises]]
name = "atr12"
style = "bughunt"
hint.ru = [
  """Почему размер future зависит от массива? Всё, что живёт в области видимости на момент `.await`, лежит внутри future, нужно оно после ожидания или нет. Можно ли держать данные не внутри, а где-то ещё?""",
  """Массив на стеке лежит прямо в future. Если данные положить в кучу (`Vec`, `Box`), в future останется только указатель. Размер данных при этом не меняется, поэтому контрольная сумма прежняя. Есть и второй способ без кучи: чтобы массив вышел из области видимости до `.await`, его работу заключают в отдельный блок.""",
]
why.ru = """Состояние async-функции хранится в её future, и всё, что нужно после `.await`, лежит внутри. Большой массив на стеке делает огромной каждую задачу, а при `join!` размеры складываются. Лекарство здесь самое простое: данные в кучу (`Vec` или `Box`), в future остаётся один указатель. Обычно причина не в одном массиве, а в большой вложенности: проверить размер можно `std::mem::size_of_val(&future)`, и тест на размер недорогая защита от возвращения проблемы. Альтернатива: сузить область видимости, чтобы массив умирал до `.await` (если он после ожидания не нужен)."""

[[exercises]]
name = "atr_ports"
kind = "project"
style = "scratch"
quiz = true
locked = ["crates/memory/tests/acceptance.rs"]
hint.ru = [
  """Начни с трейтов: пока они не стали совместимы с `dyn`, проект не собирается. Перепиши методы под `BoxFuture<'_, ..>` (крейт `futures`), потом приведи в порядок реализации.""",
  """`MemUsers` и `MemPosts` это `Mutex<Vec<..>>` внутри `async move { ... }.boxed()`. Обёртки `SlowUsers` и `SlowPosts` ждут `sleep(delay)`, затем зовут внутренний порт. `Service::profile` держит оба запроса в `tokio::join!`.""",
  """`Commands` это `HashMap<String, Handler>`, где `Handler = Box<dyn Fn(Vec<String>) -> BoxFuture<'static, Response> + Send + Sync>`. В `register` упакуй обработчик через `.boxed()`; в `Commands::new` каждое замыкание клонирует `Arc<Service>` внутри себя, прежде чем уйти в `async move`.""",
]
why.ru = """Порты это трейты с упакованными future: так они работают за `Arc<dyn …>` и не теряют `Send`, а сервис не знает, где живут данные. Реализации в памяти и «медленные» обёртки пишутся один раз и годятся любому коду, а тесты на замороженном времени сразу показывают, одновременно ли сервис ходит за данными (`profile`) и не лишний ли он делает запрос (`publish`). Таблица команд стирает разные обработчики до одного типа и по-прежнему позволяет добавлять свои. Проверка `assert_send` в приёмочных тестах ловит потерю `Send` там, где она случилась, а не в далёком `spawn`."""

