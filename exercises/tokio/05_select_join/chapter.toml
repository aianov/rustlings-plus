[chapter]
title.en = "join and select"
title.ru = "join и select"

[[chapter.visuals]]
file = "visuals/select_cancel.html"
title.ru = "select!: победитель забирает результат, проигравшие уничтожаются"

[[chapter.visuals]]
file = "visuals/join_vs_seq.html"
title.ru = "join! против двух await подряд на шкале времени"

[[exercises]]
name = "sel1"
style = "fix"
hint.ru = """Три запроса можно ждать одним выражением, которое склеивает future в одной задаче и возвращает кортеж результатов. Посмотри на макрос `join!`."""
why.ru = """`join!` склеивает future в одну: все ветки опрашиваются по очереди внутри одной задачи, и результат приходит, когда готовы все. Отдельные задачи тут не нужны, и `spawn` не подошёл бы: он требует `'static`, а хранилище взято по ссылке. Время получается равным самому долгому запросу, а не сумме. Цена: если в ветках будет честная работа процессора, они всё равно пойдут по очереди на одном потоке."""

[[exercises]]
name = "sel2"
style = "scratch"
hint.ru = [
  """Нужно склеить два future вместе, но второй существует не всегда. Future можно собрать самому из блока кода: `async { ... }`.""",
  """Внутри блока `async { match viewer { ... } }` реши, нужен ли запрос, и только в нужной ветке вызови `unread(..).await`. Получившийся блок ставь в `join!` рядом с рекомендациями.""",
]
why.ru = """Ветка `join!` не обязана быть вызовом функции: годится любое выражение с future, в том числе `async`-блок. Условие «ходить ли за счётчиком» живёт внутри блока, поэтому гость не платит за запрос, а вошедший получает оба ответа вместе. Типичная ошибка: решить на словах «если вошёл, то join!, иначе обычный await» и получить две копии кода страницы."""

[[exercises]]
name = "sel_q1"
kind = "question"
style = "bughunt"
question.ru = """Время заморожено, `fetch` ждёт ровно 100 мс. Сколько миллисекунд виртуального времени пройдёт до печати?

```rust
let start = Instant::now();
let posts = fetch("посты");
let avatar = fetch("аватар");
let first = posts.await;
let second = avatar.await;
println!("{first}, {second}: {} мс", start.elapsed().as_millis());
```"""
options.ru = ["0 мс", "100 мс", "200 мс", "300 мс"]
answer = [2]
explain.ru = """Future в Rust ленивый: вызов `fetch("посты")` ничего не запускает, он только создаёт значение. Работа начинается, когда future опрашивают, то есть на `.await`. Поэтому первый `await` отнимает 100 мс, и только потом начинает идти второй. Одновременно запросы пошли бы под `join!`. Проверено запуском."""
hint.ru = """Начинает ли `fetch` работать в момент вызова, или позже?"""

[[exercises]]
name = "sel3"
style = "fix"
hint.ru = [
  """Ждать три запроса вместе мало: надо ещё уйти при первой ошибке. У `join!` есть вариант для `Result`.""",
  """`tokio::try_join!` требует, чтобы у всех веток был один тип ошибки. Свои типы к общему приведи в самих ветках, например через `async { ... .await.map_err(...) }`.""",
  """`let (posts, avatar, theme) = tokio::try_join!(async { env.posts().await.map_err(PageError::from) }, ...)?;`""",
]
why.ru = """`try_join!` ждёт все ветки сразу, но при первой же ошибке возвращает её и бросает остальные (их future уничтожаются на полпути, поэтому счётчик дошедших до конца остаётся равен единице). `join!` с последующими `?` дождался бы самой медленной ветки, и только потом сообщил об ошибке. Типы ошибок у веток должны совпадать: приводим их в самой ветке через `map_err` и общий `From`."""

[[exercises]]
name = "sel4"
style = "scratch"
hint.ru = [
  """Число future заранее неизвестно, так что `join!` не подходит: он принимает их перечислением в коде. Для коллекции future есть функция в крейте `futures`.""",
  """`futures::future::join_all` принимает итератор future и возвращает `Vec` результатов в порядке ввода. Future строй из элементов списка: `ids.iter().map(|id| db.profile(*id))`.""",
]
why.ru = """`join_all` решает ровно эту задачу: любое число future, результаты в порядке подачи (не готовности). Цикл с `await` внутри дал бы сумму времён. Ограничений на число одновременных запросов у `join_all` нет: для списка из десяти тысяч id такой вызов откроет десять тысяч запросов сразу. Для ограничения нужен другой инструмент, он ждёт нас в главе про стримы."""

[[exercises]]
name = "sel5"
style = "scratch"
hint.ru = [
  """Нужно получать результаты по одному, в порядке готовности, и остановиться на нужном числе. Для набора future с таким поведением есть тип в `futures::stream`.""",
  """`FuturesUnordered` собирается из итератора future (`collect()`), а результаты берутся как из потока: `next().await` отдаёт тот, что готов раньше других. Номер реплики добавь в ответ сам, обернув вызов в `async move`.""",
  """Цикл `while answers.len() < need` с `match pending.next().await`; `None` значит, что реплики кончились. После выхода `pending` уничтожится вместе с недоделанными запросами.""",
]
why.ru = """`FuturesUnordered` отдаёт результаты по мере готовности, а не в порядке подачи, и умеет остановиться в любой момент: оставшиеся future уничтожаются вместе с ним. `join_all` с сортировкой по времени дождался бы всех реплик и оставил бы работу делаться впустую. Номер реплики кладём в результат сами, потому что порядок прихода уже ничего не говорит о том, кто ответил."""

[[exercises]]
name = "sel6"
style = "fix"
hint.ru = """Нужна гонка: взять первый готовый future, остальные выбросить. У tokio для этого есть макрос с несколькими ветками вида `имя = future => результат`."""
why.ru = """`select!` опрашивает все ветки, выбирает первую готовую, а остальные future просто уничтожает: на `.await` внутри них выполнение обрывается, дальше не пойдёт ни строчки. Поэтому проигравший запрос не дорабатывает: ни побочных эффектов, ни трат. Если бы вместо этого каждый запрос ушёл в `spawn`, проигравший продолжал бы жить, пока его кто-нибудь не остановит, и тест с флагом `finished` это поймал бы."""

[[exercises]]
name = "sel_q2"
kind = "question"
style = "bughunt"
question.ru = """У типа `Noisy` в `Drop` стоит `println!("drop {имя}")`. Функция `work` создаёт `Noisy`, ждёт указанное время и возвращает имя. Что напечатает программа?

```rust
tokio::select! {
    a = work("a", 20) => println!("won {a}"),
    b = work("b", 50) => println!("won {b}"),
}
println!("end");
```"""
options.ru = ["drop a, won a, drop b, end", "drop a, drop b, won a, end", "won a, drop a, drop b, end", "won a, drop a, end"]
answer = [1]
explain.ru = """`work("a")` доработала до конца, и её `Noisy` умер при выходе из функции: `drop a`. Когда `select!` выбрал победителя, он сразу уничтожил остальные future, прямо на `sleep` внутри `work("b")`, а вместе с ними все локальные переменные: `drop b`. И только потом выполняется обработчик победившей ветки: `won a`. Порядок «проигравшие уничтожаются до обработчика» важно знать, если проигравший держит замок или соединение. Проверено запуском."""
hint.ru = """Когда именно select! уничтожает проигравшие ветки: до обработчика победителя или после?"""

[[exercises]]
name = "sel7"
style = "scratch"
hint.ru = [
  """Цикл ждёт сразу двух вещей: сообщение из канала и срабатывание таймера. Какой макрос ждёт несколько future и реагирует на первый готовый?""",
  """Таймер создай один раз до цикла (`interval(every)`): он ведёт счёт сам. Первый `tick()` срабатывает сразу, на пустом буфере ничего отправлять не надо. Закрытый канал приходит как `None`.""",
  """`select! { message = rx.recv() => match message { Some(..) => накопить, None => дослать остаток и вернуть результат }, _ = ticker.tick() => отправить, если не пусто }`""",
]
why.ru = """Цикл `select!` над каналом и таймером даёт обе реакции: накопление по приходу сообщения и отправка по часам. Таймер создаётся один раз перед циклом, иначе каждое сообщение начинало бы отсчёт заново, а при частых сообщениях он не сработал бы никогда. Закрытие канала надо обработать явно: иначе после последнего сообщения остаток дождался бы тика, а если тиков больше нет, остался бы лежать навсегда."""

[[exercises]]
name = "sel8"
style = "bughunt"
hint.ru = [
  """Паника говорит, что все ветки `select!` отключились и запасного пути нет. Когда ветка с шаблоном `Some(..) = ...` отключается?""",
  """Ветка с шаблоном, который не совпал (канал вернул `None`), выключается до конца этого вызова `select!`. Когда выключены все, нужна особая ветка. И не забудь вернуть итог после цикла.""",
]
why.ru = """Ветка с шаблоном `Some(x) = rx.recv()` выключается, когда шаблон не подошёл, то есть когда канал закрыт: закрытый канал дальше не опрашивается, остальные продолжают. Когда выключены все ветки, `select!` без `else` паникует. Ветка `else => break` срабатывает именно тогда и превращает «все источники закончились» в нормальный выход. Выходить по первому `None` нельзя: другой канал мог ещё нести данные."""

[[exercises]]
name = "sel9"
style = "todo"
hint.ru = [
  """Нужно, чтобы одна из веток `select!` иногда выключалась. У веток есть условие включения, которое проверяется до опроса.""",
  """После шаблона ветки допиши запятую и `if <условие>`: пока оно ложно, ветка не опрашивается, и задания остаются в канале. Состояние «пауза» держи в обычной переменной.""",
  """`Some(job) = jobs.recv(), if !paused => ...`, а команды разбирай в другой ветке, где `None` значит выход из цикла.""",
]
why.ru = """Условие `, if` выключает ветку на этот оборот цикла: её future даже не создаётся, значит, задание не будет забрано из канала. Это важно: если бы воркер на паузе принимал задания и копил их в своём `Vec`, очередь освободилась бы, и отправитель не узнал бы, что пора притормозить. Команды остаются в отдельной ветке без условия, поэтому пауза и возобновление слышны всегда. Когда `jobs` закрыт, его ветка выключается сама (шаблон `Some` не совпал), а воркер живёт, пока открыт канал команд."""

[[exercises]]
name = "sel10"
style = "fix"
hint.ru = [
  """Когда готовы сразу обе ветки, `select!` выбирает любую, случайно. Это честно, но тут нужна определённость. У макроса есть режим, в котором ветки проверяются строго по порядку записи.""",
  """Первой строкой внутри `select!` напиши `biased;`, а ветку остановки поставь выше ветки заданий. Тогда забитая очередь не заглушит сигнал.""",
]
why.ru = """Без `biased;` `select!` перемешивает порядок опроса, чтобы ни одна ветка не голодала. Для остановки это неудобно: она проиграет забитой очереди в половине случаев, а за N оборотов будет обработано в среднем ещё и пара заданий. С `biased;` ветки опрашиваются сверху вниз, и сигнал остановки всегда проверяется первым. Цена: если верхняя ветка готова постоянно, нижние не получат слова, поэтому наверх ставят только то, что бывает готово редко (остановка, отмена)."""

[[exercises]]
name = "sel_q3"
kind = "question"
style = "bughunt"
question.ru = """Что напечатает программа?

```rust
let mut left = vec!["a", "b", "c"];
loop {
    tokio::select! {
        biased;
        _ = std::future::ready(()), if left.len() == 1 => {
            println!("last: {}", left[0]);
            break;
        }
        _ = std::future::ready(()), if left.len() > 1 => {
            println!("{}", left.remove(0));
        }
    }
}
```"""
options.ru = ["a, b, last: c", "a, b, c", "last: c", "паника: все ветки отключены"]
answer = [0]
explain.ru = """Условия `, if` вычисляются заново на каждом обороте цикла, до опроса. Пока в списке больше одного элемента, включена только вторая ветка (первая выключена условием), и она убирает по элементу. Когда остаётся один, выключается вторая, а первая включается и завершает цикл. На каждом обороте включена ровно одна ветка, поэтому паники нет, а `biased` ничего не решает: выбирать между двумя готовыми не приходится. Проверено запуском."""
hint.ru = """Сколько веток включено на каждом обороте, и что меняется после каждого `remove`?"""

[[exercises]]
name = "sel11"
style = "todo"
hint.ru = [
  """Снимок должен жить дольше одного оборота цикла. Если вызывать `journal.snapshot()` прямо в ветке `select!`, что произойдёт на втором обороте?""",
  """Создай future снимка один раз до цикла, а в ветке `select!` опрашивай его по ссылке: `&mut future`. Для этого future должен быть закреплён на месте; есть макрос `tokio::pin!`.""",
  """`let snapshot = journal.snapshot(); tokio::pin!(snapshot);` затем в цикле `result = &mut snapshot => return result` и `Some(text) = rx.recv() => ...`.""",
]
why.ru = """Future, созданный внутри `select!`, на каждом обороте создаётся заново, и незавершённая работа теряется: снимок начинался бы с нуля при каждом сообщении. Чтобы опрашивать один и тот же future много раз, его создают до цикла и передают в ветку по `&mut`. А `&mut Fut` годится для опроса, только если `Fut: Unpin`; async-блоки не Unpin, поэтому их закрепляют на месте макросом `tokio::pin!`. Закрытый канал выключает свою ветку, но не трогает снимок."""

[[exercises]]
name = "sel_q4"
kind = "question"
style = "bughunt"
question.ru = """Сообщения приходят каждые 400 мс, всего пять, после последнего отправитель сразу исчезает. Время заморожено. Что напечатает программа?

```rust
let mut got = 0;
loop {
    tokio::select! {
        Some(_) = rx.recv() => got += 1,
        _ = sleep(Duration::from_millis(1000)) => break,
    }
}
println!("{got} за {} мс", start.elapsed().as_millis());
```"""
options.ru = ["2 за 1000 мс", "5 за 2000 мс", "5 за 3000 мс", "программа не завершится"]
answer = [2]
explain.ru = """`sleep(1000 мс)` создаётся заново на каждом обороте, поэтому сообщения, идущие чаще раза в секунду, его всё время сбрасывают: таймер не успевает сработать. Все пять сообщений принимаются к моменту 2000 мс. После закрытия канала шаблон `Some(_)` перестаёт совпадать, ветка выключается, остаётся один только таймер, и он начинает счёт с последнего оборота: ещё 1000 мс, итого 3000. Проверено запуском."""
hint.ru = """С какого момента отсчитывается последний sleep и что отключает ветку с каналом?"""

[[exercises]]
name = "sel12"
style = "bughunt"
hint.ru = [
  """Когда создаётся `sleep(window)` и сколько раз? Прикинь, что происходит с таймером на каждом обороте цикла, если сообщения приходят чаще, чем раз в `window`.""",
  """Каждый оборот цикла создаёт новый `sleep`, и отсчёт начинается заново. Окно одно на весь сбор: создай future таймера до цикла, закрепи и опрашивай по ссылке.""",
]
why.ru = """Выражение в ветке `select!` вычисляется на каждом обороте цикла. `sleep(window)` там означает «подождать `window` с этого момента», а не «до общего конца окна»: пока сообщения приходят чаще, чем раз в `window`, таймер каждый раз сбрасывается и не срабатывает никогда. Общий срок нужно создать один раз до цикла и опрашивать по `&mut` (с `tokio::pin!`). Рабочая альтернатива: вычислить момент конца заранее и каждый раз ждать `sleep_until(момент)`."""

[[exercises]]
name = "sel13"
style = "bughunt"
hint.ru = [
  """Паника с текстом про `async fn` и «resumed after completion» значит: готовый future опросили ещё раз. Кто и когда это делает в твоём цикле?""",
  """Ветка `&mut sync` остаётся в `select!` на каждом обороте, и после завершения синхронизации её опрашивают снова. Нужно выключать ветку, когда результат уже получен.""",
  """Условие `, if synced.is_none()` после шаблона ветки: пока результата нет, ветка включена.""",
]
why.ru = """Future нельзя опрашивать после того, как он вернул результат: async fn в этом случае паникует (`resumed after completion`). Ветка `&mut sync` в цикле `select!` именно это и делает на следующем обороте. Лекарство: флаг (здесь `Option` с результатом) и условие `, if` на ветке, пока результата нет. Для Sleep ошибка не видна, потому что он после срабатывания просто готов снова, а вот пользовательские `async fn` и async-блоки паникуют, поэтому правило универсальное."""

[[exercises]]
name = "sel14"
style = "scratch"
hint.ru = [
  """У соединения два источника активности и один общий таймер. Что должен делать цикл с таймером при каждом кадре?""",
  """Таймер создай один раз и закрепи (`tokio::pin!`). При кадре сдвинь срок вперёд: у закреплённого `Sleep` есть метод `reset(новый_момент)` (через `as_mut()`). Закрытый канал выключай флагом и условием `, if` на ветке.""",
  """Три ветки в `select!`: входящие, исходящие, таймер. После `select!` проверь, остался ли хоть один открытый канал.""",
]
why.ru = """Таймер простоя один на оба источника: любой кадр переносит его срок на `now + idle`. `Sleep::reset` делает это без создания нового таймера. Нельзя ждать только входящие (исходящий трафик тоже жизнь) и нельзя ставить общий срок (соединение с кадрами раз в 200 мс оборвётся через 300 мс). Закрытый канал выключается флагом, иначе `recv` на нём возвращал бы `None` на каждом обороте, и цикл крутился бы вхолостую. «Оба закрыты» проверяется отдельно, потому что ветка таймера держит `select!` от отключения всех веток."""

[[exercises]]
name = "sel_q5"
kind = "question"
style = "bughunt"
question.ru = """Из потока читают заголовок кадра: четыре байта длины в порядке big-endian. Первые два байта `[0, 0]` приходят сразу, ещё через 120 мс приходит `[0, 7, 9, 9]` одним куском (последние два байта уже из следующего кадра). Таймер в `select!` срабатывает дважды, пока заголовок не дочитан. Что будет в `header` после `break`?

```rust
let mut header = [0u8; 4];
loop {
    tokio::select! {
        r = reader.read_exact(&mut header) => { r.unwrap(); break; }
        _ = sleep(Duration::from_millis(50)) => {}
    }
}
println!("{:?} {}", header, u32::from_be_bytes(header));
```"""
options.ru = ["[0, 0, 0, 7] и длина 7", "[0, 7, 9, 9] и длина 461065", "программа зависнет", "паника на `unwrap`"]
answer = [1]
explain.ru = """`read_exact` не безопасен к отмене: первые два байта он уже забрал из потока и положил в буфер, но когда выиграл таймер, future уничтожили, а вместе с ним знание, сколько байт уже прочитано. Новый `read_exact` начинает с нуля и берёт следующие четыре байта потока: `[0, 7, 9, 9]`, поэтому кадры сдвигаются. Так же сдвигаются любые чтения «до конца» и записи `write_all`. Безопасны `read` (читает порцию и сообщает сколько) и `recv` у каналов. Проверено запуском."""
hint.ru = """Что случилось с первыми двумя байтами, когда future чтения уничтожили, и откуда новое чтение начнёт?"""

[[exercises]]
name = "sel15"
style = "bughunt"
hint.ru = [
  """Тик в соседней ветке `select!` завершается раньше, чем `next()` дочитал пару. Что происходит с future `next()`, когда выигрывает другая ветка?""",
  """Проигравший future уничтожается там, где остановился, вместе со всеми локальными переменными. Число `first` жило в локальной переменной внутри `next`. Состояние, которое нельзя терять, должно жить снаружи future: в самой структуре.""",
  """В `next` клади прочитанное первое число в `self.half` сразу после чтения. Если там уже что-то лежит, первое число брать из `half` и читать только второе.""",
]
why.ru = """Отмена безопасна, когда ни один шаг не теряет данные, уже взятые из источника. Здесь шаг «получил первое число» меняет состояние (число ушло из канала), а локальная переменная умирает вместе с future. Лекарство: хранить промежуточное состояние в самом читателе (поле `half`), тогда новый вызов `next()` продолжит ровно с того места. `rx.recv()` сам по себе отмене безопасен, но сложенные друг за другом два `recv` внутри одного future уже нет. Тот же приём лечит чтение заголовка и тела кадра и сборку строки из кусков."""

[[exercises]]
name = "sel16"
style = "bughunt"
hint.ru = [
  """Номер выдаётся в тот момент, когда строится future отправки. Что происходит с ним, если этот future не успевает отправиться?""",
  """`send` в ветке `select!` забирает сообщение сразу при создании. Если выиграет другая ветка, future уничтожается вместе с сообщением. Нужно сначала дождаться места в очереди, и только потом выдавать номер.""",
  """У `Sender` есть метод `reserve()`: он ждёт свободное место и отдаёт разрешение, которое потом отправляет значение синхронно (`permit.send(..)`). Ждать надо в `select!`, а номер брать, когда разрешение уже в руках.""",
]
why.ru = """`send(value)` забирает значение сразу и при отмене уничтожает его вместе с future. Когда значение получено побочным действием (`ids.take()` двигает счётчик), потеря превращается в дыру в данных. `reserve()` разделяет шаги: ожидание места отменяется безопасно, ничего не расходуя, а отправка по разрешению мгновенна и отмены не знает. Тот же приём годится везде, где в `select!` ждёт отправка, а значение дорого или не воспроизводится: читают из сокета, берут из очереди, меняют счётчик."""

[[exercises]]
name = "sel_hedged"
style = "scratch"
quiz = true
hint.ru = [
  """Нужны одновременно: набор уже запущенных запросов, таймер «пора подключить следующего», общий срок и разбор ошибок. Какие инструменты главы собирают это в один цикл?""",
  """Запущенные запросы держи в `FuturesUnordered`, таймер хеджирования и общий срок в двух закреплённых `Sleep`, и всё это слушай в цикле `select!`. Таймер хеджирования сдвигай (`reset`) после каждого запуска, а когда запускать больше некого, выключай его условием `, if`.""",
  """Три ветки: `Some(result) = inflight.next()` (Ok вернуть; Err записать и тут же запустить следующую, если есть; если запускать нечего и ничего не летит, вернуть AllFailed), `_ = &mut hedge, if started < replicas` (запустить следующую) и `_ = &mut overall` (Timeout).""",
]
why.ru = """Всё держится на правилах главы. Запущенные запросы в `FuturesUnordered`: победитель выходит первым, остальные уничтожаются вместе с набором (на `return`), поэтому «отмена проигравших» не требует кода. Два закреплённых таймера опрашиваются по `&mut` и не создаются заново на каждом обороте, а таймер хеджирования сдвигается через `reset` после каждого запуска и выключается условием `, if`, когда запускать больше некого. Ошибка не конец, а событие: она записывается и сразу ускоряет следующий запуск. Типичные провалы: общий `timeout` на каждую реплику (рубит медленного, который мог выиграть), запуск всех реплик сразу (теряется смысл хеджирования), `join_all` (ждёт самого медленного)."""

