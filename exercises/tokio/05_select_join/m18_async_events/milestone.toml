hint.ru = [
"""Начни с шины. В `App::start` заведи `broadcast::channel(config.events)` и подпиши синхронную шину сети на
`Topic::All` замыканием, которое делает `sender.send(Arc::new(*event))` (ошибку без получателей игнорируй).
`EventStream` это обёртка над `broadcast::Receiver<Arc<Event>>` и счётчиком потерь: `recv().await` даёт `Ok`,
`Lagged(n)` или `Closed`, и каждый вариант превращается в свой `Next`. Поток закроется сам, когда уйдёт последний
`App`, если ни одна фоновая задача не держит ядро сильной ссылкой: в задачах только `Weak`.""",
"""Доставка: одна задача читает `mpsc::Receiver<Delivery>`, где `Delivery` это либо уведомление, либо
`Flush(oneshot::Sender<()>)`. Очередь упорядочена, поэтому ответ на метку значит, что всё до неё доставлено.
`publish` кладёт уведомления через `send().await` после того, как отпустил замок сети: под замком ждать места в
очереди нельзя, задача доставки сама может захотеть прочитать сеть. Сигнал остановки: `watch::channel(())`,
отправитель лежит в ядре, а `changed()` у получателя вернёт ошибку, когда ядро умрёт.""",
"""Обработчик трендов: `select!` с `biased;` и ветками остановки, запросов, `settings.changed()`, тика и событий.
Таймер тишины создай один раз до цикла (`pin!(sleep_until(..))`) и переставляй через `as_mut().reset(..)` на каждый
`Liked`; ветку таймера закрой предусловием `, if dirty`, иначе уже сработавший `Sleep` будет срабатывать на каждом
круге. Ответ на запрос: `reply.send(результат)`. `App::refresh_trends` кладёт запрос и ждёт `oneshot`, оба шага
под одним `timeout`.""",
"""Настройки: `watch::Sender<Settings>`, чтение `*sender.borrow()` в одну строку (Ref держит замок, через `.await`
его тащить нельзя), запись `send_modify(|s| ..)` после проверки диапазона. Карточка:
`timeout(op_timeout, async { tokio::try_join!(a, b, c, d) })`, затем два `?`: внешний за таймаут, внутренний за
первую ошибку части.""",
]
story.ru = """У соцсети появилась нервная система: события расходятся через broadcast, уведомления идут одной очередью в
порядке публикации, админ меняет правила на лету командой set, а карточка профиля собирается из четырёх частей
одновременно."""
