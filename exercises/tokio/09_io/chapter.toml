[chapter]
title.en = "Async I/O"
title.ru = "Асинхронный ввод-вывод"

[[chapter.visuals]]
file = "visuals/partial_rw.html"
title.ru = "Частичные чтения и записи: read отдаёт сколько есть, write принимает не всё"

[[chapter.visuals]]
file = "visuals/duplex_deadlock.html"
title.ru = "Взаимная блокировка на duplex: оба пишут, никто не читает"

[[exercises]]
name = "aio1"
style = "fix"
hint.ru = """Методы `read_to_end` и `write_all` определены не на самих типах, а в особых трейтах-расширениях из `tokio::io`. Пока трейт не подключён через `use`, его методов для компилятора нет. Какие два трейта нужны?"""
why.ru = """В tokio сами трейты `AsyncRead` и `AsyncWrite` крошечные: у них только `poll_read` и `poll_write` для ручной работы. Удобные `read`, `read_to_end`, `write_all` живут в `AsyncReadExt` и `AsyncWriteExt`, и без `use` их нет. Привыкай писать `use tokio::io::{AsyncReadExt, AsyncWriteExt}` первой строкой любого файла с вводом-выводом. Граница `Unpin` нужна, потому что методы-расширения берут `&mut self` и требуют, чтобы источник можно было двигать."""

[[exercises]]
name = "aio2"
style = "todo"
hint.ru = [
  """`read` возвращает `io::Result<usize>`: сколько байт положено в начало буфера. Что означает ответ `0`, если буфер не пуст?""",
  """Читай в цикле. Каждый ненулевой ответ запоминай, нулевой означает конец потока: выходи.""",
]
why.ru = """`read` не обещает заполнить буфер, он отдаёт «сколько есть сейчас» и сообщает об этом числом. Поэтому один вызов `read` никогда не равен «одному сообщению»: сообщение может быть порезано сетью или склеено с соседним. Ноль при непустом буфере это единственный признак конца потока, и цикл обязан на нём остановиться. Если бы буфер был пуст, ноль ничего бы не значил, об этом ловушка в следующей задаче."""

[[exercises]]
name = "aio_q1"
kind = "question"
style = "bughunt"
question.ru = """Отправитель сделал две записи подряд, пока получатель ещё ни разу не читал. Что вернёт `read` и сколько байт окажется в начале буфера?

```rust
let (mut tx, mut rx) = tokio::io::duplex(64);
tx.write_all(b"hello").await?;
tx.write_all(b"world").await?;
let mut buf = [0u8; 16];
let n = rx.read(&mut buf).await?;
```"""
options.ru = ["5, и в буфере `hello`", "10, и в буфере `helloworld`", "16, и буфер заполнен целиком", "`read` будет ждать, пока не придёт ещё данных"]
answer = [1]
explain.ru = """Границ между записями у потока нет: оба `write_all` просто положили байты в общий буфер, и `read` забирает всё, что там уже лежит, но не больше размера буфера. Два сообщения слиплись в одно чтение. Ждать `read` стал бы только при пустом буфере, а заполнять буфер целиком он не обязан."""
hint.ru = """Есть ли в потоке байтов хоть что-то, что помнит, где кончилась одна запись и началась другая?"""

[[exercises]]
name = "aio3"
style = "scratch"
hint.ru = [
  """Придётся читать в цикле и помнить, сколько байт уже лежит в буфере. Читать надо в оставшуюся часть буфера, а не в начало.""",
  """Пока `filled < buf.len()`: читаешь в `&mut buf[filled..]`. Ответ `0` при непустом остатке значит, что байт больше не будет. Что в этой схеме происходит с пустым буфером?""",
]
why.ru = """Это ровно то, что делает настоящий `read_exact`: цикл по оставшейся части буфера. Два места, где ошибаются. Читать надо в хвост `buf[filled..]`, иначе новые данные затирают старые. И ноль от `read` значит конец потока только тогда, когда буфер непустой: пустой буфер вообще не надо читать, поэтому условие цикла стоит перед чтением, а не после."""

[[exercises]]
name = "aio4"
style = "bughunt"
hint.ru = [
  """`read_exact` на заголовке сообщает `UnexpectedEof` одинаково и когда не пришло ни байта, и когда пришёл один из двух. Так отличить аккуратный конец от грязного нельзя.""",
  """Различие сидит в том, сколько байт заголовка успели прочитать. Что, если первый байт взять обычным `read`, а оставшийся уже `read_exact`-ом?""",
]
why.ru = """`read_exact` честно говорит только «поток кончился раньше, чем набрался буфер», и по ошибке не видно, сколько успело прийти. Для протокола это принципиально: ноль байт до заголовка это нормальный конец, а один байт это обрыв. Поэтому первый байт заголовка читают отдельно, и только его ноль считают чистым концом, а всё дальнейшее идёт через `read_exact` и его ошибка уходит наверх. Молча проглоченный обрыв потом выглядит как «часть сообщений куда-то делась»."""

[[exercises]]
name = "aio5"
style = "fix"
hint.ru = [
  """`write` возвращает число принятых байт, и оно бывает меньше длины среза. Куда в этом коде девается результат?""",
  """Нужен метод, который сам повторяет запись, пока не отправит всё. Он есть в `AsyncWriteExt`.""",
]
why.ru = """Метод `write` честно пишет сколько получится и сообщает число. На файлах и больших буферах он почти всегда принимает всё, поэтому ошибка годами не видна, а на маленьком буфере, медленном сокете или `duplex(4)` она вылезает сразу. `write_all` крутит цикл за тебя. Правило простое: если не собираешься сам обрабатывать частичную запись, зови `write_all`."""

[[exercises]]
name = "aio6"
style = "scratch"
hint.ru = [
  """У `AsyncReadExt` есть адаптер, который превращает источник в «первые N байт». Но если просто взять ровно `limit`, как отличить тело на `limit` байт от тела, которое длиннее?""",
  """Разреши прочитать на один байт больше лимита: `take(limit + 1)`. Если получилось больше `limit`, значит, источник длиннее допустимого.""",
]
why.ru = """`take(n)` обрезает источник до `n` байт и сообщает конец потока, поэтому `read_to_end` поверх него ограничен по памяти. Но обрезка на ровно `limit` скрыла бы переполнение: клиент прислал тысячу и один байт, а мы молча приняли тысячу. Поэтому берут на один байт больше, и если лишний байт нашёлся, это ошибка. Тот же приём стоит за лимитами тела в HTTP и за лимитом длины строки в журнале."""

[[exercises]]
name = "aio_q2"
kind = "question"
style = "bughunt"
question.ru = """Источник отдаёт 250 байт. Сколько байт окажется в `first` и сколько в `second`?

```rust
let mut limited = source.take(100);
let mut first = Vec::new();
limited.read_to_end(&mut first).await?;
let mut second = Vec::new();
limited.read_to_end(&mut second).await?;
```"""
options.ru = ["100 и 100", "100 и 0", "100 и 150", "250 и 0"]
answer = [1]
explain.ru = """`take(100)` создаёт адаптер с общим лимитом на всё его время жизни, а не на один вызов. Первый `read_to_end` выбрал лимит и получил конец потока на сотом байте, оставшиеся 150 байт ждут в самом источнике. Второй вызов видит лимит равным нулю и сразу сообщает конец. Чтобы читать следующую сотню, нужен новый `take` (например, `(&mut source).take(100)`), а не повторный вызов старого."""
hint.ru = """Лимит `take` сбрасывается на каждом вызове чтения или считается один раз на весь адаптер?"""

[[exercises]]
name = "aio7"
style = "bughunt"
hint.ru = [
  """`read_line` не затирает строку, а дописывает в конец. Сколько живёт `line` в этом коде?""",
  """После обработки строки её нужно опустошить, иначе следующее чтение приклеится к хвосту.""",
]
why.ru = """`read_line` по контракту добавляет прочитанное в конец переданной строки, и возвращает число прочитанных байт, где `0` означает конец потока. Строку заводят один раз ради экономии выделений и очищают в конце каждой итерации. Забытый `clear` не падает и не ругается, он тихо склеивает команды, поэтому такой баг находят глазами. `trim_end` заодно снимает и `\\n`, и `\\r\\n`."""

[[exercises]]
name = "aio8"
style = "scratch"
hint.ru = [
  """`lines()` режет по `\\n` и тут не годится. Посмотри на соседа `read_line` в `AsyncBufReadExt`: он умеет читать до любого байта-разделителя и работает с байтами, а не со строкой.""",
  """`read_until(delimiter, &mut Vec<u8>)` кладёт в вектор всё до разделителя включительно и возвращает число байт. Ноль значит конец. Разделитель в конце надо убрать, но его может и не быть.""",
]
why.ru = """`read_until` это общий случай `read_line`: читает до произвольного байта и дописывает в `Vec<u8>`, разделитель остаётся в конце. Отсюда две детали: разделителя может не быть у последней записи (поэтому `pop` только если он есть), а пустая запись всё равно читается как один байт-разделитель, так что отличить её от конца потока можно только по возвращённому числу. UTF-8 проверяем после сборки записи целиком, а не по кускам: многобайтовый символ может быть разрезан границей чтения."""

[[exercises]]
name = "aio9"
style = "bughunt"
hint.ru = [
  """`BufWriter` копит записи у себя и отдаёт приёмнику, когда набралась порция или когда его об этом попросят. Что происходит с остатком, когда `BufWriter` уничтожается?""",
  """Асинхронный `Drop` невозможен, поэтому остаток он не дописывает. Попроси явно в конце.""",
]
why.ru = """В синхронном `std::io::BufWriter` деструктор пытается сбросить остаток. В асинхронном такого `Drop` быть не может (внутри `drop` нельзя `.await`), поэтому всё, что осталось в буфере, молча пропадает. Правило: после последней записи через `BufWriter` всегда звать `flush().await`. Заодно становится понятно, почему данные не видны собеседнику «в реальном времени»: пока буфер не полон и flush не вызван, они у нас."""

[[exercises]]
name = "aio_q3"
kind = "question"
style = "bughunt"
question.ru = """Клиент отправляет `PING` и ждёт `PONG`. Сервер отвечает мгновенно, как только увидит строку целиком. Что произойдёт?

```rust
let (read_half, write_half) = tokio::io::split(socket);
let mut out = BufWriter::new(write_half);
let mut input = BufReader::new(read_half);

out.write_all(b"PING\\n").await?;
let mut reply = String::new();
input.read_line(&mut reply).await?;
```"""
options.ru = ["В `reply` окажется `PONG`", "Клиент зависнет: сервер так и не увидел `PING`", "Паника: чтение и запись идут одновременно", "Ошибка: соединение закрыто"]
answer = [1]
explain.ru = """Пять байт `PING\\n` лежат в буфере `BufWriter`, потому что он копит записи, пока не наберётся его размер (по умолчанию 8 КиБ) или пока не вызовут `flush`. До сокета они не дошли, сервер ждёт запрос, клиент ждёт ответ. Лечится `out.flush().await?` перед чтением. Запомни это для протоколов «запрос-ответ» поверх `BufWriter`: после последней записи запроса всегда `flush`."""
hint.ru = """Дошла ли строка до сервера к тому моменту, когда клиент начал читать?"""

[[exercises]]
name = "aio10"
style = "fix"
hint.ru = [
  """Запрос «закончился» для сервера только когда он прочитал ноль байт, то есть увидел конец потока. Что должен сделать клиент, чтобы сервер его увидел, если сам клиент ещё собирается читать ответ?""",
  """Нужно закрыть сторону записи, не закрывая чтение. У `AsyncWriteExt` есть метод для этого.""",
]
why.ru = """Конец потока не событие, которое случается само: его устраивает отправитель, закрывая свою сторону. У `TcpStream` и `DuplexStream` метод `shutdown()` закрывает только запись (половинное закрытие), а читать после него ещё можно. Протоколы вида «запрос до EOF, потом ответ» так и работают. Если забыть `shutdown`, обе стороны честно ждут друг друга, и это самая тихая из зависших программ: ни паники, ни ошибки."""

[[exercises]]
name = "aio11"
style = "scratch"
hint.ru = [
  """Если сначала переслать всё от клиента серверу, а потом всё от сервера клиенту, то в диалоге «вопрос, ответ, вопрос» кто-то будет вечно ждать. Направления должны жить одновременно.""",
  """В `tokio::io` есть готовая функция на оба направления, которая ещё и передаёт закрытие записи дальше. Ищи `copy_bidirectional`.""",
]
why.ru = """Копирование в одну сторону это `io::copy`: читает, пишет, пока не конец, возвращает число байт. Для прокси двух таких циклов подряд мало, нужны оба сразу, поэтому в tokio есть `copy_bidirectional`: он ведёт оба направления, передаёт `shutdown` противоположной стороне, когда одна сторона закрылась, и возвращает пару счётчиков. Самодельный вариант на двух задачах тоже работает, но тогда ты сам отвечаешь за передачу закрытия и за то, чтобы не оставить вторую половину висеть."""

[[exercises]]
name = "aio12"
style = "fix"
hint.ru = [
  """Нарисуй буферы. Клиент пишет в буфер сервера, сервер читает и пишет обратно в буфер клиента. Что происходит, когда буфер клиента на приём заполнился, а клиент всё ещё пишет?""",
  """Читать и писать должны идти одновременно. Разреши это одному future: разведи две половины потока и дождись обеих разом.""",
]
why.ru = """Это классический дедлок на конечных буферах. Клиент пишет и не читает, сервер читает и сразу пишет обратно. Когда приёмный буфер клиента полон, сервер блокируется на записи и перестаёт читать, буфер сервера на приём наполняется, и теперь блокируется клиент. Ни один не пошевелится. Лечится тем, что запись и чтение идут вместе: `split` даёт независимые половины, `join!` ведёт обе. Размер буфера этого не отменяет, он лишь решает, при каком объёме данных ошибка проявится, поэтому на тестовом `duplex(16)` она видна сразу, а на проде вылезает при первом большом ответе."""

[[exercises]]
name = "aio_q4"
kind = "question"
style = "bughunt"
question.ru = """Клиент и сервер соединены через `duplex(8)`, то есть в каждую сторону помещается всего 8 байт. Какие из пар зависнут навсегда? Выбери все.

1. Клиент делает `write_all` на 2 байта, потом `read_exact` на 2 байта. Сервер читает кусок и сразу пишет его обратно (эхо).
2. Клиент делает `write_all` на 100 байт, потом `read_exact` на 100 байт. Сервер эхо.
3. Клиент как в пункте 2. Сервер сначала читает ровно 100 байт, и только потом пишет их обратно.
4. И клиент, и сервер сначала делают `write_all` на 100 байт, и только потом читают."""
options.ru = ["1", "2", "3", "4"]
answer = [1, 3]
explain.ru = """Зависание требует кольца ожиданий, где каждый ждёт места в буфере у другого. В пункте 1 всё помещается в буфер. В пункте 2 эхо-сервер пишет обратно, пока клиент ещё пишет и не читает: приёмный буфер клиента полон, сервер встал на записи, перестал читать, и клиент встал следом. В пункте 3 сервер ничего не пишет, пока не дочитает: он постоянно читает, так что клиент дописывает, а ответ сервера потом получает клиентское чтение. В пункте 4 никто не читает, пока не допишет, так что обе записи упираются в полные буферы."""
hint.ru = """Нарисуй, кто в каждый момент читает, а кто пишет. Зависание это замкнутое кольцо ожиданий."""

[[exercises]]
name = "aio13"
style = "bughunt"
hint.ru = [
  """Посмотри, что делает `select!` с проигравшей веткой: её future просто выбрасывается. А что в этот момент было у `read_line` в руках?""",
  """Читать и писать в одной задаче, переключаясь по `select!`, опасно. Раздели поток на две половины и отдай каждую своей задаче: чтение живёт отдельно и никем не прерывается.""",
  """`tokio::io::split` даёт читающую и пишущую половины. Читающая половина идёт в `BufReader` и в `lines()`: этот адаптер хранит недочитанную строку у себя. Пишущая: цикл по каналу, а в конце `shutdown`.""",
]
why.ru = """`read_line` не безопасен к отмене: если его future выбросили на полпути, уже прочитанное из внутреннего буфера пропадает, а так как `select!` выбрасывает проигравшие ветки, начало строки теряется именно тогда, когда в одну задачу забита ещё и отправка. Самое простое лекарство: не смешивать чтение и запись в одном `select!`. `split` даёт две половины, у каждой своя задача, и ничто не прерывает чтение. Конец потока для собеседника делает `shutdown` в конце задачи записи. Позже, в `aio16`, ты увидишь второй способ: хранить недочитанное в своём буфере."""

[[exercises]]
name = "aio14"
style = "todo"
hint.ru = [
  """`BytesMut` умеет «откусить» начало: метод `split_to(n)` возвращает первые `n` байт и оставляет в исходном буфере остаток, ничего не копируя.""",
  """Найди позицию `\\n`. Нет такой: верни `None` и ничего не трогай. Есть: откуси `позиция + 1` байт, убери из откушенного последний (`truncate`) и преврати в неизменяемые `Bytes` через `freeze`.""",
]
why.ru = """`BytesMut` это один буфер, который умеет делиться на части: `split_to` отрезает голову и возвращает её отдельным значением, остаток остаётся на месте, байты не копируются. `freeze` превращает изменяемый кусок в `Bytes`, дешёвый для клонирования и безопасный для передачи другим задачам. Поэтому отданная строка не портится, когда буфер потом растёт: у неё свой счётчик ссылок на память. В `feed` нет `reserve`, потому что `extend_from_slice` растит буфер сам."""

[[exercises]]
name = "aio15"
style = "todo"
hint.ru = [
  """Числа удобно класть методами `put_u8`, `put_u32`, `put_u16` на `BytesMut` (трейт `BufMut`) и читать `get_u8`, `get_u32`, `get_u16` (трейт `Buf`). Сетевой порядок байт у них по умолчанию big-endian.""",
  """Осторожно: `get_u32` на коротком буфере паникует, и самое неприятное, что он отрезает прочитанное сразу. Сначала проверь длину, потом читай. А можно заглянуть без потерь: срез `&buf[..]` тоже реализует `Buf`, и чтение из него буфер не двигает.""",
  """Декодер: если меньше семи байт заголовка, `None`. Заглянув в заголовок срезом, узнай длину тела; если всего байт меньше `7 + длина`, `None`. Иначе `advance` на заголовок и `split_to` на тело.""",
]
why.ru = """Два трейта делают всю арифметику: `BufMut` пишет числа и срезы, продвигая курсор, `Buf` читает и продвигает. Главная ловушка декодера в том, что `get_*` одновременно и читает, и отрезает, а при нехватке байт паникует. Поэтому сначала заглядываем в срез (`&buf[..HEADER]` сам `Buf`, его курсор отдельный от курсора буфера), проверяем, что сообщение целое, и только потом забираем его из настоящего буфера. Неполное сообщение остаётся нетронутым: его допишет следующий `read_buf`."""

[[exercises]]
name = "aio16"
style = "bughunt"
hint.ru = [
  """Что именно пропадает при отмене? Посмотри, где лежит накопленная часть строки: в самом читателе или внутри future одного вызова `next_line`.""",
  """Накопленные байты должны жить в самом читателе, а не в локальной переменной вызова. Тогда отмена выбрасывает только future, а буфер остаётся. Читай не по байту, а целыми порциями прямо в этот буфер.""",
  """`read_buf(&mut self.buf)` дописывает прочитанное в `BytesMut` и безопасен к отмене: если future выбросили, данных не прочитано ни байта сверх уже лежащих в буфере. В цикле: сначала ищи `\\n` в буфере, не нашёл, читай ещё.""",
]
why.ru = """Правило для кода, который вызывают из `select!`: всё состояние, которое нельзя потерять, лежит в структуре, а не в локальных переменных future. Future при отмене просто исчезает вместе с локальными переменными. `read_buf` как раз для этого и удобен: он дописывает в буфер, принадлежащий вызывающему, и сам по себе отмене не страшен. Сравни с `read_exact`: он копит прочитанное в своём внутреннем состоянии, и при отмене это пропадает. Цикл «поискал строку в накопленном, нет, дочитал ещё» это основа любого фреймера поверх потока: в разделе про сеть из него вырастает декодер сообщений."""

[[exercises]]
name = "aio_q5"
kind = "question"
style = "bughunt"
question.ru = """Источник отдаёт ровно 20 байт и потом заканчивается. Что вернут три вызова подряд?

```rust
let mut buf = BytesMut::with_capacity(8);
let a = source.read_buf(&mut buf).await?;
let b = source.read_buf(&mut buf).await?;
let c = source.read_buf(&mut buf).await?;
```"""
options.ru = ["8, 8, 4", "8, 12, 0", "20, 0, 0", "8, 8, 0, а остальные 4 байта потеряны"]
answer = [1]
explain.ru = """`read_buf` читает в свободное место буфера, и в первый раз его ровно 8 байт. Когда место кончилось, `BytesMut` при следующем вызове растёт сам (запрашивает ещё как минимум 64 байта), поэтому второй вызов забирает все оставшиеся 12 байт одним куском. Третий видит конец потока и возвращает 0. Ничего не теряется: в `buf` в итоге лежат все 20 байт. Раз буфер растёт сам, его надо ограничивать самому, когда источнику нельзя доверять."""
hint.ru = """Буфер `BytesMut` фиксированного размера или умеет расти, когда место закончилось?"""

[[exercises]]
name = "aio_q6"
kind = "question"
style = "bughunt"
question.ru = """Чтение в цикле `select!` много раз подряд проигрывает ветке таймера, то есть его future отбрасывают на полпути. Какие читатели при этом могут потерять уже вынутые из сокета байты? Выбери все."""
options.ru = ["`socket.read(&mut buf)`", "`socket.read_exact(&mut buf)`", "`socket.read_buf(&mut bytes)`", "`reader.read_line(&mut line)`"]
answer = [1, 3]
explain.ru = """`read` и `read_buf` либо вынимают данные и возвращают их сразу, либо не вынимают ничего, поэтому отмена безопасна. `read_exact` набирает буфер частями и держит набранное внутри своего future: отбросишь future и набранное пропало, следующий вызов начнёт с нуля. `read_line` в tokio хранит недочитанную строку во внутреннем состоянии future (а не в твоей `String`), поэтому и он теряет начало строки. Безопасная схема: копить в своём буфере и читать в него через `read_buf`."""
hint.ru = """Где лежат уже прочитанные, но ещё не отданные байты: в твоей переменной или внутри future?"""

[[exercises]]
name = "aio17"
style = "fix"
hint.ru = [
  """Чтобы функция принимала любой поток, нужно описать, что она с ним делает, трейтами: читает, пишет и двигает по значению. Какие трейты и граница `Unpin`?""",
  """Когда тест на `duplex` соберётся, второй тест покажет другую проблему. Подумай, что делает `BufReader` с байтами, которые уже пришли в сокет за границей первой строки, и что с ними случается, когда `BufReader` уничтожен.""",
  """`BufReader` читает «с запасом» и при уничтожении запас выбрасывает. Здесь за приветствием поток продолжают читать другие. Читай ответ так, чтобы не взять ничего лишнего: по одному байту до `\\n`.""",
]
why.ru = """Первая половина: протокол, написанный поверх `S: AsyncRead + AsyncWrite + Unpin`, работает с сокетом, с TLS-потоком и с `duplex` в тесте одним и тем же кодом, а привязка к `TcpStream` лишает возможности тестировать без сети. Вторая половина тоньше: `BufReader` читает у источника больше, чем просили, и всё, что оказалось за первой строкой, хранится в его буфере. Если он локальный и умирает вместе с функцией, байты потеряны, а следующий читатель потока увидит дыру. Либо бери буфер у вызывающего, либо, как здесь, читай без запаса: для короткого приветствия цена по байту невелика."""

[[exercises]]
name = "aio18"
style = "todo"
hint.ru = [
  """`poll_read` у обёртки делает то же, что и `poll_read` у вложенного источника. Вложенный надо вызвать через `Pin::new(&mut self.inner)` (граница `Unpin` для этого и нужна), передав тот же `cx` и тот же `buf`.""",
  """Сколько прочитано? `ReadBuf::filled()` показывает всё заполненное, включая то, что лежало до вызова. Запомни длину до и сравни после, и только если ответ `Ready(Ok(()))`.""",
]
why.ru = """`AsyncRead` в tokio это одна функция `poll_read`, которая дописывает в `ReadBuf` и возвращает `Poll`. Обёртка делегирует вложенному источнику и подглядывает за результатом. Три тонкости: `Pin::new` годится только для `Unpin`-источников (потому и граница), считать надо разницу длины `filled`, потому что буфер может прийти уже частично заполненным (так делают `read_to_end` и адаптеры), и учитывать нужно только `Ready(Ok)`, ведь `Pending` и ошибка байт не добавили. Тот же приём лежит в основе `take`, `chain`, `BufReader`."""

[[exercises]]
name = "aio19"
style = "todo"
hint.ru = [
  """Для `poll_write` обрежь срез до `max` байт и отдай вложенному приёмнику, его ответ верни как есть. Ответ может быть меньше срезанного, это нормально.""",
  """`poll_flush` и `poll_shutdown` у обёртки не имеют своей логики: просто вызови одноимённые методы вложенного через `Pin::new(&mut self.inner)`. Если вернуть `Ready(Ok(()))` из головы, до реального приёмника команда не дойдёт.""",
]
why.ru = """Обёртка над `AsyncWrite` это три функции. В `poll_write` она вольна принять меньше, чем дали: контракт именно такой, и честный вызывающий должен перепроверять число (отсюда `write_all`). Хороший тестовый приём: прогнать код через `Chopper` с `max = 1` и посмотреть, что сломалось. А `poll_flush` и `poll_shutdown` обязаны проваливаться вглубь: обёртка, которая проглотила `flush`, оставит данные в буфере нижнего слоя, а проглоченный `shutdown` не даст собеседнику увидеть конец потока."""

[[exercises]]
name = "aio20"
style = "scratch"
hint.ru = [
  """Любой `poll_*` умеет вернуть `Pending`. Обычный `read` в ответ на `Pending` засыпает до пробуждения, а тебе нужно превратить `Pending` в немедленный ответ. Для запуска опроса из async-кода без своей структуры есть `std::future::poll_fn`.""",
  """Внутри замыкания `poll_fn` создай `ReadBuf` над `buf`, вызови `poll_read` вложенного источника и сопоставь три исхода: готово с данными, ошибка, `Pending`. Последний превращай в готовое `Ok(None)`. Замыкание вызывается много раз, поэтому `buf` в `ReadBuf::new` отдавай по повторному заимствованию.""",
]
why.ru = """`poll_fn` превращает замыкание `|cx| -> Poll<T>` в future: это самый короткий способ спуститься с async-уровня на poll-уровень, не заводя структуру. Здесь он нужен, чтобы перехватить `Pending`, который обычный `.await` скрывает. Waker при этом остаётся зарегистрированным в источнике, но нам он не нужен: мы завершаемся сразу, поэтому лишнее пробуждение безвредно. Тот же приём используют, когда надо опросить два источника в одном замыкании или написать свой `select`."""

[[exercises]]
name = "aio21"
style = "scratch"
hint.ru = [
  """Нужны `tokio::fs::create_dir_all`, `OpenOptions` (с `create` и `append`) и `BufReader` над файлом. Отсутствие файла приходит как ошибка с видом `NotFound`: её надо отличить от остальных.""",
  """Запись: создай папки по `path.parent()`, открой с `create(true).append(true)`, запиши строку вместе с `\\n`. Чтение: `File::open`, при `NotFound` верни пустой вектор, иначе читай `lines()` до `None`.""",
]
why.ru = """`tokio::fs` это те же вызовы, что в `std::fs`, но выполненные в пуле блокирующих потоков, поэтому задача не держит рабочий поток рантайма, пока диск думает. `OpenOptions` с `append` открывает в режиме дозаписи, а `create` создаёт файл, если его нет; без `append` каждая запись затирала бы журнал с начала. `NotFound` как «ничего нет» вместо ошибки это ровно то, как журнал должен вести себя при первом запуске. `flush` у `File` нужен всерьёз: запись в tokio::fs проходит через внутренний буфер, и без него завершение может опередить диск."""

[[exercises]]
name = "aio_journal"
style = "scratch"
quiz = true
hint.ru = [
  """Разбей на три независимые части: запись строки, правила сброса и закрытия, проигрывание. Для проигрывания пригодятся `take` (лимит длины), `read_until` (строка), а по концу строки без `\\n` отличай недописанный хвост от слишком длинной строки.""",
  """Запись: проверь событие до любых записей (иначе плохое событие оставит в буфере мусор), напиши строку через `write_all`, считай записи с прошлого сброса и делай `flush`, когда счёт дошёл до `flush_every`. `close`: `flush`, затем `shutdown`. Проигрывание: на каждую строку заводи `(&mut reader).take(max_line + 1)`, читай `read_until(b'\\n')`. Если в конце прочитанного нет `\\n`, длина больше лимита значит ошибка, а иначе это недописанный хвост.""",
  """Разбор строки: `splitn(3, '\\t')`, три поля, число из первого. Ошибка любого шага это `InvalidData`. Текст события может содержать табуляцию, поэтому третье поле берётся целиком, и делить надо именно на три части.""",
]
why.ru = """Журнал собирает всё, что было в главе, в одно место. `BufWriter` с правилом «сбрасывать каждые N записей» меняет цену записи на окно потери: при сбое пропадёт не больше N событий, а диск не дёргается на каждую строку. `close` это явный `flush` и `shutdown`, потому что асинхронного `Drop` нет. Проигрывание построено на `take(max + 1)`: лишний байт позволяет отличить строку ровно в лимит от строки длиннее, а память ограничена независимо от того, что в файле. Недописанная последняя строка это нормальный след обрыва посреди записи, а не повод остановить запуск, зато целая испорченная строка означает, что журналу нельзя верить, и тут честнее упасть. Всё написано поверх `AsyncRead` и `AsyncWrite`, поэтому тесты идут на `Vec`, на подконтрольном приёмнике и на потоке, который отдаёт по три байта."""

