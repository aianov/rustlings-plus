hint.ru = [
"""Начни снизу и без ядра: `Entry` в contracts, потом `JournalWriter` и `replay` в journal/. Писатель это `BufWriter`
и счётчик записей с прошлого сброса. Строку собери в `Vec<u8>` через `write_line` и отдай одним `write_all`: голый
`write` на кусочном приёмнике запишет только начало. `close` это `flush` и `shutdown`, асинхронного `Drop` нет.""",
"""Проигрывание: на каждую строку `(&mut reader).take(max_line as u64 + 1).read_until(b'\\n', &mut raw)`. Ноль байт
значит конец. Нет `\\n` в конце: прочитали весь лимит, значит строка слишком длинная, иначе это обрыв (`torn`).
`bytes` растёт только на целых строках, по нему `load` потом обрезает файл через `set_len`.""",
"""`Network::restore` это `match` по `Entry` с обычными операциями сети, а для постов и лайков `publish_at` и
`like_at` со временем из записи. Чтобы время было, порт отдаёт его: `Published::at`, `Liked::at`, а MemRepo берёт
`network.now()` один раз и передаёт в `publish_at`.""",
"""Порядок: задача записи читает `mpsc`, поэтому две параллельные регистрации могут положить записи не в том
порядке, в каком хранилище выдало id. Возьми `tokio::sync::Mutex<()>` до операции порта и отпусти после `send` в
очередь журнала. Стадию `journal` объяви после `trends`: `Shutdown` гасит стадии по порядку объявления.""",
]
story.ru = """Соцсеть больше не забывает: закрыл терминал, открыл снова, и alice на месте вместе с подписчиками, лайками и
перепиской. Журнал дописывается последним, а обрыв посреди строки при запуске аккуратно отрезается."""
