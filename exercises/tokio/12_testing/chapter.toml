[chapter]
title.en = "Testing async code"
title.ru = "Тестирование async"

[[exercises]]
name = "tt1"
style = "fix"
hint.ru = [
  """Два симптома, одна причина. Посмотри, что делает `block_in_place` на однопоточном рантайме, и можно ли потерять выдачу, если задачи могут переключаться только на `.await`, а в `next` его нет.""",
  """Гонка за счётчик возможна только когда два потока одновременно выполняют `next`. Значит, рантайму нужно несколько рабочих потоков, и именно несколько: сколько их, настраивается в построителе.""",
  """Нужен многопоточный рантайм с явным числом воркеров (не меньше двух, а лучше столько, сколько задач соревнуется). Один воркер ничем не лучше `current_thread` для поиска гонок.""",
]
why.ru = """Рантайм по умолчанию в `#[tokio::test]` однопоточный, и на нём гонки между задачами возможны только на точках `.await`. Атомарные операции без `.await` посреди (как в `Racy::next`) там не разойдутся никогда, и тест будет зелёным, пока в продакшене на многих потоках теряются выдачи. `block_in_place` тоже требует многопоточного рантайма. Поэтому для проверки параллельного кода тесту нужен `multi_thread` и явное `worker_threads` (с одним воркером параллелизма нет). Заодно ясна ценность тестов на мутантах: тест, который не падает на заведомо сломанной версии, ничего не проверяет."""

[[exercises]]
name = "tt_q1"
kind = "question"
style = "bughunt"
question.ru = """Две задачи по тысяче раз выполняют `let v = counter.load(SeqCst); counter.store(v + 1, SeqCst);` (между чтением и записью нет `.await`). Тест запускается в двух вариантах: `#[tokio::test]` и `#[tokio::test(flavor = "multi_thread", worker_threads = 2)]`. Какие утверждения верны? Выбери все."""
options.ru = ["В варианте по умолчанию итог всегда 2000", "В многопоточном варианте итог может оказаться меньше 2000", "В варианте по умолчанию итог тоже может оказаться меньше 2000", "SeqCst делает пару «прочитал, записал» неделимой, поэтому в многопоточном варианте итог тоже всегда 2000"]
answer = [0, 1]
explain.ru = """На `current_thread` задачи переключаются только на `.await`, а внутри пары «прочитал, записал» его нет, поэтому одна задача успевает закончить пару до того, как вторая начнёт. Итог всегда 2000, и тест не заметит гонку. На двух потоках вторая задача может прочитать то же значение, пока первая ещё не записала, и тогда одно увеличение теряется. `SeqCst` определяет порядок операций, но не склеивает две операции в одну: для этого нужен `fetch_add`."""
hint.ru = """Где в однопоточном рантайме возможна смена задачи, и есть ли там такая точка между чтением и записью?"""

[[exercises]]
name = "tt2"
style = "fix"
hint.ru = [
  """При замороженном времени рантайм перематывает часы вперёд, когда ему «нечем заняться». Подумай, чем рантайм занят, пока ждёт `spawn_blocking`, и что в этот момент решает перемотка относительно таймера `timeout`.""",
  """Блокирующая работа идёт на отдельном потоке по настоящему времени, а рантайм при этом простаивает и считает, что можно перемотать часы до ближайшего таймера. Таймер лимита срабатывает раньше, чем поток досыпает. Часам нельзя доверять там, где работа не асинхронна.""",
  """Тест такого сервиса надо гонять на настоящих часах: лимиты в нём небольшие, ждать придётся доли секунды. Замороженное время создано для асинхронных ожиданий, а не для потоков.""",
]
why.ru = """Автоматическая перемотка при замороженном времени срабатывает, когда рантайму нечего исполнять. Пока блокирующий поток спит по-настоящему, рантайм именно в таком состоянии: у него нет ни готовых задач, ни событий, и он честно прыгает к ближайшему таймеру, то есть к лимиту. Поэтому `timeout` вокруг `spawn_blocking` под замороженным временем всегда срабатывает раньше работы. Лечение в тесте: настоящие часы для блокирующих вещей (лимиты делают короткими), а замороженное время оставляют асинхронным ожиданиям. Другое лечение в коде: сделать работу подменяемой асинхронной заглушкой."""

[[exercises]]
name = "tt_q2"
kind = "question"
style = "bughunt"
question.ru = """Что напечатает тест на замороженном времени?

```rust
#[tokio::test(start_paused = true)]
async fn t() {
    let start = Instant::now();
    std::thread::sleep(Duration::from_millis(300));
    sleep(Duration::from_millis(200)).await;
    println!("{:?}", start.elapsed());
}
```"""
options.ru = ["200 мс", "500 мс", "300 мс", "около 200 мс, но точное значение зависит от машины"]
answer = [0]
explain.ru = """Замороженные часы не знают о реальном времени. `std::thread::sleep` задерживает тест на самом деле, но `tokio::time::Instant` этого не видит: он двигается только когда рантайм сам перематывает часы к таймеру. Асинхронный `sleep` на 200 мс при простое рантайма перематывает ровно на 200 мс. Поэтому результат точный и не зависит от машины. Обратное тоже верно: настоящая работа в потоке не продвигает часы, что и ломает `timeout` вокруг `spawn_blocking`."""
hint.ru = """Кто двигает замороженные часы, и замечают ли они блокирующую паузу?"""

[[exercises]]
name = "tt3"
style = "scratch"
hint.ru = [
  """Один `yield_now` отдаёт ход один раз, а цепочка из шести задач требует по одному ходу на звено. Значит, ходов нужно много. Какую операцию рантайм считает ожиданием, не двигая часы?""",
  """`tokio::task::yield_now().await` ставит задачу в конец очереди и пропускает остальные готовые. Вызови его в цикле достаточное число раз; `sleep`, даже на наносекунду, сдвинул бы часы, и тест `settle_does_not_wake_timers` это заметит.""",
]
why.ru = """Каждая пересылка по каналу или пробуждение по таймеру это отдельный ход планировщика, поэтому цепочка из n звеньев доходит до конца только за n ходов. `settle` сводится к тому, что мы честно прокручиваем очередь достаточное число раз с помощью `yield_now`, который время не трогает. Верхняя граница выбирается с запасом, хотя точный критерий «готовых задач больше нет» рантайм наружу не отдаёт. Дальше тест двигает часы маленькими шагами и после каждого вызывает `settle`: так проверяется состояние между шагами, а не только итог. Без `settle` в тесте пачки часы стартовали бы позже, чем думает автор."""

[[exercises]]
name = "tt4"
style = "todo"
hint.ru = [
  """Фейк нужен ровно для одного: чтобы тест сам решал, когда загрузка закончится. Значит, `load` не отвечает, а оставляет в общей таблице «заявку» и ждёт. Что подходит на роль заявки, которую выполняет кто-то другой и один раз?""",
  """Одноразовый канал `oneshot`: в таблице по ключу лежат его отправители, а загрузка ждёт получателя. `release` забирает всех отправителей ключа и посылает каждому значение; забрав, он удаляет запись, поэтому ворота после этого снова закрыты.""",
  """Счётчик вызовов и запись в таблицу делай в самом `load`, до того как вернул future: тогда `calls` не зависит от того, успели ли опросить future. Внутри future остаётся только `rx.await`.""",
]
why.ru = """Фейк с воротами это самый полезный инструмент теста конкурентного кода: он превращает «подождём и посмотрим» в «в этот момент зависимость занята, а теперь отвечает». Тест может проверить промежуточное состояние (вызовов один, ждущих двое), потом открыть ворота и проверить итог. Ворота делаются на `oneshot`: заявка одноразова, поэтому после `release` повторный запрос снова ждёт. Три сломанных кеша показывают, чего требует каждая проверка: без «вызовов один» не поймать отсутствие склейки, без повторной загрузки не поймать вечную память, без двух ключей не поймать общий слот."""

[[exercises]]
name = "tt5"
style = "bughunt"
hint.ru = [
  """Сервис в порядке: тесты читаются как ТЗ. Сравни фактический порядок и счёт с ожидаемым: в первом тесте «занято, занято, успех» превратилось в «успех, занято, занято». Откуда фейк достаёт следующий шаг?""",
  """У `Vec` есть `pop`, который снимает последний элемент, а скрипт читается с начала. Заодно посмотри, когда растёт `calls`: вызов считается вызовом, даже если он закончился ошибкой, и даже если сам ответ ещё не пришёл.""",
  """Для очереди с чтением с головы подходит `VecDeque` и `pop_front`. Счётчик увеличивай в самом начале `send`, до ожидания.""",
]
why.ru = """Фейк это тоже код, и в нём тоже живут баги, поэтому его делают предельно простым и тестируют сам по себе. Здесь два типичных промаха: шаги достаются с конца (`Vec::pop`), и счётчик считает только успехи. Оба не видны, пока смотришь на сервис, зато проявляются в странных цифрах: «сделано два вызова вместо трёх». Правило: если тест падает и логика сервиса выглядит верной, проверь фейк. Хороший сценарный фейк громко ругается на лишний вызов (тест `an_unscripted_call_is_loud`), иначе сервис молча сделал бы вызов, которого автор теста не ожидал."""

[[exercises]]
name = "tt6"
style = "scratch"
hint.ru = [
  """Ошибка проявляется, когда future выбросили между двумя половинами операции. Значит, тесту нужно уметь выбросить future в разные моменты, и моментов должно хватить, чтобы попасть в серединку.""",
  """Под замороженным временем моменты точны. `tokio::time::timeout(d, future)` выбрасывает future ровно через `d`. Прогони отмену по сетке времён от нуля до чуть большего, чем полная длительность операции, и для каждой проверь, что деньги не пропали и не создались.""",
  """Инвариант не «деньги переехали», а «сумма на двух счетах не изменилась», потому что он верен и при отмене, и при завершении. Для каждой точки начинай с нового банка.""",
]
why.ru = """Отмена это не исключение, а штатное событие: любой `timeout`, `select!` или `abort` выбрасывает future на очередном `await`. Тест, который проверяет только полный проход, пропускает половину состояний программы. Приём «отмена в каждый момент» опирается на замороженное время: `timeout` с нарастающим сроком обрывает операцию на каждом её шаге по очереди, и инвариант («сумма не меняется») проверяется на каждом. Лечится такая ошибка в коде тем, что все изменения состояния делаются между последним `await` и концом, без точек отмены внутри."""

[[exercises]]
name = "tt_q3"
kind = "question"
style = "bughunt"
question.ru = """Что окажется в журнале после двух вызовов (замороженное время)?

```rust
async fn step(log: &Mutex<Vec<&'static str>>) {
    log.lock().unwrap().push("a");
    sleep(Duration::from_millis(10)).await;
    log.lock().unwrap().push("b");
}
let _ = timeout(Duration::from_millis(5), step(&log)).await;
let _ = timeout(Duration::from_millis(15), step(&log)).await;
```"""
options.ru = ["[\"a\", \"a\", \"b\"]", "[\"a\", \"b\", \"a\", \"b\"]", "[\"a\", \"a\"]", "[\"a\"]"]
answer = [0]
explain.ru = """Первый `timeout` отменяет `step` через 5 мс: `a` успел записаться, до `b` дело не дошло, и выброшенный future его уже не допишет. Второй успевает за 15 мс: снова `a`, потом `b`. Итого `a`, `a`, `b`. Половина эффекта первого вызова осталась в журнале: это и есть частичный эффект отмены, который ловят сеткой времён отмены."""
hint.ru = """Что именно успевает выполниться до точки `.await`, когда future выбрасывают по таймауту?"""

[[exercises]]
name = "tt7"
style = "fix"
hint.ru = [
  """Посчитай байты. Канал `duplex(32)` держит на каждое направление не больше 32 байт. Команды клиента занимают больше, ответы сервера тоже. Кто сейчас пишет и кто в это время читает?""",
  """Клиент пишет всё подряд и только потом начинает читать. Сервер на каждую команду пишет ответ, а читать их некому: буфер полон, и сервер встаёт. Тогда он перестаёт читать команды, и клиент тоже встаёт на записи. Двое ждут друг друга.""",
  """Писать и читать нужно одновременно: две части одного соединения (`tokio::io::split`) и два занятия в одной задаче, которые выполняются вместе (подойдёт `join!`), или отдельная задача под запись.""",
]
why.ru = """Сценарный тест клиента и сервера в одной программе должен быть таким же дуплексом, как настоящая сеть: запись и чтение идут независимо. «Сначала всё отправлю, потом всё прочитаю» работает только пока обе стороны помещаются в буферы, а `duplex` с маленьким размером как раз и нужен, чтобы такое ловить. Разделение на половины и `join!` для отправки и чтения решает это в одной задаче. Заодно ясно, зачем нужен общий `timeout` в сценарии: зависший обмен должен падать с понятным сообщением, а не стоять. А три сломанных сервера проверяют, что стенограмма сверяется целиком, включая конец соединения после QUIT."""

[[exercises]]
name = "tt8"
style = "scratch"
hint.ru = [
  """Утечку видно по числу живых задач у рантайма: есть метрики, которые отвечают на вопрос «сколько задач ещё не закончилось». Но число само по себе ничего не значит: нужна точка отсчёта.""",
  """Измерь число живых задач до подключений, потом после отпускания всех подключений. Если проверить сразу, исправный хаб тоже покажет «утечку»: его задачи дописывают хвост. Дай им время закончиться.""",
  """Под замороженным временем пауза ничего не стоит: `sleep` с запасом, заведомо большим длины хвоста. После паузы разница с точкой отсчёта должна быть нулевой.""",
]
why.ru = """Утечка задач молчит: ничего не падает, только растёт число живых задач и память. Тест-страж сравнивает `num_alive_tasks` до и после сценария, но две ловушки делают его бесполезным. Без точки отсчёта в рантайме могут жить чужие задачи. Без паузы на хвосты исправный код выглядит утекающим: задача после закрытия канала ещё доделывает работу. Замороженное время позволяет подождать с запасом бесплатно. Приём из этой задачи переносится на любые сервисы, где есть «по задаче на подключение»."""

[[exercises]]
name = "tt9"
style = "scratch"
hint.ru = [
  """Гонка возможна, только когда два обращения выполняются одновременно в двух потоках, а не по очереди. Один поток и `current_thread` её не покажут. И потоку надо дать одновременный старт: иначе первая задача может закончить раньше, чем стартует вторая.""",
  """Нужны три вещи: многопоточный рантайм с несколькими воркерами, `Barrier` на старте обращений (все ждут друг друга и стартуют разом) и много повторов с новой ячейкой на каждый раунд, чтобы щель попала хоть раз. Рабочая цифра раундов зависит от ширины щели; измерь, не гадай.""",
  """Новая ячейка в каждом раунде обязательна: старая уже инициализирована. Утверждение «ровно одна инициализация» проверяй после каждого раунда, а не в конце, чтобы сообщение называло раунд.""",
]
why.ru = """Гонка без параллелизма не воспроизводится, а с параллелизмом воспроизводится по-разному на каждом запуске. Стресс-тест превращает «иногда» в «каждый раз» тремя приёмами. Несколько воркеров дают настоящую одновременность. `Barrier` выравнивает старт, чтобы все обращения прошли проверку в одно и то же короткое окно. Сотни раундов с новой ячейкой в каждом множат шанс попасть в щель до практической достоверности. Эти цифры подбирают замером: на сломанной версии тест должен падать подряд много раз, на исправной не падать ни разу, иначе он либо слеп, либо шумит."""

[[exercises]]
name = "tt_q4"
kind = "question"
style = "bughunt"
question.ru = """Один раунд стресс-теста ловит гонку с вероятностью около 1%. Раунды независимы. Сколько раундов нужно, чтобы вероятность поймать гонку хотя бы раз превысила 99%?"""
options.ru = ["около 10", "около 100", "около 460", "около 10 000"]
answer = [2]
explain.ru = """Вероятность пропустить гонку во всех n раундах равна 0,99 в степени n. Чтобы она стала меньше 1%, нужно n больше ln(0,01) / ln(0,99), то есть около 459. Ста раундов мало (шанс поймать около 63%). Выводы для практики: чем уже щель, тем больше раундов, а выравнивание старта (`Barrier`) резко поднимает вероятность одного раунда, поэтому стоит делать и то и другое."""
hint.ru = """Вероятность не поймать ни разу за n раундов это (1 - p) в степени n."""

[[exercises]]
name = "tt_mutants"
kind = "project"
style = "scratch"
quiz = true
locked = ["crates/acceptance/tests/acceptance.rs", "crates/notifier/src/lib.rs", "crates/notifier/Cargo.toml"]
hint.ru = [
  """Начни с общего: вспомогательная функция `settle` (много `yield_now`) и сервис на замороженном времени `#[tokio::test(start_paused = true)]`. Тест должен быть коротким: одно поведение, одна причина падения. Сначала пройдись по списку требований из README и напиши по тесту на каждое.""",
  """Сломанные версии отличаются от исправной не мелочью, а поведением, которое лежит на границе: ровно на лимите, ровно на закрытии окна, при остановке, после остановки, после `mute`. Тест, который проверяет границу с обеих сторон (за миг до и ровно в момент), ловит и «слишком рано», и «слишком поздно».""",
  """Если сломанная версия прошла твои тесты, то ни один из них не отличает её от верной. Ищи, чем именно они отличаются по поведению (порядок записей, момент доставки, число состояний, ответ после остановки), и напиши тест на эту разницу. Чтобы сравнивать с эталоном, запусти тесты с нужной фичей: `cargo test -p notifier --test student --features bug_order`.""",
]
why.ru = """Тесты ценны ровно тем, что падают на сломанном коде. Здесь это проверяется напрямую: приёмка запускает твои тесты на исправном сервисе и на восьми нарочно сломанных. Каждая ломка проявляется только в одном виде поведения (порядок, граница окна, лимит, остановка, заглушение, утечка состояния, ответ после остановки), и для каждой нужен свой тест. Замороженное время и пошаговый прогон (`settle`, `advance`) делают границы точными, а не «примерно». Проверка с обеих сторон границы (99 мс и 100 мс) ловит и раннюю, и позднюю доставку."""
