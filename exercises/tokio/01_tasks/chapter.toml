[[exercises]]
name = "tk1"
style = "fix"
hint.ru = """Ожидание JoinHandle<Result<V, E>> даёт Result<Result<V, E>, JoinError>. Нужно два вопросительных знака подряд: первый снимает JoinError (для него уже есть From), второй ошибку самой задачи."""
why.ru = """Внешний слой отвечает на вопрос «дожила ли задача» (паника, отмена), внутренний на вопрос «что она ответила». Это два разных сбоя, и tokio честно их разделяет. `??` собирает оба в одну ошибку через From, поэтому вызывающему не нужно знать про JoinError. Не прячь внешний слой через unwrap: паника в одной задаче станет паникой в вызывающем."""

[[exercises]]
name = "tk2"
style = "fix"
hint.ru = [
  """Future из `slow_square(n)` ничего не делает, пока его не опросят, а опрашивать его начинают только в цикле ожидания, по одному. Нужно, чтобы работа началась до цикла.""",
  """Оберни каждый вызов в `tokio::spawn(..)` и храни JoinHandle. Ожидание хэндла вернёт Result, результат задачи внутри. Для notify_in_background хэндл можно просто не сохранять.""",
]
why.ru = """Future ленив, задача (spawn) нет: она встаёт в очередь рантайма сразу, и ждать хэндл нужно только за результатом. Поэтому «spawn всех, потом await всех» даёт параллельность, а «собрать Future в Vec и ждать по очереди» нет. Хэндл, который никто не ждёт, задачу не останавливает (подробнее в tk10)."""

[[exercises]]
name = "tk_q1"
kind = "question"
style = "bughunt"
question.ru = '''Что напечатает программа?

```rust
#[tokio::main(flavor = "current_thread")]
async fn main() {
    let handle = tokio::spawn(async { println!("задача"); });
    println!("main до");
    handle.await.unwrap();
    println!("main после");
}
```'''
options.ru = [
  "задача, main до, main после",
  "main до, задача, main после",
  "main до, main после, задача",
  "main до, main после",
]
answer = [1]
explain.ru = """spawn только ставит задачу в очередь. На current_thread единственный поток занят main, и задача получит его только когда main дойдёт до .await на хэндле. Поэтому "main до" печатается первым. На multi_thread задача могла бы стартовать на другом потоке сразу, и порядок первых двух строк стал бы случайным. Для сравнения с rt_q4: там после spawn не было ни одного .await, и задача так и не запустилась."""
hint.ru = """Сколько потоков у current_thread и когда main их отдаёт?"""

[[exercises]]
name = "tk3"
style = "fix"
hint.ru = [
  """Задаче нужны данные, которые проживут сколько угодно. Ссылка на параметр функции таковой не является.""",
  """Первая функция: сделай из &str собственную String перед spawn. Вторая: клонируй элемент перед созданием async-блока, внутри цикла.""",
]
why.ru = """tokio::spawn требует 'static: задача может пережить функцию, которая её запустила, и ссылка на локальную переменную повисла бы. Компилятор не знает, когда задача закончится, и выбирает безопасный вариант. Лечится передачей владения: String вместо &str, клон вместо ссылки. Дёшево клонируются Arc и маленькие данные, а большие лучше положить в Arc один раз."""

[[exercises]]
name = "tk4"
style = "fix"
hint.ru = [
  """`async move` забирает `data` целиком в первую задачу. На втором витке цикла данных уже нет.""",
  """Перед `tokio::spawn` внутри цикла сделай `let data = Arc::clone(&data);`: затеняющая переменная уедет в async-блок, а оригинал останется.""",
]
why.ru = """Каждая задача владеет своим Arc. Клонируем до move и внутри цикла: тогда блок забирает клон, а оригинал живёт дальше для следующей итерации. Arc::clone дёшев (это счётчик), и записывать его именно так, а не data.clone(), принято, чтобы было видно, что копируется только указатель, а не данные."""

[[exercises]]
name = "tk5"
style = "fix"
hint.ru = [
  """Rc и RefCell рассчитаны на один поток. Для данных, которые переходят между потоками, есть их потокобезопасные аналоги.""",
  """Rc заменяется на Arc, RefCell на Mutex (std::sync). Вместо borrow_mut() будет lock().unwrap().""",
]
why.ru = """spawn требует Send: задача может перелететь на другой воркер. У Rc счётчик ссылок не атомарный, поэтому Rc не Send, и компилятор запрещает захватывать его в spawn-нутый блок. Arc<Mutex<T>> это стандартная замена. Нужен именно std::sync::Mutex, если замок держится коротко и без .await внутри (подробности в главе про синхронизацию)."""

[[exercises]]
name = "tk6"
style = "fix"
hint.ru = [
  """Rc нигде не пересекает потоки, но пересекает .await, а это тоже граница: всё, что живёт через .await, часть состояния Future.""",
  """Посчитай всё, что нужно от Rc, внутри блока `{ ... }` и верни из блока обычные числа. Rc умрёт на закрывающей скобке, до .await.""",
]
why.ru = """Send у Future определяется тем, какие значения живут через .await. Rc, MutexGuard из std и подобные !Send значения нельзя оставлять живыми через точку ожидания. Чинится не заменой типа, а сужением области видимости: Rc нужен только внутри вычисления. Блок надёжнее, чем drop(x): компилятор видит конец области явно."""

[[exercises]]
name = "tk_q2"
kind = "question"
style = "bughunt"
question.ru = '''Какой из этих фрагментов не скомпилируется? Во всех внутри функции, запущенной в рантайме.'''
options.ru = [
  "let s = String::from(\"a\"); tokio::spawn(async move { s.len() });",
  "let n = std::rc::Rc::new(1); tokio::spawn(async move { *n });",
  "let n = Arc::new(Mutex::new(1)); tokio::spawn(async move { *n.lock().unwrap() });",
  "tokio::spawn(async { { let n = Rc::new(1); println!(\"{n}\"); } tokio::time::sleep(d).await; });",
]
answer = [1]
explain.ru = """Не соберётся второй вариант: Rc уезжает в задачу через move, а Rc не Send. В четвёртом Rc тоже есть, но он живёт только внутри блока и умирает до .await, поэтому в состояние Future не попадает. Строка и Arc<Mutex<..>> спокойно отправляются между потоками."""
hint.ru = """Задача может оказаться на любом потоке. Что из захваченного для этого не годится?"""

[[exercises]]
name = "tk7"
style = "scratch"
hint.ru = [
  """Нагрузка паники приходит как Box<dyn Any + Send>. Прочитать её можно через `downcast_ref::<T>()`. Подумай, какие два типа бывают у текста паники.""",
  """panic!("литерал") даёт &'static str, а panic!("с {форматом}") даёт String. У JoinError есть is_panic(), is_cancelled() и into_panic().""",
  """supervise: match на handle.await с тремя ветками (Ok, паника, отмена). propagate: для паники вызови `std::panic::resume_unwind(error.into_panic())`.""",
]
why.ru = """Паника в задаче не роняет рантайм, и если никто не смотрит в JoinError, она пропадает бесследно. is_panic и is_cancelled различают два принципиально разных исхода. resume_unwind пробрасывает исходную панику с исходной нагрузкой без повторного сообщения, что нужно, когда зависимая задача должна упасть по той же причине. Тип нагрузки зависит от формы panic!, поэтому проверяются оба варианта."""

[[exercises]]
name = "tk8"
style = "todo"
hint.ru = [
  """abort() вызывается на самом хэндле, потом хэндл можно ждать и посмотреть, чем он кончился.""",
  """В stop: `handle.abort();` затем `handle.await` и `is_err_and(|e| e.is_cancelled())`. В killer: у JoinHandle есть метод abort_handle().""",
]
why.ru = """После abort ожидание хэндла возвращает Err(JoinError), у которой is_cancelled() истинно. Но если задача к моменту abort уже успела завершиться, результат придёт обычный Ok: отменить сделанное нельзя. AbortHandle удобен, когда прерывать должен тот, кто хэндл не держит (таймер, обработчик сигнала, соседняя задача)."""

[[exercises]]
name = "tk9"
style = "bughunt"
hint.ru = [
  """abort не прерывает код на месте. Когда задача может отреагировать на него?""",
  """Задача замечает отмену, когда возвращает управление рантайму, то есть в точке .await. В цикле такой точки нет.""",
  """Добавь в тело цикла `tokio::task::yield_now().await;`.""",
]
why.ru = """abort взводит флаг, а проверяется он только когда задачу опрашивают. Опрос же случается между .await. Цикл, внутри которого нет ни одного .await, из рантайма не выходит и отмены не видит, пока не закончится. yield_now это .await без реального ожидания: задача отдаёт поток и сразу встаёт в очередь, давая рантайму шанс заметить флаг. Для горячих циклов вставляй его не на каждом шаге, а раз в сотню-тысячу."""

[[exercises]]
name = "tk_q3"
kind = "question"
style = "bughunt"
question.ru = '''Рантайм многопоточный. Что напечатает программа?

```rust
let handle = tokio::spawn(async {
    std::thread::sleep(std::time::Duration::from_secs(1));
    println!("A");
    tokio::time::sleep(std::time::Duration::from_secs(1)).await;
    println!("B");
});
tokio::time::sleep(std::time::Duration::from_millis(100)).await;
handle.abort();
tokio::time::sleep(std::time::Duration::from_secs(3)).await;
```'''
options.ru = ["ничего", "A", "A, B", "B"]
answer = [1]
explain.ru = """Через 100 мс задача уже внутри std::thread::sleep: она занимает воркер и прервать её на месте нельзя. abort поднимает флаг, задача доспит секунду и напечатает "A". Дойдя до первого .await, она возвращается в рантайм, тот видит флаг и уничтожает задачу, поэтому "B" не будет. Отмена срабатывает только в точке .await."""
hint.ru = """В какой момент рантайм может заглянуть в флаг отмены?"""

[[exercises]]
name = "tk10"
style = "todo"
hint.ru = """Допиши тело drop: у поля 0 есть метод `abort()`."""
why.ru = """JoinHandle при дропе отсоединяет задачу, а не отменяет: это сделано намеренно, чтобы fire-and-forget не требовал хранить хэндлы. Но когда задача принадлежит владельцу (соединению, сессии, запросу), она должна умирать вместе с ним, иначе копятся сироты. RAII-обёртка решает это одной строкой, и дальше она пригодится везде, где задача привязана к области видимости."""

[[exercises]]
name = "tk_q4"
kind = "question"
style = "bughunt"
question.ru = '''Сколько строк "тик" напечатает программа?

```rust
fn start_ticker() {
    let handle = tokio::spawn(async {
        loop {
            println!("тик");
            tokio::time::sleep(std::time::Duration::from_millis(100)).await;
        }
    });
    let _ = handle;
}

#[tokio::main]
async fn main() {
    for _ in 0..3 {
        start_ticker();
    }
    tokio::time::sleep(std::time::Duration::from_millis(350)).await;
}
```'''
options.ru = ["0", "3", "4", "12"]
answer = [3]
explain.ru = """Хэндл дропается при выходе из start_ticker, но дроп JoinHandle задачу не отменяет, а отсоединяет. Все три тикера живут и тикают в моменты 0, 100, 200 и 300 мс: три тикера по четыре тика дают двенадцать строк. Чтобы тикер умирал вместе с владельцем, нужна обёртка с abort в Drop (tk10)."""
hint.ru = """Что происходит с задачей, когда её JoinHandle выброшен?"""

[[exercises]]
name = "tk11"
style = "fix"
hint.ru = [
  """Что происходит с задачами, которые ещё работают, когда async-тело block_on завершилось?""",
  """В run_app сохрани хэндл от spawn и дождись его перед выходом из async-блока. В stop_runtime есть специальный метод Runtime с таймаутом в названии.""",
]
why.ru = """Задача не держит рантайм живым. Когда block_on вернулся и рантайм дропнут, всё недоделанное выбрасывается, поэтому «фоновый сброс на диск» нужно либо дождаться, либо отслеживать (JoinSet, учёт задач в главе про остановку). Обычный drop рантайма ждёт блокирующие потоки, и один зависший вызов подвесит выход. shutdown_timeout даёт верхнюю границу ожидания."""

[[exercises]]
name = "tk12"
style = "todo"
hint.ru = [
  """Нужен тип, который сам хранит запущенные задачи и отдаёт их по мере завершения.""",
  """JoinSet: `set.spawn(fut)` запускает, `set.join_next().await` возвращает Option<Result<T, JoinError>>: None, когда задач не осталось.""",
]
why.ru = """Vec<JoinHandle> привязывает порядок ожидания к порядку запуска: быстрая задача ждёт медленную. JoinSet отдаёт результаты в порядке готовности, поэтому подходит для «первый ответ», сбора по мере поступления и для скользящего окна (tk14). Ещё у него есть бонус: при дропе все задачи отменяются."""

[[exercises]]
name = "tk13"
style = "todo"
hint.ru = [
  """Пока ты ждёшь хэндлы по порядку, ошибка второго задания не видна, пока не завершится первое. Нужна очередь «кто первый закончил».""",
  """JoinSet и join_next. При первом Err вызови `set.abort_all()` и верни ошибку. Можно и просто вернуться: дроп JoinSet отменит всех сам.""",
]
why.ru = """JoinSet связывает жизнь задач с набором: выйти из функции значит отменить всех, кто не успел. Вектор хэндлов такого не даёт: после раннего возврата задачи продолжают работать впустую. abort_all в коде оставлен ради ясности намерения, а смысл тот же, что у дропа. Помни про tk9: отмена настигнет задачу только в точке .await."""

[[exercises]]
name = "tk_q5"
kind = "question"
style = "bughunt"
question.ru = '''Что напечатает программа?

```rust
async fn run() {
    let mut set = tokio::task::JoinSet::new();
    for i in 0..3u64 {
        set.spawn(async move {
            tokio::time::sleep(std::time::Duration::from_millis(100 * (i + 1))).await;
            println!("готово {i}");
        });
    }
    set.join_next().await;
}

#[tokio::main]
async fn main() {
    run().await;
    tokio::time::sleep(std::time::Duration::from_secs(1)).await;
}
```'''
options.ru = [
  "готово 0, готово 1, готово 2",
  "готово 0",
  "ничего",
  "готово 0, потом паника",
]
answer = [1]
explain.ru = """join_next дождался первой задачи. Когда run вернулась, set дропнулся, а дроп JoinSet отменяет все ещё не завершённые задачи. Остальные две не успели и погибли. С Vec<JoinHandle> те же задачи продолжили бы работать в фоне."""
hint.ru = """Что делает дроп JoinSet с задачами, которые ещё работают?"""

[[exercises]]
name = "tk14"
style = "todo"
hint.ru = [
  """Окно скользит: пока в JoinSet меньше limit задач, запускай новые, как только одна закончилась, освободилось место.""",
  """Цикл: сначала добавь задачи, пока `set.len() < limit` и есть элементы; затем `set.join_next().await`; если вернулось None, значит всё кончилось.""",
]
why.ru = """Запустить всё сразу и «подождать» это неограниченная нагрузка на соединения, файлы и память. Окно на JoinSet держит ровно limit задач и не ждёт, пока закончится вся пачка: освободилось место, сразу стартует следующая. Тест на 9 элементов проверяет именно это: три волны по 10 мс, а не одна задержка на пачку из-за самой медленной."""

[[exercises]]
name = "tk15"
style = "fix"
hint.ru = [
  """Пока crunch считает, поток занят, и watch не получает ни одного шанса. Как crunch может его отдать?""",
  """`tokio::task::yield_now().await` внутри цикла. Не на каждом шаге: условие `step % 100 == 0`.""",
]
why.ru = """Рантайм не вытесняет задачи принудительно: переключение происходит только на .await. Длинный счёт без .await душит соседей, а на current_thread останавливает всё. yield_now честно отдаёт поток и встаёт в конец очереди. Слишком частый yield обходится дорого, поэтому делается раз в N шагов. Для настоящей тяжёлой работы лучше spawn_blocking (следующая задача)."""

[[exercises]]
name = "tk16"
style = "fix"
hint.ru = [
  """slow_hash синхронная и блокирует поток. Менять её нельзя, значит, нужно вызвать её не там, где работают async-задачи.""",
  """`tokio::task::spawn_blocking(move || ...)` запускает замыкание на отдельном потоке и возвращает JoinHandle, который можно ждать через .await.""",
]
why.ru = """spawn_blocking отправляет работу в отдельный пул потоков, предназначенный для блокирующих и тяжёлых вызовов, а воркеры рантайма остаются свободными. Замыкание должно быть 'static, поэтому password уезжает внутрь через move. В ответе JoinHandle, значит, надо учесть и панику внутри замыкания (здесь unwrap). Пул не бесконечен, его предел разберём в главе про устройство tokio."""

[[exercises]]
name = "tk17"
style = "fix"
hint.ru = [
  """Нужен контекст, который принадлежит задаче, а не потоку. В tokio для этого есть макрос с `local` в названии.""",
  """`tokio::task_local! { static REQUEST_ID: u32; }`. Значение задаётся оборачиванием Future: `REQUEST_ID.scope(id, async { ... }).await`. Вне scope `try_with` вернёт Err.""",
]
why.ru = """thread_local привязан к потоку, а задача не привязана ни к какому: на .await поток достаётся другим задачам, а на multi_thread задача ещё и переезжает. Поэтому значения в thread_local перемешиваются или пропадают. task_local хранит значение рядом с Future и подставляет его на время каждого опроса, поэтому контекстные данные (id запроса, пользователь) безопасно доступны в любой глубине вызовов внутри scope."""

[[exercises]]
name = "tk_import"
style = "scratch"
quiz = true
hint.ru = [
  """Скелет такой же, как у tk14: окно на JoinSet. Работа одной записи вынесена в отдельную async fn, которая возвращает (индекс, User).""",
  """В process: разбор строки (split_once, иначе BadRecord), потом `spawn_blocking(move || slow_hash(..))` и `.await?` (JoinError превращается в ImportError::Task), потом save. Для slow_hash нужен свой клон Arc<Stats>.""",
  """В import результат join_next это Result<Result<(usize, User), ImportError>, JoinError>: `result??` даёт запись. Складывай в Vec<Option<User>> по индексу. При ошибке просто верни её: дроп JoinSet отменит остальные.""",
]
why.ru = """Задача складывает всё главы вместе: окно на JoinSet ограничивает нагрузку, spawn_blocking уносит тяжёлое с воркеров, первая ошибка отменяет остальных через дроп набора, а паника задачи становится обычной ошибкой через From<JoinError>. Порядок результата восстанавливается по индексу, потому что JoinSet отдаёт в порядке готовности. Обрати внимание, что spawn_blocking отменить нельзя: уже начавшийся хеш досчитается, но сохранение после него не случится, потому что ждущая его задача отменена."""
