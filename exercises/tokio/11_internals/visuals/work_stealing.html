<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кража работы</title>
<style>
:root { --bg:#f6f7f9; --panel:#fff; --ink:#1c2330; --muted:#667085; --line:#d5d9e0; --a:#2f6fed; --b:#d9822b; --ok:#2e9e5b; --bad:#d64545; --code:#f0f2f6; }
@media (prefers-color-scheme: dark) { :root { --bg:#12151b; --panel:#1b2029; --ink:#e6e9ef; --muted:#98a2b3; --line:#343b49; --a:#6b9bff; --b:#f0a85a; --ok:#4cc585; --bad:#ff7b7b; --code:#151a22; } }
* { box-sizing:border-box; }
body { margin:0; padding:16px; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
h1 { font-size:18px; margin:0 0 4px; } .sub { color:var(--muted); margin:0 0 12px; }
.modes { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
.mode { text-align:left; font:13px/1.4 ui-monospace,Menlo,monospace; padding:8px 12px; border-radius:8px; border:2px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer; }
.mode.on { border-color:var(--a); } .mode small { display:block; font:12px system-ui,sans-serif; color:var(--muted); }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:10px; }
.cols { display:flex; gap:10px; flex-wrap:wrap; }
.col { flex:1 1 170px; min-width:150px; border:1px solid var(--line); border-radius:8px; padding:8px; background:var(--bg); }
.col h2 { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:0 0 8px; }
.chip { display:block; margin:4px 0; padding:6px 10px; border-radius:8px; border:2px solid var(--line); font:600 13px ui-monospace,Menlo,monospace; background:var(--panel); }
.chip.a { border-color:var(--a); } .chip.b { border-color:var(--b); } .chip.ok { border-color:var(--ok); color:var(--ok); } .chip.bad { border-color:var(--bad); color:var(--bad); }
.chip.gone { opacity:.5; text-decoration:line-through; border-style:dashed; }
.empty { color:var(--muted); font-size:13px; font-style:italic; }
code { font:13px ui-monospace,Menlo,monospace; background:var(--code); padding:1px 5px; border-radius:4px; }
.caption { padding:10px 12px; border-radius:8px; background:var(--panel); border:1px solid var(--line); min-height:68px; margin-bottom:10px; }
.controls { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
button.ctl { font:600 14px system-ui,sans-serif; padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--ink); cursor:pointer; }
button.ctl:disabled { opacity:.45; cursor:default; } .counter { color:var(--muted); font-size:13px; margin-left:auto; }
.verdict { margin-top:10px; padding:8px 12px; border-radius:8px; border:2px solid var(--line); font:600 14px system-ui,sans-serif; }
.verdict.ok { border-color:var(--ok); color:var(--ok); } .verdict.bad { border-color:var(--bad); color:var(--bad); } .verdict.info { color:var(--muted); }
</style>
</head>
<body>
<h1>Свободный воркер ворует половину очереди соседа</h1>
<p class="sub">У каждого воркера своя очередь, есть общая. Смотри, как простаивающий воркер находит себе работу.</p>
<div class="modes" id="modes"></div>
<div class="panel" id="view"></div>
<div class="caption" id="caption"></div>
<div class="controls">
  <button class="ctl" id="step">Шаг</button><button class="ctl" id="play">Играть</button><button class="ctl" id="reset">Сброс</button>
  <span class="counter" id="counter"></span>
</div>
<script>
const MODES = {"steal": {"label": "Воровство", "small": "воркер C простаивает", "steps": [{"cols": [{"h": "Общая очередь", "items": []}, {"h": "Воркер A", "items": [{"t": "t1", "s": "a"}, {"t": "t2", "s": "a"}, {"t": "t3", "s": "a"}, {"t": "t4", "s": "a"}, {"t": "t5", "s": "a"}]}, {"h": "Воркер B", "items": [{"t": "u1", "s": "b"}]}, {"h": "Воркер C", "items": []}], "v": {"k": "info", "t": "У A пять задач, у B одна, C ничего не делает"}, "cap": "Работа распределилась неравномерно: задачи породили на A. Воркер C закончил своё и смотрит, что взять дальше."}, {"cols": [{"h": "Общая очередь", "items": [{"t": "пусто", "s": "gone"}]}, {"h": "Воркер A", "items": [{"t": "t1", "s": "a"}, {"t": "t2", "s": "a"}, {"t": "t3", "s": "a"}, {"t": "t4", "s": "a"}, {"t": "t5", "s": "a"}]}, {"h": "Воркер B", "items": [{"t": "u1", "s": "b"}]}, {"h": "Воркер C", "items": [{"t": "своя очередь пуста", "s": "gone"}]}], "v": {"k": "info", "t": "Порядок поиска: своя очередь, общая, воровство"}, "cap": "Сначала C смотрит в свою очередь, потом в общую. Везде пусто, остаётся воровство."}, {"cols": [{"h": "Общая очередь", "items": []}, {"h": "Воркер A", "items": [{"t": "t1", "s": "a"}, {"t": "t2", "s": "a"}, {"t": "t3", "s": "a"}, {"t": "t4", "s": "a"}, {"t": "t5", "s": "a"}]}, {"h": "Воркер B", "items": [{"t": "u1", "s": "b"}]}, {"h": "Воркер C", "items": [{"t": "жертва: A, самая длинная", "s": "ok"}]}], "v": {"k": "ok", "t": "Жертва выбрана: у кого больше задач"}, "cap": "C выбирает соседа, у которого очередь длиннее всех: там есть что делить. У B одна задача, к нему идти не стоит."}, {"cols": [{"h": "Общая очередь", "items": []}, {"h": "Воркер A", "items": [{"t": "t4", "s": "a"}, {"t": "t5", "s": "a"}]}, {"h": "Воркер B", "items": [{"t": "u1", "s": "b"}]}, {"h": "Воркер C", "items": [{"t": "t1 выполняется", "s": "ok"}, {"t": "t2", "s": "a"}, {"t": "t3", "s": "a"}]}], "v": {"k": "ok", "t": "Взято три из пяти: половина вверх, с головы"}, "cap": "Берётся половина с округлением вверх: пять делится как три и два. Берётся голова очереди (самые давние задачи). Первая (t1) идёт в работу, остальные встают в очередь C, у A остаётся хвост."}, {"cols": [{"h": "Общая очередь", "items": []}, {"h": "Воркер A", "items": [{"t": "t4", "s": "a"}, {"t": "t5", "s": "a"}]}, {"h": "Воркер B", "items": [{"t": "u1", "s": "b"}]}, {"h": "Воркер C", "items": [{"t": "t2", "s": "a"}, {"t": "t3", "s": "a"}]}], "v": {"k": "ok", "t": "Один поход за три задачи"}, "cap": "Почему не по одной: поход к соседу требует синхронизации, и она дороже самой короткой задачи. Забрав сразу половину, вор не будет ходить снова несколько тактов."}]}, "global": {"label": "Общая очередь", "small": "задачи снаружи рантайма", "steps": [{"cols": [{"h": "Общая очередь", "items": [{"t": "x1 (из main)", "s": "b"}, {"t": "x2 (из потока)", "s": "b"}]}, {"h": "Воркер A", "items": [{"t": "a1", "s": "a"}, {"t": "a2", "s": "a"}, {"t": "a3", "s": "a"}, {"t": "a4", "s": "a"}, {"t": "a5", "s": "a"}]}, {"h": "Воркер B", "items": [{"t": "b1", "s": "a"}, {"t": "b2", "s": "a"}]}], "v": {"k": "info", "t": "x1 и x2 пришли снаружи, они лежат в общей очереди"}, "cap": "Задачи, порождённые не из воркера (из <code>main</code>, из обычного потока), попадают в общую очередь. Воркеры заняты своими и до неё добираются не сразу."}, {"cols": [{"h": "Общая очередь", "items": [{"t": "x1 (из main)", "s": "b"}, {"t": "x2 (из потока)", "s": "b"}]}, {"h": "Воркер A", "items": [{"t": "a1 → a2 → a3 ...", "s": "a"}]}, {"h": "Воркер B", "items": [{"t": "b1", "s": "a"}, {"t": "b2", "s": "a"}]}], "v": {"k": "bad", "t": "Если смотреть только в свои очереди, x1 и x2 ждут долго"}, "cap": "Пока у воркера A задачи порождают друг друга, его локальная очередь не пустеет, и до общей очереди дело не доходит. Задачи снаружи голодают."}, {"cols": [{"h": "Общая очередь", "items": [{"t": "x2 (из потока)", "s": "b"}]}, {"h": "Воркер A", "items": [{"t": "x1 выполняется", "s": "ok"}, {"t": "a2", "s": "a"}, {"t": "a3", "s": "a"}, {"t": "a4", "s": "a"}, {"t": "a5", "s": "a"}]}, {"h": "Воркер B", "items": [{"t": "b1", "s": "a"}, {"t": "b2", "s": "a"}]}], "v": {"k": "ok", "t": "Каждый N-й выбор сначала заглядывает в общую очередь"}, "cap": "Поэтому раз в несколько десятков опросов воркер смотрит в общую очередь <b>первой</b>, до своей. В tokio это интервал общей очереди. Теперь x1 ждёт ограниченное время."}]}};
const KEYS = Object.keys(MODES);
let mode = KEYS[0], pos = 0, timer = null;
const $ = id => document.getElementById(id);
function view(s) {
  const cols = s.cols.map(c => {
    const items = c.items.length ? c.items.map(i => `<span class="chip ${i.s || ""}">${i.t}</span>`).join("") : `<span class="empty">пусто</span>`;
    return `<div class="col"><h2>${c.h}</h2>${items}</div>`;
  }).join("");
  return `<div class="cols">${cols}</div><div class="verdict ${s.v.k}">${s.v.t}</div>`;
}
function render() {
  const steps = MODES[mode].steps, s = steps[pos];
  $("view").innerHTML = view(s);
  $("caption").innerHTML = s.cap;
  $("counter").textContent = `шаг ${pos} из ${steps.length - 1}`;
  const end = pos >= steps.length - 1;
  $("step").disabled = end; $("play").disabled = end;
  if (end) stop();
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } $("play").textContent = "Играть"; }
function step(){ if (pos < MODES[mode].steps.length - 1) { pos++; render(); } }
function setMode(m){ stop(); mode = m; pos = 0; document.querySelectorAll(".mode").forEach(b => b.classList.toggle("on", b.dataset.m === m)); render(); }
$("modes").innerHTML = KEYS.map(k => `<button class="mode ${k === mode ? "on" : ""}" data-m="${k}">${MODES[k].label}<small>${MODES[k].small}</small></button>`).join("");
document.querySelectorAll(".mode").forEach(b => b.onclick = () => setMode(b.dataset.m));
$("step").onclick = () => { stop(); step(); };
$("play").onclick = () => { if (timer) { stop(); return; } $("play").textContent = "Пауза"; timer = setInterval(step, 1800); };
$("reset").onclick = () => setMode(mode);
render();
</script>
</body>
</html>
