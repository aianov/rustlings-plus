[chapter]
title.en = "Tokio internals"
title.ru = "Как tokio устроен внутри"

[[chapter.visuals]]
file = "visuals/work_stealing.html"
title.ru = "Кража работы: локальные очереди, общая очередь, половина с головы"

[[chapter.visuals]]
file = "visuals/reactor_wake.html"
title.ru = "Реактор: сокет стал готов, задача снова в очереди"

[[exercises]]
name = "inr1"
style = "scratch"
hint.ru = [
  """Решение это цепочка «если нашёл, вернул»: сначала (изредка) общая очередь, потом своя, потом общая, потом соседи. Счётчик вызовов растёт при каждом входе, в том числе когда в итоге ничего не нашлось.""",
  """Жертву ищи по соседним очередям, исключив себя и пустые: выбирай максимум по паре «длина, обратный номер», тогда при равенстве победит меньший номер. Сколько брать, считай от длины очереди жертвы: половина с округлением вверх.""",
  """Забранные задачи сначала сними с головы очереди жертвы одним куском, потом первую верни, а остальные добавь в конец своей очереди, сохранив порядок. `VecDeque::drain(..n)` снимает ровно голову.""",
]
why.ru = """Модель держит три настоящих правила планировщика tokio. Очередь воркера нужна, чтобы почти всегда обходиться без общих блокировок. Раз в какое-то число вызовов воркер смотрит в общую очередь первой (в tokio это `global_queue_interval`), иначе задачи, поставленные снаружи рантайма, голодали бы за занятыми локальными. Воровство берёт половину с головы: старейшие задачи, и сразу много, чтобы не ходить к соседу за каждой. Тесты ловят три типичных упрощения: красть по одной, красть всё и не считать вызовы."""

[[exercises]]
name = "inr_q1"
kind = "question"
style = "bughunt"
question.ru = """Правила как в модели из inr1 (воровство берёт половину с округлением вверх с головы, жертва это самая длинная очередь). У воркера 0 пусто, общая очередь пуста, свой вызов не «глобальный». Очереди соседей:

```
воркер 1: A B C D E F          (6 задач)
воркер 2: G H I J K L M        (7 задач)
```

Воркер 0 просит задачу. Что получится?"""
options.ru = ["Работает G, в очереди воркера 0 останутся H I J, у воркера 2 останутся K L M", "Работает A, в очереди воркера 0 останутся B C, у воркера 1 останутся D E F", "Работает G, в очереди воркера 0 останутся H I J K L M, у воркера 2 пусто", "Работает M: красть удобнее с хвоста, это самая новая задача"]
answer = [0]
explain.ru = """Жертва это воркер 2: у него самая длинная очередь (7 против 6). Берут половину с округлением вверх, то есть 4 задачи, и с головы: G H I J. Первая (G) сразу выполняется, остальные три встают в очередь вора. У жертвы остаётся хвост K L M. С хвоста не крадут потому, что хвост это самое новое, оно ещё горячее в кеше хозяина, а голова самая старая и дольше всех ждёт."""
hint.ru = """Сначала найди жертву (у кого очередь длиннее), потом посчитай половину от её длины с округлением вверх."""

[[exercises]]
name = "inr2"
style = "fix"
hint.ru = [
  """Тест с двумя разными `Waker` показывает, кого будят. Посмотри, что сохраняется в `shared.waker` при втором опросе, и сравни с тем, какой `Waker` пришёл во втором `Context`.""",
  """Future имеет право оказаться опрошенным уже из другой задачи, поэтому каждый `poll` обязан оставить в общем месте тот `Waker`, который пришёл ему сейчас. Ничего не нужно копить: нужен один актуальный.""",
  """У `Waker` есть метод `will_wake`: он говорит, что два экземпляра разбудят одну и ту же задачу. Клонировать на каждый опрос недорого, но можно клонировать только когда реально сменился.""",
]
why.ru = """Контракт `poll` такой: после `Pending` будить будут тот `Waker`, который ты сохранил, и только он. Если future сохранил первый `Waker` и больше не обновляет, а опрашивает его теперь другая задача (его переложили в другую ветку `select!`, в `JoinSet`, в другой обработчик), пробуждение уходит старой задаче, а новая спит вечно. Поэтому `Waker` обновляется в каждом `poll`, а `will_wake` позволяет не клонировать лишний раз. В настоящих каналах и таймерах tokio ровно так и сделано."""

[[exercises]]
name = "inr3"
style = "todo"
hint.ru = [
  """Задача внутри executor'а умеет только `Output = ()`, а нужный результат надо куда-то положить. Общее место уже объявлено: `Slot`, и им делятся задача и handle.""",
  """`spawn` оборачивает чужое future в свой async-блок: дождаться, положить значение в слот, а если там уже оставил `Waker` ждущий, разбудить его. В `poll` у handle две ветки: результат есть (забрать и вернуть) и результата нет (оставить `Waker` из `cx` и вернуть `Pending`).""",
  """Ждущего будят один раз, когда результат положен, поэтому `Waker` из слота достают через `take()`. Следи, чтобы заём `RefCell` не жил дольше, чем нужно.""",
]
why.ru = """`JoinHandle` в tokio устроен так же: общее место для результата, куда пишет задача, и `Waker` ждущего рядом с ним. Задача при завершении кладёт значение и будит ждущего (если тот уже есть), а handle при `poll` либо забирает значение, либо оставляет `Waker` и спит. Поэтому выброшенный handle ничего не отменяет: задача и слот живут сами, результат просто останется непрочитанным. А лишних опросов нет: ждущий просыпается ровно один раз, а не крутится в `wake_by_ref`."""

[[exercises]]
name = "inr4"
style = "scratch"
hint.ru = [
  """Куча хранит только пары «срок, номер», а `Waker` лежат в таблице по номеру. Тогда отмена это удаление из таблицы, а в куче запись остаётся мёртвой: из кучи в середине удалять дорого. Зато все, кто смотрит в вершину кучи, обязаны проверять, жива ли запись.""",
  """`next_deadline` выбрасывает мёртвые записи с вершины, пока не найдёт живую. `advance` делает то же, пока срок вершины не больше `to`: живую будит и считает, мёртвую молча выбрасывает. Для `Sleep` вспомни прошлую задачу: повторный опрос обновляет `Waker`, а не заводит новый таймер.""",
  """`Sleep::poll` сначала сравнивает `now` и `deadline`, и только если срок не вышел, регистрирует или обновляет. Номер таймера хранится в самом `Sleep`, а в `Drop` по нему снимается запись из таблицы. Не держи заём `driver` через присваивание в `self.id`.""",
]
why.ru = """Это настоящий драйвер времени в миниатюре: куча (в tokio колесо) хранит сроки, у каждого срока свой `Waker`, а поток спит ровно до ближайшего. Отмена здесь ленивая: запись остаётся в куче и умирает при следующем взгляде на вершину, поэтому и `next_deadline`, и `advance` проверяют живость. Если этого не делать, выброшенный по `timeout` длинный `Sleep` заставлял бы драйвер просыпаться зря или будил бы чужой `Waker`. Порядок по паре «срок, номер» даёт честную очередь при равных сроках."""

[[exercises]]
name = "inr_q2"
kind = "question"
style = "bughunt"
question.ru = """Поток драйвера уснул на `park_timeout` до ближайшего таймера, он назначен на момент 100 мс. В 10 мс другая задача (на другом потоке) регистрирует `sleep(5 мс)`, то есть срок 15 мс. Регистрация только кладёт запись в кучу и ничего больше не делает. Когда проснётся эта задача?"""
options.ru = ["В момент 15 мс: драйвер каждый раз пересчитывает сон", "Около 100 мс: драйвер спит до старого срока и о новом не знает", "Никогда: запись с меньшим сроком кучу портит", "В момент 10 мс: регистрация сама будит ждущую задачу"]
answer = [1]
explain.ru = """Драйвер вычислил время сна один раз, перед тем как заснуть, и дальше спит, пока не истечёт оно или его не разбудят. Запись в кучу его не будит, поэтому срок 15 мс обнаружится только в 100 мс. Чтобы таймер сработал вовремя, регистрация, которая сдвигает ближайший срок раньше, обязана разбудить поток драйвера, чтобы он пересчитал сон. Tokio так и делает: при вставке раньше текущего срока драйвер будится."""
hint.ru = """Кто пересчитывает время сна, и когда он это делает?"""

[[exercises]]
name = "inr5"
style = "bughunt"
hint.ru = [
  """Тест «событие раньше первого опроса» воспроизводит зависание без гонок. Посмотри, при каком условии `notify` записывает, что устройство готово.""",
  """Готовность это состояние, а не одноразовый сигнал: устройство готово независимо от того, ждёт ли его кто-нибудь прямо сейчас. Ждущий потом заглянет в состояние и увидит.""",
  """Запись «готово» должна делаться безусловно, а `Waker` будят дополнительно, если он есть. Несколько событий подряд сливаются в одну готовность, это нормально.""",
]
why.ru = """Реактор tokio хранит готовность каждого источника (ScheduledIo) как биты, а не как «сообщение для ждущего». Событие от epoll или kqueue может прийти когда угодно, в том числе до того, как задача дошла до `readable().await`, и если записывать его только при наличии `Waker`, оно теряется, а задача уснёт навсегда. Поэтому готовность записывается всегда, а пробуждение это только способ сообщить тем, кто уже ждёт. Заодно ясно, почему события сливаются: готовность это состояние «можно читать», а не счётчик."""

[[exercises]]
name = "inr6"
style = "fix"
hint.ru = [
  """Оба обработчика проснулись от одного и того же события «сокет готов». Первый забрал всё, что пришло. Что выдаст `try_read` второму?""",
  """`readable()` это подсказка, что читать стоило бы попробовать, а не обещание, что данные будут. Ложная готовность бывает и из-за соседа, и из-за самой ОС. `try_read` честно возвращает `WouldBlock`, когда данных нет.""",
  """Ошибку `WouldBlock` не надо наружу: она означает «пока ничего, жди дальше». Остальные ошибки и `Ok` возвращаются как есть. Вспомни, как выглядит цикл из ожидания готовности и попытки.""",
]
why.ru = """Готовность в tokio это подсказка. Событие от ОС будит всех, кто ждёт на этом источнике, а данные достаются кому-то одному, и остальные получают `WouldBlock`; ложные пробуждения бывают и без соседей. Поэтому ручной ввод-вывод всегда цикл «жди готовности, пробуй, на `WouldBlock` снова жди». Неудачная попытка заодно сбрасывает запомненную готовность, и следующий `readable()` действительно ждёт нового события. Готовые `read`, `write_all` и так сделаны этим циклом, а вручную писать его приходится только в своих протоколах."""

[[exercises]]
name = "inr7"
style = "fix"
hint.ru = [
  """Рантайм получает управление обратно только тогда, когда какой-то `await` ответил `Pending`. Здесь все ответы готовы сразу, поэтому цикл ни разу не отдаёт поток. Нужно место, где задача сама скажет «я иду по кругу долго, пусть походят другие».""",
  """В `tokio::task` есть и безусловная уступка (`yield_now`, на каждой записи она дорога), и умная: она тратит кооперативный бюджет задачи и возвращает `Pending` только тогда, когда бюджет кончился.""",
  """Бюджет у задачи около сотни с небольшим единиц на «заход» рантайма. Функция, которая его тратит без другого дела, называется `consume_budget`. Вызывай её внутри цикла.""",
]
why.ru = """Планировщик не умеет прерывать задачу, он может только дождаться её `Pending`. Поэтому цикл по готовым future душит соседей, хотя формально асинхронен. Встроенные примитивы tokio (каналы, сокеты, таймеры) тратят кооперативный бюджет сами: после сотни с небольшим готовых операций подряд очередная возвращает `Pending`, даже если могла бы ответить сразу. Свой цикл на `ready` и на CPU такого бюджета не имеет, и `consume_budget` добавляет ему этот учёт. `yield_now` на каждой итерации работал бы, но дороже: смена задач каждый раз."""

[[exercises]]
name = "inr_q3"
kind = "question"
style = "bughunt"
question.ru = """Все циклы выполняются в одной задаче на рантайме `current_thread`, рядом живёт задача-сердцебиение. Какие из циклов могут не отдать поток сердцебиению вообще, пока не закончатся? Выбери все.

```rust
// A: в канале уже лежат 10 000 сообщений
while let Some(x) = rx.recv().await { total += x; }
// B: ready из std::future
for x in 0..100_000u64 { total += ready(x).await; }
// C: функция без единого await
async fn crunch(data: &[u64]) -> u64 { data.iter().map(|x| x * x).sum() }
// D: таймер с периодом 1 мс
for _ in 0..100 { interval.tick().await; }
```"""
options.ru = ["A", "B", "C", "D"]
answer = [1, 2]
explain.ru = """Рантайм получает поток обратно только на `Pending`. В B `ready` отвечает сразу, `Pending` нет никогда, цикл не отдаёт поток. В C вообще нет точки ожидания, асинхронность тут формальная. В A канал tokio сам тратит кооперативный бюджет: после сотни с небольшим готовых `recv` подряд очередной возвращает `Pending`, даже если сообщение лежит, и сердцебиение успевает сработать. В D каждый тик это настоящее ожидание."""
hint.ru = """Где в цикле возникает `Pending`? И кто, кроме самого ожидания, может его добавить?"""

[[exercises]]
name = "inr8"
style = "fix"
hint.ru = [
  """У построителя рантайма есть отдельная настройка для блокирующих потоков, не путай её с числом рабочих потоков: рабочие гоняют асинхронные задачи, блокирующие живут в своём пуле, который растёт по требованию.""",
  """Метод называется `max_blocking_threads`. Его значение это потолок пула: задания сверх него встают в очередь пула и ждут свободный поток.""",
]
why.ru = """У рантайма два разных пула потоков. Рабочие потоки (`worker_threads`) гоняют асинхронные задачи и должны почти не блокироваться. Блокирующий пул принимает `spawn_blocking`, растёт по мере надобности и по умолчанию может дойти до пятисот потоков, поэтому на тяжёлой работе (картинки, сжатие, файловая система) его потолок надо ставить самому, исходя из памяти и ядер. Лишние задания не теряются: они ждут в очереди пула. Так и асинхронная часть остаётся живой, пока блокирующая работает на полную."""

[[exercises]]
name = "inr_q4"
kind = "question"
style = "bughunt"
question.ru = """Рантайм: два рабочих потока и `max_blocking_threads(2)`. Одновременно запущены пять `spawn_blocking`, каждый спит 100 мс (`std::thread::sleep`), и одна асинхронная задача с `tokio::time::sleep(150 мс)`. Когда закончатся все пять работ и когда проснётся асинхронная задача?"""
options.ru = ["Работы к 300 мс, задача в 150 мс", "Работы к 500 мс, задача в 150 мс", "Работы к 300 мс, задача тоже не раньше 300 мс: рабочие потоки заняты", "Работы к 100 мс, задача в 150 мс"]
answer = [0]
explain.ru = """Блокирующий пул отдельный: два его потока обрабатывают пять работ парами и одной (2 + 2 + 1), то есть три «слоя» по 100 мс, итого 300 мс. Рабочие потоки в этом не участвуют и свободны, поэтому таймер на 150 мс срабатывает вовремя. Если бы работы шли прямо в асинхронных задачах с `std::thread::sleep`, они занимали бы рабочие потоки и таймеру пришлось бы ждать."""
hint.ru = """Какие потоки заняты блокирующими работами и какие тогда гоняют асинхронный таймер?"""

[[exercises]]
name = "inr9"
style = "scratch"
hint.ru = [
  """Все три числа есть у `Handle::metrics()`: `num_workers`, `num_alive_tasks` и `global_queue_depth`. Но посмотри внимательно, что именно считает последняя: не каждая стоящая в очереди задача, а только лежащие в общей.""",
  """Задача, которую только что породил сценарий, ещё не получила ни одного опроса, поэтому сразу после сценария измерять нельзя: честный хвост ещё жив. Утечка это то, что осталось жить после отсрочки.""",
  """Базовую линию бери до сценария (в рантайме могут быть чужие задачи), потом дай отсрочку (под замороженным временем она не стоит реального времени) и сравни. Вычитание делай без паники при отрицательной разнице.""",
]
why.ru = """Метрики рантайма это глаза сервиса: `num_alive_tasks` растёт при утечках, `global_queue_depth` показывает, что воркеры не успевают разбирать то, что приходит снаружи, а число воркеров нужно, чтобы читать остальные цифры. Две оговорки, которые и проверяет задача: «очередь пуста» не значит «задач нет» (спящие живы), и «задача жива» не значит «задача утекла» (хвост просто не успел закончиться). Поэтому детектор утечки меряет после отсрочки и относительно базовой линии, а не абсолютное число. В главе про отладку этим же приёмом проверяется, что сеанс не оставляет сирот."""

[[exercises]]
name = "inr_mini_runtime"
kind = "project"
style = "scratch"
quiz = true
locked = ["crates/acceptance/tests/acceptance.rs"]
hint.ru = [
  """Начни с общего каркаса: очередь номеров готовых задач за `Mutex`, `Waker` на основе `std::task::Wake`, который кладёт номер в очередь и будит поток (`Thread::unpark`), и цикл в `block_on`: достать номер, опросить, повторять, пока очередь не пуста. Главное future опрашивай по особому номеру, оно не `'static` и в общий список задач не кладётся.""",
  """Когда очередь пуста, поток не должен крутиться: узнай ближайший живой срок. У условных часов переведи их на этот срок и разбуди просроченных, у настоящих усни на `park_timeout` до срока (без сроков `park`). Сроки держи в куче пар «срок, номер» плюс таблицей живых `Waker`, как в inr4.""",
  """`JoinHandle` это слот с результатом и `Waker` ждущего, как в inr3. Текущий рантайм для свободных `spawn`, `sleep` и `now` хранится в `thread_local!` на время `block_on` и сбрасывается охранником при выходе. `yield_now` на первом опросе будит свой же `Waker` и возвращает `Pending`.""",
]
why.ru = """Мини-рантайм это те же четыре детали, что и в настоящем: очередь готовых задач с `Waker`, который их туда ставит из любого потока, драйвер времени с ленивой отменой, общий слот для результата и парковка потока, когда нечего делать. Условные часы прыгают к ближайшему сроку только когда очередь пуста, поэтому тесты точны до миллисекунды. Проверки на выброшенный `Sleep`, чужой поток и десять тысяч задач ловят три типичные ошибки: утечку записей в драйвере, потерю пробуждения и квадратичную очередь."""
