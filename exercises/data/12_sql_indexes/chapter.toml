[[exercises]]
name = "pgidx1"
style = "todo"
requires = ["postgres"]
hint.ru = ["""План пришёл строкой. Разбери её через `serde_json::from_str::<Value>`; индексация `v[0]["Plan"]["Node Type"]` не паникует, если ключа нет, а даёт `Value::Null`.""", """У `Value` есть `as_str()` и `as_f64()`, оба возвращают `Option`. Для отсутствующей таблицы подставь "-" через `unwrap_or`."""]
why.ru = """Планы в JSON это обычное дерево, и всё, что ты захочешь автоматизировать (проверку в тесте, сравнение до и после индекса), начинается с обхода такого дерева. Три поля, которые читаются первыми: "Node Type" (как база берёт данные), "Relation Name" (откуда) и "Plan Rows" (оценка планировщика). Заметь индексацию `Value` по ключу: она возвращает `Null` вместо паники, поэтому разбор получается без цепочек `match`, но и опечатка в ключе молча даёт `Null`, поэтому проверяй код на нескольких планах."""

[[exercises]]
name = "pgidx2"
style = "todo"
requires = ["postgres"]
hint.ru = """Индекс нужен по столбцу, который стоит в условии. Синтаксис: `CREATE INDEX имя ON таблица (столбец)`."""
why.ru = """Индекс по столбцу из WHERE превращает перебор всей таблицы в спуск по дереву, поэтому сто тысяч строк превращаются в десяток обращений. Условие «есть узел с индексом» в плане важнее конкретного типа: для пятнадцати строк планировщик часто берёт `Bitmap Index Scan`, а не `Index Scan`, и оба хороши. Статистику тест обновляет сам (`ANALYZE`), в реальной базе её обновляет autovacuum, а после больших загрузок это надо делать руками (следующие задачи)."""

[[exercises]]
name = "pgidx3"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Дерево плана обходят рекурсией: проверь узел, потом то же самое для каждого элемента его "Plans". Оценка и факт даны на одно выполнение узла, сравнивать их можно напрямую.""", """Отношение берут в обе стороны: `оценка / факт >= 10` или `факт / оценка >= 10`. Нули заменяй единицами (`.max(1.0)`), иначе деление на ноль. Буферы корня уже содержат буферы всех его потомков, суммировать узлы не надо."""]
why.ru = """Расхождение «ожидал 250, получил 5000» ничем не выдаёт себя в самом запросе, но портит всё, что выше по дереву: оценка в 250 строк делает привлекательным вложенный цикл с индексом, а на 5000 строк он проигрывает хеш-соединению. Источники ошибки: устаревшая статистика, коррелирующие столбцы (планировщик по умолчанию считает их независимыми), выражения над столбцами. Узлы нужно сравнивать вдоль всего дерева, потому что ошибка прячется в листьях, а сверху видно только следствие. Счётчики буферов в корне уже включают потомков, это удобная «цена» запроса в страницах, не зависящая от скорости диска."""

[[exercises]]
name = "pgidx_q7"
kind = "question"
question.ru = """В плане Nested Loop внешний узел оценён в 1 строку (`Plan Rows: 1`), а при запуске вернул 50000 (`Actual Rows: 50000`). Чем это опасно?"""
options.ru = ["Ничем: оценка нужна только для красоты", "Запрос вернёт неверный результат", "Планировщик выбрал вложенный цикл в расчёте на один индексный поиск, а их выполнится 50000: хеш-соединение было бы быстрее", "Postgres перестроит план на лету, пока запрос выполняется"]
answer = [2]
explain.ru = """Оценка числа строк определяет выбор алгоритма: при одной строке вложенный цикл с индексным поиском идеален, при 50000 строк он превращается в 50000 поисков. PostgreSQL не перестраивает план во время выполнения (в отличие от некоторых других баз). Результат запроса при этом верный, просто медленный. Лечат ошибку оценки свежей статистикой (`ANALYZE`), расширенной статистикой для зависимых столбцов или переписыванием запроса."""
hint.ru = """Когда планировщик выбирает вложенный цикл, на какое число повторов он рассчитывает?"""

[[exercises]]
name = "pgidx4"
style = "bughunt"
requires = ["postgres"]
hint.ru = ["""VACUUM убирает мёртвые версии строк и обновляет карту видимости. А где планировщик берёт сведения о том, сколько в таблице каких значений?""", """Статистику распределения значений собирает отдельная команда, и она не VACUUM. Autovacuum запускает её сам, но не мгновенно: сразу после огромной загрузки таблица ещё «пустая» в его глазах."""]
why.ru = """Планировщик строит планы по статистике (`pg_statistic`), а не по самим данным. Пока таблица была пустой, статистика говорила «пусто, значение редкое», и после загрузки плана хватало на сотни строк, а не на сто тысяч. `VACUUM` и `ANALYZE` путают постоянно: первый чистит мёртвые версии и ведёт карту видимости, второй собирает статистику для планировщика (`VACUUM ANALYZE` делает обе работы). Правило после массовой загрузки или удаления: сразу `ANALYZE` таблицы, не дожидаясь autovacuum."""

[[exercises]]
name = "pgidx5"
style = "bughunt"
requires = ["postgres"]
hint.ru = ["""Для каждого индекса спроси: сколько процентов таблицы отбирает условие, на котором он построен? Индекс выгоден, когда ответ «доли процента».""", """Оставь индекс по автору (около 20 строк из 100000), а индекс по `published` убери: условие `published` отбирает почти всю таблицу, и база для него всё равно читает таблицу подряд."""]
why.ru = """Индекс помогает, когда условие отбирает малую долю строк (десятые доли процента, редко единицы). Чем больше доля, тем чаще планировщик справедливо читает таблицу подряд: чтение страниц по порядку дёшево, а десятки тысяч прыжков по индексу дорого. Булев столбец почти всегда в этой категории: у него два значения. Лишний индекс ничего не ускоряет и платит за себя на каждом INSERT и UPDATE. Если нужны именно редкие значения («неопубликованные», 1%), индекс делают частичным (`WHERE NOT published`), об этом позже."""

[[exercises]]
name = "pgidx_q1"
kind = "question"
question.ru = """В таблице заказов столбец `is_active`, ложь у 3% строк, истина у 97%. Какой из запросов получит выгоду от индекса по этому столбцу?"""
options.ru = ["оба одинаково", "`WHERE is_active` (отбирает 97%)", "`WHERE NOT is_active` (отбирает 3%)", "ни один: индекс по булеву столбцу не используется никогда"]
answer = [2]
explain.ru = """Выгоду даёт запрос, который отбирает малую долю строк. Индекс по `is_active` пригодится для `NOT is_active` (3%), но почти бесполезен для `is_active` (97%): читать почти всю таблицу выгоднее подряд. Поэтому говорят «индекс по булеву столбцу не нужен», хотя точнее: не нужен для частого значения. Для редкого значения делают частичный индекс `WHERE NOT is_active`: он небольшой и точно соответствует запросу."""
hint.ru = """Какую долю таблицы отбирает каждое условие?"""

[[exercises]]
name = "pgidx6"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Индекс по одному `author_id` находит нужные строки, но порядок среди них не гарантирует. Что нужно добавить, чтобы порядок стал частью индекса?""", """В составном индексе сначала столбцы с равенством (`author_id`), потом столбец сортировки (`created_at`). Направление при сортировке одним столбцом не критично: Postgres умеет читать индекс и в обратную сторону."""]
why.ru = """В составном B-tree строки лежат отсортированными по первому столбцу, внутри равных по второму и так далее. Поэтому для `WHERE author_id = ? ORDER BY created_at DESC LIMIT 20` база спускается к первой записи автора и читает ровно двадцать подряд, не трогая остальные двадцать пять тысяч. Столбцы с равенством идут первыми, столбец сортировки последним: поменять порядок значит потерять оба свойства (задача дальше). Сортировка при `LIMIT` не просто медленнее, она ещё и непредсказуема: стоимость растёт вместе с числом постов автора."""

[[exercises]]
name = "pgidx7"
style = "fix"
requires = ["postgres"]
hint.ru = ["""Индекс отсортирован по первому столбцу. Чтобы им можно было воспользоваться для поиска, условие должно ограничивать именно его (или его префикс).""", """Поменяй столбцы местами: сначала тот, что в `WHERE` с равенством, потом тот, по которому сортируем. Старый вариант в скрипте надо не добавлять рядом, а заменить."""]
why.ru = """Составной индекс работает слева направо, как телефонная книга, отсортированная по фамилии, потом по имени: найти всех Ивановых легко, найти всех Иванов по книге нельзя. Индекс `(created_at, author_id)` отсортирован по времени, и посты одного автора рассыпаны по нему везде, так что база не может использовать его для поиска по автору. Правило выбора порядка: сначала столбцы с равенством, потом диапазон или сортировка. Второй индекс «на всякий случай» не лечение: он платит за себя на каждой вставке."""

[[exercises]]
name = "pgidx_q2"
kind = "question"
question.ru = """Есть индекс по `(a, b, c)`. Для какого запроса он даст быстрый поиск и порядок (без сортировки)?"""
options.ru = ["`WHERE b = 2 ORDER BY c`", "`WHERE b = 2 AND c = 3`", "`WHERE c = 3`", "`WHERE a = 1 AND b = 2 ORDER BY c`"]
answer = [3]
explain.ru = """Составной индекс отсортирован по `a`, внутри равных `a` по `b`, внутри равных `b` по `c`. Быстрый поиск возможен по префиксу столбцов слева: `a`, `a b`, `a b c`. Запрос с `a = 1 AND b = 2` находит нужный кусок индекса, и внутри него строки уже лежат по `c`, поэтому `ORDER BY c` не требует сортировки. Остальные варианты не имеют условия на первый столбец, и база не может спуститься к нужному месту (в лучшем случае прочитает индекс целиком)."""
hint.ru = """С какого столбца индекс отсортирован в первую очередь?"""

[[exercises]]
name = "pgidx8"
style = "fix"
requires = ["postgres"]
hint.ru = ["""Индекс хранит значения столбца `email` как есть. Условие в запросе сравнивает не столбец, а результат функции от него.""", """Индекс можно построить по выражению: в скобках после имени таблицы пишется то же выражение, которое стоит в `WHERE`. Старый индекс по `email` замени, а не дополняй."""]
why.ru = """Индекс это отсортированная копия значений, и поиск работает, только если запрос сравнивает ровно те значения, что лежат в индексе. Функция над столбцом (`lower`, `date_trunc`, приведение типа, арифметика) создаёт новое значение, которого в индексе нет, и база не может по нему искать. Лекарство или индекс по тому же выражению, или переписанный запрос (`created_at::date = ...` превращают в диапазон, это следующая задача). Выражение в запросе и в индексе должно совпадать буква в букву: `lower(email)` и `lower(trim(email))` разные выражения."""

[[exercises]]
name = "pgidx9"
style = "fix"
requires = ["postgres"]
hint.ru = ["""Выражение `created_at::date` строит новое значение для каждой строки, а индекс хранит исходные `created_at`. Нужно условие прямо над столбцом.""", """День это полуинтервал: от начала дня включительно до начала следующего исключительно. `created_at >= начало AND created_at < начало_следующего`. Сравнение timestamptz с датой само переводит дату в полночь."""]
why.ru = """Сравнивать надо сам столбец, а преобразование переносить на другую сторону: вместо «у каждой строки возьми дату» пиши «время попадает в диапазон». Полуинтервал `[начало, следующее начало)` не теряет и не дублирует границу, в отличие от `BETWEEN`, который включает оба конца и считает полуночную запись в двух днях. Тест не зря вставляет посты ровно в полночь: на них ломаются обе ошибки. Заметь и часовой пояс: приведение к дате зависит от настроек сессии, диапазон с `current_date` ведёт себя так же, но тот же результат в другом поясе надо проверять отдельно."""

[[exercises]]
name = "pgidx_q3"
kind = "question"
question.ru = """Есть обычный индекс по `created_at` (timestamptz). Какое из условий не сможет им воспользоваться для поиска?"""
options.ru = ["`created_at < $1`", "`date_trunc('day', created_at) = current_date`", "`created_at >= now() - interval '1 day'`", "`created_at BETWEEN $1 AND $2`"]
answer = [1]
explain.ru = """Функция над столбцом (`date_trunc`) создаёт новое значение для каждой строки, которого в индексе нет, поэтому поиск по нему невозможен. Остальные условия сравнивают сам столбец с константой или параметром, это диапазоны, и по ним можно спуститься в индекс. Исправляют такое условие переписыванием в диапазон (`created_at >= current_date AND created_at < current_date + 1`) или индексом по тому же выражению."""
hint.ru = """Сравнивается ли здесь столбец с константой или значение функции от столбца?"""

[[exercises]]
name = "pgidx10"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Обычный индекс хранит все строки таблицы. Postgres умеет строить индекс только по тем строкам, которые подходят под условие.""", """В конце команды `CREATE INDEX` добавь `WHERE условие`. Условие должно совпадать с условием запроса (`deleted_at IS NULL`), иначе планировщик не докажет, что индекс подходит. Столбцы остаются такими же, как в задаче про ленту автора."""]
why.ru = """Частичный индекс экономит место и время записи: удалённые, архивные и завершённые строки в него не попадают. Применяется он, только если планировщик может доказать, что условие запроса влечёт условие индекса: `deleted_at IS NULL` в запросе подходит к такому же в индексе. Если условие в запросе исчезнет (кто-то решит показывать и удалённые), индекс перестанет подходить без всякого предупреждения. Поэтому частичный индекс всегда сопровождают проверкой плана. Он же решает вопрос «а что с редким значением»: индекс по булеву флагу с `WHERE NOT published` содержит те самые 1%, которые мы ищем."""

[[exercises]]
name = "pgidx11"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Index Only Scan возможен, если в индексе есть все столбцы, которые нужны запросу, не только те, по которым ищем.""", """Столбцы, по которым не ищут, но которые нужны в ответе, добавляют через `INCLUDE (...)`. Второе условие: страницы таблицы должны быть помечены «видны всем» в карте видимости. Эту карту ведёт VACUUM, а свежезагруженная таблица её не имеет."""]
why.ru = """Index Only Scan отвечает на запрос, не читая таблицу, но проверка «эта версия строки видна нам?» хранится в таблице, а не в индексе. Чтобы не ходить за каждой строкой, Postgres держит карту видимости: страница, помеченная «все строки видны всем», не требует проверки. Карту заполняет VACUUM, поэтому после массовой загрузки Index Only Scan честно работает как обычный Index Scan (`Heap Fetches` велик), пока таблицу не почистили. `INCLUDE` кладёт в индекс столбцы без участия в упорядочивании: ключ остаётся коротким, а данные для ответа уже рядом. Платишь размером индекса и скоростью записи, поэтому покрывающие индексы делают для самых горячих запросов."""

[[exercises]]
name = "pgidx_q4"
kind = "question"
question.ru = """В плане запроса `Index Only Scan using follows_idx ... Heap Fetches: 48213`, а в ответе 50000 строк. Что это означает?"""
options.ru = ["Запрос прочитал только индекс, как и положено", "Индекс повреждён и его надо пересоздать", "Почти за каждой строкой база всё равно сходила в таблицу: карта видимости почти пуста, таблицу давно не чистили VACUUM", "Так выглядит нормальная работа Index Only Scan"]
answer = [2]
explain.ru = """Index Only Scan обещает не читать таблицу, но видимость версий строки хранится в таблице. Чтобы пропустить проверку, страница должна быть помечена в карте видимости как «все видят всё», а эти пометки ставит VACUUM. Большое `Heap Fetches` говорит, что пометок нет: таблицу давно не чистили или она часто обновляется. Лекарство: `VACUUM` (и настроить autovacuum агрессивнее для этой таблицы), а не пересоздание индекса."""
hint.ru = """Кто хранит отметку «эта версия строки видна всем»: индекс или таблица?"""

[[exercises]]
name = "pgidx12"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Чтобы сортировка исчезла, индекс должен отдавать строки в том же порядке, который просит `ORDER BY`. Посмотри, сколько ключей в `ORDER BY`.""", """Индекс должен перечислять оба ключа в том же порядке: сначала время, потом id. Направление индекса можно выбрать любое, если оно одинаково для обоих (Postgres читает индекс и вперёд, и назад)."""]
why.ru = """Планировщик убирает сортировку, только если порядок индекса целиком покрывает `ORDER BY`. Индекс по одному `created_at` оставляет сортировку по второму ключу: в PostgreSQL 13 и новее она называется Incremental Sort и дёшева (сортирует только группы с равным временем), но она есть, а её цена растёт с числом одинаковых значений. Практический вывод для ленты: порядок должен быть полным и однозначным (`id` как последний ключ), и индекс повторяет его целиком. Тогда то же самое выражение превращается в основу для keyset-пагинации."""

[[exercises]]
name = "pgidx13"
style = "scratch"
requires = ["postgres"]
hint.ru = ["""Курсор это пара значений последней показанной строки. Одного времени мало: у разных постов оно может совпасть.""", """Условие «строго позже курсора» в порядке по убыванию записывается сравнением кортежей: `(created_at, id) < ($1, $2)`. Индекс должен перечислять эти же столбцы в том же порядке, что и `ORDER BY`.""", """В итоге `WHERE` содержит одно сравнение кортежей, `ORDER BY created_at DESC, id DESC`, `LIMIT 20`, а индекс создаётся по `(created_at DESC, id DESC)`. Проверь в плане, что условие стало `Index Cond`, а не `Filter`."""]
why.ru = """Keyset-пагинация задаёт условие через значения, а не через позицию: «всё, что идёт после этого поста». Поэтому её цена не растёт с номером страницы, а удаление или добавление постов между показами не сдвигает страницы (в отличие от OFFSET). Пара `(created_at, id)` нужна, потому что одного времени мало: два поста с одинаковым временем разделил бы курсор. Сравнение кортежей Postgres превращает в одно условие индекса, а вот эквивалентное `created_at < $1 OR (created_at = $1 AND id < $2)` часто оказывается фильтром, и база читает все строки до курсора. Цена keyset: нельзя перейти на страницу номер 57, только на следующую или предыдущую."""

[[exercises]]
name = "pgidx14"
style = "fix"
requires = ["postgres"]
hint.ru = ["""Допустим, на границе страницы лежит пост со временем T, а у следующего поста время тоже T. Что делает условие `created_at < T` с этим следующим постом?""", """Курсор должен различать посты с одинаковым временем: добавь в него `id` и сравнивай пары значений (`(created_at, id) < ($1, $2)`), как в `ORDER BY`."""]
why.ru = """Курсор по значению, которое не уникально, неминуемо теряет строки: все посты с тем же временем, что у последнего на странице, оказываются «не меньше курсора» и выпадают. Исправление это добавить в курсор уникальный хвост (`id`) и сделать порядок полным. Баг не воспроизводится на живых данных годами (пачки с одним временем редки) и выстреливает при массовом импорте. Поэтому тест нарочно берёт группы по четыре."""

[[exercises]]
name = "pgidx_q5"
kind = "question"
question.ru = """Пользователь листает ленту по курсору `(created_at, id)`. Пока он смотрел вторую страницу, автор удалил один из постов первой. Что увидит пользователь на третьей странице?"""
options.ru = ["Страницы сдвинутся, и один пост на стыке будет пропущен", "Запрос завершится ошибкой, потому что курсор указывает на несуществующую строку", "Ничего необычного: курсор опирается на значения, а не на номера позиций, пропусков и повторов нет", "Один пост покажется дважды"]
answer = [2]
explain.ru = """Курсор это пара значений последней увиденной строки: «покажи всё, что идёт после неё». Ему не нужно, чтобы сама строка ещё существовала, и позиции других строк его не интересуют. Поэтому удаления и вставки до курсора ничего не ломают. OFFSET устроен наоборот: «пропусти 40 строк», и если одна строка слева исчезла, следующая страница начинается на одну строку раньше или позже, с пропуском или повтором."""
hint.ru = """Кто хранит позицию: числа или значения строки?"""

[[exercises]]
name = "pgidx15"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Соединение берёт для каждой подписки (12 штук) все посты её автора. Как базе быстро найти посты по `author_id`?""", """Нужен обычный индекс по столбцу, по которому соединяем: `posts (author_id)`. Внешний ключ индекса не создаёт."""]
why.ru = """Для соединения планировщик выбирает один из трёх алгоритмов. Nested Loop берёт каждую строку внешней стороны и ищет пару во внутренней, поэтому он выигрывает, когда внешних строк мало, а внутри есть индекс по ключу соединения. Hash Join строит хеш-таблицу одной стороны и проходит другую: подходит, когда обе стороны велики и индекса нет. Merge Join сливает две отсортированные стороны и хорош, когда порядок уже есть. Индекс по внешнему ключу нужен почти всегда: без него и соединение, и каскадное удаление родителя читают всю дочернюю таблицу."""

[[exercises]]
name = "pgidx_q6"
kind = "question"
question.ru = """Внешняя сторона соединения даёт 10 строк, внутренняя таблица содержит 20 миллионов строк, по ключу соединения есть индекс. Какой алгоритм соединения выберет планировщик?"""
options.ru = ["Merge Join: отсортирует обе стороны", "Hash Join: он строит хеш-таблицу из 20 миллионов строк", "Nested Loop: десять индексных поисков во внутренней таблице", "Любой, разницы по стоимости нет"]
answer = [2]
explain.ru = """Nested Loop платит один индексный поиск за каждую строку внешней стороны: десять поисков почти ничего не стоят. Hash Join прочитал бы всю внутреннюю таблицу (20 миллионов строк) ради десяти нужных, а Merge Join тоже потребовал бы отсортировать её или читать по порядку. Если внешних строк станет миллион, картина перевернётся: миллион индексных поисков дороже одного прохода с хеш-таблицей."""
hint.ru = """Сколько раз придётся искать во внутренней таблице?"""

[[exercises]]
name = "pgidx16"
style = "scratch"
requires = ["postgres"]
hint.ru = """План это дерево: узел, а у него необязательный массив "Plans" с такими же узлами. Проверь текущий узел, потом вызови эту же функцию для каждого ребёнка и склей результаты."""
why.ru = """Тест вида «в плане нет Seq Scan по таблице» превращает «ускорили запрос» из впечатления в проверяемый факт и ловит регрессию в тот день, когда кто-то переименовал индекс или поменял порядок столбцов. Обход должен быть по всему дереву: в реальных запросах корень почти всегда Limit, Aggregate или Sort. Проверка узлов вместо времени выполнения важна по двум причинам: время на нагруженной машине шумит, а план на тестовых данных, как правило, такой же, как в проде, если статистика свежая (поэтому `ANALYZE` перед проверкой обязателен)."""

[[exercises]]
name = "pgidx_slow_feed"
style = "scratch"
requires = ["postgres"]
quiz = true
hint.ru = ["""Начни с планов: для каждого запроса возьми `EXPLAIN` и посмотри, где Seq Scan и где Sort. Для профиля нужен индекс, у которого порядок совпадает с `ORDER BY`, для подписчиков тоже, а для входа индекс по выражению.""", """Профиль: индекс `(author_id, created_at DESC, id DESC)`, при желании частичный по `deleted_at IS NULL`. Подписчики: `(followee_id, created_at DESC, follower_id DESC)`. Вход: индекс по `lower(username)`. Страницы листай курсором из пары (время, id), `OFFSET` убери.""", """Следующая страница: `WHERE ... AND (created_at, id) < ($2, $3) ORDER BY created_at DESC, id DESC LIMIT 20`. Для подписчиков вместо `id` пара из `created_at` и `follower_id`. Перед началом страницы порядок должен быть полным: добавь `id DESC` к `ORDER BY` первой страницы."""]
why.ru = """Три жалобы это три разные причины, и ни одна не лечится одной общей мерой. Профиль: сортировка при LIMIT (индекс по порядку запроса) и OFFSET (курсор вместо номера страницы). Подписчики: тот же приём плюс соединение, которое после этого идёт вложенным циклом по первичному ключу users. Вход: функция над столбцом, лечится индексом по выражению. Тест проверяет узлы плана, а не время, и смотрит на глубокую страницу отдельно: на первой странице OFFSET и курсор неотличимы, различие видно, только когда за курсором много строк. Индексов три, а не десять: каждый стоит записи."""

