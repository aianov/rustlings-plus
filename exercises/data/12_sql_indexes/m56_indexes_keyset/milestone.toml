test_command = ["cargo", "make", "check"]
requires = ["postgres", "nats"]
hint.ru = [
"""Keyset-страница помнит последнюю строку, а не номер страницы: `WHERE author = $1 AND (at, id) < ($2, $3)
ORDER BY at DESC, id DESC LIMIT $4`. Первая страница идёт с курсором (максимум, максимум).""",
"""Индекс под такой запрос повторяет его: `(author, at DESC, id DESC) WHERE NOT deleted`. Условие частичного индекса
должно буквально совпадать с условием запроса.""",
"""Проверка плана: налей тысячи строк, сделай `ANALYZE`, затем `EXPLAIN (FORMAT JSON) <запрос>` с параметрами и ищи в
JSON `Seq Scan`. На пустых таблицах планировщик честно выбирает Seq Scan: так дешевле.""",
]
story.ru = """Ключевые запросы соцсети опираются на индексы, а посты автора и подписчики листаются по курсору
сколько угодно далеко: каждая следующая страница стоит столько же, сколько первая."""
