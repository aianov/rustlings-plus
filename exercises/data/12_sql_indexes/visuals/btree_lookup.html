<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B-tree: спуск по дереву против полного перебора</title>
<style>
:root { --bg:#f6f7f9; --panel:#fff; --text:#1d2330; --muted:#6a7385; --line:#d9dde5; --accent:#2563eb; --g1:#e8f6ec; --g2:#fff4cc; --g3:#fde8e8; --g4:#e6e9fb; --bad:#b42318; }
@media (prefers-color-scheme: dark) { :root { --bg:#14171d; --panel:#1c212b; --text:#e6e9f0; --muted:#98a2b5; --line:#323a49; --accent:#6ea0ff; --g1:#1c3326; --g2:#4a3f12; --g3:#3b2024; --g4:#262c52; --bad:#ff8a80; } }
* { box-sizing:border-box; }
body { margin:0; padding:20px; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
main { max-width:960px; margin:0 auto; }
h1 { font-size:20px; margin:0 0 4px; } p.lead { color:var(--muted); margin:0 0 16px; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:14px; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; } @media (max-width:760px) { .grid { grid-template-columns:1fr; } }
h3 { margin:0 0 8px; font-size:14px; color:var(--muted); }
table { border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums; }
th,td { text-align:left; padding:5px 8px; border-bottom:1px solid var(--line); font-size:14px; }
th { color:var(--muted); font-weight:600; font-size:13px; }
tr.a1 td { background:var(--g1); } tr.a2 td { background:var(--g3); }
pre { margin:0; font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace; white-space:pre-wrap; }
.note { min-height:3.6em; } .note b { color:var(--accent); } .note b.bad { color:var(--bad); }
.controls { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
button,select { font:inherit; padding:6px 14px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--text); cursor:pointer; }
button.primary { background:var(--accent); border-color:var(--accent); color:#fff; } button:disabled { opacity:.45; cursor:default; }
.counter { color:var(--muted); margin-left:auto; }
</style>
</head>
<body>
<main>
  <h1>Как индекс находит строку</h1>
  <p class="lead">Таблица на 27 строк. Сравни, сколько страниц читает база с индексом и без. Числа условные, но порядок величин честный.</p>
  <div class="card controls">
    <select id="mode"><option value="scan">Без индекса: Seq Scan</option><option value="btree">С индексом: спуск по B-tree</option></select>
    <button id="step" class="primary">Шаг</button><button id="play">Играть</button><button id="reset">Сброс</button>
    <span class="counter" id="counter"></span>
  </div>
  <div class="card grid">
    <div><h3>что происходит</h3><pre id="log"></pre></div>
    <div><h3 id="thead">состояние</h3><table id="tbl"></table></div>
  </div>
  <div class="card note" id="note"></div>
</main>
<script>
(function () {
  var SC = {"scan": {"name": "Без индекса: Seq Scan", "table": "таблица posts, поиск author_id = 19", "head": ["страница таблицы", "что прочитано"], "start": {"note": "Нужно найти посты автора 19. Данные в таблице лежат в порядке вставки, подсказок нет.", "rows": [["страница 1 (ids 1..9)", "не прочитана"], ["страница 2 (ids 10..18)", "не прочитана"], ["страница 3 (ids 19..27)", "не прочитана"]]}, "steps": [{"ev": "читаем страницу 1", "note": "Девять строк проверены по одной, ни одной подходящей. Остановиться нельзя: автор мог писать и дальше.", "rows": [["страница 1 (ids 1..9)", "прочитана, 0 совпадений"], ["страница 2 (ids 10..18)", "не прочитана"], ["страница 3 (ids 19..27)", "не прочитана"]], "hl": [0], "bad": []}, {"ev": "читаем страницу 2", "note": "Ещё девять строк. Ничего.", "rows": [["страница 1 (ids 1..9)", "прочитана, 0 совпадений"], ["страница 2 (ids 10..18)", "прочитана, 0 совпадений"], ["страница 3 (ids 19..27)", "не прочитана"]], "hl": [0, 1], "bad": []}, {"ev": "читаем страницу 3", "note": "Нашлось, но мы <b>прочитали все три страницы</b>. На таблице из миллиона строк это миллион строк ради десятка.", "rows": [["страница 1 (ids 1..9)", "прочитана, 0 совпадений"], ["страница 2 (ids 10..18)", "прочитана, 0 совпадений"], ["страница 3 (ids 19..27)", "прочитана, найдено 2"]], "hl": [2], "bad": [0, 1]}]}, "btree": {"name": "С индексом: спуск по B-tree", "table": "индекс по author_id", "head": ["узел", "что делаем"], "start": {"note": "Индекс это дерево страниц, отсортированных по ключу. Корень делит диапазон, листья хранят ключи и адреса строк.", "rows": [["корень: 10 | 20", "не открыт"], ["лист 10..19", "не открыт"], ["страница таблицы", "не прочитана"]]}, "steps": [{"ev": "открываем корень", "note": "Ключ 19 меньше 20 и не меньше 10, значит идём в средний потомок. Остальные поддеревья мы больше не трогаем.", "rows": [["корень: 10 | 20", "прочитан, идём в 10..19"], ["лист 10..19", "не открыт"], ["страница таблицы", "не прочитана"]], "hl": [0], "bad": []}, {"ev": "открываем лист", "note": "В листе бинарный поиск находит ключ 19 и адреса строк.", "rows": [["корень: 10 | 20", "прочитан"], ["лист 10..19", "найден ключ 19, адреса (3, 7)"], ["страница таблицы", "не прочитана"]], "hl": [1], "bad": []}, {"ev": "читаем нужную страницу таблицы", "note": "<b>Всего три чтения: корень, лист и одна страница таблицы. На большой таблице их останется столько же, а перебору пришлось бы читать её всю.</b> Высота дерева растёт логарифмически: на миллиард строк обычно четыре-пять уровней.", "rows": [["корень: 10 | 20", "прочитан"], ["лист 10..19", "найден ключ 19"], ["страница таблицы", "прочитана одна, строки 19 и 25"]], "hl": [2], "bad": []}]}};
  var $ = function (id) { return document.getElementById(id); };
  var i = 0, timer = null, total = 0;
  function stop() { if (timer) { clearInterval(timer); timer = null; } $('play').textContent = 'Играть'; }
  function render() {
    var sc = SC[$('mode').value]; total = sc.steps.length;
    var log = [];
    for (var k = 0; k < i; k++) log.push((k === i - 1 ? '> ' : '  ') + sc.steps[k].ev);
    $('log').textContent = log.join('\n') || '(пока ничего)';
    var st = i > 0 ? sc.steps[i - 1] : sc.start;
    $('thead').textContent = sc.table;
    $('tbl').innerHTML = '<tr>' + sc.head.map(function (h) { return '<th>' + h + '</th>'; }).join('') + '</tr>' + st.rows.map(function (r, idx) {
      var cls = (st.hl || []).indexOf(idx) >= 0 ? 'a1' : ((st.bad || []).indexOf(idx) >= 0 ? 'a2' : '');
      return '<tr class="' + cls + '">' + r.map(function (c) { return '<td>' + c + '</td>'; }).join('') + '</tr>';
    }).join('');
    $('note').innerHTML = st.note;
    $('counter').textContent = 'шаг ' + i + ' из ' + total;
    $('step').disabled = i >= total;
    if (i >= total) stop();
  }
  function reset() { stop(); i = 0; render(); }
  $('step').onclick = function () { if (i < total) { i++; render(); } };
  $('reset').onclick = reset; $('mode').onchange = reset;
  $('play').onclick = function () {
    if (timer) { stop(); return; }
    if (i >= total) i = 0;
    $('play').textContent = 'Пауза';
    timer = setInterval(function () { if (i >= total) { stop(); return; } i++; render(); }, 1400);
    i++; render();
  };
  reset();
})();
</script>
</body>
</html>
