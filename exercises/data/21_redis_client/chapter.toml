[chapter]
title.en = "Your own Redis client"
title.ru = "Свой клиент Redis"

[[chapter.visuals]]
file = "visuals/multiplexed_conn.html"
title.ru = "Актор и очередь ответчиков: много вызывающих на одном соединении"

[[chapter.visuals]]
file = "visuals/desync.html"
title.ru = "Отмена посреди ответа: чужой ответ следующему вызову"

[[exercises]]
name = "rcl1"
style = "todo"
hint.ru = ["""Что нужно отправить и что прочитать? Команда уже кодируется, ответ декодируется, остаётся соединение.""", """Подключись `TcpStream::connect`, запиши закодированную команду (`write_all`), прочитай ответ в `BytesMut` (`read_buf`) и отдай буфер `decode`. Ответ разбери по виду значения."""]
why.ru = """Клиент Redis в минимуме: соединение, запись команды, чтение, разбор. Здесь чтение одно, как будто ответ всегда приходит одним куском. Это держится на коротких ответах и локальной сети, а на больших или медленных ломается; следующая задача чинит именно это. Ответ-ошибка сервера это успешное чтение, которое нельзя выдавать за успешную команду: поэтому его превращаем в ошибку."""

[[exercises]]
name = "rcl2"
style = "fix"
hint.ru = ["""Сколько байтов придёт за один `read`? А в буфере после предыдущего ответа уже могло что-то лежать.""", """Сначала попробуй разобрать то, что уже в буфере, и только если ответа нет, читай сокет ещё. Повторяй, пока ответ не получится. Если `read_buf` вернул 0, соединение закрыто."""]
why.ru = """Сокет это поток байтов, а не поток сообщений: один `read` не равен одному ответу. Цикл «разбери буфер, а если не вышло, дочитай» единственный надёжный способ. Порядок важен: сначала разбор, потом чтение, иначе ответ, который целиком пришёл вместе с предыдущим, застрянет в буфере, пока сервер молчит. Буфер принадлежит соединению, а не вызову: то, что осталось после ответа, принадлежит следующему. Нулевое чтение это закрытие: его надо превращать в ошибку, иначе вызов повиснет."""

[[exercises]]
name = "rcl3"
style = "todo"
hint.ru = ["""Результат `call` это `Value`. Какие виды ответа допустимы для GET, а какие нет?""", """Для GET допустимы bulk (значение) и null (нет ключа), ошибка сервера идёт в `io::Error::other`, остальное это InvalidData. Для SET допустим только статус OK. Значение в SET бывает бинарным, поэтому передавай аргументы как байты."""]
why.ru = """Типизированный метод стоит между сырым RESP и приложением и обязан закрыть три дыры: «нет» не равно «пусто» (`Option`), ошибка сервера не равна успеху, а неожиданный вид ответа не равен тихому мусору (иначе `GET` по счётчику вернёт «значение» из числа и когда-нибудь выстрелит). Значения передаются как байты: Redis ничего не знает про UTF-8, и клиент, который навязывает `String`, режет возможности."""

[[exercises]]
name = "rcl4"
style = "todo"
hint.ru = ["""Что должно попасть в сообщение, чтобы по нему в логе можно было понять, что случилось? Кто решает, повторять ли запрос?""", """Ответ-ошибка выглядит как `ВИД пояснение`; отдели первое слово методом строки. Повторяемыми считай вид, который говорит «не сейчас» (`LOADING`, `BUSY`, `TRYAGAIN`) и обрыв соединения, а ошибки типа, прав и синтаксиса нет."""]
why.ru = """Тип ошибки это интерфейс между клиентом и тем, кто им пользуется. Ошибка сервера (команда выполнена неверно), ошибка ввода-вывода (команда, возможно, дошла) и нарушение протокола (соединение испорчено) требуют разных действий, а строки для этого не годятся. Различие «повторить можно» нужно слою выше: цикл повторов не должен гонять `WRONGTYPE` по кругу. Но помни, что повтор команды после обрыва небезопасен для неидемпотентных (INCR): `is_retryable` отвечает «может пройти позже», а не «безопасно повторить»."""

[[exercises]]
name = "rcl5"
style = "scratch"
hint.ru = ["""Адрес надо разбирать с конца или с начала? Подумай, где в нём может встретиться `@` и `:` внутри пароля, и когда `AUTH` и `SELECT` не нужны.""", """Схему отрежь, потом раздели на «до первого `/`» и «после». В первой части отдели учётные данные от хоста по последнему `@`, учётные данные по первому `:`. Пароль раскодируй из `%XX`. `AUTH` с именем принимает два аргумента, без имени один. `SELECT` только для номера не ноль."""]
why.ru = """Адрес подключения это маленький формат, и ловушки в нём предсказуемые: необязательные части (порт, база, имя, пароль), пароль с символами, которые что-то значат в адресе (поэтому их кодируют через `%XX`), и порядок разбора: `@` ищут с конца, иначе пароль с `@` рвёт хост. `AUTH` обязан идти до `SELECT` (до входа сервер отказывает во всём), а отказ на `AUTH` обязан ронять подключение, иначе клиент «подключён», но не может ничего. Лишние команды при подключении не нужны: каждая это обмен с сервером, который идёт перед каждым подключением заново."""

[[exercises]]
name = "rcl6"
style = "todo"
hint.ru = ["""Что должно произойти между записью первой и последней команды? Сколько раз клиент за это время читает сокет?""", """Закодируй все команды в один буфер и запиши его одним `write_all`. Потом читай ответы по одному, пока не наберёшь столько же, сколько отправил. Ошибка сервера это просто значение `Value::Error` в списке, а `Err` оставь для проблем соединения."""]
why.ru = """Pipelining дёшев по коду и дорог по недопониманию. Выигрыш в том, что N обменов превращаются в один (число кругов по сети падает с N до 1). Условие корректности: ответов должно прийти столько же, сколько команд, и клиент обязан прочитать их все, даже если среди них есть ошибки. Если вернуться из `pipeline` при первой ошибке, остальные ответы останутся в сокете и достанутся следующему вызову, как и в случае отмены посреди ответа, о котором следующие задачи."""

[[exercises]]
name = "rcl7"
style = "bughunt"
hint.ru = ["""Что делает `BufWriter` с байтами, которые в него записали? Когда они доходят до сокета?""", """`BufWriter` накапливает записи и отправляет, когда набралось много или когда его просят. Просят методом `flush`. Посмотри каждое место, после которого клиент начинает ждать ответ, и убедись, что перед ожиданием буфер записи пуст."""]
why.ru = """`BufWriter` это обещание «байты уйдут когда-нибудь», а клиент в этот момент ждёт ответа и никогда не получит его. Типичная картина: тест с маленькой командой зависает, а команда побольше «чудесным образом» проходит (она превысила размер буфера и ушла сама). Правило: сразу после последней записи перед ожиданием ответа (`flush`). Для клиента, который и так пишет команду одним `write_all`, `BufWriter` бесполезен: пачка из прошлой задачи уже собрана в один буфер."""

[[exercises]]
name = "rcl8"
style = "bughunt"
hint.ru = ["""Что лежит в сокете и в буфере после того, как ожидание ответа бросили на полпути? Что с ответом, который ещё придёт?""", """После отмены нельзя знать, сколько ответов в пути и в каком состоянии буфер. Проще всего считать соединение испорченным и не использовать, а перед следующей командой завести новое. Метка «обмен не завершён» должна ставиться до первого `await` в `call` и сниматься только после получения ответа."""]
why.ru = """Отмена в async Rust это просто остановка будущего на ближайшем `await`: никаких деструкторов «отката» нет. Если между записью команды и чтением ответа вызов отменён, в соединении остаётся ответ, который кто-то обязательно прочитает не тем. Починить можно двумя способами: считать соединение испорченным и заменить его (проще и надёжнее), либо помнить, сколько ответов выбросить (быстрее, но надо учесть обрывки). Главное место защиты это `call`: срок только один из способов отмены, будущее можно бросить в `select!`, при закрытии запроса пользователем, при остановке сервиса. Актор в следующих задачах уберёт всю эту путаницу сам."""

[[exercises]]
name = "rcl9"
style = "scratch"
hint.ru = ["""Кто владеет сокетом? Остальные должны достучаться до него через что-то, что можно клонировать.""", """В `connect` создай канал и запусти задачу, которая в цикле берёт запрос, вызывает `Conn::call` и отправляет результат в `reply`. В `call` создай `oneshot`, отправь запрос и жди ответ. Когда `recv` вернёт `None`, цикл заканчивается сам."""]
why.ru = """Актор превращает общую изменяемую вещь (сокет) в одного владельца и очередь сообщений. Нет замка, который держат на время ожидания сети, нет вопросов «кто сейчас пишет», а завершение получается бесплатно: все отправители брошены, канал закрылся, цикл кончился, сокет закрылся. Пока что актор обслуживает запросы по одному и ждёт ответа каждому: это правильно, но медленно. Следующая задача убирает ожидание."""

[[exercises]]
name = "rcl_q1"
kind = "question"
question.ru = """Сервис держит одно соединение с Redis в `Arc<Mutex<Conn>>`, и замок берётся на всё время `conn.call(...).await`. Двадцать задач одновременно вызывают GET, каждая по 1 мс на круг по сети. Сколько в лучшем случае займёт вся пачка?"""
options.ru = ["Около 1 мс: запросы идут параллельно, Redis быстрый", "Около 20 мс: пока одна задача держит замок, остальные ждут, и каждая платит полный круг по сети", "Около 2 мс: Redis отвечает быстрее сети", "Зависит от числа ядер процессора"]
answer = [1]
explain.ru = """Замок на время ожидания сети превращает общее соединение в очередь. Redis выполнил бы все двадцать команд за микросекунды, но клиент не отправляет вторую, пока не получит ответ на первую. Актор с очередью ответчиков (следующая задача) отправляет команды сразу, а ответы раздаёт по порядку: те же двадцать запросов уйдут в сеть вместе."""
hint.ru = """Когда вторая задача может отправить свою команду?"""

[[exercises]]
name = "rcl10"
style = "todo"
hint.ru = ["""Нужна одна задача, которая умеет ждать сразу двух вещей: нового запроса от вызывающих и данных от сервера. Для этого есть макрос `select!`.""", """Заведи очередь ответчиков (`VecDeque` из `oneshot::Sender`). Ветка запроса: записала команду и положила её ответчик в конец очереди. Ветка чтения: после каждого разобранного значения достань ответчик из начала и отправь значение; если получатель закрыт, ошибку отправки игнорируй. У ветки запроса поставь условие на длину очереди."""]
why.ru = """Pipelining в клиенте держится на одном факте: Redis отвечает строго по порядку команд. Поэтому ответ можно сопоставить запросу без идентификаторов: он первый в очереди. Отсюда два следствия. Ответчик нельзя пропускать, даже если вызывающий ушёл (иначе очередь сдвигается, и все ответы после этого уходят не тем). И очередь надо ограничивать, иначе медленный сервер накопит неограниченно запросов в памяти. Условие в ветке `select!` как раз даёт обратное давление: пока очередь полна, новые запросы остаются в канале, а потом и вызывающие ждут в `send`."""

[[exercises]]
name = "rcl_q2"
kind = "question"
question.ru = """Актор с очередью ответчиков получил запросы A, B, C, записал их в сокет. Вызывающий B отменил свой вызов (бросил будущее). Что актор должен сделать с ответом на B, когда тот придёт?"""
options.ru = ["Пропустить ответ: B никому не нужен, следующий ответ будет для C", "Прочитать ответ как обычно, вынуть ответчик B из очереди и выбросить значение: ответы приходят по порядку, и без этого C получит ответ на B", "Закрыть соединение и открыть новое", "Отправить ответ на B тому, кто сейчас первый в очереди"]
answer = [1]
explain.ru = """Сервер не знает, что B отменили, и ответит на него в любом случае. Сопоставление запроса и ответа держится только на порядке, поэтому место B в очереди надо сохранить. Слово «пропустить» верно только в смысле «не пересылать значение»: прочитать и разобрать его необходимо."""
hint.ru = """По чему актор определяет, кому принадлежит ответ?"""

[[exercises]]
name = "rcl11"
style = "todo"
hint.ru = ["""Обрыв это не конец клиента. Что должно жить дольше одного соединения: канал с запросами или сокет?""", """Канал `rx` принадлежит задаче-актору и переживает соединения. Оберни `serve` в цикл: пока она возвращает `Broken`, жди `pause` и подключайся заново (если подключиться не вышло, снова пауза). Запросы, которые лежат в канале, достанутся новому соединению сами."""]
why.ru = """Переподключение разделяет два вида запросов. Те, что успели уйти в сокет, неизвестного состояния: сервер мог выполнить команду и не успеть ответить. Автоматически повторять их нельзя (`INCR` увеличит счётчик дважды), поэтому они получают ошибку, и решение принимает вызывающий. Те, что ещё не были записаны, ничем не рискуют и просто ждут нового соединения. Пауза между попытками обязательна: сервер, который падает при каждом подключении, иначе получит поток повторных подключений со всех клиентов сразу."""

[[exercises]]
name = "rcl12"
style = "todo"
hint.ru = ["""Что в каждом случае может не прийти вовремя? В подключении это не только TCP.""", """`tokio::time::timeout` оборачивает целый `async`-блок. Для подключения в блок входят `TcpStream::connect` и вызов PING. Для команды в срок входит и отправка в канал, и ожидание ответа. Результат `Err(Elapsed)` превращай в `io::ErrorKind::TimedOut`."""]
why.ru = """TCP-соединение открывается ядром ещё до того, как приложение сервера вызвало `accept`, поэтому «подключились» ничего не значит: зависший Redis принимает подключения в очередь и молчит. Обмен PING отделяет живой сервер от занятого сокета. Срок на команду ставят вокруг всего «отправить и дождаться»: достаточно отменить ожидание ответа, а работа актора с очередью ответчиков сама выбросит запоздавший ответ. Без актора (как в соединении с одним `call`) тот же срок портил бы соединение: об этом была задача про рассинхронизацию."""

[[exercises]]
name = "rcl13"
style = "bughunt"
hint.ru = ["""Почему PING во время BLPOP отвечает не сразу? Подумай, что сервер делает с одним соединением, пока блокирующая команда ждёт.""", """Redis обрабатывает команды одного соединения по порядку, и пока BLPOP ждёт, остальные команды этого соединения стоят за ней. Значит, ждать надо на другом соединении. Открой его в `blpop` и закрой после."""]
why.ru = """Мультиплексирование держится на том, что команды короткие. Блокирующая команда (`BLPOP`, `XREAD BLOCK`, `SUBSCRIBE`) делает длинной саму очередь соединения, и все, кто делит его, ждут вместе с ней. Правило: блокирующим командам отдельное соединение, остальным общее. Лучше пул (следующая задача), чем соединение на каждый вызов, но для редких долгих ожиданий отдельное соединение вполне нормально, если не забыть его закрыть."""

[[exercises]]
name = "rcl_q3"
kind = "question"
question.ru = """Сервис использует один мультиплексированный клиент на всё. Раз в минуту фоновая задача вызывает `XREAD BLOCK 30000` (ждёт новое сообщение до 30 секунд). Как это проявится в остальном сервисе?"""
options.ru = ["Никак: Redis обрабатывает команды разных задач независимо", "Все остальные вызовы того же клиента станут иногда отвечать с задержкой до 30 секунд", "Клиент выдаст ошибку: блокирующие команды запрещены на мультиплексированном соединении", "Только вызовы той же задачи задержатся"]
answer = [1]
explain.ru = """Соединение для Redis это одна очередь: команды выполняются по порядку, и блокирующая команда стоит в очереди, пока не вернётся. Задачи для клиента разные, но для сервера они на одном соединении. Поэтому блокирующие команды выносят на отдельные соединения."""
hint.ru = """Сколько очередей команд у одного соединения с точки зрения Redis?"""

[[exercises]]
name = "rcl14"
style = "todo"
hint.ru = ["""Нужны две вещи: счётчик свободных мест и список свободных соединений. Для первой в tokio есть готовый примитив.""", """Семафор на `size` мест: `get` берёт разрешение (`acquire_owned`), охранник хранит его до конца жизни. Список свободных соединений за обычным `Mutex` (в `Drop` нельзя ждать). Соединение в `Drop` вернётся в список, если его не пометили испорченным."""]
why.ru = """Пул это очередь на ограниченный ресурс. Разрешение семафора хранится в охраннике, поэтому место освобождается само, когда охранник выпал из области видимости, даже при панике. Соединение возвращается в `Drop`, но возвращать надо только исправное: после отмены посреди ответа оно рассинхронизировано (это была задача про таймаут), и следующий владелец получит чужой ответ. Отсюда `discard`. Размер пула для блокирующих команд выбирают по числу одновременных ожидающих, а не по числу задач."""

[[exercises]]
name = "rcl15"
style = "scratch"
hint.ru = ["""Где в коде начинается и где заканчивается то, что ты меряешь? Подключение в замер входить не должно.""", """`Instant::now()` перед серией и `elapsed()` после. Пачки нарежь через `step_by(batch)`: последняя пачка может быть короче, не потеряй хвост (`min(n)`). Скорость это `n` на секунды как `f64`."""]
why.ru = """Замер без проверки результата врёт: самая быстрая программа та, что ничего не делает. Поэтому тест проверяет, что оба набора ключей записаны, включая хвост неполной пачки. На локальной сети выигрыш pipeline обычно в 10-50 раз, и чем больше сетевая задержка, тем он больше, потому что сам Redis выполняет команду за микросекунды, а круг по сети стоит сотни. Размер пачки не бесконечный: пачка в миллион команд держит память у обеих сторон, на практике берут сотни или тысячи."""

[[exercises]]
name = "rcl_resp_client"
kind = "project"
style = "scratch"
quiz = true
requires = ["redis"]
locked = ["tests/acceptance.rs"]
hint.ru = ["""Начни с кодека: он нужен всему остальному. Пределы проверяются по заголовку, неполный кадр оставляет буфер нетронутым. Потом `connect_with`, `call` и актор, а типизированные команды в самом конце: они тонкие обёртки над `call`.""", """Актор: `select!` между `rx.recv()` (с условием на длину очереди ответчиков) и `read_buf`. Ответчик кладётся в `VecDeque` после записи команды, снимается спереди после каждого разобранного ответа. Вынеси «обслужить одно соединение» в функцию, которая возвращает, закрыт канал или соединение оборвалось, а внешний цикл при обрыве ждёт `reconnect_pause` и подключается заново.""", """Обрыв и нарушение протокола: все ждущие ответчики получают ошибку (`Disconnected` или `Protocol`), запросы из канала не трогай. Срок на команду это `timeout` вокруг «отправить в канал и дождаться oneshot». Для `blpop` открой второе соединение тем же `connect_with` и дай ему срок команды на `timeout_secs` больше."""]
why.ru = """Клиент собирает всё, что было в главе: кодек с пределами, актор с очередью ответчиков (из-за него отмена и таймаут перестают портить соединение), переподключение с правилом «ушедшее не повторяем, неотправленное ждёт», срок на подключение и на команду, ограничение числа команд в полёте и отдельное соединение для блокирующих команд. Всё это держится на нескольких простых инвариантах: ответы приходят по порядку, место в очереди ответчиков нельзя пропускать, всё, что приходит из сети, недоверенный ввод. Если помнить их, большая часть кода выводится сама."""
