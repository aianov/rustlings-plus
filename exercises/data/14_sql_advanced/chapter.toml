[chapter]
title.en = "Postgres features"
title.ru = "Возможности Postgres"

[[chapter.visuals]]
file = "visuals/fts_pipeline.html"
title.ru = "Полнотекстовый поиск: от текста поста до найденной строки"

[[exercises]]
name = "pgadv1"
style = "todo"
requires = ["postgres"]
hint.ru = """У jsonb два вида «достать»: оператор, который возвращает снова jsonb (с кавычками у строк), и оператор, который возвращает текст. Для пути из нескольких ключей есть отдельная пара операторов с `#` и массивом пути в фигурных скобках."""
why.ru = """Главное различие здесь в типе результата: `->` и `#>` дают jsonb, у строки остаются кавычки, и дальше с ней можно продолжать цепочку; `->>` и `#>>` дают обычный text, и это конец цепочки. Недостающий ключ не ошибка, а NULL, поэтому один запрос одинаково читает и полные, и пустые настройки. Путь `'{ui,lang}'` короче, чем `-> 'ui' ->> 'lang'`, и не ломается, если `ui` вообще нет."""

[[exercises]]
name = "pgadv2"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Для «содержит такой кусок документа» и для «ключ существует» у jsonb есть отдельные операторы, оба работают по индексу GIN. Подумай, чем проверка наличия ключа отличается от проверки, что значение не NULL.""", """Содержание: `settings @> '{...}'`, вложенные объекты пишутся целиком. Наличие ключа верхнего уровня: оператор `?`. Если sqlx или клиент ругается на знак вопроса, то же самое делает функция `jsonb_exists(settings, 'ключ')`."""]
why.ru = """`@>` сравнивает с типами: булево `true` и строка "true" это разные значения, поэтому старые записи не попадают в выгрузку, а запрос через `->> = 'true'` их бы захватил. `?` отвечает на вопрос «есть ли такой ключ», и у него другой смысл, чем у проверки на NULL: JSON null и отсутствие ключа тоже различаются. Оба оператора понимает GIN-индекс (следующие задачи), а `->>` с текстовым сравнением нет, и это причина писать именно так."""

[[exercises]]
name = "pgadv3"
style = "fix"
requires = ["postgres"]
hint.ru = ["""Первая функция заменяет документ целиком, поэтому всё лишнее пропадает. Нужна функция, которая меняет одно место внутри существующего документа. Вторая: подумай, что делает такая функция, если по пути чего-то нет.""", """`jsonb_set(документ, '{путь}', новое_jsonb)` меняет только указанный путь, а новое значение должно быть jsonb (`to_jsonb(...)`). Для вложенного пути создаётся только последний ключ: промежуточный объект должен уже существовать. Значит, раздел можно собрать отдельно (достать или взять пустой `{}`) и записать целиком.""", """Для второй функции: возьми текущий раздел `notifications` или пустой объект, дополни его ключом `email` оператором `||` и запиши результат по пути из одного ключа."""]
why.ru = """Частичное обновление jsonb это два приёма. Первый: менять не документ, а место в нём (`jsonb_set`), чтобы параллельные правки разных полей не затирали друг друга. Второй: помнить, что `jsonb_set` создаёт лишь последний ключ пути. Если родителя нет, он возвращает документ без изменений, и ошибки нет, поэтому баг проявляется только у части пользователей. Оператор `||` сливает объекты только на верхнем уровне: вложенный объект он заменяет целиком, так что им нельзя «досыпать» ключи вглубь, не собрав объект самому."""

[[exercises]]
name = "pgadv_q1"
kind = "question"
question.ru = """Профиль хранит `{"ui": {"lang": "ru", "font": 14}, "theme": "dark"}`. Что будет в `settings` после
`UPDATE profiles SET settings = settings || '{"ui": {"lang": "en"}}'`?"""
options.ru = ["Ошибка: оператор || не определён для jsonb", "{\"ui\": {\"lang\": \"en\"}, \"theme\": \"dark\"}", "{\"ui\": {\"lang\": \"en\", \"font\": 14}, \"theme\": \"dark\"}", "{\"ui\": {\"lang\": \"ru\", \"font\": 14}, \"theme\": \"dark\"}, потому что ключ ui уже есть"]
answer = [1]
explain.ru = """`||` сливает объекты только по ключам верхнего уровня: если ключ есть и справа, и слева, значение справа заменяет значение слева целиком. Вложенный объект `ui` стал новым, и `font` исчез. Поэтому для вложенных правок используют `jsonb_set` с путём или собирают нужный вложенный объект отдельно и записывают целиком."""
hint.ru = """Слияние идёт по верхнему уровню или рекурсивно?"""

[[exercises]]
name = "pgadv4"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Оберни значение в `Json(...)` при `bind`, а при чтении запроси столбец как `Json<Settings>` (для одного столбца удобен `query_scalar`).""", """Чтение: `query_scalar::<_, Json<Settings>>(...).fetch_optional(pool)` даёт `Option<Json<Settings>>`, внутри поле `.0`. Запись: `INSERT ... ON CONFLICT (user_id) DO UPDATE SET settings = EXCLUDED.settings` и `.bind(Json(settings))` (Json принимает и ссылку)."""]
why.ru = """`Json<T>` решает две ошибки сразу: структура превращается в JSON ровно один раз и с правильным типом параметра (`jsonb`, а не text), а при чтении разбор делает serde, и поведение зависит от атрибутов структуры, а не от запроса. `#[serde(default)]` для поля `beta` и молчаливое игнорирование лишних ключей делают чтение устойчивым: в столбце лежат документы разных поколений, и старые не должны ломать новый код. Если же записать `serde_json::to_string(..)` как текст и привести `::jsonb`, получится объект, но если обернуть строку в Json ещё раз, в столбце окажется jsonb-строка: проверка `jsonb_typeof` в тесте ловит именно её."""

[[exercises]]
name = "pgadv5"
style = "todo"
requires = ["postgres"]
hint.ru = ["""У GIN по jsonb два класса операторов. Один индексирует ключи и значения по отдельности и умеет `?`, `?|`, `?&`, второй хранит хеши целых путей и понимает только `@>` (и `@?`, `@@`). Какой из них нужен, если оператор один?""", """Класс операторов пишется после столбца в скобках индекса: `USING gin (столбец имя_класса)`. Нужное имя начинается с `jsonb_` и содержит `path`."""]
why.ru = """Для документов GIN работает как оглавление в книге: ключ индекса (ключ, значение или хеш пути) ведёт к списку строк. Класс по умолчанию `jsonb_ops` хранит каждый ключ и значение отдельно, поэтому умеет проверять наличие ключа, но разрастается. `jsonb_path_ops` хранит один хеш на путь вместе со значением: меньше места, быстрее содержание, но `?` не поддерживается. Выбирают по тому, какие операторы реально встречаются в запросах: не «на всякий случай» самый универсальный. Тест смотрит на план и на размер, потому что индекс, которым запрос не пользуется, это чистая трата записи."""

[[exercises]]
name = "pgadv6"
style = "scratch"
requires = ["postgres"]
hint.ru = ["""Если соединить пост сразу и с тегами, и с комментариями, строки размножатся (3 тега на 4 комментария это 12 строк), и `json_agg` соберёт дубли. Собирай каждый массив своим подзапросом, привязанным к посту.""", """Массив из строк делает `jsonb_agg(...)`, порядок внутри задаётся `ORDER BY` прямо в скобках агрегата. Объект из пар ключ-значение делает `jsonb_build_object`. Для пустого результата агрегат даёт NULL, поэтому оборачивай его в `COALESCE(..., '[]'::jsonb)`.""", """Два свежих комментария это подзапрос с `ORDER BY created_at DESC, id DESC LIMIT 2`, а упорядочивать агрегат придётся ещё раз: порядок подзапроса агрегат не обещает сохранить."""]
why.ru = """Собрать вложенный ответ в базе имеет смысл, когда иначе получится пять запросов на страницу (проблема N+1 в чистом виде). Ловушка одна: агрегаты считают то, что дало соединение, а соединение с двумя «множественными» таблицами даёт произведение. Поэтому независимые коллекции агрегируют в коррелированных подзапросах, а не соединяют. `COALESCE` нужен потому, что агрегат над пустым набором возвращает NULL, а не пустой массив, и фронтенд получит `null` вместо `[]`. Порядок внутри агрегата задают в самом агрегате: порядок внешнего запроса на него не влияет."""

[[exercises]]
name = "pgadv7"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Для массивов есть три оператора сравнения целиком: «содержит все», «пересекается» и «входит в». А чтобы посчитать теги, массив надо превратить обратно в строки. Подумай, что считает `count(*)`, когда в одном посте тег повторён.""", """Все теги: `tags @> $1`. Хотя бы один: `tags && $1`. Раскрыть массив в строки: `unnest(tags)` в `FROM` (запятая даёт соединение построчно). Посты считай через `count(DISTINCT id)`."""]
why.ru = """Массивы удобны для небольших списков, которые читают и пишут целиком вместе со строкой: теги, цвета, права. Операторы `@>` и `&&` поддерживает GIN, поэтому «найти по тегу» не обязано быть медленным. А вот сопоставлять с другими таблицами, считать, держать растущий список (кто лайкнул пост) массив не годится: каждая правка переписывает всю строку, а ограничений и внешних ключей у элементов нет. Если у элемента появились свои свойства или счётчики, это уже таблица. `unnest` превращает массив в набор строк, и все привычные агрегаты снова работают, но дубли внутри строки тоже превращаются в отдельные строки: отсюда `DISTINCT`."""

[[exercises]]
name = "pgadv_q2"
kind = "question"
question.ru = """У поста бывает до трёх миллионов лайков. Разработчик предлагает хранить их как `liked_by bigint[]` прямо в строке поста: «так один запрос вместо соединения». Что произойдёт при росте?"""
options.ru = ["Postgres откажется хранить массив длиннее 1000 элементов", "Каждый новый лайк переписывает всю строку с огромным массивом, строки раздуваются, параллельные лайки одного поста упираются друг в друга, а внешний ключ на пользователя не проверить", "Ничего плохого: массивы в Postgres сжимаются и индексируются без ограничений", "Будет работать, только поиск «лайкнул ли пользователь X» станет невозможным"]
answer = [1]
explain.ru = """Строка в Postgres неизменяема: любое обновление пишет новую версию целиком, а большие значения уходят в TOAST и перезаписываются тоже. Горячий пост получает тысячи лайков в секунду, и все они обновляют одну строку по очереди. Плюс нет ограничений целостности на элементах и нельзя быстро спросить «все посты, которые лайкнул X» без индекса по массиву. Для растущей связи «многие ко многим» нужна таблица `likes(post_id, user_id)`."""
hint.ru = """Сколько байт переписывается при одном новом лайке, и что делают сто лайков одновременно?"""

[[exercises]]
name = "pgadv8"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Нужны два шага: превратить текст поста в `tsvector`, превратить строку запроса в `tsquery`, и оператор `@@` между ними. Слово «словарь» в Postgres называется конфигурацией: она определяет, как резать текст и как приводить слова к основе.""", """Конфигурация передаётся первым аргументом обеих функций: `to_tsvector('russian', body)` и `websearch_to_tsquery('russian', $1)`. Конфигурации у текста и у запроса должны совпадать. Для точного поиска возьми конфигурацию `simple`: она только делит на слова и переводит в нижний регистр."""]
why.ru = """Полнотекстовый поиск это два преобразования и один оператор. Текст превращается в `tsvector` (слова, приведённые словарём к основе, с позициями), запрос в `tsquery`, а `@@` отвечает «подходит ли». Если конфигурации не совпали, основы разойдутся и ничего не найдётся: самая частая причина «поиск не работает». `websearch_to_tsquery` не падает на кривом вводе пользователя (в отличие от `to_tsquery`), поэтому ему можно отдавать строку из поля поиска как есть. `simple` нужен там, где морфология вредит: имена, коды, артикулы."""

[[exercises]]
name = "pgadv9"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Столбец, значение которого база вычисляет сама из других столбцов и хранит на диске, называется generated (STORED). Выражение должно быть неизменяемым (immutable): функции, зависящие от настроек сессии, не подойдут. Заголовок и текст нужно склеить в один вектор, но с разными весами.""", """`to_tsvector` без имени конфигурации зависит от настройки сессии, поэтому в generated-столбце недопустим: всегда указывай `'russian'`. Метка веса ставится функцией `setweight(вектор, 'A')`, а два вектора склеиваются оператором `||`. Индекс: `USING gin (search)`."""]
why.ru = """Пока вектор вычисляется на лету, индексу не за что зацепиться: приходится перечитывать каждый пост. Generated-столбец переносит вычисление на запись (она случается реже, чем чтение), а GIN строит обратный указатель «лексема → посты». Приложение больше не знает про поиск: вставка и правка обновляют вектор сами, и ни один путь записи не может про него забыть (в отличие от триггера, написанного вручную, или кода, который кто-то забыл вызвать). Веса A и B пригодятся для ранжирования в следующей задаче. Нечистая функция в выражении даёт ошибку «generation expression is not immutable»: это защита от векторов, зависящих от настроек."""

[[exercises]]
name = "pgadv10"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Порядок по рангу даёт `ts_rank(вектор, запрос)`: веса A и B, которые ты уже положила в `search`, он учитывает сам. Выдержку делает отдельная функция, которой нужны конфигурация, исходный текст и запрос. Не вычисляй `tsquery` дважды: его можно положить в `FROM` как однострочную таблицу.""", """Выдержка: `ts_headline('russian', body, запрос, 'StartSel=<mark>, StopSel=</mark>, MaxWords=12')`. Ранжирование и фильтр берут столбец `search`, а не `to_tsvector(body)`: иначе вес заголовка потеряется."""]
why.ru = """`ts_rank` считает, насколько вектор подходит запросу, и учитывает веса: слово в заголовке (A) весит заметно больше трёх слов в тексте (B). Поэтому ранжирование должно идти по сохранённому `search`, а не по вектору, собранному заново из `body`. `ts_headline` работает по исходному тексту, а не по вектору, и стоит дорого: вызывай его только для строк, которые остались после `WHERE` и `LIMIT` (в боевом запросе его обычно кладут во внешний запрос поверх страницы результатов). Результат `ts_headline` нельзя считать безопасным HTML: он вырезает лишь целые теги (побочный эффект разбора), а оборванный тег и символы `<` и `&` проходят как есть, так что текст надо экранировать до выделения."""

[[exercises]]
name = "pgadv_q3"
kind = "question"
question.ru = """Разработчик говорит: «Выдержку из `ts_headline` можно вставлять на страницу как HTML, чтобы работали теги `<mark>`. Опасных тегов в ней нет, парсер текста вырезает разметку сам». Верно ли это?"""
options.ru = ["Верно, пока в `StartSel` не стоит скрипт", "Неверно: вырезаются только целые теги, а оборванный фрагмент вроде `<img src=x onerror=alert(1)` и символы `<` и `&` остаются как есть. Текст надо экранировать до выделения или не вставлять выдержку как HTML", "Верно: парсер вырезает любую разметку, а `<` и `&` превращает в безопасные сущности", "Неверно: `ts_headline` вообще не меняет текст, скрипты всегда попадают в выдержку целиком"]
answer = [1]
explain.ru = """Разбор текста в Postgres узнаёт полные теги как отдельный тип лексем и в выдержку их не кладёт. Но это побочный эффект разбора, а не защита: если тег оборван (выдержка режется по числу слов), в ней остаётся кусок вроде `<img src=x onerror`, а `<` и `&` вообще не трогаются. Ответственность за экранирование лежит на авторе запроса: заменить `&`, `<`, `>` до вызова `ts_headline` и выдавать на страницу только свои маркеры выделения."""
hint.ru = """Что ts_headline делает с оборванным тегом и с одиноким символом «меньше»?"""

[[exercises]]
name = "pgadv11"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Расширение добавляет оператор «похоже» (знак процента) и функцию `similarity`, которая возвращает число от 0 до 1. Оператор сам отсекает слишком непохожее по порогу. Для индекса под `LIKE '%x%'` нужен класс операторов того же расширения.""", """Порядок: `ORDER BY similarity(username, $1) DESC, username`. Индекс: `USING gin (username gin_trgm_ops)`; именно он умеет помогать `LIKE`/`ILIKE` с процентами с обеих сторон, чего B-tree не умеет."""]
why.ru = """Триграммы режут строку на тройки символов («alice» это «  a», « al», «ali», «lic», «ice», «ce »), и похожесть это доля общих троек. Опечатка портит две-три тройки, остальные совпадают, поэтому «alise» находит «alice». Оператор `%` по умолчанию требует похожести не меньше 0.3 (порог настраивается), он же умеет работать по индексу, а `ORDER BY similarity` просто сортирует уже найденных. Тот же индекс ускоряет `LIKE '%кусок%'` и `ILIKE`: для B-tree такой шаблон непосильная задача, у него нет «начала» строки, по которому можно спуститься."""

[[exercises]]
name = "pgadv12"
style = "fix"
requires = ["postgres"]
hint.ru = ["""Обновление без блокировки читателей у материализованных представлений есть, но у него есть условие к самому представлению: база должна уметь сопоставить старые строки с новыми. Что для этого нужно?""", """К `REFRESH MATERIALIZED VIEW` добавляется слово `CONCURRENTLY`, а в представлении нужен уникальный индекс по столбцам без условия (без `WHERE`). Индекс создаётся второй командой того же скрипта."""]
why.ru = """Материализованное представление это сохранённый результат запроса: читать его быстро, но оно не меняется само. Обычный `REFRESH` пересобирает всё под эксклюзивной блокировкой, и читатели ждут. `CONCURRENTLY` строит новую версию рядом, сравнивает со старой и применяет разницу, не мешая чтению; ему нужен уникальный индекс, чтобы строки можно было сопоставить. Цена: обновление медленнее и сначала представление должно быть заполнено. Не забывай, что «последние 24 часа» вычисляются в момент обновления: между обновлениями окно «замерзает», и это нормальное свойство, а не баг."""

[[exercises]]
name = "pgadv_q4"
kind = "question"
question.ru = """Представление `trending` обновляется раз в минуту. В 12:00:30 пользователь ставит лайк посту, который лидирует в тренде. Что увидит другой пользователь, открывший блок «в тренде» в 12:00:40?"""
options.ru = ["Лайк не учтён: до следующего обновления представление показывает снимок на момент последнего обновления", "Лайк уже учтён: представление пересчитывается при каждом чтении", "Postgres вернёт ошибку: представление устарело", "Запрос зависнет до ближайшего обновления"]
answer = [0]
explain.ru = """Материализованное представление хранит готовые строки как обычная таблица и само не узнаёт об изменениях исходных таблиц. Свежесть определяется расписанием обновления: минута означает, что цифры могут отставать почти на минуту. Для блока «в тренде» это нормально; для баланса счёта такой компромисс недопустим. Если нужна точность, используют обычное представление, индексы на исходных таблицах или инкрементальные счётчики."""
hint.ru = """Кто и когда обновляет данные внутри материализованного представления?"""

[[exercises]]
name = "pgadv13"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Родителя объявляют с `PARTITION BY RANGE (столбец)`, партиции присоединяют как `PARTITION OF` с границами `FROM ... TO ...`. Верхняя граница не входит в диапазон, поэтому границы соседних месяцев совпадают. Первичный ключ на партиционированной таблице должен содержать столбец партиционирования.""", """`PRIMARY KEY (id, created_at)`. Для `add_month` вычисли следующий месяц: после 12 идёт 1 следующего года, номер месяца печатай с ведущим нулём (`{month:02}`). Убрать месяц целиком: `DETACH PARTITION`, затем `DROP TABLE` отсоединённой таблицы (или сразу `DROP TABLE` партиции)."""]
why.ru = """Партиционирование решает две задачи: ограничить, сколько таблицы читает запрос (если в условии есть столбец партиционирования, остальные партиции вообще не открываются), и превратить удаление старых данных из тяжёлого `DELETE` в мгновенный `DROP TABLE`. Цена: уникальность и первичный ключ должны включать столбец партиционирования (иначе база не может проверить её без просмотра всех партиций); запрос без этого столбца читает все партиции; партиции надо создавать заранее, иначе вставка в будущий месяц упадёт с ошибкой, и именно поэтому у тебя в `add_month` есть переход через границу года. Ошибка в расчёте декабря остаётся тихой до 1 января."""

[[exercises]]
name = "pgadv_q5"
kind = "question"
question.ru = """Таблица уведомлений разбита на 36 месячных партиций по `created_at`. Запрос: `SELECT * FROM notifications WHERE user_id = 42 ORDER BY created_at DESC LIMIT 20`. Что делает база?"""
options.ru = ["Падает с ошибкой: партиционированную таблицу нельзя фильтровать по другому столбцу", "Использует индекс по user_id во всех 36 партициях и объединяет результат: в условии нет created_at, отсечь партиции нечем", "Читает только последнюю партицию: данные ведь отсортированы по времени", "Читает ровно одну партицию, выбранную по хешу от user_id"]
answer = [1]
explain.ru = """Отсечение партиций работает только по условию на столбец партиционирования. Без `created_at` в `WHERE` планировщик не знает, в каких месяцах искать пользователя, и должен заглянуть в каждую партицию (с её собственным индексом). Здесь это ещё терпимо благодаря индексам и LIMIT, но на тысяче партиций такой запрос становится дорогим. Отсюда правило: добавляй в запрос границу по времени, и держи число партиций небольшим."""
hint.ru = """Откуда планировщик узнает, какие партиции можно пропустить?"""

[[exercises]]
name = "pgadv14"
style = "fix"
requires = ["postgres"]
hint.ru = ["""Триггер AFTER видит строку, которая уже записана: чтобы поменять её ещё раз, он вынужден делать новый UPDATE, а тот снова вызывает триггер. Есть другой момент, когда строку ещё можно поправить без нового запроса.""", """Триггер BEFORE UPDATE FOR EACH ROW получает новую строку в `NEW`: присвой `NEW.updated_at := now()` и верни `NEW`. Условие «значения действительно изменились» пишется в самом `CREATE TRIGGER` как `WHEN (OLD.* IS DISTINCT FROM NEW.*)`."""]
why.ru = """Триггер BEFORE может изменить строку, которая вот-вот будет записана, поэтому для служебных полей (`updated_at`, нормализация текста) он естественнее и дешевле: никакого второго UPDATE, никакой рекурсии. `WHEN (OLD.* IS DISTINCT FROM NEW.*)` отсекает пустые правки на уровне базы, и триггер даже не запускается. Цена триггеров вообще: они выполняются на каждой строке, невидимы читателю приложения и умножают время записи. Поэтому служебные поля на триггерах нормально, а бизнес-логику и счётчики (особенно общие для многих писателей) в них прятать не стоит."""

[[exercises]]
name = "pgadv_q6"
kind = "question"
question.ru = """Чтобы не считать комментарии при каждом открытии поста, разработчик добавил триггер: после вставки комментария `UPDATE posts SET comments_count = comments_count + 1 WHERE id = NEW.post_id`. Пост стал вирусным, под ним сто человек одновременно пишут комментарии. Что происходит с записью комментариев?"""
options.ru = ["Postgres сам объединит сто обновлений в одно", "Все вставки упираются в блокировку одной строки поста и выстраиваются в очередь: пропускная способность записи падает до числа обновлений одной строки в секунду", "Счётчик начнёт расходиться с реальным числом комментариев, но вставки останутся быстрыми", "Всё хорошо: триггер выполняется параллельно для каждого комментария"]
answer = [1]
explain.ru = """Обновление строки берёт на неё блокировку до конца транзакции. Сто параллельных вставок обновляют одну и ту же строку поста, поэтому каждая транзакция ждёт предыдущую, и триггер превращает параллельную запись в последовательную. Горячие счётчики лучше вынести: отдельная таблица с накоплением пачками, счёт по требованию с кэшем, либо агрегация фоновым заданием. Тут помогают задачи главы про эксплуатацию."""
hint.ru = """Что держит блокировку строки, пока транзакция не завершилась?"""

[[exercises]]
name = "pgadv_search"
kind = "project"
style = "scratch"
quiz = true
requires = ["postgres"]
locked = ["tests/acceptance.rs"]
hint.ru = ["""Начни со схемы: без вычисляемого столбца и индексов остальное не заработает. Потом `search_posts`: фильтр, ранг и выдержка берутся из одного и того же `websearch_to_tsquery`, поэтому положи его в `FROM` как однострочную таблицу.""", """Схема: generated-столбец с двумя `setweight` (A для заголовка, B для текста), GIN на нём, `gin_trgm_ops` на нике. Выдержка: `ts_headline` с опциями `StartSel`, `StopSel`, `MaxWords`; текст перед ней проходит три `replace` для `&`, `<`, `>`, причём `&` заменяется первым.""", """Люди: оператор `%` отсекает непохожих, порядок `similarity(...) DESC, username`, `LIMIT 5`. Пустой запрос не требует особого кода: пустой `tsquery` ничего не находит, но проверь это тестом."""]
why.ru = """Квиз собирает поиск целиком: хранимый вектор с весами, индексы под оба оператора, синтаксис запросов пользователя, ранжирование, выдержку и нечёткий поиск ников. Типичные ошибки: другая конфигурация у текста и запроса (поиск «не работает»), ранг по вектору, собранному заново без весов (заголовок перестаёт весить больше), экранирование после `ts_headline` вместо экранирования до него (разметка выделения превращается в видимые сущности) и замена `<` раньше `&` (двойное экранирование). Тест индекса смотрит в план, потому что медленный поиск без индекса не проваливает ни один функциональный тест, пока таблица маленькая."""

