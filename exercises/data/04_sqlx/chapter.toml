[chapter]
title.en = "sqlx: Postgres from Rust"
title.ru = "sqlx: Postgres из Rust"

[[chapter.visuals]]
file = "visuals/query_roundtrip.html"
title.ru = "Путь запроса: пул, Parse, Bind, Execute"

[[exercises]]
name = "sqlx1"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Адрес читается через `std::env::var`, а для значения по умолчанию есть `unwrap_or_else`.""", """`PgPool::connect(url)` возвращает `Result` и ждёт `.await`. Строку из базы читают методом `Row::get("имя столбца")`, не забудь `use sqlx::Row`."""]
why.ru = """Пул это то, что живёт в приложении всё время; соединение отдельно от него почти никогда не нужно. Он клонируется дёшево (внутри Arc), поэтому его кладут в состояние сервиса и раздают задачам. Ошибки подключения возвращаем вызывающему: на старте сервис может решить повторить попытку или упасть с понятным сообщением, а паника в библиотечном коде лишает его выбора."""

[[exercises]]
name = "sqlx2"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Значения в SQL подставляются не текстом, а параметрами `$1`, `$2`. Передать их можно методом `bind` у запроса.""", """Порядок `bind` совпадает с номерами: первый `bind` это `$1`. Строки результата читаются через `row.get::<String, _>("username")`."""]
why.ru = """Параметры `$n` едут на сервер отдельно от текста запроса, поэтому любая строка остаётся значением и не может стать кодом. Это работает не потому, что sqlx «экранирует» кавычки, а потому, что у протокола два отдельных сообщения: Parse с текстом и Bind со значениями. Типичная ошибка новичка: `format!("... '{status}'")`, которая работает до первого ника с апострофом или первой атаки."""

[[exercises]]
name = "sqlx_q1"
kind = "question"
question.ru = """Что произойдёт при выполнении?
```rust
let id = 7_i64;
let row = sqlx::query("SELECT username FROM users WHERE id = '$1'")
    .bind(id)
    .fetch_one(&pool)
    .await;
```"""
options.ru = ["вернётся пользователь с id 7", "программа не скомпилируется: sqlx проверяет запрос при сборке", "вернётся ошибка базы: строку '$1' нельзя превратить в число bigint, ведь id имеет этот тип", "вернётся RowNotFound: будет искаться пользователь, чей id равен строке '$1'"]
answer = [2]
explain.ru = """Внутри кавычек `$1` это просто строка из двух символов, а не параметр. Запрос получается такой: `WHERE id = '$1'`, и Postgres пытается превратить текст `$1` в число bigint (тип столбца id) и отвечает ошибкой «invalid input syntax for type bigint» (22P02). Лишний `bind` при этом принимается молча, жалуются на строку. Если бы столбец был текстовым, ошибки не было бы совсем: сравнение с текстом '$1' просто ничего бы не нашло, и вышел бы RowNotFound, то есть тихая ошибка поведения. Компилятор тут бессилен: запросы `query` (в отличие от макроса `query!`) проверяются только при выполнении. Параметр пишется без кавычек, и типизирует его сам Postgres по контексту."""
hint.ru = """Где в протоколе запроса различаются текст и значения, и что сервер считает параметром?"""

[[exercises]]
name = "sqlx3"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Метод выборки выбирается по тому, сколько строк ты ждёшь: «ноль или больше», «ноль или одна», «ровно одна».""", """`fetch_all` отдаёт Vec, `fetch_optional` отдаёт Option, `fetch_one` падает с RowNotFound, если строки нет."""]
why.ru = """Три метода выражают три договорённости. fetch_all: «сколько есть, столько и верни». fetch_optional: «нет строки это нормальный исход». fetch_one: «строка обязана быть, её отсутствие это баг или гонка». Выбор метода это часть контракта функции, и ошибка здесь превращается в 500 на ровном месте (следующая задача)."""

[[exercises]]
name = "sqlx4"
style = "bughunt"
requires = ["postgres"]
hint.ru = ["""Ошибка приходит из метода, который требует ровно одну строку. Прочитай в документации, что делают соседние методы `fetch_*`.""", """Нужен метод, который возвращает `Option<Row>`. А `.ok()` на всём результате не годится: он спрячет и настоящие ошибки."""]
why.ru = """fetch_one на отсутствующей строке даёт RowNotFound, и без разбора он превращается во «внутреннюю ошибку». Самое соблазнительное неверное решение: `.fetch_one(pool).await.ok()`. Оно чинит 404, но заодно превращает упавшую базу в «пользователя нет», и сбой становится невидимым. fetch_optional разделяет эти два исхода честно."""

[[exercises]]
name = "sqlx5"
style = "todo"
requires = ["postgres"]
hint.ru = ["""`execute` возвращает результат команды, а не строки. Посмотри его метод `rows_affected`.""", """Проверку «пост принадлежит автору» не делай отдельным запросом: она живёт в самом WHERE (`id = $1 AND author_id = $2`), и тогда по числу затронутых строк видно, что произошло."""]
why.ru = """rows_affected это единственный честный ответ на вопрос «сработало ли». Проверка владельца внутри WHERE делает «найти и проверить и удалить» одной атомарной командой: SELECT с последующим DELETE оставляет окно, в которое другой запрос успеет сменить автора или удалить пост. Отсутствие подходящих строк для UPDATE и DELETE не ошибка, ошибку из этого делает только твой код, если захочет."""

[[exercises]]
name = "sqlx6"
style = "todo"
requires = ["postgres"]
hint.ru = ["""`query_as` читает строку сразу в структуру, но структуре нужно разрешение читаться из строки. Это делает `derive` от sqlx.""", """`#[derive(sqlx::FromRow)]` на структуре и `sqlx::query_as::<_, User>(...)` вместо `query`. Для детерминированных страниц `ORDER BY` обязан различать любые две строки."""]
why.ru = """FromRow сопоставляет поля и столбцы по имени, а не по порядку, поэтому лишние столбцы в SELECT не мешают, а отсутствующий столбец даёт ошибку в рантайме (следующая задача). Страницы без детерминированного ORDER BY дают дубли и пропуски между запросами: при равных датах строки могут идти в любом порядке, поэтому в сортировку добавлен id."""

[[exercises]]
name = "sqlx7"
style = "fix"
requires = ["postgres"]
hint.ru = ["""Ошибка в рантайме: sqlx ищет столбец с именем поля структуры, а в результате столбец называется по-другому. Чинить можно с любой из двух сторон.""", """Со стороны SQL: псевдоним `столбец AS имя_поля`. Со стороны структуры: атрибут `#[sqlx(rename = "столбец")]` на поле. Но структуру по условию лучше не трогать."""]
why.ru = """Имена в результате запроса это контракт между SQL и структурой, и компилятор его не проверяет: ошибка видна только при выполнении (ColumnNotFound). Псевдоним в запросе обычно лучше атрибута rename: тогда структура независима от схемы базы, а переименование столбца в таблице чинится в одном запросе. Макросы query! проверяют это на этапе компиляции, но им нужна живая база при сборке, поэтому курс начинает с запросов времени выполнения."""

[[exercises]]
name = "sqlx8"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Для одного значения есть `sqlx::query_scalar`: он читает первый столбец первой строки сразу в нужный тип.""", """Флаг «есть ли такая строка» делает `SELECT EXISTS (SELECT 1 FROM ...)`. Для «может не быть» возьми `fetch_optional`."""]
why.ru = """query_scalar убирает церемонию вокруг одного значения. EXISTS лучше, чем COUNT(*) > 0 или выбор всей строки: сервер останавливается на первой найденной. Регистр сравнивается в базе, через lower() с обеих сторон, а не в Rust: так проверка и уникальность опираются на одно правило. Для настоящей гарантии уникальности без учёта регистра нужен ещё и индекс по lower(), но это тема главы про моделирование."""

[[exercises]]
name = "sqlx9"
style = "bughunt"
requires = ["postgres"]
hint.ru = ["""У первой причины в тексте ошибки видно слова про несовпадение типов. Какой тип в Postgres у результата COUNT, и какой Rust-тип ему соответствует?""", """У второй причины в ошибке будет слово null. Что возвращает SUM по набору без строк?""", """COUNT возвращает bigint, это i64. А пустую сумму заменяет `COALESCE(SUM(...), 0)`."""]
why.ru = """COUNT(*) в Postgres всегда bigint, и читать его в i32 нельзя: sqlx не сужает типы молча. Падает это в рантайме, поэтому такую ошибку нужно один раз запомнить. SUM по пустому набору возвращает NULL, а не 0: COALESCE превращает «нет данных» в ноль там, где ноль и есть смысл. Альтернатива, читать в Option<i64>, тоже верна, если вызывающему важно различать «нет данных» и «сумма ноль»."""

[[exercises]]
name = "sqlx_q2"
kind = "question"
question.ru = """Столбец `likes` таблицы posts имеет тип integer. Что даст этот код?
```rust
let avg: f64 = sqlx::query_scalar("SELECT AVG(likes) FROM posts")
    .fetch_one(&pool)
    .await?;
```"""
options.ru = ["8.5, среднее как число с дробью", "ошибка компиляции: AVG нельзя читать в f64", "ошибка в рантайме: результат AVG имеет тип numeric, который с f64 несовместим", "8, потому что likes целое"]
answer = [2]
explain.ru = """AVG от целых возвращает numeric (точное десятичное число), а f64 в sqlx соответствует double precision (float8). Строгая проверка типов тут сработала бы только при выполнении. Лечится приведением в запросе: `AVG(likes)::float8`, или подключением поддержки numeric (крейты bigdecimal или rust_decimal), если нужна точность. Тот же класс ошибок, что COUNT в i32 из задачи: всегда смотри, какой тип Postgres возвращает функция."""
hint.ru = """Что возвращают агрегатные функции Postgres для целых столбцов, и какому типу Rust соответствует результат?"""

[[exercises]]
name = "sqlx10"
style = "bughunt"
requires = ["postgres"]
hint.ru = ["""Столбец без NOT NULL может содержать NULL, а `String` в Rust пустым не бывает.""", """Тип поля для столбца, который может быть NULL, это `Option<T>`. После замены компилятор покажет места, где значение теперь нужно разбирать."""]
why.ru = """Правило простое: допускает ли столбец NULL, так и объявляй поле. NULL в String sqlx не превращает в пустую строку молча (и правильно: «пусто» и «не задано» разные вещи), он падает в рантайме. Option заставляет компилятор показать каждое место, где отсутствие значения надо решить явно. `unwrap_or_default()` чинит падение, но стирает разницу между «не заполнено» и «пустая строка», поэтому решение тут через match."""

[[exercises]]
name = "sqlx11"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Типы Rust, которые sqlx знает для uuid и timestamptz, лежат в крейтах `uuid` и `chrono`: `Uuid` и `DateTime<Utc>`. Их можно передавать в `bind` и читать из строк.""", """Срок строго до: условие `expires_at > $2`, а не `>=`. Идентификатор генерируй в Rust через `Uuid::new_v4()`, а новую строку верни через `RETURNING`."""]
why.ru = """timestamptz соответствует DateTime<Utc>: база хранит момент времени (UTC), а часовой пояс только для показа. NaiveDateTime соответствует timestamp без пояса, и спутать их значит получить сдвиг на часы или ошибку типов. Текущее время параметром, а не `now()` в запросе, это приём для тестируемости: часы можно подвинуть. Граница «строго до» проверена отдельно, потому что `>=` вместо `>` бывает у большинства первых реализаций."""

[[exercises]]
name = "sqlx_q3"
kind = "question"
question.ru = """Столбец `created_at` объявлен как timestamptz. Какой из вариантов прочитает его без ошибки?"""
options.ru = ["`chrono::DateTime<Utc>`", "`chrono::NaiveDateTime`", "`String`", "`i64` (секунды с начала эпохи)"]
answer = [0]
explain.ru = """timestamptz соответствует `DateTime<Utc>`. `NaiveDateTime` предназначен для timestamp без пояса, и sqlx отвергнет такое чтение в рантайме, чтобы ты не потерял часовой пояс молча. String sqlx для timestamptz тоже не отдаст: текстовое представление можно получить только явным `created_at::text` в запросе. i64 не подходит: тип другой. Правило: тип Rust выбирается по типу столбца Postgres, а не по тому, как значение «выглядит»."""
hint.ru = """Какие типы Postgres стоят за NaiveDateTime и за DateTime<Utc>?"""

[[exercises]]
name = "sqlx12"
style = "todo"
requires = ["postgres"]
hint.ru = ["""У enum должен быть `derive(sqlx::Type)`. Но тип в базе называется по-своему и метки там строчные, а у вариантов Rust заглавные: обе вещи задаются атрибутом `#[sqlx(...)]`.""", """`#[sqlx(type_name = "post_visibility", rename_all = "lowercase")]` над enum. Для запроса значение просто идёт в `bind`, читается через `query_scalar`."""]
why.ru = """sqlx не знает, как называется твой тип в Postgres, пока ты не скажешь type_name, и не знает регистр меток, пока не скажешь rename_all. Без rename_all он отправит «Followers», и база ответит «invalid input value for enum». Родной enum даёт защиту на уровне базы, но его трудно менять (добавить метку можно, удалить почти нельзя). Альтернатива: text с CHECK и ручное преобразование в Rust. Сравнение вариантов разобрано в главе про моделирование."""

[[exercises]]
name = "sqlx13"
style = "todo"
requires = ["postgres"]
hint.ru = ["""В Postgres есть сравнение с массивом: `id = ANY($1)`. А sqlx умеет передавать срез `&[i64]` как массив одним параметром.""", """ANY порядок не сохраняет. Положение значения в массиве подскажет функция `array_position(массив, значение)`, по ней можно отсортировать."""]
why.ru = """Один запрос с массивом вместо N запросов или склейки `IN (1,2,3)` строкой: массив это один параметр, поэтому план запроса не зависит от длины списка, а подстановка безопасна. Пустой список с `IN ()` был бы синтаксической ошибкой, а с ANY работает. Этот приём (гидрация списка по id) мы ещё не раз используем, в том числе для ленты. Порядок ANY не обещает, поэтому его восстанавливают сами."""

[[exercises]]
name = "sqlx14"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Ошибку базы sqlx прячет внутри `sqlx::Error::Database`. Из неё можно достать SQLSTATE через `code()`.""", """Нарушение уникальности это код `23505` (в главе про схемы его перечисляли). Остальное заверни в `Db`."""]
why.ru = """«Проверить, потом вставить» это гонка: два запроса пройдут проверку одновременно, и вставят оба. Единственная надёжная проверка живёт в базе (UNIQUE), а приложение только переводит её отказ на язык предметной области. Переводить надо именно 23505, а не любую ошибку: иначе упавшая база выглядит как «тег уже есть». Тест с двенадцатью соперниками показывает, что никаких предварительных SELECT здесь не нужно."""

[[exercises]]
name = "sqlx_q4"
kind = "question"
question.ru = """В таблице tags есть UNIQUE на name. Функция сначала делает `SELECT EXISTS (... WHERE name = $1)`, и если тега нет, делает INSERT. Два пользователя одновременно создают тег `rust`. Что может случиться?"""
options.ru = ["ничего: проверка EXISTS не даст вставить дубль", "второй INSERT тихо ничего не сделает и вернёт успех", "в таблице окажутся два тега rust", "оба увидят «тега нет», один INSERT пройдёт, а второй получит ошибку уникальности"]
answer = [3]
explain.ru = """Между SELECT и INSERT другой запрос успевает вставить такую же строку. Дубль не появится только благодаря UNIQUE: он превратит гонку в ошибку, и проигравший получит 23505 из INSERT, хотя его проверка сказала «можно». Поэтому надёжная схема такая: сразу вставляй, а нарушение уникальности переводи в понятную ошибку. Проверка заранее годится только как подсказка пользователю."""
hint.ru = """Что происходит между двумя запросами подряд, если на сервере работает кто-то ещё?"""

[[exercises]]
name = "sqlx15"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Ошибка базы из `sqlx::Error::Database` умеет сказать не только код, но и имя ограничения: смотри её метод `constraint()`.""", """Заведи `impl From<sqlx::Error> for RegisterError`, тогда в функции хватит оператора `?`. Внутри разбери по имени ограничения; всё незнакомое уходит в `Db`."""]
why.ru = """Код 23505 говорит «что-то уникальное нарушено», имя ограничения говорит «что именно». Поэтому ограничениям в схеме дают имена сами (в главе про схемы это было упомянуто как «не косметика»). Строка с именем это скрытая связь между схемой и кодом: переименуешь ограничение, и ветка перестанет срабатывать молча, поэтому тест на оба случая нужен. Незнакомые ошибки нельзя маскировать под известные."""

[[exercises]]
name = "sqlx16"
style = "scratch"
requires = ["postgres"]
hint.ru = ["""Каркас: структура с полем `pool: PgPool`, `new` кладёт пул в поле, каждый метод обращается к `&self.pool`. Запрос на метод это `const` вида `&str` наверху файла.""", """Для `create` бери `INSERT ... RETURNING` и `query_as`. Для `set_bio` помни, что `Option<&str>` в `bind` превращается в NULL при `None`."""]
why.ru = """Репозиторий собирает SQL в одном месте: что и где читается, видно сразу, и тест репозитория это тест всех запросов сервиса. Константы с запросами решают две вещи: запрос не склеивается из кусочков (нет соблазна подставить значение форматированием) и его можно найти поиском. `Option<&str>` как bind даёт NULL для None, поэтому «стереть» и «пустая строка» остаются разными значениями."""

[[exercises]]
name = "sqlx17"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Транзакция начинается методом пула `begin()` и заканчивается методом `commit()` у полученного значения. Если до `commit` значение просто уничтожить (например, выйти из функции по `?`), всё откатится само.""", """Запросы внутри транзакции выполняются не на пуле, а на самой транзакции: `.execute(&mut *tx)` вместо `.execute(pool)`."""]
why.ru = """Транзакция sqlx откатывается при drop, поэтому `?` посреди функции ничего не ломает: ранний возврат уничтожает tx, и база возвращается к исходному состоянию. Явный rollback нужен редко. Важно выполнять запросы на `&mut *tx`: запрос на пуле возьмёт другое соединение и окажется вне транзакции (разбор в следующей задаче). Счётчик IDENTITY при откате не возвращается: номера пропускаются, и это нормально."""

[[exercises]]
name = "sqlx_q5"
kind = "question"
question.ru = """Что останется в таблице tags после вызова?
```rust
async fn add_temp(pool: &PgPool) -> Result<(), sqlx::Error> {
    let mut tx = pool.begin().await?;
    sqlx::query("INSERT INTO tags (name) VALUES ('temp')")
        .execute(&mut *tx)
        .await?;
    Ok(())
}
```"""
options.ru = ["ничего: транзакция не закоммичена и при уничтожении откатывается", "тег temp: запрос выполнился успешно", "функция не скомпилируется: забыт commit", "тег появится, когда пул закроется"]
answer = [0]
explain.ru = """Транзакция sqlx в начале работы открывает BEGIN, а при drop без commit отправляет откат. Забытый commit это тихая потеря данных: функция вернула Ok, а вставки нет. Компилятор забывчивость не поймает. Хорошая привычка: commit последней строкой перед Ok и тест, который проверяет данные с другого соединения, как делают тесты этой главы."""
hint.ru = """Что делает значение Transaction, когда его уничтожают, не вызвав commit?"""

[[exercises]]
name = "sqlx18"
style = "bughunt"
requires = ["postgres"]
hint.ru = ["""Транзакция принадлежит одному соединению. Какой из запросов в коде выполняется не на нём? Пост пока не закоммичен: другое соединение его не видит.""", """Вспомогательная функция получает пул и берёт для себя другое соединение. Ей нужно передавать не пул, а соединение транзакции (`&mut PgConnection`), и вызывать с `&mut tx`.""", """Поменяй тип параметра на `conn: &mut PgConnection`, а запросы внутри выполняй как `.execute(&mut *conn)`. В вызывающем коде передавай `&mut tx` вместо `pool`: Transaction сам превращается в `&mut PgConnection`."""]
why.ru = """Транзакция это не область кода, а одно конкретное соединение. Любой запрос, ушедший на пул, берёт другое соединение и живёт вне неё: он не видит незакоммиченного поста (отсюда нарушение внешнего ключа) и не откатится. Поэтому функции, которые могут вызываться внутри транзакции, принимают `&mut PgConnection`, а не пул. Эта проблема вернётся в главе про sqlx в сервисах: функция, годная и для пула, и для транзакции, делается обобщённой."""

[[exercises]]
name = "sqlx_q6"
kind = "question"
question.ru = """Пул создан с `max_connections(1)`. Что произойдёт?
```rust
let mut tx = pool.begin().await?;
let n: i64 = sqlx::query_scalar("SELECT count(*) FROM posts")
    .fetch_one(&pool)
    .await?;
tx.commit().await?;
```"""
options.ru = ["вернётся число постов, потому что запрос выполнится внутри транзакции", "зависнет: единственное соединение занято транзакцией, и запрос на пуле ждёт его до тайм-аута получения соединения", "паника: нельзя использовать пул при открытой транзакции", "запрос откроет второе соединение сверх лимита"]
answer = [1]
explain.ru = """Транзакция держит соединение до commit или drop. Запрос на пуле просит другое, а свободных нет, поэтому ждёт `acquire_timeout` (по умолчанию 30 секунд) и падает с PoolTimedOut. С пулом побольше код «работает», но берёт второе соединение и выполняется вне транзакции. Эту ловушку называют исчерпанием пула: на нагрузке тесты, где пул большой, этого не покажут. Правило: внутри транзакции запросы идут только через `&mut *tx`."""
hint.ru = """Сколько соединений держит открытая транзакция, и что делает запрос на пуле, когда свободных нет?"""

[[exercises]]
name = "sqlx19"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Одна строка с несколькими командами через обычный `query` не выполнится: в протоколе с параметрами команда должна быть одна. Для скриптов у sqlx есть отдельная функция.""", """`sqlx::raw_sql(текст).execute(pool)` отправляет скрипт простым запросом, весь текст сразу. Простой запрос сервер выполняет как одну неявную транзакцию, это и даёт «всё или ничего».""", """Схему для всех соединений пула задают параметром подключения, а не командой `SET`, которая действует на одно соединение. Смотри `PgConnectOptions::from_str(url)?` и его метод `options([("search_path", схема)])`, затем `PgPoolOptions::new().connect_with(options)`."""]
why.ru = """raw_sql нужен для скриптов: обычный query отправляет команду через расширенный протокол, где допустим один оператор. Простой запрос исполняется как одна неявная транзакция, и поэтому опечатка в середине файла не оставляет полупримененной схемы. С search_path ошибка вероятнее: `SET search_path` в одном запросе меняет только то соединение, которое его выполнило, а пул держит несколько, и остальные ищут таблицы в public. Параметр подключения применяется к каждому новому соединению пула. Имя схемы подставляется в SQL форматированием, потому что идентификаторы нельзя передать параметром, поэтому такое имя должно приходить только из конфигурации."""

