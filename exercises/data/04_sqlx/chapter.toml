hint.ru = ["""Начни с `map_error`: он понадобится всем методам. Потом `create` с `INSERT ... RETURNING` и `query_as`, остальное по аналогии с задачами главы.""", """Ошибки раскладывай по `db.code()` и `db.constraint()`: 23505 с именем users_username_uniq или users_email_uniq, 23503 это NotFound, 23514 это Invalid. `update_bio` и `delete` смотрят на `rows_affected()`.""", """Для `register_with_first_post` открой `self.pool.begin()`, оба запроса выполняй на `&mut *tx`, в конце `commit()`. Ранний возврат по `?` откатит всё сам."""]
why.ru = """Репозиторий собирает вместе всё, что было в главе: константы с параметрами, query_as с RETURNING, fetch_optional против fetch_one, перевод ошибок по SQLSTATE и имени ограничения, ANY с массивом, транзакция на &mut *tx. Главная мысль в том, что вызывающий код получает доменные ошибки (UsernameTaken, NotFound), а не sqlx::Error, и ему всё равно, какая база стоит за трейтом. Гонку за ник решает ограничение UNIQUE, а не проверка заранее: репозиторий только переводит его отказ. Ловушки: проглотить недоступную базу как NotFound, вставить пользователя и пост двумя запросами на пуле, потерять порядок при ANY."""

