test_command = ["cargo", "make", "check"]
requires = ["postgres", "nats"]
hint.ru = [
"""Своя схема у сервиса это `CREATE SCHEMA IF NOT EXISTS` до пула и `SET search_path TO <схема>` в
`after_connect` каждого соединения. Тогда SQL в репозиториях пишется без имени схемы, а тесты расходятся по схемам.""",
"""«Ник занят» узнавай по SQLSTATE 23505 и имени ограничения, а не по тексту ошибки. Частичный уникальный индекс
`... WHERE NOT deleted` освобождает ник стёртого пользователя без удаления строки.""",
"""Факт в outbox пишется тем же соединением транзакции, что и изменение: передавай `&mut tx` в `record_fact`.
Версия агрегата растёт одной командой `INSERT ... ON CONFLICT DO UPDATE ... RETURNING version`.""",
"""Ротация refresh под `SELECT ... FOR UPDATE`: два одновременных обмена одного токена не должны оба пройти.
Повтор уже использованного гасит семейство, и это отдельная транзакция после ответа на первую.""",
]
story.ru = """Данные соцсети живут в Postgres: у каждого сервиса своя схема, ник занят по имени ограничения, пост и
его событие пишутся одной транзакцией, а релей берёт неотправленное из таблицы. Перезапуск стека больше ничего не
проигрывает: пользователи, посты и лайки уже на месте."""
