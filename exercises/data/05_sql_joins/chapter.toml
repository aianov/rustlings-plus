[chapter]
title.en = "JOIN"
title.ru = "JOIN: соединение таблиц"

[[chapter.visuals]]
file = "visuals/join_rows.html"
title.ru = "JOIN: строки ищут пары, условие в ON и в WHERE"

[[exercises]]
name = "pgjoin1"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Таблицы соединяет `JOIN ... ON условие`. Какой столбец posts указывает на какой столбец users?""", """Форма такая: `FROM таблица1 псевдоним1 JOIN таблица2 псевдоним2 ON ...`. В списке столбцов ставь псевдоним перед точкой."""]
why.ru = """JOIN склеивает строки двух таблиц по условию в ON. Имена-псевдонимы (`p`, `u`) здесь не прихоть, а необходимость: в обеих таблицах есть столбец id, и следующая задача покажет, что бывает без них. Посты без автора в INNER JOIN не попадают, но внешний ключ author_id NOT NULL гарантирует, что таких нет."""

[[exercises]]
name = "pgjoin2"
style = "fix"
requires = ["postgres"]
hint.ru = ["""В тексте ошибки сказано, какой именно столбец неоднозначен. Какие столбцы есть в обеих таблицах?""", """Перед каждым столбцом пиши таблицу или её псевдоним (`p.id`), а выходные имена задавай через `AS`."""]
why.ru = """Если столбец с таким именем есть в обеих таблицах, Postgres отказывается угадывать. Привычка писать `псевдоним.столбец` везде, где таблиц больше одной, лечит это раз и навсегда и заодно делает запрос читаемым. AS нужен, потому что без него оба столбца id в результате назывались бы одинаково, и клиент, который читает по имени, получил бы одно из двух."""

[[exercises]]
name = "pgjoin3"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Обычный JOIN оставляет только пары, где совпадение нашлось. Нужен вид соединения, который сохраняет все строки одной стороны.""", """`LEFT JOIN` сохраняет все строки левой таблицы (той, что стоит перед словом JOIN), а недостающую правую сторону заполняет NULL."""]
why.ru = """LEFT JOIN отвечает на вопрос «все строки слева, и что нашлось справа». Если справа ничего нет, правые столбцы получают NULL, а строка слева всё равно остаётся. Поэтому пользователи с тремя постами идут тремя строками, а без постов одной. Что левая таблица именно users, зависит от порядка в запросе, и это привычная путаница при перестановке таблиц."""

[[exercises]]
name = "pgjoin_q1"
kind = "question"
question.ru = """Таблица `a` с id 1, 2, 3. Таблица `b` с четырьмя строками: a_id равны 1, 1, 2 и NULL. Сколько строк вернёт `SELECT * FROM a LEFT JOIN b ON b.a_id = a.id`?"""
options.ru = ["3", "4", "5", "6"]
answer = [1]
explain.ru = """Строка a1 находит две пары (b с a_id = 1), a2 одну, a3 ни одной и остаётся с NULL: итого 2 + 1 + 1 = 4. Строка b с a_id NULL никому не подходит: NULL не равен ничему, в том числе другому NULL, а LEFT JOIN сохраняет только левую сторону, поэтому она пропадает. INNER JOIN дал бы 3 строки, а чтобы сохранить обе стороны, нужен FULL JOIN (в соцсети почти не встречается)."""
hint.ru = """Пройди по строкам левой таблицы и посчитай, сколько пар получает каждая."""

[[exercises]]
name = "pgjoin4"
style = "fix"
requires = ["postgres"]
hint.ru = ["""Условие на столбец правой таблицы в WHERE применяется после соединения. Что в этот момент лежит в `p.created_at` у пользователя без поста?""", """Условие, которое должно только решать, какие посты подцепить, а не какие пользователи останутся, переезжает из WHERE в ON."""]
why.ru = """После LEFT JOIN у пользователей без подходящего поста p.created_at равно NULL, а `NULL >= '...'` не истинно, и WHERE выбрасывает строку: LEFT JOIN превращается в INNER JOIN. Условие про правую таблицу, которое задаёт «какие правые строки допускаются к соединению», живёт в ON. Условие про левую таблицу, которое должно отфильтровать результат, живёт в WHERE. Заплатка `OR p.id IS NULL` не спасает: она вернёт пользователей без постов вообще, но потеряет тех, у кого посты есть только старые (как bob)."""

[[exercises]]
name = "pgjoin_q2"
kind = "question"
question.ru = """Что вернёт запрос?
```sql
SELECT u.username, p.id
FROM users u
LEFT JOIN posts p ON p.author_id = u.id AND u.username = 'alice'
```"""
options.ru = ["только строки alice", "пусто, потому что условие на левую таблицу в ON выбрасывает остальных", "ошибку: в ON нельзя сравнивать со строкой", "всех пользователей; посты подцеплены только к alice, у остальных p.id равен NULL"]
answer = [3]
explain.ru = """В LEFT JOIN условие в ON решает только, подходит ли пара, и никогда не удаляет левые строки: если пары нет, строка слева остаётся с NULL. Условие по левой таблице в ON поэтому не работает как фильтр, это известная ловушка. Чтобы оставить только alice, условие нужно в WHERE. Правило: ON описывает соединение, WHERE описывает результат."""
hint.ru = """Что происходит в LEFT JOIN с левой строкой, для которой не нашлось пары?"""

[[exercises]]
name = "pgjoin5"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Цепочка такая: лайк ведёт к посту, пост к автору, а лайк ещё и к лайкнувшему. Таблицу users придётся подключить дважды.""", """Одну и ту же таблицу можно подключить под двумя разными псевдонимами: `JOIN users liker ON ...` и `JOIN users author ON ...`."""]
why.ru = """JOIN можно цеплять сколько угодно, каждый следующий опирается на столбцы уже подключённых. Одна таблица в двух ролях требует двух псевдонимов: иначе непонятно, о каком users речь. Чтобы не запутаться, называй псевдонимы по роли (`liker`, `author`), а не по таблице. Этот приём в ленте встретится снова."""

[[exercises]]
name = "pgjoin6"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Это self join: таблица подключается к самой себе под другим псевдонимом, как будто это две разные таблицы.""", """Нужен LEFT, чтобы пришедшие сами не пропали. Подключи users второй раз под псевдонимом по роли и свяжи его с invited_by."""]
why.ru = """Self join не особый вид соединения, а обычный JOIN с двумя псевдонимами одной таблицы. Так читают деревья и цепочки, где строка ссылается на строку той же таблицы (приглашения, категории, ответы на комментарии). Соединение INNER молча потеряло бы корни дерева, у которых ссылки нет."""

[[exercises]]
name = "pgjoin7"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Нужны пользователи, для которых в posts и в likes не нашлось ничего. Как в результате LEFT JOIN выглядит «ничего не нашлось»?""", """После LEFT JOIN у таких пользователей правые столбцы NULL. Проверяй на NULL любой столбец, который в самой таблице не бывает пустым, и делай это в WHERE."""]
why.ru = """Это анти-join: оставить строки слева, для которых справа ничего нет. Классическая запись, LEFT JOIN плюс `IS NULL` на ключе правой таблицы; равноправная запись NOT EXISTS. Проверять надо столбец, который в таблице не может быть NULL (ключ), иначе NULL от настоящей пустой строки спутается с NULL от отсутствия пары. Два анти-join подряд работают, потому что у «ничего» нет размножения строк."""

[[exercises]]
name = "pgjoin_q3"
kind = "question"
question.ru = """В posts столбец `body` допускает NULL (черновики без текста). Запрос ищет пользователей без постов: `... FROM users u LEFT JOIN posts p ON p.author_id = u.id WHERE p.body IS NULL`. Кого он вернёт?"""
options.ru = ["пользователей без постов и тех, у кого есть пост с пустым body", "только пользователей без постов", "только тех, у кого пост с пустым body", "никого: IS NULL нельзя после JOIN"]
answer = [0]
explain.ru = """NULL в p.body возникает в двух случаях: пара не нашлась (все правые столбцы NULL) или пара нашлась, но body в ней пустой. Отличить их по такому столбцу нельзя. Поэтому для анти-join проверяют столбец, который в таблице никогда не NULL, обычно первичный ключ: `p.id IS NULL`."""
hint.ru = """Откуда в результате LEFT JOIN может взяться NULL в столбце правой таблицы?"""

[[exercises]]
name = "pgjoin8"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Дней без постов нет в posts, значит, ряд дат должен прийти откуда-то ещё и стоять слева. Ряд дат, которого нет в данных, создают функцией, о ней раздел «Пустые места» в README.""", """`FROM generate_series(date '2026-10-01', date '2026-10-07', interval '1 day') AS d LEFT JOIN posts p ON p.created_at::date = d::date`."""]
why.ru = """В данных нет того, чего не было: дни без постов не откуда выбрать. Поэтому ряд дат создаётся отдельно (generate_series), и к нему пристыковываются факты через LEFT JOIN. Это шаблон всех отчётов «по дням, включая пустые»: слева календарь, справа данные. Если поменять стороны или поставить INNER, пустые дни пропадут и график «сломается» без единой ошибки. Приведение к date в ON сравнивает дни, а не моменты времени."""

[[exercises]]
name = "pgjoin9"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Дружба это когда в follows есть обе строки: (A, B) и (B, A). Как найти пару строк одной таблицы по такому условию?""", """Подключи follows к самой себе: условие ON меняет роли местами. Чтобы пара не выдавалась дважды, оставь только порядок: у первого в паре id меньше."""]
why.ru = """Self join по составному условию: вторая строка должна зеркально совпасть с первой. Без `f1.follower_id < f1.followee_id` каждая дружба пришла бы в двух зеркальных вариантах, (A, B) и (B, A). Условие с `<` заодно отбрасывает подписку на самого себя. Имена подключаются после того, как пары найдены: так читается легче, чем накручивать users внутрь соединения follows с follows."""

[[exercises]]
name = "pgjoin_q4"
kind = "question"
question.ru = """В follows строки: (1,2), (2,1), (2,3), (3,2), (3,1). Запрос находит зеркальные пары, но забыл условие `f1.follower_id < f1.followee_id`:
```sql
SELECT f1.follower_id, f1.followee_id
FROM follows f1
JOIN follows f2 ON f2.follower_id = f1.followee_id AND f2.followee_id = f1.follower_id
```
Сколько строк он вернёт?"""
options.ru = ["2", "3", "4", "5"]
answer = [2]
explain.ru = """Зеркальных пар две, (1,2)-(2,1) и (2,3)-(3,2), но каждую запрос видит с обеих сторон: f1 может быть любой из двух строк пары. Итого 4 строки. Строка (3,1) зеркала не имеет (нет (1,3)) и отпадает. Условие `<` оставляет из каждой пары по одной строке."""
hint.ru = """Какие строки f1 найдут себе пару f2? Для каждой зеркальной пары подставь обе стороны."""

[[exercises]]
name = "pgjoin_feed"
style = "scratch"
requires = ["postgres"]
quiz = true
hint.ru = ["""Разложи на части: чьи посты (follows), чьи нельзя (blocks), что лайкнул я (likes). Часть условий «есть или нет пары» делается LEFT JOIN, а параметр смотрящего входит в условие ON, а не в WHERE.""", """Лайки: подключи likes слева, а в ON поставь и связь с постом, и условие на смотрящего. Блокировки: то же самое, а в WHERE оставь тех, у кого пары не нашлось.""", """Флаг: `(l.user_id IS NOT NULL) AS liked_by_me`. Подписки: `follows f` с условием `f.follower_id = $1`, пост берётся по `p.author_id = f.followee_id`. Порядок: `ORDER BY p.created_at DESC, p.id DESC`."""]
why.ru = """Это три приёма в одном запросе. Подписки это обычный JOIN: нет подписки, нет поста. «Я лайкнул» это LEFT JOIN с параметром смотрящего в ON: условие в ON ограничивает, какие лайки считаются, и пост остаётся даже без лайка; в WHERE оно выбросило бы нелайкнутые посты, а без условия на пользователя посты размножились бы по числу лайков. Блокировки это анти-join с тем же параметром: проверяется блокировка именно смотрящего, а не чья-нибудь. Из таких кирпичей и состоит лента."""
