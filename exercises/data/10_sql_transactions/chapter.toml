[[exercises]]
name = "pgtx1"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Каждый запрос на `pool` берёт своё соединение и сразу фиксируется. Нужно, чтобы оба шли в одном соединении и фиксировались вместе.""", """`let mut tx = pool.begin().await?;`, запросы выполняй на `&mut *tx`, в конце `tx.commit().await?`. Если до commit вернулась ошибка (`?`), транзакция откатывается сама при уничтожении."""]
why.ru = """Транзакция превращает несколько команд в одну: либо все изменения видны, либо ни одного. Запросы прямо на pool этого не умеют, у каждого своё соединение и свой COMMIT. С `pool.begin()` ошибка в любой команде выходит через `?`, `tx` уничтожается без commit, и sqlx делает ROLLBACK. Забытый `commit` это тоже откат: данные тихо пропадут, поэтому тест проверяет и успешный путь."""

[[exercises]]
name = "pgtx2"
style = "fix"
requires = ["postgres"]
hint.ru = ["""Ошибка внутри транзакции не только отвергает свою команду: Postgres переводит всю транзакцию в состояние «aborted», и до ROLLBACK любая команда получает 25P02. COMMIT такой транзакции работает как откат.""", """Лучше, чем ловить ошибку, не вызывать её: пусть вставка занятого ника просто ничего не делает (ON CONFLICT), а число добавленных строк берётся из ответа базы."""]
why.ru = """После ошибки транзакция «отравлена»: следующие команды отвечают «current transaction is aborted», а COMMIT тихо превращается в ROLLBACK. Игнорировать ошибку (`.is_ok()`) значит продолжать жить внутри такой транзакции. Есть два выхода: не создавать ошибку (`ON CONFLICT DO NOTHING`, как здесь) или ограничить ошибку точкой сохранения (следующая задача). Число реально добавленных строк берётся из `rows_affected()`, а не из догадок."""

[[exercises]]
name = "pgtx3"
style = "todo"
requires = ["postgres"]
hint.ru = ["""После первой неудачной вставки транзакция «aborted», и следующие вставки падают. Нужно откатывать только неудачный шаг.""", """Точка сохранения (SAVEPOINT) это вложенная транзакция: в sqlx это `tx.begin().await?` на уже открытой транзакции (нужен `use sqlx::Acquire`). Удачный шаг подтверждаем `commit`, неудачный `rollback`."""]
why.ru = """SAVEPOINT даёт откат «части» транзакции: ошибка внутри точки сохранения откатывает только её, а внешняя транзакция остаётся рабочей. Здесь каждая привязка в своей точке: неудачная вставка уходит в откат, удачные остаются, и весь пакет подтверждается одним `commit`. Цена: точка сохранения создаёт подтранзакцию, на очень больших циклах это заметно (сотни тысяч), тогда проще отфильтровать заранее (`INSERT ... SELECT ... WHERE EXISTS`)."""

[[exercises]]
name = "pgtx_q1"
kind = "question"
question.ru = """Внутри транзакции команда A завершилась ошибкой, ты её проигнорировал и выполнил безобидную команду B, затем COMMIT. Что произойдёт?"""
options.ru = ["B выполнится и сохранится, A пропадёт", "всё откатится: B получит ошибку «current transaction is aborted», COMMIT превратится в ROLLBACK", "COMMIT вернёт ошибку и данные сохранятся частично", "B выполнится, а потом обе команды откатятся автоматически"]
answer = [1]
explain.ru = """После ошибки Postgres помечает транзакцию как прерванную (SQLSTATE 25P02 для всех следующих команд). Единственное, что можно сделать, это ROLLBACK (всей транзакции или до точки сохранения). COMMIT в таком состоянии не фиксирует ничего: он отвечает тегом ROLLBACK. Чтобы продолжить после ожидаемой ошибки, нужна точка сохранения."""
hint.ru = """Есть ли у прерванной транзакции другой допустимый конец, кроме отката?"""

[[exercises]]
name = "pgtx4"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Транзакция и «другое соединение» это разные соединения пула. Запрос на `pool` берёт новое соединение, а запрос на `&mut *tx` идёт внутри открытой транзакции.""", """Считай `count(*)` дважды: через `&mut *tx` и через `pool`, до `rollback`. Для xmin сравни `xmin::text::bigint` с `txid_current() % 4294967296`."""]
why.ru = """MVCC хранит несколько версий строки: каждая помнит, какая транзакция её создала (xmin) и какая удалила (xmax). Видимость решает снимок: чужая незакоммиченная версия невидима, своя видима. Поэтому читатели не ждут писателей, а писатели читателей. Номер транзакции в xmin это то, по чему база и определяет «чья это версия». Откат делает версию мёртвой, и позже VACUUM её уберёт."""

[[exercises]]
name = "pgtx5"
style = "todo"
requires = ["postgres"]
hint.ru = ["""У Postgres по умолчанию уровень изоляции READ COMMITTED: каждая команда получает свежий снимок. Нужен уровень, где снимок один на всю транзакцию.""", """При начале транзакции уровень задаётся словами `BEGIN ISOLATION LEVEL ...`. Какой уровень фиксирует снимок на первом запросе?"""]
why.ru = """В READ COMMITTED (по умолчанию) каждая команда видит все коммиты, сделанные до её начала, поэтому два чтения в одной транзакции могут дать разное (неповторяемое чтение). REPEATABLE READ берёт снимок при первом запросе и держит его до конца транзакции, отчёт получается согласованным. Цена: при параллельной правке тех же строк придётся ловить ошибки 40001 (следующие задачи), поэтому для отчётов только на чтение этот уровень удобен."""

[[exercises]]
name = "pgtx_q2"
kind = "question"
question.ru = """Уровень изоляции READ COMMITTED. Транзакция A читает `SELECT count(*) FROM posts` и получает 10. Транзакция B вставляет пост и делает COMMIT. A читает то же ещё раз. Что получит A?"""
options.ru = ["10, снимок один на всю транзакцию", "11, каждая команда видит все коммиты до её начала", "10 или 11 случайно", "ошибку 40001"]
answer = [1]
explain.ru = """В READ COMMITTED снимок берётся на каждую команду, а не на транзакцию. Вторая команда A начинается после коммита B и видит его. Это называется неповторяемым чтением и допустимо на этом уровне. Чтобы получить 10 оба раза, нужен REPEATABLE READ."""
hint.ru = """На какой момент берётся снимок на этом уровне: на начало транзакции или на начало каждой команды?"""

[[exercises]]
name = "pgtx6"
style = "bughunt"
requires = ["postgres"]
hint.ru = ["""Два параллельных вызова прочитали 5 и оба записали 6. Какая часть кода ответственна за то, что вычисление «плюс один» произошло в приложении, а не в базе?""", """Пусть прибавляет сама база: `UPDATE ... SET views = views + 1`. Оператор берёт блокировку строки и читает актуальное значение, параллельные обновления выстраиваются в очередь."""]
why.ru = """Классическое потерянное обновление: «прочитал, посчитал в коде, записал» не атомарно, и между чтением и записью успевает вмешаться другой. Лечение не в большем числе проверок, а в том, чтобы вычисление перенести в базу: `SET views = views + 1` выполняется под блокировкой строки и всегда видит свежее значение. Если новое значение нужно считать в приложении, читают через `SELECT ... FOR UPDATE` в транзакции (следующая задача)."""

[[exercises]]
name = "pgtx7"
style = "bughunt"
requires = ["postgres"]
hint.ru = ["""Все двенадцать читают 100, все решают, что хватает, и все списывают. Нужно, чтобы читающий «забронировал» строку до решения.""", """`SELECT ... FOR UPDATE` в транзакции блокирует строку до конца транзакции: следующий читающий подождёт и увидит уже уменьшенное значение. (Можно и одним `UPDATE ... WHERE points >= $2`.)"""]
why.ru = """Проверка условия и действие по нему обязаны быть атомарными. `FOR UPDATE` читает строку и держит блокировку до COMMIT: второй клиент не может ни обновить её, ни взять такую же блокировку, пока первый не закончит, а когда дождётся, видит свежее значение (в READ COMMITTED перечитывает строку). Альтернатива без явной блокировки, условный `UPDATE ... WHERE points >= $2` с проверкой `rows_affected`, часто проще и короче. Выбор между ними: нужна ли тебе прочитанная строка в коде."""

[[exercises]]
name = "pgtx8"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Ошибка 40001 («could not serialize access») значит: транзакция проиграла гонку, но её можно выполнить заново с самого начала и на этот раз увидеть новое значение.""", """Оберни всю транзакцию (BEGIN, чтение, запись, COMMIT) в цикл. Ошибку базы проверяй так: `Err(sqlx::Error::Database(e)) if e.code().as_deref() == Some("40001")`. Ограничь число попыток."""]
why.ru = """REPEATABLE READ не даёт перезаписать строку, изменённую после твоего снимка: вместо тихой потери обновления ты получаешь ошибку 40001. Это не сбой, а часть контракта уровня: приложение обязано повторять транзакцию. Повторять нужно всю транзакцию, включая чтение, потому что старое чтение устарело. Без ограничения числа попыток цикл может крутиться вечно при постоянной конкуренции, и ошибку тогда лучше вернуть наверх."""

[[exercises]]
name = "pgtx_q3"
kind = "question"
question.ru = """Уровень REPEATABLE READ. Транзакция A начала и прочитала строку (значение 5). Транзакция B изменила её на 6 и закоммитила. Что произойдёт, если A теперь выполнит `UPDATE ... SET v = v + 1` для этой строки?"""
options.ru = ["запишет 7: UPDATE всегда использует актуальное значение", "запишет 6: прибавит к своей копии 5", "получит ошибку 40001 «could not serialize access due to concurrent update»", "будет ждать, пока B что-нибудь изменит ещё"]
answer = [2]
explain.ru = """Снимок A остался прежним, а строка успела измениться после него. Тихо переписать чужое изменение уровень REPEATABLE READ не разрешает: UPDATE завершается ошибкой 40001. На READ COMMITTED тот же UPDATE перечитал бы строку и записал 7."""
hint.ru = """Может ли транзакция со старым снимком изменить строку, которая изменилась уже после снимка?"""

[[exercises]]
name = "pgtx9"
style = "bughunt"
requires = ["postgres"]
hint.ru = ["""Транзакции пишут в разные строки (разные посты), поэтому блокировки строк постов их не разводят. Но условие общее: «количество закреплённых у автора».""", """Нужна общая точка, на которой все закрепляющие этого автора выстроятся в очередь. Например, строка самого автора: заблокируй её в начале транзакции (`SELECT ... FOR UPDATE`)."""]
why.ru = """Write skew: две транзакции читают общее условие, каждая решает, что можно, и пишут в разные строки, поэтому блокировки строк их не сталкивают. Результат нарушает правило, которого нет ни в одной отдельной строке. Лечение «через общую строку»: все, кого связывает правило, берут блокировку одной и той же строки (здесь автора), и проверка выполняется по очереди. Другой путь, уровень SERIALIZABLE, в следующей задаче."""

[[exercises]]
name = "pgtx_q4"
kind = "question"
question.ru = """Две транзакции одновременно (READ COMMITTED): каждая считает закреплённые посты автора (их 2), видит «меньше трёх» и закрепляет разные посты. Какой итог?"""
options.ru = ["закреплено 3, вторая транзакция увидит конфликт и упадёт", "закреплено 4: ни одна проверка не видела чужую запись, а блокировки разных строк не пересекаются", "закреплено 3: Postgres сам сериализует такие транзакции", "закреплено 2: обе откатятся"]
answer = [1]
explain.ru = """Блокировки на уровне строк мешают двум транзакциям изменять одну и ту же строку, но здесь строки разные. Условие «не больше трёх» связывает строки логически, а база об этом не знает. Каждая проверка прошла на своём снимке, и вместе они нарушили правило. Это и есть write skew. Помогают явная блокировка общей строки или уровень SERIALIZABLE."""
hint.ru = """Конфликтуют ли транзакции по строкам, которые они записывают?"""

[[exercises]]
name = "pgtx10"
style = "todo"
requires = ["postgres"]
hint.ru = ["""SERIALIZABLE гарантирует, что результат такой же, как если бы транзакции шли строго по очереди. Если параллельное выполнение это нарушит, одну из транзакций база прервёт.""", """Уровень задаётся в начале транзакции: `SET TRANSACTION ISOLATION LEVEL SERIALIZABLE` первой командой. Проигравшая транзакция получает 40001, её нужно выполнить заново (весь `attempt`), как в `pgtx8`."""]
why.ru = """SERIALIZABLE в Postgres (SSI) следит за зависимостями «прочитал то, что другой потом изменил». Когда образуется опасный цикл, как в write skew, одну транзакцию прерывают с 40001. Плюс: правило защищено без явных блокировок и без знания, какие строки блокировать. Минус: приложение обязано повторять транзакции, ложных срабатываний тоже хватает, и при высокой конкуренции повторов много. Явная блокировка общей строки проще и предсказуемее, SERIALIZABLE выигрывает там, где неизвестно, кто с кем может конфликтовать."""

[[exercises]]
name = "pgtx11"
style = "bughunt"
requires = ["postgres"]
hint.ru = ["""Проверка «нет такого» в одном запросе и вставка в другом оставляют щель, в которую вклинивается второй клиент. Такую щель не закрыть кодом приложения.""", """Закрыть её может только база: ограничение уникальности. А вставка может сама сообщить, удалась ли она: `INSERT ... ON CONFLICT DO NOTHING` и `rows_affected()`."""]
why.ru = """«Проверил, потом вставил» (check-then-act) это гонка, сколько ни добавляй проверок: между ними всегда есть окно. Единственный надёжный способ, поручить проверку тому, кто видит всех сразу: ограничению UNIQUE. Вставка с ON CONFLICT превращает проигрыш в обычный ответ «0 строк» вместо исключения. Тот же принцип применим везде, где что-то должно быть единственным: подписка (пара), лайк (пара), идемпотентный ключ запроса."""

[[exercises]]
name = "pgtx12"
style = "bughunt"
requires = ["postgres"]
hint.ru = ["""T1 держит строку 1 и ждёт строку 2, T2 держит строку 2 и ждёт строку 1. Выхода нет, база через секунду прерывает одну из них.""", """Дедлок возможен, только если транзакции берут блокировки в разном порядке. Если порядок всегда одинаковый (скажем, по возрастанию id), цикла ожидания быть не может."""]
why.ru = """Дедлок это цикл ожиданий: каждый держит то, что нужно соседу. Postgres находит его за `deadlock_timeout` (по умолчанию 1 секунда) и прерывает одну транзакцию с 40P01, так что вечно висеть нечему, но запрос пользователя упадёт. Устранить можно единым порядком блокировок: любая пара строк берётся по возрастанию id независимо от того, кто «первый» по смыслу запроса. Второе средство, повтор после 40P01, лечит симптом, а не причину."""

[[exercises]]
name = "pgtx_q5"
kind = "question"
question.ru = """Транзакция A держит блокировку строки 1 и ждёт строку 2. Транзакция B держит строку 2 и ждёт строку 1. Что сделает Postgres?"""
options.ru = ["обе будут ждать вечно, пока администратор не вмешается", "примерно через секунду прервёт одну из них с ошибкой 40P01, вторая продолжит", "выполнит обе по очереди, ничего не заметите", "прервёт обе"]
answer = [1]
explain.ru = """Postgres сам ищет циклы ожиданий. Когда ожидание длится дольше `deadlock_timeout` (1 секунда по умолчанию), запускается проверка, и если цикл найден, одна из транзакций прерывается с SQLSTATE 40P01. Остальные получают свои блокировки. Выжившая транзакция продолжает, а прерванной приложение должно повторить."""
hint.ru = """Может ли цикл ожиданий разрешиться сам, без вмешательства базы?"""

[[exercises]]
name = "pgtx13"
style = "todo"
requires = ["postgres"]
hint.ru = ["""У Postgres несколько уровней блокировки строки. Сильнейшая защищает от всего, в том числе от проверки внешних ключей других таблиц, которым ключ строки нужен для сверки.""", """`FOR NO KEY UPDATE` блокирует изменение строки, но не мешает `FOR KEY SHARE`, который берёт проверка внешнего ключа. Обычный UPDATE, не меняющий ключ, берёт именно её."""]
why.ru = """Блокировки строк бывают разной силы: FOR UPDATE конфликтует со всем, FOR NO KEY UPDATE оставляет место для FOR KEY SHARE (его берёт вставка в дочернюю таблицу, чтобы строка-родитель не исчезла). Если правка не меняет ключ, достаточно NO KEY UPDATE: правки идут друг за другом, а лайки не ждут. Типичный симптом избыточной блокировки: дочерние вставки начинают «зависать» под нагрузкой на родителя."""

[[exercises]]
name = "pgtx14"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Обычный `FOR UPDATE` ждёт, сколько понадобится. Для «не ждать совсем» и «ждать не дольше» у Postgres есть отдельные средства.""", """`FOR UPDATE NOWAIT` вместо ожидания сразу отвечает ошибкой с кодом 55P03. Для ограниченного ожидания задай `lock_timeout` для транзакции (`set_config('lock_timeout', '300ms', true)`): по истечении та же ошибка 55P03."""]
why.ru = """Ожидание блокировки по умолчанию бесконечно, и под нагрузкой это очередь запросов, держащих соединения. NOWAIT превращает «занято» в мгновенный отказ, который приложение показывает как «уже правят». `lock_timeout` ограничивает ожидание сверху и годится, когда короткая очередь допустима. Обе дают один SQLSTATE 55P03, поэтому его обрабатывают отдельно от прочих ошибок. `SET LOCAL` не принимает параметры, поэтому используют `set_config(..., true)`."""

[[exercises]]
name = "pgtx15"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Нужны два разных источника. Кто блокирует конкретный процесс, отвечает специальная функция; кто вообще ждёт, видно в системном представлении блокировок.""", """`pg_blocking_pids(pid)` возвращает массив, `unnest` развернёт его в строки. В `pg_locks` ожидающие это строки с `granted = false`."""]
why.ru = """Когда «всё зависло», нужно быстро узнать, кто держит дверь. `pg_blocking_pids` даёт ответ напрямую, учитывая очереди блокировок, а `pg_locks` показывает все блокировки и ожидания (`granted = false`). В реальной диагностике эти номера сводят с `pg_stat_activity`, чтобы увидеть запрос и время начала транзакции. Самый частый виновник: забытая открытая транзакция (`idle in transaction`), которая держит блокировки и ничего не делает."""

[[exercises]]
name = "pgtx16"
style = "scratch"
requires = ["postgres"]
hint.ru = ["""Если все воркеры просят «самую раннюю», они упираются в одну строку. Один выигрывает, остальные ждут, а когда дождутся, строка уже не «queued».""", """Блокировка с пропуском: `FOR UPDATE SKIP LOCKED` обходит строки, уже занятые другими, и берёт следующую. Выбор и пометка должны быть одним оператором: `UPDATE ... WHERE id = (SELECT ... LIMIT 1) RETURNING id`."""]
why.ru = """SKIP LOCKED превращает таблицу в очередь: воркер берёт первую незанятую строку и не ждёт тех, что уже у других. Без него все воркеры выстраиваются в очередь на самой ранней задаче, и параллелизм пропадает; хуже, что после ожидания условие `status = 'queued'` уже ложно, и воркер уходит с пустыми руками. Выбор и пометка в одном операторе не оставляют окна между ними. Минус SKIP LOCKED: порядок обработки перестаёт быть строгим, это очередь, а не журнал."""

[[exercises]]
name = "pgtx_q6"
kind = "question"
question.ru = """В очереди три задачи со статусом queued. Воркер A выполнил `SELECT ... WHERE status = 'queued' ORDER BY id FOR UPDATE SKIP LOCKED LIMIT 1` в открытой транзакции и получил задачу 1. Воркер B выполняет тот же запрос. Что он получит?"""
options.ru = ["задачу 1, после того как A закончит", "задачу 2", "пустой результат, потому что очередь «занята»", "ошибку блокировки"]
answer = [1]
explain.ru = """SKIP LOCKED пропускает строки, заблокированные другими транзакциями, и продолжает со следующей. B сразу получит задачу 2 без ожидания. Пустой результат был бы только если бы все подходящие строки оказались заблокированы."""
hint.ru = """Что делает SKIP LOCKED со строкой, которую уже держит другая транзакция?"""

[[exercises]]
name = "pgtx17"
style = "bughunt"
requires = ["postgres"]
hint.ru = ["""Выбор задачи и пометка «взято» идут двумя запросами, и между ними четыре воркера успевают выбрать одно и то же.""", """Объедини выбор и пометку в один оператор, а чтобы параллельные воркеры не выбирали одну строку, пусть выбор пропускает заблокированные: `FOR UPDATE SKIP LOCKED`."""]
why.ru = """Это та же гонка check-then-act, что с никами, только в виде очереди: «посмотрел, что задача свободна, потом пометил». Пометка `running` без условия на текущий статус не замечает, что до неё уже дошёл другой. Правильно брать задачу атомарно: `UPDATE ... WHERE id = (SELECT ... FOR UPDATE SKIP LOCKED LIMIT 1) RETURNING id`. Ещё одна слабость очереди в таблице: упавший воркер оставляет задачу в `running` навсегда, решение с арендой (visible_at) разбирается в квизе."""

[[exercises]]
name = "pgtx18"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Нужна блокировка не строки таблицы, а «права на работу» для пользователя. У Postgres такие блокировки по числовому ключу называются рекомендательными (advisory).""", """`pg_try_advisory_xact_lock(ключ)` пытается взять блокировку и сразу отвечает true или false, без ожидания. Блокировка держится до конца транзакции и снимается сама."""]
why.ru = """Advisory lock это блокировка по числу, которую ты придумываешь сам: база не привязывает её ни к какой таблице и строке. Подходит для «только один пересчёт на пользователя», «единственный запуск задачи по крону», миграций. Вариант `_xact_` привязан к транзакции и снимается на COMMIT или ROLLBACK, что безопаснее сессионного (`pg_advisory_lock`), который можно забыть отпустить и потерять при возврате соединения в пул. Ключи общие на всю базу, поэтому разным назначениям нужны разные диапазоны."""

[[exercises]]
name = "pgtx_likes_race"
style = "scratch"
requires = ["postgres"]
quiz = true
hint.ru = ["""Лайк и подписка это строка в таблице плюс изменение счётчика. Они должны происходить вместе и только когда строка действительно появилась или исчезла.""", """Для лайков хватит одного оператора с изменяющей CTE (`INSERT ... ON CONFLICT DO NOTHING RETURNING`, счётчик растёт на число вставленных строк). Для подписок два счётчика у двух разных пользователей: нужна транзакция.""", """Дедлок в подписках возникает, когда транзакции берут пользователей a, b в разном порядке. Возьми блокировки строк обоих пользователей заранее в порядке возрастания id (`SELECT ... WHERE id IN (...) ORDER BY id FOR NO KEY UPDATE`), потом меняй счётчики."""]
why.ru = """Квиз сводит главу. Идемпотентность даёт `ON CONFLICT DO NOTHING` и использование `rows_affected` или `RETURNING`: счётчик меняется только на реальное число изменённых строк. Потерянные обновления счётчика устраняет атомарный `SET x = x + n`. Дедлок встречных подписок лечит единый порядок блокировок: любая пара пользователей берётся по возрастанию id. `FOR NO KEY UPDATE` вместо `FOR UPDATE`, потому что вставка в follows проверяет внешний ключ и не должна ждать. Инвариант «счётчик равен числу строк» проверяет тест после каждой нагрузки: он ловит все тихие расхождения."""

[[exercises]]
name = "pgtx_job_queue"
style = "scratch"
requires = ["postgres"]
quiz = true
hint.ru = ["""Это три приёма: отложенный старт (`visible_at`), аренда (сдвиг `visible_at` вперёд при взятии) и параллельные воркеры без ожидания друг друга.""", """Выбор строки и сдвиг аренды в одном операторе: `UPDATE ... WHERE id = (SELECT id ... WHERE status = 'queued' AND visible_at <= now() ORDER BY visible_at, id FOR UPDATE SKIP LOCKED LIMIT 1) RETURNING ...`.""", """Задачу, которую воркер не подтвердил, не нужно «воскрешать» отдельным процессом: она остаётся queued, и когда аренда кончается (visible_at в прошлом), условие выбора пропускает её снова. `ack` меняет статус на done."""]
why.ru = """Очередь в таблице держится на трёх вещах. SKIP LOCKED даёт параллельность: воркеры берут разные строки, не ожидая. Аренда через `visible_at` решает падение воркера: задача не уходит в «потерянные», а просто становится доступной снова, когда аренда истекла, и счётчик попыток растёт (по нему можно отправить задачу в «мёртвую» очередь). Отложенный старт получается тем же столбцом. Гарантия получается «минимум один раз»: если воркер сделал работу и упал до ack, задача выполнится снова, поэтому обработчики пишут идемпотентными."""

