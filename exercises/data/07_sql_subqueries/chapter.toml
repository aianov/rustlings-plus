[[exercises]]
name = "pgsub1"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Условие на автора: «входит в список тех, на кого подписан смотрящий». Этот список сам получается запросом к follows.""", """Форма: `WHERE author_id IN (SELECT ... FROM follows WHERE ... = $1)`. Подзапрос в IN возвращает один столбец."""]
why.ru = """Подзапрос в IN читается почти как фраза: «посты, чей автор входит в список подписок». Ни одна строка поста не размножается, даже если бы подписок на одного автора было несколько: IN только проверяет принадлежность. Тот же результат даёт JOIN, но он потребовал бы думать про дубли. Параметр $1 живёт внутри подзапроса так же свободно, как снаружи."""

[[exercises]]
name = "pgsub_q1"
kind = "question"
question.ru = """В таблице `t` значения x: 1 и 2. В таблице `s` значения y: 2 и NULL. Сколько строк вернёт `SELECT x FROM t WHERE x NOT IN (SELECT y FROM s)`?"""
options.ru = ["1", "0", "2", "ошибку: NULL в подзапросе недопустим"]
answer = [1]
explain.ru = """Для x = 2 всё понятно: 2 есть в списке, строки нет. Для x = 1 условие раскрывается в `1 <> 2 AND 1 <> NULL`: первая часть истинна, вторая даёт «неизвестно», и вместе это «неизвестно», а WHERE пропускает только истину. Результат пуст. Поэтому «нет в списке» над столбцом, где бывает NULL, надо писать через NOT EXISTS."""
hint.ru = """Раскрой `NOT IN` в цепочку сравнений через AND и вспомни, чему равно `1 <> NULL`."""

[[exercises]]
name = "pgsub2"
style = "fix"
requires = ["postgres"]
hint.ru = ["""Сравни: `x NOT IN (1, 2)` и `x NOT IN (1, 2, NULL)`. В какое значение превращается второе выражение для x = 3?""", """Если в списке есть NULL, `NOT IN` не может утверждать, что значения в списке нет: «неизвестно» не истина, и строка пропадает. Нужна проверка, которая не зависит от NULL: `NOT EXISTS` с коррелированным условием."""]
why.ru = """`id NOT IN (1, 2, NULL)` раскрывается в `id <> 1 AND id <> 2 AND id <> NULL`, а последнее никогда не истинно, поэтому весь результат пуст. Ошибки нет, просто ни одной строки. NOT EXISTS проверяет наличие строки, а не сравнивает значения, и NULL ему не страшен. Дешёвая заплатка `WHERE invited_by IS NOT NULL` внутри подзапроса тоже работает, но она держится на памяти автора: завтра в подзапросе будет другой столбец, и ловушка вернётся."""

[[exercises]]
name = "pgsub3"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Число подписчиков можно посчитать для каждой строки отдельным запросом прямо в списке столбцов. Он ссылается на текущего пользователя.""", """Скалярный подзапрос в SELECT: `(SELECT count(*) FROM follows f WHERE f.followee_id = u.id) AS followers`. Он обязан вернуть одну строку и один столбец, у `count(*)` это всегда так."""]
why.ru = """Скалярный подзапрос в SELECT выполняется для каждой строки внешнего запроса и возвращает ровно одно значение. Поэтому count(*) здесь идеален: он вернёт 0 для пользователя без подписчиков, а не пропадёт, как пропал бы INNER JOIN. Подзапрос, который вернёт больше одной строки, закончится ошибкой, а нулевое число строк даст NULL: на это стоит смотреть, когда вместо count стоит что-то другое."""

[[exercises]]
name = "pgsub4"
style = "bughunt"
requires = ["postgres"]
hint.ru = ["""Посчитай вручную: сколько строк получит пост 3 после соединения сначала с лайками, потом с комментариями?""", """Каждую связь нужно свернуть до одной строки на пост до соединения. Для этого подойдёт подзапрос в FROM: `(SELECT post_id, count(*) AS n FROM likes GROUP BY post_id)`.""", """Подставь два таких подзапроса с LEFT JOIN, а нули вместо NULL у постов без лайков и комментариев дай через `COALESCE(l.n, 0)`."""]
why.ru = """Два JOIN «один ко многим» подряд перемножают строки: три лайка на восемь комментариев это 24 строки на пост, и count(*) честно насчитал 24. Подзапрос в FROM сворачивает каждую связь до одной строки на пост раньше, чем они встретятся, и размножаться больше нечему. LEFT JOIN сохраняет посты без лайков и комментариев, а COALESCE превращает NULL в 0. Поэтому в данных есть пост 3 с лайками и сразу многими комментариями: на нём ошибка видна."""

[[exercises]]
name = "pgsub5"
style = "todo"
requires = ["postgres"]
hint.ru = ["""«Есть ли хотя бы одна подходящая строка» это отдельный вид условия. Он не создаёт пар, поэтому не размножает строки.""", """`WHERE EXISTS (SELECT 1 FROM ... WHERE ...связь с внешней строкой...)` и `NOT EXISTS` для «нет ни одной». Сам автор исключается обычным условием на id."""]
why.ru = """EXISTS отвечает «да или нет» и останавливается на первой найденной строке, поэтому не размножает внешние строки: bob с тремя комментариями остаётся одной строкой без DISTINCT. NOT EXISTS это безопасная форма «нет ни одной», ровно та, что чинила pgsub2. Содержимое SELECT внутри EXISTS не важно (пишут `SELECT 1`), важна только связь с внешней строкой в WHERE."""

[[exercises]]
name = "pgsub6"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Внутри подзапроса можно обращаться к столбцам внешней строки. Что нужно спросить у подзапроса про конкретного автора?""", """Для каждого поста вычисли самое позднее время поста того же автора (`max(created_at)` по `posts x WHERE x.author_id = p.author_id`) и оставь посты с таким временем."""]
why.ru = """Коррелированный подзапрос это подзапрос, который читает столбцы внешней строки: «для этого автора самое позднее время». Он выполняется для каждой строки внешнего запроса (планировщик иногда переписывает его в соединение). Выбор по max(id) ловушка: идентификатор отражает порядок вставки, а не время публикации, и отложенный пост с большим id окажется «свежим». Если у автора два поста в одну секунду, вернутся оба: для строгого «один» нужен ещё критерий (id по убыванию), позже в главе про окна будет DISTINCT ON."""

[[exercises]]
name = "pgsub7"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Два набора строк с одинаковыми столбцами склеиваются операцией над множествами. У неё есть два варианта, и они по-разному относятся к повторам.""", """`SELECT ... UNION ALL SELECT ...`: ORDER BY пишется один раз в конце и видит только столбцы результата."""]
why.ru = """UNION ALL просто дописывает строки одного набора к другому. UNION вдобавок убирает повторы, а для этого сортирует или хэширует весь результат, то есть тратит время и теряет данные, если одинаковые строки были правдой (два одинаковых комментария это два события). Правило такое: пиши UNION ALL, а UNION только тогда, когда повторы действительно нужно схлопнуть. ORDER BY относится ко всему объединению, поэтому сортировать можно только по столбцам результата."""

[[exercises]]
name = "pgsub_q2"
kind = "question"
question.ru = """В таблице `a` значения x: 1, 1, 2, 3. В таблице `b` одно значение: 2. Сколько строк вернёт `SELECT x FROM a EXCEPT SELECT x FROM b`?"""
options.ru = ["1", "3", "2", "4"]
answer = [2]
explain.ru = """EXCEPT работает как вычитание множеств: убирает из первого набора строки, которые есть во втором, и заодно схлопывает повторы. Остаются 1 и 3 по одному разу: две строки. Чтобы сохранить дубли, есть вариант `EXCEPT ALL`, тогда вышло бы три строки (1, 1, 3). То же с UNION и INTERSECT: без ALL они возвращают множество."""
hint.ru = """Операции без ALL убирают повторы в результате. Сколько разных значений осталось?"""

[[exercises]]
name = "pgsub8"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Для «в обоих списках» и «в первом, но не во втором» у SQL есть готовые операции над множествами.""", """`INTERSECT` оставляет строки, которые есть в обоих наборах, `EXCEPT` вычитает второй набор из первого. Вычитать можно несколько раз подряд.""", """Для suggestions: подписки подписок (подзапрос в IN), минус свои подписки, минус сам пользователь (`SELECT id FROM users WHERE id = $1`)."""]
why.ru = """INTERSECT и EXCEPT работают как множества: оба убирают повторы и сравнивают строки целиком. Для «общих подписок» это самая прямая запись условия. В suggestions легко забыть вычесть самого себя: подписки твоих подписок часто включают тебя (взаимная подписка), и сервис предложил бы тебе подписаться на себя. Для таблиц побольше такие же запросы часто переписывают через NOT EXISTS, но на маленьких наборах запись через EXCEPT короче и очевиднее."""

[[exercises]]
name = "pgsub9"
style = "scratch"
requires = ["postgres"]
hint.ru = ["""Здесь три шага: лайки на пост, лайки на автора, среднее по авторам. Назови каждый шаг через `WITH имя AS (...)`, а следующему разреши читать предыдущие.""", """Автор с постами без лайков должен остаться в расчёте с нулём, значит, в шаге про посты нужен LEFT JOIN с лайками и `count(l.user_id)`.""", """Итоговый SELECT берёт `author_likes`, подключает однострочное среднее (`CROSS JOIN avg_likes`) и оставляет `likes > среднее`."""]
why.ru = """WITH даёт шагам имена: запрос читается сверху вниз, как рецепт, а не изнутри наружу, как три вложенных подзапроса. Каждый следующий шаг видит предыдущие. Главная ловушка этой задачи в данных: eve писала, но не получала лайков, и должна попасть в среднее нулём. Если шаг про лайки построен на INNER JOIN, она теряется, среднее вырастает до 2.25, и dave выпадает из результата, а ошибки нет."""

[[exercises]]
name = "pgsub10"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Обычный LIMIT режет весь результат, а нужен срез на каждый пост. Нужен подзапрос в FROM, который может читать столбцы поста слева от него.""", """`JOIN LATERAL (SELECT ... WHERE post_id = p.id ORDER BY ... LIMIT 3) c ON true`: слово LATERAL разрешает подзапросу видеть предыдущие таблицы."""]
why.ru = """LATERAL превращает подзапрос в FROM в «функцию от строки слева»: для каждого поста выполняется свой запрос с ORDER BY и LIMIT. Без него подзапрос в FROM не видит соседей, а оконные функции для «топ N» тоже возможны, но дают другой план (про них позже). Здесь INNER-вариант (`CROSS JOIN LATERAL`): пост без комментариев дал бы пустой подзапрос и исчез из результата, это условие задачи и тема следующей."""

[[exercises]]
name = "pgsub11"
style = "fix"
requires = ["postgres"]
hint.ru = ["""Какой вид соединения выбрасывает строку слева, если подзапрос справа ничего не вернул?""", """`LEFT JOIN LATERAL (...) l ON true`: условие связи уже внутри подзапроса, поэтому в ON достаточно константы."""]
why.ru = """CROSS JOIN LATERAL (как и JOIN LATERAL) выбрасывает строку слева, если подзапрос пуст: это обычный INNER JOIN. LEFT JOIN LATERAL сохраняет её и подставляет NULL. `ON true` пишется потому, что синтаксис требует условие, а настоящая связь с постом лежит внутри подзапроса. Это тот же урок, что в главе про JOIN (потерянные строки без ошибок), только в новом синтаксисе."""

[[exercises]]
name = "pgsub_q3"
kind = "question"
question.ru = """У трёх постов 0, 1 и 5 комментариев. Подзапрос внутри берёт `ORDER BY created_at DESC LIMIT 2`. Сколько строк вернёт `FROM posts p LEFT JOIN LATERAL (...) c ON true`?"""
options.ru = ["4", "3", "2", "5"]
answer = [0]
explain.ru = """Пост без комментариев остаётся одной строкой с NULL (1), пост с одним комментарием даёт одну строку (1), пост с пятью даёт две строки из-за LIMIT 2. Итого 1 + 1 + 2 = 4. С `CROSS JOIN LATERAL` пост без комментариев выпал бы, и вышло бы 3."""
hint.ru = """Посчитай отдельно для каждого поста, сколько строк даёт подзапрос с LIMIT и что делает LEFT с пустым результатом."""

[[exercises]]
name = "pgsub12"
style = "scratch"
requires = ["postgres"]
hint.ru = ["""Два INSERT не могут идти двумя операторами. Но INSERT можно поместить внутрь WITH и взять оттуда `RETURNING id`.""", """Первый шаг: `WITH new_post AS (INSERT INTO posts ... RETURNING id)`. Второй шаг: ещё одна CTE с `INSERT INTO post_tags ... SELECT ... FROM new_post, tags ...`. Основной запрос пусть читает только id.""", """Изменяющая CTE выполняется целиком, даже если основной запрос её не читает. Теги отбираются условием `t.name = ANY($3)`."""]
why.ru = """Изменяющая CTE (`WITH x AS (INSERT ... RETURNING ...)`) позволяет передать результат одной записи в следующую внутри одного оператора, а один оператор в Postgres атомарен: если привязка тегов упадёт, поста тоже не будет. Важная деталь: изменяющая CTE выполняется всегда, даже если основной запрос её не упоминает. Вторая деталь: все части видят одну и ту же версию данных, так что `attached` не увидит строку, которую вставила `new_post`, через таблицу, только через RETURNING."""

[[exercises]]
name = "pgsub_q4"
kind = "question"
question.ru = """В таблице `drafts` пять строк, три из них старше недели. Что вернёт `WITH gone AS (DELETE FROM drafts WHERE created_at < now() - interval '7 days' RETURNING id) SELECT count(*) FROM drafts`?"""
options.ru = ["2", "3", "0", "5"]
answer = [3]
explain.ru = """Все части оператора работают с одним снимком данных. Основной SELECT видит таблицу такой, какой она была до DELETE, и считает пять строк, хотя после оператора останется две. Чтобы получить число удалённых, надо читать из самой CTE: `SELECT count(*) FROM gone`."""
hint.ru = """Какую версию таблицы видит основной запрос, если в той же команде есть изменяющая CTE?"""

[[exercises]]
name = "pgsub13"
style = "bughunt"
requires = ["postgres"]
hint.ru = ["""`DO UPDATE SET name = EXCLUDED.name` делает фиктивное обновление ради RETURNING. Каждое обновление в Postgres это новая версия строки.""", """Нужен вариант, который при конфликте вообще ничего не пишет, но всё равно возвращает id. Обычный SELECT по имени умеет это. Остаётся склеить два источника.""", """Вставка в CTE с `RETURNING id` отдаёт id только когда вставила. Склей её результат через UNION ALL с обычным SELECT по имени и возьми первую строку (LIMIT 1). Что вернёт каждая половина для нового тега и для существующего?"""]
why.ru = """Фиктивный DO UPDATE возвращает строку, но платит за это: новая версия строки, блокировка, работа для autovacuum на горячей таблице. DO NOTHING ничего не пишет, но и не возвращает. Выход: CTE с вставкой плюс SELECT, склеенные UNION ALL с LIMIT 1. Для нового тега ответ даёт вставка (второй SELECT не видит строку из этого же оператора: общий снимок), для существующего вставка пуста, а находит SELECT. Честная оговорка: если два клиента одновременно создают один тег, проигравший вставку может не увидеть выигравшую, и запрос вернёт пустой набор: приложение в этом случае повторяет вызов."""

[[exercises]]
name = "pgsub14"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Один шаг вверх это «найти строку, чей id равен parent_id текущей». Нужен способ повторять этот шаг, пока ссылка не станет NULL.""", """`WITH RECURSIVE up AS (старт UNION ALL шаг)`: старт это сама строка `$1`, шаг соединяет `comments` с `up` по `c.id = up.parent_id`. Порядок «корень первым» вычисляется счётчиком шагов.""", """Заведи в затравке счётчик шагов, в шаге увеличивай его, а в конце отсортируй по нему по убыванию."""]
why.ru = """Рекурсивная CTE состоит из затравки (старта) и шага. Шаг читает только строки, добавленные на прошлой итерации (рабочая таблица), и работает, пока не вернёт пусто. Когда у корня parent_id равен NULL, соединение ничего не находит, и рекурсия останавливается сама. Порядок «корень первым» не гарантируется ничем, кроме явного столбца: счётчик шагов дёшев, и по нему сортируют. Идти вверх дёшево (цепочка одна), а вот вниз ветвление растёт: об этом следующая задача."""

[[exercises]]
name = "pgsub15"
style = "scratch"
requires = ["postgres"]
hint.ru = ["""Теперь рекурсия идёт вниз: от корня к детям, внуки и так далее. Шаг соединяет `comments c` с уже найденным `d` по `c.parent_id = d.id`.""", """Глубина это счётчик, как в прошлой задаче. А для порядка «ответ под родителем» каждая строка может нести путь от корня: массив id, который шаг дописывает (`d.path || c.id`).""", """Сортировка по массиву сравнивает его поэлементно, и это даёт обход в глубину. Заведи в затравке `ARRAY[id] AS path`."""]
why.ru = """Порядок строк у рекурсивной CTE не определён, поэтому красивый вывод дерева нужен явно. Путь (массив id от корня) решает это одним столбцом: сортировка по нему поэлементно и есть обход в глубину, потому что префикс (родитель) всегда меньше своих потомков. Сортировка по id ошибочна: ответ, написанный позже, но к раннему комментарию, окажется в середине чужой подветки. Столбец path заодно пригодится для защиты от циклов (следующая задача)."""

[[exercises]]
name = "pgsub_q5"
kind = "question"
question.ru = """Что считает запрос?
```sql
WITH RECURSIVE n AS (
    SELECT 1 AS i
    UNION ALL
    SELECT i * 2 FROM n WHERE i < 10
)
SELECT count(*) FROM n
```"""
options.ru = ["4", "6", "5", "8"]
answer = [2]
explain.ru = """Затравка даёт строку 1. Шаг умножает на два только строки с i меньше десяти: 1 даёт 2, 2 даёт 4, 4 даёт 8, 8 даёт 16. Строка 16 условие не пропускает, поэтому рекурсия кончается. Всего 1, 2, 4, 8, 16: пять строк. Обрати внимание, что 16 в результате есть: условие проверяется у строки, из которой растёт следующая, а не у новой. Условие в шаге это единственное, что останавливает рекурсию, и его забывают чаще всего."""
hint.ru = """Выпиши строки по итерациям: что даёт шаг, когда ему на вход подают только что добавленные строки?"""

[[exercises]]
name = "pgsub16"
style = "bughunt"
requires = ["postgres"]
hint.ru = ["""Рекурсия заканчивается, когда шаг возвращает пустой набор. Пройди шаги по бумаге для корня 30: что на каждом шаге находит `parent_id = d.id`?""", """Запоминай, какие комментарии уже пройдены на этом пути, и не заходи в них снова. У каждой строки как раз есть массив пройденных id.""", """В шаге добавь условие, что id нового комментария ещё не входит в массив пути этой строки (для проверки «входит ли значение в массив» у Postgres есть оператор ANY). Вместо ручного пути есть и готовая форма `CYCLE`, но тогда не забудь убрать помеченные строки."""]
why.ru = """Данные вроде бы невозможны (комментарий не может быть ответом на свой же ответ), но на практике ломаются импортами, ручными правками и багами. Рекурсивная CTE без защиты на таких данных работает вечно и отъедает память и диск: страшнее ошибка, которая не пришла. Проверка по пути (`NOT c.id = ANY(d.path)`) обрывает только ветку, которая вернулась бы в уже пройденную точку, и не мешает здоровым данным. Только ограничение глубины (`depth < 50`) не годится: цикл успел бы повторить комментарии десятки раз. Сочетай: защита от цикла для корректности, предел глубины для вежливости."""

[[exercises]]
name = "pgsub_comment_thread"
style = "scratch"
requires = ["postgres"]
quiz = true
hint.ru = ["""Разложи на части: корни поста (затравка), спуск вниз с глубиной и путём, потом внешний запрос подмешивает текст и число ответов.""", """Предел глубины ставится в шаге рекурсии: `WHERE t.depth < $2`. А число ответов считай отдельным подзапросом по таблице comments, а не по строкам рекурсии: тогда оно не зависит от предела.""", """Заглушку удалённого делает `CASE WHEN c.deleted THEN '[удалено]' ELSE c.body END`, порядок обхода это `ORDER BY path`."""]
why.ru = """Ветка собирает всё из главы. Рекурсия вниз с путём даёт порядок и глубину. Предел глубины стоит в шаге, и поэтому число ответов нельзя считать по самой рекурсии: у комментария на границе оно получилось бы нулевым. Его считает подзапрос по таблице, и цифра не зависит от того, сколько уровней показано. Заглушка удалённого делается во внешнем запросе (CASE), а не вычёркиванием строки: иначе ответы повисли бы без родителя."""
