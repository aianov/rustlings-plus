name = "rdp_q5"
kind = "question"
question.ru = """Лайки копятся в Redis и раз в секунду переносятся в Postgres через RENAME рабочего ключа. Задача упала после UPDATE в базе и до DEL рабочего ключа. Что будет при перезапуске, если она просто перенесёт все найденные рабочие ключи?"""
options.ru = ["""Ничего страшного""", """Лайки из этого ключа перенесутся второй раз""", """Лайки потеряются""", """RENAME откатится"""]
answer = [1]
explain.ru = """Перенос не идемпотентен: UPDATE likes = likes + n повторно прибавит. Защищаются отметкой в базе в той же транзакции (имя рабочего ключа как id переноса) и пропуском уже перенесённых, то есть inbox из следующей главы."""
hint.ru = """Знает ли база, что этот рабочий ключ уже перенесён?"""

