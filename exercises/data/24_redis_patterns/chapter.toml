[chapter]
title.en = "Redis patterns"
title.ru = "Паттерны на Redis"

[[chapter.visuals]]
file = "visuals/cache_invalidation_race.html"
title.ru = "Гонка сброса кэша"

[[chapter.visuals]]
file = "visuals/lock_expiry.html"
title.ru = "Истечение блокировки и fencing token"

[[exercises]]
name = "rdp1"
style = "todo"
requires = ["redis", "postgres"]
hint.ru = ["""Где искать сначала, а куда идти при промахе? Что сделать с найденным в базе?""", """GET ключа; если пришёл текст, это JSON профиля (`serde_json::from_str`). Иначе SELECT из Postgres (`query_as` с `fetch_optional`), при находке SET с `EX 300` и вернуть.""", """Порядок: `GET`, при `Some(json)` вернуть разобранное; `sqlx::query_as::<_, (String, String)>("SELECT name, bio FROM profiles WHERE id = $1")`; `SET key json EX 300`."""]
why.ru = """Cache-aside самый простой и распространённый кэш: приложение само решает, когда читать из кэша и когда заполнять. Срок жизни это страховка: если инвалидацию где-то забыли, устаревшее значение проживёт не дольше TTL. Слабые места этой схемы (гонка при обновлении, лавина при промахе) разберём в следующих задачах."""

[[exercises]]
name = "rdp2"
style = "fix"
requires = ["redis", "postgres"]
hint.ru = ["""Что может сделать читатель, если кэш уже пуст, а новая версия ещё не закоммичена?""", """Читатель видит в базе старую версию до коммита и кладёт её в кэш. Сброс кэша имеет смысл только тогда, когда новая версия уже видна в базе.""", """Перенеси DEL после `tx.commit()`."""]
why.ru = """Сброс кэша до коммита оставляет окно, в котором читатель заполняет кэш старыми данными, и это окно тем шире, чем дольше транзакция. Сброс после коммита закрывает почти все случаи: читатель, который прочитал базу до коммита и пишет в кэш уже после нашего DEL, всё ещё возможен, но окно здесь микросекунды, а TTL ограничивает ущерб. Полностью гонку закрывают версиями в значении или подпиской на изменения (outbox из следующей главы)."""

[[exercises]]
name = "rdp3"
style = "fix"
requires = ["redis"]
hint.ru = ["""Как сделать срок разным у разных ключей, но одинаковым при повторной записи того же ключа?""", """Разброс можно вывести из хеша id: `DefaultHasher` из стандартной библиотеки, остаток от деления на 60.""", """Создай хешер, захешируй в него id, возьми остаток от деления итогового хеша на 60 и прибавь его к 300."""]
why.ru = """Одновременное истечение множества ключей это лавина промахов: база получает сразу всё, что обычно размазано по времени. Случайный разброс срока растягивает истечение на минуту. Привязка разброса к id делает его стабильным (повторная запись не двигает срок случайно) и не требует генератора случайных чисел. В связке со сбросом после коммита это даёт кэш, который не врёт долго и не роняет базу."""

[[exercises]]
name = "rdp4"
style = "fix"
requires = ["redis", "postgres"]
hint.ru = ["""Как из двадцати одновременных промахов выбрать одного, кто пойдёт в базу? Что делать остальным?""", """Замок на пересчёт: `SET lock 1 NX PX 2000` удаётся только одному. Он считает, кладёт значение в кэш и снимает замок. Остальные в цикле с паузой 20 мс проверяют кэш (и пробуют взять замок, если тот истёк).""", """Цикл: GET (есть значит вернуть), иначе SET NX PX; удалось значит `compute`, SET значения, DEL замка; не удалось значит `sleep(20 мс)`."""]
why.ru = """Лавина на один горячий ключ (dog-pile) опаснее общей лавины: двадцать одинаковых тяжёлых запросов бьют в одно место базы. Замок с коротким сроком выбирает одного вычислителя, а срок замка страхует от вычислителя, который упал, не сняв его. Альтернатива: отдавать старое значение, пока идёт пересчёт (stale-while-revalidate), для этого значение хранят дольше, чем считают свежим."""

[[exercises]]
name = "rdp5"
style = "fix"
requires = ["redis"]
hint.ru = ["""Когда сейчас ставится срок? Что будет, если ключ уже существует, но без срока?""", """Срок должен ставиться не «на первом запросе», а «если у ключа нет срока», и это должно случиться вместе с INCR. Скрипт Lua делает INCR и проверку TTL атомарно.""", """Скрипт: `local n = redis.call('INCR', KEYS[1])`, если `redis.call('TTL', KEYS[1]) < 0`, то `EXPIRE KEYS[1] ARGV[1]`, `return n`."""]
why.ru = """Две команды, которые должны выполниться вместе, однажды выполнятся по отдельности: сбой, таймаут, перезапуск. Для счётчика лимита это вечная блокировка пользователя. Скрипт делает INCR и установку срока одним шагом, а проверка «нет срока» вместо «первый запрос» заодно лечит ключи, оставшиеся от прошлых сбоев. В Redis 7 то же можно сделать транзакцией с `EXPIRE key 60 NX`, который ставит срок, только если его нет."""

[[exercises]]
name = "rdp6"
style = "todo"
requires = ["redis"]
hint.ru = ["""Что хранить, чтобы знать, сколько событий было за последнюю секунду? Почему это должно быть одним шагом?""", """Sorted set: член это уникальная метка события, счёт это время. Шаги: удалить всё старше `now - window` (ZREMRANGEBYSCORE), посчитать (ZCARD), если меньше лимита, добавить (ZADD) и продлить срок ключа. Всё внутри скрипта Lua.""", """Члены должны быть уникальны даже в одну миллисекунду: `format!("{now_ms}-{uuid}")`. Скрипт возвращает 1 или 0."""]
why.ru = """Скользящее окно точно: оно смотрит на последние N миллисекунд от «сейчас», а не на календарные отрезки, поэтому всплеска на границе нет. Цена в памяти: по элементу на событие в окне, поэтому для больших лимитов берут приближения (два соседних окна со взвешиванием) или token bucket. Атомарность обязательна: без скрипта двадцать запросов одновременно посчитают «4» и все пройдут."""

[[exercises]]
name = "rdp7"
style = "todo"
requires = ["redis"]
hint.ru = ["""Что нужно хранить, чтобы посчитать текущие жетоны? Как пересчитать их на момент запроса?""", """Храни число жетонов и момент последнего пересчёта. При запросе прибавь `прошло_мс * скорость / 1000`, ограничь вместимостью, и если есть хотя бы один жетон, спиши. Новое ведро начинается полным.""", """В скрипте: `HMGET key tokens ts`, пересчёт через `math.min`, `HSET`, срок ключа, `return 1` или `0`."""]
why.ru = """Token bucket хранит всего два числа на пользователя и разрешает естественный всплеск (открыл приложение, загрузил десять картинок), удерживая среднюю скорость. Пересчёт «на момент запроса» вместо фонового пополнения означает, что ведро ничего не стоит, пока им не пользуются. Срок ключа равен времени полного пополнения: после него ведро всё равно полное, хранить его незачем. Время с клиента здесь ради тестов; в бою его берут из `TIME` внутри скрипта, чтобы часы разных серверов не спорили."""

[[exercises]]
name = "rdp8"
style = "fix"
requires = ["redis"]
hint.ru = ["""Как отличить свою блокировку от чужой? Почему проверку и удаление нельзя сделать двумя командами?""", """Сравни значение ключа с токеном и удали только при совпадении. Между GET и DEL блокировка может истечь и перейти к другому, поэтому это одна операция: скрипт Lua.""", """Скрипт: если `redis.call('GET', KEYS[1]) == ARGV[1]`, то `return redis.call('DEL', KEYS[1])`, иначе `return 0`."""]
why.ru = """Токен в блокировке отвечает на вопрос «чья она». Без него любой, кто думает, что держит блокировку, может снять чужую, и защита превращается в лотерею. Сравнение и удаление в одном скрипте закрывают окно, в котором блокировка истекает между проверкой и удалением. Но даже правильная блокировка с истечением не гарантирует, что работает один: это следующая задача."""

[[exercises]]
name = "rdp9"
style = "todo"
requires = ["redis"]
hint.ru = ["""Что делает владелец, пока работает дольше срока? Как хранилище отличит запоздавшего владельца от нового?""", """Продление это PEXPIRE только при совпадении токена (скрипт, как снятие). Номер выдаётся INCR отдельного счётчика при каждом успешном захвате. Хранилище в скрипте сравнивает присланный номер с последним принятым.""", """`acquire`: SET NX PX, затем `INCR key:fence`. `write_guarded`: скрипт, который читает `HGET store fence` и пишет `HSET store fence N data D`, только если N больше."""]
why.ru = """Блокировка с истечением это компромисс между «упавший владелец держит вечно» и «живой владелец может потерять». Продление сужает окно, но не закрывает: долгая пауза процесса всё равно возможна. Закрывает его только проверка на стороне ресурса: fencing token растёт с каждым захватом, и хранилище отвергает запись со старым номером. Это суть разбора Мартина Клеппмана «How to do distributed locking»: если корректность важна, блокировка должна сопровождаться проверкой в самом хранилище."""

[[exercises]]
name = "rdp10"
style = "fix"
requires = ["redis"]
hint.ru = ["""Какая команда читает значение и одновременно меняет срок ключа?""", """`GETEX key EX 1800` (Redis 6.2+) возвращает значение и ставит новый срок одной командой."""]
why.ru = """Скользящий срок сессии держит активных пользователей залогиненными, а брошенные сессии истекают сами. GETEX делает чтение и продление атомарно и одним обменом: два отдельных вызова удвоили бы задержку каждого запроса. Для отзыва сессии достаточно удалить ключ, а для «выйти на всех устройствах» нужен список сессий пользователя (следующая задача)."""

[[exercises]]
name = "rdp11"
style = "todo"
requires = ["redis"]
hint.ru = ["""Где хранить список сессий пользователя, чтобы не искать их по маске?""", """Множество `<ns>:user:<id>:sessions`: при входе SET сессии и SADD токена одной пачкой (pipeline), при выходе SMEMBERS и один DEL на все ключи сессий и само множество.""", """Множеству тоже поставь срок, чтобы оно не жило вечно: EXPIRE в той же пачке."""]
why.ru = """Явный индекс сессий превращает «найти все сессии» из обхода базы в чтение одного множества. Множество может держать токены уже истёкших сессий, это не страшно: DEL несуществующего ключа ничего не делает. Срок на множестве и продление при входе не дают индексу пережить все сессии пользователя."""

[[exercises]]
name = "rdp12"
style = "fix"
requires = ["redis"]
hint.ru = ["""Есть ли способ спросить про 300 ключей одной командой или одной пачкой?""", """MGET отдаёт значения всех ключей массивом в том же порядке, nil для отсутствующих. Подойдёт и pipeline из EXISTS, но MGET проще.""", """`MGET presence:1 presence:2 ...`, затем пройди по друзьям и значениям вместе через `zip`."""]
why.ru = """Присутствие на ключах со сроком не требует фоновой чистки: клиент перестал слать heartbeat, и через 30 секунд пользователь сам стал «не в сети». Проверка сотен друзей должна быть одним обменом, иначе задержка открытия списка растёт с числом друзей. Если друзей тысячи, проверку разбивают на пачки по несколько сотен ключей, чтобы одна команда не держала Redis долго."""

[[exercises]]
name = "rdp13"
style = "fix"
requires = ["redis"]
hint.ru = ["""Можно ли отправить три разные команды так, чтобы ответы пришли за один обмен?""", """Pipeline: три команды одной пачкой, ответы массивом в том же порядке."""]
why.ru = """Экран, который собирается из нескольких команд, должен собираться одним обменом: задержка сети обычно больше, чем время всех трёх команд вместе. Pipeline не атомарен, и между командами рейтинг может чуть измениться, но для экрана это неважно. Если важно (место и очки должны быть из одного состояния), те же три команды отправляют в MULTI или скриптом."""

[[exercises]]
name = "rdp14"
style = "fix"
requires = ["redis"]
hint.ru = ["""Как отправить две тысячи команд одним обменом?""", """Собери все LPUSH и LTRIM в один pipeline: вектор команд, где каждая команда это срез строк.""", """Сначала построй ключи (они должны жить дольше пачки), затем вектор `Vec<&[&str]>` и один `c.pipeline(&batch)`."""]
why.ru = """Раскладка ленты при записи это много маленьких команд, и pipeline делает из них один обмен: Redis выполняет тысячи команд за миллисекунды, а тысяча обменов заняла бы секунды. Для очень больших раскладок пачку режут на части по несколько тысяч команд, чтобы не держать огромный буфер и не блокировать Redis надолго одной пачкой."""

[[exercises]]
name = "rdp15"
style = "fix"
requires = ["redis", "postgres"]
hint.ru = ["""Что происходит с лайками, которые приходят, пока задача пишет в базу? Как отделить «то, что переносим» от «того, что копится»?""", """RENAME атомарно переименовывает ключ: новые HINCRBY создадут новый хеш ожидающих, а переименованный рабочий ключ видит только задача переноса. Если ожидающих нет, RENAME ответит ошибкой «no such key», это значит «нечего переносить».""", """`RENAME pending flushing:<uuid>`, при ошибке «no such key» вернуть 0; дальше HGETALL рабочего ключа, UPDATE в базе и DEL рабочего ключа."""]
why.ru = """Накопление счётчиков в Redis снимает нагрузку с базы: тысяча лайков становится одним UPDATE. Но перенос должен отделить «снимок» от «новых поступлений», и RENAME делает это атомарно. Остаётся один риск: задача упала после UPDATE и до DEL, и при перезапуске рабочий ключ перенесётся второй раз. Против этого в бою рабочие ключи с уникальным именем находят при старте и сверяют с отметкой в базе, или переносят через outbox (следующая глава)."""

[[exercises]]
name = "rdp_gateway_limits"
style = "scratch"
requires = ["redis"]
quiz = true
hint.ru = ["""Каждый пункт это задача главы: ведро, сессия с индексом, скользящий срок, выход везде.""", """Два ведра в одном скрипте: посчитай уровень обоих, и только если в обоих есть жетон, спиши из обоих. Запиши состояние обоих в любом случае (время пересчёта сдвинулось).""", """Скрипт ведра из задачи rdp7, вынесенный в локальную функцию Lua и вызванный для двух ключей."""]
why.ru = """Шлюз защищает сервисы двумя лимитами сразу: на пользователя (честное распределение) и на IP (защита от ботов с множеством аккаунтов). Списывать только при согласии обоих важно: иначе отказ по IP съедал бы жетоны пользователя. Сессии со скользящим сроком и индексом дают и удобство, и мгновенный отзыв."""

[[exercises]]
name = "rdp_profile_cache"
style = "scratch"
requires = ["redis", "postgres"]
quiz = true
hint.ru = ["""Это задачи rdp1, rdp2, rdp3 и rdp4 вместе: cache-aside, сброс после коммита, разброс срока, замок на пересчёт.""", """`get`: цикл из GET, при промахе SET NX PX замка; взявший замок читает базу, кладёт JSON со сроком `ttl_for(id)` и снимает замок; остальные спят 20 мс. `rename`: UPDATE (он коммитится сам), DEL, затем дождись, пока замок пересчёта исчезнет, и DEL ещё раз.""", """Срок с разбросом: хеш id через `DefaultHasher`, `300 + h % 60`."""]
why.ru = """Кэш, который не врёт и не роняет базу, это четыре решения вместе: заполнять при промахе, сбрасывать после изменения в базе, разносить истечение по времени и не давать толпе пересчитывать одно и то же. Каждое закрывает свою дыру, и без любого из них кэш однажды подведёт под нагрузкой."""

[[exercises]]
name = "rdp_q1"
kind = "question"
question.ru = """Сервис сначала удаляет ключ кэша, потом обновляет строку в базе в долгой транзакции. Что может пойти не так?"""
options.ru = ["""Ничего, это правильный порядок""", """Читатель между удалением и коммитом промахнётся, прочитает старую строку и положит её обратно в кэш на весь срок""", """Транзакция упадёт из-за блокировки""", """Кэш никогда не заполнится"""]
answer = [1]
explain.ru = """Пока транзакция не закоммичена, база отдаёт читателям старую версию. Сброс кэша до коммита открывает окно, в которое старое значение возвращается в кэш. Сбрасывают после коммита."""
hint.ru = """Что видит читатель в базе до коммита чужой транзакции?"""

[[exercises]]
name = "rdp_q2"
kind = "question"
question.ru = """Блокировка Redis с токеном и сроком 10 секунд. Владелец завис на 15 секунд (пауза процесса), блокировку взял другой. Что гарантирует, что первый не испортит данные, когда проснётся?"""
options.ru = ["""Проверка токена при снятии блокировки""", """Ничто в самой блокировке: нужна проверка на стороне ресурса, например fencing token, который хранилище сравнивает с последним принятым""", """Продление блокировки каждые 5 секунд""", """Блокировка на Redlock из пяти узлов"""]
answer = [1]
explain.ru = """Проверка токена защищает только саму блокировку, продление не спасает от паузы дольше срока, а Redlock решает отказ узлов, а не паузы. Корректность даёт проверка в самом ресурсе: номер, который растёт с каждым захватом, и отказ записи со старым номером."""
hint.ru = """Может ли процесс узнать, что он спал дольше срока, до того как начнёт писать?"""

[[exercises]]
name = "rdp_q3"
kind = "question"
question.ru = """Лимит «100 запросов в минуту» сделан фиксированными окнами по календарной минуте. Какой всплеск возможен?"""
options.ru = ["""Не больше 100 за любую минуту""", """До 200 запросов за пару секунд вокруг границы минуты: 100 в конце одного окна и 100 в начале следующего""", """До 101""", """Всплеск невозможен"""]
answer = [1]
explain.ru = """Фиксированное окно ничего не помнит о предыдущем. Скользящее окно или token bucket ограничивают скорость в любой момент."""
hint.ru = """Что знает новое окно о запросах конца прошлого?"""

[[exercises]]
name = "rdp_q4"
kind = "question"
question.ru = """Миллион ключей кэша заполнили за минуту с одинаковым сроком 300 секунд. Что будет через пять минут?"""
options.ru = ["""Ничего особенного""", """Все они истекут почти одновременно, и база получит лавину промахов""", """Redis продлит их автоматически""", """Redis удалит их по одному в течение часа"""]
answer = [1]
explain.ru = """Одинаковый срок у массово заполненных ключей синхронизирует их истечение. Разброс срока растягивает истечение во времени."""
hint.ru = """Когда истечёт каждый из ключей?"""

