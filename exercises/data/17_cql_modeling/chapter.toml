[chapter]
title.en = "Data modeling in Scylla"
title.ru = "Моделирование в Scylla"

[[chapter.visuals]]
file = "visuals/partition_buckets.html"
title.ru = "Партиции и бакеты"

[[exercises]]
name = "cqm1"
style = "todo"
requires = ["scylla"]
hint.ru = ["""Для каждого запроса спроси: по какому столбцу он ищет (это ключ партиции) и в каком порядке хочет строки (это ключ кластеризации)?""", """Q1 ищет по чату и хочет свежие первыми. Q2 ищет по пользователю, а у пользователя много чатов, их надо различать. Q3 ищет по нику, а ник у пользователя один.""", """`messages_by_chat`: `PRIMARY KEY (chat_id, sent_at)` с обратным порядком; `chats_by_user`: `(user_id, chat_id)`; `users_by_name`: ключ `username`."""]
why.ru = """В реляционной базе ты рисуешь сущности и связи, а запросы пишешь потом. В Scylla наоборот: таблица существует ради запроса, её ключ партиции это то, по чему ищут, а ключ кластеризации это порядок и уникальность внутри. Отсюда три таблицы на три экрана и повторение данных: ник лежит и в сообщениях, и в поиске. Это нормально, если запись дешёвая, а чтение идёт в одну партицию."""

[[exercises]]
name = "cqm2"
style = "todo"
requires = ["scylla"]
hint.ru = ["""Сколько команд должен вернуть `send`? И что сделает апостроф внутри строки в одинарных кавычках?""", """Две команды INSERT через точку с запятой, по одной на таблицу. Строковый литерал CQL экранирует апостроф удвоением, и это касается каждого значения, пришедшего снаружи.""", """Заведи помощника, который оборачивает строку в кавычки и заменяет `'` на `''`, и подставляй его результат в обе команды."""]
why.ru = """Денормализация в Scylla это обычная практика: одно событие пишется в столько таблиц, сколько запросов его читают. Цена в записи и в том, что таблицы могут разойтись, если вторая запись не прошла; против этого есть logged batch (глава про продвинутую Scylla). Экранирование здесь нужно, потому что мы собираем CQL строкой: апостроф в тексте иначе ломает запрос или, хуже, превращается в инъекцию. В главе про драйвер значения будут уходить параметрами подготовленных запросов, и экранирование станет не нужно."""

[[exercises]]
name = "cqm3"
style = "fix"
requires = ["scylla"]
hint.ru = ["""Что сейчас является ключом партиции и сколько партиций получается за день?""", """Бакет должен войти в ключ партиции вместе с днём, а вычисляться так, чтобы пользователи расходились по бакетам поровну и номер всегда был в 0..7.""", """`PRIMARY KEY ((day, bucket), at, user_id)` и `bucket = user_id.rem_euclid(8)`."""]
why.ru = """Время сам по себе плохой ключ партиции: всё, что происходит сейчас, пишется в одну партицию, и кластер из десяти узлов работает как три. Бакет размазывает запись: партиция становится парой (день, номер бакета), и восемь партиций дня ложатся на разные узлы. Чтение платит за это: восемь партиций вместо одной, но это восемь параллельных точных запросов. Число бакетов выбирают заранее и не меняют: смена означает перераскладку данных. `rem_euclid` вместо `%` защищает от отрицательных номеров."""

[[exercises]]
name = "cqm4"
style = "todo"
requires = ["scylla"]
hint.ru = ["""Одна таблица не может искать и по чату, и по пользователю. Какая таблица отвечает на Q1 и Q2, а какая на Q3?""", """Q1 и Q2 ищут по чату: ключ партиции chat_id, а user_id в ключе кластеризации даёт и порядок списка, и точный поиск одной строки. Для Q3 зеркальная таблица с ключом user_id.""", """`chat_members`: `PRIMARY KEY (chat_id, user_id)`, `user_chats`: `PRIMARY KEY (user_id, chat_id)`, а `join` пишет обе."""]
why.ru = """Связь «многие ко многим» в Scylla это две зеркальные таблицы: каждая сторона связи получает свою партицию. Ключ кластеризации делает две работы сразу: задаёт порядок списка и позволяет найти одну строку внутри партиции без чтения всех. Поэтому проверка членства в чате на сто тысяч участников стоит столько же, сколько в чате на троих. А вот если бы кластеризация шла по времени вступления, «состоит ли» превратилось бы в чтение всей партиции."""

[[exercises]]
name = "cqm5"
style = "todo"
requires = ["scylla"]
hint.ru = ["""Почему месяц нельзя получить делением на «30 дней»? И почему важен UTC?""", """Месяц надо брать из календарной даты в UTC: год умножить на 100 и прибавить номер месяца. В разделе есть chrono, у `DateTime` есть конструктор из миллисекунд.""", """`DateTime::from_timestamp_millis(ms)` и `t.year() * 100 + t.month() as i32` (нужен `use chrono::Datelike`)."""]
why.ru = """Бакет это часть ключа, и его вычисление должно быть однозначным: если два сервера разойдутся во мнении, в каком месяце сообщение, оно запишется в одну партицию, а искаться будет в другой, и пропадёт для пользователя. Поэтому только календарь и только UTC: локальное время сервера двигает границу месяца на часы, а «30 дней» уплывает уже через месяц. Месяц хорош для чата: партиции ограничены, а «загрузить ещё» редко уходит дальше нескольких месяцев назад."""

[[exercises]]
name = "cqm6"
style = "todo"
requires = ["scylla"]
hint.ru = ["""Что делать, если текущий месяц пуст? А если в нём уже нашлось столько, сколько нужно?""", """Цикл по месяцам назад с ограничением числа шагов. Перед каждым запросом считай, сколько ещё не хватает, и передавай это как limit. Январь превращается в декабрь предыдущего года.""", """`prev_month`: если `month % 100 == 1`, то `(month / 100 - 1) * 100 + 12`. В `latest`: `for _ in 0..max_months`, выход при `out.len() >= n`, `fetch(month, n - out.len())`."""]
why.ru = """Бакеты превращают одно чтение в цикл, и этот цикл надо написать аккуратно. Просить у каждого месяца только недостающее значит не тащить по сети лишние строки. Предел месяцев защищает от чата, который молчит годами: иначе открытие такого чата обходит все бакеты до начала времён. На стороне клиента это обычно спрятано в store-слой, а вызывающий код просто просит «последние 50»."""

[[exercises]]
name = "cqm7"
style = "fix"
requires = ["scylla"]
hint.ru = ["""Что в ключе различает два сообщения одной миллисекунды? Какой тип CQL хранит время и при этом уникален?""", """timeuuid содержит время и случайную часть узла и счётчика, сортируется по времени. Поменяй тип столбца ключа.""", """`sent_at timeuuid` вместо `sent_at timestamp`; приложение создаёт его через `now()` или драйвером."""]
why.ru = """Ключ кластеризации обязан быть уникальным внутри партиции, а время такого не гарантирует: в большом чате совпадение миллисекунд это вопрос часов. Ошибки при этом не будет: INSERT это upsert, и сообщение просто исчезнет. timeuuid решает обе задачи сразу: сортируется по времени, а разные узлы и счётчик дают разные значения в одну миллисекунду. Время для экрана достаётся из него `toTimestamp`, хранить отдельно не нужно."""

[[exercises]]
name = "cqm8"
style = "todo"
requires = ["scylla"]
hint.ru = ["""Можно ли изменить значение столбца, который входит в первичный ключ? Что тогда значит «передвинуть чат наверх»?""", """Сдвиг это удаление строки со старым временем и вставка с новым. Удаление адресуется полным ключом: пользователь, старое время и чат.""", """При `Some(old)`: `DELETE FROM chats_by_activity WHERE user_id = .. AND last_at = old AND chat_id = ..;` и затем INSERT с новым временем."""]
why.ru = """Сортировка по изменяемому значению в Scylla делается только так: значение попадает в ключ кластеризации, а изменение превращается в пару «удалить старую строку, вставить новую». Отсюда две тонкости. Нужно знать старое значение, поэтому рядом держат таблицу «чат пользователя и его last_at» или читают его перед записью. И каждое передвижение оставляет надгробие, поэтому у очень активных пользователей такие партиции стоит периодически пересобирать или ограничивать TTL."""

[[exercises]]
name = "cqm9"
style = "todo"
requires = ["scylla"]
hint.ru = ["""По какому значению должна искать таблица поиска, чтобы Kate, KATE и kate попадали в одну строку?""", """Ключ таблицы поиска это нормализованный ник (нижний регистр), а показываемое написание остаётся в users. Нормализацию применяют одинаково при записи и при поиске.""", """`users_by_name (username text PRIMARY KEY, user_id int)`, в обе стороны `to_lowercase()` для ключа."""]
why.ru = """Таблица поиска это самая частая форма денормализации: ключ партиции это то, по чему ищут, а значение это ссылка на основную запись. Нормализация ключа должна быть одной функцией для записи и поиска, иначе Kate зарегистрируется, а kate не найдётся. Что обычный INSERT не проверяет занятость имени, ты уже знаешь: регистрация с проверкой будет через LWT в главе про продвинутую Scylla."""

[[exercises]]
name = "cqm10"
style = "todo"
requires = ["scylla"]
hint.ru = ["""Индекс по author помогает найти строки, но умеет ли он отдать их отсортированными по времени? Что нужно, чтобы Scylla сама вела вторую таблицу с другим ключом?""", """`CREATE MATERIALIZED VIEW имя AS SELECT ... FROM messages WHERE <все столбцы ключа представления> IS NOT NULL PRIMARY KEY (...)`. Ключ представления должен включать весь ключ базовой таблицы.""", """Ключ `(author, sent_at, chat_id)` с `CLUSTERING ORDER BY (sent_at DESC, chat_id ASC)`; условия `IS NOT NULL` на author, sent_at и chat_id."""]
why.ru = """Материализованное представление это та же денормализация, только вторую запись делает сама Scylla, и разойтись таблицам сложнее. Правила следуют из этого: в ключ представления входит весь ключ базовой таблицы (иначе одной строке базы соответствовало бы несколько строк представления), и все его столбцы не NULL. Цена в записи: каждая запись в базу это ещё чтение и запись в представление, обновление идёт асинхронно, поэтому тест ждёт его. Вторичный индекс годится для редких запросов с высокой селективностью, но порядка по времени он не даёт."""

[[exercises]]
name = "cqm11"
style = "todo"
requires = ["scylla"]
hint.ru = ["""В чьи партиции должен попасть пост? Сколько команд получится при N подписчиках?""", """По одному INSERT на каждого подписчика и ещё один для автора. Если автор случайно есть в списке подписчиков, ему не нужна вторая копия (тут она и так совпала бы по ключу, но лишняя запись это лишняя работа).""", """Пройди по `once(&author).chain(followers без author)` и склей INSERT через `;`."""]
why.ru = """Fan-out на запись делает чтение ленты самым дешёвым запросом системы: одна партиция, первые N строк. Платит запись: пост автора с миллионом подписчиков это миллион вставок. Поэтому в бою подход гибридный: обычные авторы раскладываются на запись, а звёзды подмешиваются в ленту при чтении. Ключ ленты включает post_id, чтобы два поста с одним временем не затёрли друг друга."""

[[exercises]]
name = "cqm_chat_model"
style = "scratch"
requires = ["scylla"]
quiz = true
hint.ru = ["""Каждая таблица это одна из задач главы: бакет по месяцу с timeuuid, сортировка по изменяемой активности, зеркальная связь, таблица поиска.""", """Ищи для каждой: что стоит в WHERE равенством (ключ партиции), какой порядок нужен и что делает строку уникальной (ключ кластеризации).""", """messages: `((chat_id, month), id)` с id DESC; chats_by_user: `(user_id, last_at, chat_id)` с last_at DESC; chat_members: `(chat_id, user_id)`; user_by_name: ключ username."""]
why.ru = """Модель собрана от запросов: четыре экрана, четыре таблицы, каждый запрос читает одну партицию в готовом порядке. Тест специально кладёт совпадающие времена: это главная ловушка моделирования в Scylla, где ключ обязан быть уникальным, а ошибка не выдаёт себя ничем, кроме пропавших данных."""

[[exercises]]
name = "cqm_q1"
kind = "question"
question.ru = """Аналитик просит: «покажи чаты, где больше всего сообщений за неделю». В модели есть только messages_by_chat с ключом chat_id. Как это решают в Scylla?"""
options.ru = ["""`SELECT chat_id, count(*) FROM messages_by_chat GROUP BY chat_id` по всей таблице""", """Заводят под это отдельную таблицу или счётчики, которые обновляются при записи, либо считают в отдельной аналитической системе""", """Добавляют ALLOW FILTERING и сортировку""", """Строят вторичный индекс по chat_id"""]
answer = [1]
explain.ru = """Запрос по всей таблице в Scylla это полный обход кластера. Агрегаты, которые нужны часто, заводят заранее (таблица или счётчики, которые пишутся вместе с сообщением), а разовую аналитику уводят в систему для этого (Spark, ClickHouse) или выгружают данные."""
hint.ru = """Сколько партиций прочитает запрос без ключа партиции?"""

[[exercises]]
name = "cqm_q2"
kind = "question"
question.ru = """Ключ партиции messages это chat_id. Популярный общий чат за три года набрал 40 ГБ в одной партиции. Чем это плохо?"""
options.ru = ["""Ничем: Scylla хранит партиции любого размера одинаково""", """Одна партиция живёт на одних и тех же репликах: эти узлы перегружены, уплотнение и восстановление такой партиции тяжёлые, чтение длинной истории медленное""", """Scylla откажется записывать в партицию больше 2 ГБ""", """Это ускоряет чтение последних сообщений"""]
answer = [1]
explain.ru = """Большая партиция бьёт сразу по нескольким вещам: нагрузка не распределяется, уплотнение и repair работают с огромным куском, кэш и чтение страдают. Партиции ограничивают бакетами: (chat_id, month) или по числу сообщений."""
hint.ru = """Сколько узлов хранит одну партицию, сколько бы она ни весила?"""

[[exercises]]
name = "cqm_q3"
kind = "question"
question.ru = """Ты сделал вторичный индекс по столбцу status, у которого три значения: new, paid, shipped. Заказов сто миллионов. Что не так?"""
options.ru = ["""Всё в порядке: индекс по малому числу значений самый быстрый""", """Индекс хранится как таблица с ключом по значению: три огромные партиции, запрос по status вытягивает треть всех заказов""", """Индексы в Scylla не работают с текстом""", """Индекс будет занимать ровно три строки"""]
answer = [1]
explain.ru = """Вторичный индекс в Scylla это скрытая таблица, где ключ это значение индексируемого столбца. Столбец с малым числом значений даёт несколько гигантских партиций. Индекс полезен для столбцов с высокой селективностью (email, номер заказа), а выборки вроде «все оплаченные» делают отдельной моделью с бакетами."""
hint.ru = """Как устроен вторичный индекс внутри: где лежит ключ?"""

[[exercises]]
name = "cqm_q4"
kind = "question"
question.ru = """У знаменитости десять миллионов подписчиков. При fan-out на запись каждый её пост это десять миллионов вставок. Что обычно делают?"""
options.ru = ["""Ставят больше узлов и пишут дальше""", """Гибрид: обычные авторы раскладываются по лентам при записи, а посты знаменитостей подмешиваются в ленту при чтении""", """Отказываются от лент в Scylla""", """Пишут пост в ленты только тех подписчиков, кто онлайн"""]
answer = [1]
explain.ru = """Fan-out на запись хорош, пока подписчиков немного. Для авторов-гигантов дешевле при чтении ленты дочитать их последние посты из таблицы постов автора и слить с готовой лентой. Порог выбирают по числу подписчиков."""
hint.ru = """Где дешевле заплатить за звезду: при её записи или при чтении ленты?"""

[[exercises]]
name = "cqm_q5"
kind = "question"
question.ru = """Чем материализованное представление лучше ручной записи в две таблицы, и чем хуже?"""
options.ru = ["""Лучше во всём: бесплатно и мгновенно""", """Лучше тем, что вторую запись делает база и таблицы не разойдутся из-за упавшего клиента; хуже тем, что каждая запись в базовую таблицу дороже, обновление представления асинхронное, а ключ представления ограничен правилами""", """Хуже во всём: представления устарели""", """Лучше тем, что не занимает места"""]
answer = [1]
explain.ru = """Представление снимает с приложения заботу о второй записи, но не делает её бесплатной: база читает старую версию строки, пишет в представление и делает это с задержкой. Ключ представления обязан содержать весь ключ базы. Для простых и важных запросов часто выбирают ручную денормализацию с logged batch."""
hint.ru = """Кто делает вторую запись в каждом случае, и сразу ли она видна?"""
