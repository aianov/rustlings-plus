[[exercises]]
name = "pgagg1"
style = "fix"
requires = ["postgres"]
hint.ru = """`count(*)` считает строки, а `count(столбец)` считает строки, где этот столбец не NULL."""
why.ru = """Это самое начало главы, поэтому правка маленькая, но принцип важный: `count(*)` отвечает «сколько строк», `count(x)` отвечает «у скольких строк x заполнен». Первый не смотрит ни на какие значения. Дальше в главе эта разница станет причиной настоящих ошибок: счётчик после LEFT JOIN, который «показывает единицу там, где должен быть ноль»."""

[[exercises]]
name = "pgagg2"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Нужно посчитать не строки, а разные значения в столбце. Для этого у count есть модификатор.""", """`count(DISTINCT user_id)`."""]
why.ru = """DISTINCT внутри агрегата убирает повторы значений перед подсчётом. Разница между `count(*)` и `count(DISTINCT x)` это разница между «событий» и «участников». Учти цену: DISTINCT требует сортировки или хэш-таблицы по значениям, на больших таблицах это заметно дороже обычного count."""

[[exercises]]
name = "pgagg_q1"
kind = "question"
question.ru = """В столбце `x` значения: 1, 1, NULL, 2. Что вернёт `SELECT count(*), count(x), count(DISTINCT x), sum(x) FROM t`?"""
options.ru = ["4, 3, 3, 4", "3, 3, 2, 4", "4, 3, 2, 4", "4, 4, 2, 4"]
answer = [2]
explain.ru = """`count(*)` считает строки: 4. `count(x)` пропускает NULL: 3. `count(DISTINCT x)` считает разные непустые значения, это 1 и 2: 2. `sum(x)` складывает 1 + 1 + 2 = 4. NULL агрегатами пропускается всегда, кроме `count(*)`."""
hint.ru = """Какие из агрегатов смотрят на значения, а какой только на строки? И что делают с NULL?"""

[[exercises]]
name = "pgagg3"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Агрегаты (кроме `count(*)`) пропускают NULL. А что даёт `sum` по набору, в котором нет ни одного значения?""", """`sum` по пустому или целиком NULL набору возвращает NULL, а не 0. Подменяет NULL функция `COALESCE(выражение, 0)`."""]
why.ru = """sum, avg, min и max молча пропускают NULL, поэтому среднее считается по известным значениям. Это правильно, если NULL значит «неизвестно», а не «ноль»: делить сумму на `count(*)` дало бы заниженную цифру. Когда значений нет совсем, sum возвращает NULL, и приложение, которое ждёт число, падает (как в задаче sqlx9). COALESCE ставится снаружи агрегата: `COALESCE(sum(x), 0)`."""

[[exercises]]
name = "pgagg_q2"
kind = "question"
question.ru = """Оценки поста: 5, NULL, 1. Какое число вернёт `SELECT avg(rating) FROM reviews`?"""
options.ru = ["2 (то есть (5 + 0 + 1) / 3)", "6", "NULL, потому что есть NULL", "3"]
answer = [3]
explain.ru = """avg не учитывает NULL и в сумме, и в количестве: (5 + 1) / 2 = 3. Если считать неизвестную оценку нулём, нужно сказать это явно: `avg(COALESCE(rating, 0))` даст 2. Выбор зависит от смысла NULL в данных: «неизвестно» или «ноль»."""
hint.ru = """На сколько делит avg: на число строк или на число непустых значений?"""

[[exercises]]
name = "pgagg4"
style = "fix"
requires = ["postgres"]
hint.ru = ["""После GROUP BY в списке столбцов могут стоять только столбцы из GROUP BY и агрегаты. Здесь в списке есть `u.country`, а в GROUP BY его нет.""", """Можно добавить `u.country` в GROUP BY. Но есть способ лучше: если сгруппировать по первичному ключу, Postgres знает, что остальные столбцы этой таблицы определены однозначно."""]
why.ru = """Каждая выходная строка группы должна давать по каждому столбцу ровно одно значение. Если столбца нет в GROUP BY и он не агрегат, значений в группе может быть много, и база отказывается угадывать (MySQL в старых режимах угадывал, и это источник неверных отчётов). Группировка по первичному ключу `u.id` разрешает брать любые столбцы этой таблицы, потому что ключ однозначно определяет строку. Группировать по нику рискованно: он уникален в нашей схеме, но Postgres этого не знает, пока не увидит ключ."""

[[exercises]]
name = "pgagg5"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Группировать можно не только по столбцу, но и по выражению. Время поста отличается до секунд, а нужен день.""", """`created_at::date` оставляет только день и даёт тип date (`date_trunc('day', ...)` вернул бы timestamptz со временем, и тест не совпадёт). `GROUP BY` может ссылаться на номер столбца в списке (`GROUP BY 1`) или на повтор выражения."""]
why.ru = """GROUP BY принимает любое выражение, и на нём построена вся аналитика по времени: по дням, неделям, месяцам (`date_trunc('week', ...)`). Номер столбца (`GROUP BY 1`) удобен, чтобы не дублировать выражение, но не злоупотребляй им в длинных запросах: при перестановке столбцов он тихо начнёт группировать по другому."""

[[exercises]]
name = "pgagg6"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Одно условие отсеивает строки до группировки (какие посты считать), другое отсеивает группы после неё (у кого получилось два и больше).""", """`WHERE` для постов и `HAVING count(*) >= 2` для групп. В WHERE агрегаты писать нельзя."""]
why.ru = """WHERE работает над строками до группировки, HAVING над готовыми группами. Поэтому «считать только свежие посты» это WHERE (иначе alice получила бы три поста вместо одного), а «групп не меньше двух» это HAVING (агрегата в WHERE ещё нет: группы не построены). Условие, которое можно проверить по одной строке, всегда лучше ставить в WHERE: оно срабатывает раньше и до группировки уменьшает работу."""

[[exercises]]
name = "pgagg_q3"
kind = "question"
question.ru = """Нужны авторы, у которых хотя бы 2 поста с `views > 50` (посты с меньшим числом просмотров не считаются). Какая запись верна?"""
options.ru = ["`WHERE views > 50 GROUP BY author_id HAVING count(*) >= 2`", "`WHERE count(*) >= 2 GROUP BY author_id` и условие по views в HAVING", "`GROUP BY author_id HAVING views > 50 AND count(*) >= 2`", "`WHERE views > 50 AND count(*) >= 2 GROUP BY author_id`"]
answer = [0]
explain.ru = """Условие по отдельному посту (views > 50) проверяется до группировки в WHERE, и тогда считаются только подходящие посты. Условие по числу постов в группе можно проверить только после группировки, в HAVING. Агрегат в WHERE запрещён, а `views` в HAVING без агрегата не имеет смысла: в группе много значений views."""
hint.ru = """Что известно в момент WHERE: отдельные строки или уже группы?"""

[[exercises]]
name = "pgagg7"
style = "fix"
requires = ["postgres"]
hint.ru = ["""После LEFT JOIN у пользователя без постов есть ровно одна строка, целиком из NULL справа. `count(*)` считает эту строку.""", """Первая ошибка: `count(*)` считает пустую строку, нужен счёт столбца правой таблицы, который заведомо не бывает NULL. Вторая: `sum` по набору из одних NULL это NULL, а в отчёте нужен 0."""]
why.ru = """`count(*)` после LEFT JOIN считает строки результата, и пользователь без пар даёт одну строку с NULL, то есть «1 пост». `count(p.id)` считает только настоящие пары. Это самая известная ловушка LEFT JOIN с группировкой, и она не даёт ошибки: цифра просто неверная. Вторая половина (COALESCE) та же, что в pgagg3."""

[[exercises]]
name = "pgagg8"
style = "fix"
requires = ["postgres"]
hint.ru = ["""Посмотри, сколько строк получает пост 1 после обоих LEFT JOIN: каждый из его лайков встречается с каждым из его комментариев.""", """Число строк у поста стало «лайки × комментарии». `count(DISTINCT ...)` починит счётчики, но не сумму длин. Сначала сверни каждую связь в отдельный подзапрос с GROUP BY."""]
why.ru = """Два соединения один ко многим подряд перемножают строки: 4 лайка × 3 комментария дают 12 строк на пост. Счётчики по таким строкам завышены, и ошибки нет. DISTINCT по ключу чинит счётчики вида count, но не сумму: `sum(l.value)` по размноженным строкам останется завышенной. Надёжный способ это предагрегация: посчитать лайки отдельным подзапросом и комментарии отдельным, а потом соединить уже по одной строке на пост (подзапросы в FROM будут в главе про подзапросы). Открой `visuals/join_fanout.html`."""

[[exercises]]
name = "pgagg_q4"
kind = "question"
question.ru = """У поста 3 лайка и 2 комментария. Запрос `SELECT count(*) FROM posts p LEFT JOIN likes l ON l.post_id = p.id LEFT JOIN comments c ON c.post_id = p.id WHERE p.id = 42` вернёт (пост 42 имеет те самые 3 лайка и 2 комментария)?"""
options.ru = ["2", "3", "5", "6"]
answer = [3]
explain.ru = """Каждый из трёх лайков соединяется с каждым из двух комментариев: 3 × 2 = 6 строк. Складывать (5) тут не из чего: соединения не складывают, а перемножают. Поэтому счётчики по двум связям один ко многим считают отдельно или по разным значениям."""
hint.ru = """Сколько пар можно составить из трёх лайков и двух комментариев?"""

[[exercises]]
name = "pgagg9"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Два счётчика с разными условиями в одной группе. Условие в WHERE сузило бы оба, а нужно только второе.""", """У любого агрегата можно написать `FILTER (WHERE условие)`: он посчитает только подходящие строки. `count(*) FILTER (WHERE ...)`."""]
why.ru = """FILTER даёт агрегату собственное условие, не затрагивая остальные агрегаты того же запроса. Без него пришлось бы делать два запроса или писать `sum(CASE WHEN ... THEN 1 ELSE 0 END)`; FILTER короче и прозрачнее. Поставь условие в WHERE, и пострадал бы столбец total: он стал бы равен recent."""

[[exercises]]
name = "pgagg10"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Для склейки значений группы в строку есть `string_agg`, для сборки в массив `array_agg`. Порядок внутри склейки по умолчанию не определён.""", """`string_agg(выражение, разделитель ORDER BY ...)` и `array_agg(выражение ORDER BY ...)`: ORDER BY пишется внутри скобок агрегата."""]
why.ru = """Агрегаты вроде string_agg и array_agg зависят от порядка строк, а без явного ORDER BY внутри скобок порядок случайный: сегодня совпадёт с вставкой, завтра нет. Поэтому он пишется внутри агрегата, а не после запроса (внешний ORDER BY упорядочивает группы, а не содержимое). Массив удобно отдавать клиенту целиком вместо N строк, но учти размер: array_agg по огромной группе раздувает строку."""

[[exercises]]
name = "pgagg_stats"
style = "scratch"
requires = ["postgres"]
quiz = true
hint.ru = ["""Для счётчиков профиля проще всего не соединять таблицы вместе, а считать каждое число отдельно (скалярными подзапросами в SELECT): тогда размножению строк просто неоткуда взяться.""", """Для `busy_authors` соединение посты и лайки одно, и размножение тут безопасно, если считать правильно: посты через `count(DISTINCT p.id)`, лайки через `count(l.user_id)` (не `count(*)`: пост без лайков после LEFT JOIN даёт строку). Условия на группы в HAVING.""", """Для `daily_posts`: `generate_series` слева, LEFT JOIN постов справа, считать `count(p.id)`. Группировка по `d`."""]
why.ru = """Три запроса про то, как не врать цифрами. Счётчики профиля считаются независимо, и лишние связи не искажают друг друга; соединить followers, posts и likes в один JOIN значило бы получить произведение. В busy_authors одно соединение с лайками безопасно, но count(*) вместо count(l.user_id) посчитал бы пост без лайков как лайк. А пустые дни по-прежнему требуют календаря слева и count по столбцу справа. Все три ошибки молчат: ни одна не вызывает исключения, цифры просто неверные."""

