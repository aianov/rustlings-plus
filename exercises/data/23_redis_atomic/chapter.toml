[chapter]
title.en = "Redis transactions, scripts and messaging"
title.ru = "Транзакции, скрипты и сообщения Redis"

[[chapter.visuals]]
file = "visuals/multi_watch.html"
title.ru = "WATCH и оптимистичная транзакция"

[[chapter.visuals]]
file = "visuals/consumer_groups.html"
title.ru = "Группы потребителей в Streams"

[[exercises]]
name = "rdx1"
style = "todo"
requires = ["redis"]
hint.ru = ["""Что вернут команды между MULTI и EXEC, и где окажутся их настоящие результаты?""", """Внутри транзакции DECRBY и INCRBY отвечают `QUEUED`, а результаты придут массивом в ответе EXEC. Все четыре команды можно отправить одной пачкой: pipeline общего клиента держит соединение на всю пачку.""", """`c.pipeline(&[&["MULTI"], &["DECRBY", from, n], &["INCRBY", to, n], &["EXEC"]])` и балансы из `replies.last().list()`."""]
why.ru = """MULTI и EXEC дают изоляцию: команды транзакции выполняются подряд, и никакой другой клиент не вклинится между ними. Но это не транзакция в смысле SQL: внутри нельзя прочитать значение и решить, что делать дальше (все команды уже в очереди), и отката нет. Транзакция живёт на соединении, поэтому от MULTI до EXEC это соединение должно быть только твоим."""

[[exercises]]
name = "rdx2"
style = "fix"
requires = ["redis"]
hint.ru = ["""Что лежит в массиве ответа EXEC, если одна из команд упала при выполнении?""", """EXEC отвечает массивом результатов, и на месте упавшей команды там ошибка, а остальные команды выполнены. Пройди по массиву и найди ошибку. Ошибка может прийти и раньше: если команда отвергнута ещё при постановке в очередь, EXEC вернёт ошибку целиком.""", """Ищи `Value::Error` в `replies.last()` как массиве и возвращай `Error::Server(текст)`."""]
why.ru = """В Redis два вида ошибок транзакции. Синтаксическая ошибка при постановке в очередь отменяет всю транзакцию (EXECABORT). А ошибка при выполнении (не тот тип ключа) не отменяет ничего: остальные команды выполнены, и в массиве EXEC на месте упавшей лежит ошибка. Отката нет по замыслу: Redis не хранит, как отменить команду. Поэтому каждый элемент ответа EXEC надо проверять, а транзакции проектировать так, чтобы ошибка выполнения была невозможна."""

[[exercises]]
name = "rdx3"
style = "fix"
requires = ["redis"]
hint.ru = ["""Что делает EXEC, если ключ, за которым следили через WATCH, изменился до него?""", """WATCH ключа, GET, проверка, затем MULTI, DECR, EXEC. Если ключ изменили, EXEC отвечает nil и ничего не выполняет: повтори с WATCH. Если билетов нет, сними слежку UNWATCH и верни false.""", """Цикл: `WATCH`, `GET`, при нуле `UNWATCH` и `false`, иначе `pipeline([MULTI, DECR, EXEC])`; не nil в последнем ответе значит успех."""]
why.ru = """WATCH превращает MULTI в оптимистичную транзакцию: Redis помнит, что соединение следит за ключом, и если ключ изменился (кем угодно) до EXEC, транзакция отменяется ответом nil. Клиент перечитывает и пробует снова. Это работает, пока гонок немного: при сильной конкуренции повторы множатся, и тогда лучше один атомарный скрипт Lua (дальше в главе). Слежка привязана к соединению, поэтому каждому покупателю нужно своё."""

[[exercises]]
name = "rdx4"
style = "fix"
requires = ["redis"]
hint.ru = ["""Что видит общее соединение, когда между твоими отдельными вызовами другая задача отправляет свою команду?""", """Транзакция это состояние соединения. На общем соединении весь путь от MULTI до EXEC должен уйти одной неделимой порцией: pipeline клиента курса держит соединение на всю пачку. Другой путь: отдельное соединение для транзакций.""", """`c.pipeline(&[&["MULTI"], &["DECRBY", ..], &["INCRBY", ..], &["EXEC"]])` и проверь, что последний ответ массив."""]
why.ru = """MULTI переводит в режим транзакции всё соединение, а не «твою задачу». Если соединение мультиплексировано (как у клиента из главы про RESP-клиент), чужие команды между MULTI и EXEC встанут в твою очередь, а их авторы получат QUEUED вместо ответа. Поэтому транзакции отправляют одной неделимой пачкой или берут для них выделенное соединение. Это та же история, что с блокирующими командами: всё, что меняет режим соединения, с мультиплексированием не дружит."""

[[exercises]]
name = "rdx5"
style = "fix"
requires = ["redis"]
hint.ru = ["""Почему между GET и DECRBY успевают вклиниться другие переводы? Что Redis выполняет целиком, кроме одной команды?""", """Скрипт Lua выполняется целиком: внутри `redis.call('GET', KEYS[1])`, проверка и два изменения. Команда `EVAL текст число_ключей ключ1 ключ2 аргумент`.""", """В скрипте: `local balance = tonumber(redis.call('GET', KEYS[1]) or '0')`, при нехватке `return -1`, иначе DECRBY, INCRBY и `return` остатка. Вызов `EVAL script 2 from to amount`."""]
why.ru = """Скрипт Lua это способ сделать атомарным «прочитать, решить, изменить»: пока он работает, Redis не выполняет ничего другого. Отсюда и ограничение: скрипт должен быть коротким, долгий скрипт останавливает весь сервер так же, как KEYS. Ключи передаются через KEYS не ради красоты: в кластере Redis по ним определяют, на каком узле выполнять скрипт, и все ключи скрипта должны лежать на одном узле."""

[[exercises]]
name = "rdx6"
style = "fix"
requires = ["redis"]
hint.ru = ["""Какой ответ приходит на EVALSHA, когда скрипта нет в кэше, и что сделать в ответ?""", """Ошибка сервера начинается со слова NOSCRIPT. В этом случае отправь EVAL с полным текстом: он выполнит скрипт и положит его в кэш, следующие EVALSHA снова заработают.""", """`match c.cmd(EVALSHA ..) { Err(Error::Server(e)) if e.starts_with("NOSCRIPT") => c.cmd(EVAL ..), other => other }`."""]
why.ru = """Кэш скриптов это оптимизация, а не хранилище: он пустеет при перезапуске, переключении на реплику и SCRIPT FLUSH. Надёжный клиент всегда готов к NOSCRIPT и молча отправляет полный текст один раз. Так делают все зрелые клиенты Redis. В Redis 7 появились функции (FUNCTION LOAD), которые хранятся постоянно, но схема EVALSHA с запасным EVAL остаётся самой распространённой."""

[[exercises]]
name = "rdx7"
style = "todo"
requires = ["redis"]
hint.ru = ["""Какая команда подписывает соединение, и какие кадры приходят после неё?""", """`SUBSCRIBE канал` (через `sub.send`). Первый кадр это подтверждение `subscribe`, дальше кадры `message`. В `next_message` читай кадры в цикле и возвращай третий элемент, когда первый равен message.""", """`frame.first() == Some("message")` и `frame[2]`."""]
why.ru = """Pub/sub в Redis доставляет сообщение тем, кто подписан прямо сейчас, и забывает его: нет хранения, нет повторной доставки, отключившийся подписчик пропускает всё, что было без него. Это подходит для «живых» событий (кто-то печатает, пришло уведомление), но не для того, что нельзя потерять: для этого Streams дальше в главе. Подписка меняет режим соединения: сервер сам присылает кадры, когда захочет, поэтому такой клиент читает не «ответ на запрос», а поток кадров."""

[[exercises]]
name = "rdx8"
style = "fix"
requires = ["redis"]
hint.ru = ["""Какие команды Redis принимает на соединении в режиме подписки?""", """Только (P|S)SUBSCRIBE, (P|S)UNSUBSCRIBE, PING, QUIT и RESET. Все остальные команды должны идти по другому соединению: открой обычного клиента рядом с подпиской.""", """`Client::connect_to(addr)` до цикла, и `commands.cmd(&["GET", counter])` вместо отправки в `sub`."""]
why.ru = """Соединение подписчика это поток событий от сервера, и Redis не даёт смешивать его с запросами и ответами: иначе клиент не отличил бы ответ на GET от очередного сообщения. Поэтому у сервиса с подписками два соединения: одно слушает, другое работает. В протоколе RESP3 это ограничение снято (сообщения приходят как push-кадры другого типа), но разделение соединений остаётся самым простым и надёжным решением."""

[[exercises]]
name = "rdx9"
style = "fix"
requires = ["redis"]
hint.ru = ["""Какая опция XADD ограничивает длину стрима, и что значит тильда?""", """`XADD key MAXLEN ~ 1000 * поле значение ...`: стрим обрезается до примерно 1000 записей. С тильдой Redis удаляет только целые внутренние узлы, это дёшево; без неё обрезает точно и дороже."""]
why.ru = """Стрим это журнал: записи с возрастающими id, которые читают с любого места и сколько угодно раз. Без ограничения он растёт вечно, поэтому длину задают при каждой записи. Примерная обрезка (~) почти бесплатна, а точная заставляет Redis трогать узлы при каждой записи. XREAD BLOCK это «ждать новые записи после этого id» без опроса, но на время ожидания он занимает соединение, поэтому читателю нужно своё."""

[[exercises]]
name = "rdx10"
style = "todo"
requires = ["redis"]
hint.ru = ["""Как создать группу, если стрима ещё нет, и как отличить «группа уже есть» от настоящей ошибки?""", """`XGROUP CREATE stream group $ MKSTREAM` создаёт и стрим; повторный вызов отвечает ошибкой BUSYGROUP, её считаем успехом. Чтение новых для группы: `XREADGROUP GROUP g consumer COUNT n STREAMS stream >`. Подтверждение: `XACK stream group id...`.""", """Ответ XREADGROUP устроен как у XREAD: массив стримов, у каждого массив записей `[id, [поле, значение, ...]]`."""]
why.ru = """Группа потребителей превращает стрим в очередь задач: каждое сообщение достаётся одному воркеру, а список ожидающих помнит, кому и когда. Подтверждение после обработки даёт «хотя бы один раз»: если воркер упал до XACK, сообщение не потеряется и его можно перехватить (следующая задача). Идентификатор `>` значит «ещё никому не выданные». Это близко к JetStream из раздела про сервисы, но живёт в памяти Redis и ограничено ей."""

[[exercises]]
name = "rdx11"
style = "fix"
requires = ["redis"]
hint.ru = ["""Почему `>` не отдаёт сообщения упавшего воркера? Какая команда передаёт ожидающие сообщения другому воркеру?""", """`XAUTOCLAIM stream group consumer min_idle 0-0 COUNT 100` забирает себе сообщения, которые ждут дольше min_idle миллисекунд. Ответ: следующий курсор, массив записей (как у XREAD) и удалённые id.""", """Записи лежат во втором элементе ответа: `reply.list()[1].list()`, у каждой поля во втором элементе."""]
why.ru = """Список ожидающих это страховка «хотя бы один раз»: сообщение не исчезает, пока его не подтвердили. Но кто-то должен подбирать сообщения упавших воркеров, иначе они висят вечно. XAUTOCLAIM делает это одной командой: находит сообщения, которые ждут дольше срока, и переписывает их на нового воркера. Срок выбирают больше обычного времени обработки, иначе живой, но медленный воркер потеряет свою работу и сообщение обработается дважды. Обработчик поэтому должен быть идемпотентным."""

[[exercises]]
name = "rdx_notifications"
style = "scratch"
requires = ["redis"]
quiz = true
hint.ru = ["""Каждый пункт это задача главы: скрипт Lua, группа с MKSTREAM, XREADGROUP, XACK, XAUTOCLAIM.""", """Скрипт: XADD с `MAXLEN ~ 1000` по KEYS[1] и `INCR KEYS[2]`, вызов `EVAL script 2 stream unread text`. Остальное как в задачах rdx10 и rdx11.""", """Разбор записей стрима вынеси в одну функцию: запись это `[id, [поле, значение, ...]]`."""]
why.ru = """Очередь уведомлений собирает главу: скрипт делает запись в стрим и счётчик атомарно, группа делит работу, подтверждение и перехват дают «хотя бы один раз». Если такой очереди хватает, NATS не нужен; если нужны хранение на диске, повторы по расписанию и много потребителей в разных дата-центрах, лучше JetStream."""

[[exercises]]
name = "rdx_q1"
kind = "question"
question.ru = """Внутри MULTI ... EXEC нужно прочитать баланс и списать, только если хватает. Получится?"""
options.ru = ["""Да, команды транзакции видят результаты друг друга""", """Нет: внутри MULTI команды только встают в очередь (QUEUED), читать и решать нельзя. Нужен WATCH с повтором или скрипт Lua""", """Да, если включить режим WAIT""", """Нет, MULTI не поддерживает GET"""]
answer = [1]
explain.ru = """Ответы команд внутри транзакции приходят только массивом EXEC, когда решать уже поздно. Для «прочитать и решить» есть WATCH (оптимистичный повтор) или EVAL, где логика выполняется на сервере атомарно."""
hint.ru = """Что отвечает GET внутри MULTI?"""

[[exercises]]
name = "rdx_q2"
kind = "question"
question.ru = """Скрипт Lua считает что-то полсекунды. Что видят остальные клиенты Redis всё это время?"""
options.ru = ["""Работают как обычно: скрипт идёт в отдельном потоке""", """Ждут: пока скрипт выполняется, Redis не выполняет ничего другого""", """Получают ошибку BUSY сразу""", """Видят промежуточные результаты скрипта"""]
answer = [1]
explain.ru = """Атомарность скрипта и обеспечивается тем, что Redis больше ничего не делает, пока он работает. Поэтому скрипты должны быть короткими. Долгий скрипт после lua-time-limit можно только прервать (SCRIPT KILL), а клиенты получают BUSY."""
hint.ru = """Как Redis гарантирует, что скрипт выполнится целиком?"""

[[exercises]]
name = "rdx_q3"
kind = "question"
question.ru = """Подписчик pub/sub отключился на 10 секунд (перезапуск). Что с сообщениями, опубликованными за это время?"""
options.ru = ["""Redis сохранит их и отдаст после переподключения""", """Они потеряны: pub/sub доставляет только тем, кто подписан в момент публикации""", """Они лягут в стрим канала""", """Публикация в канал без подписчиков вернёт ошибку"""]
answer = [1]
explain.ru = """Pub/sub не хранит сообщения: PUBLISH отдаёт сообщение текущим подписчикам и забывает его. Для того, что нельзя терять, используют Streams с группами потребителей или JetStream."""
hint.ru = """Где pub/sub хранит сообщение после публикации?"""

[[exercises]]
name = "rdx_q4"
kind = "question"
question.ru = """Воркер группы потребителей обработал сообщение, отправил письмо пользователю и упал до XACK. Что будет?"""
options.ru = ["""Сообщение потеряно""", """Сообщение останется в списке ожидающих, его перехватит другой воркер и письмо уйдёт второй раз, если обработка не идемпотентна""", """Redis сам подтвердит его через минуту""", """Сообщение вернётся в конец стрима"""]
answer = [1]
explain.ru = """Подтверждение после обработки даёт «хотя бы один раз»: сбой между действием и XACK приводит к повтору. Поэтому обработчики делают идемпотентными (отметка «уже отправлено» по id сообщения)."""
hint.ru = """Знает ли Redis, что письмо уже отправлено?"""

[[exercises]]
name = "rdx_q5"
kind = "question"
question.ru = """Клиент с одним мультиплексированным соединением отправляет `BLPOP jobs 30` в той же очереди, что и обычные команды. Что произойдёт с остальными запросами этого клиента?"""
options.ru = ["""Ничего, BLPOP не мешает""", """Они встанут за BLPOP и будут ждать до 30 секунд: блокирующая команда держит соединение""", """Redis выполнит их параллельно""", """BLPOP вернёт ошибку на общем соединении"""]
answer = [1]
explain.ru = """Команды одного соединения выполняются по порядку, и блокирующая команда держит соединение, пока не дождётся. Для BLPOP, XREAD BLOCK, SUBSCRIBE, WATCH и MULTI нужно своё соединение."""
hint.ru = """Сколько команд одновременно выполняет Redis на одном соединении?"""
