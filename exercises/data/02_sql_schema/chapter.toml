[chapter]
title.en = "Tables and constraints"
title.ru = "Таблицы и ограничения"

[[chapter.visuals]]
file = "visuals/fk_on_delete.html"
title.ru = "Внешний ключ: что делает ON DELETE"

[[exercises]]
name = "pgsch1"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Общий вид: `CREATE TABLE имя (столбец тип, столбец тип, ...)`.""", """Большое целое это `bigint`, текст без ограничения длины это `text`, момент времени с поясом это `timestamptz`."""]
why.ru = """Это самое начало, поэтому тут разрешена простая задача: форма команды CREATE TABLE. Обрати внимание на выбор типов: bigint вместо integer (двух миллиардов хватает не навсегда) и timestamptz вместо timestamp. Ключей и ограничений пока нет, они появятся в следующих задачах."""

[[exercises]]
name = "pgsch2"
style = "fix"
requires = ["postgres"]
hint.ru = ["""Три независимые проблемы, по одной на столбец. Подумай, что случится, когда значение не поместится.""", """В `integer` вмещается не больше примерно двух миллиардов, у `varchar(n)` есть предел длины, а `real` хранит двоичную дробь. Про столбец id тоже подумай: он растёт так же, как счётчик.""", """bigint для счётчика и номера, text для названия, numeric(3, 2) для оценки с двумя знаками."""]
why.ru = """Каждый тип отвечает на вопрос «что может прийти в этот столбец». integer ломается тихо до первого большого значения, а потом ошибкой «out of range» в проде. varchar(n) почти никогда не нужен: в Postgres он не быстрее text, а лимит приходится потом расширять миграцией. real и double precision неточны для денег и оценок, numeric точен."""

[[exercises]]
name = "pgsch_q1"
kind = "question"
question.ru = """В таблице `views integer`. Что произойдёт при `INSERT ... VALUES (3000000000)`?"""
options.ru = ["значение запишется как есть", "значение переполнится и запишется как отрицательное число", "Postgres откажет: integer out of range", "запишется максимальное значение 2147483647"]
answer = [2]
explain.ru = """Postgres не переполняет целые молча, как это делает арифметика в некоторых языках: вставка не проходит, транзакция получает ошибку «integer out of range» (SQLSTATE 22003). Это хорошо, но ошибка прилетит в проде в самый неподходящий момент: счётчик дойдёт до предела. Поэтому для всего, что только растёт, берут bigint."""
hint.ru = """Что умеет проверять база при записи в столбец типа integer?"""

[[exercises]]
name = "pgsch3"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Нужны два свойства: «первичный ключ» и «значение выдаёт база». Для второго у столбца есть вариант GENERATED ... AS IDENTITY.""", """У GENERATED два режима: ALWAYS и BY DEFAULT. Один из них не даёт подставить номер вручную."""]
why.ru = """GENERATED ALWAYS AS IDENTITY это современная замена serial: стандартный SQL, отдельный объект-счётчик, привязанный к столбцу, и защита от ручной подстановки. BY DEFAULT пригоден для импорта данных. Первичный ключ даёт сразу три вещи: уникальность, NOT NULL и индекс для быстрого поиска по нему."""

[[exercises]]
name = "pgsch4"
style = "todo"
requires = ["postgres"]
hint.ru = """У столбца может быть значение по умолчанию, то есть выражение, которое база вычислит, если значение не передали. Для случайного uuid в Postgres есть встроенная функция `gen_random_uuid()`."""
why.ru = """DEFAULT не запрещает передать своё значение, в отличие от GENERATED ALWAYS. Для uuid это нужно: клиент часто создаёт идентификатор заранее, например для идемпотентного повтора запроса. Расплата за случайные ключи: вставки попадают в случайные места индекса, и он разрастается быстрее, чем для последовательных номеров."""

[[exercises]]
name = "pgsch5"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Два разных механизма: NOT NULL запрещает пустое значение, DEFAULT подставляет значение, когда столбец не указан. Одно другого не заменяет.""", """Они пишутся после типа: `столбец тип NOT NULL DEFAULT выражение`."""]
why.ru = """DEFAULT срабатывает, только когда столбца нет в INSERT; явный NULL он не заменяет, для этого нужен NOT NULL. Пара «NOT NULL DEFAULT» самая частая: столбец никогда не бывает пустым, а код приложения может его не указывать. Каждый nullable-столбец это дополнительное состояние, которое все запросы потом обязаны учитывать (вспомни прошлую главу)."""

[[exercises]]
name = "pgsch_q2"
kind = "question"
question.ru = """В таблице `price numeric CHECK (price > 0)` без NOT NULL. Что сделает `INSERT INTO items (price) VALUES (NULL)`?"""
options.ru = ["откажет: нарушен CHECK", "пройдёт: значение запишется как NULL", "откажет: NULL не бывает в numeric", "запишет 0"]
answer = [1]
explain.ru = """CHECK отвергает строку, только когда условие ложно. Условие `NULL > 0` не ложно, а неизвестно (NULL), поэтому строка проходит. Хочешь запретить пустое значение, добавь NOT NULL. Это то же правило трёхзначной логики, что и в WHERE, только наоборот: WHERE пропускает лишь TRUE, а CHECK отвергает лишь FALSE."""
hint.ru = """CHECK принимает строку, если условие не ложно. Какое значение у NULL > 0?"""

[[exercises]]
name = "pgsch6"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Ограничение внутри CREATE TABLE пишется отдельной строкой: `CONSTRAINT имя UNIQUE (столбец, ...)`. Но одного UNIQUE мало: он считает (1, 2) и (2, 1) разными парами.""", """Нужно, чтобы у каждой дружбы был один законный вид записи. Какое условие на два столбца оставляет из двух порядков ровно один и заодно запрещает дружить с собой?""", """CHECK (user_a < user_b) вместе с UNIQUE (user_a, user_b). Приложение при вставке само ставит меньший номер первым."""]
why.ru = """Составной UNIQUE говорит о сочетании, но порядок для него важен. Чтобы дружба (a, b) была единственной, порядок закрепляют договорённостью, и CHECK её охраняет: меньший номер всегда первый. Тот же приём годится для любых симметричных связей. Имя ограничения не косметика: приложение различает нарушения (почта или пара) по полю constraint в ошибке, это будет в главе про sqlx."""

[[exercises]]
name = "pgsch7"
style = "todo"
requires = ["postgres"]
hint.ru = ["""`CHECK (условие)` пишется у столбца или отдельной строкой в таблице. Строка отвергается, когда условие ложно.""", """Длину даёт `length(...)`, пробелы по краям убирает `trim(...)`, диапазон проверяет BETWEEN."""]
why.ru = """CHECK отвергает строку только когда условие ложно. Если оно даёт NULL (а так бывает при NULL в столбце), строка проходит. Поэтому «оценка может отсутствовать» получилось само, без отдельной ветки, а для обязательного значения нужен ещё и NOT NULL. Проверки видят только текущую строку: сослаться на другую таблицу CHECK не может, для этого есть внешние ключи."""

[[exercises]]
name = "pgsch8"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Связь между таблицами называется внешним ключом: столбец ссылается на ключ другой таблицы.""", """`столбец тип REFERENCES таблица (столбец)`. Действие при удалении по умолчанию запрещающее, это здесь и нужно."""]
why.ru = """Внешний ключ даёт гарантию, которую невозможно обеспечить кодом приложения: между проверкой и записью другой процесс успеет удалить автора. Заодно у ссылки есть цена: каждая вставка проверяет существование строки, а удаление родителя ищет детей. Поэтому на столбец внешнего ключа позже понадобится индекс (глава про индексы)."""

[[exercises]]
name = "pgsch9"
style = "todo"
requires = ["postgres"]
hint.ru = ["""После REFERENCES можно дописать `ON DELETE правило`. Правила: CASCADE, SET NULL, RESTRICT (есть и другие).""", """Какое правило «удалить вместе», какое «обнулить», какое «запретить»? Проверь, что для SET NULL столбец вообще может быть пустым."""]
why.ru = """Правило удаления это решение о судьбе данных, а не техническая деталь. CASCADE удобен для «частей целого» (лайки поста), но на связи «автор и посты» тихо унесёт чужую работу. SET NULL годится только для необязательных ссылок. RESTRICT и стандартное NO ACTION отличаются лишь моментом проверки внутри транзакции, на практике это «запретить». Проверь каждое: на что вешаешь CASCADE, того не вернёшь."""

[[exercises]]
name = "pgsch_q3"
kind = "question"
question.ru = """Таблица `orders(customer_id bigint NOT NULL REFERENCES customers(id) ON DELETE SET NULL)`. Что будет при удалении клиента, у которого есть заказы?"""
options.ru = ["заказы удалятся вместе с клиентом", "customer_id в заказах станет NULL, клиент удалится", "удаление клиента откажет с ошибкой нарушения NOT NULL", "удаление пройдёт, а customer_id останется ссылаться на несуществующего клиента"]
answer = [2]
explain.ru = """SET NULL пытается записать NULL в customer_id, а столбец объявлен NOT NULL. Получается ошибка 23502 (not_null_violation), и удаление клиента откатывается. Два ограничения на одном столбце противоречат друг другу: либо убери NOT NULL, либо выбери другое правило удаления. Такие противоречия база замечает только при первом удалении, поэтому в схеме их надо уметь видеть глазами."""
hint.ru = """Что именно делает SET NULL с дочерней строкой, и что на это скажет NOT NULL?"""

[[exercises]]
name = "pgsch10"
style = "bughunt"
requires = ["postgres"]
hint.ru = ["""У таблицы две ссылки с каждой своим поведением при удалении. Какая из них отвечает за потерю ответов?""", """Ответ ссылается на родителя через parent_id. Поведение для него и стоит пересмотреть, а ссылку на пост не трогай."""]
why.ru = """Самоссылка с CASCADE превращает удаление одного комментария в удаление всего поддерева: Postgres честно идёт по цепочке. Для веток обсуждений SET NULL сохраняет ответы (в интерфейсе их показывают как «ответ на удалённый комментарий»). Другой вариант, мягкое удаление, мы разберём в главе про проектирование схемы."""

[[exercises]]
name = "pgsch11"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Связь «многие ко многим» хранится отдельной таблицей-связкой, где каждая строка это одна пара.""", """Ключ у связки составной: `PRIMARY KEY (a, b)`. Проверка на себя это CHECK по двум столбцам, а оба столбца ссылаются на users."""]
why.ru = """Таблице-связке не нужен суррогатный id: естественный ключ это сама пара. Составной первичный ключ заодно создаёт индекс по (follower_id, followee_id), то есть быстро находит «на кого подписан X», но не «кто подписан на X». Для обратного направления понадобится второй индекс, когда дойдём до индексов."""

[[exercises]]
name = "pgsch_q4"
kind = "question"
question.ru = """В таблице `UNIQUE (email)`, столбец email допускает NULL. Две строки вставляются с `email = NULL`. Результат?"""
options.ru = ["вторая вставка откажет: NULL уже есть", "обе вставятся", "откажут обе: UNIQUE не допускает NULL", "вставится одна, вторая молча пропадёт"]
answer = [1]
explain.ru = """Для UNIQUE два NULL не равны друг другу (неизвестное не равно неизвестному), поэтому нарушения нет, и в столбце может быть сколько угодно пустых значений. Если нужна единственная пустая строка, в Postgres 15 и новее есть `UNIQUE NULLS NOT DISTINCT`. А если нужна уникальность только среди непустых, то NULL тебе как раз удобен."""
hint.ru = """Равны ли два неизвестных значения?"""

[[exercises]]
name = "pgsch12"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Все изменения делает команда `ALTER TABLE имя` с одним действием на каждую (RENAME, ADD, DROP). Данные при этом остаются на месте.""", """Обязательный столбец к уже заполненной таблице добавляется только вместе со значением по умолчанию: старым строкам нужно что-то подставить.""", """Ограничение добавляется как `ADD CONSTRAINT имя UNIQUE (столбец)`.""", """Текст в дату автоматически не превращается, Postgres спросит, как именно. Эту фразу пишут после `TYPE тип` словом USING и выражением приведения."""]
why.ru = """ALTER TABLE меняет таблицу, не трогая данные: RENAME это мгновенная правка каталога, DROP COLUMN не переписывает таблицу сразу. А вот ADD COLUMN ... NOT NULL DEFAULT на старых версиях Postgres перезаписывал всю таблицу, с 11-й версии константный DEFAULT добавляется мгновенно. Подробнее про безопасные миграции на живой базе будет в главе про миграции."""

[[exercises]]
name = "pgsch13"
style = "todo"
requires = ["postgres"]
hint.ru = ["""`CREATE SCHEMA имя`, а таблица в схеме называется `схема.таблица`. Имена схем приходят параметрами, их нужно подставить в текст через `format!`.""", """`SET search_path TO имя` действует на соединение до конца сессии, и скрипт целиком идёт по одному соединению. После него имя без префикса ищется в этой схеме."""]
why.ru = """search_path это список схем, по которому Postgres ищет таблицу с именем без префикса; создаёт же он новые таблицы в первой схеме списка. Для тестов это идеально: одна база, много изолированных схем. А вот приём с format! для имени схемы допустим только здесь, потому что имя приходит из нашего кода: имена и столбцы нельзя подставлять параметром $1, а значит, подставляя пользовательский текст, получишь SQL-инъекцию (об этом в главе про sqlx в сервисе)."""

[[exercises]]
name = "pgsch_q5"
kind = "question"
question.ru = """Выполнено `SET search_path TO shop, public`. Таблица `items` есть и в shop, и в public. Что делают команды `SELECT * FROM items` и `CREATE TABLE orders (...)` без префикса?"""
options.ru = ["SELECT читает shop.items, orders создаётся в shop", "SELECT читает public.items, orders создаётся в public", "SELECT читает обе таблицы подряд, orders создаётся в обеих", "обе команды падают: имя неоднозначно"]
answer = [0]
explain.ru = """Postgres ищет имя по списку схем слева направо и берёт первую найденную таблицу, а новую таблицу создаёт в первой схеме списка (если она существует). Поэтому порядок в search_path важен: этим же пользуются тесты курса, ставя схему теста первой."""
hint.ru = """Поиск идёт по списку по порядку, создание в первой схеме."""

[[exercises]]
name = "pgsch14"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Удалить таблицу, которой может не быть, и не упасть, помогает слово IF EXISTS в команде DROP TABLE.""", """Есть два способа очистить таблицу: DELETE без WHERE и TRUNCATE. Нумерацию заново начинает только один, и только с дополнительной опцией."""]
why.ru = """DROP TABLE IF EXISTS делает скрипт идемпотентным, то есть безопасным при повторе. TRUNCATE не просматривает строки, а сразу выбрасывает файл таблицы, поэтому быстрее DELETE на миллионы строк, но блокирует таблицу целиком и не умеет WHERE. Если на таблицу ссылаются внешние ключи, TRUNCATE откажет без CASCADE, а CASCADE очистит и таблицы-дети: проверяй, кого заденет."""

[[exercises]]
name = "pgsch_q6"
kind = "question"
question.ru = """На таблицу `users` ссылается внешним ключом таблица `posts`. Что сделает `TRUNCATE users`?"""
options.ru = ["очистит users, а в posts проставит NULL", "очистит обе таблицы", "откажет: на таблицу ссылаются внешние ключи", "очистит users, если в posts нет строк, иначе удалит из posts только осиротевшие"]
answer = [2]
explain.ru = """TRUNCATE не проверяет внешние ключи по строкам (он их не просматривает), поэтому для таблицы, на которую кто-то ссылается, он отказывает: «cannot truncate a table referenced in a foreign key constraint». Можно написать `TRUNCATE users CASCADE`, но тогда очистятся и все таблицы, ссылающиеся на неё (posts), так что думай дважды."""
hint.ru = """Что TRUNCATE делает со строками: просматривает их или выбрасывает целиком?"""

[[exercises]]
name = "pgsch_social_schema"
style = "scratch"
requires = ["postgres"]
quiz = true
hint.ru = ["""Иди по таблицам по очереди и сверяй каждое правило ТЗ с тем, что ты умеешь: ключи, NOT NULL, DEFAULT, UNIQUE, CHECK, REFERENCES, ON DELETE.""", """Порядок создания важен: таблица, на которую ссылаются, должна существовать раньше. Для ON DELETE выбирай правило по смыслу, а не по привычке."""]
why.ru = """Схема это ты как автор правил: все ограничения вместе дают гарантию, что в таблицах нет сирот, дублей и мусора, как бы ни ошибся код. Тесты проверяют каждое правило вставкой, которая обязана упасть с нужным SQLSTATE. Именно этому подходу курс следует дальше: сначала ограничение в базе, потом код приложения."""
