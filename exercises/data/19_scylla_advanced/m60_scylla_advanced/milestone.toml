test_command = ["cargo", "make", "check"]
requires = ["postgres", "scylla", "nats"]
hint.ru = [
"""Лёгкая транзакция `INSERT ... IF NOT EXISTS` возвращает строку с колонкой `[applied]`: первая вставка true,
все следующие false. Это дорого (paxos), поэтому делай её один раз на чат, а не на каждое сообщение.""",
"""Время записи в Scylla решает, какая версия победит. Пиши сообщение `USING TIMESTAMP` его времени, а правку
`USING TIMESTAMP` времени правки: опоздавшая старая правка проиграет новой сама.""",
"""Две таблицы одного сообщения пиши одним `Batch::new(BatchType::Logged)`: либо обе строки, либо ни одной.
UNLOGGED по разным партициям это просто несколько запросов без гарантий.""",
"""Непрочитанное: `SELECT author ... WHERE chat = ? AND bucket = ? AND id > ? LIMIT 100`, где `?` это `last_read`.
Больше ста считать незачем: в интерфейсе всё равно «99+».""",
]
story.ru = """Чат стал живым: личный чат заводится один раз, правки не теряются при гонке, сообщения исчезают по
сроку, у каждого чата счётчик непрочитанного, а сообщение пишется в обе таблицы атомарно."""
