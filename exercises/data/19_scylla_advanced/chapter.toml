[[exercises]]
name = "scya1"
style = "fix"
requires = ["scylla"]
hint.ru = ["""Что значит «записать, только если строки нет», и кто это может гарантировать при гонке? Почему пара (7, 9) и (9, 7) должна давать одну строку?""", """Лёгкая транзакция `IF NOT EXISTS` проверяет и пишет атомарно. Её ответ содержит столбец `[applied]` и, если запись не применилась, текущую строку. Пару упорядочи: меньший id первым.""", """INSERT ... IF NOT EXISTS с `(min, max, candidate)`; в первой строке ответа нулевой столбец это `[applied]` (`as_boolean`), а при false найди `chat_id` по имени в `res.col_specs` и прочитай `as_int`."""]
why.ru = """Чтение перед записью не защищает от гонки: между ними другой клиент успевает сделать то же самое. Лёгкая транзакция (LWT) делает проверку и запись одной операцией через Paxos между репликами, поэтому побеждает ровно один, а проигравшие получают строку победителя в ответе. Цена: несколько кругов между репликами вместо одного, поэтому LWT используют там, где уникальность важна (личный чат, ник), а не на каждой записи. Упорядоченная пара делает ключ одинаковым для обоих собеседников."""

[[exercises]]
name = "scya2"
style = "fix"
requires = ["scylla"]
hint.ru = ["""Как сделать правку условной: применить, только если в базе всё ещё та версия, которую видел клиент?""", """У UPDATE бывает условие `IF столбец = значение`: это тоже лёгкая транзакция. Первый столбец ответа `[applied]` скажет, прошла ли правка.""", """Добавь `IF version = ?` и передай `seen_version` последним параметром, затем прочитай булево значение из первого столбца первой строки ответа."""]
why.ru = """Оптимистичная блокировка через версию в Scylla делается условным UPDATE: проверка версии и запись атомарны благодаря Paxos. Опоздавший клиент узнаёт об этом по `[applied] = false` и перечитывает данные, вместо того чтобы молча затереть чужую правку. Условные операции дороже обычных, поэтому их не смешивают с обычными записями той же строки: обычная запись не участвует в Paxos и может нарушить его гарантии."""

[[exercises]]
name = "scya3"
style = "fix"
requires = ["scylla"]
hint.ru = ["""Что Scylla говорит про таблицу, где рядом счётчики и обычный столбец? И можно ли INSERT в счётчик?""", """В таблице со счётчиками все столбцы вне ключа должны быть счётчиками. Счётчик меняют только UPDATE с `+` или `-`, вставить значение нельзя.""", """Убери `title` из схемы, а обновление пиши как `UPDATE ... SET messages = messages + 1, reactions = reactions + 2 WHERE chat_id = 1`."""]
why.ru = """Счётчик в Scylla это особый тип: он хранится как набор приращений от разных реплик, и его значение собирается при чтении. Поэтому его нельзя установить, только прибавить, и его нельзя смешивать с обычными столбцами в одной таблице. Прибавление не идемпотентно: после таймаута неизвестно, применилось ли оно, и повтор может посчитать дважды. Поэтому счётчики годятся для приблизительной статистики, но не для денег и точных остатков."""

[[exercises]]
name = "scya4"
style = "todo"
requires = ["scylla"]
hint.ru = ["""Какие сообщения непрочитаны? Нужно ли знать их точное число, если оно больше 99?""", """Прочитай last_read пары (если нет, считай непрочитанным всё) и выбери сообщения строго новее него с LIMIT 100: если пришло больше 99, это «99+».""", """`SELECT sent_at FROM messages WHERE chat_id = ? AND sent_at > ? LIMIT ?` с пределом 100 и `rows_num()`; отсутствие last_read это `i64::MIN`."""]
why.ru = """Модель «last_read плюс подсчёт новее» не требует счётчиков и потому не боится повторов и гонок: отметка «прочитано до» это обычная идемпотентная запись, а подсчёт всегда честный. Предел превращает подсчёт в чтение не больше сотни строк из начала партиции, что дёшево при любом размере чата. Так же устроены значки во многих мессенджерах: точное «1834 непрочитанных» никому не нужно."""

[[exercises]]
name = "scya5"
style = "todo"
requires = ["scylla"]
hint.ru = ["""Где задаётся время жизни одной записи, а где время жизни всех записей таблицы?""", """У INSERT и UPDATE есть `USING TTL секунды`. У таблицы есть свойство `default_time_to_live`, которое ставится в `WITH`.""", """`... VALUES (...) USING TTL {ttl_secs}` и `CREATE TABLE ... WITH default_time_to_live = 86400`."""]
why.ru = """TTL удаляет данные силами самой базы: каждая ячейка помнит срок, и после него читается как отсутствующая. Это проще и надёжнее фоновой чистки. Но истёкшие ячейки превращаются в надгробия и физически уходят при уплотнении, поэтому таблицы с массовым TTL выигрывают от стратегии уплотнения по времени (TWCS). TTL ставится на ячейки, а не на строку целиком: UPDATE одного столбца с другим TTL даст строку, части которой исчезнут в разное время."""

[[exercises]]
name = "scya6"
style = "fix"
requires = ["scylla"]
hint.ru = ["""По какому правилу Scylla выбирает, какая из двух записей ячейки победит? Кто ставит метку времени?""", """Побеждает запись с большей меткой времени. По умолчанию метку ставит координатор в момент прихода запроса. Её можно задать в самом запросе.""", """`UPDATE messages USING TIMESTAMP {edited_at_us} SET ...`."""]
why.ru = """Last write wins в Scylla решается метками времени, а не порядком прихода. Если метку ставит сервер, порядок прихода и становится порядком правок, и любая задержка в очереди превращается в потерю. USING TIMESTAMP переносит решение туда, где известен настоящий порядок событий: в момент правки у клиента. Метки в микросекундах, и все писатели одной ячейки обязаны использовать одни единицы, иначе миллисекунды навсегда проиграют микросекундам."""

[[exercises]]
name = "scya7"
style = "fix"
requires = ["scylla"]
hint.ru = ["""Нужно ли знать текущий список, чтобы добавить в него одного человека?""", """Множество в Scylla хранится поэлементно, и в него можно добавить элемент, не трогая остальные. Запись целиком нужна только для замены всего набора.""", """`SET members = members + {user}`."""]
why.ru = """Запись коллекции целиком это удаление старой коллекции (надгробие на диапазон) плюс запись новой, и при одновременных записях побеждает последняя. Добавление элемента пишет одну ячейку и не зависит от того, что было: два добавления не мешают друг другу. Так же устроены `- {x}` для удаления, `list + [x]` и `map[k] = v`. Правило: меняй коллекцию поэлементно, а читай-изменяй-пиши оставь для случаев, когда это действительно нужно."""

[[exercises]]
name = "scya8"
style = "fix"
requires = ["scylla"]
hint.ru = ["""Как в CQL объединить несколько изменений в одну команду с гарантией, что все они применятся?""", """`BEGIN BATCH ... APPLY BATCH`: внутри команды через точку с запятой. Обычный (logged) batch сначала записывает себя в журнал batch на других узлах, поэтому доводится до конца, даже если координатор упал.""", """Оберни обе вставки в `BEGIN BATCH` и `APPLY BATCH` без слова UNLOGGED."""]
why.ru = """Logged batch даёт атомарность в смысле «всё или в итоге всё»: координатор сначала сохраняет batch в журнал на двух других узлах, а при сбое его доигрывают. Изоляции нет: читатель может увидеть одну таблицу раньше другой. Это ровно то, что нужно денормализации, но платит лишний круг записи, поэтому batch используют для связных записей нескольких таблиц, а не для ускорения массовой вставки (это следующая задача)."""

[[exercises]]
name = "scya9"
style = "fix"
requires = ["scylla"]
hint.ru = ["""Что делает координатор с batch на сотни партиций? И как ещё можно ускорить много независимых вставок?""", """Batch на много партиций не быстрее: координатор разбирает его сам и рассылает по узлам, а размер ограничен. Независимые вставки лучше слать параллельно, но не все сразу, а с пределом одновременных.""", """Подготовь вставку, затем `stream::iter(rows).map(|r| execute(...)).buffer_unordered(32).try_for_each(...)` (`use futures::{stream, StreamExt, TryStreamExt}`)."""]
why.ru = """Batch в Scylla это не ускоритель, а инструмент атомарности. Unlogged batch по разным партициям перекладывает работу драйвера на один координатор: он держит всю пачку в памяти и сам рассылает части по владельцам, а у batch есть предел размера. Параллельные подготовленные вставки идут сразу на нужные узлы (token-aware), нагрузка распределяется, а предел одновременных запросов защищает и кластер, и клиента от лавины. Unlogged batch оправдан в одном случае: много строк одной партиции."""

[[exercises]]
name = "scya10"
style = "todo"
requires = ["scylla"]
hint.ru = """QUORUM на запись и на чтение в сумме дают больше реплик, чем их всего, поэтому чтение пересекается с подтверждённой записью. Выпиши правила из шапки по операциям и верни их через `match`."""
why.ru = """Уровень согласованности это обмен задержки и доступности на свежесть. QUORUM для записи и чтения гарантирует, что чтение увидит подтверждённую запись, и переживает падение одной реплики из трёх. ONE быстрее и доступнее, но может отдать устаревшее, что для эфемерного «печатает» неважно. ALL ломается от падения любой реплики, поэтому его берут только там, где частичное применение хуже отказа. SERIAL против LOCAL_SERIAL выбирает, проверять ли LWT по всем дата-центрам."""

[[exercises]]
name = "scya_presence_unread"
style = "scratch"
requires = ["scylla"]
quiz = true
hint.ru = ["""Каждый пункт это одна задача главы: LWT, TTL, last_read, USING TIMESTAMP.""", """Пару для LWT упорядочи, TTL пиши в `USING`, непрочитанное считай с пределом 100, метку правки передавай в `USING TIMESTAMP`. Не забудь экранировать апострофы в тексте.""", """`dm_insert` с `IF NOT EXISTS`, `ephemeral` с `USING TTL`, `mark_read` обычным INSERT, `edit` с `USING TIMESTAMP`."""]
why.ru = """Четыре задачи чата, которые в Scylla решаются не так, как в Postgres: уникальность через LWT вместо UNIQUE, исчезновение через TTL вместо фоновой чистки, непрочитанное через отметку и ограниченный подсчёт вместо счётчика, порядок правок через метку времени вместо блокировки. Общее у них одно: решение опирается на то, как Scylla хранит и сравнивает версии данных."""

[[exercises]]
name = "scya_q1"
kind = "question"
question.ru = """Регистрация ника сделана через `INSERT ... IF NOT EXISTS`. Чем она дороже обычного INSERT?"""
options.ru = ["""Ничем, это просто флаг""", """Paxos: несколько кругов между репликами (подготовка, чтение, предложение, фиксация) вместо одной записи""", """Она блокирует всю таблицу""", """Она требует ALLOW FILTERING"""]
answer = [1]
explain.ru = """Лёгкая транзакция проходит через Paxos между репликами партиции: это примерно четыре круга вместо одного и заметно больше задержка. Поэтому LWT используют точечно: уникальность ника, личного чата, оптимистичная правка."""
hint.ru = """Как реплики договариваются, чья запись победила?"""

[[exercises]]
name = "scya_q2"
kind = "question"
question.ru = """Сервис ставит каждому сообщению TTL 7 дней. Через месяц чтение старых чатов стало медленнее, хотя сообщений в них почти не осталось. Почему?"""
options.ru = ["""TTL не работает и сообщения не удаляются""", """Истёкшие ячейки стали надгробиями, и до уплотнения чтение продирается через них""", """Scylla хранит удалённое в отдельной таблице""", """Нужно перезапустить узлы"""]
answer = [1]
explain.ru = """Истёкший TTL превращает ячейку в надгробие, которое живёт до уплотнения после gc_grace_seconds. Чтение по партиции, где много надгробий, медленное (и есть предел числа надгробий на чтение). Для данных с TTL выбирают стратегию уплотнения по времени (TWCS), которая выбрасывает истёкшие файлы целиком."""
hint.ru = """Во что превращается ячейка, у которой истёк TTL?"""

[[exercises]]
name = "scya_q3"
kind = "question"
question.ru = """Unlogged batch из 500 вставок в 500 разных партиций против 500 параллельных подготовленных вставок с пределом 32 одновременных. Что быстрее и легче для кластера?"""
options.ru = ["""Batch: одна команда вместо пятисот""", """Параллельные вставки: каждая идёт сразу на узел-владелец, а batch нагружает один координатор, который сам рассылает части""", """Одинаково""", """Batch, если он logged"""]
answer = [1]
explain.ru = """Batch по разным партициям не экономит работу, а переносит её на координатора: тот держит всю пачку и рассылает части по узлам, и у batch есть предел размера. Параллельные token-aware вставки распределяют нагрузку. Unlogged batch полезен только для строк одной партиции."""
hint.ru = """Кто рассылает строки по узлам-владельцам в каждом из вариантов?"""

[[exercises]]
name = "scya_q4"
kind = "question"
question.ru = """Счётчик «просмотров поста» иногда завышен. В журналах видно, что при таймаутах клиент повторял запрос `UPDATE ... SET views = views + 1`. В чём дело?"""
options.ru = ["""Счётчики в Scylla неточны сами по себе""", """Прибавление не идемпотентно: после таймаута запрос мог примениться, и повтор прибавил второй раз""", """Нужен уровень ALL""", """Нужно USING TIMESTAMP"""]
answer = [1]
explain.ru = """Таймаут не значит «не применилось»: запрос мог примениться, а ответ потерялся. Повтор идемпотентной записи безопасен, повтор прибавления нет. Поэтому запросы к счётчикам помечают неидемпотентными, и драйвер их не повторяет, а точные числа считают другой моделью."""
hint.ru = """Что известно клиенту о запросе, на который не пришёл ответ?"""

[[exercises]]
name = "scya_q5"
kind = "question"
question.ru = """Запись идёт с ONE, чтение с ONE, реплик три. Пользователь отправил сообщение и сразу обновил страницу. Мог ли он не увидеть своё сообщение?"""
options.ru = ["""Нет, Scylla всегда отдаёт последнюю запись""", """Да: запись подтвердила одна реплика, а чтение могло попасть на другую, куда запись ещё не дошла""", """Нет, если сессия одна""", """Только при падении узла"""]
answer = [1]
explain.ru = """Свежесть гарантирована, когда реплик записи плюс реплик чтения больше, чем всего реплик (W + R > N). ONE + ONE это 2 из 3, пересечения может не быть. QUORUM + QUORUM (2 + 2 > 3) гарантирует, что чтение увидит подтверждённую запись."""
hint.ru = """Обязаны ли реплика, подтвердившая запись, и реплика, ответившая на чтение, совпасть?"""

