title.ru = "Expand и contract: переименование без остановки"

[[exercises]]
name = "pgmig1"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Состояние раннера это таблица с версиями. Что нужно знать про неё до цикла по файлам, и в каком порядке идти по файлам?""", """Создай таблицу через `CREATE TABLE IF NOT EXISTS`, прочитай применённые версии, отфильтруй файлы, отсортируй по версии. На каждый файл: выполнить SQL (`sqlx::raw_sql` принимает несколько команд) и вставить запись о версии. `sqlx::query` с несколькими командами не справится."""]
why.ru = """Раннер состоит из двух частей: журнал («что уже применено») и порядок («что дальше»). Порядок задаётся номерами версий, а не порядком файлов в списке или каталоге: файловая система отдаёт имена как ей вздумается. `raw_sql` использует простой протокол и принимает файл целиком с несколькими командами; обычный `query` готовит один запрос и на нескольких командах падает. Пока что применение и запись версии не связаны между собой, и это следующая проблема."""

[[exercises]]
name = "pgmig2"
style = "fix"
requires = ["postgres"]
hint.ru = ["""Команды и запись о версии идут на `pool`, то есть каждая в своём соединении и в своей транзакции. Они должны пережить сбой только вместе.""", """Открой транзакцию в начале `apply_one` и выполняй все команды и вставку на `&mut *tx`. Ошибка выйдет через `?`, транзакция будет брошена и откатится, `commit` в самом конце."""]
why.ru = """Миграция состоит из изменения схемы и записи о том, что оно сделано. Если они не в одной транзакции, между ними есть щель, и процесс может упасть именно там: схема уже изменилась, а журнал об этом не знает, и повторный запуск пытается сделать то же самое второй раз. В Postgres DDL транзакционный (в отличие от многих баз), поэтому откатить можно даже `CREATE TABLE`, и это нужно использовать всегда. Исключения есть (`CREATE INDEX CONCURRENTLY` не умеет работать в транзакции), и с ними раннер должен обращаться отдельно, об этом ниже."""

[[exercises]]
name = "pgmig_q1"
kind = "question"
question.ru = """Раннер выполняет команды миграции из трёх строк по одной на пуле, потом записывает версию. Вторая команда падает. Что в базе и что произойдёт при повторном запуске?"""
options.ru = ["Первая и вторая выполнены, а третья нет, запуск продолжится с третьей", "В базе ничего нет, повторный запуск пройдёт", "Первая команда осталась в базе, версия не записана, повторный запуск упадёт на первой команде: объект уже существует", "Записана версия с пометкой «ошибка», и раннер пропустит этот файл"]
answer = [2]
explain.ru = """Без транзакции каждая команда фиксируется сама. Упавшая вторая команда не откатывает первую, а запись о версии так и не появилась, поэтому раннер при следующем запуске считает файл новым и начинает с первой команды, которая теперь упирается в уже созданный объект. Раннер, который не умеет повторять собственные неудачи, вынуждает чинить базу руками. Транзакция на миграцию вместе с записью в журнал это решает (DDL в Postgres откатывается)."""
hint.ru = """Что фиксирует каждая команда, выполненная на пуле?"""

[[exercises]]
name = "pgmig3"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Для проверки нужно вспомнить, каким был текст файла в момент применения. Хранить весь текст не обязательно, достаточно его отпечатка.""", """Добавь в таблицу версий столбец `checksum`, при записи клади `md5(текст)`. Перед применением новых файлов пройди по записанным версиям, найди соответствующий файл в списке и сравни `md5` текущего текста с записанным. Не совпало, верни `Drift(версия)`."""]
why.ru = """Правка применённой миграции опасна тем, что тихо ломает единообразие: у одного окружения таблица `int`, у другого `bigint`, и тесты это не увидят. Контрольная сумма превращает тихое расхождение в громкую ошибку при старте. Проверку делают до применения нового, иначе половина релиза уже в базе, когда выясняется, что схема не та. Исправление ошибки в уже применённой миграции делается новой миграцией, а не правкой старой. Хеш считается по точному тексту, поэтому лишний пробел тоже считается правкой; некоторые раннеры нормализуют пробелы, но это решение надо принимать осознанно."""

[[exercises]]
name = "pgmig4"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Консультативный замок берёт функция Postgres, а принадлежит он соединению. Какое соединение должно держать замок, пока другое выполняет миграции?""", """Возьми отдельное соединение (`pool.acquire()`), на нём выполни `SELECT pg_advisory_lock($1)`. Миграции гоняй на пуле, журнал читай уже под замком. В конце на том же соединении `pg_advisory_unlock($1)`: и при успехе, и при ошибке миграции, иначе замок утечёт вместе с соединением в пул."""]
why.ru = """Один раз применить миграцию в кластере может только тот, кто держит общий для всех замок. Консультативные блокировки Postgres (advisory) подходят: они не привязаны к строкам, ключ придумывает приложение. Две ловушки. Первая: замок сессионный, поэтому его берут и снимают на одном и том же соединении, и если снятие забыто (например, при ошибке миграции), замок переживёт запрос вместе с соединением, которое вернулось в пул, и следующий запуск повиснет навсегда. Вторая: журнал читают уже под замком, иначе копия, дождавшаяся своей очереди, будет действовать по устаревшему списку. Транзакционный вариант (`pg_advisory_xact_lock`) не подходит, пока миграции идут отдельными транзакциями: замок исчез бы после первой же."""

[[exercises]]
name = "pgmig_q2"
kind = "question"
question.ru = """Раннер берёт `pg_advisory_lock` на соединении из пула, выполняет миграции и возвращает соединение в пул, забыв снять замок. Что будет дальше?"""
options.ru = ["Замок принадлежит сессии и останется на соединении в пуле: пока оно живо, любая другая копия, берущая тот же замок, будет ждать", "Замок исчезнет сам, когда запрос закончится", "Замок снимется при ближайшем COMMIT на любом соединении", "Postgres заметит возврат в пул и снимет замок"]
answer = [0]
explain.ru = """Консультативные замки без `xact` принадлежат сессии, то есть соединению, и живут до явного снятия или закрытия соединения. Пул не закрывает соединение при возврате, так что замок «утекает» вместе с ним. Особенно коварно, что приложение продолжает работать: ломаются только следующие запуски миграций (или другие задачи, берущие тот же ключ). Поэтому снятие замка пишут рядом с взятием и обязательно выполняют и при ошибке."""
hint.ru = """Кто хозяин сессионного замка и когда сессия кончается?"""

[[exercises]]
name = "pgmig5"
style = "fix"
requires = ["postgres"]
hint.ru = ["""Проблема в том, что ALTER ждёт замок сколько угодно, и все, кто пришёл позже, ждут вместе с ним. Ждать надо ограниченно: у Postgres есть параметр, который обрывает ожидание замка ошибкой.""", """Внутри транзакции выставь `lock_timeout` так, чтобы он жил только до конца транзакции (`set_config('lock_timeout', '300', true)`). Ошибка ожидания замка имеет код `55P03`. Ловишь её, бросаешь транзакцию, ждёшь чуть-чуть и пробуешь снова."""]
why.ru = """У DDL есть неприятное свойство: запросу `ALTER TABLE` нужен самый жёсткий замок (`ACCESS EXCLUSIVE`), и если таблицу читает хоть одна транзакция, он встаёт в очередь. Очередь честная: все новые запросы, даже обычные чтения, становятся в неё же позади ALTER. Поэтому ALTER, ждущий минуту, останавливает весь сервис, хотя сам ничего не делает. Лекарство: `lock_timeout` на время миграции. Лучше упасть через 300 мс и повторить через секунду, чем держать очередь. Повторов должно быть конечное число, а ошибки не про замок (опечатка, нарушение ограничения) не повторяются, они не лечатся временем."""

[[exercises]]
name = "pgmig_q3"
kind = "question"
question.ru = """`ALTER TABLE` ждёт, пока завершится чужая долгая транзакция, которая читала эту таблицу. Что в это время происходит с новыми `SELECT` по той же таблице?"""
options.ru = ["Читают старую копию таблицы", "Встают в очередь за ALTER и ждут вместе с ним, хотя сам по себе конфликта у них с чужой транзакцией нет", "Получают ошибку «таблица заблокирована»", "Выполняются как обычно: чтение не конфликтует с чтением"]
answer = [1]
explain.ru = """Блокировки Postgres выдаются по очереди: ALTER ждёт `ACCESS EXCLUSIVE`, который несовместим даже с чтением, и становится в голову очереди. Новый `SELECT` просит `ACCESS SHARE`, который совместим с держателем, но не с ждущим ALTER, а обгонять очередь нельзя. В итоге ожидание одной долгой транзакции останавливает весь трафик на таблицу. Лекарство: `lock_timeout` на время миграции и повтор."""
hint.ru = """Совместим ли новый запрос с теми, кто уже стоит в очереди?"""

[[exercises]]
name = "pgmig6"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Долго держит блокировку проверка существующих строк. Хорошо бы отделить момент, когда ограничение появляется, от момента, когда проверяются старые строки.""", """У ограничений CHECK есть форма `NOT VALID`: оно сразу действует для новых строк, а старые не проверяет. Потом команда `VALIDATE CONSTRAINT` проверяет их, не останавливая запись. Когда проверенный CHECK есть, `SET NOT NULL` в Postgres 12+ пропускает повторное чтение таблицы."""]
why.ru = """Полезно различать два вида блокировок. `ADD CONSTRAINT ... NOT VALID` берёт жёсткую блокировку на мгновение (только чтобы поменять каталог), а `VALIDATE CONSTRAINT` берёт мягкую (`SHARE UPDATE EXCLUSIVE`), совместимую с чтением и записью, и спокойно читает таблицу столько, сколько потребуется. Когда в таблице уже есть проверенный `CHECK (lang IS NOT NULL)`, `SET NOT NULL` доказывает себе, что значений NULL нет, по каталогу, а не по строкам, то есть тоже мгновенно. Трюк работает для NOT NULL, для внешних ключей (`NOT VALID` + `VALIDATE`) и для уникальности (через готовый уникальный индекс, созданный `CONCURRENTLY`). Общая мысль: долгие проверки отделяют от коротких жёстких блокировок."""

[[exercises]]
name = "pgmig_q4"
kind = "question"
question.ru = """На таблице в 200 миллионов строк надо сделать столбец NOT NULL. Какой вариант держит самую жёсткую блокировку дольше всех?"""
options.ru = ["`ADD CONSTRAINT ... CHECK (c IS NOT NULL) NOT VALID`", "`ALTER COLUMN c SET NOT NULL` на столбце без готового проверенного CHECK", "`SET NOT NULL` после того, как проверенный CHECK уже есть", "`VALIDATE CONSTRAINT` для этого ограничения"]
answer = [1]
explain.ru = """Без готового доказательства `SET NOT NULL` сам читает все строки и делает это под `ACCESS EXCLUSIVE`: на большой таблице это минуты, в течение которых нельзя ни читать, ни писать. `NOT VALID` и `SET NOT NULL` при готовом CHECK занимают мгновения, а `VALIDATE` читает всю таблицу, но под мягкой блокировкой, совместимой с чтением и записью."""
hint.ru = """Кто проверяет значения в каждом из вариантов и какая блокировка при этом держится?"""

[[exercises]]
name = "pgmig7"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Решить нужно по тексту файла: транзакционный он или нет. Чем отличаются две ветки выполнения?""", """Если файл начинается с `-- no-transaction`, раздели его по `;` и выполняй каждую команду по отдельности на пуле (`raw_sql` принимает одну). Версию запиши после всех команд. Для остальных файлов ничего не меняй."""]
why.ru = """Транзакция и `CREATE INDEX CONCURRENTLY` несовместимы по устройству: параллельное построение делает несколько проходов по таблице между отдельными транзакциями и ждёт завершения чужих. В результате миграция без транзакции теряет атомарность: если файл содержит две команды и упала вторая, первая останется. Поэтому такие файлы пишут по одной команде на файл, а раннер объявляет это договором (пометка в первой строке). Составная команда в простом протоколе (`raw_sql` с несколькими `;`) тоже идёт в неявной транзакции и для CONCURRENTLY не подходит, потому и приходится делить файл на команды."""

[[exercises]]
name = "pgmig8"
style = "bughunt"
requires = ["postgres"]
hint.ru = ["""Непригодные индексы видны в системном каталоге. Какой столбец какой таблицы сообщает, что индекс недействителен?""", """`pg_index.indisvalid = false`; не забудь ограничить поиск схемой соединения (`pg_namespace`, `current_schema()`). Определение индекса можно получить функцией `pg_get_indexdef(oid)` и выполнить с добавленным словом CONCURRENTLY.""", """Порядок для каждого индекса: `DROP INDEX CONCURRENTLY имя`, затем `CREATE ... INDEX CONCURRENTLY` по полученному определению. Оба раза команда одна и вне транзакции, поэтому выполняй их по очереди на пуле."""]
why.ru = """Когда `CREATE INDEX CONCURRENTLY` падает (дубликаты для UNIQUE, отмена, перезапуск), он оставляет индекс с `indisvalid = false`. Postgres продолжает его обновлять при записи, но не использует при чтении и не проверяет им уникальность. Такие обломки легко не заметить, а мониторингу они подсказывают, что что-то давно пошло не так. Починка: убрать обломок и создать заново после того, как причина устранена. Работать надо точечно (только непригодные, только своя схема): пересоздание здорового индекса на большой таблице это лишняя нагрузка, а то и простой."""

[[exercises]]
name = "pgmig_q5"
kind = "question"
question.ru = """`CREATE UNIQUE INDEX CONCURRENTLY` упал из-за дубликатов. Что осталось в базе?"""
options.ru = ["Временный файл, который удалится при перезапуске сервера", "Ничего: команда откатилась целиком", "Индекс с пометкой `indisvalid = false`: он обновляется при записи, но не используется в запросах и не защищает от дубликатов", "Рабочий индекс, который не проверяет уникальность"]
answer = [2]
explain.ru = """Обычный CREATE INDEX откатывается в транзакции, а CONCURRENTLY идёт несколькими транзакциями и не может откатиться целиком. Недостроенный индекс остаётся как обломок: он вносит свою долю в стоимость записи, но запросы его игнорируют. Его нужно найти (`pg_index.indisvalid`), удалить и создать заново после устранения причины."""
hint.ru = """Умеет ли команда, идущая несколькими транзакциями, откатиться целиком?"""

[[exercises]]
name = "pgmig9"
style = "scratch"
requires = ["postgres"]
hint.ru = ["""Подумай, что должно быть правдой в промежутке между шагами: старая версия не знает про `body`, новая не знает про `text`. Кто и как их синхронизирует?""", """Expand: добавь `body` (пока без NOT NULL, иначе старые вставки упадут), заполни существующие строки, создай триггерную функцию на plpgsql и триггер `BEFORE INSERT OR UPDATE`. Функция смотрит, какое из двух полей заполнено (при вставке) или изменено (при обновлении), и копирует его в другое.""", """Contract: сначала удали триггер и функцию, потом столбец `text`, потом поставь `body` NOT NULL. В теле триггерной функции работай с `NEW` и `OLD`; при UPDATE сравнивай значения через `IS DISTINCT FROM`."""]
why.ru = """Во время выкладки две версии приложения живут одновременно, и схема должна устраивать обе. Расширение (expand) только добавляет, ничего не ломая: новый столбец, копия данных и синхронизация, пока нужна. Сужение (contract) убирает лишнее, когда старой версии больше нет. Между шагами проходит релиз приложения, поэтому это два отдельных деплоя, а не одна миграция. Синхронизацию делает триггер `BEFORE`: он видит строку до проверок ограничений и успевает заполнить недостающее поле. `IS DISTINCT FROM` вместо `<>` нужен, чтобы NULL не прятал изменение. Самая частая ошибка: сделать `body` NOT NULL уже на шаге expand, и старая версия, не знающая про `body`, перестаёт вставлять строки."""

[[exercises]]
name = "pgmig_q6"
kind = "question"
question.ru = """Переименование столбца `text` в `body` делают через expand и contract. В каком порядке это происходит при выкладке?"""
options.ru = ["Миграция переименовывает столбец, затем выкатывается новая версия кода", "Миграция удаляет `text`, затем выкатывается новая версия кода", "Миграция добавляет `body` и синхронизацию, выкатывается новая версия кода, а потом отдельная миграция удаляет `text` и триггер", "Выкатывается новая версия кода, потом миграция переименовывает столбец"]
answer = [2]
explain.ru = """Пока выкладка идёт, обе версии кода работают с базой одновременно, и схема в каждый момент должна подходить обеим. Поэтому сначала схема расширяется (оба столбца живут и синхронизируются), потом меняется код, и только когда старой версии не осталось, схема сужается. Любой другой порядок на какое-то время ломает одну из версий."""
hint.ru = """Какая версия кода работает на сервере в момент каждой из миграций?"""

[[exercises]]
name = "pgmig10"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Заполнять нужно не все строки сразу, а ограниченную часть. Чем можно ограничить `UPDATE`, который сам не умеет `LIMIT`?""", """Подзапрос с `LIMIT`: `UPDATE ... WHERE id IN (SELECT id FROM posts WHERE body IS NULL ORDER BY id LIMIT $1)`. Каждый такой запрос на пуле фиксируется сам. Повторяй, пока затронуто не 0 строк."""]
why.ru = """Короткие транзакции делают backfill безопасным: блокировки держатся долю секунды, мёртвых версий строк одновременно накапливается немного, и репликация успевает следом. Условие `body IS NULL` делает цикл возобновляемым: после падения можно запустить снова, и работа продолжится с того места, где остановилась. Каждая пачка сама фиксируется, потому что запрос идёт на пуле, а не внутри общей транзакции (тест проверяет это по `xmin`: каждая транзакция оставляет свой номер). На реальной таблице между пачками полезна небольшая пауза и ограничение скорости, чтобы не придавить основную нагрузку."""

[[exercises]]
name = "pgmig_q7"
kind = "question"
question.ru = """В таблице 20 миллионов строк надо заполнить новый столбец. Чем плох один `UPDATE` на всю таблицу?"""
options.ru = ["Он вернёт ошибку по превышению лимита строк", "Ничем: Postgres выполнит его быстрее, чем много маленьких", "Одна длинная транзакция держит блокировки на изменяемых строках, удваивает размер таблицы мёртвыми версиями и давит на репликацию", "Столбец заполнится только у первых 65535 строк"]
answer = [2]
explain.ru = """Каждое изменение строки создаёт новую версию, и пока транзакция не завершилась, старые версии нельзя убрать. Двадцать миллионов обновлений в одной транзакции это двадцать миллионов мёртвых версий, большая блокировка строк, огромный журнал, который репликам придётся проиграть. Пачки по несколько тысяч строк, каждая в своей транзакции, оставляют базе возможность убирать за собой и делиться ресурсами с основной нагрузкой."""
hint.ru = """Когда можно убрать старую версию строки: сразу или после конца транзакции?"""

[[exercises]]
name = "pgmig_runner"
kind = "project"
style = "scratch"
quiz = true
requires = ["postgres"]
locked = ["tests/acceptance.rs"]
hint.ru = ["""Начни с `parse_dir`: это чистая функция над каталогом, она проверяется отдельно. В `Migrator` сначала сделай `status` и применение одной миграции, потом проверки журнала, потом замок и повторы.""", """Применение одной миграции: транзакция, `set_config('lock_timeout', ..., true)`, `raw_sql` текста, вставка в журнал с `md5($3)`, `commit`. Файл с пометкой `-- no-transaction` выполняется командами по одной на отдельном соединении, `lock_timeout` тогда ставится на сессию и сбрасывается после. Повтор по коду 55P03 вынеси в цикл вокруг этой функции.""", """Замок: отдельное соединение из пула, `pg_advisory_lock`, вся работа раннера, `pg_advisory_unlock` на том же соединении при любом исходе. Проверки журнала делай внутри замка, до применения первой новой миграции: пропавший файл, изменённая сумма, версия вне очереди."""]
why.ru = """Раннер собирает вместе всё, что было в главе: журнал версий и порядок, транзакцию на миграцию вместе с записью, контрольные суммы, общий замок на отдельном соединении, ограничение ожидания замка на таблицу с повтором, файлы без транзакции для CONCURRENTLY. Каждая деталь в отдельности простая, а ловушки в их сочетании: проверки надо делать под замком, замок надо снимать при любом исходе, ошибка в середине миграции не должна оставлять половину, а повтор по таймауту должен ловить только 55P03. Именно такой раннер и нужен сервисам: он не требует внешних утилит и ведёт себя одинаково в проде, в тестах и на машине разработчика."""

[[exercises]]
name = "pgmig_zero_downtime"
style = "scratch"
requires = ["postgres"]
quiz = true
hint.ru = ["""Разложи на три независимых изменения: переименование, NOT NULL, внешний ключ. Переименование делается через промежуточную фазу, в которой работают оба столбца; NOT NULL и внешний ключ делаются так, чтобы долгая проверка шла отдельной командой.""", """Для переименования: добавить `body`, перенести данные, поставить триггер синхронизации в обе стороны. Для NOT NULL: CHECK ... NOT VALID, VALIDATE, SET NOT NULL, удалить CHECK. Для внешнего ключа: ADD CONSTRAINT ... NOT VALID, затем VALIDATE CONSTRAINT.""", """В конце, когда старой версии не осталось: удалить триггер, функцию триггера, потом столбец `text`. Порядок важен: пока в таблице есть триггер, он ссылается на столбец, который хотят удалить."""]
why.ru = """Схема под живой нагрузкой меняется по правилам, и квиз собирает их вместе. Первое: каждое изменение должно быть совместимо и со старой, и с новой версией кода, поэтому переименование превращается в «добавить, синхронизировать, потом убрать». Второе: долгие проверки (все строки на NOT NULL, на внешний ключ) отделяются от коротких жёстких блокировок через NOT VALID и VALIDATE. Третье: убирать леса можно только после того, как исчезла последняя версия, которая ими пользовалась, то есть отдельным релизом позже. Тест проверяет состояние после каждой команды, потому что «в конце всё хорошо» не спасает приложение, которое упало на втором шаге."""

