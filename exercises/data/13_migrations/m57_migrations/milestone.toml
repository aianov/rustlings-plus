test_command = ["cargo", "make", "check"]
requires = ["postgres", "nats"]
hint.ru = [
"""Раннер держит одно соединение: `CREATE TABLE IF NOT EXISTS schema_migrations`, `pg_advisory_lock`, чтение
применённых версий, применение недостающих, `pg_advisory_unlock`. Замок сессионный, поэтому всё на одном соединении.""",
"""Каждая миграция это своя транзакция: `SET LOCAL lock_timeout`, сам файл, запись версии, COMMIT. Ошибка 55P03 или
40P01 значит «подожди и повтори»; остальное возвращай с именем файла.""",
"""Файл с `-- migrate: no-transaction` выполняй по одной команде вне транзакции: `CREATE INDEX CONCURRENTLY` и
`CALL` процедуры с COMMIT внутри иначе не работают. Недостроенный индекс после сбоя убирай `DROP INDEX CONCURRENTLY IF
EXISTS` в начале того же файла.""",
"""Переезд колонки: сначала новая колонка и триггер, который заполняет пустую из второй, потом перенос пачками, потом
`CHECK ... NOT VALID` и отдельной миграцией `VALIDATE`, и только когда старого кода нет, удаление старой колонки.""",
]
story.ru = """Схема соцсети меняется на ходу: у каждого сервиса журнал применённых миграций, мигрирует один экземпляр,
а колонка поста переезжает под новым именем, пока старый код ещё работает, и ни один клиент не видит ошибки."""
