[chapter]
title.en = "Redis data types"
title.ru = "Типы данных Redis"

[[exercises]]
name = "rds1"
style = "fix"
requires = ["redis"]
hint.ru = """Чем ключи разных пользователей должны отличаться? Вставь id в середину по схеме из шапки."""
why.ru = """У Redis нет таблиц и столбцов: структура данных целиком в именах ключей. Схема «пространство:сущность:id:поле» читается людьми, позволяет искать ключи по маске и не даёт сервисам и сущностям наступать друг на друга. Пространство имён впереди нужно, когда один Redis делят несколько сервисов или окружений."""

[[exercises]]
name = "rds2"
style = "fix"
requires = ["redis"]
hint.ru = ["""Какие опции SET делают запись условной и задают срок?""", """`NX` пишет, только если ключа нет; `EX секунды` ставит срок той же командой. Если запись не случилась, Redis отвечает nil.""", """`SET key user NX EX 600` и `!reply.is_nil()`."""]
why.ru = """SET с NX и EX делает проверку, запись и срок одной атомарной командой. Отдельные SETNX и EXPIRE оставляют окно: процесс упал между ними, и бронь стала вечной. Ответ nil говорит, что ключ уже был, и именно на нём строятся брони, дедупликация и простые блокировки."""

[[exercises]]
name = "rds3"
style = "fix"
requires = ["redis"]
hint.ru = ["""Что SET делает со сроком ключа, который перезаписывает?""", """Обычный SET ставит новое значение без срока. У SET есть опция, которая оставляет текущий срок ключа."""]
why.ru = """SET это не «поменять значение», а «записать ключ заново», и срок прежнего ключа пропадает. Это один из самых частых источников утечек памяти в Redis: ключи, которым забыли вернуть срок, копятся годами. KEEPTTL сохраняет оставшийся срок, а если обновление должно продлевать сессию, срок ставят явно через EX той же командой."""

[[exercises]]
name = "rds4"
style = "fix"
requires = ["redis"]
hint.ru = ["""Где происходит «прочитать, прибавить, записать», и может ли между этими шагами вклиниться другой клиент?""", """Redis выполняет каждую команду целиком, ни с чем не смешивая. Значит, всё изменение должно быть одной командой, которая сама прибавляет и возвращает новое значение.""", """`INCR key` и номер просмотра из ответа."""]
why.ru = """Redis однопоточен в исполнении команд: одна команда целиком, потом следующая. Атомарна каждая команда, но не последовательность команд одного клиента: между GET и SET успевают пройти чужие. INCR, INCRBY, HINCRBY, ZINCRBY делают чтение и запись одной командой и возвращают новое значение, поэтому счётчики в Redis пишут только ими."""

[[exercises]]
name = "rds5"
style = "fix"
requires = ["redis"]
hint.ru = ["""Есть ли команды, которые читают и пишут сразу много ключей?""", """MGET отдаёт значения многих ключей массивом в том же порядке (nil для отсутствующих), MSET пишет пары ключ-значение одной командой. Пустой список им передавать нельзя.""", """Собери вектор аргументов `["MGET", key1, key2, ...]`, а для MSET чередуй ключи и имена; результат MGET разбери через `list()` и `text()`."""]
why.ru = """В Redis команда выполняется за микросекунды, а сеть стоит сотни микросекунд, поэтому число обменов почти всегда важнее числа команд. MGET и MSET превращают N обменов в один и при этом атомарны. Когда команды разные, то же даёт pipeline: несколько команд пишутся разом, а ответы читаются пачкой."""

[[exercises]]
name = "rds6"
style = "todo"
requires = ["redis"]
hint.ru = ["""Какие команды хеша пишут несколько полей сразу, читают все поля и прибавляют к одному полю?""", """`HSET key поле значение поле значение ...`, `HGETALL key` (массив вперемешку: поле, значение, поле, значение; пустой, если ключа нет), `HINCRBY key поле 1`.""", """Ключ `<ns>:user:<id>:profile`; ответ HGETALL разбери парами через `chunks(2)`."""]
why.ru = """Хеш это маленький словарь в одном ключе: поля читаются и меняются по отдельности, а HINCRBY атомарен так же, как INCR. Поэтому профиль в хеше переживает параллельные изменения разных полей, а JSON-строка нет. Срок жизни ставится на весь ключ, не на поле, и это частая причина выбрать несколько ключей вместо одного хеша."""

[[exercises]]
name = "rds7"
style = "fix"
requires = ["redis"]
hint.ru = ["""Какие команды списка убирают все вхождения значения и обрезают список до первых N элементов?""", """Перед LPUSH удали гостя из списка (`LREM key 0 viewer`), после обрежь хвост (`LTRIM key 0 9`). Три команды удобно отправить одним pipeline.""", """`c.pipeline(&[&["LREM", .., "0", v], &["LPUSH", .., v], &["LTRIM", .., "0", "9"]])`."""]
why.ru = """LPUSH плюс LTRIM это классический «последние N» в Redis: список не растёт, обрезка дешёвая. LREM перед вставкой делает элементы уникальными. Pipeline экономит обмены, но не делает три команды атомарными: между ними могут пройти чужие команды. Здесь это не страшно (в худшем случае список на мгновение короче), а там, где страшно, нужен MULTI или Lua из следующей главы."""

[[exercises]]
name = "rds8"
style = "todo"
requires = ["redis"]
hint.ru = ["""Какая структура хранит уникальные элементы и умеет проверять принадлежность и пересекать наборы?""", """Множество: `SADD key элемент`, `SISMEMBER key элемент` (1 или 0), `SINTER key1 key2` (пересечение на сервере). Порядок в множестве не определён, отсортируй сам.""", """Ключ `<ns>:user:<id>:following`, id храни строками и разбирай обратно через `parse`."""]
why.ru = """Множество гарантирует уникальность без проверок со стороны клиента, а SINTER, SUNION и SDIFF считаются на сервере и не тащат по сети оба набора. На больших множествах (миллионы элементов) пересечение уже ощутимо нагружает Redis, поэтому его используют для небольших наборов вроде подписок обычного пользователя."""

[[exercises]]
name = "rds9"
style = "fix"
requires = ["redis"]
hint.ru = ["""В каком порядке ZRANGE отдаёт элементы по умолчанию?""", """По умолчанию по возрастанию счёта. У ZRANGE есть опция, которая разворачивает порядок."""]
why.ru = """Sorted set держит элементы упорядоченными по счёту всегда, поэтому «топ N» это чтение первых N, а не сортировка. ZADD с существующим элементом меняет его счёт и место. Опция REV (Redis 6.2+) заменила отдельную ZREVRANGE, а BYSCORE и LIMIT позволяют выбирать по диапазону счёта, это понадобится для скользящего окна в главе про паттерны."""

[[exercises]]
name = "rds10"
style = "todo"
requires = ["redis"]
hint.ru = ["""Какая команда даёт место по убыванию? Как в Redis записать «строго меньше» в диапазоне счёта?""", """`ZINCRBY key очки user` возвращает новый счёт строкой (может быть дробным), `ZREVRANK` даёт индекс с нуля по убыванию или nil, `ZREMRANGEBYSCORE key -inf (min` удаляет строго меньше min: круглая скобка делает границу исключающей.""", """Место это `ZREVRANK + 1`; счёт из ZINCRBY разбери как f64."""]
why.ru = """Sorted set решает задачу лидеров целиком: прибавление атомарно (ZINCRBY), место считается за логарифм (ZREVRANK), чистка диапазоном одной командой. Счёт в Redis это double, поэтому ответы со счётом приходят строкой с плавающей точкой. Исключающая граница через скобку часто забывается: без неё ZREMRANGEBYSCORE удалил бы и тех, у кого ровно 10."""

[[exercises]]
name = "rds11"
style = "fix"
requires = ["redis"]
hint.ru = ["""Какая структура Redis считает уникальные элементы приблизительно и за постоянную память?""", """HyperLogLog: `PFADD key элемент...` добавляет, `PFCOUNT key` оценивает число уникальных. Внутри это обычная строка до 12 КБ."""]
why.ru = """HyperLogLog хранит не элементы, а статистику хешей, поэтому его размер не зависит от числа элементов, а ошибка оценки около 0,81%. Добавить элемент и посчитать можно, а вот узнать, был ли конкретный зритель, или удалить его нельзя. Для «сколько уникальных» это идеальный обмен точности на память, а для «смотрел ли этот пользователь» нужны множество или Bloom-фильтр."""

[[exercises]]
name = "rds12"
style = "fix"
requires = ["redis"]
hint.ru = ["""Какая команда обходит ключи порциями и возвращает курсор для продолжения? Когда обход закончен?""", """`SCAN курсор MATCH маска COUNT 100` возвращает массив: новый курсор и порцию ключей. Обход начинается с курсора 0 и заканчивается, когда сервер вернул курсор 0. Один ключ может прийти дважды, поэтому собирай в множество.""", """Цикл: `SCAN cursor MATCH pattern COUNT 100`, курсор из первого элемента, ключи из второго в `BTreeSet`, выход при курсоре "0"."""]
why.ru = """KEYS проходит все ключи базы одной командой, а Redis выполняет команды по одной, поэтому на время KEYS встаёт весь сервис. SCAN делает ту же работу маленькими шагами между чужими командами. Плата за это: ключ может прийти дважды, а ключи, созданные во время обхода, могут не попасть. Ещё лучше не искать по маске вовсе: держать множество сессий пользователя (это будет в главе про паттерны)."""

[[exercises]]
name = "rds_profile_types"
style = "scratch"
requires = ["redis"]
quiz = true
hint.ru = ["""Каждый пункт это одна из задач главы: хеш со счётчиком, «последние N» на списке, HyperLogLog, sorted set.""", """Просмотр это одна пачка из семи команд в pipeline. Карточку читай тоже одной пачкой из трёх команд.""", """Срок ставь командой EXPIRE после записи в список и в HyperLogLog, в той же пачке."""]
why.ru = """Каждая структура Redis здесь на своём месте: счётчик в хеше, «последние» в обрезаемом списке, уникальные в HyperLogLog, рейтинг тегов в sorted set. Pipeline делает просмотр одним обменом, а сроки не дают данным неактивных профилей копиться вечно."""

[[exercises]]
name = "rds_q1"
kind = "question"
question.ru = """Сервис делает `SET user:7:name kate`, а через минуту `EXPIRE user:7:name 3600`. Между ними сервис перезапустили. Что с ключом?"""
options.ru = ["""Через час исчезнет: Redis запомнил намерение""", """Живёт вечно: срок так и не поставлен""", """Исчезнет при перезапуске Redis""", """SET без срока запрещён, ключа нет"""]
answer = [1]
explain.ru = """Срок это отдельная запись, и если до EXPIRE дело не дошло, ключ вечен. Поэтому срок ставят той же командой: `SET key value EX 3600`."""
hint.ru = """Сколько команд нужно, чтобы ключ получил срок?"""

[[exercises]]
name = "rds_q2"
kind = "question"
question.ru = """Два клиента одновременно выполняют `HINCRBY post:1 likes 1`. Каким будет likes, если до этого было 10?"""
options.ru = ["""11: одно изменение потеряется""", """12: каждая команда выполняется целиком, одна после другой""", """Случайно 11 или 12""", """Ошибка конфликта"""]
answer = [1]
explain.ru = """Redis выполняет команды по одной, каждую целиком. Команды вида INCR, HINCRBY, ZINCRBY читают и пишут внутри одной команды, поэтому потерь нет. Теряются изменения, сделанные в несколько команд (GET, потом SET)."""
hint.ru = """Может ли Redis выполнять две команды одновременно?"""

[[exercises]]
name = "rds_q3"
kind = "question"
question.ru = """Зачем HyperLogLog, если можно хранить множество id зрителей?"""
options.ru = ["""HyperLogLog точнее""", """HyperLogLog занимает до 12 КБ при любом числе элементов ценой небольшой погрешности, а множество растёт с каждым зрителем""", """Множество не умеет считать элементы""", """HyperLogLog умеет удалять элементы"""]
answer = [1]
explain.ru = """Множество хранит каждый id и честно считает, но память растёт линейно. HyperLogLog хранит только статистику хешей, его размер постоянен, а ошибка около 0,81%. Платить приходится тем, что нельзя проверить конкретный элемент или удалить его."""
hint.ru = """От чего зависит размер HyperLogLog?"""

[[exercises]]
name = "rds_q4"
kind = "question"
question.ru = """Что не так с `KEYS cache:*` в обработчике HTTP-запроса?"""
options.ru = ["""Ничего, это быстрая команда""", """KEYS обходит все ключи базы одной командой, и пока он работает, Redis не отвечает никому""", """KEYS не поддерживает маски""", """KEYS возвращает ключи с дублями"""]
answer = [1]
explain.ru = """Redis выполняет команды по одной, а KEYS это проход по всем ключам. На миллионах ключей это сотни миллисекунд простоя для всех клиентов. Для обхода есть SCAN, а для частых поисков структуру держат явно (множество ключей)."""
hint.ru = """Что делает однопоточный сервер, пока выполняет долгую команду?"""

[[exercises]]
name = "rds_q5"
kind = "question"
question.ru = """В Redis закончилась память, политика `maxmemory-policy allkeys-lru`. Что произойдёт при следующей записи?"""
options.ru = ["""Запись упадёт с ошибкой OOM""", """Redis удалит давно не использованные ключи (с любым сроком или без) и выполнит запись""", """Redis сбросит всё на диск и очистит память""", """Redis удалит только ключи со сроком"""]
answer = [1]
explain.ru = """allkeys-lru вытесняет приблизительно самые давно используемые ключи из всех. volatile-lru вытесняет только ключи со сроком, а noeviction отвечает ошибкой на запись. Для кэша выбирают allkeys-*, для данных, которые терять нельзя, noeviction и отдельный экземпляр."""
hint.ru = """Что означает allkeys в имени политики?"""

[[exercises]]
name = "m61_redis_client"
kind = "milestone"
journey = "backend"
quiz = true
