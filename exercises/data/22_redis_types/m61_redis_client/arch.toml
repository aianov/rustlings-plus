message.ru = "Обслуживание партиций идёт функцией владельца: роль приложения DDL не делает."

[[rules]]
kind = "contains"
globs = ["deploy/postgres/roles.sql"]
regex = 'idle_in_transaction_session_timeout'
message.ru = "У роли приложения свои statement_timeout и idle_in_transaction_session_timeout."

[[rules]]
kind = "workspace_deps"
packages = ["src/crates/store-engine"]
message.ru = "store-engine подключается через [workspace.dependencies]."

[[rules]]
kind = "deps"
package = "src/crates/store-engine"
allow_only = [
  "bytes",
  "scylla",
  "service-runtime",
  "tokio",
  "uuid",
]
message.ru = "store-engine держится на scylla, bytes, uuid и service-runtime."

[[rules]]
kind = "exists"
paths = ["src/microservices/chat-service/cql/0001_chat.cql"]
message.ru = "Схема чата лежит в cql/ сервиса."

[[rules]]
kind = "not_contains"
globs = ["src/microservices/chat-service/src/**/*.rs"]
regex = 'ALLOW FILTERING'
message.ru = "ALLOW FILTERING это полный проход по кластеру: таблицы строятся под запросы."

[[rules]]
kind = "contains"
globs = ["src/microservices/chat-service/cql/0001_chat.cql"]
regex = 'PRIMARY KEY \(\(chat, bucket\), id\)'
message.ru = "Партиция сообщений это диалог и месяц."

[[rules]]
kind = "contains"
globs = ["src/microservices/chat-service/cql/0001_chat.cql"]
regex = 'CLUSTERING ORDER BY \(id DESC\)'
message.ru = "Свежие сообщения читаются первыми: timeuuid по убыванию."

[[rules]]
kind = "contains"
globs = ["src/microservices/chat-service/cql/0001_chat.cql"]
regex = 'CLUSTERING ORDER BY \(last_at DESC, peer ASC\)'
message.ru = "Чаты упорядочены по последней активности."

[[rules]]
kind = "contains"
globs = ["src/microservices/chat-service/src/repository/scylla.rs"]
regex = 'execute_paged'
message.ru = "История листается по paging state драйвера."

[[rules]]
kind = "contains"
globs = ["src/microservices/chat-service/src/repository/scylla_pages.rs"]
regex = 'execute_iter'
message.ru = "Вся переписка выгружается потоком execute_iter."

[[rules]]
kind = "contains"
globs = ["src/microservices/chat-service/src/repository/scylla.rs"]
regex = 'prepared\(&session'
message.ru = "Запросы готовятся один раз при создании репозитория."

[[rules]]
kind = "contains"
globs = ["src/crates/store-engine/src/session/mod.rs"]
regex = 'await_schema_agreement'
message.ru = "Сессия ждёт согласия схемы после DDL."

[[rules]]
kind = "not_contains"
globs = ["src/crates/store-engine/src/**/*.rs"]
regex = 'panic!'
message.ru = "В store-engine нет panic!: ошибки идут значениями."

[[rules]]
kind = "not_contains"
globs = ["src/microservices/chat-service/src/**/*.rs"]
regex = 'UNLOGGED BATCH'
message.ru = "UNLOGGED BATCH по разным партициям не атомарен: сообщение в две таблицы идёт logged batch."

[[rules]]
kind = "contains"
globs = ["src/microservices/chat-service/src/repository/scylla.rs"]
regex = 'BatchType::Logged'
message.ru = "Сообщение пишется в две таблицы одним logged batch."

[[rules]]
kind = "contains"
globs = ["src/microservices/chat-service/src/repository/scylla.rs"]
regex = 'IF NOT EXISTS'
message.ru = "Личный чат двоих создаётся один раз: лёгкая транзакция IF NOT EXISTS."

[[rules]]
kind = "contains"
globs = ["src/microservices/chat-service/src/repository/scylla.rs"]
regex = 'members = members \+ \?'
message.ru = "Участники копятся в set без перезаписи."

[[rules]]
kind = "contains"
globs = ["src/microservices/chat-service/src/repository/scylla.rs"]
regex = 'USING TTL \?'
message.ru = "Исчезающие сообщения живут TTL."

[[rules]]
kind = "contains"
globs = ["src/microservices/chat-service/src/repository/scylla_more.rs"]
regex = 'USING TIMESTAMP \?'
message.ru = "Правка несёт своё время: поздняя старая правка не затирает новую."

[[rules]]
kind = "contains"
globs = ["src/microservices/chat-service/src/repository/scylla_more.rs"]
regex = 'id > \? LIMIT \?'
message.ru = "Непрочитанное считается от last_read с пределом."

[[rules]]
kind = "contains"
globs = ["src/microservices/chat-service/src/repository/scylla_more.rs"]
regex = 'Consistency::LocalOne'
message.ru = "Уровни консистентности выбираются по операции."

[[rules]]
kind = "workspace_deps"
packages = ["src/crates/resp-client"]
message.ru = "resp-client подключается через [workspace.dependencies]."

[[rules]]
kind = "deps"
package = "src/crates/resp-client"
forbid = [
  "redis",
  "fred",
  "deadpool-redis",
]
message.ru = "Клиент Redis пишем сами: готовые redis, fred и deadpool-redis не берём."

[[rules]]
kind = "deps"
package = "src/crates/resp-client"
allow_only = [
  "bytes",
  "framing",
  "tokio",
]
message.ru = "resp-client держится на tokio, bytes и framing."

[[rules]]
kind = "no_comments"
globs = ["src/crates/resp-client/**/*.rs"]
message.ru = "В resp-client нет комментариев: имена говорят сами."

[[rules]]
kind = "not_contains"
globs = ["src/microservices/**/*.rs"]
regex = '"KEYS"'
message.ru = "KEYS блокирует Redis на весь проход: ключи перебираются SCAN."

[[rules]]
kind = "contains"
globs = ["src/crates/resp-client/src/codec/mod.rs"]
regex = 'impl Decoder for RespCodec'
message.ru = "Кодек RESP собран на трейтах framing."

[[rules]]
kind = "contains"
globs = ["src/crates/resp-client/src/codec/mod.rs"]
regex = 'max_depth'
message.ru = "У кодека пределы: длина строки, число элементов, глубина."

[[rules]]
kind = "contains"
globs = ["src/crates/resp-client/src/conn/mod.rs"]
regex = 'VecDeque<Waiting>'
message.ru = "Соединение это актор с очередью ответчиков."

[[rules]]
kind = "contains"
globs = ["src/crates/resp-client/src/keys/mod.rs"]
regex = 'KEY_ROOT: &str = "social"'
message.ru = "Ключи строятся по схеме имён."

[[rules]]
kind = "contains"
globs = ["src/microservices/post-service/src/client/heat/mod.rs"]
regex = '"PFADD"'
message.ru = "Уникальные просмотры считает HyperLogLog."

[[rules]]
kind = "contains"
globs = ["src/microservices/post-service/src/client/heat/mod.rs"]
regex = '"ZINCRBY"'
message.ru = "Популярные теги копятся в sorted set по часам."

[[rules]]
kind = "contains"
globs = ["src/microservices/user-service/src/client/guests/mod.rs"]
regex = '"LTRIM"'
message.ru = "Гости профиля это короткий список LPUSH и LTRIM."
