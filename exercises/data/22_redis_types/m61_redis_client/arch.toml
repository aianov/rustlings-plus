message.ru = "Не хватает файла из дерева вехи. Ядра social-core больше нет: правила соцсети живут в сервисах. Каждый сервис в src/microservices разложен по слоям: main.rs, lib.rs, bootstrap/ (сборка и запуск), controller/ (вход gRPC или HTTP), dto/ (перевод транспортных типов), service/ (правила и порты к соседям), repository/ (хранение за трейтами, mod.rs и memory.rs), client/ (клиенты соседей), common/ (конфиг, ошибки, доменные типы). У шлюза вместо service и repository есть routes/ (таблица WS-методов). Журнал NDJSON живёт в src/crates/journal (file/, error/), отчёт об ошибке в service-runtime/src/report, замер ленты в post-service/examples/feed_bench.rs. Остальное дерево прежнее: contracts, proto, grpc-kit, certgen, tls-edge, свои движки, framing, minifuzz, http-client, service-runtime, tools/xtask и tools/social-cli. В m34 к ним добавились: service-runtime/src/config (mod.rs, dotenv.rs, secret.rs), signals, trail, health, startup, background, lifecycle; крейт src/crates/admin (routes/, server/) с /health и /ready; contracts/src/health (LiveView, ReadyView, CheckView); journal/src/health (JournalHealth). В m35 к ним добавились: крейт src/crates/validation (pattern/, rule/ с url.rs, validator/); contracts/src/errors (mod.rs, json.rs), email/, patch/; user-service/src/common/profile.rs; post-service/src/common/draft.rs и repository/entry.rs; api-gateway/src/controller/errors.rs. В m36 к ним добавились: auth-service/src/service/token (mod.rs, base64.rs, hmac.rs, keys.rs), service/password, service/exits.rs, letters.rs, mail.rs, repository/sessions.rs и once.rs, client/mail.rs; contracts/src/role; service-runtime/src/config/fields.rs. repository/tokens.rs больше нет: токены подписаны, а сессии лежат в sessions.rs. В m37 к ним добавились: http-engine/src/proxy (строка PROXY), http-client/src/conn (TCP или TLS), у шлюза common/principal.rs (Principal и Visitor), dto/data.rs (типы data методов), controller/work.rs (задачи сокета), controller/proxy.rs (обратный прокси /auth/*) и client/upstream.rs (HTTP-клиент auth-service). В m38 к ним добавились: крейт src/crates/nats-engine (bus/ с subscription.rs и server.rs, config/, error/, meta/, subject/), contracts/src/topics (схема тем) и notice/ (виды уведомлений), разбор вызовов в contracts/src/api/decode.rs, порт событий service/events.rs и адаптер client/events.rs в user-service и post-service, новый сервис src/microservices/notify-service по тем же слоям (controller/ с events.rs и requests.rs, client/ с users.rs и courier.rs, service/ с audience.rs и courier.rs, repository/ с memory.rs, common/ с config.rs, error.rs, notice.rs, stats.rs), у шлюза client/notify.rs, controller/notices.rs и routes/notify.rs. В m39 к ним добавились: nats-engine/src/js (mod.rs: stream и публикация с подтверждением, feed.rs: durable-читатель, dead.rs: мёртвая тема). В m40 к ним добавились: contracts/src/domain (конверт события, факты, upcast.rs) и outbox/, nats-engine/src/js/replay.rs, proto feed.proto, в user-service и post-service client/relay.rs и repository/outbox.rs (у user-service ещё entry.rs и common/clock.rs, у post-service state.rs), новый сервис src/microservices/feed-service по слоям (controller/ с events.rs и grpc.rs, common/ с change.rs). Порта Events и адаптеров client/events.rs больше нет: событие пишется в outbox вместе с изменением. В m41 к ним добавились: contracts/src/realtime (печатает, отзыв сессий, «в сети»), nats-engine js/live.rs, js/history.rs и js/kv.rs, в шлюзе common/outbox.rs и controller/presence.rs с соседями subs.rs и revoked.rs, в chat-service client/relay.rs, client/typing.rs, repository/outbox.rs, service/typing.rs и common/clock.rs, в auth-service client/revoker.rs. Потока Subscribe больше нет: client/inbox.rs шлюза и service/hub.rs чата удалены. В m42 к ним добавились: крейт src/crates/jobs (job, policy, queue, worker, periodic, lease, checkpoint, saga), nats-engine js/pull.rs, в auth-service service/deletion.rs, client/saga.rs и controller/jobs.rs, в user-service repository/lifecycle.rs и repository/state.rs, в notify-service controller/jobs.rs. В m43 к ним добавились: крейт src/crates/files (store, limit, content, image, sign, serve), в user-service service/avatars.rs, в шлюзе common/links.rs. В m44 к ним добавились: крейт src/crates/test-support (eventually, builders, faults, random, roots) и пакет tests/e2e (stack, client, golden, flaky, brokers, waiting и тесты scenario, events, faults, model). В m45 к ним добавились: в service-runtime telemetry, metrics и propagation, в шлюзе controller/observe.rs. В m46 к ним добавились: tools/loadgen (histogram, model, scenario, report, ramp, cli) и в service-runtime runtime_stats и watchdog. В m47 к ним добавились: service-runtime resilience (deadline, retry, breaker, bulkhead, buckets), в шлюзе common/guards.rs, controller/limits.rs и routes/profiles.rs, в post-service service/idempotency.rs. В m48 к ним добавились: в feed-service common/cursor.rs, common/limits.rs и repository/state.rs, в service-runtime ids и cache, в шлюзе common/profiles.rs и controller/invalidate.rs. В m49 к ним добавились: в post-service client/preview/ (а relay и users стали папками рядом с ним), controller/drafts.rs и repository/drafts.rs, в auth-service service/throttle.rs, в шлюзе controller/drafts.rs, в http-client guard/. В m50 к ним добавились: tools/devctl (plan, process, control), tools/healthcheck (probe), Dockerfile каждого сервиса, docker-compose.yml и .dockerignore, в шлюзе client/replicas.rs. В m51 к ним добавились: крейт src/crates/db-engine (config, error, migrate, outbox, pool), migrations/0001_init.sql у auth, user и post и их репозитории на Postgres (pg*.rs). В m52 к ним добавились: запросы соцсети queries.rs у user и post, их слои service и controller, controller/stream.rs у post-service и routes/social.rs у шлюза. В m53 к ним добавились: migrations/0002_threads.sql и threads.rs в repository, service и controller post-service, routes/threads.rs у шлюза. В m54 к ним добавились: миграции 0002_counters.sql у user и 0003_pins.sql у post, pg_follow.rs, pins.rs и schema.rs в репозиториях, pins.rs в service, controller и шлюзе, controller/writes.rs. В m55 к ним добавились: tx и like в db-engine, bulk.rs и search.rs в репозитории постов, search.rs в service и controller, controller/export.rs у шлюза. В m56 к ним добавились миграции индексов 0004_indexes.sql у post и 0003_indexes.sql у user. В m57 к ним добавились: db-engine migrate/checksum.rs, tools/xtask/src/migrate.rs и миграции переезда posts.text в posts.body (0005..0009) и индекса без транзакции (0010). В m58 к ним добавились: полнотекстовый поиск и тренды post-service (0011, repository/fulltext.rs, service/text.rs), поиск людей и настройки user-service (0004, repository/people.rs, common/settings.rs, service/extras.rs, controller/extras.rs и files.rs), notify-service на Postgres (migrations/0001_init.sql, repository/pg.rs), routes/settings.rs шлюза и deploy/postgres/roles.sql. В m59 к ним добавились: крейт src/crates/store-engine (config, cursor, error, schema, session, timeuuid), у chat-service cql/0001_chat.cql, repository/scylla.rs, scylla_pages.rs и service/pages.rs. В m60 к ним добавились: cql/0002_chat_more.cql, repository/scylla_more.rs и service/extras.rs у chat-service. В m61 к ним добавились: крейт src/crates/resp-client (client, codec, command, config, conn, keys, value), у post-service client/heat/ и service/heat.rs, у user-service client/guests/ и service/guests.rs, а relay.rs стал client/relay/."

[[rules]]
kind = "allowed_children"
dirs = ["src"]
allowed = ["crates", "microservices"]
message.ru = "В src/ корня только две папки: crates/ для библиотек и microservices/ для сервисов."

[[rules]]
kind = "absent"
globs = ["tests/*.rs"]
message.ru = "В корне воркспейса нет пакета, поэтому tests/*.rs там никто не скомпилирует, и тесты молча перестанут работать. Тесты прошлых вех живут в tests/ своих пакетов."

[[rules]]
kind = "not_contains"
globs = ["Cargo.toml"]
regex = '^\[package\]'
message.ru = "Корневой Cargo.toml виртуальный: в нём [workspace] и общие таблицы, а [package] нет. Пакеты это src/crates/* и tools/*."

[[rules]]
kind = "contains"
globs = ["Cargo.toml"]
regex = 'resolver = "3"'
message.ru = "В виртуальном корне нужна строка `resolver = \"3\"` в [workspace]: у корня нет edition, и без неё cargo молча возьмёт старый резолвер."

[[rules]]
kind = "workspace_members"
members = [
  "src/crates/contracts",
  "src/crates/service-runtime",
  "tools/xtask",
  "src/crates/framing",
  "src/microservices/api-gateway",
  "tools/social-cli",
  "src/crates/http-engine",
  "src/crates/minifuzz",
  "src/crates/http-client",
  "src/crates/websocket-engine",
  "src/crates/proto",
  "src/microservices/user-service",
  "src/microservices/post-service",
  "src/microservices/auth-service",
  "src/crates/grpc-kit",
  "src/microservices/chat-service",
  "src/crates/certgen",
  "src/crates/tls-edge",
  "src/crates/journal",
  "src/crates/admin",
  "src/crates/validation",
  "src/crates/nats-engine",
  "src/microservices/notify-service",
  "src/microservices/feed-service",
  "src/crates/jobs",
  "src/crates/files",
  "src/crates/test-support",
  "tests/e2e",
  "tools/loadgen",
  "tools/devctl",
  "tools/healthcheck",
  "src/crates/db-engine",
  "src/crates/store-engine",
  "src/crates/resp-client",
]
message.ru = "В [workspace] members не попадают все пакеты. Удобнее всего три маски: \"src/crates/*\", \"src/microservices/*\" и \"tools/*\"."

[[rules]]
kind = "contains"
globs = ["Cargo.toml"]
regex = '^\[workspace.package\]'
message.ru = "Общие поля пакетов (version, edition, rust-version, publish) живут в [workspace.package] корня."

[[rules]]
kind = "contains"
globs = [
  "src/crates/*/Cargo.toml",
  "tools/xtask/Cargo.toml",
  "src/microservices/*/Cargo.toml",
]
regex = '^version.workspace = true'
message.ru = "Версию пакет наследует из корня: `version.workspace = true`. Тогда версия у всех одна и правится в одном месте."

[[rules]]
kind = "contains"
globs = [
  "src/crates/*/Cargo.toml",
  "tools/xtask/Cargo.toml",
  "src/microservices/*/Cargo.toml",
]
regex = '^edition.workspace = true'
message.ru = "Edition пакет наследует из корня: `edition.workspace = true`."

[[rules]]
kind = "workspace_deps"
packages = [
  "src/crates/*",
  "src/microservices/*",
  "tools/xtask",
]
message.ru = "Зависимость объявлена в пакете напрямую. Все зависимости, и внутренние крейты тоже, описываются в [workspace.dependencies] корня, а в пакете `имя.workspace = true`."

[[rules]]
kind = "deps"
package = "src/crates/contracts"
allow_only = [
  "serde",
  "serde_json",
  "validation",
]
message.ru = "contracts это нижний слой: типы, ники, команды и контракт провода. Из чужого ему нужны только serde и serde_json, а ядро и терминал зависят от него. Стрелки идут только вниз."

[[rules]]
kind = "contains"
globs = ["Cargo.toml"]
regex = '^\[workspace.lints'
message.ru = "Правила проверок общие для всех: [workspace.lints.rust] и [workspace.lints.clippy] в корне."

[[rules]]
kind = "contains"
globs = ["Cargo.toml"]
regex = 'unsafe_code = "forbid"'
message.ru = "В [workspace.lints.rust] нужен `unsafe_code = \"forbid\"`: соцсети unsafe не нужен, и пусть компилятор это гарантирует."

[[rules]]
kind = "contains"
globs = ["Cargo.toml"]
regex = 'unwrap_used = "deny"'
message.ru = "В [workspace.lints.clippy] нужен `unwrap_used = \"deny\"`: договорённость «без unwrap» теперь проверяет clippy, в том числе в тестах (там вместо него expect с объяснением)."

[[rules]]
kind = "contains"
globs = [
  "src/crates/contracts/Cargo.toml",
  "src/crates/service-runtime/Cargo.toml",
  "tools/xtask/Cargo.toml",
  "src/crates/framing/Cargo.toml",
  "src/microservices/*/Cargo.toml",
  "src/crates/test-support/Cargo.toml",
  "tests/e2e/Cargo.toml",
  "tools/loadgen/Cargo.toml",
  "tools/devctl/Cargo.toml",
  "tools/healthcheck/Cargo.toml",
  "src/crates/db-engine/Cargo.toml",
  "src/crates/store-engine/Cargo.toml",
  "src/crates/resp-client/Cargo.toml",
]
regex = '^workspace = true'
message.ru = "Пакет не подключил общие правила. Без `[lints]` и строки `workspace = true` под ней правила корня на него не действуют, и никто этого не заметит."

[[rules]]
kind = "contains"
globs = ["Cargo.toml"]
regex = '^\[profile.release\]'
message.ru = "Профиль релизной сборки задаётся в корне воркспейса: [profile.release] в пакетах cargo игнорирует."

[[rules]]
kind = "uniform_modules"
roots = [
  "src/crates/contracts/src",
  "src/crates/service-runtime/src",
  "tools/xtask/src",
  "src/crates/framing/src",
  "src/microservices/api-gateway/src",
  "src/crates/http-engine/src",
  "src/crates/minifuzz/src",
  "src/crates/http-client/src",
  "src/crates/websocket-engine/src",
  "src/crates/proto/src",
  "src/microservices/user-service/src",
  "src/microservices/post-service/src",
  "src/crates/grpc-kit/src",
  "src/microservices/chat-service/src",
  "src/crates/certgen/src",
  "src/crates/tls-edge/src",
  "src/crates/admin/src",
  "src/crates/validation/src",
  "src/crates/nats-engine/src",
  "src/microservices/notify-service/src",
  "src/microservices/feed-service/src",
  "src/crates/jobs/src",
  "src/crates/files/src",
  "src/crates/test-support/src",
