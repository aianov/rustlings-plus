[chapter]
title.en = "INSERT, UPDATE, DELETE"
title.ru = "INSERT, UPDATE, DELETE"

[[chapter.visuals]]
file = "visuals/upsert_flow.html"
title.ru = "Upsert: вставка встречает конфликт"

[[exercises]]
name = "pgmod1"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Общий вид: `INSERT INTO таблица (столбцы) VALUES (значения)`. Значения идут в том же порядке, что и столбцы.""", """Столбцы id, status, score и created_at в запросе не упоминай: для них есть умолчания."""]
why.ru = """Явный список столбцов защищает от двух неприятностей: порядок столбцов в таблице не становится частью контракта, а новые столбцы со значением по умолчанию не ломают старый код. Запись `INSERT INTO users VALUES (...)` без списка работает, пока таблицу никто не менял, и ломается при первой же миграции."""

[[exercises]]
name = "pgmod2"
style = "todo"
requires = ["postgres"]
hint.ru = ["""У INSERT есть два источника строк: список `VALUES (...), (...)` и результат запроса SELECT.""", """Для копирования между таблицами вместо VALUES ставится целый SELECT с нужным WHERE, а столбцы в INSERT и в SELECT идут в одном порядке."""]
why.ru = """Один INSERT на много строк быстрее многих отдельных: меньше обменов с сервером, и вся пачка атомарна, то есть либо добавлена целиком, либо нет. INSERT ... SELECT сопоставляет столбцы по позиции, а не по имени, поэтому порядок в обеих частях нужно сверять глазами."""

[[exercises]]
name = "pgmod_q6"
kind = "question"
question.ru = """Таблицы `a(x, y)` и `b(y, x)`, в b строка (y = 1, x = 2). Что окажется в a после `INSERT INTO a SELECT * FROM b`?"""
options.ru = ["x = 2, y = 1: столбцы сопоставятся по именам", "запрос откажет из-за разного порядка столбцов", "x = 1, y = 2: сопоставляются по позициям", "a останется пустой"]
answer = [2]
explain.ru = """INSERT ... SELECT сопоставляет столбцы по позиции: первый столбец результата идёт в первый столбец списка вставки (по умолчанию в первый столбец таблицы). Имена значения не имеют. Поэтому пиши явный список в обоих местах: `INSERT INTO a (x, y) SELECT x, y FROM b`."""
hint.ru = """Сколько в запросе мест, где указано имя столбца-приёмника?"""

[[exercises]]
name = "pgmod3"
style = "todo"
requires = ["postgres"]
hint.ru = """В конце INSERT (и UPDATE, и DELETE) можно дописать `RETURNING столбцы`, и команда вернёт строки так же, как SELECT."""
why.ru = """RETURNING отдаёт строку в том виде, в каком она записана: с id из счётчика, значениями по умолчанию, результатом триггеров. Это один круг до базы вместо двух и никакой гонки между вставкой и чтением. В Rust это будет `fetch_one` на INSERT, и мы к нему вернёмся в главе про sqlx."""

[[exercises]]
name = "pgmod4"
style = "todo"
requires = ["postgres"]
hint.ru = ["""UPDATE меняет несколько столбцов через запятую в SET, а WHERE выбирает строки так же, как в SELECT.""", """Без WHERE обновятся все строки таблицы. Новое значение может зависеть от старого: `score = score + ...`."""]
why.ru = """UPDATE без WHERE меняет каждую строку, и база не спросит «вы уверены?». Привычка: сначала напиши тот же WHERE в SELECT и посмотри, сколько строк он находит, а потом заменяй SELECT на UPDATE. В приложении проверяй rows_affected: ожидали одну строку, а затронуто тысячу, значит что-то не так."""

[[exercises]]
name = "pgmod5"
style = "fix"
requires = ["postgres"]
hint.ru = ["""Сколько строк затронул запрос? Тест считает их так же, как это делает sqlx: `rows_affected()`.""", """Условие, которое выбирает именно dave, нужно дописать самому. Ник уникален, значит, затронется одна строка."""]
why.ru = """Ошибка стара как SQL, и ловят её одинаково: проверкой rows_affected. Для опасных операций полезно сначала открыть транзакцию, посмотреть число затронутых строк и только потом делать COMMIT (транзакции будут в одной из следующих глав)."""

[[exercises]]
name = "pgmod_q1"
kind = "question"
question.ru = """В таблице `accounts` у клиента баланс 100. Два процесса одновременно выполняют `UPDATE accounts SET balance = balance - 10 WHERE id = 1`. Каким станет баланс?"""
options.ru = ["90, потому что оба прочитали 100", "зависит от того, кто из процессов закоммитит первым", "100, потому что запросы отменят друг друга", "80"]
answer = [3]
explain.ru = """UPDATE блокирует изменяемую строку. Второй процесс ждёт, пока первый закончит, и после этого читает уже новое значение 90 и вычитает свои 10. Итог 80, потерянного обновления нет. Беда была бы, если бы приложение прочитало баланс SELECT-ом, посчитало у себя и записало результат."""
hint.ru = """Что делает UPDATE со строкой, пока он выполняется?"""

[[exercises]]
name = "pgmod6"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Запрос не знает текущего значения счётчика, значит, новое значение нужно вычислить на стороне базы из старого.""", """В SET справа можно использовать столбец этой же строки: `столбец = столбец + 1`."""]
why.ru = """Схема «прочитал, прибавил, записал» из приложения теряет лайки: двое прочитали 3, оба записали 4. `SET n = n + 1` атомарна: UPDATE блокирует строку, и следующий запрос ждёт его конца и читает уже свежее значение. Этот приём заменяет целую проблему гонок (подробно про них будет глава про транзакции)."""

[[exercises]]
name = "pgmod7"
style = "todo"
requires = ["postgres"]
hint.ru = """RETURNING есть не только у INSERT. Удаляемые строки можно прочитать в момент удаления."""
why.ru = """DELETE ... RETURNING атомарно отдаёт то, что удалил: между удалением и чтением нечему встрять. Тот же приём лежит в основе очередей на базе: «забрать задачу и вернуть её» одним запросом."""

[[exercises]]
name = "pgmod8"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Повторная вставка нарушает уникальность составного ключа. Нужно сказать базе, что делать при таком конфликте.""", """К INSERT дописывается `ON CONFLICT ...` с действием. Какое из действий «ничего не делать»?"""]
why.ru = """Идемпотентность (повтор не меняет результата) это главное свойство запросов, которые приходят по сети: повторы случаются. DO NOTHING делает «подписаться» безопасной: тот, кто уже подписан, остаётся подписанным. Минус: при конфликте не видно, была вставка или нет; для этого смотри rows_affected (0 при конфликте)."""

[[exercises]]
name = "pgmod_q2"
kind = "question"
question.ru = """Строка `INSERT INTO follows VALUES (2, 4) ON CONFLICT DO NOTHING` выполняется второй раз. Сколько строк вернёт `rows_affected()`?"""
options.ru = ["0", "1", "произойдёт ошибка уникальности", "2"]
answer = [0]
explain.ru = """Конфликт обработан молча, но вставки не было, поэтому затронутых строк ноль. Это способ узнать, была ли вставка: 1 значит строка новая, 0 значит такая уже была."""
hint.ru = """Что именно делает DO NOTHING со строкой, на которой случился конфликт?"""

[[exercises]]
name = "pgmod9"
style = "todo"
requires = ["postgres"]
hint.ru = ["""У INSERT при конфликте по ключу может быть второе действие, кроме «ничего не делать»: обновить существующую строку.""", """После `ON CONFLICT (столбец) DO UPDATE SET ...` предлагаемые к вставке значения доступны как `EXCLUDED.столбец`."""]
why.ru = """Upsert («update or insert») атомарен: два одновременных сохранения не создадут две записи и не уронят друг друга ошибкой. EXCLUDED это строка, которую пытались вставить; существующую строку называют по имени таблицы. Если в SET писать `theme = theme`, Postgres не поймёт, о какой стороне речь."""

[[exercises]]
name = "pgmod_q3"
kind = "question"
question.ru = """В таблице `scores(user_id PRIMARY KEY, score)` есть строка (1, 5). Выполняется:
```sql
INSERT INTO scores (user_id, score) VALUES (1, 100)
ON CONFLICT (user_id) DO UPDATE SET score = score + EXCLUDED.score
```
Что произойдёт?"""
options.ru = ["score станет 105", "score станет 100", "Postgres откажет: ссылка на score неоднозначна", "score станет 6"]
answer = [2]
explain.ru = """В правой части `score` может означать и столбец существующей строки, и столбец предлагаемой к вставке, поэтому Postgres не угадывает, а отказывает: «column reference score is ambiguous». Предлагаемое значение называют EXCLUDED.score, а существующее через имя таблицы: `scores.score + EXCLUDED.score` даст 105."""
hint.ru = """Сколько строк участвует в DO UPDATE, и как каждую из них назвать?"""

[[exercises]]
name = "pgmod10"
style = "fix"
requires = ["postgres"]
hint.ru = ["""Прочитай ошибку базы в сообщении теста. Она говорит о том, чего не хватает таблице.""", """ON CONFLICT по столбцам работает только там, где на эти столбцы наложено уникальное ограничение или уникальный индекс. В скрипт нужно добавить его создание так, чтобы повторный запуск не падал (подумай про IF NOT EXISTS)."""]
why.ru = """ON CONFLICT (столбцы) ищет уникальный индекс именно на эти столбцы; нет индекса, нет «конфликта», и Postgres отказывается от запроса (42P10). Хуже вариант `ON CONFLICT DO NOTHING` без цели на таблице без уникальности: он запустится и молча вставит дубликат. Правило: уникальность гарантирует схема (индекс), а ON CONFLICT только решает, что делать при нарушении."""

[[exercises]]
name = "pgmod_q5"
kind = "question"
question.ru = """В таблице `notes(id identity, text)` нет ни уникальных индексов, ни ключа по text. Запрос `INSERT INTO notes (text) VALUES ('hi') ON CONFLICT DO NOTHING` выполняется дважды. Сколько строк в таблице?"""
options.ru = ["одна", "вторая вставка падает с ошибкой", "ни одной", "две"]
answer = [3]
explain.ru = """Конфликт возможен только там, где есть уникальное ограничение. Здесь его нет, поэтому нарушения не происходит, и вторая строка вставляется без жалоб. ON CONFLICT ничего не делает уникальным сам: за уникальность отвечает схема."""
hint.ru = """С чем именно сравнивает Postgres новую строку, когда ищет конфликт?"""

[[exercises]]
name = "pgmod11"
style = "bughunt"
requires = ["postgres"]
hint.ru = ["""Что возвращает RETURNING, если вставка не произошла из-за конфликта?""", """Строка, к которой был конфликт, возвращается, если её «обновить» (пусть и тем же значением). Остальную часть оставь как есть: уникальный индекс на name уже есть."""]
why.ru = """DO NOTHING RETURNING при конфликте возвращает пустой набор: строка не вставлена, и возвращать нечего. Приём `DO UPDATE SET name = EXCLUDED.name` делает фиктивное обновление и заставляет RETURNING вернуть строку. Цена: каждый вызов пишет новую версию строки (раздувается таблица) и берёт блокировку. Позже ты увидишь решение через CTE, которое не пишет лишнего."""

[[exercises]]
name = "pgmod12"
style = "todo"
requires = ["postgres"]
hint.ru = ["""В UPDATE и DELETE можно подключить вторую таблицу: у UPDATE она называется FROM, у DELETE USING. Связь с изменяемой таблицей пишется в WHERE.""", """Без условия связи каждая строка соединится с каждой. Условие связи для первого запроса: id пользователя равен user_id в weekly_scores."""]
why.ru = """UPDATE ... FROM и DELETE ... USING это JOIN внутри изменяющего запроса: данные другой таблицы подмешиваются к изменяемым строкам. Если в weekly_scores окажется две строки на одного пользователя, обновление применится лишь к одной из них (какой именно, не определено), поэтому такие данные сначала агрегируют (будет в главе про агрегаты)."""

[[exercises]]
name = "pgmod_q4"
kind = "question"
question.ru = """Есть `users(id, score)` из трёх пользователей и `weekly(user_id, points)` со строками (1, 10) и (2, 20). Что сделает запрос?
```sql
UPDATE users SET score = weekly.points FROM weekly
```"""
options.ru = ["каждому из трёх пользователей поставит какое-то одно значение из weekly, не обязательно его собственное", "обновит только пользователей 1 и 2, остальных не тронет", "откажет с синтаксической ошибкой", "ничего не обновит"]
answer = [0]
explain.ru = """Без условия в WHERE связи между таблицами нет: каждая строка users соединяется с каждой строкой weekly, а UPDATE берёт для строки одну из подходящих (какую, не определено). Результат: все три пользователя получили либо 10, либо 20. Условие `WHERE users.id = weekly.user_id` обязательно."""
hint.ru = """Что значит соединение двух таблиц без условия?"""

[[exercises]]
name = "pgmod_post_lifecycle"
style = "scratch"
requires = ["postgres"]
quiz = true
hint.ru = ["""Для каждого запроса вспомни свою задачу главы: RETURNING, условие в WHERE по автору, ON CONFLICT, SET n = n + 1. Параметры нумеруются по порядку в ТЗ.""", """Права автора проверяются самим условием WHERE: `WHERE id = $1 AND author_id = $2`. Если строка не подходит, запрос просто не затронет ничего и RETURNING вернёт пусто."""]
why.ru = """Это ровно те запросы, которые потом станут методами репозитория. Заметь, как проверка прав «только автор» живёт прямо в WHERE: гонки между проверкой и действием нет, потому что это один запрос. Идемпотентный лайк возвращает строку только при вставке, а счётчик растёт отдельным атомарным UPDATE. Связать их в одну операцию без гонок поможет транзакция (глава про транзакции) или изменяющий CTE (глава про подзапросы)."""
