[chapter]
title.en = "SELECT from scratch"
title.ru = "SELECT с нуля"

[[chapter.visuals]]
file = "visuals/select_order.html"
title.ru = "Порядок выполнения SELECT"

[[exercises]]
name = "pgsel1"
style = "todo"
requires = ["postgres"]
hint.ru = """`SELECT что FROM откуда`. «Все столбцы» пишутся звёздочкой, а «откуда» это имя таблицы: `users`."""
why.ru = """Звёздочка хороша в консоли, когда ты просто смотришь на таблицу. В коде приложения столбцы лучше перечислять явно (следующая задача): иначе после ALTER TABLE в ответ молча приедет новый столбец, а порядок столбцов станет частью контракта, о котором никто не думал."""

[[exercises]]
name = "pgsel2"
style = "todo"
requires = ["postgres"]
hint.ru = """Столбцы в списке SELECT пишутся через запятую, в том порядке, в котором хочешь их получить."""
why.ru = """Явный список столбцов делает запрос устойчивым: порядок и состав ответа зависят от тебя, а не от того, что в таблице сегодня. Когда в Rust ты будешь читать строки по индексу или по имени, это сэкономит много нервов."""

[[exercises]]
name = "pgsel3"
style = "todo"
requires = ["postgres"]
hint.ru = """`выражение AS имя`. Слово AS можно опустить, но с ним запрос читается лучше."""
why.ru = """Псевдоним живёт только в этом результате и никак не меняет таблицу. Он нужен, чтобы клиентский код получил столбец с понятным именем (а в Rust поле структуры совпало с именем столбца). У выражения без псевдонима Postgres придумает имя сам, например `?column?`."""

[[exercises]]
name = "pgsel4"
style = "fix"
requires = ["postgres"]
hint.ru = """Строки в SQL пишутся в одинарных кавычках. Двойные кавычки означают «имя столбца или таблицы»."""
why.ru = """В SQL два вида кавычек, и путать их нельзя: `'alice'` это значение, `"alice"` это идентификатор (имя столбца, таблицы). Postgres честно ищет столбец alice и не находит. В коде на Rust эта ошибка особенно коварна: строку с кавычками внутри пишут в `"..."`, и глаз не замечает разницы."""

[[exercises]]
name = "pgsel5"
style = "todo"
requires = ["postgres"]
hint.ru = """Сравнение на равенство в SQL это один знак `=`, а не два. «Не равно» пишется `<>`. Условия склеиваются словами AND и OR."""
why.ru = """Тесты сравнивают множества, а не порядок: без ORDER BY Postgres вправе вернуть строки в любом порядке, и полагаться на «обычно по id» нельзя. Знаки сравнения те же, что в Rust, кроме равенства: одиночный `=`."""

[[exercises]]
name = "pgsel6"
style = "fix"
requires = ["postgres"]
hint.ru = ["""Посмотри на ответ в сообщении теста: кто там лишний и какой у него статус?""", """`a AND b OR c` Postgres читает как `(a AND b) OR c`. Тебе нужно другое: `a AND (b OR c)`."""]
why.ru = """Скобки здесь не украшение, а смысл запроса. Сломанная версия читается «активные из DE, плюс вообще все из FR», и по данным это незаметно, пока во Франции не появится неактивный. Если в условии смешаны AND и OR, ставь скобки всегда, даже когда приоритет совпадает с задумкой: следующий читатель скажет спасибо."""

[[exercises]]
name = "pgsel_q1"
kind = "question"
question.ru = """Сколько строк вернёт такой запрос? В таблице 12 пользователей: 8 активных, 2 ожидающих подтверждения (pending, им 25 и 23 года) и 2 заблокированных.
```sql
SELECT * FROM users
WHERE status = 'active' OR status = 'pending' AND age > 30
```"""
options.ru = ["5", "8", "10", "12"]
answer = [1]
explain.ru = """AND связывает крепче OR, поэтому условие читается как `active OR (pending AND age > 30)`. Pending старше 30 лет нет, значит остаются только 8 активных. Ответ 5 получился бы, если бы кто-то поставил скобки `(active OR pending) AND age > 30`, но их никто не ставил."""
hint.ru = """Сначала расставь скобки так, как их видит Postgres."""

[[exercises]]
name = "pgsel7"
style = "todo"
requires = ["postgres"]
hint.ru = """`столбец BETWEEN нижняя AND верхняя`, `столбец IN (значение, значение, ...)`, у отрицания перед ключевым словом стоит NOT."""
why.ru = """BETWEEN работает как `>= AND <=`, поэтому с датами и временем он коварен (верхняя граница включается, а «до конца суток» не получается). К этому вернёмся в главе про функции и даты. Для списка значений IN читается лучше цепочки OR, и его можно скармливать целый массив параметром, это пригодится в sqlx."""

[[exercises]]
name = "pgsel8"
style = "todo"
requires = ["postgres"]
hint.ru = """Шаблон пишется в одинарных кавычках. `%` вместо любой подстроки, `_` вместо одного символа. Для регистронезависимого поиска замени LIKE на ILIKE."""
why.ru = """LIKE с шаблоном, начинающимся с `%`, не умеет пользоваться обычным индексом: Postgres придётся перебрать всё. Для поиска по подстроке в больших таблицах есть триграммы (в главе про расширения). Символы `%` и `_` внутри пользовательского ввода нужно экранировать, иначе «100%» станет шаблоном."""

[[exercises]]
name = "pgsel_q6"
kind = "question"
question.ru = """Какие ники найдёт `WHERE username LIKE 'b_b%'`? В таблице есть bob, bob_2, alice и Karl."""
options.ru = ["только bob", "bob и bob_2", "только bob_2", "ни одного"]
answer = [1]
explain.ru = """Шаблон читается так: буква b, ровно один любой символ, буква b, дальше что угодно. У bob это o, у bob_2 тоже o, потом остаток («» и «_2»). Подчёркивание в шаблоне всегда значит «один любой символ», а не букву `_`."""
hint.ru = """Разбери шаблон по символам: `b`, `_`, `b`, `%`."""

[[exercises]]
name = "pgsel9"
style = "fix"
requires = ["postgres"]
hint.ru = ["""Результат пуст не потому, что условие ложно, а потому, что оно никогда не бывает истинным.""", """Для проверки на NULL есть отдельные формы: `IS NULL` и `IS NOT NULL`."""]
why.ru = """`x = NULL` и `x <> NULL` дают NULL при любом x, а WHERE пропускает только TRUE. Поэтому такие запросы не падают, а тихо возвращают пустоту, и это одна из самых частых ошибок новичка. Позже, в главе про выражения, мы разберём трёхзначную логику полностью."""

[[exercises]]
name = "pgsel_q2"
kind = "question"
question.ru = """Девять из двенадцати пользователей хоть раз заходили (last_login_at не NULL). Сколько строк вернёт запрос?
```sql
SELECT * FROM users WHERE last_login_at = last_login_at
```"""
options.ru = ["12", "9", "3", "0"]
answer = [1]
explain.ru = """Для строки с NULL условие превращается в `NULL = NULL`, а это не TRUE и не FALSE, а NULL («неизвестно»). WHERE оставляет только TRUE, так что три строки без даты пропадают. Именно поэтому для NULL есть IS NULL и IS NOT NULL."""
hint.ru = """Что получится при сравнении NULL с NULL?"""

[[exercises]]
name = "pgsel10"
style = "todo"
requires = ["postgres"]
hint.ru = """`ORDER BY a ASC, b DESC`: направление указывается у каждого ключа отдельно, ключи через запятую."""
why.ru = """ORDER BY идёт почти в самом конце запроса, поэтому в нём видны и псевдонимы, и столбцы, которых нет в SELECT. Направление относится к одному ключу: `ORDER BY a, b DESC` сортирует `a` по возрастанию, а DESC касается только `b`. Это путает чаще всего."""

[[exercises]]
name = "pgsel11"
style = "bughunt"
requires = ["postgres"]
hint.ru = ["""Первыми в ответе стоят пользователи без даты входа. Почему они оказались «больше» всех дат?""", """В Postgres NULL считается больше любого значения, поэтому при DESC он идёт первым. Положение NULL задаётся словами NULLS FIRST и NULLS LAST."""]
why.ru = """По умолчанию NULL сортируется как «самое большое значение»: при ASC он в конце, при DESC в начале. Для ленты «последние заходы» это ровно наоборот. Всегда пиши NULLS LAST или NULLS FIRST явно, если в столбце могут быть пропуски: поведение читается из запроса, а не из правил по умолчанию."""

[[exercises]]
name = "pgsel_q3"
kind = "question"
question.ru = """Где окажутся пользователи с пустым last_login_at при `ORDER BY last_login_at DESC`, если больше ничего не указано?"""
options.ru = ["в конце списка", "в начале списка", "Postgres откажется сортировать и вернёт ошибку", "в случайных местах"]
answer = [1]
explain.ru = """Postgres считает NULL больше любого значения. При ASC самое большое идёт в конце, при DESC в начале. Положение можно задать явно: NULLS FIRST или NULLS LAST."""
hint.ru = """Что Postgres считает «самым большим»: NULL или любую дату?"""

[[exercises]]
name = "pgsel12"
style = "todo"
requires = ["postgres"]
hint.ru = """Третья страница по четыре строки пропускает две полные страницы, то есть 8 строк."""
why.ru = """OFFSET не перескакивает к нужной строке, а честно читает и выбрасывает все предыдущие, так что глубокие страницы дорожают. На это есть замена (keyset-пагинация), и мы дойдём до неё в главе про индексы. А пока запомни главное: LIMIT и OFFSET без ORDER BY ничего не гарантируют."""

[[exercises]]
name = "pgsel13"
style = "bughunt"
requires = ["postgres"]
hint.ru = ["""Посмотри, сколько постов набрали по 30 лайков и в каком порядке они пришли.""", """К ORDER BY можно добавить второй ключ, который никогда не повторяется: например, id."""]
why.ru = """Сортировка по столбцу с повторами определяет порядок только между разными значениями. Равные строки Postgres выдаёт как придётся, и этот «как придётся» может измениться после VACUUM или добавления индекса. Правило для любой постраничной выдачи: последним ключом ORDER BY идёт уникальный столбец. К этому мы вернёмся, когда будем делать пагинацию по курсору."""

[[exercises]]
name = "pgsel14"
style = "todo"
requires = ["postgres"]
hint.ru = """`SELECT DISTINCT столбцы FROM ...`. DISTINCT стоит сразу после SELECT и относится ко всему списку столбцов."""
why.ru = """DISTINCT дорогой: Postgres сортирует или хеширует весь результат. Если в запросе появляется DISTINCT только для того, чтобы убрать «лишние» дубли после соединения таблиц, почти всегда причина в неверном соединении, а не в данных. Это мы будем встречать дальше."""

[[exercises]]
name = "pgsel_q4"
kind = "question"
question.ru = """Что делает DISTINCT в этом запросе?
```sql
SELECT DISTINCT country, status FROM users
```
В таблице пять разных стран и три разных статуса."""
options.ru = ["возвращает 5 строк: уникальные страны, статус берётся любой", "возвращает 8 строк: 5 стран и 3 статуса", "возвращает уникальные пары, их 9", "возвращает все 12 строк"]
answer = [2]
explain.ru = """DISTINCT смотрит на строку результата целиком, то есть на пару (country, status). Уникальных пар девять: например, DE встречается с active и banned, US с active, banned и pending. Выбрать «любой статус» DISTINCT не умеет (для этого есть DISTINCT ON, он будет позже)."""
hint.ru = """Повтором считается совпадение всех выбранных столбцов сразу."""

[[exercises]]
name = "pgsel_q5"
kind = "question"
question.ru = """Какой из этих запросов Postgres отвергнет с ошибкой «column does not exist»?"""
options.ru = ["SELECT length(body) AS n FROM posts WHERE n > 10", "SELECT length(body) AS n FROM posts ORDER BY n", "SELECT length(body) AS n FROM posts WHERE length(body) > 10 ORDER BY n DESC", "SELECT length(body) AS n FROM posts ORDER BY n DESC LIMIT 1"]
answer = [0]
explain.ru = """WHERE выполняется до SELECT, и псевдонима n в этот момент ещё нет. ORDER BY работает после SELECT и псевдоним видит. Порядок: FROM, WHERE, GROUP BY, HAVING, SELECT, ORDER BY, LIMIT."""
hint.ru = """Вспомни логический порядок выполнения и найди запрос, где псевдоним используется раньше, чем рождается."""

[[exercises]]
name = "pgsel15"
style = "fix"
requires = ["postgres"]
hint.ru = ["""Ошибка в сообщении теста говорит, что столбца months нет. Для WHERE его правда ещё нет.""", """WHERE выполняется раньше, чем SELECT вычислит выражения. Условию придётся обойтись без псевдонима."""]
why.ru = """Логический порядок такой: FROM, WHERE, GROUP BY, HAVING, SELECT, ORDER BY, LIMIT. Псевдоним рождается на шаге SELECT, поэтому WHERE его не видит, а ORDER BY уже видит. Повторить выражение в WHERE не страшно: оптимизатор вычислит его один раз. Если выражение длинное, спрячь его в подзапрос или CTE, до них мы дойдём позже."""

[[exercises]]
name = "pgsel16"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Параметры нумеруются с единицы в том порядке, в котором тест их передаёт: первое значение это `$1`.""", """Метка стоит там, где иначе стоял бы литерал: `country = $1`, `LIMIT $1`. Кавычки вокруг метки не нужны."""]
why.ru = """Параметр это не подстановка в текст: запрос разбирается один раз, а значения едут отдельно как данные. Поэтому строку `DE' OR '1'='1` Postgres сравнит со страной как есть, и никакой инъекции не будет. Заодно запрос с метками можно подготовить один раз и вызывать много раз. Метки работают только вместо значений: имя столбца или таблицы ими не заменить (это отдельная тема в главах про sqlx)."""

[[exercises]]
name = "pgsel_users_report"
style = "scratch"
requires = ["postgres"]
quiz = true
hint.ru = ["""Каждый пункт это отдельное умение из задач главы: пролистай их, если застрял.""", """Пункт 1: подумай, кто не должен попасть в ответ и что делает сортировка с пустой датой. Пункт 2: следи за приоритетом AND и OR и за IS NULL. Пункт 6: ORDER BY видит псевдоним."""]
why.ru = """Здесь всё вместе: в каждом запросе ловушка из главы (NULL в сортировке, приоритет AND и OR, IS NULL, равные лайки, порядок вычислений, параметры). Если все шесть прошли с первого раза, ты готов к соединениям таблиц."""
