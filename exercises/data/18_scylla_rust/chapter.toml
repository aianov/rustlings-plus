[chapter]
title.en = "The scylla driver"
title.ru = "Драйвер scylla"

[[chapter.visuals]]
file = "visuals/token_aware_routing.html"
title.ru = "Маршрутизация по токену"

[[chapter.visuals]]
file = "visuals/paging_state.html"
title.ru = "Состояние пагинации как курсор"

[[exercises]]
name = "scy1"
style = "todo"
requires = ["scylla"]
hint.ru = ["""Что вернуть, если переменная есть, но пустая? Какие методы у SessionBuilder задают узел и срок подключения?""", """`Option::filter` отбрасывает пустое значение, `unwrap_or_else` подставляет адрес по умолчанию. У SessionBuilder есть `known_node`, `connection_timeout` и `build().await`.""", """`SessionBuilder::new().known_node(node).connection_timeout(Duration::from_secs(3)).build().await`."""]
why.ru = """Session это дорогой объект: она открывает соединения ко всем узлам кластера (на каждое ядро узла по соединению), узнаёт топологию и схему. Поэтому её строят один раз на старте сервиса, а адрес берут из окружения, как всё, что отличается между машинами. Узел достаточно указать один: остальные драйвер узнает от него. Срок подключения нужен, чтобы сервис с неверным адресом падал на старте понятной ошибкой, а не висел."""

[[exercises]]
name = "scy2"
style = "fix"
requires = ["scylla"]
hint.ru = ["""Как передать значения в запрос, не вставляя их в текст?""", """В тексте запроса на месте значений ставятся маркеры `?`, а значения передаются вторым аргументом `query` кортежем в том же порядке.""", """`session.query("INSERT ... VALUES (?, ?, ?, ?)", (chat, sent_at, author, body))`."""]
why.ru = """Параметры решают сразу три проблемы: экранирование (значение никогда не становится частью синтаксиса), инъекции и типы (драйвер сериализует i64 как bigint, а &str как text). Текст запроса с маркерами одинаков для всех вызовов, поэтому его можно подготовить один раз, это следующая тема. У `query` с параметрами есть цена: драйвер сначала готовит запрос на одном соединении, поэтому для частых запросов лучше явный `prepare`."""

[[exercises]]
name = "scy3"
style = "todo"
requires = ["scylla"]
hint.ru = ["""Какой метод `QueryResult` превращает строки в типизированные значения? Что он возвращает: значения или результаты?""", """`rows_typed::<(i64, String, String)>()` даёт итератор `Result` по строкам: ошибка возможна и для ответа целиком, и для каждой строки. `collect::<Result<Vec<_>, _>>()` собирает их с первой ошибкой.""", """`res.rows_typed::<(i64, String, String)>()?.collect::<Result<Vec<_>, _>>()?`."""]
why.ru = """Разбор строки в кортеж идёт по позиции: первый столбец ответа в первый элемент. Поэтому список столбцов в SELECT и типы кортежа пишутся рядом и меняются вместе. Ошибка на двух уровнях не случайна: ответ может вообще не содержать строк (например, это был INSERT), а отдельная строка может не подойти по типу или содержать NULL там, где его не ждали."""

[[exercises]]
name = "scy4"
style = "fix"
requires = ["scylla"]
hint.ru = ["""Какое значение приходит в столбце body после `DELETE body`? Может ли его принять поле типа String?""", """Любой обычный столбец в Scylla может оказаться NULL: его не записали или удалили. В Rust такое поле должно уметь «ничего».""", """Сделай поле `body: Option<String>`."""]
why.ru = """В Scylla нет NOT NULL: любой столбец вне первичного ключа может отсутствовать, потому что его не записали, удалили или он истёк по TTL. Поэтому поле структуры для такого столбца почти всегда Option, а решение, что показывать вместо пустоты, принимает код выше. Строгий String здесь делает поломку одной строки поломкой всего запроса."""

[[exercises]]
name = "scy5"
style = "fix"
requires = ["scylla"]
hint.ru = ["""В каком порядке и сколько столбцов отдаёт `SELECT *`? А в каком порядке читает их derive(FromRow)?""", """FromRow берёт столбцы по позиции, имена не сравнивает. `SELECT *` отдаёт все столбцы таблицы в её порядке, включая ключ. Перечисли в SELECT ровно поля структуры в её порядке.""", """`SELECT author, body, sent_at FROM messages WHERE chat_id = ?`."""]
why.ru = """derive(FromRow) в драйвере 0.12 читает столбцы по позициям: первое поле из первого столбца. `SELECT *` отдаёт столбцы в порядке таблицы (сначала ключ партиции и кластеризации, потом остальные по имени), а их число меняется с каждым ALTER TABLE. Явный список связывает запрос и структуру и делает чтение устойчивым к изменениям схемы, поэтому `SELECT *` в коде приложения не пишут."""

[[exercises]]
name = "scy6"
style = "fix"
requires = ["scylla"]
hint.ru = ["""Как драйвер может узнать, какое поле в какой маркер `?` положить, если не по порядку?""", """После подготовки запроса драйвер знает имена столбцов за каждым маркером. derive(SerializeRow) у структуры сопоставляет поля с ними по имени.""", """`#[derive(SerializeRow)]` на NewMessage (`use scylla::SerializeRow`) и передай `msg` вместо кортежа."""]
why.ru = """derive(SerializeRow) в драйвере 0.12 по умолчанию связывает поля по именам: драйвер берёт имена столбцов из метаданных подготовленного запроса и ищет одноимённые поля. Поэтому порядок столбцов в INSERT больше не важен, а опечатка в имени поля даёт понятную ошибку «нет значения для столбца», а не тихую запись не туда. Обрати внимание на асимметрию: чтение через FromRow идёт по позициям, запись через SerializeRow по именам."""

[[exercises]]
name = "scy7"
style = "todo"
requires = ["scylla"]
hint.ru = ["""Какие два метода Session разделяют «подготовить» и «выполнить»?""", """`session.prepare(текст).await?` возвращает PreparedStatement, его кладут в поле. `session.execute(&prepared, значения)` выполняет, значения кортежем как в query.""", """В `new` два `prepare`, в `send` `execute(&self.insert, (chat, sent_at, author, body))`, в `history` `execute(&self.history, (chat,))` и `rows_typed`."""]
why.ru = """Подготовленный запрос живёт на сервере под своим идентификатором, и каждый execute отправляет только идентификатор и значения. Кроме экономии на разборе, драйвер знает, какие значения образуют ключ партиции, считает токен на клиенте и отправляет запрос сразу на узел-владелец (token-aware routing), минуя лишний прыжок через координатор. Поэтому хранилище держит подготовленные запросы в полях и готовит их один раз при старте."""

[[exercises]]
name = "scy8"
style = "fix"
requires = ["scylla"]
hint.ru = """Где должен жить подготовленный запрос, чтобы его не пришлось готовить заново? Добавь его в структуру Store и создай в `new`."""
why.ru = """Подготовка это отдельный круг к серверу и разбор запроса. Если она идёт при каждом вызове, теряются все выгоды подготовки, а нагрузка на Scylla растёт с числом запросов. Подготовленные запросы готовятся при создании хранилища, и ошибка в тексте запроса всплывает на старте сервиса, а не на первой отправке."""

[[exercises]]
name = "scy9"
style = "todo"
requires = ["scylla"]
hint.ru = ["""Какие Rust-типы соответствуют uuid, timestamp, set<text>, map<text, text>? Что придёт на месте пустого множества?""", """uuid это `Uuid`, timestamp это `CqlTimestamp`, set это `HashSet`, map это `HashMap`. Для чтения коллекции оберни в Option и превращай None в пустую коллекцию. Одна строка или ничего: `maybe_first_row_typed`.""", """Читай кортеж `(Uuid, CqlTimestamp, String, Option<HashSet<String>>, Option<HashMap<String, String>>, Option<String>)` и собирай Profile через `unwrap_or_default()`."""]
why.ru = """Сериализация в обе стороны идёт через типы: драйвер проверяет, что Rust-тип подходит к типу столбца, и ошибка случается до отправки, а не в данных. Пустая коллекция в Scylla неотличима от отсутствующей (коллекция это набор ячеек, а у пустой ячеек нет), поэтому при чтении коллекции почти всегда Option. CqlTimestamp хранит миллисекунды и не требует фичи chrono у драйвера."""

[[exercises]]
name = "scy10"
style = "fix"
requires = ["scylla"]
hint.ru = ["""Что драйвер отправляет вместо None? И есть ли способ сказать «этот маркер не задан»?""", """None это NULL, то есть удаление значения. В протоколе есть отдельное «unset»: сервер пропускает такой столбец. В драйвере это `MaybeUnset`.""", """`scylla::frame::value::MaybeUnset`: `Set(v)` для Some и `Unset` для None, передавай их вместо Option."""]
why.ru = """В CQL три состояния значения в запросе: значение, NULL (удалить) и unset (не трогать). Option в Rust покрывает только первые два, и частичное обновление через Option стирает поля, которые клиент не прислал, оставляя ещё и надгробия. MaybeUnset::Unset говорит серверу пропустить столбец, поэтому один подготовленный запрос обслуживает любые сочетания изменённых полей."""

[[exercises]]
name = "scy11"
style = "todo"
requires = ["scylla"]
hint.ru = ["""Где задаётся размер страницы, и какое поле результата хранит продолжение? Даст ли его LIMIT?""", """Размер страницы это свойство запроса: `set_page_size` у подготовленного запроса. `execute_paged` выполняет одну страницу и кладёт продолжение в `paging_state` результата. LIMIT просто обрезает ответ, продолжения у него нет.""", """`prepare`, `set_page_size(size)`, `execute_paged(&stmt, (chat,), None)`, сохрани `res.paging_state.clone()` до `rows_typed`."""]
why.ru = """LIMIT и страницы решают разные задачи: LIMIT ограничивает ответ целиком, а страницы режут большой ответ на части, которые можно забирать по одной. Состояние пагинации непрозрачно: это закладка сервера, которую клиент только хранит и возвращает. Страница может оказаться короче размера и даже пустой, а признаком конца служит отсутствие состояния, а не число строк."""

[[exercises]]
name = "scy12"
style = "todo"
requires = ["scylla"]
hint.ru = ["""Как превратить байты в строку из шестнадцатеричных цифр и обратно? Что должна сделать `page` с курсором, который не декодируется?""", """Каждый байт это две цифры (`{:02x}`), обратно по две цифры через `u8::from_str_radix(.., 16)`. Нечётная длина и не-цифры дают None, а `page` превращает None в ошибку. Продолжение берётся из `paging_state` результата.""", """`page`: `decode` курсора в `Option<Bytes>`, `execute_paged(stmt, (chat,), state)`, следующий курсор `res.paging_state.as_deref().map(encode)`."""]
why.ru = """Курсор из состояния пагинации делает API без состояния: сервер ничего не помнит, клиент приносит закладку сам, а страница всегда начинается ровно там, где закончилась прошлая, даже если в чат пишут. Курсор непрозрачен для клиента и привязан к запросу, поэтому его не разбирают и не собирают руками. Порченый курсор от клиента это обычная ошибка ввода, поэтому никаких `unwrap`."""

[[exercises]]
name = "scy13"
style = "fix"
requires = ["scylla"]
hint.ru = ["""Сколько строк возвращает `execute`, если у запроса задан размер страницы? Что стало с остальными?""", """С заданным размером страницы `execute` отдаёт одну страницу. Пройти все страницы, не держа их в памяти, позволяет итератор строк: он сам запрашивает следующую страницу, когда текущая кончилась.""", """`session.execute_iter(stmt, (chat,)).await?.into_typed::<(String,)>()` и цикл `while let Some(row) = rows.next().await` (`use futures::StreamExt`)."""]
why.ru = """Самая коварная ошибка с пагинацией: ответ выглядит полным, но это только первая страница. С заданным размером страницы `query` и `execute` возвращают одну страницу, и на больших партициях это тихо даёт неверные цифры, а без размера страницы ответ приходит целиком и на большой партиции съедает память. Итератор строк (`execute_iter`) это поток: он держит в памяти одну страницу и сам ходит за следующей, поэтому подходит для отчётов и выгрузок любого объёма. Размер страницы задаёт баланс между числом кругов к серверу и памятью."""

[[exercises]]
name = "scy14"
style = "todo"
requires = ["scylla"]
hint.ru = ["""Какие свойства есть у подготовленного запроса, кроме текста? Повтор какого из двух запросов меняет результат?""", """У PreparedStatement есть `set_consistency` и `set_is_idempotent`. Вставка того же значения по тому же ключу даёт тот же результат, а `+ 1` при повторе прибавит ещё.""", """Обоим `set_consistency(Consistency::Quorum)`; вставке `set_is_idempotent(true)`, счётчику `false`."""]
why.ru = """Уровень согласованности решает, сколько реплик должны ответить: QUORUM на запись и на чтение вместе гарантируют, что чтение увидит подтверждённую запись, даже если одна реплика отстала. Идемпотентность это обещание драйверу, что запрос безопасно повторить: после таймаута неизвестно, применился он или нет, и драйвер повторяет только то, что помечено. По умолчанию запросы не идемпотентны, это осторожно, но лишает повторов и там, где они безопасны."""

[[exercises]]
name = "scy15"
style = "todo"
requires = ["scylla"]
hint.ru = ["""Как устроен QueryError: где внутри него ошибка сервера, а где ошибки клиента и сети?""", """Ошибки сервера лежат в `QueryError::DbError(DbError, String)`, сетевые в `IoError`, сроки клиента в `TimeoutError` и `RequestTimeout`. Сопоставь их `match` с несколькими вариантами через `|` в одной ветке.""", """Пустой ответ это не ошибка драйвера: `maybe_first_row_typed` вернёт `Ok(None)`, и ты превращаешь его в NotFound."""]
why.ru = """Перевод ошибок на границе слоя нужен, чтобы код выше принимал решения, не зная драйвера: Unavailable и Timeout можно повторить или отдать как 503, Invalid это баг и 500, NotFound это 404. Таймаут в Scylla особенно коварен: запись могла примениться, просто ответ не дошёл, поэтому повторять безопасно только идемпотентные запросы. Ветка Other с текстом страхует от новых вариантов ошибок в следующих версиях драйвера."""

[[exercises]]
name = "scy16"
style = "fix"
requires = ["scylla"]
hint.ru = ["""Как поделить одну сессию между задачами tokio? Почему запросы не находят таблицу?""", """Сессию кладут в `Arc`, а Db делают `Clone`: клон копирует только указатель. Сессия не знает keyspace, поэтому в тексте запросов таблица пишется как `keyspace.notes`. После CREATE TABLE есть метод сессии, который ждёт, пока все узлы увидят новую схему.""", """`#[derive(Clone)]`, поле `session: Arc<Session>`, `format!("... {}.notes ...", self.keyspace)` (имя keyspace это идентификатор, а не значение, его можно вклеивать), после DDL `self.session.await_schema_agreement().await?`."""]
why.ru = """Session внутри уже потокобезопасна и сама держит пул соединений, поэтому на сервис она одна, в Arc, а обработчики получают клоны указателя. Вклеивать в текст можно имена (keyspace, таблица), которые задаёт сам сервис, а не значения от пользователя: те по-прежнему идут параметрами. DDL в кластере расходится по узлам не мгновенно, и запрос сразу после CREATE TABLE может попасть на узел, который о таблице ещё не знает, поэтому миграции ждут согласования схемы."""

[[exercises]]
name = "scy_q1"
kind = "question"
question.ru = """Структура `#[derive(FromRow)] struct Msg { body: String, author: String }`, запрос `SELECT author, body FROM ...`. Что получится?"""
options.ru = ["""Поля заполнятся по именам: всё верно""", """Ошибка компиляции""", """body получит автора, а author текст: FromRow читает по позиции""", """Ошибка разбора строки во время выполнения"""]
answer = [2]
explain.ru = """derive(FromRow) в драйвере 0.12 сопоставляет столбцы и поля по позиции. Оба столбца text, поэтому типы совпадут, и ошибка будет тихой: поля перепутаются. Список столбцов в SELECT пишут в порядке полей."""
hint.ru = """Сравнивает ли FromRow имена столбцов с именами полей?"""

[[exercises]]
name = "scy_q2"
kind = "question"
question.ru = """Частичное обновление профиля передаёт в подготовленный `UPDATE ... SET bio = ?, avatar = ?` значения `(Some("новое"), None::<String>)`. Что станет с аватаром?"""
options.ru = ["""Останется прежним: None значит не трогать""", """Удалится: None это NULL, и поверх аватара запишется надгробие""", """Запрос упадёт: None нельзя передать""", """Станет пустой строкой"""]
answer = [1]
explain.ru = """Option сериализуется как значение или NULL, а NULL это удаление. Чтобы столбец пропустить, передают `MaybeUnset::Unset`."""
hint.ru = """Какие три состояния бывают у значения в запросе CQL?"""

[[exercises]]
name = "scy_q3"
kind = "question"
question.ru = """Клиент API получил курсор пагинации и через час пришёл за следующей страницей. За этот час в чат добавили 30 новых сообщений. Что он получит?"""
options.ru = ["""Ошибку: курсор устарел""", """Следующую страницу ровно с того места, где кончилась прошлая: новые сообщения в начале партиции на неё не влияют""", """Первую страницу заново""", """30 новых сообщений"""]
answer = [1]
explain.ru = """Состояние пагинации указывает позицию в партиции (последний отданный ключ), а не номер страницы, поэтому продолжение не съезжает от новых записей. Курсор привязан к запросу: для другого запроса он не годится."""
hint.ru = """Что хранит состояние пагинации: номер страницы или позицию в данных?"""

[[exercises]]
name = "scy_q4"
kind = "question"
question.ru = """Почему подготовленный запрос с ключом партиции в параметрах обычно быстрее того же текста через `query` с параметрами, даже если обоих выполняют по одному разу?"""
options.ru = ["""Не быстрее: они одинаковые""", """query с параметрами драйвер сначала готовит отдельным кругом, а подготовленный запрос драйвер сразу отправляет на узел-владелец партиции по токену""", """Подготовленные запросы кэшируют ответ""", """query всегда идёт с консистентностью ALL"""]
answer = [1]
explain.ru = """Для `query` с параметрами драйвер сначала делает prepare на одном соединении, то есть лишний круг. У подготовленного запроса драйвер знает, какие параметры образуют ключ партиции, считает токен и выбирает реплику-владельца (token-aware routing), без лишнего прыжка через координатор."""
hint.ru = """Что драйвер знает о подготовленном запросе такого, чего не знает о тексте?"""

[[exercises]]
name = "scy_q5"
kind = "question"
question.ru = """Обработчик HTTP при каждом запросе вызывает `SessionBuilder::new().known_node(...).build().await`. Что не так?"""
options.ru = ["""Всё нормально, сессия лёгкая""", """Сессия дорогая: она открывает пул соединений ко всем узлам и читает схему. Её создают один раз на сервис и делят через Arc""", """Так нельзя из-за правил владения""", """Сессия не потокобезопасна, поэтому так правильно"""]
answer = [1]
explain.ru = """Построение сессии это десятки соединений, узнавание топологии и схемы. На каждый HTTP-запрос это задержки в сотни миллисекунд и лавина соединений к кластеру. Сессия потокобезопасна, её держат в Arc."""
hint.ru = """Сколько работы делает `build()`?"""

[[exercises]]
name = "scy_message_store"
kind = "project"
style = "todo"
requires = ["scylla"]
locked = ["tests/store.rs"]
hint.ru = [
  """Начни с `new`: три CREATE TABLE IF NOT EXISTS с именем keyspace, `await_schema_agreement`, затем `prepare` каждого запроса с QUORUM и идемпотентностью. Подготовленные запросы держи в полях структуры.""",
  """`send`: вставка сообщения, затем для каждого пользователя (участники плюс автор) прочитай `last_at` из chat_activity; если новое время больше, удали старую строку chats_by_user, вставь новую и обнови chat_activity. Пользователей обрабатывай через `try_join_all`.""",
  """`history`: клонируй подготовленный запрос истории, `set_page_size(limit)`, `execute_paged` с декодированным курсором, следующий курсор из `paging_state`. Ключ messages это `(chat_id, sent_at, id)` с `sent_at DESC`.""",
]
why.ru = """Store-слой прячет от сервиса всё, что связано со Scylla: схему, подготовленные запросы, денормализацию и пагинацию. Отправка пишет в несколько таблиц, потому что у каждого экрана своя таблица, а активность хранится отдельно, чтобы знать, какую строку списка чатов удалить при сдвиге. Курсор делает историю бесконечной без состояния на сервере. Гонки двух одновременных отправок в один чат здесь не закрыты: для этого нужны лёгкие транзакции или USING TIMESTAMP из следующей главы."""

