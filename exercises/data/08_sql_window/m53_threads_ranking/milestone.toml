test_command = ["cargo", "make", "check"]
requires = ["postgres", "nats"]
hint.ru = [
"""Ветка это `WITH RECURSIVE tree AS (корни поста UNION ALL дети через JOIN tree ON c.parent = t.id)`. Глубину и путь
`ARRAY[c.id]`, `t.path || c.id` неси в каждой строке, сортируй по пути, а предел глубины ставь в условие рекурсии.""",
"""Защиту от циклов даёт `CYCLE id SET looped USING trail` после CTE: строки с `looped` отбрасывай. Удалённый
комментарий с живыми ответами остаётся заглушкой: текст пустой, флаг deleted.""",
"""Три последних под каждым постом: `unnest($1) AS p(id) LEFT JOIN LATERAL (... WHERE post = p.id ORDER BY id DESC
LIMIT 3) c ON true`. LEFT оставляет посты без комментариев.""",
"""Рейтинг: посчитай лайки этой и прошлой недели одним проходом `count(*) FILTER (WHERE ...)`, места дай
`RANK() OVER (ORDER BY ...)`, а сдвиг это разница мест прошлой и этой недели.""",
]
story.ru = """У комментариев появились ветки любой глубины, под постами в ленте видно свежие ответы, соцсеть
подсказывает знакомых, а авторы недели получают места с ничьими и видят, насколько поднялись."""
