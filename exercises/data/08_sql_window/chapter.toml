[chapter]
title.en = "Window functions"
title.ru = "Оконные функции"

[[chapter.visuals]]
file = "visuals/window_frame.html"
title.ru = "Рамка окна: ROWS и RANGE на равных ключах"

[[exercises]]
name = "pgwin1"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Номер строки в заданном порядке даёт оконная функция. Порядок «внутри окна» задаётся словом OVER и отдельным ORDER BY, который не зависит от ORDER BY всего запроса.""", """`row_number() OVER (ORDER BY created_at DESC, id)`: окно без PARTITION BY это вся таблица одним куском."""]
why.ru = """Оконная функция считает значение для каждой строки, глядя на соседей, но строки не схлопывает: на выходе столько же строк, сколько на входе. Порядок в OVER определяет, как строки нумеруются, а ORDER BY в конце запроса определяет, как они выдаются: это два независимых порядка. Добавь второй ключ (`id`), когда время может совпасть: иначе номера при равных значениях ставятся как получится."""

[[exercises]]
name = "pgwin2"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Нумерация должна начинаться заново для каждого автора. В OVER для этого есть отдельная часть.""", """`row_number() OVER (PARTITION BY author_id ORDER BY created_at, id)`: PARTITION BY режет строки на независимые разделы, внутри каждого функция работает отдельно."""]
why.ru = """PARTITION BY для окна это то же, что GROUP BY для агрегата, только без схлопывания: строки делятся на разделы, и функция считает внутри каждого. Нумерация сбрасывается на единицу в каждом разделе. Порядок внутри раздела задан по времени, а не по id: идентификатор отражает порядок вставки, и отложенный пост с большим id оказался бы «первым»."""

[[exercises]]
name = "pgwin_q1"
kind = "question"
question.ru = """В таблице posts десять строк, постов у пяти авторов. Сколько строк вернёт `SELECT author_id, count(*) OVER (PARTITION BY author_id) FROM posts`?"""
options.ru = ["5", "10", "1", "ошибку: нужен GROUP BY"]
answer = [1]
explain.ru = """Оконная функция не схлопывает строки. Каждый из десяти постов остаётся строкой, а в последнем столбце у него стоит число постов его автора (для трёх постов alice будет по 3 в каждой из её трёх строк). Пять строк вышло бы из `SELECT author_id, count(*) ... GROUP BY author_id`. Это главное отличие окна от группировки: окно добавляет столбец, группа убирает строки."""
hint.ru = """Схлопывает ли строки оконная функция? Сравни с GROUP BY."""

[[exercises]]
name = "pgwin3"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Когда у строк равное значение, row_number всё равно даст разные номера. Нужны функции, которые ставят одинаковое место при одинаковом ключе.""", """`rank()` и `dense_rank()` с `OVER (ORDER BY likes DESC)`. Чем они отличаются, видно сразу после группы с ничьёй."""]
why.ru = """row_number никогда не повторяется, rank повторяется при равных ключах и пропускает следующие места (1, 1, 3), dense_rank повторяется и не пропускает (1, 1, 2). Для турнирной таблицы честен rank (после двух вторых мест третьего нет), для «сколько разных уровней лайков» нужен dense_rank. Выбор зависит от того, что ты обещаешь читателю, а не от скорости."""

[[exercises]]
name = "pgwin_q2"
kind = "question"
question.ru = """Лайки у постов: 100, 90, 90, 80. Какие места получит пост с 80 лайками от `rank()` и от `dense_rank()` (по убыванию лайков)?"""
options.ru = ["3 и 3", "4 и 4", "3 и 2", "4 и 3"]
answer = [3]
explain.ru = """Два поста с 90 делят второе место. rank после ничьей пропускает места: следующий пост получает четвёртое (1, 2, 2, 4). dense_rank пропусков не делает: 1, 2, 2, 3, и у поста с 80 лайками третье место. Итого 4 и 3."""
hint.ru = """Выпиши места для всех четырёх постов подряд, отдельно для каждой функции."""

[[exercises]]
name = "pgwin4"
style = "fix"
requires = ["postgres"]
hint.ru = ["""Оконные функции вычисляются уже после WHERE, поэтому к его моменту номера ещё нет.""", """Номер нужно сначала вычислить, а потом фильтровать по нему: пусть окно считается во вложенном запросе или в CTE, а условие стоит снаружи."""]
why.ru = """Оконные функции вычисляются после WHERE, GROUP BY и HAVING, поэтому в WHERE их нет: строки ещё не отобраны, и «номер в разделе» не определён. Стандартный выход, обернуть запрос с окном в подзапрос или WITH и фильтровать снаружи. Порядок `likes DESC, created_at` внутри окна решает ничью: без второго ключа победитель среди равных случаен."""

[[exercises]]
name = "pgwin5"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Есть форма DISTINCT, которая оставляет первую строку каждой группы по заданному порядку.""", """Выражения в DISTINCT ON должны совпадать с началом ORDER BY: сначала ключ группы, потом порядок внутри группы. Из каждой группы остаётся первая строка в этом порядке."""]
why.ru = """DISTINCT ON (ключ) оставляет по одной строке на ключ, первую в порядке ORDER BY. Выражения в DISTINCT ON обязаны совпадать с началом ORDER BY, иначе Postgres откажет: «первая» строка группы определена только порядком. Это короче и обычно быстрее, чем row_number плюс фильтр, особенно с подходящим индексом `(author_id, created_at DESC)`. Минус: это расширение Postgres, в других СУБД его нет, а номер строки в окне переносим. Для «топ 3 на группу» DISTINCT ON не годится, там окно или LATERAL."""

[[exercises]]
name = "pgwin_q3"
kind = "question"
question.ru = """Что сделает запрос `SELECT DISTINCT ON (author_id) author_id, id FROM posts ORDER BY created_at DESC`?"""
options.ru = ["вернёт самый свежий пост каждого автора", "ответит ошибкой: выражения DISTINCT ON должны совпадать с началом ORDER BY", "вернёт один самый свежий пост на всю таблицу", "вернёт все посты, DISTINCT ON тут ничего не делает"]
answer = [1]
explain.ru = """Postgres не угадывает, какую строку оставить в группе, если порядок не начинается с ключа группы, и отвечает ошибкой «SELECT DISTINCT ON expressions must match initial ORDER BY expressions». Правильно: `ORDER BY author_id, created_at DESC`. Сначала ключ, потом порядок внутри группы."""
hint.ru = """Какой порядок строк внутри группы описывает ORDER BY, который не упоминает author_id?"""

[[exercises]]
name = "pgwin6"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Сначала свёртка по дням (GROUP BY), потом накопление по результату свёртки. Окно умеет работать над уже посчитанными группами.""", """Окну можно дать в аргумент агрегат: оно вычисляется после GROUP BY и видит уже посчитанные группы. Нарастающий итог это сумма с ORDER BY по дню."""]
why.ru = """Оконные функции вычисляются после GROUP BY и поэтому могут брать агрегат в аргументы: `sum(count(*)) OVER (ORDER BY day)` складывает посчитанные по дням числа нарастающим итогом. С ORDER BY в окне рамка по умолчанию идёт от первой строки раздела до текущей (с равными ключами, что здесь безопасно: после GROUP BY ключи уникальны). Без GROUP BY, на сырых строках, та же запись ведёт себя иначе, и об этом следующая задача."""

[[exercises]]
name = "pgwin_q4"
kind = "question"
question.ru = """В столбце x значения 1, 2, 2, 3. Что вернёт `SELECT x, sum(x) OVER (ORDER BY x) FROM t` во втором столбце, строки по порядку?"""
options.ru = ["1, 3, 5, 8", "1, 3, 3, 6", "1, 5, 5, 8", "1, 2, 2, 3"]
answer = [2]
explain.ru = """При ORDER BY рамка окна по умолчанию это RANGE от начала до текущей строки, и в неё входят все строки с тем же ключом (равные соседи). Обе двойки сразу видят друг друга: сумма для них 1 + 2 + 2 = 5, поэтому получается 1, 5, 5, 8. Чтобы получить 1, 3, 5, 8, нужна рамка по строкам: `ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW`."""
hint.ru = """Равные ключи для рамки по умолчанию «одновременны»: текущая строка включает всех равных ей."""

[[exercises]]
name = "pgwin7"
style = "fix"
requires = ["postgres"]
hint.ru = ["""Ключ порядка в окне это только день, а подписок в один день несколько. Как окно считает строки с равным ключом?""", """Рамка по умолчанию при ORDER BY (RANGE) считает равные ключи одной группой. Нужна рамка, которая идёт по строкам, а не по значениям, или ключ порядка, который различает все строки.""", """Допиши рамку явно: `ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW`. Либо добавь в ORDER BY окна уникальный столбец (чьё время или id)."""]
why.ru = """С ORDER BY окно по умолчанию использует RANGE: рамка включает все строки, у которых ключ равен ключу текущей. Поэтому две подписки одного дня получают одно число, и нумерация скачет. ROWS считает физические строки, и каждая видит ровно те, что до неё. Альтернатива, добавить в ORDER BY окна уникальный ключ, тоже работает и делает порядок воспроизводимым. Учти: при ROWS и неуникальном ключе, какая именно из одинаковых строк получит какой номер, не определено."""

[[exercises]]
name = "pgwin_q5"
kind = "question"
question.ru = """Значения x: 10, 20, 30, 40 (ключ порядка уникален). Что стоит в последней строке для `avg(x) OVER (ORDER BY x ROWS BETWEEN 2 PRECEDING AND CURRENT ROW)`?"""
options.ru = ["25", "35", "30", "20"]
answer = [2]
explain.ru = """Рамка охватывает текущую строку и две предыдущие: для последней это 20, 30 и 40, среднее 30. Это скользящее среднее по трём точкам. Если бы рамка была `UNBOUNDED PRECEDING`, считались бы все четыре значения (25), а на первых двух строках рамка короче трёх, потому что слева данных нет."""
hint.ru = """Какие строки входят в рамку для четвёртой строки: считай «две предыдущие» и саму строку."""

[[exercises]]
name = "pgwin8"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Нужны значения соседних строк внутри раздела. Для них есть пара функций, одна смотрит назад, другая вперёд.""", """`lag(столбец) OVER (PARTITION BY ... ORDER BY ...)` берёт значение предыдущей строки раздела, `lead` следующей. У границы раздела вернётся NULL.""", """Для второй выборки сначала сверни посты по дням (подзапрос с GROUP BY), потом на результате применяй `lag(posts) OVER (ORDER BY day)`. Часы между постами: разница времён имеет тип interval, `extract(epoch FROM разница)` переводит её в секунды; раздели на 3600 и округли функцией `round`."""]
why.ru = """lag и lead достают значение соседней строки раздела; на границе раздела это NULL, и разница с ним тоже NULL, а не ноль или ошибка. Раздел обязателен для первой выборки: без PARTITION BY «предыдущим» оказался бы пост другого автора. Для второй выборки окно работает над результатом GROUP BY, то есть сначала свёртка по дням, потом окно по дням. Одинаковое определение окна можно вынести в `WINDOW w AS (...)` и использовать несколько раз."""

[[exercises]]
name = "pgwin_leaderboard"
style = "scratch"
requires = ["postgres"]
quiz = true
hint.ru = ["""Места нужно посчитать для обеих недель одним окном, разбив по неделям (PARTITION BY week). Потом соединить «эту» неделю с «прошлой» по автору.""", """В CTE отбери очки двух недель (`WHERE week IN ($1, $1 - 1)`), добавь `rank() OVER (PARTITION BY week ORDER BY score DESC)` и лидера недели `max(score) OVER (PARTITION BY week)`.""", """Снаружи возьми строки недели $1 (`cur`), присоедини LEFT JOIN те же места недели $1 - 1 (`prev`) по автору. Отставание это `top - score`, подъём это `prev.place - cur.place`."""]
why.ru = """Рейтинг складывается из приёмов главы. rank с PARTITION BY week считает места каждой недели сразу, не раздельными запросами, а max по тому же разделу даёт очки лидера для отставания. Места прошлой недели нужно считать среди игроков той недели, а не фильтровать после: если сначала оставить только нынешних игроков, места прошлой недели сдвинутся. LEFT JOIN сохраняет новичков с NULL, а минус с NULL даёт NULL, что и требуется. Ничья в обеих неделях это главное, на чём ломается row_number."""

