[[exercises]]
name = "cql1"
style = "todo"
requires = ["scylla"]
hint.ru = ["""Без чего Scylla вообще не создаст keyspace? И что должно произойти, если он уже есть?""", """Репликация задаётся словарём в `WITH replication = {...}`: класс стратегии и число копий. Для повтора есть условие, которое превращает «уже существует» из ошибки в ничего не делающую команду.""", """Нужны `IF NOT EXISTS` после `CREATE KEYSPACE` и `'class': 'SimpleStrategy'` с `'replication_factor': 1`. В `format!` фигурные скобки удваиваются."""]
why.ru = """Репликация это свойство keyspace, а не таблицы: все таблицы чата получат одинаковое число копий. SimpleStrategy годится для одного узла и разработки, в бою пишут NetworkTopologyStrategy с числом копий в каждом дата-центре. `IF NOT EXISTS` делает скрипт развёртывания идемпотентным: его можно запускать при каждом старте. Но он не сравнивает настройки: если keyspace уже есть с другой репликацией, команда молча ничего не изменит."""

[[exercises]]
name = "cql2"
style = "todo"
requires = ["scylla"]
hint.ru = ["""Где в CREATE TABLE указывается первичный ключ? А как в SELECT выбрать одну строку по ключу?""", """Ключ можно пометить прямо у столбца: `user_id int PRIMARY KEY`. В запросе перечисли нужные столбцы и добавь условие на ключ."""]
why.ru = """В Scylla ключ это не просто ограничение уникальности, а адрес строки: по нему вычисляется, на каком узле она лежит. Поэтому таблицы без ключа не бывает, а запрос по ключу идёт ровно в один узел (точнее, в его реплики). Явный список столбцов вместо звёздочки здесь нужен по той же причине, что в SQL: ответ не меняется, когда в таблицу добавят столбец."""

[[exercises]]
name = "cql3"
style = "fix"
requires = ["scylla"]
hint.ru = ["""Ключ таблицы определяет, что считается «той же строкой». Сколько строк может быть у одного chat_id при таком ключе?""", """Первичный ключ может состоять из нескольких столбцов: первый задаёт партицию, остальные различают строки внутри неё и задают их порядок.""", """Добавь `sent_at` в первичный ключ вторым: `PRIMARY KEY (chat_id, sent_at)`."""]
why.ru = """INSERT в Scylla это всегда upsert: строка с тем же ключом молча перезаписывается, никакой ошибки «уже существует» нет. Поэтому ключ должен однозначно задавать запись. Первый столбец ключа (chat_id) это ключ партиции: все сообщения чата лежат вместе и читаются одним запросом. Второй (sent_at) это ключ кластеризации: он различает сообщения внутри партиции и хранит их отсортированными, поэтому история приходит в порядке времени без сортировки на лету."""

[[exercises]]
name = "cql4"
style = "todo"
requires = ["scylla"]
hint.ru = ["""Где хранится порядок строк внутри партиции: в запросе или в самой таблице?""", """Порядок кластеризации задаётся при создании таблицы, в разделе `WITH` после списка столбцов.""", """`WITH CLUSTERING ORDER BY (sent_at DESC)` после закрывающей скобки CREATE TABLE."""]
why.ru = """Строки партиции лежат на диске отсортированными по ключу кластеризации, и чтение идёт по этому порядку. Если самый частый запрос это «последние N», выгоднее хранить в обратном порядке: тогда LIMIT просто читает начало партиции. `ORDER BY sent_at DESC` в запросе тоже сработает (Scylla умеет читать партицию задом наперёд), но порядок в схеме делает частый путь самым дешёвым и не требует помнить про ORDER BY в каждом запросе."""

[[exercises]]
name = "cql5"
style = "todo"
requires = ["scylla"]
hint.ru = ["""Какое условие отрезает сообщение 400 и всё, что новее?""", """По ключу кластеризации можно задавать диапазон: `>`, `<`, `>=`, `<=`. Строгое неравенство не повторит сообщение, которое уже на экране. Количество ограничивает LIMIT."""]
why.ru = """Страница «до курсора» по ключу кластеризации это самый дешёвый запрос в Scylla: узел находит в отсортированной партиции точку 400 и читает две строки дальше. Строгое `<` важно: с `<=` первое сообщение новой страницы повторит последнее старой. Курсор по значению ключа, а не по номеру страницы, не съезжает, когда в чат пишут новые сообщения."""

[[exercises]]
name = "cql6"
style = "fix"
requires = ["scylla"]
hint.ru = ["""Ключ кластеризации здесь из двух столбцов: day и sent_at. Можно ли искать по второму, не сказав ничего о первом?""", """Строки партиции отсортированы сначала по day, потом по sent_at. Диапазон по sent_at имеет смысл, только когда day зафиксирован равенством, иначе подходящие строки разбросаны по всем дням.""", """Добавь в WHERE равенство по дню: `day = 20261021`, а диапазон по sent_at оставь."""]
why.ru = """Правило WHERE в CQL следует из того, как лежат данные: партиция находится по полному ключу партиции, а внутри партиции строки отсортированы по столбцам кластеризации слева направо. Поэтому условия на столбцы кластеризации идут по порядку: все предыдущие равенством, последний условием можно задать диапазон. Запрос по sent_at без day означал бы прыжки по каждому дню партиции, и Scylla честно отказывается делать это без ALLOW FILTERING."""

[[exercises]]
name = "cql7"
style = "todo"
requires = ["scylla"]
hint.ru = ["""Как в объявлении первичного ключа отличить «эти столбцы вместе образуют ключ партиции» от «первый столбец партиция, остальные кластеризация»?""", """Составной ключ партиции берётся в дополнительные скобки внутри PRIMARY KEY. Запрос к такой таблице обязан указать равенством все столбцы ключа партиции, иначе Scylla не знает, какой хеш считать.""", """`PRIMARY KEY ((chat_id, month), sent_at)` и `WHERE chat_id = 1 AND month = 202610`."""]
why.ru = """Хеш, по которому выбираются узлы, считается от всего ключа партиции целиком. Поэтому запрос по части ключа партиции (только chat_id) невозможен без полного обхода: разные месяцы одного чата лежат на разных узлах. Это и цель, и цена: партиции ограничены по размеру и равномерно разложены по кластеру, но чтение истории за несколько месяцев это несколько запросов, по одному на месяц."""

[[exercises]]
name = "cql8"
style = "fix"
requires = ["scylla"]
hint.ru = ["""Что именно записывает этот INSERT в столбец avatar? Пустота это «не трогать» или «записать пустоту»?""", """В Scylla INSERT и UPDATE оба пишут только перечисленные столбцы, и явный null это запись удаления значения. Значит, в команде должен быть только тот столбец, который меняется.""", """`UPDATE profiles SET bio = ... WHERE user_id = 7` или INSERT только с user_id и bio."""]
why.ru = """INSERT и UPDATE в Scylla почти одно и то же: оба записывают значения перечисленных столбцов по ключу, не проверяя, есть ли строка. Явный null это не «пропусти», а запись надгробия: значение удаляется. Отсюда правило: пиши только изменённые столбцы. Обратная сторона той же природы: запись идемпотентна, её можно безопасно повторить после таймаута, но и «зарегистрировать имя, если свободно» обычным INSERT нельзя: второй молча перезапишет первого."""

[[exercises]]
name = "cql9"
style = "todo"
requires = ["scylla"]
hint.ru = ["""DELETE в CQL умеет удалять строку, отдельные столбцы строки и сразу много строк партиции. Чем отличается запись этих трёх случаев?""", """Список столбцов между DELETE и FROM удаляет только их. Без списка удаляется строка. Диапазон по ключу кластеризации внутри одной партиции удаляет все попавшие в него строки.""", """`DELETE body FROM ... WHERE chat_id = 1 AND sent_at = 300` и `DELETE FROM ... WHERE chat_id = 2 AND sent_at < 200`."""]
why.ru = """Все три удаления в Scylla это записи: надгробие на строку, на ячейку или на диапазон. Место освобождается не сразу, а при уплотнении после gc_grace_seconds, и до тех пор чтение проходит сквозь надгробия. Удаление диапазоном пишет одно надгробие на весь диапазон, это намного дешевле, чем удалять строки по одной: и для записи, и для будущих чтений."""

[[exercises]]
name = "cql10"
style = "todo"
requires = ["scylla"]
hint.ru = ["""Как сравнить timeuuid с моментом времени, если у одного момента может быть много разных timeuuid?""", """`minTimeuuid(t)` это самый маленький timeuuid момента t, `maxTimeuuid(t)` самый большой. Подумай, какой из них нужен на каждой границе полуоткрытого интервала. Время из id достаёт `toTimestamp(id)`.""", """Нижняя граница `id >= minTimeuuid('2026-10-20 10:00:00+0000')`, верхняя `id < minTimeuuid('2026-10-20 11:00:00+0000')`."""]
why.ru = """timeuuid сравнивается сначала по времени, поэтому диапазон по нему это диапазон по времени, и партиция чата без отдельного столбца лежит в хронологическом порядке. Тонкость в границах: у одного момента много timeuuid (разные узлы и счётчики). `>= minTimeuuid(начало)` берёт все сообщения начала, `< minTimeuuid(конец)` отрезает все сообщения конца. С `maxTimeuuid` на верхней границе и `<=` в выборку попадёт сообщение, отправленное ровно в 11:00. Сами minTimeuuid и maxTimeuuid годятся только для запросов, но не как id новых строк: они не уникальны."""

[[exercises]]
name = "cql11"
style = "fix"
requires = ["scylla"]
hint.ru = ["""Что говорит Scylla про тип внутри коллекции? Как коллекция хранит элементы, и может ли так же храниться UDT?""", """Элемент коллекции хранится как одно значение. Пользовательский тип внутри коллекции тоже должен стать одним значением, для этого его «замораживают».""", """`list<frozen<attachment>>`."""]
why.ru = """Коллекции в Scylla хранятся поячеечно: элемент множества или ключ словаря это отдельная ячейка, поэтому `tags + {'tokio'}` и `reactions['fire'] = 1` дописывают одну ячейку без чтения строки. UDT внутри коллекции так разложить нельзя, поэтому он должен быть frozen: сериализуется целиком в одно значение и меняется только заменой целиком. Коллекции для небольших наборов (теги, реакции), а не для тысяч элементов: коллекция читается целиком вместе со строкой."""

[[exercises]]
name = "cql12"
style = "todo"
requires = ["scylla"]
hint.ru = ["""Как сделать так, чтобы значение принадлежало партиции, а не строке?""", """У столбца можно указать модификатор, после которого он хранится один раз на партицию. Тогда его можно записывать, указывая только ключ партиции.""", """`title text STATIC`."""]
why.ru = """Static-столбец хранится один раз на партицию и приклеивается к каждой её строке при чтении. Это дешёвый способ держать метаданные партиции рядом с данными: название чата приходит тем же запросом, что история, а переименование это одна запись. Писать его можно по одному ключу партиции, без ключа кластеризации. Годится только для того, что действительно одно на партицию."""

[[exercises]]
name = "cql13"
style = "fix"
requires = ["scylla"]
hint.ru = ["""Какой LIMIT нужен: на весь ответ или на каждую партицию отдельно?""", """В CQL есть отдельное ограничение числа строк в каждой партиции. Оно ставится перед обычным LIMIT и может сочетаться с ним.""", """`PER PARTITION LIMIT 1` вместо `LIMIT 1`."""]
why.ru = """PER PARTITION LIMIT берёт первые N строк каждой партиции в порядке кластеризации, а порядок у нас свежими вперёд, поэтому первая строка это последнее сообщение. Так список чатов собирается одним запросом без N отдельных. IN по ключу партиции удобен для небольших списков: координатор опрашивает несколько партиций, и на десятках чатов это нормально, а на тысячах лучше отдельная таблица «последнее сообщение чата»."""

[[exercises]]
name = "cql14"
style = "fix"
requires = ["scylla"]
hint.ru = ["""Какой ключ партиции нужен таблице, чтобы «все сообщения bob» были одним чтением одной партиции? И что различит два сообщения bob, отправленные одновременно?""", """Ключ партиции author, внутри порядок по sent_at от свежих. Одного sent_at для уникальности мало: добавь в ключ кластеризации ещё один столбец, который различит сообщения из разных чатов.""", """`PRIMARY KEY (author, sent_at, chat_id) WITH CLUSTERING ORDER BY (sent_at DESC, chat_id ASC)`, а запрос по `author = 'bob'` из новой таблицы."""]
why.ru = """В Scylla таблица проектируется под запрос: «сообщения автора» и «сообщения чата» это разные запросы, значит, разные таблицы с одними и теми же данными. Запись удваивается, зато каждое чтение идёт в одну партицию. ALLOW FILTERING разрешает Scylla читать всё и выбрасывать неподходящее: на тестовых данных быстро, в бою время растёт с объёмом всей таблицы. Ключ кластеризации обязан делать строку уникальной: одного sent_at мало, иначе одновременные сообщения в разных чатах молча затрут друг друга."""

[[exercises]]
name = "cql_chat_messages"
style = "scratch"
requires = ["scylla"]
quiz = true
hint.ru = ["""Каждый пункт это одна из задач главы: порядок кластеризации, курсор по ключу, диапазон timeuuid, static-столбец.""", """Схема: ключ партиции чат, кластеризация по timeuuid от свежих, название static. Страница до курсора это строгое неравенство по sent_at. День это полуоткрытый интервал от полуночи до полуночи через minTimeuuid.""", """Название одной строкой: static-столбец виден в каждой строке партиции, так что хватит LIMIT 1."""]
why.ru = """Всё вместе: одна таблица обслуживает четыре запроса окна чата, и каждый из них читает одну партицию в её естественном порядке. Свежие первыми в схеме делают «последние N» и «загрузить ещё» дешёвыми, timeuuid даёт и уникальность, и время, а static-название приходит с историей бесплатно. Если какой-то запрос захотел ALLOW FILTERING, значит, таблица спроектирована не под него."""

[[exercises]]
name = "cql_q1"
kind = "question"
question.ru = """Регистрация пишет `INSERT INTO users_by_name (username, user_id) VALUES ('kate', 17)`. Через минуту другой человек регистрирует то же имя: `INSERT ... VALUES ('kate', 42)`. Что произойдёт?"""
options.ru = ["""Вторая вставка упадёт с ошибкой «строка уже существует»""", """Вторая вставка молча перезапишет первую: имя kate теперь у пользователя 42""", """В таблице окажутся две строки kate""", """Scylla оставит первую строку и проигнорирует вторую"""]
answer = [1]
explain.ru = """INSERT в Scylla это upsert: проверки существования нет, строка с тем же ключом перезаписывается. Для «занять, если свободно» нужна лёгкая транзакция `IF NOT EXISTS`, о ней глава про продвинутую Scylla."""
hint.ru = """Проверяет ли обычный INSERT, есть ли уже строка с таким ключом?"""

[[exercises]]
name = "cql_q2"
kind = "question"
question.ru = """Таблица с ключом `PRIMARY KEY ((a, b), c, d)`. Какой запрос Scylla выполнит без ALLOW FILTERING?"""
options.ru = ["""`WHERE a = 1`""", """`WHERE a = 1 AND b = 2 AND d = 3`""", """`WHERE c = 5`""", """`WHERE a = 1 AND b = 2 AND c > 5`"""]
answer = [3]
explain.ru = """Ключ партиции (a, b) нужен целиком и равенством. Столбцы кластеризации идут по порядку: нельзя условие на d без c. Диапазон допустим на последнем ограниченном столбце кластеризации, здесь на c."""
hint.ru = """Сначала найди партицию, потом вспомни, как отсортированы строки внутри неё."""

[[exercises]]
name = "cql_q3"
kind = "question"
question.ru = """Два сервиса почти одновременно пишут в одну ячейку: первый ставит статус `online` с меткой времени записи 1000, второй ставит `away` с меткой 990, но его запись дошла до узла позже. Что прочитает следующий запрос?"""
options.ru = ["""`away`: побеждает последняя дошедшая запись""", """`online`: побеждает запись с большей меткой времени""", """Ошибку конфликта записи""", """Случайное из двух значений"""]
answer = [1]
explain.ru = """В Scylla побеждает запись с большей меткой времени (last write wins), а не та, что пришла позже. Метку по умолчанию ставит координатор, поэтому расхождение часов между клиентами и узлами прямо влияет на итог."""
hint.ru = """По какому признаку Scylla сравнивает две версии одной ячейки?"""

[[exercises]]
name = "cql_q4"
kind = "question"
question.ru = """Модератор удалил миллион старых сообщений по одному командой DELETE. Через час место на диске не освободилось, а чтение этих чатов стало медленнее. Почему?"""
options.ru = ["""Удаление в Scylla асинхронное и ещё не дошло до диска""", """DELETE пишет надгробия: место освободится при уплотнении после gc_grace_seconds, а до тех пор чтение проходит сквозь них""", """Удалённые строки сразу переносятся в корзину""", """Надо выполнить VACUUM, как в Postgres"""]
answer = [1]
explain.ru = """SSTable неизменяемы, поэтому удаление это запись маркера-надгробия. Чтение должно его увидеть и учесть, а физически данные и надгробия уходят при уплотнении после gc_grace_seconds (он нужен, чтобы удаление успело дойти до всех реплик). Отсюда совет удалять диапазонами и пользоваться TTL."""
hint.ru = """Можно ли изменить уже записанный на диск файл SSTable?"""

[[exercises]]
name = "cql_q5"
kind = "question"
question.ru = """Запрос `SELECT * FROM messages WHERE author = 'bob' ALLOW FILTERING` на тестовой базе отвечает за 3 мс. Что будет в бою, где в таблице 200 миллионов сообщений в тысячах чатов?"""
options.ru = ["""То же самое: условие по столбцу проверяется индексом""", """Scylla прочитает все партиции таблицы на всех узлах и отбросит лишнее: время растёт с размером всей таблицы""", """Запрос вернёт только первую страницу и остановится""", """ALLOW FILTERING включает кэш, и станет быстрее"""]
answer = [1]
explain.ru = """ALLOW FILTERING это согласие на полный обход: без ключа партиции Scylla не знает, где искать, и читает всё. Решение для частого запроса это отдельная таблица с author в ключе партиции."""
hint.ru = """Без ключа партиции как Scylla узнает, на каком узле лежат строки bob?"""
