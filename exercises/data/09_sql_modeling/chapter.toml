[chapter]
title.en = "Schema design"
title.ru = "Проектирование схемы"

[[exercises]]
name = "pgmdl1"
style = "bughunt"
requires = ["postgres"]
hint.ru = ["""Один и тот же факт («ник автора») записан в двух местах, и они расходятся. Правило: каждый факт лежит ровно в одном месте.""", """Столбец с копией имени из posts надо убрать, а ник читать из users по `author_id`. Ленту придётся переписать так, чтобы она сама подтягивала ник."""]
why.ru = """Копия данных расходится с оригиналом: при смене ника нужно обновить его в каждом посте, а одно забытое место даёт ленту с призраками старых имён. Нормализация говорит, что имя хранится один раз (в users), а посты ссылаются на пользователя по ключу. Цена, один JOIN в ленте, почти всегда меньше цены ошибок рассинхронизации. Исключение, когда копию делают сознательно (история: имя на момент события), нужно называть и оформлять отдельным столбцом, а не «потому что быстрее»."""

[[exercises]]
name = "pgmdl2"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Многие ко многим не помещается в один столбец: нужна отдельная таблица связей, по строке на пару «пост, тег».""", """В связующей таблице пара (post_id, tag_id) служит первичным ключом, а оба столбца ссылаются на свои таблицы с `ON DELETE CASCADE`. Имя тега уникально в tags."""]
why.ru = """Строка через запятую не умеет ничего из того, что нужно базе: ни ограничить дубли, ни проверить, что тег существует, ни искать по индексу, ни точно сравнить (`LIKE '%sql%'` находит 'nosql'). Связующая таблица даёт всё это обычными средствами: составной первичный ключ запрещает дубль пары, внешние ключи запрещают висящие ссылки, CASCADE убирает связи вместе с владельцем. Если тег нужен как отдельная сущность (переименование, счётчик использования), его выносят в таблицу tags, как здесь."""

[[exercises]]
name = "pgmdl_q1"
kind = "question"
question.ru = """Таблица posts хранит теги строкой в столбце tags: 'rust,sql' у поста 1, 'nosql' у поста 2. Какие посты вернёт `SELECT id FROM posts WHERE tags LIKE '%sql%'`?"""
options.ru = ["только пост 1", "посты 1 и 2", "только пост 2", "ни одного: LIKE по запятым не работает"]
answer = [1]
explain.ru = """`LIKE '%sql%'` ищет подстроку, а 'nosql' содержит 'sql'. Поэтому находятся оба поста, хотя у второго тега sql нет. Это типичный симптом списка в строке: база не знает, где граница между значениями. Лечится отдельной таблицей связей и точным сравнением `name = 'sql'`."""
hint.ru = """Найди подстроку sql в каждой из двух строк, не думая о запятых."""

[[exercises]]
name = "pgmdl3"
style = "fix"
requires = ["postgres"]
hint.ru = ["""Ключ связи должен быть значением, которое никогда не меняется. Ник к таким не относится.""", """Заведи число-идентификатор (generated identity) как первичный ключ, а ник оставь уникальным столбцом. Посты должны ссылаться на число."""]
why.ru = """Естественный ключ (ник, почта, телефон) выглядит экономно, но люди меняют ники и почты, а ссылки на ключ размазаны по всей базе. Либо правишь ссылки каскадом (`ON UPDATE CASCADE`: каждая смена ника переписывает все посты, и это дорого и опасно), либо выбираешь суррогатный ключ, который никогда не меняется и ничего не значит. Уникальность ника при этом никуда не девается: она живёт в `UNIQUE`, а не в роли ключа."""

[[exercises]]
name = "pgmdl4"
style = "fix"
requires = ["postgres"]
hint.ru = ["""Обычный UNIQUE сравнивает значения побайтово, и для него Alice и alice разные. Нужна уникальность по приведённому значению.""", """Уникальный индекс можно построить не только по столбцу, но и по выражению над ним. Запретить заглавные буквы через CHECK нельзя, ник должен показываться как введён."""]
why.ru = """Уникальный индекс по выражению применяет ограничение к `lower(username)`, а хранит исходное значение: ник виден как введён, а дубли по регистру невозможны. Тот же индекс ускоряет поиск `WHERE lower(username) = lower($1)` (запрос должен использовать то же выражение). Проверка свободы ника в приложении перед вставкой ненадёжна: между проверкой и вставкой успевает зарегистрироваться второй клиент, а индекс закроет и эту гонку."""

[[exercises]]
name = "pgmdl5"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Обычный UNIQUE учитывает и удалённые строки, поэтому ник навсегда «занят». Нужна уникальность только среди живых строк.""", """Бывает уникальный индекс с условием: в него попадают только строки, подходящие под WHERE. Какое условие описывает «живую» строку?"""]
why.ru = """Мягкое удаление сохраняет данные (для восстановления, аудита, ссылок из других таблиц), но ломает обычную уникальность: удалённая строка продолжает занимать ник. Частичный уникальный индекс решает это: в него попадают только живые строки, поэтому удалённые не мешают, а воскрешение удалённого при занятом нике правильно упирается в тот же индекс. Платить придётся тем, что каждый запрос должен помнить про `deleted_at IS NULL` (следующая задача)."""

[[exercises]]
name = "pgmdl6"
style = "bughunt"
requires = ["postgres"]
hint.ru = ["""Мягкое удаление не убирает строку, поэтому любой запрос, который её не отфильтровал, считает её живой. Где в обоих запросах упоминаются посты?""", """Условие «живой пост» должно стоять везде, где читаются посты, и в подсчёте лайков тоже: лайки удалённого поста принадлежат удалённому посту. Проще один раз записать его в представление и читать из него."""]
why.ru = """Это цена мягкого удаления: условие `deleted_at IS NULL` обязано быть в каждом запросе к таблице, и забывают его постоянно (в списках, счётчиках, соединениях). Особенно коварны подсчёты по связанной таблице: лайки на удалённом посте тоже нужно исключить. Чтобы не полагаться на память, живые строки часто прячут за представлением (`CREATE VIEW live_posts AS SELECT ... WHERE deleted_at IS NULL`) и пишут запросы по нему, а к самой таблице обращаются только админские сценарии."""

[[exercises]]
name = "pgmdl_q2"
kind = "question"
question.ru = """Автор хочет, чтобы удалённые посты нельзя было случайно показать. Какое решение надёжнее всего защищает от забытого `deleted_at IS NULL` в новых запросах?"""
options.ru = ["хорошо подписать столбец в README", "прятать условие в представление, а запросы писать по нему", "сортировать так, чтобы удалённые оказывались внизу", "добавлять условие только в запросы ленты"]
answer = [1]
explain.ru = """Дисциплина не масштабируется: на сотом запросе кто-то забудет. Представление `live_posts` (посты с `deleted_at IS NULL`) переносит условие в одно место, и новые запросы пишутся по нему. Сортировка скрывает проблему, а не решает её, а условие только в ленте оставляет дыры в счётчиках и поиске."""
hint.ru = """Где можно один раз записать правило «живая строка», чтобы остальные запросы им пользовались?"""

[[exercises]]
name = "pgmdl7"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Нужно закрытое множество значений, которое можно расширить. Три способа: CHECK по списку, свой enum-тип, отдельная таблица статусов.""", """Для CHECK расширение пересоздаёт ограничение (`DROP CONSTRAINT`, потом `ADD CONSTRAINT` с новым списком). Имя ограничения по умолчанию `posts_status_check`. Для enum это `ALTER TYPE ... ADD VALUE`."""]
why.ru = """Три способа, у каждого своя цена. CHECK по тексту проще всего и ничего не усложняет, расширение это пересоздание ограничения (на больших таблицах оно проверяет все строки). Enum компактен и отвергает опечатки на уровне типа, добавить значение легко, а вот убрать нельзя. Справочник статусов с внешним ключом самый гибкий: статусы это данные, у них могут быть названия и порядок, но каждый запрос теперь знает про ещё одну таблицу. Выбирай по тому, как часто меняется список и кто его меняет."""

[[exercises]]
name = "pgmdl8"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Два необязательных столбца-ссылки, из которых заполнен ровно один: это ограничение CHECK на сами столбцы. Выражение `(post_id IS NULL) <> (comment_id IS NULL)` истинно, когда NULL ровно у одного.""", """Простой UNIQUE по трём столбцам не защищает от дублей: NULL не равен другому NULL, и пары (1, 5, NULL) и (1, 5, NULL) считаются разными. Нужны два частичных уникальных индекса, по одному на вид объекта, с условием `WHERE ... IS NOT NULL`."""]
why.ru = """Полиморфная связь («лайк чего-то») решается тремя способами. Две таблицы (post_likes и comment_likes) проще и надёжнее: у каждой честные внешние ключи и простая уникальность. Один общий likes с парой столбцов и CHECK «ровно один» держит всё в одном месте, но требует аккуратных частичных индексов, потому что NULL ломает обычный UNIQUE. Худший вариант: пара `target_type, target_id` без внешних ключей, где база не проверяет ничего, и сироты появляются молча. Выбирай там, где база сама следит за целостностью."""

[[exercises]]
name = "pgmdl_q3"
kind = "question"
question.ru = """В таблице likes `UNIQUE (user_id, post_id, comment_id)`. Лайки поста хранятся с `comment_id = NULL`. Что произойдёт при двух одинаковых вставках `(1, 5, NULL)`?"""
options.ru = ["вторая вставка завершится ошибкой уникальности", "обе пройдут: NULL не равен NULL, и пары считаются разными", "вторая вставка молча проигнорируется", "обе завершатся ошибкой, потому что NULL запрещён в UNIQUE"]
answer = [1]
explain.ru = """В обычном UNIQUE две строки считаются равными, только если все столбцы равны и не NULL: сравнение с NULL неизвестно. Значит, пара (1, 5, NULL) дважды допустима, и лайки дублируются без единой ошибки. Лечится частичным уникальным индексом по `(user_id, post_id) WHERE post_id IS NOT NULL` (или `NULLS NOT DISTINCT` в Postgres 15+)."""
hint.ru = """Равны ли два NULL в сравнении, которое делает UNIQUE?"""

[[exercises]]
name = "pgmdl9"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Счётчик должен меняться только тогда, когда лайк действительно появился или исчез. Как узнать из самого оператора, была ли вставка?""", """Изменяющая CTE умеет отдать результат своего `INSERT ... RETURNING` следующему шагу. `ON CONFLICT DO NOTHING` вернёт пусто, если лайк уже был, значит, число возвращённых строк это 0 или 1.""", """Основной оператор это UPDATE счётчика, который прибавляет число строк из CTE и возвращает новое значение через RETURNING. Для снятия то же с `DELETE ... RETURNING`."""]
why.ru = """Денормализованный счётчик быстрее чтения, но это вторая копия данных, и она должна меняться атомарно вместе с оригиналом. Один оператор с изменяющей CTE решает это: лайк и счётчик либо оба меняются, либо ни один. Счётчик увеличивается на число реально вставленных строк (0 при повторе), а не на единицу «на всякий случай». UPDATE блокирует строку поста, поэтому параллельные лайки выстраиваются в очередь и ничего не теряют. Это та самая цена, о которой стоит помнить: у популярного поста строка-счётчик становится горячей точкой, и тысячи лайков в секунду упираются в одну блокировку."""

[[exercises]]
name = "pgmdl10"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Схема в Postgres это пространство имён: `CREATE SCHEMA имя`, а таблица создаётся как `схема.таблица`. Для имён, которые зависят от параметра, подставь p через `format!`.""", """Внешний ключ через границу сервиса связывает их схемы намертво: нельзя менять, мигрировать и вынести в отдельную базу один сервис без другого. Оставь в profiles просто столбец account_id того же типа."""]
why.ru = """Правило «у сервиса свои таблицы»: каждый сервис владеет своими данными и не читает чужие таблицы напрямую, а внешних ключей между сервисами нет. Тогда сервис профилей можно переехать в отдельную базу, и ничего не сломается. Цена: база больше не гарантирует, что у профиля есть аккаунт; эту целостность держит код (события «аккаунт создан», «аккаунт удалён» и сверка). Так получается связь, ослабленная осознанно, а не небрежно."""

[[exercises]]
name = "pgmdl_services_schema"
style = "scratch"
requires = ["postgres"]
quiz = true
hint.ru = ["""Иди по сервисам по очереди: схема, потом её таблицы, и сверяй каждое правило ТЗ. Внутри схемы ссылки делаются внешними ключами, на чужие данные просто столбец того же типа.""", """Уникальность без учёта регистра это уникальный индекс по `lower(столбец)`. «Ровно такие значения» это CHECK, «не пусто после обрезки» это `btrim(body) <> ''`. Для каскадов смотри ТЗ: CASCADE у post_id, SET NULL у parent_id.""", """Лента: JOIN подписок по автору поста с `f.follower_id = $1`, фильтры статуса и удаления в WHERE, блокировки как `NOT EXISTS` с тем же `$1`. Имена схем подставляй через `format!` и `{p}`."""]
why.ru = """Квиз собирает главу. Правила «каждый факт в одном месте» и «у сервиса свои таблицы» дают раздел по схемам без внешних ключей между ними: всё, что снаружи, это просто идентификатор. Внутри сервиса целостность держит база: каскады, SET NULL для ответов, составные ключи, CHECK. Уникальность без учёта регистра идёт через индекс по `lower()`, мягкое удаление требует фильтра в каждом запросе, и ленту иначе не собрать: блокировки именно смотрящего, а не чьи-нибудь, поэтому `$1` стоит в условии блокировки. Цена изоляции: сироты возможны (лайк на несуществующий пост проходит), и целостность между сервисами теперь держит код."""
