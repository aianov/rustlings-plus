[chapter]
title.en = "Expressions, functions and NULL"
title.ru = "Выражения, функции и NULL"

[[chapter.visuals]]
file = "visuals/null_logic.html"
title.ru = "NULL и трёхзначная логика"

[[exercises]]
name = "pgfun1"
style = "fix"
requires = ["postgres"]
hint.ru = ["""В Postgres целое, делённое на целое, остаётся целым: `7 / 2` даёт `3`. Дробная часть отбрасывается ещё до округления.""", """Достаточно, чтобы одно из чисел стало numeric: `likes::numeric / views` или `likes * 1.0 / views`."""]
why.ru = """Деление двух integer отбрасывает остаток, и ROUND потом округляет уже готовый ноль. Ошибка тихая: запрос работает, цифры в интерфейсе просто всегда нулевые. Приводи к numeric до деления, а не после. Операция `::numeric` стоит дёшево, а ошибка в процентах дорого."""

[[exercises]]
name = "pgfun_q1"
kind = "question"
question.ru = """Что вернёт запрос?
```sql
SELECT 9 / 2 AS a, -9 / 2 AS b
```"""
options.ru = ["4 и -5", "4 и -4", "4.5 и -4.5", "5 и -4"]
answer = [1]
explain.ru = """Деление двух целых в Postgres целочисленное и отбрасывает дробную часть в сторону нуля: 9/2 это 4, -9/2 это -4. Не вниз (как делает floor, было бы -5), а к нулю. Хочешь дробный результат, сделай одно из чисел numeric: `9 / 2.0`."""
hint.ru = """Целое делится на целое, значит и результат целый. В какую сторону отбрасывается остаток?"""

[[exercises]]
name = "pgfun2"
style = "todo"
requires = ["postgres"]
hint.ru = """Чтобы получить дробное из целых, умножь на `100.0` или приведи к numeric. CEIL и FLOOR принимают число и возвращают целое значение вверх и вниз."""
why.ru = """float8 хранит числа двоично и не умеет представить 0.1 точно, как и f64 в Rust. numeric хранит десятичные цифры и считает как человек, зато медленнее. Деньги, проценты и любые числа, которые потом сверяют глазами, держи в numeric. Для статистики и графиков float вполне годится."""

[[exercises]]
name = "pgfun3"
style = "todo"
requires = ["postgres"]
hint.ru = """Склейка: `a || b`. Для убирания пробелов есть TRIM, для регистра LOWER. Если часть значений может быть NULL, посмотри на `concat_ws(разделитель, a, b)`."""
why.ru = """Оператор || с NULL даёт NULL, и вся строка исчезает. concat и concat_ws пропускают NULL, поэтому для «собери подпись из необязательных кусков» это правильный инструмент. LENGTH считает символы, а не байты: для кириллицы и эмодзи это важно (байты считает octet_length)."""

[[exercises]]
name = "pgfun4"
style = "todo"
requires = ["postgres"]
hint.ru = """`LEFT(текст, сколько)`, `SPLIT_PART(текст, разделитель, номер)`, `REPLACE(текст, что, на_что)`. Результат одной функции можно отдать другой как аргумент."""
why.ru = """SPLIT_PART нумерует части с единицы и при отсутствии части возвращает пустую строку, а не NULL и не ошибку: об этом стоит помнить, если почта вдруг без @. Для сложных разборов есть регулярные выражения (substring, regexp_replace), но простые функции читаются легче и быстрее."""

[[exercises]]
name = "pgfun_q4"
kind = "question"
question.ru = """Что вернёт запрос?
```sql
SELECT concat('x', NULL, 'y') AS r
```"""
options.ru = ["NULL", "xy", "x y", "ошибку"]
answer = [1]
explain.ru = """concat и concat_ws пропускают NULL, поэтому получается 'xy'. Оператор `||` с NULL, наоборот, давал бы NULL. Поэтому подпись из необязательных кусков собирают через concat_ws."""
hint.ru = """Чем concat отличается от оператора ||, когда среди аргументов NULL?"""

[[exercises]]
name = "pgfun5"
style = "todo"
requires = ["postgres"]
hint.ru = """`'12'::integer` и `CAST('12' AS integer)` одно и то же. Функции строк (LENGTH) не принимают число, ему сначала нужен текстовый вид. К дате прибавляется число дней обычным плюсом."""
why.ru = """Неявных приведений в Postgres мало (в отличие от некоторых других баз), и это хорошо: `'abc'::int` падает ошибкой, а не молча превращается в ноль. Двоеточия `::` специфичны для Postgres, CAST стандартный. Запрос с плохой строкой упадёт во время выполнения, поэтому приводить пользовательский текст лучше в приложении."""

[[exercises]]
name = "pgfun6"
style = "todo"
requires = ["postgres"]
hint.ru = """Условия проверяются по порядку, и срабатывает первое подошедшее. С какой границы нужно начать, чтобы не писать верхние пределы?"""
why.ru = """Порядок веток важен: CASE останавливается на первой подошедшей. Поэтому границы можно писать только «снизу» и не повторять верхнюю. ELSE лучше писать всегда: иначе непокрытые случаи тихо превращаются в NULL."""

[[exercises]]
name = "pgfun7"
style = "fix"
requires = ["postgres"]
hint.ru = ["""Ответ короче, чем нужно. Что общего у bob, eve и heidi? Что получится при `NULL <> ''`?""", """WHERE оставляет строку только при TRUE, а `NULL <> ''` это NULL. Нужна явная ветка для пустых значений."""]
why.ru = """Трёхзначная логика: условие бывает TRUE, FALSE и NULL, а WHERE пропускает только TRUE. Отсюда вечный баг «не равно» теряет строки с NULL, и он живёт месяцами, потому что ошибок нет. Привычка: каждый раз, когда в условии участвует столбец, который может быть NULL, спроси себя, что будет для NULL."""

[[exercises]]
name = "pgfun_q2"
kind = "question"
question.ru = """Что вернёт запрос?
```sql
SELECT (NULL OR false) AS a, NOT (NULL AND false) AS b
```"""
options.ru = ["NULL и true", "false и true", "NULL и NULL", "false и NULL"]
answer = [0]
explain.ru = """`NULL OR false` зависит от неизвестного значения, поэтому NULL. А `NULL AND false` всегда false (что бы ни скрывалось за NULL), и NOT от false это true. Правила трёхзначной логики: AND с false даёт false, OR с true даёт true, остальное остаётся неизвестным."""
hint.ru = """Спроси себя про каждое выражение: может ли неизвестное значение изменить результат?"""

[[exercises]]
name = "pgfun8"
style = "todo"
requires = ["postgres"]
hint.ru = """Вместо `<>` пиши `IS DISTINCT FROM`. Это обычный оператор сравнения, он ставится между двумя значениями."""
why.ru = """IS DISTINCT FROM убирает ветку `OR x IS NULL`, которую иначе приходится дописывать вручную к каждому «не равно». Минус: индекс по такому условию Postgres использует не всегда, так что на больших таблицах проверяй план (мы придём к нему в главе про индексы)."""

[[exercises]]
name = "pgfun_q3"
kind = "question"
question.ru = """Что вернёт запрос?
```sql
SELECT 1 NOT IN (2, NULL) AS r
```"""
options.ru = ["true", "false", "NULL", "ошибку"]
answer = [2]
explain.ru = """`1 NOT IN (2, NULL)` раскрывается в `1 <> 2 AND 1 <> NULL`. Первое true, второе NULL, а `true AND NULL` это NULL. В WHERE строка с таким условием пропадёт. Поэтому NOT IN с подзапросом, который может вернуть NULL, опасен, и вместо него берут NOT EXISTS (мы вернёмся к этому в главе про подзапросы)."""
hint.ru = """Раскрой NOT IN в цепочку `<>` через AND."""

[[exercises]]
name = "pgfun9"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Деление на ноль даёт ошибку, а деление на NULL даёт NULL. Как превратить 0 в NULL?""", """`NULLIF(views, 0)` вернёт NULL при views = 0. Подставь запасное значение до округления, чтобы ноль тоже получил три знака после запятой."""]
why.ru = """Деление на ноль в Postgres бросает ошибку и валит весь запрос, из-за одного странного поста в тысяче. NULLIF плюс COALESCE это стандартная защита. Но подумай, подходит ли 0 по смыслу: «нет просмотров» и «доля ноль» не одно и то же, иногда честнее оставить NULL и показать прочерк."""

[[exercises]]
name = "pgfun10"
style = "todo"
requires = ["postgres"]
hint.ru = """`DATE_TRUNC('month', столбец)`, `EXTRACT(поле FROM столбец)`; нужные поля называются dow и quarter. EXTRACT возвращает numeric, поэтому для integer нужно привести тип."""
why.ru = """now() в одной транзакции возвращает одно и то же время (момент начала транзакции), а clock_timestamp() каждый раз новое. DATE_TRUNC незаменим для группировки по дням и месяцам, в главе про агрегаты он пригодится. Есть isodow (понедельник это 1) и dow (воскресенье это 0): не перепутай."""

[[exercises]]
name = "pgfun11"
style = "todo"
requires = ["postgres"]
hint.ru = """Разность двух моментов времени это interval. Из интервала поле достаётся через `EXTRACT(day FROM интервал)`. Для «последних 24 часов» вычти интервал из now()."""
why.ru = """Сравнение `created_at > now() - interval '24 hours'` хорошо ложится на индекс по created_at, потому что столбец стоит один. Если перевернуть выражение и вычислять что-то над столбцом, индекс пропадёт (об этом в главе про индексы). Интервал в днях и интервал в сутках не одно и то же при переходе на летнее время, поэтому месяцы и дни в интервале Postgres хранит отдельно от часов."""

[[exercises]]
name = "pgfun_q5"
kind = "question"
question.ru = """Что на самом деле хранит столбец типа timestamptz?"""
options.ru = ["момент времени и название пояса клиента, записавшего строку", "один момент времени (внутри UTC), пояс нужен лишь при вводе и показе", "настенные часы без привязки к поясу, как есть", "строку с датой, как её ввёл клиент"]
answer = [1]
explain.ru = """Название timestamptz вводит в заблуждение: пояс не хранится. Postgres при записи переводит время в UTC, а при чтении переводит обратно в пояс сессии (параметр TimeZone). Хранить пояс пользователя нужно отдельным столбцом, если он тебе нужен (как tz в нашей таблице). Тип timestamp без пояса хранит настенные часы, и сравнивать моменты по нему нельзя."""
hint.ru = """Что получится, если два клиента из разных поясов прочитают одну и ту же строку?"""

[[exercises]]
name = "pgfun12"
style = "fix"
requires = ["postgres"]
hint.ru = ["""`created_at::date` берёт дату в часовом поясе сессии, у теста это UTC. Нужна дата в поясе пользователя, а он записан в столбце tz.""", """`created_at AT TIME ZONE tz` переводит момент в «настенное» время этого пояса. Результат приводи к date."""]
why.ru = """timestamptz хранит абсолютный момент (внутри это UTC), а вот timestamp без пояса хранит «настенные часы» без смысла. AT TIME ZONE превращает одно в другое в обе стороны: для timestamptz даёт настенное время пояса, для timestamp наоборот. Правило: храни моменты в timestamptz, пояс держи отдельно и применяй при показе. Дата без пояса для пользователя из другой страны бывает на сутки неверной."""

[[exercises]]
name = "pgfun_profile_card"
style = "scratch"
requires = ["postgres"]
quiz = true
hint.ru = ["""Каждый пункт повторяет умение из задач главы: пролистай их, если застрял.""", """Пункт 2: что делает сравнение даты с NULL, и в каком порядке стоят ветки? Пункт 3: пустая строка, пробелы и NULL должны дать один результат. Пункт 5: пояс лежит в столбце tz."""]
why.ru = """Пять полей карточки это пять разных способов дать ответ на вопрос «а что если значения нет». Именно так вычисляемые поля и живут в проде: в таблице хранится сырое, а красивое считается запросом. Если бы все пять прошли с первой попытки, часть про NULL и время ты усвоил."""
