[chapter]
title.en = "Postgres in production"
title.ru = "Postgres в эксплуатации"

[[chapter.visuals]]
file = "visuals/vacuum_horizon.html"
title.ru = "VACUUM и долгая транзакция: почему мёртвые версии не уходят"

[[exercises]]
name = "pgops1"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Всё, что нужно, лежит в системном представлении `pg_stat_activity`: по строке на соединение, со статусом (`state`), началом запроса и началом транзакции. Подумай, какое время честнее для «стоит давно»: у простаивающей транзакции запроса уже нет. И проверь на деле, что лежит во времени начала транзакции у сеанса после ошибки.""", """Фильтры: приложение по префиксу (`LIKE $1 || '%'`), своё соединение исключи через `pg_backend_pid()`. Статусов три, и один из них пишется длинно, со словом aborted в скобках. Возраст считай от `xact_start`: он есть и у активного запроса, и у простаивающей транзакции. У сеанса после ошибки это поле пусто, для него бери время последнего запроса (`coalesce`). Порог в секундах превращается в интервал через `make_interval(secs => $2)`."""]
why.ru = """`pg_stat_activity` это первое окно в живую базу. Для поиска виновников важен не только «что выполняется», но и «что открыто»: забытая транзакция не нагружает процессор, зато держит блокировки и снимок данных. Поэтому смотрят на `xact_start`, а не только на `query_start`. Статус `idle in transaction (aborted)` легко пропустить: транзакция уже сломалась, но соединение ждёт ROLLBACK и продолжает держать всё, что успело взять; к тому же у такого сеанса `xact_start` пуст, и условие по нему молча отбрасывает строку. Своё соединение исключают, иначе запрос находит сам себя. Порог всегда параметр: ночью и в час пик «долго» это разное."""

[[exercises]]
name = "pgops2"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Кто кого ждёт, база знает сама: для каждого pid есть функция, которая возвращает массив pid-ов, державших замок, который ему нужен. Массив придётся развернуть в строки. И подумай, какое из двух действий (отменить запрос или закрыть соединение) годится для виновника без запроса.""", """`pg_blocking_pids(pid)` возвращает `int[]`; в `FROM` разверни его через `LATERAL unnest(...)` и присоедини вторую копию `pg_stat_activity` по pid, чтобы получить имя приложения держателя. `unblock`: собери pid держателей (с `DISTINCT`, их может быть несколько) и вызови для каждого `pg_terminate_backend`."""]
why.ru = """`pg_blocking_pids` уже знает граф ожиданий, вручную разбирать `pg_locks` не нужно. Виновник чаще всего не активен, а сидит в открытой транзакции (`idle in transaction`) после того, как взял замок: ему нечего отменять, `pg_cancel_backend` не помогает, и нужен `pg_terminate_backend`. Это решение на грани: транзакция откатывается целиком, клиент получит ошибку соединения, поэтому закрывают только держателей и только по ограниченному кругу сеансов (префикс приложения), а не «все долгие». Лечить надо и причину: таймауты на роль (следующая задача)."""

[[exercises]]
name = "pgops_q1"
kind = "question"
question.ru = """Заказ завис: обработчик открыл транзакцию, обновил строку и пошёл по HTTP во внешний сервис, который не отвечает уже десять минут. Другие запросы выстроились за блокировкой этой строки. Дежурный выполняет `SELECT pg_cancel_backend(pid)` для зависшего соединения. Что произойдёт?"""
options.ru = ["Postgres закроет соединение, как при terminate", "Скорее всего ничего: у соединения нет выполняемого запроса (оно ждёт ответа приложения), отменять нечего; нужен `pg_terminate_backend` или таймаут `idle_in_transaction_session_timeout`", "Запрос отменится, транзакция откатится, замок снимется, очередь поедет", "Выполнится COMMIT вместо отмены"]
answer = [1]
explain.ru = """`pg_cancel_backend` посылает сигнал отмены текущему запросу, но не трогает транзакцию. Если соединение в статусе `idle in transaction`, выполняемого запроса нет, и сигнал ничего не делает; транзакция остаётся открытой и продолжает держать замки. Закрывает соединение и откатывает транзакцию `pg_terminate_backend`. Лучший вариант вообще не доводить до этого: `idle_in_transaction_session_timeout` на роли закрывает такие сеансы сам. И чинить надо код: не держать транзакцию открытой на время похода в сеть."""
hint.ru = """Что именно отменяет pg_cancel_backend: запрос или транзакцию?"""

[[exercises]]
name = "pgops3"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Настройки, которые подхватывает каждая новая сессия роли, хранятся рядом с самой ролью. В базе есть команда «изменить роль», умеющая выставлять параметры конфигурации. А чтобы роль могла зайти, у неё должны быть право входа и пароль.""", """`CREATE ROLE имя LOGIN PASSWORD '...'`, потом по команде `ALTER ROLE имя SET параметр = значение` на каждый параметр. Имя роли в кавычках на случай заглавных букв. Параметр распространяется на новые сессии: уже открытые остаются прежними."""]
why.ru = """Таймауты на роли это страховка, которая работает даже тогда, когда код приложения ошибся. `statement_timeout` обрывает запрос, который слишком долго работает (помнит, что транзакция при этом остаётся и её надо откатить). `idle_in_transaction_session_timeout` закрывает соединение, которое открыло транзакцию и замолчало, и снимает все её замки: это защита от затора, как в предыдущей задаче. Ставить их на роль, а не на всю базу, правильно: мигратору, отчётам и ручной работе нужны долгие запросы, и им таймаут от приложения не положен. Часто добавляют третий, `lock_timeout`, чтобы запрос не ждал замок вечно."""

[[exercises]]
name = "pgops_q2"
kind = "question"
question.ru = """Роль приложения получила `statement_timeout = '500ms'`. Миграция добавления индекса на таблицу в 200 миллионов строк идёт тридцать минут. Что будет, если запустить её от имени роли приложения?"""
options.ru = ["Создание индекса успеет, потому что таймаут считается только для SELECT", "Команда оборвётся через 500 мс с ошибкой, и индекс не появится: таймаут действует на любой запрос роли. Миграции поэтому идут от другой роли, у которой таких ограничений нет", "Всё хорошо: индекс строится в фоне и таймаут к нему не относится", "Postgres сам продлит таймаут для DDL"]
answer = [1]
explain.ru = """`statement_timeout` ограничивает время любой команды сеанса: SELECT, UPDATE, DDL. Поэтому ограничения на роли приложения и роль миграций должны быть разными, и миграции идут от владельца схемы или отдельной роли без таймаута (но с `lock_timeout`, как в главе про миграции). Заодно это причина, по которой приложение вообще не должно уметь создавать индексы."""
hint.ru = """К каким командам относится statement_timeout?"""

[[exercises]]
name = "pgops4"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Статистику по таблицам ведёт представление `pg_stat_user_tables`: есть живые строки и мёртвые версии. Процент считается от суммы. Подумай, что случится с делением на пустой таблице. Очистка бывает обычной и «полной», и последняя переписывает таблицу.""", """Процент: `100.0 * n_dead_tup / greatest(n_live_tup + n_dead_tup, 1)`, округлить и привести к целому. Таблицы текущей схемы: `schemaname = current_schema()`. Очистка без эксклюзивной блокировки это `VACUUM имя` (без слова FULL): читатели и писатели продолжают работать. Имя таблицы подставь в команду."""]
why.ru = """`UPDATE` в Postgres не меняет строку, а создаёт новую версию, старая остаётся, пока её не уберёт VACUUM. Если версий слишком много, таблица раздувается: больше страниц, медленнее сканирование, кэш забит мусором. Обычный `VACUUM` помечает место как свободное для новых версий и работает рядом с запросами (он берёт лишь лёгкую блокировку); он не возвращает место операционной системе. `VACUUM FULL` переписывает таблицу и ужимает файл, но держит эксклюзивную блокировку на всё время работы, поэтому в боевой нагрузке его избегают. В статистике деление на ноль возникает на пустых таблицах, и такие отчёты падают ровно ночью, когда их читают глазами."""

[[exercises]]
name = "pgops_q3"
kind = "question"
question.ru = """Таблица событий на сто миллионов строк. Autovacuum по умолчанию запускается, когда мёртвых версий становится больше 50 + 20% от числа строк. Часто обновляемая таблица оказывается раздутой, а autovacuum «будто не работает». Что реально происходит и что делать?"""
options.ru = ["Нужно запускать VACUUM FULL по cron каждую ночь", "Порог по умолчанию это двадцать миллионов мёртвых версий: до этого момента autovacuum не придёт. Для больших горячих таблиц порог снижают на самой таблице (`ALTER TABLE ... SET (autovacuum_vacuum_scale_factor = 0.01)`) вместо общих настроек", "Autovacuum сломан, его надо перезапустить", "Раздувание бывает только от долгих транзакций, порог ни при чём"]
answer = [1]
explain.ru = """Порог autovacuum складывается из постоянной части и доли от размера таблицы. Для маленьких таблиц это разумно, для огромных доля превращается в десятки миллионов мёртвых версий, и очистка приходит поздно и сразу много работает. Лечат настройкой на уровне таблицы: уменьшают долю до процента или меньше, так autovacuum приходит чаще и делает меньше за раз. `VACUUM FULL` по расписанию не лечение, а блокировка таблицы каждую ночь. Долгие транзакции (следующая задача) тоже мешают, но это другая причина."""
hint.ru = """От чего зависит момент запуска autovacuum для конкретной таблицы?"""

[[exercises]]
name = "pgops5"
style = "todo"
requires = ["postgres"]
hint.ru = ["""VACUUM убирает версию, только если она не нужна никому из живых транзакций. Какие поля `pg_stat_activity` говорят, что транзакции что-то нужно? Одно про снимок, другое про выданный номер транзакции. А что у сеанса, который начал транзакцию и выполнил запрос в режиме read committed?""", """Держит горизонт сеанс, у которого `backend_xmin` или `backend_xid` не NULL. Простаивающая read committed транзакция после своего запроса снимок уже отпустила, поэтому у неё оба поля пусты, хотя она старше. Свой сеанс исключи через `pg_backend_pid()`, а закрывающий запрос повтори с тем же условием."""]
why.ru = """VACUUM может убрать версию строки, только если она невидима всем: каждой текущей транзакции и любому снимку. Самый старый снимок среди всех сеансов и называется «горизонтом». Поэтому один забытый сеанс с repeatable read (отчёт, который открыл транзакцию и ушёл на обед) останавливает очистку во всей базе, и раздувание растёт, сколько бы раз ни запускали VACUUM. Старая транзакция не обязательно виновна: read committed отпускает снимок после каждого запроса, и «простаивать в транзакции» без снимка безопасно для очистки (хотя и вредно для замков). Выбрасывают сеансы по признаку `backend_xmin`/`backend_xid`, а не просто по возрасту."""

[[exercises]]
name = "pgops_q4"
kind = "question"
question.ru = """Бухгалтерия запускает отчёт в одной длинной транзакции (repeatable read) на два часа. За это время таблица `orders`, на которую отчёт не смотрит вообще, раздулась вдвое, хотя autovacuum отрабатывал. Почему?"""
options.ru = ["Отчёт копирует orders целиком в свою транзакцию", "Горизонт очистки общий на всю базу: снимок отчёта старше обновлений orders, и версии, видимые этому снимку (как считает Postgres), убрать нельзя, даже если отчёт их никогда не прочтёт", "Autovacuum отключается на время любых отчётов", "Отчёт блокирует таблицу orders, и autovacuum не может к ней подойти"]
answer = [1]
explain.ru = """Postgres не знает заранее, какие таблицы прочитает транзакция, поэтому снимок защищает версии строк во всей базе. VACUUM смотрит на самый старый снимок и не убирает версии, которые мог бы увидеть он. Отчёты, которые долго живут, выносят на реплику, режут на короткие транзакции или читают в read committed, а на роли отчётов ставят `idle_in_transaction_session_timeout` и разумный `statement_timeout`."""
hint.ru = """Есть ли у горизонта очистки понятие «таблица»?"""

[[exercises]]
name = "pgops6"
style = "fix"
requires = ["postgres"]
hint.ru = ["""Обновление строки может обойтись без записи в индексы, только если не изменился ни один проиндексированный столбец и новая версия помещается в ту же страницу. Что из этого не выполняется сейчас? Свободное место в страницах задаётся при создании или перезаписи таблицы, а не когда-нибудь потом.""", """Счётчик лучше вынести из «толстой» строки поста в узкую таблицу, в которой единственный индекс это первичный ключ, а он не меняется. У этой таблицы в `WITH (...)` поставь коэффициент заполнения заметно меньше 100, а данные перелей при создании: изменение параметра существующей таблицы не перепишет уже заполненные страницы.""", """Старый индекс по `likes` и сам столбец в посте больше не нужны: сначала перенеси данные, потом убери их. В `bump` и `top` поменяются таблица и названия столбцов."""]
why.ru = """HOT-обновление (heap-only tuple) дёшево: новая версия лежит на той же странице, индексы не трогаются, старая версия потом убирается прямо при чтении страницы, без отдельного vacuum. Для этого нужны два условия, и оба решаются на уровне схемы: у обновляемого столбца не должно быть индекса, на странице должно оставаться место (`fillfactor` меньше 100 оставляет запас, но действует только на новые страницы, поэтому таблицу перекладывают). Горячие счётчики поэтому выносят в узкую таблицу без лишних индексов. Рейтинг по такому счётчику можно строить запросом на лету или периодически собирать материализованным представлением: индекс на горячий столбец убил бы всё преимущество."""

[[exercises]]
name = "pgops7"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Размеры берутся из функций `pg_*_size`, а статистика использования из `pg_stat_user_indexes`. Разные «размеры» отличаются тем, что они включают: у таблицы есть основной файл, TOAST, карты свободного места. А что в `pg_index` отличает индексы, которые нужны для целостности?""", """Размер таблицы с TOAST: `pg_table_size(relid)`, всех индексов: `pg_indexes_size(relid)`, общий: `pg_total_relation_size(relid)`. Для индексов присоединись к `pg_index` по `indexrelid` и отсей `indisunique` и `indisprimary`; первичный ключ уникален, так что достаточно первого признака, но явное условие читается лучше."""]
why.ru = """Размер и использование это два разных вопроса, и ответить на них надо вместе: большой неиспользуемый индекс это чистый убыток, он съедает место, время записи (его обновляют на каждую вставку) и кэш. Но «ни разу не читали» не равно «не нужен»: уникальный индекс работает при каждой вставке, проверяя ограничение, даже если по нему никто не ищет. Счётчик `idx_scan` копится с последнего сброса статистики и обнуляется после перезапуска сервера или `pg_stat_reset`, поэтому решение об удалении принимают по данным за срок, покрывающий месячные и квартальные отчёты, а не по свежему сбросу."""

[[exercises]]
name = "pgops8"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Права в Postgres выдаются слоями: на схему (можно ли в неё заходить), на таблицы (что делать с данными), на счётчики (без них не работает `bigserial`) и «по умолчанию» на объекты, которые появятся позже. Подумай, что из этого забудет выдать человек, у которого «всё работало».""", """Заходить в схему: `GRANT USAGE ON SCHEMA`. Данные: `GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA` (не `ALL PRIVILEGES`: туда входит TRUNCATE). Счётчики: `GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA`. Будущие объекты: `ALTER DEFAULT PRIVILEGES IN SCHEMA ... GRANT ... ON TABLES` и то же для `SEQUENCES`.""", """Не выдавай `CREATE` на схему и не делай роль владельцем таблиц: DDL должен остаться за владельцем."""]
why.ru = """Минимальные права это страховка от собственных ошибок: баг, подмена запроса или украденный пароль могут сделать только то, что может роль. Роль без `CREATE` не создаст таблицу, без владения не удалит и не изменит её, без `TRUNCATE` не очистит. Три места, где права забывают: счётчики (`bigserial` падает на вставке с «permission denied for sequence»), `ALL PRIVILEGES` вместо перечня и будущие таблицы: `GRANT ... ON ALL TABLES` действует только на существующие, а новую миграцию, добавившую таблицу, сервис встречает ошибкой. Поэтому `ALTER DEFAULT PRIVILEGES` пишут рядом с обычными выдачами и для таблиц, и для счётчиков."""

[[exercises]]
name = "pgops9"
style = "bughunt"
requires = ["postgres"]
hint.ru = ["""Задание очистки сделало ровно то, что ему сказали, и сделало это потому, что соединение разрешило. Права определяет не код, а то, кто подключился. Посмотри, под каким именем сейчас открывается пул.""", """У `PgConnectOptions` есть методы `username` и `password`. Параметры владельца нужны для остального (адрес, база, параметры сессии), а имя и пароль меняются на данные роли приложения. Метод принимает значение, поэтому сначала клонируй параметры."""]
why.ru = """Код ошибается: опечатка в имени, забытое условие, неудачный рефакторинг. Права позволяют ограничить цену такой ошибки. Сервис, подключённый владельцем, может всё: удалить таблицу, очистить базу, выдать себе новые права. Сервис, подключённый ролью приложения, может только читать и писать данные, и тот же баг превращается из катастрофы в строку в логе. Владелец схемы остаётся у миграций и ручных работ. Хорошо также разделять роли по сервисам (у сервиса уведомлений нет доступа к таблице платежей): тогда и взлом одного сервиса не открывает всю базу."""

[[exercises]]
name = "pgops_q5"
kind = "question"
question.ru = """В кластере 40 экземпляров сервиса, у каждого пул из 25 соединений, а `max_connections` в Postgres равен 200. При масштабировании до 60 экземпляров сервис начинает падать с «too many clients already». Что разумнее сделать?"""
options.ru = ["Увеличить `statement_timeout`", "Поставить между сервисами и базой пулер соединений (например, PgBouncer) и уменьшить размер пулов: каждое соединение это отдельный процесс сервера с собственной памятью, и тысячи активных соединений замедляют базу", "Закрывать соединение после каждого запроса и открывать заново", "Поднять `max_connections` до 5000: соединения ведь дёшевы"]
answer = [1]
explain.ru = """Каждое соединение в Postgres это процесс с собственной памятью (десятки мегабайт при работе), а число одновременно активных запросов ограничено ядрами. Полторы тысячи соединений в простое занимают память и усложняют работу планировщика и снимков, но не дают больше пропускной способности. Лечат пулером: тысячи клиентских соединений мультиплексируются на небольшое число серверных. Цена: в режиме «соединение на транзакцию» нельзя полагаться на состояние сессии: `SET`, сессионные advisory-замки, подготовленные запросы без поддержки пулера."""
hint.ru = """Что в базе стоит за одним соединением и сколько запросов реально выполняется одновременно?"""

[[exercises]]
name = "pgops_incident"
kind = "project"
style = "scratch"
quiz = true
requires = ["postgres"]
locked = ["tests/acceptance.rs"]
hint.ru = ["""Начни с `diagnose`: четыре списка из `pg_stat_activity` с одним и тем же фильтром по префиксу и без своего pid. Ждущих и держателей даёт `pg_blocking_pids`; держатели горизонта это простаивающие в транзакции с непустым `backend_xmin` или `backend_xid`.""", """`resolve` закрывает тех, кого назвала диагностика (держателей замков и держателей горизонта): удобно сделать один запрос с `pg_terminate_backend` и вернуть имена. `vacuum_bloated`: список таблиц из `pg_stat_user_tables` с защитой от деления на ноль, потом по `VACUUM` на таблицу (команда не работает в транзакции и в многокомандной строке).""", """`harden_role`: текущая схема узнаётся запросом `SELECT current_schema()`, дальше та же последовательность, что в задачах про таймауты и права: роль с входом, два ограничения, право на схему, права на таблицы и счётчики, права по умолчанию на будущее."""]
why.ru = """Проект собирает вместе то, что в главе было отдельными приёмами: диагностика по `pg_stat_activity`, различие между держателем замка и держателем горизонта, выборочное закрытие сеансов, очистка мусора, который накопил затор, и укрепление роли, чтобы такое не повторилось. Ловушки в сочетаниях: закрывать нужно держателей, а не ждущих (иначе страдают невиновные), и не любые простаивающие сеансы, а только те, что держат снимок или номер транзакции; очистка бессильна, пока горизонт держит старая транзакция, поэтому порядок шагов обязателен; пустые таблицы в статистике ломают деление, а `VACUUM` нельзя выполнить внутри транзакции. Тесты проверяют живых участников инцидента, а не результат запроса на готовых данных."""

