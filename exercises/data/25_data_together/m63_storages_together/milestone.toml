test_command = ["cargo", "make", "check"]
requires = ["postgres", "scylla", "redis", "nats"]
hint.ru = [
"""Захват outbox одной командой: `UPDATE outbox SET claimed_by = $2, claimed_until = now() + срок WHERE seq IN (SELECT
... ORDER BY seq LIMIT $1 FOR UPDATE SKIP LOCKED) RETURNING ...`. Свободны строки без захвата, с истёкшим захватом или
своим.""",
"""Порядок по агрегату: строку можно взять, только если нет более ранней неопубликованной строки того же агрегата
(`NOT EXISTS`). Тогда второе событие поста не уйдёт, пока не опубликовано первое, даже другим релеем.""",
"""Будильник: триггер `AFTER INSERT ... EXECUTE FUNCTION` с `pg_notify('outbox_' || current_schema(), '')`, а
релей держит `PgListener` на этом канале и дёргает `Notify`. Опрос по таймеру не убирай: соединение слушателя может
оборваться.""",
"""Inbox: `INSERT INTO inbox (key) ... ON CONFLICT DO NOTHING` первой командой транзакции; ноль строк значит «уже было»,
и эффект не применяется. Ключ это id события и получатель.""",
]
story.ru = """Соцсеть работает целиком на настоящих хранилищах: события уходят без дублей и по порядку из любого
экземпляра, потребители не применяют их дважды, ленты живут в Scylla с кэшем в Redis, а счётчики сверяются с
данными."""
