[chapter]
title.en = "Storages together"
title.ru = "Хранилища вместе"

[[chapter.visuals]]
file = "visuals/outbox_relay.html"
title.ru = "Outbox, relay и потребители"

[[exercises]]
name = "dint1"
style = "fix"
requires = ["postgres"]
hint.ru = ["""В какой момент пост становится настоящим? Что знают подписчики, если событие ушло раньше?""", """Событие о факте можно отправлять только после того, как факт зафиксирован, то есть после коммита. Перенеси публикацию."""]
why.ru = """Публикация до коммита рассказывает о том, чего может не случиться. Публикация после коммита честнее, но у неё своя дыра: если процесс упадёт между коммитом и публикацией, событие потеряется, а пост останется. Две системы (база и брокер) нельзя обновить атомарно, и следующая задача решает это outbox-ом: событие пишется в базу в той же транзакции, что и пост."""

[[exercises]]
name = "dint2"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Как сделать так, чтобы запись поста и запись события либо обе случились, либо обе нет?""", """Обе вставки внутри одной транзакции: `db.begin()`, два `execute(&mut *tx)`, `commit`. JSON для jsonb передаётся через `bind(json!(...))`.""", """Порядок вставок в транзакции не важен: при ошибке откатится всё."""]
why.ru = """Outbox превращает «записать в базу и отправить в брокер» в одну локальную транзакцию: событие это просто строка рядом с постом. Отправку берёт на себя relay, который читает неотправленные строки и публикует их, пока не получится. Брокер может лежать хоть час: события не теряются, а копятся. Цена: задержка доставки и гарантия «хотя бы один раз», поэтому потребители должны уметь пропускать дубли (inbox дальше в главе)."""

[[exercises]]
name = "dint3"
style = "fix"
requires = ["postgres"]
hint.ru = ["""Что видит второй relay, пока первый ещё не отметил свою пачку? И что отмечается, если публикация упала?""", """`SELECT ... FOR UPDATE SKIP LOCKED` внутри транзакции блокирует выбранные строки, а другой relay их просто пропускает. Отмечай отправленными только те id, публикация которых удалась, и останавливайся на первой ошибке, чтобы не нарушить порядок.""", """Всё внутри `db.begin()`: SELECT с `FOR UPDATE SKIP LOCKED`, публикация с `break` на ошибке, UPDATE только по удачным, `commit`."""]
why.ru = """SKIP LOCKED превращает таблицу в очередь для нескольких воркеров: каждый забирает свою пачку, и блокировки не держат остальных. Транзакция relay держит блокировку, пока пачка публикуется, а если relay упадёт, транзакция откатится, и строки снова станут доступны. Отмечать отправленным только опубликованное это суть outbox: событие считается доставленным, когда брокер его принял. Повтор возможен (опубликовали, но не успели отметить), поэтому доставка «хотя бы один раз»."""

[[exercises]]
name = "dint4"
style = "fix"
requires = ["postgres"]
hint.ru = ["""Почему SKIP LOCKED позволяет второму relay обогнать первого на событиях одного поста?""", """Строка события 1 заблокирована первым relay, но она всё ещё неотправленная. Второй relay должен пропускать событие, если у того же агрегата есть более раннее неотправленное событие, даже если оно занято.""", """Добавь в WHERE `NOT EXISTS (SELECT 1 FROM outbox e WHERE e.aggregate_id = o.aggregate_id AND e.sent_at IS NULL AND e.id < o.id)`."""]
why.ru = """Параллельные relay ускоряют доставку, но порядок нужен внутри агрегата (поста), а не глобально. Условие «нет более раннего неотправленного события этого агрегата» превращает очередь в набор очередей по агрегатам: разные посты идут параллельно, события одного поста строго по одному. Другие способы: распределять агрегаты по relay хешем (как партиции в Kafka) или брать advisory lock по id агрегата."""

[[exercises]]
name = "dint5"
style = "fix"
requires = ["postgres"]
hint.ru = ["""Кто должен разбудить relay и когда? Что relay делает, пока ждёт?""", """В транзакции поста вызови `SELECT pg_notify($1, '')` с именем канала: уведомление уйдёт слушателям после коммита. Relay ждёт `listener.recv()` под `tokio::time::timeout(poll, ...)`: уведомление это true, истёк срок это false.""", """`timeout(poll, listener.recv())`: `Ok(Ok(_))` это true, `Err(_)` (истёк срок) это false."""]
why.ru = """LISTEN и NOTIFY убирают задержку опроса почти бесплатно: уведомление доставляется только после коммита, поэтому relay просыпается ровно тогда, когда событие уже видно. Опрос остаётся страховкой: уведомления не хранятся, и если слушатель переподключался в момент NOTIFY, он его пропустит. Поэтому relay просыпается от уведомления или по таймеру, и в любом случае читает outbox целиком."""

[[exercises]]
name = "dint6"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Как узнать, что событие уже обработано, и сделать проверку и эффект неразделимыми?""", """В одной транзакции: `INSERT INTO inbox (event_id) VALUES ($1) ON CONFLICT DO NOTHING`. Если вставилась одна строка, событие новое, применяй эффект и коммить. Если ноль, откатывай и возвращай false. Одновременные дубли упрутся в уникальный ключ: второй дождётся первого и увидит конфликт.""", """`rows_affected() == 1` после вставки в inbox."""]
why.ru = """Inbox это зеркало outbox на стороне потребителя: «хотя бы один раз» плюс дедупликация дают «эффект ровно один раз». Ключевое слово: та же транзакция. Если отметить событие отдельно от эффекта, сбой между ними даст либо потерю, либо дубль. Уникальный ключ на event_id решает и гонку одновременных дублей: вторая вставка ждёт первую транзакцию и после её коммита получает конфликт. Таблицу inbox периодически чистят от старых записей, когда повтор уже невозможен."""

[[exercises]]
name = "dint7"
style = "todo"
requires = ["scylla"]
hint.ru = ["""Кто в Scylla решает, какая из двух записей одной строки победит? Чем можно повлиять на это решение?""", """Побеждает запись с большей меткой времени, а метку можно задать в запросе: `USING TIMESTAMP ?` у INSERT и у DELETE (у DELETE он стоит после имени таблицы).""", """`INSERT ... VALUES (?, ?, ?) USING TIMESTAMP ?` и `DELETE FROM feed USING TIMESTAMP ? WHERE ...`, версия события параметром."""]
why.ru = """Проекция, которая берёт версию события как метку времени записи, становится нечувствительной к порядку и повторам: запоздавшее старое событие проигрывает новому, повтор перезаписывает тем же. Это заметно проще, чем хранить «последнюю применённую версию» и сравнивать её в коде. Условие одно: версия должна расти вместе с событиями агрегата (время события или номер, умноженный в микросекунды), и метки не должны уходить в будущее больше, чем разрешает Scylla."""

[[exercises]]
name = "dint8"
style = "todo"
requires = ["redis"]
hint.ru = ["""Где хранить версию, с которой сравнивать, и почему сравнение и запись должны быть одним шагом?""", """Хеш `<ns>:profile:<id>` с полями version и data. Скрипт: прочитать version (нет значит -1), если новая не больше, вернуть 0, иначе HSET обоих полей, EXPIRE и вернуть 1.""", """Вызов `EVAL script 1 key version data`."""]
why.ru = """Версионированный кэш делает обновления по событиям безопасными при любом порядке доставки: старая версия просто не проходит проверку. Проверка и запись в одном скрипте закрывают гонку двух потребителей с разными версиями. Альтернатива проще: по событию не обновлять кэш, а удалять ключ, тогда порядок неважен вовсе, но следующий читатель пойдёт в базу."""

[[exercises]]
name = "dint9"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Как посчитать лайки для каждого поста, включая посты без лайков? Как обновить только расходящиеся?""", """Подзапрос: посты LEFT JOIN likes с `count(l.post_id)` по посту (для поста без лайков это 0). UPDATE ... FROM подзапроса с условием, что счётчик отличается, и `RETURNING p.id`.""", """`UPDATE posts p SET likes_count = c.n FROM (...) c WHERE c.id = p.id AND p.likes_count <> c.n RETURNING p.id`."""]
why.ru = """Денормализованные счётчики и проекции однажды разойдутся с источником правды: баг, ручная правка, сбой посередине. Сверка это периодическая задача, которая пересчитывает из источника и чинит только расхождения, а их число попадает в метрики: если оно растёт, где-то сломан конвейер. LEFT JOIN нужен ради постов без лайков: внутреннее соединение их потеряет, и неверный счётчик у них останется навсегда."""

[[exercises]]
name = "dint_q1"
kind = "question"
question.ru = """Сервис пишет пост в Postgres, коммитит и затем публикует событие в NATS. Что может пойти не так?"""
options.ru = ["""Ничего, порядок правильный""", """Процесс упадёт между коммитом и публикацией, и событие потеряется навсегда, хотя пост есть""", """Событие придёт раньше поста""", """NATS отклонит событие без транзакции"""]
answer = [1]
explain.ru = """Две системы нельзя обновить атомарно. Outbox превращает публикацию в строку той же транзакции, а отправку делает отдельный relay, повторяя до успеха."""
hint.ru = """Что, если между двумя шагами выдернуть питание?"""

[[exercises]]
name = "dint_q2"
kind = "question"
question.ru = """Relay публикует событие и затем отмечает его отправленным. Брокер принял событие, а relay упал до отметки. Что будет?"""
options.ru = ["""Событие потеряется""", """После перезапуска relay опубликует его ещё раз: доставка «хотя бы один раз», потребители должны пропускать дубли""", """Брокер вернёт событие обратно""", """Postgres откатит публикацию"""]
answer = [1]
explain.ru = """Отметка и публикация в разных системах, поэтому сбой между ними даёт повтор. Защищаются на стороне потребителя: inbox или идемпотентный эффект."""
hint.ru = """Узнает ли relay после перезапуска, что брокер уже принял событие?"""

[[exercises]]
name = "dint_q3"
kind = "question"
question.ru = """Три relay с `FOR UPDATE SKIP LOCKED` без дополнительных условий. События поста 5: «создан», «изменён», «удалён». Что гарантировано?"""
options.ru = ["""Порядок событий поста 5 сохранится""", """Каждое событие уйдёт один раз, но порядок событий одного поста может нарушиться""", """События уйдут дважды""", """Relay будут ждать друг друга"""]
answer = [1]
explain.ru = """SKIP LOCKED делит строки между relay, но второй relay может взять следующее событие поста, пока первое ещё публикуется. Порядок внутри агрегата держат отдельным условием или распределением агрегатов по relay."""
hint.ru = """Что делает второй relay с заблокированной строкой?"""

[[exercises]]
name = "dint_q4"
kind = "question"
question.ru = """Потребитель делает эффект (UPDATE счётчика), коммитит, а затем отдельным запросом записывает id события в inbox. Чем это плохо?"""
options.ru = ["""Ничем""", """Сбой между коммитом эффекта и записью в inbox: при повторной доставке эффект применится второй раз""", """Inbox станет больше""", """Потеряется эффект"""]
answer = [1]
explain.ru = """Отметка об обработке и эффект должны быть одной транзакцией, иначе между ними остаётся окно для дубля. Это та же логика, что у outbox, только на стороне потребителя."""
hint.ru = """Что известно системе после сбоя между двумя коммитами?"""

[[exercises]]
name = "dint_q5"
kind = "question"
question.ru = """Зачем периодическая сверка, если outbox, inbox и проекции написаны правильно?"""
options.ru = ["""Не нужна вовсе""", """Чтобы находить и чинить расхождения, которые всё равно появятся: баги, ручные правки, частичные сбои; число исправлений это метрика здоровья конвейера""", """Чтобы ускорить чтение""", """Чтобы заменить outbox"""]
answer = [1]
explain.ru = """Производные данные однажды разойдутся с источником правды. Сверка пересчитывает из источника и чинит, а растущее число исправлений сигналит, что где-то сломан конвейер."""
hint.ru = """Что случится с ошибкой проекции, если её никто не проверяет?"""

[[exercises]]
name = "dint_consistency_audit"
style = "bughunt"
requires = ["postgres"]
quiz = true
hint.ru = ["""Пройди по тестам: каждый называет один сбой. Для каждого спроси, какие две записи должны случиться вместе и что будет, если процесс упадёт между ними.""", """create_post: пост и событие одной транзакцией. relay_one: публикация до отметки, отметка только после удачной публикации, строки берутся с FOR UPDATE SKIP LOCKED внутри транзакции, и событие агрегата не берётся, пока есть более раннее неотправленное. handle_like: inbox и эффект одной транзакцией.""", """Не забывай явный rollback на ранних выходах из транзакции: иначе соединение останется висеть в транзакции и держать блокировки."""]
why.ru = """Все четыре ошибки одного рода: две записи, которые должны случиться вместе, разнесены по разным транзакциям или системам, и сбой между ними оставляет мир в состоянии, которого не должно быть. Outbox, отметка после публикации, SKIP LOCKED с порядком по агрегату и inbox закрывают каждый свой стык. Аудит чужого конвейера это ровно этот вопрос к каждой паре записей: что если упасть посередине."""

[[exercises]]
name = "dint_post_pipeline"
kind = "project"
style = "todo"
requires = ["postgres", "scylla"]
locked = ["tests/pipeline.rs"]
hint.ru = [
  """Каждый метод это задача главы: outbox (dint2), relay с SKIP LOCKED и порядком по агрегату (dint3, dint4), inbox (dint6), проекция с USING TIMESTAMP (dint7).""",
  """В `consume` порядок такой: транзакция Postgres, вставка в inbox с ON CONFLICT DO NOTHING (ноль строк значит дубль, откат и false), подписчики автора из follows, записи в Scylla, и только потом commit. Тогда сбой Scylla откатит отметку, и событие обработается при повторе.""",
  """Версию и автора бери из payload через `Value::get` и `as_i64`; запись в Scylla `INSERT ... USING TIMESTAMP ?`, удаление `DELETE FROM ... USING TIMESTAMP ? WHERE ...`. Ранние выходы из транзакции завершай явным rollback.""",
]
why.ru = """Проект собирает главу в один конвейер, где каждая деталь закрывает свой сбой: outbox не даёт событию потеряться или появиться без поста, SKIP LOCKED и условие по агрегату дают параллельные relay без дублей и с порядком, inbox превращает повторную доставку в одну обработку, а метка времени версии делает ленту нечувствительной к порядку. Отметка в inbox коммитится после записи в Scylla: если упасть между ними, событие просто обработается ещё раз, а запись в Scylla идемпотентна."""

[[exercises]]
name = "m63_storages_together"
kind = "milestone"
journey = "backend"
quiz = true
