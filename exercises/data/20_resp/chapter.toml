[chapter]
title.en = "The RESP protocol"
title.ru = "Протокол RESP"

[[chapter.visuals]]
file = "visuals/resp_wire.html"
title.ru = "RESP: команда превращается в байты, ответ приходит кусками"

[[exercises]]
name = "resp1"
style = "todo"
hint.ru = ["""Ответ состоит из байтов, и у каждого вида свой первый байт. А что в протоколе означает перевод строки? Тогда что нельзя пускать внутрь текста?""", """Первые байты: `+` для статуса, `-` для ошибки, `:` для числа. Каждый кадр кончается парой `\\r\\n`. Если в тексте уже есть `\\r` или `\\n`, кадр закодировать нельзя: верни `None`."""]
why.ru = """Простые типы RESP держатся на одном правиле: строка кончается на CRLF, и больше нигде CRLF в строке быть не может. Поэтому кодировщик обязан отказать, а не промолчать: статус с переводом строки внутри превращается в два кадра, и клиент получит ответ, которого сервер не посылал. Для произвольного текста существует bulk string, о ней следующая задача. Число идёт десятичным текстом, а не байтами: так проще читать трафик глазами и нет вопросов про порядок байтов."""

[[exercises]]
name = "resp2"
style = "todo"
hint.ru = ["""Что в заголовке: сколько символов в значении или сколько байтов? И чем кадр пустого значения отличается от кадра отсутствующего?""", """Заголовок: `$`, длина в байтах (`len()` у среза, а не число символов), CRLF. Потом ровно столько байтов и снова CRLF. Для отсутствия значения длина `-1`, и тела с хвостом нет совсем."""]
why.ru = """Bulk string отличается от простой строки тем, что граница значения задана длиной, а не символом. Поэтому внутри могут лежать любые байты: нули, CRLF, чужие кодировки. Две вещи, на которых ошибаются: длина считается в байтах (а не в символах), и отсутствие значения не равно пустому значению (`$-1` против `$0`). Первое ломает всё, что не ASCII, второе превращает «ключа нет» в «ключ есть, но пустой»."""

[[exercises]]
name = "resp_q1"
kind = "question"
question.ru = """Клиент отправляет команду `SET имя Мария` (аргументы в UTF-8, русские буквы занимают по два байта). Какой заголовок будет у последнего аргумента, `Мария`?"""
options.ru = ["$5", "$10", "$6", "Зависит от кодировки, о которой клиент договорился с сервером"]
answer = [1]
explain.ru = """Длина в bulk string это число байтов, а у «Мария» пять букв по два байта: десять. RESP ничего не знает про кодировки, для него значение это просто байты, и никакого согласования кодировки нет. Клиент, который отправил `$5`, получит от сервера ожидание ещё пяти байтов и склеит остаток с началом следующей команды."""
hint.ru = """Сколько байтов занимает одна русская буква в UTF-8?"""

[[exercises]]
name = "resp3"
style = "todo"
hint.ru = ["""Массив начинается с числа элементов, потом идут сами элементы подряд, без разделителей. Что из этого уже умеет `bulk`?""", """`array`: `*`, число элементов, CRLF и склеенные элементы. `null_array`: тот же заголовок с `-1`. `command`: каждое слово заверни в `bulk`, а потом собери массив."""]
why.ru = """Команда клиента и ответ сервера на `LRANGE` имеют одну форму: массив. Единственное отличие в том, что команда всегда массив bulk-строк, даже если слово выглядит как число (`10`, `EX`, `-1`). Так сервер читает аргументы одним правилом и не гадает, где число, а где текст. Пустой массив и отсутствующий массив разные кадры: `LRANGE` по несуществующему ключу вернёт `*0`, а блокирующая команда, у которой вышло время, вернёт `*-1`."""

[[exercises]]
name = "resp4"
style = "todo"
hint.ru = ["""Начни с того, что у каждого кадра есть первая строка до CRLF. По её первому байту видно, какого он вида.""", """Строку после типа разбирай по виду: `+` и `-` это текст, `:` число. У `$` в строке длина, и тело берётся по этой длине, а не до следующего CRLF. Использованные байты: конец строки, длина тела и завершающий CRLF."""]
why.ru = """Разбор в RESP всегда начинается одинаково: строка до CRLF и по первому байту решение, что делать дальше. Для чисел, статусов и ошибок строка и есть всё содержимое, а у bulk string в строке только длина, и тело берут по ней. Возврат количества использованных байтов это не мелочь: в сокете ответы идут подряд, и без него невозможно продолжить с места, где закончился предыдущий."""

[[exercises]]
name = "resp5"
style = "scratch"
hint.ru = ["""Что должно быть истинно про буфер, если кадр неполный? Значит, пока кадр не определён целиком, из буфера ничего нельзя убирать.""", """Удобно разделить работу: функция смотрит на `&[u8]` и возвращает значение вместе с числом использованных байтов (или `None`, если данных мало), а `decode` только вызывает её и после успеха делает `advance`. Тело bulk готово, когда в буфере есть заголовок, `длина` байтов и ещё два байта CRLF."""]
why.ru = """Главная идея: сначала понять, целый ли кадр, и только потом трогать буфер. Если разбор по ходу выбрасывает заголовок, а тело ещё не пришло, при следующем вызове заголовка уже нет, и разбор ломается. Разделение на чистую функцию «разбери без изменений» и тонкую обёртку с `advance` делает это очевидным и легко проверяется на любых разрезах. Тест с разрезами в случайных местах нужен потому, что ошибки такого парсера прячутся в одном-двух положениях разреза (посередине CRLF, ровно на границе кадра)."""

[[exercises]]
name = "resp_q2"
kind = "question"
question.ru = """Парсер получил из сокета ровно `$6\\r\\nпри` (кириллица в UTF-8, «при» это шесть байтов), и больше данных пока нет. Что он должен сделать?"""
options.ru = ["Вернуть значение «при»: тело той длины, что объявлена, уже на месте", "Вернуть ошибку: кадр обрывается без CRLF", "Подождать: после тела должны прийти ещё два байта CRLF, кадр не завершён", "Выбросить заголовок и ждать, пока придёт тело"]
answer = [2]
explain.ru = """Кадр bulk string заканчивается CRLF после тела. Пока этих двух байтов нет, кадр неполный. Если вернуть значение раньше, `\\r\\n` потом придёт как начало «следующего кадра» и испортит разбор всех ответов после этого. Ошибки тут нет: данные просто ещё не пришли. Выбрасывать заголовок нельзя, иначе при следующем вызове нечем будет объяснить, что за тело идёт."""
hint.ru = """Сколько байтов должно лежать в буфере, чтобы кадр был готов: считай и заголовок, и тело, и хвост."""

[[exercises]]
name = "resp6"
style = "bughunt"
hint.ru = ["""Сломана не обработка ошибок и не числа. Попробуй прогнать тест со значением, в котором есть перевод строки, и посмотри, где парсер заканчивает чтение значения.""", """Парсер читает заголовок `$N`, но число `N` потом нигде не используется для чтения тела: тело он ищет как следующую строку. Тело это ровно `N` байтов после заголовка, а за ними обязательный CRLF; пока их нет, кадр неполный."""]
why.ru = """Любой парсер, который ищет CRLF «на всякий случай» везде, работает на текстовых данных и ломается на первом значении с переводом строки. Это не экзотика: сообщения, многострочные профили, сериализованный JSON с `\\r\\n`, двоичные картинки. Длина в заголовке нужна именно для этого: она единственный источник истины о границе значения. Внутри значения парсер вообще не должен смотреть на содержимое."""

[[exercises]]
name = "resp7"
style = "todo"
hint.ru = ["""Массив состоит из значений того же вида, что и всё остальное. Значит, функция, которая читает значение, вызывается ещё раз внутри себя.""", """Читай элементы по очереди с того места, где закончился предыдущий, и храни только позицию. В `decode` вызов `advance` стоит после всего разбора. Не хватило данных на любом элементе: весь массив ещё не готов."""]
why.ru = """Рекурсия работает только потому, что разбор отделён от продвижения буфера: вложенные вызовы возвращают позицию, а `advance` делается один раз снаружи, когда известно, что весь массив на месте. Если бы каждый вложенный элемент съедал свои байты сам, то на нехватке данных в третьем элементе первые два уже пропали бы. Отсутствующий массив и пустой снова разные значения, и клиент, который их путает, считает «таймаут блокирующей команды» пустым списком."""

[[exercises]]
name = "resp_q3"
kind = "question"
question.ru = """Парсер массивов получает `*3\\r\\n:1\\r\\n:2\\r\\n` и дальше в сокете пока тишина. Что верно?"""
options.ru = ["Вернуть `Array([1, 2])` и забыть про третий элемент", "Вернуть Ok(None) и оставить все байты в буфере: массив ждёт третий элемент", "Вернуть Ok(None), но убрать из буфера первые два числа, они уже разобраны", "Вернуть ошибку: массив заявил три элемента, а передал два"]
answer = [1]
explain.ru = """Данные могут просто прийти позже, это не ошибка. Разобранные элементы убирать нельзя: когда третий элемент придёт, разбирать массив придётся с заголовка, и его уже не будет. Поэтому либо парсер хранит состояние между вызовами (сложнее), либо, как в этой главе, перечитывает неполный кадр с начала при каждой попытке (проще, а для коротких кадров цена ничтожна)."""
hint.ru = """Что произойдёт при следующем вызове, если заголовок массива уже выброшен?"""

[[exercises]]
name = "resp8"
style = "fix"
hint.ru = ["""Найди в парсере все места, где данные превращаются в числа, срезы и индексы. Каждое из них должно уметь сообщить, что что-то не так.""", """`parse().unwrap()` замени на `map_err` в нужный вариант `ProtoError`. Отрицательную длину, кроме `-1`, не приводи к `usize` через `as`: используй проверяемое преобразование. Проверь байты CRLF после тела: если они уже есть и неправильные, это `MissingCrlf`, а если их ещё нет, это нехватка данных."""]
why.ru = """Всё, что приходит из сети, это недоверенный ввод. Единственный `unwrap()` на числе из заголовка превращает неверный байт любого клиента в аварию всего сервера (а для клиента Redis, в аварию всего сервиса). Чаще всего ловят отрицательную длину, превращённую `as usize` в гигантское число, и срезы с началом правее конца. Нехватка данных и неверные данные разные исходы: первое ждёт, второе закрывает соединение. Поэтому `MissingCrlf` проверяется сразу, как только известны неправильные байты, и не ждёт мифических следующих."""

[[exercises]]
name = "resp_q4"
kind = "question"
question.ru = """Парсер вернул `Err(ProtoError::BadLength)` на соединении с сервером Redis. Что должен сделать клиент?"""
options.ru = ["Подождать ещё данных и попробовать разобрать снова с того же места", "Пропустить байты до ближайшего CRLF и продолжить: так потеряется только один ответ", "Закрыть соединение и открыть новое: границы кадров потеряны, дальше всё, что придёт, читать нельзя", "Повторить команду на этом же соединении"]
answer = [2]
explain.ru = """После ошибки протокола клиент не знает, где начинается следующий кадр. Любая попытка «пересинхронизироваться» (искать CRLF, пропускать байты) может принять за границу байты из середины значения, и дальше клиент будет раздавать ответы не тем командам. Единственное безопасное решение: закрыть это соединение, выбросить буфер и подключиться заново."""
hint.ru = """Что известно о границах кадров после ошибки в заголовке?"""

[[exercises]]
name = "resp9"
style = "todo"
hint.ru = ["""Предел должен срабатывать там, где число впервые стало известно. Где это место для bulk, для массива и для вложенности?""", """Для bulk и массива проверка стоит сразу после чтения числа из заголовка, до всякой работы с телом и элементами. Глубину передавай параметром в рекурсию: верхний массив имеет глубину 0, и массив, который открывается на глубине `max_depth`, уже лишний."""]
why.ru = """Ограничения нужны там, где решение принимается ещё до получения данных. Парсер, проверяющий размер после чтения тела, уже заплатил памятью: и под тело, и под ожидание. Отдельный предел глубины защищает стек: рекурсия по вложенным массивам без него падает от одной сетевой строки длиной в мегабайт. Пределы подбирают по реальным данным (самый большой допустимый ключ или значение) и выносят в настройки, а не зашивают."""

[[exercises]]
name = "resp_q5"
kind = "question"
question.ru = """Парсер при виде `$4294967296\\r\\n` делает `Vec::with_capacity(len)` ещё до чтения тела и ждёт тело. Предела размера нет. Что в этом плохого для сервиса, который читает ответы Redis?"""
options.ru = ["Ничего страшного: память выделяется лениво, пока в неё не запишут", "Один заголовок в тринадцать байтов заставляет сервис просить четыре гигабайта: при нескольких соединениях память кончается", "Парсер вернёт ошибку, потому что len не помещается в u32", "Заголовок будет прочитан неверно и приведёт к рассинхронизации"]
answer = [1]
explain.ru = """Лень операционной системы тут не спасает, а `Vec::with_capacity` на таких размерах чаще просто падает с ошибкой выделения (процесс аварийно завершается). Даже если нет, любой, кто умеет отправить тринадцать байтов, управляет твоей памятью. Предел проверяют по заголовку и, как правило, держат в настройках: хватит максимального размера, который твоё приложение вообще хранит."""
hint.ru = """Кто выбирает число в заголовке и сколько оно стоит отправителю?"""

[[exercises]]
name = "resp_codec"
style = "scratch"
quiz = true
hint.ru = ["""Ты уже написал все части в прошлых задачах. Новое здесь только `encode` (с отказом без частичной записи) и `decode_eof`.""", """`encode`: сначала собери байты значения в отдельный `Vec`, и только если вся рекурсия прошла без ошибки, допиши его в `dst`. `decode_eof`: пустой буфер и нет кадра это Ok(None), непустой и нет кадра это `Truncated`.""", """`decode`: чистая функция `parse_at(buf, pos, depth, limits)` возвращает значение и позицию конца, а `advance` вызывается снаружи один раз. Пределы проверяются сразу после чтения числа из заголовка."""]
why.ru = """Кодек это место, где сходятся все ошибки, о которых говорила глава: длина в байтах, а не в символах, CRLF внутри значения, неполные кадры, неверные заголовки, пределы по заголовку, закрытие соединения посреди кадра. Тест со случайными деревьями и случайными разрезами ловит то, что не придёт в голову проверять руками: кадр, оборванный ровно между CR и LF, пустой массив внутри массива, значение из одних переводов строки. Отказ без частичной записи в `encode` нужен, потому что буфер потом уходит в сокет целиком: половина команды там хуже, чем никакой."""

[[exercises]]
name = "resp_q6"
kind = "question"
question.ru = """Соединение закрылось, и в буфере остались байты `*2\\r\\n$3\\r\\nGET\\r\\n`. Что должен вернуть `decode_eof`?"""
options.ru = ["Ok(None): данных на кадр нет", "Ok(Some(...)) с массивом из одного элемента GET", "Err(Truncated): сервер оборвал ответ на полуслове, и об этом надо знать", "Err(MissingCrlf)"]
answer = [2]
explain.ru = """Без `decode_eof` клиент увидел бы Ok(None) и решил, что просто ждёт данных, которых уже не будет: вызывающий код повис бы или тихо потерял команду. Закрытие посреди кадра отличается от закрытия между кадрами: в первом случае ответ потерян, и это надо превратить в ошибку."""
hint.ru = """Придут ли ещё байты после закрытия соединения? Что тогда значит Ok(None)?"""
