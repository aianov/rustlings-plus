<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Отмена запроса: клиент ушёл, а сервер работает</title>
<style>
:root { --bg:#f6f7f9; --panel:#fff; --text:#1d2330; --muted:#6a7385; --line:#d9dde5; --accent:#2563eb; --g1:#e8f6ec; --g2:#fff4cc; --g3:#fde8e8; --g4:#e6e9fb; --bad:#b42318; }
@media (prefers-color-scheme: dark) { :root { --bg:#14171d; --panel:#1c212b; --text:#e6e9f0; --muted:#98a2b5; --line:#323a49; --accent:#6ea0ff; --g1:#1c3326; --g2:#4a3f12; --g3:#3b2024; --g4:#262c52; --bad:#ff8a80; } }
* { box-sizing:border-box; }
body { margin:0; padding:20px; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
main { max-width:960px; margin:0 auto; }
h1 { font-size:20px; margin:0 0 4px; } p.lead { color:var(--muted); margin:0 0 16px; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:14px; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; } @media (max-width:760px) { .grid { grid-template-columns:1fr; } }
h3 { margin:0 0 8px; font-size:14px; color:var(--muted); }
table { border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums; }
th,td { text-align:left; padding:5px 8px; border-bottom:1px solid var(--line); font-size:14px; }
th { color:var(--muted); font-weight:600; font-size:13px; }
tr.a1 td { background:var(--g1); } tr.a2 td { background:var(--g3); }
pre { margin:0; font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace; white-space:pre-wrap; }
.note { min-height:3.6em; } .note b { color:var(--accent); } .note b.bad { color:var(--bad); }
.controls { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
button,select { font:inherit; padding:6px 14px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--text); cursor:pointer; }
button.primary { background:var(--accent); border-color:var(--accent); color:#fff; } button:disabled { opacity:.45; cursor:default; }
.counter { color:var(--muted); margin-left:auto; }
</style>
</head>
<body>
<main>
  <h1>Отмена запроса</h1>
  <p class="lead">Три слоя: код клиента, соединение пула и сервер. Смотри, кто узнаёт об отмене и когда запрос действительно останавливается.</p>
  <div class="card controls">
    <select id="mode"><option value="drop">Клиент бросил future (timeout)</option><option value="stmt">statement_timeout на сервере</option><option value="set">SET без LOCAL: лимит утёк</option></select>
    <button id="step" class="primary">Шаг</button><button id="play">Играть</button><button id="reset">Сброс</button>
    <span class="counter" id="counter"></span>
  </div>
  <div class="card grid">
    <div><h3>что происходит</h3><pre id="log"></pre></div>
    <div><h3 id="thead">состояние</h3><table id="tbl"></table></div>
  </div>
  <div class="card note" id="note"></div>
</main>
<script>
(function () {
  var SC = {"drop": {"name": "Клиент бросил future (timeout)", "table": "три слоя", "head": ["слой", "состояние"], "start": {"note": "Запрос <code>SELECT pg_sleep(30)</code> уже ушёл на сервер, клиент ждёт ответа под <code>tokio::time::timeout(1с)</code>.", "rows": [["код клиента", "ждёт ответ"], ["соединение пула", "занято запросом"], ["сервер", "выполняет запрос"]]}, "steps": [{"ev": "проходит 1 секунда", "note": "Сработал <b>Elapsed</b>. Future запроса выброшен, обработчик идёт дальше и отвечает клиенту ошибкой.", "rows": [["код клиента", "свободен, ответил 504"], ["соединение пула", "занято запросом"], ["сервер", "выполняет запрос"]], "hl": [0], "bad": []}, {"ev": "сервер ничего не знает", "note": "Серверу никто не сказал, что ответ не нужен. Он продолжает считать, а соединение в пуле не свободно.", "rows": [["код клиента", "свободен"], ["соединение пула", "занято чужим запросом"], ["сервер", "выполняет запрос (ещё 29 секунд)"]], "hl": [], "bad": [1, 2]}, {"ev": "следующий обработчик берёт это соединение", "note": "Новый запрос на этом соединении вынужден <b class=\"bad\">ждать хвост</b> старого. Очередь за соединением растёт, хотя клиент давно ушёл.", "rows": [["код клиента", "новый запрос ждёт"], ["соединение пула", "дочитывает старый ответ"], ["сервер", "всё ещё считает"]], "hl": [], "bad": [0, 1, 2]}]}, "stmt": {"name": "statement_timeout на сервере", "table": "три слоя", "head": ["слой", "состояние"], "start": {"note": "Тот же запрос, но транзакция начата с <code>SET LOCAL statement_timeout = 1000</code>.", "rows": [["код клиента", "ждёт ответ"], ["соединение пула", "транзакция"], ["сервер", "выполняет запрос"]]}, "steps": [{"ev": "проходит 1 секунда", "note": "Сервер сам останавливает запрос и отвечает ошибкой <b>57014</b> (query_canceled).", "rows": [["код клиента", "получил ошибку 57014"], ["соединение пула", "транзакция прервана"], ["сервер", "запрос остановлен"]], "hl": [2], "bad": []}, {"ev": "клиент: rollback, соединение в пул", "note": "Транзакция откатывается, значение <code>statement_timeout</code> исчезает вместе с ней. Соединение вернулось <b>свободным и чистым</b>.", "rows": [["код клиента", "ответил 503"], ["соединение пула", "свободно, лимита нет"], ["сервер", "простаивает"]], "hl": [1], "bad": []}]}, "set": {"name": "SET без LOCAL: лимит утёк", "table": "соединение пула", "head": ["момент", "statement_timeout"], "start": {"note": "Обработчик выполнил <code>SET statement_timeout = 2000</code> без LOCAL и вернул соединение в пул.", "rows": [["обработчик A закончил", "2s"], ["следующий взял соединение", "?"]]}, "steps": [{"ev": "обработчик B берёт то же соединение", "note": "У B другая работа (ночной отчёт на 30 секунд), но на соединении всё ещё висит чужой лимит.", "rows": [["обработчик A закончил", "2s"], ["следующий взял соединение", "2s"]], "hl": [], "bad": [1]}, {"ev": "отчёт B идёт дольше 2 секунд", "note": "<b class=\"bad\">Отчёт убит</b> ошибкой 57014, хотя B никаких лимитов не ставил. Баг проявляется только когда B случайно получил «то самое» соединение.", "rows": [["обработчик A закончил", "2s"], ["следующий взял соединение", "2s: отчёт остановлен"]], "hl": [], "bad": [1]}]}};
  var $ = function (id) { return document.getElementById(id); };
  var i = 0, timer = null, total = 0;
  function stop() { if (timer) { clearInterval(timer); timer = null; } $('play').textContent = 'Играть'; }
  function render() {
    var sc = SC[$('mode').value]; total = sc.steps.length;
    var log = [];
    for (var k = 0; k < i; k++) log.push((k === i - 1 ? '> ' : '  ') + sc.steps[k].ev);
    $('log').textContent = log.join('\n') || '(пока ничего)';
    var st = i > 0 ? sc.steps[i - 1] : sc.start;
    $('thead').textContent = sc.table;
    $('tbl').innerHTML = '<tr>' + sc.head.map(function (h) { return '<th>' + h + '</th>'; }).join('') + '</tr>' + st.rows.map(function (r, idx) {
      var cls = (st.hl || []).indexOf(idx) >= 0 ? 'a1' : ((st.bad || []).indexOf(idx) >= 0 ? 'a2' : '');
      return '<tr class="' + cls + '">' + r.map(function (c) { return '<td>' + c + '</td>'; }).join('') + '</tr>';
    }).join('');
    $('note').innerHTML = st.note;
    $('counter').textContent = 'шаг ' + i + ' из ' + total;
    $('step').disabled = i >= total;
    if (i >= total) stop();
  }
  function reset() { stop(); i = 0; render(); }
  $('step').onclick = function () { if (i < total) { i++; render(); } };
  $('reset').onclick = reset; $('mode').onchange = reset;
  $('play').onclick = function () {
    if (timer) { stop(); return; }
    if (i >= total) i = 0;
    $('play').textContent = 'Пауза';
    timer = setInterval(function () { if (i >= total) { stop(); return; } i++; render(); }, 1400);
    i++; render();
  };
  reset();
})();
</script>
</body>
</html>
