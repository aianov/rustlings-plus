<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Пул под нагрузкой: ожидание и самозапирание</title>
<style>
:root { --bg:#f6f7f9; --panel:#fff; --text:#1d2330; --muted:#6a7385; --line:#d9dde5; --accent:#2563eb; --g1:#e8f6ec; --g2:#fff4cc; --g3:#fde8e8; --g4:#e6e9fb; --bad:#b42318; }
@media (prefers-color-scheme: dark) { :root { --bg:#14171d; --panel:#1c212b; --text:#e6e9f0; --muted:#98a2b5; --line:#323a49; --accent:#6ea0ff; --g1:#1c3326; --g2:#4a3f12; --g3:#3b2024; --g4:#262c52; --bad:#ff8a80; } }
* { box-sizing:border-box; }
body { margin:0; padding:20px; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
main { max-width:960px; margin:0 auto; }
h1 { font-size:20px; margin:0 0 4px; } p.lead { color:var(--muted); margin:0 0 16px; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:14px; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; } @media (max-width:760px) { .grid { grid-template-columns:1fr; } }
h3 { margin:0 0 8px; font-size:14px; color:var(--muted); }
table { border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums; }
th,td { text-align:left; padding:5px 8px; border-bottom:1px solid var(--line); font-size:14px; }
th { color:var(--muted); font-weight:600; font-size:13px; }
tr.a1 td { background:var(--g1); } tr.a2 td { background:var(--g3); }
pre { margin:0; font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace; white-space:pre-wrap; }
.note { min-height:3.6em; } .note b { color:var(--accent); } .note b.bad { color:var(--bad); }
.controls { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
button,select { font:inherit; padding:6px 14px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--text); cursor:pointer; }
button.primary { background:var(--accent); border-color:var(--accent); color:#fff; } button:disabled { opacity:.45; cursor:default; }
.counter { color:var(--muted); margin-left:auto; }
</style>
</head>
<body>
<main>
  <h1>Пул соединений под нагрузкой</h1>
  <p class="lead">Пул из двух соединений. Смотри, как задачи ждут очередь и как обработчик с транзакцией может запереть пул сам на себя.</p>
  <div class="card controls">
    <select id="mode"><option value="wait">Четыре задачи на двух соединениях</option><option value="self_lock">Транзакция просит второе соединение</option><option value="fixed">Вложенный вызов получает транзакцию</option></select>
    <button id="step" class="primary">Шаг</button><button id="play">Играть</button><button id="reset">Сброс</button>
    <span class="counter" id="counter"></span>
  </div>
  <div class="card grid">
    <div><h3>что происходит</h3><pre id="log"></pre></div>
    <div><h3 id="thead">состояние</h3><table id="tbl"></table></div>
  </div>
  <div class="card note" id="note"></div>
</main>
<script>
(function () {
  var SC = {"wait": {"name": "Четыре задачи на двух соединениях", "table": "пул на 2 соединения", "head": ["место", "кто"], "start": {"note": "Пул открыл два соединения, оба свободны. Приходят четыре короткие задачи.", "rows": [["соединение 1", "свободно"], ["соединение 2", "свободно"], ["очередь", "пусто"]]}, "steps": [{"ev": "задачи A и B берут соединения", "note": "A и B получили соединения сразу. Это обычная работа пула.", "rows": [["соединение 1", "A: SELECT"], ["соединение 2", "B: SELECT"], ["очередь", "пусто"]], "hl": [0, 1], "bad": []}, {"ev": "приходят C и D", "note": "Свободных соединений нет, C и D встают в очередь. Пока всё хорошо: A и B скоро закончат, и очередь двинется.", "rows": [["соединение 1", "A: SELECT"], ["соединение 2", "B: SELECT"], ["очередь", "C, D ждут"]], "hl": [], "bad": [2]}, {"ev": "A и B закончили", "note": "Соединения вернулись в пул и сразу достались C и D. Ожидание конечно, потому что держащие соединения <b>не ждут</b> других соединений.", "rows": [["соединение 1", "C: SELECT"], ["соединение 2", "D: SELECT"], ["очередь", "пусто"]], "hl": [0, 1], "bad": []}]}, "self_lock": {"name": "Транзакция просит второе соединение", "table": "пул на 2 соединения", "head": ["место", "кто"], "start": {"note": "Те же два соединения. Теперь каждый из двух обработчиков открывает транзакцию, а внутри вызывает функцию, которая берёт соединение у пула.", "rows": [["соединение 1", "свободно"], ["соединение 2", "свободно"], ["очередь", "пусто"]]}, "steps": [{"ev": "A и B: pool.begin()", "note": "Оба обработчика взяли по соединению под транзакцию. Свободных нет.", "rows": [["соединение 1", "A: BEGIN"], ["соединение 2", "B: BEGIN"], ["очередь", "пусто"]], "hl": [0, 1], "bad": []}, {"ev": "A и B: репозиторий просит соединение", "note": "Вложенный вызов обоих обработчиков идёт в очередь за свободным соединением. Но свободное появится только после commit, а commit будет после вложенного вызова.", "rows": [["соединение 1", "A: BEGIN (ждёт вложенный вызов)"], ["соединение 2", "B: BEGIN (ждёт вложенный вызов)"], ["очередь", "A.вложенный, B.вложенный"]], "hl": [], "bad": [0, 1, 2]}, {"ev": "через acquire_timeout", "note": "<b class=\"bad\">Тупик.</b> Выходит только по таймауту: вложенные вызовы падают с <b>PoolTimedOut</b>, транзакции откатываются. База всё это время простаивает.", "rows": [["соединение 1", "A: откат"], ["соединение 2", "B: откат"], ["очередь", "PoolTimedOut"]], "hl": [], "bad": [2]}]}, "fixed": {"name": "Вложенный вызов получает транзакцию", "table": "пул на 2 соединения", "head": ["место", "кто"], "start": {"note": "Те же два обработчика, но репозиторий принимает не пул, а соединение транзакции.", "rows": [["соединение 1", "свободно"], ["соединение 2", "свободно"], ["очередь", "пусто"]]}, "steps": [{"ev": "A и B: pool.begin()", "note": "Каждый обработчик занял по соединению.", "rows": [["соединение 1", "A: BEGIN"], ["соединение 2", "B: BEGIN"], ["очередь", "пусто"]], "hl": [0, 1], "bad": []}, {"ev": "вызов репозитория с &mut tx", "note": "Репозиторий работает на уже занятом соединении. Новых соединений не нужно, очереди нет.", "rows": [["соединение 1", "A: запросы репозитория"], ["соединение 2", "B: запросы репозитория"], ["очередь", "пусто"]], "hl": [0, 1], "bad": []}, {"ev": "A и B: commit", "note": "Соединения возвращаются в пул. Сколько бы обработчиков ни пришло, каждый держит ровно <b>одно</b> соединение.", "rows": [["соединение 1", "свободно"], ["соединение 2", "свободно"], ["очередь", "пусто"]], "hl": [], "bad": []}]}};
  var $ = function (id) { return document.getElementById(id); };
  var i = 0, timer = null, total = 0;
  function stop() { if (timer) { clearInterval(timer); timer = null; } $('play').textContent = 'Играть'; }
  function render() {
    var sc = SC[$('mode').value]; total = sc.steps.length;
    var log = [];
    for (var k = 0; k < i; k++) log.push((k === i - 1 ? '> ' : '  ') + sc.steps[k].ev);
    $('log').textContent = log.join('\n') || '(пока ничего)';
    var st = i > 0 ? sc.steps[i - 1] : sc.start;
    $('thead').textContent = sc.table;
    $('tbl').innerHTML = '<tr>' + sc.head.map(function (h) { return '<th>' + h + '</th>'; }).join('') + '</tr>' + st.rows.map(function (r, idx) {
      var cls = (st.hl || []).indexOf(idx) >= 0 ? 'a1' : ((st.bad || []).indexOf(idx) >= 0 ? 'a2' : '');
      return '<tr class="' + cls + '">' + r.map(function (c) { return '<td>' + c + '</td>'; }).join('') + '</tr>';
    }).join('');
    $('note').innerHTML = st.note;
    $('counter').textContent = 'шаг ' + i + ' из ' + total;
    $('step').disabled = i >= total;
    if (i >= total) stop();
  }
  function reset() { stop(); i = 0; render(); }
  $('step').onclick = function () { if (i < total) { i++; render(); } };
  $('reset').onclick = reset; $('mode').onchange = reset;
  $('play').onclick = function () {
    if (timer) { stop(); return; }
    if (i >= total) i = 0;
    $('play').textContent = 'Пауза';
    timer = setInterval(function () { if (i >= total) { stop(); return; } i++; render(); }, 1400);
    i++; render();
  };
  reset();
})();
</script>
</body>
</html>
