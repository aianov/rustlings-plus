test_command = ["cargo", "make", "check"]
requires = ["postgres", "nats"]
hint.ru = [
"""Повтор транзакции: цикл, в котором каждый заход открывает новую транзакцию, ставит
`SELECT set_config('statement_timeout', $1, true)` и вызывает работу. Код ошибки 40001 или 40P01 значит «повтори»,
остальное возвращается сразу.""",
"""Теги одной командой: `INSERT ... SELECT $1, t.position, t.tag FROM unnest($2::int[], $3::text[]) AS t(position, tag)`.
Гидрация без N+1: один запрос постов, один тегов `WHERE post = ANY($1)`, один ссылок, сборка в HashMap.""",
"""QueryBuilder: значения только через `push_bind`, а куски SQL только из констант. Сортировку выбирай из enum, который
сам кладёт готовую строку `ORDER BY`.""",
"""Выгрузка: `query_as(...).fetch(&pool)` даёт поток строк; копи пачку, собирай её и отправляй в канал. Шлюз переводит
gRPC-поток в `Response::streaming`.""",
]
story.ru = """Сервис постов говорит с Postgres как взрослый: конфликты транзакций повторяются, медленные запросы
обрываются, теги пишутся одной командой, лента собирается без N+1, посты ищутся по любым фильтрам, а все свои посты
можно выгрузить одним потоком."""
