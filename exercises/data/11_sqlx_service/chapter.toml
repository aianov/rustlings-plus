[chapter]
title.en = "sqlx in a service"
title.ru = "sqlx в сервисе"

[[chapter.visuals]]
file = "visuals/pool_exhaustion.html"
title.ru = "Пул под нагрузкой: ожидание и самозапирание"

[[chapter.visuals]]
file = "visuals/query_cancel.html"
title.ru = "Отмена запроса: клиент ушёл, а сервер работает"

[[exercises]]
name = "sqlr1"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Два UPDATE на пуле это две отдельные транзакции. Если второй ничего не изменил, первый уже зафиксирован и откатить его нечем.""", """Открой транзакцию через `pool.begin()` и выполняй оба запроса на `&mut *tx`. Если по `rows_affected()` понятно, что перевод не состоялся, сделай `tx.rollback().await?` и верни `Ok(false)`."""]
why.ru = """Пока нет транзакции, каждая команда фиксируется сама, и между списанием и зачислением можно потерять карму: получателя не нашли, а отправитель уже обеднел. С `pool.begin()` обе команды идут в одном соединении и фиксируются вместе. Отказ по `rows_affected() == 0` это не ошибка базы, поэтому `?` тут не сработает: откат надо сделать явно (или просто выйти, не вызывая commit, но явный rollback читается лучше). Условие `karma >= $1` в самом UPDATE закрывает ещё и гонку двух одновременных переводов."""

[[exercises]]
name = "sqlr2"
style = "fix"
requires = ["postgres"]
hint.ru = ["""Запись в audit сделана, но кто-то её не зафиксировал. Посмотри, при каком условии вообще вызывается commit.""", """Транзакция без commit откатывается целиком, и вместе с пропущенными никами пропадает строка журнала. Фиксировать нужно всегда, а не только когда что-то добавилось."""]
why.ru = """Откат при уничтожении транзакции происходит молча: ни ошибки, ни предупреждения. Поэтому «commit на одной из веток» самая коварная форма забытого commit, она проходит все тесты на счастливом пути и ломается только на повторном вызове. Правило простое: у функции с `begin` должен быть ровно один путь к `commit`, и он не зависит от результата работы. Если фиксировать нечего, лучше решить это явно (`rollback`), а не случайно."""

[[exercises]]
name = "sqlr3"
style = "todo"
requires = ["postgres"]
hint.ru = ["""`Acquire` умеет два действия: `acquire()` даёт соединение, `begin()` даёт транзакцию. Какое из них нужно, чтобы партия была атомарной?""", """Вызови `db.begin().await?`. На пуле это новая транзакция, на соединении внутри транзакции это точка сохранения, и ошибка откатит только её. `like_post` принимает `&mut PgConnection`, а транзакция разыменовывается в него."""]
why.ru = """Универсальная функция репозитория принимает `impl Acquire`, а не `&PgPool`: тогда её можно вызвать откуда угодно. Но «откуда угодно» значит и «внутри чужой транзакции», и там нужна точка сохранения, иначе одна ошибка отравит всю внешнюю транзакцию. `begin()` из `Acquire` делает правильно в обоих случаях: на пуле открывает транзакцию, а внутри транзакции ставит SAVEPOINT. Просто `acquire()` оставил бы партию неатомарной."""

[[exercises]]
name = "sqlr4"
style = "fix"
requires = ["postgres"]
hint.ru = ["""`impl Executor` отдаётся в `fetch_one` по значению, как `self`. После первого запроса его уже нет.""", """Нужен «заём», а не владение: возьми `&mut PgConnection` и передавай в запросы `&mut *db`. Транзакция и соединение из пула разыменовываются в него, так что тесты останутся прежними."""]
why.ru = """`Executor` реализован для `&PgPool` и `&mut PgConnection`, а не для самих значений, и `fetch_one(db)` забирает его целиком. Для `&PgPool` это сошло бы с рук (ссылка копируется), для `&mut PgConnection` нет, и код с `impl Executor` собирается только до второго запроса. Практическое правило: функция, которой нужно несколько запросов подряд, берёт `&mut PgConnection` (так её можно вызвать и на транзакции), а `impl Acquire` нужен, когда она сама решает, открыть ли транзакцию."""

[[exercises]]
name = "sqlr5"
style = "scratch"
hint.ru = ["""Нужен цикл. Внутри `match op().await`: успех и «чужие» ошибки возвращаются, «повторяемые» ведут на следующий круг.""", """Код ошибки базы достаётся из `sqlx::Error::Database(e)` через `e.code()`, это `Option<Cow<str>>`. Считай попытки отдельным счётчиком и проверяй его в том же условии, что и код: когда попытки кончились, возвращай ошибку как есть."""]
why.ru = """Повтор по коду ошибки это единственное место, где приложение обязано знать про внутренности Postgres. 40001 и 40P01 означают «база сама отказалась, транзакция не применена», поэтому повтор безопасен. Всё остальное повторять нельзя: уникальность, внешний ключ и таймаут от повтора не исчезнут, а нагрузка вырастет. Предел обязателен, иначе два вечно конфликтующих клиента застрянут навсегда. Повторяется целая транзакция (`op` открывает её заново), а не последняя команда."""

[[exercises]]
name = "sqlr6"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Настройки пула задаются в `PgPoolOptions` до `connect`. Для действий над каждым новым соединением есть `after_connect`, он получает `&mut PgConnection`.""", """Замыкание `after_connect` вызывается много раз и должно возвращать `Box::pin(async move { ... })`, поэтому внутрь клонируй владеющие копии строк. А вместо `SET name = $1` (параметры в `SET` не работают) вызывай `SELECT set_config('имя', $1, false)`."""]
why.ru = """Пул это место, где сервис договаривается с базой о нагрузке: сколько соединений он займёт, сколько будет ждать и как его соединения видны администратору (`application_name` в `pg_stat_activity` отвечает на вопрос «кто это нас душит»). Настройки сессии надо ставить в `after_connect`, а не один раз после открытия: пул открывает новые соединения по мере надобности и пересоздаёт старые. `statement_timeout` на уровне пула это страховка от запросов, которые никогда не кончатся; точечные лимиты накладывают поверх (следующие задачи)."""

[[exercises]]
name = "sqlr7"
style = "fix"
requires = ["postgres"]
hint.ru = ["""Транзакция держит единственное соединение пула до самого `commit`. Что делает `ensure_tag(pool, ...)`, пока оно занято?""", """Любой вызов, который должен жить в транзакции, получает её соединение, а не пул. Поменяй тип параметра `ensure_tag` на `&mut PgConnection` и передай туда `&mut tx`."""]
why.ru = """Это классический самозапирающийся пул: транзакция занимает соединение, вложенный вызов просит у пула второе, пул пуст, и оба ждут друг друга. С пулом из десяти соединений и малой нагрузкой это не видно годами, а под нагрузкой десять одновременных публикаций займут все десять соединений, и каждая будет ждать одиннадцатого. Зависание проявляется как `PoolTimedOut`, хотя база здорова. Лекарство одно: всё, что выполняется внутри транзакции, получает её соединение, а не пул."""

[[exercises]]
name = "sqlr_q1"
kind = "question"
question.ru = """Пул рассчитан на 4 соединения, и в сервис одновременно пришли 4 запроса. Каждый обработчик открывает транзакцию (`pool.begin()`), а потом вызывает функцию репозитория, которая берёт соединение сама: `fetch_one(&pool)`. База простаивает, блокировок на строках нет. Что произойдёт?"""
options.ru = ["sqlx заметит цикл ожидания и вернёт ошибку сразу, не дожидаясь таймаута", "Всё отработает: запросов ровно столько, сколько соединений", "Все четыре обработчика зависнут: каждый держит соединение транзакцией и ждёт ещё одно, свободных нет; через `acquire_timeout` они упадут с `PoolTimedOut`", "Транзакции откатятся, а вложенные вызовы выполнятся на освободившихся соединениях"]
answer = [2]
explain.ru = """Транзакция держит своё соединение до `commit`, а вложенный вызов просит у пула ещё одно. Когда четыре обработчика заняли все четыре соединения, пятого нет, и каждый ждёт, пока освободится соединение, которое держит другой ждущий. Это взаимная блокировка на уровне приложения, и база её не видит и не лечит (Postgres сам разрешает только блокировки внутри себя). Спасает только таймаут ожидания, поэтому `acquire_timeout` ставят небольшой. При пяти обработчиках на пул из пяти всё работало бы, поэтому ошибка выстреливает именно под нагрузкой."""
hint.ru = """Сколько соединений занимает один обработчик к моменту вложенного вызова?"""

[[exercises]]
name = "sqlr8"
style = "fix"
requires = ["postgres"]
hint.ru = ["""Где в функции происходит вызов `notify`, внутри транзакции или после неё? Строка, которую изменил UPDATE, заперта до `commit`.""", """Всё, что должно быть атомарным (UPDATE и запись в audit), оставь в транзакции и зафиксируй. Вызов во внешний мир делай уже после `commit`, а его результат не отменяет то, что состоялось."""]
why.ru = """Транзакция держит блокировки до конца, а `await` на чём-то внешнем (HTTP, SMS, очередь) может длиться секунды или вечность. Пока вызов идёт, все, кому нужна эта строка, стоят в очереди, а соединение из пула занято и ничего не делает. Правило: транзакция содержит только работу с базой и заканчивается раньше, чем начинается внешний вызов. Цена правила: если процесс упадёт между `commit` и уведомлением, уведомление потеряется. Для настоящей надёжности используют outbox (запись о задуманном уведомлении в той же транзакции и отдельный отправитель), и эта схема нам ещё встретится."""

[[exercises]]
name = "sqlr9"
style = "todo"
requires = ["postgres"]
hint.ru = ["""В tokio есть `tokio::time::timeout(срок, future)`: он возвращает `Result<T, Elapsed>`. Что надо сделать в каждой из двух веток?""", """`Ok(внутренний результат)` это ответ базы или её ошибка (переведи её в `SearchError::Db`), а `Err(_)` значит, что срок вышел."""]
why.ru = """`timeout` не отменяет запрос, он просто перестаёт его ждать: future выбрасывается, а база продолжает работать над запросом, пока не закончит. Соединение при этом остаётся занятым: следующему, кто его возьмёт, придётся дождаться хвоста. Поэтому клиентский таймаут защищает обработчик, но не базу. Чтобы остановить сам запрос, нужен `statement_timeout`, и эта защита в следующей задаче. Хорошая практика: ставить оба, `statement_timeout` чуть меньше клиентского."""

[[exercises]]
name = "sqlr_q2"
kind = "question"
question.ru = """Обработчик запускает `tokio::time::timeout(Duration::from_secs(1), sqlx::query("SELECT pg_sleep(30)").execute(&pool))`, срабатывает `Elapsed`. Что происходит с запросом на сервере?"""
options.ru = ["Запрос продолжает выполняться до конца, а соединение пула остаётся занятым; следующий запрос на нём подождёт хвост", "sqlx закрывает соединение, и запрос пропадает вместе с ним", "База узнаёт, что клиент ушёл, и сразу прекращает запрос", "Запрос откатывается, соединение сразу возвращается в пул свободным"]
answer = [0]
explain.ru = """`timeout` всего лишь перестаёт ждать future: он выбрасывается, клиентский код идёт дальше. Сервер ничего не знает о том, что клиенту ответ больше не нужен, и честно досчитывает запрос. Соединение к этому времени не свободно: пока ответ не пришёл целиком, следующий запрос на нём должен дождаться конца предыдущего. Поэтому клиентский таймаут экономит время обработчика, но не ресурсы базы. Для настоящей остановки есть `statement_timeout` на стороне сервера (и `pg_cancel_backend` для ручной отмены)."""
hint.ru = """Кто сообщает серверу, что ответ больше не нужен?"""

[[exercises]]
name = "sqlr10"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Лимит ставит параметр сессии `statement_timeout`. Если поставить его обычным способом, он останется на соединении навсегда, а соединение вернётся в пул.""", """Открой транзакцию и поставь лимит так, чтобы он жил до её конца: `SET LOCAL` или `set_config(имя, значение, true)`. Параметры у `SET` не бывают, поэтому второй вариант удобнее, значение передавай текстом. Отмену запроса база сообщает ошибкой с кодом 57014."""]
why.ru = """`statement_timeout` останавливает запрос на самой базе: она бросает его и отвечает ошибкой 57014, а не тратит ресурсы дальше. Область действия важнее значения: `SET` без `LOCAL` меняет сессию, а сессия принадлежит пулу, то есть всем. `set_config(..., true)` действует до конца транзакции и исчезает при commit и при rollback. Заметь ещё `SET statement_timeout = $1`: так не работает, потому что `SET` не принимает параметры, а склеивать значение в SQL строкой мы не хотим даже для числа."""

[[exercises]]
name = "sqlr_q3"
kind = "question"
question.ru = """В обработчике выполнили `sqlx::query("SET statement_timeout = '2s'").execute(&pool)` (одна команда, без транзакции), и больше про это не думали. Что будет дальше?"""
options.ru = ["`SET` вне транзакции не действует, команда игнорируется", "Лимит остался на том соединении, которое получил обработчик, и действует на всех, кто возьмёт его из пула после; а какой именно запрос получит соединение, никто не знает", "Лимит действует только на тот запрос, который шёл следом", "Лимит исчезает, как только соединение вернётся в пул"]
answer = [1]
explain.ru = """`SET` без `LOCAL` меняет параметр сессии, а сессия это соединение, которое принадлежит пулу, а не обработчику. Лимит переживёт возврат в пул, и случайный чужой запрос (например, ночной отчёт) получит двухсекундный предел. Баги такого рода плавают: проявляются на одном соединении из десяти и пропадают при перезапуске. Область действия «до конца транзакции» (`SET LOCAL` или `set_config(..., true)`) решает проблему, потому что значение откатывается вместе с транзакцией."""
hint.ru = """Чьё это соединение после вызова: обработчика или пула?"""

[[exercises]]
name = "sqlr11"
style = "todo"
requires = ["postgres"]
hint.ru = ["""`fetch_all` возвращает `Vec` только когда прочитана вся выдача. Есть метод, который отдаёт строки по одной, по мере прихода.""", """`.fetch(pool)` возвращает поток. Чтобы читать его в цикле, нужен `try_next()` из `TryStreamExt`: `while let Some(строка) = поток.try_next().await? { ... }`. Остановка по `false` это просто `break`."""]
why.ru = """`fetch_all` держит в памяти всю выдачу, а `fetch` отдаёт строки по мере чтения из сокета, и пока потребитель медленный, база сама притормаживает (буферы сокета заполняются). Память остаётся постоянной хоть для миллиона строк. `break` из цикла выбрасывает поток, и sqlx дочитает хвост ответа само, поэтому соединение остаётся годным. Ловушка потока: пока ты его не дочитал или не выбросил, соединение занято, так что внутри цикла не лезь за вторым соединением из того же пула без нужды (см. самозапирание пула)."""

[[exercises]]
name = "sqlr12"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Postgres умеет принимать массив целиком одним параметром, а функция `UNNEST(массив1, массив2)` разворачивает несколько массивов в таблицу из столбцов.""", """`INSERT INTO users (username, karma) SELECT * FROM UNNEST($1::text[], $2::int[])`. Срезы `&[String]` и `&[i32]` передаются в `bind` как есть. Приведения `::text[]` и `::int[]` нужны, чтобы база знала тип массива."""]
why.ru = """Число запросов, а не число строк, определяет скорость импорта: каждый поход в базу это сеть, разбор и фиксация. `UNNEST` с массивами решает это без ограничения на количество параметров (параметров всего два, сколько бы строк ни было), в отличие от `VALUES ($1, $2), ($3, $4), ...`, которому мы сломаем зубы в следующей задаче. Привязка массивов требует приведения типа в SQL (`$1::text[]`), иначе Postgres может не догадаться, чем заполнять параметр. `ON CONFLICT DO NOTHING` работает над массовой вставкой так же, как над одиночной."""

[[exercises]]
name = "sqlr13"
style = "fix"
requires = ["postgres"]
hint.ru = ["""У протокола Postgres число параметров одной команды хранится в 16 битах. Посчитай, сколько параметров у тебя на строку и сколько строк тогда влезает.""", """Режь вход на пачки: `rows.chunks(N)`, где N × число столбцов меньше 65535. Для атомарности все пачки идут в одной транзакции. Пустой вход не должен доходить до `build()`: `INSERT ... ` без значений невалиден."""]
why.ru = """Предел в 65535 параметров принадлежит протоколу, а не sqlx, и обойти его нельзя, только резать. Делить надо не по строкам «на глаз», а исходя из числа столбцов (65535 / 3), и с запасом. Резать надо ещё и потому, что огромная команда долго держит блокировки и память. Пачки в одной транзакции сохраняют атомарность партии. Пустой вход ломает `push_values` (получается SQL без VALUES), поэтому цикл по чанкам решает и эту проблему: у пустого среза нет ни одного чанка. Для самых больших импортов `UNNEST` из прошлой задачи лучше: он не упирается в параметры."""

[[exercises]]
name = "sqlr_q4"
kind = "question"
question.ru = """В таблице `notes` четыре столбца, ты вставляешь пачку через `QueryBuilder::push_values`, и каждая строка связывает все четыре. Сколько строк максимум можно отправить одной командой?"""
options.ru = ["21845", "16383", "65535", "16384"]
answer = [1]
explain.ru = """Предел в 65535 относится к числу параметров команды, а не строк. На строку идёт по четыре, значит 65535 / 4 = 16383 строки с остатком; 16384 уже даёт 65536 параметров и ломается. Практическое правило: делай пачки заметно меньше предела (например, 5000), чтобы команда не раздувалась. Если строк очень много, лучше `UNNEST` с массивами: параметров там столько же, сколько столбцов."""
hint.ru = """Что именно ограничено числом 65535: строки или параметры?"""

[[exercises]]
name = "sqlr14"
style = "fix"
requires = ["postgres"]
hint.ru = ["""Считай запросы: один за постами и по одному на каждый пост за автором. Автор нужен каждому посту, но авторов в ленте всего несколько.""", """Сначала собери из постов список `author_id` (без повторов), потом одним запросом возьми имена: `WHERE id = ANY($1)` с `Vec<i64>`. Собери результат в `HashMap<i64, String>` и подставь имена при сборке ленты. Можно и JOIN, если авторы лежат в той же базе."""]
why.ru = """N+1 это не ошибка, а случайность: на разработческих данных (пять постов) он незаметен, а на ленте из пятидесяти превращается в пятьдесят сетевых походов. Принцип лекарства: сначала список ключей, потом одна выборка по всему списку (`ANY($1)`), потом сборка в памяти по словарю. Этот приём называется гидрацией и работает там, где JOIN невозможен (автор живёт в другом сервисе или другой базе). Проверять надо числом запросов, а не временем: тест считает команды на проводе."""

[[exercises]]
name = "sqlr_q5"
kind = "question"
question.ru = """Лента из 30 постов, их написали 5 разных авторов. Код берёт посты одним запросом, потом для каждого поста отдельным запросом берёт автора, а потом одним запросом `WHERE post_id = ANY($1)` берёт теги всех постов. Сколько запросов ушло в базу?"""
options.ru = ["7", "61", "3", "32"]
answer = [3]
explain.ru = """Авторов запрашивали по одному на пост, а не по одному на автора: 30 запросов. К ним один запрос постов и один запрос тегов, всего 32. Пять разных авторов ничего не спасают, пока код не собрал их список заранее. Хороший вариант: собрать множество `author_id`, взять всех одним запросом и расставить по словарю: тогда всего три запроса, независимо от длины ленты."""
hint.ru = """Сколько раз выполняется запрос внутри цикла по постам?"""

[[exercises]]
name = "sqlr15"
style = "scratch"
requires = ["postgres"]
hint.ru = ["""Начни с `QueryBuilder::new("SELECT ... WHERE TRUE")`: тогда каждое условие дописывается одинаково, как ` AND ...`, и не нужно думать, первое оно или нет.""", """Для каждого пришедшего фильтра: `qb.push(" AND ...")`, затем значение через `qb.push_bind(...)`. Автор и тег лучше проверять через `EXISTS (подзапрос)`: связь многие-ко-многим не размножит строки. В конце `qb.build_query_scalar::<i64>().fetch_all(pool)`."""]
why.ru = """`QueryBuilder` решает ровно одну задачу: кусочки SQL склеиваются текстом, а значения всегда уходят параметрами (`push_bind`), поэтому форма запроса зависит от набора фильтров, а содержимое фильтров в SQL никогда не попадает. `WHERE TRUE` убирает ветвление «первое условие или нет». Теги и авторы проверяются через `EXISTS`, а не через `JOIN`: JOIN по многим тегам размножил бы посты, и пришлось бы добавлять `DISTINCT`. Заметь и проверку на «DROP TABLE» в тесте: она не театр, а прямой способ убедиться, что строка остаётся данными."""

[[exercises]]
name = "sqlr16"
style = "fix"
requires = ["postgres"]
hint.ru = ["""Имя столбца нельзя передать параметром: `ORDER BY $1` сортирует по постоянной строке, то есть никак. Значит, текст придётся вклеивать, и тогда он должен быть только из доверенного набора.""", """Заведи `enum SortKey` с тремя вариантами, функцию разбора `&str -> Option<SortKey>` и метод, который возвращает `&'static str` с именем столбца. Клиентская строка в SQL не попадает никогда, в запрос идёт только то, что вернул метод."""]
why.ru = """Параметры подставляются на место значений, но не имён: `ORDER BY $1` в Postgres означает «сортировать по этой константе», и результат окажется неотсортированным без всякой ошибки. Поэтому имена столбцов вклеиваются текстом, и единственная безопасная схема это белый список: клиентская строка превращается в enum, а в SQL идёт строка из кода. Экранирование кавычек не спасает: имя столбца не строковый литерал. Заодно белый список закрывает утечку: `ORDER BY` по произвольному столбцу выдаёт его содержимое побочным каналом. Порядок при равенстве (`, id ASC`) нужен, чтобы страницы не пересекались."""

[[exercises]]
name = "sqlr_q6"
kind = "question"
question.ru = """Разработчик решил, что параметры защитят и сортировку: `sqlx::query("SELECT id FROM posts ORDER BY $1").bind("likes_count")`. Что получится?"""
options.ru = ["Посты отсортируются по столбцу likes_count, защита от инъекции сработает", "sqlx сам заменит параметр именем столбца, если такой столбец есть", "Запрос выполнится без ошибки, но порядок останется произвольным: сортировка идёт по постоянной строке", "Ошибка синтаксиса: на месте имени столбца параметр недопустим"]
answer = [2]
explain.ru = """Параметр это значение, а не идентификатор. Постоянная строка `'likes_count'` одинакова у всех строк, поэтому сортировка ничего не меняет, и при этом никакой ошибки нет: баг молчит. Имя столбца нельзя передать параметром, его приходится вклеивать текстом, и поэтому оно должно приходить только из белого списка в коде (enum), а не от клиента."""
hint.ru = """Параметр подставляется на место значения или имени?"""

[[exercises]]
name = "sqlr17"
style = "scratch"
requires = ["postgres"]
hint.ru = ["""В шаблоне LIKE три особых символа: `%`, `_` и сам символ экранирования, обратная косая черта. Все три в пользовательском тексте должны стать обычными.""", """Перед каждым из этих трёх символов поставь `\\`. Проходи по символам один раз: если сначала заменять `%`, а потом `\\`, ты заэкранируешь уже добавленные косые черты."""]
why.ru = """Параметр защищает от инъекции, но не от смысла шаблона: для LIKE содержимое параметра это язык. Поэтому текст пользователя надо превратить в шаблон, где все спецсимволы заэкранированы. По умолчанию Postgres экранирует обратной косой чертой, и она сама спецсимвол: без её экранирования запрос, оканчивающийся на `\\`, падает с ошибкой «LIKE pattern must not end with escape character». Проход по символам за один раз надёжнее цепочки `replace`, где порядок замен легко перепутать. Заодно вспомни про цену: `ILIKE '%...%'` всё равно читает всю таблицу, для настоящего поиска нужны индексы (триграммы) или внешний движок."""

[[exercises]]
name = "sqlr18"
style = "todo"
requires = ["postgres"]
hint.ru = ["""Разбери по частям: сначала `TryFrom<PostRow> for Post` (чистая функция без базы), потом запросы. Что делать с неизвестным статусом: молча считать `Published` нельзя.""", """`match row.status.as_str()` с тремя ветками: `"draft"`, `"published"`, остальное ведёт к `Err(RepoError::Corrupt(...))`. Отрицательный счётчик ловится через `u32::try_from(i32)`. В запросах для одной строки `fetch_optional` и `transpose()` превращают `Option<Result<_>>` в `Result<Option<_>>`."""]
why.ru = """Граница между базой и доменом это единственное место, где данные проверяются: внутри домена `PostStatus` уже не может быть чем-то неизвестным. `TryFrom` честно признаёт, что преобразование может не получиться, и отказ ничем не маскируется: молчаливая замена («пусть будет Published») превращает порчу данных в неверное поведение, которое найдёшь через месяц. `PostRow` остаётся приватным для репозитория, наружу выходит только `Post`. Заодно трейт-порт позволяет подменить базу в тестах сервиса. Метод `transpose` нужен на стыке `Option` и `Result`, запомни его."""

[[exercises]]
name = "sqlr19"
style = "scratch"
requires = ["postgres"]
hint.ru = ["""Имя схемы должно быть уникальным и в одном процессе, и между процессами (тесты разных задач идут параллельно): подойдут номер процесса плюс счётчик.""", """Создай схему отдельным соединением. Чтобы search_path получили все соединения пула, передай его в параметрах подключения: `PgConnectOptions::from_str(&url)?.options([("search_path", имя)])` и `PgPoolOptions::new().connect_with(options)`. DDL выполни через `sqlx::raw_sql(ddl)` на пуле. В `drop_schema` сначала закрой пул, потом `DROP SCHEMA ... CASCADE`."""]
why.ru = """Свой помощник для тестовой схемы это маленькая, но обязательная часть любого сервиса с базой: без него тесты мешают друг другу или идут по одному. Решающая деталь это место, где выставлен `search_path`. Команда `SET` действует на одно соединение, а пул открывает новые когда хочет, и тест, который работал на одном соединении, начинает случайно падать под нагрузкой. Параметры подключения применяются к каждому соединению пула. Закрывать пул перед `DROP SCHEMA` нужно, иначе открытые соединения держат блокировки на объектах схемы, и удаление повиснет."""

[[exercises]]
name = "sqlr_post_repo"
kind = "project"
style = "scratch"
quiz = true
requires = ["postgres"]
locked = ["tests/acceptance.rs"]
hint.ru = ["""Начни с `map_error`: 23503 это NotFound, 23514 это Invalid, остальное оборачивай в `Db`. Он понадобится всем методам. Потом `create_with_tags` целиком на `&mut *tx`.""", """Теги: сначала убери повторы (`sort` и `dedup`), потом одна команда `INSERT ... SELECT * FROM UNNEST($1::text[]) ON CONFLICT (name) DO UPDATE ... RETURNING id`, затем вторая команда связывает пост со всеми id через `UNNEST($2::bigint[])`. Лента: страница постов, потом авторы через `ANY($1)`, потом теги через `ANY($1)`, сборка по словарям.""", """Лайк: операция из одной транзакции (вставка лайка, при `rows_affected() == 1` ещё и счётчик), обёрнутая в цикл повтора по 40001 и 40P01 с пределом попыток и маленькой паузой. Саму транзакцию вынеси в отдельный метод, цикл вызывает его заново."""]
why.ru = """Проект собирает вместе всё, что было в главе: одна транзакция на составную операцию без обращений к пулу изнутри, массовая работа с тегами через UNNEST, гидрация ленты без N+1, курсор по паре (время, id), перевод ошибок базы в доменные и повтор транзакции при отказах сериализации. Главная мысль в том, что надёжность сервиса складывается из маленьких решений в репозитории: сервис выше видит только `NotFound` и `AlreadyLiked`, а не `40001`. Ловушки: повтор без предела, повтор на любой ошибке, лента с запросом на каждый пост, тег дважды в одной UNNEST-вставке, счётчик, который расходится с таблицей лайков под нагрузкой."""

